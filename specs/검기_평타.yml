# ═══════════════════════════════════════════════════════════════════
#  명세 — 기계가 읽는 목표 (scripts/vfx_loop.py 가 이 파일 하나로 돈다)
#
#  ★ 이 파일이 하는 일: **무엇을 만들려는가**를 사람이 적고, 루프가 그것을 향해 스스로 값을
#    민다. 여기 안 적힌 키는 루프가 **못 만진다** (울타리는 명세가 친다, 코드가 아니라).
#
#  ★ 여기 적는 것과 못 적는 것 (설계서 「자동 판단의 경계」)
#      적는다   : 보이는가 · 어느 각도에서 · 몇 px · 얼마나 오래 · 레퍼런스와 닮았나
#      못 적는다: 예쁜가 · 세계관 톤에 맞는가 · 맞서 싸울 때 기분이 좋은가
#                 ⇒ 그건 루프가 다 돌고 **사람에게 그림으로** 묻는다 (1차 확인)
# ═══════════════════════════════════════════════════════════════════

스킬: 검기_평타

# 발동 — RCON 으로 칠 명령 한 줄. **한글도 RCON 은 된다** (xdotool 은 한글을 뭉갠다).
#   휘두르지 않고 **지금 값 그대로 한 번 소환**한다 — 공격 쿨다운·좌우 번갈이가 안 끼어든다.
#
# ★ 왜 `execute as kigibot run …` 가 아닌가 (2026-07-20 · 실측):
#   그 형태는 **안 통한다.** 페이퍼는 레거시 Bukkit 명령에 원래 sender 를 그대로 넘긴다 —
#   실측한 껍데기는 `CraftRemoteConsoleCommandSender` 였다. `execute as` 는 바닐라 소스스택의
#   엔티티만 바꿀 뿐 Bukkit sender 는 안 바꾼다. 그래서 「몸이 없다」로 튕긴다.
#   ⇒ 콘솔은 **몸을 이름으로 지목**한다 (맨 끝 인자): `혼천 검기 시험 kigibot`.
#   ※ 이걸 못 보고 지나쳐 루프가 세 회차를 헛돌았다 (발동은 실패했는데 촬영·측정은 멀쩡히
#      돌아 「0px」 를 뱉었다 — 그래서 「검기가 작다」로 읽힐 뻔했다). 명세의 이 한 줄이
#      틀리면 하네스 전체가 조용히 거짓말한다.
발동: "혼천 검기 시험 kigibot"

대상: kigibot      # 카메라가 조준할 엔티티 (검기가 이 몸 둘레에 선다)
카메라: kigicam    # 이 봇의 1인칭이 곧 3인칭 촬영기다 (Xvfb 에서 F5 가 안 먹어서 나온 해법)
무기: minecraft:iron_sword

# 볼 각도 — back/front/side/high 는 카메라 봇이 찍고, first 만 **대상 자신의 눈**을 찍는다
#   (화면을 덮는가는 싸우는 사람의 시점에서만 뜻이 있다)
각도: [back, front, side, high, first]

# ── 루프가 만질 수 있는 손잡이 ────────────────────────────────────
#   여기 없는 키는 채점기가 **권하지도 않는다** (없는 처방을 내지 않게)
조절키:
  - kigi_slash.scale
  - kigi_slash.orbit_radius
  - kigi_slash.blade_pitch_deg

# 손잡이의 울타리 — 루프는 이 밖으로 못 나간다.
#   왜 필요한가: scale 을 무한정 키우면 어떤 기준이든 「충족」시킬 수 있다. 그건 디자인이
#   아니라 숫자 맞추기다. 사람이 미리 「이 안에서 찾아라」를 못 박는다.
범위:
  kigi_slash.scale: [0.4, 8.0]
  kigi_slash.orbit_radius: [0.4, 3.0]
  kigi_slash.blade_pitch_deg: [0, 90]

# ── 반드시 만족해야 하는 것 ───────────────────────────────────────
필수:
  # 가시성 — 각도별 최대 검출 면적(px · 1280x720 · 6m 거리 기준)
  #
  # ★ 이 숫자들은 **짐작이 아니라 실측에서 나왔다** (2026-07-20 · 등록부 값 scale 4.4 로 잰 것):
  #     side 1761px · front 383px · high 495px · back 47px · first 35363px
  #   그래서 「닿을 수 있는 곳에」 못을 박는다. 아무 데나 높이 박으면 루프는 못 닿고
  #   헛돌 뿐이다 (그건 명세가 틀린 것이지 값이 틀린 것이 아니다).
  #
  # ★ back 을 필수에서 뺀 까닭 — 그리고 그것이 **사람에게 넘길 발견**인 까닭:
  #   등 뒤에서는 47px 밖에 안 잡힌다. scale 을 울타리 끝(8.0)까지 올려도 대략 155px 다
  #   (면적 ∝ scale²). 즉 **크기로는 못 푸는 문제**다 — 공전 궤도가 몸에 가려지거나
  #   모로 서기 때문이다. 이건 값 조정이 아니라 **설계 판단**(궤도·기울기를 바꿀 것인가)이라
  #   루프가 혼자 정할 일이 아니다. 관측은 계속 하되(각도 목록에 남긴다) 필수로 걸지 않고,
  #   루프가 끝난 뒤 사람에게 「이게 의도한 것입니까」로 넘긴다.
  가시성:
    side: ">=1200"     # 획이 가장 잘 보이는 각도 — 여기서 안 보이면 어디서도 안 보인다
    front: ">=300"     # 맞는 쪽이 반응할 수 있어야 한다
  # 지속 — 몇 틱 떠 있나 (20틱 = 1초)
  #   너무 짧으면 못 보고, 너무 길면 잔상이 전투를 가린다.
  #   ★ 실측 ~55틱. draw_ticks(12)+fade_ticks(5)=17 보다 훨씬 길다 — 표시 엔티티가
  #     보간·제거까지 무는 시간이 있다. 그 실측을 기준으로 상한을 잡는다.
  지속:
    최소틱: 8
    최대틱: 90

# ── 절대 하면 안 되는 것 ──────────────────────────────────────────
금지:
  # 1인칭에서 화면을 덮으면 실패 — 제 검기에 제 눈이 막히면 싸울 수가 없다.
  #   1280x720 = 921,600px. 60,000px 는 화면의 약 6.5%.
  화면덮음:
    first: "<=60000"

# ── 레퍼런스 (선택) — 있으면 **구조 유사도**로 채점한다 ────────────
#   ★ 픽셀 일치를 요구하지 않는다. 이 레퍼런스는 텍스처 편집기 화면이고 우리 것은 6m 밖에서
#     찍은 인게임 렌더다 — 색도 배율도 자리도 다르다. **같아야 하는 것은 실루엣의 모양뿐**이다.
#   ★ 추출법을 여기 적는 까닭: 색으로 짐작하면 조용히 틀린다. 검기 초록 문턱으로 이 편집기
#     화면을 재면 0px 가 나오는데 그건 「안 닮았다」가 아니라 「엉뚱한 자를 댔다」이다.
레퍼런스:
  파일: 작업물/검기/레퍼런스프레임/image3.png
  마스크: 어두움          # 밝은 체커 바탕 위의 어둡고 붉은 기 도는 획
  자르기: [40, 70, 385, 505]   # 편집기 UI(위 도구줄·오른쪽 패널)를 뺀 캔버스만

# ★ 촬영창 — 효과보다 **길어야** 한다. 짧으면 효과가 촬영 끝까지 남아 지속이 잘리고,
#   그 잘린 숫자를 지속으로 적으면 모르는 것을 아는 척하게 된다 (실측 2.2초에서 바로 겪었다).
#   하네스는 잘림을 감지해 「값이 아니라 측정을 고쳐라」라고 말한다 — 그 말을 안 듣게 넉넉히 둔다.
촬영초: 4.5        # 실측 지속 ~2.7초 + 여유
최소면적: 40       # 이보다 작은 초록 덩어리는 검기로 안 친다 (잡티)
