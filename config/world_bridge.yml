# 세계 다리(世界橋) — 마크(MVT)에서 벌어진 일이 봇의 장부로 흐르고,
# 봇의 세계 상태가 마크의 행동으로 되먹임되는 단 하나의 통로.
#
# 원칙 (등록제): **이 파일에 없는 이벤트는 세계에 존재하지 않는다.**
#   MVT 는 여기 등록된 kind 만 발신하고, 봇은 여기 등록된 kind 만 수신한다.
#   봇이 소문을 어떤 태그·강도·정확도로 낳는지도 코드가 아니라 이 파일이 정한다
#   (수치의 원천은 여전히 rumor.yml · npc_death.yml — 여기는 '어느 칸을 읽을지'의 배선표다).
#
# 몸이 둘이다:
#   MVT (Paper 플러그인, 별도 JVM) — 사건이 벌어지는 곳. 사람이 죽고, 도적을 베고, 격을 터뜨린다.
#   봇  (JDA + SQLite)             — 세계의 장부. 소문·명분·수사·세력·의뢰.
# 봇은 항상 떠 있지 않다. 그러니 다리는 **비동기·내구성 큐**여야 한다 (docs/design/world_bridge.md).

transport:
  mode: jsonl_spool                # 파일 기반 append-only JSONL + 봇의 폴링 (후보 비교는 설계 문서 2장)
  dir: run/bridge                  # 저장소 루트 기준. MVT 는 데이터 폴더에서 거슬러 올라 루트를 찾는다
                                   #   (또는 환경변수 HONCHEON_BRIDGE 로 직접 지정)
  outbox: mvt                      # MVT → 봇: <dir>/mvt/<YYYYMMDD>.jsonl (한 줄 = 한 사건, 추가만)
  snapshot: world_state.json       # 봇 → MVT: <dir>/world_state.json (원자적 교체 — 최신이 이긴다)
  poll_seconds: 5                  # 봇의 수신 주기 (꺼져 있던 동안의 것은 켤 때 전부 따라잡는다)
  snapshot_seconds: 20             # MVT 의 되먹임 갱신 주기
  retain_days: 30                  # 처리 끝난 조각의 보관 기간 (감사·재생용 — 지우는 것은 사람이 한다)
  cursor_key: 다리:커서            # 봇 world_meta 키 — "<파일>:<바이트오프셋>". 여기까지 읽었다

  # ═══ ★ 접합의 두 손 (2026-07-13 개편) — 스냅숏은 20초라 **너무 느리다** ═══
  #
  # 접합은 사람이 **기다리고 있는** 상호작용이다 (디스코드에서 청하고, 게임 화면을 본다).
  # 20초짜리 스냅숏에 실으면 사람은 그 사이에 "안 되는구나" 하고 떠난다. 그래서 **작은 파일 둘**을
  # 따로 둔다 — 둘 다 원자적 교체(temp → move)이고, 둘 다 **상태**다 (재생할 것이 없다).
  #
  #   봇 → MVT : link_requests.json   지금 살아 있는 수락 요청 전부 (누가 누구에게 청했는가)
  #   MVT → 봇 : roster.json          지금 강호에 있는 몸 (mc_name → uuid) + 찍은 시각
  #
  # ★ roster 는 **접속 여부만** 담는다 (좌표도 시트도 아니다). 봇은 이것으로 단 하나를 판정한다:
  #   "그 이름이 지금 마크에 있는가." 없으면 청 자체가 서지 않는다 (사람에게 그 자리에서 말해 준다).
  link_requests: link_requests.json  # 봇 → MVT (대기 중인 수락 요청 — 만료된 것은 실리지 않는다)
  roster: roster.json                # MVT → 봇 (지금 접속해 있는 몸)
  link_poll_seconds: 2               # MVT 가 요청 파일을 보는 주기 (사람이 기다리는 값이다)
  roster_seconds: 5                  # MVT 가 명부를 찍는 주기
  roster_stale_seconds: 30           # 이보다 낡은 명부는 **없는 것으로 친다** (마크 서버가 꺼졌다)

  # ═══ ★ 서장(序章) — **책이 펼쳐져 있고 사람이 기다린다** (2026-07-13 신설) ═══
  #
  # 【왜 스냅숏에 싣지 않는가】 접합과 **똑같은 이유**다 (바로 위 25~40줄). 스냅숏은 20초다.
  #   서장은 사람이 **책을 펴 놓고 글자를 누르며 기다리는** 상호작용이다 — 20초는
  #   "고장났구나" 의 시간이지 "다음 장" 의 시간이 아니다. 그래서 **작은 파일 하나**를 따로 둔다.
  #   원자적 교체(temp → move) · **상태다** (재생할 것이 없다 — 최신이 이긴다).
  #
  #   봇 → MVT : seojang.json      지금 서장 중인 몸들의 **현재 장면 한 장** (글·선택지·토큰)
  #   MVT → 봇 : seojang_choice    **그 손이 글자를 눌렀다** (events 등록부 아래)
  #
  # ★ 봇이 저자이고 마크는 서책이다 — 문장도 선택지도 판정도 **전부 봇이 낸다.**
  #   마크는 **한 문장도 짓지 않는다** (LLM 도 판정 엔진도 시트도 봇에만 있다. 마크는 DB 를 안 연다).
  #   자세한 이유는 config/seojang.yml 머리말.
  seojang: seojang.json              # 봇 → MVT (서장 중인 몸의 현재 장면 — 없으면 빈 목록)
  seojang_poll_seconds: 2            # ★ 사람이 책을 펴 놓고 기다리는 값이다 (접합과 같은 시계)
  # ★ B-118 — 대기소의 문은 「서장이 끝났나」를 이 명단으로 판정한다 (명단에 있다 = 서장 미완 —
  #   붓이 글을 짓는 중이든 책을 읽는 중이든 배가 안 뜬다). 봇은 명단이 비어도 이 파일을 계속
  #   다시 굽는다(위 poll 주기) — at 이 심장 소리다. 그 소리가 이보다 낡으면 봇이 죽은 것이고,
  #   죽은 다리는 사람을 대기소에 가두지 못한다 (antechamber.yml gate.bridge_down 과 같은 원칙).
  seojang_stale_seconds: 60          # 이보다 낡은 서장 명단은 문이 **붙들지 않는다** (무한 대기 금지)
  # 멱등: 모든 이벤트는 id(uuid)를 지고, 봇은 bridge_inbox(PK=event_id)에 먼저 못을 박는다.
  # 커서를 못 쓰고 죽어도 두 번 적용되지 않는다 (재기동 = 재생, 재생 = 무해).

# ─── 봉투 (모든 이벤트 공통) ───
envelope:
  id: "uuid — 멱등 키 (봇의 bridge_inbox PK)"
  kind: "이벤트 종류 — 아래 events 등록부의 키. 미등록이면 봇이 무시하고 로그만 남긴다"
  at: "발신 시각 (epoch millis, 현실 시간)"
  source: "mvt"
  actor: "행위자 — mc_uuid · mc_name (있으면). 봇은 mvt_link 로 캐릭터를 찾는다"
  place: "장소 키 (rumor.yml propagation.origin_network_by_location 의 키 — 발원 소문망의 근거)"
  night: "밤인가 (bool) — 목격·은닉의 배경"
  data: "kind 별 페이로드"

# ─── 신원 접합 (마크 플레이어 ↔ 봇 캐릭터) ───
# 마크의 몸과 봇의 장부는 서로를 모른다. 이 표가 없으면 "누가 죽였는가"가 세계에 남지 않는다.
#
# ═══ ★★ 방향 (2026-07-13 전면 개편) — **디스코드가 청하고, 그 몸이 수락한다** ═══
#
# 【옛 길】 마크가 6자 코드를 내고 → 사람이 그것을 외우거나 복사해서 → 디스코드에 붙여넣었다.
#   자물쇠는 튼튼했다 (코드는 그 몸의 주인 화면에만 떴다). 그러나 **사람이 코드를 날랐다.**
#   창을 바꾸고, 붙여넣고, 그러다 만료되고. 사용자의 판정: *"코드 복사는 없어져도 된다."*
#
# 【새 길 — 두 손】 코드를 없애도 **두 신원**은 그대로 필요하다. 그래서 손을 둘로 나눈다:
#
#   ① 디스코드에서 청한다   /혼천 접속 닉네임:<마크 닉>   ← **디스코드가 서명한 신원** (위조 불가)
#   ② 그 몸이 게임에서 수락 [잇는다] 를 그 몸의 손이 누른다  ← **그 몸을 실제로 조종하는 자** (위조 불가)
#
#   ★ **닉네임은 열쇠가 아니다.** 아무나 남의 닉을 댈 수 있다 — 그리고 그래도 된다.
#     청은 **그 몸의 화면**으로 가고, 그 몸의 주인이 [아니다] 를 누르면 끝이다.
#     닉네임은 *누구에게 물어볼지*를 정할 뿐, 아무것도 열지 않는다.
#
#   ★ 왜 이것이 옛 자물쇠와 **같은 급**인가 — 훔치려면 둘 중 하나가 있어야 한다:
#       그 사람의 **디스코드 계정** (① 을 위조하려면) 또는 그 사람의 **마크 계정** (② 를 위조하려면).
#     둘 다 없으면 아무것도 못 한다. 코드 시절과 똑같이 **두 신원**이 필요하다.
#     (오히려 나아졌다: 코드는 어깨너머로 새는 문자열이었지만, 수락은 **새지 않는다.**)
identity:
  table: mvt_link                  # (mc_uuid PK, mc_name, character_id, linked_day) — 마이그레이션 005
  request_table: mvt_link_request  # (token PK, mc_uuid, mc_name, character_id, discord_id, …) — 007
  code_table: mvt_link_code        # ☠ 옛 코드 표 (006) — **더 이상 쓰지 않는다.** 장부는 남긴다 (감사)
  direction: discord_asks_body_accepts   # ← 옛 값: mvt_issues_discord_confirms (코드 방식. 폐기)
  bot_command: "/혼천 접속 닉네임:<마크 닉>"   # 디스코드: 청한다 (여기서는 **아무것도 이어지지 않는다**)
  mc_command: "/혼천 접속"          # 마크: 초대 링크를 준다 (이제 코드를 내지 않는다 — 안내하는 손이다)
  mc_accept_command: "/혼천 수락"    # 마크: [잇는다] 클릭이 이것을 대신 친다 — ★ **여기가 결속의 순간이다**
  mc_reject_command: "/혼천 거절"    # 마크: [아니다] — 청을 그 자리에서 죽인다
  unlink_command: "/혼천 접속해제"   # 스스로 끊는다 (남의 것은 못 끊는다)

  # ★ 토큰 — 사람이 옮겨 적지 않는다. 클릭이 나른다 ([잇는다] = RUN_COMMAND /혼천 수락 <토큰>).
  #   ★★ **토큰은 열쇠가 아니다.** 새어도 소용없다 — 수락은 **요청에 적힌 그 몸(uuid)만** 할 수 있다
  #     (MvtCommand.linkDecide 가 player.getUniqueId() 를 대조한다). 토큰이 하는 일은 *어느 청인가*의 지목뿐.
  token_length: 10
  token_alphabet: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"   # 0·O·1·I 없음 (사람이 눈으로 읽을 수는 있어야 한다)

  ttl_seconds: 120                 # ★ 2분 — 청은 오래 살면 안 된다. 지금 화면 앞에 있는 사람에게 묻는 것이다
  cooldown_seconds: 60             # ★ 연타 방지 — 한 사람에게(그리고 한 사람이) 1분에 한 번만 청할 수 있다
  single_use: true                 # 수락하면 그 청은 죽는다 (state 수락 — 다시 못 쓴다)
  one_pending_per_body: true       # 한 몸에게는 **살아 있는 청이 하나**뿐 (새 청이 오면 옛 청은 폐기)
  one_body_one_character: true     # 몸 하나 = 캐릭터 하나 (양쪽 다 1:1)
  relink: 거부                     # 이미 이어진 몸/캐릭터는 **해제 후에만** 다시 잇는다 (도난 방지)
  online_required: true            # ★ 지금 강호에 없는 이름에는 청할 수 없다 (물어볼 화면이 없다)
  reveal_roster: false             # ★ 누가 접속해 있는지 **알려 주지 않는다** — 없는 이름과 오프라인은 같은 말이다
  on_character_death: 자동_무효     # 죽은 자의 이름으로는 소문이 붙지 않는다 (characterOfMc 가 산 자만 본다)
  merge_on_link: true              # ★ 접합 전의 혈채(mc:<uuid> 원장)는 접합 순간 그 캐릭터로 병합된다
                                   #   (blood_debt.target_tracking.merge — "세계가 한 마리의 짐승을 본다")
  audit: 접합                      # events.type — 접합·접합해제·거절은 전부 장부에 남는다
  fallback: mc_name                # 링크가 없으면 이름만 장부에 적는다 (주체 없는 소문 = 세계의 배경음)

  # ═══ 접합의 문(門) — 외울 것도, 복사할 것도, 붙여넣을 것도 없다 ═══
  #
  # 【사람이 실제로 밟는 순서 — 이제 이것이 전부다】
  #   ① (처음이라면) 마크에서 /혼천 접속 → 채팅에 **[초대 링크]** 하나가 뜬다. 눌러서 디스코드로 들어온다.
  #   ② 디스코드에서 **/혼천 접속 닉네임:<제 마크 닉>** (또는 접합문의 버튼 → 닉네임 한 칸짜리 창)
  #   ③ **마크 화면에 물음이 뜬다** — "디스코드의 「아무개」가 그대라고 한다. 이 몸을 그 이름에 잇겠는가?"
  #   ④ **[잇는다]** 를 누른다 → 이어진다. (누르지 않으면 2분 뒤 청은 죽는다)
  #
  # 【★ 무엇이 도용을 막는가 — 구체적으로】
  #   · 남의 닉을 대는 것은 **막지 않는다.** 막을 필요가 없다 — 청은 **그 몸의 화면**으로 가고,
  #     그 몸의 주인이 [아니다] 를 누르거나 그냥 두면 끝난다. 도둑은 **남의 화면에 물음 하나를 띄웠을 뿐**이다.
  #   · 이어지는 유일한 손은 **[잇는다] 클릭**이고, 그것은 **그 몸에 로그인한 사람**만 누를 수 있다
  #     (MvtCommand 가 player.getUniqueId() 를 요청의 mc_uuid 와 대조한다 — 다른 몸이 누르면 거부).
  #   · 그 청을 낸 신원은 **디스코드가 서명한다** (Interaction.getUser() — 위조 불가).
  #   · 즉 훔치려면 **그 사람의 디스코드 계정**이나 **그 사람의 마크 계정**이 있어야 한다. 코드 시절과 같다.
  #   · 연타는 cooldown_seconds 가 막고, 오래된 청은 ttl_seconds 가 죽인다. 수락은 1회성이다.
  #
  # 【★ 마크가 못 하는 것 — 정직하게 (2026-07-13 재확인)】 마크는 디스코드 **앱**을 직접 열 수 없다.
  #   ★ discord:// 딥링크는 **불가능하다** — 추측이 아니라 확인된 사실이다:
  #     **Java Edition 1.21.5(25w02a)부터 clickEvent.open_url 은 http/https 가 아닌 URI 를 파싱조차 하지 않는다.**
  #     (이 서버는 Paper 1.21.11 — 해당된다.) 그래서 마크가 여는 것은 https 초대 링크뿐이다.
  gate:
    # 접속 채널의 URL 은 **여기 적지 않는다.** 봇이 제가 등록한 채널로부터 만들어
    # world_state.json(feedback.world_state.discord)에 실어 내려보낸다 — 코드도 config 도 id 를 지어내지 않는다.
    url_source: 스냅숏             # feedback.world_state.discord.url ← 봇의 '접합:채널' + '접합:길드'
    channel_meta: 접합:채널        # world_meta — /혼천 접합문 을 친 그 채널
    guild_meta: 접합:길드          # world_meta — 봇이 뜰 때 그 채널이 속한 길드로 채운다

    # ═══ ★ 초대 링크 — 서버에 **아직 안 들어온 사람**의 유일한 길 (2026-07-13 신설) ═══
    #
    # 【왜 생겼나】 사용자가 겪었다: **"디스코드가 공개가 아니기에 별도로 초대를 해서 접속해야 함."**
    #   위의 채널 URL(https://discord.com/channels/<길드>/<채널>)은 **이미 서버 안에 있는 사람**에게만
    #   쓸모가 있다. 밖에 있는 사람이 그것을 누르면 — **아무 데도 못 간다.** 문은 있는데 담이 없었다.
    #
    # 【★ 여기를 채우는 것은 사람이다 — 코드도 담당자도 아니다】
    #   아래 invite_url 은 **비어 있다.** 관리자가 직접 넣어야 한다:
    #     1. 디스코드에서 접속 채널 우클릭 → **「초대 링크 만들기」**
    #     2. **「만료 기한: 없음」 · 「최대 사용 횟수: 무제한」** 으로 고칠 것
    #        (기본값은 7일 뒤 죽는다 — 죽은 초대는 없는 초대만 못하다)
    #     3. 나온 https://discord.gg/XXXXXX 를 아래 따옴표 안에 붙여넣는다
    #
    #   ★ 비어 있으면: 마크는 [초대 링크] 버튼을 **띄우지 않고**(없는 문을 걸지 않는다),
    #     봇은 뜰 때마다 콘솔에 **소리내어 경고한다** (GameListener.onReady).
    #
    #   ★ 스킴: 마크 클라이언트는 http/https 만 연다. 여기에 discord:// 를 적지 마라 — 열리지 않는다.
    #     스킴을 빼고 "discord.gg/XXXX" 로 적어도 된다 (봇이 https:// 를 붙인다).
    invite_url: "https://discord.gg/w6WHTwFrD5"   # ← 관리자가 넣었다 (2026-07-13). 초대는 비밀이 아니다 — 토큰과 다르다

    mc_chat:                       # 마크 채팅 (본인에게만 — 공개 채팅 금지)
      # ── /혼천 접속 — 이제 **코드를 내지 않는다.** 초대를 주고, 어디서 무엇을 칠지 말해 준다 ──
      # ★ 【사용자 실사용 피드백 2026-07-14】 "채팅이 너무 깁니다 — 두 줄이면 됩니다: 링크 하나, 설명 하나."
      #   빈 문장("")은 줄 자체가 안 선다 (LinkGate 가 빈 줄을 건너뛴다). 자세한 절차는 디스코드 안내판이 진다.
      headline: "디스코드 /혼천 접속 에 「{name}」 을 적으면 이 화면에 물음이 뜬다 — [잇는다] 한 번이면 끝."
      step_1: ""
      step_2: ""
      step_3: ""
      why: ""
      # ★ 초대 — 서버 밖에 있는 사람에게. invite_url 이 비어 있으면 이 줄은 아예 안 뜬다
      invite_label: "[초대 링크]"
      invite_hover: "혼천의 디스코드로 들어오는 초대 — 아직 서버에 없다면 여기부터"
      no_invite: "초대 링크가 아직 등록되지 않았다 — 관리자에게 물어라 (config/world_bridge.yml identity.gate.invite_url)"
      app_note: "브라우저가 뜨면 「Discord 앱에서 열기」를 눌러라 — 앱이 깔려 있으면 앱으로 넘어간다."
      already: "이미 {name} 으(로) 이어져 있다 (디스코드 /혼천 접속해제)"

      # ── ★★ 청(請) — 그 몸의 화면에 뜨는 물음. **이 화면이 자물쇠다** ──
      ask_headline: "디스코드의 「{discord}」 가 그대라고 한다."
      ask_body: "이 몸을 그 이름({character})에 잇겠는가?"
      ask_warn: "그대가 청한 것이 아니라면 — [아니다] 를 누르거나 그냥 두어라 ({seconds}초 뒤 저절로 죽는다)."
      accept_label: "[잇는다]"
      accept_hover: "이 몸을 그 이름에 잇는다 — 이제부터 그대의 손이 하는 일은 그 장부에 적힌다"
      reject_label: "[아니다]"
      reject_hover: "청을 물린다 (아무 일도 일어나지 않는다)"
      accepted: "이었다 — 이제 그대는 강호의 {name} 이다."
      rejected: "청을 물렸다."
      not_yours: "그 청은 그대에게 온 것이 아니다."
      expired: "그 청은 이미 죽었다 (2분). 디스코드에서 다시 청하라."
      gone: "그런 청은 없다."

      # 접합 안 한 몸에게 뜨는 잔소리 (SkillListener.nag) — 클릭 = RUN_COMMAND /혼천 접속
      nag_label: "[강호에 이름을 올린다]"
      nag_hover: "누르면 /혼천 접속 이 실행된다 — 디스코드로 가는 길을 알려 준다"
      nag_command: "/혼천 접속"

    # ★ 접합문 — **살렸다.** 다만 창에 넣는 것이 코드가 아니라 **닉네임**이다.
    #   버튼을 없앨 이유가 없다: 명령 문법(/혼천 접속 닉네임:…)을 외우지 않아도 되는 유일한 문이고,
    #   버튼은 아무것도 담지 않는다 (customId "lk:open" — 누가 눌러도 좋다. 자물쇠는 게임 안의 [잇는다] 다).
    discord:                       # 접속 채널에 상시 붙는 문 (/접합문 이 세운다)
      title: "접합의 문 — 마크의 몸을 이 이름에 잇는다"
      body: |
        아래 **「마크의 몸을 잇는다」** 를 누르고, 뜨는 창에 **그대의 마크 닉네임**을 적어라.
        그러면 **그 몸의 게임 화면에** 물음이 뜬다 — 거기서 **[잇는다]** 를 누르면 끝이다.

        **닉네임만으로는 아무것도 이어지지 않는다.** 남의 이름을 대도 소용없다 —
        물음은 *그 몸의 화면*으로 가고, 이을 수 있는 손은 *그 몸에 로그인한 사람*뿐이다.
        (마크에 접속해 있어야 한다. 청은 2분 뒤에 죽는다.)
      button_label: "마크의 몸을 잇는다"
      modal_title: "접합 — 그대의 마크 닉네임"
      modal_field: "마크 닉네임"
      modal_hint: "지금 마크에 접속해 있는 그대의 이름 (예: Lindydone)"
      gate_posted: "이 채널이 **접속의 문**으로 섰다 — 여기서 닉네임을 대면 게임 안으로 물음이 간다."

# ─── 장소 접합 — 마크의 자리(populace.yml places) → 소문망의 장소 키 ───
# 이것이 없으면 산길에서 난 일이 장터의 소문이 된다. 발원망이 곧 그 소문이 처음 도는 곳이다
# (rumor.yml propagation.origin_network_by_location — 여기 없는 자리는 mingan_market 으로 떨어진다).
place_map:
  장터_광장: market
  우물가: market
  좌판_거리: market
  남북대로_북: market
  남북대로_남: market
  동서대로_동: market
  동서대로_서: market
  서쪽_골목: market
  동쪽_골목: market
  남쪽_들: market
  개울_빨래터: market
  전장_앞: market
  표국_마당: market
  관아_앞: market
  객잔_앞: cheongha_inn
  의방_앞: medicine_shop
  의뢰소_앞: request_office
  북문_어귀: north_road          # 북문 밖은 이미 길이다 — 상단망이 먼저 듣는다
  산길_어귀: north_road

# ═══════════════ 이벤트 등록부 ═══════════════
# effects 는 봇이 무엇을 하는지의 선언이다. 코드는 이 표를 읽어서 움직인다.
events:

  npc_death:
    desc: "사람이 죽었다 — 무명(populace) 또는 등록 NPC(cheongha_npcs)"
    payload:
      npc_id: "등록부 키 (populace.yml people.<id> 또는 cheongha_npcs.yml npcs.<key>)"
      npc_name: "이름"
      registry: "populace | cheongha_npcs — 어느 등록부의 사람인가 (연쇄의 깊이가 다르다)"
      job: "생업 (무명일 때)"
      witnesses: "목격자 수 (실제로 센 값 — populace.yml death.witness_radius 반경)"
      body: "즉시_발견 | 유기_지연발견 | 은닉 (npc_death.yml killer_response.variables.body)"
      cause: "노환_병사 | 사고 | 사건_피살 | 자멸_심마 (npc_death.yml npc_types.cause_modifier)"
      killer_uuid: "가해자 (플레이어일 때)"
      killer_name: "가해자 이름 (몹·미상이면 없음)"
    effects:
      # 목격자 수 → npc_death.yml killer_response.rumor_matrix 의 witness 칸 (0 없음 / 1 소수 / 2 다수)
      witness_band: { none: 0, few: 1, many: 2 }
      witness_many_min: 2          # populace.yml death.witness_public_min 과 같은 눈금
      rumor:
        tags: [살인, 괴사, 폭력, 치안]
        # 강도·정확도·지연은 npc_death.yml killer_response.rumor_matrix 가 정한다 (여기서 발명하지 않는다)
        matrix: npc_death.killer_response.rumor_matrix
        subject_is_killer: true    # 목격자가 있으면 소문의 주체는 가해자다 → 세력이 그를 주목한다
        subject_needs_witness: true # 아무도 못 봤으면 이름이 남지 않는다 (은밀형의 보상)
      # ★ 다리는 **사건의 이름**만 나른다 — 얼마나 흔들리는지는 등록부(region_state.yml)가 정한다.
      #   전에는 여기에 "민심: -1" 이라고 **값이** 적혀 있었다. 그래서 지역 사건의 정본이 둘이 됐다.
      region_event:
        populace: 무명_사망            # region_state.yml event_deltas.무명_사망
        cheongha_npcs: 등록_npc_사망   # region_state.yml event_deltas.등록_npc_사망
      succession: registry_only     # 무명에게는 후계도 복수자도 없다 (populace.yml death.revenge: civil_debt)
      mandate: npc_death.succession  # 관(官)을 죽였는가 — 법명분은 그 등록부만이 정한다

  bandit_slain:
    desc: "도적을 베었다 — 토벌 (사람을 죽인 것이지만, 이쪽은 명분이 있는 죽음이다)"
    payload:
      foe_id: "north_road_bandit …"
      foe_name: "표시 이름"
      role: "졸개 | 두목"
      realm: "적의 경지"
      witnesses: "목격자 수"
      killer_uuid: "벤 자"
      killer_name: "벤 자의 이름"
    effects:
      rumor:
        tags: [도적, 치안, 무재]
        intensity_by_role: { 졸개: 1, 두목: 2 }
        accuracy_kind: 직접_목격      # rumor.yml generation.initial_accuracy (90)
        subject_is_killer: true
      # ★ 배역(role)이 **사건의 이름**을 가른다. 값은 등록부가 매긴다 (여기서 곱하지 않는다 —
      #   예전의 scale_by_role 은 값을 여기서 ×2 하던 장치였고, 그것이 곧 두 번째 정본이었다).
      region_event_by_role:
        # ★ 졸개는 **여기서 사건을 내지 않는다.** 시체 하나는 「소탕」이 아니다.
        #   전에는 졸개 하나를 벨 때마다 치안이 올랐고 — **4분이면 치안이 100 이 됐다.**
        #   「부분 소탕」이라는 **이름이 이미 답이었다**: 소탕은 시체가 아니라 **무리가 빈 사실**이다.
        #   그래서 `HuntingGrounds.checkClearance()` 가 **정원이 실제로 0 이 됐을 때** 한 번 낸다
        #   (bandit_camp_cleared · 5 세계일에 한 번).
        두목: 도적_두목_제거          # region_state.yml — 치안 +5 · 민심 +3

  # ★ 무리가 비었다 — 「소탕」의 진짜 사실 (시체 하나가 아니다)
  bandit_camp_cleared:
    desc: "그 산길의 도적 무리가 비었다 — 「부분 소탕」은 시체 하나가 아니라 무리가 빈 사실이다"
    payload: { zone: "구역명", world_day: "세계일" }
    effects: { region_event: 도적_부분_소탕 }

  # ★ 갈호는 죽으면 끝이다. 그러나 **산채는 죽지 않는다** — 누군가가 그 자리를 잇는다.
  #   되살아남이 아니라 **승계**다. 새 두목은 **새 사람**이고, 그를 죽이는 것은 **다른 사실**이다.
  #   (30 세계일 — region_populace.yml death.boss_respawn_days: "채주·장문은 다시 서지 않는다 — 후계가 선다")
  bandit_boss_succeeded:
    desc: "산채가 새 두목을 산길로 내려보냈다 — 갈호는 죽었고 곰치가 그 자리를 이었다"
    payload: { zone: "구역명", predecessor: galho, successor: sochae_budu,
               successor_name: "곰치", world_day: "세계일" }
    effects: { region_event: 도적_두목_승계 }

  raid_resolved:
    desc: "★B-190 — 세계 사건(레이드)의 결말: 대장들의 싸움이 끝났다 (사용자 확정 2026-07-31 —
      제5막 승패는 정본이 아니라 인게임 레이드가 정한다). ★무대(보스 스폰·페이즈)는 별도 청구서 —
      통로가 먼저 선다. MVT 쪽 발신 지점이 서면 이 kind 로 쏜다"
    payload: { act: "막 id (예: magyo_chimgong)", beat: "박 key (예: daejeon_gyeolgwa)",
               result: "격퇴 | 패배 — 봇은 이 둘만 받는다 (그 밖은 버린다)" }
    effects: { world_meta: "막해소:<act>.<beat> = result — 첫 보고가 정본 (중복 보고는 버린다) ·
      원장 '막해소' append · WorldClockEngine 엔딩 판정이 이 키를 읽는다 (world_clock.yml endings)" }

  beast_slain:
    desc: "짐승을 잡았다 — 사냥 (생계와 수련)"
    payload:
      foe_id: "san_neukdae · baegyeongmyo …"
      foe_name: "표시 이름"
      realm: "적의 경지"
      witnesses: "목격자 수"
      killer_uuid: "잡은 자"
      killer_name: "잡은 자의 이름"
    effects:
      rumor:
        tags: [사냥, 무재]
        intensity: 1                # 늑대 한 마리는 소문이 되지 못한다 — 영물(rare)만 사람들이 말한다
        rare_foes: [baegyeongmyo]   # 등록 영물은 강도 3 (세계 유일 — registry 대상)
        rare_intensity: 3
        accuracy_kind: 간접_전문
        subject_is_killer: true
        min_intensity_to_spread: 2  # 강도 1 은 심지 않는다 (장부만 남는다 — 소문판이 늑대로 덮이지 않게)

  qi_manifested:
    desc: "격(格)이 터졌다 — 소문의 씨앗. \"그자가 검기를 뿜었다더라\""
    payload:
      grade: "발경 | 검기 | 강기 | 어검 | 심검"
      witnesses: "본 자의 수 (사람·행인·적 전부 — HuntingGrounds.witnessQi 와 같은 반경)"
      player_uuid: "터뜨린 자"
      player_name: "터뜨린 자의 이름"
    effects:
      rumor:
        tags: [무재, 무인, 격]
        intensity_by_grade: { 발경: 1, 검기: 2, 강기: 3, 어검: 4, 심검: 4 }
        accuracy_kind: 직접_목격
        subject_is_killer: true     # 주체 = 터뜨린 자 → 정파·사파가 그를 주목하기 시작한다
        min_witnesses: 1            # 아무도 없는 산속의 검기는 소문이 되지 않는다
        min_intensity_to_spread: 2  # 발경 하나로는 강호가 움직이지 않는다
      # 한 전투에서 검기를 열 번 뿜어도 소문은 하나다 — 같은 자의 같은 격은 이 시간 안에 한 번만 발신한다
      # (MVT 쪽에서 거른다. 다리에 실리지 않은 것은 장부에도 없다)
      dedupe_seconds: 600

  # ★★ link_confirm — **그 몸이 답했다.** 접합의 유일한 결속 신호다 (2026-07-13. 옛 link_request 를 대체).
  #
  #   옛 link_request 는 *마크가 코드를 냈다* 는 통보였고, 결속은 디스코드의 코드 입력이 했다.
  #   이제는 반대다: **디스코드가 청하고(장부에 '대기'로 앉는다) 그 몸이 게임 안에서 답한다.**
  #   봇은 이 이벤트가 오기 전까지 **절대 잇지 않는다** — 닉네임은 청의 수신인일 뿐 열쇠가 아니다.
  #
  #   ★ 봇이 이 줄을 받고도 다시 검사하는 것 (다리를 믿지 않는다):
  #     ① 그런 토큰이 있는가 ② 상태가 '대기'인가 ③ 만료되지 않았는가
  #     ④ **답한 몸(mc_uuid)이 청을 받은 그 몸인가** ⑤ 그 몸/그 이름이 이미 이어져 있지 않은가
  link_confirm:
    desc: "★ 그 몸이 답했다 — 게임 화면의 [잇는다] / [아니다], 또는 /혼천 접속 의 **초기화**"
    payload:
      token: "청의 토큰 (봇이 발급해 link_requests.json 으로 내려보낸 것 — 열쇠가 아니라 지목이다).
        ★ 취소일 때는 비어 있을 수 있다 — 그러면 봇은 **그 몸에게 온 대기 청을 전부** 폐기한다"
      mc_uuid: "답한 몸 — ★ 봇이 요청의 mc_uuid 와 대조한다 (다르면 버린다. 남의 청은 못 받는다)"
      mc_name: "그때의 이름"
      decision: "수락 | 거절 | 취소"
    effects:
      identity: 확정               # 수락이면 mvt_link.character_id 를 채운다 (거절·취소면 청만 죽는다)
      merge: blood_debt            # 접합 순간 mc:<uuid> 원장이 그 캐릭터로 병합된다 (merge_on_link)
      audit: 접합                  # events 에 남는다 — 누가·누구를·언제·어느 경로로
      rumor: none                  # ★ 접합은 세계의 사건이 아니다 — 소문도, 지역도, 세력도 움직이지 않는다

      # ═══ ★ 취소(初期化) — "발판을 밟을 때마다 코드 초기화를 시켜야 할 듯" (사용자, 2026-07-13) ═══
      #
      # 【무엇을 옮겼나】 옛 방식에는 코드가 있었고, /혼천 접속 을 다시 치면 **새 코드가 나오고 옛 코드는 죽었다**
      #   (one_pending_per_body). 새 방식에는 코드가 없다 — 그래서 그 원리를 **청(請)** 에 옮긴다:
      #
      #     **/혼천 접속 을 다시 부르면 (발판이든 손이든) 그 몸에게 온 대기 청은 전부 죽는다.**
      #
      # 【왜 옳은가】 사람이 헤매다 발판을 다시 밟는 것은 *"처음부터 다시 하겠다"* 는 뜻이다. 그때 낡은 청이
      #   살아 있으면 ① 이미 죽은 줄 알았던 창을 나중에 실수로 수락하거나 ② 두 청이 경쟁한다.
      #   **살아 있는 청이 언제나 하나뿐**이면 공격면도 하나뿐이다 — 보안상으로도 더 좁다.
      #
      # 【배선】 발판(Antechamber.stepPlate)은 player.performCommand("혼천 접속") 로 **명령을 대신 칠 뿐**이다.
      #   그러므로 **명령 자체가 초기화한다** (MvtCommand.link → WorldBridge.linkReset). 발판에 별도 로직은 없다 —
      #   손으로 친 것과 발판으로 친 것이 **같은 함수**를 지난다. 둘이 어긋날 자리가 없다.
      reset_on: mc_command         # /혼천 접속 을 부를 때마다 (identity.mc_command)

  # ★★ seojang_choice — **그 손이 책의 글자를 눌렀다** (2026-07-13 신설. 서장의 유일한 진행 신호)
  #
  #   옛 길에서 이 신호는 **디스코드의 버튼**(customId "tn:<장면>:<선택>")이었다. 그 길은 죽었다 —
  #   사용자: "디스코드에서 채팅을 치고 진행하는 것이 아닌 **마크로 넘어가는 걸로**."
  #   이제 신호는 **책 안의 클릭**(ClickEvent.runCommand /혼천 서장 <토큰> <n>)에서 온다.
  #
  # 【★ 토큰이 하는 일 — 열쇠가 아니라 **어느 장인가**의 지목이다】 (접합의 토큰과 같은 문법)
  #   토큰 = "<캐릭터id>:<장면>:<난수>" 를 봇이 매 장면마다 새로 낸다. 봇은 받은 토큰이
  #   **지금 그 캐릭터의 그 장면**인지 대조한다. 다르면 버린다 — 그래서:
  #     · **낡은 책의 클릭은 아무것도 하지 않는다** (다음 장이 이미 왔다. 연타도 여기서 죽는다)
  #     · **남의 책의 클릭도 아무것도 하지 않는다** (토큰의 캐릭터 ≠ 누른 몸의 캐릭터)
  #   ★ 멱등은 두 겹이다: bridge_inbox(event_id PK) 위에 이 토큰 대조가 한 겹 더 있다.
  #     jsonl 은 파일이다 — 손으로 한 줄 끼워 넣을 수 있다. 그래서 봇은 **다리를 믿지 않는다.**
  seojang_choice:
    desc: "★ 서장의 책에서 글자를 눌렀다 — 장면의 선택, 또는 마지막 책의 [강호로 나선다](출도)"
    payload:
      player_uuid: "누른 몸 (접합된 몸만 — 서장은 접합 뒤에 열린다)"
      player_name: "그때의 이름"
      token: "봇이 이 장면에 낸 토큰 (<캐릭터id>:<장면>:<난수>). 지금 장면의 것이 아니면 **버린다**"
      choice: "선택지 번호 (0부터). ★ **-1 = 출도** (마지막 책의 [강호로 나선다])"
    effects:
      judgment: judgment.yml          # 봇이 굴린다 (2d6 + 능력치 + 성별 보정) — 마크는 주사위를 만지지 않는다
      scene_source: seojang.yml       # 글·선택지·저항값의 정본 (코드도 마크도 이야기를 짓지 않는다)
      advance: 서장_장면              # characters.sheet_json 의 칸 (스키마 변경 없음 — 시트는 자유 서식)
      debut: "choice = -1 일 때 status 서장 → 강호 · location → 청하현 (옛 closeSeojang 과 같은 손)"
      ledger: 판정                    # events.type — 장면마다 굴림·마진·등급이 남는다 (옛 길과 동일)
      rumor: none                     # ★ 서장은 개인 시간축이다 (player_creation.yml seojang_and_chuldo:
                                      #   "공유 세계 기입 없음") — 소문도 지역도 세력도 움직이지 않는다
      unlinked: 무시                  # 접합 안 된 몸에는 책이 가지 않는다 (애초에 seojang.json 에 안 실린다)

  cultivation_logged:
    desc: "★ 몸에서 쌓인 것이 장부로 올라간다 — 수련 배분의 하루치 · 실전 화후 · 실전/사선 마크"
    # ═══ 정본(正本)의 방향 — 이 게임에서 가장 중요한 한 칸 ═══
    #
    # 【누가 정본인가】 **시트의 정본은 봇이다.** 경지·화후·승급은 *강호가 인정하는 것*이고,
    #   강호의 장부는 SQLite(characters.sheet_json)에 있다. `promoteIfDue` 가 범인→삼류→이류→일류를 굴린다.
    #   **마크는 몸이다** — 수련 배분을 고르고, 손으로 익히고, 어디에 서 있는가를 안다.
    #
    # 【그런데 규칙은 어디에 있는가】 **규칙(Growth)은 마크에 한 벌만 있다.** 봇이 curriculum→능력치
    #   환산을 다시 구현하면 *규칙의 정본이 둘*이 되고, 마크가 시트를 쓰면 *장부의 정본이 둘*이 된다.
    #   이 저장소가 반복해서 데인 병이 바로 그것이다 ("정본이 둘이고 코드가 이기고 있었다").
    #   그래서 이렇게 잘라 둔다:
    #
    #       규칙은 마크에 하나 (Growth.pour 가 계산한다 — 캡·심법 게이트·배증 사다리)
    #       장부는 봇에 하나  (Bridge.cultivationLogged 가 시트에 더한다 — 그리고 봇이 다시 캡으로 조인다)
    #
    #   마크가 보내는 것은 **증분**이고, 봇이 내려보내는 것은 **절대값**이다 (feedback.world_state.sheet).
    #   덮어쓰기이므로 **이중 계상이 원리적으로 불가능**하다 — 마크가 낙관적으로 먼저 더해 둬도
    #   다음 스냅숏이 진실로 되돌린다. **두 원장은 갈라질 수 없다.**
    #
    # 【시계】 ★ days 는 **세계일**이다 (봇의 자정 스케줄러: 현실 하루 = 세계 1일).
    #   마크의 하루는 현실 20분이다 — 그 시계로 화후를 재면 같은 config 숫자가 **72배** 다른 뜻이 된다
    #   (능력치 +1 = 360일 → 마크에선 닷새 앉아 있으면 오른다). 그래서 마크는 제 낮밤을 **쓰지 않고**
    #   스냅숏의 world_day 를 읽는다. 봇이 꺼져 있으면(world_day = 0) **장부는 움직이지 않는다.**
    #   두 시계의 대조는 tools/clock_audit.py 가 지킨다.
    payload:
      player_uuid: "쌓은 자 (접합된 몸만 — 강호에 이름이 없으면 쌓을 장부가 없다)"
      player_name: "그때의 이름"
      realm: "마크가 알고 있던 경지 (대조용 — 봇의 값이 다르면 봇이 이긴다)"
      attr_days: "능력치 → 증분 (실수). Growth.pour 가 경지 캡까지만 부은 값"
      skill_days: "무공/과목 → 일치 증분 (실수). 초식 수련 + 실전 화후"
      naegong: "내공 증분 (실수 — 내공 '점'. 봇은 축기_원장(일치)의 역환산으로 되돌려 적는다)"
      train_days: "그날 몸에 실제로 들어간 일치 (버려진 몫 제외) → 봇의 화후_원장.
        ★ 범인 → 삼류의 관문이다 ('기초 단련 3개월' = 90일치). 과목이 무엇이든 몸은 단련된다"
      marks_실전: "실전 마크 증분 (정수) — ★ 봇의 승급 요건 '실전 마크 N' 을 채우는 값"
      marks_사선: "사선 마크 증분 (정수)"
    effects:
      sheet: 증분_적용            # characters.sheet_json 에 더한다 (능력치·기술·축기_원장·마크)
      cap: player_creation.attribute_cap_by_realm   # ★ 봇이 다시 조인다 — 마크의 경지가 낡았을 수 있다
      promote: cultivation.cultivation_stages       # 더한 뒤 promoteIfDue (승급은 강호가 인정한다)
      rumor: none                # 수련은 세계의 사건이 아니다 — 소문도 지역도 세력도 안 움직인다
      unlinked: 무시             # 접합되지 않은 몸의 화후는 적을 곳이 없다 (마크가 애초에 안 보낸다)

  surrender:
    desc: "자수(自首) — 관졸에게 웅크린 채 말을 걸었다. ★ 관의 법과 혈채는 **다른 법정**이다"
    payload:
      player_uuid: "자수한 몸"
      player_name: "그때의 이름"
      fine: "벌금 (MVT 가 그 자리에서 걷었다 — 문(文). 방이 안 붙었으면 0)"
    effects:
      # 관의 법 — 수치의 원천은 등록부다 (여기서 발명하지 않는다. 아래는 그 표를 옮겨 적은 배선값):
      #   mandate → faction_politics.yml authority_mandate.drains.자수 (-10)
      #             ★ 코드는 Politics.mandateDrain("자수") 로 **등록부에서 직접** 읽는다
      #   region  → ★ 이제 **등록부가 정한다**: region_state.yml event_deltas.자수 (민심 +2).
      #             그 값의 출처는 npc_death.yml responses.자수.effect.민심 이다 (승격됨).
      mandate_drain: 자수          # faction_politics.yml authority_mandate.drains 의 키
      region_event: 자수           # region_state.yml event_deltas.자수 (민심 +2)
      # ★ 혈채는 **삭제되지 않는다** (faction_reaction.yml blood_debt.atonement.principle:
      #   "혈채는 삭제되지 않는다. 성격이 바뀔 뿐이다"). 자수는 현혈채의 **감쇠를 개시**할 뿐이다.
      #   그래서 목에 걸린 값(feedback.bounty)은 자수 한 번으로 내려가지 않는다 —
      #   내려가는 것은 법명분(feedback.wanted)이고, 그것이 관졸의 눈이다.
      blood_debt: 감쇠_개시                                            # blood_debt.atonement.inputs.자수
      rumor: none                                                     # 자수는 소문이 아니다 (관의 장부다)

  populace_quest:
    desc: "무명(無名)의 의뢰 — 게시판에 붙지 않는다. 사람이 소매를 붙잡는다 (populace.yml quests.rules)"
    payload:
      event: "발생 | 완료 | 만료"
      rule: "populace.yml quests.rules 의 키 (아이_실종 · 시신_수습 · 산길_대행 · 야간_순라_보조)"
      outcome: "success | fail_body | on_expire (발생이면 없음) — 봇은 이 칸으로 등록부를 집는다"
      issuer: "발주자 (populace.yml people 의 키 — 관계에서 자란다)"
      victim: "대상 무명 (없을 수 있다 — 소문·통행금지에서 자란 의뢰)"
      player_uuid: "수주자 (완료일 때)"
      player_name: ""
      irony: "★ 살해자가 유족의 의뢰를 완수했는가 — 혈교는 이것을 **자격**으로 읽는다"
    effects:
      # 지역 델타는 **봇이 populace.yml 을 읽어** 적는다 (MVT 는 결말의 이름만 보낸다):
      #   quests.rules.<rule>.<outcome>.region  — 민심 ±1 · 치안 ±1 · 경제 -1
      region: "npcs/populace.yml quests.rules.<rule>.<outcome>.region"
      favor: "npcs/populace.yml quests.rules.<rule>.killer_irony.blood_favor (irony=true 일 때 혈교)"
      rumor: none                  # 무명의 의뢰는 강호의 이야깃거리가 아니다 (마을의 일이다)
      ledger: 무명의뢰              # events.type — 자국은 남는다

  sparring:
    desc: "비무 — 죽이지 않는 싸움. 이겨도 죽지 않고, 져도 죽지 않는다"
    payload:
      winner_uuid: "이긴 자"
      winner_name: ""
      loser_uuid: "진 자 (NPC 면 없음)"
      loser_name: ""
      reason: "중상 | 항복 | 장외 | 시간"
      witnesses: "구경꾼 수"
    effects:
      rumor:
        tags: [무재, 무인, 비무]
        intensity: 1
        public_intensity: 2         # 구경꾼이 many 이상이면 (장터 비무는 이야깃거리다)
        accuracy_kind: 직접_목격
        subject_is_winner: true
        min_intensity_to_spread: 2

# ═══════════════ 되먹임 (봇 → MVT) ═══════════════
# 사실은 이벤트로 흐르고(순서·유실 금지), 상태는 스냅숏으로 흐른다(최신이 이긴다).
# 스냅숏은 재생할 필요가 없다 — 어제의 소문판을 다시 트는 것은 세계가 아니라 녹음이다.
feedback:
  world_state:
    world_day: "봇의 세계일 (마크의 낮밤과 별개 — 장부의 시간)"
    rumor_tags: "지금 살아 있는 소문의 태그 (Db.heard 유효강도 > 0)"
    populace_reactions: "위 태그를 populace.yml reactions 키로 옮긴 것 — Populace.rumor(tag, on)"
    region: "치안·경제·민심 (regions 표)"
    wanted: "수배 — mc_uuid × 법명분 게이지 (authority_mandate). 문턱을 넘으면 관졸이 적대한다"
    favor: "세력 우호 — mc_uuid × 세력 (faction_standing). 산문의 문이 열리고 닫힌다"
    links: "★ 신원 — mc_uuid → {character_id, name}. 접합된 몸만 여기 있다 (마크가 '나는 누구인가'를 읽는 곳)"
    discord: "★ 접속의 문 — {url, channel_id, guild_id, invite}. 봇이 제 '접합:채널'·'접합:길드'(world_meta)와
      identity.gate.invite_url 로부터 만든다. 마크는 **invite** 를 [초대 링크] 클릭에 건다
      (ClickEvent OPEN_URL — 허용 스킴은 http/https 뿐이다). 등록부가 비면 아무것도 안 싣는다 (지어내지 않는다)"
    bounty: "★ 현상금 — mc_uuid → 문(文). 혈채가 blood_debt.engine.bounty_min 을 넘으면 관이 방을 붙인다
      (금액은 economy.yml 의뢰_보수.고수_현상금 — 여기서 발명하지 않는다).
      ★ 혈채 수치 자체는 절대 내려보내지 않는다 (blood_debt.visibility: 내부) — 내려가는 것은 세계의 반응뿐이다"

    # ═══ 시트 — 마크의 몸에 실릴 캐릭터 (2026-07 접합 패스) ═══
    #
    # 이것이 없어서 **마크에는 캐릭터가 없었다**: SkillEngine.State.realm 은 "이류"로 **박혀 있었고**
    # (주석: "MVT 는 캐릭터 시트가 없다") 능력치는 전부 0.0 이었다. 그 귀결이 이것이다 —
    # 갓 접속한 몸은 Growth.attackBonus = +0 인데 같은 경지 NPC 는 realmAttr 로 표준치를 받는다.
    # **플레이어가 제 급의 산적보다 구조적으로 약했다.** 다리는 서 있었는데 시트만 안 실려 있었다.
    #
    # 내려가는 값은 전부 **절대값**이다 (증분이 아니다). 마크는 이것으로 제 거울을 덮어쓴다 —
    # 그래서 두 원장은 갈라질 수 없다. 없는 칸은 "봇이 모르는 값"이고 마크는 제 것을 지킨다.
    sheet: "mc_uuid → 시트 한 장. 접합된 산 자만 여기 있다"
    sheet_fields:
      realm: "경지 — ★ SkillEngine.State.realm 하드코딩 \"이류\" 가 서 있던 자리 (characters.realm)"
      attrs: "능력치 → 실수 (근력·민첩·체력·내공·감각·화술·지혜 — judgment.yml attributes)"
      naegong: "내공 실수치 — 내력 풀 = round(내공 × 3) (internal_energy.yml)"
      simbeop: "익힌 심법 (simbeop.yml id). null = 개화 전 — ★ null 도 진실이다 (내공 과목의 게이트)"
      primary_art: "주력 무공 — 초식 수련·승급 요건('주력 무공 숙련')이 쌓이는 곳"
      skill_days: "무공/과목 → 누적 일치 (실수). 레벨은 환산표로 파생 (PlayerLedger.levelOf)"
      marks_실전: "실전 마크 (승급 요건)"
      marks_사선: "사선 마크"
      money: "소지금 (문) — characters.wallet"

  # 소문 태그 → 행인 반응 (populace.yml reactions 의 키). 이것이 "도적 소문이 돌면 무명이 산길을 피한다"의 배선
  reaction_map:
    도적_소문: [도적, 치안]        # 둘 중 하나라도 살아 있으면 켠다
    열병_소문: [질병]

  # 수배 문턱 (faction_politics.yml authority_mandate.inputs 의 눈금을 그대로 읽는다 — 발명 금지)
  wanted:
    gauge_min: 8                   # 포두가 움직이는 값 (관졸 적대)
    disavowal_min: 10              # 강호의 절연 — 정파도 등을 돌린다 (murim_disavowal)
