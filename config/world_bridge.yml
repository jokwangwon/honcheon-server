# 세계 다리(世界橋) — 마크(MVT)에서 벌어진 일이 봇의 장부로 흐르고,
# 봇의 세계 상태가 마크의 행동으로 되먹임되는 단 하나의 통로.
#
# 원칙 (등록제): **이 파일에 없는 이벤트는 세계에 존재하지 않는다.**
#   MVT 는 여기 등록된 kind 만 발신하고, 봇은 여기 등록된 kind 만 수신한다.
#   봇이 소문을 어떤 태그·강도·정확도로 낳는지도 코드가 아니라 이 파일이 정한다
#   (수치의 원천은 여전히 rumor.yml · npc_death.yml — 여기는 '어느 칸을 읽을지'의 배선표다).
#
# 몸이 둘이다:
#   MVT (Paper 플러그인, 별도 JVM) — 사건이 벌어지는 곳. 사람이 죽고, 도적을 베고, 격을 터뜨린다.
#   봇  (JDA + SQLite)             — 세계의 장부. 소문·명분·수사·세력·의뢰.
# 봇은 항상 떠 있지 않다. 그러니 다리는 **비동기·내구성 큐**여야 한다 (docs/design/world_bridge.md).

transport:
  mode: jsonl_spool                # 파일 기반 append-only JSONL + 봇의 폴링 (후보 비교는 설계 문서 2장)
  dir: run/bridge                  # 저장소 루트 기준. MVT 는 데이터 폴더에서 거슬러 올라 루트를 찾는다
                                   #   (또는 환경변수 HONCHEON_BRIDGE 로 직접 지정)
  outbox: mvt                      # MVT → 봇: <dir>/mvt/<YYYYMMDD>.jsonl (한 줄 = 한 사건, 추가만)
  snapshot: world_state.json       # 봇 → MVT: <dir>/world_state.json (원자적 교체 — 최신이 이긴다)
  poll_seconds: 5                  # 봇의 수신 주기 (꺼져 있던 동안의 것은 켤 때 전부 따라잡는다)
  snapshot_seconds: 20             # MVT 의 되먹임 갱신 주기
  retain_days: 30                  # 처리 끝난 조각의 보관 기간 (감사·재생용 — 지우는 것은 사람이 한다)
  cursor_key: 다리:커서            # 봇 world_meta 키 — "<파일>:<바이트오프셋>". 여기까지 읽었다
  # 멱등: 모든 이벤트는 id(uuid)를 지고, 봇은 bridge_inbox(PK=event_id)에 먼저 못을 박는다.
  # 커서를 못 쓰고 죽어도 두 번 적용되지 않는다 (재기동 = 재생, 재생 = 무해).

# ─── 봉투 (모든 이벤트 공통) ───
envelope:
  id: "uuid — 멱등 키 (봇의 bridge_inbox PK)"
  kind: "이벤트 종류 — 아래 events 등록부의 키. 미등록이면 봇이 무시하고 로그만 남긴다"
  at: "발신 시각 (epoch millis, 현실 시간)"
  source: "mvt"
  actor: "행위자 — mc_uuid · mc_name (있으면). 봇은 mvt_link 로 캐릭터를 찾는다"
  place: "장소 키 (rumor.yml propagation.origin_network_by_location 의 키 — 발원 소문망의 근거)"
  night: "밤인가 (bool) — 목격·은닉의 배경"
  data: "kind 별 페이로드"

# ─── 신원 접합 (마크 플레이어 ↔ 봇 캐릭터) ───
# 마크의 몸과 봇의 장부는 서로를 모른다. 이 표가 없으면 "누가 죽였는가"가 세계에 남지 않는다.
#
# ★ 방향: **마크가 코드를 내고, 디스코드가 확정한다** (mvt_issues_discord_confirms).
#   왜 반대가 아닌가 — 훔칠 수 있는 것은 '코드'뿐이고, 지켜야 할 것은 '캐릭터'다.
#   최종 결속을 디스코드에서 하면 **캐릭터를 뺏으려면 그 사람의 디스코드 계정이 필요하다.**
#   코드가 새어 나가도 도둑이 할 수 있는 최악은 "제 캐릭터에 남의 마크 몸을 붙이는 것" = 자해다.
#   (반대 방향 — 봇이 코드 발급 → 마크에서 입력 — 이면 코드 한 줄이 곧 캐릭터의 열쇠가 된다.)
identity:
  table: mvt_link                  # (mc_uuid PK, mc_name, character_id, linked_day) — 마이그레이션 005
  code_table: mvt_link_code        # (code PK, mc_uuid, mc_name, issued_at, expires_at, state) — 006
  direction: mvt_issues_discord_confirms
  mc_command: "/혼천 접속"          # 마크: 코드를 발급받는다 (본인 채팅에만 보인다)
  bot_command: "/혼천 접속 코드:<코드>"  # 디스코드: 인증된 신원으로 확정한다 (여기가 결속의 순간)
  unlink_command: "/혼천 접속해제"   # 스스로 끊는다 (남의 것은 못 끊는다)
  code_length: 6
  code_alphabet: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"   # 0·O·1·I 없음 — 채팅으로 옮겨 적는 값이다
  ttl_seconds: 600                 # 10분 — 그 뒤로 코드는 죽은 문자열이다
  single_use: true                 # 한 번 쓰면 폐기 (state 사용됨)
  one_pending_per_body: true       # 재발급하면 그 몸의 이전 대기 코드는 즉시 폐기된다
  one_body_one_character: true     # 몸 하나 = 캐릭터 하나 (양쪽 다 1:1)
  relink: 거부                     # 이미 이어진 몸/캐릭터는 **해제 후에만** 다시 잇는다 (도난 방지)
  on_character_death: 자동_무효     # 죽은 자의 이름으로는 소문이 붙지 않는다 (characterOfMc 가 산 자만 본다)
  merge_on_link: true              # ★ 접합 전의 혈채(mc:<uuid> 원장)는 접합 순간 그 캐릭터로 병합된다
                                   #   (blood_debt.target_tracking.merge — "세계가 한 마리의 짐승을 본다")
  audit: 접합                      # events.type — 접합·접합해제는 전부 장부에 남는다
  fallback: mc_name                # 링크가 없으면 이름만 장부에 적는다 (주체 없는 소문 = 세계의 배경음)

  # ═══ 접합의 문(門) — 명령을 외우지 않고 잇는다 ═══
  #
  # 【무엇이 벽이었나】 방향(마크 발급 → 디스코드 확정)은 옳다. 그러나 사람이 치러야 할 값이 셋이었다:
  #   ① 여섯 자를 **외운다** ② 창을 바꿔 디스코드를 **찾아간다** ③ 명령 문법을 **다시 친다**.
  #   셋 다 세계와 무관한 값이다. 벽은 규약이 아니라 **손놀림**에 있었다.
  #
  # 【그래서 손놀림만 깎는다 — 규약은 그대로다】
  #   마크:     채팅에 [혼천 접속] · [코드 복사] 가 뜬다.
  #             [코드 복사] = 코드가 클립보드로 (COPY_TO_CLIPBOARD — 외울 것이 없다)
  #             [혼천 접속] = 접속 채널 URL 이 열린다 (OPEN_URL — 찾아갈 것이 없다)
  #   디스코드: 접속 채널에 **상시 붙어 있는 버튼**을 누른다 → 코드 한 칸짜리 창(모달)이 뜬다 →
  #             붙여넣기 → 끝. **명령을 칠 일이 없다.**
  #
  # 【★ 규약이 깨지지 않는 근거】 버튼은 코드를 담지 않는다 (customId 는 "lk:open" 뿐 — 누구나 눌러도 좋다).
  #   확정에 필요한 것은 여전히 **코드 + 디스코드 신원** 둘이고, 그 코드는 **그 몸의 주인 화면에만** 떴다.
  #   버튼을 누른 자가 누구인지는 디스코드가 서명한다 (ModalInteraction.getUser() — 위조 불가).
  #   즉 이 문은 **입력 수단**만 바꿨다. 자물쇠(TTL·1회성·1:1·감사)는 하나도 건드리지 않았다.
  #
  # 【★ 마크가 못 하는 것 — 정직하게】 마크는 디스코드 앱을 열어 명령을 대신 쳐 줄 수 없다.
  #   클라이언트가 여는 것은 URL 뿐이고(확인 창을 거친다), 허용 스킴은 http/https 뿐이다 —
  #   discord:// 딥링크는 바닐라 클라이언트가 거부한다. 그래서 https://discord.com/channels/... 를 연다
  #   (브라우저가 뜨고, 데스크톱에 앱이 깔려 있으면 브라우저가 앱으로 넘긴다).
  gate:
    # 접속 채널의 URL 은 **여기 적지 않는다.** 봇이 제가 등록한 채널로부터 만들어
    # world_state.json(feedback.world_state.discord)에 실어 내려보낸다 — 코드도 config 도 id 를 지어내지 않는다.
    url_source: 스냅숏             # feedback.world_state.discord.url ← 봇의 '접합:채널' + '접합:길드'
    channel_meta: 접합:채널        # world_meta — /혼천 접합문 을 친 그 채널
    guild_meta: 접합:길드          # world_meta — 봇이 뜰 때 그 채널이 속한 길드로 채운다

    mc_chat:                       # 마크 채팅 (본인에게만 — 공개 채팅 금지)
      headline: "접합 코드가 나왔다 — 강호에 이름을 올릴 차례다"
      open_label: "[혼천 접속]"
      open_hover: "디스코드의 접속 채널을 연다 — 거기 붙어 있는 「마크의 몸을 잇는다」를 누르면 된다"
      copy_label: "[코드 복사]"
      copy_hover: "코드를 클립보드에 담는다 — 디스코드에서는 붙여넣기 한 번이면 된다"
      tail: "코드 {code} · 유효 {minutes}분 · 이 코드는 한 번만 쓰인다"
      no_url: "접속 채널이 아직 등록되지 않았다 — 디스코드에서 관리자가 /혼천 접합문 을 쳐야 한다"
      already: "이미 {name} 으(로) 이어져 있다 (디스코드 /혼천 접속해제)"
      # 접합 안 한 몸에게 뜨는 잔소리 (SkillListener.nag) — 여기도 **치지 않게** 한다.
      # 클릭 = RUN_COMMAND /혼천 접속 (마크 명령이므로 마크가 대신 쳐 줄 수 있다. 디스코드 명령은 못 친다)
      nag_label: "[강호에 이름을 올린다]"
      nag_hover: "누르면 /혼천 접속 이 실행된다 — 접합 코드가 나온다 (칠 것이 없다)"
      nag_command: "/혼천 접속"

    discord:                       # 접속 채널에 상시 붙는 문 (/혼천 접합문 이 세운다)
      title: "접합의 문 — 마크의 몸을 이 이름에 잇는다"
      body: |
        마크에서 `/혼천 접속` 을 치면 채팅에 **[코드 복사]** 가 뜬다. 누르면 코드가 클립보드에 담긴다.
        그다음 아래 **「마크의 몸을 잇는다」** 를 누르고, 뜨는 창에 **붙여넣기** 하면 끝이다.

        여기서 확정하는 이유는 하나다 — **이 자리가 인증된 자리이기 때문이다.**
        코드가 남의 눈에 띄어도, 그자가 할 수 있는 최악은 *제 캐릭터에 남의 몸을 붙이는 것*이다.
        캐릭터를 뺏으려면 **그 사람의 디스코드 계정**이 있어야 한다.
      button_label: "마크의 몸을 잇는다"
      modal_title: "접합 — 마크에서 받은 코드"
      modal_field: "접합 코드"
      modal_hint: "마크에서 [코드 복사]를 눌렀다면 붙여넣기 한 번"
      gate_posted: "이 채널이 **접속의 문**으로 섰다 — 마크의 [혼천 접속] 클릭이 여기로 온다."

# ─── 장소 접합 — 마크의 자리(populace.yml places) → 소문망의 장소 키 ───
# 이것이 없으면 산길에서 난 일이 장터의 소문이 된다. 발원망이 곧 그 소문이 처음 도는 곳이다
# (rumor.yml propagation.origin_network_by_location — 여기 없는 자리는 mingan_market 으로 떨어진다).
place_map:
  장터_광장: market
  우물가: market
  좌판_거리: market
  남북대로_북: market
  남북대로_남: market
  동서대로_동: market
  동서대로_서: market
  서쪽_골목: market
  동쪽_골목: market
  남쪽_들: market
  개울_빨래터: market
  전장_앞: market
  표국_마당: market
  관아_앞: market
  객잔_앞: cheongha_inn
  의방_앞: medicine_shop
  의뢰소_앞: request_office
  북문_어귀: north_road          # 북문 밖은 이미 길이다 — 상단망이 먼저 듣는다
  산길_어귀: north_road

# ═══════════════ 이벤트 등록부 ═══════════════
# effects 는 봇이 무엇을 하는지의 선언이다. 코드는 이 표를 읽어서 움직인다.
events:

  npc_death:
    desc: "사람이 죽었다 — 무명(populace) 또는 등록 NPC(cheongha_npcs)"
    payload:
      npc_id: "등록부 키 (populace.yml people.<id> 또는 cheongha_npcs.yml npcs.<key>)"
      npc_name: "이름"
      registry: "populace | cheongha_npcs — 어느 등록부의 사람인가 (연쇄의 깊이가 다르다)"
      job: "생업 (무명일 때)"
      witnesses: "목격자 수 (실제로 센 값 — populace.yml death.witness_radius 반경)"
      body: "즉시_발견 | 유기_지연발견 | 은닉 (npc_death.yml killer_response.variables.body)"
      cause: "노환_병사 | 사고 | 사건_피살 | 자멸_심마 (npc_death.yml npc_types.cause_modifier)"
      killer_uuid: "가해자 (플레이어일 때)"
      killer_name: "가해자 이름 (몹·미상이면 없음)"
    effects:
      # 목격자 수 → npc_death.yml killer_response.rumor_matrix 의 witness 칸 (0 없음 / 1 소수 / 2 다수)
      witness_band: { none: 0, few: 1, many: 2 }
      witness_many_min: 2          # populace.yml death.witness_public_min 과 같은 눈금
      rumor:
        tags: [살인, 괴사, 폭력, 치안]
        # 강도·정확도·지연은 npc_death.yml killer_response.rumor_matrix 가 정한다 (여기서 발명하지 않는다)
        matrix: npc_death.killer_response.rumor_matrix
        subject_is_killer: true    # 목격자가 있으면 소문의 주체는 가해자다 → 세력이 그를 주목한다
        subject_needs_witness: true # 아무도 못 봤으면 이름이 남지 않는다 (은밀형의 보상)
      region:
        민심: -1                   # populace.yml death.region_delta (무명). 등록 NPC 는 npc_death.yml 이 정한다
      succession: registry_only     # 무명에게는 후계도 복수자도 없다 (populace.yml death.revenge: civil_debt)
      mandate: npc_death.succession  # 관(官)을 죽였는가 — 법명분은 그 등록부만이 정한다

  bandit_slain:
    desc: "도적을 베었다 — 토벌 (사람을 죽인 것이지만, 이쪽은 명분이 있는 죽음이다)"
    payload:
      foe_id: "north_road_bandit …"
      foe_name: "표시 이름"
      role: "졸개 | 두목"
      realm: "적의 경지"
      witnesses: "목격자 수"
      killer_uuid: "벤 자"
      killer_name: "벤 자의 이름"
    effects:
      rumor:
        tags: [도적, 치안, 무재]
        intensity_by_role: { 졸개: 1, 두목: 2 }
        accuracy_kind: 직접_목격      # rumor.yml generation.initial_accuracy (90)
        subject_is_killer: true
      region:
        치안: 1                      # 도적이 줄면 길이 안전해진다 (두목이면 ×2 — scale_by_role)
      scale_by_role: { 졸개: 1, 두목: 2 }

  beast_slain:
    desc: "짐승을 잡았다 — 사냥 (생계와 수련)"
    payload:
      foe_id: "san_neukdae · baegyeongmyo …"
      foe_name: "표시 이름"
      realm: "적의 경지"
      witnesses: "목격자 수"
      killer_uuid: "잡은 자"
      killer_name: "잡은 자의 이름"
    effects:
      rumor:
        tags: [사냥, 무재]
        intensity: 1                # 늑대 한 마리는 소문이 되지 못한다 — 영물(rare)만 사람들이 말한다
        rare_foes: [baegyeongmyo]   # 등록 영물은 강도 3 (세계 유일 — registry 대상)
        rare_intensity: 3
        accuracy_kind: 간접_전문
        subject_is_killer: true
        min_intensity_to_spread: 2  # 강도 1 은 심지 않는다 (장부만 남는다 — 소문판이 늑대로 덮이지 않게)

  qi_manifested:
    desc: "격(格)이 터졌다 — 소문의 씨앗. \"그자가 검기를 뿜었다더라\""
    payload:
      grade: "발경 | 검기 | 강기 | 어검 | 심검"
      witnesses: "본 자의 수 (사람·행인·적 전부 — HuntingGrounds.witnessQi 와 같은 반경)"
      player_uuid: "터뜨린 자"
      player_name: "터뜨린 자의 이름"
    effects:
      rumor:
        tags: [무재, 무인, 격]
        intensity_by_grade: { 발경: 1, 검기: 2, 강기: 3, 어검: 4, 심검: 4 }
        accuracy_kind: 직접_목격
        subject_is_killer: true     # 주체 = 터뜨린 자 → 정파·사파가 그를 주목하기 시작한다
        min_witnesses: 1            # 아무도 없는 산속의 검기는 소문이 되지 않는다
        min_intensity_to_spread: 2  # 발경 하나로는 강호가 움직이지 않는다
      # 한 전투에서 검기를 열 번 뿜어도 소문은 하나다 — 같은 자의 같은 격은 이 시간 안에 한 번만 발신한다
      # (MVT 쪽에서 거른다. 다리에 실리지 않은 것은 장부에도 없다)
      dedupe_seconds: 600

  link_request:
    desc: "신원 접합 요청 — 마크에서 코드를 냈다. **아직 아무것도 이어지지 않았다** (디스코드가 확정해야 이어진다)"
    payload:
      code: "일회용 코드 (identity.code_alphabet · code_length)"
      mc_uuid: "코드를 낸 몸"
      mc_name: "그때의 이름"
      ttl_seconds: "유효 시간 (봇은 봉투의 at + ttl 로 만료를 판정한다 — 봇이 꺼져 있었으면 이미 죽은 코드다)"
    effects:
      identity: pending            # mvt_link_code 에 '대기'로 앉힌다. 세계 상태는 아무것도 바뀌지 않는다
      rumor: none                  # ★ 접합은 세계의 사건이 아니다 — 소문도, 지역도, 세력도 움직이지 않는다

  cultivation_logged:
    desc: "★ 몸에서 쌓인 것이 장부로 올라간다 — 수련 배분의 하루치 · 실전 화후 · 실전/사선 마크"
    # ═══ 정본(正本)의 방향 — 이 게임에서 가장 중요한 한 칸 ═══
    #
    # 【누가 정본인가】 **시트의 정본은 봇이다.** 경지·화후·승급은 *강호가 인정하는 것*이고,
    #   강호의 장부는 SQLite(characters.sheet_json)에 있다. `promoteIfDue` 가 범인→삼류→이류→일류를 굴린다.
    #   **마크는 몸이다** — 수련 배분을 고르고, 손으로 익히고, 어디에 서 있는가를 안다.
    #
    # 【그런데 규칙은 어디에 있는가】 **규칙(Growth)은 마크에 한 벌만 있다.** 봇이 curriculum→능력치
    #   환산을 다시 구현하면 *규칙의 정본이 둘*이 되고, 마크가 시트를 쓰면 *장부의 정본이 둘*이 된다.
    #   이 저장소가 반복해서 데인 병이 바로 그것이다 ("정본이 둘이고 코드가 이기고 있었다").
    #   그래서 이렇게 잘라 둔다:
    #
    #       규칙은 마크에 하나 (Growth.pour 가 계산한다 — 캡·심법 게이트·배증 사다리)
    #       장부는 봇에 하나  (Bridge.cultivationLogged 가 시트에 더한다 — 그리고 봇이 다시 캡으로 조인다)
    #
    #   마크가 보내는 것은 **증분**이고, 봇이 내려보내는 것은 **절대값**이다 (feedback.world_state.sheet).
    #   덮어쓰기이므로 **이중 계상이 원리적으로 불가능**하다 — 마크가 낙관적으로 먼저 더해 둬도
    #   다음 스냅숏이 진실로 되돌린다. **두 원장은 갈라질 수 없다.**
    #
    # 【시계】 ★ days 는 **세계일**이다 (봇의 자정 스케줄러: 현실 하루 = 세계 1일).
    #   마크의 하루는 현실 20분이다 — 그 시계로 화후를 재면 같은 config 숫자가 **72배** 다른 뜻이 된다
    #   (능력치 +1 = 360일 → 마크에선 닷새 앉아 있으면 오른다). 그래서 마크는 제 낮밤을 **쓰지 않고**
    #   스냅숏의 world_day 를 읽는다. 봇이 꺼져 있으면(world_day = 0) **장부는 움직이지 않는다.**
    #   두 시계의 대조는 tools/clock_audit.py 가 지킨다.
    payload:
      player_uuid: "쌓은 자 (접합된 몸만 — 강호에 이름이 없으면 쌓을 장부가 없다)"
      player_name: "그때의 이름"
      realm: "마크가 알고 있던 경지 (대조용 — 봇의 값이 다르면 봇이 이긴다)"
      attr_days: "능력치 → 증분 (실수). Growth.pour 가 경지 캡까지만 부은 값"
      skill_days: "무공/과목 → 일치 증분 (실수). 초식 수련 + 실전 화후"
      naegong: "내공 증분 (실수 — 내공 '점'. 봇은 축기_원장(일치)의 역환산으로 되돌려 적는다)"
      train_days: "그날 몸에 실제로 들어간 일치 (버려진 몫 제외) → 봇의 화후_원장.
        ★ 범인 → 삼류의 관문이다 ('기초 단련 3개월' = 90일치). 과목이 무엇이든 몸은 단련된다"
      marks_실전: "실전 마크 증분 (정수) — ★ 봇의 승급 요건 '실전 마크 N' 을 채우는 값"
      marks_사선: "사선 마크 증분 (정수)"
    effects:
      sheet: 증분_적용            # characters.sheet_json 에 더한다 (능력치·기술·축기_원장·마크)
      cap: player_creation.attribute_cap_by_realm   # ★ 봇이 다시 조인다 — 마크의 경지가 낡았을 수 있다
      promote: cultivation.cultivation_stages       # 더한 뒤 promoteIfDue (승급은 강호가 인정한다)
      rumor: none                # 수련은 세계의 사건이 아니다 — 소문도 지역도 세력도 안 움직인다
      unlinked: 무시             # 접합되지 않은 몸의 화후는 적을 곳이 없다 (마크가 애초에 안 보낸다)

  surrender:
    desc: "자수(自首) — 관졸에게 웅크린 채 말을 걸었다. ★ 관의 법과 혈채는 **다른 법정**이다"
    payload:
      player_uuid: "자수한 몸"
      player_name: "그때의 이름"
      fine: "벌금 (MVT 가 그 자리에서 걷었다 — 문(文). 방이 안 붙었으면 0)"
    effects:
      # 관의 법 — 수치의 원천은 등록부다 (여기서 발명하지 않는다. 아래는 그 표를 옮겨 적은 배선값):
      #   mandate → faction_politics.yml authority_mandate.drains.자수 (-10)
      #             ★ 코드는 Politics.mandateDrain("자수") 로 **등록부에서 직접** 읽는다
      #   region  → npc_death.yml responses.자수.effect.민심 (+2)
      #             (npc_death.effects.region 이 민심 -1 을 여기 적어 둔 것과 같은 관행)
      mandate_drain: 자수          # faction_politics.yml authority_mandate.drains 의 키
      region:
        민심: 2
      # ★ 혈채는 **삭제되지 않는다** (faction_reaction.yml blood_debt.atonement.principle:
      #   "혈채는 삭제되지 않는다. 성격이 바뀔 뿐이다"). 자수는 현혈채의 **감쇠를 개시**할 뿐이다.
      #   그래서 목에 걸린 값(feedback.bounty)은 자수 한 번으로 내려가지 않는다 —
      #   내려가는 것은 법명분(feedback.wanted)이고, 그것이 관졸의 눈이다.
      blood_debt: 감쇠_개시                                            # blood_debt.atonement.inputs.자수
      rumor: none                                                     # 자수는 소문이 아니다 (관의 장부다)

  populace_quest:
    desc: "무명(無名)의 의뢰 — 게시판에 붙지 않는다. 사람이 소매를 붙잡는다 (populace.yml quests.rules)"
    payload:
      event: "발생 | 완료 | 만료"
      rule: "populace.yml quests.rules 의 키 (아이_실종 · 시신_수습 · 산길_대행 · 야간_순라_보조)"
      outcome: "success | fail_body | on_expire (발생이면 없음) — 봇은 이 칸으로 등록부를 집는다"
      issuer: "발주자 (populace.yml people 의 키 — 관계에서 자란다)"
      victim: "대상 무명 (없을 수 있다 — 소문·통행금지에서 자란 의뢰)"
      player_uuid: "수주자 (완료일 때)"
      player_name: ""
      irony: "★ 살해자가 유족의 의뢰를 완수했는가 — 혈교는 이것을 **자격**으로 읽는다"
    effects:
      # 지역 델타는 **봇이 populace.yml 을 읽어** 적는다 (MVT 는 결말의 이름만 보낸다):
      #   quests.rules.<rule>.<outcome>.region  — 민심 ±1 · 치안 ±1 · 경제 -1
      region: "npcs/populace.yml quests.rules.<rule>.<outcome>.region"
      favor: "npcs/populace.yml quests.rules.<rule>.killer_irony.blood_favor (irony=true 일 때 혈교)"
      rumor: none                  # 무명의 의뢰는 강호의 이야깃거리가 아니다 (마을의 일이다)
      ledger: 무명의뢰              # events.type — 자국은 남는다

  sparring:
    desc: "비무 — 죽이지 않는 싸움. 이겨도 죽지 않고, 져도 죽지 않는다"
    payload:
      winner_uuid: "이긴 자"
      winner_name: ""
      loser_uuid: "진 자 (NPC 면 없음)"
      loser_name: ""
      reason: "중상 | 항복 | 장외 | 시간"
      witnesses: "구경꾼 수"
    effects:
      rumor:
        tags: [무재, 무인, 비무]
        intensity: 1
        public_intensity: 2         # 구경꾼이 many 이상이면 (장터 비무는 이야깃거리다)
        accuracy_kind: 직접_목격
        subject_is_winner: true
        min_intensity_to_spread: 2

# ═══════════════ 되먹임 (봇 → MVT) ═══════════════
# 사실은 이벤트로 흐르고(순서·유실 금지), 상태는 스냅숏으로 흐른다(최신이 이긴다).
# 스냅숏은 재생할 필요가 없다 — 어제의 소문판을 다시 트는 것은 세계가 아니라 녹음이다.
feedback:
  world_state:
    world_day: "봇의 세계일 (마크의 낮밤과 별개 — 장부의 시간)"
    rumor_tags: "지금 살아 있는 소문의 태그 (Db.heard 유효강도 > 0)"
    populace_reactions: "위 태그를 populace.yml reactions 키로 옮긴 것 — Populace.rumor(tag, on)"
    region: "치안·경제·민심 (regions 표)"
    wanted: "수배 — mc_uuid × 법명분 게이지 (authority_mandate). 문턱을 넘으면 관졸이 적대한다"
    favor: "세력 우호 — mc_uuid × 세력 (faction_standing). 산문의 문이 열리고 닫힌다"
    links: "★ 신원 — mc_uuid → {character_id, name}. 접합된 몸만 여기 있다 (마크가 '나는 누구인가'를 읽는 곳)"
    discord: "★ 접속의 문 — {url, channel_id, guild_id}. 봇이 제 '접합:채널'·'접합:길드'(world_meta)로부터
      만든다. **마크는 이 URL 을 [혼천 접속] 클릭에 건다** (ClickEvent OPEN_URL — 허용 스킴은 http/https 뿐이다).
      아직 /혼천 접합문 을 치지 않았으면 이 칸은 없다 — 그러면 마크는 [코드 복사]만 띄운다 (지어내지 않는다)"
    bounty: "★ 현상금 — mc_uuid → 문(文). 혈채가 blood_debt.engine.bounty_min 을 넘으면 관이 방을 붙인다
      (금액은 economy.yml 의뢰_보수.고수_현상금 — 여기서 발명하지 않는다).
      ★ 혈채 수치 자체는 절대 내려보내지 않는다 (blood_debt.visibility: 내부) — 내려가는 것은 세계의 반응뿐이다"

    # ═══ 시트 — 마크의 몸에 실릴 캐릭터 (2026-07 접합 패스) ═══
    #
    # 이것이 없어서 **마크에는 캐릭터가 없었다**: SkillEngine.State.realm 은 "이류"로 **박혀 있었고**
    # (주석: "MVT 는 캐릭터 시트가 없다") 능력치는 전부 0.0 이었다. 그 귀결이 이것이다 —
    # 갓 접속한 몸은 Growth.attackBonus = +0 인데 같은 경지 NPC 는 realmAttr 로 표준치를 받는다.
    # **플레이어가 제 급의 산적보다 구조적으로 약했다.** 다리는 서 있었는데 시트만 안 실려 있었다.
    #
    # 내려가는 값은 전부 **절대값**이다 (증분이 아니다). 마크는 이것으로 제 거울을 덮어쓴다 —
    # 그래서 두 원장은 갈라질 수 없다. 없는 칸은 "봇이 모르는 값"이고 마크는 제 것을 지킨다.
    sheet: "mc_uuid → 시트 한 장. 접합된 산 자만 여기 있다"
    sheet_fields:
      realm: "경지 — ★ SkillEngine.State.realm 하드코딩 \"이류\" 가 서 있던 자리 (characters.realm)"
      attrs: "능력치 → 실수 (근력·민첩·체력·내공·감각·화술·지혜 — judgment.yml attributes)"
      naegong: "내공 실수치 — 내력 풀 = round(내공 × 3) (internal_energy.yml)"
      simbeop: "익힌 심법 (simbeop.yml id). null = 개화 전 — ★ null 도 진실이다 (내공 과목의 게이트)"
      primary_art: "주력 무공 — 초식 수련·승급 요건('주력 무공 숙련')이 쌓이는 곳"
      skill_days: "무공/과목 → 누적 일치 (실수). 레벨은 환산표로 파생 (PlayerLedger.levelOf)"
      marks_실전: "실전 마크 (승급 요건)"
      marks_사선: "사선 마크"
      money: "소지금 (문) — characters.wallet"

  # 소문 태그 → 행인 반응 (populace.yml reactions 의 키). 이것이 "도적 소문이 돌면 무명이 산길을 피한다"의 배선
  reaction_map:
    도적_소문: [도적, 치안]        # 둘 중 하나라도 살아 있으면 켠다
    열병_소문: [질병]

  # 수배 문턱 (faction_politics.yml authority_mandate.inputs 의 눈금을 그대로 읽는다 — 발명 금지)
  wanted:
    gauge_min: 8                   # 포두가 움직이는 값 (관졸 적대)
    disavowal_min: 10              # 강호의 절연 — 정파도 등을 돌린다 (murim_disavowal)
