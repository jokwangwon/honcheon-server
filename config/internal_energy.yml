# 내공 시스템 규칙 (기계 판독용)
# 기준 문서: docs/design/internal_energy.md
# 기의 이중 구조: 후천진기(자원 — 쓰고 회복) / 선천진기(근원 — 태우면 끝)

# ─── 선천진기 (先天眞氣) ───
innate_qi:
  starting_amount:
    유년_시작: 7
    소년_시작: 6
  natural_loss:
    at_age_16: -1
    per_10_game_years_after: -1
    stops_after: 개화          # 단전을 열면 자연 유실이 멈춘다
  uses:
    개화: { cost_by_simbeop_grade: [1, 3], effect: "단전 개방 — 심법 입문, 범인→삼류의 실체" }
    파벽: { cost: 1, effect: "경지 승급의 '깨달음' 재료 (절정+ 선택지, 실전 깨달음으로 대체 가능)" }
    연혼일격: { cost: 1, effect: "시전 1회를 경지 +1로 취급", price: "즉시 내상(중상 -2) + 내력 전소" }
    회생: { cost: 2, effect: "빈사 사망 위기 판정 자동 통과 1회", note: "빈사 상태는 유지" }
  restoration:               # 이 두 가지 외에 복원 불가
    대기연_영약: "+1~2"
    벌모세수: "화경+ 스승이 자신의 선천진기 1 소모 → 제자 +1 (은원 상속의 극한)"

# ─── 후천진기 (내력) ───
internal_energy:
  pool: "내공 능력치 × 3"     # combat.yml과 동일
  recovery:
    natural_per_segment_by_simbeop: [0.5, 2]   # 심법 등급별, 전투 밖에서만
    meditation_per_segment: "내공 × 1 (운기조식 — 무방비)"
    in_combat: 불가
  depleted:
    state: "내공 고갈 (판정 -2)"
    internal_skills: 시전_불가_아님_다운캐스트   # 3.4 참조

# 스킬 내력 소모 밴드
cost_bands:
  외공기: { cost: 0, desc: "몸과 무기만 — 육합검 1·2타, 기본 회피" }
  발경: { cost: 1, desc: "타격에 내력을 싣는다" }
  경신: { cost: [1, 2], desc: "보법·경공" }
  검기: { cost: [2, 3], desc: "기의 외부 발출" }
  강기: { cost: [4, 6], desc: "발출한 기의 응집" }
  오의: { cost: "내력 총량의 50% 이상", desc: "별도 설계" }

# 경지 게이트 — 기 운용 단계 (알아도 경지가 낮으면 시전 잠김)
realm_gates:
  삼류: [외공기, 발경]
  이류: [외공기, 발경]
  일류: [외공기, 발경, 경신]
  절정: [외공기, 발경, 경신, 검기]      # "검기에 내력" — cultivation.yml 정합
  화경: [외공기, 발경, 경신, 검기, 강기]
  현경: [외공기, 발경, 경신, 검기, 강기, 오의]
  생사경: [외공기, 발경, 경신, 검기, 강기, 오의, 창작_오의]

# 내력 부족 시 다운캐스트
downcast:
  rule: "시전 불가가 아니라 '맨 기술'로 나간다"
  loses: [무공_위력_보정, 특수_속성]
  keeps: [프레임_데이터]
  vfx: "이펙트 빈약화 — 상대가 고갈을 읽을 수 있다 (심리전)"
  emergency: "부족분을 선천진기 1 연소로 대체 가능 (연혼일격 규칙 — 내상 동반)"

# 주화입마 (독학 리스크의 실체 — training.yml 연동)
qi_deviation:
  trigger: "스승 없는 심법 수련의 위험 이벤트 (독학 효율 0.5의 대가)"
  effect: "내상(중상) + 내력 전소 + 확률적 선천진기 -1"
  simma: "금기 심법 실패 시 '심마' 성향 흔적 — 히든 루트 재료"
