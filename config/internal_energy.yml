# 내공 시스템 규칙 v2 (기계 판독용)
# 기준 문서: docs/design/internal_energy.md
# 삼원 구조: 선천진기(수명 — 전원 100년 균등) / 원기(생명력 — 보충 가능) / 후천진기(내력 — 자원)
# 두 개의 죽음: 원기 0 = 신체의 죽음 / 선천진기 0 = 수명의 죽음 (혼백 분리 — 노화 없이 온다)

# ─── 선천진기 (先天眞氣) — 수명 ───
innate_qi:
  total_at_birth: 100            # 년 단위. 최고수든 노괴든 갓난아이든 균등 — 재능과 무관
  passive_drain: "1/년 (사는 것 자체)"
  visibility: "본인도 모른다 — 생사경의 감각 또는 신의(神醫)의 진맥만 잔량을 읽는다"
  burn_uses:                     # 수명 연소 — 전부 비가역
    연혼일격: { cost_years: 3, effect: "시전 1회를 경지 +1로 취급", price: "즉시 내상(중상) + 내력 전소" }
    회생: { cost_years: 10, effect: "빈사 사망 위기 자동 통과 1회 (빈사 유지)" }
    파벽: { cost_years: 5, effect: "경지 승급 '깨달음' 재료 (선택지 — 실전 깨달음으로 대체 가능)" }
    연수_금기마공: { cost_years: [1, 5], effect: "수명을 장작으로 쓰는 마공 시전 (마공 분류 기준 ②)" }
    벌모세수: { cost_years: 10, by: "화경+ 스승", effect: "제자의 원기 그릇 대확장 + 잠력 개방" }
  restoration:
    대기연_영약: "+5~10년 — 유일한 복원 수단. 화경 노괴들이 영약을 찾는 이유"
    note: "회춘약·술법은 원기를 되돌릴 뿐 — 수명은 사 올 수 없다"
  note_개화: "단전 개방은 수명을 태우지 않는다 (원기·심법 회로의 문제). 심법 등급이 성공률·기간에 영향"

# ─── 원기 (元氣) — 생명력 ───
vitality:
  scale: [0, 100]
  bands:
    정상: { min: 80 }
    피로: { min: 50, penalty: -1 }          # time.yml 피로 규칙을 원기로 통합
    쇠약: { min: 20, penalty: -2, effects: [부상_자연회복_정지, 수련_효율_절반] }
    위독: { min: 1, effects: [행동_제한, 매일_악화_판정] }
    사망: { at: 0, note: "신체의 죽음" }
  replenish:
    수면: "+20 (밤 구간 휴식)"
    식사: "+5/일 상한"
    요양: "의원 요양 시 회복 배속"
  damage:
    중상: -15
    빈사: -30
    주화입마: -20
    질병_이벤트: 가변
    기아_불면: 누적
    노쇠: "연간 자연 감소 — 신체 나이별, 경지로 상쇄"
  wound_recovery: "combat.yml 치료 기간 × 원기 구간 배율 (쇠약이면 3배)"

  # 원기와 노화 — 무림인이 오래 사는 이유
  aging_and_realm:
    범인: "질병·노쇠로 원기 붕괴 — 대개 60~80세 사망 (100년 수명을 못 쓴다)"
    일류: "잔병 저항 (경미 질병 면역)"
    절정: "노쇠 손상 절반"
    초절정: "질병·디스크류 전면 면역 — 초인의 신체. 150세까지도 (원기가 버텨준 수명의 완주)"
    화경_이상: "노화 정체 — 원기 자연 감소 0, 외모가 멈춘다"

  # 원기 증폭 — 역혈(逆血) 계열의 정체 (생명력 증폭이지 수명 연소가 아니다)
  amplification:
    cost: 30
    effect: { 근력: +2, 체력: +2, 경직_저항: +1, 지속_중_상처_즉시_재생: true }
    appearance: "혈관·근육의 비정상적 팽창 — 생명력 증폭의 외형"
    aftermath: "종료 후 '쇠약' 구간으로 추락"
    abuse: "남용 시 원기 그릇 영구 손상 (최대치 -5씩)"
    extreme: "화경급 원기 운용: 잘린 사지 재생 — 원기 50+ 일시 소모"

# ─── 후천진기 (내력) — v1 유지 ───
internal_energy:

  # ═══ 2026-07 내력 수지 패스 — 「고수는 내력이 넘친다」 ══════════════════════════════
  # 병: 절정 고수(내공 3)의 내력 풀이 9였다. 검기 두름 유지비 1/합 → 27초면 기가 흩어졌다.
  #     그리고 두름 유지비도 '쓴 것'이라 조식이 안 돌았다 — 즉 **격을 두른 자는 영원히 숨을 못 골랐다.**
  #     무협에서 절정은 '검기의 경지'다. 검기를 27초밖에 못 두르는 자는 절정이 아니다.
  #     구조적 원인: 풀도 유지비도 회복도 전부 **내공에 선형**이었다. 선형은 절대 넘치지 않는다.
  # 약: 세 축을 동시에 고친다 —
  #     ① 풀 = 축기 '세월'에 비례 (선형 → 삼각수). 단계가 아니라 쌓은 시간이 단전의 크기다.
  #     ② 조식(전투 중 회복) = 내공에 비례 (상수 1 → 내공 × 1). 고수는 숨만 쉬어도 단전이 돈다.
  #     ③ 두름 유지비는 '태운 것'이 아니다 (upkeep_exempt) — 날에 기를 서리게 한 채로도 숨은 쉰다.
  #        태우는 것(발경·발출·경신·오의)만 숨을 막는다.
  # 결과: **넘치기 시작하는 자리 = 절정.** 조식(3/합) > 검기 두름 유지비(1/합) → 순수지 +2/합.
  #       검기는 하루 종일 두를 수 있고, 아까운 것은 '쏘는 것'(발출 3)뿐이다.
  #       일류(조식 1/합)는 여전히 발경 한 번에 한 합을 고른다 — 성장의 체감은 그대로다.
  # 불변: 격의 위력 축(combat.yml qi_power)은 손대지 않았다. 바뀐 것은 **수지**지 위력이 아니다.
  #       개화 직후(내공 0.33)의 풀 1, 일류(내공 1)의 풀 3 — 두 값 다 그대로다 (아래 pool_table).

  # 【내력 풀】 = round(축기_세월(내공) × pool_per_year)
  #   축기_세월(x) = x(x+1)/2 년 — cultivation.yml accumulation_cost("내공 n→n+1 = n년")의 누적이다.
  #   ★ 이 곡선은 발명이 아니라 **이미 등재된 표**다: simbeop.yml magong.baseline.table 이
  #     내공 1=1년 · 3=6년 · 5=15년 · 7=28년 · 9=45년 이라고 적어 두었다. 그대로 읽는다.
  #   ★ 왜 세월인가: 단전에 쌓이는 것은 '단계'가 아니라 앉아 있던 시간이다. 내공은 유일한 배증형
  #     능력치(simbeop.yml dantian) — 그릇이 배증형인데 그 안의 물만 선형인 것이 틀렸던 것이다.
  pool: "round(내공 실수치 × (내공 실수치 + 1) / 2 × 3)"
  pool_per_year: 3                 # 엔진 판독용 — 축기 1년치 = 내력 3
  pool_curve: 누적_축기_년수         # x(x+1)/2 — cultivation.yml accumulation_cost 의 누적 (엔진 분기 키)
  pool_table:                      # 검산용 (엔진은 위 두 키로 계산한다. 이 표는 사람의 눈을 위한 것)
    개화_직후_0.33: 1              # ★ 그대로 — 개화의 첫 몸은 여전히 발경 한 번이다
    일류_1: 3                      # ★ 그대로 — '한 합 태우고 한 합 고른다'의 리듬 보존
    이류상당_2: 9
    절정_3: 18                     # 구 9  → 검기를 두르고도 참격 6회를 품는 단전
    초절정_5: 45                   # 구 15
    화경_7: 84                     # 구 21
    현경_9: 135                    # 구 27
    생사경_10: 165                 # 구 30

  # 2026-07 정합 패스 — 운기조식이 자연 회복보다 손해였다.
  #   병: 자연 회복 0.5~2/구간 vs 운기조식 = 내공 × 1. 개화 직후(내공 0.33)의 운기조식은 0.33 —
  #       '무방비'라는 대가를 치르고 가만히 앉아 있느니만 못했다. 내공 0~3 구간(= 개화~절정, 게임의
  #       대부분)이 통째로 운기조식을 쓸 이유가 없는 구간이었다.
  #   약: ① 자연 회복 하향 [0.5, 2] → [0.25, 1] — 몸은 저절로 차지 않는다. 심법이 채운다.
  #       ② 운기조식에 하한(floor) 1 + 순도 배율 — 내공이 한 줌이어도 한 구간 앉으면 발경 한 번은 돌아온다.
  #   결과: 운기조식은 항상 자연 회복의 4배 이상(하급 심법 기준). 무방비의 값을 한다.
  #         개화 직후 내력 풀 1 = 운기 한 구간이면 만충. 자연 회복만으로는 하루(4구간)가 걸린다.
  #
  #   ★ 내력 수지 패스 — 운기조식도 풀에 비례한다 (구: 내공 × 순도).
  #     풀이 배증형이 된 이상 회복이 선형이면 화경은 **자기 단전을 채우는 데 보름이 걸린다.**
  #     '한 구간 = 풀의 1/4' 로 옮긴다 → **하루를 앉으면 누구든 만충이다** (하루 5구간 중 4구간 운기).
  #     경지가 올라도 '앉아야 하는 날 수'는 늘지 않는다 — 늘어나는 것은 한 번 앉아 얻는 양이다.
  recovery:
    natural_per_segment_by_simbeop: [0.25, 1]     # 하급 심법 0.25 ~ 상승 심법 1.0 (심법별 정의)
    meditation_per_segment: "max(round(내력_풀 × 0.25 × 순도), 1) (운기조식 — 무방비: 그 구간 행동 불가, 기습당하면 판정 -2)"
    meditation_pool_fraction: 0.25                 # 엔진 판독용 — 한 구간 = 풀의 1/4
    meditation_floor: 1                            # 엔진 판독용 — 심법이 있으면 최소 1/구간은 돈다
    meditation_purity_scaled: true                 # 배율 = simbeop.yml purity (순도가 회복 배율이다)

    # ─── 조식(調息) — 전투 중의 숨 (2026-07 정합 패스 ③) ───
    # 병: 개화 직후(내공 0.33 → 내력 풀 1)의 발경이 **전투당 한 번**이었다. 전투는 5~9합인데
    #     '개화의 보상'을 한 합에 다 쓰고 나머지 여덟 합을 빈손으로 친다 — 자원 관리가 아니라 형벌이다.
    #     그리고 규칙이 비대칭이었다: 봇의 NPC 는 라운드당 1씩 회복하고 있었다(하드코딩) —
    #     npc_combat.yml symmetry("NPC 자원 = 내력 풀·소모 밴드·다운캐스트 동일")가 거짓이었다.
    # 약: 운기조식(앉는 것)은 여전히 전투 중 불가. 대신 **조식**을 등록한다 —
    #     격을 싣지 않은 합에는 단전이 돈다. 초식은 외공이니까(cost_bands 외공기), 그 합의 호흡이 기를 채운다.
    # 결과: 개화 직후(풀 1)는 '한 합 태우고 한 합 고른다' — 7합 전투에서 발경 4회. 자원의 리듬이 생긴다.
    #       축기한 자(내공 1.0 → 풀 3)의 값은 '총량'이 아니라 **연발**이다 — 3합을 내리 태울 수 있다.
    #       내력의 축은 '몇 번 쓰나'에서 '얼마나 몰아 쓰나'로 옮겨간다. 그것이 축기의 의미다.
    in_combat:
      운기조식: 불가                 # 앉아서 하는 것 — 무방비다. 합 사이에 앉는 자는 없다
      조식:
        per_round: 1                 # 라운드당 회복량
        only_if_unspent: true        # 【조건】 그 합에 내력을 한 점도 쓰지 않았을 때만 (두름 유지비도 '쓴 것'이다)
        cap: 내력_풀                  # 풀을 넘지 않는다
        note: "격을 태운 합에는 단전이 돌지 않는다 — 태우기와 고르기는 같은 합에 못 한다"
        rationale: "이 조건이 규칙의 전부다. 조건 없이 라운드당 1이면 발경(코스트 1)은 공짜가 된다"
  depleted:
    state: "내공 고갈 (판정 -2)"
    internal_skills: 다운캐스트

# ─── 소모 밴드 ───
# 2026-07 정합 패스 ②: 밴드는 '유지비'와 '발출비'를 함께 담는다.
#   병: 검기 [2,3] 인데 검기_두름 유지비는 1, 강기 [4,6] 인데 검강_두름·호신강기 유지비는 2 —
#       정본(qi_manifestation)이 밴드 밖의 수치를 갖고 있었고, 엔진이 어느 쪽을 볼지 모호했다.
#   약: 밴드를 '그 격의 최저 유지비 ~ 최대 발출비'로 다시 정의한다. 하단 = 두름(유지), 상단 = 쏨(발출).
#   결과: 격의 코스트는 '무엇을 하느냐'로 갈린다. 두르는 것은 싸고, 쏘는 것은 비싸다.
#
# 【정본】 무공 초식은 내력을 쓰지 않는다 (skill_mechanics cost 0 = 외공 초식).
#   내력을 먹는 것은 '격'이다 — 초식에 발경·검기·강기를 얹는 순간 이 밴드의 코스트를 낸다.
#   예외: 절정+ 비전 초식은 검기를 품고 태어난다 (제왕검형·태극검 등 cost 3).
#   근거: 삼류·이류·일류의 내력 풀은 0~3 이다. 초식 자체가 내력을 요구하면 '배워도 못 쓰는 무공'이 된다
#         (앞 사이클의 발경 게이트 문제가 무공 단위로 재발했다 — 육합검 3타·매화보·금나수).
cost_bands:
  외공기: { cost: 0, desc: "몸과 무기만 — 전 무공의 초식 자체. 삼류·이류·일류의 전투는 여기서 완결된다" }
  발경: { cost: 1, desc: "타격에 내력을 싣는다 — 피해 +1 (개화의 첫 보상)" }
  경신: { cost: [1, 2], desc: "보법·경공 — 이동·회피에 기를 싣는다" }
  검기: { cost: [1, 3], desc: "기의 외부 발출 — 두름 유지 1/합, 발출(참격) 3" }
  강기: { cost: [2, 6], desc: "발출한 기의 응집 — 두름·호신 유지 2/합(전개 4), 발출(강기포) 6" }
  어검: { cost: "시전 4 + 유지 2/라운드", desc: "이기어검 — 채널링 (가장 비싼 상시기)" }
  오의: { cost: "내력 총량의 50% 이상", desc: "별도 설계" }
  # 형태(두름/쏨/두름-몸/부림)별 세분 코스트: qi_manifestation.yml forms — 본 밴드는 그 범위의 선언일 뿐

# ─── 경지 게이트 ───
# 결정 (2026-07 정합 패스, 안 (b)): 발경은 **일류**부터다.
#   이 세계의 내력은 '단전 개방(개화)' 이후에만 존재한다 (내공 0 → 내력 0 → 소모형 기술 시전 불가).
#   개화는 일류 승급 요건이므로, 삼류·이류에게 발경을 열어주는 것은 '장부에만 있는 권한'이었다.
#   → 삼류·이류 = 외공(外功)의 무인. 몸과 무기가 전부다. 개화가 그 둘과 일류를 가르는 분수령이고,
#     발경은 내력의 첫 소모처로서 그 분수령의 보상이 된다 (봇 배선과도 일치 — 발경은 개화 후에 열린다).
#   기각한 안: (a) 개화 전 '얕은 내공' 허용 → 삼원 구조(개화 = 단전 개방)의 근간을 흔든다.
#             (c) 개화를 이류로 앞당김 → 일류의 정의('개화한 몸')가 사라진다.
#   근거 문서: docs/design/internal_energy.md · docs/design/dantian_and_simbeop.md
realm_gates:
  삼류: [외공기]                                  # 내력 없음 — 몸과 무기만
  이류: [외공기]                                  # 내력 없음 — 기본기가 손에 붙었을 뿐
  일류: [외공기, 발경, 경신]                       # 개화 = 내력의 시작. 발경이 첫 소모처다
  절정: [외공기, 발경, 경신, 검기]
  초절정: [외공기, 발경, 경신, 검기, 오의_개안]   # 누락 수정 — "오의를 느끼기 시작" (ultimate_arts.yml)
  화경: [외공기, 발경, 경신, 검기, 강기, 오의]     # 완성 — 전투당 1회. 강기 = 검강·호신강기
  현경: [외공기, 발경, 경신, 검기, 강기, 어검, 오의]   # 자재 — 제한 해제. 어검 = 이기어검 (qi_manifestation.yml)
  생사경: [외공기, 발경, 경신, 검기, 강기, 어검, 심검, 오의, 창작_오의]   # 심검 = 무형검 — 창작 오의 연계

downcast:
  rule: "내력 부족 시 시전 불가가 아니라 '맨 기술'로 나간다 — 초식은 그대로 나가고 격만 벗겨진다"
  loses: [격_위력, 특수_속성]        # 무공 위력은 유지된다 (초식은 외공이니까) — 잃는 것은 격 위력(combat.yml qi_power)
  keeps: [프레임_데이터, 무공_위력]
  damage_note: "발경을 태우던 자가 고갈되면 피해 -1, 검기를 두르던 자는 -2. 판정 -2 와 별개다"
  vfx: "이펙트 빈약화 — 상대가 고갈을 읽을 수 있다 (심리전)"
  emergency: "부족분을 수명 연소로 대체 가능 (연혼일격 규칙 — '수명을 태우시겠습니까?')"

qi_deviation:
  trigger: "스승 없는 심법 수련의 위험 이벤트 (독학 효율 0.5의 대가)"
  effect: "내상(중상) + 내력 전소 + 원기 -20"
  simma: "금기 심법 실패 시 '심마' 성향 흔적 — 히든 루트 재료"

# ─── 마공 분류 기준 — 삼원 구조가 정의한다 ───
demonic_classification:
  is_demonic:
    - "① 타인의 원기·진기 약탈 (흡성 계열)"
    - "② 수명(선천진기)의 강제 연소 (연수 계열)"
  is_not_demonic:
    - "자기 원기의 증폭·재생 운용 — 역혈·재생 계열 자체는 마공이 아니다 (사도일지언정 마도는 아니다)"
  hyeolgyo_note: "혈교의 인신공양·흡혈 = ①+②의 극한 — 금기가 금기인 이유"
