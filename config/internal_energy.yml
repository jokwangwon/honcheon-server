# 내공 시스템 규칙 v2 (기계 판독용)
# 기준 문서: docs/design/internal_energy.md
# 삼원 구조: 선천진기(수명 — 전원 100년 균등) / 원기(생명력 — 보충 가능) / 후천진기(내력 — 자원)
# 두 개의 죽음: 원기 0 = 신체의 죽음 / 선천진기 0 = 수명의 죽음 (혼백 분리 — 노화 없이 온다)

# ─── 선천진기 (先天眞氣) — 수명 ───
innate_qi:
  total_at_birth: 100            # 년 단위. 최고수든 노괴든 갓난아이든 균등 — 재능과 무관
  passive_drain: "1/년 (사는 것 자체)"
  visibility: "본인도 모른다 — 생사경의 감각 또는 신의(神醫)의 진맥만 잔량을 읽는다"
  burn_uses:                     # 수명 연소 — 전부 비가역
    연혼일격: { cost_years: 3, effect: "시전 1회를 경지 +1로 취급", price: "즉시 내상(중상) + 내력 전소" }
    회생: { cost_years: 10, effect: "빈사 사망 위기 자동 통과 1회 (빈사 유지)" }
    파벽: { cost_years: 5, effect: "경지 승급 '깨달음' 재료 (선택지 — 실전 깨달음으로 대체 가능)" }
    연수_금기마공: { cost_years: [1, 5], effect: "수명을 장작으로 쓰는 마공 시전 (마공 분류 기준 ②)" }
    벌모세수: { cost_years: 10, by: "화경+ 스승", effect: "제자의 원기 그릇 대확장 + 잠력 개방" }
  restoration:
    대기연_영약: "+5~10년 — 유일한 복원 수단. 화경 노괴들이 영약을 찾는 이유"
    note: "회춘약·술법은 원기를 되돌릴 뿐 — 수명은 사 올 수 없다"
  note_개화: "단전 개방은 수명을 태우지 않는다 (원기·심법 회로의 문제). 심법 등급이 성공률·기간에 영향"

# ─── 원기 (元氣) — 생명력 ───
vitality:
  scale: [0, 100]
  bands:
    정상: { min: 80 }
    피로: { min: 50, penalty: -1 }          # time.yml 피로 규칙을 원기로 통합
    쇠약: { min: 20, penalty: -2, effects: [부상_자연회복_정지, 수련_효율_절반] }
    위독: { min: 1, effects: [행동_제한, 매일_악화_판정] }
    사망: { at: 0, note: "신체의 죽음" }
  replenish:
    수면: "+20 (밤 구간 휴식)"
    식사: "+5/일 상한"
    요양: "의원 요양 시 회복 배속"
  damage:
    중상: -15
    빈사: -30
    주화입마: -20
    질병_이벤트: 가변
    기아_불면: 누적
    노쇠: "연간 자연 감소 — 신체 나이별, 경지로 상쇄"
  wound_recovery: "combat.yml 치료 기간 × 원기 구간 배율 (쇠약이면 3배)"

  # 원기와 노화 — 무림인이 오래 사는 이유
  aging_and_realm:
    범인: "질병·노쇠로 원기 붕괴 — 대개 60~80세 사망 (100년 수명을 못 쓴다)"
    일류: "잔병 저항 (경미 질병 면역)"
    절정: "노쇠 손상 절반"
    초절정: "질병·디스크류 전면 면역 — 초인의 신체. 150세까지도 (원기가 버텨준 수명의 완주)"
    화경_이상: "노화 정체 — 원기 자연 감소 0, 외모가 멈춘다"

  # 원기 증폭 — 역혈(逆血) 계열의 정체 (생명력 증폭이지 수명 연소가 아니다)
  amplification:
    cost: 30
    effect: { 근력: +2, 체력: +2, 경직_저항: +1, 지속_중_상처_즉시_재생: true }
    appearance: "혈관·근육의 비정상적 팽창 — 생명력 증폭의 외형"
    aftermath: "종료 후 '쇠약' 구간으로 추락"
    abuse: "남용 시 원기 그릇 영구 손상 (최대치 -5씩)"
    extreme: "화경급 원기 운용: 잘린 사지 재생 — 원기 50+ 일시 소모"

# ─── 후천진기 (내력) — v1 유지 ───
internal_energy:
  pool: "round(내공 실수치 × 3)"   # 화후 규칙 — 내공 2.9 = 내력 9 (양자화 절벽 제거, simbeop.yml hwahu)

  # 2026-07 정합 패스 — 운기조식이 자연 회복보다 손해였다.
  #   병: 자연 회복 0.5~2/구간 vs 운기조식 = 내공 × 1. 개화 직후(내공 0.33)의 운기조식은 0.33 —
  #       '무방비'라는 대가를 치르고 가만히 앉아 있느니만 못했다. 내공 0~3 구간(= 개화~절정, 게임의
  #       대부분)이 통째로 운기조식을 쓸 이유가 없는 구간이었다.
  #   약: ① 자연 회복 하향 [0.5, 2] → [0.25, 1] — 몸은 저절로 차지 않는다. 심법이 채운다.
  #       ② 운기조식에 하한(floor) 1 + 순도 배율 — 내공이 한 줌이어도 한 구간 앉으면 발경 한 번은 돌아온다.
  #   결과: 운기조식은 항상 자연 회복의 4배 이상(하급 심법 기준). 무방비의 값을 한다.
  #         개화 직후 내력 풀 1 = 운기 한 구간이면 만충. 자연 회복만으로는 하루(4구간)가 걸린다.
  recovery:
    natural_per_segment_by_simbeop: [0.25, 1]     # 하급 심법 0.25 ~ 상승 심법 1.0 (심법별 정의)
    meditation_per_segment: "max(내공 × 순도, 1) (운기조식 — 무방비: 그 구간 행동 불가, 기습당하면 판정 -2)"
    meditation_floor: 1                            # 엔진 판독용 — 심법이 있으면 최소 1/구간은 돈다
    meditation_purity_scaled: true                 # 배율 = simbeop.yml purity (순도가 회복 배율이다)
    in_combat: 불가
  depleted:
    state: "내공 고갈 (판정 -2)"
    internal_skills: 다운캐스트

cost_bands:
  외공기: { cost: 0, desc: "몸과 무기만 — 육합검 1·2타, 기본 회피" }
  발경: { cost: 1, desc: "타격에 내력을 싣는다" }
  경신: { cost: [1, 2], desc: "보법·경공" }
  검기: { cost: [2, 3], desc: "기의 외부 발출" }
  강기: { cost: [4, 6], desc: "발출한 기의 응집" }
  어검: { cost: "시전 4 + 유지 2/라운드", desc: "이기어검 — 채널링 (가장 비싼 상시기)" }
  오의: { cost: "내력 총량의 50% 이상", desc: "별도 설계" }
  # 형태(두름/쏨/두름-몸/부림)별 세분 코스트: qi_manifestation.yml forms

# ─── 경지 게이트 ───
# 결정 (2026-07 정합 패스, 안 (b)): 발경은 **일류**부터다.
#   이 세계의 내력은 '단전 개방(개화)' 이후에만 존재한다 (내공 0 → 내력 0 → 소모형 기술 시전 불가).
#   개화는 일류 승급 요건이므로, 삼류·이류에게 발경을 열어주는 것은 '장부에만 있는 권한'이었다.
#   → 삼류·이류 = 외공(外功)의 무인. 몸과 무기가 전부다. 개화가 그 둘과 일류를 가르는 분수령이고,
#     발경은 내력의 첫 소모처로서 그 분수령의 보상이 된다 (봇 배선과도 일치 — 발경은 개화 후에 열린다).
#   기각한 안: (a) 개화 전 '얕은 내공' 허용 → 삼원 구조(개화 = 단전 개방)의 근간을 흔든다.
#             (c) 개화를 이류로 앞당김 → 일류의 정의('개화한 몸')가 사라진다.
#   근거 문서: docs/design/internal_energy.md · docs/design/dantian_and_simbeop.md
realm_gates:
  삼류: [외공기]                                  # 내력 없음 — 몸과 무기만
  이류: [외공기]                                  # 내력 없음 — 기본기가 손에 붙었을 뿐
  일류: [외공기, 발경, 경신]                       # 개화 = 내력의 시작. 발경이 첫 소모처다
  절정: [외공기, 발경, 경신, 검기]
  초절정: [외공기, 발경, 경신, 검기, 오의_개안]   # 누락 수정 — "오의를 느끼기 시작" (ultimate_arts.yml)
  화경: [외공기, 발경, 경신, 검기, 강기, 오의]     # 완성 — 전투당 1회. 강기 = 검강·호신강기
  현경: [외공기, 발경, 경신, 검기, 강기, 어검, 오의]   # 자재 — 제한 해제. 어검 = 이기어검 (qi_manifestation.yml)
  생사경: [외공기, 발경, 경신, 검기, 강기, 어검, 심검, 오의, 창작_오의]   # 심검 = 무형검 — 창작 오의 연계

downcast:
  rule: "내력 부족 시 시전 불가가 아니라 '맨 기술'로 나간다"
  loses: [무공_위력_보정, 특수_속성]
  keeps: [프레임_데이터]
  vfx: "이펙트 빈약화 — 상대가 고갈을 읽을 수 있다 (심리전)"
  emergency: "부족분을 수명 연소로 대체 가능 (연혼일격 규칙 — '수명을 태우시겠습니까?')"

qi_deviation:
  trigger: "스승 없는 심법 수련의 위험 이벤트 (독학 효율 0.5의 대가)"
  effect: "내상(중상) + 내력 전소 + 원기 -20"
  simma: "금기 심법 실패 시 '심마' 성향 흔적 — 히든 루트 재료"

# ─── 마공 분류 기준 — 삼원 구조가 정의한다 ───
demonic_classification:
  is_demonic:
    - "① 타인의 원기·진기 약탈 (흡성 계열)"
    - "② 수명(선천진기)의 강제 연소 (연수 계열)"
  is_not_demonic:
    - "자기 원기의 증폭·재생 운용 — 역혈·재생 계열 자체는 마공이 아니다 (사도일지언정 마도는 아니다)"
  hyeolgyo_note: "혈교의 인신공양·흡혈 = ①+②의 극한 — 금기가 금기인 이유"
