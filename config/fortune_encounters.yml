# 기연(奇緣) 시스템 규칙 및 청하현 배치 기연 (기계 판독용 — GM 전용, 플레이어 비노출)
# 기준 문서: docs/design/fortune_and_wanderer.md 3·5장
#
# ═══ 배선 상태 (2026-07 등록부 처분) ═══
# 엔진: server-bot Fortunes.java → Rules.fortunes → GameListener(탐방·밥 나눔).
#   ★ 2026-07 이전까지 이 파일은 **아무도 안 읽었다.** 봇은 관문을 자바 상수로 지어 갖고 있었고
#     (SHRINE_VISITS_REQUIRED=3 · GOOD_DEEDS_REQUIRED=2), 이 등록부는 30회·15건이라 적고 있었다 —
#     **정본이 둘이었고, 코드가 이겼다.** 이제 관문 수치는 아래 gate 절이 유일한 원천이다.
#   ★ prose 인 trigger 와 기계 판독인 gate 는 같은 수여야 한다 — lint_config 5 가 어긋나면 잡는다.
# 실배선: chuigeolgae_master (봇 `/혼천 탐방`).
# 미배선: sunken_ship_manual · fever_elder_legacy — 흑수나루·의방 무대가 봇에 열릴 때 gate 를 단다.
#         (무대가 없는데 관문만 다는 것은 또 하나의 죽은 규칙이다.)
# elixirs 절: 아직 엔진이 안 읽는다 — 소모 명령(복용)이 없다. 검산은 growth_audit 이 맡는다.
#         조건: 봇에 소지품·복용 흐름이 서면 그때 Fortunes.elixir(id) 를 연다.

# 5대 운영 규칙
rules:
  - "등록제: 이 파일에 등록된 기연만 존재한다. GM 즉석 발명 금지"
  - "1회성: 획득 즉시 세계에서 소모 — 공유 세계에서 선착순"
  - "시험 필수: 중기연 이상은 반드시 시험을 낸다 (조건 충족 = 자격이지 합격이 아님)"
  - "대가 필수: 중기연 이상은 반드시 대가·후폭풍을 갖는다"
  - "동시 1개: 플레이어당 진행 중 중기연 이상 1개"

grades:
  소기연: { reward_scale: "기술 +1, 단서, 소액 재물, 인연 태그", density: "지역당 여럿" }
  중기연: { reward_scale: "무공 비급, 심법 입문, 영약(능력치 +1), 사승 인연", density: "지역당 2~3개" }
  대기연: { reward_scale: "경지 벽 돌파 깨달음, 절세 비급, 신물", density: "지역권당 0~1개, 세계 공통 시간 연동" }

# ═══════════════════════════════════════════════════════════════════════════
# 영약(靈藥) 등록부 — 【정본】 combat.yml durability.elixir 가 여기를 가리키고 있었다
# ═══════════════════════════════════════════════════════════════════════════
# ★ 지금까지 이 등록부는 **없었다.** combat.yml 은 "economy/기연 등록제 — 체력 실수치 영구 +N" 이라
#   적어 두고, equipment.yml 은 "영약은 여기에 없다. 장비가 아니기 때문이다" 라고 적어 두었으나
#   **가리켜진 자리가 비어 있었다.** 이 절이 그 자리다 (docs/design/growth_axes.md).
#
# ★ 두 줄 규약 — 이것이 기연이 빌드를 무너뜨리지 않는 이유다:
#   ① 영약은 **화후를 준다** (시간을 산다). 능력치 실수치에 '일치(日値)'로 적립된다.
#      → 대환단 = 3년치 = 몰빵 수련 3년. 크지만 **다른 종류의 것이 아니다.**
#   ② 영약은 **경지 캡을 넘지 못한다** (player_creation attribute_cap_by_realm).
#      → 캡을 여는 것은 오직 경지다. "경지가 레벨이다" 의 마지막 못.
#      → 캡에 닿은 몸이 영약을 먹으면 화후는 **버려진다** (몸이 더는 못 받는다 — 그 서술이 곧 대가다).
elixirs:
  registry_rule: "등록제 — 여기 없는 영약은 존재하지 않는다 (양산 금지). 1회성 · 소모 시 세계에서 사라진다"
  unit: 일치                        # 능력치 화후의 단위 — training.yml attribute_progression (능력치 +1 = 360일치)
  realm_cap: "★ 넘지 못한다 — player_creation.yml attribute_cap_by_realm. 넘친 화후는 버려진다"
  equipment_cap_exempt: true        # 장비 캡(combat.yml durability.equipment_cap 4)에 계상되지 않는다 — 몸이 된 것은 벗을 수 없다

  catalog:
    소환단:                          # 小還丹 — 중기연 상당. 가장 흔한 '몸을 바꾸는 것'
      grade: 중기연
      grants: { 체력: 360 }         # 1년치 = 능력치 +1 (캡 미만일 때)
      note: "내구 +2 (체력 실수치 ×2). 중기연 reward_scale '영약(능력치 +1)' 의 기계 정의"
      price: "복용 후 3일 운기조식 필요 (약력을 흩으면 반이 날아간다) — 그 사흘 동안 세계는 흐른다"
    벽곡단:                          # 辟穀丹 — 소기연. 티끌이지만 티끌도 쌓인다
      grade: 소기연
      grants: { 체력: 90 }          # 3개월치 — 능력치 +1 의 1/4
      note: "1/4년치. 소기연의 값 — 배분 한 달을 벌어준다"
      price: []
    대환단:                          # 大還丹 — 대기연. 소림의 그것
      grade: 대기연
      grants: { 체력: 1080 }        # 3년치
      note: "★ 몰빵 수련 3년. 그래도 캡은 못 넘는다 — 절정(캡 7)의 몸이 아니면 다 담지 못한다"
      price: "세계 등록제 — 서버당 소수. 소지 자체가 소문 (강도 2)"
    세심단:                          # 洗心丹 — 눈을 씻는다
      grade: 중기연
      grants: { 감각: 360 }
      note: "심안 축의 영약 — 체력만 영약이 있으면 외공이 유일한 기연 수혜 축이 된다 (축 편향 방지)"
      price: "복용 후 하루 눈이 멀다 (감각 판정 불가 1일)"
    소요단:                          # 逍遙丹 — 발을 가볍게
      grade: 중기연
      grants: { 민첩: 360 }
      note: "신법 축의 영약"
      price: "약효 중 근력 판정 -1 (7일) — 가벼워진 몸은 무겁게 치지 못한다"

  # ─── 벌모세수(伐毛洗髓) — 영약이 아니다. 능력치를 주지 않는다 ───
  # internal_energy.yml innate_qi.burn_uses.벌모세수 가 정본 (화경+ 스승, 수명 -10년).
  # 주는 것은 '원기 그릇 확장 + 잠력 개방' — 축이 다르다. 여기 적는 것은 **혼동 방지**를 위해서다.
  beolmoseysu_note: "★ 능력치 화후 0. 스승이 제 수명 10년을 태워 제자의 그릇을 넓히는 것 —
    빌드의 지름길이 아니라 **빚**이다 (사승 인연의 무게). 능력치를 원하면 앉아서 수련하거나 영약을 먹어라"

# 조건 유형 (복수 AND)
trigger_types: [행동_이력, 상태, 장소_시간, 소지품, 명성_악명, 유년기_흔적]

# ─── 청하현 배치 기연 ───
encounters:
  chuigeolgae_master:
    name: "폐사당의 취걸개"
    grade: 중기연
    location: abandoned_shrine
    status: 미소모
    truth: "걸인 행세를 하는 은거 고수. 개방(추후 확장 세력)의 파문 장로 출신."
    # 2026-07 정합 패스 — 관문이 문턱이었다.
    #   구: 방문 3회 + 의뢰 2건 → 표준 플레이 3일차에 열렸다. '일류의 사실상의 관문'이라 부르면서
    #       아무 저항도 아니었다.
    #   신: 방문 30회 + 의뢰 15건 → 30일차. 취걸개는 사람을 한 달 지켜보고서야 입을 연다
    #       (trial 의 '사흘 굶기'는 그 다음이다 — 조건 충족은 자격이지 합격이 아니다).
    #   이래도 화후 관문(숙련 3 ≈ 308일)보다는 이르다. 개화는 '먼저 열리는 문'이고,
    #   일류를 늦추는 것은 몸에 붙는 시간이다 — 그게 정직한 순서다.
    trigger:
      - "폐사당 방문 30회 이상"
      - "선행 기억 태그 2개 이상 (지역 NPC 기준) — 봇 알파 배선: events 의뢰_완수 15건"
      - "이류 이하 (구: 삼류 이하 — 청하현 알파에서 일류 개화 경로의 유일한 심법 원천이라 확장)"
    trigger_bonus: "유년기 흔적 '눈치'(저잣거리 고아) 보유 시 방문 20회로 완화 (봇 알파 미배선 — 흔적 시트 키 후속)"
    # ★ 기계 정본 — 봇(Fortunes.java)이 읽는 관문. 위 trigger 산문의 수와 반드시 같다.
    gate:
      place: 폐사당              # 탐방 무대 (봇 `/혼천 탐방`)
      visits: 30                 # 누적 방문
      deed_event: 의뢰_완수      # '선행 기억 태그'의 알파 배선 — 이 이벤트의 누적 건수
      deeds: 15
      max_realm: 이류            # 이 경지 이하만 (cultivation_stages 사다리 기준)
    discovery: "조건 충족 후 폐사당 방문 시 자동 — 걸인이 먼저 말을 건다"
    trial:
      type: 선택_시험      # 판정이 아니라 인품을 본다
      streak_days: 3       # 기계 정본 — 사흘 '연속'
      content: "사흘 연속, 자기 몫의 밥을 나누는가. 시험임을 알려주지 않는다."
    reward:
      - "기초 내공심법 전수 (범인 → 삼류 승급 경로 개방)"
      - "개방 계열 인연 태그"
    # ★ 기계 정본 — 시험 통과 시 세계가 실제로 주는 것. 심법은 **id** 로 적는다 (simbeop.yml 등록부).
    grants:
      simbeop: hyeoncheon_tonapbeop    # 현천토납법 — 표시 이름은 simbeop.yml 이 준다
      tie: "개방_계열(취걸개)"
    price:
      - "이 인연을 발설하면 스승은 사라진다 (인연 단절)"
      - "스승의 옛 원수를 상속한다 (장기 떡밥 — 추후 사건 훅)"

  sunken_ship_manual:
    name: "흑수나루 침몰선의 비급"
    grade: 중기연
    location: heuksu_ferry
    status: 미소모
    truth: "수십 년 전 침몰한 장강수로채 배. 수공(水功) 비급이 방수 유통에 봉인되어 있다."
    trigger:
      - "흑수나루 괴담 소문 조사 (소기연 단서 경유)"
      - "잠수 시도 선언"
    discovery: "감각+조사 판정 vs 어려움(14) — 물속 침몰선 위치 특정"
    trial:
      type: 판정_시험
      content: "체력 판정 vs 어려움(14) — 숨과 물살. 실패 시 빈사 위험"
    reward:
      - "수공 계열 무공 비급 (독학 가능, 스승 불요)"
    price:
      - "public_use_rumor: 공개 사용 시 장강수로채가 출처를 캐묻는다 (faction_reaction 연동)"
      - "독학 부작용 위험 (스승 없는 수련 규칙)"

  fever_elder_legacy:
    name: "열병 노인의 유품"
    grade: 소기연
    location: medicine_shop
    status: 미소모
    truth: "열병으로 죽어가는 노인은 젊은 날 화산파 속가 제자였다."
    trigger:
      - "유문을 도와 열병 환자 간호 (열병 사건 비전투 루트 참여)"
    discovery: "간호 중 자동 — 노인이 마지막으로 검결을 읊는다"
    trial:
      type: 없음          # 소기연 — 간호 자체가 이미 시험이었다
    reward:
      - "화산파 고식 검결 절편 (불완전 — 수련 불가, 단서로만 기능)"
      - "진운/화산파 접촉 시 강력한 입문 단서 (매화 목패와 동급)"
    price: []
    design_note: "비전투 의원 루트에서 화산파 목표에 닿는 다리 — 루트 간 연결이 목적"
