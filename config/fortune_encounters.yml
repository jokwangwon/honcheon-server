# 기연(奇緣) 시스템 규칙 및 청하현 배치 기연 (기계 판독용 — GM 전용, 플레이어 비노출)
# 기준 문서: docs/design/fortune_and_wanderer.md 3·5장

# 5대 운영 규칙
rules:
  - "등록제: 이 파일에 등록된 기연만 존재한다. GM 즉석 발명 금지"
  - "1회성: 획득 즉시 세계에서 소모 — 공유 세계에서 선착순"
  - "시험 필수: 중기연 이상은 반드시 시험을 낸다 (조건 충족 = 자격이지 합격이 아님)"
  - "대가 필수: 중기연 이상은 반드시 대가·후폭풍을 갖는다"
  - "동시 1개: 플레이어당 진행 중 중기연 이상 1개"

grades:
  소기연: { reward_scale: "기술 +1, 단서, 소액 재물, 인연 태그", density: "지역당 여럿" }
  중기연: { reward_scale: "무공 비급, 심법 입문, 영약(능력치 +1), 사승 인연", density: "지역당 2~3개" }
  대기연: { reward_scale: "경지 벽 돌파 깨달음, 절세 비급, 신물", density: "지역권당 0~1개, 세계 공통 시간 연동" }

# 조건 유형 (복수 AND)
trigger_types: [행동_이력, 상태, 장소_시간, 소지품, 명성_악명, 유년기_흔적]

# ─── 청하현 배치 기연 ───
encounters:
  chuigeolgae_master:
    name: "폐사당의 취걸개"
    grade: 중기연
    location: abandoned_shrine
    status: 미소모
    truth: "걸인 행세를 하는 은거 고수. 개방(추후 확장 세력)의 파문 장로 출신."
    # 2026-07 정합 패스 — 관문이 문턱이었다.
    #   구: 방문 3회 + 의뢰 2건 → 표준 플레이 3일차에 열렸다. '일류의 사실상의 관문'이라 부르면서
    #       아무 저항도 아니었다.
    #   신: 방문 30회 + 의뢰 15건 → 30일차. 취걸개는 사람을 한 달 지켜보고서야 입을 연다
    #       (trial 의 '사흘 굶기'는 그 다음이다 — 조건 충족은 자격이지 합격이 아니다).
    #   이래도 화후 관문(숙련 3 ≈ 308일)보다는 이르다. 개화는 '먼저 열리는 문'이고,
    #   일류를 늦추는 것은 몸에 붙는 시간이다 — 그게 정직한 순서다.
    trigger:
      - "폐사당 방문 30회 이상"
      - "선행 기억 태그 2개 이상 (지역 NPC 기준) — 봇 알파 배선: events 의뢰_완수 15건"
      - "이류 이하 (구: 삼류 이하 — 청하현 알파에서 일류 개화 경로의 유일한 심법 원천이라 확장)"
    trigger_bonus: "유년기 흔적 '눈치'(저잣거리 고아) 보유 시 방문 20회로 완화 (봇 알파 미배선 — 흔적 시트 키 후속)"
    discovery: "조건 충족 후 폐사당 방문 시 자동 — 걸인이 먼저 말을 건다"
    trial:
      type: 선택_시험      # 판정이 아니라 인품을 본다
      content: "사흘 연속, 자기 몫의 밥을 나누는가. 시험임을 알려주지 않는다."
    reward:
      - "기초 내공심법 전수 (범인 → 삼류 승급 경로 개방)"
      - "개방 계열 인연 태그"
    price:
      - "이 인연을 발설하면 스승은 사라진다 (인연 단절)"
      - "스승의 옛 원수를 상속한다 (장기 떡밥 — 추후 사건 훅)"

  sunken_ship_manual:
    name: "흑수나루 침몰선의 비급"
    grade: 중기연
    location: heuksu_ferry
    status: 미소모
    truth: "수십 년 전 침몰한 장강수로채 배. 수공(水功) 비급이 방수 유통에 봉인되어 있다."
    trigger:
      - "흑수나루 괴담 소문 조사 (소기연 단서 경유)"
      - "잠수 시도 선언"
    discovery: "감각+조사 판정 vs 어려움(14) — 물속 침몰선 위치 특정"
    trial:
      type: 판정_시험
      content: "체력 판정 vs 어려움(14) — 숨과 물살. 실패 시 빈사 위험"
    reward:
      - "수공 계열 무공 비급 (독학 가능, 스승 불요)"
    price:
      - "public_use_rumor: 공개 사용 시 장강수로채가 출처를 캐묻는다 (faction_reaction 연동)"
      - "독학 부작용 위험 (스승 없는 수련 규칙)"

  fever_elder_legacy:
    name: "열병 노인의 유품"
    grade: 소기연
    location: medicine_shop
    status: 미소모
    truth: "열병으로 죽어가는 노인은 젊은 날 화산파 속가 제자였다."
    trigger:
      - "유문을 도와 열병 환자 간호 (열병 사건 비전투 루트 참여)"
    discovery: "간호 중 자동 — 노인이 마지막으로 검결을 읊는다"
    trial:
      type: 없음          # 소기연 — 간호 자체가 이미 시험이었다
    reward:
      - "화산파 고식 검결 절편 (불완전 — 수련 불가, 단서로만 기능)"
      - "진운/화산파 접촉 시 강력한 입문 단서 (매화 목패와 동급)"
    price: []
    design_note: "비전투 의원 루트에서 화산파 목표에 닿는 다리 — 루트 간 연결이 목적"
