# ★B-194 체험형 서장 — 무대 도면 「그날 밤」 (geunal_bam)
# 문법: 층별 도면 (1문자 = 1블록 · 위=북 · 왼쪽=서). ★이 도면이 좌표의 정본이다.
#   렌더 검수: python3 tools/stage_render.py geunal_bam  (평면도·입면·아이소메트릭 PNG)
#   조성 로더(MVT)는 다음 조각 — 도면을 눈으로 확정한 뒤 찍는다.
# 구조: 방(서북 모서리 — 마당집 문법: 방의 바깥벽이 곧 담이다) · 마당 · 우물(동) ·
#   담장 틈(동쪽 담 눈높이 한 칸) · 대문(남 — 문루 들보) · 골목 어귀(남쪽 어둠으로)

meta:
  name: 기억의 마을 — 그날 밤
  origin: [385, sea_level, -11]     # 좌상단 (col0, row0) 의 월드 좌표 — x=385+col · z=-11+row
  size: [30, 22]                    # 폭(x) × 깊이(z)
  world: honcheon_seojang           # 나룻배(원점)에서 안개 너머 — 1장 배에서 안 보인다
  # ★시간·빛 (사용자 확정 2026-07-31 — 쉐이더 활용: 쉐이더는 클라 것이지만 시간·광원은 서버가 쥔다)
  #   장면 시간은 플레이어별 시간(per-player time)으로 건다 — 서장 월드의 밤바다는 그대로 두고,
  #   기억 속의 그 사람에게만 그 시간을 보여 준다. 아침 벌(견문·수행_파견)에서 쉐이더 햇살이 산다.
  시간: 자정                          # 그날 밤 — 달빛 (midnight 18000)
  lights:                            # 연출 광원 (분위기 렌더 + 조성 시 실광원 후보) 【제안】
    - [28, 8, fire]                  #   담장 틈 밖 — 습격의 화광이 새어 드는 자리 (담 너머 한 칸)
  # ★★격리 (사용자 확정 2026-07-31 「여러 명이 같이 들어갔을 때 충돌이 없어야 한다」):
  #   **무대는 하나, 사람은 서로에게 없다.** 공유되는 것은 블록뿐이고 블록은 장면 중 안 변한다.
  #   · 서로의 몸 = 상호 은신+충돌 오프 (Voyage.veil 문법 — 나룻배에서 검증됨)
  #   · 파티클·소리·속삭임·시간 = 전부 플레이어별 송출 (spawnParticle(receiver)·playSound(p)·개인 시간)
  #   · 식구 NPC = 1인당 1마리, setVisibleByDefault(false)+본인만 표시, 장면 끝에 제거
  #   · 행동 감지·장면 상태 = 플레이어별 상태 기계
  #   · 블록 변화 연출이 필요해지면 = sendBlockChange (그 사람 눈에만 — 실블록 무변경)
  격리: 무대_하나_사람은_서로에게_없다
  # ★1인칭 시점 (tools/stage_pov.py — 게임 시점 근사 · 접속 없이 실플레이 구도를 본다)
  #   pos = [col, y, row] (눈높이 = 바닥+1.62 ≈ 2.6) · yaw: 0=동 90=남 180=서 270=북
  pov_views:
    방안_문쪽: { pos: [6.5, 2.6, 6.5], yaw: 20, pitch: -4 }      # 깨어난 자리에서 방문 쪽
    방안_이부자리: { pos: [9.0, 2.6, 6.0], yaw: 205, pitch: -10 }  # 문가에서 이부자리 돌아보기
    마당_대문쪽: { pos: [13.5, 2.6, 5.0], yaw: 80, pitch: -4 }    # 마당에서 대문·골목 쪽
    담장_틈앞: { pos: [24.0, 2.6, 8.5], yaw: 0, pitch: 0 }        # 틈 앞 — 화광이 새어 드는 곳

legend:
  ".": air
  "_": podzol                       # 맨땅 (밤의 흙)
  "p": dirt_path                    # 디딤길
  "P": spruce_planks                # 방 (바닥·벽)
  "L": dark_oak_log                 # 기둥·문설주
  "S": dark_oak_slab                # 담장 갓·지붕
  "#": mud_bricks                   # 흙담
  "m": mossy_cobblestone            # 우물돌
  "W": water                        # 우물물
  "w": white_carpet                 # 이부자리
  "r": red_carpet                   # 베개
  "l": soul_lantern                 # 등잔 (낮게 탄다)
  "F": spruce_fence                 # 골목 등롱대 (불은 없다 — 그날 밤이니까)
  "j": decorated_pot                # 장독 (살림의 흔적 — 마당 서남)
  "B": "minecraft:chest[facing=west]"   # 궤짝 — ★barrel 금지 (팩이 barrel 을 가구 모델로 덮는다:
                                        #   모델이 큐브를 안 채워 이웃 벽면이 컬링돼 뚫려 보인다 — 실측 2026-08-02)
  # ★"i"(light 블록) 묘비 (2026-08-02): 방 밝기용으로 심었다가 **유령 벽의 범인**으로 판명 —
  #   모드팩 렌더러(Sodium 계열 — 쉐이더 OFF 여도 남는다)가 light 블록 주변 면을 잘못 컬링해
  #   벽이 투명하게 뚫려 보였다 (실측 스샷 2장의 유령 좌표 = light 자리 정확히 일치).
  #   방 밝기는 밤눈(플레이어 효과)이 담당한다. **light 블록을 다시 심지 마라.**
  "D": "minecraft:spruce_door[facing=east,half=lower]"
  "U": "minecraft:spruce_door[facing=east,half=upper]"
  "G": "minecraft:dark_oak_fence_gate[facing=south,open=true]"
  "T": "minecraft:dark_oak_trapdoor[facing=south,open=true,half=top]"   # 벽장 반열림

# 세 자리 (enactment.spots 순서와 1:1) + 깨어나는 자리 — [col, row] (y = 바닥 위)
spots:
  이부자리_뒤: [3, 4]                # 아이 이부자리 뒤 그늘 (서쪽 벽 밑)
  담장_틈: [26, 8]                  # 동쪽 담 안쪽 — 틈으로 밖이 보인다
  식구_머리맡: [5, 8]                # 식구 이부자리 베개 옆
  깨어남: [6, 6]                    # 방 한가운데 — 암전 뒤 여기서 눈을 뜬다
  식구_NPC: [7, 8]                  # 식구가 누운 자리

