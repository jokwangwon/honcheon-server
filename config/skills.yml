  #   · 무상 전수 1개 + 나머지는 대가 (sect_life.yml lineage_transmission)
  #
  # 【수치로 다르다 — 이름만 다르면 그건 하나의 무공이다】
  #   문파의 지문은 히트박스·프레임·간격·경직·쿨다운에 있다:
  #     점창(쾌검)  프레임 [2,1,3] · 사거리 2.6 · 4타 · 입력창 6   — 전 계보 최속
  #     종남(중검)  프레임 [13,4,16] · 사거리 6.5 · 2타 · 슈퍼아머 — 전 계보 최중
  #     남궁(장검)  선(線) 7.5 — 최장 리치       · 곤륜(경공) 거리 10 — 최장 이동
  #     팽가(도)    파격 + armor_pierce          · 해남(역수) 패링 유예 -2 + 카운터 0.5
  #     소림(권)    슈퍼아머 + 리치 2.4(최단)    · 무당(유검) 패링 창 + 반격
  #     당가(암기)  사거리 18 + 다단             · 청성(능풍) 돌진 결합
  #     곤륜(무성무색) **텔레그래프 없음** — 전 무공 중 유일

