  # ══════════════════════════════════════════════════════════════════════════════
  # 절기(絶技) — 이름 붙은 초식
  # ══════════════════════════════════════════════════════════════════════════════
  # 무공(武功)은 '손에 익히는 결'이고, 절기는 그 결에서 **피어나는 한 수**다.
  # 육합검·매화검법은 무공이다. 매화참·매화낙수는 절기다 — 매화검법을 치던 손에서만 핀다.
  #
  # 【위계】 기본 무공(입문·삼류) → 본산 무공(이류·일류) → **절기(전수받는 것)**
  #   절기는 배우는 것이 아니라 **전수받는 것**이다 — 어미 무공의 숙련(requires_skill)이 문턱이고,
  #   그 위에 문파의 판단(acquisition)이 또 하나의 문이다. 비급만으로는 열리지 않는 것이 있다.
  #
  # 【절기는 위력을 사지 않는다 — 상황을 산다】 (밸런스 정본)
  #   combat.yml technique_power 는 **등급**이 정한다 (일류급 1 · 절정급 2). 절기라고 더 아프지 않다:
  #   매화참의 무공 위력은 어미인 매화검법과 **같다**. 절기가 파는 것은 피해가 아니라
  #   ① 히트박스의 모양·사거리 ② 프레임 ③ 경직 ④ 격 라이더 ⑤ 부수 효과 ⑥ **발동 조건**이다.
  #   → 그래서 절기를 아무리 늘려도 TTK(3~20합)는 움직이지 않는다. 전투는 여전히 5~9합이다.
  #
  # 【시전 체계 — 삼문(三門)】 정본은 skill_mechanics.yml cast_gate. 설계는 docs/design/skill_catalog.md.
  #   절기는 '쿨다운이 돌면 누르는 버튼'이 아니다. 세 문이 동시에 열려야 나간다:
  #     承(승) — 어미 무공의 지정 타 직후 창(窓) 안 · 間(간) — 간격 · 虛(허) — 상대의 허
  #   쿨다운과 내력은 **과금**이지 발동의 주역이 아니다.

  # ─── 화산파 — 매화검법 계열 (매화만개 오의로 이어지는 사다리) ───
  maehwa_cham:
    name: "매화참"
    category: "검법"
    weapon_class: 검
