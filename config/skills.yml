  # ══════════════════════════════════════════════════════════════════════════════
  # 문파 무공 계보(系譜) — 하급 → 중급 → 상급
  # ══════════════════════════════════════════════════════════════════════════════
  # 원천: 사용자 노션 설계 (15문파 실명 계보). 설계 문서: docs/design/sect_lineage.md
  #
