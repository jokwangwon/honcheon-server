    requires_skill: { id: maehwa_geombeop, mastery: 3 }
    acquisition: "내문 제자 — 매화검법을 손에 익힌 뒤 사부가 '한 수'를 내준다 (비급 없음. 사람이 준다)"
    bloodline_restricted: false
