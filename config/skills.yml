# 혼천 서버 무공 카탈로그
# 기준 문서: docs/design/text_rpg_design.md 7장 (무공 시스템)
#
# 주의: 과거의 원소 문파 스킬(풍보/화구/석피/수치 등)은 잘못 생성된 설정으로 폐기됨.
#
# 무공은 단순 이름 목록이 아니라 데이터 단위로 관리한다.
# 무공은 전투 기술인 동시에 "신분과 출신을 드러내는 장치"다.
# 공개 사용 시 소문이 생기고 세력 반응으로 이어질 수 있다.

# 무공 데이터 스키마 (모든 무공 공통 필드)
schema:
  id: "무공 ID"
  name: "무공명 (고유 명칭 사용. '화산기초검' 같은 범용 명칭 금지)"
  category: "분류 (검법/도법/경공/심법/독공/의술 ...)"
  weapon_class: "【정본】 이 무공이 실리는 무기 계열 — combat.yml weapon_power 등록 키. '무관' = 무기 불문(경공·신법·은신·의술·심법). 리스트면 어느 쪽에나 실린다"
  sub_category: "하위 분류"
  grade: "등급"
  tier: "【계보 층위】 하급·중급·상급 — 문파 무공 트리의 칸 (docs/design/sect_lineage.md).
         없으면 계보 밖(입문 무공·잡가·절기·NPC 표본). 경지 게이트: 하급=이류 · 중급=일류 · 상급=절정.
         오의는 이 축에 없다 — 오의는 무공이 아니라 ultimate_arts.yml 의 별도 층이다 (요구 경지 화경)"
  lineage: "【계보】 이 무공이 속한 문파 계보의 id (같은 lineage 안에서만 하급→중급→상급이 이어진다).
            한 문파가 두 계보를 가질 수 있다 — 당가는 암기(정계보)와 독(곁가지)이 따로다"
  faction: "소속 세력"
  required_realm: "요구 경지 (삼류~생사경)"
  required_stats: "요구 능력치"
  required_mastery: "선행 무공 요구 숙련 (0~10 — mastery_ladder 스케일)"
  requires_skill: "선행 무공 (기계 판독 — { id, mastery }). required_mastery > 0 이면 반드시 있어야 한다 — 주석에 적힌 선행은 규칙이 아니다"
  mastery_gate: "【상급 전용】 '본래 위력'의 조건 — { 하급: 6, 중급: 6 }. 미달 시 skill_mechanics 의
                 degraded 규약(격 다운캐스트 + 특수 속성 미발현 + 후딜 1.5배 + 절기 봉쇄)이 걸린다.
                 배울 수는 있다. 다만 제 힘이 안 난다 (노션 원칙의 수치화 — docs/design/sect_lineage.md 3장)"
  sole_transmission: "일인전승 여부 — true 면 문파에 단 한 사람만 보유한다 (장문·방주). sect_life.yml succession_ladder"
  action_data: "히트박스·프레임·경직·쿨다운·코스트 = skill_mechanics.yml skills[id] (2층 구조 — 카탈로그 30종 전수 정의)"
  cost_policy: "【정본】 초식 자체는 내력을 쓰지 않는다 (cost 0). 내력을 먹는 것은 격이다 — 예외는 절정+ 요구 비전 초식(cost 3)뿐 (combat.yml internal_energy.skill_cost_rule)"
  acquisition: "습득 조건"
  bloodline_restricted: "혈통 제한 여부"
  requires_master: "스승 필요 여부"
  requires_manual: "비급 필요 여부"
  side_effects: "부작용 여부"
  public_use_rumor: "공개 사용 시 소문 여부"
  faction_reaction: "세력 반응 여부"

# ─── 무기 계열 ↔ 무공 결합 (【정본】 — 코드가 config 보다 앞서지 않는다) ───
# MVT SkillListener 의 SKILL_BY_WEAPON_CLASS 는 이 표를 읽어야 한다 (하드코딩 금지).
# 위력 수치는 combat.yml damage.weapon_power — 여기는 '어떤 무공이 어떤 병장기에 실리는가'만.
weapon_classes:
  registry: [맨손, 권갑, 암기, 겸, 단검, 봉, 활, 검, 도, 창, 월아산, 구, 중병기, 부]
  unarmed_family: [맨손, 권갑]     # 권갑은 맨손의 연장 — 권법·장법·박투·금나술·독공이 그대로 실린다
  rule: "무공은 자기 weapon_class 의 병장기를 들었을 때만 온전히 나간다. 다른 병장기를 들면 다운캐스트('맨 기술')"
  unarmed_rule: "【사용자 지시】 권법을 배운 자는 무기를 들지 않아도 초식이 나간다 — 맨손이 곧 그 무공의 병장기다"
  default_by_category:
    검법: 검
    도법: 도
    창법: 창
    봉법: 봉
    단검술: 단검
    암살술: 단검
    권법: [맨손, 권갑]
    장법: [맨손, 권갑]
    박투: [맨손, 권갑]
    금나술: [맨손, 권갑]
    독공: [맨손, 권갑]
    궁술: 활
    암기: 암기
    합격진: 검
    경공: 무관
    신법: 무관
    은신술: 무관
    의술: 무관
    심법: 무관

martial_arts:
  # ─── 화산파 입문 무공 ───
  # 기초 무공이라도 문파의 철학과 상위 무공으로 이어지는 고유 명칭을 쓴다.
  yukhap_geom:
    name: "육합검"
    category: "검법"
    weapon_class: 검   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "입문 검법"
    grade: "삼류"
    faction: hwasan
    required_realm: "삼류"
    required_stats:
      근력: 2
      민첩: 2
    required_mastery: 0
    acquisition: "화산파 입문 후 외문 제자 과정에서 전수"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: true      # 공개 사용 시 화산파 제자로 인식됨
    faction_reaction: false

  maehwa_bo:
    name: "매화보"
    category: "경공"
    weapon_class: 무관   # 무기와 무관한 계열 (피해 공식 밖 또는 무기 불문)
    sub_category: "보법"
    grade: "이류"
    faction: hwasan
    required_realm: "삼류"
    required_stats:
      민첩: 3
    required_mastery: 2         # 육합검 숙련 2 (0~10 스케일 정규화)
    requires_skill: { id: yukhap_geom, mastery: 2 }   # 선행 무공 — 기계 판독 필드 (주석이 아니라 규칙이다)
    acquisition: "육합검 일정 숙련 후 사부 판단으로 전수"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: true
    faction_reaction: false

  # 정심검결(jeongsim_geomgyeol)은 **심법**이다 → 정본은 simbeop.yml simbeop.jeongsim_geomgyeol.
  # 무공 카탈로그의 중복 등재를 폐기한다 (단일 id 공간 — skill_mechanics 참조가 어느 쪽인지 몰랐다).
  # 액션 데이터(패링 태세)는 skill_mechanics.yml jeongsim_geomgyeol 이 그대로 갖는다.

  # ─── 세가 무공 예시 ───
  namgung_jehwang_geom:
    name: "제왕검형"
    category: "검법"
    weapon_class: 검   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "세가 비전 (상급 — 혈족의 검. 계보의 곁이 아니라 위다)"
    grade: "절정"
    tier: 상급
    lineage: namgung_geom
    faction: namgung
    required_realm: "절정"
    required_stats:
      근력: 5
      지혜: 4
    required_mastery: 6         # 선행 검법 대성 (0~10 스케일 정규화)
    requires_skill: { id: changgung_geom, mastery: 6 }   # 선행 무공 — 기계 판독 필드 (주석이 아니라 규칙이다)
    # 【본래 위력】 하급(창궁검법) 대성 6 — 혈족의 검이라 중급을 건너뛴다. 그 대신 하급을 더 깊이 요구한다
    mastery_gate: { 하급: 6 }
    acquisition: "남궁세가 직계 혈족 또는 세가주의 특별 허락"
    bloodline_restricted: true
    requires_master: true
    requires_manual: true
    side_effects: false
    public_use_rumor: true      # 공개 사용 시 "남궁세가 혈족인가? 도둑 배움인가?" 소문 발생
    faction_reaction: true      # 남궁세가가 출처를 조사하러 나설 수 있다

  geumna_su:
    name: "금나수"
    category: "금나술"
    weapon_class: [맨손, 권갑]   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "관절기·포박"
    grade: "이류"
    faction: sorimsa          # 속가로도 퍼진 실전 기예 — 출처 소문은 약함
    required_realm: "이류"
    required_stats:
      근력: 3
      민첩: 3
    required_mastery: 0            # 선행 없음 — 널리 퍼진 실전 기예 (문파 계보를 타지 않는다)
    acquisition: "소림 속가 또는 관군 교두에게 사사"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: false    # 널리 퍼진 기예 — 문파 지문이 아니다
    faction_reaction: false
    # 액션 데이터: skill_mechanics.yml geumna_su (파격 — 가드·패링 관통)

  # ─── 사파 / 금기 무공 예시 ───
  # 혈기심공(hyeolgi_simgong)도 **심법**이다 → 정본은 simbeop.yml simbeop.hyeolgi_simgong
  # (capacity 10 · purity 0.8 · method 흡성 · demonic true). 무공 카탈로그 중복 등재 폐기.

  # ═══ 첫 시즌 확장 (G6) — 청하현 중심: 민간·낭인 공용 → 인접 세력 순 ═══
  # 표기: required_stats 인라인, required_mastery = 선행 무공 숙련 (0~10)

  # ─── 민간·낭인 공용 (스승 = 퇴역 무사·사냥꾼·군문 출신 — 어디서나 배울 길이 있다) ───
  taejo_jangkwon:
    name: "태조장권"
    category: "권법"
    weapon_class: [맨손, 권갑]   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "기본 권각"
    grade: "입문"
    faction: mingan
    required_realm: "범인"
    required_stats: { 근력: 2 }
    required_mastery: 0
    acquisition: "퇴역 무사·표사 등 유경험자 사사 (가장 흔한 첫 무공)"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: false
    faction_reaction: false

  cheolsan_go:
    name: "철산고"
    category: "박투"
    weapon_class: [맨손, 권갑]   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "몸통 부딪히기"
    grade: "삼류"
    faction: mingan
    required_realm: "삼류"
    required_stats: { 근력: 3, 체력: 3 }
    required_mastery: 0
    acquisition: "씨름꾼·군문 출신 사사"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: false
    faction_reaction: false

  yeopho_gungsul:
    name: "엽호궁술"
    category: "궁술"
    weapon_class: 활   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "수렵 궁술"
    grade: "삼류"
    faction: mingan
    required_realm: "범인"
    required_stats: { 감각: 3 }
    required_mastery: 0
    acquisition: "사냥꾼 사사 (덫·사냥 기술과 병행 관례)"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: false
    faction_reaction: false

  ohodanmun_chang:
    name: "오호단문창"
    category: "창법"
    weapon_class: 창   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "표국 창술"
    grade: "이류"
    faction: pyoguk
    required_realm: "삼류"
    required_stats: { 근력: 3 }
    required_mastery: 0
    acquisition: "표국 입사 후 표두 사사"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: false
    faction_reaction: false

  hwalin_chimbeop:
    name: "활인침법"
    category: "의술"
    weapon_class: 무관   # 무기와 무관한 계열 (피해 공식 밖 또는 무기 불문)
    sub_category: "침구·응급"
    grade: "이류"
    faction: uiga
    required_realm: "범인"
    required_stats: { 지혜: 4, 감각: 3 }
    required_mastery: 0
    acquisition: "의원 사사 (유문 계열 — 열병 사건 연결 훅)"
    bloodline_restricted: false
    requires_master: true
    requires_manual: true
    side_effects: false
    public_use_rumor: false
    faction_reaction: false

  # ─── 하오문·뒷골목 ───
  biyeon_dangeom:
    name: "비연단검술"
    category: "단검술"
    weapon_class: 단검   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "속검"
    grade: "삼류"
    faction: haomun
    required_realm: "삼류"
    required_stats: { 민첩: 3 }
    required_mastery: 0
    acquisition: "하오문 연줄 사사 (돈보다 신용을 요구한다)"
    bloodline_restricted: false
    requires_master: true
    requires_manual: false
    side_effects: false
    public_use_rumor: false
    faction_reaction: false

  gwisik_sul:
    name: "귀식술"
    category: "은신술"
    weapon_class: 무관   # 무기와 무관한 계열 (피해 공식 밖 또는 무기 불문)
    sub_category: "기식 은폐"
    grade: "이류"
    faction: haomun
    required_realm: "이류"
    required_stats: { 감각: 4 }
    required_mastery: 0
    acquisition: "하오문 상급 연줄 또는 살막 방계 비급"
    bloodline_restricted: false
    requires_master: false
    requires_manual: true
    side_effects: false
    public_use_rumor: false      # 들키지 않는 것이 본체다
    faction_reaction: false

  # ─── 화산파 (기존 3종 위 확장) ───
  maehwa_geombeop:
    name: "매화검법"
    category: "검법"
    weapon_class: 검   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "본산 검법 (중급)"
    grade: "일류"
    tier: 중급
    lineage: hwasan_geom
    faction: hwasan
    required_realm: "일류"
    required_stats: { 민첩: 4, 지혜: 3 }
    required_mastery: 5          # 낙영검법(하급) 숙련 5 — 계보 게이트 (하위 5 미만이면 상위 불가)
    requires_skill: { id: nagyeong_geom, mastery: 5 }   # 선행 무공 — 기계 판독 필드 (주석이 아니라 규칙이다)
    acquisition: "내문 제자 승급 후 전수 (비급각 2층)"
    bloodline_restricted: false
    requires_master: true
    requires_manual: true
    side_effects: false
    public_use_rumor: true       # 매화 검영 — 화산의 지문
    faction_reaction: true
    # 계열 오의: 매화만개 (ultimate_arts)

  maehwa_geomjin:
    name: "매화검진"
    category: "합격진"
    weapon_class: 검   # 무기 계열 — combat.yml weapon_power 등록 키 (config가 정본. 코드가 앞서지 않는다)
    sub_category: "검진 (2~5인)"
    grade: "절정"
    faction: hwasan
    required_realm: "일류"
    required_stats: { 지혜: 4 }
    required_mastery: 3          # 매화검법 숙련 3 (전 성원)
    requires_skill: { id: maehwa_geombeop, mastery: 3 }   # 선행 무공 — 기계 판독 필드 (주석이 아니라 규칙이다)
    acquisition: "진전 제자 이상, 진법 구결은 장로 전수 (party.yml 합격진 정합)"
    bloodline_restricted: false
