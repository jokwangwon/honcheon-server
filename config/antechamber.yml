# 입도진(入道津) — 강호에 들기 전에 서는 자리
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 나루인가
#
#   world_map.yml 이 이미 답을 적어 뒀다:
#     · 2211행  흑수나루: { pos: [118, 12], bearing: "동 — 강가", terrain: 물가 }
#     · 1518행  "★ 흑수나루가 이 물길의 한 점이다 — 청하현이 왜 나루를 갖는가의 답"
#
#   나루는 이 세계가 이미 가진 **문지방**이다. 강호에 든다는 것은 강을 건너는 것이고,
#   건네주는 것은 사공이다. 그리고 **사공은 이름 없는 자를 태우지 않는다.** 문은 배다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 습지(濕地)인가 — ★ 2차 개정. 사용자가 실제로 들어가 보고 말했다:
#
#   "필드가 너무 디자인이 없음 · 조명도 너무 균일 · **어떻게 어느 방향으로 무엇을 언제 봐야 하는지
#    흐름이 없음** · 한마디로 너무 난잡함 · **한 길을 해서 따라갈 수 있게**"
#
#   1차판은 **마당**이었다. 마당은 사방이 열려 있고, 사방이 열려 있으면 아무 방향도 가리키지 않는다.
#   과제 여섯이 동시에 존재했다 — 그것은 안내가 아니라 **여섯 개의 선택지**였다.
#
#   그래서 땅을 갈아엎었다. 나루는 이제 **갈대 습지**이고, **마른 땅은 잔교(棧橋) 하나뿐이다.**
#   길이 하나인 이유는 표지판이 그렇게 시켜서가 아니라 **나머지가 전부 물이기 때문이다.**
#   벽을 세우지 않았는데 길이 하나다 — 그것이 가두지 않으면서 이끄는 법이다.
#
#   물에 빠져도 죽지 않는다 (수심 1 · 익사 꺼짐). 다시 잔교로 기어오르면 된다.
#   **막지 않는다. 다만 젖을 뿐이다.**
#
# 갇히지 않는다 (gate.bridge_down): 봇이 꺼져 있으면(world_day <= 0) 사공은 **그냥 건네준다.**
# 결정론: 난수 없음. 갈대·무늬는 좌표 해시(Math.floorMod).
# ─────────────────────────────────────────────────────────────────────────────

version: 2

antechamber:

  world: honcheon_ipdo
  display_name: "입도진"
  center: [0, 0]

  # ★★ 난이도 — **PEACEFUL 이면 안 된다.**
  #
  #   허수아비의 몸은 **좀비**다 (Dojang 과 같은 이유: 인간형이라 격·무기 판정이 사람 상대와 같게 돈다).
  #   그런데 평화(PEACEFUL)는 몬스터를 **매 틱 지운다** — 예외도 없고, 로그도 없고,
  #   setPersistent(true) 도 소용없다 (peaceful 검사가 persistence 검사보다 먼저다).
  #
  #   그래서 나루가 평화인 동안 허수아비는 **태어나자마자 조용히 사라졌다.**
  #   조성 로그는 "허수아비 3" 이라 찍었지만 그건 **config 의 개수**였지 선 것의 개수가 아니었다.
  #   침묵이 성공으로 읽혔다. (2026-07-13 · 사용자: "인증 전까지 때릴 상대가 없습니다.")
  #
  #   "나루에서는 죽지 않는다"는 약속은 난이도가 지키는 것이 아니다 — 아래 damage_players 가 지킨다.
  #   난이도로 지키면 그 약속이 **허수아비를 죽인다.**
  difficulty: EASY
  damage_players: false       # 나루에서 사람은 어떤 피해도 받지 않는다 (난이도와 무관하게 코드가 막는다)

  # ═══════════════════════════════════════════════════════════════════════
  # 0. 조성이 **끝났는가** — ★ 반쯤 선 것을 "서 있다"고 하면 안 된다
  # ═══════════════════════════════════════════════════════════════════════
  #
  #   오늘 크래시가 나루를 **반쯤 지어 놓고** 죽였다. 그리고 다음 기동 때 조성기가
  #   *"이미 서 있다"* 며 건너뛰었다. 왜냐하면 built() 가 본 것이 **블록 하나**였기 때문이다:
  #
  #       return w.getBlockAt(bell...).getType() == Material.BELL;      ← 옛 코드
  #
  #   종 하나가 놓였다는 것은 **종 하나가 놓였다는 것**이지 나루가 섰다는 뜻이 아니다.
  #   조성 판(plan)은 수만 칸인데, 그 중 한 칸을 보고 전체를 판단했다. **한 칸은 표본이 아니다.**
  #
  #   그래서 이제 **세계에게 묻는다**: 조성 판을 sample 간격으로 훑어, 세계의 블록이 판과
  #   실제로 같은지 센다. min_pct 에 못 미치면 그것은 **반쯤 선 나루**이고, 다시 짓는다.
  #
  #   ★ 결정론 — 난수 표본이 아니다. plan 은 config 에서 매번 같은 순서로 나오고,
  #     sample 은 그 인덱스를 고정 간격으로 집는다. 같은 세계는 언제나 같은 점수를 받는다.
  build:
    verify_sample: 61      # 조성 판 이 칸마다 하나씩 세계에게 묻는다 (수만 칸 → 수백 번 — 싸다)
    verify_min_pct: 97     # 표본이 이보다 덜 맞으면 **반쯤 선 것이다** — 처음부터 다시 짓는다
                           # (100 이 아닌 이유: 사람이 널판 하나 부순 것으로 나루를 다시 짓지 않는다.
                           #  크래시는 표본을 통째로 무너뜨린다 — 두 사건은 점수가 다르다)

  # ═══════════════════════════════════════════════════════════════════════
  # 1. 길 — ★ 하나뿐이다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 서쪽 갈대밭에서 눈을 뜨고, **동쪽으로만 걸을 수 있다.** 잔교가 끝나는 곳이 부두이고, 부두 끝이 종이다.
  #
  # ★★ 3차 개정 (2026-07-24 사용자 확정) — **순수 문지방.** 나루의 환원 불가능한 목적 넷만 남긴다:
  #   ① 미접합 몸의 대기실 (본세계에 떨구지 않는다) ② 접합 (이름을 올린다)
  #   ③ 서장 (책이 써지는 시간 — 잔교 걷기가 그 대기를 흡수한다) ④ 도착의 의식 (배·종·강)
  #
  # 【묘비】 가르침 5과(손·격·태세·경공·수련)는 여기 살았다 — 본토에 안내가 없던 시절의 보완물.
  #   뿌리내림 과정(B-178 · tutorial_rooting.md)이 서면서 이관·폐지됐다:
  #   · 손(타격)   → 첫 사냥이 곧 가르침이다 (본토 정거장)
  #   · 태세(몸짓) → 본토 몸짓 정거장 (흘리기·회피 2문 — 막기는 방패를 든 날 예고)
  #   · 격·경공    → v3 새 몸은 전원 범인이라 **아무도 못 하는 예고 전용**이었다 — 완전 제거
  #                  (예고는 개화 때 세계가 한다: HUD·승급 연출). 끊긴 잔교(gap)도 메웠다
  #   · 수련(장부) → 본토 수련 정거장 (그리고 B-134 행위=수련 재설계 대상)
  road:
    z: 0
    half_width: 1          # 폭 3 (z -1..1)
    from: -30              # 서쪽 끝 — 여기서 눈을 뜬다
    to: 26                 # 동쪽 끝 — 부두
    deck_y: 1              # 수면(지면) 위 1 — 잔교는 물 위에 뜬다
    gaps: []               # ★3차 개정 — 끊긴 자리(경공 예고)는 메웠다. 잔교는 이어져 있다

  spawn: [-30, 0]          # 눈을 뜨는 자리 — 길의 서쪽 끝. 갈 수 있는 방향은 하나다 (동쪽)

  # 관문 — ★ 순서가 곧 길이다. x 는 반드시 오름차순 (감사가 지킨다)
  #   순수 문지방: 맞이(눈을 뜬다)와 나루(이름·종·배)뿐이다. 사이는 갈대와 등롱과 걷기다 —
  #   그 걷기가 서장의 붓(LLM ~22초+)을 기다리는 시간이다.
  stations:
    - { id: 맞이, x: -30, half: 4, lesson: "" }
    - { id: 나루, x: 24,  half: 4, lesson: 접속 }    # 부두 · 종 · 사공의 집

  # 습지 — 잔교 밖은 전부 물이다 (이것이 '길이 하나'의 진짜 이유다)
  marsh:
    x: [-38, 34]
    z: [-22, 22]
    depth: 1               # 수심 1 — 빠져도 죽지 않는다. 기어오르면 된다
    reed_hash: 11          # 갈대 — floorMod 해시 (난수 아님)

  # ★ 장벽 — 늪 밖으로 나갈 수 없다 (사용자: "외부로 나갈수도 있으니 투명블록으로 늪을 제외한 곳 다 막아서")
  #   물안개(mist)는 **되돌림**이었다 — 나간 사람을 데려온다. 그러나 되돌리기 전에 **평지가 보인다.**
  #   보이는 순간 그곳은 "갈 수 있는 곳"이 되고, 길이 하나라는 약속이 깨진다.
  #   BARRIER 는 **보이지도 않고 나갈 수도 없다** — 세계의 끝이 아니라 **세계의 없음**이다.
  barrier:
    enabled: true
    margin: 1              # 늪 경계 바깥 이 칸부터 벽이 선다
    height: 24             # 경공으로도 못 넘는다 (전 경지 도약 최대 3.2m)
    cap: true              # 천장도 막는다 (창의(創意)를 막는 게 아니라 **길을 지킨다**)

  mist:
    leash_blocks: 96
    line: "§8물안개가 길을 지운다 — 잔교로 돌아왔다."

  # ═══════════════════════════════════════════════════════════════════════
  # 2. 빛 — ★ 빛이 길을 만든다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 사용자: "조명이 너무 균일." 이 프로젝트는 **이미 이 병을 앓고 고쳤다** —
  #   (마을 조성 때) "조명이 너무 다닥다닥 붙어있습니다. **조명이 없는 부분도 존재해도 되니** 적당히."
  #   → 그때 등롱을 325개 → 93개로 줄였다. 1차판 나루는 그 교훈을 잊고 **6칸 격자**로 도배했다.
  #
  # 격자는 아무것도 안 가리킨다. **등롱이 길을 따라 늘어서면 그것이 곧 화살표다.**
  # 그리고 **어두운 곳이 있어야 밝은 곳이 길로 읽힌다** — 습지는 어두워야 한다.
  #
  # ★ 눈금은 지어내지 않았다. TownAudit.java 의 상수 그대로다 (감사가 두 등록부를 대조한다):
  #     DARK_MIN_PCT 12 · DARK_MAX_PCT 40 · MAIN_DARK_MAX_PCT 15 · LAMP_DENSITY_MAX 0.06
  lighting:
    post_every: 9              # 잔교 등롱 기둥 간격 — **격자가 아니라 리듬**
    post_alternate: true       # 좌·우로 번갈아 — 한 줄로 세우면 그것도 격자다
    post_z: 2                  # 길 옆 ±2 (잔교 브래킷 위)
    brazier_stations: [나루]   # 화톳불 — 부두에만 (3차 개정 — 관문 마당들이 사라졌다)
    hut_lantern: true          # 사공의 집에 불이 켜져 있다

    # 야간 3축 (TownAudit 와 같은 눈금 — 감사가 대조한다)
    dark_min_pct: 12           # ★ 어둠의 하한 — 어두운 곳이 **없으면 그것도 실패다**
    dark_max_pct: 40
    main_dark_max_pct: 15      # 주 동선(잔교·마당)은 밝아야 한다
    lamp_density_max_pct: 6    # 등롱 도배 금지
    main_light_span_min: 3     # ★ 균일 금지 — 길 위 광량의 최대−최소가 이보다 커야 '리듬'이다

  # ═══════════════════════════════════════════════════════════════════════
  # 3. 집 — 나루가 나루처럼 보여야 한다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 1차판에는 **기능만 있고 집이 없었다.** 사공이 있다고 말만 하고 사공의 집이 없었다.
  # 건축 어휘는 이 세계에 이미 있다 (CheonghaBuilder: 기단·처마·판재 / RemoteBuilder: 수로채 = 물 위의 채).
  # 나루는 수로채의 형제다 — **말뚝 위에 얹힌 채**. 조성기는 복제하지 않고, 어휘만 배웠다.
  hut:
    x: [19, 24]
    z: [5, 10]
    wall_h: 3
    eave: 2                    # 처마 내밀기 2 (TownAudit EAVE_MIN 과 같은 눈금)
    line: "§8사공의 집에 불이 켜져 있다. 문은 열려 있고, 안에는 아무도 없다."

  dock:
    bell: [26, 0]              # ★ 문. 길의 끝
    boat: [29, 0]
    mooring: true              # 닻줄 — 배는 매여 있다

  # ═══════════════════════════════════════════════════════════════════════
  # 3-2. 허수아비 — ★ 때릴 상대. 손 관문의 마당에 **등급별로** 선다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 내구 12·18·22·30 은 지어낸 숫자가 아니다 — DojangGui.java 의 등급별 몸 그대로다
  # (삼류 몸 12 · 이류 몸 18 · 절정 몸 22 · 고수의 몸 30). 감사가 두 등록부를 대조한다.
  #
  # 허수아비는 **죽지 않고 반격하지 않는다** (AI 없음 · 맞으면 리스너가 체력을 되돌린다).
  # 명패가 장부를 말한다: 최근 · 누적 · 합수 · 평균 · TTK (Dojang 의 명패와 같은 다섯 눈금).
  #
  # 자리는 **한 길 위**다 — 손 관문(x -18)의 마당 네 몸, 격 관문(x -8)의 마당 두 몸.
  # (감사가 확인한다: 물 위도 아니고 난간·등롱·화톳불 속도 아닌, **딛는 자리**여야 한다)
  dummies:
    # ★3차 개정 (2026-07-24) — 순수 문지방: 허수아비는 나루에서 물러났다 (손·격 관문과 함께).
    #   때리는 법은 본토의 첫 사냥이 가르친다 (뿌리내림 B-178). 명패 서식은 연무장 재사용 대비 존치.
    idle: "§7{label} §8· 내구 {durability}"
    hit: "§7{label} §f최근 {last} §7· 누적 {total} · {hits}합 · 평균 {avg}§e → 내구 {durability} 상대 TTK {ttk}합"
    list: []

  # ═══════════════════════════════════════════════════════════════════════
  # 4. 문 — 언제 열리는가
  # ═══════════════════════════════════════════════════════════════════════
  gate:
    open_when: linked

    # ★ 봇이 꺼져 있으면(worldDay <= 0) 접합은 **원리적으로 불가능**하다. 그때 사공은 그냥 건넨다.
    bridge_down:
      allow_passage: true
      lines:
        - "§8사공이 노를 든다. §7\"오늘은 장부가 없다 — 그냥 타라.\""
        - "§7강호의 장부가 서지 않았다. §c네가 벤 것은 아무 데도 적히지 않는다§7 — 다리가 서면 §f/혼천 접속§7."

    # ★ 종을 쳤는데 이름이 없다 — **왜 아직 못 가는지 말한다.** 침묵은 규칙이 아니다
    #   (그리고 여기에도 '코드'를 적지 않는다 — 접합 방식이 바뀌는 중이다. 발판이 화면을 띄운다)
    refuse:
      title: "사공이 노를 젓지 않는다"
      subtitle: "이름 없는 자는 못 태운다"
      lines:
        - "§8사공이 고개를 젓는다. §7\"이름 없는 자는 못 태운다. 나룻배는 장부에 적고 건넨다.\""
        - "§7종 앞의 §f접속 발판§7 을 밟아라 — 강호에 이름이 오르면 배가 뜬다. §8(디스코드의 §f/혼천 시작§8 이 먼저다)"

    opened:
      title: "배가 뜬다"
      subtitle: "강호에 이름이 올랐다"
      lines:
        - "§6사공이 삿대를 민다. §7\"§f{name}§7 이라 하였는가. 타라.\""
      auto_cross_seconds: 6

      # ★ B-120 【실사용 2026-07-14 · 부계정】 — **배는 부두에서 뜬다.**
      #   접합 6초 뒤 자동 출발이 **마당에서 몸짓을 배우던 사람을 끌고 갔다**: 태세 관문의
      #   세 몸짓을 마친 순간 세계가 바뀌어, 걸어온 길의 글판이 전부 사라졌다
      #   ("세가지 태세를 완료시에 뒤에있던 모든 글들이 사라짐" — 기전은 출도 텔레포트다.
      #    글판은 나루 세계의 것이라 세계를 떠나면 다 사라진다).
      #   그래서 자동 출발은 **이 관문 마당에 선 몸만** 태운다 — 마당(서쪽)에서 배우는 동안은
      #   사공이 기다린다. 종(수동)은 지금처럼 어디서든 울릴 수 있다 (문은 잠기지 않는다).
      #   값은 stations 의 id 여야 한다 — 등록부가 모르는 이름이면 붙들지 않는다 (갇힘 금지).
      auto_cross_from: 나루
      # 자동 출발이 사람을 기다리기로 한 순간 — 한 번 말한다 (침묵 금지)
      dock_wait_line: "§8사공이 삿대를 걸어 두고 기다린다. §7마당의 일을 마치고 §f부두§7 로 오라 — 배는 부두에서 뜬다."

    # ★ B-118 — 서장이 남은 몸은 배가 기다린다 (실사용 2026-07-14 · 부계정: 접합 직후
    #   자동 출발이 서장 없이 사람을 청하현으로 보냈다 — 서사가 통째로 건너뛰어졌다).
    #
    #   판정은 「책이 지금 손에 있나」(SeojangBook 토큰)가 아니라 **「서장이 끝났나」**다 —
    #   봇의 서장 명단(run/bridge/seojang.json)에 실려 있는 동안은 붓(LLM)이 글을 짓는 중이든
    #   책을 읽는 중이든 배가 뜨지 않는다. 에필로그의 [강호로 나선다] 가 명단에서 지운다.
    #
    #   갇히지 않는다: 명단의 심장 소리(at)가 world_bridge.yml transport.seojang_stale_seconds
    #   보다 낡으면(봇이 죽었으면) 문은 사람을 붙들지 않는다 — bridge_down 과 같은 원칙.
    seojang:
      # 접합 직후, 서장이 남아 있어 배가 서 있을 때 — 한 번 말한다 (침묵 금지)
      wait_line: "§8사공이 삿대를 세운다. §7\"붓이 네 서장을 짓고 있다 — 이야기가 먼저다.\""
      # 종을 쳤는데 붓이 아직 글을 짓는 중이다 (책이 아직 품에 없다)
      writing_line: "§7붓이 서장을 짓고 있다 — 책이 오면 품에서 저절로 펼쳐진다. 이야기가 끝나야 배가 뜬다."
      # 종을 쳤는데 책을 읽는 중이다 — 문은 서장이 닫는다
      reading_line: "§7서장이 아직 끝나지 않았다 — 책의 마지막 장에서 §f[강호로 나선다]§7 를 누르라."

    crossed:
      lines:
        - "§6── 강호(江湖) ──"
        - "§7배가 뭍에 닿는다. 뒤를 돌아봐도 나루는 안개뿐이다."
        - "§7언제든 §f/혼천 입도§7 로 나루에 돌아올 수 있다."

    destinations: [흑수나루, 장터]

  # ═══════════════════════════════════════════════════════════════════════
  # 5. 맞이
  # ═══════════════════════════════════════════════════════════════════════
  arrival:
    title: "입도진(入道津)"
    subtitle: "동쪽으로 걸어라"
    lines:
      - "§6── 입도진 ──"
      - "§7갈대밭에서 눈을 뜬다. 사방이 물이고, §f마른 땅은 잔교 하나뿐§7 이다."
      - "§7잔교를 따라 §f동쪽§7 으로 걸어라. 끝에 나루가 있고, 나루 너머가 §f강호§7 다."
      - "§8길이 하나인 것은 네가 아직 고를 것이 없기 때문이다."
    revisit_line: "§7나루에 다시 섰다. §8잔교 끝의 종을 울리면 언제든 건넌다."
    # ★ B-124 — 과제 장부는 **메모리뿐이다 (설계)**: 나루는 시험장이 아니라 문지방이고, 문(종)은
    #   과제를 보지 않으므로 장부를 세계에 남기지 않는다. 그래서 건넌 몸이 다시 서면 관문이 도로
    #   열려 있다 — 왜 그런지 침묵하지 않고 이 한 줄이 말한다 (재방문·재기동 후 공통).
    revisit_ledger_line: "§8관문의 과제는 장부에 남지 않는다 — 도로 열려 있어도 §7시험이 아니다§8. 몸이 기억하면 그만이고, 종은 과제를 묻지 않는다."

  kit:
    # ★3차 개정 — 지급품 폐지: 허수아비도 몸짓 과제도 나루에 없다. 첫 장비는 강호에서
    #   제 돈으로 산다 (뿌리내림 「채비」 — 장쇠의 좌판). 빈손으로 건너는 것이 문지방답다.
    give: false
    line: "§8잔교에 누가 두고 간 목검과 방패가 있다. 집어 든다."
    take_back_line: "§8나루의 목검과 방패는 나루에 두고 간다."

  # ═══════════════════════════════════════════════════════════════════════
  # 6. 발판 — ★ 밟으면 명령이 대신 쳐진다 (사용자 제안)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # `/혼천 수련 외공 2` 를 손으로 치게 하는 것이 **진입 장벽**이다. 무협 서버에 처음 온 사람에게
  # 명령어 문법을 외우게 하지 말라.
  #
  # ★ 다만 **가르치는 것을 잊지 않는다.** 발판이 대신 쳐 주되 **무엇이 쳐졌는지 그대로 보여준다** —
  #   나중에 강호에서는 혼자 쳐야 하니까. echo 에 뜨는 글자와 실제로 실행되는 글자는 **같은 변수 하나**다
  #   (감사가 이것을 확인한다 — 화면이 세계에 대해 거짓말하면 안 된다).
  #
  # 배분값(외공 2 · 초식 3)은 지어낸 것이 아니다 —
  #   player_creation.yml  mvt_onboarding.default_curriculum 의 값 그대로다 (감사가 대조한다).
  plates:
    echo: "§8발판을 밟는다 — §f/{command}"
    hint: "§8(강호에서는 이것을 손으로 친다)"
    cooldown_ticks: 40
    list:
      # ★3차 개정 — 발판은 접속 하나만 남는다 (타격·수련·시트·태세_자동은 관문과 함께 본토로).
      #   접속만은 발판이 맞다: 접합 흐름이 바뀌는 중이라 화면이 말하게 두는 계약 그대로다.
      - { id: 접속,      pos: [23,  0], command: "혼천 접속" }

  # ═══════════════════════════════════════════════════════════════════════
  # 7. 과제(課) — 읽는 것이 아니라 해 보는 것
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ★★ detect 는 **엔진이 진짜 보는 것**의 이름이다. 다른 등록부와 글자 그대로 같아야 한다:
  #      · MvtCommand 의 case 목록  →  /혼천 접속 이 실제로 있는가
  #    tools/antechamber_audit.py 가 이 대조를 돌린다.
  #    (3차 개정 — 몸의 문법 과제 5과는 본토 뿌리내림으로 이관: tutorial_rooting.md)
  lessons:
    # ★ 과제는 문을 잠그지 않는다. 문은 이름이 열고, 과제는 몸을 연다.
    #   (과제를 문의 조건으로 두면, 과제 하나가 깨진 날 사람이 나루에 갇힌다.
    #    글판이 안 보이는 것과 문이 잠기는 것은 **다른 것이다** — 종은 언제나 울린다.)
    gating: false

    # ★ 한 번에 하나만 — 다음 관문의 글판은 앞 관문이 닫히기 전까지 뜨지 않는다.
    #   지금 무엇을 해야 하는지가 화면에 하나뿐이면, 흐름은 저절로 생긴다.
    one_at_a_time: true

    done_line: "§a✔ §f{title} §7— {done}"
    next_line: "§8동쪽으로 더 걸어라 —§7 다음 관문이 밝아졌다."
    all_done:
      title: "이름이 올랐다"
      subtitle: "이제 종을 울려라"
      lines:
        - "§6강호에 이름이 올랐다. §7남은 것은 §f배§7 뿐이다 — 잔교 끝의 §f종§7."

    # ★★ requires — **못 하는 것을 시키지 않는다.**
    #
    #   경지가 못 하는 조작이 있다. 그것을 과제로 내는 것은 **화면이 세계에 대해 거짓말하는 것**이다.
    #   requires 에 능력(能)의 이름을 적으면, 그 능이 없는 몸에게는 이 관문이 **아예 없는 것으로 친다** —
    #   판은 unavailable 문장으로 바뀌고(예고), 길은 그냥 지나가고, '다 익혔다'가 이것을 안 센다.
    #
    #   능의 이름은 **코드에 술어가 있어야 한다** (Antechamber.capable). 지어낸 이름을 적으면 감사가 잡는다:
    #     두를_격   → SkillEngine.armableGrades(경지) 가 비지 않았는가
    #     허공_딛기 → Gyeonggong.ceiling(경지).airJumps() > 0 인가   (gyeonggong.yml realm_ceiling)
    list:
      # ★3차 개정 (2026-07-24) — 【묘비】 손·격·태세·경공·수련 다섯 과제가 여기 살았다.
      #   그 시절의 정정 둘은 계율로 남는다 (다시 세울 때 같은 함정을 밟지 마라):
      #   · "이것은 콤보가 아니다" — 연타는 획의 방향만 바꾼다 (입력 문법을 지어내지 마라)
      #   · "뛰어라"의 거짓말 — 못 하는 몸에게 시키는 과제는 화면이 세계에 하는 거짓말이다
      #     (requires/예고 문법은 그 상처에서 났다 — 본토 뿌리내림의 「막기 예고」가 그 상속자다)
      - id: 접속
        title: "접속 — 강호에 이름을 올린다"
        # ★★ 【2026-07-13 정정 ②】 옛 문장은 "코드가 나온다 → 디스코드에서 확정한다" 였다.
        #
        #   ① 그 앞에 **문이 하나 더 있다** — server-bot GameListener 는 캐릭터가 없으면
        #      "캐릭터가 없다. `/혼천 시작`부터." 라며 **되돌려보낸다.** 이름·성별·서장은
        #      **디스코드에서** 만든다. 그것을 안 적으면 발판을 밟은 사람이 **거기서 튕긴다.**
        #      (감사가 봇의 거절 문구를 읽어 이 문장을 대조한다 — 손으로 안 쓴다)
        #
        #   ② ★★ **접합 방식이 지금 바뀌는 중이다** (코드 방식 폐기 → 초대 링크 + 닉네임 + 수락 창).
        #      그래서 이 과제는 **흐름을 적지 않는다.** 발판은 `/혼천 접속` 을 **대신 쳐 줄 뿐**이고,
        #      그 명령이 무엇을 말하든 **그대로 흐른다** — 그것이 발판의 계약이다.
        #      여기에 "코드를 복사하라"를 적어 두면 **다음 주에 그것이 거짓말이 된다.**
        #      화면이 말하게 두어라. 대기실은 **어디서 무엇을 하는지**만 말한다.
        how: "§7① §f디스코드§7 에서 §f/혼천 시작§7 — 이름·성별을 짓고 §f서장§7 을 끝낸다.\n§7② §f종 앞의 접속 발판§7 을 밟아라. §8나머지는 화면이 말해 준다."
        detect: 명령
        command: "접속"
        needs_args: false
        count: 1
        done: "강호의 문을 두드렸다. §8화면이 말하는 대로 하면 배가 뜬다. §7캐릭터가 없다고 하거든 디스코드의 §f/혼천 시작§7 이 먼저다."

  # ═══════════════════════════════════════════════════════════════════════
  # 8. 글판 — TextDisplay (표지판이 아니다)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 표지판은 글자가 작고, 코앞까지 가야 읽히고, 네 줄에 묶인다. 안내는 멀리서 읽혀야 한다.
  # ★ 글판은 **관문마다 하나**다 — stations 가 자리를 정한다 (판을 따로 배치하지 않는다.
  #   판과 관문이 어긋날 수가 없다). 문장도 과제의 것을 그대로 쓴다.
  text_display:
    max_panels: 16
    scale: 1.0            # ★ 1.6 → 1.0 (사용자: "글이 조금 큼 — 보기가 힘들다")
    view_range: 2.0
    line_width: 240
    y_offset: 1.4        # ★ 2.6 → 1.4 (사용자: "텍스트가 너무 위에 있음" — 눈높이로 내린다)
    billboard: CENTER
    alignment: CENTER
    see_through: false
    shadowed: true
    background_argb: "0xC8140F0C"    # 먹 — 반투명
    accent_argb: "0xC8241A12"        # 주사 기 도는 먹 (문 = 종의 판)
    brightness: { block: 12, sky: 15 }
    title_prefix: "§6§l"
    arrival_id: 맞이                  # 이 관문의 판은 arrival.lines 를 쓴다 (과제가 없는 관문)

  # 배선 — MvtCommand 에 이미 들어갔다 (감사가 매번 확인한다)
  wiring:
    pending_commands:
      도강: "Antechamber.cross(player) — 종(BELL)과 같은 문"
      입도: "Antechamber.enter(player) — 나루로 되돌아온다"
