# 입도진(入道津) — 강호에 들기 전에 서는 자리
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 나루인가
#
#   world_map.yml 이 이미 답을 적어 뒀다:
#     · 2211행  흑수나루: { pos: [118, 12], bearing: "동 — 강가", terrain: 물가 }
#     · 1518행  "★ 흑수나루가 이 물길의 한 점이다 — 청하현이 왜 나루를 갖는가의 답"
#
#   나루는 이 세계가 이미 가진 **문지방**이다. 강호에 든다는 것은 강을 건너는 것이고,
#   건네주는 것은 사공이다. 그리고 **사공은 이름 없는 자를 태우지 않는다.** 문은 배다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 습지(濕地)인가 — ★ 2차 개정. 사용자가 실제로 들어가 보고 말했다:
#
#   "필드가 너무 디자인이 없음 · 조명도 너무 균일 · **어떻게 어느 방향으로 무엇을 언제 봐야 하는지
#    흐름이 없음** · 한마디로 너무 난잡함 · **한 길을 해서 따라갈 수 있게**"
#
#   1차판은 **마당**이었다. 마당은 사방이 열려 있고, 사방이 열려 있으면 아무 방향도 가리키지 않는다.
#   과제 여섯이 동시에 존재했다 — 그것은 안내가 아니라 **여섯 개의 선택지**였다.
#
#   그래서 땅을 갈아엎었다. 나루는 이제 **갈대 습지**이고, **마른 땅은 잔교(棧橋) 하나뿐이다.**
#   길이 하나인 이유는 표지판이 그렇게 시켜서가 아니라 **나머지가 전부 물이기 때문이다.**
#   벽을 세우지 않았는데 길이 하나다 — 그것이 가두지 않으면서 이끄는 법이다.
#
#   물에 빠져도 죽지 않는다 (수심 1 · 익사 꺼짐). 다시 잔교로 기어오르면 된다.
#   **막지 않는다. 다만 젖을 뿐이다.**
#
# 갇히지 않는다 (gate.bridge_down): 봇이 꺼져 있으면(world_day <= 0) 사공은 **그냥 건네준다.**
# 결정론: 난수 없음. 갈대·무늬는 좌표 해시(Math.floorMod).
# ─────────────────────────────────────────────────────────────────────────────

version: 2

antechamber:

  world: honcheon_ipdo
  display_name: "입도진"
  center: [0, 0]

  # ═══════════════════════════════════════════════════════════════════════
  # 1. 길 — ★ 하나뿐이다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 서쪽 갈대밭에서 눈을 뜨고, **동쪽으로만 걸을 수 있다.** 잔교가 끝나는 곳이 부두이고, 부두 끝이 종이다.
  # 길을 따라 관문이 하나씩 나온다. 순서에는 이유가 있다 — **몸 → 손 → 격 → 태세 → 발 → 장부 → 문**:
  #
  #   맞이 : 눈을 뜬다. 아무것도 요구하지 않는다 (첫 화면이 시험이면 그것은 초대가 아니다)
  #   손   : 허수아비를 친다. **몸이 먼저 안다** — 명령도 개념도 아직 없다. 때리는 것뿐이다
  #   격   : 그 손에 격을 두른다. 손을 모르면 두를 것이 없으므로 손 다음이다
  #   태세 : 이제 **맞는 쪽**을 배운다. 때릴 줄 알아야 맞는 것이 무엇인지 안다
  #   경공 : 발. 잔교가 끊긴 자리를 건넌다 (뛰기 싫으면 옆 널판으로 돌아가도 된다 — 막지 않는다)
  #   장부 : 몸을 다 배웠으니 이제 **장부**다. 발판을 밟으면 명령이 대신 쳐진다
  #   나루 : 이름을 올리고, 종을 울린다. 배가 뜬다
  road:
    z: 0
    half_width: 1          # 폭 3 (z -1..1)
    from: -30              # 서쪽 끝 — 여기서 눈을 뜬다
    to: 26                 # 동쪽 끝 — 부두
    deck_y: 1              # 수면(지면) 위 1 — 잔교는 물 위에 뜬다
    gaps:                  # 잔교가 끊긴 자리 (경공). ★ 반드시 우회로가 있어야 한다 (bypass_z)
      - { from: 10, to: 12, bypass_z: [2, 3], reason: "달리며 점프 — 뛰기 싫으면 옆 널판으로 돌아간다" }

  spawn: [-30, 0]          # 눈을 뜨는 자리 — 길의 서쪽 끝. 갈 수 있는 방향은 하나다 (동쪽)

  # 관문 — ★ 순서가 곧 길이다. x 는 반드시 오름차순 (감사가 지킨다)
  stations:
    - { id: 맞이, x: -30, half: 4, lesson: "" }
    - { id: 손,   x: -18, half: 4, lesson: 손 }
    - { id: 격,   x: -8,  half: 4, lesson: 격 }
    - { id: 태세, x: 2,   half: 4, lesson: 태세 }
    - { id: 경공, x: 8,   half: 4, lesson: 경공 }    # 마당 끝에서 잔교가 끊긴다 (x 10~12)
    - { id: 장부, x: 17,  half: 4, lesson: 수련 }    # 발판 마당
    - { id: 나루, x: 24,  half: 4, lesson: 접속 }    # 부두 · 종 · 사공의 집

  # 습지 — 잔교 밖은 전부 물이다 (이것이 '길이 하나'의 진짜 이유다)
  marsh:
    x: [-38, 34]
    z: [-22, 22]
    depth: 1               # 수심 1 — 빠져도 죽지 않는다. 기어오르면 된다
    reed_hash: 11          # 갈대 — floorMod 해시 (난수 아님)

  mist:
    leash_blocks: 96
    line: "§8물안개가 길을 지운다 — 잔교로 돌아왔다."

  # ═══════════════════════════════════════════════════════════════════════
  # 2. 빛 — ★ 빛이 길을 만든다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 사용자: "조명이 너무 균일." 이 프로젝트는 **이미 이 병을 앓고 고쳤다** —
  #   (마을 조성 때) "조명이 너무 다닥다닥 붙어있습니다. **조명이 없는 부분도 존재해도 되니** 적당히."
  #   → 그때 등롱을 325개 → 93개로 줄였다. 1차판 나루는 그 교훈을 잊고 **6칸 격자**로 도배했다.
  #
  # 격자는 아무것도 안 가리킨다. **등롱이 길을 따라 늘어서면 그것이 곧 화살표다.**
  # 그리고 **어두운 곳이 있어야 밝은 곳이 길로 읽힌다** — 습지는 어두워야 한다.
  #
  # ★ 눈금은 지어내지 않았다. TownAudit.java 의 상수 그대로다 (감사가 두 등록부를 대조한다):
  #     DARK_MIN_PCT 12 · DARK_MAX_PCT 40 · MAIN_DARK_MAX_PCT 15 · LAMP_DENSITY_MAX 0.06
  lighting:
    post_every: 9              # 잔교 등롱 기둥 간격 — **격자가 아니라 리듬**
    post_alternate: true       # 좌·우로 번갈아 — 한 줄로 세우면 그것도 격자다
    post_z: 2                  # 길 옆 ±2 (잔교 브래킷 위)
    brazier_stations: [손, 태세, 장부, 나루]   # 화톳불 — 마당에만. 관문이 곧 불빛이다
    hut_lantern: true          # 사공의 집에 불이 켜져 있다

    # 야간 3축 (TownAudit 와 같은 눈금 — 감사가 대조한다)
    dark_min_pct: 12           # ★ 어둠의 하한 — 어두운 곳이 **없으면 그것도 실패다**
    dark_max_pct: 40
    main_dark_max_pct: 15      # 주 동선(잔교·마당)은 밝아야 한다
    lamp_density_max_pct: 6    # 등롱 도배 금지
    main_light_span_min: 3     # ★ 균일 금지 — 길 위 광량의 최대−최소가 이보다 커야 '리듬'이다

  # ═══════════════════════════════════════════════════════════════════════
  # 3. 집 — 나루가 나루처럼 보여야 한다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 1차판에는 **기능만 있고 집이 없었다.** 사공이 있다고 말만 하고 사공의 집이 없었다.
  # 건축 어휘는 이 세계에 이미 있다 (CheonghaBuilder: 기단·처마·판재 / RemoteBuilder: 수로채 = 물 위의 채).
  # 나루는 수로채의 형제다 — **말뚝 위에 얹힌 채**. 조성기는 복제하지 않고, 어휘만 배웠다.
  hut:
    x: [19, 24]
    z: [5, 10]
    wall_h: 3
    eave: 2                    # 처마 내밀기 2 (TownAudit EAVE_MIN 과 같은 눈금)
    line: "§8사공의 집에 불이 켜져 있다. 문은 열려 있고, 안에는 아무도 없다."

  dock:
    bell: [26, 0]              # ★ 문. 길의 끝
    boat: [29, 0]
    mooring: true              # 닻줄 — 배는 매여 있다

  dummies:                     # 허수아비 — 손·격 관문의 마당에
    spots: [[-18, -3], [-18, 3], [-8, -3]]
    durability: 20
    name: "§7허수아비"

  # ═══════════════════════════════════════════════════════════════════════
  # 4. 문 — 언제 열리는가
  # ═══════════════════════════════════════════════════════════════════════
  gate:
    open_when: linked

    # ★ 봇이 꺼져 있으면(worldDay <= 0) 접합은 **원리적으로 불가능**하다. 그때 사공은 그냥 건넨다.
    bridge_down:
      allow_passage: true
      lines:
        - "§8사공이 노를 든다. §7\"오늘은 장부가 없다 — 그냥 타라.\""
        - "§7강호의 장부가 서지 않았다. §c네가 벤 것은 아무 데도 적히지 않는다§7 — 다리가 서면 §f/혼천 접속§7."

    refuse:
      title: "사공이 노를 젓지 않는다"
      subtitle: "이름 없는 자는 못 태운다"
      lines:
        - "§8사공이 고개를 젓는다. §7\"이름 없는 자는 못 태운다. 나룻배는 장부에 적고 건넨다.\""
        - "§7부두의 §f접속 발판§7 을 밟아라 — 코드가 나온다. §f디스코드§7 에서 확정하면 배가 뜬다."

    opened:
      title: "배가 뜬다"
      subtitle: "강호에 이름이 올랐다"
      lines:
        - "§6사공이 삿대를 민다. §7\"§f{name}§7 이라 하였는가. 타라.\""
      auto_cross_seconds: 6

    crossed:
      lines:
        - "§6── 강호(江湖) ──"
        - "§7배가 뭍에 닿는다. 뒤를 돌아봐도 나루는 안개뿐이다."
        - "§7언제든 §f/혼천 입도§7 로 나루에 돌아올 수 있다."

    destinations: [흑수나루, 장터]

  # ═══════════════════════════════════════════════════════════════════════
  # 5. 맞이
  # ═══════════════════════════════════════════════════════════════════════
  arrival:
    title: "입도진(入道津)"
    subtitle: "동쪽으로 걸어라"
    lines:
      - "§6── 입도진 ──"
      - "§7갈대밭에서 눈을 뜬다. 사방이 물이고, §f마른 땅은 잔교 하나뿐§7 이다."
      - "§7잔교를 따라 §f동쪽§7 으로 걸어라. 끝에 나루가 있고, 나루 너머가 §f강호§7 다."
      - "§8길이 하나인 것은 네가 아직 고를 것이 없기 때문이다."
    revisit_line: "§7나루에 다시 섰다. §8잔교 끝의 종을 울리면 언제든 건넌다."

  kit:
    give: true
    line: "§8잔교에 누가 두고 간 목검과 방패가 있다. 집어 든다."
    take_back_line: "§8나루의 목검과 방패는 나루에 두고 간다."

  # ═══════════════════════════════════════════════════════════════════════
  # 6. 발판 — ★ 밟으면 명령이 대신 쳐진다 (사용자 제안)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # `/혼천 수련 외공 2` 를 손으로 치게 하는 것이 **진입 장벽**이다. 무협 서버에 처음 온 사람에게
  # 명령어 문법을 외우게 하지 말라.
  #
  # ★ 다만 **가르치는 것을 잊지 않는다.** 발판이 대신 쳐 주되 **무엇이 쳐졌는지 그대로 보여준다** —
  #   나중에 강호에서는 혼자 쳐야 하니까. echo 에 뜨는 글자와 실제로 실행되는 글자는 **같은 변수 하나**다
  #   (감사가 이것을 확인한다 — 화면이 세계에 대해 거짓말하면 안 된다).
  #
  # 배분값(외공 2 · 초식 3)은 지어낸 것이 아니다 —
  #   player_creation.yml  mvt_onboarding.default_curriculum 의 값 그대로다 (감사가 대조한다).
  plates:
    echo: "§8발판을 밟는다 — §f/{command}"
    hint: "§8(강호에서는 이것을 손으로 친다)"
    cooldown_ticks: 40
    list:
      - { id: 수련_외공, pos: [15, -2], command: "혼천 수련 외공 2" }
      - { id: 수련_초식, pos: [15,  2], command: "혼천 수련 초식 3" }
      - { id: 시트,      pos: [19, -2], command: "혼천 시트" }
      - { id: 태세_자동, pos: [19,  2], command: "혼천 태세 자동" }
      - { id: 접속,      pos: [23,  0], command: "혼천 접속" }

  # ═══════════════════════════════════════════════════════════════════════
  # 7. 과제(課) — 읽는 것이 아니라 해 보는 것
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ★★ detect 는 **엔진이 진짜 보는 것**의 이름이다. 다른 등록부와 글자 그대로 같아야 한다:
  #      · combat.yml  defender_stance_mc.gestures  →  막기: isBlocking / 흘리기: isSneaking / 회피: isSprinting
  #      · gyeonggong.yml  activate                 →  "달리며 점프"
  #      · SkillListener 조작표                      →  좌클릭 = 기본 초식 / Shift+우클릭 = 격 태세 순환
  #      · MvtCommand 의 case 목록                   →  /혼천 수련 · /혼천 접속 이 실제로 있는가
  #    tools/antechamber_audit.py 가 이 대조를 돌린다.
  lessons:
    # ★ 과제는 문을 잠그지 않는다. 문은 이름이 열고, 과제는 몸을 연다.
    #   (과제를 문의 조건으로 두면, 과제 하나가 깨진 날 사람이 나루에 갇힌다.
    #    글판이 안 보이는 것과 문이 잠기는 것은 **다른 것이다** — 종은 언제나 울린다.)
    gating: false

    # ★ 한 번에 하나만 — 다음 관문의 글판은 앞 관문이 닫히기 전까지 뜨지 않는다.
    #   지금 무엇을 해야 하는지가 화면에 하나뿐이면, 흐름은 저절로 생긴다.
    one_at_a_time: true

    done_line: "§a✔ §f{title} §7— {done}"
    next_line: "§8동쪽으로 더 걸어라 —§7 다음 관문이 밝아졌다."
    all_done:
      title: "몸이 알았다"
      subtitle: "이제 종을 울려라"
      lines:
        - "§6손도 격도 태세도 발도 장부도 익혔다. §7남은 것은 §f배§7 뿐이다 — 잔교 끝의 §f종§7."

    list:
      - id: 손
        title: "손 — 기본 초식"
        how: "§7허수아비를 §f좌클릭§7 으로 쳐라. 검을 든 손이 알아서 초식을 낸다 (1·2타 → 3타)."
        detect: 허수아비_타격
        count: 3
        done: "허수아비가 세 합을 맞았다."

      - id: 격
        title: "격(格) — 두름"
        how: "§7§fShift + 우클릭§7 — 두를 격을 바꾼다 (외공 → 발경 → 검기 → 강기)."
        detect: 격_태세_순환
        count: 1
        done: "격이 몸에 둘러졌다."
        # ★ 정직 — 경지가 두를 격이 없으면(범인·삼류) 이 관문은 **아예 없는 것으로 친다.**
        #   SkillEngine.armableGrades(realm) 이 비면 못 하는 조작이다. 못 하는 것을 가르치지 않고,
        #   못 하는 것 때문에 길이 막히지도 않는다 (건너뛴다).
        requires_armable_grade: true
        unavailable: "§8아직 두를 격이 없다. §7경지가 오르면 손이 먼저 안다. §8— 그냥 지나가라."

      - id: 태세
        title: "태세 — 맞는 쪽의 선택"
        how: "§7몸짓이 곧 선택이다 — §f방패 들기§7=막기 · §f웅크림§7=흘리기 · §f달림§7=회피. 셋 다 해 보아라."
        detect: 방어_몸짓
        gestures: [isBlocking, isSneaking, isSprinting]   # ★ combat.yml defender_stance_mc.gestures 와 같아야 한다
        count: 3
        done: "세 가지 몸짓을 몸이 안다."

      - id: 경공
        title: "경공(輕功) — 나는 발"
        how: "§7잔교가 끊겼다. §f달리며 점프§7 — 발이 이미 움직일 때만 몸이 뜬다. §8(옆 널판으로 돌아가도 된다)"
        detect: 경공_발동
        count: 1
        done: "발이 땅을 떠났다."

      - id: 수련
        title: "수련 — 하루 다섯 구간"
        how: "§7마당의 §f발판§7 을 밟아라. 명령이 대신 쳐진다. §8안 치면 아무것도 자라지 않는다."
        detect: 명령
        command: "수련"          # ★ MvtCommand 의 case 이름과 같아야 한다
        needs_args: true         # 도움말만 띄운 것은 배운 것이 아니다
        count: 1
        done: "배분이 섰다. 내일부터 그렇게 쌓인다."

      - id: 접속
        title: "접속 — 강호에 이름을 올린다"
        how: "§7부두의 §f접속 발판§7 을 밟아라 → 코드가 나온다 → §f디스코드§7 에서 확정한다."
        detect: 명령
        command: "접속"
        needs_args: false
        count: 1
        done: "코드를 받았다. 디스코드에서 확정하면 배가 뜬다."

  # ═══════════════════════════════════════════════════════════════════════
  # 8. 글판 — TextDisplay (표지판이 아니다)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 표지판은 글자가 작고, 코앞까지 가야 읽히고, 네 줄에 묶인다. 안내는 멀리서 읽혀야 한다.
  # ★ 글판은 **관문마다 하나**다 — stations 가 자리를 정한다 (판을 따로 배치하지 않는다.
  #   판과 관문이 어긋날 수가 없다). 문장도 과제의 것을 그대로 쓴다.
  text_display:
    max_panels: 16
    scale: 1.6
    view_range: 2.0
    line_width: 240
    y_offset: 2.6
    billboard: CENTER
    alignment: CENTER
    see_through: false
    shadowed: true
    background_argb: "0xC8140F0C"    # 먹 — 반투명
    accent_argb: "0xC8241A12"        # 주사 기 도는 먹 (문 = 종의 판)
    brightness: { block: 12, sky: 15 }
    title_prefix: "§6§l"
    arrival_id: 맞이                  # 이 관문의 판은 arrival.lines 를 쓴다 (과제가 없는 관문)

  # 배선 — MvtCommand 에 이미 들어갔다 (감사가 매번 확인한다)
  wiring:
    pending_commands:
      도강: "Antechamber.cross(player) — 종(BELL)과 같은 문"
      입도: "Antechamber.enter(player) — 나루로 되돌아온다"
