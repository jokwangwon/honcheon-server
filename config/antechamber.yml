# 입도진(入道津) — 강호에 들기 전에 서는 자리
# 기준 문서: docs/design/antechamber.md
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 나루인가
#
#   world_map.yml 이 이미 답을 적어 뒀다:
#     · 2211행  흑수나루: { pos: [118, 12], bearing: "동 — 강가", terrain: 물가 }
#     · 1518행  "★ 흑수나루가 이 물길의 한 점이다 — 청하현이 왜 나루를 갖는가의 답"
#     · 1351행  "흑수나루에서 강을 따라 오른다 — 나루의 뱃사람이 알려준다"
#
#   나루는 이 세계가 이미 가진 **문지방**이다. 강호에 든다는 것은 강을 건너는 것이고,
#   건네주는 것은 사공이다. 그리고 **사공은 이름 없는 자를 태우지 않는다** —
#   나룻배는 장부에 적고 건넨다. 그것이 이 세계의 접합(接合)이 무엇인지에 대한 정확한 은유다.
#
#   그래서 첫 소환은 **강 저편의 나루**다. 필드가 아니다. 여기서 몸을 익히고, 이름을 얻고,
#   배를 타고 건너면 그때 청하현이다. 떨구지 않았고, 가두지도 않았다 — **문은 배다.**
#
# 갇히지 않는다 (이 파일의 가장 중요한 절: gate.bridge_down)
#   봇이 꺼져 있으면(world_day <= 0) 시트가 영영 안 내려온다. 그때 사공은 **그냥 건네준다.**
#   장부 없이 건넌 자에게는 그렇다고 말해 준다. 대기실은 초대이지 감옥이 아니다.
#
# 결정론: 이 파일의 좌표에 난수는 없다. 조성기의 무늬는 Math.floorMod 해시다 (프로젝트 규약).
# ─────────────────────────────────────────────────────────────────────────────

version: 1

antechamber:

  # ═══════════════════════════════════════════════════════════════════════
  # 1. 자리 — 별도 월드 (Dojang 의 문법 그대로)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 별도 월드인 이유는 연무장과 같다: **세계에 자국을 남기면 안 된다.**
  # 여기서 허수아비를 백 번 베어도 소문이 돌지 않고, 여기서 굶거나 떨어져 죽지 않는다.
  # (평면 월드의 지면은 y5 가 아니라 **y-61** 이다. 이 프로젝트가 낙사로 한 번 데였다 —
  #  코드는 좌표를 지어내지 않고 월드에게 묻는다: getHighestBlockYAt.)

  world: honcheon_ipdo
  display_name: "입도진"

  # 딛는 자리 — 마당의 중심. y 는 지형이 정한다 (조성 시 실측)
  center: [0, 0]

  # 조성 판 (x/z 는 center 기준 오프셋. y 는 지면 기준)
  layout:
    yard:   { x: [-14, 19], z: [-14, 14] }    # 마당 — 객잔 뒷마당. 허수아비가 선다
    wall:   { height: 3 }                     # 마당의 담 — 동쪽(나루 쪽)만 열려 있다
    dock:   { x: [15, 24], z: [-2, 2] }       # 부두 — 마당에서 물로 이어지는 널판
    river:  { x: [20, 52], z: [-32, 32], depth: 3 }   # 흑수(黑水). 저편은 물안개다
    bell:   [24, 0]                           # 사공을 부르는 종 — ★ 이것이 문이다
    boat:   [27, 0]                           # 나룻배 — 매여 있다. 사공이 오면 뜬다
    lantern_every: 6                          # 등롱 간격 (결정론 — 난수 없음)
    dummies:                                  # 허수아비 — 맞아 주는 몸 (Dojang.dummy 와 같은 몸)
      - [-8, -4]
      - [-8,  0]
      - [-8,  4]
    dummy_durability: 20
    dummy_name: "§7허수아비"

  # 물안개 — 나루 밖으로 아무리 걸어도 아무것도 없다. 청크를 무한히 만들지 않는다.
  # ★ 이것은 벽이 아니라 **되돌림**이다. 죽이지 않고, 막지도 않고, 데려온다.
  mist:
    leash_blocks: 96
    line: "§8물안개가 길을 지운다 — 나루로 돌아왔다."

  # ═══════════════════════════════════════════════════════════════════════
  # 2. 문 — 언제 열리는가
  # ═══════════════════════════════════════════════════════════════════════
  gate:
    # ① 정상 — 강호에 이름이 올랐는가 (PlayerLedger.linked() / 봇 스냅숏의 sheet 블록).
    #    이것이 유일한 조건이다. **과제는 문을 잠그지 않는다** (아래 lessons.gating: false).
    open_when: linked

    # ② 봇이 꺼져 있을 때 — WorldBridge.worldDay() <= 0 (스냅숏이 없다 = 다리가 안 섰다)
    #    ★ 사공은 그냥 건넨다. 여기서 사람을 가두면 그것은 초대가 아니라 사고다.
    bridge_down:
      allow_passage: true
      lines:
        - "§8사공이 노를 든다. §7\"오늘은 장부가 없다 — 그냥 타라.\""
        - "§7강호의 장부가 서지 않았다. §c네가 벤 것은 아무 데도 적히지 않는다§7 — 다리가 서면 §f/혼천 접속§7."

    # ③ 아직 이름이 없을 때 — 거절한다. 그러나 **무엇을 하면 되는지** 말한다 (거절은 벽이 아니다)
    refuse:
      title: "사공이 노를 젓지 않는다"
      subtitle: "이름 없는 자는 못 태운다"
      lines:
        - "§8사공이 고개를 젓는다. §7\"이름 없는 자는 못 태운다. 나룻배는 장부에 적고 건넨다.\""
        - "§7디스코드에서 §f/혼천 시작§7 으로 사람이 되고, 여기서 §f/혼천 접속§7 으로 몸을 잇는다."

    # ④ 이름이 올랐다 — 배가 뜬다. 자동으로 건넨다 (0 = 종을 울릴 때까지 기다린다)
    opened:
      title: "배가 뜬다"
      subtitle: "강호에 이름이 올랐다"
      lines:
        - "§6사공이 삿대를 민다. §7\"§f{name}§7 이라 하였는가. 타라.\""
      auto_cross_seconds: 6

    # ⑤ 건넜다 — 여기서부터 강호다
    crossed:
      lines:
        - "§6── 강호(江湖) ──"
        - "§7배가 뭍에 닿는다. 뒤를 돌아봐도 나루는 안개뿐이다."
        - "§7언제든 §f/혼천 입도§7 로 나루에 돌아올 수 있다 — 몸을 다시 익히고 싶다면."

    # ⑥ 내리는 자리 — 앞의 것부터. 하나도 없으면 세계의 스폰 (마지막 보루 — 절대 갇히지 않는다)
    destinations: [흑수나루, 장터]

  # ═══════════════════════════════════════════════════════════════════════
  # 2-b. 배선 — 아직 MvtCommand 에 없는 명령 (★ 감사가 이것을 지킨다)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 이 두 명령은 **아직 없다.** MvtCommand 배선은 이 작업의 소관이 아니므로, 여기에 **적어 두고**
  # tools/antechamber_audit.py 가 매번 확인한다 — 배선되면 ✅, 안 됐으면 ⚠️(배선 대기).
  #
  # ★ 그리고 **문은 이 명령들에 달려 있지 않다.** 문은 부두의 종(BELL)이다. 명령은 편의일 뿐이고,
  #   배선이 영영 안 돼도 사람은 종을 울려 건널 수 있다. 그래서 이것은 위반이 아니라 경고다.
  wiring:
    pending_commands:
      도강: "Antechamber.cross(player) — 종(BELL)과 같은 문. 종 없이도 칠 수 있게"
      입도: "Antechamber.enter(player) — 이미 강호에 든 자가 나루로 되돌아온다 (몸을 다시 익히려고)"

  # ═══════════════════════════════════════════════════════════════════════
  # 3. 맞이 — 첫 소환의 목소리
  # ═══════════════════════════════════════════════════════════════════════
  arrival:
    title: "입도진(入道津)"
    subtitle: "강 저편이 강호다"
    lines:
      - "§6── 입도진 ──"
      - "§7눈을 뜨니 나루다. 물안개 너머 어딘가가 §f강호§7 다."
      - "§7사공은 아직 노를 들지 않는다 — §f이름 없는 자는 못 태운다§7."
      - "§8마당의 허수아비를 쳐 보아라. 몸이 먼저 알아야 한다."
      - "§8부두 끝의 §f종§8 을 울리면 사공을 부른다."
    # 이미 강호에 든 자가 재접속하면 나루를 다시 안 거친다. 다만 스스로 오면 맞는다
    revisit_line: "§7나루에 다시 섰다. §8종을 울리면 언제든 건넌다."

  # 대기실의 짐 — 나루의 것은 나루에 둔다 (연무장의 규약 그대로)
  # 목검과 방패가 없으면 손·격·태세를 **몸으로** 익힐 수가 없다. 그러나 강호로 가져가지 않는다.
  kit:
    give: true
    line: "§8누군가 두고 간 목검과 방패가 마당에 있다."
    take_back_line: "§8나루의 목검과 방패는 나루에 두고 간다."

  # ═══════════════════════════════════════════════════════════════════════
  # 4. 과제(課) — ★ 읽는 것이 아니라 해 보는 것이다
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 표지판에 적어 두고 끝내지 않는다. **실제 조작을 실제로 했을 때만** 과제가 닫힌다.
  #
  # ★★ detect 는 **엔진이 진짜 보는 것**의 이름이다. 코드가 여기서 조작을 지어내면 안 되고,
  #    이 값들은 다른 등록부에 이미 적혀 있는 것과 **글자 그대로 같아야 한다**:
  #      · combat.yml  defender_stance_mc.gestures  →  막기: isBlocking / 흘리기: isSneaking / 회피: isSprinting
  #      · gyeonggong.yml  activate                 →  "달리며 점프"
  #      · SkillListener 조작표                      →  좌클릭 = 기본 초식 / Shift+우클릭 = 격 태세 순환
  #      · MvtCommand 의 case 목록                   →  /혼천 수련 · /혼천 접속 이 실제로 있는가
  #    tools/antechamber_audit.py 가 이 대조를 돌린다. 화면이 세계에 대해 거짓말하면 잡힌다.
  lessons:
    # ★ 과제는 문을 잠그지 않는다. 문은 이름이 열고, 과제는 몸을 연다.
    #   (과제를 문의 조건으로 두면, 과제 하나가 깨진 날 사람이 나루에 갇힌다.)
    gating: false

    done_line: "§a✔ §f{title} §7— {done}"
    all_done:
      title: "몸이 알았다"
      subtitle: "이제 강을 건너라"
      lines:
        - "§6손도 격도 태세도 발도 익혔다. §7남은 것은 §f이름§7 뿐이다 — §f/혼천 접속§7."

    list:
      - id: 손
        title: "손 — 기본 초식"
        how: "§7허수아비를 §f좌클릭§7 으로 쳐라. 검을 든 손이 알아서 초식을 낸다 (1·2타 → 3타)."
        detect: 허수아비_타격
        count: 3
        done: "허수아비가 세 합을 맞았다."

      - id: 격
        title: "격(格) — 두름"
        how: "§7§fShift + 우클릭§7 — 두를 격을 바꾼다 (외공 → 발경 → 검기 → 강기)."
        detect: 격_태세_순환
        count: 1
        done: "격이 몸에 둘러졌다."
        # ★ 정직 — 경지가 두를 격이 없으면(범인·삼류) 이 과제는 **뜨지 않는다.**
        #   SkillEngine.armableGrades(realm) 이 비면 못 하는 조작이다. 못 하는 것을 가르치지 않는다.
        requires_armable_grade: true
        unavailable: "§8아직 두를 격이 없다. §7경지가 오르면 손이 먼저 안다."

      - id: 태세
        title: "태세 — 맞는 쪽의 선택"
        how: "§7몸짓이 곧 선택이다 — §f방패 들기§7=막기 · §f웅크림§7=흘리기 · §f달림§7=회피. 셋 다 해 보아라."
        detect: 방어_몸짓
        gestures: [isBlocking, isSneaking, isSprinting]   # ★ combat.yml defender_stance_mc.gestures 와 같아야 한다
        count: 3
        done: "세 가지 몸짓을 몸이 안다. §8(/혼천 태세 로 고정할 수도 있다 — 기본은 자동)"

      - id: 경공
        title: "경공(輕功) — 나는 발"
        how: "§7§f달리며 점프§7 — 발이 이미 움직일 때만 몸이 뜬다."
        detect: 경공_발동
        count: 1
        done: "발이 땅을 떠났다. §8(경지가 오르면 더 멀리 뛴다)"

      - id: 수련
        title: "수련 — 하루 다섯 구간"
        how: "§f/혼천 수련 <과목> <구간>§7 — 안 치면 §c아무것도 자라지 않는다§7. 어디에 쓸 것인가가 곧 네 빌드다."
        detect: 명령
        command: "수련"          # ★ MvtCommand 의 case 이름과 같아야 한다
        needs_args: true         # 도움말만 띄운 것은 배운 것이 아니다 — 실제로 배분해야 닫힌다
        count: 1
        done: "배분이 섰다. 내일부터 그렇게 쌓인다."

      - id: 접속
        title: "접속 — 강호에 이름을 올린다"
        how: "§f/혼천 접속§7 → 코드가 나온다 → §f디스코드§7 에서 확정한다. 그때 시트가 내려온다."
        detect: 명령
        command: "접속"          # ★ MvtCommand 의 case 이름과 같아야 한다
        needs_args: false
        count: 1
        done: "코드를 받았다. 디스코드에서 확정하면 배가 뜬다."

  # ═══════════════════════════════════════════════════════════════════════
  # 5. 글판 — TextDisplay (표지판이 아니다)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # 표지판(Sign)은 **글자가 작고**, 코앞까지 가야 읽히고, 네 줄에 묶인다. 안내는 멀리서 읽혀야 한다.
  # 그래서 글은 블록이 아니라 **TextDisplay 엔티티**로 띄운다 (Paper 1.21 — SkillDisplay·MobDisplay 의 문법):
  #   · billboard: CENTER  — 어디서 보든 정면으로 선다 (읽으려고 각도를 맞출 필요가 없다)
  #   · scale              — 표지판이 못 하는 바로 그것. 크기를 키운다
  #   · background(ARGB)   — 바닐라 반투명 검정 상자를 쓰지 않는다. 이 세계는 수묵이다
  #                          (먹 바탕 · 화선지 글씨 · 주사 강조 — resourcepack_design.yml 기조 그대로)
  #
  # ★ 상주 엔티티다. performance.yml vfx_entities.global_cap(120) 은 **연출용 임시 엔티티**의 예산이고
  #   이것은 다른 축이므로, 여기에 **따로 상한을 등록한다.** 넘으면 세우지 않는다 (조용히 안 세우지 않고 경고한다).
  text_display:
    max_panels: 16              # 상주 상한 — panels 목록이 이보다 길면 조성이 거부한다
    scale: 1.6                  # 글자 크기 배수 (표지판 대비. 멀리서 읽히는 값)
    view_range: 2.0             # 시야 배수 (1.0 ≈ 64블록. 2.0 = 마당 어디서든 읽힌다)
    line_width: 240             # 줄바꿈 폭 (픽셀)
    y_offset: 2.4               # 지면에서 띄우는 높이 — 눈높이 위 (허수아비에 가리지 않는다)
    billboard: CENTER           # FIXED | VERTICAL | HORIZONTAL | CENTER
    alignment: CENTER           # CENTER | LEFT | RIGHT
    see_through: false          # 벽 너머로 비치지 않는다
    shadowed: true
    # 수묵 팔레트 (ARGB). 배경은 먹, 글씨색은 각 lines 의 § 코드가 정한다
    background_argb: "0xC8140F0C"    # 먹 — 반투명 (알파 200)
    accent_argb: "0xC8241A12"        # 주사 기 도는 먹 (문 = 종의 판)
    brightness: { block: 12, sky: 15 }   # 밤에도 읽힌다 (나루는 항상 낮이지만 못 박아 둔다)
    title_prefix: "§6§l"                 # from_lesson 판의 제목 줄 서식 (코드가 정하지 않는다)

  # 글판의 자리와 내용. ★ from_lesson 을 쓰면 **과제의 문장을 그대로** 세운다 —
  #   판과 과제가 서로 다른 말을 하는 일이 원천적으로 불가능해진다 (화면이 세계에 대해 거짓말하지 않는다).
  #   only_if: armable / not_armable — SkillEngine.armableGrades(경지) 가 비었는가로 갈린다.
  #   ★ 이 둘은 **사람마다 다르게 보인다** (Player.hideEntity) — 범인에게 "격을 둘러라"라고 적힌 판이
  #     보이면 그것이 바로 거짓말이다. 못 하는 조작을 가르치는 판은 그 사람에게 뜨지 않는다.
  panels:
    - id: 맞이
      pos: [6, -10]
      lines:
        - "§6§l입도진 (入道津)"
        - "§7강 저편이 §f강호§7 다."
        - "§8사공은 이름 없는 자를 태우지 않는다."

    - id: 손
      pos: [-8, -8]
      from_lesson: 손

    - id: 격
      pos: [-8, 8]
      from_lesson: 격
      only_if: armable

    - id: 격_없음
      pos: [-8, 8]
      from_lesson: 격
      only_if: not_armable       # 같은 자리 · 다른 사람 — 둘이 겹쳐 보이는 일은 없다

    - id: 태세
      pos: [0, -12]
      from_lesson: 태세

    - id: 경공
      pos: [0, 12]
      from_lesson: 경공

    - id: 수련
      pos: [10, -8]
      from_lesson: 수련

    - id: 접속
      pos: [10, 8]
      from_lesson: 접속

    - id: 종
      pos: [22, 0]
      accent: true               # 문의 판 — 주사 바탕
      lines:
        - "§6§l나루 — 사공을 부른다"
        - "§7부두 끝의 §f종§7 을 우클릭하라. §8(= /혼천 도강)"
        - "§8이름이 없으면 사공은 노를 젓지 않는다."
