# 사냥터 개체군 (기계 판독용) — 구역이 곧 생태계다.
# 기준 문서: docs/design/mob_spawning.md §8
# 엔진: server-mvt/.../HuntingGrounds.java (init 이 이 파일을 읽는다. 없으면 코드 폴백으로 돈다 — 서버는 떠야 한다)
#
# 원칙: 정원(定員)과 재생 주기가 '고갈되지 않되 무한하지 않게' 만든다.
#       바닐라는 뿌리지 않는다 (world_purity.yml wild_spawn.allow 가 야생 스폰을 막는다) —
#       산야의 짐승은 이 표가 **심는다**.
#
# ★ 여기서 발명하지 않는 것:
#   - 개체 스탯(내구·전의·자연 무기·드롭·경지) → config/npcs/cheongha_npcs.yml 이 정본
#   - 짐승의 격(格) → cultivation.yml beast_ranks (영물 policy: 양산 금지 → 정원 0)
#   - 몸(mc_entity)·무장(loadout) → npcs 등록부의 몫. 아직 그 키가 없어 코드 폴백표가 산다
#     (docs/design/mob_spawning.md §8 ②. 그 키가 서면 폴백표는 죽는다)

version: 1

spawn:
  cycle_seconds: 10            # 재생 주기 — 한 구역에 최대 1마리/주기
  morale_cycle_seconds: 2      # 전의·표적 스윕
  player_near: 96              # 사람이 이 안에 없으면 산은 조용하다 (performance.yml npc_logic 예산)
  min_distance: 20             # 눈앞에 튀어나오지 않는다
  max_distance: 64
  max_block_light: 7           # 불이 끝나는 곳부터가 사냥터다
  # 구역당 태그 개체 상한 — 성능의 마지막 관문 (performance.yml load_scenarios.mob_swarm 이 mobs: 20 으로 잰다)
  #
  # ★ 18 → 20 으로 올린다. 이유: **치안이 정원을 올린다.**
  #   밤의 등록 정원 합은 15 인데, 치안_붕괴 구간(도적 밤 +4)이면 19 가 된다.
  #   상한이 18 이면 repopulate() 가 상한에서 돌아서고 — 등록된 정원이 **영원히 안 채워진다.**
  #   하필 **치안이 무너진 밤**, 세계가 가장 위험해야 할 바로 그때 도적이 안 차는 것이다.
  #   상한은 등록 정원이 아니라 **치안 최악의 정원**보다 커야 한다 (낮 13 · 밤 19 → 20).
  #   20 은 performance.yml 이 이미 부하 시험으로 재고 있는 눈금이다 — 새로 지어낸 수치가 아니다.
  #   검산: tools/world_purity_audit.py §⑤-d 가 이 부등식을 매번 다시 증명한다.
  zone_entity_cap: 20
  # ★ boss_respawn_seconds 는 **없앴다.** 그것이 병의 뿌리였다.
  #   300초 = 하루 288번. 세계는 갈호가 **하나**라고 믿는데, MVT 는 "도적 두목이 제거되었다"를
  #   5분마다 봇에 보고했다 — 같은 사람을 288번 죽였다고. 다리가 나른 것은 사실이 아니라 **거짓**이었다.
  #   두목의 되살아남은 아래 `succession` 이 **세계일**로 다룬다 (실시간 초가 아니다).

# 마을 무스폰 — 담장 밖 여유까지 (스폰이 담 밑에 붙는 것을 막는다)
town:
  zone: "청하현"
  margin: 8

# ═══════════════════════════════════════════════════════════════════════════
# 마을 가축(家畜) 정원 — **무협 마을에 닭 한 마리 없으면 그것도 이상하다**
#
#   자연 스폰이 0 이 된 뒤(wild_spawn.allow: []), 가축은 **아무도 놓지 않으면 세계에 0마리**다.
#   예전엔 "가축은 조성기가 CUSTOM 으로 놓는다"고 적어 두었는데 — **아무도 안 놓고 있었다.**
#   등록부가 약속하고 코드가 안 지키면 그것이 거짓말이다. 그래서 여기서 놓는다.
#
#   ★ 왜 조성기가 아니라 사냥터 엔진인가 (판단):
#     조성기는 건물을 **한 번** 짓는다. 가축은 **죽는다** — 잡아먹고, 늑대가 물고, 떨어진다.
#     한 번 놓고 끝나면 사흘 뒤 마을은 다시 텅 빈다. 가축은 **정원(定員)** 이지 건축이 아니다.
#     정원을 지키는 기계는 이미 있다 — repopulate 다. 같은 기계를 쓴다.
#
#   ★ 가축은 **사냥감이 아니다**:
#     - 전의 스윕에서 빠진다 (도망치지도, 덤비지도 않는다 — 마당의 닭은 그냥 마당에 있다)
#     - 명패는 회색(무해). cultivation.yml mc_perception 이 「회 = 압도적 하수·적립 0」이라 적었다
#     - 번식은 막힌다 (onBreed) — 정원제이므로. 는 것은 시간이지 교미가 아니다
#   ★ 마을 안이라 **광원·거리 조건을 안 본다** (짐승의 규칙은 어둠이지만 가축은 마당의 것이다).
#
#   배선: HuntingGrounds.repopulateLivestock() — 같은 티커, 같은 정원, 같은 census.
#   ⚠ anchor 는 조성기가 등록한 이름이어야 한다. 지금 「외양간」·「마당」 앵커가 **없어서**
#     장터를 쓴다 — 조성기 담당이 마당 앵커를 세우면 그 이름으로 바꾸면 된다 (코드는 안 바뀐다).
# ═══════════════════════════════════════════════════════════════════════════
livestock:
  zone: "청하현"
  anchor: "장터"             # anchors.yml 의 이름 (발명 금지: 관아·청하객잔·장터·의뢰소·전장·의방·표국)
  radius: 28                 # 앵커 둘레 이 안에 놓는다 (마을 복판 — 담장 밖으로 안 샌다)
  cycle_seconds: 30          # 가축은 급하지 않다 (사냥터 10초보다 느리게 — 성능)
  population:                # 낮·밤이 같다 — 닭은 밤에도 닭이다
    dak:    { day: 6, night: 6 }
    so:     { day: 3, night: 3 }
    yang:   { day: 4, night: 4 }
    dwaeji: { day: 2, night: 2 }

# ═══════════════════════════════════════════════════════════════════════════
# 사냥터 — **세계에 서 있는 모든 산야의 짐승이 여기서 난다.** 다른 경로는 없다.
#   (world_purity.yml wild_spawn.allow: [] — 자연 스폰이 0 이 되었다)
#
# zone 은 **조성기가 등록한 구역명**이다 (run/mvt/plugins/HoncheonMVT/zones.yml). **발명 금지.**
#   등록된 16곳 중 사냥터가 될 수 있는 것만 골랐다 — 마을·객잔·관아·도관에 호랑이는 안 난다.
#
# 개체는 **npcs/cheongha_npcs.yml 에 등록된 것만** 쓸 수 있다. 지금 그 등록부의 짐승은
#   산늑대·멧돼지·호랑이·반달곰·백영묘(영물) 다섯 종 + 사람(도적·갈호) 뿐이다.
#   물짐승도 굴짐승도 **한 종도 없다** — 그래서 물과 굴은 아래에서 정원 0 이다(발명하지 않는다).
# ═══════════════════════════════════════════════════════════════════════════
grounds:
  north_road:
    zone: "북쪽 산길"          # 청하현의 관문 — 초심자의 첫 사냥터
    population:                # 낮은 들짐승과 도적, 밤은 맹수
      san_neukdae:       { day: 4, night: 6 }
      metdwaeji:         { day: 3, night: 2 }
      horangi:           { day: 0, night: 1 }   # 맹수는 밤에 나온다
      bandal_gom:        { day: 0, night: 1 }
      north_road_bandit: { day: 3, night: 4 }
      galho:             { day: 1, night: 1 }   # 두목 — 한 명뿐이다
      baegyeongmyo:      { day: 0, night: 0 }   # 영물 = 등록제. 관리자 소환으로만 선다

  # ★ 「녹림 소채 (북산)」은 **여기 없다 — 내가 지난 라운드에 넣었다가 뺐다.**
  #
  #   등록부가 나를 고발했다. config/npcs/regions/nokrim_sochae.yml:12 —
  #     "★ 겹치지 않는다: 북쪽 산길의 도적(north_road_bandit·갈호)은 HuntingGrounds 의 것이다.
  #      여기 사람은 전부 새 id(sochae_*)이고 「녹림 소채 (북산)」 구역에 선다.
  #      **같은 도적이 두 번 서지 않는다** — 다른 도적이 다른 산에 선다."
  #   그리고 region_populace.yml:137 이 그 산채의 정원을 이미 적었다:
  #     required_roles.산채 = [채주(도백), 부두목(곰치), 졸개, 망꾼, 살림] — 14인.
  #
  #   내가 거기에 north_road_bandit 를 4~5명 더 심으면 **그 산채에 도적이 두 겹으로 선다.**
  #   등록부가 명시적으로 금지한 바로 그것이다. 산채의 인구는 **지역 인구층의 것**이다.
  #   사냥터가 손댈 자리가 아니다. (검산: audit §⑤ 가 이제 이 겹침을 잡는다)

  # 진령의 심산 — **맹수의 땅.** 마교 전초가 여기 숨은 이유가 그것이다(사람이 안 온다).
  #   초심자가 오면 죽는다. 그것이 이 구역의 뜻이다 — 세계에 **깊이**가 있어야 한다.
  #   백영묘(영물)의 등록 자리는 여기다. 정원은 **0** — 양산 금지. 관리자 소환·기연으로만 선다.
  jinryeong_simsan:
    zone: "마교 전초 (진령 심산)"
    population:
      horangi:           { day: 1, night: 2 }   # 밤의 산은 호랑이의 것이다
      bandal_gom:        { day: 1, night: 2 }
      san_neukdae:       { day: 2, night: 3 }
      metdwaeji:         { day: 2, night: 1 }
      baegyeongmyo:      { day: 0, night: 0 }   # ★ 영물의 자리 — 등록만 하고 심지 않는다

# ── 물과 굴 — **비운다. 그리고 비운 이유를 적어 둔다** ────────────────────────
#   등록부가 침묵하면 「잊었는가 / 뜻인가」를 구별할 수 없다. 그래서 침묵하지 않는다.
planned_empty:
  - zone: "흑수나루"
    reason: |
      **물. 정원 0.** 강에 물고기가 헤엄치지 않는다 (world_purity.yml water_note).
      낚시는 안 깨진다 — 어획은 전리품표가 준다(물고기 개체와 무관). economy.yml 에 물고기 항목이 없다.
      되돌리려면 두 가지가 먼저다: ㉠ npcs 등록부의 물짐승 (**지금 한 종도 없다**)
      ㉡ HuntingGrounds.pickSpawn 의 수중 배치 경로 (지금은 standable() — 단단한 바닥 + 공기 2칸.
         물고기는 이 조건을 **원리적으로 통과할 수 없다**).
  - zone: "장강수로채 총채"
    reason: "물 위의 채. 위와 같다. 여기 사는 것은 짐승이 아니라 **사람**(수로채)이다 — NPC 의 몫이지 사냥터가 아니다"
  - zone: "화산파"
    reason: "도관이다. 사람이 산다. 산문 안에 멧돼지가 나면 그건 사냥터가 아니라 사고다"
  - zone: "장안"
    reason: "성시(城市). 성문 안은 관(官)의 땅이다"
  - zone: "굴 (cave_archetypes)"
    reason: |
      **박쥐도 끈다.** 자연 동굴이 없는 세계다 — **굴은 우리가 판다**(은신처·기연굴·산적굴·제단굴).
      우리가 판 굴에 바닐라 박쥐가 날면 그건 **던전**이지 비동(祕洞)이 아니다.
      굴의 기척이 필요하면 그때 이름과 정원을 가지고 등록한다.

# ═══════════════════════════════════════════════════════════════════════════
# 승계(承繼) — **두목은 되살아나지 않는다. 다른 사람이 그 자리를 잇는다.**
#
#   사용자: "그 지역이 완전 죽는건 아닙니다 — 누군가가 두목을 대신할수도 있습니다."
#
#   ★ 이것은 리스폰 타이머의 문제가 아니라 **세계의 사건**이다.
#     갈호를 죽이면 **갈호는 돌아오지 않는다.** 그러나 **산채는 죽지 않는다** —
#     며칠 뒤 도백(채주)이 새 사람을 산길로 내려보낸다. 그는 **다른 사람**이다.
#     그래서 우리는 수치를 깎지 않는다. **사실을 바로잡는다** —
#     전에는 같은 사람을 288번 죽였다고 보고했고, 이제는 다른 사람을 30일에 한 번 죽인다.
#
#   ★ 여기서 **아무것도 지어내지 않았다.** 셋 다 등록부에서 왔다:
#     · days: 30      ← config/npcs/region_populace.yml death.boss_respawn_days
#                        ("채주·장문은 다시 서지 않는다 — **후계가 선다**")
#     · 후계자 곰치   ← config/npcs/regions/nokrim_sochae.yml people.sochae_budu
#                        (부두목 · 이류 — **갈호와 같은 경지다**. 그가 잇는 것이 옳다)
#     · 갈호의 주인   ← nokrim_sochae.yml relations: { person: galho, type: 주인, kin: sochae_chaeju }
#                        갈호는 도백의 사람이었다. 그러니 후계를 보내는 것도 도백이다.
#
#   ★ **사슬은 유한하다.** 곰치까지 죽으면 산길에 두목이 없다 —
#     녹림이 산길을 포기한 것이다. 그것이 **끝 상태**이고, 그래서 이것은 농장이 아니다.
#     (사슬을 늘리려면 등록부에 사람을 더 적어라. 코드는 안 바뀐다.)
#
#   ★ 세계일이다. 실시간이 아니다. 봇의 자정 스케줄러가 정본이다
#     (HoncheonBot: "자정(Asia/Seoul)마다 세계일 +1 — 실제 하루 = 세계 1일").
#     ★ 그리고 **재기동을 넘어 산다** — 상태는 plugins/HoncheonMVT/hunting_state.yml 에 굽는다.
#       메모리에만 있으면 서버를 껐다 켤 때마다 갈호가 되살아난다. 그러면 고친 것이 아니다.
# ═══════════════════════════════════════════════════════════════════════════
succession:
  days: 30                     # 세계일. region_populace.yml death.boss_respawn_days 그대로
  roster: "npcs/regions/nokrim_sochae.yml"   # 후계자의 **정의는 저기 하나뿐이다** (베끼지 않는다)
  heirs:
    galho: [sochae_budu]       # 갈호 → 곰치(부두목). 그 다음은 **없다** — 산길이 조용해진다
  # ⚠ 곰치가 산길로 내려가면 **산채에 부두목이 없다** (region_populace.yml required_roles.산채).
  #   그것은 사실이고 옳다 — 그가 자리를 옮겼으니까. 다만 지역 인구층이 그를 산채에서 **빼야** 한다.
  #   그 배선은 Populace 담당의 몫이다 (보고서에 넘겼다). 안 빼면 곰치가 두 곳에 선다.

# ═══════════════════════════════════════════════════════════════════════════
# 소탕(掃蕩) — **졸개 하나를 벤 것은 지역의 치안을 흔들 만한 사실이 아니다**
#
#   병: 졸개를 벨 때마다 다리가 `도적_부분_소탕`(치안 +2)을 보냈다.
#       구역당 10초에 한 마리가 되살아나니 — **4분이면 치안이 100 이 됐다.** 농장이었다.
#
#   ★ 등록부의 **이름이 이미 답을 말하고 있었다: 「부분 소탕」.**
#     소탕은 **시체 하나**가 아니라 **무리가 비었다**는 사실이다.
#     그래서 이 사건은 이제 **그 산길의 도적 정원이 실제로 0이 되었을 때** 한 번 난다.
#     (정원제는 이미 서 있다 — census 가 그것을 안다.)
#
#   ★ 졸개는 **계속 되살아난다.** 산길에 도적이 없으면 그건 산길이 아니다.
#     우리가 고친 것은 **되살아남이 아니라 보고**다. 다리는 사실을 나른다.
#
#   ★ cooldown 도 지어내지 않았다: region_populace.yml death.respawn_days = 5
#     ("산채는 사람을 다시 모은다"). 산길의 도적은 그 산채에서 온다 —
#     그러니 **5 세계일에 한 번**만 그 길을 진짜로 비울 수 있다. 그 전엔 산채가 아직 못 모았다.
# ═══════════════════════════════════════════════════════════════════════════
clearance:
  cooldown_days: 5             # 세계일. region_populace.yml death.respawn_days 그대로
  role: 졸개                   # 이 배역이 0이 되면 「부분 소탕」이다 (두목은 succession 이 따로 센다)

loot:
  weapon_drop_chance:          # 병기 전리품 — 졸개는 반, 두목은 확실히
    졸개: 0.5
    두목: 1.0
    default: 0.5

# ═══════════════════════════════════════════════════════════════════════════
# 치안(治安)의 이음매 — region_state.yml threshold_effects.치안_저하 의 배선
#
#   등록부는 이미 이렇게 **약속**했다:
#       치안_저하 (치안 < 30) → "도적/절도 사건 자동 발생률 증가"
#                              → "야간 이동에 위험 조우 판정 추가"
#       치안_과잉 (치안 > 70) → "관군 순찰 증가"
#   그런데 **아무도 읽지 않았다.** 청하현의 치안이 12로 무너져도 북쪽 산길의 도적은
#   정확히 3명이었다 — 등록부가 거짓말을 하고 있었다.
#
#   이제 읽는다. **치안이 곧 도적의 정원이다.**
#     치안이 무너지면 산길에 도적이 는다 (밤에 더). 그것이 이 세계의 문법이다.
#     치안이 넘치면 관군이 순찰한다 — 도적이 산길에서 밀려난다.
#
#   ★ 정본은 **봇의 장부**다 (WorldBridge.state().region() 스냅숏).
#     MVT 는 읽기만 한다 — 계산을 둘이 하면 세계가 둘이 된다.
#   ★ 결정론: 난수 없다. 치안 값 → 첫 일치 구간 → 정원 가감. 같은 치안이면 같은 산길이다.
#   ★ 정원 0 인 자리는 **움직이지 않는다** — "이 산길엔 낮에 도적이 없다"고 등록했으면
#     치안이 무너져도 없다. 없던 것을 치안이 **만들지는** 않는다 (등록제).
#
#   배선: HuntingGrounds.quotaFor() — 정원을 세는 그 자리에서 한 번만 더한다.
# ═══════════════════════════════════════════════════════════════════════════
security:
  stat: 치안
  fallback: 50               # 봇 스냅숏이 아직 없다 — 세계는 기준값(region_state 기준 50)에 선다
  applies_to: 졸개           # 배역(role). 짐승은 관군을 두려워하지 않고, 두목은 하나뿐이다(양산 금지)
  bands:                     # 위에서부터 첫 일치. min/max 는 **포함**
    - id: 치안_붕괴
      max: 14
      day: 2
      night: 4
      why: "산길이 도적의 것이 된다 — 치안_저하의 극단. 밤에 북쪽 산길을 넘는 것은 도박이다"
    - id: 치안_저하
      max: 29                # region_state.yml threshold_effects.치안_저하 = 「치안 < 30」
      day: 1
      night: 2
      why: "★ 등록부의 약속 — 「도적 자동 발생」 + 「야간 이동 위험 조우」. 그래서 밤이 두 배다"
    - id: 치안_과잉
      min: 71                # threshold_effects.치안_과잉 = 「치안 > 70」
      day: -1
      night: -1
      why: "관군 순찰. 도적이 밀려난다 (정원은 0 아래로 내려가지 않는다)"
