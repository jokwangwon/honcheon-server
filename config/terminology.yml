# 용어 정책 (기계 판독) — 신무협 기준의 표시 용어 치환표
# 기준 문서: docs/design/terminology_policy.md
# 대원칙: 내부 키(DB sheet·config·이벤트 타입)는 불변 — 표시 문자열만 치환한다 (마이그레이션 0)

principles:
  - "신무협 표준어는 유지한다 — 독자가 이미 아는 말이 가장 쉬운 말이다 (비무·내공·경지명)"
  - "고문투·장부투는 쉬운 말로 치환한다 — 뜻을 사전 없이 알 수 있어야 한다"
  - "내부 키 불변 — 치환은 표시층(embed·액션바·명령 설명)에서만 (DB 마이그레이션 회피)"
  - "새 표시 용어도 등록제 — 이 표에 없는 치환 금지"

# ─── 치환 (고문투 → 신무협/쉬운 말) ───
display_terms:
  화후:
    display: 수련
    internal_keys: [화후_원장, 오늘_적립, 적립일]   # 시트 키 불변
    reason: "火候 — 단약·수행 문맥의 고문투. '수련 +2일치'가 즉독 가능"
  원장:
    display: 정보
    compat: "명령 /혼천 원장 은 하위호환 유지 — /혼천 정보 와 동일 동작"
    reason: "元帳 — 장부투. 캐릭터 조회의 표시명으로는 '정보'가 평이"
  전낭:
    display: 소지금
    reason: "錢囊 — 사전 없이 안 읽힌다"
  문답:
    display: 시험
    scope: 사사_흐름_표시만    # 이벤트 타입 '사사_문답'은 내부 키라 불변
  지참인_지불:
    display: "가져온 이가 임자"
    reason: "어음 법률투 — 뜻은 같고 말은 쉽게"

# ─── 유지 (신무협 표준 — 치환하지 않는다) ───
keep_terms:
  - { term: 비무, reason: "장르 표준 — 대체어(스파링)가 오히려 톤을 깬다" }
  - { term: 경지명_삼류_생사경, reason: "신무협 공용 사다리" }
  - { term: 내공·심법·단전, reason: "장르 기초 어휘" }
  - { term: 기세, reason: "직관어" }
  - { term: 사사, reason: "'~에게 사사했다' — 현대 국어에서도 통용" }
  - { term: 서장·출도, reason: "장 구조·데뷔의 장르 관용" }
  - { term: 전장(錢莊), reason: "은행의 무협 표준 대응어 — 대체 시 세계관 이탈" }
  - { term: 문·냥·금, reason: "화폐 단위 — 단순 서수라 혼선 없음" }
