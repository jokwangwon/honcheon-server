# 리소스팩 디자인 토큰 (기계 판독용) — 슬롯 등록제·색 규율·픽셀 스펙
# 기준 문서: docs/design/resourcepack_design.md
# 원칙: 스펙(슬롯·색·크기)은 계약, 아트(PNG)는 교체형 — 코드는 이 표로만 팩과 만난다

status: 플레이스홀더               # 프로그래머 아트 — 기능 검증용. 승격 = PNG 교체 (코드 불변)

design_language:
  기조: "무협 수묵 — 먹과 한지, 저채도 기본. 채도는 의미에만"
  장식: "정보가 장식보다 먼저 — HUD 글리프 1초 가독. 화려함은 세계(파티클)의 몫, UI는 조용하게"

# ─── 색 규율 — 시스템 색 = 의미 색 (변경은 커밋으로) ───
semantic_colors:
  기세: { 압도적_하수: gray, 하수: white, 동수: yellow, 상수: red }   # MC 색 코드 틴트
  장비_품질: { 범철: gray, 정련: white, 보병: aqua, 신병: gold, 마병: dark_red }
  colorblind_rule: "색 단독 금지 — 아이콘 병기 (기세는 아이콘+색 이중 표기 기확정)"

# ─── 슬롯 등록제 — 사설 영역 대역 선할당 (코드포인트는 계약) ───
glyph_slots:
  E000_E00F: { band: 기세_전투_아이콘, used: { E000: "기세 — 상승 화염 실루엣 + 우상단 분리 불티 1px (솟는 기운) · 농담 4단 백색 계열 (2026-07-16 승격 — 심이 밝고 가장자리가 마른다. 틴트가 곱해도 계단이 남는다)" } }
  E010_E01F: { band: 게이지, used: { E010_E018: "화후_9단 — 고정 붓홈(9단 바이트 동일) + 빈 홈 옅은 먹 바닥 + 좌→우 농담 4단 채움 + 선두 2열 마른 붓 (RP-2 합의 2026-07-14 — 틱·테이퍼 폐기)" }, note: "내력·원기 = 같은 글리프를 색 틴트로 재사용 (슬롯 절약) · 눈: texture_audit 축 ㉒" }
  E020_E03F:
    band: 경지_칭호_문장
    used:
      E020_E027: "경지 문장 8단 (삼류~생사경) — 하위 획 수 一二三 / 중위 봉우리·검·검기 / 상위 원환·원환+만월핵 3계열 · 농담 4단 (2026-07-16 승격 — α≥128 실루엣은 2값 판과 픽셀까지 동일: 축 ㉑ 인접 XOR 합격값 보존)"
      E030: "비무 — 교차 목검 두 자루 + 가운데 묶은 띠 (백색 4단 · Sparring 카운트다운 액션바 배선 2026-07-16). ★ 등록 지연 사과: 빌더(bimu_icon)는 굽는데 이 표가 침묵했다 — 2026-07-16 등재 (등록제 위반 해소, pack_upgrade_v1.md §4 T5 발견)"
    note: "별호 장식은 E028+ (E031~ 잔여)"
  E040_E05F: { band: 장비_등급_아이콘, note: "범철~신병 + 마병 혈향" }
  E060_E07F: { band: 세력_문장 }
  E080_E09F: { band: GUI_배경, used: { E080: "경락도 배경 패널 176x110 (먹색+화선지 테두리+전각 도장풍 주사색 4귀 ㄱ자획+제목 구분선 y=17+5px 인셋 점선 여백 가이드)" }, note: "전낭 탭·상점은 E081+ — 음수 공백 기법, ascent 인게임 튜닝" }
  E0A0_E0AF: { band: 음수_공백, used: { E0A0_E0A5: "space 프로바이더 advances — -8/-16/-32/-64/-128/+1 (2^n 음수 폭 + 미세조정 +1, E080 제목 음수 공백 기법용)" }, note: "비트맵 아님 — 폭만 갖는 space 프로바이더. F26 동일 적용: advances 키도 chr()로만" }
  E0B0_E0BF:
    band: 서장_기억첩
    used:
      E0B0: "장 구분선 — 44x5 한 획 (起筆 눌림 → 마른 收筆, h32 결정론 갈라짐) · 백색+알파 = 본문 글자색이 먹을 입힌다 · ascent 3 잠정(인게임 튜닝)"
      E0B1: "붓점 — 8x8 낙점 (머리 눌리고 꼬리 뺀다) · 백색 4단 틴트"
      E0B2: "찍힌 인장 — 8x8 주사 직접 채색 (§4.1: 주사는 선택 확정·출도 인장에만 — semantic_red_registry 등재) · 각(刻)은 투명 = 화선지가 비친다"
      E0B3: "빈 인장 — 8x8 먹 틀 직접 채색 (클릭 전 선택 표식 — §4.1: 색 없이도 찍힌 인장과 형태로 갈린다: 열린 틀 vs 찬 몸)"
    note: "【SJ-002 · 2026-07-16 비트맵 4장 구움 — seojang_presentation.md §3.2·§4.1 이 이름 댄 것만 (그 밖의 장식 발명 금지)】 E0B4~ 잔여 예약. used 등록 + 빌더 프로바이더 반영은 한 몸 (assert_unique_codepoints 가 충돌을 기동 전에 문다). ★ Java 배선(SeojangBook 조판)은 미결 — SJ-002/003 회차의 몫 (등록부·빌드 대조는 이 등재로 완료, 이제 코드가 값을 박아도 된다)"
  registration: "슬롯 추가 = 본 파일 등록 + build_resourcepack.py 반영 (등록제 문법)"
  pua_rule: "F26 — 소스·데이터 어디에도 PUA 문자 리터럴 직접 삽입 금지: 코드 chr()/\\uXXXX, JSON ensure_ascii. 편집·전송 중 조용히 유실되며 빈 chars 하나가 팩 전체를 무효화한다"

# ─── 바닐라 텍스처 교체 채널 등록제 — HUD·인벤토리 (1.21.4 / pack_format 46) ───
# 폰트 글리프와 달리 틴트 불가 채널 — 직접 채색 허용. 크기·슬롯 좌표는 바닐라 계약 (틀리면 HUD가 깨진다)
vanilla_texture_channels:
  hud_체력:
    path: "minecraft/textures/gui/sprites/hud/heart/"
    sprites: { container: 9x9, full: 9x9, half: 9x9, container_blinking: 9x9, full_blinking: 9x9, half_blinking: 9x9 }
    design: "하트 대신 기혈 구슬(단약) — 주사 채움+먹 테두리, 점멸=화선지 백화. half는 절단면 음영 열로 반 칸 1초 가독"
    out_of_scope: "absorbing·poisoned·withered·hardcore 변형 = 바닐라 유지 (미등록 = 교체 금지)"
  hud_핫바:
    path: "minecraft/textures/gui/sprites/hud/"
    sprites: { hotbar: 182x22, hotbar_selection: 24x23 }
    design: "먹색 반투명 패널+화선지 테두리+희미한 슬롯 구분선, 선택 프레임은 주사 2px"
    note: "hotbar_selection은 24x24가 아니라 24x23 (바닐라 blit 계약) — 하단 걸침 인게임 확인"
  container_인벤토리:
    path: "minecraft/textures/gui/container/"
    sprites: { inventory: "256x256 (유효 176x166)", generic_54: "256x256 (유효 176x222, y=125 심 행)" }
    design: "화선지 몸체+먹 외곽+슬롯 인셋 3톤(음영·내부·광) — 바닐라 입체 문법을 수묵 톤으로만 재채색"
    invariant: "슬롯 18x18 격자 좌표 = 바닐라 메뉴 계약(아이템 좌표-1) 불변 — 위치·크기 변경 금지, 색만"
  container_작업:                    # 2026-07 신설 — 인벤토리·궤만 덮고 화덕을 두면 열 때마다 바닐라가 튀어나온다
    path: "minecraft/textures/gui/container/"
    sprites: { furnace: "256x256 (유효 176x166)", smoker: 동일, blast_furnace: 동일, crafting_table: "256x256 (유효 176x166)" }
    design: "인벤토리와 같은 화선지 문법. 아궁이 불꽃 게이지는 꺼진 상태(먹빛 마름모) — 타는 그림은 코드가 blit 한다"
    invariant: |
      슬롯 박스 좌표 = 바닐라 메뉴 계약 (아이템 좌표-1) 불변:
        화로(FurnaceMenu·SmokerMenu·BlastFurnaceMenu — 셋이 같은 배치): 재료 (55,16) · 연료 (55,52) · 결과 (111,29)
        목공대(CraftingMenu): 3x3 (29+18c, 16+18r) · 결과 (123,34)
        공통 아래 절반: 플레이어 인벤 (7+18c, 83+18r) · 핫바열 (7+18c, 141)
    note: "화덕 3종은 배치가 같으니 **같은 그림 한 장**을 세 경로에 쓴다 (바닐라도 같은 배치다)"
    out_of_scope: "모루·양조대·베틀·대장간 GUI = 바닐라 유지 (블록 텍스처는 덮었으나 GUI 는 미등록 — 등록 없이 교체 금지)"
    거래_GUI_불요: "서버는 바닐라 상인 GUI(container/villager.png)를 쓰지 않는다 — 거래는 LedgerGui 의 커스텀 인벤토리다 (Merchant API 미사용 확인). 그래서 그 채널은 등록하지 않는다"
  widget_메뉴:                       # 2026-07 신설 — 버튼·탭·툴팁·스크롤바 (1.21 GUI 스프라이트 계약)
    path: "minecraft/textures/gui/sprites/widget/ · minecraft/textures/gui/sprites/tooltip/"
    sprites:
      button: "200x20 (border 3)"
      button_highlighted: "200x20 (border 3)"
      button_disabled: "200x20 (border 1)"
      tab: "130x24 (border l2 t2 r2 b0)"
      tab_highlighted: 동일
      tab_selected: 동일
      tab_selected_highlighted: 동일
      scroller: "6x32 (border 1)"
      scroller_background: "6x32 (border 1)"
      text_field: "200x20 (border 1)"
      text_field_highlighted: 동일
      slider: "200x20 (border 1)"
      slider_highlighted: 동일
      slider_handle: "8x20 (border l2 t2 r2 b3)"
      slider_handle_highlighted: 동일
      tooltip/background: "100x100 (border 9)"
      tooltip/frame: "100x100 (border 10 · stretch_inner)"
    design: |
      화선지 몸 + 먹 테 + 되비침/그늘 1px (바닐라의 입체 문법을 수묵 톤으로만 재해석).
      상태는 **색이 아니라 밝기**로 오른다 (colorblind_rule): 기본 → 눌림은 종이가 밝아지고,
      비활성은 빛이 죽는다. 주사(朱砂)는 눌린 버튼의 밑줄·고른 탭의 인끈 한 줄뿐 —
      **있고 없음**이 곧 정보다 (색조 구분에 기대지 않는다).
    invariant: |
      ★ **.mcmeta 를 굽지 않는다.** 1.21 위젯은 나인슬라이스이고 테두리 폭은 <스프라이트>.png.mcmeta 가
      정한다. 리소스팩은 **파일 단위로** 겹치므로, PNG 만 넣고 mcmeta 를 넣지 않으면 바닐라의 mcmeta 가
      그대로 산다 ⇒ 테두리 폭·늘어나는 법·클릭 좌표가 한 픽셀도 움직이지 않는다.
      대신 두 가지가 강제된다:
        ① 치수가 바닐라와 **똑같아야** 한다 (위 표는 1.21.11 client jar 실측치. 어긋나면 나인슬라이스가
           엉뚱한 데를 자른다 = 버튼이 찢어진다. write_ui_sprites 가 굽기 전에 대조하고 막는다).
        ② 늘어나는 자리는 **균질해야** 한다 — 가운데는 가로로 깔리므로(버튼 폭 98·150·200…) 행마다
           한 색이어야 하고, 좌·우 띠는 세로로 깔리므로 열마다 한 색이어야 한다.
           그래서 화선지 결(fiber)은 **가로줄로만** 넣는다 (세로 결은 좁은 버튼에서 씹힌다).
    out_of_scope: "checkbox·cross_button·page_forward/backward·locked_button·slot_frame·toast = 바닐라 유지 (미등록 = 교체 금지)"
  hud_조준:                          # 2026-07-16 신설 — B-036
    path: "minecraft/textures/gui/sprites/hud/"
    sprites: { crosshair: 15x15 }
    design: "붓 네 획이 안쪽을 겨눈다 — 가운데 3x3 여백 (조준의 눈은 비워 둔다). 획은 화선지 밝기 + 먹 외곽"
    note: "★ 바닐라는 크로스헤어를 **반전 블렌드**로 그린다 (배경색 반전 합성) — 검은 픽셀은 무연산이라 먹 외곽은 인게임에서 조용하고, 화선지 획이 배경을 뒤집어 어디서나 보인다 (바닐라 흰 십자와 같은 물리). 치수는 client-1.21.11.jar 실측"
    out_of_scope: "crosshair_attack_indicator_* = 바닐라 유지 (미등록 = 교체 금지)"
  hud_숨:                            # 2026-07-16 신설 — B-036 "air(물속 거품)"
    path: "minecraft/textures/gui/sprites/hud/"
    sprites: { air: 9x9, air_bursting: 9x9, air_empty: 9x9 }
    design: "숨(息) 구슬 — 화선지 몸에 물의 서늘함 한 김 (저채도 · 청량 면적 규율 준수) + 좌상 광. 터짐 = 위가 열리고 물방울이 튄다 (형태 변별 — 색맹 규약). empty = 기혈 구슬 소켓과 같은 파인 문법 (그늘 + 되비침 립)"
    note: "1.21.11 은 air_empty 가 있다 (빠진 숨 소켓) — 세 장이 한 게이지다. 치수 실측 9x9"
  boss_bar_내공내력:                  # 2026-07-16 신설 — B-036. 실사용 채널만 (EnergyBossBar)
    path: "minecraft/textures/gui/sprites/boss_bar/"
    sprites: { blue_background: 182x5, blue_progress: 182x5, red_background: 182x5, red_progress: 182x5 }
    design: "xp 내공바와 한 문법 — 먹 테 + 3행 몸(광/몸/그늘) + 몸통 5px 저주파 결. 파랑 = 쪽빛(藍 — 옥 내공바와 갈리는 남기) · 빨강 = 주사 계열 (기혈 구슬과 같은 핏줄). background 는 같은 색 계열의 파인 홈 — 빈 바에서도 채널色이 산다"
    note: "색·구간의 등록부는 config/skill_motion.yml hud.energy_bossbar (평시 BLUE · 고갈 RED · overlay PROGRESS — ★사용자 확정 2026-07-15) — 그 표가 실사용의 전부라 두 색만 굽는다"
    out_of_scope: "green·pink·purple·white·yellow·notched_* = 바닐라 유지 (미등록 = 교체 금지 — 쓰지 않는 채널을 미리 칠하지 않는다)"
  xp_bar_불가침: "XP 바 기능·위치는 내력 표시용 예약 — 텍스처 톤 변경만 허용, 숨기기 금지 (이번 교체 범위 밖, 바닐라 유지)"
  registration: "교체 추가 = 본 채널 등록 + build_resourcepack.py 반영 (glyph_slots와 같은 등록제 문법)"

# ─── 픽셀 스펙 ───
pixel_spec:
  폰트_아이콘: { size: 8x8, colors: "백색 계열 농담 ≤4단 + 투명 — 색은 틴트가 입힌다 (기세=화염+불티, 경지=획/봉우리·검/원환 계열). 2026-07-16 개정: 순백 2값 → 백색 4단 (bimu 가 연 문법 — 틴트 곱셈에 계단이 살아남는다. 검수: lint 글리프 채움 3~75%)" }
  게이지: { size: 20x6, colors: "2값 — 눈금 틱·끝단 테이퍼도 백색+투명 안에서 처리" }
  GUI_배경: { size: 256x256, colors: "먹색 직접 채색 허용 (틴트 불가 채널) — 화선지 테두리·주사색 도장 획·반농도 구분선·점선 가이드 포함, GUI 배경만 다색 허용" }
  HUD_컨테이너_교체: { rule: "바닐라 원본 치수 정확 준수 (스프라이트는 아틀라스 계약) — 팔레트는 먹·화선지·주사 3계열 안에서만, 채도는 의미(체력=주사, 선택=주사)에만" }
  아이템_텍스처: { size: 16x16, rule: "바닐라 해상도 준수 — 고해상도 금지 (이질감 방지)" }
  사운드: { format: "ogg 모노", 돌파_적립: "<1.5s", 세계_공지: "종(鐘) 계열" }

# ─── 결정 절차 ───
decision_process:
  token_authority: "디자인 토큰 = 본 파일 + 기준 문서가 단일 원천 — 변경은 커밋"
  art_paths:
    커미션: { consistency: 최고, note: "슬롯 표+기준 문서 = 발주서 (권장)" }
    AI_생성_보정: { speed: 최고, note: "2값 규율·픽셀 정합 수작업 보정 필수" }
    자체_제작: { note: "MVT 수준 — 기능 검증엔 충분" }
  acceptance: [1초_가독, 2값_규율, 틴트_4색_검증, 바닐라_이질감_없음]
  promotion_timing: "아트는 게임플레이를 막지 않는다 — M3(정식 서버) 전까지 플레이스홀더 허용"

# ═══════════════════════════════════════════════════════════════════════════
# 아이템·블록 텍스처 레이어 (신규 절 — 기준 문서: docs/design/texture_layer_design.md)
# 두 갈래의 문법: 아이템 = 개별 지정(item_model 컴포넌트, 세계 오염 0) /
#                블록 = 전역 치환(징발 — 세계의 모든 인스턴스가 바뀐다)
# 상속: 위 glyph_slots.registration(등록제) · glyph_slots.pua_rule(F26) 그대로 적용
# ═══════════════════════════════════════════════════════════════════════════

texture_rules:
  inherits: [glyph_slots.registration, glyph_slots.pua_rule, pixel_spec.아이템_텍스처]
  registration: "채널 추가 = 본 파일 등록 + build_resourcepack.py 반영 — 미등록 텍스처 = 즉흥 재텍스처 = 삭제 대상"
  pua_rule: "F26 계승 — 아이템 키·블록 경로는 ASCII이나 산출 JSON은 ensure_ascii=True 유지 (한글 노트는 JSON 금지)"

  model_channel:
    decision: item_model              # minecraft:item_model 컴포넌트 (1.21.4)
    rejected: custom_model_data_정수_오버라이드
    reason: "1.21.4는 아이템 정의(assets/<ns>/items/*.json)로 데이터 주도화 — 구식 overrides predicate는 폐기 경로.
             문자열 키(honcheon:weapon/sword_beomcheol)는 대역 충돌이 구조적으로 불가능하고 사람이 읽는다"
    secondary: "custom_model_data.strings — '같은 자산의 상태 변주'에만 (마병 미감정/발현, 애병 3단계). 정수 CMD 금지"

  global_replacement_warning: |
    블록 텍스처는 스택이 아니라 블록 타입에 붙는다. deepslate_tiles.png 한 장을 기와로 바꾸면
    청하현 지붕만이 아니라 세계의 모든 심층암 타일이 기와가 된다 — 고대 도시 바닥까지.
    판정 없이 재텍스처하면 광산 깊은 곳까지 오염된다. block_channels 등록 없이 블록 PNG 금지.
  natural_block_ban: "자연이 만든 블록은 건드리지 않는다 — stone·dirt·gravel·*_log·stone_bricks·cobblestone·smooth_stone·dirt_path 등 지형·구조물 대량 생성 블록 징발 금지. 후보는 '사람이 만든 블록'(제작 전용·구조물 한정)에서만"
  pack_gate: |
    팩 없이도 플레이 가능해야 한다 (require-resource-pack=false 유지).
    텍스처는 강화지 의미의 유일한 전달자가 아니다 — 모든 채널은 팩없음_폴백을 함께 등록한다.
    블록: deepslate_tiles는 팩 없이도 '검은 기와처럼 보이는 돌' (건축 가이드가 그렇게 골랐다).
    아이템: 베이스 아이템 선택이 곧 폴백 — 등급은 바닐라 재질 색(돌·철·다이아·금·네더라이트), 계열은 이름·lore.
  colorblind_rule: "색 단독 금지 계승 — 무기 등급은 재질 색 + 자루 끝 고리 수(0/1/2/3, 마병=혈적) + 등급명 lore 3중 표기"
  blockstate_trick:
    adopted: false                    # note_block instrument·mushroom_block face 트릭 — 불채택
    reason: "① 팩 게이트 정면 위배 (팩 없으면 그냥 노트블록 — 의미 0) ② 우클릭으로 note가 바뀌면 텍스처가 변한다:
             서버 상시 차단 + CheonghaBuilder 결정론에 상태 관리 계층 추가 ③ 원하는 자산(기와·격자창·회벽·발·족자·현판)
             여섯 다 징발로 커버된다 — 트릭은 징발 등록부가 고갈된 뒤의 우회로"
    reserve: "note_block은 재텍스처하지 않고 보류 — 트릭의 재료를 미리 태우지 않는다"
    future_syntax: "채택 시 block_channels.trick: { carrier, state, model_key, 팩없음_폴백 } — 폴백 칸이 비면 등록 거부"
  placeholder_rule: "2~3값 팔레트 (먹 외곽 + 몸체 [+ 의미 강조]) · 16x16 고정 · 외곽 1px 여백 · 그라디언트/AA 금지 · 실루엣 우선"
  canon_rule: "이미 등록된 사물만 시각화 — equipment.yml / economy.yml / skills.yml / simbeop.yml에 실재하는 것만. 신규 아이템 발명 금지"

# ─── 아이템 채널 등록부 — 개별 지정 (컴포넌트 단위, 전역 오염 0) ───
# base_item = 팩 미적용 폴백의 실체. model_key = 코드와 아트의 유일한 접점.
#
# ★★ 전달 문법 【2026-07 교체 — 팩 게이트 불가침 위반을 고치며】 ★★
#   model_key 는 **minecraft:custom_model_data.strings[0]** 으로 나간다. item_model 이 아니다.
#
#   【왜】 1.21.4+ 는 item_model 이 가리키는 정의가 없으면 바탕 아이템으로 **폴백하지 않는다** —
#     없는 모델(보라 큐브)을 그린다. 그런데 ItemStack 은 **모두에게 같은 바이트**다: 서버는 팩을
#     받은 눈과 거절한 눈에게 다른 아이템을 보낼 수 없다. 그러므로 실물 아이템에 item_model 을
#     박으면 **팩을 거절한 사람의 손에 보라 큐브가 쥐어진다.** require-resource-pack=false 인
#     이 서버에서 그것은 게이트를 세운 것보다 나쁘다 (게임이 고장난 것처럼 보인다).
#     ⇒ 그 시절, 아래 '팩없음' 열은 **전부 거짓말이었다.** 이제 참이다.
#
#   【어떻게】 팩은 assets/minecraft/items/<base_item>.json 에서 select(custom_model_data) 로
#     분기한다 (build_resourcepack.py: write_vanilla_dispatch — 베이스 36종).
#       · 팩 없는 눈 — 컴포넌트가 **불활성**이다. base_item 을 그대로 본다 (아래 '팩없음' 열).
#       · 팩 있는 눈 — select 가 strings[0] 을 읽어 3D 를 문다. 잃는 것이 없다.
#       · 컴포넌트 없는 바닐라 철검·종이·가죽 — fallback 이 바닐라 모델이라 그대로다 (전역 오염 0).
#     검산: tools/model_key_audit.py ④(게이트) ⑤(바닐라 폴백 — 베이스까지 대조한다)
#
#   ★ base_item 을 새로 고를 때의 금기: **바닐라 아이템 정의가 단순 모델이 아닌 것**을 베이스로
#     삼지 말라. bundle 은 열림/닫힘 + 선택 아이템 분기를 담은 합성 정의다 — flat select 로 덮으면
#     세계의 모든 번들이 고장난다. (보류 기물 3종이 지금 그 상태다 — 아래 blocker 참조.)
item_channels:
  무기:
    grade_base_items:               # 등급 = 베이스 아이템 (팩 없이도 재질 색이 등급이다)
      범철: { base_item: stone_sword, tint: gray, 팩없음: "돌 검" }
      정련: { base_item: iron_sword, tint: white, 팩없음: "철 검" }
      보병: { base_item: diamond_sword, tint: aqua, 팩없음: "다이아 검" }
      신병: { base_item: golden_sword, tint: gold, 팩없음: "금 검" }
      마병: { base_item: netherite_sword, tint: dark_red, 팩없음: "네더라이트 검" }
    # 18반 병기(부·겸·월아산·구)는 도구를 징발했으므로 베이스가 <등급>_axe/_hoe/_shovel/_pickaxe 다
    # (Weapons.java Series.base × Base.byGrade — 총 25종. 팩 없는 눈은 그 바닐라 도구를 그대로 본다).
    grade_mark: "자루 끝 고리 0/1/2/3개 (범철~신병) + 신병 수실 / 마병 = 고리 없음 + 혈적 1점 (위가 아니라 밖)"
    series:                         # 계열 = item_model (같은 베이스에 다른 실루엣)
      검: { model_key: "honcheon:weapon/sword_<등급>", note: "곧은 양날 + 원형 호수 + 자루 술" }
      도: { model_key: "honcheon:weapon/dao_<등급>", note: "한쪽 날 + 완만한 휨 + 원반 호수" }
      창: { model_key: "honcheon:weapon/spear_<등급>", note: "긴 자루 + 좁은 삼각 창날 + 홍영 1점" }
      권갑: { model_key: "honcheon:weapon/gauntlet_<등급>", note: "손등 판 + 손목 띠 2줄 (날 없음)" }
      단검: { model_key: "honcheon:weapon/dagger_<등급>", note: "짧은 날 + 손잡이 절반 비율 (비연단검술)" }
      부: { model_key: "honcheon:weapon/bu_<등급>", base_item: "<등급>_axe", note: "긴 자루 + 넓은 도끼날 — 방패 파괴 (18반 병기)" }
      겸: { model_key: "honcheon:weapon/gyeom_<등급>", base_item: "<등급>_hoe", note: "굽은 낫날 + 짧은 자루 — 걸어 챈다" }
      월아산: { model_key: "honcheon:weapon/wolasan_<등급>", base_item: "<등급>_shovel", note: "긴 자루 + 초승달 날 + 삽날 — 승려의 병기" }
      구: { model_key: "honcheon:weapon/gu_<등급>", base_item: "<등급>_pickaxe", note: "갈고리 발톱 — 걸고 당긴다" }
    spear_base_pending: "trident 베이스가 팩 게이트상 최선이나 우클릭 투척 차단 접합이 선행 조건 — 확정 전까지 등급 sword 베이스"
    혈음도:
      base_item: netherite_sword
      model_key: "honcheon:weapon/dao_mabyeong"
      state_split: "custom_model_data.strings: unidentified | revealed — 미감정은 평범한 도 텍스처 (감정 전엔 정체 불명 정합)"
      note: "발현 시 날 중앙 1px 혈적 세로선 + 검붉은 자루 술 — 혈향의 시각 신호"
    vanilla_stat_warning: "재질 티어가 공격력·내구를 딸고 온다 — 판정 기반 전투와 무관하나 지급 시 Unbreakable·attribute 정리는 접합 조건"

    # ─── 명병(名兵) — 문파의 얼굴. 【2026-07 배선 완료】 ───
    #   사용자가 문장으로 직접 청한 유일한 시각 항목:
    #     *"매화검인 경우 매화검처럼 생겨야함. 손잡이에 매화 무늬가 있다던가 특색이 있어야 함"*
    #   Weapons.enshrine(item, sect) 이 애병을 명병으로 세우고 **그때 문파의 실루엣을 문다.**
    #   ★ 계열이 문파의 병기와 맞을 때만 문파 모델을 얹는다 — 매화검은 **검**이지 도가 아니다.
    #     (팩의 myeong/hwasan 은 검의 지오메트리다. 도에 물리면 도가 검으로 보인다.)
    #     어긋나면 단계만 오르고 실루엣은 계열 그대로 — 명명 자체는 막지 않는다.
    #   등급은 가리지 않는다 (범철 매화검도 매화검이다) → 그 계열의 5재질 전부에 분기가 있다.
    명병:
      model_key_pattern: "honcheon:weapon/myeong/<sect>"     # sect = factions.yml member id
      pdc: "honcheon:weapon_myeong_sect (계열이 맞을 때만 붙는다)"
      stage: "beloved_weapon.stages.명병 — 승급 조건(생사 고비 3회 + 명성 사건)은 MVT에 축이 없다 (MvtCommand 가 부른다)"
      sects:                        # ★ Weapons.java MYEONG_SERIES 와 **같은 표** (model_key_audit 이 대조한다)
        hwasan: { 계열: 검, note: "매화검 — 자루에 매화 (사용자 직접 요청)" }
        jeomchang: { 계열: 검, note: "쾌검 — 최속·최박" }
        jongnam: { 계열: 검, note: "중검 — 최중·최후" }
        namgung: { 계열: 검, note: "장검 — 최장 리치" }
        mudang: { 계열: 검, note: "태극검 — 원으로 되돌린다" }
        paengga: { 계열: 도, note: "오호단문도 — 최광폭" }
        dangga: { 계열: 단검, note: "비수 — 암기·독" }
        sorimsa: { 계열: 권갑, note: "권·장 — 손등의 옥 한 점" }

  지물:                              # 소모품·서물·증서·화물
    비급_진본: { base_item: written_book, model_key: "honcheon:tome/manual_original", 팩없음: "글 쓰인 책", note: "죽간 말이 + 봉인 끈 + 주사 인장 1점" }
    비급_필사본: { base_item: book, model_key: "honcheon:tome/manual_copy", 팩없음: "맨 책", note: "얇은 철(綴), 인장 없음 — 진본과의 차이가 인장" }
    심법_구결: { base_item: writable_book, model_key: "honcheon:tome/gugyeol", 팩없음: "책과 깃펜", note: "접힌 낱장 + 붓 자국 세로 3획" }
    전표: { base_item: paper, model_key: "honcheon:coin/jeonpyo", 팩없음: "종이 한 장", note: "가로 종이 + 전장 인장(주사) + 액면 획. 액면은 lore — 텍스처 1장이 모든 액면" }
    단약_영약: { base_item: magma_cream, model_key: "honcheon:pill/yeongyak", 팩없음: "붉은 구슬", note: "구형 + 좌상 광점 1px — HUD 기혈 구슬과 같은 문법 (먹는 것과 채워지는 것이 같은 그림)" }
    표물: { base_item: chest_minecart, model_key: "honcheon:cargo/pyomul", 팩없음: "궤짝 실린 수레", note: "궤 + 봉인 끈 십자 + 표국 인패. 레일 없는 세계에선 설치 불가 — 바닐라 규칙이 곧 방어" }

  기물:                              # equipment.yml trinkets 5종 (등록제 — 발명 금지)
    피독주: { base_item: heart_of_the_sea, model_key: "honcheon:trinket/pidokju", 팩없음: "청록 구슬", note: "구슬 + 표면 균열 2획", status: 징발 }
    야명주: { base_item: nether_star, model_key: "honcheon:trinket/yamyeongju", 팩없음: "빛나는 별(glint)", note: "구슬 + 방사 광선 4방 1px — 유일하게 밝은 값 허용", status: 징발 }
    청낭: { base_item: bundle, model_key: "honcheon:trinket/cheongnang", 팩없음: "주머니", note: "아가리 묶은 주머니 + 침 3개", status: 보류, blocker: "바닐라 수납 GUI 차단 접합 필요 ★ + base_item 재선정 필수 — bundle 의 바닐라 아이템 정의는 열림/닫힘·선택아이템 분기를 담은 **합성 정의**다. select 로 덮으면 세계의 모든 번들이 고장난다 (그래서 팩이 이 3종의 바닐라 분기를 굽지 않는다)" }
    호신부: { base_item: name_tag, model_key: "honcheon:trinket/hosinbu", 팩없음: "매다는 패", note: "세로 부적 + 주사 부문 3획 + 끈 고리", status: 보류, blocker: "개체 명명 동작 차단 필요" }
    천잠사_요대: { base_item: lead, model_key: "honcheon:trinket/yodae", 팩없음: "끈 뭉치", note: "감긴 띠 + 매듭 1 + 은사 광택 1px", status: 보류, blocker: "개체 매기 동작 차단 필요" }
