# ─── 그림의 문법 (축 ⑬) — 「색이 맞아도 그림이 바닐라면 마인크래프트다」 ───
stroke_contract:
  왜: |
    앞 증분이 **색**(채도·색상)을 고쳤고 ⑫가 그것을 지킨다. 그런데 **그림**을 재는 자가 없었다.
    실측이 그 공백을 폭로했다 (눈에 가장 많이 닿는 16장 · 화면색):
      σ(소리 크기)  바닐라 18.2 · 우리 13.2   |  여백비  바닐라 41% · 우리 35%(**더 좁았다**)
      획 응집도     바닐라 1.13 · 우리 1.13  ← **같다.** 획이 없었다 (점을 흩뿌리고 있었다)
    grass_block_top 은 응집도 0.97 (바닐라 0.98) — **바닐라와 같은 그림**이었다.
    원인은 팔레트가 아니라 **연산**이다: 모든 텍스처가 `step(SHADES, 기준 + octave(...))` —
    **노이즈장을 램프에 양자화한 것** = 바닐라의 문법 그 자체.
  잣대:                             # 남의 팩(Mizuno·Ōkami·중국신화) PNG 실측에서 나온 문법
    σ_소리크기: "화면 루마 표준편차. 오리엔탈 팩은 바닐라보다 **조용하다** (고임물 바닐라 8.3 · Mizuno 4.6 · Ōkami 0.32)"
    여백비: { min: 0.35, note: "잔잔한 바탕의 몫 — 수묵은 **쉬는 면**이 그림의 절반이다" }
    획_응집도: { min: 1.15, note: "**난수로 흩뿌리면 정확히 1.00.** 그 위가 그림이다 (밀도 정규화 — 밀도로 속일 수 없다)" }
    획_문턱: { luma: 8.0, note: "**절대** 문턱 — '눈에 보이는 자국'. 종이결(±1.5루마)은 획이 아니다" }
  ★고요_계약: |
    **고임물은 흐르는 물보다 조용해야 한다.** 바닐라는 **거꾸로다** (고임 8.3 > 흐름 6.3) —
    그리고 조사한 세 팩이 **모두** 그것을 뒤집었다. 우리도 뒤집는다 (고임 4.7 < 흐름 6.5).
    ⇒ 축 ⑬ 이 이 부등호를 **매번 확인한다**.
  파문_波紋: |
    ★ 조사한 **어느 팩도 물에 파문 선을 그리지 않았다** (전부 면이다). 그러니 이것은 **우리의 발명**이다.
      그러나 남의 잣대로 **진폭에 재갈을 물렸다**: ±1.5단(≈7루마)의 **조용한 호(弧)** + 성긴 글린트(1.6%).
      대비(밝기 계약 문턱 24)는 그 **몇 점의 글린트**가 진다 — σ 는 낮고 대비는 산다 (여백 + 획).
  수관_구멍: { band: [0.18, 0.36], note: "잎은 '면'이 아니라 **컷아웃**이다 — 제 자로 잰다. 바닐라 참나무 33% · 조사 팩 20~34%" }
  ★종이의_결: |
    **완전한 평면은 종이가 아니라 플라스틱이다.** Mizuno 는 잡티를 없애지 않았다 — 픽셀 변화율은
    외려 바닐라보다 높다(돌 0.96 vs 0.61). 대신 **진폭을 으깼다**(σ 10.8 → 6.6).
    ⇒ 여백에도 **인지 문턱 아래**(±1.5루마)의 잔결을 깐다. 획으로 세어지지 않고, 면은 죽지 않는다.
  ★획은_밝기가_아니다: |
    획(결·석리·알갱이)의 **타일 평균을 뺀다** — 획은 **분포**이지 **밝기**가 아니다.
    이것을 안 지켰다가 나뭇결이 목재 44장을 통째로 어둡게 만들어 **자재 평균 밝기 127**(계약 [128,172] 위반)
    이 됐다. ⇒ 이제 평균 0 이 **구조적으로** 보장된다 — 결을 어떻게 그리든 밝기 계약이 안 흔들린다.
  registration: "면 추가 = texture_audit.STROKE_CONVERTED 등록. **못 갈아입은 장은 STROKE_BACKLOG 에 사유와 함께** (조용히 빠지지 않는다)"

