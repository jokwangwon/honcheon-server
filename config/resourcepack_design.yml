# ═══════════════════════════════════════════════════════════════════════════════
# 고해상 등록부 — 【2026-07-16 신설 · V2-W 2차 청구】 검산: tools/texture_audit.py 축 ㉓
# (pack_upgrade_v2_3d.md §5 "진짜 고해상은 감사 등록형 면제 + 페인트 전용 축 선행 필요 — 청구")
#
# 【왜】 사용자가 무기 디자인을 겐신 무기팩(TWC)급으로 지시했다 (2026-07-16). 그 문법은
#   큰 평면 원소 + **64px 페인트 텍스처** (곡선 실루엣은 알파로) 다. 그런데 축 ①(16x16)은
#   아이콘의 계약이라 textures/item/** 전역(NON_ICON 밖)을 막았다 — 고해상이 설 자리가 없었다.
#   NON_ICON 의 교훈 그대로 푼다: **축을 피해 파일을 숨기지 않고, 면제를 등록제로 적는다.**
# 【법】 여기 등재된 글롭만 축 ①(16x16)·축 ⑥(외곽선 — 아이콘 규율)에서 벗어난다.
#   면제는 "재지 않는다"가 아니라 **"다른 자로 잰다"** 다 — 축 ㉓(고해상 페인트)이 잰다:
#   ⓐ 치수 = sizes 의 정사각 정확히  ⓑ 등록 팔레트 준수(파일 평균 채도 ≤60 · 픽셀 채도 ≤160 ·
#   팔레트에 없는 색상 대역 200°~330° 금지 — weapons.py 등록 색 실측: 평균 최대 42.0 ·
#   픽셀 최대 134 · 금지 대역 0픽셀)  ⓒ 적색 = semantic_red_registry 그대로 (paint 2행이 상한)
#   ⓓ 알파 실루엣 위생(잠정: 중간 알파는 투명 가장자리 2px 이내만 · 비율 ≤25%)
#   ⓔ 아틀라스 실존(축 ⑮ 연동 — 훑는 자리에 있고, 모델이 실제로 부른다).
# 【과도기 — 명시】 sizes: [16, 64] 는 과도기 법이다. 16 = V2-W 2차의 현행 시트 114장
#   (이 등재로 아이콘 규율 관할에서 축 ㉓ 관할로 이관 — 위반 0 유지). 64 = V2-W 3차가
#   재구울 목표 해상도. 3차 완료 후 sizes 를 [64] 로 좁혀 과도기를 닫는다 (래칫).
# 【문법】 entries 는 fnmatch 글롭 (★ `*` 는 `/` 를 넘는다 — paint/*.png 가 paint/myeong/ 포함).
#   여기 없는 고해상은 여전히 불법이다 — 축 ① 이 그대로 잡는다 (감사를 넓히는 개정이지 약화가 아니다).
hi_res_channels:
  entries:
    - { path: "honcheon/textures/item/weapon/paint/*.png", sizes: [128], reason: "V2-W 겐신풍 페인트 층 — 사용자 지시 2026-07-16. 3차: 자루당 64x64 1장 (병기 45 + 명병 12 = 57장, SDF 페인팅 · 알파 실루엣) · ★14차 복셀 정밀화: 같은 SDF 그림을 128x128 로 재굽기 (복셀 피치 절반 — 계단이 곱다). 과도기 [16,64]→[64]→[128] 각 재굽기로 닫았다. ★6차 팔레트 해방(잠정): 레퍼런스 설계 언어(흑자주·심녹 기조+선명 악센트)에 따라 이 채널만 색상 자유 + 채도 상한 완화 — 형광 도배는 평균 채도 85 가 계속 문다. ★20차: 표면 광택 일렁임 파일럿(_R20)은 세로 프레임 스트립(128×128·N)+.mcmeta 로 굽는다 — animation:true 가 스트립(h=n·128)을 허용한다 (몸 정지·광택만 흐른다 · campfire/kelp 전례). 정지 시트(128²)도 그대로 합법 (파일럿만 스트립)", hue_free: true, chroma_mean_max: 85, chroma_pixel_max: 200, chroma_pixel_frac: 0.06, animation: true }
