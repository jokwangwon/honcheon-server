        뼈백 사면 + 계열 악센트빛 인선) ④ 원소 사다리 (kmc): 범철 무채 → 정련 A 은은 →
        보병 A 인선 강화+담금선 → 신병 **원위 원소 수정**(악센트 4단 발광 램프: 테→악센트→
        백광 심 + 결정면 실루엣 _crystal + 룬 각인 2획) → 마병 **날 전체 검붉은 수정**+발광
        혈조 (명병 12 도 문파 악센트가 날 재질이 된다 — 화산 매화홍 날 등). 플랫 램프 원칙은
        3~5단 발광 램프로 확장 (단수 램프 — 그라데이션·노이즈 금지 불변).
      · 9차 계열 색표 (SERIES_INK — 자루 기조·의장·악센트) 【잠정 — 6차 기조 부활·조정】:
        검=흑자주·뼈백·옥 / 도=먹흑·뼈백·진홍 / 창=심녹·뼈백·호박 / 권갑=먹흑·뼈백·금 /
        비수=흑자주·뼈백·독록 / 부=먹흑·뼈백·적동 / 겸=심녹·뼈백·청옥 / 월아산=흑자주·뼈백·백월 /
        구=흑자주·뼈백·남자주. 적색 재등재 4행 (마병 0.40 · 화산 0.24 · 팽가 0.32 신설 ·
        paint 0.30 — 전부 실측+여유 【잠정】). 평균채도 실측 최대 64.3 ≤ 85.
      · 아이콘 16x16 은 GUI 아이템 칸이 아니라 **드롭·파티클의 진실**로 바이트 불변
        (축 ⑥⑨⑩⑭ 계약). GUI 에도 3D 모델이 뜨므로 알파 실루엣이 그대로 보인다.
    등급_변별: |
      ★ 색으로 갈리지 않는다 (colorblind_rule). 손에 든 병기·궤적에 실린 병기는 **실루엣으로만** 읽힌다.
        ① 고리(鐶) 0/1/2/3 — 자루에 감긴 금속 테가 **튀어나온 덩이**로 보인다
        ② 날의 길이·마름 — 범철은 뭉툭하고 짧다. 오를수록 길어지고 끝이 날카로워진다 (+0/1/2/3px)
        ③ 수실 — 신병만 자루 끝에 늘어진다
        ④ 마병은 **위가 아니라 밖**이다: 고리 0 · 날에 **톱니**가 돋고 · 혈조가 피로 찬다.
           형체만 보고도 "저것은 정파의 쇠가 아니다"가 읽힌다.
    display_변환: |
      손·GUI·바닥의 자세는 **바닐라에서 유도한다** (눈대중 금지 — 각도를 짐작하면 병기가 손등을 뚫는다).
      바닐라 item/handheld 의 display 는 대각선으로 누운 스프라이트(길이축 +45°)를 전제한 값이다.
      우리 모델은 +X (0°) 이므로 선회전 Rz(45°)를 **z 슬롯 가산으로 직접 기입**한다 — 게임의
      rotationXYZ 는 Rx·Ry·Rz (1.21.11 jar 실측, 2026-07-17 수리: 옛 Rz·Ry·Rx 역산 기계는 폐기).
      ⇒ 손·GUI·바닥에서 바닐라와 같은 자리: fp [0,-90,70] · gui [12,-28,45] · ground [0,0,45].
      ★3인칭은 여기에 **길이축(모델 +X) 180° 롤**: R·Rx(180) ≡ [rx+180, −ry, −rz] ⇒ tp
        [180,90,-100] (왼손 [180,-90,100]) — 12차 (사용자: "도의 날이 앞뒤 반대"). 인선(-Y)이
        위-뒤 → 아래-앞으로 서고, F5 뒤 시점이 북면(거울상) 대신 남면(아이콘과 같은 상)을 본다.
      긴 병기(창 2.1m · 월아산)는 gui/ground 에서만 줄인다 — **궤적에 실리는 날것은 줄이지 않는다**
      (NONE 변환이므로 창은 여전히 2.1m 다. 그림만 줄이고 사거리는 판정이 정한다 — 거짓말이 아니다).
      ★ V2-W 축소 상한 (잠정값 — 인게임 확인 뒤 확정 · 12차 개정): gui min(1, 15/extent) 유지 ·
        3인칭 min(1, 30/**body**) · 1인칭 min(1, 24/**body**) — 분모가 갈렸다 (사용자: "3인칭 검이
        작다"): extent 는 파편·수실까지 합친 프레임 합집합(검 36.8)이라 본체가 과축소됐다.
        body = 본체 extent (weapons._body_extent — 단면 ≤0.9 부유 태그(파편 0.8·수실 0.7) 제외,
        검 29.3 · 도 23.3 · 창 42.4). 단병기는 바닐라 검 등가(0.85 도달), 장병기는 팔 비례 감쇄.
      ★14차 (128px 정밀화): 회전·상한·분모 전부 불변. body 는 13차(64px) 셀 점유로 양자화해
        잰다 (_body_extent — 해상도가 올라도 같은 자). 57모델 중 55 스케일 수치 동일 · 해남/종남
        2모델만 실루엣이 굵은 셀 하나를 더 물어 −1.78% (손 크기 24px 캡 계약은 동일하다).
    미감정_마병: "custom_model_data.strings 의 'revealed' 케이스 (정수 CMD 금지). 미감정 기본값 = 그 계열의 정련 모델 — 기연의 탈을 쓴 저주가 첫눈에 보이면 저주가 아니다"
    ★버그_수정: |
      Weapons.java 는 계열 9 × 등급 5 = **45개의 item_model 키를 조건 없이 박는다**
      (Series.modelId 가 전부 non-null 이 된 뒤로). 그런데 팩에는 마병이 dao 하나뿐이었다 —
      즉 팩을 받은 눈에 나머지 **마병 8자루는 '없는 모델'(보라·검정 큐브)** 로 떴다.
      팩 게이트는 "키를 안 붙이거나, 붙였으면 반드시 굽거나" 둘 중 하나다. 45자루를 전부 굽는다.
      (검수 축 ⑩도 4등급 27쌍 → 5등급 36쌍으로 넓혔다 — 재는 자가 없으면 규약은 장식이다.)

  무공의_획:
    count: 11                       # config/skill_motion.yml display.models 의 청구서 (use_held 2종은 요구 없음)
    # ★ 텍스처는 반드시 textures/**item**/ 아래 (2026-07) — 클라이언트는 atlases/{blocks,items}.json 이
    #   못 박은 자리(textures/block/** · textures/item/**)만 훑는다. 그 밖의 PNG 는 스프라이트가
    #   안 만들어져 **보라 큐브**가 된다. 예전 자리(textures/qi|ult/)가 정확히 그 병이었다.
    #   모델 키(honcheon:qi/slash_arc)는 불변 — 바뀐 것은 텍스처가 사는 자리뿐이다.
    path: "assets/honcheon/models/item/qi|ult/<key>.json + assets/honcheon/textures/item/qi|ult/<key>.png"
    keys: [qi/slash_arc, qi/slash_line, qi/slash_ring, qi/blade_sheath,
           qi/bolt_edge, qi/bolt_lance, qi/guard_shard,
           ult/plum_bloom, ult/taegeuk_disc, ult/emperor_edge, ult/blood_tide]
    폐기: "qi/blade_arc · qi/blade_heavy — 등록부에서 사라졌다 (검을 복제해 날리는 방식을 폐기하고 참격선으로 갔다). 안 쓰는 키는 굽지 않는다"
    ★scale_규약_두_갈래: |
      **이것을 틀리면 획의 길이가 절반이 된다.** SkillDisplay 에 경로가 둘이다:
        · 투사·지속·고리 (sizeUnit)  → scale = size          ⇒ 모델은 **단위 상자(16px)** 를 채운다
        · 참격선          (slash)    → scale = {length/size[0], thick, thick}
          ← **size 를 곱하지 않는다.** ⇒ 참격선 모델은 **제 실제 미터 치수**로 구워야 하고,
            그 치수가 곧 size 여야 한다 (최종 길이 = 모델X × length/size[0] = length ⟺ 모델X == size[0]).
    참격선_원점: |
      **원점 = 머리(칼끝)**, 몸은 −X 로 늘어진다. Transformation.scale 은 모델 (8,8,8) 을 중심으로
      먹으므로, 머리를 그 점에 두어야 scale.x 0→1 에서 **칼끝 뒤로 꼬리가 자라고**, 1→0 에서
      **꼬리부터 지워진다.** 머리가 먼저 지워지면 거꾸로 보인다 (만화 검격의 핵심 — 사용자 지적).
    # ═══ 색의 계약 【2026-07 개정 — 사용자 지시】 ═══════════════════════════════
    # 사용자: *"공격 궤적과 파티클은 경지와 기술 등급이 올라갈수록 RPG 스타일로 더 화려해지는 구조."*
    #   그런데 **참격선의 판 한 장이 여섯 격을 전부 그린다** (qi/slash_arc 하나를 외공기도 심검도 쓴다).
    #   ⇒ 판에 색을 넣으면 **외공기의 주먹도 청백으로 빛난다.** 그것은 사다리를 무너뜨린다.
    #   그래서 색은 **두 곳에서만** 온다:
    #     ① 파티클 — 격마다 다르다 (config/skill_motion.yml inks: 먹→회백→청회→청록→옥→청백)
    #     ② 오의의 판 — ult/* 8종은 **오의 전용**이므로 판이 색을 가져도 사다리가 안 무너진다
    #   qi/* 7종은 여전히 **무색**이다. 이것은 타협이 아니라 **사다리의 요구**다.
    qi_무색: "qi/* 7종 — 색을 넣지 않는다 (채도 0 실측). 여섯 격이 이 판 한 장을 나눠 쓰므로 색을 넣으면 외공기가 심검처럼 빛난다. 격의 사다리는 **코드가** 밝기(setBrightness)·굵기(thick 0.55→2.10)로 올리고, **색은 파티클(inks)이 올린다**. 텍스처가 하는 일은 형태와 **알파**뿐 — 꼬리로 갈수록 옅어져 '굽어 사라지는' 인상을 만든다"
    ult_채색: |
      ult/* 8종 — **옥(166,214,199) · 청백(226,240,238)** 으로 물든다 (사용자의 상급 팔레트 그대로).
      오의 전용 판이므로 격의 사다리를 해치지 않는다 — 오히려 **최상위만 화려하다**를 판에서 완성한다.
      먹빛 4단(농담)은 그대로 살아 있다: 색은 **곱해질 뿐** 농담을 지우지 않는다 (수묵의 골격 유지).
      금지: 형광 핑크 · 네온 보라 · 과도한 노랑 · SF 발광 — texture_audit 축 ⑰ 이 이것을 잰다.
      예외: ult/blood_tide (혈해만리) — 혈(138,38,42). 【채색 예외】 예외가 곧 정보다.
    ★밝기_대역_⑫_면제: |
      **획은 자재가 아니라 기(氣)다.** texture_audit 축 ⑫(자재 채도 ≤25 · 밝기 [128,172])는
      `minecraft/textures/block/*.png` 만 훑는다 — 획은 `honcheon/textures/item/qi|ult/` 에 살므로
      **애초에 그 축의 사정거리 밖**이다.
      ⇒ 그런데 그 면제가 **어디에도 적혀 있지 않았다.** 사정거리 밖이라 조용히 통과하던 것은
        면제가 아니라 **구멍**이다 (팩 담당이 NON_ICON 에서 배운 그 교훈: "축이 시끄럽다고 파일을
        숨기면 축은 조용해지고 세계가 깨진다"). 그래서 여기에 **소리내어 청구한다**:
          · ⑫(밝기·채도 대역) — 면제. 획은 세계를 덮는 '면'이 아니라 공중에 뜨는 '빛'이다
          · **그 대신 축 ⑰(획의 색)이 획을 잰다** — 금지색(네온·형광)·허용 팔레트·격 사다리.
        면제는 **재지 않는다는 뜻이 아니라 다른 자로 잰다는 뜻**이다. 은닉과 명시의 차이가 그것이다.
    ★엔진에_넘기는_청구: |
      **slash_arc · slash_line 의 size[0] 을 3.0 → 1.5 로** (config/skill_motion.yml — 모션 담당의 것).
      근거: 머리가 원점(x=8)이고 몸이 −X 로 3.0m(48px) 뻗으면 꼬리는 x=−40 인데,
      **MC 모델 원소 좌표의 한계는 [-16, 32]** 다 (원점에서 −X 로 24px = **1.5m** 가 최대).
      3.0m 는 물리적으로 구울 수 없다.
      그런데 size[0] 은 **상쇄되는 정규화 상수**다: 최종 길이 = 모델X × length/size[0] 이므로
      **모델X == size[0] 이기만 하면 값이 무엇이든 결과가 같다.** 그래서 1.5m 로 굽고 1.5 를 청구한다.
      ⇒ **인게임 길이는 한 치도 안 변한다** (길이는 판정의 range × reach 가 정한다).
      지금처럼 size[0]=3.0 인 채로 두면 획이 **정확히 절반 길이**로 뜬다.
      Y·Z(0.55/0.35 · 0.04)는 그대로 두라 — 모델이 그 치수로 구워져 있다.

  짐승의_형체:
    count: 8                        # config/mob_models.yml 의 청구서 (호랑이 3 · 반달곰 2 · 멧돼지 1 · 백영묘 2)
    path: "assets/honcheon/models/mob/<name>/<part>.json + assets/honcheon/textures/mob/<name>/<part>.png (32x32)"
    방향_계약: |
      코가 +Z · 등이 +Y · 오른쪽이 +X.  ★ 이것은 주석이 아니라 **엔진의 움직임이 증명한다**:
      MobDisplay.follow() 는 돌진을 rotateX(lean) 으로 그리고(X 로 기울면 ±Z 로 숙인다 ⇒ 앞 = Z) ·
      걷기 흔들림을 rotateZ(roll) 로 어깨를 번갈아 내리고(⇒ 좌우 = X) · 죽음을 rotateZ(90°) 으로
      옆으로 눕힌다. 셋이 모두 +Z 정면을 말한다.
    원점: "몸통은 (8,8,8) 이 **발이 딛는 바닥의 정중앙** ⇒ 기하가 y 8..24 에 선다. 머리·꼬리는 offset 이 그 중심을 잡으므로 중심 원점(y 0..16)"
    치수_계약: "파츠는 단위 상자를 **가득 채운다** (bbox 가 세 축 모두 16px). 얇은 꼬리조차 채운 뒤 size 가 눌러 만든다 — 모양은 모델에서, 치수는 등록부에서. _fill_check() 가 굽기 전에 강제한다"
    산늑대_미구움: "일부러 굽지 않았다 — mob_models.yml 이 shape: vanilla 로 못 박았다('이미 늑대다. 조각으로 만들면 더 나빠진다'). 구워 두면 언젠가 누군가 켤 것이고, 그러면 여섯 마리가 뻣뻣하게 미끄러진다. 등록부의 판단을 따른다"
    ★엔진에_넘기는_결함: |
      **mob_models.yml 의 size 축 순서가 방향 계약과 어긋난다** (팩이 고칠 수 없는 자리 —
      config/mob_models.yml · MobDisplay.java 는 형체 담당의 것이다).
        · 등록부: size: [길이, 높이, 폭]  (예: 호랑이 몸통 [2.2, 1.0, 0.7])
        · 엔진:   scale = Vector3f(size[0], size[1], size[2])  → X 를 2.2 로 늘린다
        · 그런데 방향 계약상 **X 는 좌우(폭)** 이고 **길이는 Z(코~꼬리)** 다.
        ⇒ 지금 호랑이는 **2.2m 넓고 0.7m 짧은** 슬래브가 된다.
      팩이 기하로 상쇄하는 것은 **불가능하다**: 상쇄하려면 꼬리를 Z 로 7.5단위(120px) 늘려야 하는데
      MC 모델 좌표의 한계는 -16..32 (48px) 다. 애초에 그 방향이 옳지도 않다 —
      엔진 버그를 취소하려고 기하를 비틀면, 버그를 고치는 날 팩이 무너진다.
      【고칠 곳 — config 한 줄씩, 코드 수정 없음】 size 를 [폭, 높이, 길이] 로 뒤집는다:
        호랑이 몸통 [2.2,1.0,0.7] → [0.7,1.0,2.2] · 머리 [0.55,0.5,0.5] → [0.5,0.5,0.55]
        꼬리 [0.9,0.12,0.12] → [0.12,0.12,0.9] · 반달곰 몸통 [1.6,1.0,0.8] → [0.8,1.0,1.6]
        머리 [0.45,0.45,0.42] → [0.42,0.45,0.45] · 멧돼지 [1.5,0.9,0.55] → [0.55,0.9,1.5]
        백영묘 몸통 [1.5,0.75,0.42] → [0.42,0.75,1.5] · 꼬리 [1.1,0.09,0.09] → [0.09,0.09,1.1]
        (mob_model_audit 의 '크기(길이·높이·폭)' 라벨도 함께 뒤집어야 검수가 거짓말하지 않는다)
      팩의 모델은 **문서화된 계약대로** 구워져 있다 (코 +Z · 단위 상자 가득 · size = 실제 미터).
      위 한 줄이 뒤집히는 순간 짐승이 제 치수로 선다 — 팩은 손댈 것이 없다.

# ═══════════════════════════════════════════════════════════════════════════════
# 밝기 계약 (明暗契約) — 【2026-07 신설】 검산: tools/texture_audit.py 축 ⑫
#
# 【실패의 기록 — 규약을 잘못 구현했다】
#   사용자 보고: "전체적으로 어둡고 칙칙한 분위기, 심지어 벚꽃나무도 분홍빛에서 검은 빛이 더 많이 드는 느낌"
#   실측이 그를 뒷받침했다: 블록 209장 평균 밝기 **113** · 매화 잎 **73** (먹빛 갈색).
#
#   우리는 "채색 금지"를 **"전부 어둡게"** 로 번역했다. 그것은 오역이다.
#   수묵(水墨)의 본질은 어둠이 아니라 **농담(濃淡)** 이고, 농담이 성립하려면 **여백 — 밝은 종이**가
#   있어야 한다. 종이까지 잿빛으로 칠하면 먹은 더 이상 먹이 아니다. 남는 것은 그을음뿐이다.
#
# 【대역의 근거】 마을을 걷는 눈에 가장 크게 닿는 면은 **목재 44 · 돌 24 · 땅 10** 이다.
#   그것들이 **종이** 노릇을 해야 지붕의 먹(기와 60)과 처마 그림자가 산다. 그래서 그 셋의 대역이
#   높고 기와·심층암은 낮다. **일괄 보정은 금지** — 기와까지 밝히면 그건 또 다른 거짓말이다.
#   밝기 계약은 **면(面)의 규율**이다. 획·투명 요소(유리·거미줄·철창)는 어두운 선이 정답이므로
#   대역에서 제외하되 **제외도 등록제**로 적는다 (등록되지 않은 것은 재어지지 않고, 재어지지 않는
#   것은 조용히 무너진다).
brightness_contract:
  registration: "자재 추가 = texture_audit.LUMA_BANDS 등록 + 본 절 갱신. **미분류 = 위반** (구멍으로 어둠이 샌다)"
  global_mean: [128, 172]           # 자재(목재·돌·땅·회벽) 평균 — 세계의 인상은 평균이 만든다
  natural_mean: [82, 150]           # 【2026-07】 자연(물·풀·잎) 평균 — **두 모집단으로 가른다**
  ★모집단을_가르는_이유: |
    자재의 밝기는 **우리가 고른다**. 자연의 밝기는 **틴트의 천장이 정한다** (물의 R 은 63 을 못 넘는다 —
    엔진의 산술이지 우리의 취향이 아니다). 그 둘을 한 평균에 넣으면 — 물이 어둡다는 이유로 **마을을 밝히게 된다.**
    그것은 우리가 한 번 데인 바로 그 **일괄 보정**의 재판이다. 그래서 가른다.
    ⇒ 자재 대역 [128,172] 는 **한 칸도 안 움직였다** (실측 128 — 틴트층 이전과 같다. 계약 불변).
  ⑫-d_자연물_채도_밴드:              # 【2026-07 재설계】 **형광도 실패지만 죽음도 실패다**
    왜: |
      ⑫-c 는 채도의 **하한**을 잰다 (매화가 먹빛이면 규약이 자기모순이니까). 그런데 그 반대쪽 —
      **너무 진한 색** — 은 아무도 재지 않았다. 그래서 형광 초록이 열한 축을 다 통과했다.
      ★ 더 나쁜 것: 검수는 **재는 척하면서** 무너져 있었다. 바닐라 grass_block_top.png 은 회색조라,
        파일만 재는 눈에게 잔디는 영원히 무채색이다 — 검수는 통과를 외치고 세계는 형광이었다.
      그래서 ⑫-d 는 **곱한 뒤의 색**에 잣대를 댄다 (texture_audit 「틴트 인지」 절).

      ★★ 그런데 상한만 단 눈은 **반대쪽으로 넘어갔다.** 잔디 58 → 32 · 나뭇잎 → 25 · 다시마 → 22.
        형광은 잡혔지만 세계에서 **피가 빠졌다** — 그리고 그것을 잡는 자가 아무도 없었다.
        사용자 판정: *"일반적인 세상을 표현하기에 잔디블럭은 적합하다.
        잔디블럭의 채도를 기준으로 다른 블럭의 색감을 조정하라."*
      ⇒ **한쪽만 재는 자는 반드시 반대쪽으로 넘어간다.** 그래서 이제 **밴드**로 잰다 (하한 + 상한).
        하한 = "죽었다" · 상한 = "형광이다". 둘 다 실패다.
    기준선: 58                      # ★ 바닐라 잔디의 화면 채도 (client jar 실측 · 평원). 이 팩의 채도 원점
    ★바닐라_수치를_다시_쟀다: |
      앞선 증분이 적어 둔 「바닐라」 수치 중 **둘이 틀렸다** (jar 실측으로 잡았다):
        · 물   — 「139」라 적혀 있었다. 실측 **115**.
        · 연잎 — 「75」라 적혀 있었다. 실측 **30** (외려 우리 연잎이 더 진했다).
      **틀린 근거 위에 세운 상한은 상한이 아니라 미신이다.**
    bands:                          # 화면 채도 [하한, 상한] — 바닐라 실측치를 옆에 적는다
      풀:    { band: [46, 72], 바닐라: 58, note: "★ **기준선**. 세계를 덮는 가장 큰 면 = 세계의 채도" }
      잎:    { band: [44, 72], 바닐라: "참나무 70 · 가문비 17 · 자작 41", note: "풀과 **나란해야** 한다 — 잔디 58 인 세상에서 잎이 25 면 나무가 시체다" }
      물:    { band: [50, 80], 바닐라: 115, note: "형광 파랑의 정체. 틴트 R 이 63 이라 위로도 아래로도 갇혀 있다" }
      수초:  { band: [44, 74], 바닐라: "다시마 97 · 잘피 118", note: "틴트가 없으니 변명도 없다" }
      연잎:  { band: [46, 82], 바닐라: 30, note: "R 천장 32 ⇒ **저채도가 원천 불가능**. 그런데 우리는 이제 저채도를 원하지 않는다 — 천장은 우리를 가려던 곳으로 떠민다" }
  ⑫-e_모집단_갈라짐:                 # 【2026-07 신설】 **자연은 살고 자재는 먹이다**
    왜: |
      이 팩의 정체는 "온 세상이 회색"이 아니다. **자재(수묵)와 자연(청록)이 갈라져 있는 것**이다.
      자연의 채도를 올릴 때 자재까지 끌려 올라가면 수묵이 무너지고, 그 반대도 마찬가지다.
      그래서 **두 모집단의 평균과 격차**를 잰다 — 붙으면 위반이다.
    자연_평균_하한: 46              # 실측 56.6 — 세계가 다시 빛바래면 여기서 걸린다
    자재_평균_상한: 25              # 실측 23.1 — ★ 이 증분에서 **한 톨도 안 움직였다** (자재 PNG 바이트 동일)
    격차_하한: 25                   # 실측 33.5
    ★모집단은_등록제다: |
      자재 모집단 = **등록된 자재 등급만** (목재·돌·땅·회벽·기와·무쇠·짚…). 「나머지 전부」가 아니다.
      꽃·작물·차양·등롱은 자재가 아니다 (채색이 허락된 자리 — ⑫-c 가 따로 잰다).
      그것들을 자재에 섞으면 평균이 부풀어 **자재가 채도를 올려도 안 잡힌다** — 게으른 모집단은 눈을 멀게 한다.
  bands:                            # 자재: [하한, 상한, 근거]
    먹_기와·심층암:      [42,  88,  "검은 기와는 **검어야 한다**. 이것이 이 세계의 먹이다 — 밝히면 그것이 거짓말"]
    무쇠·화로:          [55,  130, "쇠와 아궁이는 어둡다. 순먹은 구멍으로 보이므로 하한 55"]
    그릇 속(내부·구멍):  [40,  112, "들여다보는 면 — 어두운 것이 **정체**다. 밝히면 그릇에 바닥이 없다"]
    젖은 땅·삭은 거름:   [78,  138, "물과 삭음은 **빛을 먹는다** — 마른 흙보다 어두운 것이 정체다"]
    매화_꽃:            [150, 215, "★ 채색이 허락된 유일한 자리. 수관 전체를 도배하므로 **나무 한 그루가 분홍으로 서야** 한다"]
    매화_가지:          [95,  165, "먹빛 가지 — **꽃의 짝**. 어두워야 분홍이 산다 (대비가 곧 수묵)"]
    등불·불:            [105, 235, "불은 **빛나는 것**이다. 어두운 등롱은 등롱이 아니다"]
    천_깃발·차양:        [85,  200, "채색 허용. 밝기보다 **채도**가 본체다 (⑫-c 가 그것을 잰다)"]
    여백_회벽·눈·얼음:   [160, 240, "★ 이것이 **종이**다. 여백이 밝지 않으면 먹이 먹으로 읽히지 않는다"]
    짚·죽:              [125, 195, "마른 짚은 햇빛에 바랜다. 초가가 밝아야 **기와(60)와 갈린다** — 두 지붕은 다른 계층이다"]
    자작(白樺):         [150, 215, "자작나무 껍질은 **희다** — 그것이 이름이다"]
    목재:               [105, 175, "★ 조성 팔레트 **최대 면적(44장)** — 벽·바닥·계단·울타리. 여기가 어두우면 마을 전체가 그을음이다"]
    돌:                 [115, 195, "사람이 깎은 돌 — 무채색이되 **밝은 회색**이다 (돌은 먹이 아니다)"]
    땅:                 [100, 170, "밟혀 **마른** 흙은 밝다. 젖은 먹빛 흙이 마을을 그을음으로 만들었다"]
    삭은땅_부엽토·이끼:  [72,  130, "부엽토는 **어두운 것이 정체다** — 밝히면 그것도 거짓말. 다만 60은 과했다"]
    초목_작물·꽃:        [85,  200, "익은 밀은 밝고 어린 싹은 어둡다 (폭이 넓다)"]
    # ── 틴트층 (2026-07) — **곱한 뒤의 색**으로 잰다 (파일이 아니라 눈에 닿는 색) ──
    #   ★ 채도는 여기가 아니라 ⑫-d 밴드가 잰다. 이 대역은 **밝기**만 본다 (둘을 섞으면 또 오역한다).
    풀_잔디·포기:        [85,  150, "★ 세계를 덮는 가장 큰 면 (시야의 60~80%). 형광도 그을음도 안 된다 — **밝기는 살리고 채도는 바닐라 잔디(58)에 맞춘다**"]
    잎_수관:            [78,  145, "수관은 그늘을 문다 — 풀보다 짙은 것이 정체다. 다만 상록수의 밝기는 **틴트의 천장**이 정한다 (가문비 R ≤ 97)"]
    물:                 [58,  115, "★ 물의 밝기는 **엔진의 산술**이다: 틴트 R 이 63 이라 화면의 물은 R 63 을 못 넘는다. 먹이 풀린 비취 — 시커먼 웅덩이로 만들지는 않는다"]
    수초:               [80,  155, "물속 식생 — 틴트가 없다 ⇒ 우리가 칠한 값이 그대로 선다"]
    연잎:               [42,   95, "★ 저채도가 **불가능**한 자리 (R 천장 32) — 짙은 것이 정체다. 천장은 변명이 아니라 사실이되, 이제는 우리 편이다"]
  exempt: [glass, glass_pane_top, cobweb, dead_bush, ladder, glow_lichen, sea_pickle, torch]
  exempt_reason: "**획(劃)·투명 요소** — 세계를 덮는 '면'이 아니라 배경 위에 긋는 '선'이라 어두운 것이 정답이다"
  chroma_floor:                     # ⑫-c 허락된 채색의 채도 하한 — 색이 죽으면 **규약이 자기모순**이다
    cherry_leaves:    { metric: R-G,    min: 42, note: "매화가 먹빛 갈색이면 '채색은 매화뿐'이 무슨 말인가" }
    cherry_sapling:   { metric: R-G,    min: 30, note: "꽃이 핀 어린 나무 (먹빛 삭정이가 아니다)" }
    cherry_log:       { metric: R-G,    min: 12, note: "먹빛 가지이되 붉은 기가 남는다" }
    red_wool:         { metric: chroma, min: 60, note: "차양(붉은 천) — 붉어야 차양이다" }
    lantern:          { metric: chroma, min: 32, note: "등롱 — 유등의 난색" }
    campfire_log_lit: { metric: chroma, min: 30, note: "타는 장작 — 불은 의미다" }

# ─── 블록 희생 등록부 — 전역 치환 (징발 12 / 보류 4 / 금지 6계열) ───
# 입력: docs/design/building_style_guide.md 팔레트. 판정: 세계 오염 검사 + 팩 게이트.
block_channels:
  징발:
    deepslate_tiles:
      무협_자산: "흑와 — 기와면·용마루·추녀마루·담 갓"
      covers: [deepslate_tile_stairs, deepslate_tile_slab, deepslate_tile_wall]   # PNG 1장이 계단·반블록·담장을 전부 덮는다
      징발_판정: "자연 생성 없음(제작 전용). 고대 도시(Deep Dark)가 유일 오염원 — 접근 난도 극히 높고 콘텐츠 밖"
      팩없음_폴백: "검은 기와처럼 보이는 돌 (건축 가이드가 이미 그렇게 골랐다)"
    cracked_deepslate_tiles: { 무협_자산: "깨진 기와 (폐사당 잔해)", 징발_판정: "동일 — 고대 도시 오염 동반", 팩없음_폴백: "금 간 검은 돌" }
    # ─── 직각 경사면용 회전 변형 (2종) — 지붕은 네 방향 경사면인데 블록 텍스처는 한 장이고 방향이 고정이다.
    #     남북 경사면에선 기와 결이 경사를 가로지르지만(옳다), 동서 경사면에선 같은 결이 경사와 나란히
    #     누워 '기와가 옆으로 누운 것'처럼 보인다 — 인게임 실측 "한 방향으로 되어 이질감이 듦".
    #     처방: 동서 경사면에는 **결이 직각인 다른 블록**을 깐다. 그러면 네 면이 다 제 방향의 결을 갖는다.
    #     아트는 새로 그리지 않는다 — deepslate_tiles를 90도 돌린 바로 그 픽셀이다 (팔레트·얼룩 통계·
