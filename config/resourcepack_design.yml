        - "100.0% — 틴트층 (본 증분). 물 30.7k · 잔디 17.9k · 풀·고사리 7.1k · 잎 4.6k · 수초 7.0k · 덩굴 2.6k · 용암 3.1k · 불 2.8k · 연잎 1.0k. **남은 구멍 0**"
      남은_구멍: "**0장.** 미커버 면적 0 (1,277,362 / 1,277,362). 조성 팔레트가 쓰는 모든 블록의 모든 면을 팩이 그린다"
      불변식: "미커버 텍스처는 전부 「보류」에 사유와 함께 있어야 한다. 사유 없이 빈 칸이 하나라도 생기면 등록부가 거짓말을 하는 것이다 (현판이 그랬다 — 축 ⑪ 이 잡았다)"
      ★커버리지_100의_뜻: |
        **커버리지는 '다 칠했다'이지 '잘 칠했다'가 아니다.** 축 ⑪ 은 면적을 세지 색을 보지 않는다.
        형광 초록 잔디도 '커버'로 세어졌을 것이다 — 실제로 자재층 2차의 93.5% 는 **잔디가 형광인 채로**
        받은 점수다. 색을 보는 눈은 ⑫-d(채도 상한)와 「틴트 인지」다. 두 축은 서로를 대신하지 못한다.

  # ═══════════════════════════════════════════════════════════════════════
  # 틴트층(染) — 【2026-07 신설】 「보류: 풀_고사리」의 **해제**. 땅·물·풀·잎.
  #
  # 【보류의 사유는 옳았다 — 그리고 그것이 곧 처방이었다】
  #   옛 보류: *"바이옴 컬러맵이 초록으로 틴트한다 — 회색조를 칠해도 초록이 곱해진다."*
  #   사실이다. 그러므로 **텍스처만 칠하는 증분은 반드시 실패한다.** 틴트를 쥐어야 한다.
  #   보류가 미뤄 둔 판정("그것은 세계의 초록을 전부 죽인다 — 별도 판정 사안")을 여기서 내린다:
  #   ★ 1차 판정: **죽인다** (— "기존의 마크의 느낌을 없애 달라").  ⇒ **그 판정은 과했다.**
  #
  # 【판정 정정 (2026-07) — 죽이는 것은 **형광**이지 **초록**이 아니었다】
  #   1차 판정대로 채도를 41 까지 끌어내렸더니 잔디 58 → 32, 잎 25, 다시마 22. 세계가 **빛이 바랬다.**
  #   사용자 판정: *"일반적인 세상을 표현하기에 잔디블럭은 적합하다 — 잔디블럭의 채도를 기준으로
  #   다른 블럭의 색감을 조정하라."*  기준선은 **바닐라 잔디의 화면 채도 58** 이다.
  #   ⇒ 고칠 것은 채도의 **크기**가 아니라 **색상(hue)** 이었다: 바닐라의 누런 연두(R−B 56)를
  #     청록(R−B 21)으로 옮긴다. **같은 채도, 다른 초록.**
  #
  # 【남의 팩을 재서 잣대를 세웠다 — 취향이 아니라 근거로】 (2026-07 조사 · 실측)
  #   · Mizuno's 16 Craft (일본 작가 · 최대 규모 JP 팩): 컬러맵 **있음** · 잔디 화면채도 **66** (바닐라보다 높다)
  #   · Ōkami (수묵/우키요에 계열의 대표작): 컬러맵 **아예 없음** — 자연색은 **바닐라 그대로**.
  #     수묵의 인상은 **선(線)·하늘·여백**이 만든다 (물은 외려 채도 192 의 밝은 청록)
  #   · Chinese Mythology Mash-up (모장 공식): 잔디 **30** — 유일하게 채도를 내린 팩. 다만 **회색이 아니라
  #     "어두운 초록"** 으로 내렸다 (무채색화가 아니다)
  #   · 명시적 「水墨」 프로젝트는 **리소스팩이 아니라 셰이더**였고, 그 설명이 스스로 말한다:
  #     *"단순 채도 감소 필터와 달리 — 가까이서는 원래 색을 보존한다."* 수묵은 **선·농담·여백**이지
  #     **채도 제거가 아니다.**
  #   ⇒ 관측된 밴드는 **30~66**, 바닐라 58 은 그 한가운데다. 우리의 58 은 **근거 있는 자리**다.
  #     (베끼지는 않았다 — 채도의 크기만 잣대로 쓰고 색은 우리가 골랐다.)
  #
  # 【세 갈래 — 틴트의 출처가 무엇이냐가 처방을 정한다 (client jar 실측)】
  #   ① 컬러맵 (팩이 쥔다)   → colormap/grass.png · foliage.png 를 **갈아엎는다**.
  #      텍스처는 무채색으로 굽고 색은 컬러맵이 준다 = **바닐라의 분업을 그대로 쓰고 곱하는 수만 바꾼다.**
  #   ② 코드 상수 (못 쥔다)  → **역틴트**: 텍스처 = 목표 × 255 ÷ 틴트 (엔진이 곱할 것을 미리 나눈다)
  #   ③ 바이옴 데이터(못 쥔다) → 물. 역틴트 동일.
  #   ★ 역틴트한 PNG 는 **눈으로 보면 이상한 색이다** (물 = 금빛, 가문비잎 = 분홍빛).
  #     그래서 검수도 파일이 아니라 **곱한 뒤의 색**을 잰다 (texture_audit 「틴트 인지」).
  #     재는 자가 파일을 재면 — 파일은 맞고 세계는 틀린다.
  # ═══════════════════════════════════════════════════════════════════════
  틴트층:
    컬러맵:
      files: ["colormap/grass.png (256x256)", "colormap/foliage.png", "colormap/dry_foliage.png"]
      색인법: "x = (1 − 기온) × 255 · y = (1 − 강수 × 기온) × 255 — 검산: 바닐라 grass.png (50,173) = #91BD59 (평원의 그 초록). 색인법이 맞다는 증거"
      팔레트:                        # 네 귀퉁이만 정하고 사이는 이중선형 (컬러맵은 룩업표 — 노이즈 금지)
        grass:   { warm_wet: [108,183,101], warm_dry: [153,210,121], cold_wet: [114,177,117], cold_dry: [148,189,129] }
        foliage: { warm_wet: [96,172,84],   warm_dry: [130,196,96],   cold_wet: [104,166,102], cold_dry: [124,174,114] }
      ★밝기_계약: "컬러맵은 **곱하는 수**다. 어둡게 만들면 온 세상의 풀이 그을음이 된다 — 그래서 값은 **밝게** 둔다 (평원 루마 180 · 바닐라 172)"
      ★채도_기준선: |
        평원 틴트 = (139,198,117) · 채도 **81** (바닐라 100).
        ⇒ 잔디 화면채도 **58 = 바닐라와 같다.** 그런데 틴트 채도는 바닐라보다 **낮다** — 왜인가?
          화면채도 ≈ (텍스처평균 ÷ 255) × 틴트채도.  우리 잔디 텍스처는 **밝다**(평균 ~199 · 바닐라 ~148).
          **밝은 텍스처는 적은 틴트 채도로 같은 생기를 낸다.** 채도는 같고 밝기는 더 높다 — 밝기 계약과 어긋나지 않는다.
      ★색상은_베끼지_않았다: |
        빌린 것은 채도의 **크기**뿐, **색상(hue)** 은 우리가 골랐다.
          바닐라 #91BD59 = (145,189,89) — R−B 가 **56** 인 **누런 연두**. 형광기의 정체는 채도가 아니라 **색상**이다.
          우리   (139,198,117)          — R−B **21**. 누런기를 걷어낸 **청록(靑綠)** 쪽 초록.
        ⇒ 근거는 취향이 아니라 화론(畵論)이다 — **청록산수(靑綠山水)**. 동양화의 산수는 먹으로만 그리지 않는다:
          석록(malachite)·석청(azurite)의 **선명한 청록**이 정통이다.
          **수묵은 자재와 선에 있고, 자연은 살아 있다.** (그 둘의 갈라짐을 ⑫-e 가 잰다.)
      효과: "평원 잔디 화면색 채도 **32 → 58** (바닐라 58). 밝기 114 (계약 안). 나뭇잎·물·수초가 함께 그 밴드로 올라온다"
    역틴트:
      정의: "텍스처 = 목표 × 255 ÷ 틴트 — 엔진이 곱할 것을 미리 나눈다"
      ★천장: "텍스처는 255 를 넘지 못한다 ⇒ **화면색은 틴트값을 넘지 못한다.** 물의 틴트 R 은 63 이므로 물의 R 은 무슨 수를 써도 63 을 넘지 못한다 — 물의 밝기는 우리 취향이 아니라 **엔진의 산술**이다. build 가 클램프를 감지하면 경고한다 (조용한 어긋남 금지)"
      water:
        tint: [63, 118, 228]        # 0x3F76E4 — 바닐라 바이옴 water_color
        ★전제: "커스텀 바이옴 0개 확인 (worldgen/ 에 biome 정의 없음). **데이터팩이 water_color 를 바꾸면 이 상수도 함께 바꿔야 한다** — 안 바꾸면 물빛이 엉뚱한 데로 간다"
        목표_화면색: "(38,74,86) → (60,116,148) 9단 — 먹이 풀린 비취(翡翠). 알파 180 = 바닐라 계약 (255로 만들면 물이 벽이 된다)"
        ★G의_천장: "틴트 G 가 118 이라 목표 G 는 **116 까지만** 쓴다. 천장에 붙이면 클램프가 조용히 색을 깎는다"
        효과: "바닐라 물 채도 **115**(실측 — 코드에 적혀 있던 139 는 틀린 수였다) → 우리 **69**. 형광 파랑은 죽이되 잔디(58) 밴드에 나란히 세운다"
      spruce_leaves: { tint: [97,153,97], note: "FoliageColor 0x619961 — 컬러맵이 아니라 **코드에 박힌 상수**다. 목표는 천장 아래에서 고른다 (R·B ≤ 97 · G ≤ 153)" }
      birch_leaves:  { tint: [128,167,85], note: "FoliageColor 0x80A755 — **B 의 천장이 85** 다 (자작이 노란 쪽인 이유)" }
      ★천장은_채도의_천장이_아니다: |
        앞선 증분은 상록수의 낮은 채도(24)를 **천장 탓**으로 적어 두었다. 틀렸다.
        천장은 **채널값**의 천장이지 **채도**의 천장이 아니다:
          가문비 목표 (53,103,54) → 채도 **50** 이면서 세 채널 모두 천장 아래다 (클램프 0건).
        ⇒ 채도가 24 였던 것은 천장 때문이 아니라 **목표를 그렇게 잡아서**다. **천장을 변명으로 쓰지 않는다.**
      lily_pad:
