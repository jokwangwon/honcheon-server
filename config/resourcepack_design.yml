        구름색: "엔진이 시각·날씨로 칠한다. clouds.png 는 **1비트 모양 마스크**일 뿐이다 (색이 없다) — 그래서 건드리지 않았다. 모양만 바꿔 봐야 '수묵 구름'이 아니라 그냥 다른 뭉게구름이다"

