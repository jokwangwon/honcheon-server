  # ═══════════════════════════════════════════════════════════════════════
  # 자재층(自材層) — 2026-07. **위 「금지」 판정의 반전**이다. 반전은 조용히 하지 않는다.
  #
  # 원래의 금지 (아래 잔존_금지 참조): "자연이 만든 블록은 건드리지 않는다 — 재텍스처 = 세계 전체 오염."
  # 그 판정을 뒤집은 것은 **객관 수치**다: 조성기(CheonghaBuilder·RemoteBuilder)가 쓰는 블록은 170종인데
  # 팩이 덮던 것은 14종, 사용 빈도로 가중하면 **11.4%** 였다. 즉 지붕(흑와)과 회벽 말고는
  # 세계가 전부 바닐라였다 — 무협의 마을이 아니라 **마인크래프트 마을 위에 기와만 얹은 것**.
  #
  # 금지가 지키려던 값은 "세계의 일관성"이었다. 그런데 그 논증에는 숨은 전제가 있었다:
  #   *바닐라의 흙·돌·나무가 지킬 만한 정당한 모습이라는 전제.*
  # 혼천은 **총체적 개조(total conversion)** 다. 이 서버의 세계는 처음부터 강호이고, 지켜야 할
  # '바닐라 세계'는 없다. 흙길을 바닐라로 남기는 것은 중립이 아니라 **마인크래프트를 택하는 것**이다.
  #
  # 그러나 금지가 가리키던 위험 자체는 진짜였다 — 다만 그 이름이 틀렸다. 위험은 '오염'이 아니라
  # **정체(正體)의 상실**이다: 광산 깊은 곳의 돌이 돌로 안 보이면 그것은 버그다. 그래서 금지는
  # 폐기가 아니라 **조건**이 된다 (아래 자재_규약). 자재는 다시 그리되, 제 정체로 읽혀야 한다.
  # ═══════════════════════════════════════════════════════════════════════
  자재층:
    자재_규약:                       # 금지를 대신하는 조건 — 이것을 어기면 그 블록은 다시 금지다
      정체_보존: "흙은 흙으로, 돌은 돌로 보여야 한다 (광산·동굴·숲에서도). 자재는 무협의 **자재**이지 무협의 **무늬**가 아니다"
      수묵: "채도는 의미에만 — 채색 허용은 차양(red_wool)·매화(cherry_*)·등롱·불(campfire_log_lit)뿐. 목재는 '갈색'이 아니라 먹에 흙기를 옅게 섞은 값(채도 ≤ 40), 돌은 무채색"
      뜻이_보이는_자재: "흙길=밟혀 다져진 면+발자국 · 목책·통나무=거칠게 쪼갠 결(도적의 집) · 회벽=매끈하되 얼룩(관청) · 기와=검다 · 초가=성글게 이은 짚 · 다듬은 안산암=정(釘) 자국(사람이 깎은 돌)"
      반복_금지: "면 반복재는 자기 복제 상관 ≤ 0.85 (texture_audit 축 7). 단위(널·켜·쪽·돌)마다 폭·톤·씨앗을 달리하고 긴 직선은 점선으로 끊는다 — 사용자가 두 번 지적한 '한 방향 반복·격자 이음'의 재발 방지"
    covers_문법: "울타리·계단·반블록·담장·문·다락은 **제 텍스처가 없다** — 몸 블록의 PNG를 쓴다 (spruce_planks 1장이 SPRUCE_FENCE 39회를 함께 덮는다. 징발의 가성비가 여기 있다)"
