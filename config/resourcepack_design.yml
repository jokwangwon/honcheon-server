# 리소스팩 디자인 토큰 (기계 판독용) — 슬롯 등록제·색 규율·픽셀 스펙
# 기준 문서: docs/design/resourcepack_design.md
# 원칙: 스펙(슬롯·색·크기)은 계약, 아트(PNG)는 교체형 — 코드는 이 표로만 팩과 만난다

status: 플레이스홀더               # 프로그래머 아트 — 기능 검증용. 승격 = PNG 교체 (코드 불변)

design_language:
  기조: "무협 수묵 — 먹과 한지, 저채도 기본. 채도는 의미에만"
  장식: "정보가 장식보다 먼저 — HUD 글리프 1초 가독. 화려함은 세계(파티클)의 몫, UI는 조용하게"

# ─── 색 규율 — 시스템 색 = 의미 색 (변경은 커밋으로) ───
semantic_colors:
  기세: { 압도적_하수: gray, 하수: white, 동수: yellow, 상수: red }   # MC 색 코드 틴트
  장비_품질: { 범철: gray, 정련: white, 보병: aqua, 신병: gold, 마병: dark_red }
  colorblind_rule: "색 단독 금지 — 아이콘 병기 (기세는 아이콘+색 이중 표기 기확정)"

# ─── 슬롯 등록제 — 사설 영역 대역 선할당 (코드포인트는 계약) ───
glyph_slots:
  E000_E00F: { band: 기세_전투_아이콘, used: { E000: 기세 } }
  E010_E01F: { band: 게이지, used: { E010_E018: 화후_9단 }, note: "내력·원기 = 같은 글리프를 색 틴트로 재사용 (슬롯 절약)" }
  E020_E03F: { band: 경지_칭호_문장, used: { E020_E027: "경지 문장 8단 (삼류~생사경) — 획/능형/원환 3계열 플레이스홀더" }, note: "별호 장식은 E028+" }
  E040_E05F: { band: 장비_등급_아이콘, note: "범철~신병 + 마병 혈향" }
  E060_E07F: { band: 세력_문장 }
  E080_E09F: { band: GUI_배경, used: { E080: "경락도 배경 패널 176x110 (먹색+화선지 테두리)" }, note: "전낭 탭·상점은 E081+ — 음수 공백 기법, ascent 인게임 튜닝" }
  registration: "슬롯 추가 = 본 파일 등록 + build_resourcepack.py 반영 (등록제 문법)"
  pua_rule: "F26 — 소스·데이터 어디에도 PUA 문자 리터럴 직접 삽입 금지: 코드 chr()/\\uXXXX, JSON ensure_ascii. 편집·전송 중 조용히 유실되며 빈 chars 하나가 팩 전체를 무효화한다"

# ─── 픽셀 스펙 ───
pixel_spec:
  폰트_아이콘: { size: 8x8, colors: "백색+투명 2값 — 색은 틴트가 입힌다" }
  게이지: { size: 20x6, colors: 2값 }
  GUI_배경: { size: 256x256, colors: "먹색 직접 채색 허용 (틴트 불가 채널)" }
  아이템_텍스처: { size: 16x16, rule: "바닐라 해상도 준수 — 고해상도 금지 (이질감 방지)" }
  사운드: { format: "ogg 모노", 돌파_적립: "<1.5s", 세계_공지: "종(鐘) 계열" }

# ─── 결정 절차 ───
decision_process:
  token_authority: "디자인 토큰 = 본 파일 + 기준 문서가 단일 원천 — 변경은 커밋"
  art_paths:
    커미션: { consistency: 최고, note: "슬롯 표+기준 문서 = 발주서 (권장)" }
    AI_생성_보정: { speed: 최고, note: "2값 규율·픽셀 정합 수작업 보정 필수" }
    자체_제작: { note: "MVT 수준 — 기능 검증엔 충분" }
  acceptance: [1초_가독, 2값_규율, 틴트_4색_검증, 바닐라_이질감_없음]
  promotion_timing: "아트는 게임플레이를 막지 않는다 — M3(정식 서버) 전까지 플레이스홀더 허용"

roadmap:
  MVT: { slots: [기세, 화후_게이지], status: 완료_플레이스홀더 }
  M2: { slots: [내력_원기_게이지, 경지_칭호_문장, 경락도_GUI_배경], status: 완료_플레이스홀더 }
  M3: [장비_등급_아이콘, 세력_문장, 커스텀_사운드]
  rule: "슬롯·컴파일러 대응 먼저, 아트는 교체형 — 코드 재작업 0"
