      루프_계약: "위상 계수는 **정수**여야 프레임 끝에서 제자리로 돌아온다 (1.3 배 같은 값을 쓰면 마지막 프레임에서 물결이 튄다). 흐름은 프레임당 정수 px 로 내려간다"
    하늘:
