# ═══════════════════════════════════════════════════════════════════════════════
# 의미 적색 등록부 — 【2026-07-14 신설 · RP-5】 검산: tools/texture_audit.py 축 ⑳
# (RP_REVIEW_BOARD §합의 5: "예외를 숨기지 않고 예외 자체를 잰다")
#
# 【왜】 이 팩에서 주사(朱砂)·혈적(血赤)은 장식이 아니라 **의미 채널**이다 — 체력(기혈 구슬),
#   선택(핫바 프레임), 확정(인장), 마병(혈조), 혈계 오의(혈해만리). 의미는 희소해야 산다:
#   기본 GUI·아이템의 적색이 1% 를 넘는 순간 주사는 더 이상 신호가 아니다.
# 【자】 적색 판정 = 알파 ≥16 · HSV hue 335°~20° · 채도(sat) ≥0.35. 비율 = 적색 픽셀 / 보이는 픽셀.
#   기본 상한 1% (default_max_ratio). 그보다 큰 적색은 **여기 등록된 경로만** 허용 —
#   미등록 초과·등록 상한 초과만 위반이다. 표가 곧 예외의 전부다 (조용한 예외 금지).
# 【사정거리】 honcheon/textures/** + minecraft/textures/gui/** (GUI·아이템의 규율이다 —
#   블록·엔티티·파티클은 세계층: 채도는 축 ⑫·⑱ 이 따로 잰다).
# 【문법】 entries 는 위에서 아래로 첫 일치가 이긴다 (fnmatch 글롭). max_ratio 는 실측 + 여유.
semantic_red_registry:
  default_max_ratio: 0.01
  judge: { alpha_min: 16, sat_min: 0.35, hue_deg: [335, 20] }
  entries:
    - { path: "honcheon/textures/font/gui_ledger.png", max_ratio: 0.01, reason: "인장/확정 — 경락도 네 귀 전각 도장 (실측 0.41%)" }
    - { path: "honcheon/textures/item/ult/blood_tide.png", max_ratio: 1.00, reason: "혈계 오의 전용 — 혈해만리 (색의 계약 【채색 예외】: 예외가 곧 정보)" }
    - { path: "minecraft/textures/gui/sprites/hud/heart/*.png", max_ratio: 0.70, reason: "기혈 구슬 — 체력의 주사 (vanilla_texture_channels.hud_체력, 실측 최대 57.7%)" }
    - { path: "minecraft/textures/gui/sprites/hud/hotbar_selection.png", max_ratio: 1.00, reason: "선택 프레임 — 주사 이중 테 + 투명 내부 (hud_핫바: 보이는 픽셀 전부가 주사다)" }
    - { path: "minecraft/textures/gui/sprites/widget/button_highlighted.png", max_ratio: 0.07, reason: "눌린 버튼의 주사 밑줄 (widget_메뉴.design: 있고 없음이 곧 정보, 실측 4.9%)" }
    - { path: "minecraft/textures/gui/sprites/widget/tab_selected*.png", max_ratio: 0.06, reason: "고른 탭의 주사 인끈 한 줄 (widget_메뉴.design, 실측 3.9%)" }
    - { path: "minecraft/textures/gui/sprites/tooltip/frame.png", max_ratio: 0.08, reason: "툴팁 표구 네 귀의 주사 도장 (_tooltip_frame, 실측 5.9%)" }
    - { path: "honcheon/textures/item/weapon/paint/*_mabyeong.png", max_ratio: 0.38, reason: "마병 128px 페인트(V2-W 18차 calm 선협 전파) — 조용한 먹 몸 + **진홍 발광**(균열 기맥 실선·인선 발광·기환고리·기운 자락·광점): 적색이 곧 마병의 계보 신호다. 9차의 '날 전체 검붉은 수정'(실측 최대 40.3%)이 calm 절제로 먹+발광선으로 옮겨가 실측 최대 33.4% (구 마병 — 갈고리 계열은 발광 윤곽 비중이 크다. 부 마병은 37.3→23.3% 감소) 【잠정 — 눈 확정 뒤 재실측】" }
    - { path: "honcheon/textures/item/weapon/paint/myeong/hwasan.png", max_ratio: 0.26, reason: "화산 매화검 — 매화 왕관 + 꽃잎 파편 + 매화홍 악센트의 calm 번역(발광 인선·기환·기맥 꽃술 낱알 기혈 — 18차). 매화가 곧 화산의 문양 신호다 (사용자 직접 청한 검). 실측 21.4% (v17 15.9% — 발광 번역이 매화홍 픽셀을 늘렸다) 【잠정 — 눈 확정 뒤 재실측】. ★ myeong 글롭보다 먼저 — 첫 일치가 이긴다" }
    - { path: "honcheon/textures/item/weapon/paint/myeong/paengga.png", max_ratio: 0.27, reason: "팽가 오호단문도 — 진홍 악센트 상속의 calm 번역(발광 인선·기환·기맥 — 18차) — 호랑이의 문파. 실측 22.6% (v17 21.0%) 【잠정】. ★ myeong 글롭보다 먼저" }
    - { path: "honcheon/textures/item/weapon/paint/myeong/*.png", max_ratio: 0.05, reason: "명병 128px 페인트 — 문양·수실의 적색은 화산·팽가 두 예외 행이 전부다 (매화는 저채도 mix, 당가 독록·무당 청옥 등은 적색 대역 밖). 실측 최대 0.0% (18차 calm 재실측 — 수실이 문파 악센트색 기운 자락으로 번역돼 주사 적색이 사라졌다). ★ 아이콘 글롭보다 먼저 서야 한다 — 첫 일치가 이긴다" }
    - { path: "honcheon/textures/item/weapon/paint/*.png", max_ratio: 0.28, reason: "병기 128px 페인트(V2-W 18차 calm) — 도 계열의 진홍 정체성 악센트 (인선 발광·기환·기맥·수실 자락이 SERIES_INK 진홍을 번역). 실측 최대 24.0% (도 신병 — v17 26.7%에서 감소) 【잠정】. ★ *_sinbyeong.png 등 아이콘 글롭보다 먼저" }
    - { path: "honcheon/textures/item/weapon/spear_*.png", max_ratio: 0.11, reason: "창 홍영(紅纓) 1점 — series.창 등록 문법 (전 등급, 실측 최대 8.6%)" }
