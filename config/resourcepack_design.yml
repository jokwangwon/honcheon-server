      판정: "blockstate → (variants 평균 | multipart: 무조건부 1.0·조건부 0.5) → model → parent 사슬 → #참조 해소. 짐작 금지 — jar 를 실제로 푼다 (piston-meta 로 받아 run/client/ 에 캐시)"
      분모_제외: "AIR(그림 없음) · 아이템(blockstate 없음: HONEY_BOTTLE·GLASS_BOTTLE·DRIED_KELP·GLOW_BERRIES) — 조용히 빠지는 것이 아니라 **이름과 함께 보고**된다"
      특수_렌더러: "유체(WATER·LAVA)와 블록 엔티티(CHEST·DECORATED_POT·SIGN)는 모델에 element 가 없다 → 면적 0으로 조용히 사라진다. 명시 표(FLUIDS·BLOCK_ENTITIES)로 붙잡았다 — 자가 눈감는 자리를 만들지 않는다"
      문턱: "≥ 80%"
      이력:
        - "11.4% — 자재층 이전 (지붕·회벽만)"
        - "84.7% — 자재층 1차 (손계산. **자로 재니 맞았다**: 같은 조성기·같은 팩을 기하 가중으로 독립 측정해 84.7~85.5%)"
