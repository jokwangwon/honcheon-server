  # ═══════════════════════════════════════════════════════════════════════
  # 사람층(人層) — 마을 사람 (VILLAGER). 2026-07 신설
  #
  # 왜: Populace.java 가 **무명 28인**을 VILLAGER 로 세우고 (config/npcs/populace.yml),
  # 계약 NPC 9인도 VILLAGER 다. 플레이어가 마을에서 마주치는 사람은 전부 이 몹이다.
  # 그 몸이 바닐라면 청하현은 무협 마을이 아니라 **바닐라 마을에 기와만 얹은 곳**이다.
  # ═══════════════════════════════════════════════════════════════════════
  사람층:
    마을사람:
      entity: VILLAGER
      렌더_계약: |
        VillagerRenderer 는 **네 층**을 겹친다 (네 장 전부 우리 파일 = 픽셀 하나까지 우리 것):
          ① entity/villager/villager.png                 바탕 — 살결·상투·두건·속옷
          ② entity/villager/type/<생물군계>.png (7종)     겉옷 — **늘 그려진다**
          ③ entity/villager/profession/<생업>.png (14종)  생업 표식 — profession != NONE 일 때만
          ④ entity/villager/profession_level/<등급>.png (5종)  가슴 패 — 생업이 있을 때만
        populace.yml 생업 분포는 NONE 34 / FARMER 8 / 나머지 2씩 → **대다수는 ①+②만으로 선다**.
        그래서 ①+②가 그 자체로 완성된 사람이어야 한다 (③④는 덤이지 필수가 아니다).
      코_금지:
        요구: "바닐라 주민 코 금지"
        이행: |
          리소스팩은 엔티티 **모델(기하)** 을 못 바꾼다 — 코 박스(2x4x2 @ texOffs 24,0)는 모델에 박혀 있다.
          그러나 주민은 RenderType.entityCutoutNoCull 로 그려진다 → **알파 낮은 텍셀은 버려진다**.
          근거(짐작 아님): 바닐라 profession/*.png·type/*.png 는 대부분이 투명한 오버레이인데
          그 투명부가 검은 상자로 나오지 않는다. 같은 모델·같은 렌더타입이다 → 투명 = 안 그려짐.
          ⇒ **코 박스 UV(x24..31, y0..5)를 전부 투명으로 두면 코가 통째로 컬링된다.**
          네 층 전부 우리 것이므로 어느 층도 그 자리를 다시 칠하지 않는다 → 코는 돌아오지 않는다.
          얼굴의 콧대는 머리 앞면에 **명암**으로 새긴다 (사람의 코는 튀어나온 상자가 아니라 빛과 그늘이다).
      UV_규약: |
        몹 모델 UV는 JSON이 아니라 자바에 박혀 있다 → **바닐라 오버레이의 불투명 마스크로 역산**해 검증했다
        (type/plains.png 가 칠하는 자리 = 몸통·다리·팔·팔짱·겉옷 / profession/farmer.png = 모자 박스. 정확히 일치).
          head 0,0 8x10x8 · nose 24,0 2x4x2 · hat 32,0 8x10x8 · hat_rim 30,47 16x16x1
          body 16,20 8x12x6 · leg 0,22 4x12x4 · arm 44,22 4x8x4 · arms_cross 40,38 8x4x4
          jacket 0,38 8x18x6
      몸통_함정: |
        **jacket 은 body 의 자식이고 12가 아니라 18 길이에 CubeDeformation(0.5) 로 부풀려 있다**
        → 몸통 상자를 겉옷 상자가 통째로 감싼다 = 몸통에 그린 획은 영원히 안 보인다.
        (1차 시안에서 교임 깃을 몸통에 새겼다가 종이인형 합성으로 사라진 것을 확인했다.)
        ⇒ 가슴의 모든 획(동정·고름)은 **겉옷 앞면**에 새긴다. 앞치마도 마찬가지.
      옷차림:
        기조: "교임(交衽) 두루마기 — 어깨에서 명치로 모이는 흰 동정 두 사선 + 고름 매듭. 무협의 옷은 여기서 읽힌다"
        채도: "수묵 규율 — 옷은 먹에 흙기를 옅게 섞은 값. **붉은 획은 고름 하나뿐**"
        겉옷_7종: "생물군계가 정한다 (스폰 지점). 하나라도 비우면 그 군계에서 바닐라 갈옷이 튀어나온다 → 7종 전부 채운다"
        생업_14종: "populace.yml 이 쓰는 8종(NONE·FARMER·TOOLSMITH·SHEPHERD·LIBRARIAN·LEATHERWORKER·CLERIC·CARTOGRAPHER·BUTCHER) + 바닐라 잔여 6종. 전역 치환이므로 **전부** 덮는다"
        가슴패_5단: "바닐라의 돌·철·금·에메랄드·다이아 배지 자리(x10..13, y54..57) — 무협의 격은 보석이 아니라 **패**로 말한다: 목(木)·죽(竹)·동(銅)·은(銀)·옥(玉)"
      팩없음_폴백: "바닐라 주민 (팩 게이트: 사람은 팩 없이도 사람이다 — 옷차림만 잃는다)"
      registration: "층 추가 = 본 절 등록 + write_entity_textures 반영"

  # ─── 획층(劃層) — 무공의 모션 (파티클 텍스처). 2026-07 신설 ───
  # 요구: "스킬 모션도 리소스팩으로 적용되되, 팩이 없어도 바닐라 파티클로 무엇이 일어났는지 읽혀야 한다."
  # 그래서 **두 층**이다. 엔진(SkillListener)은 한 줄도 바뀌지 않는다 — 팩은 그 파티클이
  # **무엇으로 보이는지**만 정한다. 팩이 빠지면 바닐라 파티클이 그대로 남는다 (팩 게이트 자동 충족).
  획층:
    엔진_불변: "SkillListener.impact()·qiParticle() 이 쏘는 파티클 종류는 그대로 — 팩은 텍스처만 바꾼다"
    매핑:                            # 파티클 → 바닐라 텍스처 (client jar 의 assets/minecraft/particles/*.json 에서 확인 — 짐작 금지)
      발경: { particles: [SWEEP_ATTACK, CRIT], textures: ["particle/sweep_0..7.png (32x32)", "particle/critical_hit.png (8x8)"], 획: "쓸어치는 호(弧) 한 획 + 먹이 튄 점획" }
      검기: { particles: [ELECTRIC_SPARK, END_ROD], textures: ["particle/glow.png", "particle/glitter_0..7.png"], 획: "짧은 마른 획 + 가늘고 긴 흰 실선" }
      강기: { particles: [END_ROD, EXPLOSION], textures: ["particle/explosion_0..15.png (32x32)"], 획: "터진 먹뭉치에서 뻗는 획 다섯 (별·마법 느낌 금지)" }
      어검_심검: { particles: [END_ROD, FLASH], textures: ["particle/flash.png (32x32)"], 획: "거의 투명한 흰 빛무리 — 보이지 않는 검이 서는 순간" }
      빗나감_다운캐스트: { particles: [CLOUD, SMOKE], textures: ["particle/generic_0..7.png"], 획: "먹이 물에 번지는 농담 (둘이 같은 텍스처를 공유한다)" }
    렌더_계약: "바닐라 파티클 텍스처는 회색조+알파이고 렌더러가 **파티클 색을 곱한다**. 연기(SMOKE)는 색이 어두운 회색이라 텍스처를 먹빛으로 칠하면 곱셈 결과가 검정이 되어 연기가 사라진다 — 그래서 generic_* 의 먹은 **알파에** 두고 밝기는 흰빛으로 남긴다 (END_ROD·CRIT·SWEEP 은 흰색 곱이라 명암을 그대로 쓸 수 있다)"
    전역성: "파티클도 전역이다 (critical_hit 은 바닐라 치명타에도, generic_* 은 모닥불 연기에도 쓰인다). 그래서 '무공 전용 기호'를 그리지 않는다 — 그리는 것은 **먹의 획**이고, 획은 어느 맥락에서도 어색하지 않다"
    registration: "획 추가 = 본 절 등록 + write_particle_textures 반영 (블록과 같은 등록제 문법)"

  # ─── 형태층(形態層) — V2-H 한옥 건축 어휘 3D (pack_upgrade_v2_3d.md §2 · 2026-07-16 신설) ───
  # 텍스처 징발이 「색」의 층이었다면 이것은 **「형태」의 층**이다: 청하현 지붕은 여전히
  # 계단블록으로 보였다 — 텍스처는 기와인데 실루엣이 마인크래프트였다. 블록 **모델**을
  # 재정의해 계단이 물매(경사 기와면)로, 판유리가 세살창으로 읽히게 한다.
  건축_형태층:
    registration: "모델 재정의 추가 = 본 절 등재 + tools/respack/hanok.py 반영 — 미등록 모델 = 즉흥 재형태 = 삭제 대상"
    산출: "assets/minecraft/models/block/*.json 20장 (새 PNG 0장 — 재질은 전부 기존 징발 텍스처)"
    기법: |
      blockstates 는 건드리지 않는다 — 바닐라 blockstate 가 가리키는 **모델 경로**만 재정의한다.
      계단 facing 4 × half 2 × shape 5 = 40 variant 도, 담장·판유리 multipart 도 바닐라
      회전표(y·x 회전 + uvlock)를 그대로 타므로 빠지는 variant 가 구조적으로 없다.
      (blockstate 를 다시 쓰는 길은 variant 하나만 빠져도 그 방향의 지붕이 깨진다 — 택하지 않았다.)
    불변식:
      히트박스: "충돌·점유·보행 판정은 블록 타입이 정한다 — 모델은 시각만. 영향 0"
      컬링_계약: "바닐라가 cullface 를 붙이던 '가득 찬 면'(계단 밑판·뒷판, 반블록 밑판, 풀블록 여섯 면)은 재정의 후에도 가득 채운다 — 이웃이 그 면을 믿고 제 면을 지우므로 안 채우면 엑스레이 구멍"
      원소_한계: "회전 한 축 · {±22.5,±45} · 좌표 -16..32 — hanok.py _el() 이 컴파일 시 검증"
      침범_한계: "이웃 칸 침범은 처마·수키와 끝 ≤ 2px (지붕에서 그 자리는 한 단 아래·앞 — 거의 언제나 공기)"
    재정의:
      기와_계단: { files: [deepslate_tile_stairs, deepslate_tile_stairs_inner, deepslate_tile_stairs_outer, deepslate_brick_stairs, deepslate_brick_stairs_inner, deepslate_brick_stairs_outer], 프로파일: "바닐라 실루엣(밑판+뒷단) 위에 45° 경사판(빗변 8√2 — 층계 모서리 (0,8)→(8,16))·처마 1.4 연장·수키와 골 3줄(주기 8 = 텍스처 너울 마루와 같은 격자). inner=합각 골 · outer=추녀마루" }
      기와_반블록: { files: [deepslate_tile_slab, deepslate_tile_slab_top, deepslate_brick_slab, deepslate_brick_slab_top], 프로파일: "윗면 수키와 3줄 (top 반블록은 아랫면 — 처마 밑에서 올려다보는 기와 끝)" }
      기와_풀블록: { files: [deepslate_tiles, cracked_deepslate_tiles, deepslate_bricks, cracked_deepslate_bricks], 프로파일: "윗면 y16→16.8 수키와 3줄 (용마루·적새). tiles=z결 · bricks=x결 — 조성기 crossGrain 의 자재 선택 축과 동일해 수키와가 어느 경사면에서나 물매를 따른다" }
      담장_갓: { files: [deepslate_tile_wall_post, deepslate_tile_wall_side], 프로파일: "기둥·팔 위에 갓돌(개판 1px 내밈 + 마루). side_tall 은 제외 — 위가 막힐 때 나오는 변종이라 갓이 죽은 원소" }
      세살창: { files: [glass_pane_post, glass_pane_side, glass_pane_side_alt], 프로파일: "유리판(2px·그림 정렬 바닐라 자리 그대로) + 관통 목살 — 세로살 2 + 띠장 2 가 양쪽 0.75 돋는다. 문설주(post)는 2.8각 목재 상자. noside 2종은 바닐라 유지(스텁이 문설주 속에 숨는다). 재질 = glass_pane_top(창살 마구리)" }
      죽렴: { files: [bamboo_planks], 프로파일: "윗면 대쪽 돋움 4줄 (텍스처 쪽 폭 4·마루 x%4∈{0,1} 과 같은 격자)" }
    전역_효과: "형태도 텍스처처럼 전역이다 — deepslate 기와 계열은 고대 도시(기존 수용 판정), deepslate_bricks 는 석실 제단·감실(RemoteBuilder)에도 선다: 같은 기와 어휘라 이질감 없음 판정 (잠정). glass_pane 은 바닐라 마을 창도 세살창이 된다 (§3.1 격자창 판정의 연장 — 이득)"
    한계:
      블록엔티티: "현판(dark_oak_hanging_sign)·궤(chest)·decorated_pot 은 모델 JSON 이 아니라 하드코딩 렌더러가 그린다 — 팩으로는 entity/ 텍스처 교체까지 (형태를 얹을 수 없다. 기존 징발 유지)"
      직육면체_한계: "MC 원소는 상자뿐 — 추녀 앙곡·안허리곡은 45° 평면 근사. outer 계단의 낮은 사분면은 평활면으로 남는다"
    잠정: "수키와 주기 8·폭 1.5·돋움 0.8 / 처마 내림 1.3 / 경사 45° — 오프라인 등축 렌더로 고른 값 (실존 한옥 치수의 정밀 재현이 아니다. 인게임 인상으로 확정)"

# ─── 파이프라인 계약 (build_resourcepack.py 확장 — 구현은 다음 증분) ───
texture_pipeline:
  dirs:
    아이템_정의: "assets/honcheon/items/<key>.json — item_model 컴포넌트가 가리키는 곳 (1.21.4 신규)"
    아이템_모델: "assets/honcheon/models/item/<key>.json — **병기 45자루는 elements(3D)** · 그 외는 generated(평면)"
    아이템_텍스처: "assets/honcheon/textures/item/<key>.png — 16x16 (병기는 이 한 장이 아이콘이자 3D 의 재질이다)"
    # ★ 획·가죽의 텍스처도 **아틀라스 안**(textures/item/**) 에 산다 — 밖에 두면 보라 큐브다 (축 ⑮).
    #   참격선 3종은 **64x64 정사각**이다: 그림은 위 64x16 이고 모델이 uv v 를 0~4 로 물어 같은 그림을
    #   가리킨다. 가로로 긴 텍스처(64x16)는 마인크래프트가 받지 않는다 (축 ⑯).
    #   아이콘 축(16x16 치수·외곽선 폐합)은 이것들에 **적용되지 않는다** — texture_audit 의 NON_ICON 등록.
    획_모델: "assets/honcheon/models/item/qi|ult/<key>.json (3D) + assets/honcheon/textures/item/qi|ult/<key>.png (32x32 · 참격선 3종은 64x64)"
    짐승_모델: "assets/honcheon/models/mob/<name>/<part>.json (3D) + assets/honcheon/textures/item/mob/<name>/<part>.png (32x32)"
    메뉴_스프라이트: "assets/minecraft/textures/gui/sprites/widget|tooltip/<name>.png — **.mcmeta 는 굽지 않는다** (바닐라 나인슬라이스가 그대로 산다 = 좌표 계약 불변)"
    블록_텍스처: "assets/minecraft/textures/block|entity|painting/<vanilla>.png — 전역 치환 (blockstate/model JSON 불요)"
  builder_hooks: [ITEM_ART_등록표, write_item_assets, weapon_model_3d, write_qi_assets, write_mob_assets,
                  write_ui_sprites, BLOCK_ART_등록부, write_block_textures, "main() 산출 집계",
                  "pack.mcmeta description 갱신 (pack_format 75 불변)"]
  promotion: "플레이스홀더 → 정식 PNG 교체 시 ITEM_ART의 art 자리를 PNG 경로로 교체 (load_png 1개 추가) — 키·코드 불변"
  distribution: "server.properties resource-pack + sha1. require-resource-pack=false 유지 — 팩 게이트의 서버 측 표현"

# ═══════════════════════════════════════════════════════════════════════════════
# 「묵청(墨靑)」 아트 디렉션 — 【2026-07 신설】  기준 문서: docs/design/pack_art_direction.md
#
# 묵풍(墨風)이 세계의 **기반**이고, 청량(淸涼)은 **희귀함과 신비의 강조**다 (주조색이 아니라 포인트).
# ★ 이것은 새 방향이 아니라 **이미 도착한 곳의 이름**이다 — ⑫-e(모집단 갈라짐)가 그것을 재고 있다:
#   자연 56.7 ↔ 자재 23.1 · 격차 33.5. 「묵청」은 그 계약의 **말**이고, 계약은 그 말의 **기계**다.
# ═══════════════════════════════════════════════════════════════════════════════
mukcheong:
  묵풍:                              # 세계의 기반 — 먹·화선지·바랜 목재·거친 석재
    먹_외곽선: "#1A1816"
    먹_기와: ["#2C2824", "#58524A"]   # 지붕 — **이 세계의 먹**. 밝히면 그것이 거짓말이다
    화선지_여백: ["#D8D0BE", "#EEE7D6"]  # ★ 여백이 밝지 않으면 먹이 먹으로 읽히지 않는다
    목재: ["#66584A", "#C8B49C"]      # 조성 팔레트 최대 면적 (44장)
    석재: ["#73706B", "#C3C1BB"]      # 무채색 — 돌은 먹이 아니다
    주사_朱砂: "#96382C"              # 수묵의 **유일한 붉은 점** — 도장·선택 프레임·기혈 구슬
  청량:                              # 희귀함과 신비 — **포인트**
    옥_玉: "#7AB0A8"                 # 무당 태극 · 소림 반야 · 영약
    매화_梅花: ["#B05C6C", "#D68A98"]  # 화산 — 채색이 허락된 자리
    독_毒: "#7E9E76"                 # 당가 — 옥과 갈려야 한다 (푸른 옥 ↔ 누런 독)
  ★면적_규율: |
    청량은 **한두 픽셀**이다. 면을 칠하면 포인트가 아니라 **도배**다.
    ⇒ 포인트는 면적이 작으므로 **자재 평균 채도(⑫-e ≤ 25)를 흔들지 않아야 정상이다.**
      흔들리면 그것이 곧 도배의 증거다 — **⑫-e 가 그것을 잡는다** (재는 자가 이미 있다).
    실측: 명병에 옥·매화·독을 넣었으나 자재 23.1 **한 톨도 안 움직였다** (규율이 지켜진 기계적 증거).
  배분:                              # 시각적 무게와 역할 (면적 계산이 아니다)
    건축_블록: { 묵풍: 60, 청량: 40 }
    GUI: { 묵풍: 70, 청량: 30 }
    파티클: { 묵풍: 30, 청량: 70 }
    일반_장비: 묵풍_중심
    희귀_장비_영물: 청량_포인트_중심

# ─── 명병(名兵) 채널 — 문파의 얼굴 ───
# ★ sect id 는 **config/factions.yml 의 member id** 다 (코드가 지어내지 않는다 — 등록제).
# ★ 실루엣은 **docs/design/sect_lineage.md 의 수치 지문에서 도출**한다 (skills.yml 이 굴리는 실제 값).
#   ⇒ 가장 빠른 검이 가장 얇고, 가장 무거운 검이 가장 두껍다 — 그림이 기계와 일치한다.
myeongbyeong:
  path: "assets/honcheon/items|models/item|textures/item/weapon/myeong/<sect>.png"
  model_key: "honcheon:weapon/myeong/<sect>"
  배선: "Weapons.java — 애병(Beloved.명병)이 문파를 알 때 이 키를 박는다 (코드는 pack_art_direction.md §7)"
  팩없음_폴백: "베이스 아이템(golden_sword 등)이 그대로 — 플레이는 된다 (팩 게이트)"
  문양_규율: "**코등이와 물미에만.** 날에는 안 앉는다 — 날은 날이어야 한다 (프롬프트 원칙 ③)"
  등록:
