# ─── 블록 희생 등록부 — 전역 치환 (징발 12 / 보류 4 / 금지 6계열) ───
# 입력: docs/design/building_style_guide.md 팔레트. 판정: 세계 오염 검사 + 팩 게이트.
block_channels:
  징발:
    deepslate_tiles:
      무협_자산: "흑와 — 기와면·용마루·추녀마루·담 갓"
      covers: [deepslate_tile_stairs, deepslate_tile_slab, deepslate_tile_wall]   # PNG 1장이 계단·반블록·담장을 전부 덮는다
      징발_판정: "자연 생성 없음(제작 전용). 고대 도시(Deep Dark)가 유일 오염원 — 접근 난도 극히 높고 콘텐츠 밖"
      팩없음_폴백: "검은 기와처럼 보이는 돌 (건축 가이드가 이미 그렇게 골랐다)"
    cracked_deepslate_tiles: { 무협_자산: "깨진 기와 (폐사당 잔해)", 징발_판정: "동일 — 고대 도시 오염 동반", 팩없음_폴백: "금 간 검은 돌" }
    # ─── 직각 경사면용 회전 변형 (2종) — 지붕은 네 방향 경사면인데 블록 텍스처는 한 장이고 방향이 고정이다.
    #     남북 경사면에선 기와 결이 경사를 가로지르지만(옳다), 동서 경사면에선 같은 결이 경사와 나란히
    #     누워 '기와가 옆으로 누운 것'처럼 보인다 — 인게임 실측 "한 방향으로 되어 이질감이 듦".
    #     처방: 동서 경사면에는 **결이 직각인 다른 블록**을 깐다. 그러면 네 면이 다 제 방향의 결을 갖는다.
    #     아트는 새로 그리지 않는다 — deepslate_tiles를 90도 돌린 바로 그 픽셀이다 (팔레트·얼룩 통계·
    #     이음매 성적이 원본과 동일하므로 한 지붕에 섞여도 이질감이 0이다. 대조 검증: 불일치 0/256px).
    deepslate_bricks:
      무협_자산: "흑와 — 직각 경사면용 회전 변형 (동서 경사면. deepslate_tiles의 90도 회전판)"
      covers: [deepslate_brick_stairs, deepslate_brick_slab, deepslate_brick_wall]  # PNG 1장이 계단·반블록·담장 전부를 덮는다
      징발_판정: "자연 생성 없음(제작 전용). 고대 도시(Deep Dark)가 유일 오염원 — deepslate_tiles와 **정확히 같은 수준·같은 출처**의 오염이다.
                 이미 그 오염을 수용 판정했으므로 같은 방(房)의 블록 한 종을 더 받는 것은 새 위험이 아니다 (접근 난도 극히 높고 콘텐츠 밖).
                 얻는 것: 지붕 네 면의 결 정합 — 마을의 첫인상을 고치는 대가로는 싸다"
      팩없음_폴백: "검은 벽돌처럼 보이는 돌 (tiles와 나란히 놓여도 같은 계열 — 팩 없이도 지붕으로 읽힌다)"
      배선: "조성기가 동서 경사면에 DEEPSLATE_BRICK_* 를 쓴다 (텍스처 측 준비 완료 — 배선은 조성기 소관)"
    cracked_deepslate_bricks:
      무협_자산: "깨진 기와 — 직각 변형 (cracked_deepslate_tiles의 90도 회전판)"
      징발_판정: "동일 — 고대 도시 오염 동반. deepslate_bricks와 같은 근거"
      팩없음_폴백: "금 간 검은 벽돌"
    white_terracotta:
      무협_자산: "백벽 — 상가·관아급 벽 (수묵 정체성)"
      징발_판정: "배들랜드 지층에 대량 자연 생성 — 그러나 무늬 없는 저대비 회백을 유지하면 지층에서 튀지 않는다 (텍스처 디자인으로 오염 무력화)"
      조건: "무늬·이음선 금지"
      팩없음_폴백: "하얀 벽"
    light_gray_terracotta: { 무협_자산: "회벽 — 서민 벽", 징발_판정: "동일(배들랜드)", 조건: "무늬·이음선 금지", 팩없음_폴백: "회색 벽" }
    glass_pane:
      무협_자산: "격자창(格子窓)"
      textures: [block/glass.png, block/glass_pane_top.png]
      징발_판정: "면 텍스처를 유리 블록과 공유 — 유리도 격자창이 된다. 그러나 전근대 강호에 판유리는 없다: 오염이 아니라 정합. 바닐라 마을 창문의 동아시아화는 이득"
      팩없음_폴백: "유리창 (투명 = 창)"
    bamboo_planks: { 무협_자산: "죽렴(竹簾) — 발·좌판·건조대", 징발_판정: "자연 생성 없음. 세로 결 텍스처는 좌판·바닥으로도 읽힌다", 팩없음_폴백: "밝은 대나무 판" }
    dark_oak_hanging_sign: { 무협_자산: "현판·주기(酒旗)", texture: "entity/signs/hanging/dark_oak.png", 징발_판정: "자연 생성 없음. 다크오크 변종만 — 다른 목재는 바닐라 유지", 팩없음_폴백: "매달린 나무 간판" }
    decorated_pot: { 무협_자산: "청화 술단지·약단지·쌀독", texture: "entity/decorated_pot/decorated_pot_base.png", 징발_판정: "흔적 폐허에 자연 생성 — sherd 무늬는 별도 텍스처라 유지. base만 교체(무해)", 팩없음_폴백: "장식 항아리 (이미 도자기)" }
    chiseled_bookshelf: { 무협_자산: "한약장 서랍·문서철", 징발_판정: "자연 생성 없음. 책 유무 슬롯을 서랍 문법으로 재해석 — '꽂힌 책 = 채운 서랍'", 팩없음_폴백: "칸 있는 책장", risk: "아트 난도 높음 — 2차 실패 시 보류로 강등" }
    lantern: { 무협_자산: "등롱(燈籠)", 징발_판정: "구조물 소량 생성(드묾) — 무해", 팩없음_폴백: "매단 등 (팩 없이도 등롱처럼)" }
    soul_lantern: { 무협_자산: "백등롱 — 폐사당 냉광 전용", 징발_판정: "네더 요새 생성 — 냉색=금기 의미 유지", 팩없음_폴백: "푸른 등" }
    painting: { 무협_자산: "족자 — 수묵 산수·서예", scope: "1x1·2x1 소형 우선", 징발_판정: "마을·삼림 저택 벽에 생성 — 그림이 족자가 되는 것은 전역 이득", 팩없음_폴백: "벽에 걸린 그림" }

  보류:
    note_block: { 사유: "blockstate 트릭의 재료 — 지금 재텍스처하면 트릭 여지가 사라진다 (texture_rules.blockstate_trick.reserve)" }
    mud_bricks: { 사유: "팩 없이도 이미 흙벽 — 얻는 것이 없다 (효용 미달)" }
    red_wool: { 사유: "팩 없이도 붉은 천 — 얻는 것이 적다" }
    stripped_dark_oak_log: { 사유: "목재는 이미 목재 (효용 미달)" }

  금지:                              # 자연이 만든 블록은 건드리지 않는다
    지형: { blocks: [stone, dirt, gravel, dirt_path, smooth_stone], 사유: "지형 그 자체 — 재텍스처 = 세계 전체 오염" }
    수목: { blocks: [dark_oak_log, spruce_log, oak_log], 사유: "숲 바이옴 전체가 이 블록이다 — 나무 한 그루가 기둥이 된다" }
    석조: { blocks: [stone_bricks, cobblestone, mossy_cobblestone, cracked_stone_bricks], 사유: "요새·던전·감시탑에 대량 자연 생성" }
    기물_생성: { blocks: [hay_block, barrel, chest, lectern, cauldron, brewing_stand], 사유: "마을·구조물 전반 생성 + 팩 없이도 각자 읽힌다" }
    구리: { blocks: [oxidized_cut_copper_stairs, oxidized_cut_copper_slab], 사유: "플레이어 건축·구리 사용처 광범위, 얻는 것 적음" }
    잔여_오염_감시: "징발 12종 중 자연 생성 오염이 남는 것 3종 — deepslate_tiles(고대 도시) / *_terracotta(배들랜드) / decorated_pot(흔적 폐허). 육안 확인 전엔 수용 판정도 가설이다"

# ─── 파이프라인 계약 (build_resourcepack.py 확장 — 구현은 다음 증분) ───
texture_pipeline:
  dirs:
    아이템_정의: "assets/honcheon/items/<key>.json — item_model 컴포넌트가 가리키는 곳 (1.21.4 신규)"
    아이템_모델: "assets/honcheon/models/item/<key>.json — parent: handheld(무기) | generated(그 외)"
    아이템_텍스처: "assets/honcheon/textures/item/<key>.png — 16x16"
    블록_텍스처: "assets/minecraft/textures/block|entity|painting/<vanilla>.png — 전역 치환 (blockstate/model JSON 불요)"
  builder_hooks: [ITEM_ART_등록표, write_item_assets, BLOCK_ART_등록부, write_block_textures, "main() 산출 집계", "pack.mcmeta description 갱신 (pack_format 46 불변)"]
  promotion: "플레이스홀더 → 정식 PNG 교체 시 ITEM_ART의 art 자리를 PNG 경로로 교체 (load_png 1개 추가) — 키·코드 불변"
  distribution: "server.properties resource-pack + sha1. require-resource-pack=false 유지 — 팩 게이트의 서버 측 표현"

roadmap:
  MVT: { slots: [기세, 화후_게이지], status: 완료_플레이스홀더 }
  M2: { slots: [내력_원기_게이지, 경지_칭호_문장, 경락도_GUI_배경], status: 완료_플레이스홀더 }
  M2_HUD: { slots: [체력_기혈구슬, 핫바_수묵패널, 인벤토리_화선지_재채색, 음수_공백], status: 완료_플레이스홀더, note: "바닐라 텍스처 교체 채널 — vanilla_texture_channels 등록" }
  M3: [장비_등급_아이콘, 세력_문장, 커스텀_사운드]
  rule: "슬롯·컴파일러 대응 먼저, 아트는 교체형 — 코드 재작업 0"
