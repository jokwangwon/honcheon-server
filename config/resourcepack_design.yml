# ═══════════════════════════════════════════════════════════════════════════════
# 소리 채널 등록부 — 【2026-07 신설】 팩의 가장 큰 공백
#
# 【현황】 혼천의 소리 = **0종.** assets/*/sounds/ 에 .ogg 가 한 장도 없다.
#   지금 강호에서 나는 소리는 **전부 바닐라**다: 호신강기를 두르면 컨듀잇이 울고,
#   창을 찌르면 삼지창 소리가 나고, 오의를 터뜨리면 비콘이 운다.
#
# 【정직한 벽 — 이것을 넘지 못했다】
#   .ogg(Vorbis) 는 **파이썬으로 생성할 수 없다.** 이 저장소의 팩 파이프라인은 PNG·JSON 만
#   결정론적으로 굽는다. 소리는 **녹음하거나 합성해서 가져와야 하는 것**이고, 그것은
#   빌더의 일이 아니라 **사람의 일**이다. 짐작으로 바닐라 키를 바꾸는 것은 검수가 아니라 도박이다
#   (나는 소리를 들을 수 없다 — 무엇이 더 어울리는지 **귀 없이 고를 수 없다**).
#
# 【그래서 지금 한 것 — 없애는 것만으로도 세계가 조용해진다】
#   sounds.json (assets/minecraft/sounds.json — build_resourcepack.py: write_sounds)
#     · 배경음악 96종 전부 침묵 (music.* — "replace": true + 빈 sounds)
#       ★ C418 이 흐르는 무당산은 무당산이 아니다. **조용한 강호가 마인크래프트 강호보다 낫다.**
#     · 동굴 앰비언스 침묵 (ambient.cave) — 동혈의 '누가 있다' 소리
#     · music_disc.* 는 **남긴다** — 축음기는 플레이어가 **스스로 켜는** 것이다.
#       세계가 멋대로 트는 소리와, 사람이 틀기로 한 소리는 다르다.
#     · 발소리·물소리·짐승 소리도 **남긴다** — 끄면 세계가 죽는다. 그건 분위기가 아니라 **정보**다
#       (뒤에서 오는 발소리는 강호에서도 발소리다). 바꿀 것은 지우는 게 아니라 **굽는 것**이다.
#
# 【청구서 — .ogg 가 생기면 여기에 꽂는다】
#   문법: assets/honcheon/sounds/<채널>/<이름>.ogg + sounds.json 에 honcheon:<채널>.<이름> 등록.
#   ★ 바닐라 키를 **재배치**하는 길도 열려 있다 (sounds.json 이 한 키를 다른 바닐라 소리로 가리킬
#     수 있다) — 그러나 그것은 **귀로 골라야 한다.** 목록만 세워 둔다.
sound_channels:
  status: 미착수_0종
  pipeline_wall: ".ogg 는 build_resourcepack.py 가 만들 수 없다 (PNG·JSON 전용). 외부 자산 필요"
  현재_침묵: { 배경음악: 96, 동굴_앰비언스: 1, 총: 97 }
  현재_바닐라_차용:               # 지금 실제로 나는 소리 (config/skill_motion.yml) — 교체 대상
    기_발현: { key: "block.conduit.activate", 용처: 8, 문제: "바다 구조물의 소리 — 강호의 기(氣)가 아니다" }
    기_소멸: { key: "block.conduit.deactivate", 용처: 3, 문제: "남의 격이 꺼지는 소리로 쓰는 중 (의미는 맞으나 음색이 바다다)" }
    응집:    { key: "block.beacon.power_select", 용처: 16, 문제: "비콘 — 기 모으는 소리로 차용" }
    창격:    { key: "item.trident.throw", 용처: 8, 문제: "삼지창 — 창(槍)이 아니다" }
    참격:    { key: "entity.player.attack.sweep", 용처: 75, 문제: "바닐라 검격 (가장 많이 쓰인다 — 1순위 교체)" }
  bill:                          # 필요한 .ogg — 약 30종 (우선순위 순)
    병기_참격: [검_참, 도_참, 창_찌름, 권_타격, 단검_속격]        # 5 — entity.player.attack.* 대체
    기_운용: [운기_시작, 응집, 발경, 기_발현, 기_소멸]            # 5 — beacon/conduit 대체
    무공_오의: [오의_시전, 오의_적중, 검기_방출, 호신강기_전개]    # 4
    타격_피격: [피격_육, 피격_금속, 막기, 빗나감]                 # 4
    세계: [문파_종소리, 저잣거리_웅성, 대나무_바람, 계곡_물]       # 4 — 앰비언스 (침묵 자리를 메운다)
    UI: [승급, 심법_전수, 기연, 주화입마]                          # 4
    기타: [발소리_흙, 발소리_돌, 발소리_나무, 만두_먹기]           # 4 — 바닐라 대체 (선택)
    총: 30
  note: "채널을 열어 두었다 — .ogg 가 생기면 sounds.json 등록 + skill_motion.yml 의 key 를 honcheon:* 로 바꾸기만 하면 된다 (코드 변경 0)"

  # ─── 서장 사건음 4채널 【SJ-002 · 2026-07-14 신설】 — 첫 살아 있는 honcheon:* 소리 ───
  #
  # 【위의 벽을 어떻게 지나는가】 .ogg 는 여전히 못 굽는다 — 그러나 sounds.json 은 한 이벤트를
  #   **다른 바닐라 이벤트로 재지향**할 수 있다 ({"type": "event"}). 그래서 honcheon:seojang.* 는
  #   .ogg 없이도 **지금 난다** — 등록된 바닐라 종이·책·종 계열로 (청사진 §4.2: "음원 파일이 없을
  #   때는 등록된 바닐라 종이·책·종 계열 소리로 폴백"). 짐작 도박이 아니다: 폴백은 이미 그 뜻으로
  #   쓰이는 바닐라 소리다 (책장 넘김·책 놓기·종).
  # 【두 겹의 강등】 ① 팩은 있는데 .ogg 가 없다 → 팩 안 재지향이 바닐라 소리를 낸다 (침묵 아님)
  #                ② 팩 자체가 안 켜졌다 → 서버(SeojangBook.chime)가 fallback_event 키로 직접 낸다
  # 【소비자】 config/seojang.yml presentation.sounds — 그 표의 fallback 과 아래 fallback_event 는
  #   같아야 한다 (어긋나면 팩 있는 귀와 없는 귀가 다른 사건을 듣는다).
  seojang:
    status: 바닐라_재지향_가동      # .ogg 0장 — 그러나 채널은 산다
    builder: "build_resourcepack.py write_seojang_sounds → assets/honcheon/sounds.json"
