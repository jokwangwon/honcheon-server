    커버리지:
      축: "texture_audit.py 축 ⑪ — 「조성 팔레트 커버리지」. **이 수치는 이제 손계산이 아니라 자가 잰다**"
      정의: "청하현에 선 플레이어의 눈에 닿는 픽셀 중 팩이 그린 것의 비율 = Σ(빈도 × 면적 × 불투명도) 중 팩 보유분"
      가중:
        빈도: "조성기(CheonghaBuilder·RemoteBuilder) 코드의 Material.XXX 출현 수 (주석·문자열 제거 후). 대리 지표 — 절대량은 틀리나 블록끼리의 상대 비중은 남는다"
        면적: "**1.21.11 클라이언트 jar 의 모델 JSON 기하에서 낸다** (손 등급 금지 — 손 등급은 다음 사람이 못 재는 또 하나의 손계산이다). element 의 from/to 가 직육면체를, face 가 텍스처와 넓이를 준다. 온전한 큐브 = 6면 × 256 = 1536 / 울타리 기둥 = 288 / 화분은 더 작다 — 기하가 말한다"
        불투명도: "컷아웃(풀·유리·창살·거미줄)은 제 사각형을 다 안 채운다 — 바닐라 PNG 의 불투명 픽셀 비율을 곱한다"
      다중_텍스처: "블록 하나가 여러 장을 쓴다 (*_top/*_side/*_bottom). 면적 가중이 이것을 정확히 푼다: 큐브의 옆면(*_side)은 4면=1024, 윗면(*_top)은 1면=256 → *_side 를 덮는 것이 4배 값지고, 자가 그렇게 센다"
      판정: "blockstate → (variants 평균 | multipart: 무조건부 1.0·조건부 0.5) → model → parent 사슬 → #참조 해소. 짐작 금지 — jar 를 실제로 푼다 (piston-meta 로 받아 run/client/ 에 캐시)"
      분모_제외: "AIR(그림 없음) · 아이템(blockstate 없음: HONEY_BOTTLE·GLASS_BOTTLE·DRIED_KELP·GLOW_BERRIES) — 조용히 빠지는 것이 아니라 **이름과 함께 보고**된다"
      특수_렌더러: "유체(WATER·LAVA)와 블록 엔티티(CHEST·DECORATED_POT·SIGN)는 모델에 element 가 없다 → 면적 0으로 조용히 사라진다. 명시 표(FLUIDS·BLOCK_ENTITIES)로 붙잡았다 — 자가 눈감는 자리를 만들지 않는다"
      문턱: "≥ 80%"
      이력:
        - "11.4% — 자재층 이전 (지붕·회벽만)"
        - "84.7% — 자재층 1차 (손계산. **자로 재니 맞았다**: 같은 조성기·같은 팩을 기하 가중으로 독립 측정해 84.7~85.5%)"
        - "93.5% — 자재층 2차 (본 증분. 축 ⑪ 이 세워 준 면적 순으로 위에서부터 메웠다)"
      남은_구멍: "미커버 6.5% (25장) — **전부 보류 등록분이다** (아래 보류 절): 물·용암 33.8k(유체+프레임 시트+틴트) · 풀·잎 계열 41.5k(컬러맵) · 수초 7.0k(프레임 시트) · 불 2.2k(프레임 시트). 즉 **사유 없이 비어 있는 칸은 0장**이다"
      불변식: "미커버 텍스처는 전부 「보류」에 사유와 함께 있어야 한다. 사유 없이 빈 칸이 하나라도 생기면 등록부가 거짓말을 하는 것이다 (현판이 그랬다 — 축 ⑪ 이 잡았다)"

