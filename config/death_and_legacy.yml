# 죽음과 유산 규칙 (기계 판독용) — G3 해소
# 기준 문서: docs/design/death_and_legacy.md
# 원칙: 부활 없음 (혼백 분리). 패배의 기본값은 죽음이 아니라 제압·강탈이다.

death_pipeline:
  default_defeat: [제압, 강탈, 중상]   # 살인은 비싸다 — 소문·수배·세력 반응 (세계가 청구)
  lethal_condition: "상대의 살의 (사선 조우·처형·복수 등 서사적 상황)"
  빈사: "매 라운드 체력 판정 (비대립 12, combat.yml 기존)"
  사망_위기:
    window_rounds: 1                 # 마지막 개입 창구 (밸런스 관측치 — 과도 사망 시 2로 완화)
    interventions:
      회생: { cost: "선천진기 10년 (internal_energy 기존)", trigger: 사전_선언제_자동 }
      구조: { check: "의술 지혈 — 비대립 어려움 14", by: [동행, NPC] }
      확인_사살: "상대의 '행동' 1개 — 그 사이 세계가 개입할 수 있다"
  no_intervention: 사망_확정_비가역

legacy:
  현장: { drops: [전낭_전액, 착용_장비], rule: "줍는 자의 것 — 애병은 남의 손에서 등급값" }
  예치:
    order: [생전_지정_상속인, 혈연_NPC, 세력_귀속_무주공산]
    지정: "동행·결의·NPC 관계 중 생전 선언 (이벤트 로그 기록)"
    전표: "지참인 지불 — 시신의 전표는 주운 자의 것"
  비이전: [화후, 숙련, 경지, 마크, favor]   # 몸에 새긴 것은 무덤까지 (무경험치 정합)
  예외_남긴_것: [직접_필사_비급_하위사본, 제자_사사_기록]

world_memory:
  소문: { strength: 2, note: "사인·장소 포함 — 정확도 규칙 적용 (억울한 죽음은 왜곡된다)" }
  명성: "동결 — 별호는 세계 연표에 역사로 (NPC 회고 가능)"
  favor_승계: "은인의 favor 일부 → 유족·제자 (개입 기록 상속 문법 재사용)"
  피의_장부: "피살자의 원한은 살해자에게 이관 — 유족 NPC·새 캐릭터의 복수 훅"
  미해결_훅: "개인 스레드 → 세계 스레드 이관 — 죽음이 이야기를 죽이지 않는다"
  수배: "살인 목격·시신 경유 → 관아 수배·현상금 (economy 현상금 표 연동)"

new_character:
  cooldown: 없음                      # 죽음이 이미 비싸다
  start_rule: "유년/소년 시작 규칙 그대로 (player_creation)"
  lineage_choice:
    혈연_시작: { grants: [상속분_접근, 피의_장부_상속], family_template: 몰락_무가의_자식_문법 }
    무관_시작: 완전_백지
  world_slot: "사망 즉시 반환 (세계 정원 120 정합)"

balance_watch:
  metric: 시즌당_사망률                # 이벤트 로그 집계 — G10 장기 시뮬 입력
  levers: { 과도: "사망 위기 창구 1→2라운드", 과소: 유지 }
