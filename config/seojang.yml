# 서장(序章) — 강호에 서기 전의 이야기. **책 한 권으로 흐른다.**
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 이 파일이 생긴 이유 (2026-07-13)
#
# 사용자: "이제 **봇도 스토리 마크로 진행화** 합시다. **디스코드에서 채팅을 치고 진행하는 것이
#          아닌 마크로 넘어가는 걸로** 표현하자."
#
# 서장은 **디스코드의 프라이빗 스레드**에서 흘렀다 — 임베드가 뜨고, 버튼 셋이 붙고, 눌렀다.
# 그 길은 **죽었다.** 이제 서장은 **게임 안의 책**으로 흐른다. 책을 펼치면 이야기가 뜨고,
# **글자를 누르면** 고른다. 임베드를 억지로 옮긴 것이 아니다 — **책은 이 세계에 원래 있던 물건이다**
# (비급·서찰·유서·족보). 무협의 결에 맞는다.
#
# 【★ 옛 길은 남기지 않았다】 "두 벌이면 하나가 낡는다." 디스코드의 서장 스레드는 **더 이상 열리지 않고**
#   턴 버튼(tn:*)은 **없앴다**. 디스코드에 남은 것은 **생성 문답**(성별·유년의 기억 5문항)과
#   **이정표 하나**뿐이다 — "여기가 아니라 강호에서 이어진다."
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 누가 이 글을 그리는가 — **봇이다.** 마크는 **화면과 손**이다.
#
# 서사는 LLM 이 그린다 (LlmRenderer — 로컬 qwen3 또는 Claude). 그 LLM 은 **봇에만 있다.**
# 판정(2d6·경지·성별 보정)도 봇의 엔진이 굴리고, 시트도 봇의 장부에 있다.
# **마크는 DB 를 열지 않는다** (단일 작성자). 그러므로:
#
#     봇   = 저자(著者)   — 문장을 그리고, 주사위를 굴리고, 장부에 적는다
#     마크 = 서책(書冊)   — 책을 쥐여 주고, 펼쳐 보이고, **누른 것을 다리로 되돌린다**
#
# 만약 마크가 서사를 지으면 **정본이 둘**이 된다 — 이 저장소가 반복해서 데인 바로 그 병이다.
# 그래서 마크에는 **문장이 한 줄도 없다.** 아래 글이 봇을 거쳐 다리를 건너 책이 된다.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 사람이 밟는 순서 (이것이 전부다)
#
#   ① 디스코드  /혼천 시작        → 성별 · 유년의 기억 5문항 → **태어난다** (집안·발단은 운명이 정한다)
#   ② 디스코드  /혼천 접속 닉네임:<마크 닉>
#   ③ 마크 화면에 물음 → **[잇는다]**  → 접합
#   ④ ★ **책이 손에 온다** — 저절로 펼쳐진다. 서장이 시작된다
#   ⑤ 책 안의 **글자를 누른다** → 판정 → 다음 장면의 책이 온다 (3장면)
#   ⑥ 마지막 책(에필로그)에서 **[강호로 나선다]** → **출도.** 이제 사냥·비무가 열린다
#
# ★ 접합이 **서장 중에도** 되어야 한다 (옛 문은 '강호'만 받았다 — 그러면 서장을 게임에서 할 수
#   없으니 **자물쇠가 제 문을 잠근 꼴**이었다). identity 의 그 빗장은 풀었다.
#   ★ 그러나 **사냥·비무·의뢰는 여전히 출도 뒤**다 (requireDebuted). 서장은 서장이다.
# ═══════════════════════════════════════════════════════════════════════════════

version: 1

# ─── 다리 — 봇이 내려보내는 것과, 마크가 되돌리는 것 ───
# 스냅숏(world_state.json)은 20초다. **사람이 책을 펴고 기다린다** — 20초는 "고장났구나"의 시간이다.
# 그래서 접합(link_requests.json)과 **같은 이유로 같은 방식**을 쓴다: 작은 파일 하나, 빠른 시계,
# 원자적 교체. (world_bridge.yml transport.seojang / events.seojang_choice 가 배선의 정본이다)
transport:
  note: "배선값은 world_bridge.yml 이 정한다 — 여기서 두 번 적지 않는다 (정본은 하나)"

# ─── 책의 겉모습 — 마크가 쥐여 주는 물건 ───
# ★ 코드는 문장을 짓지 않는다. 여기 없는 말은 화면에 뜨지 않는다.
book:
  title: "서장(序章)"
  author: "혼천"
  # 손에 올 때 — 채팅 한 줄 (책은 저절로 펼쳐지지만, 닫고 나면 이 말이 길잡이다)
  given: "§6품 안에 서책 한 권이 들어 있다§7 — 펼치면 그날 밤이 떠오른다."
  reopen: "§7손에 든 서책을 §f우클릭§7 하면 다시 펼쳐진다."
  # 책 안의 머리말 — {scene}/{total} 은 코드가 채운다
  header: "제 {scene} 장"
  epilogue_header: "서장의 끝"
  # 선택지 줄의 모양 — {n} 은 번호, {label} 은 아래 scenes 의 choices.label
  choice_format: "▸ {label}"
  choice_hover: "이 길을 고른다 — 되돌릴 수 없다"
  # 마지막 책의 단 하나의 선택지 — ★ 이것이 출도(出道)다
  debut_label: "▸ 강호로 나선다"
  debut_hover: "서장을 닫고 강호에 선다 — 이제 사냥과 비무가 열린다"
  # 판정이 끝나고 다음 책이 오기 전 (봇이 주사위를 굴리는 동안)
  waiting: "§8… 붓이 다음 장을 적고 있다."
  # 죽은 책 (다음 장이 이미 왔는데 옛 책을 눌렀다)
  stale: "§8그 장은 이미 넘어갔다 — 새 서책이 품에 있다."

  # ★ 간기(刊記) — **이 글은 붓이 아니라 옛 필사본에서 왔다** (llm.yml runtime.fallback_visible_to_player)
  #
  # 【왜 보이는가】 폴백은 **침묵하면 안 된다.** 지금까지는 LLM 이 타임아웃되면 사람은
  #   아무것도 모른 채 **다른 글**을 읽었다 (그리고 왜 문체가 다른지 알 방법이 없었다).
  #   그러나 **겁줄 일도 아니다** — 폴백 문장은 못 쓴 글이 아니라 **등록부가 쓴 진짜 서사**다.
  #   그래서 사과가 아니라 **표시**다. 세계의 말로, 마지막 장 구석에 한 줄.
  fallback_mark: "§8(붓이 더디어 옛 필사본이 왔다)"

# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 연출(演出) — 장 전환의 표정 【SJ-002 · 2026-07-14 신설】
#    청사진: docs/design/seojang_presentation.md §3.1(장면 도착)·§4.2(소리)
#
# 【왜 생겼나 — 실사용 근거 (2026-07-14, 사용자)】
#   "한 장 끝나고 '…붓이 다음 장을 적고 있다'일 때 책이 갑자기 내려가서 무슨 상황인지
#    인지하기 힘들었음. 그리고 오래 걸림."
#   LLM 이 다음 장을 쓰는 **수십 초**가 아무 표정 없이 흘렀다 — 공백이 "고장"으로 읽혔다.
#   이 절이 그 공백에 표정을 준다:
#     기다림 = 액션바가 반복해서 말한다 (**집필 중**이지 고장이 아니다)
#     도착   = 옛 책 회수 → 장 제목 타이틀 → 사건음 → 새 책이 저절로 펼쳐진다
#
# ★ 이 절은 **마크(SeojangBook)만** 읽는다 — 봇은 여기 안 온다 (위의 book·ferry 절은 봇도 읽는
#   못 박힌 계약이다 — 손대지 않았다).
# ★ 초(tick)도 문장도 전부 여기 산다 — 코드에 하드코딩하지 않는다 (등록부가 정본).
# ★ 강등 계약: 타이틀·액션바·채팅은 바닐라 화면이라 팩 없이도 전부 보인다. 소리만 팩을 타며,
#   팩이 안 켜진 눈(SUCCESSFULLY_LOADED 아님)에는 fallback 바닐라 키로 강등한다 — 같은 정보가 간다.
presentation:

  # ─── 기다림 — 붓이 들려 있는 동안 (state=쓰는_중 · LLM 생성 수십 초) ───
  waiting:
    # 액션바 반복 — 채팅과 달리 시선 한가운데 떠 있다. 반복하는 이유: 액션바는 2~3초면 스러진다.
    actionbar: "§7… 붓이 다음 장을 적고 있다 §8(곧 새 서책이 온다)"
    interval_ticks: 30        # 액션바 수명(페이드 포함 ~60틱)보다 짧게 — 깜빡이지 않고 이어진다
    # 잔잔한 반복 소리 (선택) — key 를 비워 두면 침묵. 반복음은 취향을 타는 채널이라 기본은 침묵이다
    sound: { key: "", volume: 0.3, pitch: 1.0 }

  # ─── 도착 — 새 토큰 수신 → 옛 책 회수 → 장 제목 타이틀 → 사건음 → 펼침 (청사진 §3.1 그대로) ───
  # 타이틀의 문장은 **위 book.header / book.epilogue_header + 봇이 준 장면 제목**을 그대로 쓴다
  # (문장의 정본은 하나 — 여기는 옷차림({header}·{title} 틀)과 시계만 둔다)
  arrival:
    title_format: "§f{header}"       # 큰 줄 — 제 N 장 (에필로그면 epilogue_header)
    subtitle_format: "§6{title}"     # 작은 줄 — 장면 제목 (봇이 지은 것)
    title_fade_in_ticks: 5
    title_stay_ticks: 20             # 1.0초 — 청사진 §3.1 의 0.8~1.2초 안
    title_fade_out_ticks: 10
    open_delay_ticks: 25             # 타이틀이 눈에 앉을 시간 — 지나면 책이 저절로 펼쳐진다

  # ─── 사건음 4채널 (청사진 §4.2) ───
  # key      = 팩의 소리. build_resourcepack.py 가 assets/honcheon/sounds.json 에 굽는다 —
  #            전용 .ogg 가 없는 지금은 팩 안에서 바닐라 이벤트로 재지향된다 (그래서 지금도 난다).
  # fallback = 팩이 안 켜진 눈에 내는 바닐라 키 (강등 계약 — 위 머리말 참조).
  # ★ fallback 은 resourcepack_design.yml sound_channels.seojang 의 fallback_event 와 같아야 한다
  #   (두 표가 어긋나면 팩 있는 귀와 없는 귀가 다른 소리를 듣는다).
  # ★ open 은 SeojangBook.deliver 가 낸다. choose·result 의 발성 배선은 SJ-003,
  #   debut 는 SJ-004 의 몫 — 채널·폴백 등록은 여기서 끝났으니 그쪽은 chime() 만 부르면 된다.
  sounds:
    open:   { key: "honcheon:seojang.open",   fallback: "item.book.page_turn",   volume: 1.0, pitch: 1.0 }
    choose: { key: "honcheon:seojang.choose", fallback: "item.book.put",         volume: 1.0, pitch: 1.1 }
    result: { key: "honcheon:seojang.result", fallback: "block.note_block.bell", volume: 1.0, pitch: 1.0 }
    debut:  { key: "honcheon:seojang.debut",  fallback: "block.bell.use",        volume: 1.0, pitch: 0.9 }

# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 나루의 사공 — **배는 한 명씩 탄다** (2026-07-13 실측으로 신설)
#
# 【실측】 qwen3-30b · GB10 (45.3GB 전부 VRAM):
#     서장 한 건 22.4초 · **넷이 동시에 들면 89.5초** (각자 4배 느려진다 — GPU 는 하나다)
#   그래서 붓을 **한 자루**로 조인다 (Scribe.java — 동시 1건). 처리량은 어차피 같고,
#   **첫 사람의 완료 시각만 앞당겨진다.** 병렬은 이득이 아니라 경합이었다.
#
# 【★ 그런데 줄은 UI 가 아니라 이야기다】 사용자: "배는 한명씩 타는걸로."
#   기다리는 사람에게 "로딩 중" 이라고 하지 않는다 — **나루의 사공이 한 사람씩 건네준다.**
#   ★ **침묵 금지**: 앞에 몇 사람인지 **말해 준다** (이 저장소의 고질병이 말없이 늦는 것이었다).
#
# {ahead} = 내 앞에 선 사람 수 (코드가 채운다)
# ═══════════════════════════════════════════════════════════════════════════════
ferry:
  # 앞에 아무도 없다 — 굳이 말하지 않는다 (22초는 그냥 기다릴 만하다). 비워 두면 침묵이 아니라 **즉시**다
  alone: "§8사공이 노를 젓는다 — 그대의 차례다."
  # 앞에 사람이 있다 — ★ 차례를 말한다
  queued: "§7나루의 사공은 한 번에 한 사람만 태운다 — §f앞에 {ahead}인§7. 배를 기다리는 동안 서장이 쓰인다."
  # 줄이 넘쳤다 (llm.yml runtime.queue_max) — 기다리게 하느니 옛 필사본을 준다
  overflow: "§8나루가 붐빈다 — 사공을 기다리지 않고 옛 필사본을 펼친다."

# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 미리 쓰기(豫寫) — **가장 좋은 기다림은 이미 끝난 기다림이다**
#
# 사용자: "미리 쓰기도 한다 (이후 병렬 처리를 위해)."
#
# 【무엇을 버는가】 사람은 생성 문답을 끝내고 → 디스코드에서 접속을 청하고 → 마크에서 [잇는다] 를
#   누르고 → 나루를 걷는다. 그 사이가 **몇 분**이다. 서장 첫 장(22.4초)은 **그 안에 다 쓰인다.**
#   → 책이 손에 올 때 **이미 쓰여 있다.** 22.4초가 **0초로 보인다** — 글을 한 자도 줄이지 않고.
#
# 【★ 왜 이것이 나중의 병렬에도 이득인가】 (사용자가 그 이유로 골랐다)
#   Ollama 의 동시 슬롯을 나중에 늘리면 미리 쓰기는 **그대로 더 빨라진다** — 줄이 짧아지니까.
#   반대로 "글을 짧게 줄이는" 최적화는 그때 가서 **되돌려야 하는 빚**이 된다 (글맛을 깎았으므로).
#   미리 쓰기는 **버릴 것이 없는 최적화**다.
# ═══════════════════════════════════════════════════════════════════════════════
# ★서장의 붓 (2026-07-25 사용자 확정 — 「AI 실시간 생성이 아닌, 모든 루트의 출력값을
#   생성해두고 출력하는 형태로. 이름만 변수 처리」)
#
# 【무엇이 바뀌나】 서장 본문은 붓(LLM)을 들지 않고 **prose 등록부가 그대로 책이 된다** —
#   모든 루트의 문장이 이미 여기 있다: scene_body(갈래 4벌) × incident_opening(발단 13) ×
#   bridge(직전 등급 5) × 색(가문 형태·고을·적서·형제) × epilogue(등급 5 × 갈래 4).
#   몸이 채우는 변수는 {name}(이름)과 등록부 키가 정한 자리뿐이다. 옛 「LLM 폴백」 경로가
#   정본으로 승격된 것이라 문장 파이프는 한 줄도 새로 서지 않았다.
#
# 【왜】 실기동 2026-07-25 그림자_시험 1장 — 로컬 붓이 기준 서사를 대체해(SYSTEM 7항 위반)
#   발단의 전제(가주의 시험)가 통째로 빠진 뜻 모를 장이 나갔다. 서장은 첫인상이다 —
#   사람 눈이 검수한 등록부 문장이 정본이고, 붓의 즉흥은 서장에서 쓰지 않는다.
#
# 【남는 것】 붓 기계(LlmRenderer·Scribe)는 그대로 산다 — /혼천 대화(NPC 페르소나)의 것.
#   true 로 되돌리면 옛 흐름(붓이 기준 서사를 확장) 복귀 — 그날은 뼈대 안전망부터 세워라.
# ═══════════════════════════════════════════════════════════════════════════════
live_brush: false

prerender:
  enabled: true

  # ─── 언제 미리 쓰는가 ───
  triggers:
    - key: 탄생
      when: "생성 문답이 끝나 캐릭터가 태어난 순간 (GameListener.birth)"
      writes: "장면 0 — 접합도 하기 전이다. 사람이 디스코드를 떠나 마크로 걸어오는 그 시간을 쓴다"
    - key: 다음_장
      when: "판정이 끝나 장면이 넘어간 순간 (그 자리에서 곧장 다음 장을 쓴다)"
      writes: "다음 장면 (또는 마지막이면 에필로그)"
      note: "이때는 미리 쓰기가 아니라 **제때 쓰기**다 — 사람이 책을 덮고 다음 장을 기다린다"

  # ─── ★ 무엇이 바뀌면 다시 쓰는가 (무효화) ───
  #
  # 【미리 쓴 글은 낡을 수 있다】 그래서 **지문(指紋)** 을 함께 적는다:
  #     지문 = 캐릭터id + 장면번호 + 직전등급
  # 책을 내려보낼 때 지문이 **지금**과 다르면 그 글은 **버리고 다시 쓴다.**
  #
  # 【왜 이 셋인가 — 서사가 의존하는 전부다】
  #   · 캐릭터id : 캐릭터가 바뀌면(초기화·죽음·새 삶) 옛 글은 **남의 이야기**다
  #   · 장면번호 : 당연하다
  #   · 직전등급 : 이음새({bridge})가 여기서 갈린다 — **같은 장면도 앞 판정에 따라 다른 글**이다
  #   나머지(이름·집안·발단·성향·나이)는 **탄생 후 불변**이다 — 그래서 지문에 넣지 않는다.
  #   ★ 만약 훗날 그것들이 변할 수 있게 되면 (개명·양자·발단 소급) **이 표를 먼저 고쳐라.**
  fingerprint: [캐릭터id, 장면번호, 직전등급]
  invalidate: "지문 불일치 → 적힌 글을 버리고 다시 쓴다 (낡은 글이 책이 되는 것보다 22초가 낫다)"
  sheet_key: 서장_본문_지문

# ═══════════════════════════════════════════════════════════════════════════════
# 장면 — **엔진의 뼈대** (판정 수치는 여기가 정본이다)
#
# resist  = 판정의 저항값 (judgment.yml 의 눈금)
# choices = 선택지. stat 은 judgment.yml attributes 의 7축 중 하나, bonus 는 상황 보정
#
# ★ 성별 보정(±1 히든)은 여기에 적지 않는다 — player_creation.yml gender.gates.attributes 가
#   정본이고, 판정이 읽는 순간에만 얹힌다 (Rules.genderStat).
# ═══════════════════════════════════════════════════════════════════════════════
# ─── 갈래 배정 — 발단 → 벌 (등록제: 여기 없는 발단은 기본 벌로 떨어진다) ───
# ★B-181 (2026-07-25): 출분 3발단이 재난 벌을 빌려 입던 병의 수리 — "재난형은 닥친 것,
#   출분형은 저지른 것. 그 차이가 첫 문장에 있어야 한다"(아래 §발단 주석)가 이제 뼈대까지 선다.
#   「식구들부터 깨운다」는 제 발로 담을 넘은 아이에게 거짓말이었다.
# ─── ★B-194 체험형 서장 (B안 · 사용자 확정 2026-07-31) — 넋등 자리 점등 ───
# 정본: docs/design/seojang_experiential_v1.md. 선택 = 자리 + 그 자리의 간단한 행동.
# 기억이 자리를 비춘다 — 넋등은 삼도천의 기존 시각 언어라 게임 UI 가 아니라 세계의 것이다.
# ★미배선 (정직한 기록): 이 절을 읽는 코드는 아직 없다 — 무대 조성·행동 감지가 다음 조각이다.
#   등록부가 먼저 선다 (world_clock endings 가 살았던 순서 그대로). 배선되면 이 표식을 걷는다.
enactment:
  wiring_status: 미배선
  기본:
    - stage: geunal_bam                  # 1장 「그날 밤」 무대 — 서장 월드의 기억의 마을 (멱등 조성)
      fallback_seconds: 60               # 【제안】 무행동이면 기존 글자 패로 강등 (갇힘 금지 헌법)
      # ★spots 순서 = scenes.기본[0].choices 순서와 1:1 (눈이 이 짝을 재야 한다 — 배선 회차에)
      # ★빨간펜 2호 (2026-07-31 「왜 혼불로 가야 하는지 모르겠어」) — 인과의 재배열:
      #   ①소리가 먼저 온다(암전 속) → ②그래서 깬다(첫머리가 방금 들은 소리를 말한다) →
      #   ③생각이 세 갈래로 갈린다(각 생각이 자리를 가리킨다) → ④혼불은 명령이 아니라
      #   **생각이 닿은 자리의 표시**다. 「가라」는 말은 없다.
      spots:
        - { 자리: 이부자리_뒤, 행동: 웅크리기, 속삭임: "숨을 죽인다… (웅크린 채 잠시)",
            생각: "이불 뒤의 그늘이 눈에 들어온다 — 저기라면 숨을 죽일 수 있다." }
        - { 자리: 담장_틈, 행동: 응시, 속삭임: "소리 나는 쪽을… (틈에 붙어 바깥을 본다)",
            생각: "담장 틈으로 희미한 빛이 샌다 — 다가서면 밖이 보일 것이다." }
        - { 자리: 식구_머리맡, 행동: 상호작용, 속삭임: "식구들을… (손을 뻗는다 — 우클릭)",
            생각: "식구는 아직 잠들어 있다 — 아무것도 모른 채." }
      입장_자막: "…기억이 열린다"          # 암전 동안 — 어둠은 고장이 아니라 연출이다 (빨간펜 3호)
      마지막_물음: "…숨이 목까지 차올랐다. 지금, 무엇을 하는가."
      배회_속삭임: "…그날의 기억이, 세 자리를 비추고 있다."
      # ★넋등 = 실물이 아니다 (사용자 확인 2026-07-31) — 블록도 아이템도 아닌 **파티클 빛점**이다
      #   (다른 게임이 숨겨진 아이템을 반짝임으로 표시하는 그 방식 — 혼불 계열 파티클이 자리에 맴돈다).
      #   「넋등」은 그 빛점의 세계 안 이름일 뿐 — 게임 마커가 아니라 기억이 비추는 불로 읽히게.
      # 다가가면 그 빛점이 짙어지고 속삭임(액션바)이 뜬다. 행동이 완성되면 나머지 두 불이 꺼진다.
      # 식구 NPC 는 발광 윤곽(glow). 소리가 방향 유도를 겸한다.
      # ─ 같은 무대, 다른 그날 밤 (§3 【제안】 — 발단별 소리·빛·소품) ─
      연출_by_incident:
        가문의_몰락: { 소리: 언성_웅얼거림, 빛: 사랑채_창_흔들림 }
        습격: { 소리: [개_짖음_끊김, 말발굽], 빛: 담_너머_화광 }
        역병: { 소리: 곡소리_원거리, 소품: 옆집_흰_천 }
        목격: { 빛: 달빛, 소품: 골목_실루엣_고개돌림 }
        맡겨짐: { 소품: [낯선_어른_그림자, 아버지의_등] }
        핏줄의_비밀: { 소품: 벽장_반열림, 소리: 발소리_멎음 }
        아이_거두기: { 소품: 대문_밖_등불_둘 }
  # 2·3장(길 위·낯선 고을)과 수행_파견·출분·세가 벌은 파일럿 평가 후 (시안 §6-5)

branch_of:
  수행_파견: 수행_파견
  담을_넘다: 출분
  아버지의_검: 출분
  파혼: 출분
  # ★세가 (2026-07-25) — 오대세가 자제의 명령 3발단은 세가의 벌을 산다
  비무행: 세가
  그림자_시험: 세가
  견문: 세가
  밀서: 세가

scenes:

  # ─── 기본 서장 — 재난이 닥친 아이 (발단: 가문의_몰락·습격·역병·목격·맡겨짐·핏줄의_비밀·아이_거두기) ───
  기본:
    - title: "그날 밤"
      resist: 10
      choices:
        - { label: "숨을 죽이고 숨는다", stat: 민첩, bonus: 2 }
        - { label: "소리 나는 쪽을 살핀다", stat: 감각, bonus: 2 }
        - { label: "식구들부터 깨운다", stat: 체력, bonus: 2 }
    - title: "길 위에서"
      resist: 12
      choices:
        - { label: "밤새 걸음을 서두른다", stat: 체력, bonus: 2 }
        - { label: "흔적을 지우며 간다", stat: 감각, bonus: 2 }
        - { label: "행인 무리에 섞여든다", stat: 화술, bonus: 2 }
    - title: "낯선 고을 {region}"
      resist: 10
      choices:
        - { label: "객잔 일손을 구걸한다", stat: 화술, bonus: 2 }
        - { label: "장터에서 잔심부름을 찾는다", stat: 민첩, bonus: 2 }
        - { label: "의방 앞에서 허드렛일을 청한다", stat: 지혜, bonus: 2 }

  # ─── 수행 파견 — 무가의 자식 전용 (재난이 아니라 **명령**이 발단이다) ───
  # 판돈이 다르다: 목숨이 아니라 **이름과 체면**, 그리고 가문의 기대.
  수행_파견:
    - title: "출문(出門)"
      resist: 9
      choices:
        - { label: "예를 다해 하직한다", stat: 화술, bonus: 2 }
        - { label: "무기고에서 손에 맞는 검을 고른다", stat: 감각, bonus: 2 }
        - { label: "밤새 가전 검형을 다잡는다", stat: 근력, bonus: 2 }
    - title: "이름 없는 길"
      resist: 11
      choices:
        - { label: "상단 행렬에 동행을 청한다", stat: 화술, bonus: 2 }
        - { label: "산길 지름길로 접어든다", stat: 감각, bonus: 2 }
        - { label: "대로를 당당히 걷는다", stat: 체력, bonus: 2 }
    - title: "{region} — 전표와 이름"
      resist: 10
      choices:
        - { label: "전장에서 전표부터 수령한다", stat: 지혜, bonus: 2 }
        - { label: "객잔에 들어 소문부터 듣는다", stat: 화술, bonus: 2 }
        - { label: "저잣거리와 뒷골목을 눈에 익힌다", stat: 민첩, bonus: 2 }

  # ─── ★세가 — 오대세가의 자제 (발단: 비무행·그림자_시험·밀서 · 2026-07-25)
  #     판돈이 또 다르다: 목숨도 체면도 아니라 **이름을 접는 법** — 천하가 아는 성을 숨기고 서는 시간.
  #     문장 전부 【제안】 — 빨간펜 대상 ───
  #
  # ★1장 패는 발단이 가른다 (사용자 확정 2026-07-25 「1+3으로 진행」 — 빨간펜 3건의 수리):
  #   공용 패가 발단의 전제와 충돌했다 — 그림자_시험(빈 몸·전표 없음)에게 「노잣길 물목」,
  #   검 시험이 아닌 아이에게 「가전 검형」. 그리고 사용자 확정 「아직 배운 것도 없는, 배우기
  #   전의 이야기」 — 패는 **배우기 전의 몸이 할 수 있는 것**(태도·눈·손버릇)만 말한다.
  #   choices = 비무행(기본 폴백) · choices_by_incident = 발단 전용 (없는 발단은 choices 로).
  세가:
    - title: "세가의 새벽"
      resist: 10
      choices:
        # 비무행 — "겪고 오라"는 명을 받은 아침 (배우기 전: 검형이 아니라 목검을 쥐어 보는 손)
        - { label: "사당에 절을 올리고 예를 다해 하직한다", stat: 화술, bonus: 2 }
        - { label: "마당의 목검을 마지막으로 한 번 쥐어 본다", stat: 근력, bonus: 2 }
        - { label: "비무첩의 이름들을 하나하나 눈에 담는다", stat: 지혜, bonus: 2 }
      choices_by_incident:
        그림자_시험:   # 빈 몸·전표 없음·지켜보는 눈 — 생존 시험의 아침
          - { label: "사당에 절을 올리고 예를 다해 하직한다", stat: 화술, bonus: 2 }
          - { label: "지켜본다는 눈이 어디 붙었는지 어둠을 한 번 훑는다", stat: 감각, bonus: 2 }
          - { label: "빈손으로 석 달을 어찌 버틸지 손가락을 꼽아 본다", stat: 지혜, bonus: 2 }
        밀서:          # 전하고, 기다리지 말고, 열어 보지 말라 — 심부름의 아침
          - { label: "사당에 절을 올리고 예를 다해 하직한다", stat: 화술, bonus: 2 }
          - { label: "남의 눈이 닿지 않는 새벽 뒷문 길을 미리 밟아 둔다", stat: 민첩, bonus: 2 }
          - { label: "봉인의 매듭과 수신인의 이름을 눈에 새겨 둔다", stat: 지혜, bonus: 2 }
        견문:          # 아무 일도 맡지 않은 아침 — 평범한 관례 출행 (사용자 확정 2026-07-25)
          - { label: "사당에 절을 올리고 예를 다해 하직한다", stat: 화술, bonus: 2 }
          - { label: "행장을 제 손으로 꾸려 본다 — 처음으로, 하인의 손을 빌리지 않고", stat: 지혜, bonus: 2 }
          - { label: "담 너머로 이어진 길을 눈으로 먼저 걸어 본다", stat: 감각, bonus: 2 }
    - title: "이름이 앞서 걷던 길"
      resist: 11
      choices:
        - { label: "행렬을 물려 조용한 샛길로 접어든다", stat: 감각, bonus: 2 }
        - { label: "신분을 묻는 관문지기에게 말을 고른다", stat: 화술, bonus: 2 }
        - { label: "밤을 새워 남들보다 먼저 고개를 넘는다", stat: 체력, bonus: 2 }
    - title: "{region} — 아무도 모르는 얼굴"
      resist: 10
      choices:
        - { label: "이름 없이 객잔에 들어 방을 청한다", stat: 화술, bonus: 2 }
        - { label: "저잣거리에서 세가의 소문부터 듣는다", stat: 감각, bonus: 2 }
        - { label: "맡은 일의 첫 매듭을 살핀다", stat: 지혜, bonus: 2 }

  # ─── ★출분(出奔) — 집을 나온 아이 (발단: 담을_넘다·아버지의_검·파혼 · B-181)
  #     판돈이 다르다: 닥친 게 아니라 **저질렀다** — 쫓기는 몸이 아니라 택한 몸이다.
  #     문장 전부 【제안】 — 빨간펜 대상 ───
  출분:
    - title: "담을 넘은 밤"
      resist: 10
      choices:
        - { label: "발소리를 죽여 뒷골목으로 빠진다", stat: 민첩, bonus: 2 }
        - { label: "문루의 등불이 도는 틈을 센다", stat: 감각, bonus: 2 }
        - { label: "미리 봐 둔 개구멍으로 곧장 간다", stat: 지혜, bonus: 2 }
    - title: "돌아보지 않는 길"
      resist: 11
      choices:
        - { label: "밤새 걸어 거리를 벌린다", stat: 체력, bonus: 2 }
        - { label: "샛길로 접어들어 흔적을 끊는다", stat: 감각, bonus: 2 }
        - { label: "새벽 달구지에 일손을 청해 얹혀 간다", stat: 화술, bonus: 2 }
    - title: "{region} — 새 이름"
      resist: 10
      choices:
        - { label: "아무도 모르는 이름을 처음으로 대 본다", stat: 화술, bonus: 2 }
        - { label: "품삯 일을 찾아 소매를 걷는다", stat: 체력, bonus: 2 }
        - { label: "저잣거리 물정부터 눈에 익힌다", stat: 감각, bonus: 2 }

# ═══════════════════════════════════════════════════════════════════════════════
# 글 — **기준 서사(基準敍事)**
#
# ★ 이것이 LLM 에게 주는 **뼈대**다. LLM 은 이 문장을 **대체하지 않고 확장만** 한다
#   (llm.yml generation_principles · LlmRenderer SYSTEM 7항: "기준 서사가 주어지면 대체하지 말고
#   그 문장을 뼈대로 확장만 하라"). LLM 이 없거나 실패하면 **이 문장이 그대로 책이 된다** —
#   그래서 이것만으로도 서장은 끝까지 간다 (llm.yml failure_handling: "LLM 없이도 게임은 돈다").
#
# ★ 전에는 이 글이 **Narration.java 안에 박혀 있었다.** 코드가 이야기를 지고 있었다.
#   여기로 옮긴다 — **코드는 이야기를 짓지 않는다.**
# ═══════════════════════════════════════════════════════════════════════════════
prose:

  # ─── 발단별 첫 장면 도입 — player_creation.yml inciting_incidents 의 cause 를 산문화 ───
  # 키 = player_creation.yml age_and_lifepath.inciting_incidents 의 키 (등록제 — 여기 없는 발단은 default 로 떨어진다)
  incident_opening:
    가문의_몰락: "장부가 문제였다고 했다. 어른들의 언성이 담을 넘던 그 밤, 아버지는 너를 흔들어 깨웠다."
    습격: "개 짖는 소리가 뚝 끊겼다. 그다음에 들린 것은 말발굽과, 마을 어귀에서 번지는 불빛이었다."
    역병: "이레 전부터 마을에 곡소리가 끊이지 않았다. 오늘은 옆집 차례였고, 어머니는 짐을 쌌다."
    목격: "봐서는 안 될 것을 봤다. 달빛 아래 그 사람이 고개를 돌렸을 때, 너는 이미 뛰고 있었다."
    맡겨짐: "아버지는 네 손을 낯선 어른의 손에 쥐여 주고 눈을 마주치지 않았다. 그날 밤 너는 그 집을 나왔다."
    핏줄의_비밀: "벽장 깊은 곳의 그것이 누구의 것이었는지 안 날 밤, 문밖에서 낯선 발소리가 멎었다."
    아이_거두기: "\"재목이다.\" 그 한마디를 남기고 간 자들이 다시 온다는 소문이 돌던 밤이었다."

    # ─── ★세가 (2026-07-25 신설. 세가의_자제 전용 — 전부 「명령」의 결 · 문장 【제안】) ───
    비무행: "가주는 비무첩 묶음을 내밀며 말했다. \"이기고 오라는 명이 아니다 — 겪고 오라는 명이다.\" 그 차이를 아는 데 강호 백 합이 걸릴 것이다."
    그림자_시험: "\"신분도 전표도 없이 석 달이다.\" 가주의 눈은 웃지 않았다. 문을 나서는 등 뒤로, 누군가의 시선이 붙었다 — 어디에 있는지는 끝내 보이지 않았다."
    밀서: "\"전하고, 답을 기다리지 말고, 열어 보지 말라.\" 품속의 밀서는 가볍고, 봉인은 무거웠다."
    견문: "\"사고 치지 말고, 보고 오너라.\" 가주의 배웅은 그것뿐이었다 — 명도 시험도 아닌, 세가의 오랜 관례. 다만 문을 나서며, 이름은 두고 간다."

    # ★★ 출분(出奔) — **집을 나온 아이** (2026-07-14 신설. 가출한_무가의_자식 전용)
    #   ★ 재난형과 결이 다르다: 재난형은 "그날 밤 모든 것이 달라졌다" (휩쓸린다).
    #     출분형은 **"그날 밤 내가 담을 넘었다"** (저지른다). 그 차이가 첫 문장에 있어야 한다.
    담을_넘다: "말해도 소용없다는 것을 안 날, 너는 말을 그쳤다. 그리고 새벽에 담을 넘었다 — 아무도 깨우지 않고."
    아버지의_검: "가전(家傳)의 검을 품에 넣던 손이 떨렸다. 그것 하나만은 내 것이라 여겼다 — 그렇게 여기기로 했다."
    파혼: "혼례는 내일이었다. 얼굴도 모르는 상대였고, 아무도 너에게 묻지 않았다. 그래서 너도 묻지 않고 나왔다."

    default: "그날 밤, 모든 것이 달라졌다."

  # ─── ★발단의 실 (A안 · 사용자 확정 2026-07-25 「다 다른 느낌을 확인하는 스토리」) ───
  # 2장(길 위)·3장(낯선 고을)에 그 발단의 그림자가 따라온다 — 뼈대는 갈래가, 결은 발단이 갖는다.
  # 재료는 발단 등록부(player_creation inciting_incidents)의 trace·long_hook 를 산문화한 것.
  # 키 = 발단 · 값 = [2장 문장, 3장 문장]. **모든 발단이 실을 가져야 한다** (눈이 전수를 센다).
  # 문장 전부 【제안】 — 빨간펜 대상
  incident_thread:
    가문의_몰락:
      - "장부, 라는 말이 아직도 귓가에 붙어 있다. 아버지가 마지막으로 쥐여 준 손의 온기는 식었는데, 그 말만 식지 않는다."
      - "여기 사람들은 그 가문의 이름을 모른다 — 망한 집의 이름은 소문보다 느리게 걷는다. 다행이라 해야 하나."
    습격:
      - "말발굽 소리가 등 뒤에서 난 것 같아 두 번 돌아봤다. 두 번 다 바람이었다. 아직도 그 밤의 불빛이 눈꺼풀 안쪽에 붙어 있다."
      - "낯선 저잣거리의 소란이 오히려 편하다 — 조용한 밤이 오면, 개 짖는 소리가 뚝 끊기던 그 순간부터 다시 시작되니까."
    역병:
      - "길가 주막에서 누가 기침을 하자 저도 모르게 세 걸음 물러섰다. 곡소리는 이제 안 들리는데, 귀가 먼저 피한다."
      - "이 고을 우물가엔 아이들이 물장난을 친다. 산 사람의 소리다 — 그 소리가 낯설어서, 한참을 서서 들었다."
    목격:
      - "달빛이 밝은 밤이면 걸음이 빨라진다. 그 사람이 고개를 돌리던 순간이 — 얼굴이 아니라 그 느린 움직임이 — 자꾸 떠오른다."
      - "낯선 얼굴들 속이 차라리 안전하다. 다만 누가 오래 쳐다보면, 봐서는 안 될 것을 본 눈이 먼저 바닥을 찾는다."
    맡겨짐:
      - "아버지는 왜 눈을 마주치지 않았을까. 걷는 내내 그 생각 하나가 발보다 먼저 간다."
      - "이 고을 어느 집 아버지가 아이의 손을 잡고 걷는다. 오래 보지 않기로 했다 — 길이 바쁘다."
    핏줄의_비밀:
      - "벽장 속 그것의 무게가 아직 손바닥에 남아 있다. 나는 누구의 아이인가 — 길은 대답하지 않고 길어지기만 한다."
      - "여기서는 아무도 내 핏줄을 묻지 않는다. 그것이 편하고, 편하다는 것이 조금 무섭다."
    아이_거두기:
      - "\"재목이다.\" 그 한마디가 값인지 덫인지 아직 모른다. 그들이 온다던 소문만 등 뒤에 남았다."
      - "낯선 고을의 인파 속에서도 버릇처럼 살핀다 — 그날의 그들 같은 걸음걸이가 있는지. 없다. 오늘은 없다."
    수행_파견:
      - "무기고 문이 열려 있던 것이 자꾸 마음에 걸린다 — 허락이었을까, 시험이었을까. 물을 사람은 이제 없다."
      - "문책인지 시험인지 끝내 묻지 못한 것이, 길 위에서는 오히려 답 같다 — 돌아가면 알게 되겠지. 잘 다녀오면."
    비무행:
      - "비무첩의 이름들을 속으로 외워 본다. 하나같이 모르는 이름이다 — 가주는 어째서 이들을 골랐을까. 겪으라는 명의 뜻은 아직 멀다."
      - "이 고을에도 비무첩의 이름이 하나 있다. 서두르지 않기로 했다 — 백 합은 길고, 오늘은 그 첫 합도 아니다."
    그림자_시험:
      - "지켜보는 눈이 있다 했다. 고갯길에서 두 번, 나루에서 한 번 — 시선 같은 것이 스쳤지만 돌아보면 아무도 없었다."
      - "빈손의 하루는 길다. 그리고 어딘가에서 그 하루를 세는 눈이 있다 — 가문의 사람일까, 정말로."
    밀서:
      - "품속의 밀서가 걸을 때마다 가슴을 두드린다. 가볍다. 가벼운 것이 이렇게 무거울 수 있는가."
      - "수신인의 이름을 입 속으로 굴려 본다. 묻지 말라 했으니 묻지 않는다 — 다만 봉인 너머의 글자들이 꿈에 나온다."
    견문:
      - "명도 시험도 없는 길이다. 그래서인지 자꾸 뒤가 허전하다 — 담장 안에서는 몰랐다, 아무 일도 없다는 것이 이렇게 넓은 것인 줄."
      - "서두를 것이 없는 아침이 낯설다. 오늘 하루를 무엇으로 채울지, 처음으로 남이 아니라 내가 정한다."
    담을_넘다:
      - "쫓아오는 사람은 없다. 알면서도 새벽마다 길 뒤쪽을 본다 — 기다리는 건지 겁내는 건지, 아직 구별이 안 된다."
      - "고른 일이 그리울 수도 있다는 건 몰랐다 — 그리움은 후회가 아니다. 그렇게 정했다."
    아버지의_검:
      - "봇짐 속 검이 걸을 때마다 등을 친다. 훔친 것은 검 한 자루인데, 짊어진 것은 그보다 무겁다."
      - "검을 팔면 몇 달은 살 텐데, 팔 수 없다. 팔면 그것이 자백이다 — 그래서 오늘도 검 대신 품을 판다."
    파혼:
      - "혼례는 지났을까. 지금쯤 그 집도, 우리 집도, 나 하나 없는 자리를 접었을까 — 접었기를 바란다. 반쯤은."
      - "여기서는 아무도 내 혼처를 묻지 않는다. 내 일을 내게 묻는 사람들 속에서, 처음으로 숨이 편하다."

  # ─── 집안별 정착 장면 색 — 청하현에서 아이가 기댈 첫 감각 ───
  # 키 = player_creation.yml age_and_lifepath.families 의 키
  family_color:
    상가의_자식: "장터의 셈 소리는 고향의 그것과 닮아 있었다."
    농가의_자식: "흙냄새만은 여기도 같았다."
    객잔집_자식: "국밥 김 오르는 냄새에 코끝이 시큰했다."
    의원집_자식: "약재 달이는 냄새가 골목에 배어 있었다."
    표국집_자식: "짐수레와 호위꾼들 — 눈에 익은 풍경이었다."
    무가의_자식: "허리에 와야 할 검의 무게가 없는 것이 오히려 어색했다."
    몰락_무가의_자식: "품 안의 가보가 심장처럼 무거웠다."
    # ★ 집을 나온 아이 — 돌아갈 문이 **있다**. 그것이 위로가 아니라 **유혹**이다
    가출한_무가의_자식: "돌아가면 따뜻한 밥이 있다는 것을 안다 — 그 사실이 등을 더 무겁게 눌렀다."
    default: "모든 것이 낯설었다."

  # ─── ★★ 적서(嫡庶)의 색 — **같은 집인데 담장 안에서부터 무게가 다르다** (2026-07-14 신설) ───
  #
  # 사용자 확정: 적자는 태어난 것 자체가 강호의 소식이고(강도 5 = 천하), 서자는 그렇지 않다(3).
  # ★ 그 차이는 **소문에서만** 나는 것이 아니다 — **유년에서부터** 난다.
  #   적자는 기대를 지고 자라고, 서자는 **같은 성(姓)을 쓰면서 다른 대접**을 받으며 자란다.
  # 키 = birth_rank.options 의 키. 적서가 없는 집이면 빈 문자열이 든다 (코드가 지어내지 않는다).
  rank_color:
    적자: "너는 이 집의 이름을 이을 아이였다 — 모두가 그렇게 말했고, 그것은 칭찬이자 사슬이었다."
    서자: "같은 성(姓)을 쓰는데 밥상의 자리가 달랐다. 아무도 그것을 말하지 않았고, 모두가 알고 있었다."
    default: ""

  # ─── ★★ 가문의 형태 — **흥한 집과 기우는 집의 유년은 같지 않다** (2026-07-14 신설) ───
  #
  # 사용자 확정: 가문의 형태는 **탄생에 정해지고 바뀌지 않는다.**
  #   → 그러므로 **서장이 그것을 말해도 거짓말이 될 일이 없다** (변하지 않으므로).
  # ★ 무가 계열에만 든다 (농가의 '흥망'은 이 세계의 어휘가 아니다). 없으면 빈 문자열.
  house_state_color:
    흥: "집은 잘나갔다. 마당엔 사람이 끊이지 않았고, 그 모든 눈이 너를 보고 있었다."
    쇠: "집은 기울고 있었다. 아무도 그 말을 입 밖에 내지 않았지만, 밥상의 반찬이 먼저 알았다."
    멸: "집은 이미 없었다. 남은 것은 이름과, 벽에 걸린 채 아무도 닦지 않는 검 한 자루뿐이었다."
    default: ""

  # ─── ★ 고을의 색 — **사천의 아이와 강남의 아이는 같은 유년을 살지 않았다** ───
  # 키 = player_creation.yml mvt_start.by_region 의 키 (등록제 — 고을이 늘면 여기도 는다)
  # ★ 지금 설 수 있는 고을은 청하현 하나뿐이다. 강남_상로가 서면 여기에 한 줄 더한다.
  region_color:
    cheongha_hyeon: "청하현 — 성문도 없는 작은 고을. 네가 아는 세상의 전부였다."
    default: ""

  # ─── ★★ 형제의 색 — **탄생 순간의 형제만** 든다 (시간의 비대칭) ───
  #
  # 사용자: *"형이 먼저 태어남 (**동생이 있는지는 모름**), 동생이 태어남 (**형이 있는 줄 앎**)"*
  #
  # 【★ 형의 서장에는 형제가 없다 — 그리고 그것은 거짓말이 아니다】
  #   그가 태어났을 때는 **정말로 혼자였다.** 나중에 아우가 나도 **그 글은 고치지 않는다** —
  #   대신 그에게 **소식이 간다** ("네 아우가 났다"). 형은 **어느 날 형이 되는 것**을 겪는다.
  #   → 배선: 코드가 탄생의 형제를 시트에 박제하고(`서장_형제`), 서장은 **그 스냅숏만** 읽는다.
  #     그래서 2장·3장이 나중에 그려져도 **없던 동생이 튀어나오지 않는다.**
  #
  # {kin} = 코드가 채운다 (「형 이대형」 처럼). 형제가 없으면 **빈 문자열** → 아래 줄이 통째로 사라진다.
  kin_color:
    있음: "집에는 너보다 먼저 난 이가 있었다 — {kin}. 그 그늘은 넓었고, 때로 답답했다."
    없음: ""       # ★ 형제가 없던 아이 — **아무 말도 하지 않는다** (없는 것을 말하면 그것이 거짓이다)

  # ─── 이음새 — 직전 판정의 등급이 다음 장면의 첫 숨을 정한다 ───
  # 키 = judgment.yml result_tiers 의 5분류 (대성공/성공/중간/실패/대실패)
  #   중간 = "아슬아슬한 성공"·"부분 성공"  ·  대실패 = 그 밖의 전부
  # ★ 수치는 한 자도 새지 않는다 (7계: 수치 은닉) — 마진 +2 는 '가까스로'로만 말한다
  bridge:
    대성공: "일이 뜻보다 잘 풀렸다 — 발걸음에 힘이 붙는다. "
    성공: "고비는 넘겼다. "
    중간: "가까스로였다. 심장은 아직 뛰고 있다. "
    실패: "일이 틀어졌다. 그래도 발은 멈추지 않았다. "
    대실패: "크게 데였다. 그 대가는 몸이 기억할 것이다 — 그래도 두 발은 아직 앞을 향해 있다. "

  # ─── 장면 본문 ───
  # {opening}      = 위 incident_opening (발단으로 고른다)
  # {family_color} = 위 family_color (집안으로 고른다)
  # {bridge}       = 위 bridge (직전 등급으로 고른다 — 첫 장면에는 빈 문자열)
  # {name}         = 캐릭터 이름
  # ★ 갈래(기본/수행_파견)마다 장면 수만큼. scenes 의 개수와 **같아야 한다** (눈이 센다)
  # ★A안 — 발단의 실 (사용자 확정 2026-07-25 「다 다른 느낌」): 2·3장 뼈대에 {incident_thread}
  #   자리 하나 — 그 발단의 그림자(흔적·따라붙는 질문)가 길 위와 낯선 고을까지 따라온다.
  #   재료는 prose.incident_thread (14발단 × 2문장) — 없는 발단은 빈 문자열로 강등 (눈이 전수를 센다)
  scene_body:
    기본:
      - "{house_state_color}\n\n{kin_color}\n\n{opening}\n\n숨이 목까지 차올랐다. 지금, 무엇을 하는가."
      - "{bridge}동트기 전의 관도는 텅 비어 있었다. 뒤는 돌아볼 수 없다 — 돌아볼 곳이 남아 있지 않으니까. 발바닥이 부르트도록 걸어도, 쫓아오는 것이 사람인지 기억인지 알 수 없었다.\n\n{incident_thread}\n\n길은 세 갈래로 이어진다."
      - "{bridge}{region_color} {family_color}\n\n{incident_thread}\n\n하지만 주머니는 가볍고 해는 저문다. 오늘 밤 잠잘 곳과 한 끼가 먼저다."
    수행_파견:
      - "{house_state_color}\n\n{rank_color}\n\n{kin_color}\n\n\"강호를 눈으로 보고 오너라. 이름은 밝히지 말고, 검은 뽑지 말고.\"\n사랑채의 아버지는 그 말뿐이었다. 문책인지 시험인지 물을 틈도 없었다. 떠나는 날 새벽, 무기고 문이 열려 있었다 — 가주의 무언의 허락이다. 수행원은 없다. 처음으로, 혼자다."
      - "{bridge}관도에 오르자 세상이 달라졌다. 집안의 담장 안에서 이름이 하던 일 — 길을 비키게 하고, 값을 깎아 주고, 시비를 걸러 주던 그 모든 일을 이제 아무것도 해 주지 않는다. 허리의 검이 문득 무거웠다. 이것이 아버지가 보라던 강호인가.\n\n{incident_thread}\n\n길은 세 갈래로 이어진다."
      - "{bridge}{region_color} 가문의 연고가 닿는 전장에 월례 전표가 와 있을 것이다. 굶을 걱정은 없다. 다만 여기서 나는 아무개다 — 이름을 대면 편해지고, 대는 순간 수행은 끝난다.\n\n{incident_thread}\n\n어디서부터 시작할 것인가."
    # ★세가: 이름을 접는 아이의 기준 서사 (2026-07-25 · 문장 전부 【제안】 — 빨간펜 대상)
    # ★1장 개정 (사용자 확정 2026-07-25 「1+3」의 3): 「사당에 절을 올렸다」가 패 0번(사당 하직)을
    #   선점했다 — 뼈대는 절 **직전**에서 멈추고, 마지막 물음으로 패에 넘긴다. 그리고 「아직
    #   배운 것도 없는, 배우기 전의 이야기」를 문장이 직접 말한다 (왜 떠나는가 = {opening}의 명 ·
    #   무엇을 하는가 = 마지막 물음 — 그 답이 곧 선택이다).
    세가:
      - "{house_state_color}\n\n{rank_color}\n\n{kin_color}\n\n{opening}\n\n아직 아무것도 배우지 못한 몸이다 — 가진 것은 이 집에서 나고 자란 시간뿐. 대문이 열리기 전, 사당 앞에 섰다. 다섯 세가의 이름은 어디서나 크다 — 그래서 오늘부터는, 숨겨야 한다.\n\n문이 열리기 전, 마지막으로 무엇을 하는가."
      - "{bridge}관도 위에서 깨달았다. 지금까지는 이름이 앞서 걸었다 — 길을 비키게 하고, 값을 정하고, 시비를 접게 한 것은 내가 아니라 성(姓)이었다. 이름을 접은 오늘, 처음으로 세상이 맨얼굴을 보인다.\n\n{incident_thread}\n\n길은 세 갈래로 이어진다."
      - "{bridge}{region_color} 여기서 그 성을 아는 이는 없다 — 그리 하기로 한 길이니.\n\n{incident_thread}\n\n오늘의 첫걸음을 어디로 놓을 것인가."
    # ★B-181 — 출분: 저지른 아이의 기준 서사 (문장 전부 【제안】 — 빨간펜 대상)
    출분:
      - "{house_state_color}\n\n{kin_color}\n\n{opening}\n\n심장은 뛰는데 손은 떨리지 않았다. 지금, 어떻게 나가는가."
      - "{bridge}동트기 전의 관도 — 등 뒤의 집은 아직 잠들어 있다. 쫓아오는 것은 없었다. 그런데도 걸음은 빨라졌다. 택한 길이라는 것과 편한 길이라는 것은 다른 말이었다.\n\n{incident_thread}\n\n길은 세 갈래로 이어진다."
      - "{bridge}{region_color} 여기서는 아무도 그 집의 이름을 모른다 — 그것이 바라던 것이다.\n\n{incident_thread}\n\n이제 제 손으로 첫 끼를 벌 차례다."

  # ─── 에필로그 — 마지막 판정의 등급이 첫 정착의 온도를 정한다 ───
  # landing (등급별) + closing (갈래별 맺음말). {name} 은 코드가 채운다
  epilogue:
    기본:
      landing:
        대성공: "일손이 마음에 들었는지, 주인이 저녁상에 고기 한 점을 얹어 주었다. 잠자리와 내일 일까지 — 첫날치고는 과분한 시작이다."
        성공: "다행히 첫날 밤부터 지붕 아래서 잘 수 있었다. 주인은 무뚝뚝했지만 밥그릇은 넉넉했다."
        중간: "처마 밑이나마 자리를 얻었다. 내일도 써 주겠다는 말은 없었지만, 내쫓지도 않았다."
        실패: "문전박대였다. 결국 다리 밑에서 첫 밤을 났다 — 하지만 살아 있다. 그거면 됐다."
        대실패: "쫓겨나며 등 뒤로 물벼락까지 맞았다. 다리 밑, 젖은 옷으로 웅크린 첫 밤 — 그래도 숨은 붙어 있다. 여기서부터 시작이다."
      # {incident} 는 발단 키의 밑줄을 빈칸으로 바꾼 것 (코드가 채운다)
      closing: "\n\n{name}의 강호는 이렇게 시작되었다. 유년의 기억 다섯 조각과 {incident}의 흔적을 품은 채 — {region}의 아침이 밝는다."
    수행_파견:
      landing:
        대성공: "첫날이 놀랄 만큼 매끄러웠다. 전표는 수중에, 얼굴은 익혔고, 이름은 아무도 모른다 — 담장 밖에서도 통하는 것이 있다는 확신이 생겼다."
        성공: "첫날의 일들이 매끄럽게 풀렸다. 전표는 수중에, 이름은 아직 아무도 모른다 — 좋은 시작이다."
        중간: "일은 됐지만 매끄럽지는 않았다. 객잔 주인이 힐끗거린다 — 말씨인지 예법인지, 어딘가 태가 났나 보다."
        실패: "첫날부터 꼬였다. 저잣거리에서 시비가 붙을 뻔했고, 하마터면 이름이 나올 뻔했다. 검자루를 쥐었다 놓은 손바닥에 땀이 배어 있었다."
        대실패: "최악의 첫날이었다. 시비 끝에 멱살까지 잡혔고, 뉘 집 자식이냐는 물음에 입을 다무느라 얻어맞기까지 했다. 담장 안에서는 몰랐던 세상의 맨살이었다."
      closing: "\n\n{name}의 수행은 이렇게 시작되었다. 돌아갈 집이 있는 자의 강호 — 그것이 짐인지 힘인지는, 이제부터 알게 된다."
    # ★세가: 이름을 접은 첫 밤 (2026-07-25 · 문장 전부 【제안】)
    세가:
      landing:
        대성공: "첫날의 일들이 이름 없이도 매끄러웠다 — 성(姓)이 아니라 저 자신이 해낸 첫 하루였다."
        성공: "지붕 아래 첫 밤 — 아무도 그 성을 모르는 채로, 일은 됐다."
        중간: "일은 됐지만 손끝마다 태가 났다. 객잔 주인이 힐끗거린다 — 귀한 집 자식임을 숨기기가 이리 어렵다."
        실패: "이름을 못 대니 모든 것이 더뎠다. 담장 안에서라면 한마디로 끝났을 일들 — 그것이 배움이라면 배움이다."
        대실패: "이름 없이는 방 한 칸도 어려웠다. 다리 밑 첫 밤 — 성을 대고 싶은 충동을 삼킨 것이, 오늘 한 일 중 제일 컸다."
      closing: "\n\n{name}의 강호는 이름을 접는 것으로 시작되었다. 천하가 아는 핏줄이 이름 없이 서는 법을 배우는 시간 — 그것이 이 명의 진짜 과제인지도 모른다."
    # ★B-181 — 출분: 제 발로 시작한 아이의 첫 밤 (문장 전부 【제안】)
    출분:
      landing:
        대성공: "첫날부터 제 몫을 해냈다. 품삯과 잠자리, 그리고 아무도 캐묻지 않는 저녁 — 담장 안에서는 몰랐던 종류의 홀가분함이었다."
        성공: "지붕 아래 첫 밤을 얻었다. 낯선 천장을 보며 생각했다 — 처음으로 제 숨으로 자는 잠이다."
        중간: "처마 밑이나마 자리를 얻었다. 후회는 없다 — 다만 담 안의 저녁상이 잠깐 떠올랐을 뿐이다."
        실패: "문전박대 끝에 다리 밑에서 첫 밤을 났다. 돌아가면 따뜻할 것이다 — 그래서 더, 돌아가지 않는다."
        대실패: "젖은 옷으로 웅크린 첫 밤 — 담을 넘던 손이 떨리지 않았듯 지금도 후회는 없다. 다만 내일은 오늘보다 나아야 한다."
      closing: "\n\n{name}의 강호는 제 발로 시작되었다. 등 뒤에 남긴 것과 {incident}의 밤을 품은 채 — {region}의 아침이 밝는다."

  # ─── 출도 — 서장이 닫히고 강호가 열린다 (마지막 책의 끝줄) ───
  # ★ 옛 문장은 "청하현 지역 채널에서 /혼천 사냥 /혼천 비무 를 쓸 수 있다" 였다 — **디스코드를 가리켰다.**
  #   이제 몸은 이미 강호에 서 있다. 가리킬 곳은 발밑이다.
  debut: "몇 계절이 흘렀다. {name}은(는) {region}의 골목과 장터, 뒷산 능선까지 발로 익혔다. 이제 이 고을이 낯설지 않다 — 하지만 강호는 이제부터다."

# ─── 디스코드에 남는 이정표 — **스레드는 열리지 않는다** ───
# 사용자: "디스코드에서 채팅을 치고 진행하는 것이 아닌 마크로 넘어가는 걸로 표현하자."
# 그래서 생성이 끝나면 디스코드는 **한 번 말하고 입을 다문다.** 여기가 그 한마디다.
signpost:
  title: "태어났다 — 그러나 이야기는 여기서 흐르지 않는다"
  # ★ B-117 (2026-07-14 실측): 옛 ②는 "여기서 /혼천 접속 닉네임:… 을 친다" 였다 —
  #   "디스코드 닉네임 입력 시스템이 아닌 **명령어 입력 시스템**으로 되어 있다."
  #   이제 이정표 밑에 [마크와 잇기] 버튼이 함께 선다 (GameListener.signpostLinkButton) —
  #   누르면 닉네임 한 칸짜리 창이 뜨고, 명령과 **같은 파이프**(askLink)로 흐른다.
  body: |
    **{name}**이(가) 세상에 났다. 서장은 **강호에서** 열린다 — 이 채널이 아니다.

    **① 마크에 접속한다.**
    **② 아래 [마크와 잇기] 를 누르고, 그대의 마크 닉네임을 적는다.**
    **③ 게임 화면에 물음이 뜬다 — [잇는다] 를 누른다.**

    그러면 **품 안에 서책 한 권이 들어온다.** 펼치면 그날 밤이 떠오르고,
    **글자를 누르면** 이야기가 나아간다.

    *(버튼이 낡았으면 `/혼천 접속 닉네임:<마크 닉>` 으로도 된다 — 같은 문이다)*
  # [마크와 잇기] — 이정표 버튼의 라벨. 위 본문 ②가 이 라벨을 그대로 가리켜야 한다
  link_label: "마크와 잇기"
  footer: "디스코드는 이름을 지키고, 이야기는 몸이 겪는다."
