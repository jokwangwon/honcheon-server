# 몹 형체 등록부 (기계 판독용)
# 기준 문서: docs/design/mob_models.md · 판독: server-mvt MobDisplay.java · 검산: tools/mob_model_audit.py
#
# ══════════════════════════════════════════════════════════════════════════════
#  왜 이 파일이 생겼나
# ══════════════════════════════════════════════════════════════════════════════
# 우리 적은 **바닐라 몸을 빌려 쓴다** (HuntingGrounds.DEFAULT_ENTITY). 호랑이는 RAVAGER 다 —
# 몸집·돌진 AI 때문에 골랐지만, **눈에 보이는 것은 약탈수(Ravager)**다. 리소스팩은 텍스처를
# 바꿀 뿐 **지오메트리(모델)를 못 바꾼다** — 바닐라 클라이언트에서 몹 모델은 팩으로 교체되지 않는다.
# 그래서 호피 무늬를 입힌 라바저가 산길을 뛰어다녔다.
#
# 바닐라 클라이언트에서 되는 유일한 길: **본체를 감추고 커스텀 3D 모델을 태운다.**
#   · 본체(RAVAGER 등)는 그대로 둔다 — AI·판정·물리·경로탐색·히트박스가 전부 거기서 돈다.
#     (그것이 애초에 그 몸을 고른 이유다. 형체를 바꾼다고 그 이유가 사라지지 않는다.)
#   · 본체를 **투명하게** 한다 (setInvisible). 명패는 남는다 (투명한 몸도 이름표는 뜬다).
#   · 그 위에 **ItemDisplay** 를 태워, 팩이 구운 커스텀 3D 모델을 실는다.
#
# ── 불변식 (SkillDisplay 의 5개 규약을 이 층에도 그대로 건다) ──
#   ㄱ. 【형체는 덧칠이다】 이 층의 모든 실패(팩 없음·예산 초과·미등록·월드 없음)는
#      **본체가 그대로 보이는 것**으로 끝난다. 라바저로 보일지언정 **사냥은 된다**.
#      require-resource-pack=false 는 이 층에도 불가침이다 — 3D 는 특권이 아니라 사치다.
#   ㄴ. 【판정은 본체다】 형체는 히트박스를 갖지 않는다 (Display 는 때릴 수 없는 몸이다).
#      때리는 것도 맞는 것도 언제나 본체다. 형체가 어긋나도 판정은 불변이다.
#   ㄷ. 【형체 교체는 실루엣이 틀린 몸에만 건다】 아래 shape 절의 근거를 보라.
#
# ══════════════════════════════════════════════════════════════════════════════
#  shape — 갈아탈 몸과 그대로 둘 몸 (형체 담당의 판단)
# ══════════════════════════════════════════════════════════════════════════════
# ItemDisplay 는 **골격 애니메이션이 없다** — 뻣뻣한 조각이다. 다리가 걷지 않고 입이 벌어지지
# 않는다. 우리는 그것을 걷기 흔들림·기울기·쓰러짐(아래 motion 절)으로 흉내 낼 뿐이다.
# 그러므로 형체 교체는 **공짜가 아니라 거래**다: 실루엣을 얻고 골격 애니메이션을 잃는다.
#
#   replace  — 실루엣이 **틀린** 몸. 잃을 애니메이션보다 얻을 실루엣이 크다.
#              호랑이(라바저!) · 반달곰(북극곰) · 멧돼지(호글린) · 백영묘(집고양이)
#   vanilla  — 실루엣이 **맞는** 몸. 팩 텍스처로 족하다. 조각상으로 만들면 **더 나빠진다**.
#              산늑대(WOLF — 이미 늑대다. 6마리 무리가 뻣뻣하게 미끄러지면 그게 더 흉하다)
#              사람(ZOMBIE — 인간형 골격 + **병기를 휘두르는 팔**. 이것을 조각으로 바꾸면
#                   산적이 칼을 든 채 미끄러지는 인형이 된다. 사람은 팩 텍스처가 정답이다)
#
# vanilla 도 **등록된 예외**다 — reason 없이는 audit ①이 통과시키지 않는다.
# reserved_model 은 팩 담당이 나중에 구울 수 있게 잡아 둔 키다. 구우면 shape 한 줄만 replace 로
# 바꾸면 켜진다 (코드 수정 없음 — 등록제 규약).

# ══════════════════════════════════════════════════════════════════════════════
#  팩 게이트 — 팩 없는 눈을 어떻게 대접하는가
# ══════════════════════════════════════════════════════════════════════════════
# 【기술적 사실 — 이 절의 존재 이유】
#   · Display 의 가시성은 **플레이어별로 갈 수 있다** (setVisibleByDefault(false) + showEntity).
#   · 본체의 투명(setInvisible)은 **엔티티 단위 플래그**다. 플레이어별로 갈 수 없다.
#   · 본체를 hideEntity 로 플레이어별로 숨기면 — **그 플레이어는 그 몸을 때릴 수 없다.**
#     클라이언트에 레이캐스트할 대상이 없기 때문이다. 판정이 무너진다. 그러므로 쓰지 않는다.
#   ⇒ 팩 있는 눈과 없는 눈이 **한 자리에 섞이면 한쪽은 진다.** 피할 수 없다.
#
# 【판단】 지는 쪽은 **3D 다.** 근거:
#   ① 불가침 규약 — "팩이 없어도 플레이는 가능해야 한다". 본체를 감추면 팩 없는 눈에는
#      명패만 뜬 허공이 다가온다. 그것은 '가능한 플레이'가 아니다.
#   ② 선례 — skill_motion.yml 불변식 ㅁ: "3D 는 특권이 아니라 사치다". 같은 문법을 지킨다.
#   ③ 비대칭 — 3D 를 잃은 팩 수락자는 **여전히 잘 논다**(라바저를 본다). 본체를 잃은
#      미수락자는 **못 논다**. 손해의 크기가 다르다.
pack_gate:
  mode: adaptive              # adaptive | forced | off
  # adaptive (기본) — 형체의 관중(view_range 안의 플레이어)이 **전원 팩 수락**일 때만 본체를 감추고
  #                   형체를 띄운다. 한 명이라도 미수락자가 섞이면 형체를 거두고 본체를 되돌린다.
  #                   ※ 지금 서버는 팩을 배포하지 않는다 (server.properties resource-pack= 빈 값)
  #                     ⇒ 전원이 미수락 ⇒ **형체 0개 · 비용 0 · 위험 0.** 팩이 배포되는 날 저절로 켜진다.
  # forced   — 팩 강제(require-resource-pack=true) 서버용. 본체를 항상 감춘다.
  #            불가침 규약과 충돌하므로 **기본값이 아니다.** 켜는 자가 책임을 진다.
  # off      — 형체 층 전면 정지. 언제나 바닐라 몸 (사고 시 되돌릴 손잡이).
  reevaluate_ticks: 20        # 관중 재평가 주기 1초 — 매 틱 세면 플레이어가 스칠 때마다 형체가 깜빡인다
  grace_ticks: 200            # 접속 후 10초는 '팩 받는 중'으로 본다 — 미수락으로 친다 (보수적)
  # 팩 수락 신호: PlayerResourcePackStatusEvent.SUCCESSFULLY_LOADED (MobDisplay 가 직접 듣는다)

# ══════════════════════════════════════════════════════════════════════════════
#  예산 (performance.yml — tick_budget.npc_logic 6ms · vfx_entities 와는 **다른 풀**)
# ══════════════════════════════════════════════════════════════════════════════
# 【근거 — 사냥터에 몹 20마리면 디스플레이가 몇 개인가】
#   북쪽 산길 정원 (HuntingGrounds.POPULATIONS · ZONE_ENTITY_CAP 18):
#     밤 — 산늑대 6(vanilla:0) · 멧돼지 2(×1) · 호랑이 1(×3) · 반달곰 1(×2) · 산적 4(vanilla:0) · 갈호 1(vanilla:0)
#          = 몸 15마리 → **형체 7개**
#     낮 — 산늑대 4(0) · 멧돼지 3(×1) · 산적 3(0) · 갈호 1(0)   = 몸 11마리 → **형체 3개**
#     최악(구역 상한 18마리가 전부 replace 짐승) → 18 × 3 = 54
#   load_test.combat_cluster_size 20 을 전부 호랑이로 채우면(관리자 소환) 20 × 3 = 60.
#   ⇒ global_cap 64. degrade_at 48 을 넘으면 **새 형체를 붙이지 않는다** — 그 몸은 라바저로 보인다.
#     (강등의 종착지가 '보이지 않는 몹'이 아니라 '바닐라 몹'이다. 불변식 ㄱ 그대로다.)
#
# 【틱 비용】 추종은 살아 있는 형체 수만큼의 teleport + Transformation 이다.
#   64개 × (거리·회전 비교 + 벡터 3회 + teleport 1회) ≈ 산술 수천 연산 ⇒ **0.1ms 미만**.
#   npc_logic 6ms 중 이 층의 몫은 **1ms** 로 못 박는다 (budget_ms). 넘으면 audit ④가 잡는다.
#   ※ 형체 티커는 **중앙 티커 1개**다 (1틱 주기). 개체별 태스크 생성 금지 (performance.yml F-P2).
budget:
  global_cap: 64              # 세계 전체 동시 형체 상한
  degrade_at: 48              # 이 수를 넘으면 새 부착 거절 → 본체 그대로 (바닐라 몹으로 강등)
  per_mob_max: 4              # 한 몸이 갖는 파츠 상한 (몸통 + 머리 + 꼬리 + 여유 1)
  budget_ms: 1                # npc_logic 6ms 중 형체 층의 몫
  view_range: 0.75            # setViewRange 배율 — 0.75 × 64m = **48m**
  # 【근거】 무공 획(32m = 파티클 cull_beyond)보다 멀다. 호랑이는 40m 밖에서 **발견되어야** 한다 —
  #   그것이 사냥이다. 본체의 FOLLOW_RANGE(32)·SPAWN_MAX_DIST(64) 사이의 눈금이 48m 다.
  attach_scan_ticks: 20       # 형체 없는 태그 몸을 줍는 주기 (청크 재적재·서버 재기동 복구)
  attach_scan_range: 48       # 플레이어 곁 이 거리 안만 훑는다 — 사람이 없으면 산은 형체를 입지 않는다
  follow:
    interval_ticks: 1         # 추종 갱신 주기 — 1틱 (형체가 몸에서 떨어지면 그 즉시 거짓말이 된다)
    teleport_duration: 2      # setTeleportDuration — 이동 보간. 0 이면 형체가 **튄다**
    interpolation: 3          # setInterpolationDuration 기본값 (표정의 부드러움)
    move_epsilon: 0.02        # 이만큼도 안 움직였으면 teleport 를 아낀다 (선 자리의 몹은 공짜다)
    yaw_epsilon: 2.0          # 도(°) — 이만큼도 안 돌았으면 아낀다

# ══════════════════════════════════════════════════════════════════════════════
#  팩 담당에게 넘기는 계약 (모델 굽는 규약)
# ══════════════════════════════════════════════════════════════════════════════
# key   = item_model 컴포넌트 키. 팩은 두 장을 굽는다 (병기·무공 획과 같은 문법):
#           assets/honcheon/items/<경로>.json    (아이템 정의)
#           assets/honcheon/models/<경로>.json   (모델 — mob_model_audit 이 이 경로를 대조한다)
# base  = 모델을 실을 바닐라 아이템 (모델이 덮으므로 형체 무의미 — 스택 가능하고 흔한 것)
#
# 【치수 계약】 모델은 **1×1×1 블록 단위 정육면체**에 맞춰 굽는다 (아이템 모델 표준 16px 그리드).
#   엔진이 등록부의 size 를 Transformation.scale 로 그대로 곱한다 ⇒ **size = 실제 미터 치수**.
#   size: [길이, 높이, 폭]  ← 짐승의 코끝~꼬리밑(길이) · 발바닥~어깨(높이) · 어깨너비(폭)
# 【방향 계약】 모델은 **+Z(남쪽)** 을 향해 선다 — 코가 +Z, 등이 +Y, 오른쪽이 +X.
#   Display 의 yaw 0 이 +Z 다. 엔진이 본체의 yaw 를 그대로 먹인다. 이 계약이 깨지면 짐승이 옆으로 걷는다.
# 【원점 계약】 모델 원점은 **네 발이 딛는 바닥의 정중앙**. 엔진은 본체의 발 위치에 형체를 세운다.
#   offset 은 그 위의 미세 보정이다 (본체 로컬 좌표 [오른쪽, 위, 앞], 미터).

foes:

  # ────────────────────────────────────────────────────────────────────────────
  #  호랑이 — 이 파일이 태어난 이유
  # ────────────────────────────────────────────────────────────────────────────
  horangi:
    name: "호랑이"
    body: RAVAGER             # = HuntingGrounds.DEFAULT_ENTITY (본체는 바뀌지 않는다)
    shape: replace
    reason: "라바저다. 뿔 달린 회색 소가 북산의 주인 행세를 하고 있었다 — 팩으로는 못 고친다"
    hide_equipment: true
    parts:
      - id: body
        role: body
        key: "honcheon:mob/horangi/body"
        base: LEATHER
        size: [2.2, 1.0, 0.7]     # 코끝~꼬리밑 2.2m · 어깨높이 1.0m · 어깨너비 0.7m (시베리아호랑이 실치수)
        offset: [0.0, 0.0, 0.0]
        pose: "네 발로 선 자세. 어깨가 엉덩이보다 높다(포식자의 등선). 앞다리 굵고 발톱이 보인다"
      - id: head
        role: head
        key: "honcheon:mob/horangi/head"
        base: LEATHER
        size: [0.55, 0.5, 0.5]
        offset: [0.0, 0.82, 0.95]   # 몸통 앞 0.95m · 높이 0.82m — 어깨선보다 살짝 낮게 (노리는 짐승의 자세)
        head_yaw_max: 55.0          # 표적을 본다 — 몸이 안 돌아도 고개가 먼저 돈다
        head_pitch_max: 30.0
        pose: "정면을 노려보는 머리. 입은 반쯤 벌어져 송곳니가 보인다. 귀는 뒤로 눕힌다(공격 직전)"
      - id: tail
        role: tail
        key: "honcheon:mob/horangi/tail"
        base: LEATHER
        size: [0.9, 0.12, 0.12]
        offset: [0.0, 0.75, -1.05]  # 몸통 뒤 1.05m — 등선 높이에서 뻗어 나온다
        sway_deg: 22.0              # 걷기 위상에 맞춰 좌우로 22° — 꼬리가 살아 있음의 표시다
        pose: "굵고 긴 꼬리. 검은 고리 무늬. 끝이 살짝 위로 감긴다"
    motion:
      walk_bob: 0.09              # 상하 흔들림 진폭(m) — 무거운 짐승은 크게 출렁인다
      walk_bob_rate: 2.4          # 위상/이동거리(m) — 시간이 아니라 **이동거리**로 돈다 (멈추면 흔들림도 멈춘다)
      walk_roll_deg: 4.0          # 좌우 몸통 기울기 — 어깨가 번갈아 내려간다
      attack_lean_deg: 25.0       # 칠 때 앞으로 기운다 — 덮치는 짐승의 무게
      attack_lean_ticks: 6
      charge_lean_deg: 18.0       # 달릴수록 더 기운다 (속도 비례, 이 값이 상한)
      charge_speed_full: 0.30     # 이 속도(m/틱)에서 charge_lean 최대
      death_topple_deg: 90.0      # 옆으로 쓰러진다
      death_sink: 0.35            # 쓰러지며 가라앉는다(m) — 땅에 눕는다
      death_ticks: 24             # 쓰러짐 보간 24틱(1.2초) 뒤 사라진다
    view_range: 0.75              # 48m — 북산의 주인은 멀리서 보여야 한다

  # ────────────────────────────────────────────────────────────────────────────
  #  반달곰 — 북극곰은 흰 곰이다
  # ────────────────────────────────────────────────────────────────────────────
  bandal_gom:
    name: "반달곰"
    body: POLAR_BEAR
    shape: replace
    reason: "북극곰(흰 곰·긴 목·큰 덩치)과 반달가슴곰(검고 둥글고 작다)은 실루엣이 다르다. 팩은 색만 바꾼다"
    hide_equipment: true
    parts:
      - id: body
        role: body
        key: "honcheon:mob/bandal_gom/body"
        base: LEATHER
        size: [1.6, 1.0, 0.8]     # 몸길이 1.6m · 어깨높이 1.0m — 북극곰보다 **작고 뭉툭하다**
        offset: [0.0, 0.0, 0.0]
        pose: "네 발로 선 자세. 등이 둥글게 솟는다(곰의 등선 — 호랑이와 반대다). 가슴에 흰 반달"
      - id: head
        role: head
        key: "honcheon:mob/bandal_gom/head"
        base: LEATHER
        size: [0.45, 0.45, 0.42]
        offset: [0.0, 0.72, 0.72]
        head_yaw_max: 40.0        # 곰은 고개를 크게 돌리지 않는다 (호랑이 55° 보다 뻣뻣하다)
        head_pitch_max: 25.0
        pose: "짧은 주둥이 · 둥근 귀 두 개가 크게 솟는다. 눈이 작다"
    motion:
      walk_bob: 0.11              # 가장 무거운 짐승 — 가장 크게 출렁인다 (내구 24)
      walk_bob_rate: 2.0
      walk_roll_deg: 6.0          # 곰은 뒤뚱거린다
      attack_lean_deg: 20.0       # 후려치기 — 앞발을 든다 (앞으로 기울며 상체가 뜬다)
      attack_lean_ticks: 8
      charge_lean_deg: 10.0
      charge_speed_full: 0.25
      death_topple_deg: 90.0
      death_sink: 0.30
      death_ticks: 28             # 큰 몸은 천천히 쓰러진다
    view_range: 0.75

  # ────────────────────────────────────────────────────────────────────────────
  #  멧돼지 — 호글린은 네더의 털복숭이다
  # ────────────────────────────────────────────────────────────────────────────
  metdwaeji:
    name: "멧돼지"
    body: HOGLIN
    shape: replace
    reason: "호글린은 실루엣이 가깝지만 비율이 다르다 (털 · 위로 굽은 엄니 · 네더의 색). 어깨혹이 없다"
    hide_equipment: true
    parts:
      - id: body
        role: body
        key: "honcheon:mob/metdwaeji/body"
        base: LEATHER
        size: [1.5, 0.9, 0.55]    # 몸길이 1.5m · 어깨높이 0.9m
        offset: [0.0, 0.0, 0.0]
        pose: >
          머리·어깨·몸통이 **한 덩어리**다 — 파츠를 나누지 않는다. 어깨혹이 솟고 엉덩이로 갈수록
          가늘어지는 쐐기꼴(멧돼지의 정체성). 아래로 굽은 엄니 · 뻣뻣한 등털. 통째로 기울어 돌진한다
    motion:
      walk_bob: 0.06              # 낮고 빠른 짐승 — 잔걸음
      walk_bob_rate: 3.2
      walk_roll_deg: 2.0
      attack_lean_deg: 30.0       # 들이받기 — 가장 크게 기운다 (머리로 친다)
      attack_lean_ticks: 5
      charge_lean_deg: 22.0       # 돌진 중에는 멈추지 않는다 (npcs: "돌진 중 붕괴 판정 없음")
      charge_speed_full: 0.32
      death_topple_deg: 90.0
      death_sink: 0.25
      death_ticks: 20
    view_range: 0.75

  # ────────────────────────────────────────────────────────────────────────────
  #  백영묘 — 영물은 집고양이가 아니다
  # ────────────────────────────────────────────────────────────────────────────
  baegyeongmyo:
    name: "백영묘(白影猫)"
    body: CAT
    shape: replace
    reason: "영물의 위엄이 집고양이 몸으로는 안 나온다. 흰 표범급 크기(1.5m)와 긴 꼬리가 이 짐승의 전부다"
    hide_equipment: true
    body_glow_to_display: true    # 본체의 발광(검기 두름)을 **형체로 옮긴다**
    # 【함정】 투명한 몸에 setGlowing 을 걸면 **바닐라 모델의 윤곽선이 그대로 빛난다** — 고양이 실루엣이
    #   허공에 뜬다. 그래서 본체의 발광을 끄고 형체(Display)에 발광을 옮긴다. 검기는 그대로 보인다.
    parts:
      - id: body
        role: body
        key: "honcheon:mob/baegyeongmyo/body"
        base: LEATHER
        size: [1.5, 0.75, 0.42]   # 흰 표범 — 집고양이(0.5m)의 3배
        offset: [0.0, 0.0, 0.0]
        pose: >
          고양잇과의 유연한 몸. 어깨뼈가 걸을 때마다 솟는 자세(호랑이보다 낮고 길다). 새하얗고
          털끝이 은빛. 발톱은 늘 나와 있다 (검기가 서린다 — 이 짐승은 무기를 감추지 않는다)
      - id: tail
        role: tail
        key: "honcheon:mob/baegyeongmyo/tail"
        base: LEATHER
        size: [1.1, 0.09, 0.09]   # 몸길이의 3분의 2 — 비정상적으로 길다. 그것이 영물의 표시다
        offset: [0.0, 0.58, -0.8]
        sway_deg: 35.0            # 크게 흔들린다 — 흰 그림자가 흔들리는 것으로 먼저 읽힌다
        pose: "몸길이의 2/3 에 이르는 긴 꼬리. 끝이 위로 곧게 선다. 은은한 잔광"
    motion:
      walk_bob: 0.05              # 소리 없이 걷는다 — 거의 흔들리지 않는다
      walk_bob_rate: 3.0
      walk_roll_deg: 1.5
      attack_lean_deg: 35.0       # 덮치기 — 가장 깊이 기운다 (몸 전체가 화살이 된다)
      attack_lean_ticks: 5
      charge_lean_deg: 25.0
      charge_speed_full: 0.35     # 가장 빠르다 (SPEED I 상시 — HuntingGrounds.shape)
      death_topple_deg: 90.0
      death_sink: 0.30
      death_ticks: 30             # 영물은 천천히 스러진다
    view_range: 1.0               # 64m — 흰 그림자는 산등성이 너머에서 먼저 보인다

  # ────────────────────────────────────────────────────────────────────────────
  #  그대로 둘 몸 — 등록된 예외 (reason 필수)
  # ────────────────────────────────────────────────────────────────────────────
  san_neukdae:
    name: "산늑대"
    body: WOLF
    shape: vanilla
    reason: >
      WOLF 는 **이미 늑대다** — 실루엣이 맞다. 팩 텍스처(회흑색 산늑대)로 족하다.
      게다가 무리 짐승이다(3~5마리, 밤 정원 6). 6마리를 뻣뻣한 조각으로 바꾸면 골격 애니메이션
      (달리는 다리 · 꼬리 · 고개)을 여섯 번 잃는다 — **얻는 것보다 잃는 것이 크다**.
    reserved_model: "honcheon:mob/san_neukdae/body"   # 팩 담당이 구우면 shape 만 replace 로 바꾼다
    reserved_size: [1.4, 0.8, 0.45]

  north_road_bandit:
    name: "북쪽 산길 도적"
    body: ZOMBIE
    shape: vanilla
    reason: >
      **사람은 조각이 될 수 없다.** ZOMBIE 를 고른 이유가 인간형 골격과 **손에 든 병기가 보이는
      팔 스윙**이다 (HuntingGrounds.arm — 진짜 범철 도를 들려 스폰한다). ItemDisplay 로 바꾸면
      산적은 칼을 든 채 미끄러지는 인형이 된다. 사람의 형체는 **팩 텍스처**가 정답이다.
    reserved_model: null

  galho:
    name: "갈호"
    body: ZOMBIE
    shape: vanilla
    reason: "두목도 사람이다 — north_road_bandit 과 같은 근거. 정련 검·철갑을 팔이 휘둘러야 한다"
    reserved_model: null

  gwakjin:
    name: "곽진"
    body: ZOMBIE
    shape: vanilla
    reason: "비무 상대 — 사람이다. 게다가 마을에 선다. 사람의 형체는 팩 텍스처가 정답이다"
    reserved_model: null
