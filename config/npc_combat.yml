# NPC 전투·태세·전의 규칙 (기계 판독용)
# 기준 문서: docs/design/npc_combat_and_dialogue.md
# 대칭 원칙: NPC는 플레이어와 같은 규칙 (카탈로그·내력·게이트·다운캐스트·소문)

symmetry:
  - "NPC 무공 = skills.yml 카탈로그 + npcs/*.yml 로드아웃"
  - "NPC 자원 = 내력 풀·소모 밴드·다운캐스트 동일 (고갈 이펙트 빈약화 — 읽기 가능)"
  - "NPC 오의 = 발동권(흐름) 동일 요구"
  - "NPC 공개 시전 = 소문 생성 동일"

ai_tiers:                       # NPC 등급제(1~5)에 대응
  졸개_1_2: { pattern: "접근→공격→간헐 가드 루프", skills: [0, 1] }
  관계_3: { pattern: "스킬 로테이션 + 조건 트리거 (내구 50% 등)", uses: [회피] }
  두목_4: { pattern: "페이즈제 패턴 전환", uses: [패링, 보법], telegraph: "명확 (보스 문법)" }
  고수_5: { pattern: "플레이어 완전 동일 룰셋", uses: [오의_흐름_포함] }
think_interval_ticks: [4, 10]   # 매 틱 사고 금지 — performance.yml npc_logic 예산 준수

# 모션 대체 언어 (바닐라 클라 — 커스텀 애니메이션 불가)
motion_language:
  예고: "선딜 프레임 = 예고 연출 시간 — 자세(포즈)+고유 사운드+경로 파티클"
  궤적: "히트박스 6유형을 파티클로 시각화 (호 스윕/선 빛줄기/원 고리)"
  반응: "velocity·화면 흔들림·경직 포즈 고정·다운 엎드림"
  물체: "검기·잔상 = VFX 엔티티 풀 (예산 준수)"
  이상은: "선택 설치 클라이언트 모드의 몫 (후순위 — 필수 아님)"

# 태세 스펙트럼 — 대화/전투 하드 전환 없음
stance:
  levels: [우호, 중립, 경계, 적대, 전투]
  rules:
    - "대화는 전 태세에서 가능 (전투 태세 포함)"
    - "전투 진입: 선공 / 대화 파탄 / NPC 목적 도래 — 어느 쪽이든 언제든"
  ambush_in_dialogue:
    bonus: +2                   # 대화는 경계를 낮춘다
    price: "'비열 행위' — 목격·생존자 경유 소문 시 명성 대가 + 세력 반응 (세계가 청구)"

# 전투 중 대화 (combat.yml 말_걸기 확장)
combat_dialogue:
  text: "라운드 행동 1개 — 화술 판정, 실패 시 틈(-1)"
  mc: "채팅 선택지 상시 활성 — '외치기'는 쿨다운 있는 시전 취급 (발화 중 가드 불가)"
  patterns:
    싸우며_문답: "정보 캐기 판정을 전투 중에 ('그 검법 어디서 배웠지')"
    통성명_선언: "결투 전 이름 공개 = 정정당당 보정 — 명성 이벤트, 소문 정확도 +"
    항복_권유: "비폭력 종결 — 제압 선언 연결"

# 전의(戰意) — 전투 종결의 다양화
morale:
  inputs: [내구_비율, 아군_수, 상대_위세(오의_목격·경지_격차), 두목_생사]
  break_check:
    졸개: "내구 25% 이하 또는 두목 무력화 → 붕괴 판정 (항복/도주/흥정)"
    두목: "여유 있을 때만 대화를 건다 — 열세 시 도주 우선"
  outcomes: [항복, 흥정, 도주_선언, 결사]
