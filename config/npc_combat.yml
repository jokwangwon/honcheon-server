# NPC 전투·태세·전의 규칙 (기계 판독용)
# 기준 문서: docs/design/npc_combat_and_dialogue.md
# 대칭 원칙: NPC는 플레이어와 같은 규칙 (카탈로그·내력·게이트·다운캐스트·소문)

symmetry:
  - "NPC 무공 = skills.yml 카탈로그 + npcs/*.yml 로드아웃"
  - "NPC 자원 = 내력 풀·소모 밴드·다운캐스트 동일 (고갈 이펙트 빈약화 — 읽기 가능)"
  - "NPC 오의 = 발동권(흐름) 동일 요구"
  - "NPC 공개 시전 = 소문 생성 동일"

ai_tiers:                       # NPC 등급제(1~5)에 대응
  졸개_1_2: { pattern: "접근→공격→간헐 가드 루프", skills: [0, 1] }
  관계_3: { pattern: "스킬 로테이션 + 조건 트리거 (내구 50% 등)", uses: [회피] }
  두목_4: { pattern: "페이즈제 패턴 전환", uses: [패링, 보법], telegraph: "명확 (보스 문법)" }
  고수_5: { pattern: "플레이어 완전 동일 룰셋", uses: [오의_흐름_포함] }
think_interval_ticks: [4, 10]   # 매 틱 사고 금지 — performance.yml npc_logic 예산 준수

# 모션 대체 언어 (바닐라 클라 — 커스텀 애니메이션 불가)
motion_language:
  예고: "선딜 프레임 = 예고 연출 시간 — 자세(포즈)+고유 사운드+경로 파티클"
  궤적: "히트박스 6유형을 파티클로 시각화 (호 스윕/선 빛줄기/원 고리)"
  반응: "velocity·화면 흔들림·경직 포즈 고정·다운 엎드림"
  물체: "검기·잔상 = VFX 엔티티 풀 (예산 준수)"
  이상은: "선택 설치 클라이언트 모드의 몫 (후순위 — 필수 아님)"

# 태세 스펙트럼 — 대화/전투 하드 전환 없음
stance:
  levels: [우호, 중립, 경계, 적대, 전투]
  rules:
    - "대화는 전 태세에서 가능 (전투 태세 포함)"
    - "전투 진입: 선공 / 대화 파탄 / NPC 목적 도래 — 어느 쪽이든 언제든"
  ambush_in_dialogue:
    bonus: +2                   # 대화는 경계를 낮춘다
    price: "'비열 행위' — 목격·생존자 경유 소문 시 명성 대가 + 세력 반응 (세계가 청구)"

# 전투 중 대화 (combat.yml 말_걸기 확장)
combat_dialogue:
  text: "라운드 행동 1개 — 화술 판정, 실패 시 틈(-1)"
  mc: "채팅 선택지 상시 활성 — '외치기'는 쿨다운 있는 시전 취급 (발화 중 가드 불가)"
  patterns:
    싸우며_문답: "정보 캐기 판정을 전투 중에 ('그 검법 어디서 배웠지')"
    통성명_선언: "결투 전 이름 공개 = 정정당당 보정 — 명성 이벤트, 소문 정확도 +"
    항복_권유: "비폭력 종결 — 제압 선언 연결"

# ─── 전의(戰意) — 전투 종결의 다양화 ───
# 2026-07 정합 패스: 입력 4종이 선언만 되어 있고 문턱이 하나뿐이었다 (엔진이 '아군 수'·'위세'를 계산할 수 없었다).
#   → 전의 게이지(0~10) + 입력별 가중치 + 붕괴 문턱을 수치로 확정한다.
#   → 그리고 '격 목격'을 입력에 넣었다. 검강을 보고도 안 도망가는 졸개는 없다 (qi_manifestation integration.morale).
morale:
  gauge: { max: 10, start_by_tier: { 졸개: 5, 관계: 7, 두목: 9, 고수: 10 }, min: 0 }
  inputs: [내구_비율, 아군_수, 상대_위세(격_목격·오의_목격·경지_격차), 두목_생사]

  # 입력별 가중치 — 매 라운드 재계산 (누적 아님. 상황이 나아지면 전의도 돌아온다)
  weights:
    내구_비율:
      "50%_이하": -2
      "25%_이하": -4
    아군_수:                       # 시야 내 생존 아군 (자기 제외) 대비 적 수
      수적_우세: +2                # 아군 > 적
      호각: 0
      수적_열세: -2                # 적 > 아군
      혼자_남음: -3
    상대_위세:                     # 가장 강한 적 기준 — 한 번 본 것은 그 전투 내내 유지된다
      격_목격:
        발경: 0                    # 개화한 자는 흔하다
        검기: -2                   # 날에 기가 서린다 — 졸개의 무기로는 닿지 않는다
        강기: -5                   # 검강·호신강기 — 이 자리에서 이길 방법이 없다
        어검_심검: -8              # 전설을 본 자는 싸우지 않는다
      오의_목격: -4
      경지_격차: "-1 / 2경지 차 (상한 -4)"
    두목_생사:
      두목_중상: -2
      두목_무력화: -4
      두목_사망: -5

  # 붕괴 문턱 — 전의가 이 아래로 떨어지면 붕괴 판정 (지혜·의지 대립 판정, 기준치 = 10 - 전의)
  break_check:
    졸개: "전의 3 이하 → 붕괴 판정 (내구 25% 이하 = -4, 두목 무력화 = -4 — 둘 중 하나로 문턱을 넘는다)"
    두목: "전의 2 이하 → 붕괴 판정. 단 두목은 '결사' 가중 +2 (체면) — 열세 시 도주 우선, 여유 있을 때만 대화를 건다"
    고수: "전의 0 → 붕괴 없음. 고수는 지는 싸움을 알고도 선다 (붕괴 대신 '퇴각 선언' — 대화 가능)"
  outcomes: [항복, 흥정, 도주_선언, 결사]
  outcome_weights: { 항복: 3, 흥정: 2, 도주_선언: 4, 결사: 1 }   # 붕괴 판정 실패 시 가중 추첨 (두목은 결사 +2)
  recovery: "두목이 살아 돌아오거나 원군이 오면 전의 재계산 — 도망치던 졸개도 돌아선다"
  mc: "전의 저하 = 자세·발걸음·거리 유지 (읽을 수 있게). 전의 3 이하 = 무기 든 손이 떨린다 (파티클 없음, 포즈만)"

# ─── 짐승 — 사냥은 성장(combat_hwahu)과 경제(부산물)의 기둥이다 ───
# 2026-07 정합 패스: 짐승에게 '격'(들짐승·맹수·영물)만 있고 능력치·내구·공격 수단이 0건이었다.
#   → 개체 스탯은 config/npcs/cheongha_npcs.yml (늑대·멧돼지·호랑이·반달곰·백영묘). 여기는 공통 규칙.
beasts:
  ranks: { 들짐승: 삼류_상당, 맹수: 일류_상당, 영물: 절정_이상 }   # cultivation.yml combat_hwahu beast_ranks 와 동일
  rules:
    - "짐승은 무공을 쓰지 않는다 — 무공 위력 0 (combat.yml technique_power 입문). 위력은 이빨과 발톱(무기 위력)에서 온다"
    - "짐승은 무기를 들지 않는다 → weapon_break 대상이 아니다. 검기로 베면 그냥 베인다"
    - "들짐승·맹수는 내력이 없다 (내공 0). 영물만 내력을 쓴다 — 영물이 무서운 이유"
    - "짐승도 전의를 갖는다 (아래 morale_profile) — 배고픈 늑대와 배부른 늑대는 다른 적이다"
  attack_forms: [물기, 할퀴기, 덮치기]         # 액션 데이터: skill_mechanics.yml beast_pounce (공통 덮치기)
  morale_profile:
    들짐승: { start: 4, 도주_문턱: 3, note: "무리가 흩어지면 곧 도망친다 — 아군_수 가중치 2배" }
    맹수: { start: 7, 도주_문턱: 2, note: "부상 입은 맹수가 가장 위험하다 — 내구 25% 이하에서 결사 가중 +3" }
    영물: { start: 10, 도주_문턱: 0, note: "붕괴하지 않는다. 대신 '떠난다' — 이길 수 없다고 판단하면 사라진다" }
  hunt_hooks:
    성장: "cultivation.yml combat_hwahu — 경지 상당치로 화후 계산 (압도적 하수 ×0 규칙 동일 적용)"
    경제: "economy.yml 사냥 부산물 (가죽·고기·힘줄·웅담) — 개체별 drops 는 npcs 정의"
    소문: "영물 사냥은 강도 2 소문 — 산이 기억한다"
