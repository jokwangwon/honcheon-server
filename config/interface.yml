# 플레이 인터페이스 규칙 (기계 판독용) — 디스코드 봇 (1차 플랫폼)
# 기준 문서: docs/design/interface_decision.md
# 결정: 서버 = 세계 / 채널 = 지역·장소 / 스레드 = 장면 / DM = 은밀 — 공유 세계와 구조 동형

platform:
  primary: discord_bot
  secondary: minecraft            # 동일 세계 2차 인터페이스 — 계정 연동, 공용 원장
  runtime: "Java (JDA) + :core 직결 + anthropic-java — 패리티 계층 없음, MC와 동일 스택"

mapping:
  서장: { surface: 프라이빗_스레드, rule: "출도 전 비공개 — 개인 시간축 정합" }
  공유_공간: { surface: 지역_채널, examples: ["#청하현-객잔", "#청하현-저자", "#북쪽-산길"], rule: "같은 채널 = 서로 보인다 (조우·동행·엿듣기)" }
  장면: { surface: 스레드, rule: "장면 = 동시성 잠금 단위 (G8 뼈대)" }
  선택지: { surface: 버튼, count: [3, 5], rule: "프리페치 결합 — 버튼 노출 시점에 다음 턴 기렌더" }
  자유_입력: { surface: 메시지, rule: "판정 선언 — 엔진 파이프라인 입력" }
  판정_공개: { surface: embed, rule: "주사위·마진·등급 공개 원칙 (신뢰) — 서사는 본문" }
  은밀_행동: { surface: DM_개인_스레드, rule: "타인에게 보이지 않는다" }
  세계_방송: { surface: "#강호-소문", rule: "강도 3 소문·세계급 사건" }

phases:
  - { id: I, scope: "파이프라인 프로토타입 (파이썬 CLI) — 렌더 실동·캐시 실측", status: 진행 }
  - { id: II, scope: "봇 알파 — 생성+서장, 1인 완주" }
  - { id: III, scope: "봇 베타 — 출도+지역 채널+조우, 2인 PT-008 무대" }
  - { id: IV, scope: "MC 연동 — 계정 연결, 공용 원장" }
