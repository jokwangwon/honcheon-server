# 전투 규칙 (기계 판독용)
# 기준 문서: docs/design/combat_system.md
# 전투 = 대립 판정의 연쇄. 판정식·등급·보정은 judgment.yml / gm_modifiers.yml 재사용.
#
# 2026-07 전투 정합 패스 (combat_audit 26위반) — 세 줄 요약:
#   ① 피해 공식에 '격 위력' 항을 넣었다. 내력을 태우면 아프다 (그전엔 발경이 장식이었다).
#   ② 무공 위력 사다리를 눌렀다 (0·1·1·1·2). 위력의 축은 등급이 아니라 격이다.
#   ③ 협공은 '포위 슬롯'으로 상한을 얻었다. 동시에 칠 수 있는 손은 세 개뿐이다.

initiative:
  ambush: "기습 판정 성공 시 선공 + 방어측 -2 (첫 라운드)"
  frontal: "민첩+감각 합 비교 — 높은 쪽 선공, 동률이면 경지 높은 쪽, 그것도 동률이면 감각 단독 비교, 최종 동률이면 '동시 교환'(양측 이번 라운드 피해를 서로 확정 — 선공 없음)"
  simultaneous_exchange: "완전 대칭 대결의 해소 규칙 — 선공이 승패를 결정하지 못하게 한다 (양측 동시 피해, 빈사도 동시)"
  overwhelm: "기대 마진 ±8 자동 처리 규칙 그대로 적용"

actions_per_round: 1
actions: [공격, 방어_전념, 무공_시전, 거리_조정, 도주_시도, 말_걸기]
action_notes:
  방어_전념: "이번 라운드 방어 +2"
  말_걸기: "전투 중 협상 — 화술 판정, 실패 시 상대 공격에 -1 틈"

attack:
  attacker: "능력치 + 무공 숙련 + 보정(경지 격차/협공/환경/상태) + 2d6(플레이어) 또는 +7(NPC)"

  # 【등록】 '능력치'가 어느 능력치인가 — 지금까지 규칙이 말하지 않던 자리다 (2026-07 성장 축 패스).
  #   엔진(SkillListener)은 능력치 시트가 없어서 이 항을 통째로 빼고 돌고 있었다 —
  #   "MVT 근사: 능력치 시트가 없다 — 경지가 능력치의 자리를 대신한다".
  #   그래서 플레이어에게 **키울 것이 없었다.** 이 등록이 그 구멍을 메운다 (docs/design/growth_axes.md).
  attacker_attribute:
    기본: 근력                     # 검·도·창·봉·권 — 병장기는 손과 허리로 낸다
    원거리: 감각                   # 활·암기 — 거리는 눈으로 잰다 (skill_mechanics ranged 계열)
    note: "무공 숙련은 그대로 더해진다 (초식). 능력치는 '몸', 숙련은 '손' — 두 사다리가 같은 판정에 선다"

  # 세 방어는 세 능력치다 — 이 대응이 곧 빌드의 뒷면이다 (attribute 키는 기계 판독용 신설, check 는 정본 서술)
  defender_choice:
    회피:
      check: "민첩 + 경공"
      attribute: 민첩
      skill: 경공
      weapon_safe: true            # 접촉이 없다 — 무기는 상하지 않는다 (원칙 2: 격은 회피를 부수지 못한다)
      note: "몸을 빼는 것에는 격이 없다. 대신 아무것도 얻지 못한다 (반격 창 없음)"
    막기:
      check: "근력 + 병기 기술"
      attribute: 근력
      damage_reduction: 3          # 성공 시 피해 -3 — 막기는 값을 갖는다 (2026-07 정합: 죽은 선택지였다)
      qi_soak: "상위 격도 막힌다 — 격의 위력만큼 무기가 대신 먹는다 (weapon_break 격돌 손상)"
      note: "막기는 무기를 태워 목숨을 산다 — 범철로 검기를 세 번 막으면 검이 부러지지만, 그 세 합은 살았다"
    흘리기:
      check: "감각 + 병기 기술"
      attribute: 감각
      damage_reduction: 1
      weapon_safe: true            # 접촉을 각도로 흘린다 — 격돌 판정 없음
      cost: "판정 -2 (어렵다). 정련 미만 무기로 상위 격을 상대하는 자의 길"
      penalty: -2                  # 기계 판독용 — cost 서술의 수치
  defender_bonus: "+2d6(플레이어) 또는 +7(NPC)"
  # ★ 성장 축의 뒷면 (docs/design/growth_axes.md): 방어 셋이 능력치 셋에 하나씩 걸려 있다.
  #   신법(민첩) → 회피 · 외공(근력) → 막기 · 심안(감각) → 흘리기.
  #   그리고 forced_guard 가 회피를 지운다 → **신법 빌드는 1대1의 왕이고 다구리에 벌거벗는다.**
  #   그것이 이 규칙이 지배 전략을 막는 방식이다 — 밸런스 수치가 아니라 상황이 축을 뒤집는다.

  # 협공 — 포위 슬롯 (2026-07 정합: 캡 3은 '보정 총량'만 막고 머릿수를 못 막았다)
  gang_up:
    per_extra_attacker: 1
    max: 2                         # 캡 3 → 2. engage_slots 3 의 귀결 (3인째가 마지막 손 = +2)
    engage_slots: 3                # 동시 교전 상한 — 한 표적을 동시에 칠 수 있는 것은 3인까지
    slot_note: "4인째부터는 '대기'(포위) — 앞선 자가 무력화·후퇴해야 슬롯이 열린다. 다구리에도 몸이 들어갈 자리가 필요하다"
    formation_override: "합격진은 등록 무공으로 슬롯을 연다 (party.yml 합격진 — 매화검진 슬롯 5)"
  outnumbered_defense:             # 1대다의 방어 이점 — 사방에서 오는 것은 서로의 검로를 막는다
    per_extra_attacker: 1
    max: 2
    applies_to: [회피, 막기, 흘리기]
    note: "적이 많을수록 그들끼리 걸린다. 포위의 값은 명중이 아니라 '도주 봉쇄'(party.yml 포위 -2)에 있다"
    # 【정본】 협공 보정(+1/인, 캡 2)과 이 방어 이점(+1/인, 캡 2)은 같은 눈금이다 → 판정 순보정은 0 이다.
    #   의도된 것이다: 머릿수는 '더 잘 맞히는 것'이 아니라 '더 많이 치는 것'이다(engage_slots).
    #   보정을 남겨두면 명중률 절벽 위에서 곱셈으로 터진다 (이류 4인의 절정 상대 명중률 2.8% → 16.7%).

    # 포위된 자의 태세 — 몸을 뺄 자리가 없다 (2026-07 정합 패스 ③)
    forced_guard:
      trigger_extra_attackers: 1   # 둘 이상에게 동시에 잡히는 순간부터
      loses: [회피]                 # 회피는 '몸을 빼는 것'이다 — 뺄 자리가 없으면 못 고른다 (피해 0 + 무기 안전을 잃는다)
      defense: 흘리기               # 남는 것은 받아넘기는 것 — 경감치(1)는 defender_choice.흘리기 가 정본
      waives: 판정_비용             # 흘리기의 -2 는 '고른 자'의 대가다. 강제당한 자는 물지 않는다
      also_allowed: 막기            # 막기(-3)를 고를 수는 있다 — 대신 무기가 격을 먹는다(weapon_break)
      audit_floor: 흘리기           # 【검산 규약】 감사는 경감이 가장 낮은 강제 태세로 잰다 — 방어자에게 인색해야 눈이 산다
      note: "사방이 막히면 피할 곳이 없다. 받아넘기거나(−1), 검으로 받거나(−3, 검이 상한다)"
      rationale: |
        고수가 다수를 상대로 사는 이유가 규칙 안에 있어야 한다. 그 답은 ① 슬롯(동시타 3) ② 판정 상쇄(순보정 0)
        ③ 경감(−1) 이지, 머릿수를 무의미하게 만드는 것이 아니다 — 졸개 다섯은 여전히 무섭다.
        경감을 막기(−3)로 잡으면 규칙이 뒤집힌다: 둘이 덤비는 것이 하나보다 덜 아파진다(총 피해 3.28 → 3.06).
        경감은 협공 1인분(약 3.3)보다 반드시 작아야 한다 — 그것이 −1 인 이유다.
  child_penalty: { 유년: -2, 소년: -1 }   # 성인 상대 (player_creation과 동일)

damage:
  formula: "무기 위력 + 무공 위력 + 격 위력 + floor(마진 / 2)"

  # 무기 위력 — 【등록제 정본】 병장기의 값. 맨손과의 거리가 곧 '무기를 든다'는 것의 의미다.
  #   코드가 config 보다 앞서지 않는다 — MVT/봇이 쓰는 무기 계열은 반드시 여기 등록되어야 한다.
  #   14계열: 맨손·권갑 / 암기 / 단검·봉·활·겸 / 검·도·창·월아산·구 / 중병기·부
  weapon_power:
    맨손: 1        # 권법·장법·박투·금나술의 기본값. 위력은 격에서 온다 (발경 +1 = 맨손이 두 배가 된다)
    권갑: 2        # 拳甲 — 맨손의 연장. 쇠를 덧댄 주먹은 병장기지만 검은 못 된다
    암기: 2        # 비수·표창 — 거리의 값을 위력에서 뺀다
    겸: 3          # 鎌 — 낫. 짧고 걸어채는 것
    단검: 3
    봉: 3
    활: 3          # 사거리 40 (skill_mechanics ranged) — 거리를 위력으로 바꾼다
    검: 4
    도: 4
    창: 4
    월아산: 4      # 月牙鏟 — 승병의 삽. 길고 무겁다
    구: 4          # 鉤 — 갈고리. 무장 해제·포박 연계
    중병기: 5
    부: 5          # 斧 — 도끼. 가장 무겁고 가장 느리다 (프레임으로 값을 치른다)
  ranged_note: "활·암기는 사거리를 위력으로 바꾼다 — skill_mechanics.yml ranged 사거리·탄약·엄폐 규칙 참조"
  unarmed_note: "권법가는 무기를 들지 않아도 초식이 나간다 (skill_mechanics taejo_jangkwon weapon_class [맨손, 권갑]). 맨손 1은 낮지만, 개화하면 발경이 그 값을 두 배로 만든다 — 권법의 값은 개화 이후에 온다"

  # 무공 위력 — 등급 사다리는 눌려 있다 (0·1·1·1·2). 의도된 것이다:
  #   무공 등급의 값은 '위력 보정'이 아니라 ① 판정에 들어가는 숙련 상한 ② 격의 개방 ③ 습득·소문의 무게에 있다.
  #   위력의 축은 격이다 — 같은 매화검법도 발경을 실으면 +1, 검기를 실으면 +2 다.
  technique_power: { 입문: 0, 삼류급: 1, 이류급: 1, 일류급: 1, 절정급: 2, 오의: "별도 설계" }

  # 격 위력 — 【정본】 내력을 태우면 아프다 (2026-07 정합의 핵심)
  #   근거: 절정 대 절정(내구 22) TTK 시뮬 — 외공기 6합 / 발경 5합 / 검기 5합 / 강기 4합 / 어검 4합.
  #         +1 은 피해를 +15% 움직인다. 이 이상 올리면 격을 쓴 쪽이 1~2합에 끝내 전투가 사라진다.
  #   형태별 실효값은 qi_manifestation.yml forms[].power 가 우선한다 (검기_참격 3, 강기_포 5 — 발출은 더 아프다).
  qi_power: { 외공기: 0, 발경: 1, 검기: 2, 강기: 3, 어검: 4, 심검: 5 }
  qi_power_note: "격 위력은 내력을 지불한 라운드에만 실린다. 지불이 끊기면 그 합의 피해는 외공기 값으로 떨어진다 (다운캐스트)"

  critical: "대성공 공격은 부상 단계 즉시 +1 (급소)"

durability:
  # 【정본】 이 세계의 '체력'. 바닐라 하트가 아니라 내구다 — 플레이어·NPC·짐승이 같은 눈금을 쓴다.
  #
  # 2026-07 생명 축 패스 — 세 줄 요약:
  #   ① 기본항(10 + 체력×2)은 그대로 두고 **경지·장비 항을 더했다** (대체가 아니라 확장).
  #      기본항을 건드리면 npcs/*.yml 의 등록 내구와 짐승이 전부 흔들린다. 확장은 공짜고 대체는 비싸다.
  #   ② 경지 보정은 **개화(일류)부터** 붙는다 — 단전이 열린 몸만 기혈이 두터워진다. 그 전엔 그냥 사람이다.
  #   ③ 피해는 **건드리지 않았다**. 격 사다리(외공기 0 → 심검 5)가 이미 내구 상승을 정확히 흡수한다
  #      (검산: 격을 실은 TTK 가 삼류~생사경 내내 5~6합으로 평평하다). 위력의 축은 여전히 격이다.
  formula: "round(10 + 체력 실수치 × 2 + 경지 보정 + 장비 보정)"
  base_formula: "round(10 + 체력 실수치 × 2)"   # 화후 규칙 — 절벽 감사 반영 (balance_audit_cliffs.md)

  # ─── 경지 보정 (기혈) — '개화한 몸' 의 값 ───
  # 눈금 +2/단계 = judgment.yml realm_gap_per_stage 와 같은 단위 (이 세계의 한 계단은 2다).
  # 근거: 일류 = "개화한 몸. 내력을 처음 쓰는 몸" (cultivation.yml). 몸이 바뀌는 것은 단전이 열린 뒤다 —
  #   삼류·이류는 무공을 배운 '사람'일 뿐이므로 보정 0. 강호의 신참이 맷집으로 이기지 않는다.
  # 검산: +2/단계가 격 사다리가 흡수할 수 있는 상한이다. +3 이면 절정 이상의 격 TTK 가 8합을 넘어 늘어진다.
  realm_bonus:
    범인: 0
    삼류: 0
    이류: 0
    일류: 2         # 개화 — 단전 개방. 여기서부터 몸이 달라진다
    절정: 4
    초절정: 6
    화경: 8
    현경: 10
    생사경: 12

  # ─── 장비 보정 — 【판단】 갑옷은 몸을 키우지 않는다 ───
  # 무협에 판금은 없다. 몸을 지키는 것은 호신강기이고, 철판이 아니다 (격 상성 원칙 2).
  #   → 외갑(무복·피갑·철갑)은 **경감**(equipment.yml armor.mitigation)에 남는다. 기존 축을 옮기지 않았다.
  #   → 내구를 올리는 것은 **안으로 스미는 것**뿐이다: 살에 닿는 내갑, 심장을 덮는 호심경, 몸을 바꾸는 영약.
  # 원천: equipment.yml vitality (등록부). 본 절은 상한만 갖는다.
  equipment_source: "equipment.yml vitality — 내갑·기물의 내구 가산 등록부"
  equipment_cap: 4   # 장비 유래 내구 총합 상한 (판정 보정 캡 2 와 같은 문법 — 장비는 격차를 만들지 않는다)
  equipment_note: "절정 기본 내구 26 에 +4 = +15%. 스파이크가 아니라 한 겹이다"

  # 영약(靈藥) — 장비가 아니라 몸이 바뀐다. 체력 '실수치'를 영구히 올린다 (등록제 · 양산 금지)
  elixir: "economy/기연 등록제 — 체력 실수치 영구 +N. 장비 캡에 계상되지 않는다 (몸이 된 것은 벗을 수 없다)"

  wound_thresholds:
    경상: { below_ratio: 0.5, penalty: -1 }
    중상: { below_ratio: 0.25, penalty: -2 }
    빈사: { at: 0, penalty: -3, note: "매 라운드 체력 판정 (비대립 보통 12), 실패 시 사망 위기" }
  note: "부상 페널티는 judgment.yml condition과 동일 값 — 전투 밖 판정에도 지속"
  # 문턱이 '비율'이라는 것이 HUD 설계를 결정했다 (docs/design/vitality.md):
  #   내구가 16 이든 42 이든 경상은 언제나 절반, 중상은 언제나 1/4 이다.
  #   → 하트를 10칸에 고정(setHealthScale)하면 경상 = 5칸, 중상 = 2.5칸 으로 **평생 같은 자리**에 선다.
  #     절대 하트였다면 그 선이 성장할 때마다 움직인다. 비율 표시는 타협이 아니라 이 규칙의 정확한 도구다.
  mc_display: "docs/design/vitality.md — 하트 10칸 고정 + 액션바 내구/부상. 바닐라 하트를 끄지 않는다 (팩 게이트)"

internal_energy:
  pool: "round(내공 실수치 × 3)"   # 화후 규칙 (internal_energy.yml 정본과 동일)
  detail: "config/internal_energy.yml 이 상세 정본 — 소모 밴드(외공기~오의), 경지 게이트, 선천진기"
  depleted: "'내공 고갈' 상태(-2) + 내공기는 다운캐스트('맨 기술'로 시전, 격 위력 0)"
  recovery: "운기조식 1구간당 max(내공×순도, 1) 회복. 전투 중 불가"
  skill_cost_rule: "【정본】 무공 초식 자체는 내력을 쓰지 않는다 (cost 0 = 외공 초식). 내력을 먹는 것은 '격'이다 — 초식에 발경·검기·강기를 얹는 순간 qi_manifestation.yml forms 의 코스트를 낸다. 예외: 절정+ 비전 초식은 검기를 품고 태어난다 (skill_mechanics cost 3)"
  skill_cost_rationale: "삼류·이류·일류의 무공이 내력을 요구하면 '배워도 못 쓰는 무공'이 된다 (삼류·이류 내력 풀 0). 초식과 격을 분리하면 그 모순이 구조적으로 사라진다 — 삼류 무인도 육합검을 끝까지 쓰고, 개화한 자는 같은 육합검에 발경을 싣는다"

escape:
  formula: "민첩+도주 vs 가장 빠른 추적자 (감각+추적)"
  surrounded_penalty: 2
  partial_success: "벗어나되 흔적/물건을 남긴다"

finish:
  options: [제압, 살해]
  살해_world_hooks:
    - "소문 강도 +1"
    - "시체 발견 시 관군 입력 +3 (관할_치안_중대사건)"
    - "소속 세력 '조직원_사망_또는_중상_확인' +4"
    - "유족·동료 기억 태그 (직접_경험 — 소멸 없음)"
  design_note: "죽이는 것은 언제나 더 쉽고, 언제나 더 비싸다"

