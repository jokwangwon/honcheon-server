# 전투 규칙 (기계 판독용)
# 기준 문서: docs/design/combat_system.md
# 전투 = 대립 판정의 연쇄. 판정식·등급·보정은 judgment.yml / gm_modifiers.yml 재사용.
#
# 2026-07 전투 정합 패스 (combat_audit 26위반) — 세 줄 요약:
#   ① 피해 공식에 '격 위력' 항을 넣었다. 내력을 태우면 아프다 (그전엔 발경이 장식이었다).
#   ② 무공 위력 사다리를 눌렀다 (0·1·1·1·2). 위력의 축은 등급이 아니라 격이다.
#   ③ 협공은 '포위 슬롯'으로 상한을 얻었다. 동시에 칠 수 있는 손은 세 개뿐이다.

initiative:
  ambush: "기습 판정 성공 시 선공 + 방어측 -2 (첫 라운드)"
  frontal: "민첩+감각 합 비교 — 높은 쪽 선공, 동률이면 경지 높은 쪽, 그것도 동률이면 감각 단독 비교, 최종 동률이면 '동시 교환'(양측 이번 라운드 피해를 서로 확정 — 선공 없음)"
  simultaneous_exchange: "완전 대칭 대결의 해소 규칙 — 선공이 승패를 결정하지 못하게 한다 (양측 동시 피해, 빈사도 동시)"
  overwhelm: "기대 마진 ±8 자동 처리 규칙 그대로 적용"

# ─── 실시간 시계 — '한 합(라운드)'이 몇 틱인가 (2026-07 내력 수지 패스에서 등록) ───
# 마인크래프트는 턴제가 아니다. 그래도 규칙은 '합'으로 쓰여 있다 (두름 유지비/합 · 조식/합).
# 그 둘을 잇는 환산이 **코드 상수**로만 있었다 (SkillEngine.DEFAULT_ROUND_TICKS — "config 등록 대기").
# 이제 등록부가 정본이다. 검산 도구가 "검기를 몇 초 두르는가"를 실제로 잴 수 있게 된 것도 이 한 줄 덕이다.
realtime:
  round_ticks: 60                # 1합 = 3초 (20틱 = 1초). 두름 유지비·조식의 과금 주기
  combat_window_ticks: 200       # 이만큼 공방이 없으면 '그 전투'는 끝 (오의 횟수·흐름 초기화)

actions_per_round: 1
actions: [공격, 방어_전념, 무공_시전, 거리_조정, 도주_시도, 말_걸기]
action_notes:
  방어_전념: "이번 라운드 방어 +2"
  말_걸기: "전투 중 협상 — 화술 판정, 실패 시 상대 공격에 -1 틈"

attack:
  attacker: "능력치 + 무공 숙련 + 보정(경지 격차/협공/환경/상태) + 2d6(플레이어) 또는 +7(NPC)"

  # 【등록】 '능력치'가 어느 능력치인가 — 지금까지 규칙이 말하지 않던 자리다 (2026-07 성장 축 패스).
  #   엔진(SkillListener)은 능력치 시트가 없어서 이 항을 통째로 빼고 돌고 있었다 —
  #   "MVT 근사: 능력치 시트가 없다 — 경지가 능력치의 자리를 대신한다".
  #   그래서 플레이어에게 **키울 것이 없었다.** 이 등록이 그 구멍을 메운다 (docs/design/growth_axes.md).
  #
  # ★★ 【병기가 능력치를 정한다】 — 성장 축 설계의 가장 무거운 판단이다.
  #   처음에는 '기본 = 근력' 하나로 두었다. growth_audit 이 그것을 **지배 전략**으로 잡아냈다:
  #     근력 하나가 ① 공격 판정 ② 막기 판정 ③ 경감 3 을 사고, 같은 과목(외공)이 체력(내구)까지 샀다.
  #     한 과목이 네 개의 값을 사면 나머지 넷은 장식이다 — 그리고 그것이 정확히 **노션 원설계의 병**이었다
  #     ("힘 = 공격력 3 + 체력 2"). 우리가 피하겠다고 한 바로 그 구조를 우리가 다시 지은 것이다.
  #   → 병기 계열이 능력치를 정하면 그 매듭이 풀린다. 그리고 이것은 밸런스 땜질이 아니라 **무협의 상식**이다:
  #     언월도는 허리로 내고, 쾌검은 손목으로 내고, 암기는 눈으로 낸다.
  #   → 귀결: **빌드가 병기를 고른다.** 신법(민첩)을 키운 자는 검을 들고, 외공(근력)을 키운 자는 도를 든다.
  #     무거운 병기는 위력이 크고(중병기 5), 눈의 병기는 작다(암기 2) — 위력과 능력치가 서로를 판다.
  attacker_attribute:
    근력: [도, 창, 봉, 부, 중병기, 월아산, 맨손, 권갑]   # 무겁다 — 허리와 어깨로 낸다
    민첩: [검, 단검, 겸, 구]                             # 빠르다 — 손목과 발끝으로 낸다
    감각: [활, 암기]                                     # 멀다 — 눈으로 낸다 (거리를 위력에서 뺀 대가)
    default: 근력                                        # 미등록 계열 — 몸으로 낸다
    note: "무공 숙련은 그대로 더해진다 (초식). 능력치는 '몸', 숙련은 '손' — 두 사다리가 같은 판정에 선다"
    weapon_power_ref: "위력은 damage.weapon_power 가 정본 — 능력치가 바뀌어도 위력표는 한 줄도 안 건드렸다"

  # 【등록 · B-005】 평타(무공 없는 손)도 위의 대립 판정을 탄다 — 예외가 아니라 기본값이다.
  #   그전엔 엔진(SkillListener.basicMelee)이 평타를 바닐라 피해 그대로 흘려보내서, 하필 **무공을
  #   안 배운 손**(강호의 가장 흔한 손)에 맞을 때만 방어자의 태세·마진·격이 통째로 무시됐다
  #   (docs/design/defense.md §8-5 의 청구서). 수치는 하나도 새로 짓지 않았다 —
  #   각 항이 어느 등록부의 것인지만 여기 적는다 (코드가 config 보다 앞서지 않는다).
  basic_strike_judgment:
    technique_power: 0            # 평타에는 초식이 없다 — damage.formula 의 '무공 위력' 항은 0 (짐승의 이빨과 같은 이유)
    mastery: 병기_기술            # '무공 숙련' 자리에는 들고 있는 병기의 주무공 숙련 — 막기·흘리기의 기술 항과 같은 값 (NPC 평타의 realmSkill 과 대칭)
    weapon_power: 바닐라_피해     # '무기 위력' 항은 바닐라 피해 그대로 — 연타 감쇠(공격 쿨다운)가 이미 실려 있어 다시 지으면 밸런스가 뒤집힌다
    qi_cost: "NPC 와 같은 셈 — 두름(검기·강기)은 유지비가 이미 냈고(0), 발경은 타격마다 밴드 코스트를 낸다 (내지 못하면 다운캐스트)"

  # 세 방어는 세 능력치다 — 이 대응이 곧 빌드의 뒷면이다 (attribute 키는 기계 판독용 신설, check 는 정본 서술)
  defender_choice:
    회피:
      check: "민첩 + 경공"
      attribute: 민첩
      skill: 경공
      weapon_safe: true            # 접촉이 없다 — 무기는 상하지 않는다 (원칙 2: 격은 회피를 부수지 못한다)
      note: "몸을 빼는 것에는 격이 없다. 대신 아무것도 얻지 못한다 (반격 창 없음)"
    막기:
      check: "근력 + 병기 기술"
      attribute: 근력
      damage_reduction: 3          # 성공 시 피해 -3 — 막기는 값을 갖는다 (2026-07 정합: 죽은 선택지였다)
      qi_soak: "상위 격도 막힌다 — 격의 위력만큼 무기가 대신 먹는다 (weapon_break 격돌 손상)"
      note: "막기는 무기를 태워 목숨을 산다 — 범철로 검기를 세 번 막으면 검이 부러지지만, 그 세 합은 살았다"
    흘리기:
      check: "감각 + 병기 기술"
      attribute: 감각
      damage_reduction: 1
      weapon_safe: true            # 접촉을 각도로 흘린다 — 격돌 판정 없음
      cost: "판정 -2 (어렵다). 정련 미만 무기로 상위 격을 상대하는 자의 길"
      penalty: -2                  # 기계 판독용 — cost 서술의 수치
  defender_bonus: "+2d6(플레이어) 또는 +7(NPC)"

  # ══════════════════════════════════════════════════════════════════════════
  # 【신설·등록】 마인크래프트에서 **누가 태세를 고르는가** — docs/design/defense.md
  #
  #   마인크래프트는 턴제가 아니다. 맞는 순간에 메뉴를 띄울 수 없다.
  #   그래서 태세는 **미리 서 있는 것**이고, **몸짓이 그것을 덮어쓴다**. 둘 다다.
  #
  #   ★ 몸짓을 새로 만들지 않았다. 바닐라 클라이언트가 **이미 가진 세 자세**를 그대로 읽는다:
  #     손을 세우면(방패·가드) 받아 내는 것이고, 몸을 낮추면 흘리는 것이고, 발이 이미 움직이면 빼는 것이다.
  #     새 입력 채널을 열지 않았다 — 이 세 자세는 플레이어가 이미 쓰고 있고, 남의 눈에도 보인다.
  #     (보이는 것 = 맞는 것 — 상대는 내 자세를 보고 다음 수를 고를 수 있다)
  #
  #   ★ 쿨다운 타이머가 없다. 태세를 막는 것은 **내력·자세·상황**이다 (MMO 문법 거부):
  #     · 회피 — 갑옷이 판다 (dodge_penalty). 포위되면 아예 사라진다 (forced_guard).
  #     · 막기 — 무기를 태운다 (weapon_break). 맨손에는 받을 것이 없다.
  #     · 흘리기 — 판정이 −2 다. 대신 어디서든 선다.
  # ══════════════════════════════════════════════════════════════════════════
  defender_stance_mc:
    # 우선순위 — 위가 이긴다. 몸이 말하는 것이 장부보다 앞서고, **행동(선언)이 자세(몸짓)보다 앞선다**
    #   (선언은 active_guard — 우클릭으로 세운 손. 세운 손은 웅크린 몸보다 최근의 뜻이다)
    precedence: [선언, 몸짓, 지정, 자동]

    # ① 몸짓 — 바닐라가 이미 가진 자세. 값은 Bukkit 술어 이름이다 (코드가 몸짓을 지어내지 않는다)
    gestures:
      막기: isBlocking      # 손을 세운다 (방패·가드) — 받아 낸다. 손이 이미 그러고 있다
      흘리기: isSneaking    # 몸을 낮춘다 — 각도로 흘린다
      회피: isSprinting     # 발이 이미 움직인다 — 몸을 뺀다

    # ② 지정 — `/혼천 태세 <회피|막기|흘리기|자동>`. 무인은 제 몸에 밴 태세가 있다
    pinned_command: "/혼천 태세"
    default: 자동

    # ③ 자동 — 몸이 아는 대로 (판정치 + 경감이 가장 높은 태세). Growth.bestStance
    auto: "판정치 + 경감이 가장 높은 태세를 몸이 저절로 고른다"

    # ★ 게이트 없음 — 삼류도 제 목숨을 본다. 방어는 내력이 아니라 **몸**이다
    #   (초식·격에는 경지 게이트가 있다. 방어에는 없다 — 게이트를 두면 삼류가 제 목숨을 영영 못 본다)
    no_realm_gate: true
    no_cooldown: true

    # ══════════════════════════════════════════════════════════════════════
    # 【신설·등록 · B-015】 능동 태세 — **맨 우클릭이 방어를 선언한다** (지금까지 비어 있던 손)
    #
    #   이것은 넷째 태세가 아니다 — 위 actions 절의 **방어_전념("이번 라운드 방어 +2 · 행동 소모")의
    #   MC 환산**이다. 턴이 없는 세계에서 '행동을 방어에 쓴다'는 이렇게 옮긴다:
    #     · 선언(우클릭) → 1합(realtime.round_ticks) 동안 태세 판정 +2, 태세는 막기로 선다
    #     · '행동 소모' → 선언 중에 공격하면 선언이 깨진다 (+2 와 공격을 동시에 가질 수 없다)
    #
    #   ★ no_cooldown 은 그대로 참이다 — 선언을 막는 것은 타이머가 아니라 **손**이다:
    #     손이 이미 올라가 있으면(선언 중 재클릭) 지속만 늘고 **패링의 시계는 되돌아가지 않는다**.
    #     패링을 다시 재려면 손을 내려야 한다 (만료 또는 공격) — 연타가 정답이 되지 못하는 이유다.
    # ══════════════════════════════════════════════════════════════════════
    active_guard:
      input: 우클릭                 # Shift 없이 · 손에 basic_strike 등록 계열만 (활·음식은 제 일이 있다 — 세계의 몫은 취소하지 않는다)
      stance: 막기                  # 선언이 세우는 태세 — 손을 세워 받아 낸다 (gestures.막기 와 같은 뜻, 맨손이면 박투로 받는다)
      commit_bonus: 2               # 기계 판독용 — 정본은 action_notes.방어_전념 "이번 라운드 방어 +2" (penalty 키와 같은 문법: 번역이지 발명이 아니다)
      commit_ticks_from: realtime.round_ticks   # '이번 라운드' = 1합. 값은 realtime 절이 정본 — 여기 다시 적지 않는다 (중복 등록부 금지)
      break_on_attack: true         # 행동 소모 — 공격(좌클릭·절기)하는 순간 선언이 깨진다
      # 패링 — 선언의 **앞머리**. 읽고 세운 손만 패링이다 (承의 창 window_ticks 10 과 같은 문법 — 창이 짧아야 '읽음'이다)
      parry_window_ticks: 6         # 0.3초. 이 안에 온 공격을 태세가 이기면 '패링' — 절기의 虛(패링·반격)가 열린다
      # 虛 가 열려 있는 시간 — 종전 SkillCast.COUNTER_WINDOW(코드 상수 12, "【배선 대기】")를 등록부로 승계.
      #   피격 후 창(맞은 뒤의 보상)이 아니라 **방어 성공 후 창**(막은 자의 권리)이다 — 그것이 B-015 의 병이었다
      opening_window_ticks: 12      # 패링·회피·방어 성공 뒤 이만큼 동안 절기의 虛 가 열린다
      openings_note: "패링 = 선언 앞머리에서 이긴 태세 · 회피 = 몸을 뺀 것(forced_guard.loses 의 태세)이 이긴 것 · 반격 = 어느 태세든 이긴 직후 (skill_mechanics cast_gate.허 의 낱말과 1:1)"

    # 판정 — attacker 총합 vs (태세 판정치 + defender_bonus). 마진 ≥ 0 이면 맞는다
    #   경감(damage_reduction)은 **마진과 무관하게** 든다 — 막는 것은 판정이 아니라 몸이다
    #   (그것이 회피(경감 0, 판정 높음)와 막기(경감 3, 판정 보통)가 다른 물건인 이유다)
    check_formula: "마진 = (공격 능력치 + 무공 숙련 + 보정 + 2d6/7) − (태세 판정치 + 2d6/7)"
    soak_rule: "피해 = 무기 + 무공 + 격 + floor(마진/2) − 태세 경감 − 갑옷 경감 (하한 0)"

    # ★ 무기 안전 — qi_manifestation.yml weapon_break.trigger 가 이미 적어 뒀다:
    #   "무기 접촉 격돌만 — 가드/패링/합. **회피·흘리기는 접촉이 없다**"
    #   → 막기 성공만 격돌 판정을 탄다 (범철로 검기를 세 번 막으면 검이 부러진다)
    weapon_clash_on: [막기]

    # ★★ 갑옷은 회피를 판다 — EquipmentEngine 이 이미 그렇게 적어 뒀다 (armorDodgePenalty).
    #   그런데 **아무것도 안 줬다**: 갑옷은 경공을 팔고 경감을 안 줬다 → 지금 갑옷은 손해만 본다.
    #   이 절이 그 반대급부를 배선한다. 수치는 equipment.yml 이 정본이다 (여기서 지어내지 않는다).
    armor:
      dodge_penalty_from: "equipment.yml armor.<계열>.dodge_penalty"    # 무복 0 · 피갑 −1 · 철갑 −2
      applies_to: [회피]                                                # 파는 것은 회피뿐이다
      mitigation_from: "equipment.yml armor.<계열>.mitigation"          # 무복 0 · 피갑 1 · 철갑 2 · 내갑 1
      mitigation_applies_to: 피해                                        # 태세와 무관하게 언제나 든다 (철판은 판정을 안 한다)
      pierced_from: "equipment.yml armor.mitigation_pierced_from"       # 강기 이상 앞에서 0 (검강 앞 피갑은 종이)
      gyeonggong_blocked: "gyeonggong.yml armor_gate — 철갑은 '경공_불가'. 회피의 경공 항이 0 이 된다"
      note: |
        갑옷의 거래: **경공(이동)과 회피(판정)를 팔아 경감을 산다.** 그리고 그 경감은 상위 격 앞에서 사라진다 —
        즉 갑옷은 **졸개에게 강하고 고수에게 무력하다**. 그것이 무협에 판금 기사가 없는 이유의 기계적 형태다.

    # 화면이 판정에 대해 거짓말하지 않는다 — 막았으면 막았다고, 흘렸으면 흘렸다고, 피했으면 피했다고.
    #   【등록제】 파티클 이름은 skill_motion.yml palette 의 것, 소리는 바닐라 키. 코드는 이름만 옮긴다.
    #   【팩 없이도 보인다】 파티클·소리·액션바 글자 — 셋 다 바닐라다 (팩 글리프에 기대지 않는다)
    vfx:
      회피:
        particle: cloud            # 지나간 자리의 먼지 — 몸이 빠졌다
        count: 8
        spread: 0.25
        sound: entity.player.attack.nodamage    # 헛친 소리
        pitch: 1.2
        label: "회피 — 몸을 뺀다"
      막기:
        particle: crit
        count: 10
        spread: 0.2
        sound: item.shield.block
        pitch: 0.9
        label: "막기 — 검으로 받는다"
      흘리기:
        particle: sweep_attack
        count: 2
        spread: 0.1
        sound: block.chain.hit
        pitch: 1.4
        label: "흘리기 — 흘려 넘긴다"
      실패:
        particle: smoke            # 태세가 무너졌다 — 그대로 들어왔다
        count: 4
        spread: 0.15
        sound: entity.player.hurt
        pitch: 1.0
        label: "태세가 무너진다"
      회피_봉쇄:
        label: "몸을 뺄 자리가 없다"      # 포위 — 신법 빌드가 제 대가를 화면으로 배우는 자리
      맨손_막기:
        label: "받을 것이 없다 — 맨손"    # 막기를 골랐는데 손이 비었다 (경감은 든다. 격돌만 없다)
      선언:                               # active_guard — 우클릭이 손을 세웠다 (선언은 남의 눈에도 보여야 한다: 보이는 것 = 맞는 것)
        particle: crit                    # 막기와 같은 먹(농묵) — 선언은 막기의 예고다. 다만 성기게 (막기 10 대 선언 3)
        count: 3
        spread: 0.3
        sound: item.shield.block          # 막기(pitch 0.9)와 같은 소리를 **높게** — 받은 것이 아니라 세운 것이다
        pitch: 1.6
        label: "방어 전념 — 손을 세운다"
      패링:                               # 선언의 앞머리에서 받아 냈다 — 절기의 虛 가 열렸다 (연출 본체는 skill_motion events.패링_성공)
        label: "패링 — 허가 열렸다"

  # ★ 성장 축의 뒷면 (docs/design/growth_axes.md): 방어 셋이 능력치 셋에 하나씩 걸려 있다.
  #   신법(민첩) → 회피 · 외공(근력) → 막기 · 심안(감각) → 흘리기.
  #   그리고 forced_guard 가 회피를 지운다 → **신법 빌드는 1대1의 왕이고 다구리에 벌거벗는다.**
  #   그것이 이 규칙이 지배 전략을 막는 방식이다 — 밸런스 수치가 아니라 상황이 축을 뒤집는다.

  # 협공 — 포위 슬롯 (2026-07 정합: 캡 3은 '보정 총량'만 막고 머릿수를 못 막았다)
  gang_up:
    per_extra_attacker: 1
    max: 2                         # 캡 3 → 2. engage_slots 3 의 귀결 (3인째가 마지막 손 = +2)
    engage_slots: 3                # 동시 교전 상한 — 한 표적을 동시에 칠 수 있는 것은 3인까지
    slot_note: "4인째부터는 '대기'(포위) — 앞선 자가 무력화·후퇴해야 슬롯이 열린다. 다구리에도 몸이 들어갈 자리가 필요하다"
    formation_override: "합격진은 등록 무공으로 슬롯을 연다 (party.yml 합격진 — 매화검진 슬롯 5)"
  outnumbered_defense:             # 1대다의 방어 이점 — 사방에서 오는 것은 서로의 검로를 막는다
    per_extra_attacker: 1
    max: 2
    applies_to: [회피, 막기, 흘리기]
    note: "적이 많을수록 그들끼리 걸린다. 포위의 값은 명중이 아니라 '도주 봉쇄'(party.yml 포위 -2)에 있다"
    # 【정본】 협공 보정(+1/인, 캡 2)과 이 방어 이점(+1/인, 캡 2)은 같은 눈금이다 → 판정 순보정은 0 이다.
    #   의도된 것이다: 머릿수는 '더 잘 맞히는 것'이 아니라 '더 많이 치는 것'이다(engage_slots).
    #   보정을 남겨두면 명중률 절벽 위에서 곱셈으로 터진다 (이류 4인의 절정 상대 명중률 2.8% → 16.7%).

    # 포위된 자의 태세 — 몸을 뺄 자리가 없다 (2026-07 정합 패스 ③)
    forced_guard:
      trigger_extra_attackers: 1   # 둘 이상에게 동시에 잡히는 순간부터
      loses: [회피]                 # 회피는 '몸을 빼는 것'이다 — 뺄 자리가 없으면 못 고른다 (피해 0 + 무기 안전을 잃는다)
      defense: 흘리기               # 남는 것은 받아넘기는 것 — 경감치(1)는 defender_choice.흘리기 가 정본
      waives: 판정_비용             # 흘리기의 -2 는 '고른 자'의 대가다. 강제당한 자는 물지 않는다
      also_allowed: 막기            # 막기(-3)를 고를 수는 있다 — 대신 무기가 격을 먹는다(weapon_break)
      audit_floor: 흘리기           # 【검산 규약】 감사는 경감이 가장 낮은 강제 태세로 잰다 — 방어자에게 인색해야 눈이 산다
      note: "사방이 막히면 피할 곳이 없다. 받아넘기거나(−1), 검으로 받거나(−3, 검이 상한다)"
      rationale: |
        고수가 다수를 상대로 사는 이유가 규칙 안에 있어야 한다. 그 답은 ① 슬롯(동시타 3) ② 판정 상쇄(순보정 0)
        ③ 경감(−1) 이지, 머릿수를 무의미하게 만드는 것이 아니다 — 졸개 다섯은 여전히 무섭다.
        경감을 막기(−3)로 잡으면 규칙이 뒤집힌다: 둘이 덤비는 것이 하나보다 덜 아파진다(총 피해 3.28 → 3.06).
        경감은 협공 1인분(약 3.3)보다 반드시 작아야 한다 — 그것이 −1 인 이유다.
  child_penalty: { 유년: -2, 소년: -1 }   # 성인 상대 (player_creation과 동일)

# ══════════════════════════════════════════════════════════════════════════
# 【신설·등록】 타격의 순간(打擊) — **맞는 쪽의 몸이 말한다**
#
#   2026-07 타격감 패스. 사용자 보고: "공격해도 전혀 바뀌는 게 없다 · 체감이 없다".
#   코드를 해부해서 나온 **사실** (가설이 아니다):
#
#   ① 시간 구조는 **있었다** — 그러나 **무공을 든 손에만** 있었다.
#      SkillListener.commit() 이 frames.startup() 만큼 기다렸다가 resolve() 를 부른다.
#      그런데 **무공 없는 손**(basic_strike — 강호의 가장 흔한 손)은 그 문을 지나지 않는다:
#      바닐라 피해가 클릭과 **같은 틱**에 나가고, 우리는 획(3D 궤적)만 얹었다.
#      등록부의 basic_strike.frames [선딜, 지속, 후딜] 은 **연출 길이로만** 쓰이고 있었다.
#   ② 히트스톱은 **없었다** — 코드 전체에 한 줄도 없다.
#   ③ 넉백은 **몹에게만**, 경직 10틱 이상일 때만 갔다 (SkillListener.stagger).
#      → **플레이어는 이 세계에서 한 번도 밀린 적이 없다.**
#   ④ 피격자의 화면은 **아무 말도 안 했다**. 사용자가 느낀 "시야가 살짝 휘청"은
#      **때린 쪽의 스윙 반동**(body.script 의 yaw/pitch)이지 맞은 것의 반응이 아니었다.
#
#   → 그래서 이 절은 **맞는 쪽**을 등록한다. 세 축이다: **멈춤 · 밀림 · 흔들림.**
#     타격감은 내 몸짓이 아니라 상대의 몸이 만든다.
impact:
  enabled: true

  # ① 히트스톱 — 맞는 순간 몇 틱이 얼어붙는다. **가장 싸고 가장 크게 먹힌다.**
  #   【MC 근사】 클라이언트의 프레임을 서버가 멈출 수는 없다. 대신 **속도를 0 으로 못질**한다
  #   (매 틱). 달리던 몸이 공중에서 멎고, 그 정지가 풀리는 순간 넉백이 터진다 — 멈췄다 → 날아간다.
  #   그 순서가 무게를 만든다 (동시에 하면 그냥 밀리는 것이고, 멈췄다 날아가면 '맞은' 것이다).
  hitstop:
    enabled: true
    # 격이 무게를 정한다 — 위력의 축(qi_power)과 **같은 사다리**다. 코드가 눈금을 지어내지 않는다
    by_grade: { 외공기: 2, 발경: 3, 검기: 4, 강기: 5, 어검: 6, 심검: 7 }
    freeze_target: true
    attacker_hold: true     # 때린 쪽의 다음 수도 그만큼 늦는다 (검이 살에 박힌다) — busyUntil 연장
    max_ticks: 8            # 【못】 이 이상 얼지 않는다. 오래 얼면 그것은 무게가 아니라 렉으로 읽힌다

  # ② 넉백 — 맞은 쪽의 몸이 뒤로 간다. **히트스톱이 풀리는 순간** 터진다
  knockback:
    enabled: true
    base: 0.34              # 수평 임펄스 (외공기 한 대의 값)
    per_qi: 0.10            # 격 한 칸마다 (외공기 +0 → 심검 +0.5)
    per_damage: 0.018       # 아픈 만큼 밀린다
    lift: 0.15              # 수직 성분 — 발이 뜬다 (뜨지 않으면 밀린 것이 안 보인다)
    max: 1.05               # 【못】 연출이 위치를 훔치면 안 된다 (외부 설계서 §12)
    applies_to_players: true   # 【고침】 옛 코드는 몹만 밀었다 — 플레이어는 맞아도 서 있었다

  # ③ 화면 흔들림 — **맞은 쪽의 시야**가 흔들린다 (때린 쪽이 아니라)
  #   【MC 근사】 setRotation 진동. 오프셋의 합이 **정확히 0** 이라 조준을 훔치지 않는다.
  #   ★ pitch 는 ±90 에서 잘린다(clamp) → 안전대 밖(하늘/발밑)에서는 **손을 뗀다**.
  #     SkillListener.turn() 이 이미 그 벽에 부딪혀 배운 것이다 (거기 주석이 정본).
  #   ★★ 【사용자 판정 · 2026-07-13】 **껐다.** "공격시 화면이 흔들려 **멀미가 발생**한다.
  #     화면 흔들림은 없애고 **앞뒤로 이동만 살려라**."
  #     시야를 흔드는 것은 무게가 아니라 **멀미**다. 무게는 **몸이 밀리는 것**(넉백)으로 말한다 —
  #     그것은 위(②)에 살아 있다. 카메라는 사람의 것이지 우리 것이 아니다.
  #     되살리려면 enabled: true 하나면 된다 (수치는 그대로 남겨 둔다).
  shake:
    enabled: false
    base_degrees: 1.7       # 외공기 한 대
    per_qi: 0.85            # 강기에 맞으면 목이 꺾인다
    per_damage: 0.09
    max_degrees: 7.0        # 【못】 65(안전대) + 7 = 72 < 90 — 벽에 닿지 않으므로 정확히 되돌아온다
    ticks: 3                # 진동 칸 수 (좌 → 우 → 원점). 감쇠 −0.55 배

  # ④ 【무공 없는 손도 시간 구조를 갖는다】 — 진단이 찾은 가장 큰 구멍
  #   basic_strike.frames 는 등록되어 있었는데 판정이 그것을 **안 읽었다**.
  #   이제 선딜만큼 실제로 벼렸다가 벤다: 검 2틱(0.1초) · 부 6틱(0.3초) · 중병기 7틱(0.35초).
  #   **선딜의 값은 '피할 수 있다'는 것이다** — 그 사이에 몸을 빼면 헛친다. 그것이 무게의 대가다.
  basic_startup:
    enabled: true
    reach_grace: 0.6        # 선딜 동안 상대도 움직인다 — 사거리에 이만큼 여유 (m). 인색하면 헛손질만 는다
    fx: true                # 기본 초식에도 **격의 타격음·타격 파티클**을 실어 준다 (그전엔 바닐라 소리뿐)

damage:
  formula: "무기 위력 + 무공 위력 + 격 위력 + floor(마진 / 2)"

  # 무기 위력 — 【등록제 정본】 병장기의 값. 맨손과의 거리가 곧 '무기를 든다'는 것의 의미다.
  #   코드가 config 보다 앞서지 않는다 — MVT/봇이 쓰는 무기 계열은 반드시 여기 등록되어야 한다.
  #   14계열: 맨손·권갑 / 암기 / 단검·봉·활·겸 / 검·도·창·월아산·구 / 중병기·부
  weapon_power:
    맨손: 1        # 권법·장법·박투·금나술의 기본값. 위력은 격에서 온다 (발경 +1 = 맨손이 두 배가 된다)
    권갑: 2        # 拳甲 — 맨손의 연장. 쇠를 덧댄 주먹은 병장기지만 검은 못 된다
    암기: 2        # 비수·표창 — 거리의 값을 위력에서 뺀다
    겸: 3          # 鎌 — 낫. 짧고 걸어채는 것
    단검: 3
    봉: 3
    활: 3          # 사거리 40 (skill_mechanics ranged) — 거리를 위력으로 바꾼다
    검: 4
    도: 4
    창: 4
    월아산: 4      # 月牙鏟 — 승병의 삽. 길고 무겁다
    구: 4          # 鉤 — 갈고리. 무장 해제·포박 연계
    중병기: 5
    부: 5          # 斧 — 도끼. 가장 무겁고 가장 느리다 (프레임으로 값을 치른다)
  ranged_note: "활·암기는 사거리를 위력으로 바꾼다 — skill_mechanics.yml ranged 사거리·탄약·엄폐 규칙 참조"
  unarmed_note: "권법가는 무기를 들지 않아도 초식이 나간다 (skill_mechanics taejo_jangkwon weapon_class [맨손, 권갑]). 맨손 1은 낮지만, 개화하면 발경이 그 값을 두 배로 만든다 — 권법의 값은 개화 이후에 온다"

  # 무공 위력 — 등급 사다리는 눌려 있다 (0·1·1·1·2). 의도된 것이다:
  #   무공 등급의 값은 '위력 보정'이 아니라 ① 판정에 들어가는 숙련 상한 ② 격의 개방 ③ 습득·소문의 무게에 있다.
  #   위력의 축은 격이다 — 같은 매화검법도 발경을 실으면 +1, 검기를 실으면 +2 다.
  technique_power: { 입문: 0, 삼류급: 1, 이류급: 1, 일류급: 1, 절정급: 2, 오의: "별도 설계" }

  # 격 위력 — 【정본】 내력을 태우면 아프다 (2026-07 정합의 핵심)
  #   근거: 절정 대 절정(내구 22) TTK 시뮬 — 외공기 6합 / 발경 5합 / 검기 5합 / 강기 4합 / 어검 4합.
  #         +1 은 피해를 +15% 움직인다. 이 이상 올리면 격을 쓴 쪽이 1~2합에 끝내 전투가 사라진다.
  #   형태별 실효값은 qi_manifestation.yml forms[].power 가 우선한다 (검기_참격 3, 강기_포 5 — 발출은 더 아프다).
  qi_power: { 외공기: 0, 발경: 1, 검기: 2, 강기: 3, 어검: 4, 심검: 5 }   # ★ 위력의 축 — 내력 수지 패스가 손대지 않은 정본
  qi_power_note: "격 위력은 내력을 지불한 라운드에만 실린다. 지불이 끊기면 그 합의 피해는 외공기 값으로 떨어진다 (다운캐스트)"

  critical: "대성공 공격은 부상 단계 즉시 +1 (급소)"

durability:
  # 【정본】 이 세계의 '체력'. 바닐라 하트가 아니라 내구다 — 플레이어·NPC·짐승이 같은 눈금을 쓴다.
  #
  # 2026-07 생명 축 패스 — 세 줄 요약:
  #   ① 기본항(10 + 체력×2)은 그대로 두고 **경지·장비 항을 더했다** (대체가 아니라 확장).
  #      기본항을 건드리면 npcs/*.yml 의 등록 내구와 짐승이 전부 흔들린다. 확장은 공짜고 대체는 비싸다.
  #   ② 경지 보정은 **개화(일류)부터** 붙는다 — 단전이 열린 몸만 기혈이 두터워진다. 그 전엔 그냥 사람이다.
  #   ③ 피해는 **건드리지 않았다**. 격 사다리(외공기 0 → 심검 5)가 이미 내구 상승을 정확히 흡수한다
  #      (검산: 격을 실은 TTK 가 삼류~생사경 내내 5~6합으로 평평하다). 위력의 축은 여전히 격이다.
  formula: "round(10 + 체력 실수치 × 2 + 경지 보정 + 장비 보정)"
  base_formula: "round(10 + 체력 실수치 × 2)"   # 화후 규칙 — 절벽 감사 반영 (balance_audit_cliffs.md)

  # ─── 경지 보정 (기혈) — '개화한 몸' 의 값 ───
  # 눈금 +2/단계 = judgment.yml realm_gap_per_stage 와 같은 단위 (이 세계의 한 계단은 2다).
  # 근거: 일류 = "개화한 몸. 내력을 처음 쓰는 몸" (cultivation.yml). 몸이 바뀌는 것은 단전이 열린 뒤다 —
  #   삼류·이류는 무공을 배운 '사람'일 뿐이므로 보정 0. 강호의 신참이 맷집으로 이기지 않는다.
  # 검산: +2/단계가 격 사다리가 흡수할 수 있는 상한이다. +3 이면 절정 이상의 격 TTK 가 8합을 넘어 늘어진다.
  realm_bonus:
    범인: 0
    삼류: 0
    이류: 0
    일류: 2         # 개화 — 단전 개방. 여기서부터 몸이 달라진다
    절정: 4
    초절정: 6
    화경: 8
    현경: 10
    생사경: 12

  # ─── 장비 보정 — 【판단】 갑옷은 몸을 키우지 않는다 ───
  # 무협에 판금은 없다. 몸을 지키는 것은 호신강기이고, 철판이 아니다 (격 상성 원칙 2).
  #   → 외갑(무복·피갑·철갑)은 **경감**(equipment.yml armor.mitigation)에 남는다. 기존 축을 옮기지 않았다.
  #   → 내구를 올리는 것은 **안으로 스미는 것**뿐이다: 살에 닿는 내갑, 심장을 덮는 호심경, 몸을 바꾸는 영약.
  # 원천: equipment.yml vitality (등록부). 본 절은 상한만 갖는다.
  equipment_source: "equipment.yml vitality — 내갑·기물의 내구 가산 등록부"
  equipment_cap: 4   # 장비 유래 내구 총합 상한 (판정 보정 캡 2 와 같은 문법 — 장비는 격차를 만들지 않는다)
  equipment_note: "절정 기본 내구 26 에 +4 = +15%. 스파이크가 아니라 한 겹이다"

  # 영약(靈藥) — 장비가 아니라 몸이 바뀐다. 체력 '실수치'를 영구히 올린다 (등록제 · 양산 금지)
  elixir: "economy/기연 등록제 — 체력 실수치 영구 +N. 장비 캡에 계상되지 않는다 (몸이 된 것은 벗을 수 없다)"

  wound_thresholds:
    경상: { below_ratio: 0.5, penalty: -1 }
    중상: { below_ratio: 0.25, penalty: -2 }
    빈사: { at: 0, penalty: -3, note: "매 라운드 체력 판정 (비대립 보통 12), 실패 시 사망 위기" }
  note: "부상 페널티는 judgment.yml condition과 동일 값 — 전투 밖 판정에도 지속"
  # 문턱이 '비율'이라는 것이 HUD 설계를 결정했다 (docs/design/vitality.md):
  #   내구가 16 이든 42 이든 경상은 언제나 절반, 중상은 언제나 1/4 이다.
  #   → 하트를 10칸에 고정(setHealthScale)하면 경상 = 5칸, 중상 = 2.5칸 으로 **평생 같은 자리**에 선다.
  #     절대 하트였다면 그 선이 성장할 때마다 움직인다. 비율 표시는 타협이 아니라 이 규칙의 정확한 도구다.
  mc_display: "docs/design/vitality.md — 하트 10칸 고정 + 액션바 내구/부상. 바닐라 하트를 끄지 않는다 (팩 게이트)"

internal_energy:
  pool: "round(내공 실수치 × 3)"   # 화후 규칙 (internal_energy.yml 정본과 동일)
  detail: "config/internal_energy.yml 이 상세 정본 — 소모 밴드(외공기~오의), 경지 게이트, 선천진기"
  depleted: "'내공 고갈' 상태(-2) + 내공기는 다운캐스트('맨 기술'로 시전, 격 위력 0)"
  recovery: "운기조식 1구간당 max(내공×순도, 1) 회복. 전투 중 불가"
  skill_cost_rule: "【정본】 무공 초식 자체는 내력을 쓰지 않는다 (cost 0 = 외공 초식). 내력을 먹는 것은 '격'이다 — 초식에 발경·검기·강기를 얹는 순간 qi_manifestation.yml forms 의 코스트를 낸다. 예외: 절정+ 비전 초식은 검기를 품고 태어난다 (skill_mechanics cost 3)"
  skill_cost_rationale: "삼류·이류·일류의 무공이 내력을 요구하면 '배워도 못 쓰는 무공'이 된다 (삼류·이류 내력 풀 0). 초식과 격을 분리하면 그 모순이 구조적으로 사라진다 — 삼류 무인도 육합검을 끝까지 쓰고, 개화한 자는 같은 육합검에 발경을 싣는다"

escape:
  formula: "민첩+도주 vs 가장 빠른 추적자 (감각+추적)"
  surrounded_penalty: 2
  partial_success: "벗어나되 흔적/물건을 남긴다"

finish:
  options: [제압, 살해]
  살해_world_hooks:
    - "소문 강도 +1"
    - "시체 발견 시 관군 입력 +3 (관할_치안_중대사건)"
    - "소속 세력 '조직원_사망_또는_중상_확인' +4"
    - "유족·동료 기억 태그 (직접_경험 — 소멸 없음)"
  design_note: "죽이는 것은 언제나 더 쉽고, 언제나 더 비싸다"

# NPC 대 NPC 약식 규칙 (F6) — 플레이어 미개입 전투
npc_vs_npc:
  power: "능력치 + 기술 + 격 위력 + 상태 보정 + 협공 + 7 (양측 고정, 주사위 없음)"
  bands:
    접전: { gap: [0, 1], effect: "양측 소모 — 라운드마다 양측 내구 소폭 피해" }
    우세: { gap: [2, 4], effect: "열세측만 피해, 우세측 경미" }
    압도: { gap: [5, null], effect: "열세측 즉시 부상 단계 상승, 수 라운드 내 종결" }
  player_intervention: "플레이어가 개입하는 순간 그 지점부터 정식 판정 전환"
