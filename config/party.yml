# 동행(파티)·협동 규칙 (기계 판독용)
# 기준 문서: docs/design/party_and_cooperation.md
# 원칙: 파티는 편의 기능이 아니라 관계다 — 세계는 무리를 하나의 소문 주체로 본다

formation:
  precondition: "출도 이후만 — 서장(개인 시간축)에서는 동행 불성립 (시간축 모델 정합)"
  tiers:
    동행: { max_size: 5, form: 선언, dissolve: 자유 }
    결의: { form: "의식 (등록 이벤트, 장소 필요)", betrayal_brand: 배의 }
    사제: { rule: "training.yml 사사 그대로 — 스승 기술 우위 필요, 효율 1.0 (경지 2단 우위 시 1.2)" }
  beyond_5: "세력 규칙의 영역 (표국·문파)"

# ─── 협력 판정 3형 ───
cooperative_checks:
  조력:                            # 한 명이 하고 나머지가 돕는다 (기본형)
    bonus_per_helper: 1
    helper_requires: "해당 기술 1+ 보유"
    cap: 2                         # 상황보정 캡 ±5 내 계상
    unskilled_helper: "보정 없음, 리스크만 공유"
  전원형:                          # 은신·잠입·도주 — 전원이 성공해야 하는 일
    resolution: "판정 1회, 실행력 = 최약자 기준"
    size_penalty: { from: 4, value: -1 }
    intent: "무리는 가장 서툰 발소리만큼 조용하다 — 혼자가 유리한 일이 존재해야 한다"
    failure_attribution: "부수 리스크·발각은 '무리 전체' 귀속 (개인 탓 금지 — 동행은 운명 공동체), 서사 표현만 최약자 시점 우선"   # F20 — PT-007
  분담:                            # 동시에 다른 일을
    resolution: "각자 판정, 같은 구간 소모 — 실패는 각자의 것, 결과는 모두의 것"

# ─── 협공과 합격진 ───
# 2026-07 전투 정합 패스 (combat_audit ⑥): 캡 3 은 '개별 보정'만 막고 **머릿수 누적**을 막지 못했다.
#   병: 도적 5인 매복이 이류 무인을 1합에 눕혔다. 3인만 모여도 동급 상대와의 전투가 2합에 사라졌다.
#       그리고 캡 +3 은 '명중률 절벽' 위에서 곱셈으로 터졌다 (이류→절정 명중 2.8% → 27.8%, 10배).
#   약: ① 포위 슬롯 — 한 표적을 동시에 칠 수 있는 손은 3개뿐이다 (combat.yml gang_up.engage_slots).
#           4인째부터는 대기(포위). 머릿수는 '교대'가 되지 '동시타'가 되지 않는다.
#       ② 캡 3 → 2 (슬롯 3의 귀결 — 3인째가 마지막 손 = +2).
#       ③ 1대다 방어 이점 — 다수를 상대하는 자는 방어 판정 +1/추가 적 (캡 +2). 사방의 검은 서로를 막는다.
#   남는 값: 포위의 진짜 무기는 명중이 아니라 '도주 봉쇄'(-2)다. 다구리는 죽이는 게 아니라 가두는 것이다.
combat_coop:
  협공_보정: { per_attacker: 1, cap: 2 }   # npc_vs_npc 협공과 동일 문법 (cap 3 → 2)
  포위:
    target_escape_penalty: -2
    engage_slots: 3                # combat.yml attack.gang_up.engage_slots 와 동일 정본
    slot_note: "슬롯 밖 인원은 대기 — 앞선 자가 무력화·후퇴해야 들어간다. 그 대신 도주를 막는다"
  피포위_방어_이점: { per_extra_attacker: 1, cap: 2, applies_to: [회피, 막기, 흘리기] }
  합격진:                          # 훈련된 협공 — 등록제 무공 (카탈로그 규칙 전부 적용)
    rule: "같은 진법 숙련자끼리만 — 습득(문파 비전 사사)·숙련·경지 게이트"
    example_maehwa_geomjin:
      faction: hwasan
      size: [2, 5]
      effect: { 협공_상한: 4, 포위_슬롯: 5 }   # 진법이 슬롯을 연다 — 이것이 진법의 값이다 (평협공은 3인이 한계)
      break_condition: "성원 1인 무력화 시 진 붕괴 (라운드 종료까지 전원 -1)"
    counter: "진 견식자는 '진 눈(眼)' 파훼 판정 가능"
    design_note: "문파 비전 진법의 값 = 보정 +2가 아니라 '다섯이 동시에 벨 수 있다'는 것. 오합지졸은 셋까지다"
  mc: { 협공: "근접 아군 수 자동 계상 (슬롯 점유 = 위치 판정)", 합격진: "파티 스킬 슬롯 — 진주(리더) 발동 + 성원 위치 조건" }

# ─── 시간 동기화 ───
time_sync:
  same_scene: "같은 시계 — 구간 동기화 (가장 느린 행동 기준)"
  turn_order: "장면 단위 선언 라운드 (선언 자유 순서, 해소는 엔진 일괄)"
  split: "흩어지면 개인 구간 분리 — 재합류는 약속 선언 ('해질녘 객잔에서')"
  no_waiting: "분리 중 사건은 각자 진행 (deadline 규칙 그대로) — 세계는 기다려주지 않는다"

# ─── 분배 ───
distribution:
  성장: "분배 없음 — 화후는 각자 쓴 무공에 쌓인다 (무경험치 설계의 귀결)"
  버스_차단: "combat_hwahu 압도적 하수 ×0 규칙 파티 동일 적용 — 고수 옆 저격은 배움이 없다"
  마크: "개별 기여 기준 — 사선 마크는 실제로 사선에 섰던 자의 것"
  공적_favor: "세력이 본 대로 — 보고자에게 크게, 동행에게 나머지 (누가 나서는가도 선택)"
  전리품: "시스템 분배 없음 — 협의 원칙, 다툼은 그대로 플레이"
  파티_명성: "무리 = 소문 주체 ('그 삼인조') — 파티 별호는 등록 명명"

# ─── 배신 — 시스템은 금지하지 않는다, 세계가 청구한다 ───
betrayal:
  allowed: [동행_중_공격, 전리품_독식, 정보_매도]
  price:
    - "목격·생존자 경유 소문 (비열 행위 문법 동일)"
    - "결의 위반 = '배의' 낙인 — 정파 favor 하락, 결의 문화권 NPC 저항 +2"
    - "개입 기록 — 피해자의 회수 루프는 NPC 생애와 동형"
  비무_보호: { declared: true, effect: "사선 아님 — 부상 경상 상한, 사선 마크 미발생" }
  pvp: "공유 세계 상시 가능 — 안전 지역(관아·문파 내부) 예외 (location_safety)"

# ─── MC 매핑 ───
mc:
  ui: "탭리스트 그룹핑 + 사이드바 동행 상태 (내구·원기 요약 — 파티원만)"
  friendly_fire: { 스킬: 면제, 오의_광역: 예외 }   # "매화만개 앞에서는 아군도 물러선다"
  commands: "초대/해산 = 채팅 명령 + GUI, 결의 = 의식 장소 등록 이벤트"
