# GM 상황 보정 가드레일 (기계 판독용 — LLM GM 프롬프트 자료)
# 기준 문서: docs/design/gm_modifier_guide.md
# 설계 검토 공백 G5 해결

principles:
  - "근거 없는 보정 금지 — 모든 보정은 이 파일의 항목을 인용"
  - "중복 가산 금지 — 같은 사실은 한 번만"
  - "상황 보정 합계 캡 ±5 (judgment.yml과 동일)"
  - "보정 내역은 내부 로그에 기록, 플레이어 출력에 수치 노출 금지"

preparation:
  "+1": "구체적인 방법 선언"
  "+2": "방법 + 사전 행동으로 만든 이점 (답사, 변장, 내통자)"
  "0": "수식어만 ('조심스럽게', '잘')"

information:
  per_key_clue: 1
  max: 2
  key_clue_definition: "세계 상태에 기록된 clue 태그를 대사/행동에 명시적으로 사용한 것"
  fake_clue_penalty: "미획득 단서를 아는 척 → 상대 의심도 +1"

# 환경 보정표 — 행동 유형별 부호. 한 판정에 환경 항목 최대 2개
environment:
  어둠:        { 은신: +2, 미행: +1, 엿듣기: 0, 관찰: -2, 기습: +2, 추적: -1 }
  소음:        { 은신: +1, 미행: +1, 엿듣기: -2, 관찰: 0, 기습: +1, 추적: 0 }
  군중:        { 은신: +1, 미행: +1, 엿듣기: -1, 관찰: -1, 기습: -1, 추적: -2 }
  비_눈:       { 은신: +1, 미행: 0, 엿듣기: -1, 관찰: -1, 기습: 0, 추적: -2, 흔적_추적: +2 }
  탁_트인_지형: { 은신: -2, 미행: -2, 관찰: +1, 기습: -2, 추적: +1 }
  엄폐물_풍부:  { 은신: +2, 미행: +1, 엿듣기: +2, 관찰: 0, 기습: +1, 추적: 0 }
  관군_순찰_강화: { 은신: -1, 미행: -1, 엿듣기: -1, 관찰: 0, 기습: -1, 추적: 0 }   # 치안 > 70 연동

condition_fixed: "judgment.yml condition 값 그대로 (경상 -1, 중상 -2, 빈사 -3, 피로 -1, 내공_고갈 -2)"

realm_gap:
  per_stage: 2
  applies_to: [전투, 기습, 경공_추격, 기세_대결]
  never_applies_to: [설득, 조사, 정보_수집, 상술]

npc_side_rule: "경계도/의심도/목적 집중/심리는 세계 상태에 기록된 값만 사용. 즉석 부여 금지"

log_schema:
  judgment: "행동 유형"
  player_side: { base: "능력치+기술", modifiers: "[{근거: 값}]" }
  npc_side: { base: "NPC 능력치+기술", state: "{경계도, 의심도}" }
  roll: "2d6 결과"
  margin: "마진"
  result: "등급 id"
  side_risk: "아슬아슬한 성공 시 선택한 리스크"
