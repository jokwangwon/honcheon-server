    truth: "★ 이 시나리오가 왜 무림에 상설 지휘부가 없는지를 매번 다시 증명한다"
    player_seat: "배분 협상의 사자 역할 (화술 판정) / 어느 문파 편에 서는가 = 다음 시대의 relation 을 정한다"

  # ── ⑥ 혈교의 발호 — ★ 관무불가침이 **필요 없어지는** 유일한 사건
  hyeolgyo_outbreak:
    name: "혈겁(血劫)"
    ref: "faction_reaction.yml blood_debt.ladder · faction_entry_routes.yml hyeolgyo_contamination"
    logic: |
      ★ 다른 다섯 시나리오는 전부 **관과 무림이 서로를 볼 때** 생긴다.
        이 하나만 다르다 — 관과 무림이 **같은 곳을 본다.**
        그래서 이 시나리오는 억지 균형을 깨지 않는다. 억지가 **작동할 필요가 없어질 뿐이다.**
      ★ 그리고 그 표적은 대개 **플레이어다.**
    causes: [혈교_오염자의_연쇄_살인, 인신공양_의식, 마병_각성, 혈교_잔당_회수조의_확산]
    stages:
      1_흉흉함:
        state: "혈채(현) 1~5. 명분 0 — **아직 명분이 아니다.** 관의 수사와 흉흉한 소문뿐"
        gwan: "수배 (npc_death official_response). 법명분 0 — 개인의 죄에 국가의 명분은 필요 없다"
        murim: "★ **아무도 오지 않는다.** victims = [mingan] (blood_debt_ignition.the_indifference)"
        player_option: "★ 여기서 멈추면 아무 일도 없다. 세계는 잊는다 — 다만 **몸은 잊지 않는다**
          (암혈채는 감쇠 없음 → 갈증은 계속 자란다. **멈추는 것이 가장 어려운 선택이다**)"
      2_금기_발각:
        event: "금기_마공_사용_확인 (+5, 금기) — 운기 색이 목격됐거나, 시신에 흔적이 남았다"
        state: "명분 13 (무고 8 + 금기 5). 금기 태그(-4) 발화 → 참여 3~5 = **소연합 = 토벌대**"
        gwan: "사교_준동_확증 (법명분 16) → '15~24': 관이 쳐도 무림이 안 붙는다 = **무림이 박수친다**"
        turning_point: "★ 여기가 되돌아올 수 있는 마지막 칸이다 (simbeop magong.redemption)"
      3_의식_발각:
        event: "인신공양_의식_발각 (+9, 금기·무고)"
        state: "명분 22 · 두 태그 동시 감응 → 참여 6~8 = **대연합 = 지역권 전쟁(6단계)**"
        note: "★ 관은 여전히 무림을 치지 않는다 — 무림이 관의 일을 대신 해 주고 있으므로"
      4_발호:
        event: "혈채 26+ — 사교_대발호 (법명분 30)"
        state: "즉시 칙명 → defense_burden 해제 → 황실 정규군 원정력 21.
          동시에 무림공적 선포 (참여 10+, martial 70+)"
        outcome: "★ **이길 수 없다.** 그리고 이길 수 없어야 한다"
        why_not_rupture: |
          ★ 관무불가침은 여기서 **깨지지 않는다.** 검산:
            · 관의 표적 = 개인 (문파가 아니다) → 무림 명분 입력이 생기지 않는다 (관의_문파_토벌 = 미발화)
            · 관은 overreach 하지 않는다 → 연좌할 문파가 없다 (blood_debt_ignition.gwan_side.no_overreach)
            · 무림은 관을 칠 명분이 없다 (관이 잘못한 게 없다) → murim_cannot_strike_first 그대로
          → 두 축이 **같은 방향으로** 굴러간다. 억지 균형은 손도 대지 않은 채 유지된다
    magyo_seat:                      # ★ 마교는 이 판에서 무엇을 하는가
      relation: "magyo ↔ hyeolgyo = -3 (숙적. 혈교는 마교를 기습한 적이 있다)"
      act: "★ 마교는 **혈교 토벌에 협조하지 않는다.** 대신 **혈교 오염자를 회수한다** —
        발호 전에, 조용히. '그 힘을 버려라. 우리가 다른 길을 준다'
        (simbeop magong.redemption.①_전향 — 마도→마도 carry_over 0.9, 가장 싼 개심)"
      profit: "관무가 혈교를 치느라 소모하는 동안 마교는 빈 자리를 먹는다
        (magyo_deception.resolution_gate.on_failure 와 같은 문법)"
      truth: "★ 이것이 '혈교라는 바닥이 있어야 마교가 유혹이 된다'의 정치적 실물이다.
        가장 어두운 곳에서 손을 내미는 것은 **덜 어두운 어둠**이다"
    player_seat:
      - "★ 당사자: 이 시나리오의 주인공은 **대개 플레이어다** (murim_first_strike 와 대칭)"
      - "은폐: 3변수(목격·시신·증거)를 낮춰 현혈채를 0으로 유지한다 —
        ★ **암혈채는 그래도 자란다.** 완전 범죄는 소문을 지우지 갈증을 지우지 못한다"
      - "전향: 마교의 손을 잡는다 (가장 싼 길. 그리고 여전히 어둠이다)"
      - "개심: 산공 + 해주 + 자수 (가장 비싼 길. 주화입마 판정 — **도박이다**)"
      - "발호: 끝까지 간다 → 세계 전체가 온다. ★ 캐릭터 종결 (death_and_legacy 로 이관)"
      - "★ 사냥꾼 좌석: **다른 플레이어의 혈교 루트가 이 세계의 최대 명분이 된다** —
        정파 루트 플레이어에게 이보다 좋은 이야기는 없다 (연합 기여 = 참여 세력 전체 favor +2)"

  # ── ⑦ 새외의 침공 — ★ 억지가 **잠시 자는** 사건 (깨지는 것이 아니다)
  saeoe_invasion:
    name: "북풍(北風)"
    ref: "deterrence.frontier · myeongbun.inputs 새외 3줄 · myeongbun.tags.외적"
    logic: |
      ★ ⑥(혈교 발호)과 짝이다. 둘 다 관과 무림이 **같은 곳을 본다.**
        그러나 ⑥은 표적이 개인이라 끝나면 아무것도 안 남고,
        ⑦은 표적이 군대라 **관이 무림에게 빚을 진다.** 그 빚이 다음 시대다.
      ★ 그리고 ⑦의 진짜 무서움은 침공이 아니다 — **defense_burden 이다.**
        국경이 조용해지는 것이, 국경이 무너지는 것보다 무림에게 위험하다 (burden_dynamics)
    causes: [기근_초원의_겨울, 대칸의_교체, 조공_중단, 해금_강화로_왜구_격화, 마교의_사주]
    stages:
      1_변경:
        event: "새외_기병_변경_약탈 (+4, 무고·생계)"
        state: "명분 4. ★ **아무도 안 온다.** 개방(8-3-3=2 ≤ 4)만 반응 → 규탄 (참여 1)"
        gwan: "변군이 막는다. burden 0.75 → 0.85 (변경_긴장) — ★ 관도 순찰이 준다"
        murim: "★ '북쪽 일이다.' 화산은 임계 10 > 4 → 안 온다. **국경은 나라의 일이다**"
        side_effect: "★ 녹림·수로채가 큰다 (관의 손이 국경에 묶였으므로). 사파 루트 플레이어에게는 **호재**다"
      2_돌파:
        event: "새외의_관내_진입_확증 (+8, 외적·무고) — ★ **외적 태그가 켜진다** (requires_breach 충족)"
        state: "누적 명분 12. 외적(-6) + 무고(-3) → 변경 문파는 인접(-4)까지 겹친다:
          모용 29-6-3-4=16 > 12 → ★ 아직 안 온다. 팽가 14-6-3-4=1 ≤ 12 → **온다**. 개방 → 온다.
          → 참여 2~3 = 규탄~소연합. ★ **여전히 작다.** 그리고 그것이 옳다"
        gwan: "burden 0.95 → 원정력 1.5. ★ **관이 무림에 손을 댈 수 없다**"
        note: "★ 여기가 갈림길이다 — 관이 막아내면 끝이고, 못 막으면 3단계다"
      3_산문:
        event: "새외의_문파_공격 (+10, 외적·무림침해·존망) — ★ **산문이 불탔다**"
        state: "누적 명분 22 · 세 태그 동시(외적 -6 + 무림침해 -2 + 존망 -8 … 최대치 적용 규칙은 tags 표 그대로).
          ★ 그리고 **victims 에 문파가 들어간다** → 피해_당사자(즉시) → 동맹(-6) → anchor(-2) 연쇄
          → 참여 8~12 = **대연합**"
        truth: "★★ 촌민 수백이 죽어도 안 뭉친 무림이, **산문 하나**에 뭉친다.
          blood_debt_ignition.②_무림의_피가_섞이는_순간 과 **글자 그대로 같은 규칙**이다 —
          이 세계는 이 잔인함을 두 번 반복해서 보여준다. 우연이 아니다"
        gwan: "★ **징집(conscription)** — 관이 무림을 부른다. 세계에서 가장 큰 종이 한 장"
      4_후유증:
        event: "전쟁이 끝난다 — 이겼든 졌든"
        outcome: { ref: deterrence.frontier.conscription.aftermath }
        truth: "★ 이 시나리오의 요점은 3단계가 아니라 **4단계**다.
          새외는 물러간다 (외적 태그의 정의대로 — 그들은 약탈하고 돌아간다).
          ★ 남는 것은 **관과 무림이 서로에 대해 새로 알게 된 것**이다. 그것이 다음 시대를 정한다"
    magyo_seat:
      relation: "bukmak ↔ magyo = +1 (거래 — 대칸이 흑성의 땅을 빌려주었다)"
      act: "★ 마교는 대칸을 **부추긴다.** 싸우지 않는다 — **사주(使嗾)** 한다.
        (magyo_deception 의 문법 그대로: '마교는 관도 무림도 이길 수 없다. 그러나 둘이 싸우게 만들 수는 있다'
         — 여기서는 **셋이** 싸우게 만든다)"
      profit: "관·무림·북막이 서로를 갈아 놓는 동안 마교는 빈 자리를 먹는다"
      tell: "★ 대칸의 막사에 중원말을 하는 자가 있다 — 그것을 본 사람은 변군의 척후뿐이다.
        ★ 그리고 그 척후가 관군 루트 플레이어일 수 있다 (gwangun_entry.gates.군진_입대.hook)"
    player_seat:
      - "★ 변경: 군진_입대(가욕관 46일 · 대동 25일)가 이 시나리오의 **관람석이자 최전선**이다.
        이미 배선돼 있다 — faction_entry_routes gwangun_entry.gates.군진_입대"
      - "★ 통역: 새외 무공을 익힌 자만이 그들의 말을 안다. **적의 언어를 아는 자는 첩자로 의심받는다**
        (saeoe_common.귀환의_값) — 가장 쓸모 있는 자가 가장 안 믿긴다"
      - "★ 밀정: 새외와_결탁_증거(+9). 수로채가 왜구의 물건을 나른다 (dongyeong ↔ jangang_suroche +1) —
        그 증거를 쥐면 **사파 전체의 존망**을 손에 쥔 것이다"
      - "★ 사파 좌석: 1~2단계는 사파의 **황금기**다. 관의 손이 풀렸다. 그리고 3단계가 오면 그들도 죽는다"
      - "★ 징집 거부: 벌하지 않는다. 다만 강호가 기억한다 — favor 는 안 깎이고 **눈빛만 바뀐다**"

