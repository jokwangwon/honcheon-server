  혈채_6_14:  "★ 아이를 불러들인다. 문에 빗장 소리가 는다. 그리고 **낯선 이가 친절하다** —
               세계가 등을 돌리는 칸에서 어둠이 손을 내민다. 이것이 유일한 경고다"
  혈채_15_25: "산문이 열리고 제자들이 내려온다. 관아가 방을 붙인다. 두 방(榜)에 같은 이름이 있다"
  혈채_26_30: "★ 북쪽에서 흙먼지가 온다. 그것은 무림이 아니다"
