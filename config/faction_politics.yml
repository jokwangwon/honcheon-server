    ★ 53 이라는 숫자를 쓰지 마라. 새외는 연합체가 아니므로 총합이 의미가 없다.
      실제로 중원에 닿는 것은 언제나 **하나**다 — 북막이 오거나(20), 왜구가 오거나(8).
      ★ 그리고 그 하나만으로도 관은 정규군의 75%를 국경에 묶어 둔다 (deterrence.frontier)

# ═══════════════════════════════════════════════════════════════════
# ① -b 세력 관계표 — 같은 정파끼리도 앙숙이다
# ═══════════════════════════════════════════════════════════════════
# relation: +3 동맹 / +1~2 우호·거래 / 0 중립 / -1 경쟁 / -2 원한 / -3 숙적
# 연합 계산에서 쓰인다: 동맹이 참여 중이면 임계 -3, 원한이 참여 중이면 임계 +5

relation_scale:
  3: { name: 동맹, effect: "상대가 연합에 있으면 join_threshold -3. 상대 피해는 자파 피해에 준함(임계 -6)" }
  2: { name: 우호, effect: "join_threshold -2" }
  1: { name: 거래, effect: "join_threshold -1. 이익이 갈리면 즉시 0으로 떨어진다" }
  0: { name: 중립, effect: "보정 없음" }
  -1: { name: 경쟁, effect: "join_threshold +2 (저쪽이 공을 세우는 판에는 늦게 붙는다)" }
  -2: { name: 원한, effect: "join_threshold +5. 상대가 이미 참여 중이면 참여 거부 판정" }
  -3: { name: 숙적, effect: "같은 연합에 들어가지 않는다. 존망(existential) 태그일 때만 예외" }

