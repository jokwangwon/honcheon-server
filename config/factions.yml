          # ★★★「덮는다」 상세 — 끊긴 계보의 첫 실물 (사용자 확정 2026-07-28)
          ★덮는다_note: |
            **끊긴 계보다.** 대충돌에서 이 계보가 가장 크게 꺾였다 —
            구 「덮는다」의 뜻이 *「못 구할 사람은 곱게 감기게 한다」*였으니
            ★**죽어가는 사람 곁에 있던 자들**이고, 그래서 전장에서 제일 많이 죽었다.
            ★남은 파편은 **「사람을 편안하게 만드는 법」** 하나뿐이었다.
            > ★★★**감기게 하는 법만 남고, 왜 감겨야 하는지가 사라졌다.**
            그 파편을 **성(性)의 교리를 가진 여성 교도**가 잇고 올라왔다.
            ★★**결을 「유혹」이 아니라 「소유」로 잡는다** (중요):
              「감긴다」의 반대는 홀리는 것이 아니라 **안 놓아 주는 것**이다.
              > **원래 그 손은 죽는 사람을 편하게 놓아 주는 손이었다. 지금은 아무도 못 떠나게 한다.**
              → 매슬로 「소속·애정」의 타락과 정확히 같고, **가장 닳은 클리셰(마교의 요녀)를 벗는다.**
            ★하오문의 「기녀 = 색공·음공」과 **층이 다르다**: 하오문의 그것은 **직업이고 장사**이고,
              이쪽은 **교리**다.
          ★구신_대조가_기계다: |
            ★★**2대 천마의 무기가 무력이 아니라 「원본」이 된다.**
              같은 심법인데 쓰는 법이 달라졌다는 것은 **나란히 놓으면 보인다.**
              > **2대가 가진 것은 힘이 아니라 원본이다.**
            ★★그리고 3층이 기계가 된다:
              · **초대** = 구를 안다 (틀린 걸 아는데 못 고친다)
              · **신 마존** = 모른다 (제가 정통이라 믿는다)
              · **2대** = 모른다 **그러나 배울 수 있다**
          # ★★★정정 (인박스 회차 2) — 회차 1의 「옛 방법을 못 버린다」를 갈았다
          ★왜_잔혹한가: |
            > **방법은 남고 뜻은 갔다.**
            구 천마신교의 잔혹함(방법)은 물려받았는데 **그 잔혹함이 향하던 뜻을 잃었다.**
            **이유 없이 잔혹한 게 아니라 이유를 잊은 채** 잔혹하다.
            ★★그리고 이 한 칸이 혈교와 갈린다 —
              **혈교는 처음부터 뜻이 없었고, 신 마존은 뜻이 있었는데 잊었다.**
            ★그래서 주제(절대 악은 혈교 하나)를 안 깬다. **마존은 이유가 있는 적이다.**
          # ★★★다섯의 답이 전부 실패했다 (인박스 회차 2 확정 14)
          ★여섯_번째_답: |
            대충돌에서 **부수지도 차지하지도 떠나지도 못했고, 거두고 덮는 손도 못 따라갔다.**
            > ★**다섯의 답이 전부 틀렸다는 것을 200년 전에 배웠다. 그리고 그 뒤로 아무도 새 답을 못 냈다.**
            200년간 「제 영역을 지킨다」만 한 것은 답이 아니라 **답을 미룬 것**이다.
            ★★★그래서 **2대 천마(플레이어)의 일이 정해진다: 여섯 번째 답을 내는 것.**
          ★차지한다_note: |
            **부수는 자는 남기지 않고, 차지하는 자는 남겨야 쓴다.** 그래서 복수와 다르다.
            ★**제5막 마교 침공의 직접 동력**이 이 마존이다. 초대도 붙들다 못해 허락했고 —
              ★**붙드는 것과 막는 것은 다르다.** 「붙드는 자」의 한계가 거기서 드러난다.
              그리고 2대(플레이어)에게는 그것이 곧 시험이다: **다섯을 붙들 수 있는가.**
          ★거둔다_note: |
            **구**에서는 이 다섯의 심장이었다 — 「마교는 사람을 거둔다」를 담당했고,
            **제4막 연합에 마교 일부가 낄 수 있는 유일한 문**이었다.
            ★★**그런데 신에서 가장 깊이 썩었다** (유일하게 아래로 떨어진 계보다).
              → **연합이 어려운 이유**가 된다. 문은 있는데 그 문이 제일 상해 있다.
          # ★계보의 대수 — 【제안】 (외부 근거 없이 내적 정합만 있다 · 빨간펜 대상)
          계보_대수:
            부순다: 4                         # 【제안】 제 무공에 제가 죽는 계보 — 가장 젊고 가장 과격
            차지한다: 3                       # 【제안】
            떠난다: 3                         # 【제안】
            덮는다: 3                         # 【제안】
            거둔다: 3                         # 【제안】
          계보_대수_셈: |
            【제안】 무인 수명 80~90 · 승계는 20~30대 → 한 대가 60~70년. 200 ÷ 65 ≈ 3.
            ★귀결: **지금 마존들은 대체로 70~90대 노인이다** → 「굳었다」가 **말 그대로**가 된다.
          미결_문답:
            - "★신 마존 다섯의 이름 (【제안】 탐생·철벽·복심·위명·파천 — **미승인**)"
            - "매슬로 다섯을 세계 안에서 뭐라 부를 것인가 (현대어 금지)"
            - "다섯 계보 **아래의 계층** — 200년치 세대가 쌓여 있다"
            - "원래 다섯(동료)은 기명각을 거쳤나 (거쳤다면 「다섯이 1기」가 유지된다)"
        # ★후계 양성 — 「천마 양성소」를 우리 말로 갈았다 (행정적인 말이라 이질적이었다)
        기명각:
          이름: "기명각(棄名閣)"
          뜻: "**이름을 버리는 집.** 들어갈 때 제 이름을 버리고, 천마가 되면 새 이름을 받는다"
          note: |
            ★「그릇이 되려면 제 이름을 비워야 한다」가 여기서 기제가 된다.
            ★★그리고 **마존이 천마가 못 되는 이유**가 여기서 나온다:
              그 무공(신을 이는 법)은 **이름을 비운 자만** 익히는데,
              다섯은 **제 계보의 이름을 지고 있어서 못 비운다.**
          # ★★재검토 (2026-07-28) — 여기 「마존 다섯이 1기」라고 적혀 있었는데,
          #   마존이 **제자가 아니라 동료**로 정정되면서 그 말이 흔들렸다.
          #   동료라면 초대와 함께 세운 쪽이지 배운 쪽이 아닐 수 있다. → **미결로 되돌린다.**
          일기가_누구인가: 미결
          미결_문답:
            - "원래 다섯(동료)은 기명각을 거쳤나 — 안 거쳤다면 1기가 누구인지 다시 정해야 한다"
          후계_호칭: "소천마(小天魔)"          # ★「소가주」는 **혈연의 말**이라 걷었다 (집의 후계자)
        무공_색: |
          **천마신공**(역대 천마만) · **흡성대법**(남의 내공을 빼앗는다) ·
          천마신법(예측 불가) · **천마군림보**(위압) · 천마검법.
          ★결정적 결 — factions.yml 이 이미 적어 둔 대비 그대로:
            **마교는 중원의 심법을 극단으로 민 것**이라 중원을 이해한다 (그래서 잠식한다).
            새외는 애초에 다른 도를 걸었다. **마교는 중원의 밤이고, 새외는 중원 밖의 낮이다.**
          ★★입문의 결 (기원에서 곧바로 나온다): **문턱이 없다 — 아무나 배운다.**
            대신 **버티지 못하면 죽는다.** 게임 기계로는 **입문 조건이 가장 낮고 사망률이 가장 높은 길**이다.
          ★현재 심법 1·무공 0 — 손이 없다. ★★채움의 뼈대가 이제 섰다: **마존 다섯 = 계열 다섯**
            (파괴·군림·신법·환술·수호). B-188 마교 회차는 이 다섯으로 간다.
      # ★★★혈교 재정의 (사용자 확정 2026-07-28) — **이 세계의 유일한 절대악.**
      #
      #   ─── 폐기된 것 ───
      #   ★★**칠성사(七星使) 절 전체를 걷었다.** 어제(07-27) 「혈교의 침투 조직」으로 들였는데,
      #     사용자가 혈교를 **조종하지 않는 세력**으로 정의하면서 근거가 통째로 사라졌다.
      #     ① 혈교는 **숨지 않는다** — 남의 옷을 입을 이유가 없다.
      #     ② 그리고 「북두칠성 이름의 일곱 간부」는 **참고 작품(화산전생)의 고유 조어**였다.
      #   ★★함께 무너진 것 (정직하게 적는다 — 이것들은 이제 근거가 없다):
      #     · 제0막 「사파인 척하는 의문의 무리」 → 위장이 없다. **유린의 흔적**으로 갈아야 한다
      #     · 제1막 「패도천에 위장 침투」 → 없다
      #     · 제3막 「혈교 스파이 추적」 → ★가장 컸다 (세 막 뒤까지 손이 닿던 박)
      #     · 「저울」 기제 (연합이 서지 못하게 흔든다) → 조종 문법이라 폐기
      #   ★★그 빈자리를 무엇이 물려받는가: **정파 안의 썩은 뿌리** (orthodox 절 참조).
      #     추적의 대상이 「혈교 첩자」에서 **「제 편 안에서 썩는 쪽」**으로 옮겨 갔다.
      #     ★그리고 그것이 남의 이야기가 아니라 **우리 것**이다.
      #
      #   ★얻은 것: 이 재정의 하나로 **참고 작품의 최종보스 모양이 통째로 사라졌다.**
      #     「만악의 근원이 뒤에서 전부 조종했다」는 이제 우리 세계에 없다.
      hyeolgyo:
        name: "혈교"
        description: |
          ★★**압도적인 마기(魔氣)로 사람을 유린하고 제물로 삼는다.**
          **인간을 인간으로 보지 않는다.** 오직 저를 위한 종교 단체다.
          → **배척되어야 할 대상이다.** 이 세계에서 그런 세력은 이것 하나뿐이다.
          ★초기 사건(열병 등)에서는 직접 노출하지 않는다 (hidden).
          ★★★그런데 **누가 만든 것이 아니다** — 아래 `기원` 참조.
        # ══════════════════════════════════════════════════════════════════
        # ★★★기원 — **혈교는 주워졌다** (인박스 회차 2 확정 1)
        # ══════════════════════════════════════════════════════════════════
        기원:
          창시자: 없음
          기원의_정체: 영영_모르는_것으로_둔다   # ★비워 두는 것이 아니라 **선언**이다
          무엇이_있나: |
            **혈(血) 마법을 가진 무구·무공서가 옛날부터 세상에 뿌려져 있다.**
            귀신이 만든 것인지 무엇인지 **아무도 모른다.** 그리고 **끝까지 안 밝힌다.**
          어떻게_모이나: |
            줍는 자가 있고, **매료되어 미치는 자**가 있다.
            미친 자들이 마주치면 **같은 책을 읽었으니 말이 통한다.**
            ★교리는 누가 쓴 것이 아니라 **수렴한 것**이다 —
              각자 읽고 각자 해석했는데 **책이 같으니 결론이 같다.**
          ★★귀결: |
            > **마교는 세워졌고, 혈교는 주워졌다.**
            ★**창시자가 없으면 목적도 없다** → `싸우는_이유: 없음` 이
              **설정이 아니라 구조**가 된다.
            ★혈교가 **조직이 아니라 감염**이 된다 — **조직은 계략을 쓰지만 감염은 안 쓴다.**
            ★★그리고 **마교와 정확한 반대 짝**이 선다:
              **마교는 원본(사람)이 살아 있어 아직 안 갈렸고,
               혈교는 원본(책)이 안 죽으니 계속 모인다.**
        # ★★이 세계의 주제가 여기서 정의된다 (세계_주제 절 참조)
        절대악: true
        싸우는_이유: 없음                    # ★★유일한 면제. 그리고 그 면제 자체가 등록부에 적힌 주제다
        싸우는_이유_면제_note: |
          ★모든 세력은 **싸우는 이유**를 갖는다 — 그것이 이 게임이 말하려는 것이다.
          **혈교만 예외다.** 이유를 묻지 않고, 이유로 상대할 수도 없다.
          그래서 제4막의 연합이 성립한다: **이유가 있는 자들끼리는 언젠가 말이 통하지만,
          이유가 없는 것과는 통하지 않는다.**
        # ★조종하지 않는다 — 이 셋이 이 세력의 문법이다
        조종하지_않는다: true
        잠입하지_않는다: true
        숨지_않는다: true
        행동_문법: |
          혈교는 남을 부려서 일하지 않는다. **직접 온다.** 그리고 유린한다.
          ★그래서 제6막의 「정파·사파·마교조차 공격한다」가 **필연**이 된다 —
            편이 없는 게 당연하다. 아무도 저와 같은 종류가 아니니까.
        # ★★★「점조직·암약·드러나지 않음」은 쓰지 않는다 — **산발이다** (인박스 회차 2 확정 2)
        #   ★대화 중 한 번 그 안이 나왔으나 **세계 정본 §8 계율 정면 위반**이라 걷어냈다.
        #     그것은 **이미 한 번 걷어낸 「암천회」 모양**이다.
        점조직: false
        암약: false
        산발: true
        산발_note: |
          ★★**숨는 것과 안 보이는 것은 다르다.**
            숨으면 → 의도 → 목적 → 이유 → **절대악이 아니게 된다.**
            **너무 흩어져 있어서 아무도 못 보는 것**이라야 한다.
          > **혈교는 조직된 적이 없다. 같은 책을 읽은 자들이 서로를 알아본 것뿐이다.**
        포교: 없음
        포교_note: |
          > **혈교는 사람을 꾀지 않는다. 책이 사람을 고른다.**
          ★귀결: 제0막 「마을 하나가 통째로 비고 시신이 남지 않는다」는 **조직의 습격이 아니다.**
            그 마을에서 **누군가 책을 주웠을 뿐**이다.
        수장:
          정체: "굉장히 미친 자"
          어떻게_올랐나: "계획해서 오른 것이 아니라 **가장 미친 자라서 위로 떠올랐다**"
          목적: 없음                          # ★계율 유지 — 목적을 주면 절대악이 아니게 된다
          미결: "어떤 책을 주웠나 (★목적을 주지 않도록 조심 — **미친 이유가 아니라 미친 경위만**)"
        # ★★★봉인 = 회수다 (인박스 회차 2 확정 4)
        봉인은_회수다: |
          ★세계 정본 §6 *「혼자서는 못 가둔다 — 봉인의 조건이 연대의 폭이다」*에 **근거가 없었다.**
          이제 있다:
          > **세상에 흩어진 것을 거두려면 세상만큼 넓어야 한다.**
          ★제6막 종결박이 **전면전이 아니라 회수**다.
            → 엔딩 A/C 가 갈리는 이유가 자명해진다: **연대가 좁으면 다 못 줍는다.**
          ★미결: **혈 무공서·무구는 몇 종인가 · 어떤 것들인가** (회수의 실물 단위가 된다)
        # ★★마교와의 구분 — 둘 다 교단이고 둘 다 세상을 미워한다. 갈라야 한다
        마교와의_구분: |
          ★★**마교는 사람을 거두고, 혈교는 사람을 쓴다.**
          마교의 기원은 「버려진 자들이 모였다」이므로 **받아주는 곳**이고,
          혈교는 「인간을 인간으로 안 본다」이므로 **먹는 곳**이다.
          ★★한 줄: **마교는 버려진 자들의 집이고, 혈교는 그 집을 곳간으로 본다.**
          → 제6막에 혈교가 **마교마저** 치는 것이 여기서 필연이 된다 (거둔 사람들이 있으니까).
