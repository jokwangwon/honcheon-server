# 혼천 서버 세력 설정 파일
# 기준 문서: docs/design/text_rpg_design.md 4장 (세력 구조), 11장 (세력 반응 시스템)
#
# 주의: 과거의 원소 속성 4문파(청운문/화염문/태산문/수월문)는 잘못 생성된 설정으로 폐기됨.
# 이 세계는 "정파 vs 사파" 이분 구도가 아니라, 이해관계에 따라 협력/거래/적대가 뒤섞이는
# 5계열 세력 구조로 움직인다.

# ─── id 규약 (단일 네임스페이스) ───
# 전 config 의 `faction:` / `factions:` / `group:` 값은 **반드시 이 파일의 id** 를 쓴다.
#   · 계열(5) = faction_groups 의 키          (orthodox, unorthodox, forbidden, authority, civilian)
#   · 조직·문파 = faction_groups.*.members 의 키 (소문자 스네이크 — hwasan, haomun, pyoguk …)
# 한글명(name)은 **표기 전용**이다 — 참조 값으로 쓰지 마라 (member id / group id / 한글명 삼중 분기 금지).
# 한글로 들어온 입력(LLM·플레이어 발화)은 aliases 로 id 에 붙인다.
id_policy:
  reference_key: "faction / factions / group 값 = group id 또는 member id (소문자 스네이크)"
  display_only: name
  exempt: [무소속, 미상, 없음, 해당_문파]   # 세력이 아닌 서술 값 — 등록부 대조에서 제외

# 세력 반응 단계 (모든 세력 공통)
reaction_stages:
  0: "무관심"
  1: "소문 인지"
  2: "정보 수집"
  3: "접촉 또는 경고"
  4: "의뢰 / 회유 / 협박"
  5: "직접 개입"
  6: "토벌 / 전쟁 / 숙청"

# ─── faction_groups 는 '세력'이 아니라 **연합체(coalition)** 다 ───
# 주의: orthodox / unorthodox 는 하나의 세력이 아니다. 평시엔 성립해 있지 않고,
# 각 member 가 **단일 세력**으로 각자 논다 (구파일방 10 + 오대세가 5 = 15개 독립 세력).
# 그룹 id(orthodox)는 "지금 이 명분으로 뭉친 자들"의 **동적 명단**을 가리키는 이름이지,
# 상시 존재하는 지휘부가 아니다 — 무림맹은 사건마다 새로 짜이는 임시 조직이고, 이겨도 흩어진다.
# 연합의 성립·크기·붕괴는 config/faction_politics.yml 이 굴린다 (명분 게이지 → join_threshold).
faction_groups:
  # 1. 정파 계열 — **연합체** (아래 members 각각이 상시 존재하는 단일 세력이다)
  orthodox:
    name: "정파 계열"
    hidden: false
    members:
      gupailbang:
        name: "구파일방"
        description: "무림의 전통 명문 문파 연합"
        sects:
          - "소림사"
          - "무당파"
          - "화산파"
          - "곤륜파"
          - "종남파"
          - "점창파"
          - "청성파"
          - "해남파"
          # 개방, 아미파는 추후 확장 콘텐츠
      odaesega:
        name: "오대세가"
        description: "무림 오대 명문 세가"
        clans:
          - "남궁세가"
          - "모용세가"
          - "제갈세가"
          - "하북팽가"
          - "사천당가"
      orthodox_heroes:
        name: "정파 협객"
        description: "문파에 소속되지 않은 정파 성향 무인들"

      # 개별 참조되는 문파·세가는 1급 id 를 갖는다 (sects/clans 명단은 상위 조직의 로스터로 유지)
      hwasan:
        name: "화산파"
        parent: gupailbang
        description: "청하현 알파의 정파 입문 목표 문파 (매화 목패·진운 루트)"
      sorimsa:
        name: "소림사"
        parent: gupailbang
        description: "불가 무학의 종가 — 속가로 퍼진 실전 기예의 출처"
      mudang:
        name: "무당파"
        parent: gupailbang
        description: "도가 무학의 종가"
      namgung:
        name: "남궁세가"
        parent: odaesega
        description: "오대세가 검가"
      dangga:
        name: "사천당가"
        parent: odaesega
        description: "오대세가 독가 — 방계 전승이 독문으로 흘러나갔다"
      gaebang:
        name: "개방"
        parent: gupailbang
        description: "거지들의 방파. 정보와 발이 무기다 — 취걸개(폐사당 기연)가 파문 장로 출신."
      bulga:
        name: "불가"
        description: "사찰·승려 계열 — 문파가 아니라 계보다 (혜각 등 탁발승)"

      # ── 구파일방 (로스터 → 1급 승격: faction_politics 가 이들을 개별 참조한다)
      # 새 세력이 아니다 — 위 gupailbang.sects / odaesega.clans 명단에 이미 있던 이름에 id 를 붙였을 뿐이다.
      # (아미파는 승격하지 않는다 — 위 주석의 '추후 확장 콘텐츠' 존중. faction_politics roster 에
      #  registry: 예약 · active: false 로만 있다)
      gonryun:
        name: "곤륜파"
        parent: gupailbang
        description: "서역의 도가 문파 — 멀다. 천하가 뒤집혀야 배를 띄운다"
      jongnam:
        name: "종남파"
        parent: gupailbang
        description: "종남산 도맥 — 화산과 같은 섬서 땅, 대대의 앙숙"
      jeomchang:
        name: "점창파"
        parent: gupailbang
        description: "운남의 쾌검"
      ami:
        name: "아미파"
        description: "사천의 여승 문파 — 구파일방. 당가와 앙숙(독은 협이 아니다)."
        registry: 예약        # 상세 미설계 — 좌표·관계만 등록 (world_map·faction_politics 참조)
        active: false

      cheongseong:
        name: "청성파"
        parent: gupailbang
        description: "청성산 검맥"
      haenam:
        name: "해남파"
        parent: gupailbang
        description: "해남도 — 무림에서 가장 먼 곳"

      # ── 오대세가 (로스터 → 1급 승격)
      moyong:
        name: "모용세가"
        parent: odaesega
        description: "요동의 세가 — 실리로 움직인다"
      jegal:
        name: "제갈세가"
        parent: odaesega
        description: "지략의 세가. 관에 줄이 있다 — 관을 읽는 눈이자, 관의 귀"
      paengga:
        name: "하북팽가"
        parent: odaesega
        description: "하북 도가(刀家). 도적 소탕이 가업 — 녹림과는 대를 이은 피"

  # 2. 사파 / 흑도 계열
  unorthodox:
    name: "사파 / 흑도 계열"
    hidden: false
    members:
      haomun:
        name: "하오문"
        description: "정보망에 가까운 조직. 정파와도 때로 거래 대상이 된다."
      noklim:
        name: "녹림"
        description: "산채를 근거지로 하는 도적 연합"
      jangang_suroche:
        name: "장강수로채"
        description: "수로를 장악한 흑도 세력"
      salmak:
        name: "살막"
        description: "청부 살수 조직"
      dokmun:
        name: "독문"
        description: "독을 다루는 방계 문파들 (사천당가 방계 전승 — 칠살음독경의 출처)"

  # 3. 사교 / 금기 계열 — 초기 튜토리얼에서는 직접 노출하지 않는 장기 위협
  forbidden:
    name: "사교 / 금기 계열"
    hidden: true          # 초기에는 플레이어 출력에 비노출
    members:
      magyo:
        name: "마교"
        description: "일반 사파보다 위험한 금기 세력. 세계 시간이 흐른 뒤 점진적으로 드러난다."
      hyeolgyo:
        name: "혈교"
        description: "금기 중의 금기. 초기 사건(열병 등)에서는 직접 노출하지 않는다."

  # 4. 질서 / 행정 계열
  authority:
    name: "질서 / 행정 계열"
    hidden: false
    members:
      gwan_gun:
        name: "관군"
        description: "치안 유지를 위해 정파와 협력할 수 있으나, 무림 세력 전체를 경계하기도 한다."
      hyeollyeong:
        name: "현령 / 관청"
        description: "지역 행정 기관"

  # 5. 경제 / 민간 계열
  civilian:
    name: "경제 / 민간 계열"
    hidden: false
    members:
      sangdan:
        name: "상단"
        description: "정파와 협력하되 이익을 위해 사파와도 거래할 수 있다."
      mingan:
        name: "민간"
        description: "일반 백성. 민심의 주체."
      jeongbosang:
        name: "정보상"
        description: "소문과 정보를 사고파는 이들"
      pyoguk:
        name: "표국"
        description: "물건과 사람을 지켜 나르는 무력 운송업 (진철산 — 청하 표국 지점)"
      uiga:
        name: "의가"
        description: "의원 계보 — 활인침법의 전승자들 (유문·혜각의 왕진)"

# ─── 별칭 — 한글·구철자 입력을 id 로 붙인다 (표기·LLM 입력 정규화 전용, 참조 값 아님) ───
aliases:
  정파: orthodox
  사파: unorthodox
  흑도: unorthodox
  사교: forbidden
  관: authority
  관청: hyeollyeong
  현령: hyeollyeong
  관군: gwan_gun
  민간: mingan
  상단: sangdan
  정보상: jeongbosang
  표국: pyoguk
  의가: uiga
  불가: bulga
  독문: dokmun
  개방: gaebang
  화산파: hwasan
  소림사: sorimsa
  무당파: mudang
  남궁세가: namgung
  사천당가: dangga
  곤륜파: gonryun
  종남파: jongnam
  점창파: jeomchang
  청성파: cheongseong
  해남파: haenam
  모용세가: moyong
  제갈세가: jegal
  하북팽가: paengga
  장강수로채: jangang_suroche
  하오문: haomun
  녹림: noklim
  살막: salmak
  마교: magyo
  혈교: hyeolgyo
  # 구철자 교정 (2026-07 정합 패스에서 폐기된 표기)
  gwangun: gwan_gun
  gwanchung: hyeollyeong
  jeongboSang: jeongbosang
  jeongpa: orthodox
