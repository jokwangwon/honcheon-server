# 혼천 서버 세력 설정 파일
# 기준 문서: docs/design/text_rpg_design.md 4장 (세력 구조), 11장 (세력 반응 시스템)
#
# 주의: 과거의 원소 속성 4문파(청운문/화염문/태산문/수월문)는 잘못 생성된 설정으로 폐기됨.
# 이 세계는 "정파 vs 사파" 이분 구도가 아니라, 이해관계에 따라 협력/거래/적대가 뒤섞이는
# 5계열 세력 구조로 움직인다.

# ─── id 규약 (단일 네임스페이스) ───
# 전 config 의 `faction:` / `factions:` / `group:` 값은 **반드시 이 파일의 id** 를 쓴다.
#   · 계열(5) = faction_groups 의 키          (orthodox, unorthodox, forbidden, authority, civilian)
#   · 조직·문파 = faction_groups.*.members 의 키 (소문자 스네이크 — hwasan, haomun, pyoguk …)
# 한글명(name)은 **표기 전용**이다 — 참조 값으로 쓰지 마라 (member id / group id / 한글명 삼중 분기 금지).
# 한글로 들어온 입력(LLM·플레이어 발화)은 aliases 로 id 에 붙인다.
id_policy:
  reference_key: "faction / factions / group 값 = group id 또는 member id (소문자 스네이크)"
  display_only: name
  exempt: [무소속, 미상, 없음, 해당_문파]   # 세력이 아닌 서술 값 — 등록부 대조에서 제외

# ══════════════════════════════════════════════════════════════════════════
# ★★★세계 주제 (사용자 확정 2026-07-28) — **이 게임이 말하려는 것**
# ══════════════════════════════════════════════════════════════════════════
세계_주제:
  한_줄: "절대 악은 없다 (혈교를 제외하고). 서로 이유가 있어 싸운다."
  근거: |
    ★이 문장은 새로 온 것이 아니라, 이미 세계에 반쯤 서 있던 것이다 —
    제4막 연합의 해소 조건이 「**서로의 이유를 알고** 옛날만큼의 전쟁까진 아님」이었다.
    그것이 주제 선언이었다는 것을 2026-07-28 에 알았다.
  # ★★주제를 **감사할 수 있는 것**으로 만든다: 모든 세력은 싸우는 이유를 갖는다
  규약:
    필수_필드: 싸우는_이유
    적용_범위: "member 세력 — ★계열 컨테이너는 **안 싸운다**(분류다). 다만 계열의 결로 적어 둘 수는 있다"
    면제: [hyeolgyo]
    면제_note: |
      ★혈교 하나만 면제다. 그리고 **그 면제 자체가 등록부에 적힌 주제**다 —
      이유가 없는 것이 하나뿐이라서, 나머지 전부가 「이유가 있는 자들」이 된다.
      ★★면제는 **비워 두는 게 아니라 「없음」이라고 적는다.** 빈칸은 「아직 안 정했다」와
        구별되지 않는다 — 면제는 **선언**이지 공백이 아니다. (눈이 이것을 잰다)
    눈: "lint_config ⑩ — 미기입 세력을 **경고**로 세고 면제 세력이 「없음」이라 적었는지 **위반**으로 잡는다"
    눈_note: |
      ★★2026-07-28 — 이 줄은 원래 **거짓말이었다.** 「lint_config 가 잡는다」고 적어 뒀는데
      **그런 눈이 없었다** (선언만 하고 안 만들었다). 그날 발견해서 실제로 만들었다.
      ★계율: **등록부가 제 보증으로 눈을 내세울 때는, 그 눈이 실재하는지 세어 보라.**
    미기입은_왜_경고인가: |
      대부분의 세력이 아직 미기입이고, **지어내면 안 되기 때문**이다 (계율: 추측 금지).
      ★그래서 이 경고 목록이 곧 **「아직 안 정한 것」 장부**다 — 채워지면 목록이 줄어든다.
  # ★세 계열이 같은 축의 세 눈금이다
  세_눈금: |
    **혈교는 선이 없고, 사파는 선이 낮고, 정파는 선을 말하면서 지키지 못한다.**

# 세력 반응 단계 (모든 세력 공통)
reaction_stages:
  0: "무관심"
  1: "소문 인지"
  2: "정보 수집"
  3: "접촉 또는 경고"
  4: "의뢰 / 회유 / 협박"
  5: "직접 개입"
  6: "토벌 / 전쟁 / 숙청"

# ─── faction_groups 는 '세력'이 아니라 **연합체(coalition)** 다 ───
# 주의: orthodox / unorthodox 는 하나의 세력이 아니다. 평시엔 성립해 있지 않고,
# 각 member 가 **단일 세력**으로 각자 논다 (구파일방 10 + 오대세가 5 = 15개 독립 세력).
# 그룹 id(orthodox)는 "지금 이 명분으로 뭉친 자들"의 **동적 명단**을 가리키는 이름이지,
# 상시 존재하는 지휘부가 아니다 — 무림맹은 사건마다 새로 짜이는 임시 조직이고, 이겨도 흩어진다.
# 연합의 성립·크기·붕괴는 config/faction_politics.yml 이 굴린다 (명분 게이지 → join_threshold).
faction_groups:
  # 1. 정파 계열 — **연합체** (아래 members 각각이 상시 존재하는 단일 세력이다)
  orthodox:
    name: "정파 계열"
    hidden: false
    # ★★정파란 무엇인가 (사용자 확정 2026-07-28) — 「선(善)」이 아니다.
    #   **의롭다고 자처하지만, 뿌리가 썩어가는 쪽이 존재한다.**
    #   ★「일부」다 — 정파 전체가 썩은 것이 아니다. 그래서 정파 안에 **갈림**이 있다.
    싸우는_이유: |
      의(義)를 지킨다 — 그렇게 믿는다. 힘 있는 자가 힘없는 자를 지켜야 한다는 것,
      그것이 우리가 문파를 세운 까닭이다.
      ★다만 **그 말을 하는 것과 지키는 것은 다르다.** 지키지 못한 자리마다 뿌리가 썩는다.
    썩은_뿌리:
      존재: true
      범위: 여러_곳에_조금씩              # ★★확정 2026-07-28 (안 C) — 한 문파의 죄가 아니다
      # ══ 어디서 썩는가 (사용자 확정 2026-07-28) ══
      어디서: 밑                          # ★**밑의 안 보이는 곳**에서 썩는다 (말단·하부 기구)
      맹주는_썩지_않았다: true
      맹주_note: |
        ★★무림맹은 **하나의 목표를 가지고 움직인다** — 그래서 **맹주는 썩은 사람이 아니다.**
        썩는 것은 **밑의 안 보이는 곳**이다.
        ★그러므로 이것은 「내가 앉은 자리가 썩었다」가 아니라 **「위는 깨끗한데 아래가 썩는다」**이다.
          → 맹주가 플레이어여도 악역이 되지 않는다. 대신 **못 보는 자**가 된다.
            (그리고 그것이 더 아프다 — 옳은 사람이 옳게 앉아 있는데도 밑이 썩는다.)
        ★자리 구조가 이미 그렇게 생겼다: 실권은 **장로원(합의체)**이고 실무는 하부 기구
          셋(정보·무력·행정)이 굴린다. **합의체는 책임이 흩어진다.**
      왜_들어왔는가: |
        ★★**대치 때문이다.** 패도천과 맞서려면 머릿수가 필요했고,
        머릿수를 채우다 보니 **썩은 사람들도 섞여 들어왔다.**
        ★★한 줄: **맹은 이기려고 커졌고, 커지느라 아무나 받았다.**
        → 맹주의 잘못이 아니다. **필요했으니까.** (그래서 아무도 딱히 틀리지 않았다)
      형태: [자릿세]                      # ★★사용자가 든 예 — 맹의 이름으로 저잣거리에서 뜯는다
      형태_note: |
        ★**자릿세는 민간을 향한다.** 무림맹의 이름을 대고 상인·백성에게서 걷는다.
        ★그래서 이 부패는 **명분이 아니라 민심으로 드러난다** — 게임 기계로는
          `region_delta`(민심·경제)에 걸린다. 소문과 지역 수치가 증거이지, 고발장이 아니다.
        ★다른 형태는 미결 (자릿세가 첫 번째다 — 늘리려면 같은 결로: **이름을 빌려 아래에서 뜯는 것**)
      # ══ 왜 썩는가 — ★주제상 「탐욕」으로 끝내지 않는다 ══
      왜_썩는가:
        겉: [위선과_명예, 기득권_유지, 도덕적_타락]   # 장르 표준 그대로 (사용자 제공)
        밑: |
          ★그 밑의 이유는 **「우리가 세운 질서를 지켜야 한다」**이다.
          그리고 그들은 **진심으로 그렇게 믿는다** — 새 세력을 누르는 것도 저는 강호를
          지키는 일이라고 여긴다.
          ★★그래서 무섭다: **탐욕은 설득할 수 있어도 신념은 못 한다.**
        ★그_신념의_뿌리는_시간이다: |
          ★★2026-07-28 — 「진심으로 믿는다」에 **근거가 생겼다: 200년과 500년이다.**
          · **200년 전 대충돌** — 맹이 없어서 못 막았고, 못 막아서 양쪽이 다 죽었다.
            **200년 걸려 다시 세운 질서**다. 그러니 지키자는 말이 진심이다.
          · **500년 당직** — 무당이 혈 무구를 거두고 있었다 (mudang.오백년_당직).
            정파는 세상을 구한 게 아니라 **500년을 조용히 막고 있었다.**
          ★★그런데 **그 기억이 정파에는 없다**:
            > **정파는 잊었고, 마교는 잊지 않았다.**
            200년은 **사람의 기억보다 길고 교단의 기억보다 짧다.** 정파 쪽엔 그 전쟁을 본
            사람이 하나도 없는데, 마교엔 **그때 그 사람(초대 천마)이 아직 앉아 있다.**
          ★★★그래서 **제5막 침공이 정파에게 날벼락**이다 —
            **청구서를 받는 쪽은 빚진 줄도 모른다.**
        ★★마교와_같은_뿌리: |
          ★★★**「가난한 무인들을 누르고 자기들만 잘살려 한다」가 곧 마교의 기원이다.**
          마교는 「부패한 정파에게 핍박받은 자들」이 세운 교단이고, 그 핍박이 바로 이것이다.
          → **제3막과 제5막이 한 줄로 이어진다**:
            **정파가 누른 자들이 마교가 되었다. 그리고 제3막에, 정파는 다시 누르기 시작한다.**
          → 썩은 뿌리를 못 도려내면 제5막에 마교가 온다. 그때 플레이어는 알게 된다 —
            **침공은 복수가 아니라 청구였다.**
      # ★★이것이 폐기된 「혈교 스파이 추적」의 자리를 물려받았다 (hyeolgyo 절 참조)
      물려받은_것: |
        혈교가 조종을 그만두면서(2026-07-28 재정의) 제3막의 추적 축이 비었다.
        그 자리를 **정파 안에서 썩는 쪽**이 물려받는다:
          · 추적의 대상  = 혈교 첩자 → **제 편 안에서 썩는 쪽**
          · 연합이 늦는 이유 = 남이 흔들어서 → **제 안이 썩어서 남과 손을 못 잡는다**
          · 제3막 개인 노선 = 「찾아낼 것인가」 → **「덮을 것인가·도려낼 것인가·이용할 것인가」**
            ★집계 문법이 그대로 산다 (제3막의 끝은 승패가 아니라 분포다)
          · 성패가 닿는 곳 = ①제6막 피해 규모 ②제4막 연대 폭 ③**무림맹의 생존**
      ★순서_note: |
        제2막에 무림맹을 세우고 **제3막에 세우자마자 썩는다.**
        ★그리고 그 죄는 물려받은 것이 아니라 **처음부터 제 죄**다 —
          우리 무림맹은 **재건이 아니라 창설**이기 때문이다 (참고 작품과 갈리는 자리).
      # ★★★제3막의 딜레마 — 도덕이 아니라 **기계**다
      ★딜레마: |
        ★★**썩은 것을 도려내면 맹이 약해진다.** 그 사람들이 대치의 머릿수이기 때문이다.
        그런데 지금 **패도천과 대치 중**이다. 그래서 개인 노선 셋에 각각 대가가 붙는다:
          · **덮는다**   — 맹의 힘은 지킨다. 대신 「정파는 위선이다」가 계속 참이 된다
                          → 제4막 **연대 폭이 좁아진다** (사파가 손잡을 이유가 준다)
          · **도려낸다** — 명분은 선다. 대신 **맹이 약해진 채로** 제3막을 치른다
          · **이용한다** — 그 돈줄을 제 것으로. 개인은 얻고 세계는 더 썩는다
        ★★그래서 이 막의 선택은 도덕이 아니라 **「힘이냐 명분이냐」**다 —
          그리고 우리 faction_politics 는 **명분 게이지로 도는 시스템**이라 정면으로 맞물린다.
      미결_문답:
        - "자릿세 말고 다른 형태를 더 둘 것인가 (같은 결이어야 한다: **이름을 빌려 아래에서 뜯는 것**)"
        - "도려냄이 맹의 힘을 얼마나 깎는가 — 수치·임계값 (배선 회차)"
    members:
      # ★★무림맹 신설 (사용자 확정 2026-07-26 「무림맹쪽부터 진행」 · 출처 haomoon.kr)
      #
      # ─── 왜 이것이 필요한가: 「정파 계열」과 「무림맹」은 같은 것이 아니다 ───
      # faction_politics 제1원칙이 이미 적어 뒀다: **「정파는 세력이 아니라 연합의 이름이다」.**
      #   그 문장이 맞다. 그런데 그렇다면 **누가 그 이름으로 결정을 내리는가**가 비어 있었다.
      #   · orthodox(정파 계열)  = 분류다. 결정하지 않는다 (컨테이너 — 무공도 갖지 않는다)
      #   · gupailbang/odaesega = 명단이다. 각자 제 산문의 일만 정한다
      #   · **무림맹 = 기구(機構)다.** 맹주가 있고 장로원이 있고, **토벌령을 낸다**
      # ★한 줄: 정파 계열은 「누가 정파인가」이고, 무림맹은 「정파가 무엇을 하기로 했는가」다.
      #
      # ★이미 세계가 이것을 필요로 하고 있었다 — authority_mandate(관의 명령)의 강호 쪽 짝이
      #   없었다. 혈교 토벌령·무림공적 지정을 지금까지 **아무도 내리지 않았다.**
      murimmaeng:
        name: "무림맹"
        description: |
          정파 세력들의 **공식 연합 기구** — 분류가 아니라 기구다 (구파일방·오대세가가 그 성원).
          두 얼굴이 있다 (자료): **대외**로는 마교·혈교 같은 거대 위협에 공동 대응하고,
          **대내**로는 정파끼리의 분쟁을 중재하고 규율 위반자를 처단한다.
          ★그래서 무림맹은 플레이어에게 **적이 될 수도 있다** — 무림공적으로 지정하는 쪽이 여기다.
          축: **맹주(盟主 — 당대 최강 또는 최고 명망)** · 부맹주 2~4 · **장로원(실질 권력)**.
          하위 기구 셋: 정보(감시) · 무력(정예 무사단) · 행정.
          활동: 정사대전 주도 · 무림공적 토벌 · 분쟁 중재 · **용봉지회(무술 대회)**.
          ★자료가 짚은 결: 「부패·무능으로 그려지거나, 맹주가 조력자이거나 최종 보스이기도 하다」
            — 즉 **무림맹은 선하다고 전제하지 않는다.** 그것이 이 기구의 서사적 값이다.
        무공_색: |
          ★**무공을 갖지 않는다** (자료도 무공 보유를 말하지 않는다) — 성원 문파의 무공을 쓴다.
          컨테이너와 다른 점: 컨테이너는 **주체가 아니어서** 무공이 없고,
          무림맹은 **주체이지만 제 무학이 없다** (기구이므로. 관군이 참마도법을 갖는 것과 대비된다).
          ★그래서 이 세력의 힘은 무공이 아니라 **명령**이다 — 토벌령·공적 지정·중재.
        # ★기계 판독 — 눈(combat_audit lint_faction_coverage)이 이 키를 읽는다.
        #   무공 0 이 **의도**임을 등록부가 말해 준다: 기구는 제 무학을 갖지 않는다.
        #   이 표시가 없으면, 나중에 무림맹에 입문 문이 열리는 순간 눈이 「문이 열렸는데 배울 것이
        #   없다」고 거짓 경고를 낸다 — 그때는 이미 왜 그런지 아무도 기억하지 못한다.
        no_arts_by_design: true
        no_arts_reason: "기구(機構)다 — 성원 문파의 무공을 쓴다. 힘이 무공이 아니라 **명령**에 있다"
        기구_성격:
          결정_단위: 장로원                # 맹주 독단이 아니다 (자료: 장로원이 실질 권력)
          성원: [gupailbang, odaesega]     # 명단은 두 연합이 갖는다 — 무림맹이 따로 세지 않는다
          낼_수_있는_것: [무림공적_지정, 토벌령, 분쟁_중재, 용봉지회_개최]
          대응물: "★ authority(관)의 authority_mandate 와 같은 층 — 강호 쪽 명령권이다"
        # ★★확정 (사용자 2026-07-26 · 거대 줄기 v2 Stage 0 — docs/design/world_stages_v2.md):
        #   **알파 시점에 무림맹은 아직 없다.** Stage 0 = 「무림맹 창설 전 (혼란의 서막)」이고,
        #   무림은 맹 없이 문파·세가 중심의 **분열 구조**다. 창설은 Stage 2 의 사건이다.
        #   ★그 귀결로 맹주도 없다 — 맹주 선출은 Stage 2 이벤트(명성 or 실력 기반)다.
        exists_at_alpha: false
        founded_in_stage: 2               # 거대 줄기 v2 · 창설 준비는 Stage 1 (패도천 등장과 맞물린다)
        founding_proposers: [남궁, 제갈, 무당]   # 「셋 중 누군가 주도」 — 누구인지는 미결
        maengju: 없음                      # 맹이 없으므로 맹주도 없다 (Stage 2 에서 선출)
        # ★★맹주 자리 (사용자 확정 2026-07-28) — 세 자리 중 하나
        maengju_seat:
          호칭: 맹주(盟主)
          원칙: 선출                        # ★제2막 이벤트. 패주(무력)·천마(지목)와 갈리는 축
          자격_문턱: true
          자격_문턱_note: |
            ★뽑히기만 하는 자리가 아니다 — **연합에서 가장 강한 자, 천하제일인 중 한 명**이다.
            그래서 **플레이어의 역량이 일정 수준에 못 미치면 NPC 가 대체한다.**
          겸직: "각 문파·세가의 수장이 겸한다 (자리를 위한 별도 혈통이 없다)"
          player_eligible: true
          player_route: 평판                # ★세 갈래 정점: 맹주=평판 · 패주=무력 · 천마=인정
          npc_fallback: true
          전투_규격: 레이드                  # 세 자리 공통 — 플레이어 셋이 붙어야 잡는다
          얻는_것: [명분, 결정권]
          얻는_것_note: |
            ★맹주는 힘도 갖지만 **명분**을 함께 쥔다 — 연합 성사·토벌령 같은 세력 판정에 걸리는 값이다.
            ★**맹주의 결과에 따라 세계의 결과가 바뀔 수 있다** (엔딩 분기에 가장 크게 손대는 자리).
          대리인: 군사(軍師)
          대리인_note: |
            ★맹주에게도 실무 대리인이 있다 — 패도천의 **총관**과 나란한 자리다.
            **맹주 대리인이 결과를 이끌 수도 있다** (사용자 확정 2026-07-28).
            ★자리 이름은 **군사(軍師)** 로 둔다 — 장로원(합의체)과 별개의 한 사람이다.
          미결_문답:
            - "군사를 어느 세가가 내는가 (제갈이 자연스러우나 확정 아님)"
            - "맹주 후보 명단 — 문파·세가 수장 전원인가, 추린 몇인가"
        # ★그래서 지금 이 등재는 **미래의 자리**다: 세계가 이 이름을 아직 부르지 않는다.
        #   그러나 등록부에 있어야 한다 — Stage 0 의 담론(「무림을 하나로 묶어야 한다」)이
        #   가리키는 것이 이것이고, 소문·의뢰가 그 담론을 실어야 하기 때문이다.
        미결_문답:                          # ★지어내지 않는다 — 사용자 확정 대기
          - "창설 주도자가 남궁·제갈·무당 중 누구인가 (또는 플레이어가 정하는가)"
          - "입문 가능한가 — 창설(Stage 2) 이후에야 의미가 있다. 지금은 문을 만들지 않았다"
          - "무력 조직(정예 무사단)이 제 무공을 갖는가 — 갖게 하면 무공_색이 바뀐다"
          # ★닫힘 (2026-07-27): Stage 4 무림연합은 **기구가 아니라 상태**다 —
          #   「무림맹주와 **패주**가 동시적으로 협력한 상태」. 새 세력 id 를 만들지 않는다.
          #   ★그래서 무림맹은 연합 안에서도 **제 이름을 유지한다** (흡수되지 않는다)
      gupailbang:
        name: "구파일방"
        description: "무림의 전통 명문 문파 연합"
        sects:
          - "소림사"
          - "무당파"
          - "화산파"
          - "곤륜파"
          - "종남파"
          - "점창파"
          - "청성파"
          - "해남파"
          # 개방, 아미파는 추후 확장 콘텐츠
      odaesega:
        name: "오대세가"
        description: "무림 오대 명문 세가"
        clans:
          - "남궁세가"
          - "모용세가"
          - "제갈세가"
          - "하북팽가"
          - "사천당가"
      orthodox_heroes:
        name: "정파 협객"
        description: "문파에 소속되지 않은 정파 성향 무인들"

      # 개별 참조되는 문파·세가는 1급 id 를 갖는다 (sects/clans 명단은 상위 조직의 로스터로 유지)
      hwasan:
        name: "화산파"
        parent: gupailbang
        description: "청하현 알파의 정파 입문 목표 문파 (매화 목패·진운 루트)"
      sorimsa:
        name: "소림사"
        parent: gupailbang
        description: "불가 무학의 종가 — 속가로 퍼진 실전 기예의 출처"
      mudang:
        name: "무당파"
        parent: gupailbang
        description: "도가 무학의 종가"
        # ★★★500년 당직 (인박스 회차 2 확정 3) — 이 문파에 세계의 무게가 하나 얹혔다
        오백년_당직:
          무엇을: "세상에 뿌려진 **혈(血) 무구·무공서를 거두는 일**"
          언제부터: 500년_전                  # 【제안】 수치 — 빨간펜 대상
          ★오백년은_무엇의_해인가: |
            ★**봉인한 해가 아니라 무당이 거두기 시작한 해다.**
            (「500년 전에 가뒀다」 안은 폐기했다 — 가뒀다면 제6막에 다시 나올 이유가 약해진다.)
          한_줄: |
            > ★★**정파는 세상을 구한 것이 아니라, 500년 동안 조용히 막고 있었다. 그리고 아무도 몰랐다.**
            승리가 아니라 **500년짜리 당직**이고, **조금씩 새고 있었다.**
            위선이 아니라 **지쳐 가는 진심**이다.
          ★귀결: |
            · 정파가 *「우리가 세운 질서를 지켜야 한다」*고 믿는 뿌리가 **500년**이 된다
            · (덤) **무당이 맹의 정치에서 빠져 있는 이유**가 된다 — 다른 일을 하고 있었으니까
            · 제6막의 **봉인법이 하늘에서 떨어지지 않는다** — 500년치 방법이 이미 있다
          ★함정: |
            **「500년마다 온다」는 주기로 만들지 마라.**
            주기가 되면 예측 가능해지고, **예측 가능하면 재난이 아니다.**
          미결_문답:
            - "무당은 거둔 것을 **어디에 두고 있었나**"
            - "**지금 몇을 놓쳤나**"
      namgung:
        name: "남궁세가"
        parent: odaesega
        description: "오대세가 검가"
      dangga:
        name: "사천당가"
        parent: odaesega
        description: "오대세가 독가 — 방계 전승이 독문으로 흘러나갔다"
      gaebang:
        name: "개방"
        parent: gupailbang
        description: "거지들의 방파. 정보와 발이 무기다 — 취걸개(폐사당 기연)가 파문 장로 출신."
      bulga:
        name: "불가"
        description: "사찰·승려 계열 — 문파가 아니라 계보다 (혜각 등 탁발승)"

      # ── 구파일방 (로스터 → 1급 승격: faction_politics 가 이들을 개별 참조한다)
      # 새 세력이 아니다 — 위 gupailbang.sects / odaesega.clans 명단에 이미 있던 이름에 id 를 붙였을 뿐이다.
      # (아미파는 승격하지 않는다 — 위 주석의 '추후 확장 콘텐츠' 존중. faction_politics roster 에
      #  registry: 예약 · active: false 로만 있다)
      gonryun:
        name: "곤륜파"
        parent: gupailbang
        description: "서역의 도가 문파 — 멀다. 천하가 뒤집혀야 배를 띄운다"
      jongnam:
        name: "종남파"
        parent: gupailbang
        description: "종남산 도맥 — 화산과 같은 섬서 땅, 대대의 앙숙"
      jeomchang:
        name: "점창파"
        parent: gupailbang
        description: "운남의 쾌검"
      ami:
        name: "아미파"
        description: "사천의 여승 문파 — 구파일방. 당가와 앙숙(독은 협이 아니다)."
        registry: 예약        # ★ 등록 등급은 **그대로 둔다** — 사용자가 정하지 않았다 (질문 목록)
        active: true          # ★★ 2026-07-13 사용자 결정 — **미설계가 끝났다.**
                              #   아미의 집이 생겼다: 「운해 비구니원」 (docs/design/ami_architecture.md ·
                              #   world_map.yml places.ami · RemoteBuilder.Archetype.비구니원)
                              # ★ 주의: `parent: gupailbang` 은 **여전히 붙이지 않았다** (사용자 결정 없음).
                              #   그것을 붙이면 §16 W-C 의 봉우리 집합이 바뀐다 — 건드리지 않는다

      cheongseong:
        name: "청성파"
        parent: gupailbang
        description: "청성산 검맥"
      haenam:
        name: "해남파"
        parent: gupailbang
        description: "해남도 — 무림에서 가장 먼 곳"

      # ── 오대세가 (로스터 → 1급 승격)
      moyong:
        name: "모용세가"
        parent: odaesega
        description: "요동의 세가 — 실리로 움직인다"
      jegal:
        name: "제갈세가"
        parent: odaesega
        description: "지략의 세가. 관에 줄이 있다 — 관을 읽는 눈이자, 관의 귀"
      paengga:
        name: "하북팽가"
        parent: odaesega
        description: "하북 도가(刀家). 도적 소탕이 가업 — 녹림과는 대를 이은 피"

  # 2. 사파 / 흑도 계열
  unorthodox:
    name: "사파 / 흑도 계열"
    hidden: false
    # ★★사파란 무엇인가 (사용자 확정 2026-07-28) — 「악」이 아니다.
    #   **개인의 능력을 과시하고, 개인이 강해지기 위해서라면 무엇이든 한다.**
    #   ★그러나 **적정선이 있다.** 혈교처럼 막 나가지 않는다 — 그 선이 이 계열의 정의다.
    #   ★그래서 세 계열이 같은 축의 세 눈금이 된다:
    #     **혈교는 선이 없고, 사파는 선이 낮고, 정파는 선을 말하면서 지키지 못한다.**
    #   ★제4막에서 사파가 손을 잡는 근거가 여기 있다 — 실리가 아니라 **「우리도 선은 있다」**.
    싸우는_이유: |
      제 힘으로 선다. 문파의 이름도 스승의 계보도 빌리지 않는다 —
      **강해지는 데 필요한 것을 한다.** 다만 넘지 않는 선이 있고, 그 선이 저를 사람으로 남긴다.
    members:
      # ★결(무공_색) 기입 2026-07-26 — 새외 6곳과 같은 문법으로 사파·금기에도 붙였다.
      #   그전까지 이 일곱은 **한 줄 설명뿐**이었다 (새외만 결이 있었다). 출처: haomoon.kr 무협/세력.
      #   ★계율 그대로: 이름·수치는 지어내지 않는다. 결은 자료가 말한 것만 옮긴다.
      #
      # ★★패도천 (사용자 거대 줄기 v2 Stage 1 · 2026-07-26 신설 · 2026-07-28 개명) — **무림맹의 대칭**
      #
      #   무림맹을 세울 때 만든 축이 그대로 적용된다: 분류 / 명단 / 기구.
      #     · unorthodox(사파 계열) = **분류**다 (컨테이너 — 결정하지 않는다)
      #     · 하오문·녹림·수로채·살막·낭인회 = **각자의 세력**이다 (연합의 명단이 없었다)
      #     · **패도천 = 기구다** — 사파가 「하나의 이름으로」 말하기 시작하는 자리
      #   ★사파에 기구가 없던 것은 새 줄기 때문이 아니라 **원래 구멍**이었다:
      #     정파는 토벌령을 낼 수 있게 됐는데(무림맹), 사파는 그것에 **응답할 주체가 없었다.**
      #
      # ★★개명 (사용자 확정 2026-07-28): 「사도천(邪道天)」 → **패도천(覇道天)**
      #   까닭 둘. ① 「사도천」은 참고 작품(화산전생)의 **고유 조어**다 — 남의 것을 안 쓴다.
      #     「패도(覇道)」는 왕도(王道)의 반대말로 **장르 공용어**이고, 우리 정의
      #     「**힘이 정하고 한 사람이 집행한다**」와 뜻이 정확히 맞는다.
      #   ② 수장 호칭이 「천주(天主)」였는데 **마교의 「천마(天魔)」와 헷갈렸다** (사용자가 실제로
      #     못 알아봤다 — 그것이 증거다). **패주(覇主)** 로 바꿔 혼동을 없앴다.
      paedocheon:
        name: "패도천(覇道天)"
        description: |
          사파 연합을 자칭하는 **기구** — Stage 1 에서 정파의 회합 도중 등장한다.
          ★명분: 「**정파는 위선이다**」 (Stage 3 에서 무력 반격의 근거가 된다).
          ★Stage 4 에서 **일부가 정파와 손을 잡는다** (「공동의 적이 있다면 과거는 덮을 수 있다」)
            → 패도천은 통째로 적이 아니다. **갈라지는 세력**이다. 그 갈라짐이 콘텐츠다.
        싸우는_이유: |
          ★**정파는 위선이다.** 의(義)를 말하면서 굶는 자를 굶게 두었고, 협(俠)을 말하면서
          제 문파의 이름을 먼저 지켰다. 우리는 그런 말을 하지 않는다 — **힘으로 서고 힘으로 말한다.**
          그리고 그것이 더 정직하다.
        무공_색: |
          ★**제 무학이 없다** — 무림맹과 같다 (기구이므로). 성원 세력의 무공을 쓴다:
          하오문의 은형·녹림의 부(斧)·수로채의 구(鉤)·살막의 차륜전·낭인회의 계보 없는 검.
          ★그래서 패도천의 힘은 무공이 아니라 **명분**이다 — 정파의 「토벌령」에 맞서는 「위선」.
        no_arts_by_design: true
        no_arts_reason: "기구(機構)다 — 성원 세력의 무공을 쓴다. 힘이 무공이 아니라 **명분**에 있다"
        기구_성격:
          결정_단위: 총관                   # 실무를 총괄하는 **대리인** (장로원·군사와 나란한 자리)
          결정_단위_note: |
            ★**합의체가 아니라 대리인이다.** 무림맹은 장로원(여럿의 합의)이 실질 권력인데,
            패도천은 **한 사람이 실무를 총괄**한다 — 패주의 뜻을 집행하는 자리이지 견제하는 자리가 아니다.
            → 그래서 대조가 한 겹 더 선명해진다:
              **정파는 합의하고, 사파는 힘이 정하고 한 사람이 집행한다.**
            ★기구의 취약점도 여기서 나온다: 총관 하나가 무너지면 패도천의 실무가 멎는다
              (장로원은 하나가 빠져도 남는다).
            ★수장이 레이드급 전투력을 갖는 대신 **실무는 대리인이 굴린다** — 그것이 우리
              수장 문법이다: **수장은 명령하지 않는다. 앞에 선다.**
          성원_범위: 일부만                 # ★확정 (2026-07-27) — 사파 다섯이 통째로 드는 것이 아니다
          성원_확정: [haomun, salmak, nanginhoe]        # ★낭인회는 통째로 든다 (2026-07-27 확정)
          성원_미결: [noklim, jangang_suroche]
          # ★★2026-07-28 — 이 둘의 거취가 **다시 열렸다.**
          #   그전의 제외 사유는 「적림십팔채(赤林十八寨)라는 별개 연합이 있다」였는데,
          #   그 기구를 **폐기했다** (참고 작품의 고유 조어라 우리 것이 아니다 — 아래 폐기 기록).
          #   → 제외할 근거가 사라졌으므로 **지어내지 않고 미결로 되돌린다.** 사용자 문답 대기:
          #     「녹림·장강수로채가 패도천에 드는가, 끝내 안 드는가 (든다면 왜 늦게 드는가)」
          낼_수_있는_것: [위선_규탄, 무력_반격, 정사_화친]   # 【제안】 — 무림맹의 명령권과 대칭
          대응물: "★ 무림맹의 거울 — 같은 층의 기구다 (정파: 토벌령 / 사파: 위선의 명분)"

        # ★수장 — 무림맹주와 대칭이되 **뽑는 방식이 정반대**다 (사용자 확정 2026-07-27)
        #   ★2026-07-28 개명: 천주(天主) → **패주(覇主)** (마교의 천마와 헷갈렸다)
        paeju:
          호칭: 패주(覇主)
          원칙: 무력                        # 가장 강한 자가 된다 — 사파의 결
          실질: 고정_이었다                 # ★창설자가 너무 강해서 안 바뀌었다 — **과거형이다**
          note: |
            ★이 둘의 어긋남이 곧 설정이다: 제도는 「도전해서 이기면 바뀐다」인데
            **아무도 못 이겼다.** 그래서 패도천은 겉으로 실력주의이고 속으로 일인 지배다.
            ★무림맹과 대칭: 무림맹주는 **선출**(제2막 이벤트)이고 장로원이 실질 권력이라
            정치로 흔들린다. 패주는 **선출이 없다** — 오직 무력으로만 바뀐다.
            → 제4막 연합(두 대표의 협력으로 유지되는 상태)에서 **정치로 흔들리는 쪽은 언제나
              무림맹**이다. 패도천이 흔들릴 때는 정치가 아니라 **누가 이겼을 때**다.
          선출_이벤트: 없음                 # ★무림맹의 maengju_seonchul 에 대응하는 박이 없다 (의도)
          정체: 순수한_사파_절대강자          # ★확정 (2026-07-27) — **혈교와 무관하다**
          # ★★플레이어가 앉을 수 있다 (사용자 확정 2026-07-28 · 안 (a))
          player_eligible: true
          player_route: 무력                # 이겨서 얻는다 — 세 자리 중 **유일하게 순수 전투**
          player_route_note: |
            ★「아무도 못 이겼다」는 **과거형**이다 — 플레이어가 **첫 예외**가 된다.
            제도(도전해서 이기면 바뀐다)가 처음으로 실제 작동하는 순간이고,
            그래서 패주 자리는 세 자리 중 **유일하게 「힘만으로」 얻는 자리**다.
          npc_fallback: true                # ★사파 쪽 플레이어의 역량이 부족하면 NPC 가 대체한다
          fallback_note: "맹주·천마와 같은 문법 — 세 자리 모두 사람이 못 채우면 세계가 채운다"
          # ★★무력의 결 (사용자 확정 「가져온다」 · 자료: 「1대1보다 1대 다수 혹은 다수 대 다수에
          #   특화된 심상구현」 · 「자존심이 세지만 **그 이상으로 실리를 중시**」):
          무력_결: 다수전_특화
          무력_결_note: |
            ★**혼자 여럿을 상대할 때 가장 강하다.** 1대1에서는 동급 고수에게 조금 밀린다.
            ★이것이 「사파에는 합격진이 없다」와 정확히 맞물린다 —
              **패주 혼자가 진(陣) 하나보다 낫다.** 그래서 사파는 대형을 배울 이유가 없었다.
              (정파는 다섯이 모여야 다섯 몫을 하고, 패주는 혼자 그 값을 낸다.)
            ★combat 축 대응: gang_up.engage_slots(포위 슬롯 3)·피포위 방어 이점의 **극단값**이다 —
              「1대다 방어 이점 +1/추가 적」을 뒤집어, 적이 많을수록 **공격**이 세지는 결.
              수치 배선은 npc_combat 회차 (지금은 결만 선언한다).
          성격: 실리_우선                   # 자존심보다 실리 — ★제4막에서 손잡는 근거가 여기 있다
          성격_note: "체면을 위해 죽지 않는 자다. 부딪히기보다 회유를 택하고,
            불리하면 「나는 도움이 안 되겠다」고 솔직히 물러난다"
          정체_귀결: |
            ★이 한 줄이 제4·6막의 무게를 정한다 (2026-07-28 개정 — 혈교는 조종하지 않는다):
              · 패도천은 **혈교와 아무 관계가 없다.** 속은 것도 잠식된 것도 아니다.
              · 그래서 제4막의 손잡음이 **진심**이다 — 함정이 아니다.
                ★그 근거는 실리가 아니라 **「우리도 선은 있다」**이다 (사파 정의 참조):
                사파는 강해지기 위해 무엇이든 하지만 **넘지 않는 선**이 있고,
                혈교가 그 선을 넘는 것을 본 순간 패도천이 움직인다.
              · 그리고 제6막에서 **혈교에 가장 분노하는 자가 패주**다
                (「모두의 적」이 될 때 패도천이 앞장서는 이유가 서사로 선다)
          미결: "이름·내력 (누구인지는 아직 — 다만 **혈교가 아니다**는 확정됐다)"

        # ★★칠성사 절은 **폐기됐다** (2026-07-28) — hyeolgyo 절의 폐기 기록을 보라.
        #   혈교는 잠입하지 않는다. 그러므로 패도천 안에 혈교의 손은 없다.

        exists_at_alpha: false            # Stage 1 등장 — 알파(Stage 0)에는 없다
        founded_in_stage: 1
        player_entry: false               # ★확정 — 입문 불가. 성원 세력을 통해서만 (무림맹과 같은 문법)
        player_entry_note: "하오문·녹림 등 성원 세력에 들면 패도천에 속하는 셈이다. 기구에는 직접 안 든다"
        미결_문답:
          - "★녹림·장강수로채가 드는가 (적림십팔채 폐기로 **다시 열린** 문답)"
          - "패주(창설자)의 이름·내력"
          - "Stage 4 에서 갈라질 때 **어느 성원이 정파 쪽으로 가는가**"
      #
      # ★★낭인회 신설 (2026-07-26) — **눈이 낸 문답이 자료로 닫힌 자리다.**
      #   lint_faction_coverage 가 「컨테이너 사파/흑도 계열에 음풍검이 붙어 있다」를 잡았고,
      #   그 답이 「어느 문파도 아닌 무공」이면 1급 id 를 세워야 한다고 했다.
      #   자료에 그 세력이 있었다: **낭인회** — 「주군 없이 떠도는 무인들이 모여 만든 연합」.
      #   orthodox_heroes(문파에 소속되지 않은 정파 성향 무인들)의 사파 쪽 짝이다.
      nanginhoe:
        name: "낭인회"
        description: |
          주군 없이 떠도는 무인들의 연합 — ★**문파가 아니다.** 영속 구조가 없고 의뢰로 굴러간다.
          가입·탈퇴가 자유롭고, 각자가 제 기술로 먹고산다 (무공·암기·첩보·경호).
          산문이 없다 — 낭인객잔·은신처·폐가를 그때그때 거점으로 쓴다. 무대는 강호 전역과 변방.
          축: 회주(비공식 리더) · 조장(의뢰별 지휘) · 낭객(일반) · 비호(은신처·물자).
          ★**낭인왕(浪人王)** — 가장 센 자에게 주는 칭호인데 **낭인회 소속이 아니어도 받는다**
            (조직이 칭호를 소유하지 못한다 — 이 세력이 조직이 아니라는 증거).
        무공_색: |
          ★**계보가 없다.** 사사(師事)와 암시장 비급으로 배운 것들이 섞인다 —
          그래서 낭인의 무공은 **문파의 사다리를 타지 않는다** (계열은 있고 계보는 없다).
          현재 등재: 음풍검(검법 — "사파 낭인 사사 또는 암시장 비급").
          ★게임 기계로서의 값: 문파에 안 들어간 플레이어가 **무공을 배울 수 있는 사파 쪽 문**이다
            (정파 쪽은 orthodox_heroes 가 그 자리). 살막과 다르다 — 살막은 조직이고 이쪽은 시장이다.
      # ★★폐기 기록 — 적림십팔채(赤林十八寨) (2026-07-27 신설 → **2026-07-28 폐기**)
      #
      #   무엇이었나: 녹림구채(9) + 수림구채(9) = 열여덟 채. 산적·수적의 별개 연합으로 세워
      #   「사파에 기구가 둘」을 만들었다 (명분의 연합 / 길목의 연합).
      #
      #   ★왜 걷었나: **참고 작품(화산전생)의 고유 조어**였다. 「녹림」은 장르 공용 자산이지만
      #     「적림십팔채」라는 이름도, 9+9=18 이라는 구성도, 사파를 문파형/도적형으로 가르는
      #     축도 전부 그 작품이 발명한 것이다. 사용자 판정: **너무 닮았다 — 뺀다.**
      #     ★계율로 남긴다: **장르가 공유하는 가구와 한 작품이 발명한 것을 갈라라.**
      #       무림맹·녹림·하오문·개방·총관·장로원은 공용이라 그대로 쓰고,
      #       한 작품만 쓰는 조어(적림십팔채·칠성사·사도천·흑영부·상천십좌)는 안 쓴다.
      #
      #   ★함께 폐기된 한 줄: 「사도천은 **사람을 팔고**, 적림십팔채는 길을 판다」 —
      #     사파의 새 정의(「적정선이 있다」)와 정면으로 충돌한다. **사람을 파는 것은 혈교 쪽 말**이다.
      #
      #   남은 것: 사파의 기구는 **패도천 하나**다. 녹림·장강수로채의 거취는 미결로 되돌렸다
      #   (paedocheon.기구_성격.성원_미결 참조 — 지어내지 않는다).

      haomun:
        name: "하오문"
        description: |
          정보망에 가까운 조직. 정파와도 때로 거래 대상이 된다.
          ★본래 이름은 **하오문(下五門)** — 다섯 밑바닥 직업이다: 점(店 점소이)·각(腳 짐꾼)·
          아(牙 인신매매)·차(車 마부)·선(船 뱃사공). 여기에 소매치기·기녀·노름꾼이 붙는다.
          ★개방과 **쌍벽**이다 (개방=거지의 발, 하오문=장사치의 귀). 녹림보다 크다.
          점조직이라 수뇌부의 자리를 아무도 모른다 — 그것이 이 문파의 방어다.
        무공_색: |
          독공·암기·은형술 (간부만) · 기녀는 **색공·음공**.
          ★**대부분의 문도는 무공이 없다** — 그것이 구멍이 아니라 정보망의 값이다
          (점소이가 강하면 아무도 그 앞에서 말하지 않는다).
          정면으로 싸우지 않는다. **빈틈**을 판다 — 판정이 아니라 자리를 먼저 산다.
        # ★★★안 따진다 (사용자 확정 2026-07-28) — 이 문파의 성질이 세계의 기제가 된다
        안_따진다:
          주인을_안_묻는다: |
            ★가게가 하오문 망에 물려 있으면 **누구 것인지 안 묻는다.**
            → 그래서 **마존이 저잣거리에 가게를 갖고 있어도 위장이 아니다**
              (magyo.저잣거리의_손 참조). **숨은 게 아니라 아무도 안 물어본 것이다.**
          사는_사람을_안_따진다: |
            ★정보를 **무림맹에도 팔고 패도천에도 팔고 마교에도 판다.**
            > ★★★**저잣거리에서 한 일은 세 곳이 다 듣는다.**
            → 세 자리(맹주·패주·천마)의 **진입이 같은 문에서 갈린다**
              (magyo.하오문의_귀.플레이어_천마_루트 참조).
          ★왜_이것이_배신이_아닌가: |
            사파의 정의는 **「강해지기 위해 무엇이든 하되 넘지 않는 선이 있다」**이다.
            **파는 것은 선 안이다.** 안 파는 것은 장사가 아니라 **편드는 것**이고,
            하오문은 편들지 않는다 — 그것이 200년을 살아남은 방법이다.
      noklim:
        name: "녹림"
        description: |
          산채를 근거지로 하는 도적 연합 — **녹림칠십이채(綠林七十二寨)**.
          18·36·72·108채로 세는 분산 조직이라 관군 토벌이 뿌리를 못 뽑는다.
          ★자체 율법 **청록대전(淸綠大典)** 이 있다 — 도적이지만 법이 있다. 서로를 형제라 부른다.
          교통로·상로의 목을 잡아 통행세를 거둔다. ★하북팽가와는 대를 이은 피.
        무공_색: |
          **부(斧)·창** — 실전형 병기 (자료 그대로).
          ★**내공보다 외공에 치중한다** — 심법 0 은 구멍이 아니라 **결이다**
          (B-188 구멍 지도의 「사파 결이면 의도」 문답이 여기서 닫힌다).
          녹림왕(총채주)만 내외공을 겸한다 — 그래서 녹림왕이 곧 그 산채의 천장이다.
          ★전략: 머릿수로 위협하되 **진짜 무림인과는 싸우지 않는다** (현실적 생존).
      jangang_suroche:
        name: "장강수로채"
        description: |
          수로를 장악한 흑도 세력 — 장강(양자강)의 수적. **열여덟 수채의 연합**
          (고전에서는 십이연환오·칠십이연환오). 동정호·파양호가 안뜰이다.
          거점이 땅이 아니라 **배와 섬**이다 — 관군이 포위할 벽이 없다.
          약탈 + **통행세**(강북↔강남 수로를 잡았다) + 물류 통제 + 정파·동영과의 밀무역.
          ★칭호: 수왕(水王). "정파 애송이들에게 물에서 싸우는 것이 무엇인지 보여주거라"
        무공_색: |
          **수전(水戰) 특화** — 물의 유연함과 파도의 역동을 쓴다. 호흡과 잠영으로 배 밑을 따 침몰시킨다.
          ★**쇠사슬 달린 무기** — 배를 잇고 상대를 **속박**한다 (자료 그대로).
            → B-188 기준표의 **구(鉤) ★0** 이 해소되는 자리가 여기다 (기준표가 이미 지목해 뒀다).
          ★물 위에서는 정파 무가보다 **우월하다** — 경지가 아니라 **땅**이 정하는 유일한 세력.
      salmak:
        name: "살막"
        description: |
          청부 살수 조직. 고정 거점이 없다 — 폐허·은신처·유랑객 숙소를 옮겨 쓴다.
          ★**구성원끼리도 서로의 실체를 모른다** (내부 구조가 조직 자신에게도 은폐돼 있다).
          양성 방식이 비인격적이다: 고아에게 번호를 주고 동기끼리 살려 남긴다.
          ★칭호: 암존(暗尊 — 최정예) · 살수(일반). 근거지는 대막·새외 같은 외진 곳.
        무공_색: |
          변장·은신·경공 + **심박 조절** (숨을 죽이는 것이 첫 무공이다).
          ★**차륜전(車輪戰)** — 한 번에 하나의 의뢰만 받고, 목표가 죽을 때까지 **인력을 점차 밀어넣는다.**
            이 세력의 값은 개인의 강함이 아니라 **끝나지 않는다는 것**이다
            (한 명을 이겨도 다음이 온다 — 다른 어느 세력과도 다른 결).
      dokmun:
        name: "독문"
        description: "독을 다루는 방계 문파들 (사천당가 방계 전승 — 칠살음독경의 출처)"
        무공_색: |
          ★자료(haomoon.kr) 에 이 세력의 항목이 **없다** — 우리 세계의 것이다 (당가 방계).
          그래서 결은 당가와의 **차이**로만 정한다: 당가는 가문의 재가로 독을 쥐고,
          독문은 **재가 없이 흘러나간 구결**로 쥔다 — 같은 심법(칠살음독경), 없는 계율.
          ★현재 심법 1·무공 0 — 손이 없다. 채움은 ⑧회차 (마교와 짝: 둘 다 심법만 있다)

  # 3. 사교 / 금기 계열 — 초기 튜토리얼에서는 직접 노출하지 않는 장기 위협
  forbidden:
    name: "사교 / 금기 계열"
    hidden: true          # 초기에는 플레이어 출력에 비노출
    members:
      # ★★★마교 대개편 (사용자 확정 2026-07-27~28) — 「금기 세력」에서 **이유가 있는 세력**으로.
      #
      #   ─── 폐기된 것 (등록부에 적혀 있었고, 새 확정과 정면으로 어긋났다) ───
      #   ① `소교주 = 교주의 자식 중 가장 강한 자` — **혈통 승계였다.**
      #      ★교단은 핏줄이 아니라 **믿음**으로 잇는다. 핏줄로 이으면 「버려진 자들이 모인 곳」이라는
      #      기원이 통째로 무너진다 (그냥 또 하나의 세가가 된다). → **전대 천마의 지목**으로 갈았다.
      #   ② `마존은 전문으로 갈린다 (독마·검마·혈마·권마·환마·음마·도마·화마·광마)` — 아홉이 **무공 종류**로
      #      갈렸다. → 새 확정: **다섯이고, 사상으로 갈린다.** 능력이 사상에 딸려 온다.
      #      (그리고 「혈마」가 혈교 쪽 말과 겹쳐 있었다 — 함께 걷었다.)
      magyo:
        name: "마교"
        description: |
          ★이름이 여럿인 것이 이 세력의 성질이다: **천마신교**는 내부의 이름
          (교주를 천마라 부르기 때문) · **마교**는 **밖에서 부르는 이름**이다.
          ★그래서 「마교」라는 말은 세력의 이름이 아니라 **중원의 판단**이다 —
            배화신교가 마교로 오해받는 기계(faction_politics 오해 밴드)가 여기서 정당해진다.
          ★★그리고 **마교 스스로도 저를 두 겹으로 나눠 부른다** — 아래 `두_겹` 참조.
        # ★★★두 겹 — 구(舊) 천마신교 / 신(新) 천마신교 (인박스 회차 1 확정 1·2)
        #   ★「천마신교」는 **내부의 이름**이므로, 구/신을 가르는 것은 **마교 스스로의 자기 서술**이다.
        두_겹:
          구_천마신교: |
            **창건기.** 훨씬 과격하고 잔인했다.
            ★그 과격함은 마존들의 뜻이 아니라 **밑에서 온 것**이다 (아래 `구_교도` 참조).
          대충돌:
            언제: "200년 전"                  # 【제안】 수치 — 빨간펜 대상
            상대: "흩어진 정파들"              # ★그때 무림맹은 없었다 (제2막 창설)
            선공: 마교                        # ★★인박스 회차 2 확정 9
            선공_note: |
              ★★**마교가 먼저 쳤다. 다만 마존이 결정한 게 아니라 밑이 터진 것이다.**
              → 마교를 악당으로 만들지 않는다 — **계획한 게 아니라 못 붙든 것**이다.
              ★★★**가해자는 기억하고, 피해자는 잊었다.**
                초대는 살아 있고, 정파는 200년에 다 잊었다.
              ★귀결: 200년간 「제 영역을 지킨다」가 **평화가 아니라 속죄**가 된다.
              ★귀결: 제5막에 2대 천마의 물음이 생긴다 —
                ***우리가 먼저 쳤는데 청구할 자격이 있는가.***
            결말: |
              **양쪽에 너무 많은 사망자가 났다** → 서로의 영역을 존중하게 되었다.
              > **맹이 없어서 못 막았고, 못 막아서 양쪽이 다 죽었다.**
          신_천마신교: |
            시대가 변하고 **제 영역을 지킨다.** 지금의 마교.
            ★그런데 그 200년이 안에서 무엇을 했는지는 아래 `majon.신` 을 보라 —
              **지킨 것이 아니라 굳은 것**이었다.
          ★왜_이_구분이_중요한가: |
            ★정본에 이미 있던 *「증오는 오래 못 간다. 그래서 신을 세웠다」*가
              **구→신 전환의 이유**가 된다: 증오로 세웠는데 증오가 식었고, 남은 것이 교단이다.
            ★★**200년은 사람의 기억보다 길고 교단의 기억보다 짧다.**
              > **정파는 잊었고, 마교는 잊지 않았다.**
              정파 쪽엔 그 전쟁을 본 사람이 하나도 없는데, 마교엔 **그때 그 사람(초대)이 아직 앉아 있다.**
              → **제5막 침공이 정파에게 날벼락인 이유**다. 청구서를 받는 쪽은 빚진 줄도 모른다.
            ★제2막 무림맹 창설의 동력이 **두 겹**이 된다 — 패도천 때문만이 아니라
              **「그때 그 일을 다시 겪지 않으려고」**.
        # ★★기원 — 이 세력은 악의로 생기지 않았다 (사용자 확정 2026-07-27)
        기원: |
          **초기 부패한 정파에게 핍박받은 자들이 모여 만들었다.**
          늙어서 버려진 자, 굶어 죽은 아이, 목말라 죽은 아이, 얼어 죽고 독에 죽고
          불에 죽고 물에 빠져 죽은 자들 — **세상을 증오하는 사람들**이 모였다.
          ★★★그 목록을 다시 읽으면 **아무도 칼에 안 죽었다**:
            **그들은 죽임당한 것이 아니라, 죽게 내버려졌다.**
            → 그래서 `싸우는_이유` 가 「죽였다」가 아니라 **「죽게 두었다」**인 것이다.
          ★그리고 **증오하고 저주하는 데 그치지 않았다.** 교단을 만들었다. 그것이 이 세력의 심장이다.
          ★왜 하필 종교였나: **증오만으로는 못 산다.** 복수는 끝나면 아무것도 안 남는다.
            그래서 「이 모든 것은 하나가 관리해야 한다」는 말이 필요했다 —
            **증오에 형태를 준 것이 교리다.** 한 줄: **증오는 오래 못 간다. 그래서 신을 세웠다.**
          ★★그리고 우리 세계에서만 성립하는 것: 무림맹은 **제2막에 처음 창설된다.**
            즉 그 시절 정파에는 **책임질 기구가 없었다.** 굶어 죽는 아이를 막을 자가 없었던 게 아니라
            **막을 「곳」이 없었다.** → **마교는 무림맹이 없던 시절의 청구서다.**
            (그래서 제2막의 무림맹 창설은 「늦어도 한참 늦은 답」이 된다.)
        싸우는_이유: |
          세상이 우리를 **죽게 두었다.** 그러니 세상을 이대로 둘 수 없다.
          ★다만 **무엇을 할 것인가에서 다섯으로 갈린다** (아래 마존 다섯) —
          마교가 하나로 안 움직이는 이유가 여기 있다.
        # ★★★구 교도 = 5욕 (인박스 회차 2 확정 10) — ★마존이 아니라 **교도**다
        구_교도:
          다섯_욕: [식욕, 수면욕, 성욕, 재물욕, 지배욕]
          왜_마존이_아니라_교도인가: |
            ★마존에 욕망을 붙이면 마교가 **처음부터 욕망 교단**이 되고 **혈교와 구분이 흐려진다.**
            욕망은 **밑**에 있었다. 위에는 다섯 사상이 있었다.
          근거: |
            ★근거는 이미 정본에 있었다 — **마교는 문턱이 없다. 아무도 안 막으니 아무나 왔다.**
            죽어가던 자들만 온 게 아니라 **원하는 것이 있는 자들도 왔다.**
            ★★정파와 **글자 그대로 같은 문법**이다:
              · 정파: **맹은 이기려고 커졌고, 커지느라 아무나 받았다**
              · 마교: **아무도 안 막으려고 문턱을 없앴고, 없애느라 아무나 받았다**
          귀결: |
            ★**구 천마신교가 왜 그토록 과격했는지**가 설명된다 — 마존의 뜻이 아니라 **밑이 그랬다.**
            ★**초대는 200년 전에 한 번 놓쳤다.** 「붙든다」가 다섯만이 아니라 **교단 전체**를 붙드는 일이 된다.
            ★★**「문턱이 없다」가 마교의 자랑이면서 동시에 그 죄**가 된다.
              (정본은 그 대가를 **사망률**로만 적어 뒀다 — 대가가 하나 더 있었다.)
          미결: "다섯 욕을 세계 안에서 뭐라 부를 것인가 (현대어 금지)"
        # ══════════════════════════════════════════════════════════════════
        # ★★★사회에 녹아든 손 — 마교는 산에만 있지 않다 (사용자 확정 2026-07-28)
        #
        #   ─── ★먼저 안 한 것을 적는다 (계율) ───
        #   대화 중 「**하오문의 문주가 알고 보니 마존이었다**」 안이 나왔으나 **걷어냈다.**
        #   그것은 이번 세션 내내 폐기해 온 **위장 구조**이고 (원작 자료의 「천선이 하오문주로
        #   위장했다」와 글자 그대로 같다), 주체를 혈교→마교로 바꿔도 모양이 같다.
        #     > **이름을 다 갈아도 구조가 남으면 여전히 같은 이야기다.** (세계 정본 §8)
        #   ★그리고 깨지는 것이 하나 더 있다: **하오문은 패도천 성원**이다. 그 문주가 마교면
        #     **제4막 연합이 통째로 함정**이 된다 — 「패주가 혈교였다면 연합이 함정이 됐을 것,
        #     그 길을 안 갔다」와 같은 실수가 된다.
        # ══════════════════════════════════════════════════════════════════
        저잣거리의_손:
          위장이_아니다: true
          한_줄: |
            > ★★★**마존은 하오문에 숨어들지 않았다. 하오문의 어떤 가게가 마존의 것일 뿐이다.**
            > 그리고 하오문은 **원래 주인 이름을 안 묻는 곳**이다.
          ★문법: |
            혈교에 쓴 구분과 같은 문법이다 — 거기서는 **「숨는 것과 안 보이는 것은 다르다」**였고,
            여기서는 **「숨는 것과 아무도 안 묻는 것은 다르다」**이다.
            ★등록부가 이미 그렇게 적어 뒀다: 하오문은 *「점조직이라 수뇌부의 자리를 아무도 모른다」*.
          자리의_크기: 가게_주인               # ★문주가 아니다 — 조직을 못 움직이고 **제 것만 굴린다**
          자리의_크기_note: |
            ★그래서 **「개인의 유흥」**이 맞는 말이 된다 — 조직의 전략이 아니라 **개인의 욕망**이고,
            그것이 곧 **신 마존의 정의**다 (욕망으로 올라온 자들).
          왜_있나: |
            ★★**침투가 아니라 살림이다.** 「제 영역을 지킨다」의 영역은 산이 아니라 **먹고사는 것**이다.
            교단이 200년을 버티려면 **돈과 사람**이 필요했다.
            → 아무도 안 묻던 질문에 답이 생긴다: **마교는 200년을 어떻게 먹고살았나.**
          이미_배선된_것과_맞물린다: |
            · 신 「거둔다」 = **영기·천재지보를 탐한다** → 그것을 사려면 **돈줄**이 있어야 한다
            · 신 「덮는다」 = **아무도 못 떠나게 한다** → ★**기루가 정확히 그 도구**다 (손님도, 기녀도)
          ★반전보다_무섭다: |
            플레이어가 하오문 루트로 한참 놀다가 **어느 날 주인을 만난다.**
            정체를 벗는 것이 아니라 —
            > **처음부터 거기 있었는데, 아무도 물어보지 않았을 뿐이다.**
          ★제5막의_그림이_바뀐다: |
            침공이 국경에서 오지 않는다. **이미 안에 있던 가게들이 어느 날 문을 닫는다.**
          미결: "마존별로 무엇을 갖고 있나 (지금 확정은 「덮는다」의 **기루** 하나)"
        # ══════════════════════════════════════════════════════════════════
        # ★★★하오문의 귀 = 천마의 눈 (사용자 확정 2026-07-28)
        #   ★비어 있던 자리를 메운다: 승계가 「전대의 인정」인데
        #     **초대가 어떻게 후보를 찾는가**가 없었다. 시한부인데 산에 앉아 기다릴 수 없다.
        # ══════════════════════════════════════════════════════════════════
        하오문의_귀:
          어떻게: 산다                        # ★잠입이 아니다 — 하오문은 원래 정보를 판다(「장사치의 귀」)
          무엇에_쓰나: [전황_파악, 인재_모으기, ★천마의_그릇_찾기]
          왜_지금인가: |
            200년간 안 하던 일을 **지금** 한다. **초대가 시한부이기 때문**이다.
            > **200년을 기다렸는데, 이제 시간이 없다.**
            → 「시한부가 마교에 속도를 준다」가 **말이 아니라 행동**으로 나타난다.
          ★무엇을_찾는가: |
            ★그릇은 **이름을 비울 수 있는 자**다 (기명각). 그러니 찾는 것이 **무공 실력이 아니다.**
            > ★★**문파는 제자를 고르고, 마교는 버릴 것이 없는 자를 찾는다.**
            ★그리고 하오문이 그것을 제일 잘 안다 — **밑바닥의 사람들을 아는 곳**이니까
              (점·각·아·차·선 = 점소이·짐꾼·인신매매·마부·뱃사공).
            ★★그리고 이것이 마교의 기원과 같은 결이다:
              **200년 전에는 모여든 자들을, 이제는 찾아 나선다.**
          # ★★★플레이어 천마 루트가 여기서 열린다 (사용자 확정)
          플레이어_천마_루트: |
            ★★세 자리의 **진입 문법이 각각 다르다**:
              · 정파 = 문파에 **입문한다** (시험)
              · 사파 = **값을 낸다** (또는 낭인회)
              · 마교 = ★**저쪽이 먼저 본다**
            → 플레이어가 저잣거리에서 한 일이 하오문 망을 타고 **산으로 보고된다.**
              앞서 세운 **「가게 주인 마존」이 그 망의 말단**이다 — 구조가 하나로 이어진다.
          # ★★★가드 — 이게 없으면 마교 전용 편의가 된다
          ★하오문은_여러_곳에_판다: |
            같은 정보를 **무림맹도 사고 패도천도 산다.** 하오문은 **사는 사람을 안 따진다** —
            그것이 하오문이고, 사파의 정의(적정선은 있되 장사는 한다)와도 맞는다.
            > ★★★**저잣거리에서 한 일은 세 곳이 다 듣는다.**
            → 마교 전용 편의가 아니라 **세계의 기제**가 되고,
              **세 자리(맹주·패주·천마)의 진입이 같은 문에서 갈린다.**
          미결: "보고가 실제로 어떤 기계를 타는가 (소문망? 명성? 개인 노선?) — 배선 회차"
        # ★★★뜻은 전달되는 동안 반드시 변한다 (인박스 회차 1 확정 7)
        ★법칙_뜻은_변한다: |
          정본은 *「정파 밑에 자릿세가 있듯 마교 밑에도 제 몫을 챙기는 자가 있다」*고만 했는데
          **왜**가 없었다. 이제 있다:
          **200년이라는 같은 시간이 두 세력을 같은 방식으로 상하게 했다.**
          정파는 다시 세우는 동안 밑이 썩었고, 마교는 물려주는 동안 갈래마다 굳었다.
          → 두 세력이 같은 병을 앓는 것이 **우연에서 법칙**이 된다.
          ★★그리고 **방향이 정반대**다:
            > **정파는 밑이 썩었고, 마교는 위가 썩었다.**
            → 플레이어의 과제가 갈린다: **맹주는 못 보는 것을 봐야 하고, 천마는 보이는 것을 쳐야 한다.**
        # ★★천마(天魔) — 사람이 아니라 **자리**다
        cheonma:
          호칭: 천마(天魔)
          정의: |
            ★**천마는 신이 아니라 신의 그릇이다.** 신은 하나이고 사람은 갈린다 —
            그래서 「하나가 관리해야 한다」는 교리와 **대를 잇는 것**이 모순되지 않는다.
            ★그릇이 되려면 **먼저 제 이름을 비워야 한다** (기명각 참조).
            ★★그리고 이것이 「천마는 언제나 최강자다」의 근거다:
              **그릇이 되면 신이 들어온다.** 인정받는 순간 최강이 된다 — 강해서 뽑히는 게 아니다.
          # ★★★「신」이 무엇인지는 **비워 둔다** (인박스 회차 1 확정 11)
          #   ★혈교의 `싸우는_이유: 없음` 과 **같은 문법**이다 — 빈칸이 아니라 **선언**이다.
          신의_정체: 비워_둔다
          신의_정체_note: |
            *「신은 하나이고 사람은 갈린다」*까지만 둔다. **그 이상 적지 않는다.**
            ★이유: 정체를 밝히는 순간 **신에게 목적이 생기고**, 목적이 생기면
            마교 이야기가 **신의 이야기**가 된다. 이 이야기는 사람의 이야기여야 한다.
          # ★★★천마의 무공 = 신을 이는 법 (인박스 회차 1 확정 10 · 사용자 발안)
          무공: 신을_이는_법
          무공_note: |
            ★수련 = **그릇 키우기.** 최강인 까닭은 무공이 세서가 아니라 **더 많이 이고 있어서**다
              → 「천마는 언제나 최강자」가 **완전히 기제**가 된다.
            ★**2대 천마(플레이어)의 성장축이 그대로 나온다** — 지목 직후엔 조금 이고,
              제5막쯤엔 많이 인다.
            ★★**혈교와 정면 대비**:
              > **마교는 이고, 혈교는 먹인다.**
              둘 다 사람 밖의 것을 쓰는데, 마교는 **제 몸으로 받치고** 혈교는 **남을 제물로 바친다.**
              → *「혈교는 선이 없다」*가 한 번 더 증명된다.
            ★★**마존이 천마가 못 되는 이유가 여기 있다**: 그 무공은 **기명각을 지나 이름을
              비운 자만** 익힌다. 다섯은 **제 계보의 이름을 지고 있어서 못 비운다.**
          # ★★「이겨도 못 얻는다」 (인박스 회차 1 확정 4) — world_bible §7-1 의 답
          #   ★「천마는 항상 최강」과 「마존이 넘본다」의 충돌을 이렇게 풀었다:
          #     **최강 설정은 그대로 둔다.** 다만 무력으로는 아무것도 해결되지 않는다.
          최강이지만_해결되지_않는다: |
            > **천마는 아무에게도 지지 않는다. 그래서 아무것도 해결되지 않는다.**
            마교의 힘은 천마 하나가 아니라 **사람 수**다. 계보가 갈라지면
            **쪼개진 마교는 제5막에 정파를 칠 수 없다.**
            ★★귀결: **붙든 계보의 수 = 제5막 침공의 규모** → 엔딩 A/B(마교 승패) 축에 직결된다.
            ★귀결: **붙듦 ↔ 숙청**이 같은 손잡이의 양끝이다 (붙들 수 없는 자는 쳐야 한다).
          현재_대수: 1                        # ★초대가 아직 살아 있다 (사용자 확정 2026-07-28)
          승계_원칙: 전대_천마의_인정          # ★혈통도 무력 시험도 아니다. **지목**이다
          승계_note: |
            ★세 기구의 승계 문법이 셋 다 다르다 — 그리고 그것이 세 갈래 플레이의 정점이 된다:
              **무림맹주는 뽑히고(평판) · 패주는 이기고(무력) · 천마는 지목받는다(인정).**
            ★규칙이 **아직 한 번도 안 쓰였다** (초대가 재임 중이므로). 플레이어의 승계가 **첫 번째**다
              → 마존들이 「왜 그자인가」를 물을 수 있다. **갈등이 자동으로 선다.**
          player_eligible: true
          player_route: 인정
          player_route_note: |
            ★★**제5막(정사 vs 마교)이 시작될 때는 이미 승계가 끝나 있어야 한다** (사용자 확정).
            천마 노선을 탄 플레이어가 없으면 **NPC 2대가 이미 앉아 있다.**
            → 그래서 **마교 침공을 이끄는 것은 2대**다 (초대가 아니다).
          npc_fallback: true
          전투_규격: 레이드                   # ★★플레이어 셋이 붙어야 잡을 정도 (사용자 확정 2026-07-28)
          전투_규격_note: |
            ★자리가 **실제 전투력을 준다** — 「그릇이 되면 신이 들어온다」가 그 설정 근거다.
            맹주·패주도 같은 급이다. 그리고 전투 배치는 NPC 가 자동으로 하므로 —
            ★**수장은 명령하지 않는다. 앞에 선다.** 장수가 아니라 고수다.
        # ★★초대 천마 — **아직 살아 있다.** 그리고 시한부다 (사용자 확정 2026-07-28)
        chodae_cheonma:
          정체: "핍박받던 자 중 하나 · 무예의 천재 · **창건 당시 세계 최강자**"
          생존: true                          # ★알파 시점에 재임 중이다
          기명각_출신: false                  # ★초대만 그곳을 안 거쳤다 (그가 세웠으니까)
          # ★★★나이 (인박스 회차 1 확정 8) — 수치는 전부 【제안】 (빨간펜 대상)
          나이: 250                           # 【제안】
          겉모습: 50                          # 【제안】 — 신을 인 순간부터 안 늙는다
          나이_셈: "창건 25살 → 교단이 전면전을 할 만큼 크는 데 25년 → 대충돌 때 50살 → +200년 = 250살"
          나이_note: |
            **200년째 쉰 살이다.**
            ★★그런데 **그릇에 금이 갔고 신이 새고 있다** →
              > **마교가 초대의 죽음을 알아채는 방법: 그가 늙기 시작했다.**
              시한부가 설정이 아니라 **눈에 보이는 사건**이 된다.
              그걸 본 순간부터 **다섯 계보가 셈을 시작한다.**
            ★★**200년의 대가**를 정확히 적으면 — 초대는 그들을 **다 안다.**
              다만 **그 일을 같이 겪은 사람이 하나도 없다.**
              > **200년의 대가는 아는 사람이 없어지는 것이 아니라, 말이 안 통하게 되는 것이었다.**
            ★미결: 「늙기 시작한」 것을 **지금 누가 아는가** (다섯 다인가, 하나뿐인가)
          # ★★★왜 200년을 살았나 = 「신을 이고 있어서」 (인박스 회차 1 확정 9)
          장수의_까닭: 신을_이고_있어서
          반로환동: false
          장수의_까닭_note: |
            몸 안에 신이 들어앉아 있으니 **사람의 수명이 안 통한다.**
            ★★**오래 산 이유와 죽어가는 이유가 같은 것**이 된다 — **물을 담은, 금 간 항아리.**
              물이 있는 한 안 마르지만, 금 때문에 200년째 새고 있다.
            ★**반로환동을 안 쓰기로 한 까닭** 둘:
              ① 오래 산 이유가 **둘로 갈린다** (신 + 반로환동 = 설명이 겹친다)
              ② 참고 자료(「천마실록」) 조각의 **「천마 = 반로환동」**과 조합이 겹친다
                 (세계 정본 §8 층 3 — **이름을 갈아도 구조가 남는다**)
            ★귀결: **2대 천마(플레이어)도 그릇이 되면 안 늙는다.**
              → 개인 엔딩 D-3 「선경」과 이어질 여지가 있다 (미결).
          # ★★★초대는 답을 내지 않았다 (인박스 회차 2 확정 8)
          초대의_답: |
            ★정본의 마존 다섯 중에 **초대의 답이 없는데, 그것이 비어 있는 게 아니라 그 자체가 답**이다.
            > ★★★**다섯은 무엇을 할지를 정했고, 초대는 그들이 갈라지지 않을 곳을 지었다.**
            ★귀결: **「붙든다」가 나중에 생긴 역할이 아니라 처음부터 그의 유일한 일이었다.**
              그래서 그가 죽으면 갈라진다 — **그것만 하던 사람이 사라지니까.**
          시한부: true
          병: |
            ★**올곧은 방향으로 성장하지 못했기에** 막을 수 없는 병을 얻었다.
            ★★그리고 이것이 마교의 정의와 한 줄로 이어진다:
              초대는 무공을 준 게 아니라 **문턱을 없앴다** (정파는 문파에 들어야 배우고
              사파는 값을 내야 배우는데, 마교는 아무나 배운다). 대신 **버티지 못하면 죽는다.**
              → **그 길이 처음 죽이는 자가, 그 길을 연 자다.**
            ★★한 줄: **초대는 신을 담기엔 금이 간 그릇이었다.** 신은 그대로인데 그릇이 못 버틴다.
              그래서 「최강인데 시한부」가 모순이 아니라 **같은 원인의 두 얼굴**이고,
              후계가 필요한 이유가 정서가 아니라 **물리**가 된다 — **온전한 그릇이 필요하다.**
          병명: 없음                          # 【제안】 이름을 안 붙인다 — 아무도 이 길을 가본 적이 없다
          왜_지배하지_않는가: |
            ★★**초대는 세상을 가질 수 있었다. 다만 가진 것을 물려줄 사람이 없었다.**
            지금 그가 하는 모든 일(제자 양성·교단 유지)이 **시한부라서 하는 것**이다.
            ★그리고 이것이 마존 「차지한다」와 정면으로 부딪힌다 — 스승이 제자를 막는 말이 이것이다:
              *"차지해서 어쩌려고. 내가 죽으면 누가 지키나."*
            ★시한부는 마교에 **속도**를 준다: 다른 세력은 시간이 있는데 마교만 없다.
          퇴장: 2단                           # ★물러나는 때와 죽는 때를 갈랐다 (【제안】 — 빨간펜 대상)
          퇴장_note: |
            ① **제4막 전후 — 위임하고 물러난다.** 플레이어(또는 NPC)가 2대가 된다. **초대는 살아 있다.**
               ★제5막에서 마교가 이기지 못하는 까닭이 여기서 나온다: 정파가 강해서가 아니라
                 **초대가 지병으로 본 실력을 못 내기 때문**이다 → 그래서 **비등**하다.
