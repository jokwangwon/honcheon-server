# 혼천 서버 세력 설정 파일
# 기준 문서: docs/design/text_rpg_design.md 4장 (세력 구조), 11장 (세력 반응 시스템)
#
# 주의: 과거의 원소 속성 4문파(청운문/화염문/태산문/수월문)는 잘못 생성된 설정으로 폐기됨.
# 이 세계는 "정파 vs 사파" 이분 구도가 아니라, 이해관계에 따라 협력/거래/적대가 뒤섞이는
# 5계열 세력 구조로 움직인다.

# 세력 반응 단계 (모든 세력 공통)
reaction_stages:
  0: "무관심"
  1: "소문 인지"
  2: "정보 수집"
  3: "접촉 또는 경고"
  4: "의뢰 / 회유 / 협박"
  5: "직접 개입"
  6: "토벌 / 전쟁 / 숙청"

faction_groups:
  # 1. 정파 계열
  orthodox:
    name: "정파 계열"
    hidden: false
    members:
      gupailbang:
        name: "구파일방"
        description: "무림의 전통 명문 문파 연합"
        sects:
          - "소림사"
          - "무당파"
          - "화산파"
          - "곤륜파"
          - "종남파"
          - "점창파"
          - "청성파"
          - "해남파"
          # 개방, 아미파는 추후 확장 콘텐츠
      odaesega:
        name: "오대세가"
        description: "무림 오대 명문 세가"
        clans:
          - "남궁세가"
          - "모용세가"
          - "제갈세가"
          - "하북팽가"
          - "사천당가"
      orthodox_heroes:
        name: "정파 협객"
        description: "문파에 소속되지 않은 정파 성향 무인들"

  # 2. 사파 / 흑도 계열
  unorthodox:
    name: "사파 / 흑도 계열"
    hidden: false
    members:
      haomun:
        name: "하오문"
        description: "정보망에 가까운 조직. 정파와도 때로 거래 대상이 된다."
      noklim:
        name: "녹림"
        description: "산채를 근거지로 하는 도적 연합"
      jangang_suroche:
        name: "장강수로채"
        description: "수로를 장악한 흑도 세력"
      salmak:
        name: "살막"
        description: "청부 살수 조직"

  # 3. 사교 / 금기 계열 — 초기 튜토리얼에서는 직접 노출하지 않는 장기 위협
  forbidden:
    name: "사교 / 금기 계열"
    hidden: true          # 초기에는 플레이어 출력에 비노출
    members:
      magyo:
        name: "마교"
        description: "일반 사파보다 위험한 금기 세력. 세계 시간이 흐른 뒤 점진적으로 드러난다."
      hyeolgyo:
        name: "혈교"
        description: "금기 중의 금기. 초기 사건(열병 등)에서는 직접 노출하지 않는다."

  # 4. 질서 / 행정 계열
  authority:
    name: "질서 / 행정 계열"
    hidden: false
    members:
      gwan_gun:
        name: "관군"
        description: "치안 유지를 위해 정파와 협력할 수 있으나, 무림 세력 전체를 경계하기도 한다."
      hyeollyeong:
        name: "현령 / 관청"
        description: "지역 행정 기관"

  # 5. 경제 / 민간 계열
  civilian:
    name: "경제 / 민간 계열"
    hidden: false
    members:
      sangdan:
        name: "상단"
        description: "정파와 협력하되 이익을 위해 사파와도 거래할 수 있다."
      mingan:
        name: "민간"
        description: "일반 백성. 민심의 주체."
      jeongbosang:
        name: "정보상"
        description: "소문과 정보를 사고파는 이들"
