# 혼천 서버 세력 설정 파일
# 기준 문서: docs/design/text_rpg_design.md 4장 (세력 구조), 11장 (세력 반응 시스템)
#
# 주의: 과거의 원소 속성 4문파(청운문/화염문/태산문/수월문)는 잘못 생성된 설정으로 폐기됨.
# 이 세계는 "정파 vs 사파" 이분 구도가 아니라, 이해관계에 따라 협력/거래/적대가 뒤섞이는
# 5계열 세력 구조로 움직인다.

# ─── id 규약 (단일 네임스페이스) ───
# 전 config 의 `faction:` / `factions:` / `group:` 값은 **반드시 이 파일의 id** 를 쓴다.
#   · 계열(5) = faction_groups 의 키          (orthodox, unorthodox, forbidden, authority, civilian)
#   · 조직·문파 = faction_groups.*.members 의 키 (소문자 스네이크 — hwasan, haomun, pyoguk …)
# 한글명(name)은 **표기 전용**이다 — 참조 값으로 쓰지 마라 (member id / group id / 한글명 삼중 분기 금지).
# 한글로 들어온 입력(LLM·플레이어 발화)은 aliases 로 id 에 붙인다.
id_policy:
  reference_key: "faction / factions / group 값 = group id 또는 member id (소문자 스네이크)"
  display_only: name
  exempt: [무소속, 미상, 없음, 해당_문파]   # 세력이 아닌 서술 값 — 등록부 대조에서 제외

# 세력 반응 단계 (모든 세력 공통)
reaction_stages:
  0: "무관심"
  1: "소문 인지"
  2: "정보 수집"
  3: "접촉 또는 경고"
  4: "의뢰 / 회유 / 협박"
  5: "직접 개입"
  6: "토벌 / 전쟁 / 숙청"

# ─── faction_groups 는 '세력'이 아니라 **연합체(coalition)** 다 ───
# 주의: orthodox / unorthodox 는 하나의 세력이 아니다. 평시엔 성립해 있지 않고,
# 각 member 가 **단일 세력**으로 각자 논다 (구파일방 10 + 오대세가 5 = 15개 독립 세력).
# 그룹 id(orthodox)는 "지금 이 명분으로 뭉친 자들"의 **동적 명단**을 가리키는 이름이지,
# 상시 존재하는 지휘부가 아니다 — 무림맹은 사건마다 새로 짜이는 임시 조직이고, 이겨도 흩어진다.
# 연합의 성립·크기·붕괴는 config/faction_politics.yml 이 굴린다 (명분 게이지 → join_threshold).
faction_groups:
  # 1. 정파 계열 — **연합체** (아래 members 각각이 상시 존재하는 단일 세력이다)
  orthodox:
    name: "정파 계열"
    hidden: false
    members:
      # ★★무림맹 신설 (사용자 확정 2026-07-26 「무림맹쪽부터 진행」 · 출처 haomoon.kr)
      #
      # ─── 왜 이것이 필요한가: 「정파 계열」과 「무림맹」은 같은 것이 아니다 ───
      # faction_politics 제1원칙이 이미 적어 뒀다: **「정파는 세력이 아니라 연합의 이름이다」.**
      #   그 문장이 맞다. 그런데 그렇다면 **누가 그 이름으로 결정을 내리는가**가 비어 있었다.
      #   · orthodox(정파 계열)  = 분류다. 결정하지 않는다 (컨테이너 — 무공도 갖지 않는다)
      #   · gupailbang/odaesega = 명단이다. 각자 제 산문의 일만 정한다
      #   · **무림맹 = 기구(機構)다.** 맹주가 있고 장로원이 있고, **토벌령을 낸다**
      # ★한 줄: 정파 계열은 「누가 정파인가」이고, 무림맹은 「정파가 무엇을 하기로 했는가」다.
      #
      # ★이미 세계가 이것을 필요로 하고 있었다 — authority_mandate(관의 명령)의 강호 쪽 짝이
      #   없었다. 혈교 토벌령·무림공적 지정을 지금까지 **아무도 내리지 않았다.**
      murimmaeng:
        name: "무림맹"
        description: |
          정파 세력들의 **공식 연합 기구** — 분류가 아니라 기구다 (구파일방·오대세가가 그 성원).
          두 얼굴이 있다 (자료): **대외**로는 마교·혈교 같은 거대 위협에 공동 대응하고,
          **대내**로는 정파끼리의 분쟁을 중재하고 규율 위반자를 처단한다.
          ★그래서 무림맹은 플레이어에게 **적이 될 수도 있다** — 무림공적으로 지정하는 쪽이 여기다.
          축: **맹주(盟主 — 당대 최강 또는 최고 명망)** · 부맹주 2~4 · **장로원(실질 권력)**.
          하위 기구 셋: 정보(감시) · 무력(정예 무사단) · 행정.
          활동: 정사대전 주도 · 무림공적 토벌 · 분쟁 중재 · **용봉지회(무술 대회)**.
          ★자료가 짚은 결: 「부패·무능으로 그려지거나, 맹주가 조력자이거나 최종 보스이기도 하다」
            — 즉 **무림맹은 선하다고 전제하지 않는다.** 그것이 이 기구의 서사적 값이다.
        무공_색: |
          ★**무공을 갖지 않는다** (자료도 무공 보유를 말하지 않는다) — 성원 문파의 무공을 쓴다.
          컨테이너와 다른 점: 컨테이너는 **주체가 아니어서** 무공이 없고,
          무림맹은 **주체이지만 제 무학이 없다** (기구이므로. 관군이 참마도법을 갖는 것과 대비된다).
          ★그래서 이 세력의 힘은 무공이 아니라 **명령**이다 — 토벌령·공적 지정·중재.
        # ★기계 판독 — 눈(combat_audit lint_faction_coverage)이 이 키를 읽는다.
        #   무공 0 이 **의도**임을 등록부가 말해 준다: 기구는 제 무학을 갖지 않는다.
        #   이 표시가 없으면, 나중에 무림맹에 입문 문이 열리는 순간 눈이 「문이 열렸는데 배울 것이
        #   없다」고 거짓 경고를 낸다 — 그때는 이미 왜 그런지 아무도 기억하지 못한다.
        no_arts_by_design: true
        no_arts_reason: "기구(機構)다 — 성원 문파의 무공을 쓴다. 힘이 무공이 아니라 **명령**에 있다"
        기구_성격:
          결정_단위: 장로원                # 맹주 독단이 아니다 (자료: 장로원이 실질 권력)
          성원: [gupailbang, odaesega]     # 명단은 두 연합이 갖는다 — 무림맹이 따로 세지 않는다
          낼_수_있는_것: [무림공적_지정, 토벌령, 분쟁_중재, 용봉지회_개최]
          대응물: "★ authority(관)의 authority_mandate 와 같은 층 — 강호 쪽 명령권이다"
        # ★★확정 (사용자 2026-07-26 · 거대 줄기 v2 Stage 0 — docs/design/world_stages_v2.md):
        #   **알파 시점에 무림맹은 아직 없다.** Stage 0 = 「무림맹 창설 전 (혼란의 서막)」이고,
        #   무림은 맹 없이 문파·세가 중심의 **분열 구조**다. 창설은 Stage 2 의 사건이다.
        #   ★그 귀결로 맹주도 없다 — 맹주 선출은 Stage 2 이벤트(명성 or 실력 기반)다.
        exists_at_alpha: false
        founded_in_stage: 2               # 거대 줄기 v2 · 창설 준비는 Stage 1 (사도련 등장과 맞물린다)
        founding_proposers: [남궁, 제갈, 무당]   # 「셋 중 누군가 주도」 — 누구인지는 미결
        maengju: 없음                      # 맹이 없으므로 맹주도 없다 (Stage 2 에서 선출)
        # ★그래서 지금 이 등재는 **미래의 자리**다: 세계가 이 이름을 아직 부르지 않는다.
        #   그러나 등록부에 있어야 한다 — Stage 0 의 담론(「무림을 하나로 묶어야 한다」)이
        #   가리키는 것이 이것이고, 소문·의뢰가 그 담론을 실어야 하기 때문이다.
        미결_문답:                          # ★지어내지 않는다 — 사용자 확정 대기
          - "창설 주도자가 남궁·제갈·무당 중 누구인가 (또는 플레이어가 정하는가)"
          - "입문 가능한가 — 창설(Stage 2) 이후에야 의미가 있다. 지금은 문을 만들지 않았다"
          - "무력 조직(정예 무사단)이 제 무공을 갖는가 — 갖게 하면 무공_색이 바뀐다"
          - "★Stage 4 의 「무림연합」이 무림맹과 별개 기구인가, 무림맹의 확장인가"
      gupailbang:
        name: "구파일방"
        description: "무림의 전통 명문 문파 연합"
        sects:
          - "소림사"
          - "무당파"
          - "화산파"
          - "곤륜파"
          - "종남파"
          - "점창파"
          - "청성파"
          - "해남파"
          # 개방, 아미파는 추후 확장 콘텐츠
      odaesega:
        name: "오대세가"
        description: "무림 오대 명문 세가"
        clans:
          - "남궁세가"
          - "모용세가"
          - "제갈세가"
          - "하북팽가"
          - "사천당가"
      orthodox_heroes:
        name: "정파 협객"
        description: "문파에 소속되지 않은 정파 성향 무인들"

      # 개별 참조되는 문파·세가는 1급 id 를 갖는다 (sects/clans 명단은 상위 조직의 로스터로 유지)
      hwasan:
        name: "화산파"
        parent: gupailbang
        description: "청하현 알파의 정파 입문 목표 문파 (매화 목패·진운 루트)"
      sorimsa:
        name: "소림사"
        parent: gupailbang
        description: "불가 무학의 종가 — 속가로 퍼진 실전 기예의 출처"
      mudang:
        name: "무당파"
        parent: gupailbang
        description: "도가 무학의 종가"
      namgung:
        name: "남궁세가"
        parent: odaesega
        description: "오대세가 검가"
      dangga:
        name: "사천당가"
        parent: odaesega
        description: "오대세가 독가 — 방계 전승이 독문으로 흘러나갔다"
      gaebang:
        name: "개방"
        parent: gupailbang
        description: "거지들의 방파. 정보와 발이 무기다 — 취걸개(폐사당 기연)가 파문 장로 출신."
      bulga:
        name: "불가"
        description: "사찰·승려 계열 — 문파가 아니라 계보다 (혜각 등 탁발승)"

      # ── 구파일방 (로스터 → 1급 승격: faction_politics 가 이들을 개별 참조한다)
      # 새 세력이 아니다 — 위 gupailbang.sects / odaesega.clans 명단에 이미 있던 이름에 id 를 붙였을 뿐이다.
      # (아미파는 승격하지 않는다 — 위 주석의 '추후 확장 콘텐츠' 존중. faction_politics roster 에
      #  registry: 예약 · active: false 로만 있다)
      gonryun:
        name: "곤륜파"
        parent: gupailbang
        description: "서역의 도가 문파 — 멀다. 천하가 뒤집혀야 배를 띄운다"
      jongnam:
        name: "종남파"
        parent: gupailbang
        description: "종남산 도맥 — 화산과 같은 섬서 땅, 대대의 앙숙"
      jeomchang:
        name: "점창파"
        parent: gupailbang
        description: "운남의 쾌검"
      ami:
        name: "아미파"
        description: "사천의 여승 문파 — 구파일방. 당가와 앙숙(독은 협이 아니다)."
        registry: 예약        # ★ 등록 등급은 **그대로 둔다** — 사용자가 정하지 않았다 (질문 목록)
        active: true          # ★★ 2026-07-13 사용자 결정 — **미설계가 끝났다.**
                              #   아미의 집이 생겼다: 「운해 비구니원」 (docs/design/ami_architecture.md ·
                              #   world_map.yml places.ami · RemoteBuilder.Archetype.비구니원)
                              # ★ 주의: `parent: gupailbang` 은 **여전히 붙이지 않았다** (사용자 결정 없음).
                              #   그것을 붙이면 §16 W-C 의 봉우리 집합이 바뀐다 — 건드리지 않는다

      cheongseong:
        name: "청성파"
        parent: gupailbang
        description: "청성산 검맥"
      haenam:
        name: "해남파"
        parent: gupailbang
        description: "해남도 — 무림에서 가장 먼 곳"

      # ── 오대세가 (로스터 → 1급 승격)
      moyong:
        name: "모용세가"
        parent: odaesega
        description: "요동의 세가 — 실리로 움직인다"
      jegal:
        name: "제갈세가"
        parent: odaesega
        description: "지략의 세가. 관에 줄이 있다 — 관을 읽는 눈이자, 관의 귀"
      paengga:
        name: "하북팽가"
        parent: odaesega
        description: "하북 도가(刀家). 도적 소탕이 가업 — 녹림과는 대를 이은 피"

  # 2. 사파 / 흑도 계열
  unorthodox:
    name: "사파 / 흑도 계열"
    hidden: false
    members:
      # ★결(무공_색) 기입 2026-07-26 — 새외 6곳과 같은 문법으로 사파·금기에도 붙였다.
      #   그전까지 이 일곱은 **한 줄 설명뿐**이었다 (새외만 결이 있었다). 출처: haomoon.kr 무협/세력.
      #   ★계율 그대로: 이름·수치는 지어내지 않는다. 결은 자료가 말한 것만 옮긴다.
      #
      # ★★사도련 신설 (사용자 거대 줄기 v2 Stage 1 · 2026-07-26) — **무림맹의 대칭**
      #
      #   무림맹을 세울 때 만든 축이 그대로 적용된다: 분류 / 명단 / 기구.
      #     · unorthodox(사파 계열) = **분류**다 (컨테이너 — 결정하지 않는다)
      #     · 하오문·녹림·수로채·살막·낭인회 = **각자의 세력**이다 (연합의 명단이 없었다)
      #     · **사도련 = 기구다** — 사파가 「하나의 이름으로」 말하기 시작하는 자리
      #   ★사파에 기구가 없던 것은 새 줄기 때문이 아니라 **원래 구멍**이었다:
      #     정파는 토벌령을 낼 수 있게 됐는데(무림맹), 사파는 그것에 **응답할 주체가 없었다.**
      sadoryeon:
        name: "사도련"
        description: |
          사파 연합을 자칭하는 **기구** — Stage 1 에서 정파의 회합 도중 등장한다.
          ★명분: 「**정파는 위선이다**」 (Stage 3 에서 무력 반격의 근거가 된다).
          ★★그리고 이것이 이 세력의 핵심 함정이다: **구성원 일부는 혈교 잔재의 위장 침투다.**
            사도련 자신도 그것을 모른다 — 그래서 Stage 1~3 의 「누가 진짜 사파인가?」가
            플레이어의 질문이 아니라 **사도련의 질문**이기도 하다.
          ★Stage 4 에서 **일부가 정파와 손을 잡는다** (「공동의 적이 있다면 과거는 덮을 수 있다」)
            → 사도련은 통째로 적이 아니다. **갈라지는 세력**이다. 그 갈라짐이 콘텐츠다.
        무공_색: |
          ★**제 무학이 없다** — 무림맹과 같다 (기구이므로). 성원 세력의 무공을 쓴다:
          하오문의 은형·녹림의 부(斧)·수로채의 구(鉤)·살막의 차륜전·낭인회의 계보 없는 검.
          ★그래서 사도련의 힘은 무공이 아니라 **명분**이다 — 정파의 「토벌령」에 맞서는 「위선」.
          ★단, 잠입한 혈교 잔재는 다르다 (혈교의 무공을 쓴다) — 그것이 정체 추적의 단서다.
        no_arts_by_design: true
        no_arts_reason: "기구(機構)다 — 성원 세력의 무공을 쓴다. 힘이 무공이 아니라 **명분**에 있다"
        기구_성격:
          결정_단위: 미결                   # ★지어내지 않는다 (무림맹의 장로원에 대응하는 것이 무엇인가)
          성원: 미결                        # 하오문·녹림·수로채·살막·낭인회 중 누가 드는가 — 문답
          낼_수_있는_것: [위선_규탄, 무력_반격, 정사_화친]   # 【제안】 — 무림맹의 명령권과 대칭
          대응물: "★ 무림맹의 거울 — 같은 층의 기구다 (정파: 토벌령 / 사파: 위선의 명분)"
        exists_at_alpha: false            # Stage 1 등장 — 알파(Stage 0)에는 없다
        founded_in_stage: 1
        infiltrated_by: hyeolgyo          # ★기계 판독 — 일부가 혈교 위장 (Stage 1~6 의 관통 실)
        미결_문답:
          - "결정 단위·성원 명단 (누가 사도련에 드는가 — 녹림은? 수로채는?)"
          - "입문 가능한가 (Stage 1 이후에야 의미가 있다)"
          - "Stage 4 에서 갈라질 때 **어느 성원이 정파 쪽으로 가는가**"
      #
      # ★★낭인회 신설 (2026-07-26) — **눈이 낸 문답이 자료로 닫힌 자리다.**
      #   lint_faction_coverage 가 「컨테이너 사파/흑도 계열에 음풍검이 붙어 있다」를 잡았고,
      #   그 답이 「어느 문파도 아닌 무공」이면 1급 id 를 세워야 한다고 했다.
      #   자료에 그 세력이 있었다: **낭인회** — 「주군 없이 떠도는 무인들이 모여 만든 연합」.
      #   orthodox_heroes(문파에 소속되지 않은 정파 성향 무인들)의 사파 쪽 짝이다.
      nanginhoe:
        name: "낭인회"
        description: |
          주군 없이 떠도는 무인들의 연합 — ★**문파가 아니다.** 영속 구조가 없고 의뢰로 굴러간다.
          가입·탈퇴가 자유롭고, 각자가 제 기술로 먹고산다 (무공·암기·첩보·경호).
          산문이 없다 — 낭인객잔·은신처·폐가를 그때그때 거점으로 쓴다. 무대는 강호 전역과 변방.
          축: 회주(비공식 리더) · 조장(의뢰별 지휘) · 낭객(일반) · 비호(은신처·물자).
          ★**낭인왕(浪人王)** — 가장 센 자에게 주는 칭호인데 **낭인회 소속이 아니어도 받는다**
            (조직이 칭호를 소유하지 못한다 — 이 세력이 조직이 아니라는 증거).
        무공_색: |
          ★**계보가 없다.** 사사(師事)와 암시장 비급으로 배운 것들이 섞인다 —
          그래서 낭인의 무공은 **문파의 사다리를 타지 않는다** (계열은 있고 계보는 없다).
          현재 등재: 음풍검(검법 — "사파 낭인 사사 또는 암시장 비급").
          ★게임 기계로서의 값: 문파에 안 들어간 플레이어가 **무공을 배울 수 있는 사파 쪽 문**이다
            (정파 쪽은 orthodox_heroes 가 그 자리). 살막과 다르다 — 살막은 조직이고 이쪽은 시장이다.
      haomun:
        name: "하오문"
        description: |
          정보망에 가까운 조직. 정파와도 때로 거래 대상이 된다.
          ★본래 이름은 **하오문(下五門)** — 다섯 밑바닥 직업이다: 점(店 점소이)·각(腳 짐꾼)·
          아(牙 인신매매)·차(車 마부)·선(船 뱃사공). 여기에 소매치기·기녀·노름꾼이 붙는다.
          ★개방과 **쌍벽**이다 (개방=거지의 발, 하오문=장사치의 귀). 녹림보다 크다.
          점조직이라 수뇌부의 자리를 아무도 모른다 — 그것이 이 문파의 방어다.
        무공_색: |
          독공·암기·은형술 (간부만) · 기녀는 **색공·음공**.
          ★**대부분의 문도는 무공이 없다** — 그것이 구멍이 아니라 정보망의 값이다
          (점소이가 강하면 아무도 그 앞에서 말하지 않는다).
          정면으로 싸우지 않는다. **빈틈**을 판다 — 판정이 아니라 자리를 먼저 산다.
      noklim:
        name: "녹림"
        description: |
          산채를 근거지로 하는 도적 연합 — **녹림칠십이채(綠林七十二寨)**.
          18·36·72·108채로 세는 분산 조직이라 관군 토벌이 뿌리를 못 뽑는다.
          ★자체 율법 **청록대전(淸綠大典)** 이 있다 — 도적이지만 법이 있다. 서로를 형제라 부른다.
          교통로·상로의 목을 잡아 통행세를 거둔다. ★하북팽가와는 대를 이은 피.
        무공_색: |
          **부(斧)·창** — 실전형 병기 (자료 그대로).
          ★**내공보다 외공에 치중한다** — 심법 0 은 구멍이 아니라 **결이다**
          (B-188 구멍 지도의 「사파 결이면 의도」 문답이 여기서 닫힌다).
          녹림왕(총채주)만 내외공을 겸한다 — 그래서 녹림왕이 곧 그 산채의 천장이다.
          ★전략: 머릿수로 위협하되 **진짜 무림인과는 싸우지 않는다** (현실적 생존).
      jangang_suroche:
        name: "장강수로채"
        description: |
          수로를 장악한 흑도 세력 — 장강(양자강)의 수적. **열여덟 수채의 연합**
          (고전에서는 십이연환오·칠십이연환오). 동정호·파양호가 안뜰이다.
          거점이 땅이 아니라 **배와 섬**이다 — 관군이 포위할 벽이 없다.
          약탈 + **통행세**(강북↔강남 수로를 잡았다) + 물류 통제 + 정파·동영과의 밀무역.
          ★칭호: 수왕(水王). "정파 애송이들에게 물에서 싸우는 것이 무엇인지 보여주거라"
        무공_색: |
          **수전(水戰) 특화** — 물의 유연함과 파도의 역동을 쓴다. 호흡과 잠영으로 배 밑을 따 침몰시킨다.
          ★**쇠사슬 달린 무기** — 배를 잇고 상대를 **속박**한다 (자료 그대로).
            → B-188 기준표의 **구(鉤) ★0** 이 해소되는 자리가 여기다 (기준표가 이미 지목해 뒀다).
          ★물 위에서는 정파 무가보다 **우월하다** — 경지가 아니라 **땅**이 정하는 유일한 세력.
      salmak:
        name: "살막"
        description: |
          청부 살수 조직. 고정 거점이 없다 — 폐허·은신처·유랑객 숙소를 옮겨 쓴다.
          ★**구성원끼리도 서로의 실체를 모른다** (내부 구조가 조직 자신에게도 은폐돼 있다).
          양성 방식이 비인격적이다: 고아에게 번호를 주고 동기끼리 살려 남긴다.
          ★칭호: 암존(暗尊 — 최정예) · 살수(일반). 근거지는 대막·새외 같은 외진 곳.
        무공_색: |
          변장·은신·경공 + **심박 조절** (숨을 죽이는 것이 첫 무공이다).
          ★**차륜전(車輪戰)** — 한 번에 하나의 의뢰만 받고, 목표가 죽을 때까지 **인력을 점차 밀어넣는다.**
            이 세력의 값은 개인의 강함이 아니라 **끝나지 않는다는 것**이다
            (한 명을 이겨도 다음이 온다 — 다른 어느 세력과도 다른 결).
      dokmun:
        name: "독문"
        description: "독을 다루는 방계 문파들 (사천당가 방계 전승 — 칠살음독경의 출처)"
        무공_색: |
          ★자료(haomoon.kr) 에 이 세력의 항목이 **없다** — 우리 세계의 것이다 (당가 방계).
          그래서 결은 당가와의 **차이**로만 정한다: 당가는 가문의 재가로 독을 쥐고,
          독문은 **재가 없이 흘러나간 구결**로 쥔다 — 같은 심법(칠살음독경), 없는 계율.
          ★현재 심법 1·무공 0 — 손이 없다. 채움은 ⑧회차 (마교와 짝: 둘 다 심법만 있다)

  # 3. 사교 / 금기 계열 — 초기 튜토리얼에서는 직접 노출하지 않는 장기 위협
  forbidden:
    name: "사교 / 금기 계열"
    hidden: true          # 초기에는 플레이어 출력에 비노출
    members:
      magyo:
        name: "마교"
        description: |
          일반 사파보다 위험한 금기 세력. 세계 시간이 흐른 뒤 점진적으로 드러난다.
          ★이름이 여럿인 것이 이 세력의 성질이다 (자료): **천마신교**는 내부의 이름
          (교주를 천마라 부르기 때문) · **마교**는 **밖에서 부르는 이름**이다.
          ★그래서 「마교」라는 말은 세력의 이름이 아니라 **중원의 판단**이다 —
            배화신교가 마교로 오해받는 기계(faction_politics 오해 밴드)가 여기서 정당해진다.
          간부축: 광명좌·우사 → 사천왕/마존 → 십대마군 → 마인.
          마존은 전문으로 갈린다 (독마·검마·혈마·권마·환마·음마·도마·화마·광마).
          ★소교주는 **교주의 자식 중 가장 강한 자** — 혈통이되 시험을 통과해야 한다.
        무공_색: |
          **천마신공**(역대 천마만) · **흡성대법**(남의 내공을 빼앗는다) ·
          천마신법(예측 불가) · **천마군림보**(위압) · 천마검법 · 혈마도.
          ★결정적 결 — factions.yml 이 이미 적어 둔 대비 그대로:
            **마교는 중원의 심법을 극단으로 민 것**이라 중원을 이해한다 (그래서 잠식한다).
            새외는 애초에 다른 도를 걸었다. **마교는 중원의 밤이고, 새외는 중원 밖의 낮이다.**
          ★현재 심법 1·무공 0 — 손이 없다 (채움 ⑧회차 · 독문과 짝).
      hyeolgyo:
        name: "혈교"
        description: |
          금기 중의 금기. 초기 사건(열병 등)에서는 직접 노출하지 않는다.
          ★마교와의 관계가 애매한 것이 정본이다 (자료): 마교와 **별개의 사교**이기도 하고
          **마교 안의 한 갈래**이기도 하다 — 인신공양과 피를 숭상하는 극단.
          우리 세계에서는 **별개**로 둔다 (오독교가 혈교를 미워한다는 relation -2 가 그 전제:
          "고독은 벌레를 먹이지 사람을 먹이지 않는다").
        무공_색: |
          **혈수마공**(기등재)·혈마도 — 피를 마실수록 강해진다.
          마병(魔兵): 인신공양의 잔재가 응결된 병기 — **스스로 갈증을 갖는다**
          (equipment weapon_grades 마병이 이미 그렇게 적혀 있다).
          ★결: 마교가 **빼앗는다**(흡성)면 혈교는 **바친다**(공양) — 대가를 남이 치르는 유일한 결.

  # 4. 새외(塞外) 계열 — ★ 중원이 아니다. 연합체도 아니다
  #
  # ─── 왜 6번째 계열인가 (5계열을 늘리는 것은 가볍지 않다) ───
  # 새외를 기존 5계열 어디에도 못 넣는다:
  #   · orthodox/unorthodox 는 **강호의 분류**다 — 새외는 강호가 아니다 (협俠도 의義도 그들의 말이 아니다)
  #   · forbidden(마교·혈교)은 **중원 안의 어둠**이다 — 새외는 어둠이 아니라 **남**이다.
  #     ★ 마교는 중원의 심법을 극단으로 민 것(연수)이라 중원을 이해한다 — 그래서 잠식할 수 있다.
  #       새외는 애초에 다른 도(道)를 걸었다. 타락한 것이 아니라 **다른 데서 자란 것**이다.
  #     ★ 한 줄: **마교는 중원의 밤이고, 새외는 중원 밖의 낮이다**
  #   · authority(관)는 **이 나라**다 — 새외는 다른 나라거나, 나라가 아니거나
  #
  # ─── 그리고 결정적으로: 새외는 연합체가 아니다 ───
  # faction_politics 제1원칙("정파는 세력이 아니라 연합의 이름이다")이 여기엔 적용되지 않는다.
  # 새외의 다섯은 서로를 모른다 — 초원과 밀림 사이는 중원의 폭보다 넓다.
  # 그들은 **뭉치지 않는다.** 명분도 없고 소문망도 없다. 그래서 이 그룹 id 는
  # '동적 명단'이 아니라 그냥 **분류 이름**이다 (orthodox 와 다른 점).
  #   ★ 중원의 악몽 "새외가 하나로 뭉쳐 온다"는 **일어나지 않는다.** 다만 중원은 그것을 두려워한다.
  #
  # hidden: false — ★ 마교와 다르다. 새외는 **알려져 있다.** 다만 멀 뿐이다.
  #                 (마교는 hidden=모른다 / 새외는 안다. 이 대비가 두 축의 정의다)
  saeoe:
    name: "새외 계열"
    hidden: false
    coalition: false          # ★ orthodox/unorthodox 와 달리 '연합의 이름'이 아니다 — 분류일 뿐이다
    members:
      bukmak:
        name: "북막 한국"
        description: |
          막북(漠北) 초원의 유목 연맹 — ★ 무림이 아니라 **나라**다. 대칸(大汗)이 다스린다.
          개인 무력은 중원 일류에 못 미친다. 대신 **만 명이 온다** — 그리고 우리보다 네 배 빨리 온다(말).
          ★ 관(官)의 정면. 대동 군진이 마주 보는 것이 이들이다.
          ★ 마교의 흑성이 이들의 서쪽 변두리(준가르)에 서 있다 — 대칸이 땅을 빌려준 것이다.
        무공_색: "마상(馬上)·궁(弓)·박(搏). 심법이 얕고 원기(체력)가 깊다 — 축기가 아니라 **호흡**이다"
        governs: [막북_초원, 새외_북막]
      seoyeok_sangmaeng:
        name: "서역 상맹"
        description: |
          오아시스 도시국가들의 상단 연합 — 비단길(상로)의 주인. ★ 상단연합(sangdan)의 반대편 끝.
          ★ 새외 중 **유일하게 적이 아니다.** 그들은 팔러 오지 죽이러 오지 않는다.
          중원의 비단·차·철이 나가고, 옥·말·향료·약이 들어온다. 가욕관이 그 목이다.
        무공_색: "호신(護身)·낙타·모래바람. 무공보다 **돈과 정보** — 사병(私兵)을 산다"
      baehwa_singyo:
        name: "배화신교"
        description: |
          서역의 이교(異敎) — 불을 섬긴다. 사막의 신기루가 그들의 환술(幻術)을 낳았다.
          ★ **중원인은 이들을 마교라 부른다. 틀렸다.** 불을 섬긴다는 것 하나로 뭉뚱그린 것이다.
            이 오해가 곧 게임의 기계가 된다 (faction_politics accuracy_gate 오해 밴드 · target_swap).
          독(毒)은 당가와 다르다 — 당가는 **만들고**(제조), 배화는 **푼다**(산공독·약).
        무공_색: "화공(火功)·환술(幻術)·산공독(散功毒). 물이 없어 **기를 아낀다** — 최소 동작"
      seolyeok_milgyo:
        name: "설역 밀교"
        description: |
          토번 고원의 밀교(密敎) — 라마승. 공기가 얇아 **호흡법이 극단으로 발달했다**.
          ★ 소림과 같은 뿌리, 다른 가지. 결정적 차이: 소림의 불가는 계율로 힘을 **묶는다**(불살).
            밀교는 분노존(忿怒尊)을 쓴다 — **죽이는 것도 법이다.** 그래서 밀교승이 더 세다.
            ★ 그리고 그것이 소림이 밀교를 미워하는 이유다 (relation -2).
        무공_색: "대수인(大手印)·금강저(金剛杵)·용상반야. 불가지만 **자비가 없는 불가**"
      odokgyo:
        name: "오독교"
        description: |
          남만 밀림의 묘족(苗族) 무리 — 고독(蠱毒). ★ 독을 **만들지 않고 기른다**.
          ★ 당가와의 차이가 전부다: 당가의 독은 **물건**(암기에 바른다).
            오독교의 독은 **생물**(사람 안에서 자란다) — 그래서 해독이 아니라 **구충(驅蟲)** 이다.
            유문(의방)도 혜각(탁발승)도 못 고친다. ★ 중원 의술의 바깥이다
          ★ 혈교를 미워한다 — "고독은 벌레를 먹이지 사람을 먹이지 않는다" (relation -2)
        무공_색: "고(蠱)·묘도(苗刀)·주술. 이기는 것이 아니라 **썩히는** 무공"
      dongyeong:
        name: "동영"
        description: |
          바다 건너 섬. ★ 새외 중 **지도에서 가장 멀고 실제로 가장 가깝다** —
          청하현에서 57일이지만 **강남에서 26일**이다. 그래서 왜구가 강남을 친다.
          ★ 관문을 지나지 않는 유일한 새외다 (바다에는 문이 없다) — 그것이 동영이 위험한 이유.
          철이 귀해 한 자루를 접어 만든다. 도(刀) 한 자루에 목숨을 건다.
        무공_색: |
          발도(拔刀)·일격필살·이도류. 중원 검술은 초식이 많고(변화), 동영은 초식이 적다(한 번).
          ★ 그래서 동영 검호는 **첫 합에서 가장 강하고 열 합 뒤에 가장 약하다**
        sects:
          - "검호단"          # 劍豪團 — 정면. 비무로만 문이 열린다
          - "인자중"          # 忍者衆 — 잠행·독·화기. ★ 살막의 대응물이되, 살막은 청부이고 인자는 소속이다

