# 심법 카탈로그 및 단전 규칙 (기계 판독용)
# 기준 문서: docs/design/dantian_and_simbeop.md
# 단전 = 그릇 {용량(내공 상한), 순도(회복 배율), 결(패시브)}
# 축기 방식이 분리되어 있다 — 심법 선택 = 플레이스타일 선택

dantian:
  attributes: [용량, 순도, 결]
  # 내공은 유일한 배증형 능력치 — 단전은 근육이 아니다 (다른 능력치는 +1=1년 균일)
  accumulation_cost: "내공 n→n+1 = 전용 수련 n년 (축기 방식·보정 적용 전). 0→1 = 1년 (개화 직후 첫 단계 — 봇 단계 2에서 확정, 1년 = 360일)"
  # 화후(火候) — 양자화 절벽 제거 (dantian_and_simbeop.md 6.4)
  hwahu:
    internal: "내공은 실수로 적립 (축기 시간 = 진행도)"
    display: "단계 + 성(成) — 예: '내공 2단계 7성' = 2.7"
    derived_resources: "내력·정화력 등 파생치는 실수치로 계산 (내력 = round(실수 × 3))"
    intentional_cliffs: "경지 승급·기 운용 게이트·용량 상한은 그대로 불연속 — 벽은 돌파로만 넘는다"
    judgment_adders: "판정 가산(기술 +n)은 정수 유지 — 2d6 분산이 1점 차이를 완충"
  # 기운 프로파일 — 같은 1내공이라도 심법에 따라 쓰임새가 다르다 (정수 보정, ±1이 크다)
  qi_profile_axes:
    연비: "특정 밴드의 내력 소모 ±1 (정순한 기는 낭비가 없다)"
    발력: "특정 계열 무공 위력 ±1 (거친 기는 세게 터진다)"
    후력: "순도 = 내력 회복 배율 (끈기)"

  # ─── 결(結) — 심법 고유 패시브의 기계 정의 (2026-07 성장 축 패스) ───
  # ★ 신규 축이 아니다. 각 심법의 `passive:` 는 이미 있었다 — 프로즈였을 뿐이고 엔진이 못 읽었다.
  #   이 절은 그 문장을 **기존 규칙의 키**로 옮긴다 (combat.yml attack.defender_choice).
  #
  # ★★ 설계의 심장 — **세 심법이 세 방어에 하나씩 걸린다:**
  #       자하신공("회피·속도 계열")  → 회피 (+1)   … 민첩(신법)의 짝
  #       정심검결("패링 강화")       → 막기 (+1)   … 근력(외공)의 짝
  #       태극기공("방어 시 반격")     → 흘리기 (+1) … 감각(심안)의 짝 — 흘려서 되받는 것이 태극이다
  #     → 심법이 **어느 방어로 살 것인가**를 정하고, 수련 배분이 **그 방어의 크기**를 정한다.
  #       빌드의 뼈대가 심법이고 살이 수련이라는 말의 기계적 의미가 이것이다.
  #     → 그리고 지배 심법이 없다: 셋이 서로 다른 방어를 사고, forced_guard(포위)가 회피를 지운다.
  gyeol_axes:
    회피_판정: "combat.yml attack.defender_choice.회피 판정에 가산 (민첩 + 경공 + 결)"
    막기_판정: "combat.yml attack.defender_choice.막기 판정에 가산 (근력 + 병기 기술 + 결)"
    흘리기_판정: "combat.yml attack.defender_choice.흘리기 판정에 가산 (감각 + 병기 기술 + 결)"
    cap: 1     # ★ ±1 상한 — qi_profile 과 같은 눈금 (장비 판정 캡 2 보다도 작다. 심법은 격차가 아니라 색이다)

# 축기 방식 정의
accumulation_methods:
  좌공: { rule: "수련 선언 시간 그대로 계상 (표준)" }
  동공: { rule: "무공 수련·실전 시간의 50%를 축기로도 계상 (이중 성장)" }
  시공: { rule: "지정 시간대 구간만 계상, 2배율 (예: 새벽 자하 — 하루 1구간 상한)" }
  전공: { rule: "수련 무관 — 실전 전투마다 축기 점수 (생사의 경계가 그릇을 넓힌다)" }
  식공: { rule: "좌공 + 약재·독물·영초 복용 시 가속 (재료 소모)" }
  흡성: { rule: "타인 내력 즉시 약탈 30% — 마공 분류 ① (internal_energy.yml)" }
  연수: { rule: "수명(선천진기)을 태워 축기 가속 — 마공 분류 ② (internal_energy demonic_classification).
           수련 1일 = 축기 2일치, 수명 -1일. ★ 선언형 — 켜고 끌 수 있다 (magong.② 참조)" }

# 시각화 — 텍스트 은유 사전 (GM은 수치 대신 이것을 말한다)
visualization:
  size_by_naegong:      # 내공 수치 → 크기 은유
    "1-2": "이슬"
    "3-4": "호두알"
    "5-6": "주먹"
    "7-8": "소용돌이"
    "9-10": "깊은 못"
  purity_scale: [탁하다, 흐리다, 맑다, 투명하다, 형체가_없다]
  mc_gui: "경락도 GUI — 중앙 단전 게이지 + 혈도 노드 + 심법별 운기 경로 라인 (숙련 시 점등)"
  circulation_particles:
    rule: "운기조식 중 심법 고유 색·패턴 회전 — 목격자는 심법을 추측 가능 (소문 연동)"
    stealth_option: { available: true, cost: "회복 -20%" }

# ─── 심법 목록 ───
simbeop:
  hyeoncheon_tonapbeop:
    name: "현천토납법"
    faction: gaebang
    lineage: 잡가                  # 취걸개 기연 보상 (fortune_encounters 연동)
    grade: 기초
    method: 좌공
    capacity: 4                    # 내공 상한
    purity: 1.0                    # 내력 회복 배율
    qi_profile: { 연비: 없음, 발력: 없음 }   # 평범한 기운 — 기초는 기초다
    passive: 없음
    gyeol: {}                      # 결 없음 — 기초의 값은 '아무 데도 안 기울었다'는 것이다 (전환 90%)
    build_affinity: 무색           # 어느 빌드에도 붙지만 어느 빌드도 완성하지 못한다
    special: ["개화 실패 없음", "어떤 심법으로도 전환 승계 90% (기초의 미덕)"]
    circulation_color: "옅은 백색"

  taegeuk_gigong:
    name: "태극기공"
    faction: mudang
    lineage: 도가          # 정순 — 정화(배독·도인도기·해주) 자격
    grade: 상승
    method: 좌공
    method_bonus: { 동공_병행: "태극권 수련 시간 30% 계상" }
    capacity: 8
    purity: 1.5
    qi_profile: { 연비: "검기·강기 소모 -1", 발력: 없음 }   # 알뜰하고 오래 간다 — 지구전형
    passive: "방어 시 반격 확률, 내력 회복 강화"   # 결(結) — 심법 고유 패시브 (구 cultivation technique_by_internal에서 이관)
    gyeol: { 흘리기_판정: 1 }      # ★ '흘려서 되받는 것'이 태극이다 — 반격은 흘리기의 자리에서 난다
    build_affinity: [심안, 내공]   # 다구리·지구전 — 포위가 회피를 지울 때 흘리기는 남는다 (forced_guard)
    circulation_color: "흑백 쌍환"

  jaha_singong:
    name: "자하신공"
    faction: hwasan
    lineage: 도가          # 화산은 도문 — 정화 자격
    grade: 상승
    method: 시공
    method_condition: { segment: 새벽, multiplier: 2, daily_cap: "1구간" }
    capacity: 9
    purity: 1.3
    qi_profile: { 연비: "경신(보법) 소모 -1", 발력: 없음 }   # 가볍고 빠른 기운 — 발에 실린다
    passive: "회피·속도 계열"   # 결(結) — 심법 고유 패시브
    gyeol: { 회피_판정: 1 }        # 발에 실리는 기운 — 몸을 빼는 것에 붙는다
    build_affinity: [신법]         # 1대1의 왕. 그리고 포위당하면 이 결이 통째로 죽는다 (forced_guard.loses 회피)
    circulation_color: "보랏빛 노을"
    # ★ 노션 원천: 자하신공은 **화산 장문인 일인전승**이다. 수치 축(capacity 9 · purity 1.3 · gyeol)은
    #   그대로 두고 계보 축만 얹는다 — 얻는 길이 하나뿐이라는 사실이 이 심법의 값의 절반이다.
    acquisition: "★ 화산 장문 계승 시에만 — 일인전승 (sect_life.yml succession_ladder.hwasan)"
    sole_transmission: true
    lineage_role: 장문_전승
    predecessor: maehwa_simbeop

  jeongsim_geomgyeol:
    name: "정심검결"
    faction: hwasan
    lineage: 검문
    grade: 중급
    method: 동공
    method_condition: { source: "검술 수련·실전", ratio: 0.5 }
    capacity: 6
    purity: 1.0
    qi_profile: { 연비: 없음, 발력: "검에 실은 발경 위력 +1" }   # 검을 위해 벼려진 기운
    passive: "패링 강화 (skill_mechanics.yml 정합)"
    gyeol: { 막기_판정: 1 }        # 패링 = 막기. 검으로 받는다
    build_affinity: [초식, 외공]   # 검을 들고 받아치는 자 — 발력(검 발경 +1)이 초식 빌드의 위력을 산다
    circulation_color: "검 궤적의 잔광"
    dual_approved: [jaha_singong]   # 같은 화산 계보 — 겸수 공인

  chilsal_eumdokgyeong:
    name: "칠살음독경"
    faction: dokmun
    lineage: 독문          # 면역은 동화 — 정화 불가                   # 사천당가 방계 전승
    grade: 상승
    method: 식공
    method_condition: { material: "독물·약재 복용", price: "축기 중 원기 소모" }
    capacity: 8
    purity: 1.1
    qi_profile: { 연비: "독 계열 소모 -1", 발력: "독 위력 +1" }   # 스미는 기운
    passive: "중독 면역, 독 피해 증폭"   # 결(結) — 심법 고유 패시브
    gyeol: {}                      # 방어 결 없음 — 독문의 값은 방어가 아니라 '상대가 죽어간다'는 것이다
    build_affinity: [초식, 심안]   # 독공·암기 — 원거리 판정이 감각이다 (combat.yml attacker_attribute.원거리)
    circulation_color: "검푸른 아지랑이"

  hyeolgi_simgong:
    name: "혈기심공"
    faction: hyeolgyo
    lineage: 마도
    grade: 금기
    method: 흡성
    method_condition: { absorb_ratio: 0.3, target: "타인 내력" }
    capacity: 10                   # 가장 크고 가장 빠르다 — 마공이 유혹인 이유
    purity: 0.8
    qi_profile: { 연비: "검기·강기 소모 +1", 발력: "전 무공 위력 +1" }   # 크고 거칠고 헤프다 — 폭발형
    depletion_override: "고갈 시 다운캐스트 대신 원기 자동 잠식 (시전당 원기 -5) — 탁한 기운은 주인을 문다"
    passive: "재생 (원기 증폭 계열과 중첩 시 폭주 판정)"
    gyeol: {}                      # ★ 방어 결이 없다 — 마공은 방어를 사지 못한다. 먼저 죽이거나 죽는다
    build_affinity: [내공, 초식]   # 위력 몰빵 (발력 전 무공 +1 · capacity 10). 대신 순도 0.8 · 연비 +1 — 폭발형이지 지구전형이 아니다
    price: ["심마 누적 (성향 태그)", "운기 색 은폐 불가"]
    circulation_color: "굶주린 탁한 적색"
    stealth_option: false          # ★ 은폐 불가 — 운기조식하는 순간 목격자가 안다 (이것이 혈교가 잠식 못 하는 이유)
    demonic: true                  # skills.yml hyeolgi_simgong과 연결
    magong_class: ①                # magong.branches.① 흡성 — 남을 먹는다

  cheonma_mugeukgong:
    # ★ 마교의 마도 심법. magyo_encroachment 문턱 3(의존)의 `simbeop_lineage: 마도`가
    #   지금까지 혈교 심법(혈기심공)으로만 충족됐다 — 마교와 혈교가 같은 어둠이 되어 버렸다.
    #   이 항목은 신규 발명이 아니라 **이미 참조되고 있던 빈칸**을 메운다.
    #   (factions.yml forbidden.magyo 등재 세력 · internal_energy demonic_classification ② 연수 계열)
    name: "천마무극공"
    faction: magyo
    lineage: 마도
    grade: 금기
    method: 연수
    method_condition: { burn: 수명, ratio: 2.0, lifespan_cost_days: 1,
                        note: "★ 선언형 — 켜지 않으면 좌공 표준(1일=1일치). 자기 속도를 스스로 태운다" }
    capacity: 9
    purity: 0.9
    qi_profile: { 연비: 없음, 발력: "전 무공 위력 +1" }
    passive: "역혈(逆血) — 원기를 내력으로 강제 전환 (원기 -3 → 내력 +3, 구간당 1회).
              ★ 자기 원기의 운용이므로 그 자체는 마공이 아니다 (internal_energy is_not_demonic) —
              마공인 것은 '수명을 태우는 축기'다"
    gyeol: {}                      # 방어 결 없음 (마도 공통)
    build_affinity: [내공]         # ★ 시간을 산다 — 연수로 축기 2배. 사는 것은 '축기 속도'지 전투력이 아니다
    price: ["수명 (축기 1일당 -1일)", "심마 누적 (축기 1년당 흔적 +1)", "깨달음 경로 봉쇄 — 파벽만 남는다"]
    circulation_color: "칠흑에 은빛 결"
    stealth_option: true           # ★ 은폐 가능 (회복 -20%, visualization.circulation_particles 규칙 그대로)
                                   #   ★★ 이 한 줄이 마교와 혈교를 가르는 전부다:
                                   #      마교는 숨을 수 있다 → 잠식이 가능하다 (사람 사이에서 산다)
                                   #      혈교는 못 숨는다   → 즉시 토벌 (사람 사이에서 살 수 없다)
    demonic: true
    magong_class: ②                # magong.branches.② 연수 — 자기를 태운다
    dual_cultivation_note: "★ 도가·불가·검문 전 계열과 opposed (겸수 = 주화입마 판정)"

  # ═════════════════════════════════════════════════════════════════════════
  # 문파 심법 — 노션 원천의 실명 심법 22종 (설계: docs/design/sect_lineage.md)
  # ═════════════════════════════════════════════════════════════════════════
  # ★ 심법이 곧 내공의 뼈대다. 무공은 배우면 되지만 심법은 **하나뿐이다** (dual_cultivation.primary_rule).
  #   그래서 문파를 고르는 것은 무공을 고르는 것이 아니라 **그릇을 고르는 것**이다.
  #
  # 【용량·순도의 밴드】 기존 등재분의 축을 건드리지 않고 그 사이에 선다:
  #   기초 4~5 / 1.0   ·   중급 6 / 1.1   ·   상승 7~8 / 1.2~1.3   ·   장문인 9 / 1.4~1.5
  #   ★ 마공(혈기심공 10 / 0.8 · 천마무극공 9 / 0.9)의 자리는 건드리지 않는다 —
  #     정파 심법은 **크기로 마공을 이기지 않는다.** 마공이 파는 것은 크기가 아니라 시간이다
  #     (magong.baseline: "정파의 벽은 무공이 아니라 달력이다"). 그 명제를 깨지 않는 것이 이 표의 규율이다.
  #
  # 【lineage 세가(世家)】 신규 계열 — 정순하지도 탁하지도 않다. 정화 자격 없음(도가·불가만).
  #   혈족 전승이 그 자체로 문(門)이다. 남궁·당가·팽가·모용이 여기 선다.
  #
  # 【일인전승 sole_transmission】 장문인 심법은 **한 세계에 한 사람**이다.
  #   얻는 길이 하나뿐이다 — 장문 계승(sect_life.yml succession_ladder). 비급도, 기연도, 도둑 배움도 없다.
  #   전대 장문이 죽거나 물러나야 다음 사람이 배운다. 그것이 '더 높은' 값의 대가다.

  # ─── 화산파 ───
  maehwa_simbeop:
    name: "매화심법"
    faction: hwasan
    lineage: 도가
    grade: 중급
    method: 좌공
