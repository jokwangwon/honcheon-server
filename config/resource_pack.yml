# ══════════════════════════════════════════════════════════════════════
#  리소스팩 배급 — 등록부 (PackPusher.java)
# ══════════════════════════════════════════════════════════════════════
# ★ 이 파일이 생긴 이유: server.properties 의 resource-pack 은 URL 을 **하나**만 적을 수 있다.
#   그런데 이 기계는 주소가 여럿이다 — LAN(192.168.x) · Tailscale(100.x) · 공인 IP.
#   LAN 주소를 박아 두면 LAN 밖에서 들어온 사람은 게임(25565)은 붙는데 팩(8123)만 실패한다.
#   그 사람 컴퓨터에서 **닿지 않는 주소**이기 때문이다. 증상: "다운로드 실패" — 서버 로그엔 아무것도 안 남는다.
#
#   그래서 주소를 박지 않는다. **그 사람이 접속할 때 친 주소**로 팩을 준다 (Player#getVirtualHost).
#   그 주소는 그 사람 컴퓨터에서 닿는 것이 **증명된** 유일한 주소다 — 방금 그걸로 들어왔으니까.
#
# ★ 배급자(8123)는 여전히 사설망 전용이다. 이 배선은 배급자를 **더 넓은 곳에 열지 않는다** —
#   이미 듣고 있는 인터페이스(LAN·Tailscale) 중 그 사람이 쓴 것을 골라 줄 뿐이다.
#   8123 을 공유기에서 포워딩하지 말라. (공개는 25565 뿐이다.)
resource_pack:
  enabled: true
  port: 8123
  file: honcheon_pack.zip
  local_path: ../pack-http/honcheon_pack.zip   # 서버 폴더(run/mvt) 기준 — sha1 을 여기서 **직접 잰다**
  # ★ sha1 을 적는 칸이 없다. 일부러 없앴다.
  #   팩을 새로 굽고 sha1 을 안 고치면 클라이언트가 **조용히** 거절한다 —
  #   배급자는 200 을 주고, 파일도 멀쩡하고, 로그도 안 남는다. 눈에 안 보이는 실패다.
  #   그러므로 사람이 옮겨 적는 일을 없앤다. 실물에서 매 기동마다 다시 잰다.
  # ★ 외부 호스팅 — 이 주소가 채워져 있으면 아래 host/fallback_host/port 는 쓰이지 않는다.
  #   왜 이 길로 왔는가: 팩 배급자(8123)는 **인터넷에 열지 않는다** (공개는 25565 하나. 인증도 TLS 도 없는
  #   평문 파일 서버다). 그런데 집 안에서도 공인 IP 로 접속하면(헤어핀 NAT) 사설 주소에 닿지 못하는
  #   경로가 생긴다 — 게임은 붙는데 팩만 죽는다. 사설 주소로 폴백해도 라우터가 막으면 소용없다.
  #   그래서 팩을 **바깥에 둔다.** 어디서 들어오든 같은 주소로 받는다 — 추측할 것이 없다.
  #   올리는 자: scripts/publish_pack.sh (팩을 굽고 → 릴리스에 덮어쓴다. 주소는 안 바뀐다)
  #   sha1 은 여전히 **실물에서 잰다** — 올린 것과 잰 것이 같은 파일이므로 낡을 수 없다.
  url: "https://github.com/jokwangwon/honcheon-pack/releases/download/pack/honcheon_pack.zip"
  host: ""                                     # 비워 두라 — 접속한 주소를 따라간다.
                                               # 도메인이 생기면 그때만 여기 적는다 (예: pack.honcheon.kr)
  fallback_host: "192.168.45.100"              # ★ **공인 주소**로 들어온 사람에게 줄 주소.
  # 왜 필요한가: 집 안에서도 공인 IP 로 접속하면(헤어핀 NAT) 서버는 그 사람이 "밖에서 왔다"고 본다.
  #   그러면 팩 주소도 공인 IP 가 되는데 — **8123 은 밖으로 열지 않는다** (공개는 25565 하나뿐이라는 규약.
  #   배급자는 인증도 TLS 도 없는 평문 파일 서버다). 그래서 게임은 붙는데 팩만 죽는다.
  #   그 사람에게는 사설 주소로 준다. 같은 집 안이니 닿는다.
  # 진짜 바깥에서 온 사람에게는 이것도 안 닿는다 — 그때는 팩을 외부에 올리거나(도메인 → host) 감수한다.
  #   어느 쪽이든 **로그가 말한다**: [팩] <이름> — 다운로드 실패. 조용히 실패하지 않는다.
  prompt: "혼천 리소스팩 — 수묵 HUD·기세/화후 글리프. 이 팩이 있어야 강호가 보인다. 받아야 들어올 수 있다."
  required: true    # ★ 팩 게이트 (2026-07-13 헌법 개정 — 옛 「불가침」 조항 폐지).
                    #   팩이 없으면 무공도 글자도 눈에 보이지 않는다. 그러므로 팩은 들어오는 조건이다.
                    #   코드는 이 값을 **되돌리지 않는다.** 여기 적힌 것이 그대로 나간다.
                    #   눈: tools/pack_gate_audit.py (false 로 되돌리면 잡는다)

  # ── 문을 닫되 **친절하게** 닫는다 ────────────────────────────────────────
  # 팩을 못 받은 사람을 아무 말 없이 튕기면 그건 퀄리티가 아니라 벽이다.
  # 그 사람은 무엇이 잘못됐는지도, 어떻게 다시 들어오는지도 모른 채 서버 목록만 본다.
  # 그래서 **실패의 이유마다 다른 말**을 한다 — 사람이 할 일이 다르기 때문이다:
  #   · 거절(DECLINED)      → 그 사람이 **수락하면** 된다. (또는 클라이언트 설정을 켜면)
  #   · 실패(FAILED_DOWNLOAD) → 그 사람이 할 일은 **재시도**다. 수락은 이미 했다.
  #   · 그 밖(INVALID_URL·FAILED_RELOAD) → 그 사람 잘못이 아니다. 관리자를 불러야 한다.
  # 문구는 여기(등록부)에 산다 — 코드가 말을 지어내지 않는다. MiniMessage 태그를 쓴다.
  gate:
    enabled: true

    # ★★ 침묵의 문 (2026-07-13 · 실사건에서 태어났다)
    #   부계정 둘이 **팩 응답을 하나도 안 하고** 들어와 놀았다 — 거절도, 실패도, 성공도 아닌 **침묵**.
    #   그런데 문은 거절과 실패에만 반응했다. **대답하지 않으면 통과하는 문**이었다.
    #   우리가 "닫혔다"고 믿는 동안 열려 있었다. 침묵이 성공으로 읽히는 그 병이 여기에도 있었다.
    #
    #   그래서 **침묵도 답으로 친다.** 보낸 뒤 이만큼 기다려도 「켜졌다」가 안 오면 내보낸다.
    #   원인이 무엇이든(비바닐라 클라이언트 · 프록시 · 구버전 · 패킷 누락) **문은 닫혀야 한다.**
    #   0 으로 두면 이 문은 안 선다 (그러면 침묵은 다시 통과한다 — 그것을 알고 두라).
    silence_seconds: 45      # 느린 회선이 팩(400KB)을 받고 켜기까지 넉넉한 시간

    silent: |-
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      <white>그대의 눈이 <gold>혼천의 팩</gold><white>에 답하지 않았다.

      <gray>거절한 것도, 길이 끊긴 것도 아니다 — <white>그대의 클라이언트가
      <gray>팩 요청 자체를 <white>못 들은 척<gray>했다. 흔한 까닭은 셋이다:

      <white>▸ <yellow>서버 리소스팩<white>이 꺼져 있다
      <gray>   멀티플레이 → 서버 고르기 → 편집 → <white>서버 리소스팩: 사용<gray> → 완료
      <white>▸ <yellow>바닐라가 아닌 클라이언트<white>를 쓰고 있다 (일부는 팩을 무시한다)
      <white>▸ <yellow>낡은 버전<white>이다 — 혼천은 <white>1.21.11<gray>을 쓴다

      <gray>고치고 다시 들라. <white>강호는 이 눈으로만 보인다.
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    declined: |-
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      <white>강호는 <gold>혼천의 눈</gold><white>으로만 보인다.
      <gray>그대는 팩을 물리셨다. 그 눈이 없으면 무공도, 기세도, 글자도
      <gray>그대 앞에서는 백지일 뿐이다. 그래서 문을 닫는다 — 막으려는 것이 아니라,
      <gray>보이지 않는 강호에 그대를 들이지 않으려는 것이다.

      <white>▸ <green>다시 접속하여 「수락」</green><white>을 누르라. 그 한 번이면 된다.
      <gray>   창이 뜨지도 않거든:
      <gray>   멀티플레이 → 서버 고르기 → <white>편집</white> → <white>서버 리소스팩: 사용</white> → 완료
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    failed_download: |-
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      <white>혼천의 눈이 <red>그대에게 닿지 못했다</red><white>.
      <gray>그대는 팩을 물리치지 않았다 — 다만 길이 끊겼다.
      <gray>내려받다 말았거나(네트워크), 받은 것이 도중에 상했다.

      <white>▸ <green>잠시 숨을 고르고 다시 접속하라</green><white>. 대개 두 번째에 들어온다.
      <gray>   거듭 막히거든 회선을 바꿔 보라 (Wi-Fi ↔ 유선, VPN 끄기).
      <gray>   그래도 안 되거든 관리자에게 이르라 — 서버 기록에 그대의 이름이 남아 있다.
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    failed_other: |-
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      <white>혼천의 눈이 <red>펴지지 않았다</red><white>.
      <gray>그대 잘못이 아니다. 팩 자체나 그 주소에 탈이 났다.

      <white>▸ <green>다시 접속해 보라</green><white>. 같은 일이 반복되거든 관리자에게 이르라.
      <gray>   서버 기록에 이유가 남아 있다 — 관리자는 그것을 읽으면 된다.
      <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
