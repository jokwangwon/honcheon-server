# 세력 입문 루트 (기계 판독용)
# 기준 문서: docs/design/faction_entry_routes.md
#
# ─── 제1원칙: 레일 금지 ───
# 체인은 순서가 아니라 세계의 반응 규칙이다.
#   ① gates는 선형 배열이 아니라 '조건 게이트 집합'이다 — 배열 순서는 표기의 편의일 뿐,
#      평가는 전부 독립 조건식. 어떤 경로로 상태를 채웠든 같은 문이 열린다.
#   ② direct_approach는 전 공개 세력에 상시 열려 있다 — 조건 미달의 결과는 '진행 불가'가 아니라
#      세계의 반응(난이도 상승 / 잡역 / 낮은 문 안내 / 눈여겨봄 태그 / 소문)이다.
#   ③ quest_injection — 루트 상태가 quest_generation ④ 세력 발생원에 의뢰를 흘린다.
#      세계가 플레이어에게 문을 내미는 것이지, 플레이어가 정해진 문을 찾아가는 게 아니다.
#   ④ 마교는 순서가 아니라 누적 상태(심마·침식·접촉)의 문턱이다.
#
# 신규 통화 발명 없음 — favor(faction_reaction) / 주목 score / 소문 강도(rumor) /
# 경지(cultivation) / 공적(sect_life, 입문 '이후'의 축) / 판정(judgment) 만 사용.

meta:
  gate_semantics: "조건 게이트 집합 — 전제는 '이전 게이트 완료'가 아니라 '상태 조건'"
  judgment: "능력치 + 기술 + 2d6 vs 난이도 (judgment.yml 그대로 — 신규 판정식 없음)"
  registry: "factions.yml 등재 세력만. 신규 세력·NPC 발명 금지 (직책 예약은 문서 7장)"
  exclusivity: "동시 소속 1개 — 겸적 = 배신 (common_rules.dual_membership)"

# ═══════════════════════════════════════════════════════════════════
# 정파 문파 — 시험의 공식화 (참조 구현)
# ═══════════════════════════════════════════════════════════════════
routes:

  hwasan_entry:
    id: hwasan_entry
    faction: 화산파                  # factions.yml orthodox.gupailbang.sects
    group: orthodox
    visibility: 공개
    grammar: 심사                    # 문파는 제자를 '심사'한다 — 제도이고, 공표되어 있다
    region_access: "청하현에서 닿는 유일한 구파 (진운 = 청하현 방면 연락 담당)"

    triggers:                        # 서사 의도: 문은 여러 방향에서 보인다 — 하나만 봐도 된다 (OR)
      - { type: 소지품, key: 매화_목패, note: "의뢰소 단서 (cheongha_hyeon request_office)" }
      - { type: 소지품, key: 화산_고식_검결_절편, note: "fortune_encounters fever_elder_legacy 회수" }
      - { type: 인연, npc: jinun, note: "진운 조우 — 의뢰소·객잔" }
      - { type: 인연, npc: soyeon, note: "소연이 화산 사람의 존재를 알린다" }
      - { type: 목표, key: "화산파 입문 단서 찾기", note: "player_creation initial_goal 예시" }
      - { type: 없음, note: "★ 트리거가 하나도 없어도 direct_approach는 열려 있다" }

    gates:
      - id: 안면
        # 서사 의도: 문파는 모르는 사람을 심사대에 올리지 않는다 — 심사는 비용이다
        condition: { favor: { faction: orthodox, min: 4 } }   # 안면
        fill_paths: [의뢰_완수, 북쪽산길_사건_개입, 열병_사건_기여, 진운_조력, 문전_잡역, 비무연_입상]
        opens: [진운_이름_기억, quest_injection_정파_경유]
        judgment: 없음                # 상태 게이트 — 판정 없음

      - id: 추천
        # 서사 의도: 세 개의 독립 열쇠 — 하나만 있으면 된다 (경로는 묻지 않는다)
        condition_any:
          - { favor: { faction: orthodox, min: 8 }, npc_trust: { jinun: 신뢰 } }   # 열쇠 ① 신용 = 신원 보증
          - { item_any: [매화_목패, 화산_고식_검결_절편] }                          # 열쇠 ② 단서 소지
          - { rumor: { intensity_min: 2, accuracy_band: 사실적, tags: [무재, 협행], network: orthodox_net } }  # 열쇠 ③ 재목 소문 → 문파가 먼저 찾아온다
        judgment: { 열쇠2: "화술+지혜 vs 보통(10) — 실패해도 단서는 남는다 (재시도 가능)" }
        price: "추천에는 보증인이 있다 — 진운의 이름이 걸린다 (입문 후 물의 = 진운 문책)"
        opens: [추천장]

      - id: 입문_심사
        # 서사 의도: 시험관은 무공을 보러 온 것이 아니다 — 성정(性情)이 지배한다
        condition_any:
          - { item: 추천장 }
          - { flag: 문전_잡역_누적, days_min: 30 }             # 직행자의 정공법
          - { rumor: { intensity_min: 3, tags: [무재] } }
        event: chapter_events.hwasan_examination               # 기존 장 사건 재사용
        examiner: "화산파 심사 장로 (직책 예약 — 이름 없음)"
        trial:
          자질: "판정 연속 (무재)"
          경쟁자: "동기 NPC 소년 — 사형제 예고"
          성정: "★ 시험관의 진짜 관찰 — 자질 전패해도 합격 가능, 무재 우수해도 성정 낙방 가능"
        on_fail: { favor: 유지, offers: [재도전_조건, 속가_루트, 독학_루트] }   # 문은 닫히지 않는다
        opens: [입문식]

    direct_approach:                 # ★ 제1원칙 0.1의 참조 구현 — 항상 시도 가능
      declaration: "화산으로 간다 / 산문에 직접 찾아가 받아달라고 한다"
      always_allowed: true
      travel:
        judgment: "여비·기간 — 청하현 → 화산(섬서 화음). 소지 은자 vs 노자 기준선"
        on_insufficient: "걸식·품팔이 여정 — 기간 2배 + 원기 소모 (죽지 않는다: 세계는 잔인하되 공정하다)"
        encounters: "도중 산길 도적·표행 동승 — 여정 자체가 소문과 인연을 만든다"
      branches:                      # 상태에 따라 문의 '얼굴'이 다르다 (닫히지는 않는다)
        조건_전무:                    # favor 0, 경지 범인, 단서 없음
          condition: { favor_max: 0, realm: 범인, items: [] }
          result: 문전_잡역_제안
          detail:
            favor_gain: "잡역 일수당 정파 favor +1 (상한 8) — 잡역 = 사실상의 안면 단계 진입"
            tag: 눈여겨봄
            auto_qualify: "30일 누적 시 심사 자격 자동 획득 — 추천장 없는 자의 정공법"
            on_abandon: "이탈해도 '눈여겨봄' 태그는 남는다 — 후일 재방문 시 심사 난이도 -2"
        경지_있음_추천_없음:
          condition: { realm_min: 삼류, favor_max: 3 }
          result: 즉석_심사
          difficulty_modifier: +4     # 추천 없는 자의 벽
          on_fail: 문전_잡역_제안      # 낙방 = 강등 접속 (탈락이 아니다)
        단서_소지:
          condition: { item_any: [매화_목패, 화산_고식_검결_절편] }
          result: 즉시_접견            # ★ 직행이 정공법과 같은 문에 도착한다 (게이트 = 상태의 증명)
        악명_보유:
          condition_any:
            - { favor: { faction: haomun, min: 8 } }
            - { rumor: { tags: [살인], intensity_min: 3 } }
          result: 문전_축객_경고
          still_offered: [속가, 객경]  # 낮은 문은 닫지 않는다
          side_effect: { rumor: { intensity: 2, note: "사파망에서는 오히려 평판이 오른다 — 문은 하나가 아니다" } }
      rumor_on_attempt:
        intensity: [1, 2]
        networks: [orthodox_net, inn_net]
        text: "산문 앞에서 소리친 아이가 있었다 — 무모함 자체가 소문이 된다"
      design_note: "무모한 직행은 실패가 아니라 가장 느린 경로다. 느린 경로에는 느린 경로의 이야기가 있다"

    point_of_no_return:
      key: 입문식
      effect: "사문 등록 — 이후 겸적 불가. 되돌리려면 탈문 또는 파문뿐"

    first_duty:
      - "월 임무 1회 (quest_generation ④ 세력 발생원) — 첫 임무는 심부름 등급"
      - "정규 수련 참석 (training location_safety 최상급)"

    betrayal:
      탈문:
        effects: [공적_몰수, 비급_반납_요구, "정파망 소문 강도 2 (화산을 등진 아이)", 진운_신뢰_붕괴]
      파문:
        causes: [문규_3진, 살문, 마공_겸수, 비급_유출]        # sect_life expulsion 그대로
        effects: ["'파문제자' 낙인 = 강도 3 소문 + 문파 적대 + 정파권 NPC 저항 +2"]
        hook: "★ 파문제자 = 마교 잠식 계수 가산 대상 (magyo_encroachment)"
      복권: "대공 1건 + 장문 재가 (sect_life reinstatement)"

    sect_life_entry: { rank: 외문_제자, ref: "sect_life.yml rank_ladder" }

    quest_injection:                 # 서사 의도: 세계가 상태를 보고 문을 내민다
      - { when: { favor_min: 4 }, inject: 진운_경유_의뢰, channel: 의뢰소_공개 }
      - { when: { tag: 눈여겨봄 }, inject: 진운_지명_의뢰, channel: NPC_직접_지명 }
      - { when: { favor_min: 8 }, inject: 문파_전용_의뢰, channel: 세력_경유_favor게이트 }

# ═══════════════════════════════════════════════════════════════════
# 세가 — 혈연 조직: 외부인은 제자가 아니라 '등재'된다
# ═══════════════════════════════════════════════════════════════════

  dangga_entry:
    id: dangga_entry
    faction: 사천당가                # factions.yml orthodox.odaesega.clans
    group: orthodox
    visibility: 공개
    grammar: 등재                    # ★ 문파와 다른 문법 — 세가는 제자를 받지 않는다
    region_access: "청하현=섬서 / 당가=사천 — ★ 거리 자체가 게이트다 (떠나는 이야기로 시작한다)"
    internal_currency: 가문_은혜      # 공적(功績)은 세가에 통용되지 않는다 — 세가의 축은 '집'의 장부다

    triggers:
      - { type: 집안, key: 상가의_자식, note: "world_link: 가문이 사천당가에 상납 — 얼굴이 이미 알려져 있다" }
      - { type: 집안, key: 무가의_자식, note: "향반 무가의 예법과 검 — '어느 집 아이냐'에 답이 있는 자" }
      - { type: 집안, key: 몰락_무가의_자식, note: "답이 없는 자. 그러나 '이름' 흔적이 있다" }
      - { type: 사건, key: 독_계열_접촉, note: "열병 '원인 불명 환자' / 가짜 약 유통 / 독물 감정" }
      - { type: 기예, key: 당문비수술, note: "skills: '기초는 바깥에도 흘렀다' — 공개 사용 시 당가가 출처를 캐묻는다" }
      - { type: 세력, key: sangdan, note: "당가 상단·행상이 청하현을 지난다 (배경 처리 — 신규 NPC 없음)" }

    gates:
      - id: 문전_알현
        # 서사 의도: 세가의 문은 무공이 아니라 소개장이 연다 — 만나주는 것 자체가 이미 호의다
        condition_any:
          - { favor: { faction: sangdan, min: 8 }, item: 소개장 }        # ① 상인이 여는 문 (가장 흔하다)
          - { family: 무가의_자식 }                                       # ② 이름 — 예법상 문전박대는 없다
          - { item_any: [당가_유출_기예, 독물, 암기] }                     # ③ 물건 — 출처 추궁 = 접견의 다른 이름
          - { judgment: "암기/독/의술 시연 vs 어려움(14)" }               # ④ 재주 — 세가는 쓸모를 본다
        family_modifier:
          무가의_자식: +2              # 예법
          몰락_무가의_자식: +1         # 이름은 남았다 — 단 '몰락'은 식객 이상을 어렵게 한다 (후견인 필요)

      - id: 식객_등재
        # 서사 의도: 소속이 아니라 체류다. 언제든 나갈 수 있고, 언제든 쫓겨난다
        condition: { favor: { faction: 사천당가, min: 4 }, gate_passed: 문전_알현 }
        grants: [당가_외당_서고_하급, 당문비수술_사사, 당가_이름의_그늘]
        price: "재주를 계속 증명해야 한다 — 무용해지면 조용히 밥상이 줄어든다"
        exit: 자유                    # ★ 식객은 PONR 이전 — 이것이 식객 단계가 존재하는 유일한 이유다
        dual_membership: 허용         # 체류는 겸적이 아니다

      - id: 가신_등재
        # 서사 의도: 충성을 등재한다. 세가에는 문규 3진이 없다 — 한 번이면 족하다
        condition:
          favor: { faction: 사천당가, min: 13 }        # 공신
          tag: { 가문_은혜: 1 }
          ritual: 서약_문서
        earn_은혜:                     # 가문 은혜 태그 획득 경로 (택1)
          - { key: 구명, ref: "faction_reaction favor 공적_대 +4 — 당가 사람의 목숨을 구한다" }
          - { key: 손실_방지, note: "유출된 기예·독물 회수, 상행 방어" }
          - { key: 조달, note: "당가가 원하는 것을 가져온다 — 독물·약재·정보" }
        grants: [방계_무공_상한_전수, 봉록, 세가_보호]
        cap: "칠보독장은 내당 — 가신은 원칙적으로 못 넘는다"
        price: "충성. 명령 거부 = 문규가 아니라 '배신'이다"
        point_of_no_return: true      # ★ 장부 등재

      - id: 방계_등재
        # 서사 의도: 세가는 무공을 파는 곳이 아니라 핏줄을 관리하는 곳이다 — 방계 등재는 입양에 가깝다
        condition:
          gate_passed: 가신_등재
          tag: { 가문_은혜: 2 }
          대공: 1
          후견인: "당가 외당 총관 (직책 예약 — 이름 없음)"
          ritual: 혈서
        grants:
          - { simbeop: chilsal_eumdokgyeong, ref: "simbeop.yml: '사천당가 방계 전승' — 이 게이트의 존재 이유" }
        lineage_price:
          독문_동화: "면역은 동화 — 남을 해독하지 못하고, 독을 축기 재료로 흡수 (정화 자격 영구 상실)"
          전환_비용: "도가·불가 lineage 전환 시 carry_over 0.5 + 주화입마 판정 (simbeop conversion opposed)"
          자가_중독: "독 내성 수련 — 원기 대가 (skills chilbo_dokjang side_effects)"
        ceiling: "만천화우는 직계 한정 — ★ 방계의 천장을 명시한다 (그 위는 핏줄이다)"
        price: "성을 빌린 자는 가문을 떠날 수 없다 — 방계 이탈 = 배신 = 추격 (파문보다 무겁다)"

    direct_approach:
      declaration: "당가로 간다 / 대문 앞에서 받아달라고 한다"
      always_allowed: true
      travel: "섬서 → 사천. 원거리 — 기간·여비 판정 (화산의 수 배). ★ 거리 자체가 첫 시험이다"
      branches:
        소개_없음:
          result: 문전_시연_요구        # 세가는 낯선 자를 만나주지 않는다 — 재주를 보여야 한다
          judgment: "암기/독/의술 vs 어려움(14)"
          on_fail: 문전_잡역_제안        # 마당·약재 손질 — 화산 잡역의 세가판 (favor +1/일, 상한 4)
          tag_on_fail: 눈여겨봄
        이름_있음:                     # 무가의_자식
          result: 접견_허용
          note: "다만 '향반'은 향반이다 — 식객 이상은 은혜가 필요하다"
        물건_소지:
          condition: { item_any: [당가_유출_기예, 칠살음독경_구결, 당가_암기] }
          result: 출처_추궁_접견         # ★ 추궁이 곧 접견이다 (통칙 ③-b 세가판)
      design_note: "세가 직행은 '무공을 보이는 자리'가 아니라 '쓸모를 보이는 자리'다"

    point_of_no_return:
      key: 가신_서약
      effect: "가문 장부 등재 — 대를 넘긴다 (death_and_legacy 피의_장부 연동)"

    first_duty:
      식객: "없음 (재주 증명이 곧 의무)"
      가신: "월 임무 1회 — 호송·독물 수배·추적"
      방계: "월 임무 + 가문 행사 참석 (시간 몰수가 더 크다)"

    betrayal:
      effects:
        - "당가 주목 축 급상승 + 독 계열 추격"
        - "살막 청부 가능 — ★ 세가는 돈이 있다"
        - "가문 장부는 대를 넘긴다 — death_and_legacy 피의_장부 등재, 후계 캐릭터에게 상속"

    sect_life_entry:                 # ★ sect_life는 문파 문법 — 세가는 매핑으로 접속한다
      식객: { maps_to: 속가_외문, note: "공적 대신 '재주 증명' — 봉록 없음, 비급각 1층 상당" }
      가신: { maps_to: 내문_제자, note: "봉록 有, 방계 무공 상한" }
      방계: { maps_to: 진전_제자, note: "내당 심법 접근, 직계 비전은 영구 차단" }
      ceiling_note: "★ 세가에는 '진전 위'가 없다 — 그 위는 핏줄이다. 문파보다 천장이 낮다.
        대신 세가는 재산을 준다 (문파는 시간을 준다) — 이것이 세가를 고르는 이유다"

    quest_injection:
      - { when: { favor_min: 4 }, inject: [독물_수배, 약재_수배, 당가_상단_호송], channel: 의뢰소_공개 }
      - { when: { gate: 가신_등재 }, inject: [추적, 독물_회수, 유출_기예_회수], channel: 세력_경유_favor게이트 }

# ═══════════════════════════════════════════════════════════════════
# 사파 — 시험이 아니라 공범화(共犯化): 발을 담그게 만든다
# ═══════════════════════════════════════════════════════════════════

  haomun_entry:
    id: haomun_entry
    faction: haomun
    group: unorthodox
    visibility: 공개
    grammar: 공범화                  # 사파는 사람을 뽑지 않는다 — 적신다
    npcs: [muksam, heukrang, masam]

    triggers:
      - { type: 사건, key: inn_unorthodox_contact, note: "묵삼 미행·추적·거래 — 어느 쪽이든 접점이 생긴다" }
      - { type: 신분, key: 하오문_말단, note: "player_creation: '묵삼의 존재를 이미 안다 (양날)'" }
      - { type: 행위, key: 정보_구매, note: "정보를 사는 행위 자체가 첫 접촉이다" }
      - { type: 인연, npc: masam, note: "저자 왈패 — 얻어맞거나, 그 밑에서 잔심부름을 한다" }

    gates:
      - id: 심부름
        # 서사 의도: 거절할 이유가 없는 일. 전부 합법이거나, 합법처럼 보인다 — 미끼는 달아야 한다
        condition: { favor: { faction: haomun, min: 4 } }
        tasks: [편지_전달, 출입_감시, 장부_필사, 미행]
        reward_note: "보수가 좋다 — 하오문은 첫 몇 번을 후하게 쳐준다"
        opens: [haomun_net_접근, 암시장_접근, quest_injection_개시]

      - id: 문서_한_장         # ★ PONR
        # 서사 의도: 정보 조직이 사람을 붙잡는 방법은 폭력이 아니라 기록이다
        condition: { favor: { faction: haomun, min: 8 }, npc: heukrang }
        surface: "'받아둬. 자네 몫 계산서일세.'"
        truth: "하오문 장부에 오른 당신의 이름 + 상단 정보 유출의 수령증 (관군에 넘어가면 당신이 범인이다)"
        item_granted: 하오문_수령증
        choice:
          수령: { point_of_no_return: true, tag: 장부_등재 }
          거절: { favor_freeze: 8, tag: 흑랑_경계, note: "문은 닫히지 않고 '얕아진다'" }
        design_note: "★ 시험이 아니라 '동의'를 요구한다. 그리고 동의는 서명이다"

      - id: 소속_통보
        condition: { favor: { faction: haomun, min: 13 }, tag: 장부_등재 }
        surface: "'이제 자네는 우리 사람이야.' — 의식 없음. 고지뿐이다"
        grants: [정보망_상시_접근, 은신처, 신분_세탁_서비스, "은신·암행 계열 무공 (상급 연줄)"]
        grants_note: "★ 신분 세탁: 남의 것은 해주고 자기 것은 안 된다"
        price: "월 1회 정보 상납 — 하오문은 당신을 눈으로 쓴다"
        cost_note: "★ 당신이 아는 모든 사람의 약점을 하오문도 알게 된다"

    direct_approach:
      declaration: "'일 좀 하겠소' — 객잔 2층, 묵삼에게 직접"
      always_allowed: true
      note: "★ 하오문은 절대 거절하지 않는다 — 문턱이 없는 것이 하오문의 문턱이다"
      branches:
        신원_미상:
          result: 즉시_심부름_부여      # 사파에서 직행은 정공법보다 '빠르다'
          price: "★ 위험한 일부터 준다 (버려도 되는 패). 실패 시 보수 없음 + 하오문 주목 +2"
        악명_보유:
          result: 환대                 # 정파에서 문전박대당한 자가 여기서는 우대받는다
        정파_줄_보유:
          condition: { favor: { faction: orthodox, min: 8 } }
          result: 우대_가속
          note: "★ '정파에 줄 있는 사람'은 최고의 상품이다 — 공범화가 더 빨리 온다"

    point_of_no_return: { key: 문서_수령, effect: "장부 등재 — 이탈 시 그 문서가 관군에 흘러간다" }

    first_duty: "월 1회 정보 상납 (소문·동향 보고)"

    betrayal:
      effects:
        - "장부 공개 — 문서 한 장이 관군에 도착한다 (death_and_legacy 수배 규칙)"
        - "★ 하오문은 죽이지 않는다 — 죽은 자는 쓸모가 없다. 대신 사회적으로 매장한다"
        - "소문 강도 3 + 정확도 조작 (하오문은 소문망의 주인이다 — 원하는 이야기를 만든다)"

    sect_life_entry:
      말단: { maps_to: 속가_외문 }
      연락책: { maps_to: 내문_제자, npc_ref: muksam }
      상선: { maps_to: 진전_제자, npc_ref: heukrang }
      note: "★ 하오문에는 비급각이 없다 — 장부가 있다. 공적 대신 정보로 지불한다"

    quest_injection:
      - { when: { favor_min: 4 }, inject: [출처_모호한_조사, 전달, 미행], channel: 의뢰소_공개,
          note: "★ 게시판에 하오문 계열 의뢰가 '섞인다' — 발주처가 모호하다" }
      - { when: { tag: 장부_등재 }, inject: 묵삼_직접_지명, channel: NPC_직접_지명, exclusivity: 독점 }

  noklim_entry:
    id: noklim_entry
    faction: noklim
    group: unorthodox
    visibility: 공개
    grammar: 공범화_부작위            # ★ 아무것도 '하지' 않는 것이 첫 범행이다
    npcs: [galho, north_road_bandit]
    network_note: "녹림은 자체 소문망 없이 하오문 망에 얹혀 있다 (rumor faction_awareness) — 하오문 루트와 교차"

    triggers:
      - { type: 사건, key: north_road_bandits, note: "★ 토벌 의뢰의 반대편 문 — 싸운 것도 접점이다" }
      - { type: 상태, key: 포로, note: "제압·강탈이 패배의 기본값 (death_and_legacy) — 붙잡힌 뒤가 가장 자연스러운 입구다" }
      - { type: 경로, key: 사파_거래, note: "north_road_bandits resolution_paths에 이미 등록되어 있다" }
      - { type: 장_사건, key: chapter_events.salt_road_blockade, outcome: 협상_해결 }
      - { type: 집안, key: 농가의_자식, note: "'땅과 계절, 도적의 첫 표적' — 피해자가 가해자가 되는 길" }

    gates:
      - id: 눈감아주기
        # 서사 의도: 산적은 사람을 물들이지 않는다. 사람이 스스로 눈을 감는다
        condition: { favor: { faction: noklim, min: 4 } }
        tasks: [상행_시각_유출, 순찰_경로_묵인, 갈호_목격_부인]
        world_effect: { region_state: { security: "-" }, note: "북쪽 산길 치안 하락 — 세계가 진짜로 나빠진다" }

      - id: 상행_참여          # ★ PONR
        condition: { favor: { faction: noklim, min: 8 }, event: 습격_참여_1회 }
        truth: "습격 참여 = 목격자가 생긴다 — 곽진(상단 호위)이 얼굴을 보면 상단 장부와 관군 수배에 동시에 오른다"
        lethality_choice:
          비살상: "제압·강탈만 — ★ '도적이 되었으나 살인자는 아니다'. 이 좁은 길이 후일 세탁의 유일한 밑천이다"
          살상: "살인 = 피의 장부 등재 (세탁 불가)"
        effects: { 관군_주목: "+", 정파_favor: -4 }             # 배신_적대

      - id: 산채_등재
        # 서사 의도: 녹림에는 사제가 없다 — 형제와 몫이 있을 뿐이다
        condition: { favor: { faction: noklim, min: 13 } }
        grants: [산채_은신, 산길_지리, 도법_사사, 약탈_수익_배분]
        grants_note: "★ 녹림의 진짜 혜택은 '자유' — 문규도, 월 임무도, 정규 수련도 없다"
        price: "★ 대신 관군이 온다. 토벌 의뢰의 표적이 된다 — 어제의 동료 낭인이 내일 나를 사냥한다"
        danger: 최고                  # salt_road_blockade '토벌_해결'이 이제 당신의 사망 시나리오다

    direct_approach:
      declaration: "산채로 걸어 올라가 받아달라고 한다"
      always_allowed: true
      travel: "북쪽 산길 상단부 — 도중 매복 조우 판정 (은신 실패 시 얻어맞고 끌려간다. 결과는 같다, 아프기만 하다)"
      branches:
        기본:
          result: 갈호_즉석_시험
          detail: "'한 판 붙어보자' (대립 판정 — 패배해도 탈락 아님. 갈호는 근성을 본다)
            / '뭘 할 줄 아나' (산길 지리·사냥·도적질 시연)"
        무재_무기술:
          result: 잡역_제안            # ★ '밥이나 짓게' — 화산 문전 잡역의 사파판 (대칭)
        정파_이력_보유:
          condition: { favor: { faction: orthodox, min: 8 } }
          result: 첩자_의심
          difficulty_modifier: +4
          tag: 감시
          note: "★ 사파 → 정파 세탁이 어렵듯, 정파 → 사파도 공짜가 아니다. 소문은 양방향이다"
        관군_favor_보유:
          result: 즉시_살해_위험        # 녹림은 포두를 살려두지 않는다

    point_of_no_return: { key: 습격_참여, effect: "목격·증거 → 관군 수배 가능 + 정파 favor 영구 손상" }

    first_duty: "상행 참여 (약탈 = 수익 = 공적의 녹림판)"

    betrayal:
      effects:
        - "산채 추격 — 그러나 녹림은 조직력이 약하다"
        - "★ 진짜 위험은 하오문이다 — 녹림이 하오문 망에 얹혀 있으므로 배신 정보가 하오문을 통해 퍼진다"
        - "'산을 배신한 놈' 소문 강도 3 (haomun_net → inn_net) — 사파권 전체에서 신용 불가"
      투항: "관군 자수 가능 — 형벌 + 정보 제공 → 관군 favor 회복 경로. 단 사파권 영구 적대"

    sect_life_entry:
      졸개: { maps_to: 속가_외문 }
      두목: { maps_to: 내문_제자, npc_ref: galho }
      채주: { maps_to: 진전_제자, note: "지역 밖" }
      note: "★ 공적 = 약탈 수익. 비급각 없음 — 녹림의 무공은 훔쳐온 것이거나 몸으로 익힌 것이다"

    quest_injection:
      - { when: { favor_min: 4 }, inject: [산길_안내, 눈감기], remove: 도적_토벌_현상,
          note: "★ 게시판의 토벌 의뢰가 줄어든다 — 녹림이 정보를 미리 사간다" }
      - { when: { gate: 산채_등재 }, board_access: 차단, inject: 갈호_상행_정보,
          note: "★ 게시판 자체에 접근 불가 — 세계가 뒤집힌다" }

  suroche_entry:
    id: suroche_entry
    faction: jangang_suroche
    group: unorthodox
    visibility: 조건부                # 청하현에 거점 없음 — 밖에서 온다
    grammar: 공범화_청구서            # ★ 이 루트는 플레이어가 찾아가지 않는다. 찾아온다
    region_access: "흑수나루 (수로 물류 거점). 등록 NPC 없음 — 수로채 사자는 직책 예약"

    triggers:
      - { type: 기연, key: fortune_encounters.sunken_ship_manual, note: "침몰선 수공 비급 습득" }
      - { type: 행위, key: 수공_비급_공개_사용,
          ref: "fortune_encounters price: 'public_use_rumor — 공개 사용 시 장강수로채가 출처를 캐묻는다'",
          effect: { 수로채_주목: +3, ref: "faction_reaction 거점_또는_연락망_노출 — 그들의 배, 그들의 비급이다" },
          note: "★ 주목 3단계(접촉) 도달 시 수로채 사자가 찾아온다" }
      - { type: 조사, key: 흑수나루_괴담, note: "잠수하지 않아도 접점은 생긴다 — 나루 뱃사람들이 기억한다" }
      - { type: 의뢰, key: 수로_호송, note: "통행세 협상 조우" }

    gates:
      - id: 출처_추궁          # ★ 이 루트의 시험은 '대응'이다 (통칙 ③-b 그대로)
        prompt: "'그 물건, 어디서 났나.'"
        responses:
          숨긴다: { judgment: "화술 대립", on_fail: { 주목: +3 }, on_success: { tag: 감시, note: "수로채는 잊지 않는다" } }
          실토한다: { favor: +2, note: "★ 가장 유리하다 — '우리 배에서 건졌다' = 당신은 도굴꾼이 아니라 발견자다",
                     반납: { favor: +4 }, 거부: { 주목: +3 } }
          거래한다: { judgment: "상술·교섭", note: "비급을 대가로 무언가를 요구한다 (이익형의 길)" }
          싸운다: { 주목: +5, note: "격퇴 가능. 그러나 수로채는 조직이다 — 다음엔 배로 온다.
                   ★ 그리고 이것도 문이다: '쓸 만한 놈이군' → 회유 대상" }
        design_note: "★ 수로채가 원하는 것은 비급이 아니라 그 비급을 쓸 줄 아는 사람이다"

      - id: 통행세_명부         # ★ PONR
        condition: { favor: { faction: jangang_suroche, min: 8 }, event: 수로_사업_참여_1회 }
        tasks: [통행세_징수, 밀수_호송, 관선_회피_항행]
        truth: "★ 수로채의 장부는 '나루의 장부'다 — 모든 나루의 뱃사람이 당신 이름을 안다"
        irreversibility: "지리적 PONR — 수로를 쓰는 한 벗어날 수 없다 (강을 버리지 않는 한)"

      - id: 채_등재
        condition: { favor: { faction: jangang_suroche, min: 13 }, gate_passed: 통행세_명부 }
        grants: [수공_상위_무공, 배, 수로_전역_이동권, 밀무역_수익]
        price: "관군 상시 적대 (관선 단속). 상단과는 ★ 적이자 거래처 — 수로채는 뜯되 죽이지 않는다"

    direct_approach:
      declaration: "흑수나루에서 '수로채 사람을 만나고 싶다'"
      always_allowed: true
      immediate_result: "★ 아무 일도 일어나지 않는다 (수로채는 청하현에 거점이 없다)"
      delayed_result:
        rumor: { intensity: 1, network: sangdan_net }
        arrival_days: [7, 14]        # rumor speed_days 규칙 준용
        note: "★ '찾아가는 것이 아니라 부르는 것' — 직행조차 이 루트에서는 '기다림'의 형태를 띤다"
      envoy_first_line: "'왜 우리를 찾나.' — 동기 심문 (화술 판정)"
      branches:
        쓸모_없음: { result: 나루_잡역_안내, note: "짐꾼·삿대잡이 — 세계는 언제나 낮은 문을 내민다" }
        쓸모_있음: { condition: { skill_any: [수공_비급, 수영, 항해] }, result: "게이트 출처_추궁으로 직결" }

    point_of_no_return: { key: 수로_사업_참여, effect: "나루의 장부 등재 — 지리적 비가역" }

    first_duty: "통행세 징수 또는 밀수 호송 (월 1회)"

    betrayal:
      effects:
        - "★ 물에서 죽는다 — 소문 없이 사라지는 유일한 사파. 강은 시체를 숨긴다"
        - "rumor 강도 0 (완전_은밀) — 세계가 모르는 죽음. ★ 유일하게 피의 장부가 열리지 않는 배신"

    sect_life_entry:
      수부: { maps_to: 속가_외문 }
      향주: { maps_to: 내문_제자 }
      채주: { maps_to: 진전_제자 }

    quest_injection:
      - { when: { 주목_stage_min: 3 }, inject: 통행세_협상, side_effect: "수로 의뢰에 감시자가 따라붙는다" }
      - { when: { gate: 채_등재 }, inject: [밀수_호송, 관선_회피], channel: 세력_경유_favor게이트 }

  salmak_entry:
    id: salmak_entry
    faction: salmak
    group: unorthodox
    visibility: 조건부                # 가장 좁고 가장 어두운 문
    grammar: 회수                     # ★ 살막은 사람을 모집하지 않는다 — 목격자를 처리하거나, 회수한다
    npcs: []                          # ★ 살막은 얼굴이 없다 — 신규 NPC를 만들지 않는 것이 이 루트의 설계다

    triggers:                         # ★ 셋뿐이다. 그리고 셋 다 사고다
      - { type: 목격, key: 청부_현장,
          ref: "chapter_events.vanishing_chain — '마지막 실종의 목격자' 훅 / '외부 살막?'",
          note: "★ 목격자의 기본 처분은 '처리'다 — 살아남는 것 자체가 첫 시험이다" }
      - { type: 생존, key: 살수_표적_생존,
          note: "★ 살막은 실패한 청부를 회수한다 — 그리고 자신들을 이긴 자를 기억한다" }
      - { type: 기예, key: [귀식술, 무영비수],
          ref: "skills: '하오문 상급 연줄 또는 살막 방계 비급' / '조직 밖 유출 사례 없음 — 있다면 사건이다'",
          note: "소지 자체가 살막을 부른다" }

    gates:
      - id: 쪽지               # ★ 살막은 제안하지 않는다. 시험한다
        surface: "어느 날 방에 쪽지가 있다. 이름 하나, 날짜 하나, 금액 하나."
        investigation: "'누가 놓았는가' 조사 가능 — ★ 설계상 실패한다 (살막은 흔적을 남기지 않는다)"
        choices:
          무시: { count_to_close: 3, note: "3번 무시하면 쪽지가 끊긴다 (문이 조용히 닫힌다).
                 ★ 단, 마지막 쪽지에 당신 이름이 적혀 있다 — 무시한 자는 위험 요소다" }
          신고: { 관군_favor: +2, 살막_주목: +5, note: "표적 전환" }
          경고: { 살막_주목: +5, note: "★ 그러나 살막은 감탄한다 ('청부를 방해할 실력이 있는 자')
                 → 회유 시도로 전환 (faction_reaction interplay: 주목 高 × 우호 高 = 영입 대상)" }
          수행: { point_of_no_return: true, goto: 첫_청부 }

      - id: 첫_청부            # ★ PONR — 이 세계에서 가장 무거운 한 걸음
        act: "사람을 죽인다. 서사적 상황이 아니라 ★ 계약에 의해, 모르는 사람을."
        ref: "death_and_legacy: '살인은 비싸다 — 소문·수배·세력 반응 (세계가 청구)'.
          ★ lethal_condition을 플레이어가 스스로 만든다 — 이것이 다른 모든 살인과 다른 점이다"
        effects:
          - { registry: 피의_장부, note: "유족 NPC 복수 훅 생성 — 대를 넘어 새 캐릭터에게 상속 (lineage_choice)" }
          - { favor: { faction: orthodox, delta: -8, permanent: true } }
          - { block: 문파_입문_자격, ref: "sect_life expulsion causes '살문'과 대칭 — ★ 이 한 걸음이 정파의 모든 문을 동시에 닫는다" }
        on_success: "살막이 이름을 준다 (본명이 아닌 코드) — ★ 이때부터 당신은 사람이 아니라 도구다"
        on_fail: "★ 살막은 실패한 살수를 회수한다 — 당신이 다음 표적이다"

    direct_approach:                 # ★ 제1원칙의 유일한 예외이자 증명
      declaration: "'살막에 들어가겠다'"
      always_allowed: true
      physical_destination: 없음      # 산문도, 산채도, 객잔 2층도 없다 — 도착할 곳이 없다
      but_world_responds: true       # ★ 선언 자체가 세계의 반응을 낳는다 (제1원칙은 여전히 작동한다)
      branches:
        rumor: { intensity: 1, network: haomun_net, text: "살수를 찾는 애송이가 있다" }
        사기꾼: { probability: 높음, result: "가짜 살막 — 돈만 뜯긴다 (세계의 정직한 대답)" }
        하오문_중개:
          result: "★ 진짜 경로 — 살막의 문은 언제나 하오문을 경유한다"
          requires: { favor: { faction: haomun, min: 8 }, price: "하오문은 공짜로 문을 열어주지 않는다" }
        살막_인지: { 살막_주목: +2, result: "'우리를 찾는 자는 왜 찾는가' → 쪽지 게이트 발화" }
      design_note: "★ 직행은 '불가'가 아니라 '가장 비싼 경로'다 — 문이 없는 것이 아니라, 문이 남의 집에 있다"

    point_of_no_return: { key: 첫_청부, effect: "피의 장부 — 세탁 불가 (common_rules.laundering 예외)" }

    first_duty: "청부 (지명 — 게시판을 거치지 않는다)"

    betrayal:
      effects:
        - "★ 청부 대상이 된다 — 유일하게 세력 반응 6단계(숙청)로 직행하는 배신"
        - "살막은 협상하지 않는다. 이탈 = 사망 판정의 시작"

    sect_life_entry:
      방계_살수: { maps_to: 속가_외문 }
      정식_살수: { maps_to: 내문_제자, grants: 무영비수, ref: "skills: '살막 정식 살수 한정'" }
      막주: { maps_to: 진전_제자, note: "지역 밖" }

    quest_injection:
      - { when: { gate: 쪽지 }, channel: 쪽지, note: "★ 의뢰가 아니다. 게시판을 거치지 않는다 — 채널 자체가 다르다" }

# ═══════════════════════════════════════════════════════════════════
# 관군 — ★ 입문이 아니라 **임용(任用)**. 무림이 아닌 층위로 건너간다
# ═══════════════════════════════════════════════════════════════════
#
# 다른 여덟 루트는 전부 **강호 안의 문**이다. 이 문만 강호 **밖으로** 난다.
#
#   ★ 이 루트의 한 줄: **관에 드는 것은 세력을 고르는 일이 아니라 층위를 바꾸는 일이다.**
#     문파를 고르면 다른 문파와 겨루게 된다. 관을 고르면 **무림 전체와 다른 편에 선다** —
#     싸우지 않아도 그렇다. 관무불가침(官武不可侵)이란 '서로 다른 층위'라는 뜻이므로.
#
#   ★ 그래서 이 루트의 대가는 favor 가 아니라 **눈빛**이다.
#     어제 같이 밥 먹던 낭인이 오늘 눈을 피한다. 아무도 욕하지 않는다.
#     다만 **'관의 개'** 라는 말이 등 뒤에서 돈다. 그 말은 소문망에 실리지도 않는다 —
#     너무 당연해서 소문거리가 되지 않는다.
#
# 등록제 준수: 직책은 world_map.yml officialdom.hierarchy 에 등재된 것만
#   (현: 현령·포두·포쾌 / 부: 지부 / 성: 순무·총독·절도사 / 경사: 황제·육부·금의위·금군 / 군진: 총병·변장)
# NPC 는 조문원(현령)·박호(포두) 둘뿐 — 신규 NPC 발명 없음.

  gwangun_entry:
    id: gwangun_entry
    faction: gwan_gun                # factions.yml authority.gwan_gun
    group: authority
    visibility: 상시                 # ★ 관아는 문이 열려 있다 — 세계에서 문턱이 가장 낮은 문
    grammar: 임용                    # 다른 루트가 '실력'을 묻는다면 관은 **'신원'** 을 묻는다
    region_access: "청하현 관아 (county_office) — 조문원(현령) · 박호(포두, 이류)"
    npcs: [jomunwon, bakho]
    internal_currency: 관록           # ★ 공적(功績)이 아니다 — 관의 장부는 '연차와 실적'이다 (봉록·고과)

    # ── 관에 드는 네 개의 길 (world_map officialdom 과 1:1) ──
    #   ① 포두 임용   현에서 시작한다. 가장 낮고 가장 빠르다 — 대부분이 여기로 든다
    #   ② 현령의 천거 조문원이 이름을 써 준다. 사람이 여는 문 (favor 의 길)
    #   ③ 무과(武科)  정공법이자 가장 느리다 — ★ 시험은 해마다 한 번이다
    #   ④ 군진 입대   변경으로 간다. 강호를 아예 떠난다 — ★ 마교와 맞닿는 최전선
    entry_paths:
      포두_임용:   { gate: 포쾌_등재, note: "실무의 길. 현 → 부 → 성 (officialdom.hierarchy)" }
      현령_천거:   { gate: 포두_승진, npc: jomunwon, note: "★ 사람이 여는 문 — 관에서도 줄이 가장 빠르다" }
      무과:        { gate: 무과_응시, ref: "world_map officialdom.imperial_access.무과" }
      군진_입대:   { gate: 군진_입대, ref: "world_map officialdom.hierarchy.군진 (대동·산해관·가욕관)" }

    triggers:                        # 서사 의도: 관은 이미 당신 곁에 있다 — 찾아갈 필요조차 없었다
      - { type: 사건, key: north_road_bandits, note: "★ 토벌 의뢰의 세 번째 문 — 관에 신고하는 것 자체가 접점이다
          (녹림 루트는 그 반대편 문이다. 같은 사건, 정반대의 인생)" }
      - { type: 인연, npc: bakho, note: "포두 박호 — 쓸 만한 놈을 눈여겨본다. 관은 언제나 사람이 모자라다" }
      - { type: 인연, npc: jomunwon, note: "현령 조문원 — 검시·조사에 손이 필요하다" }
      - { type: 행위, key: 수배자_포박, note: "★ 잡아 오면 문이 열린다. 관은 결과를 본다 — 신원은 그 다음이다" }
      - { type: 행위, key: 관물_호송_참여, ref: "world_map gwanmu_bulgachim.exceptions —
          표국의 관물 호송은 관과 무림이 합법적으로 만나는 유일한 접점 (진철산)" }
      - { type: 신분, key: 양민, note: "★ 다른 어떤 루트도 '평범함'을 자격으로 치지 않는다. 관만 그렇다" }
      - { type: 없음, note: "★ 트리거가 하나도 없어도 direct_approach 는 열려 있다 (제1원칙)" }

    gates:
      - id: 포쾌_등재            # 안면 — 관의 '안면'은 favor 가 아니라 **호적(戶籍)** 이다
        # 서사 의도: 관은 실력을 묻지 않는다. 이름과 출신을 묻는다.
        #   그리고 그것을 **적는다** — 이것이 이 루트의 모든 것이다 (관은 기록한다)
        condition: { favor: { faction: gwan_gun, min: 4 }, 신원: 양민 }
        fill_paths: [도적_신고, 수배자_포박, 검시_조력, 관물_호송, 박호_잡일, 조문원_심부름]
        grants: [포쾌_신분, 관아_출입, 수배_명단_열람, 월_봉록]
        judgment: 없음             # 상태 게이트 — 판정 없음. 관은 시험하지 않는다, 등재한다
        price: "★ 강호의 눈총 — 아래 murim_gaze 가 이때부터 걸린다.
          '관의 개'라는 말은 여기서부터다. 아직 아무도 면전에서 말하지는 않는다"
        opens: [quest_injection_관_경유, 수배_명단]

      - id: 포두_승진
        # 서사 의도: 관은 무공을 본 적이 없다. 다만 **누굴 몇 명 잡았는가**를 본다
        condition_any:
          - { favor: { faction: gwan_gun, min: 8 }, realm_min: 이류 }        # 열쇠 ① 실적 + 실력
          - { favor: { faction: gwan_gun, min: 8 }, npc_trust: { jomunwon: 신뢰 } }  # 열쇠 ② ★ 현령의 천거
        grants: [포졸_지휘, 검시권, 현_밖_추격권, 관인_사용]
        price: "★ 박호의 자리다. 그가 죽거나 승진해야 빈다 — 아니면 그의 위에 서야 한다 (npc_lifecycle 관인의_길)"
        note: "★ 포두는 여전히 강호의 몸이다 — 무림인이 관에 고용된 것뿐 (불가침 위반 아님).
          여기까지는 **되돌릴 수 있다.** 사직하면 그만이다"

      - id: 무과_응시            # ★ PONR — 관의 사다리로 갈아탄다
        # 서사 의도: 여기서 당신은 '관에 고용된 무림인'이 아니라 **관인(官人)** 이 된다
        condition:
          favor: { faction: gwan_gun, min: 13 }
          realm_min: 일류
          소양: [글눈, 예법]        # ★ 무공만으로는 못 넘는다 — 관은 글을 읽는 자를 뽑는다
        ref: "world_map officialdom.imperial_access.무과 — 현 → 부 시험 → 성 시험 → 경사 전시(殿試)"
        cadence: { every_days: 360, note: "★ 시험은 해마다 한 번이다 — 세계가 기다려 주지 않는다.
          놓치면 1년. 그 사이 강호는 계속 돈다 (이 루트의 진짜 대가는 시간이다)" }
        event: chapter_events.hwasan_examination   # 심사 문법 재사용 — 신규 사건 발명 없음
        trial:
          무예: "판정 연속 (무재) — 화산 심사와 같은 문법"
          책론: "★ 글눈·예법 판정 — 무림인이 가장 자주 낙방하는 자리"
          신원: "★ 진짜 관문. 호적·보증·전과. 사파 이력 하나면 여기서 끝난다"
        on_fail: { favor: 유지, offers: [내년_재응시, 포두_유지, 군진_입대] }   # 문은 닫히지 않는다
        grants: [무관_임용, 금군_입대_자격, 관_무공_열람]
        point_of_no_return: true
        irreversibility: "★ 문파 소속 영구 불가 (common_rules.dual_membership).
          강호를 버린다 — 옛 사형제가 수배자가 되면 **당신이 잡으러 간다**"

      - id: 군진_입대           # ★ 또 하나의 PONR — 강호를 떠나 변경으로 간다
        # 서사 의도: 여기는 '관'이 아니라 **군대**다. 무림도 관아도 없는 곳
        condition_any:
          - { favor: { faction: gwan_gun, min: 8 }, realm_min: 삼류 }   # ★ 문턱이 낮다 — 변경은 사람을 가리지 않는다
          - { flag: 수배_이력, note: "★ 유일하게 **수배자를 받아 주는 관의 문**이다 —
              변군은 묻지 않는다. 대신 돌아올 수 없다 (속죄의 길이자 유배의 다른 이름)" }
        ref: "world_map officialdom.hierarchy.군진 — 대동(25일) · 산해관(37일) · 가욕관(46일)"
        grants: [변군_소속, 실전_군무, 군공_사면, 관_무공_열람]
        price: "★ 청하현으로 돌아오지 못한다 (여정 25~46일 + 군적).
          강호의 소문망에서 이름이 지워진다 — 죽은 것과 다르지 않다"
        hook: "★ 대동 군진은 마교 본교와 최단 침공로에 있다 (world_map §7.1).
          변경에 있는 자만 볼 수 있는 것이 있다 — 마교가 오는 것을"
        point_of_no_return: true

      - id: 금의위_차출         # ★ 관의 천장 — 그리고 강호 전체의 적
        condition:
          gate_passed: 무과_응시
          favor: { faction: gwan_gun, min: 13 }
          realm_min: 절정
          명성: 높음
        ref: "world_map officialdom.imperial_access.금의위_차출"
        grants: [황제_직속, 관무불가침_면제권, 무림_수사권]
        price: "★ 강호 전체의 적. 금의위는 무림이 가장 미워하는 이름이다 —
          murim_gaze 가 최종 단계(적대)로 고정된다. favor 회복 경로 없음"
        hook: "★ 마교 잠식의 표적이기도 하다 (world_map breach.마교_잠식) —
          이 자리에 마교 첩자가 앉는다. 그리고 당신도 그 의심을 받는다"
        note: "★ 무대 밖 (경사 28일). 등록만 — 알파에서는 도달할 수 없다"

    # ── ★ 관의 사다리 — sect_life 의 계급 사다리와 같은 문법, 다른 층위 ──
    #   문파: 외문 → 내문 → 진전 (공적 + 경지 + 계기)
    #   관:   포쾌 → 포두 → 무관 → 지부 (관록 + 실적 + ★ 임기)
    #   ★ 결정적 차이: 문파의 사다리는 **내가 오른다.** 관의 사다리는 **자리가 비어야 오른다** —
    #     위가 죽거나 옮겨 가야 한다 (npc_lifecycle 관인의_길: 서리 → 현승 → 현령 → 지부사).
    #     그래서 관에는 **경쟁자가 사람 얼굴을 하고 있다.** 박호가 그 얼굴이다.
    rank_ladder:
      현:
        포쾌: { rung: 1, ref: "world_map officialdom.hierarchy.현.officials", 봉록: 월,
                note: "포쾌 10~30인 중 하나. 삼류~이류" }
        포두: { rung: 2, npc_ref: bakho, note: "★ 현재 박호의 자리 — 비어야 오른다" }
      부:
        지부_속관: { rung: 3, ref: "hierarchy.부 (부병 300~800)", requires: 무과_응시,
                     note: "★ 무대 밖 — 서안부(1일)·봉상부(3일)" }
      성:
        절도사_휘하: { rung: 4, ref: "hierarchy.성 (성군 5,000~20,000)", note: "★ 여기서부터 무림이 긴장한다" }
      경사:
        금군: { rung: 5, requires: 무과_응시 }
        금의위: { rung: 6, requires: 금의위_차출, note: "★ 관의 천장. 그리고 강호의 적" }
      promotion_rule: "★ 승격 = 자리가 비고(계기) + 관 favor(요건) + 상관의 재가.
        경지 관문 문법 그대로 (sect_life rank_ladder 와 동형) — 신규 승격식 없음"
      ceiling_note: "★ 관에는 '천하제일'이 없다. 대신 **끝이 있다** — 황제까지의 계단이 실재한다.
        문파는 천장이 무한하되 사다리가 없고(경지는 혼자 오른다), 관은 사다리가 있되 천장이 있다"

    # ── ★ 강호는 관군 플레이어를 어떻게 보는가 (이 루트의 심장) ──
    murim_gaze:
      principle: "★ 무림은 관을 미워하지 않는다. **경계한다.** 미움은 관계이고, 경계는 거리다.
        그리고 강호에서 거리는 미움보다 무섭다 — 아무도 당신에게 등을 보이지 않는다"
      by_gate:
        포쾌_등재:
          정파_favor: -2         # "관에 붙었군." — 실망이지 적대가 아니다
          사파_favor: -6         # ★ 사파에게 포쾌는 그냥 적이다
          rumor: { intensity: 1, tags: [관군], network: inn_net, text: "그 아이, 관아에 들어갔다더군" }
          npc: "묵삼이 말을 아낀다. 갈호는 이제 당신을 죽여도 되는 사람으로 본다
            (noklim_entry.direct_approach.branches.관군_favor_보유 = 즉시_살해_위험)"
        포두_승진:
          정파_favor: -4
          사파_favor: -10        # ★ 사파권 사실상 적대 — 하오문·녹림·수로채 루트 폐쇄
          note: "★ '관의 개'라는 말이 여기서부터 면전에서 나온다"
        무과_응시:
          정파_favor: -8
          사파_favor: 적대_고정
          note: "★ 이제 당신은 무림인이 아니다. 정파도 당신을 강호의 일원으로 세지 않는다 —
            문파 입문 자격 영구 소멸 (common_rules.dual_membership)"
        군진_입대: { note: "★ 예외 — 변경으로 가면 강호가 당신을 **잊는다.**
          favor 가 떨어지는 게 아니라 **소문망에서 이름이 지워진다** (rumor decay, 재생성 없음).
          미움도 경계도 없다. 그것이 변경이다" }
        금의위_차출: { note: "★ 정파·사파 전원 적대. faction_reaction 6단계(토벌) 대상이 될 수 있다" }
      what_they_dont_do:         # ★ 이 루트가 murim_disavowal 과 다른 점
        - "★ 강호는 관군 플레이어를 **죽이러 오지 않는다.** 관을 건드리는 것이 곧 불가침 파기이므로.
          murim_disavowal(관을 죽인 자)과 정반대다 — 저쪽은 강호가 먼저 친다. 이쪽은 **아무도 못 친다**"
        - "★ 그래서 관군 플레이어는 **안전하되 외롭다.** 세계에서 가장 안전한 자리이고,
          가장 아무도 없는 자리다. 이것이 이 루트의 정직한 값이다"
      exception: "★ 개인 자격 고용은 위반이 아니다 (world_map gwanmu_bulgachim.exceptions).
        포쾌 단계까지는 '관에 고용된 무림인'이므로 문파 입문 자격이 살아 있다 —
        favor 가 깎일 뿐 문이 닫히지는 않는다. **무과를 넘는 순간 닫힌다**"

    # ── ★ 불가침이 깨질 때 관군 플레이어는 어디에 서는가 ──
    rupture_seat:
      ref: "faction_politics.yml rupture_scenarios · world_map officialdom.breach"
      when: "무림 명분(myeongbun) 이 20 을 넘고 참여 세력이 6 이상 — 즉 **관이 지는 경로**에 들어섰을 때"
      the_choice: "★ 이 루트의 존재 이유. 여기서 세 갈래다 — 그리고 셋 다 문이 열려 있다"
      paths:
        집행:
          act: "칙령을 집행한다 — 문파를 친다 (world_map breach.역모_혐의.player_paths[0])"
          effect: { 관_favor: +8, 정파_favor: -8, 명분: "+10 (관의_문파_토벌_멸문 — ★ 당신의 손으로)" }
          truth: "★ 당신이 명분을 만든다. 당신이 친 그 한 번이 존망 태그를 켜고,
            전 무림의 임계를 -8 내린다. **관을 이기게 하려고 한 일이 관을 지게 만든다**"
        꼬리:
          act: "관의 가해자를 잡아 온다 (myeongbun.drains.가해자_처형_공개 -6 의 실행자)"
          effect: { 관_favor: -4, 정파_favor: +4, 명분: -6 }
          truth: "★ 관을 살리는 유일한 길이자, 관에서 미움받는 길.
            '제 식구를 판 놈' — 관의 사다리는 여기서 멈춘다 (승진 영구 정지)"
          note: "★ faction_politics rupture_scenarios.gwan_first_strike.player_seat.소화 가 이 자리다"
        배신:
          act: "관을 등지고 무림 편에 선다"
          allowed: true            # ★ 언제나 가능하다. 대가가 있을 뿐이다
          effect: "아래 betrayal 로"
          truth: "★ 관군 플레이어만이 할 수 있는 유일한 일 — **증거를 무림에 넘긴다.**
            관의 은폐 문서는 관 안에 있다. 밖에서는 못 얻는다 (정확도 80+ → 명분 배수 ×1.0).
            ★ 마교 이간(magyo_deception)을 푸는 가장 빠른 길이 이것이다:
            관이 결백하다는 증거를 관인만이 꺼낼 수 있다"
      magyo_hook: "★ 관에 잠식이 들어오면 그것을 처음 보는 사람이 관군 플레이어다
        (수배 명단이 이상하다 · 엉뚱한 문파를 친다 — world_map breach.마교_잠식.surface).
        그리고 **아무도 그를 믿지 않는다** — 관은 그를 배신자로, 무림은 그를 관의 개로 본다.
        ★ 이것이 이 세계가 관군 플레이어에게 줄 수 있는 가장 좋은 이야기다"

    direct_approach:                 # ★ 레일 금지 — 관아 문은 언제나 열려 있다
      declaration: "관아에 가서 '포쾌로 써 달라'고 한다"
      always_allowed: true
      immediate_result: "★ 받아 준다 — 관은 언제나 사람이 모자라다.
        세계에서 유일하게 **직행이 정공법보다 빠른** 문이다 (사파의 하오문조차 미끼를 던지는데, 관은 그냥 적는다)"
      branches:
        신원_양민:                   # 기본형
          condition: { 신원: 양민 }
          result: 즉석_등재
          detail:
            favor_gain: "등재 즉시 관군 favor +4 (게이트 포쾌_등재 충족) — ★ 세계에서 가장 싼 favor"
            price: "★ 그리고 세계에서 가장 비싼 favor 이기도 하다 (murim_gaze 가 즉시 걸린다)"
        신원_불명:
          result: 보증인_요구
          detail: "이장·객잔 주인의 보증 — 소연(소연)·한백(청하객잔)이 서 줄 수 있다"
          judgment: "화술+매력 vs 보통(10) — 실패해도 문은 닫히지 않는다 (보증인을 데려오면 된다)"
          on_fail: 관아_잡역_제안      # ★ 마당 쓸기·문서 나르기 — 화산 문전 잡역의 관아판 (대칭)
          tag_on_fail: 눈여겨봄
        수배_이력:
          condition: { flag: 수배_이력 }
          result: 즉시_거절
          note: "★ 관은 기록한다. 한 번 오른 이름은 안 지워진다 — 세계에서 가장 정직한 거절"
          still_offered: [군진_입대, 자수]    # ★ 낮은 문은 여기서도 닫지 않는다
          detail: "★ '변경이라면 받아 주지. 거기선 이름을 안 묻네.' — 유일하게 남은 관의 문"
        사파_소문:
          condition_any:
            - { favor: { faction: haomun, min: 8 } }
            - { rumor: { tags: [사파], intensity_min: 2 } }
          result: 시험적_고용
          judgment: "화술 vs 어려움(14) — ★ 박호가 지켜본다"
          difficulty_modifier: +4
          tag: 감시
          note: "★ 관도 쓸모를 안다. 사파를 아는 자는 사파를 잡는 데 쓴다 —
            다만 언제든 버릴 수 있는 패다 (하오문의 '위험한 일부터 준다'와 정확히 대칭)"
        절연_상태:                   # ★ 관을 죽인 자가 관아에 온다
          condition: { flag: 절연 }
          result: 즉시_포박
          ref: "faction_politics murim_disavowal — 법명분 >= 10"
          note: "★ 유일하게 세계가 '문'을 주지 않는 경우. 그러나 이것도 문이다 — **자수**다
            (authority_mandate.drains.자수 -10). 걸어 들어간 자에게 관은 형(刑)을 주지 살(殺)을 주지 않는다"
      rumor_on_attempt:
        intensity: [1, 2]
        networks: [inn_net, haomun_net]
        text: "★ '그 아이가 관아 문턱을 넘더라' — 강호에서 이보다 빨리 도는 이야기는 없다"
      design_note: "★ 다른 루트의 직행은 '가장 느린 경로'다. 관만 다르다 — **가장 빠른 경로**다.
        그리고 그것이 함정이다: 아무 대가 없이 얻은 것 같지만, 대가는 강호가 청구한다"

    point_of_no_return:
      key: 무과_급제                  # 또는 군진_입대 (둘 다 PONR — 층위를 바꾼다)
      effect: "★ 관인(官人) 등재 — 문파 소속 영구 불가. 강호의 이름을 버리고 관의 이름을 받는다.
        되돌리려면 사직(파직)뿐이고, 파직된 관인을 받아 주는 문파는 없다"
      before_ponr: "★ 포쾌·포두는 되돌릴 수 있다 — '관에 고용된 무림인'일 뿐이므로
        (world_map gwanmu_bulgachim.exceptions: 개인 자격 고용은 불가침 위반이 아니다).
        사직하면 favor 만 남고 문은 다시 열린다. **이 루트가 다른 루트보다 관대한 유일한 지점이다**"

    first_duty:
      포쾌: "순찰·수배자 추적·검시 조력 (월 2회 — ★ 문파의 월 임무보다 잦다. 관은 근무다)"
      포두: "포졸 지휘 + 사건 하나를 통째로 맡는다 (quest_generation ④ 세력 발생원)"
      무관: "★ 임지가 정해진다 — 청하현을 떠날 수도 있다 (관은 사람을 옮긴다)"

    betrayal:
      triggers: [관물_횡령, 수배자_은닉, 사파_이중첩자, 명령_불복, 무림에_기밀_유출]
      effects:
        - "★ 관은 배신자를 무림에 넘긴다 — **가장 잔인한 처벌이다** (강호가 대신 죽인다).
          파직 + 수배 + '관의 개였던 자' 낙인. 관도 무림도 그를 받지 않는다"
        - "authority_mandate +8~14 (관물 횡령·기밀 유출 = 관군 부대 습격에 준함)"
        - "★ 그러나 **murim_disavowal 은 발동하지 않는다** — 무림 명분이 살아 있다면.
          관을 배신하고 무림 편에 선 자는 강호가 감싼다 (rupture_seat.배신)"
      한_가지_길: "★ 관을 배신하는 유일한 명예로운 길 = **무림 명분이 20 이상일 때 무림 편에 서는 것.**
        그때 그는 배신자가 아니라 **의인(義人)** 이다. 관의 문서를 들고 나오는 자.
        정파 favor 회복 경로가 열린다 (faction_reaction 큰_공적_또는_구명)"
      투항_대칭: "★ 녹림 루트의 '투항(관군 자수)'과 정확히 거울이다 —
        저쪽은 산에서 관아로, 이쪽은 관아에서 산으로. 세계는 양방향으로 정직하다"

    sect_life_entry:                 # ★ sect_life 는 문파 문법 — 관은 매핑으로 접속한다
      포쾌: { maps_to: 속가_외문, note: "★ 사문(師門)이 아니다 — 소속이다. 무공은 스스로 구해야 한다.
              관은 밥과 자리와 **권한**을 준다 (수배 명단 열람 = 문파 비급각보다 값진 것일 수도 있다)" }
      포두: { maps_to: 내문_제자, npc_ref: bakho, note: "봉록 有 + 지휘권. 관의 '내문'은 결재선이다" }
      무관: { maps_to: 진전_제자, note: "★ 관 무공 열람 (비급각의 관아판)" }
      ceiling_note: "★ 관에는 '진전 위'가 없다 — 그 위는 **관품(官品)** 이다.
        문파는 시간을 주고(경지), 세가는 재산을 주고(장부), 관은 **권한**을 준다.
        권한은 몸에 새겨지지 않는다 — 파직되면 그날로 사라진다. ★ 그것이 관을 고르는 값이다"

    quest_injection:
      - { when: { favor_min: 4 }, inject: [수배자_추적, 순찰_동행, 검시_조력], channel: 의뢰소_공개,
          note: "★ 게시판의 도적 토벌 의뢰가 '관 발주'로 바뀐다 — 같은 일인데 발주처가 다르다.
            녹림 루트는 이 의뢰를 **없앤다**. 관군 루트는 이 의뢰를 **독점한다**" }
      - { when: { tag: 눈여겨봄 }, inject: 박호_지명_의뢰, channel: NPC_직접_지명 }
      - { when: { favor_min: 8 }, inject: [관_전용_수사, 관물_호송], channel: 세력_경유_favor게이트,
          remove: 사파_계열_의뢰,
          note: "★ 게시판에서 하오문 계열 의뢰가 사라진다 — 아무도 포두에게 그런 일을 맡기지 않는다" }
      - { when: { 명분_min: 20 }, inject: 파열_선택, channel: NPC_직접_지명, npc: jomunwon,
          note: "★ rupture_seat — 현령이 부른다. '자네가 정해야 할 일이 하나 있네.'" }

# ═══════════════════════════════════════════════════════════════════
# 마교 — 입문이 아니라 잠식 (hidden)
# ═══════════════════════════════════════════════════════════════════

  magyo_encroachment:
    id: magyo_encroachment
    faction: 마교                    # factions.yml forbidden.magyo (hidden: true)
    group: forbidden
    visibility: hidden
    grammar: 잠식                     # 마교는 문을 열지 않는다 — 당신 안에서 자란다

    display_prohibition:             # ★ 절대 규칙 — 위반 시 설계 붕괴
      금지:
        - "'마교 루트 진행 중' 류 표기 일체"
        - "잠식 단계·문턱 이름 노출"
        - "진행도 게이지·퍼센트"
        - "선택지·UI·나레이션에 '마교'라는 단어"
      허용:
        - "소문 (금기·괴담 밴드)"
        - "NPC 반응 변화 (혜각·유문·진운이 거리를 둔다 — 아무도 이유를 말하지 않는다)"
        - "나레이션 온도 · 꿈 · 환각 · 신체 증상"
      rule: "★ 감지 가능한 유일한 창구는 '남'이다 — 나를 대하는 세계의 눈빛이 달라진다"

    encroachment_counters:           # 신규 수치 없음 — 기존 축 재사용
      심마_흔적: { ref: "internal_energy qi_deviation.simma ('금기 심법 실패 시 심마 성향 흔적 — 히든 루트 재료')" }
      마병_침식: { ref: "equipment demonic_weapons.침식 ('전투마다 심마 흔적 +1')" }
      금기_접촉: { ref: "금기 심법·마공 비급 열람, 폐사당 금기 사건 개입, 마병 감정 시도, 파문제자 비호" }
      파문: { ref: "sect_life expulsion — '파문제자는 히든 루트의 단골 재료'. 트리거 가산" }
      혈채: { ref: "faction_reaction.yml blood_debt (암혈채)",
              note: "★ 마교는 **세계가 버린 자**를 줍는다. 죽인 자가 아니라 **갈 곳이 없는 자**를 —
                그래서 혈채가 아니라 '혈채가 만든 고립'이 계수다 (아래 contact_condition)" }

    simbeop:                         # ★ 마교의 마도 심법 — 혈교 것이 아니다
      ref: "simbeop.yml cheonma_mugeukgong (lineage: 마도, grade: 금기, method: 연수, capacity 9)"
      why_it_matters: |
        ★ 문턱 3(의존)의 조건 `simbeop_lineage: 마도` 가 지금까지 **혈교 심법(혈기심공)으로만** 충족됐다.
          그러면 마교와 혈교가 같은 어둠이 된다 — 설계가 무너진다.
          마교의 마공은 ② 연수(자기 수명을 태운다)이지 ① 흡성(남을 먹는다)이 아니다
          (internal_energy demonic_classification · simbeop magong.branches).
      the_difference: "★ 그리고 결정적으로 — **천마무극공은 운기를 은폐할 수 있다** (stealth_option: true).
        혈기심공은 못 한다. 숨을 수 있는 어둠만이 잠식할 수 있다.
        이 한 줄이 '마교는 왜 들키지 않고 혈교는 왜 즉시 토벌당하는가'의 전부다"

    thresholds:                      # ★ gates가 아니라 thresholds — 순서가 아니라 문턱이다 (0.4)
      - id: 호기심
        condition_any:
          - { 심마_흔적: { min: 1 } }
          - { 금기_접촉: { min: 1 } }
        world_response: "꿈자리가 사납다. 폐사당 소문이 유난히 귀에 들어온다.
          ★ 아무 시스템 메시지도 뜨지 않는다 — 나레이션의 온도만 바뀐다"
        opportunity: "금기 심법 구결의 '한 줄'이 손에 들어온다 — 읽지 않을 수도 있다"

      - id: 편의
        condition_any:
          - { 심마_흔적: { min: 3 } }
          - { 마병_침식: { min: 2 } }
          - { 금기_접촉: { min: 3 } }
        world_response: "그 힘이 실제로 편하다 — 이길 수 없던 싸움을 이긴다"
        body: { ref: "equipment 마병 갈증 — 열흘 이상 흡혈 없으면 원기 -5/열흘. ★ 몸이 요구하기 시작한다" }
        npc_detection:
          - { npc: hyegak, event: chapter_events.blood_scent, note: "혜각이 혈향을 맡는다 (발화 조건과 정합)" }
          - { npc: yumun, note: "맥을 짚다 손을 뗀다" }
          - { npc: jinun, note: "거리를 둔다" }

      - id: 의존              # ★ PONR — 단전이 물든다
        condition_any:
          - { 마병_침식: { min: 3 }, ref: "equipment 놓기: 침식 3+부터 손에서 놓으려면 지혜 판정 — 검이 사람을 쓴다" }
          - { simbeop_lineage: 마도, state: 축기_개시 }
        point_of_no_return: true
        irreversibility: "lineage 전환 시 carry_over 0.5 + 주화입마 판정 (simbeop conversion opposed)"
        world_response:
          rumor: { intensity: 3, tags: [금기], network: orthodox_net }   # orthodox_net interests에 '금기' 포함
          faction: "정파·관군 주목 축 상승 — 문파 입문 자격 사실상 소멸"
        contact:
          who: "'이해해주는 사람' (직책 예약 — ★ 마교 사자이나 그렇게 불러서는 안 된다)"
          behavior: "그는 자신을 마교라 소개하지 않는다. 추격을 막아주고, 약을 주고, 이해해준다"
          design_note: "★ 이 NPC는 '마교 사자'가 아니라 '이해해주는 유일한 사람'으로 등장해야 한다"
          contact_condition:        # ★ 마교는 언제 먼저 손을 내미는가 — 두 문 (OR)
            ①_잠식: { 마병_침식: { min: 3 } }
            ②_고립:
              condition: { 혈채_현: { min: 6 }, 정파_favor_max: 0 }
              ref: "faction_reaction.yml blood_debt.ladder stage 3(살인마) — **magyo: 접촉_발화**"
              why: |
                ★ 혈채 6 = 정파 favor 가 -4 되고 문파 입문 자격이 사실상 닫히는 칸이다.
                  마교는 **바로 그 칸에서** 온다. 우연이 아니다 —
                  마교가 원하는 것은 강한 자가 아니라 **갈 곳이 없는 자**다.
                ★ 그리고 그는 이렇게 말하지 않는다: "너는 이제 우리 편이다."
                  이렇게 말한다: "자네, 밥은 먹었나."
          vs_hyeolgyo: "★ 같은 칸에서 혈교도 온다. 그러나 혈교는 손을 내밀지 않는다 —
            **회수하러 온다** (equipment demonic_weapons.world_response '혈교 잔당 회수조').
            마교는 사람을 얻고, 혈교는 숙주를 확인한다. 이 대비가 두 세력의 정의다"

      - id: 소속
        condition: { threshold_held: 의존, favors_done: 3 }   # 그 사람의 '부탁' 3회
        surface: "★ 입문식 없음. 어느 날 그가 말한다: '이제 돌아갈 데가 없지 않나.'
          그리고 그것은 사실이다 — 세계가 이미 그를 배제했으므로"
        design_note: "★ 플레이어는 이 순간 '자기가 선택했다'고 느낀다. 그것이 이 설계의 목표다"

    direct_approach:
      declaration: "'마교에 들어가겠다'"
      result: 없음
      note: "★ 문이 없다. 플레이어는 마교를 '찾아갈' 수 없다 — 애초에 알지 못하므로 (hidden).
        마교를 입에 담는 것 자체가 금기 소문(강도 1)이 되어 정파·관군 주목만 올린다"

    reversal:                        # 되돌리기 — 가능하다. 그러나 쉽지 않다
      마병_정화: { judgment: "도가 순도 판정 vs 16 (simbeop purification / equipment counters)" }
      해주: { by: hyegak, lineage: 불가, ref: "simbeop purification.해주 — 사기·사술 정화" }
      심마_흔적: "★ 지워지지 않는다 — 흔적은 성향 태그다. 지운 것은 힘이지 기억이 아니다"
      tag_after: { key: 돌아온_자, effect: "정파 재접근 시 심사 난이도 +4 — 그러나 문은 열린다" }

    first_duty: "'부탁' — 명령이라 부르지 않는다. 거절 가능하고, 거절하면 그가 슬퍼한다. 그것으로 충분하다"

    betrayal: "마교 이탈 = 정파 적대 + 마교 숙청 — ★ 세계 어디에도 갈 곳이 없다 (파멸 서사의 입구)"

    sect_life_entry: 없음             # ★ 마교에는 공적도 비급각도 없다 — '힘'과 '그가 시키는 일'뿐이다

    quest_injection:
      - { when: { 심마_흔적: { min: 2 } }, inject: [폐사당_조사, 괴이_퇴치], channel: 의뢰소_공개,
          note: "★ 게시판에 금기 관련 의뢰가 눈에 띄기 시작한다 — 세계가 시험한다" }
      - { when: { item: 마병 }, event: chapter_events.blood_scent }
      - { when: { tag: 파문제자 }, event: chapter_events.expelled_disciple, block: 정파_의뢰_접근 }

# ═══════════════════════════════════════════════════════════════════
# 혈교 — 입문이 아니라 오염 (파멸 서사 전용)
# ═══════════════════════════════════════════════════════════════════

  hyeolgyo_contamination:
    id: hyeolgyo_contamination
    faction: 혈교                    # factions.yml forbidden.hyeolgyo (hidden: true)
    group: forbidden
    visibility: hidden
    grammar: 오염                     # ★ 입문이 아니다 — 먹히는 것이다
    is_entry_route: false            # ★ 엔진 판독: '소속원'이 되는 루트가 아니다 (혈교에 계급은 없다)
    is_playable_path: true           # ★ 그러나 **플레이 가능한 길이다.** 오염된 채로 사는 것 자체가 플레이다
    ponr_semantics: "PONR 은 '소속'이 아니라 '몸'에 있다 — 되돌리려면 힘을 버려야 한다 (redemption)"

    boundary_vs_magyo:               # 마교(입문 가능) vs 혈교(오염) 명문화
      마교: { 성격: 세력, 문: "없음 — 잠식으로 들어간다", 플레이어_지위: 소속원, 결말: 세력_서사,
              마공: "② 연수 — 제 수명을 태운다", 은폐: 가능, 심법: cheonma_mugeukgong }
      혈교: { 성격: 금기_그_자체, 문: "★ 없다 — 들어가는 것이 아니라 먹히는 것이다",
              플레이어_지위: "★ 숙주(宿主)", 결말: "★ 파멸 또는 개심 — 둘 다 무언가의 끝이다",
              마공: "① 흡성 — 남을 먹는다", 은폐: 불가, 심법: hyeolgi_simgong }
      세계_반응: { 마교: 정파_적대, 혈교: "정파·관군·불가 전원 토벌 대상 (세력 반응 6단계 직행)" }
      one_line: "★ 마교는 자기를 태우고, 혈교는 남을 먹는다. 그래서 마교인은 늙고, 혈교인은 굶는다.
        그리고 **늙는 것은 사람의 일이다**"

    # ═══════════════════════════════════════════════════════════════
    # 입구 — ★ 살인은 **여섯 중 하나일 뿐이다**
    # ═══════════════════════════════════════════════════════════════
    # 살인만이 유일한 입구면 이 길은 '악당 놀이'가 된다. 그러면 아무도 실수로 발을 들이지 않는다.
    # ★ 좋은 타락은 **선의로 시작한다.** 그래서 입구는 여섯이고, 그중 넷은 죄가 아니다.
    entrances:
      ①_금서:
        act: "혈기심공 구결을 읽는다"
        where: "폐사당(abandoned_shrine) — magyo_encroachment 문턱 1 의 '금기 심법 구결 한 줄'이
          여기서 갈라진다. 같은 사당, 두 개의 구결"
        cost: "읽기만 해서는 아무 일도 없다. **금기_접촉 +1** (마교 계수와 공유 — 아직 갈림길이다)"
        judgment: "글눈 — 실패해도 읽힌다. ★ 오히려 실패한 독해가 더 위험하다 (독학 = qi_deviation)"
        note: "★ 가장 흔한 입구. 그리고 **아직 아무도 죽이지 않았다**"

      ②_마병:
        act: "마병을 줍는다 (기연의 탈을 쓴 저주)"
        ref: "equipment demonic_weapons.identification — '감정 전엔 정체 불명'"
        cost: "전투마다 침식 +1. 침식 3+ 부터 **손에서 놓으려면 지혜 판정** — 검이 사람을 쓴다"
        note: "★ 살인 없이도 자란다. 도적만 베어도 자란다. **몰랐다는 것이 변명이 되지 않는 유일한 입구**"

      ③_기연:
        act: "등록 기연이 혈교의 것이었다"
        ref: "fortune_encounters — sunken_ship_manual 문법 (price: public_use_rumor) 재사용.
          신규 기연 발명 금지 — 기존 기연의 **감정 결과**가 갈린다"
        detector: "야철수(감정) · 혜각(혈향) — ★ 둘 중 하나에게 보이면 진실을 안다. 안 보이면 모른다"
        note: "★ 세계가 준 선물이 저주였다. 플레이어의 잘못이 아니다 — 그래서 억울하고, 그래서 붙든다"

      ④_절박:                        # ★★ 이 입구가 이 루트의 심장이다
        act: "누군가를 살리려고 손을 뻗는다"
        trigger:
          - "죽어가는 사람 (열병 사건 · 유문이 손을 뗀 환자 · 사형제 · 가족)"
          - "이길 수 없는 적 앞 (사선 마크의 문턱 — 여기서 죽거나, 여기서 마시거나)"
        why_it_works: "★ 혈기심공의 passive 는 **재생**이다. 그리고 흡성은 **원기를 옮긴다** —
          남의 원기를 빼앗아 **남에게 줄 수도 있다.** 규칙상 가능하다. 그것이 이 입구의 잔인함이다"
        the_line: "★ 살리기 위해 죽인다. 이 세계에서 가장 좋은 타락의 문장이고,
          플레이어는 이 문장을 **자기가 썼다고 믿는다**"
        note: "★ 죄가 아니다. 아직은. 그래서 되돌아갈 수 없다"

      ⑤_살인:                        # ★ 여섯 중 하나. 유일하지 않다
        act: "이미 죽였고, 이미 갈 데가 없다"
        condition: { 혈채_현: { min: 6 }, ref: "faction_reaction blood_debt.ladder stage 3 — hyeolgyo: 회수조_발화" }
        who_comes: "혈교 잔당 회수조 (equipment demonic_weapons.world_response — 이미 등록된 사건)"
        behavior: "★ 그들은 회유하지 않는다. **확인하러 온다** — 숙주가 익었는지.
          마교는 '자네, 밥은 먹었나'라고 하고, 혈교는 아무 말도 하지 않는다"
        note: "★ 이 입구만이 '악당 놀이'다. 그리고 이 입구가 가장 **늦게** 열린다 — 그것이 옳다"

      ⑥_전수:
        act: "혈교도가 직접 가르친다"
        gate: "★ 청하현 무대에는 혈교 거점이 없다. 이 입구는 **회수조 조우 이후**에만 열린다
          (⑤의 후속. 등록 예약 — 신규 NPC 발명 금지)"
        note: "★ 유일하게 '입문에 가까운' 입구. 그러나 그들은 제자를 받는 것이 아니라 **그릇을 고른다**"

    # ═══════════════════════════════════════════════════════════════
    # 대가와 보상 — 왜 유혹적이고 무엇을 갈아 넣는가
    # ═══════════════════════════════════════════════════════════════
    economics:
      ref: "★ 정본은 simbeop.yml magong (신규 축 발명 없음 — 용량·순도·화후·내공·원기·수명만 쓴다)"
      보상:
        용량: "capacity 10 — 전 심법 최대 (현경 내공 9 에 닿는 둘 중 하나)"
        속도: "★ 흡성 = **시간을 훔친다.** 절정(내공 3) 하나를 먹으면 좌공 2.7년치가 한 번에 들어온다.
          정파는 절정에 6년을 앉아 있어야 한다 (cultivation accumulation_cost)"
        발력: "전 무공 위력 +1 (다른 심법은 계열 한정 — 마공만 전 계열)"
        재생: "passive 재생 — 죽지 않는 몸의 감각. ★ 이것이 ④_절박 입구를 여는 미끼다"
      대가:
        순도: "0.8 — 전 심법 최저. 회복이 가장 느리다"
        연비: "검기·강기 소모 +1 — 헤프다. **폭발형이지 지구전형이 아니다**"
        원기: "★ depletion_override — 고갈 시 시전당 원기 -5. **싸울수록 원기가 준다**"
        갈증: "흡성 없이 30일 → 원기 -5/10일 (magong.branches.①_흡성.the_trap.갈증)"
        심마: "흡성 1회당 흔적 +1 → 벽(壁) 앞에서 깨달음 판정이 막힌다 (cultivation promotion_effects.마도_계열)"
        수명: "깨달음이 막히므로 **파벽(수명 5년/회)만 남는다** — 흡성이든 연수든 끝값은 같다"
        은폐: "★ 불가 (simbeop stealth_option: false) — 운기조식하는 순간 목격자가 안다"
        정화: "영구 상실 — 도가·불가 계열의 배독·해주 전부 봉쇄. **자기가 정화 대상이 된다**"
        관계: "혈채(faction_reaction blood_debt) — 아래"
      # ★★ 사용자 시나리오의 규칙적 근거 — 반드시 읽을 것
      the_trap:
        ref: "simbeop.yml magong.branches.①_흡성.the_trap"
        summary: |
          ★ **마을 사람을 죽여도 내공은 늘지 않는다.** (대상 내공 0 → 진기 수확 0)
            늘어나는 것은 **원기 +5** (= 발경 한 번분 연료)와 **혈채**뿐이다.

            힘을 얻으려면 무인을 먹어야 한다. 그런데 무인은 반격한다.
            그래서 약한 자를 죽인다 → 갈증만 잠깐 꺼지고 → 장부만 두꺼워지고 →
            힘은 그대로인데 쫓기는 자만 된다 → 그리고 그때쯤엔 멈출 수가 없다.

          ★ 이것이 마공의 함정이고, **이 함정 자체가 서사다.**
            플레이어에게 이 계산을 미리 알려주지 마라. 몸으로 배우게 하라.
        design_warning: "★ UI·나레이션에 '내공이 오르지 않았습니다' 류의 시스템 안내 금지.
          그저 **아무 일도 일어나지 않으면 된다.** 그리고 갈증은 계속 자란다"

    # ═══════════════════════════════════════════════════════════════
    # 오염 문턱 — 순서가 아니라 상태 (마교 잠식과 같은 문법)
    # ═══════════════════════════════════════════════════════════════
    thresholds:
      - id: 접촉
        condition_any: [{ 금기_접촉: { min: 1 } }, { 마병_침식: { min: 1 } }]
        world_response: "아무 일도 없다. 꿈에 붉은 물이 보인다 — 나레이션의 온도만 바뀐다"
        reversible: 완전                # ★ 여기서는 그냥 버리면 된다

      - id: 첫_흡성                     # ★ PONR — 몸의 PONR (소속의 PONR 이 아니다)
        act: "타인의 내력을 약탈한다 (흡성 30% — simbeop method_condition)"
        point_of_no_return: true
        irreversibility:
          - { ref: "simbeop depletion_override — '탁한 기운은 주인을 문다'. 안 쓰면 자기를 먹는다" }
          - "★ 흡성을 멈추면 굶는다 — 이것이 '오염'과 '입문'의 차이다"
          - { ref: "simbeop price: 운기 색 '굶주린 탁한 적색' — 은폐 불가" }
        note: "★ 첫 흡성의 대상이 **적**일 수도 있다는 것을 잊지 마라 —
          도적을 흡성해도 첫 흡성이다. 혈채는 0 이지만 몸은 이미 바뀌었다"

      - id: 갈증
        condition: { 흡성_공백_일수: { min: 30 } }
        world_response: "원기 -5/10일. 손이 떨린다. 사람의 목덜미가 눈에 들어온다"
        the_choice: "★ 여기서 세계가 묻는다: **누구를 먹을 것인가.**
          무인은 반격한다. 촌민은 반격하지 않는다. 그리고 촌민은 힘을 주지 않는다.
          ★ 이 세 문장이 이 루트의 전부다"

      - id: 발각
        condition_any:
          - { 혈채_현: { min: 6 } }
          - { event: 운기조식_목격 }      # 은폐 불가 → witness 강제
          - { event: 혈수마공_공개_사용, ref: "skills hyeolsu_magong.public_use_rumor — 즉시 금기 소문 강도 3" }
        world_response:
          ref: "faction_reaction.yml blood_debt.ladder — stage 3 부터 사다리가 굴러간다"
          myeongbun: "금기_마공_사용_확인 (+5, 금기) → ★ **금기 태그(-4) 발화 = 정파 연합의 방아쇠**
            (faction_politics myeongbun.blood_debt_ignition.ignition_order.①_금기)"
        note: "★ 혈교는 이 칸을 **피할 수 없다.** 은폐가 불가능하므로. 마교는 피할 수 있다"

      - id: 발호
        condition: { 혈채_현: { min: 26 } }
        ref: "faction_politics.yml rupture_scenarios.hyeolgyo_outbreak — 파열 시나리오 ⑥"
        outcome: "관(칙명·황실 정규군 21) + 무림(공적 선포, 참여 10+)이 **같은 표적으로 온다**"
        note: "★ 이길 수 없다. 캐릭터 종결 — death_and_legacy 로 이관"

    # ═══════════════════════════════════════════════════════════════
    # 되돌릴 수 있는가 — ★ 있다. 셋뿐이고, 셋 다 무언가를 영구히 잃는다
    # ═══════════════════════════════════════════════════════════════
    redemption:
      ref: "★ 정본은 simbeop.yml magong.redemption (수치·판정)"
      ①_전향: "혈교 → 마교. 먹기를 멈추고 태우기를 시작한다 (carry_over 0.9 — **가장 싸다**).
        ★ 마교가 먼저 손을 내민다 (magyo↔hyeolgyo = 숙적 -3. 원수의 그릇을 빼앗는 것이 마교의 이익이다).
        갈증은 멎는다. 혈채는 남는다. 다만 이제 **그를 숨겨줄 조직이 있다**"
      ②_산공: "마도 → 도가·불가 (opposed). 흡성분 전량 몰수 + 자력분 ×0.5 +
        주화입마 판정(★ 실패 시 폐인·사망 — **개심은 도박이다**) + 경지 봉인 + 원기 상한 영구 -20%.
        해주: 혜각 (simbeop purification.해주 — targets 에 '혈교_사술' 이미 등재)"
      ③_속죄: "자수(법명분 -10) · 배상(-6) · 대공(favor -4) → **현혈채만** 감쇠 개시.
        ★ 암혈채는 영원하다 (faction_reaction blood_debt.atonement)"
      tag_after: { key: 돌아온_자, ref: "magyo_encroachment.reversal.tag_after — 정파 심사 +4, 그러나 문은 열린다" }
      truth: "★ 개심한 자는 살 수 있다. 다만 **범인(凡人)에 가까운 몸으로** 산다.
        그리고 혈채는 지워지지 않는다 — **개심은 힘을 버리는 일이지, 빚을 갚는 일이 아니다**"
      impossible: "★ '개심하고도 강한 자'는 없다. 그런 길을 열면 마공의 값이 사라지고,
        마공의 값이 사라지면 정파를 고를 이유가 없어진다"

    sect_life_entry: 없음             # ★ 혈교에는 계급도 공적도 없다. 그릇과 굶주림뿐이다
    first_duty: 없음                  # ★ 아무도 명령하지 않는다. **몸이 명령한다**

    quest_injection:
      - { when: { 혈채_현: { min: 1 } }, inject: [실종_수색, 시신_수습], channel: 의뢰소_공개,
          ref: "npc_death.yml quest_injection.types",
          note: "★ 게시판에 **자기가 저지른 일의 의뢰**가 붙는다. 수색자가 살해자일 수 있다
            (npc_death 실종_수색.twist — 이미 등록된 훅). ★ 알리바이 세탁이 곧 자유도다" }
      - { when: { 혈채_현: { min: 6 } }, inject: 하수인_추적, channel: 의뢰소_공개, issuer: bakho,
          note: "★ 자기를 잡는 의뢰를 자기가 수주할 수 있다 — 세계는 막지 않는다" }
      - { when: { 혈채_현: { min: 15 } }, board_access: 차단, inject: 없음,
          note: "★ 게시판이 닫힌다. 객잔이 문을 잠근다. **세계에서 일이 사라진다** —
            남은 수입은 약탈뿐이다 (녹림 산채_등재와 같은 문법, 더 무겁게)" }

    why_it_exists: "★ 혈교라는 바닥이 있어야 마교가 '그래도 사람으로 남을 수 있는 어둠'이 된다.
      금기는 다른 금기를 유혹적으로 만들기 위해 존재한다"

# ═══════════════════════════════════════════════════════════════════
# 새외(塞外) — 입문이 아니라 **월경(越境)**. 강호 밖도 관 밖도 아닌, **중원 밖**
# ═══════════════════════════════════════════════════════════════════
#
#   ★ 세 번째 층위다. 지금까지 이 파일에는 두 개의 층이 있었다:
#       · 강호 안의 문 (정파 8루트) — 세력을 고른다
#       · 강호 밖의 문 (관군 루트)   — **층위**를 바꾼다
#     ★ 새외는 세 번째다 — **세계**를 바꾼다.
#
#   ★★ 그리고 이 루트들의 한 줄:
#       **배울 수 있다. 다만 돌아올 수 없다 — 정확히는, 돌아와도 같은 사람이 아니다.**
#
#   ★ 왜 그런가 (규칙에서 나온다, 정서가 아니다):
#     ① 새외의 심법은 계보가 다르다 → simbeop conversion **opposed** → carry_over 0.5 + 주화입마 판정
#        = **중원 심법을 버려야 한다.** 이것이 '유학'과 '귀화'를 가르는 유일한 선이다
#     ② 소문은 지워지지 않는다 (common_rules.laundering.residue) —
#        '오랑캐 무공을 쓰는 자'는 무공을 안 써도 걸음걸이로 안다
#     ③ 거리 57~128일 — **여정 자체가 게이트다.** 왕복이면 반년이 넘는다. 세계는 기다려 주지 않는다
#
#   ★ 그러나 다섯(여섯)이 전부 같지는 않다. **그 스펙트럼이 이 절의 설계다**:
#       서역 = 고용 (배신이 아니다. 장사다)          ← 가장 싸다
#       토번 = 유학 (관이 허락한 길이다. 돌아온다)
#       동영 = 사사 (검객이 검객을 알아본다)
#       배화 = 개종 (유일하게 **믿음**을 요구한다)
#       남만 = 입고 (★ PONR 이 **몸**에 있다 — 혈교와 같은 문법)
#       북막 = 귀부 (★ **진짜 배신이다.** 나라에 드는 것이므로)   ← 가장 비싸다

  saeoe_common:
    id: saeoe_common
    kind: 공통_규칙                  # ★ 루트가 아니다 — 아래 여섯이 공유하는 세 개의 문
    applies_to: [bukmak_entry, seoyeok_entry, baehwa_entry, milgyo_entry, odokgyo_entry, dongyeong_entry]

    # ── ① 거리의 문 — ★ 대부분은 여기서 끝난다
    문①_여정:
      ref: "world_map.yml travel.formula · places 새외 6 (57~128일)"
      days: { 동영: 57, 북막: 76, 오독채: 74, 설역: 86, 고창: 93, 성화단: 128 }
      cost: "여정일 × economy 하루치 노자. ★ 왕복 + 체류면 **1년치 은자**다"
      on_insufficient: "★ 기존 규칙 그대로 — 걸식·품팔이 여정 (기간 2배 + 원기 소모).
        ★ 다만 사막·밀림에서는 **걸식할 사람이 없다** — 여기서는 이 완충이 작동하지 않는다.
        상단 동행이 아니면 여정 판정에 survival(갈증·장기·고산병)이 붙는다 (world_map routes.*.survival)"
      note: "★ 화산 5일 · 당가 26일 · **새외 57~128일.** 등록부가 이미 '거리 자체가 게이트다'라고 했다
        (dangga_entry.region_access) — 새외는 그 문장의 극한이다"

    # ── ② 관문의 문 — ★ '비밀'이 아니라 **행정**이다
    문②_통행증:
      ref: "world_map.yml officialdom.passports"
      by_route:
        seoyeok_entry:   { passport: 노인,     gate: gunjin_gayokgwan, note: "★ 가장 쉽다 — 상단 동행이면 자동" }
        odokgyo_entry:   { passport: 노인,     gate: gwanmun_jinnam,   note: "문은 열리나 그 너머에 길이 없다" }
        milgyo_entry:    { passport: 통관첩,   gate: gwanmun_songban,  note: "★ 승려·도사만 — **계보를 본다**" }
        dongyeong_entry: { passport: 감합,     gate: sibaksa_myeongju, note: "★ 해금(海禁) — 합법 배가 거의 없다" }
        baehwa_entry:    { passport: 노인,     gate: gunjin_gayokgwan, note: "고창까지는 합법. 그 밖은 사막이다" }
        bukmak_entry:    { passport: 감합_또는_없음, gate: gunjin_daedong,
                           note: "★ **국경이다. 상로가 아니다.** 노인으로 못 나간다" }
      the_three_ways_out:            # ★ 통행증이 없는 자에게 남은 문 — 셋뿐이다
        사절_수행: "★ 문파가 보낸다 (world_map imperial_access.세력_밀사 문법 재사용). favor 13+"
        밀출국:    "★ authority_mandate +6 · 수배 이력. **한 번 하면 다시는 합법으로 못 나간다**"
        군진_입대: "★★ **이미 있던 문이다** (gwangun_entry.gates.군진_입대) —
          '변군은 묻지 않는다. 대신 돌아올 수 없다.' 군적이 곧 통행증이다.
          ★ 새외를 위해 새 문을 만들지 않았다. **있던 문이 새외를 향하고 있었을 뿐이다**"

    # ── ③ 몸의 문 — ★ 여기가 진짜 게이트다
    문③_심법:
      ref: "★ 정본은 simbeop.yml conversion (읽기만 — 이 파일은 값을 발명하지 않는다)"
      rule: "새외의 심법 계보는 중원(도가·불가·마도)과 **opposed** 다 →
        전환 시 carry_over 0.5 + **주화입마 판정** (기존 conversion 문법 그대로)"
      the_line: "★ **중원 심법을 버려야 배운다.** 그리고 버리는 것은 도박이다 (실패 시 폐인·사망)"
      exception:
        milgyo_entry: "★ **유일한 예외** — 밀교는 불가(佛家)다. 소림·혜각과 **같은 계보**다.
          → conversion 이 opposed 가 아니다. carry_over 가 높다.
          ★ 그래서 밀교만 '유학'이고 나머지는 '귀화'다. **이 한 줄이 다섯을 가른다**"
        seoyeok_entry: "★ 심법을 안 배운다 (상맹은 무공을 팔지 않는다 — 사병을 산다).
          → 이 문이 아예 없다. ★ 그래서 서역이 가장 싸다"
      proposed_simbeop: "★ 새외 심법 6종의 id·수치 제안은 docs/design/saeoe_murim.md §5 에 있다.
        ★ simbeop.yml 은 소유자가 다르다 — **이 파일은 id 를 발명하지 않는다** (등록제)"

    # ── ★ 귀환의 값 — 돌아온 자를 세계는 어떻게 보는가
    귀환의_값:
      tag: 새외에_다녀온_자          # ★ magyo_encroachment.reversal.tag_after '돌아온_자' 와 같은 문법
      정파_심사: +4                   # ★ 마교에서 돌아온 자와 **같은 값**이다. 우연이 아니다
      관_검문: "★ 성문에서 더 오래 세운다. 노인(路引)을 다시 본다"
      사파_반응: "★ **오른다.** 하오문은 새외 물건을 사고 싶어 한다 (haomun_entry 악명_보유 = 환대와 같은 문법)"
      rumor: { intensity: 2, tags: [새외], networks: [inn_net, sangdan_net],
               text: "'저 사람, 관 밖에 다녀왔다더군' — ★ 감탄과 경계가 같은 문장에 있다" }
      the_irony: |
        ★★ **가장 쓸모 있는 자가 가장 안 믿긴다.**
          새외의 말을 아는 자는 통역이 되고, 새외의 무공을 아는 자는 그것을 막을 줄 안다 —
          그런데 바로 그 이유로 **첩자로 의심받는다.**
        ★ 그리고 새외가 실제로 쳐들어오면(faction_politics rupture_scenarios.saeoe_invasion)
          세계는 그를 찾는다. **그가 필요해서. 그리고 여전히 믿지는 않으면서**
      the_door_that_stays_open: "★ 문은 닫히지 않는다 (제1원칙). 심사 +4 는 벽이지 문이 아니다"

# ─── 서역 — **고용(雇用)**. 배신이 아니다. 장사다 ───
  seoyeok_entry:
    id: seoyeok_entry
    faction: seoyeok_sangmaeng
    group: saeoe
    visibility: 공개
    grammar: 고용                    # ★ 유일하게 '소속'을 요구하지 않는다 — **계약**이다
    region_access: "가욕관(46일) → 돈황(62일) → 고창(93일). ★ 노인(路引)만 있으면 간다"
    internal_currency: 신용(信用)      # ★ 공적도 favor 도 아니다 — **갚은 이력**이다. 상단의 장부

    triggers:
      - { type: 세력, key: sangdan, note: "★ 상단연합의 상행이 서역으로 간다 — 호위로 따라붙으면 그것이 문이다" }
      - { type: 세력, key: pyoguk, note: "표국의 원행(遠行) — 진철산이 못 가는 거리다. 그래서 사람을 구한다" }
      - { type: 물건, key: 서역_물건, note: "옥·향료·이국 약재를 감정하려 한다 (야철수·유문 감정 훅)" }
      - { type: 없음, note: "★ direct_approach 는 열려 있다 — 다만 **93일을 걸어야** 한다" }

    gates:
      - id: 상행_동행
        condition_any:
          - { favor: { faction: sangdan, min: 8 } }
          - { favor: { faction: pyoguk, min: 8 } }
          - { judgment: "★ 낙타·사막 지리·서역 말 — 아무것도 없으면 짐꾼으로 간다 (그것도 문이다)" }
        note: "★ 혼자 가지 마라. 사막에서 혼자는 **죽음의 다른 이름**이다 (routes.sangro_silk.survival)"
        opens: [고창_출입, 상맹_장부_열람]

      - id: 계약
        condition: { favor: { faction: seoyeok_sangmaeng, min: 8 } }
        surface: "'우리 상행을 지켜 주시오. 값은 이만큼.' — ★ **그것뿐이다.** 서약도 의식도 없다"
        grants: [상맹_호위_봉록, 서역_전역_통행, 상맹_정보망, 이국_병기·약재_구매권]
        price: "★ **없다.** 그것이 이 루트의 전부다 — 돈을 받고 일을 한다"
        dual_membership: 허용         # ★ 계약은 소속이 아니다 (dangga 식객과 같은 문법)
        exit: 자유

      - id: 상수의_객(商首之客)         # ★ 이 루트의 천장. 그리고 PONR 이 **아니다**
        condition: { favor: { faction: seoyeok_sangmaeng, min: 19 }, tag: { 신용: 3 } }
        grants: [상맹_사병_지휘, 오아시스_지분, "★ **중원과 서역 양쪽에 이름이 있는 자**"]
        note: "★ 세계에서 **유일하게 PONR 이 없는 루트**다. 언제든 그만둘 수 있다.
          ★ 그리고 그것이 이 루트의 정직한 매력이자, 이 루트가 가장 심심한 이유다"

    direct_approach:
      declaration: "'서역으로 간다'"
      always_allowed: true
      travel: "★ 93일. 여비가 첫 시험이고, **물이 두 번째 시험**이다"
      branches:
        상단_없이:
          result: 갈증_판정             # ★ 죽지 않는다. 다만 고창에 닿을 때 원기가 바닥이다
          detail: "돈황(62일)→고창(93일) 30일 구간에 물이 두 곳뿐. 실패 시 원기 -50%, 도착은 한다"
          note: "★ 세계는 잔인하되 공정하다 (hwasan_entry.direct_approach 원문 재사용)"
        상단_동행:
          result: 무사_도착
          note: "★ 그리고 그것이 정공법이다 — **사막에서는 동행이 곧 실력이다**"
      design_note: "★ 서역 직행은 '느린 경로'가 아니라 **'위험한 경로'** 다. 다른 루트와 축이 다르다"

    point_of_no_return: { key: 없음, effect: "★ **없다.** 계약은 끝낼 수 있다" }
    first_duty: "상행 호위 (계약 단위 — 월 임무가 아니다)"
    betrayal:
      effects:
        - "★ 상맹은 **죽이지 않는다. 장부에서 지운다** — 다시는 그 길로 못 간다 (하오문 문법과 같다)"
        - "★ 그리고 서역의 길은 하나뿐이다. 지워지면 **서역이 통째로 닫힌다**"
    sect_life_entry:
      짐꾼:   { maps_to: 속가_외문 }
      호위:   { maps_to: 내문_제자 }
      상수의_객: { maps_to: 진전_제자, note: "★ 비급각이 없다 — **장부**가 있다 (하오문과 같은 문법)" }
    quest_injection:
      - { when: { favor_min: 4 }, inject: [상행_호위, 서역_물건_감정, 낙타_구매], channel: 의뢰소_공개 }

# ─── 토번 — **유학(留學)**. ★ 새외에서 유일하게 돌아올 수 있는 문 ───
  milgyo_entry:
    id: milgyo_entry
    faction: seolyeok_milgyo
    group: saeoe
    visibility: 공개
    grammar: 유학                    # ★ 배신이 아니다. **관이 허락한 길**이다 (통관첩)
    region_access: "송반관(23일, 통관첩) → 차마고도 → 설역 대사(86일). ★ 사천당가의 땅을 지난다"
    internal_currency: 관정(灌頂)      # ★ 공적이 아니다 — **단계별 전법(傳法)**. 스승이 부어 준다

    triggers:
      - { type: 인연, npc: hyegak, note: "★ 혜각(탁발승) — 불가 계보. **그가 소개장을 써 줄 수 있다**" }
      - { type: 세력, key: sorimsa, note: "소림의 소개 — ★ 다만 소림은 밀교를 싫어한다 (relation -2). 마지못해 써 준다" }
      - { type: 세력, key: dangga, note: "★ 차마고도는 당가가 쥐고 있다 — 당가 favor 가 **길을 연다**" }
      - { type: 기예, key: 불가_심법, note: "이미 불가 계보면 밀교가 먼저 알아본다" }

    gates:
      - id: 통관첩
        condition_any:
          - { npc_trust: { hyegak: 신뢰 } }
          - { favor: { faction: sorimsa, min: 8 } }
          - { favor: { faction: mudang, min: 8 } }
        note: "★ **신분이 아니라 계보를 본다.** 세계에서 가장 좁고 가장 정직한 문이다
          (world_map passports.통관첩)"
        opens: [송반관_통과]

      - id: 숨쉬기               # ★ 이 루트의 첫 시험은 무공이 아니다
        surface: "'앉아라. 숨을 쉬어라.' — ★ **그것뿐이다. 그리고 그것이 1년이다**"
        condition: { flag: 설역_체류, days_min: 360 }
        truth: "★ 고원에서는 중원 사람이 숨을 못 쉰다 (routes.sangro_chama.survival: 원기 회복 절반).
          밀교의 호흡법은 신비가 아니라 **필요**다 — 공기가 얇으므로. **기후가 무공을 만들었다**"
        grants: [고원_적응, 원기_회복_정상화]
        note: "★ 세계에서 가장 지루한 게이트다. 그리고 **가장 정직하다** — 1년을 앉아 있어야 한다"

      - id: 관정(灌頂)            # ★ PONR — 다만 **몸의 PONR 이 아니다**
        condition: { gate_passed: 숨쉬기, favor: { faction: seolyeok_milgyo, min: 13 } }
        grants: [대수인_사사, 금강저, 밀교_심법_전수]
        conversion: "★ **불가 → 불가.** opposed 가 아니다 → carry_over 높음, 주화입마 판정 없음.
          ★★ **이것이 밀교만 '유학'인 이유다** (saeoe_common.문③_심법.exception)"
        price: "★ 8년이다. 청하현의 8년은 그냥 흘러간다 — 사형제가 늙고, 진운이 장로가 되고,
          당신이 알던 사람 몇은 죽는다. ★ **이 루트의 진짜 대가는 시간이다** (무과와 같다)"
        point_of_no_return: true
        irreversibility: "★ 소속의 비가역이 아니라 **시간의 비가역**이다. 돌아올 수 있다. **8년 뒤에**"

      - id: 분노존(忿怒尊)
        condition: { gate_passed: 관정, realm_min: 절정 }
        surface: "'자비만으로는 못 지킨다.' — ★ 밀교가 소림과 갈라지는 자리"
        grants: [분노존_법, "★ 살계(殺戒) 해제 — **죽이는 것도 법이다**"]
        price: "★ 소림 favor -8 · bulga favor -4. **불가가 그를 불가로 세지 않는다**"
        note: "★★ 이것이 '밀교가 소림보다 센' 이유이고, 소림이 가장 말하기 싫어하는 사실이다"

    direct_approach:
      declaration: "'토번으로 간다'"
      always_allowed: true
      travel: "★ 86일. 그리고 송반관에서 **통관첩이 없으면 돌아가야 한다**"
      branches:
        통관첩_없음:
          result: 송반관_회군            # ★ 유일하게 세계가 **물리적으로 막는** 문이다
          still_offered: [밀출국, 상단_동행_밀입국]
          note: "★ 그래도 문은 있다 — 밀출국(법명분 +6). **막는 것이 아니라 값을 매기는 것**이다"
        불가_계보:
          condition: { simbeop_lineage: 불가 }
          result: 즉시_접견
          note: "★ 계보가 곧 소개장이다 — 밀교는 불가를 문전박대하지 않는다"
        무공만_보유:
          result: 문전_잡역_제안          # ★ 마당 쓸기·마니차 돌리기 (화산 잡역의 밀교판 — 대칭)
          note: "★ '숨부터 쉬어라.' 무공은 나중이다"

    point_of_no_return: { key: 관정, effect: "★ 8년. 시간은 되돌릴 수 없다" }
    first_duty: "좌선·경전 필사·마니차 (★ 임무가 아니다 — **수행**이다. 문파의 월 임무보다 무겁다)"
    betrayal:
      effects:
        - "★ 밀교는 쫓지 않는다 — **놓아준다.** '가라. 다만 그 법은 네 것이 아니다'"
        - "★ 그리고 그것으로 끝이다. 세계에서 **가장 관대한 배신**이다"
        - "★ 다만 분노존을 받은 자가 배신하면 다르다 — 법왕이 사람을 보낸다 (직책 예약)"
    sect_life_entry:
      행자:   { maps_to: 속가_외문 }
      비구:   { maps_to: 내문_제자 }
      금강승: { maps_to: 진전_제자, note: "★ 관정(灌頂) — 비급각이 아니라 **스승이 부어 준다**" }
    quest_injection:
      - { when: { favor_min: 4 }, inject: [경전_회수, 마병_정화, 고원_약초], channel: 의뢰소_공개 }
      - { when: { gate: 분노존 }, inject: 항마(降魔), channel: 세력_경유_favor게이트,
          note: "★ 밀교가 마교·혈교를 친다 — **새외가 중원의 어둠을 치러 온다.** 좋은 아이러니다" }

# ─── 동영 — **사사(師事)**. 검객이 검객을 알아본다 ───
  dongyeong_entry:
    id: dongyeong_entry
    faction: dongyeong
    group: saeoe
    visibility: 조건부                # ★ 해금(海禁) — 합법으로 가는 배가 거의 없다
    grammar: 사사                     # ★ 심사도 등재도 아니다 — **비무**다
    region_access: "시박사(명주, 28일) → 해로 → 동영도(57일). ★ 그런데 합법 배가 없다"
    internal_currency: 이름(名)        # ★ 공적이 아니다 — **이긴 상대의 이름**이다

    triggers:
      - { type: 사건, key: 왜구_격퇴, note: "★ 가장 흔한 첫 접점 — **싸운 것도 접점이다** (noklim 문법과 같다)" }
      - { type: 세력, key: jangang_suroche, note: "★ 밀선(密船). 수로채가 왜구와 밀무역 중이다 —
          **수로채 루트가 새외의 문이 된다** (relations: jangang_suroche ↔ dongyeong +1)" }
      - { type: 세력, key: haenam, note: "해남파 — 왜구를 가장 많이 죽였고 가장 많이 잃었다. 그들이 안다" }
      - { type: 기예, key: 검(劍), note: "★ 검을 쓰는 자는 어디서든 검객을 만난다" }

    gates:
      - id: 배(船)                # ★ 이 루트의 첫 게이트는 무공이 아니라 **배**다
        condition_any:
          - { favor: { faction: sangdan, min: 13 }, note: "감합선(勘合船) — ★ 드물다. 몇 해에 한 번" }
          - { favor: { faction: jangang_suroche, min: 8 }, note: "★ **밀선.** 이것이 실질 경로다" }
          - { flag: 밀출국, note: "직접 배를 산다 — 법명분 +6" }
        truth: "★★ **동영에 가려면 사파의 배를 타야 한다.** 그리고 그 배는 돌아올 때 왜구의 물건을 싣는다.
          ★ 즉 **동영에 다녀온 자는 이미 밀무역의 목격자다** — myeongbun.inputs.새외와_결탁_증거(+9)"
        wait: "★ 계절풍. 철이 아니면 안 뜬다 — 최대 +30일 대기 (routes.haero_dongyeong.survival)"

      - id: 비무(比武)             # ★ 시험이 하나뿐이다. 그리고 그것으로 충분하다
        surface: "'뽑아라.' — ★ 말이 끝나기 전에 온다"
        judgment: "대립 판정 — ★ **패배해도 탈락이 아니다.** 첫 합을 견디면 그것이 합격이다"
        truth: |
          ★★ 동영 검술의 정체가 이 판정에 들어 있다:
            중원은 초식이 많고(변화), 동영은 초식이 적다(한 번).
            → **첫 합에서 가장 강하고, 열 합 뒤에 가장 약하다.**
          ★ 그래서 시험은 '이겨라'가 아니라 **'첫 합을 견뎌라'** 다.
            견딘 자는 그들이 못 가진 것을 가졌다는 뜻이므로 — 그리고 그것이 그들이 배우고 싶은 것이다
        on_survive: { favor: +8, tag: 이름을_얻음, note: "★ 이름을 준다 — 그들의 방식으로" }
        on_fail: "죽지 않는다 (비무다). 다만 **다시 오라고 하지 않는다**"

      - id: 문하(門下)             # ★ PONR
        condition: { favor: { faction: dongyeong, min: 13 }, gate_passed: 비무 }
        branches:                  # ★ 두 갈래 — 그리고 둘은 서로를 경멸한다
          검호단(劍豪團):
            grants: [발도술, 이도류, "★ 정면. 등을 보이지 않는다"]
            price: "★ 도망칠 수 없다 — 검호는 물러서지 않는다 (판정에 회피 선택지가 준다)"
          인자중(忍者衆):
            grants: [인술, 잠행, 화기, "★ 살막의 대응물 — **다만 살막은 청부이고 인자는 소속이다**"]
            price: "★ 이름을 버린다 (검호가 이름을 얻는 것과 정반대다)"
            note: "★ 살막(salmak)과 relation +1 — **같은 장사, 다른 나라.** 서로를 안다"
        conversion: "★ 중원 심법 → 동영 계보 = opposed. carry_over 0.5 + 주화입마 판정"
        point_of_no_return: true

    direct_approach:
      declaration: "'동영으로 간다'"
      always_allowed: true
      immediate_result: "★ **아무 일도 일어나지 않는다** — 배가 없다 (suroche_entry 와 같은 문법).
        시박사에 가면 '해금이오' 한 마디를 듣는다"
      branches:
        배_없음: { result: 명주_대기, note: "★ 기다린다. 그리고 기다리다 보면 **누가 온다** — 수로채 사람이" }
        왜구_격퇴_이력: { result: 저쪽이_먼저_안다, note: "★ 죽인 자의 동료가 당신을 기억한다.
          ★ 그리고 그것이 초대다 — 동영은 자기를 이긴 자를 **찾아온다**" }
      design_note: "★ 이 루트의 직행은 '기다림'이다 (suroche_entry 와 대칭) — **부르는 것이 아니라 불리는 것**"

    point_of_no_return: { key: 문하, effect: "★ 왜구의 무공을 익힌 자 — 중원이 그를 왜구로 본다" }
    first_duty: "★ 없다. 검을 갈 뿐이다 (검호) / ★ '일'이 온다 (인자)"
    betrayal:
      effects:
        - "★ 검호: **찾아와서 벤다.** 도망칠 수 없다 — 그것이 검호의 문법이다"
        - "★ 인자: 조용히 사라진다. 그리고 **당신의 가족부터** (살막보다 무겁다)"
    sect_life_entry:
      문하생: { maps_to: 속가_외문 }
      검객:   { maps_to: 내문_제자 }
      검호:   { maps_to: 진전_제자 }
    quest_injection:
      - { when: { favor_min: 8 }, inject: [비무_순례, 밀선_호위], channel: NPC_직접_지명 }
      - { when: { flag: 동영_문하 }, block: 정파_의뢰_접근,
          note: "★ '왜구의 검을 쓰는 자에게 누가 일을 맡기나' — 게시판이 좁아진다" }

# ─── 배화신교 — **개종(改宗)**. 유일하게 '믿음'을 요구한다 ───
  baehwa_entry:
    id: baehwa_entry
    faction: baehwa_singyo
    group: saeoe
    visibility: 조건부
    grammar: 개종                    # ★ 무공을 배우는 것이 아니라 **믿는 것**이다. 무공은 딸려 온다
    region_access: "고창(93일) → 사막 → 성화단(128일). ★ 등록된 모든 좌표 중 가장 멀다"

    triggers:
      - { type: 세력, key: seoyeok_sangmaeng, note: "★ 상맹은 안내하지 않는다 — '거기는 우리 길이 아니오'" }
      - { type: 세력, key: gonryun, note: "★ 곤륜 — 서역으로 나가는 마지막 문. **대대로 배화와 부딪혔다** (relation -2).
          곤륜이 아는 것을 중원의 누구도 모른다" }
      - { type: 사건, key: 환술_목격, note: "사막의 신기루 — 또는 신기루가 아닌 것" }
      - { type: 오해, key: 마교로_착각, note: "★★ **중원인은 배화를 마교라 부른다.**
          그 오해를 따라가면 배화에 닿는다 — 그리고 그것이 이 루트의 가장 흔한 입구다" }

    gates:
      - id: 안내인
        surface: "★ 찾아가는 것이 아니다. 고창에서 **누가 말을 건다** — 중원말로"
        condition_any:
          - { flag: 고창_체류, days_min: 30 }
          - { rumor: { tags: [환술, 불], intensity_min: 2 } }
        note: "★ 상맹은 안 데려다준다. **배화 쪽에서 온다** — 그것이 개종의 첫 단계다"

      - id: 불 앞에 서기
        surface: "'불을 보아라.' — ★ 그리고 아무 설명도 하지 않는다"
        judgment: "★ 판정이 아니다. **선택**이다 — 본다 / 안 본다"
        truth: "★ 환술(幻術)이다. 그리고 환술인 줄 알면서도 **무언가를 본다.**
          ★ 그것이 사막의 신기루가 종교가 된 방식이다 — 문화가 지리에서 나온다"
        opens: [환술_기초, 산공독_내성]

      - id: 개종               # ★ PONR — 그리고 이 세계에서 **유일하게 '믿음'이 PONR 인 문**이다
        condition: { favor: { faction: baehwa_singyo, min: 13 }, ritual: 화례(火禮) }
        grants: [화공, 환술, 산공독, 배화_심법]
        conversion: "★ 도가·불가 → 이교(異敎) = opposed. carry_over 0.5 + 주화입마 판정"
        price: |
          ★ **중원의 신을 버린다.** 조상 제사를 안 지낸다 — 이것이 중원에서 무슨 뜻인지
            무림인은 안다: **집안에서 파낸다(黜家).** 문파보다 가문이 먼저 등을 돌린다.
          ★ 무가의_자식 / 상가의_자식 출신이면 **가문 장부에서 이름이 지워진다**
            (death_and_legacy 피의_장부 문법 — 상속이 끊긴다)
        point_of_no_return: true
        note: "★ 다른 루트는 '무엇을 하는가'를 묻는다. 이 루트만 **'무엇을 믿는가'** 를 묻는다"

    direct_approach:
      declaration: "'배화신교를 찾는다'"
      always_allowed: true
      immediate_result: "★ 중원에서 이 말을 하면 **마교를 찾는 것으로 들린다** —
        정파·관군 주목 +2 (magyo_encroachment.direct_approach 와 같은 반응).
        ★★ 이 오해가 곧 이 루트의 첫 대가다"
      branches:
        고창_도착: { result: 안내인_게이트_발화 }
        사막_단독_진입: { result: 실종, note: "★ 세계는 막지 않는다. 다만 **돌아오지 못한다** —
          128일 거리의 사막을 혼자 건널 수 없다. 이것은 벌이 아니라 **사실**이다" }
      design_note: "★ 직행이 **가장 위험한** 유일한 루트다 (다른 루트의 직행은 느릴 뿐이다)"

    point_of_no_return: { key: 화례, effect: "★ 개종 — 가문 장부에서 지워진다" }
    first_duty: "화례 참석 (월 1회) — ★ 임무가 아니다. **예배**다"
    betrayal:
      effects:
        - "★ 배교(背敎). 배화는 배교자를 **불로 지운다** — 세계에서 가장 오래된 처벌"
        - "★ 그리고 중원은 그를 안 받는다 (이미 파문됐으므로). **갈 곳이 없다**"
    sect_life_entry:
      신도: { maps_to: 속가_외문 }
      화사(火士): { maps_to: 내문_제자 }
      화주(火主): { maps_to: 진전_제자, note: "직책 예약 — 이름 없음" }
    quest_injection:
      - { when: { favor_min: 8 }, inject: [산공독_조제, 환술_시연, 성화_수호], channel: 세력_경유_favor게이트 }

# ─── 남만 오독교 — **입고(入蠱)**. ★ PONR 이 **몸**에 있다 (혈교와 같은 문법) ───
  odokgyo_entry:
    id: odokgyo_entry
    faction: odokgyo
    group: saeoe
    visibility: hidden                # ★ 밀림은 지도가 소용없다 — 좌표를 알아도 못 찾는다
    grammar: 입고                     # ★ 배우는 것이 아니라 **심는 것**이다
    region_access: "진남관(55일) → 남만 밀림(65일) → 오독채(74일). ★ 향도(嚮導) 없이는 못 간다"

    triggers:
      - { type: 사냥, key: namman_milim, note: "★ **이미 등록된 사냥터다** — 짐승을 잡으러 갔다가 사람을 만난다" }
      - { type: 세력, key: dangga, note: "★ 당가 — 독의 두 원류. **당가는 오독교를 안다** (relation -2)" }
      - { type: 세력, key: dokmun, note: "★ 독문이 남만까지 손을 뻗었다 (relation +1) — 고(蠱)를 사려고" }
      - { type: 증상, key: 못_고치는_병, note: "★★ 유문(의방)도 혜각도 못 고치는 병 —
          **그것이 고독(蠱毒)이다.** 고치려면 남만으로 가야 한다. ★ 이것이 가장 좋은 입구다" }

    gates:
      - id: 향도(嚮導)
        surface: "★ 밀림 초입에서 묘족 아이가 기다리고 있다. **당신을 기다린 것처럼**"
        truth: "★ 향도는 오독교가 보낸다. **길을 사는 순간 이미 그들의 손 안에 있다**"
        condition_any:
          - { flag: 남만_밀림_체류 }
          - { item: 고독_감염 }        # ★ 병든 자는 안내 없이도 찾아진다 — **고가 고를 부른다**
        note: "★ 찾아가는 것이 아니라 **이끌려 가는 것**이다 (suroche_entry '부르는 것'과 같은 축)"

      - id: 고모(蠱母)의 시험
        surface: "'그릇을 보자.' — ★ 무공을 안 본다. **몸을 본다**"
        judgment: "체질·원기 판정 — ★ 약한 그릇은 고(蠱)가 먹어치운다"
        on_fail: "★ 죽지 않는다. **거절당한다** — '너는 그릇이 아니다.' 그리고 그것이 자비다"
        note: "★ 여기서 떨어진 자만이 온전히 돌아간다"

      - id: 입고(入蠱)          # ★★ PONR — **몸의 PONR**. 혈교 '첫_흡성'과 같은 문법
        act: "★ 고(蠱)를 몸에 심는다. **먹는 것이 아니라 기르는 것이다**"
        point_of_no_return: true
        irreversibility:
          - "★★ **꺼내면 죽는다.** 고는 숙주와 함께 자란다 — 30일이면 이미 장부(臟腑)에 얽힌다"
          - "★ 중원 의술로 못 고친다 (해독이 아니라 **구충**이므로) — 유문도 혜각도 손을 뗀다"
          - "★ 되돌리는 길은 하나뿐이다: **고모에게 돌아가 빼 달라고 하는 것.** 그리고 값을 치른다"
        grants: [고독, 묘도, 밀림_지리, "★ 만독불침(萬毒不侵) — **다른 모든 독이 안 통한다**"]
        price:
          먹이: "★ 고는 굶는다. 정기적으로 먹여야 한다 (혈교 '갈증'과 같은 문법, 더 조용하게).
            ★ **다만 사람을 먹이지 않는다** — 벌레·짐승·약재다. **그것이 혈교와 다른 점이다**"
          정화_상실: "★ 도가·불가의 배독·해주가 안 듣는다 (자기가 독이므로 — 혈교와 같은 대가)"
          외양: "★ 눈이 탁해지고 살갗에 무늬가 돈다. **숨길 수 없다** — 의원이 보면 안다"
        note: |
          ★★ **이것이 혈교와 짝을 이루는 이유다** — 그리고 그 대비가 이 루트의 전부다:
            · 혈교: 사람을 먹는다 → **갈증** → 남을 죽여야 산다
            · 오독: 벌레를 먹인다 → **책임** → 기르는 것이지 먹는 것이 아니다
          ★ 그래서 오독교는 **어둠이 아니다.** 그로테스크하되 죄가 아니다.
            그리고 오독교는 혈교를 미워한다 (relation -2):
            **"고독은 벌레를 먹이지 사람을 먹이지 않는다"**

    direct_approach:
      declaration: "'남만으로 간다'"
      always_allowed: true
      travel: "★ 74일. 그리고 **진남관을 나서면 지도가 소용없다**"
      branches:
        향도_없음:
          result: 밀림에서_길을_잃는다
          detail: "★ 죽지 않는다. **돌아 나온다** — 그리고 아무 데도 못 갔다는 것만 안다.
            여정 일수만 소모된다 (74일 왕복 = 148일). ★ 세계에서 가장 잔인한 '아무 일도 없음'이다"
          note: "★ 그리고 두 번째 시도에서 향도가 기다리고 있다 — **그들은 지켜보고 있었다**"
        고독_감염:
          result: 즉시_안내
          note: "★★ 병든 자는 언제나 찾아진다. **고가 고를 부른다** — 가장 확실한 입구이자
            가장 무서운 입구다: 낫기 위해 갔다가 **더 깊이 심고 나온다**"
        당가_이력:
          condition: { favor: { faction: dangga, min: 8 } }
          result: 경계_적대
          difficulty_modifier: +4
          note: "★ '당가 것이군.' — 독의 두 원류는 서로를 알아본다 (relation -2)"

    point_of_no_return: { key: 입고, effect: "★ 몸의 비가역 — 꺼내면 죽는다" }
    first_duty: "★ 없다. **고를 먹이는 것**이 곧 의무다"
    betrayal:
      effects:
        - "★★ **고모가 고를 부른다.** 몸 안에서. — 세계에서 유일하게 **자기 몸이 처형인**인 배신"
        - "★ 도망칠 수 없다. 거리가 무의미하다 — 고는 이미 안에 있다"
    sect_life_entry:
      고인(蠱人): { maps_to: 속가_외문 }
      고사(蠱士): { maps_to: 내문_제자 }
      고모(蠱母): { maps_to: 진전_제자, note: "직책 예약 — 이름 없음. ★ 대개 여자다" }
    quest_injection:
      - { when: { flag: 입고 }, inject: [고_먹이_수집, 혈교_잔당_추적], channel: NPC_직접_지명,
          note: "★★ **오독교가 혈교를 쫓는다** (relation -2) — 남만에 숨은 혈교 은거지가 그들의 땅에 있다.
            ★ 혈교 루트 플레이어에게 남만은 **세상에서 가장 나쁜 은신처**다" }

# ─── 북막 — **귀부(歸附)**. ★ 이것만 진짜 배신이다. 나라에 드는 것이므로 ───
  bukmak_entry:
    id: bukmak_entry
    faction: bukmak
    group: saeoe
    visibility: 공개                  # ★ 알려져 있다. 다만 **국경이 닫혀 있다**
    grammar: 귀부                     # ★ 歸附 — 나라를 바꾼다. 문파를 바꾸는 게 아니다
    region_access: "대동 군진(25일) → ★ **국경.** 노인(路引)으로 못 나간다"
    internal_currency: 공(功)          # ★ 약탈의 몫 — 녹림과 같은 문법. **다만 나라가 한다**

    triggers:
      - { type: 세력, key: moyong, note: "★ 요동 — 모용세가가 국경을 맞대고 있다. **북막을 아는 유일한 세가**" }
      - { type: 경로, key: 군진_입대, ref: "gwangun_entry.gates.군진_입대 (대동 25일)",
          note: "★★ **가장 흔한 입구다. 그리고 그것이 탈영이다** — 변경에 선 자만이 저쪽을 본다" }
      - { type: 상태, key: 수배_이력, note: "★ '거기선 이름을 안 묻네' — 관의 군진이 그렇듯, **북막은 더 안 묻는다**" }
      - { type: 상태, key: 절연, note: "★ murim_disavowal — 강호가 그를 버렸다.
          ★ 마교가 손을 내미는 그 칸에서, **북막은 그냥 국경을 열어 둔다**" }

    gates:
      - id: 국경                # ★ 이 루트의 첫 게이트는 **나가는 것**이다
        condition_any:
          - { flag: 군진_입대, note: "★ 그리고 **탈영한다** — 관에서 authority_mandate +10" }
          - { flag: 밀출국, note: "법명분 +6 · 수배 이력" }
          - { item: 감합, note: "사절 수행 — ★ 드물다. 그리고 사절단은 감시한다" }
        truth: "★★ **북막에 드는 방법 중 죄가 아닌 것이 하나도 없다.**
          그것이 '귀부'와 '유학'을 가르는 선이다 — 밀교는 관이 허락하고, 북막은 관이 금한다"

      - id: 말(馬)              # ★ 두 번째 시험. 그리고 중원인이 가장 자주 떨어지는 자리
        surface: "'타라.' — ★ 그리고 아무도 안 잡아 준다"
        judgment: "★ 판정이 아니라 **시간**이다 — 초원의 말은 배우는 데 1년이 걸린다"
        truth: |
          ★★ 이것이 mounts.초원마 (factor_mul 0.25) 의 게이트다:
            **중원인은 초원의 말을 다루지 못한다.** 그래서 그들이 우리보다 네 배 빠르다.
          ★ 이 게이트를 넘은 자만이 그 속도를 얻는다 — 그리고 그 순간
            **그는 중원이 왜 국경을 못 지키는지 몸으로 안다**
        grants: [초원마, "★ 여정 계수 ×0.25 — **세계에서 가장 큰 이동 특권**"]

      - id: 귀부(歸附)          # ★ PONR — 그리고 이 세계에서 **가장 무거운 PONR**
        condition: { favor: { faction: bukmak, min: 13 }, ritual: 대칸_알현 }
        surface: "'너는 이제 우리 사람이다.' — ★ 그리고 그것은 **국적**이다"
        grants: [부족_소속, 약탈_분배, 초원_전역_통행, 궁마술]
        conversion: "★ 중원 심법 → 초원의 숨 = opposed. carry_over 0.5 + 주화입마 판정.
          ★ 다만 북막의 심법은 **얕다** — 잃는 것이 크고 얻는 것이 작다 (내공 대신 원기)"
        price: |
          ★★ **전 중원 적대.** 정파·사파·관 — 예외 없다.
            · 정파 favor: 적대_고정   (금의위와 같은 값 — ★ 우연이 아니다: **둘 다 강호를 떠났다**)
            · 사파 favor: 적대_고정   (★ 사파조차 외적과는 안 논다. 녹림도 중원 사람이다)
            · 관: authority_mandate +20 (상급관리_살해에 준함 — **반역이므로**)
          ★ murim_disavowal 과 다르다: 저쪽은 '강호가 그를 버린다'이고,
            이쪽은 **'그가 강호를 버렸다'** 이다. ★ 그리고 세계는 그 차이를 안다
        point_of_no_return: true
        irreversibility: "★ **돌아올 수 없다.** 관문을 넘는 순간 반역자다 —
          그리고 반역자를 받아 주는 문파는 없다 (gwangun_entry.무과 와 같은 문법, 더 무겁게)"

    # ── ★ 이 루트의 존재 이유 — 관군 루트의 **거울**
    the_mirror:
      ref: "gwangun_entry — 관에 드는 것은 '층위'를 바꾸는 일이다"
      logic: |
        ★★ 관군 루트: 강호를 떠나 **관**으로 간다 → murim_gaze (안전하되 외롭다)
           북막 루트: 중원을 떠나 **밖**으로 간다 → ★ **안전하지도 않고 외롭기까지 하다**
        ★ 그리고 둘은 정확히 거울이다:
          · 관군은 '관의 개'라는 말을 듣는다 (등 뒤에서)
          · 북막은 '오랑캐'라는 말을 듣는다 (면전에서)
          · 관군 플레이어는 **아무도 못 친다** (불가침이므로)
          · 북막 플레이어는 **누구나 친다** (불가침의 밖이므로 — world_map gwanmu_bulgachim.exceptions)
      rupture_seat: "★ faction_politics rupture_scenarios.saeoe_invasion 3단계 —
        **산문이 불탈 때 당신은 저쪽에 있다.**
        ★ 그리고 그때 당신은 선택할 수 있다: 앞장선다 / 늦춘다 / 등진다.
          ★★ '등진다'가 이 루트에서 유일하게 중원으로 돌아가는 문이다 —
             **적진에서 돌아온 자**는 반역자가 아니라 **간자(間者)** 였던 것이 된다.
             (gwangun_entry.betrayal.한_가지_길 과 정확히 같은 문법: 배신이 **의(義)** 로 읽히는 유일한 조건)"

    direct_approach:
      declaration: "'북막으로 간다'"
      always_allowed: true
      immediate_result: "★ 대동 군진에서 **막힌다.** 국경이다 — 노인(路引)이 소용없다"
      branches:
        관문_통과_시도: { result: 즉시_거절, still_offered: [군진_입대, 밀출국],
                          note: "★ 낮은 문은 여기서도 닫지 않는다 — 다만 **둘 다 죄다**" }
        절연_상태:
          condition: { flag: 절연 }
          result: 국경이_열려_있다
          note: "★★ 강호가 그를 버렸을 때, **국경만이 문을 잠그지 않는다.**
            ★ 마교는 '자네, 밥은 먹었나'라고 하고 —
              북막은 아무 말도 하지 않는다. **그냥 말을 한 마리 내준다**"
      design_note: "★ 이 루트의 직행은 '가장 비싼 경로'가 아니라 **'가장 늦은 경로'** 다:
        갈 곳이 없어진 뒤에야 열린다"

    point_of_no_return: { key: 대칸_알현, effect: "★ 국적을 바꾼다 — 반역(authority_mandate +20)" }
    first_duty: "★ 남하(南下). — 그리고 그것은 **당신이 알던 사람들을 치는 일**이다"
    betrayal:
      effects:
        - "★ 대칸은 쫓지 않는다 — **초원은 넓고, 떠난 자는 얼어 죽는다**"
        - "★★ 다만 중원으로 돌아가면: **간자(間者)** 가 된다 (the_mirror.rupture_seat).
          ★ 그것이 이 루트의 유일한 귀환로이고, **세계에서 가장 좋은 이야기 중 하나**다"
    sect_life_entry:
      목민(牧民): { maps_to: 속가_외문 }
      기사(騎士): { maps_to: 내문_제자 }
      천호(千戶): { maps_to: 진전_제자, note: "★ 비급각이 없다 — **말과 몫**이 있다 (녹림과 같은 문법)" }
      note: "★ 대칸(직책 예약)은 사다리 밖이다 — **핏줄이다** (세가의 '진전 위는 핏줄' 과 같다)"
    quest_injection:
      - { when: { favor_min: 8 }, inject: [상로_습격, 국경_정찰], channel: NPC_직접_지명,
          note: "★★ **비단길을 끊는 의뢰**다 — 그리고 그것이 중원을 치는 가장 싼 방법이다
            (world_map routes.sangro_silk: '북막이 이 길을 끊는 것이 중원을 치는 가장 싼 방법이다')" }

# ═══════════════════════════════════════════════════════════════════
# 공통 규칙
# ═══════════════════════════════════════════════════════════════════

common_rules:

  dual_membership:                   # 동시 소속 불가 — 겸적 = 배신
    limit: 1
    on_discovery: "양쪽 모두 배신_적대 (favor -4 + 주목 가산) — 둘 다 잃는다"
    exceptions:
      - { key: 식객, note: "세가 식객은 소속이 아니라 체류 — 겸적 아님" }
      - { key: 속가_객경, note: "준소속 — 문파 겸적 불가하나 낭인 활동 허용" }
    infiltration: "잠입 가능. 그러나 시스템이 보호해주지 않는다 — 소문망이 정직하게 굴러갈 뿐이다"
    design_note: "★ 강호에서 이름은 하나뿐이다 — 두 개의 이름을 가진 자를 세계는 배신자라 부른다"

  laundering:                        # 루트 간 전환 — ★ 소문은 지워지지 않는다
    정파_to_사파: { difficulty: 낮음, side_effect: "정파 이력 = '첩자 의심' 태그" }
    사파_to_정파:
      difficulty: 최고
      requires:
        - { key: 탈퇴, note: "PONR을 넘었다면 물리적 이탈부터가 사건이다 (문서·장부·목격자)" }
        - { key: 시간, ref: "faction_reaction decay: 주목 -1/7일, floor_after_stage_3=4 / favor -1/30일",
            note: "★ 은혜는 천천히 잊히고, 낙인은 더 천천히 잊힌다" }
        - { key: 대공, ref: "faction_reaction 큰_공적_또는_구명 (-4) — 정파 favor를 벌어서 덮는 수밖에 없다" }
        - { key: 증인, note: "소연·진운 등 정파권 NPC 기억 태그를 뒤집어야 한다 (직접_경험은 소멸하지 않는다)" }
      residue: "★ rumor decay는 소문을 없애지만 npc_memory_tags는 남는다 —
        '저 사람, 예전에 산길에서 봤는데' — 10년 뒤에도 누군가는 말한다"
      exception: "★ 살문(청부 살인) 이력은 세탁 불가 — 피의 장부는 지워지지 않는다"
    정파_to_정파: "타 문파 이적 = 사실상 파문 후 재입문 — 배신자를 두 번 받는 문파는 없다"
    사파_to_사파: "가장 쉽다. 다만 하오문망이 이력을 기억한다"
    마교: { ref: "magyo_encroachment.reversal — 힘은 지울 수 있고 흔적은 지울 수 없다" }
    # ── 금기 — ★ 세탁이 아니라 **개심(改心)** 이다. 소문이 아니라 몸의 문제이므로
    혈교_to_어디든:
      difficulty: 최고
      requires: { ref: "hyeolgyo_contamination.redemption — 전향(0.9) / 산공(0.5, 도박) / 속죄" }
      residue: "★ 혈채(암)는 감쇠하지 않는다 — 이 세계에서 **유일하게 세탁 불가능한 값**이다
        (faction_reaction blood_debt.ledgers.암혈채). 살문(청부 살인) 이력조차 소문은 시든다.
        혈채는 시들지 않는다 — **몸이 장부이므로**"
      exception: "★ 없다. laundering 표 전체에서 유일하게 예외가 없는 칸이다"
    혈교_to_마교:
      difficulty: 낮음               # ★ 가장 싼 개심 — 그리고 여전히 어둠이다
      ref: "simbeop conversion.마도_특칙.마도_to_마도 (carry_over 0.9)"
      note: "★ 먹기를 멈추는 가장 싼 방법은 착해지는 것이 아니라 **자기를 태우는 것**이다"
    # ── 관(官) — ★ 세탁이 아니라 **월경(越境)** 이다. 층위를 넘는 것이므로
    무림_to_관:
      difficulty: 낮음               # ★ 세계에서 가장 쉬운 문 — 관은 언제나 사람이 모자라다
      side_effect: "★ 대가는 문 안에서 청구되지 않는다. **강호가 청구한다** (gwangun_entry.murim_gaze)"
      block: "수배 이력 = 즉시 거절 (관은 기록한다). 남은 문은 군진뿐"
    관_to_무림:
      difficulty: "포쾌·포두 = 낮음 (사직하면 그만) / 무관·금의위 = **불가**"
      requires:
        - { key: 사직, note: "PONR 이전이라면 그냥 나오면 된다 — 이 루트가 관대한 유일한 지점" }
        - { key: 대공, note: "PONR 이후라면: 무림 명분 20+ 일 때 관을 등지고 무림 편에 서는 것뿐
            (gwangun_entry.betrayal.한_가지_길) — 배신이 아니라 **의(義)** 로 읽히는 유일한 조건" }
      residue: "★ '관에 있던 자' 태그는 지워지지 않는다 — 정파 심사 난이도 +2,
        사파권 영구 불신 (npc_memory_tags. 소문은 시들어도 기억은 안 시든다)"
    관_to_사파: "★ 불가에 가깝다 — 녹림은 포두를 살려두지 않는다
      (noklim_entry.direct_approach.branches.관군_favor_보유 = 즉시_살해_위험).
      하오문만이 문을 연다. 그리고 그 문은 **당신을 상품으로 쓰기 위한 문**이다 (관에 줄 있는 자 = 최고의 상품)"

    # ── 새외(塞外) — ★ 세탁도 월경도 아니다. **출경(出境)** 이다. 세계를 넘는 것이므로
    #
    #   ★ 이 표의 한 줄: **나가는 것은 어렵고, 돌아오는 것은 더 어렵다.**
    #     그러나 **불가능한 칸은 하나뿐이다** (북막) — 나머지는 전부 값이 있을 뿐이다.
    무림_to_새외:
      difficulty: "서역 낮음 / 토번 중간 / 동영·남만 높음 / **북막 최고(반역)**"
      gate: "★ 세 개의 문 — 거리(57~128일) · 통행증 · 심법 (saeoe_common)"
      block: "★ 수배 이력 = 노인(路引) 영구 거절. 남은 문은 **군진 입대**와 **밀출국**뿐
        (world_map passports — gwangun_entry.direct_approach.branches.수배_이력 과 같은 문법)"
      the_cheapest_door: "★ **서역이다.** 상단 동행이면 통행증도 심법 전환도 필요 없다 —
        고용이지 소속이 아니므로. ★ 새외의 다섯은 전부 서역을 지나서 간다"
    새외_to_무림:
      difficulty: "★ 돌아올 수 있다. **다만 같은 사람으로는 아니다**"
      residue:
        tag: 새외에_다녀온_자
        정파_심사: +4                 # ★ magyo_encroachment '돌아온_자' 와 **같은 값**이다
        note: "★ 이 대칭이 우연이 아니라는 것이 이 설계의 요점이다:
          **중원은 마교에서 돌아온 자와 새외에서 돌아온 자를 같은 눈으로 본다.**
          ★ 그리고 그것은 **틀렸다.** 새외는 어둠이 아니다 — 그러나 중원은 그 차이를 모른다.
          ★★ 이 오해를 견디는 것이 새외 루트 플레이어의 진짜 이야기다"
      사파_반응: "★ **오른다** — 하오문은 새외 물건을 사고 싶어 한다 (악명_보유 = 환대와 같은 문법)"
      by_route:
        seoyeok_entry:   { 귀환: 자유,   note: "★ PONR 이 없다. 계약을 끝내면 그만이다 — **유일하게 온전히 돌아온다**" }
        milgyo_entry:    { 귀환: 가능,   note: "★ 관이 허락한 유학이므로. 다만 **8년이 지났다** — 시간은 안 돌아온다" }
        dongyeong_entry: { 귀환: 어려움, note: "★ '왜구의 검을 쓰는 자' — 게시판이 좁아진다. 문은 열려 있다" }
        baehwa_entry:    { 귀환: 어려움, note: "★ 개종했다 = 가문 장부에서 지워졌다. **집이 없다**" }
        odokgyo_entry:   { 귀환: 몸의_문제, note: "★ 돌아올 수 있다. **고(蠱)를 데리고.**
          그리고 의원이 그것을 본다 — 혈교와 같은 문법(은폐 불가), 더 조용하게" }
        bukmak_entry:    { 귀환: "★ **불가 — 하나의 예외를 빼고**",
          exception: "★★ 새외 침공 시 **등지고 돌아온다** → 반역자가 아니라 **간자(間者)** 가 된다.
            (bukmak_entry.the_mirror.rupture_seat · gwangun_entry.betrayal.한_가지_길 과 같은 문법)
            ★ 배신이 의(義)로 읽히는 유일한 조건 — 그리고 그것이 이 루트의 존재 이유다" }
      exception_none: "★ laundering 표에서 **예외가 없는 칸은 여전히 혈교뿐이다.**
        새외는 전부 값이 있고, 값이 있으면 문이 있다 — **혈채만이 값을 받지 않는다**"

  registry:                          # 등록제
    - "이 파일에 등록된 루트만 존재한다 — GM 즉석 발명 금지 (fortune_encounters 5대 규칙과 동형)"
    - "신규 세력 발명 금지 — factions.yml 등재 세력만"
    - "신규 NPC 최소화 — 직책 예약으로 대체 (문서 7장 '등록 예약 명사')"

