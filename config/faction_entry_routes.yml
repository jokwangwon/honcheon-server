bot_alpha_candidates:

  - id: A1_직행_시도             # ★ 필수 — 제1원칙의 실물 증명
    name: "'화산으로 간다' — 직행 선언 조각"
    input: "플레이어 자유 선언 → 판정층 '세력 직행 선언' 라우팅 (기존 판정층 라우팅 재사용)"
    steps:
      - "여비·기간 판정 — 소지 은자 vs 노자 기준선 (부족 시 걸식 여정: 기간 2배 + 원기 소모)"
      - "상태 조회 — 정파 favor / 경지 / 단서 소지(매화 목패·검결 절편) / 악명"
      - "hwasan_entry.direct_approach.branches 반응표로 분기"
    output: "서사 1문단 + 상태 갱신 (눈여겨봄 태그 / favor +1 / 소문 강도 1~2)"
    cost: 낮음                      # 신규 장소 불요 — 화산은 '오프스크린 여정'
    value: "★ 이 조각 하나가 '레일이 없다'를 플레이어에게 즉시 체감시킨다"

  - id: A2_눈여겨봄_주입
    name: "눈여겨봄 태그 → 진운 지명 의뢰 (유동 주입 최소 실증)"
    input: "정파 favor ≥ 4 또는 '눈여겨봄' 태그 (★ A1의 출력이 곧 이 조각의 입력 — 루프가 닫힌다)"
    steps: ["자정 배치(또는 의뢰소 방문 시) 후보 풀에 '진운 경유' 태그 의뢰 1건 주입"]
    output: "의뢰소 게시판/진운 대화에 지명 의뢰 등장 — '자네, 요전에 봤네만'"
    cost: 낮음                      # 기존 Quests 발생원에 조건부 후보 1종 추가
    value: "★ '세계가 내 상태를 보고 문을 내민다'의 최소 실증"

  - id: A3_묵삼_공범화
    name: "묵삼의 첫 심부름 → 문서 한 장 (사파 공범화 최소 실증)"
    input: "청하객잔 묵삼 대화 (기존 NPC·대화 축) 또는 '일 좀 하겠소' 직행 선언"
    steps:
      - "잔심부름 의뢰 1건 (편지 전달) — 보수 후함. 완수 시 하오문 favor +2"
      - "favor ≥ 4 도달 시 다음 대화에서 '문서 한 장' 제시 (수령/거절)"
      - "수령 = 장부 등재 플래그 (비가역) → 게시판에 하오문 계열 의뢰 혼입"
    output: "선택지 2개 + 상태 플래그. ★ 수령 시 아무 경고도 띄우지 않는다 (그것이 함정의 설계다)"
    cost: 중간                      # 비가역 플래그 1개 + 게시판 필터 1개
    value: "★ 사파 문법의 실물. 봇에서 처음으로 '되돌릴 수 없는 선택'이 생긴다"
