  # ═══════════════════════════════════════════════════════════════════════════
  # 마을 가축(家畜) — 무협 마을에 닭 한 마리 없으면 그것도 이상하다
  #
  #   자연 스폰이 **0** 이 된 뒤(world_purity.yml wild_spawn.allow: []) 가축은
  #   **아무도 놓지 않으면 세계에 0마리**다. 마당에 닭이 없고 외양간에 소가 없다.
  #   그래서 등록한다 — 야생이 아니라 **마을의 살림**으로.
  #
  #   심는 곳: hunting_grounds.yml `livestock` (마을 가축 정원)
  #            → HuntingGrounds.repopulateLivestock() 이 청하현 안에 정원만큼 놓는다.
  #   ★ 이들은 **사냥감이 아니다.** 전의도 없고(가축은 스윕에서 빠진다) 먼저 치지도 않는다.
