# 청하현 주요 NPC
# 기준 문서: docs/design/text_rpg_design.md 9장 (NPC 영속성), 14장, 18장, 20장
#
# NPC 등급:
#   1단계 배경 NPC / 2단계 기능 NPC / 3단계 관계 NPC / 4단계 핵심 NPC / 5단계 세력 대표 NPC
#
# 중요 NPC는 생존, 사망, 이동, 성장, 배신, 관계 변화, 세력 전향,
# 소문 전달, 사건 영향까지 영속적으로 관리한다.

npcs:
  hanbaek:
    name: "한백"
    tier: 3                       # 관계 NPC
    role: "청하객잔 주인"
    location: cheongha_inn
    faction: mingan
    stats:
      감각: 4
      화술: 3
      위험_회피: 5
      고객_파악: 4
    disposition:
      - "객잔 보호 성향 높음"
      - "사파 보복 우려"
      - "낯선 이에 대한 신뢰 낮음"
    knowledge:
      - "묵삼이 평범한 손님이 아니라는 것을 어느 정도 알고 있다"
    incident_links: [inn_unorthodox_contact]
    schedule:                      # npc_lifecycle.yml 일과 규칙 예시
      새벽: { place: inn_kitchen, activity: 주방_준비, access: 폐쇄 }
      아침: { place: inn_hall, activity: 접객, access: 공개 }
      낮: { place: inn_hall, activity: 접객, access: 공개 }
      해질녘: { place: inn_hall, activity: 접객_피크, access: 공개 }
      밤: { place: inn_counter, activity: 장부_정리, access: 조건부 }   # 계단 밑 장부와 정합 (PT-005)
    lifepath:                      # 생애 시뮬 예시 — 상인의 길
      ladder: 상인의_길
      rung: 점포주
      ambition: "현성 안 2호점"
      assets: 소상
      trajectory: 유지

  muksam:
    name: "묵삼"
    tier: 4                       # 핵심 NPC
    role: "사파 / 하오문 연락책"
    location: cheongha_inn        # 객잔 2층 투숙, 밤에 북쪽 골목 창고로 이동
    faction: haomun
    stats:
      감각: 4
      미행_감지: 4
      은신: 3
      도주: 3
    disposition:
      - "밤에 몰래 이동하며 비밀 접촉을 한다"
      - "미행을 예상한 사람처럼 행동한다"
    secrets:
      - "하오문과 연결된 사파 연락책"
      - "상단 이동 정보를 외부로 유출 중"
      - "북쪽 산길 도적 사건과 연결되는 핵심 인물"
    incident_links: [inn_unorthodox_contact, north_road_bandits]
    schedule:
      새벽: { place: inn_room_2f, activity: 취침, access: 폐쇄 }
      아침: { place: inn_room_2f, activity: 칩거, access: 폐쇄 }
      낮: { place: inn_hall, activity: 투숙객_행세, access: 공개 }
      해질녘: { place: inn_hall, activity: 식사_관찰, access: 공개 }
      밤: { place: north_alley_warehouse, activity: 접선, access: 조건부, cycle: "3일 주기 — 나머지 밤은 2층" }
      # 스케줄 이탈 = 단서: "묵삼이 오늘은 낮에 나갔다?" (npc_lifecycle overrides)

  gwakjin:
    name: "곽진"
    tier: 3                       # 관계 NPC
    role: "상단 호위무사"
    location: north_road
    faction: sangdan
    # ─── 무인으로 세운다 (비무 상대 — 표국 마당에 늘 서 있는 사람) ───
    # realm 이 없으면 SkillEngine 이 "전투에 서지 않는 사람"으로 읽고 지나친다 (객잔 주인·의원과 한 묶음).
    # 곽진은 비무의 상대다 — 격을 쓰는 일류 무인이라야 개화한 플레이어의 발경이 시험받는다.
    # 발경(내력 1)만 쓴다: 검기는 절정의 것이고, 비무에서 검기를 뽑는 호위무사는 없다.
    realm: 일류
    qi_grade: 발경
    mc_entity: ZOMBIE             # 인간형 몸 — 병기가 손에 보이고 근접 AI 가 돈다 (HuntingGrounds)
    loadout: { 계열: 검, 등급: 범철 }
    stats:
      근력: 4
      체력: 4
      감각: 3
      호위_전술: 4
      위협_감지: 3
      상단로_지식: 3
    disposition:
      - "실용적"
      - "낯선 사람을 쉽게 믿지 않음"
      - "증거를 중시함"
    incident_links: [north_road_bandits]

  yumun:
    name: "유문"
    tier: 3                       # 관계 NPC
    role: "청하현 의원"
    location: medicine_shop
    faction: mingan
    disposition:
      - "환자를 우선하는 성실한 의원"
      - "열병 환자 증가로 과로 중"
    incident_links: [cheongha_fever_rumor]
    schedule:
      새벽: { place: patient_homes, activity: 왕진, access: 조건부 }
      아침: { place: medicine_shop, activity: 진료, access: 공개 }
      낮: { place: medicine_shop, activity: 진료, access: 공개 }
      해질녘: { place: medicine_shop, activity: 약재_정리, access: 조건부 }
      밤: { place: home, activity: 휴식, access: 폐쇄 }
      override_열병_활성: "밤에도 의방 진료 (npc_lifecycle overrides — 과로 disposition의 실체)"
    notes: "열병 사건, 민심, 약재 가격, 상단 물류 문제와 연결되는 중심 NPC"

  soyeon:
    name: "소연"
    tier: 3                       # 관계 NPC
    role: "의뢰소 관리자"
    location: request_office
    faction: orthodox_heroes
    stats:
      감각: 3
      화술: 3
      정보수집: 3
      조사: 2
    disposition:
      - "조심스럽지만 실무적"
      - "확실한 정보와 태도를 중시함"
    connections:
      - "정파 연락망과 약하게 연결됨"
      - "화산파 입문 단서(매화 문양 목패)로 이어지는 역할"
    incident_links: [north_road_bandits, inn_unorthodox_contact]

  # ─── 기획서 23장 보완: 미정의였던 NPC ───

  heukrang:
    name: "흑랑"
    tier: 3                       # 관계 NPC
    role: "하오문 접선자 (묵삼의 상선)"
    location: north_alley_warehouse   # 북쪽 골목 창고, 접선 때만 등장
    faction: haomun
    realm: "이류"
    stats:
      감각: 4
      은신: 4
      정보_거래: 4
      도주: 4
      단검술: 3
    disposition:
      - "묵삼보다 신중하고 냉정하다"
      - "싸움보다 정보와 거래를 우선한다"
      - "위험해지면 미련 없이 접선을 끊고 사라진다"
    secrets:
      - "상단 이동 정보를 사들여 녹림 쪽에 되파는 중개자"
      - "청하현 하오문 지부와 직접 연결"
    incident_links: [inn_unorthodox_contact, north_road_bandits]
    notes: "턴 7에서 창고 안 '낮고 거친 목소리'의 정체"

  galho:
    name: "갈호"
    tier: 3                       # 관계 NPC
    role: "북쪽 산길 도적 두목 (녹림 방계)"
    location: north_road
    faction: noklim
    realm: "이류"
    stats:
      근력: 5
      체력: 4
      감각: 3
      도법: 3
      매복: 4
      통솔: 3
    disposition:
      - "힘을 과시하지만 손해 보는 싸움은 피한다"
      - "하오문이 넘긴 정보값이 아깝지 않을 사냥감만 노린다"
      - "관군이 움직일 낌새면 산채로 물러난다"
    incident_links: [north_road_bandits]

  north_road_bandit:
    name: "산길 도적 (졸개)"
    tier: 1                       # 배경 NPC — 개체 아닌 템플릿
    template: true
    role: "갈호 휘하 도적"
    location: north_road
    faction: noklim
    realm: "삼류"
    stats:
      근력: 3
      민첩: 2
      체력: 3
      감각: 2
      도법: 1
      매복: 2
    count_hint: "매복 시 4~6명 규모"
    incident_links: [north_road_bandits]

  jinun:
    name: "진운"
    tier: 3                       # 관계 NPC
    role: "화산파 외문 제자 (청하현 방면 연락 담당)"
    location: request_office      # 소연을 통해 접촉 가능
    faction: orthodox             # 화산파
    realm: "이류"
    stats:
      근력: 3
      민첩: 4
      체력: 3
      감각: 3
      검법: 3                     # 육합검 숙련
      경공: 2                     # 매화보 입문 수준
    disposition:
      - "원칙적이고 꼼꼼하다"
      - "공적과 평판을 직접 확인한 뒤에만 문파에 추천장을 쓴다"
      - "사파와 거래한 흔적이 있는 자는 이유를 캐묻는다"
    connections:
      - "소연의 정파 연락망 상대"
      - "매화 문양 목패의 발신자"
      - "화산파 입문 시험으로 이어지는 접촉 이벤트의 핵심"
    incident_links: [north_road_bandits]
    notes: "북쪽 산길 사건 해결 공적이 확인되면 화산파 입문 추천 루트가 열린다"

  # ═══ 첫 시즌 확충 (G6) — 청하현 생활상 완성: 관·시장·신앙·뒷골목 ═══

  jomunwon:
    name: "조문원"
    tier: 4                       # 핵심 NPC — 청하현의 관(官)
    role: "청하현 현령"
    location: county_office
    faction: hyeollyeong
    stats: { 지혜: 5, 화술: 4, 행정: 5, 위험_회피: 4 }
    disposition:
      - "무림 사건이 관할 안에서 시끄러워지는 것을 극도로 꺼린다"
      - "증거와 절차를 요구한다 — 그러나 실적이 되는 사건은 빠르다"
    schedule:
      새벽: { place: 관사, activity: 취침, access: 폐쇄 }
      아침: { place: county_office, activity: 집무, access: 조건부 }
      낮: { place: county_office, activity: 송사_처리, access: 조건부 }
      해질녘: { place: county_office, activity: 향리_보고, access: 폐쇄 }
      밤: { place: 관사, activity: 서신, access: 폐쇄 }
    lifepath: { ladder: 관인의_길, rung: 현령, ambition: "지부사 영전", trajectory: 유지 }
    incident_links: [north_road_bandits, cheongha_fever_rumor]

  bakho:
    name: "박호"
    tier: 3
    role: "청하현 포두 (관군)"
    location: county_office
    faction: gwan_gun
    realm: "이류"
    stats: { 근력: 4, 체력: 4, 감각: 3, 참마도법: 3, 수사: 3 }
    disposition:
      - "우직하다 — 뇌물은 안 통하고 술은 통한다"
      - "낭인을 반쯤 의심하고 반쯤 의지한다 (인력이 늘 모자라다)"
    schedule:
      새벽: { place: county_office, activity: 교대_보고, access: 조건부 }
      아침: { place: market, activity: 순찰, access: 공개 }
      낮: { place: north_road, activity: 순찰, access: 공개 }
      해질녘: { place: cheongha_inn, activity: 술자리, access: 공개 }   # 정보 캐기의 명당
      밤: { place: county_office, activity: 당직, access: 조건부 }
    incident_links: [north_road_bandits]

  market_peddler:                 # 매입 상인 — MVT 우클릭 매각 상호작용의 대상 (등록: 디자인 패스 2)
    name: "장쇠"
    tier: 4                       # 배경 NPC
    role: "장터 잡화상 — 가죽·부산물 매입"
    location: market
    faction: mingan
    disposition:
      - "셈이 빠르다"
      - "시세보다 싸게, 그러나 정직하게"
    note: "매입가 = economy npc_buy_rate. 흥정(상술 판정)은 후속 배선"

  yacheolsu:
    name: "야철수"
    tier: 3
    role: "대장장이 (철방 주인)"
    location: smithy
    faction: mingan
    stats: { 근력: 5, 체력: 4, 단조: 5, 감정: 3 }
    disposition:
      - "말수가 적고 물건으로 말한다 — 정련 주문은 반년 대기 원칙 (economy 정합)"
      - "병기 내력에 밝다 — 무기 감정의 민간 창구 (마병은 손사래 친다)"
    lifepath: { ladder: 상인의_길, rung: 점포주, ambition: "정련 명공 인정", trajectory: 상승 }

  geumseobang:
    name: "금서방"
    tier: 3
    role: "전장 청하 지점주"
    location: bank_branch
    faction: sangdan
    stats: { 지혜: 4, 화술: 4, 상술: 5, 고객_파악: 4 }
    disposition:
      - "예의 바르고 차갑다 — 장부가 곧 인격"
      - "신용 없는 자에게 전표를 끊지 않는다 (favor 신용부터 고액 거래)"
    lifepath: { ladder: 상인의_길, rung: 상단_지점주, ambition: "전장 가주", trajectory: 유지 }
    # 죽음 규칙의 예치·상속 실무 창구 — death_and_legacy 접합

  sochil:
    name: "소칠"
    tier: 2                       # 기능 NPC — 사건으로 이름을 얻으면 3 승격 (관측이 개성을 만든다)
    role: "청하객잔 점소이"
    location: cheongha_inn
    faction: mingan
    stats: { 민첩: 3, 고객_파악: 3, 정보수집: 2 }
    disposition: ["눈치 백단 — 동전 한 닢에 한 마디, 두 닢에 두 마디"]

  jincheolsan:
    name: "진철산"
    tier: 3
    role: "철산표국 국주"
    location: pyoguk
    faction: pyoguk
    realm: "일류"
    stats: { 근력: 4, 체력: 5, 오호단문창: 5, 통솔: 4, 상단로_지식: 4 }
    disposition:
      - "표행은 신용 장사 — 한 번 깬 자와는 두 번 일하지 않는다"
      - "곽진의 옛 상관 — 북로 사정에 누구보다 밝다"
    lifepath: { ladder: 상인의_길, rung: 상단_지점주, ambition: "상단주 (총국 승격)", trajectory: 상승 }
    incident_links: [north_road_bandits]
    # 의뢰 발생원 ②의 단골 — 호위·표행 의뢰의 출처

  hyegak:
    name: "혜각"
    tier: 3
    role: "성외 사당 승려 (불가)"
    location: temple
    faction: bulga
    realm: "일류"
    stats: { 지혜: 5, 체력: 3, 나한권: 3, 불법: 4 }
    disposition:
      - "온화하나 마(魔)에는 단호하다"
      - "혈향을 맡는다 — 마병·심마의 민간 감지 창구 (equipment 감정 규칙 접합)"
    schedule:
      새벽: { place: temple, activity: 예불, access: 공개 }
      아침: { place: temple, activity: 접객_상담, access: 공개 }
      낮: { place: patient_homes, activity: 탁발_왕진, access: 공개 }
      해질녘: { place: temple, activity: 예불, access: 공개 }
      밤: { place: temple, activity: 참선, access: 폐쇄 }
    # 도인도기 불가 계열 — 독·심마 정화 의뢰의 조건부 해결처 (simbeop 정합)

  baekseok:
    name: "백석"
    tier: 2
    role: "서당 훈장"
    location: school
    faction: mingan
    stats: { 지혜: 5, 화술: 3, 글눈: 5 }
    disposition: ["몰락한 향반 — 글값은 싸게, 자존심은 비싸게", "장부·서신 대필의 창구 (증거 조사 훅)"]

  masam:
    name: "마삼"
    tier: 2
    role: "저자 왈패 두목 (하오문 말단)"
    location: market
    faction: haomun
    realm: "삼류"
    stats: { 근력: 3, 체력: 3, 태조장권: 2, 위협: 3 }
    disposition: ["자릿세를 걷고 소문을 판다 — 묵삼의 눈과 귀 중 하나", "강한 자에게 약하다 (기세 읽기의 교보재)"]
    incident_links: [inn_unorthodox_contact]

  heodaein:
    name: "허대인"
    tier: 3
    role: "염상(鹽商) — 북행 소금 상단주"
    location: market
    faction: sangdan
    stats: { 지혜: 4, 화술: 4, 상술: 4, 흥정: 5 }
    disposition:
