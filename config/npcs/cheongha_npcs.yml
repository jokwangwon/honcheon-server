  #     그 파일은 내 소유가 아니다 — 소유자가 한 줄 넣어야 등록부가 일관된다:
  #         가축: { examples: [닭, 소, 양, 돼지], rank: 범인_상당, policy: "사냥감 아님 — 마을 살림" }
