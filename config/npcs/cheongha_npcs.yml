  # 약: 개체 스탯을 등록한다. 공통 규칙은 npc_combat.yml beasts.
  #     내구 = round(10 + 체력×2) — 사람과 같은 공식 (대칭 원칙).
  #     짐승은 무공이 없다 → 무공 위력 0 (technique_power 입문). 위력은 이빨·발톱 = 무기 위력에서 온다.
  #     짐승은 무기가 없다 → weapon_break 대상 아님. 내력이 없다 (영물 제외) → 격 위력 0.
  # 표준 TTK 검산 (combat.yml damage 개정판):
  #     삼류 무인(검 4 + 삼류급 1) vs 산늑대(내구 16) → 6합. 두 마리면 진다 — 늑대는 무리로 온다.
  #     일류 무인(발경) vs 호랑이(내구 20) → 5합. 발경 없이는 8합 — 개화가 사냥터를 바꾼다.

