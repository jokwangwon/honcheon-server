# 청하현 인구(人口) — 무명(無名)의 등록부
# 기준 문서: docs/design/populace.md
# 읽는 코드: server-mvt/src/main/java/com/honcheon/mvt/Populace.java
#
# ═══ 왜 등록하는가 ═══
# 이 저장소의 제1 규약은 등록제다 — config 가 단일 진실 원천이고, 코드는 이름을 지어내지 않는다.
# 행인도 사람이다. 이름·나이·생업·거처·성정이 없는 몸뚱이는 이 세계에 서지 못한다.
# 다만 계약 NPC(cheongha_npcs.yml)와는 층이 다르다:
#   · 퀘스트를 주지 않는다 (의뢰 발생원이 아니다)
#   · 무적이 아니다 — 죽는다. 그 죽음은 세계를 흔들지 않지만 자국은 남긴다 (아래 death 절)
#   · 개체 시뮬(생애·야망·재산)을 돌리지 않는다 (npc_lifecycle life_simulation.scope = 등급 3+)
#
# ═══ 등급(tier) 표기 주의 ═══
# cheongha_npcs.yml 의 등급표는 1=배경 / 2=기능 / 3=관계 / 4=핵심 / 5=세력_대표 다.
# 그래서 행인에게 5를 줄 수 없다 (세력 대표와 충돌한다).
# 행인은 배경(1) '아래'다 → tier: 0, 이름 '무명(無名)'.
#   npc_lifecycle.yml schedule.tier_1_2 = "구간별 스폰 프리셋 (개체 추적 없음)" — 이 층의 규칙을 그대로 쓴다.
#   등급 승격은 열려 있다: 사건으로 이름을 얻으면 0 → 3 (npc_lifecycle tier_mobility.promote).
#
# ═══ 계약 NPC 와의 구별 (TownAudit ⑨ 계약 검증을 깨지 않는 법) ═══
# TownAudit.contracts() 는 "customName != null && isInvulnerable()" 인 Villager 만 9인으로 센다.
# 행인은 invulnerable = false 다 → 검수에 잡히지 않는다. 계약은 그대로 9인.
# TradeListener 도 같은 조건(명패+무적)으로 게이트하므로 행인 우클릭은 거래 GUI 를 열지 않는다.
# 추가 표식: 모든 행인은 PDC 키 honcheon:populace 를 지닌다 (정리·인구조사의 근거).

version: 1

layer:
  tier: 0
  name: 무명
  quest_source: false            # 의뢰를 주지 않는다
  invulnerable: false            # 죽는다 — npc_death 연쇄의 입구
  life_simulation: false         # 계절 생애 시뮬 제외 (지역 통계로만)
  audit_contract: false          # TownAudit ⑨ 의 9인에 포함되지 않는다

# ─── 하루 5구간 ↔ 마인크래프트 월드 시각 ───
# 구간 이름은 config/time.yml day_segments 그대로 (새벽·아침·낮·해질녘·밤).
# from = 그 구간이 시작하는 월드 틱. 마지막(밤)은 다음 새벽까지 감긴다.
segments:
  - { name: 새벽,   from: 22000 }
  - { name: 아침,   from: 1000 }
  - { name: 낮,     from: 6000 }
  - { name: 해질녘, from: 11000 }
  - { name: 밤,     from: 13500 }

# ─── 자리(places) — 좌표가 아니라 앵커 + 오프셋 ───
# 좌표를 코드에 박지 않는다. 조성기가 세운 앵커(HoncheonMvt.anchor)에 상대 오프셋을 얹는다.
# anchor: 장터·청하객잔·의뢰소·의방·전장·표국·관아·북쪽_산길 (CheonghaBuilder 가 등록하는 8키)
# dx/dz: 앵커 기준 블록 오프셋 (+x 동, +z 남 — 마인크래프트 좌표계)
# radius: 배회 반경 (이 원을 벗어나면 코드가 자리로 되돌려 보낸다)
# 십자대로(x=중심, z=중심)와 광장 위의 점은 반드시 열린 길이다 — 자리는 되도록 그 위에 잡는다.
places:
  장터_광장:    { anchor: 장터, dx: 0,   dz: 0,   radius: 7 }
  우물가:       { anchor: 장터, dx: 3,   dz: 3,   radius: 3 }   # 조성기 우물 (곽진이 선 자리 옆)
  좌판_거리:    { anchor: 장터, dx: 8,   dz: -6,  radius: 5 }   # 붉은 차양 좌판 열 (장쇠의 등 뒤)
  남북대로_북:  { anchor: 장터, dx: 0,   dz: -35, radius: 5 }
  남북대로_남:  { anchor: 장터, dx: 0,   dz: 35,  radius: 5 }
  동서대로_동:  { anchor: 장터, dx: 35,  dz: 0,   radius: 5 }
  동서대로_서:  { anchor: 장터, dx: -35, dz: 0,   radius: 5 }
  서쪽_골목:    { anchor: 장터, dx: -35, dz: 21,  radius: 6 }   # village_tiers alley_offset 21
  동쪽_골목:    { anchor: 장터, dx: 35,  dz: -21, radius: 6 }
  북문_어귀:    { anchor: 장터, dx: 0,   dz: -50, radius: 4 }
  객잔_앞:      { anchor: 청하객잔, dx: 0, dz: 9,  radius: 4 }
  의방_앞:      { anchor: 의방,   dx: 0, dz: 8,  radius: 4 }
  의뢰소_앞:    { anchor: 의뢰소, dx: 0, dz: 8,  radius: 4 }
  전장_앞:      { anchor: 전장,   dx: 0, dz: 8,  radius: 4 }
  표국_마당:    { anchor: 표국,   dx: 0, dz: 11, radius: 5 }
  관아_앞:      { anchor: 관아,   dx: 0, dz: -12, radius: 4 }   # 삼문 쪽 (조문원이 내려다보는 방향)
  산길_어귀:    { anchor: 북쪽_산길, dx: 0, dz: 6, radius: 6 }
  남쪽_들:      { anchor: 장터, dx: 4,   dz: 70,  radius: 9 }   # 담장 밖 밭 (outside_ring 62~92)
  개울_빨래터:  { anchor: 장터, dx: -68, dz: 14,  radius: 6 }   # 담장 밖 서쪽 개울 (폐사당 -75,-75 과 반대편)

# ─── 일과 프리셋 ───
# "아침엔 장터, 낮엔 일터, 저녁엔 객잔·집" (사용자 규약). 사람마다 routine 프리셋을 하나 문다.
# 개인 편차는 person.routine_override 로 구간 하나만 덮어쓴다.
routines:
  농사:      { 새벽: 남쪽_들,    아침: 장터_광장,  낮: 남쪽_들,     해질녘: 남쪽_들,   밤: 서쪽_골목 }
  나무:      { 새벽: 서쪽_골목,  아침: 장터_광장,  낮: 산길_어귀,   해질녘: 객잔_앞,   밤: 서쪽_골목 }
  물지게:    { 새벽: 우물가,     아침: 우물가,     낮: 개울_빨래터, 해질녘: 우물가,    밤: 동쪽_골목 }
  짐꾼:      { 새벽: 북문_어귀,  아침: 장터_광장,  낮: 표국_마당,   해질녘: 객잔_앞,   밤: 동쪽_골목 }
  행상:      { 새벽: 좌판_거리,  아침: 좌판_거리,  낮: 장터_광장,   해질녘: 좌판_거리, 밤: 객잔_앞 }
  주막:      { 새벽: 객잔_앞,    아침: 장터_광장,  낮: 객잔_앞,     해질녘: 객잔_앞,   밤: 객잔_앞 }
  철방:      { 새벽: 동쪽_골목,  아침: 좌판_거리,  낮: 동서대로_동, 해질녘: 동서대로_동, 밤: 동쪽_골목 }
  글:        { 새벽: 서쪽_골목,  아침: 의뢰소_앞,  낮: 의뢰소_앞,   해질녘: 객잔_앞,   밤: 서쪽_골목 }
  아이:      { 새벽: 서쪽_골목,  아침: 장터_광장,  낮: 우물가,      해질녘: 장터_광장, 밤: 서쪽_골목 }
  노인:      { 새벽: 우물가,     아침: 장터_광장,  낮: 우물가,      해질녘: 우물가,    밤: 동쪽_골목 }
  걸식:      { 새벽: 남북대로_남, 아침: 장터_광장, 낮: 의방_앞,     해질녘: 객잔_앞,   밤: 남북대로_남 }
  관졸:      { 새벽: 관아_앞,    아침: 관아_앞,    낮: 남북대로_북, 해질녘: 관아_앞,   밤: 관아_앞 }
  마부:      { 새벽: 표국_마당,  아침: 표국_마당,  낮: 북문_어귀,   해질녘: 표국_마당, 밤: 동쪽_골목 }
  전장사환:  { 새벽: 동쪽_골목,  아침: 전장_앞,    낮: 전장_앞,     해질녘: 전장_앞,   밤: 동쪽_골목 }
  객잔부엌:  { 새벽: 객잔_앞,    아침: 장터_광장,  낮: 객잔_앞,     해질녘: 객잔_앞,   밤: 객잔_앞 }
  빨래:      { 새벽: 서쪽_골목,  아침: 우물가,     낮: 개울_빨래터, 해질녘: 우물가,    밤: 서쪽_골목 }
  의방잡일:  { 새벽: 의방_앞,    아침: 장터_광장,  낮: 의방_앞,     해질녘: 의방_앞,   밤: 서쪽_골목 }

# ─── 사건 반응 — 행인은 배경이 아니라 세계의 증거다 ───
# 소문(config/rumor.yml)이 돌면 사람들이 다니는 자리가 바뀐다.
# 코드 API: Populace.rumor("도적_소문", true) — 켜지면 avoid 의 자리는 fallback 으로 대체된다.
# 지금 배선된 것은 자리 회피뿐이다. 대사·전파는 lines 에 실어 두고 확장을 기다린다.
reactions:
  도적_소문:                       # rumor.yml subject_tags: 도적 (sangdan_net·gwan_net·mingan_market)
    origin_network: sangdan_net
    avoid: [산길_어귀, 북문_어귀]   # 나무꾼이 산길을 피한다 — 북문 밖으로 나가지 않는다
    fallback: 장터_광장
    lines:
      - "북산 어귀에 도적이 났다지 — 나무는 오늘 아니 하네."
      - "표국 사람들이 북문으로 나가는 걸 봤나? 나는 안 나가."
  열병_소문:                       # cheongha_fever_rumor — 유문의 과로
    origin_network: mingan_market
    avoid: [우물가]                 # 우물물을 의심한다
    fallback: 의방_앞
    lines:
      - "의원 나리가 사흘째 눈을 못 붙였다더군."
      - "우물물은 끓여 마시게. 애들은 특히."
  평시:
    lines:
      - "장이 서려면 아직 멀었네."
      - "객잔 술값이 또 올랐어."
      - "관아 앞은 지나지 말게 — 포두 나리 심기가 사납네."
      - "표국 수레가 북로로 떠났다는군."
      - "무인 나리도 밥은 자셔야지."

# ─── 무명의 죽음 — npc_death.yml 위에 얹는 층 ───
# npc_death.npc_types.배경 = death_weight 1 / rumor_intensity 1 / region_delta 민심 -1.
# 무명은 그 아래다: death_weight 0 (계절 이벤트 예산을 먹지 않는다). 그러나 소문은 난다.
# 소문 강도는 killer_response.variables.witness 를 그대로 쓴다 — 코드가 반경 안의 목격자를 실제로 센다.
#   witness 0 → 강도 1 ("미상의 무인"), witness 1 → 강도 1, witness 2 이상(백주 장터) → 강도 2.
# 후계·복수는 없다 (등록 관계가 없다) → npc_death.revenge.civil_debt: 민심 부채.
#   "가장 약한 자를 죽인 대가는 복수가 아니라 지역의 냉기다" — 그 냉기가 이 층의 전부다.
death:
  death_weight: 0
  base_intensity: 1
  max_intensity: 2
  witness_radius: 16              # 목격자 판정 반경 (행인·플레이어)
  witness_public_min: 2           # 이 수 이상이면 백주 목격 (강도 +1)
  region_delta: { 민심: -1 }
  revenge: civil_debt             # npc_death.revenge.civil_debt — 민심 델타를 자연 회복에서 제외
  respawn_days: 3                 # 무명은 대체된다 — 이름만 남고 사람은 온다 (등록부 재스폰 유예)
  quest_source: false             # 무명의 죽음은 의뢰를 낳지 않는다 (npc_death quest_injection 미주입)
  note: "죽여도 세계는 안 흔들린다. 다만 아무도 그를 위해 복수하지 않는다는 사실이 남는다."

# ─── 성능 예산 (config/performance.yml tick_budget.subsystem_budget_ms.npc_logic = 6ms) ───
# 중앙 티커 하나 (HuntingGrounds·SkillListener 와 같은 규약 — 개체별 태스크 생성 금지).
# 사람이 없는 곳에서는 마을도 비어 있다: 활성 반경 밖의 행인은 몸을 지운다 (등록부는 남는다).
performance:
  ticker_period_ticks: 40         # 2초 — 일과는 초 단위로 급할 것이 없다
  activate_radius: 56             # 플레이어 이 안의 자리만 몸을 세운다
  deactivate_radius: 88           # 이 밖이면 몸을 거둔다 (히스테리시스 — 경계에서 떨지 않게)
  max_active: 24                  # 동시 엔티티 상한 (등록 28인 ≥ 상한 — 전원이 동시에 서지는 않는다)
  spawns_per_tick: 2              # 한 틱에 두 사람까지만 세운다 (스폰 폭발 방지)
  moves_per_tick: 6               # 한 틱에 경로탐색 호출 6회 상한 (라운드로빈)
  wander_chance: 0.25             # 자리 안에 있을 때 어슬렁거릴 확률 (난수 허용 — 결정론은 스폰 자리·인원만)
  spawn_reason: CUSTOM            # HuntingGrounds.ALLOWED_REASONS 통과 (마을 자연 스폰 차단과 무충돌)
  ground_scan_tries: 12           # 자리 안에서 설 수 있는 땅을 찾는 시도 횟수

# ─── 인구 (28인) ───
# 청하현 = 중촌(village_tiers middle, "그럭저럭 산다"). 민가 9채 + 객잔 + 관아 + 표국의 현.
# 이름은 계약 NPC 22인과 겹치지 않는다 (한백·묵삼·곽진·유문·소연·흑랑·갈호·진운·조문원·박호·
#   장쇠·야철수·금서방·소칠·진철산·혜각·백석·마삼·허대인·냉월·취걸개·곰보영감).
# body: 몸 — VILLAGER 로 세운다 (사람 형상 + 바닐라 경로탐색). profession 은 옷차림일 뿐 거래는 없다.
people:

  # ── 농부 3 ──
  jangi:
    name: "장이"
    age: 41
    job: 농부
    home: 서쪽_골목
    routine: 농사
    disposition: "밭 걱정 말고는 할 말이 없는 사내 — 비 얘기를 세 번 한다"
    body: { profession: FARMER }
  jinmyo:
    name: "진묘"
    age: 38
    job: 농부 (장이의 처)
    home: 서쪽_골목
    routine: 농사
    disposition: "장터 셈이 남편보다 밝다 — 나물값을 두 번 묻지 않는다"
    body: { profession: FARMER }
  usam:
    name: "우삼"
    age: 55
    job: 농부
    home: 서쪽_골목
    routine: 농사
    routine_override: { 해질녘: 객잔_앞 }
    disposition: "멧돼지에 밭을 두 번 잃었다 — 무인만 보면 붙잡고 하소연한다"
    body: { profession: FARMER }

  # ── 나무꾼 2 ──
  honosam:
    name: "호노삼"
    age: 47
    job: 나무꾼
    home: 서쪽_골목
    routine: 나무
    disposition: "북산 초입까지만 간다 — 그 위는 짐승의 땅이라 믿는다"
    body: { profession: NONE }
  seomok:
    name: "서목"
    age: 29
    job: 나무꾼
    home: 서쪽_골목
    routine: 나무
    disposition: "겁이 없다 — 도적 소문에도 산에 오르려다 형에게 붙잡힌다"
    body: { profession: NONE }

  # ── 물지게꾼 2 ──
  sonpa:
    name: "손파"
    age: 34
    job: 물지게꾼
    home: 동쪽_골목
    routine: 물지게
    disposition: "하루 스무 지게 — 객잔 물독이 그의 장부다"
    body: { profession: NONE }
  imaeng:
