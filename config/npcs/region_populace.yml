# 지역 인구(地域人口) — 등록부의 척추
# 기준 문서: docs/design/region_populace.md
# 읽는 코드: server-mvt/src/main/java/com/honcheon/mvt/Populace.java (지역층)
# 지역별 인구: config/npcs/regions/<place_id>.yml   ← 사람은 거기 있다. 여기는 문법이다.
#
# ═══ 왜 이 파일이 생겼나 ═══
# 지역 원형 다섯이 섰는데(docs/design/region_archetypes.md) 사람은 청하현에만 있었다.
# 도적 없는 산채·제자 없는 문파·수문장 없는 성문·뱃사람 없는 수로채는 무대 장치다.
#
# 그러나 등록제가 그것을 막고 있었던 것이 아니다 — 등록제는 **이름을 적으라**고 했을 뿐이고,
# 아무도 적지 않았다 (docs/design/world_map.md: "녹림 소채의 채주가 등록부에 없다").
# 이제 적는다. 코드는 이 표를 읽을 뿐 이름을 지어내지 않는다.
#
# ═══ 청하현 무명층(populace.yml)과 무엇이 다른가 ═══
#   · 앵커가 다르다 — 청하현은 조성기가 세운 8키(장터·관아…)를 쓴다. 지역에는 그런 키가 없다.
#     지역의 앵커는 **부지 그 자체**다 (아래 §좌표계).
#   · 사람이 적일 수 있다 — 산채의 도적은 주민이면서 적이다 (§태세).
#   · 세력이 주인이다 — 무공·병기·경지는 세력이 정한다 (config/skills.yml faction 필드).
#   · 죽음의 연쇄가 다르다 — 무명의 죽음은 Incidents(민심·유족·의뢰)로 간다.
#     지역 사람의 죽음은 **세력 반응**으로 간다 (faction_reaction.yml 조직원_사망 +4).
#     그래서 PDC 표식도 다르다: 무명 honcheon:populace / 지역 honcheon:region_npc.
#
# ═══ HuntingGrounds 와 겹치지 않는다 (같은 도적이 두 번 서지 않게) ═══
# HuntingGrounds 는 **구역 이름이 POPULATIONS 표에 있는 구역**에만 개체를 심는다.
# 그 표에 등록된 구역은 「북쪽 산길」 하나뿐이고, 거기 서는 도적은 north_road_bandit(갈호 휘하)이다.
# 지역 인구는:
#   · 다른 구역에 선다 (「녹림 소채 (북산)」 — 20km 밖. 구역이 겹치지 않는다)
#   · 다른 id 를 쓴다 (sochae_* ≠ north_road_bandit — 등록부가 다르다: cheongha_npcs.yml vs 이 표)
#   · 다른 PDC 를 단다 (honcheon:region_npc ≠ honcheon:foe_id — HuntingGrounds 의 모든 핸들러는
#     foe_id 로 게이트한다. 지역 사람은 그 문을 통과하지 않는다)
#   · 다른 스폰 사유가 아니다 — 둘 다 CUSTOM 이다 (HuntingGrounds.ALLOWED_REASONS 통과. 무충돌)
# ★ 코드가 이 규약을 집행한다: 지역 인구는 사냥터 구역 안에 몸을 세우지 않는다 (Populace.huntZoneClash).

version: 1

layer:
  tier: 2                        # cheongha_npcs 등급표 기준 '기능 NPC' — 배경(1)보다 위, 관계(3)보다 아래
  name: 지역인구
  registry_dir: npcs/regions     # 이 디렉터리의 *.yml 이 지역 하나씩이다 (파일 이름 순 = 판독 순)
  pdc_key: region_npc            # honcheon:region_npc = 등록 id (정리·인구조사·검수의 근거)
  quest_source: false            # 아직 의뢰를 주지 않는다 (무명층의 quests 는 청하현 전용)
  invulnerable: false            # 죽는다 — 그리고 그 죽음은 세력이 센다 (faction_reaction)
  audit_contract: false          # TownAudit ⑨ 의 계약 9인과 무관 (그쪽은 청하현 앵커만 본다)

# ═══════════════════════════════════════════════════════════════════════════
# 1. 좌표계 — 지역의 앵커는 어떻게 잡는가
# ═══════════════════════════════════════════════════════════════════════════
#
# 청하현은 조성기가 앵커 8키(장터·객잔·관아…)를 등록한다. 지역에는 그런 키가 **없다** —
# 원거리 조성기(RemoteBuilder)는 Zone 하나만 남긴다. 그러면 사람을 어디에 세울 것인가?
#
# ★ 답: **부지가 곧 앵커다.** 조성 순간 지형 계층이 만든 SiteSpec 이 이미 전부 알고 있다:
#   부지 중심(cx, cz) · 지면(groundY) · 반경 · **진입 방위** · 봉우리(peakX/Z) · 물가 · 굴.
#   조성이 끝나는 자리에서 그 값을 받아 적어 둔다 (Populace.bindRegion — 배선 §참조).
#   재기동해도 남는다 (plugins/HoncheonMVT/region_anchors.yml — anchors.yml 과 같은 규약).
#
# ★ 그리고 자리는 **국소 좌표(f, l)** 로 적는다 — RemoteBuilder 의 배치 문법 그대로:
#     f = 문 쪽(밖)이 +   ·   l = 좌우
#   왜 dx/dz 가 아닌가: 원형의 배치는 **진입 방위로 통째로 회전한다** (지형이 남쪽을 벼랑으로
#   만들면 채문이 동쪽에 난다). dx/dz 로 적으면 산채가 회전할 때마다 채주가 목책 밖에 선다.
#   f/l 로 적으면 배치와 함께 돈다 — **집이 도는 대로 사람도 돈다.**
#
# origin — (f, l) 의 원점. 원형마다 축의 못이 다르다:
#   중심   : 부지 중심 (cx, cz)            — 산채·성문의 모든 것, 도관의 산문·문전
#   봉우리 : spec.peak (px, pz)            — 도관의 본전·연무장 (축은 봉우리를 지난다)
#   뗏목   : 본채 뗏목 중심 (물 위)         — 수로채 (f 는 물 쪽이 +)
#   나루   : 뭍의 나루 마당                 — 수로채의 유일한 뭍
#   석실   : 굴 안 방의 중심                — 은신처 (여기는 회전이 없다: dx/dz 를 쓴다)
#   굴입구 : 굴 아가리                      — 은신처
#
# y — 어느 높이에 서는가:
#   지표 (기본) : 그 칸의 최상단 지면 (getHighestBlockYAt)
#   갑판        : 뗏목 마루 (물 + 1)  — 수로채. 지표를 쓰면 사람이 강바닥에 선다
#   굴          : 앵커의 y 에서 ±3 안의 설 자리 — 은신처. 지표를 쓰면 사람이 **산 위에** 선다

coordinates:
  origins: [중심, 봉우리, 뗏목, 나루, 석실, 굴입구]
  y_modes: [지표, 갑판, 굴]
  local_axes: { f: "문 쪽(밖)이 +", l: "좌우" }
  anchor_file: region_anchors.yml    # plugins/HoncheonMVT/ — 조성이 쓰고 재기동이 읽는다
  note: "좌표를 코드에 박지 않는다. 조성기가 부지를 정하고, 등록부가 그 위의 자리를 정한다"

# ═══════════════════════════════════════════════════════════════════════════
# 2. 태세(stance) — 적과 주민의 경계
# ═══════════════════════════════════════════════════════════════════════════
#
# 산채의 도적은 **주민이면서 적이다.** 그것이 이 층의 가장 어려운 문제이고,
# faction_entry_routes 가 이미 답을 적어 두었다: **"산채로 걸어 올라가 받아달라고 한다"**(noklim_entry).
# 걸어 올라갈 수 있어야 한다면, 도적이 무조건 달려들면 안 된다. 무엇이 가르는가 — **favor 다.**
#
# 네 태세. 눈금은 faction_reaction.yml favor.thresholds 를 그대로 쓴다 (새 눈금 발명 금지):
#   0 낯섦 · 4 안면 · 8 신용 · 13 공신 · 19 은인
#
#   적대 — 병기를 든 자가 플레이어를 표적으로 삼는다 (살림·포로는 절대 공격하지 않는다: 도망친다)
#   경계 — 치지 않는다. 그러나 말이 차다. ("돌아가라" — 문 앞에서 막는다)
#   중립 — 말을 섞는다. 지나가도 좋다
#   우호 — 안으로 들인다. 이름을 부른다
#
# ★ 규칙은 위에서부터 첫 일치가 이긴다. 어느 것도 안 맞으면 default.
# ★ favor 의 출처는 봇의 장부다 (WorldBridge.State.favor — world_bridge.yml feedback.favor).
#   다리가 아직 스냅숏을 안 줬으면 favor 는 전부 0 이다 → 낯선 자 → 산채는 적대, 도관은 중립.
#   **그것이 정확히 옳다** (아무 이력도 없는 낭인이 산채에 걸어 들어가면 도적이 달려든다).

stance:
  levels: [적대, 경계, 중립, 우호]
  favor_bands:                    # faction_reaction.yml favor.thresholds 의 거울 (참조값 — 원본은 그쪽)
    낯섦: 0
    안면: 4
    신용: 8
    공신: 13
    은인: 19
  conditions:                     # 규칙 when 절에 쓸 수 있는 것 (이 넷뿐 — 새로 발명 금지)
    favor: "{ faction: <id>, min: n } — 그 세력에 대한 우호가 n 이상"
    favor_max: "{ faction: <id>, max: n } — 그 세력에 대한 우호가 n 이하"
    wanted: "true — 관에 쫓기는 몸 (world_bridge feedback.wanted 게이지 ≥ 문턱)"
    always: "true — 무조건 (은신처가 쓴다)"
  armed_only: true                # 병기를 든 자(combat 절이 있는 사람)만 적대할 수 있다
  unarmed_on_hostile: 도주         # 살림·포로·상인은 적대 태세에서 싸우지 않는다 — 물러선다
  note: "favor 가 태세를 정한다. 태세가 세계를 정한다. 같은 산채가 어떤 자에겐 소굴이고 어떤 자에겐 집이다"

# ═══════════════════════════════════════════════════════════════════════════
# 3. 원형별 필수 직책 — 검수의 계약 (tools/populace_audit.py 가 이 표를 읽는다)
# ═══════════════════════════════════════════════════════════════════════════
#
# RemoteBuilder.contract 가 "그 집이 그 집이려면 무엇이 있어야 하는가"를 자재로 적었다.
# 이것은 그 표의 **사람 쪽 절반**이다 — 그 집이 그 집이려면 누가 있어야 하는가.
#   채주 없는 산채는 산채가 아니다. 장문 없는 문파는 문파가 아니다.

required_roles:
  산채:   [채주, 부두목, 졸개, 망꾼, 살림]      # 인질은 필수가 아니다 (있을 때도, 없을 때도 있다)
  도관:   [장문, 장로, 진전제자, 속가제자, 잡역]  # faction_entry_routes hwasan_entry 의 사다리와 같다
  성문:   [수문장, 관졸, 검사관, 상인]           # gwangun_entry 의 통행증이 검사관을 요구한다
  수로채: [채주, 노잡이, 통행세]                 # suroche_entry 의 통행세_징수가 그 직책을 요구한다
  은신처: []                                     # ★ 비어 있다 — 필수 직책이 없다. 아래 §은신처 참조

# ★ 은신처는 왜 비어 있는가 (판단)
#   region_archetypes.md: "이 집은 **없는 것으로 자기를 말한다** — 담이 없다·불이 없다·깃발이 없다·길이 없다".
#   그 집에 **수문장을 세우면 그것은 은신처가 아니라 본거지다.** 문을 지키는 자가 곧 문패다.
#   그래서 은신처의 계약은 **부재(不在)** 다:
#     · 지상 인구 0 — 산비탈에 사람 그림자가 없다. 밤에 산을 보면 아무것도 없다
#     · 일과 없음 — 망보지 않고, 훈련하지 않고, 술판을 벌이지 않는다 (전부 흔적이다)
#     · 굴 안에만 셋 — 그리고 그들은 **어둠 속에 서 있다**. 걸어 들어온 자만 만난다
#   검수는 그래서 은신처에 대해 **"지상에 아무도 없는가"** 를 묻는다 (있으면 위반이다).
hideout_contract:
  surface_population: 0
  underground_only: true
  stance_default: 적대            # 목격자를 살려 보내지 않는다 — 그것이 은신처의 값이다
  note: "아무나 있으면 은신처가 아니다. 없음이 이 집의 계약이다"

# ═══════════════════════════════════════════════════════════════════════════
# 4. 하루 5구간 — 청하현과 같은 눈금 (config/time.yml day_segments)
# ═══════════════════════════════════════════════════════════════════════════
# ★ 눈금은 같고 **일과가 다르다.** 산채의 하루(망보기·훈련·술판)와 문파의 하루(수련·청소·강론)는
#   같은 시계 위의 다른 삶이다. 그 차이가 지역의 성격이다.
segments:
  - { name: 새벽,   from: 22000 }
  - { name: 아침,   from: 1000 }
  - { name: 낮,     from: 6000 }
  - { name: 해질녘, from: 11000 }
  - { name: 밤,     from: 13500 }

# ═══════════════════════════════════════════════════════════════════════════
# 5. 성능 예산 — 플레이어가 없는 지역의 사람은 스폰하지 않는다
# ═══════════════════════════════════════════════════════════════════════════
# config/performance.yml tick_budget.subsystem_budget_ms.npc_logic = 6ms (청하현 무명층과 나눠 쓴다).
#
# ★ 지역은 서로 20km 이상 떨어져 있다 (world_map.yml — 최단이 소채 20.7km).
#   그래서 **한 플레이어는 한 번에 한 지역에만 있다.** 지역층의 동시 엔티티는
#   사실상 max_active(지역 하나) 로 상한이 잡힌다 — 지역이 다섯이라고 다섯 배가 되지 않는다.
# ★ 티커는 **새로 만들지 않는다.** 청하현 무명층의 중앙 티커(2초) 하나를 그대로 나눠 쓴다
#   (performance.yml effects.central_ticker = 개체별 태스크 생성 금지).
performance:
  max_active_global: 20           # 지역층 전체 동시 엔티티 상한 (무명층 24 와 별도 — 합쳐도 44)
  max_active_default: 12          # 지역 하나의 기본 상한 (지역 파일이 덮어쓸 수 있다)
  activate_radius: 48             # 플레이어가 이 안에 없으면 그 자리는 비어 있다
  deactivate_radius: 76           # 히스테리시스 (경계에서 떨지 않게)
  spawns_per_tick: 2
  moves_per_tick: 6
  wander_chance: 0.2
  ground_scan_tries: 12
  region_scan_radius: 320         # 플레이어가 부지 중심에서 이 밖이면 그 지역은 **한 줄도 돌지 않는다**
  spawn_reason: CUSTOM            # HuntingGrounds.ALLOWED_REASONS 통과
  note: "사람이 안 보는 지역은 존재하지 않는다. 등록부만 남는다 — 그리고 등록부는 공짜다"

# ═══════════════════════════════════════════════════════════════════════════
# 6. 죽음 — 지역 사람의 죽음은 세력이 센다
# ═══════════════════════════════════════════════════════════════════════════
# 무명(populace.yml)의 죽음은 민심을 깎고 유족이 의뢰를 낸다 (Incidents).
# 지역 사람의 죽음은 **세력이 센다** — 조직원이 죽었기 때문이다.
#   faction_reaction.yml inputs.조직원_사망_또는_중상_확인: +4 (주목 축)
#   그리고 그 세력의 favor 는 배신_적대(-4) 로 떨어진다 (favor.inputs)
# ★ MVT 는 **사실만** 보낸다 (world_bridge.yml kind: npc_death — 이미 등록돼 있다).
#   registry=region · npc_id · npc_name · job · place(지역 id) · witnesses · night · body · cause · killer
#   파생값(주목 +4 · favor -4 · 소문 강도)은 **봇이 계산한다.** 둘이 계산하면 세계가 둘이 된다.
death:
  live_source: faction_reaction.yml:inputs
  bridge_kind: npc_death
  registry: region
  respawn_days: 5                 # 산채는 사람을 다시 모은다 (무명 3일보다 느리다 — 산은 멀다)
  boss_respawn_days: 30           # ★ 채주·장문은 다시 서지 않는다 — 후계가 선다 (지금은 30일 유예)
  note: "졸개를 죽이면 산채가 시끄러워지고, 채주를 죽이면 산채가 바뀐다"
