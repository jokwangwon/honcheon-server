# 화산파 — 도관의 인구
# 척추: config/npcs/region_populace.yml   ·   설계: docs/design/region_populace.md
# 부지: config/world_map.yml places.hwasan (pos 145400, -16600 · 험산 · tier rich · 여정 5일)
# 집:  RemoteBuilder.Archetype.도관 (산문 → 천 계단 → 문전 → 본전 → 연무장 · 매화)
#
# ★ 직책이 입문 루트와 맞아야 한다 (faction_entry_routes.hwasan_entry):
#   · direct_approach.branches.조건_전무 → **문전_잡역_제안** ("잡역은 문전에서 시작한다" — world_map)
#     → 그래서 이 등록부에는 **잡역 셋**이 있고, 그들의 자리는 **문전 마당**이다. 문 안이 아니다.
#   · gates.입문_심사.examiner = "화산파 심사 장로 (직책 예약 — 이름 없음)"
#     → **그 예약을 여기서 채운다.** 심사 장로 = 청풍자.
#   · sect_life.yml npc_ranks: [집사, 당주, 장로, 장문]  ·  player_ranks: 속가_외문→외문→내문→진전
#     → 등록 직책이 그 두 사다리를 **정확히** 덮는다 (검수 ①이 대조한다).
#   · 진운(cheongha_npcs.yml)은 **외문 제자**다 — 청하현에 나가 있다. 여기 다시 세우지 않는다.
#
# ★ 세력이 무공의 주인이다 — config/skills.yml faction: hwasan 은 일곱 수뿐이다:
#   육합검(yukhap_geom) · 매화보(maehwa_bo) · 매화검법(maehwa_geombeop) · 매화검진(maehwa_geomjin)
#   · 매화참(maehwa_cham) · 매화낙수(maehwa_naksu) · 매화점점(maehwa_jeomjeom)
#   등록되지 않은 무공은 아무도 쓰지 않는다. 사다리도 그대로다:
#   외문 = 육합검 → 내문 = 매화검법 + 매화보 → 진전 = 절기(매화참·매화낙수)

version: 1
region: hwasan
name: "화산파"
zone: "화산파"
archetype: 도관
faction: hwasan
group: orthodox                  # favor 는 그룹으로도 온다 (faction_entry_routes 는 orthodox 로 게이트한다)

performance:
  max_active: 14
  activate_radius: 52            # 계단이 길다 — 문전에서 본전이 보이려면 조금 넓게 잡는다
  deactivate_radius: 80

# ─── 태세 — 산문은 누구에게 열리는가 ───
# ★ 도관은 사람을 함부로 죽이지 않는다. 그래서 default 가 **중립**이다 (산채와 정반대).
#   문파의 무기는 칼이 아니라 **문(門)** 이다 — 축객(逐客)이 그들의 폭력이다.
#   근거: hwasan_entry.direct_approach — 조건이 전무해도 **문전 잡역**을 제안한다. 쫓아내지 않는다.
#   악명 보유자만 문전_축객_경고 (그래도 속가·객경의 낮은 문은 열어 둔다 — "낮은 문은 닫지 않는다").
stance:
  default: 중립
  rules:
    - when: { favor: { faction: magyo, min: 13 } }
      stance: 적대
      why: "마인(魔人)으로 판명된 자 — 정파의 문 앞에 설 수 없다 (faction_politics 무림침해)"
      line: "그 기(氣)는… 물러서라. 산문에서 검을 뽑게 하지 마라."
    - when: { favor: { faction: hyeolgyo, min: 13 } }
      stance: 적대
      why: "혈교 — 같다"
      line: "피 냄새가 난다. 산을 내려가라."
    - when: { favor: { faction: haomun, min: 8 } }
      stance: 경계
      why: "hwasan_entry.direct_approach.branches.악명_보유 → 문전_축객_경고 (죽이지는 않는다)"
      line: "…당신 이름은 들었다. 문전에서 멈추시오."
    - when: { favor: { faction: orthodox, min: 8 } }
      stance: 우호
      why: "hwasan_entry gates.추천 (favor 8 = 신용) — 신원이 보증된 자"
      line: "오셨습니까. 문전에 자리를 마련하겠습니다."
    - when: { favor: { faction: orthodox, min: 4 } }
      stance: 중립
      why: "hwasan_entry gates.안면 (favor 4) — 이름을 기억한다"
      line: "낯이 익습니다. 무슨 일로 오셨는지요."

# ─── 자리 ───
# 아래 켜(문전)는 **부지 중심** 기준, 위 켜(본전·연무장)는 **봉우리** 기준이다.
# 왜 원점이 둘인가: 도관의 축은 봉우리를 지난다 (RemoteBuilder.sect — "지형이 봉우리를 밀어 두었다").
# 근거 좌표: courtF = radius-14 = 50 · gateF = courtF+6 = 56 · stepTo = courtF-6 = 44
#           본전 box(봉우리 f∈[-10,2], l∈[-7,7]) · 연무장(봉우리 f∈[4,10], l∈[-8,8])
places:
  산문:        { origin: 중심,   f: 56, l: 0,   radius: 3 }   # 패방(牌坊) — 여기서부터 문파의 땅이다
  산문_밖:     { origin: 중심,   f: 60, l: 0,   radius: 3 }   # 오르는 길의 마지막 스무 칸
  문전_마당:   { origin: 중심,   f: 50, l: 0,   radius: 5 }   # ★ 잡역이 시작하는 자리
  문전_동:     { origin: 중심,   f: 50, l: -5,  radius: 3 }
  문전_서:     { origin: 중심,   f: 50, l: 5,   radius: 3 }
  계단_아래:   { origin: 중심,   f: 44, l: 0,   radius: 3 }   # 천 계단의 첫 칸
  본전:        { origin: 봉우리, f: -4, l: 0,   radius: 3 }   # 회벽·검은 기와 — 안에 향로와 시렁
  본전_앞:     { origin: 봉우리, f: 3,  l: 0,   radius: 3 }   # 문 앞 (계단이 오는 쪽)
  본전_좌:     { origin: 봉우리, f: 3,  l: -5,  radius: 2 }
  본전_우:     { origin: 봉우리, f: 3,  l: 5,   radius: 2 }
  연무장:      { origin: 봉우리, f: 7,  l: 0,   radius: 5 }   # 목인장 셋 — 오르면 먼저 이것이 보인다
  연무장_동:   { origin: 봉우리, f: 9,  l: -6,  radius: 3 }
  연무장_서:   { origin: 봉우리, f: 9,  l: 6,   radius: 3 }
  매화나무:    { origin: 봉우리, f: -6, l: 11,  radius: 3 }   # 채색은 여기뿐이다

# ─── 일과 — 문파의 하루는 **수련 · 청소 · 강론**이다 ───
# ★ 산채의 하루(망보기·훈련·술판)와 다르다:
#   도적은 밤에 마시고, 문파는 **새벽에 일어난다** (training.yml 정규 수련).
#   그리고 문파에는 **청소가 있다** — 잡역이 마당을 쓸지 않으면 그 마당은 문파의 것이 아니다.
routines:
  장문:     { 새벽: 본전,      아침: 본전,      낮: 본전_앞,    해질녘: 본전,      밤: 본전 }
  장로:     { 새벽: 연무장,    아침: 본전_앞,   낮: 연무장,     해질녘: 본전_앞,   밤: 본전 }
  심사장로: { 새벽: 본전_앞,   아침: 문전_마당, 낮: 문전_마당,  해질녘: 계단_아래, 밤: 본전 }
  당주:     { 새벽: 연무장,    아침: 연무장,    낮: 연무장_동,  해질녘: 본전_앞,   밤: 본전_좌 }
  집사:     { 새벽: 본전_좌,   아침: 본전_앞,   낮: 문전_마당,  해질녘: 본전_앞,   밤: 본전_좌 }
  진전제자: { 새벽: 연무장,    아침: 연무장,    낮: 매화나무,   해질녘: 연무장,    밤: 본전_우 }
  내문제자: { 새벽: 연무장_동, 아침: 연무장,    낮: 연무장_서,  해질녘: 연무장,    밤: 연무장 }
  외문제자: { 새벽: 계단_아래, 아침: 연무장_서, 낮: 계단_아래,  해질녘: 문전_마당, 밤: 문전_마당 }
  속가제자: { 새벽: 문전_마당, 아침: 연무장_서, 낮: 문전_동,    해질녘: 문전_마당, 밤: 문전_마당 }
  잡역:     { 새벽: 문전_마당, 아침: 산문,      낮: 문전_서,    해질녘: 문전_마당, 밤: 문전_마당 }

# ─── 사람 (16인 · 동시 상한 14) ───
people:

  # ── 장문 — 문파가 문파이려면 결정할 사람이 있어야 한다 (sect_life sect_state 장문_교체기 +3) ──
  hwasan_jangmun:
    name: "현공"
    age: 63
    job: 장문인 (玄空眞人)
    rank: 장문
    realm: 초절정
    home: 본전
    routine: 장문
