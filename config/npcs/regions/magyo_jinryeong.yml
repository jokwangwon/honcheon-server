# 마교 전초 (진령 심산) — 은신처의 인구
# 척추: config/npcs/region_populace.yml   ·   설계: docs/design/region_populace.md
# 부지: config/world_map.yml places.magyo_jinryeong (pos 33000, 86200 · 험산 · tier none · faction magyo
#       · architecture: "동굴과 석실 — **사람이 사는 흔적을 지운다**")
# 집:  RemoteBuilder.Archetype.은신처 (굴이 본체다 · 지상은 바위 틈 위장 · 굴 안에 제단과 거처)
#
# ═══════════════════════════════════════════════════════════════════════════
#  판단 — **아무나 있으면 은신처가 아니다**
# ═══════════════════════════════════════════════════════════════════════════
# 과제가 "판단하라"고 했다. 판단은 이것이다:
#
#   ★ 지상 인구는 **0**이다. 한 사람도 세우지 않는다.
#
# 왜: region_archetypes.md 가 이 원형을 **부재(不在)로** 정의했다 —
#   담이 없다 · 지상 광원이 없다 · 깃발이 없다 · 기와가 없다 · **길이 없다**.
#   "둘러싸면 거기 뭔가 있다는 뜻이다" · "길은 사람을 부른다".
#   그렇다면 **사람은 더욱 그렇다.** 문지기를 세우면 그 문지기가 곧 문패다.
#   비탈에 사람 그림자가 하나라도 있으면, 지나가는 나무꾼이 그것을 본다. 그리고 말한다.
#   그 순간 이 집은 은신처이기를 그친다 — **본거지가 된다.**
#
#   그래서 이 등록부에는 산채의 망꾼도, 도관의 잡역도, 성문의 관졸도 없다.
#   일과도 없다: 망보지 않고, 훈련하지 않고, 술판을 벌이지 않는다 — 전부 흔적이다.
#   있는 것은 **굴 안의 셋**뿐이고, 그들은 **어둠 속에 서 있다.**
#   통로 44칸에는 광원이 없다 (region_archetypes: "그 어둠을 걸어 들어오는 것이 이 집을 만나는 방식이다").
#   ★ 걸어 들어온 자만 그들을 만난다. 그리고 걸어 나가지 못한다.
#
# ═══════════════════════════════════════════════════════════════════════════
#  세력이 무공의 주인이다 — 그런데 **마교의 무공이 등록부에 없다**
# ═══════════════════════════════════════════════════════════════════════════
#   config/skills.yml 에 faction: magyo 인 무공은 **한 수도 없다** (hyeolsu_magong 은 hyeolgyo 의 것이다).
#   그래서 지어내지 않는다. 이들은 **등록된 무공 없이** 싸운다 — 그러나 손에는 마병(魔兵)이 들려 있다.
#   (Weapons.Grade.마병: "혈교 잔재 — 부러지지 않는다". RemoteBuilder 가 이 굴의 시렁에 그것을 걸어 두었다.)
#   ★ 무공이 없는 것이 약함이 아니다: 이름을 아는 무공이 없다는 것은 **출처를 못 짚는다**는 뜻이다.
#     정파는 검을 보고 문파를 안다. 이들의 것은 볼 수 없다. 그것이 마교의 첫 번째 무기다.
#   ★ 마병은 **도(刀)에만 존재한다** (Weapons.DEMONIC_SERIES = 도). 검·창의 마병은 팩에 없다.

version: 1
region: magyo_jinryeong
name: "마교 전초 (진령 심산)"
zone: "마교 전초 (진령 심산)"
archetype: 은신처
faction: magyo

performance:
  max_active: 3
  activate_radius: 24            # ★ 좁다. 굴 안에 들어서야 만난다 — 산비탈에서는 아무도 안 보인다
  deactivate_radius: 44

# ─── 태세 — 하나뿐이다 ───
# ★ 은신처의 태세는 favor 로 갈리지 않는다. **목격자를 살려 보내지 않는다** — 그것이 이 집의 값이다.
#   유일한 예외: 마교의 사람이 된 자 (favor 13 = 공신 — 이미 안쪽에 있는 자).
#   region_populace.yml hideout_contract.stance_default: 적대
stance:
  default: 적대
  rules:
    - when: { favor: { faction: magyo, min: 13 } }
      stance: 우호
      why: "이미 안쪽의 사람이다 — 굴을 아는 자만이 굴에 들어온다"
      line: "…교(敎)의 사람인가. 제단은 저 안이다."
    - when: { favor: { faction: magyo, min: 8 } }
      stance: 경계
      why: "쓸모는 인정받았으나 아직 신용은 아니다"
      line: "누가 이 굴을 일러 주었나. 그 이름을 대라."

# ─── 자리 — 전부 굴 안이다 ───
# ★ 지상에는 자리가 없다. 등록부에 자리가 없으면 코드는 사람을 세우지 않는다 — 그것이 등록제다.
# origin 석실 = CaveSpec.room (굴 안 방의 중심) · 굴입구 = CaveSpec.mouth
# y: 굴 = 앵커의 y 에서 ±3 안의 설 자리 (지표를 쓰면 사람이 산 위에 선다 — 굴은 산 아래에 있다)
places:
  제단:     { origin: 석실, dx: 0,  dz: 0,  radius: 4, y: 굴 }   # 들어서면 정면에 있다 (촛불 세 자루)
  석실_안:  { origin: 석실, dx: -3, dz: 2,  radius: 3, y: 굴 }   # 짚자리 셋 · 궤 · 경전 시렁
  통로_끝:  { origin: 석실, dx: 5,  dz: -3, radius: 3, y: 굴 }   # 방의 얕은 쪽 — 온 길을 본다

# ─── 일과 — **없다** ───
# ★ 이 지역만 일과가 하나다. 다섯 구간이 전부 같다.
#   일과란 "하루가 있다"는 뜻이고, 하루가 있으면 흔적이 생긴다.
#   이들에게는 하루가 없다. 어둠 속에서 기다리는 것이 전부다.
routines:
  기다림:  { 새벽: 제단,    아침: 제단,    낮: 제단,    해질녘: 제단,    밤: 제단 }
  석실:    { 새벽: 석실_안, 아침: 석실_안, 낮: 석실_안, 해질녘: 석실_안, 밤: 석실_안 }
  길목:    { 새벽: 통로_끝, 아침: 통로_끝, 낮: 통로_끝, 해질녘: 통로_끝, 밤: 통로_끝 }

# ─── 사람 (3인 · 전부 굴 안 · 지상 0인) ───
# ★ 이름을 적되 명패는 걸지 않는다 (nameplate: false).
#   등록제는 "이름을 적으라"고 했지 "이름을 보이라"고 하지 않았다.
#   이 셋의 이름은 **등록부에만 있다** — 세계에서는 그들을 부를 이름이 없다.
people:

  magyo_jeonchojang:
    name: "묵야"
    age: 51
    job: 전초장 (前哨長)
    rank: 전초장
    realm: 절정
    home: 제단
    routine: 기다림
    voice: 마교
    nameplate: false
    disposition: "향을 사른다. 그것 말고는 아무것도 하지 않는다.
      ★ 그는 이 굴에서 십 년을 기다렸고, 무엇을 기다리는지는 그도 모른다 — 본교가 말해 주지 않았으므로.
      기다림 자체가 임무인 사람이 가장 위험하다"
    body: { entity: ZOMBIE, durability: 30 }
    combat:
      loadout: { 계열: 도, 등급: 마병 }   # ★ 마병은 도에만 있다 (Weapons.DEMONIC_SERIES)
      skills: []                          # ★ skills.yml 에 마교 무공이 없다 — 지어내지 않는다
      qi_grade: 검기
      morale: { start: 12, break: 0 }     # 붕괴하지 않는다. 도망치지 않는다
    lines:
      적대: ["…굴을 본 자는 굴에 남는다."]
      경계: ["누가 일러 주었나."]
      중립: ["…"]
      우호: ["제단은 안쪽이다."]

  magyo_geurimja_1:
    name: "그림자"
    age: 34
    job: 마졸 (魔卒)
    rank: 마졸
    realm: 일류
    home: 석실_안
    routine: 석실
    voice: 마교
    nameplate: false
    disposition: "말을 하지 않는다. 십 년 동안 이 굴에서 나간 것은 열두 번이고, 그때마다 사람이 하나씩 줄었다"
    body: { entity: ZOMBIE, durability: 24 }
    combat:
      loadout: { 계열: 도, 등급: 마병 }
      skills: []
      qi_grade: 발경
      morale: { start: 10, break: 0 }
    lines:
      적대: ["…"]
      경계: ["…"]
      중립: ["…"]
      우호: ["…"]

  magyo_geurimja_2:
    name: "그림자"
    age: 29
    job: 마졸 (魔卒)
    rank: 마졸
    realm: 일류
    home: 통로_끝
    routine: 길목
    voice: 마교
    nameplate: false
    disposition: "온 길을 본다. 굴에는 문이 없다 — 문 대신 이 사람이 있다.
      ★ 그러나 그는 굴 **안**에 있다. 밖에 세우면 그것이 곧 문패이므로"
    body: { entity: ZOMBIE, durability: 24 }
    combat:
      loadout: { 계열: 도, 등급: 마병 }
      skills: []
      qi_grade: 발경
      morale: { start: 10, break: 0 }
    lines:
      적대: ["…"]
      경계: ["…"]
      중립: ["…"]
      우호: ["…"]

# ─── 부재의 계약 (검수가 이것을 잰다) ───
# tools/populace_audit.py 는 은신처에 대해 **"지상에 아무도 없는가"** 를 묻는다.
# 지상 자리(origin: 중심·봉우리·나루·뗏목)가 하나라도 등록되면 위반이다.
contract:
  surface_population: 0
  surface_places: 0
  daily_cycle: false
  nameplates: false
  note: "이 집은 없는 것으로 자기를 말한다. 사람도 그렇다"
