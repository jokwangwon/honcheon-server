# ─── 소문 반응 — 산채도 소문을 듣는다 ───
# 청하현 무명이 "도적 소문"에 산길을 피할 때, 산채는 **관군을 경계한다** (같은 소문의 반대편).
reactions:
  도적_소문:
    note: "우리 얘기가 산 아래까지 내려갔다 — 망을 두 배로 세운다"
    reinforce: [망루_좌, 망루_우]     # 이 자리의 사람이 늘어난다 (졸개가 망루로 간다)
    lines:
      - "산 아래가 시끄럽다지. 관이 움직일지도 모른다."
      - "채주가 당분간 상행을 쉬라 하셨다."
  치안_소문:
    note: "치안이 회복되면 토벌대가 온다"
    avoid: [채문_밖]
    fallback: 마당
    lines:
      - "관도에 관병이 늘었다더군. …좋은 소식은 아니지."
