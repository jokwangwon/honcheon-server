    home: 뗏목_동
    routine: 노잡이_갑
    voice: 뱃사람
    disposition: "장강의 여울을 스물여덟 개 안다. 그 지식이 그를 죽지 않게 했다"
    body: { entity: ZOMBIE, durability: 20 }
    combat: { loadout: { 계열: 봉, 등급: 범철 }, skills: [], morale: { start: 6, break: 3 } }
    lines:
      적대: ["삿대 들어!"]
      경계: ["배에 오르지 마시오."]
