    lines:
      적대: ["사슬 내리지 마! 붙여!"]
      경계: ["배는 여기서 멈춘다. 값부터."]
      중립: ["한 척에 은자 두 냥. 사람만이면 스무 문."]
      우호: ["사슬 내려라! 우리 사람이다!"]
  suroche_tonghaeng_2:
    name: "여삼"
    age: 33
    job: 통행세 (야번)
    rank: 통행세
    realm: 삼류
    home: 쇠사슬_관문
