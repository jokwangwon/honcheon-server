# 세계 시계 — 메인스토리 막(幕) 등록부 (기계 판독용)
# 기준 문서: docs/design/world_clock.md (B-110)
# 이야기 정본: docs/story_summary.md — 이 파일은 그 이야기를 옮겨 적을 뿐, 고치지 않는다.
#
# 원칙: 막의 결말은 정본이 정하고, 플레이어는 박자와 자기 몫을 정한다.
#       아무도 사건을 안 일으키면 세계가 스스로 이 시계로 진행한다 (모든 박에 자동 해소).
#       수치(막·유효일·박자보정)는 절대 노출 금지 — 소문·NPC·의뢰·지역 상태로만 드러난다.
#
# ─── 배선 (2026-07-15, B-110) — 이 등록부는 살아 있다 ───
# 읽는 코드: server-bot WorldClockEngine (자정 정산 advanceWorld 의 한 단계 — 막 진입·박 발화·전조),
# 승인 명령 /막개전 (human gate, MANAGE_SERVER — HoncheonBot 최상위 등록).
# ★ 단 tempo 절(박자보정 **입력**)만은 아직 미배선이다 (설계 §8 ④ — 장 엔진 P2 와 함께):
#   지금은 world_meta '박자보정:<막id>' 를 읽기만 한다 (기본 0 · ±tempo_clamp). 아무도 쓰지 않으므로
#   세계는 기본 시계로만 흐른다 — 그것만으로 "아무도 안 일으키면 스스로 진행"은 선다 (설계 §5 주의).
# ★ 문안키의 산문(문안)은 아직 등재 전이다 — 그동안 소문 내용은 키의 밑줄을 빈칸으로 편 것이다.
# 대조하는 눈: tools/world_clock_audit.py (자기 시험: tools/world_clock_audit_selftest.py)

meta:
  canon: docs/story_summary.md                 # 이야기 정본 — 수정 금지, 옮겨 적기만
  day_source: "world_meta '현재일' — 현실 1일 = 세계 1일 (자정 Asia/Seoul, advanceWorld)"
  state_keys: [세계막, 막진입일, "박자보정:<막id>"]   # 전부 world_meta 키밸류 — 스키마 변경 없음
  # 구현 장부 (설계 §8 ② 의 3종 밖 — 멱등 표식. 역시 world_meta 키밸류, 스키마 변경 없음):
  #   박발화:<막id>.<박key> = 발화 세계일 (박은 한 번만 터진다) · 전조발화:<막id> = 전조를 심은 세계일
  bookkeeping_keys: ["박발화:<막id>.<박key>", "전조발화:<막id>"]
  event_types: [막전환, 막관문]                  # events 원장 append 타입 (되돌림 불가의 감사 흔적)
  visibility: "막·유효일·박자보정은 내부 상태 — 노출 금지 (world_reaction_system 총원칙)"
  registry: "factions.yml 등재 세력 id 만. 소문 태그·장 키·명분 태그는 기존 등록부의 것만 쓴다"

clock:
  effective_day: "유효일 E = 세계일 D + 박자보정 T(현재 막)"   # 진입·박 발화 판정은 전부 E 로
  tempo_clamp: 20            # 막당 박자보정 상한 ±20일 — 이야기를 이 이상 밀거나 당길 수 없다 (정본은 흐른다)
  tempo_decay: none          # 박자보정은 감쇠하지 않는다 — 이야기의 압력은 소문이 아니다. 앞당긴 사흘은 앞당겨진 채 남는다
  tempo_dedupe: "같은 입력 키는 막당 1회 (faction_reaction 중복 가산 금지 3원칙의 재사용)"
  herald_lead_days: 3        # 막 전환 예정 유효일 3일 전부터 전조 소문 — 세계가 먼저 수군거린다 (되돌림 불가의 대가)
  beat_law: "모든 박은 time.yml deadline_events 문법 — 타이머 소진 시 플레이어 없이 진행된다 (교착 불능의 근거)"

# ═══════════════════════════════════════════════════════════════════
# ★★★전사(前史) — 막이 시작되기 **전에 이미 일어난 일** (2026-07-28 신설)
#
#   ★이것은 acts 가 아니다. **박이 안 터진다. 시계가 안 읽는다.**
#     그런데 등록부에 있어야 한다 — **제5막의 침공과 제6막의 봉인이 여기서 근거를 얻기 때문**이다.
#     (정본: docs/design/world_bible.md · config/factions.yml 마교/무당 절)
# ═══════════════════════════════════════════════════════════════════
전사:
  wired: false                               # ★배선 대상이 아니다 — 서사의 근거이지 박이 아니다
  오백년_전:
    무엇: "무당이 **혈 무구·무공서를 거두기 시작했다**"
    ★한_줄: "정파는 세상을 구한 것이 아니라, 500년 동안 조용히 막고 있었다. 그리고 아무도 몰랐다"
    귀결: "제6막의 **봉인법이 하늘에서 떨어지지 않는다** — 500년치 방법이 이미 있다"
    ★함정: "「500년마다 온다」는 **주기로 만들지 마라.** 예측 가능하면 재난이 아니다"
  이백년_전_대충돌:
    누가: "**마교가 먼저 쳤다** — 다만 마존이 결정한 게 아니라 **밑(구 교도)이 터진 것**이다"
    상대: "흩어진 정파들 (★그때 무림맹은 없었다 — 제2막 창설)"
    결말: "양쪽에 너무 많은 사망자 → **서로의 영역을 존중**하게 되었다"
    ★한_줄: "맹이 없어서 못 막았고, 못 막아서 양쪽이 다 죽었다"
    귀결:
      - "★★**가해자는 기억하고, 피해자는 잊었다** — 초대 천마는 살아 있고, 정파는 200년에 다 잊었다"
      - "★**제5막 침공이 정파에게 날벼락인 이유** — 청구서를 받는 쪽은 빚진 줄도 모른다"
      - "★제2막 무림맹 창설의 동력이 **두 겹** — 패도천 때문만이 아니라 **「그때 그 일을 다시 겪지 않으려고」**"
      - "★마교의 200년 「영역 존중」이 **평화가 아니라 속죄**가 된다"
      - "★★제5막에 2대 천마의 물음이 생긴다 — ***우리가 먼저 쳤는데 청구할 자격이 있는가***"

# ═══════════════════════════════════════════════════════════════════
# 막 등록부 — story_summary 「메인 스토리 흐름」 다섯 단계의 1:1 대응 (누락 없음)
#   entry.base_day 는 전부 ★실측 보정 대상 (경험 정본 §3 — 세션 길이는 지인 테스트 실측으로)
#   beats[].at 은 막 진입일 기준 상대 유효일. resolve 는 자동 해소(세계가 스스로 진행하는 결말)
# ═══════════════════════════════════════════════════════════════════
acts:

  # ══════════════════════════════════════════════════════════════════════
  #  ★★v2 재작성 (2026-07-26 사용자 확정 — 거대 줄기 7막)
  #  옛 5막(마교의 암류 → 혈교의 부상 → 삼파전 → 에필로그)을 **교체했다.**
  #  근거 두 문장(사용자 원문 · story_summary v2 머리에도 적었다):
  #    ① 「맹이 없는 게 당연하다」 — 각자 대립하다 **홀로는 부족함을 깨닫고** 맹이 선다.
  #       연합은 시작이 아니라 결과다. → 그래서 옛 제1장의 「정파 연합이 격퇴」가 폐기된다.
  #    ② 「혈교는 계기일 뿐이다」 — 하나만 터졌어도 났다. 원인이 아니라 **방아쇠**다.
  #       → 그래서 제0막의 갈등 원인은 혈교와 **무관한 것들**도 함께 깔린다.
  #
  #  ★안전 확인 (재작성 전 실측): world_meta 세계막=prologue · 막진입일 36 · 현재일 36 ·
  #    **박발화 키 0건** (prologue 박은 +12/+15 = 세계일 48/51 이라 아직 안 터졌다).
  #    그래서 `prologue` id 를 **그대로 보존**하고 내용만 갈았다 — WorldClockEngine:252 가
  #    등록부 밖의 막 id 를 만나면 예외를 던지므로, id 를 바꾸면 라이브 세계가 멎는다.
  # ══════════════════════════════════════════════════════════════════════

  # ── story_summary v2 「제0막 — 혼란의 서막 (무림맹 창설 전)」 ──
  #   ★id 는 prologue 를 유지한다 (라이브 상태 보존 — 위 안전 확인)
  prologue:
    name: "제0막 — 혼란의 서막"
    order: 0
    entry: { base_day: 1, gate: auto }
    # 가장 조용한 막이지만 **평화롭지는 않다**: 맹이 없어서 각자 제 앞만 본다.
    # 주인공은 청하현 튜토리얼(경험 정본 §8)과 개인 사슬(B-109)을 걷는다.
    beats:
      - key: munpa_ui_gyeongjaeng          # ★혈교와 무관한 갈등 — 「하나만 터졌어도 났다」의 근거
        at: 6
        do: { rumor: { 강도: 1, 태그: [정치, 무인], 망: inn_net, 문안키: 후계_다툼의_소문 } }
        resolve: "소문 자연 감쇠 — 남는 것은 '강호가 조용하지 않다'는 감각뿐"
      # ★★★2026-07-28 교체 — 이 자리에 있던 것은 `wijang_tero`(사파인 척하는 의문의 무리)였다.
      #   혈교가 **위장하지 않는 세력**으로 재정의되면서 「~인 척한다」의 근거가 사라졌다.
      #   → **유린의 흔적**으로 갈았다. 혈교는 숨지 않는다. 다만 아직 아무도 그것을 못 봤을 뿐이다.
      - key: bin_maeul                     # 마을 하나가 통째로 비었다 — 시신이 남지 않았다
        at: 12
        do:
          rumor: { 강도: 2, 태그: [괴사, 금기], 망: mingan_market, 문안키: 시신이_없는_마을 }
          region_delta: { region: cheongha_hyeon, 치안: -3 }
        resolve: |
          소문 감쇠 · 치안은 회복 문법대로 — 그러나 **아무도 범인을 못 잡는다** (그것이 이 박의 값).
          ★위장이 아니라 **아무도 아직 그런 것이 있는 줄 모른다**는 뜻이다.
          그래서 제6막에 혈교가 드러날 때, 이 박이 뒤늦게 이해된다.
          ★★★2026-07-28 — **범인을 못 잡는 진짜 까닭이 정해졌다**: 이것은 **조직의 습격이 아니다.**
            그 마을에서 **누군가 혈(血) 무공서를 주웠을 뿐**이다.
            > **혈교는 사람을 꾀지 않는다. 책이 사람을 고른다.**
            ★그래서 잡을 조직이 없다. 잡을 것이 **주운 사람 하나**뿐이고, 그도 이미 마을에 없다.
      - key: immun_ui_munteok              # 종결박 — 개인의 입문 문턱 (경험 정본 §8 · 옛 등재 승계)
        at: 15
        do: { chapter_open: hwasan_examination }
        resolve: "상시 개방 유지 — 개인의 입문은 각자의 때에 (세계 막은 기다리지 않고 넘어간다)"
    tempo: {}                              # 제0막은 가감 없음 — 배울 시간은 밀리지도 당겨지지도 않는다
    heralds: []                            # 첫 막 — 전조 없음
    personal_hooks: [첫_생계, 첫_소문, 문파의_문턱, 앙숙의_틈]

  # ── story_summary v2 「제1막 — 패도천 등장 (무림맹 창설 준비)」 ──
  paedocheon_deungjang:
    name: "제1막 — 패도천 등장"
    order: 1
    entry: { base_day: 24, gate: auto, requires_beat: prologue.immun_ui_munteok }
    beats:
      - key: gakja_ui_daeeung              # ★창설의 동력 — 각자 대응하고 각자 부족함을 안다
        at: 0
        do:
          rumor: { 강도: 2, 태그: [정치, 무인], 망: orthodox_net, 문안키: 각자_막아섰으나 }
          region_delta: { region: cheongha_hyeon, 민심: -2 }
        resolve: "소문 감쇠 — 그러나 '혼자서는 안 된다'는 말은 남는다 (다음 박의 씨앗)"
      - key: paedocheon_seoneon             # 정파 회합 중 패도천이 자칭하며 등장
        at: 9
        do: { rumor: { 강도: 3, 태그: [사파, 정치], 망: inn_net, 문안키: 패도천의_자칭 } }
        resolve: "소문 감쇠 — 그러나 이제 사파에 **이름이 하나** 생겼다 (돌이킬 수 없다)"
      - key: nuga_jinjja_sapa              # ★「누가 진짜 사파인가?」 — 위장 침투의 첫 단서
        at: 15
        do:
          chapter_open: vanishing_chain     # 기존 장 재사용 — 막 한정 상류: 매매선이 아니라 위장 무리
          rumor: { 강도: 2, 태그: [괴사, 사파], 망: haomun_net, 문안키: 사파가_사파를_모른다 }
        resolve: "14일 미해결 시 방치 결말 (그 장의 outcomes.방치) — 단서가 식는다"
      - key: changseol_jean                # 종결박 — 무림맹 창설 제안이 상에 오른다
        at: 20
        do: { rumor: { 강도: 3, 태그: [정치], 망: orthodox_net, 문안키: 맹을_세우자는_말 } }
        resolve: "제안은 사라지지 않는다 — 제2막의 회의가 그것을 받는다"
    tempo:
      accel:
        - { key: "chapter:vanishing_chain.방치", days: 2 }   # 단서를 놓치면 강호가 더 빨리 갈린다
        - { key: "region:치안_30_미만_7일", days: 1 }
      decel:
        - { key: "chapter:vanishing_chain.구출", days: -2 }
    heralds:
      - { rumor: { 강도: 2, 태그: [사파, 정치], 망: mingan_market, 문안키: 저잣거리의_수상한_말 } }
    personal_hooks: [정체_추적, 문파의_심부름, 회합의_말석]

  # ── story_summary v2 「제2막 — 무림맹 창설 (협력과 반목)」 ──
  murimmaeng_changseol:
    name: "제2막 — 무림맹 창설"
    order: 2
    entry:
      base_day: 52
      gate: human                          # ★세계의 구조가 바뀐다 (기구 신설) — 운영 판단이 선행한다
      requires_beat: paedocheon_deungjang.changseol_jean
      approval: { command: /막개전, permission: MANAGE_SERVER }
    beats:
      - key: seollip_hoeui                 # 설립 회의 — 정파 vs 보수 세가 · 세가 vs 문파 이권
        at: 0
        do: { rumor: { 강도: 3, 태그: [정치], 망: orthodox_net, 문안키: 맹약서를_두고 } }
        resolve: "회의는 결렬되지 않는다 (정본: 최종적으로 합의된다) — 다만 누가 무엇을 양보했는지가 남는다"
      - key: maengju_seonchul              # 맹주 선출 — 명성 or 실력 기반
        at: 8
        do: { world_event: 맹주선출 }
        resolve: "선출 해소 = 맹주 확정. ★맹주 진영이 이후 막의 분기 입력이 된다 (endings.inputs)"
      - key: maeng_changseol               # ★종결박 — 무림맹 결성 (되돌릴 수 없다)
        at: 12
        do:
          rumor: { 강도: 4, 태그: [정치, 무인], 망: orthodox_net, 문안키: 맹이_섰다 }
          region_delta: { region: cheongha_hyeon, 민심: 5, 치안: 3 }
        resolve: "결성 확정 — factions.yml murimmaeng.exists_at_alpha=false 가 여기서 참이 아니게 된다"
    tempo:
      accel:
        - { key: "registry:회합_중재_성사", days: -2 }        # ★감속이 아니라 가속의 반대 — 아래 decel 참조
      decel:
        - { key: "registry:회합_결렬", days: 3 }
    heralds:
      - { rumor: { 강도: 3, 태그: [정치], 망: orthodox_net, 문안키: 각_문파의_사자가_움직인다 }}
    personal_hooks: [회의_참가, 문파_대표_수행, 맹주_지지]

  # ── story_summary v2 「제3막 — 패도천과의 대립 (정 vs 사)」 ──
  #   ★세부 미확정 (사용자: "이건 다시 대화를 통해 자세히 설명") — 골격만 세운다.
  #     박 셋은 정본이 말한 것만 옮겼고, 값(강도·at·델타)은 전부 【제안】이다.
  paedocheon_daeripp:
    name: "제3막 — 패도천과의 대립"
    order: 3
    entry: { base_day: 76, gate: auto, requires_beat: murimmaeng_changseol.maeng_changseol }
    beats:
      - key: wiseon_ui_myeongbun           # 「정파는 위선이다」 — 패도천의 무력 반격
        at: 0
        do:
          rumor: { 강도: 3, 태그: [사파, 정치], 망: inn_net, 문안키: 위선이라는_말 }
          region_delta: { region: cheongha_hyeon, 치안: -6 }
        resolve: "충돌은 지역 델타와 조우로 산다 — 임계 효과(치안<30)가 전장을 만든다"
      # ★★★2026-07-28 교체 — 이 자리에 있던 것은 `hyeolgyo_spy_chujeok`(혈교 스파이 추적)이었다.
      #   혈교가 **조종·잠입하지 않는 세력**으로 재정의되면서 근거가 통째로 사라졌다.
      #   그 자리를 **정파 안의 썩은 뿌리**가 물려받는다 (factions.yml orthodox.썩은_뿌리 참조).
      #   ★그리고 이 교체로 이야기가 우리 것이 된다: 적은 밖에서 들어온 것이 아니라 **제 편 안**에 있다.
      - key: sseogeun_ppuri_chujeok        # ★★제3막의 실질적 주인공 — **정파 안에서 썩는 쪽**
        at: 10
        do:
          # ★★명분(myeongbun)을 **안 건다** — 이제는 미결이라서가 아니라 **그게 맞아서**다.
          #   썩는 것은 **밑의 안 보이는 곳**이고 형태는 **자릿세**다 (맹의 이름으로 저잣거리에서 뜯는다).
          #   ★그러면 이 부패는 **명분이 아니라 민심으로 드러난다** — 고발장이 아니라 **수치**가 증거다.
          #   ★(경위: 처음 target: orthodox 로 걸었다가 world_clock_audit 이 「roster 에 없다」고 막았다.
          #     orthodox 는 컨테이너다. 눈이 막아 준 덕에 더 맞는 자리를 찾았다.)
          rumor: { 강도: 3, 태그: [정치, 무인], 망: mingan_market, 문안키: 맹의_이름으로_걷는다 }
          region_delta: { region: cheongha_hyeon, 민심: -5, 경제: -4 }
        resolve: |
          ★소문과 **지역 수치**가 이 부패의 몸이다 (민심·경제는 회복 문법대로 산다).
          ★★**썩은 자들은 만들어진 게 아니라 섞여 들어왔다**: 패도천과 대치하려면 머릿수가
            필요했고, 채우다 보니 그런 자들도 들어왔다 — **맹은 이기려고 커졌고, 커지느라
            아무나 받았다.** ★**맹주는 썩지 않았다.** 위는 깨끗한데 아래가 썩는다.
          ★★**개인 노선이 셋으로 갈린다** (승패가 아니라 선택이다):
            **덮을 것인가 · 도려낼 것인가 · 이용할 것인가.**
          ★★★그리고 이건 도덕이 아니라 **기계**다 — **도려내면 맹이 약해진다**
            (그 사람들이 대치의 머릿수이므로). 그래서 선택은 **「힘이냐 명분이냐」**다.
          ★★그 **분포**가 셋을 한꺼번에 바꾼다:
            ① **제6막의 피해 규모** — 썩은 쪽이 남은 만큼 혈교 앞에서 먼저 무너진다
            ② **제4막 연대의 폭** — 덮으면 「정파는 위선이다」가 계속 참이라 사파가 손잡을 이유가 준다
            ③ **무림맹의 생존** — 못 도려내면 제4막에서 맹이 **갈라진다**
          ★★★그리고 제5막까지 닿는다: 「가난한 무인을 누른다」가 곧 **마교의 기원**이다.
            **정파가 누른 자들이 마교가 되었고, 제3막에 정파는 다시 누르기 시작한다.**
            → 못 도려내면 제5막의 침공이 **복수가 아니라 청구**가 된다.
          ★미결: 도려냄이 맹의 힘을 얼마나 깎는가 · 집계 단위·임계값 — 배선 회차
      - key: bonjin_ui_gil                 # ★종결박 — 토벌이냐 협력이냐
        at: 18
        do: { world_event: 패도천_본진 }
        resolve: |
          ★★노선은 **개인별로 갈린다** (사용자 확정 2026-07-27) — 서버가 한 방향으로 가지 않는다.
          플레이어마다 제 노선을 갖고, 세계는 그 **분포**로 반응한다:
          제4막 연대의 폭이 「협력」을 고른 자들의 **비율**로 정해진다.
          ★그래서 이 박의 해소는 승패가 아니라 **집계**다 — 이기고 지는 것이 아니라 갈라진다.
          ★미결: 집계의 단위·시점·개인 노선의 저장 자리 (world_meta? 캐릭터 축?) — 배선 회차
    tempo:
      accel:
        - { key: "registry:살상_사건", days: 1 }
      decel:
        - { key: "registry:정전_중재_성사", days: -3 }
    heralds:
      - { rumor: { 강도: 2, 태그: [사파], 망: mingan_market, 문안키: 흑도가_모인다는_말 } }
    personal_hooks: [진영_선택, 스파이_색출, 전장의_생계]

  # ── story_summary v2 「제4막 — 무림 연합 탄생 (정사 연대)」 ──
  #   ★세부 미확정 (제3막과 같은 대화에서 정한다)
  murim_yeonhap:
    name: "제4막 — 무림 연합 탄생"
    order: 4
    entry: { base_day: 100, gate: auto, requires_beat: paedocheon_daeripp.bonjin_ui_gil }
    beats:
      - key: gwageoreul_deopda             # 「공동의 적이 있다면, 과거는 덮을 수 있다」
        at: 0
        do: { rumor: { 강도: 4, 태그: [정치, 무인], 망: orthodox_net, 문안키: 손을_잡는다 } }
        resolve: "연대 성립 — 폭은 제3막 개인 노선의 **분포**가 정한다 (협력 비율이 높을수록 넓다)"
      - key: yeonhap_gitbal                # 연합 깃발 — 소속·연합 기술 공유가 열린다
        at: 6
        do: { world_event: 연합_결성 }
        resolve: |
          ★★무림연합은 **기구가 아니라 상태다** (사용자 확정 2026-07-27):
          「무림맹주와 패주가 동시적으로 협력한 상태 — 두 대표를 바탕으로 유지되는 상태」.
          그래서 factions.yml 에 새 세력 id 를 만들지 않았다 — 세력이 아니라 **두 사람의 악수**다.
          ★비대칭이 여기서 산다: 패주는 **정치로는** 안 바뀌고(무력으로만 바뀐다) 맹주는
            선출이라 바뀔 수 있다 → **정치로 흔들리는 쪽은 언제나 무림맹이다.**
          ★해소 조건 (사용자 확정): 「**서로의 이유를 알고 옛날만큼의 전쟁까진 아님**」 —
            연합이 풀려도 **옛날로 돌아가지 않는다.** 한 번 안 것은 못 잊으니까.
            → 제6막 이후에도 정·사가 완전 적대로 복귀하지 않는다 (엔딩 A~C 전부에 걸린다)
          ★★**「연합 기술 공유」 = 합격진(合擊陣)을 섞어 쓸 수 있다** (사용자 확정 2026-07-27):
            party.yml 합격진 규칙이 지금은 「**같은 진법 숙련자끼리만** — 습득(문파 비전 사사)·
            숙련·경지 게이트」다. 연합이 서면 그 규칙이 **정·사 혼성으로 풀린다.**
          ★이 답이 좋은 이유: **무공 사다리를 건드리지 않는다.** 계보·입문 게이트는 그대로 두고
            **자리(隊形)만** 나눈다 — 진법의 값이 원래 「보정 +2 가 아니라 다섯이 동시에 벤다」였으니
            (party.yml design_note) 연합의 값도 위력이 아니라 **함께 설 수 있음**이 된다.
          ★★**교환은 대칭이 아니다** (사용자 확정 2026-07-27): 합격진 5종이 전부 정파 것인데
            (매화검진·연환패왕진·팔진도·나한진·타구진 — 화산·팽가·제갈·소림·개방)
            **사파에는 합격진이 하나도 없다.** 그래서 **사파는 진(陣) 대신 「수(手)」를 준다** —
            차륜전(살막)·은형(하오문)·정보망 같은 **전술**이다.
            ★한 줄: **정파는 대형(隊形)을 주고, 사파는 방법(方法)을 준다.**
            그래서 교환이 「같은 것을 나눠 갖기」가 아니라 **서로 없는 것을 채우기**가 된다 —
            사파에 진법을 지어 붙이지 않고도 대칭이 선다 (지어내지 않았다).
          ★**외부 세력 결집 = 상단 · 표국** (사용자 확정 2026-07-27).
            둘 다 정사지간의 결 — 팔러 오고 지켜 나른다. 전쟁이 커지면 **돈이 되니** 붙는다.
            (정보상은 안 골랐다 · 의가도 안 골랐다 — 그 둘의 거취는 미결)
          ★미결: 「수」로 주는 것의 구체 목록·기제 · 혼성 진의 성원 조건 — 배선 회차
      - key: hyeolgyo_tteokbap             # ★종결박 — 혈교 암약 떡밥 (제6막의 예고)
        at: 16
        do: { rumor: { 강도: 2, 태그: [괴사, 금기], 망: haomun_net, 문안키: 아직_남은_피 } }
        resolve: "심고 멈춘다 — 제5막의 침공이 이 실을 덮는다 (그리고 제6막이 회수한다)"
    tempo: {}
    heralds:
      - { rumor: { 강도: 3, 태그: [정치], 망: inn_net, 문안키: 원수와_마주_앉는다 } }
    personal_hooks: [연대_중재, 옛_은원_청산, 연합의_사자]

  # ── story_summary v2 「제5막 — 마교 침공 (강호의 붕괴 직전)」 ──
  magyo_chimgong:
    name: "제5막 — 마교 침공"
    order: 5
    entry:
      base_day: 124
      gate: human                          # ★살상 PvP 개방과 맞물린다 (경험 정본 §2 · 옛 sampajeon 승계)
      requires_beat: murim_yeonhap.hyeolgyo_tteokbap
      approval: { command: /막개전, permission: MANAGE_SERVER }
    rules_shift:
      lethal_pvp: open                     # 이 막부터 — 이전 막은 전부 쓰러짐→의방 회수 (B-111)
    # ★★★2026-07-28 — 이 막의 주인이 정해졌다 (마교 대개편 · factions.yml magyo 참조)
    #   ① **승계는 이 막이 열리기 전에 끝나 있다** (사용자 확정): 천마 노선 플레이어가 없으면
    #      NPC 2대가 이미 앉아 있다. → **침공을 이끄는 것은 2대다** (초대 천마가 아니다).
    #   ② **왜 초대가 막지 않았나**: 「차지한다」 마존이 밀어붙였고 초대는 붙들다 못해 허락했다.
    #      ★**붙드는 것과 막는 것은 다르다** — 「다섯을 붙드는 자」의 한계가 여기서 드러난다.
    #      그리고 2대에게는 그것이 곧 시험이다: **다섯을 붙들 수 있는가.**
    #   ③ ★★**왜 비등한가**: 정파가 강해서가 아니라 **초대가 지병으로 본 실력을 못 내기 때문**이다.
    #      → **정파의 승리는 승리가 아니다.** 그 자만이 제6막에서 대가를 치른다.
    beats:
      - key: chimgong_gaesi                # 천마신교의 본격 침공 — ★2대 천마가 이끈다
        at: 0
        do:
          myeongbun: { issue: "마교_침략:magyo", target: magyo, tags: [존망, 무림침해], gauge: 13 }
          rumor: { 강도: 4, 태그: [정치, 무인], 망: orthodox_net, 문안키: 침공_개시 }
        resolve: |
          명분은 감쇠 문법대로 산다 (존망 태그는 4에서 멈춘다).
          ★마교는 **악의로 오지 않는다** (세계 주제: 절대 악은 없다). 이 막의 명분 문안은
            「세상이 우리를 **죽게 두었다**」를 실어야 한다 — 침략자에게도 이유가 있다.
          ★★★2026-07-28 — 이 막이 **무엇인지가 정해졌다: 200년 전 청구서다** (전사 절 참조).
            · **정파는 잊었고, 마교는 잊지 않았다** — 청구서를 받는 쪽은 빚진 줄도 모른다
            · ★그런데 **200년 전에 먼저 친 것은 마교다.** 그래서 2대 천마에게 물음이 생긴다:
              ***우리가 먼저 쳤는데 청구할 자격이 있는가.***
            · ★★그래서 **「청구인가 교정인가」가 고정값이 아니라 결과**다 —
              **플레이어가 누구를 붙들었느냐**로 갈린다
              (신 마존들을 붙들면 **청구** / 2대의 뜻이 서면 **「그건 또 죽는 일이다, 다르게 하자」**).
          ★★★2026-07-28 — **침공의 그림이 바뀌었다**: 국경에서 오지 않는다.
            마존들은 저잣거리에 **제 가게를 갖고 있다**(factions.yml magyo.저잣거리의_손) —
            숨은 게 아니라 **아무도 주인 이름을 안 물었을 뿐**이다.
            > **이미 안에 있던 가게들이 어느 날 문을 닫는다.**
          ★★**침공의 규모 = 붙든 계보의 수** (factions.yml cheonma.최강이지만_해결되지_않는다):
            천마는 아무에게도 지지 않지만, **쪼개진 마교는 정파를 칠 수 없다.**
            → 그래서 이 막의 승패가 **2대의 장악도**에서 나온다 (엔딩 A/B 축에 직결).
          ★★그리고 2대의 진짜 일은 이기는 것이 아니다 —
            **다섯의 답이 200년 전에 전부 틀렸음이 드러났고, 그 뒤로 아무도 새 답을 못 냈다.**
            **여섯 번째 답을 내는 것**이 2대의 일이다.
          ★미결: 2대 승계의 **저장 자리와 판정**(플레이어 천마가 섰는가 / NPC 대체인가) ·
            **붙든 계보 수 → 침공 규모**의 산술 — 배선 회차
      - key: gonryun_goryp                 # 곤륜파 고립 · 서역 붕괴
        at: 8
        do:
          rumor: { 강도: 4, 태그: [괴사, 정치], 망: sangdan_net, 문안키: 서역이_끊겼다 }
          region_delta: { region: cheongha_hyeon, 경제: -8 }
        resolve: "상로가 끊긴 값은 경제로 산다 — 회복 문법대로"
      - key: daejeon_gyeolgwa               # ★종결박 — 승패가 **정본이 정하지 않는다**
        at: 20
        do: { world_event: 마교_대전 }
        resolve: "★해소가 승패를 남긴다 (유저 전투 결과·퀘스트 진행률). 옛 정본의 '격퇴 확정'은 폐기됐다 —
          이 결과가 endings.inputs.마교_승패 로 들어간다"
    tempo:
      accel:
        - { key: "registry:살상_사건", days: 1 }
        - { key: "region:민심_35_미만_7일", days: 1 }
      decel:
        - { key: "registry:정전_중재_성사", days: -3 }
    heralds:
      - { rumor: { 강도: 4, 태그: [정치, 괴사], 망: orthodox_net, 문안키: 서쪽_하늘의_먼지 } }
    personal_hooks: [참전, 피난민_구호, 전장의_생계]

  # ── story_summary v2 「제6막 — 혈교 실체 등장 (모두의 적)」 ──
  hyeolgyo_siltche:
    name: "제6막 — 혈교 실체 등장"
    order: 6
    entry:
      base_day: 0                          # 절대일 없음 — 대전 해소가 유일한 시계
      gate: human
      requires_beat: magyo_chimgong.daejeon_gyeolgwa
      approval: { command: /막개전, permission: MANAGE_SERVER }
    beats:
      - key: bonsaek                       # 혈교가 드러난다 — 패도천·정파·마교조차 공격
        at: 0
        do:
          myeongbun: { issue: "혈교_전면:hyeolgyo", target: hyeolgyo, tags: [금기, 존망], gauge: 13,
                       victims_add: [magyo] }
          rumor: { 강도: 5, 태그: [괴사, 금기], 망: haomun_net, 문안키: 모두의_적 }
        resolve: |
          ★victims_add: magyo — 마교가 피해자 명단에 오른다. 진영 무관 협동의 근거.
          ★★2026-07-28: 「본색을 드러낸다」는 위장을 전제한 말이었다 — 혈교는 **숨지 않는다.**
            드러나는 것이 아니라 **이제야 모두에게 닿는다**가 맞다.
          ★★왜 마교마저 치는가: **마교는 사람을 거두고 혈교는 사람을 쓴다.**
            마교에는 거둔 사람들이 있으니, 혈교에게 그것은 **곳간**이다.
      # ★★2026-07-28 신설 — 초대 천마의 최후 (factions.yml magyo.chodae_cheonma.퇴장 ②)
      - key: chodae_ui_majimak             # ★초대 천마가 2대를 지키고 죽는다
        at: 4
        do: { rumor: { 강도: 5, 태그: [무인, 금기], 망: mingan_market, 문안키: 설산이_갈라진_날 } }
        resolve: |
          ★혈교가 2대(플레이어 또는 NPC)를 노리고, 초대가 마지막으로 막아서 **이긴다.**
            그리고 그 직후 지병으로 죽는다.
          ★★**혈교는 천마를 이기지 못했다. 다만 기다리면 됐다.**
            → 격이 깎이지 않는다: 혈교에게 진 것이 아니라 **혈교가 이기지 못한 자를 병이 데려간다.**
          ★그리고 마지막에 그가 지키는 것이 **제자**다 — 평생 「이기는 것으로는 아무도 못 살린다」던
            사람이, 마지막에 한 사람은 살린다.
          ★귀결: 다섯 마존을 붙들던 **스승이 사라진다** → 마교가 갈라질 수 있다 (엔딩 입력 후보).
          ★미결: 이 박이 마교 분열을 **강제**하는가, 2대의 장악도에 따라 갈리는가 — 배선 회차
      - key: gangsi_budae                  # 강시 부대 · 피의식 · 인신공양
        at: 6
        do:
          rumor: { 강도: 5, 태그: [괴사, 금기], 망: mingan_market, 문안키: 죽은_자가_걷는다 }
          region_delta: { region: cheongha_hyeon, 민심: -10, 치안: -8 }
        resolve: "강시는 npc_lifecycle·npc_combat 신설 대상 (별도 청구서) — 여기서는 세계 반응만"
      # ★★★2026-07-28 교체 — 이 자리에 있던 것은 `jeonmyeonjeon`(혈교_전면전)이었다.
      #   ─── 왜 갈았나: **엔딩 넷이 「이겼다」를 말하지 않는다** ───
      #     A 는 **봉인**하고 · B 는 폐허가 되고 · C 는 다시 **숨는다** —
      #     ★**혈교는 세 엔딩 어디서도 죽지 않는다. 다만 미뤄질 뿐이다.**
      #     그런데 「전면전(大戰)」은 **승패를 낳는 그릇**이다. 정본과 그릇이 어긋나 있었다.
      #   ★그리고 그것이 맞다: 이유가 없는 것과는 협상도 못 하고 **끝장낼 수도 없다.**
      #     혈교는 물리칠 적이라기보다 **없어지지 않는 조건**이다 (A 조차 「공포는 사라지지 않는다」).
      #   ★★한 줄: **혈교는 이기는 적이 아니라 가두는 재난이다.**
      - key: bongin                        # ★종결박 — 정/사/마가 함께 **가둔다** → 엔딩 분기
        at: 18
        do: { world_event: 혈교_봉인 }
        resolve: |
          ★해소가 엔딩을 정한다 — endings 절이 그 판정을 적어 뒀다 (선형 다음 막이 없다).
          ★★**목표는 죽이기가 아니라 가두기다.** 그리고 **혼자서는 못 가둔다** —
            봉인의 조건이 **연대의 폭**이다 (endings.world 판정 참조).
          ★★★2026-07-28 — **봉인이 무엇인지 정해졌다: 회수(回收)다.**
            혈교는 조직이 아니라 **세상에 뿌려진 혈 무구·무공서**이고, 그것을 **거두는 일**이다.
            > **세상에 흩어진 것을 거두려면 세상만큼 넓어야 한다.**
            ★그래서 「연대의 폭」이 조건인 것이 **자명해진다** — 연대가 좁으면 **다 못 줍는다.**
            ★그리고 **방법이 하늘에서 떨어지지 않는다**: 무당이 **500년째 그 일을 하고 있었다**
              (전사 절 · factions.yml mudang.오백년_당직). 다만 **혼자서는 다 못 주웠을 뿐**이다.
          ★미결: 혈 무구·무공서가 **몇 종인가** (회수의 실물 단위) · 무당이 **지금 몇을 놓쳤나**
          ★★★그래서 제3막이 **끝까지 닿는다**:
            **제3막 썩은 뿌리 → 제4막 연대의 폭 → 제6막 봉인 가능 여부.**
            (그전에는 제3막의 선택이 제4막까지밖에 안 닿았다.)
          ★그리고 제5막(마교 승패)과 **다른 축**이라 두 막이 각각 제 몫으로 엔딩을 가른다:
            **A/B 는 마교가 가르고, A/C 는 연대가 가른다.**
    tempo:
      accel:
        - { key: "registry:살상_사건", days: 1 }
      decel:
        - { key: "registry:정전_중재_성사", days: -3 }
    heralds:
      - { rumor: { 강도: 4, 태그: [금기, 괴사], 망: inn_net, 문안키: 피비린내가_가까이 } }
    personal_hooks: [진영_무관_협동, 강시_토벌, 잃은_것_찾기]

# ═══════════════════════════════════════════════════════════════════
# 엔딩 분기 — ★문법 신설 (사용자 확정 2026-07-26 「ㄹ 분기 문법 늘리기 신설」)
# ═══════════════════════════════════════════════════════════════════
#
# ─── 왜 acts 로는 안 되는가 ───
# acts 는 **선형**이다: order 0..N-1 연속 + requires_beat 로 직전 막의 박을 문다
# (world_clock_audit ① 이 그 두 가지를 강제한다). 엔딩은 넷이 **동시에 후보**이고
# 하나만 실현된다 — order 를 줄 수 없다. 그래서 막이 아니라 **별도 절**이다.
#
# ─── 원칙 ───
#  ① 엔딩은 막이 아니다. 마지막 막(hyeolgyo_siltche)의 **종결박이 해소되는 순간** 판정된다.
#  ② 판정 입력은 **이미 세계에 있는 것만** 쓴다 — 새 통화를 발명하지 않는다
#     (world_clock 머리 원칙 그대로: 신규 통화 발명 없음).
#  ③ **정확히 하나가 뽑힌다**: priority 낮은 수부터 검사하고 첫 성립을 취한다.
#     마지막 것은 조건이 없다(fallback) — 그래서 '아무 엔딩도 없는 세계'가 불가능하다.
#  ④ 수치는 노출 금지 (visibility 총원칙) — 엔딩 이름조차 소문·연출로만 드러난다.
#  ⑤ ★비정규(D)는 **개인**의 엔딩이다. 세계 엔딩과 **동시에 성립할 수 있다** —
#     그래서 scope 로 갈랐다: 세계(world) 하나 + 개인(personal) 별개.
#
endings:
  meta:
    decided_at: hyeolgyo_siltche.bongin          # 이 박의 해소가 판정 시점 (구 jeonmyeonjeon)
    state_key: 세계엔딩                            # world_meta 키 — 한 번 적히면 되돌리지 않는다
    event_type: 막엔딩                             # events 원장 append 타입 (되돌림 불가의 흔적)
    exactly_one: world                            # scope=world 는 정확히 하나 (fallback 이 보장한다)
    visibility: "엔딩 id·판정 입력 전부 내부 상태 — 노출 금지. 드러나는 것은 연출과 소문뿐"

  # 판정 입력 — ★전부 기존 축에서 읽는다 (발명 없음)
  inputs:
    마교_승패:
      from: "magyo_chimgong.daejeon_gyeolgwa 의 해소 결과"
      values: [격퇴, 패배]                        # 옛 정본의 '격퇴 확정'은 폐기됐다 (유저 결과가 정한다)
    연대_폭:
      from: "paedocheon_daeripp.bonjin_ui_gil 의 **개인 노선 분포** (협력을 고른 비율)"
      values: [좁다, 넓다]
      note: "★서버 하나의 값이 아니라 집계다 (노선은 개인별로 갈린다 — 2026-07-27 확정).
        임계값·집계 시점은 미결"
    맹주_진영:
      from: "murimmaeng_changseol.maengju_seonchul 의 해소 결과"
      # ★★2026-07-30 갱신 — 그전까지 `values: [미정]` 이었는데 **명단은 이미 확정됐다.**
      #   등록부가 「미확정」이라 말하는 동안 실은 정해져 있었다 (통독 전 훑기에서 잡았다).
      values: [sorimsa, namgung, npc, player]
      values_note: |
        ★후보는 **소림·남궁** 둘이고 **남궁이 기본**이다 (factions.yml murimmaeng.maengju_seat.후보).
        · **sorimsa** — 덕. **옳게 하려다 늦는다**
        · **namgung** — 힘. **빨리 자르다 맹이 약해진다** (★사람이 안 채우면 여기로 간다)
        · **npc** — 플레이어 역량이 문턱에 못 미쳐 세계가 채운 경우 (= 남궁)
        · **player** — 플레이어가 앉은 경우
        ★**무당은 후보였으나 사퇴한다** (500년 당직 — 그런데 그 말을 못 한다).
          그래서 판정값에 안 들어간다.
    혈교_명분:
      from: "faction_politics 명분 게이지 (혈교_전면:hyeolgyo)"
      쓰임: 연출                                  # ★2026-07-28 — **판정에는 안 쓴다** (아래 world 참조)
      note: |
        존망 태그는 4에서 멈춘다 — 게이지는 '봉인에 누가 나왔는가'의 대리값이다.
        ★그런데 그 값은 **연대_폭**이 더 정확히 잰다 (제3·4막에서 이미 쌓인 것이므로).
        그래서 이 값은 **연출용으로만** 남긴다 — 판정식에는 넣지 않는다.
        ★계율: 「판정 입력」이라 적고 판정에 안 쓰면 그것이 곧 등록부의 거짓말이다. 쓰임을 밝힌다.

  # ★★★2026-07-28 — 판정 축을 갈았다. 셋이 **한 문장**으로 정리된다:
  #     **혈교는 죽지 않는다. 얼마나 가뒀는가만 다르다.**
  #   · A = 가뒀다 (질서가 남았다)
  #   · B = 가두긴 했으나 **가둘 무림이 남지 않았다** (마교가 이겨 이미 폐허)
  #   · C = **못 가뒀다** — 놓쳤고 다시 숨었다  ← fallback 이 이 뜻을 갖는다
  #   ★그래서 두 막이 각각 제 몫으로 가른다: **A/B 는 마교가, A/C 는 연대가.**
  world:
    - id: jeongpa_seungri
      priority: 1
      name: "A. 정파 승리"
      when: { 마교_승패: 격퇴, 연대_폭: 넓다 }   # ★혼자서는 못 가둔다 — 봉인의 조건은 연대다
      outcome: "무림맹이 주도한 무림연합이 혈교를 **봉인**한다. 질서 확립·강호 안정"
      do:
        rumor: { 강도: 5, 태그: [정치, 무인], 망: orthodox_net, 문안키: 봉인의_날 }
        region_delta: { region: cheongha_hyeon, 민심: 12, 치안: 10 }

    - id: magyo_honran
      priority: 2
      name: "B. 마교 중심 혼란"
      when: { 마교_승패: 패배 }
      outcome: "마교가 일시 승리한 뒤 혈교와 부딪친다. 무림은 폐허 — 일부 세가·문파가 암흑화한다"
      do:
        rumor: { 강도: 5, 태그: [괴사, 정치], 망: inn_net, 문안키: 폐허의_강호 }
        region_delta: { region: cheongha_hyeon, 민심: -15, 치안: -12, 경제: -10 }

    - id: hyeolgyo_amyak
      priority: 3
      name: "C. 혈교 암약"
      when: {}                                   # ★fallback — 조건 없음 (그래서 엔딩 없는 세계가 없다)
      outcome: "혈교 잔재가 다시 어둠으로 숨는다. 평온해지지만 **공포는 사라지지 않는다**"
      do:
        rumor: { 강도: 3, 태그: [괴사, 금기], 망: haomun_net, 문안키: 재_속의_불씨 }
      note: |
        ★옛 에필로그(혼돈의 재)가 여기로 흡수됐다 — 다음 시즌의 씨앗은 이 엔딩이 심는다.
        ★★2026-07-28: fallback 이 뜻을 갖게 됐다 — **「마교는 물리쳤는데 연대가 좁아 못 가뒀다」**.
          그전에는 그냥 「나머지」였다. 이제는 **가장 흔한 결말이자 가장 쓸쓸한 결말**이다.

  # ★★★D 를 셋으로 갈랐다 (사용자 확정 2026-07-28 「각각 세워주세요」)
  #   전에는 `munpa_route` 하나에 「은거·혈화·선경 등」이 뭉쳐 있었다. 셋은 결이 다르다 —
  #   ★같은 「개인의 끝」이지만 **어디로 가는가**가 다르다: 밖으로 · 아래로 · 위로.
  #   ★전부 scope: personal 이라 세계 엔딩과 **동시에 성립한다** (배타 검사에 안 걸린다).
  #   ★조건은 **전부 미결**이다 — 지어내지 않는다 (cultivation/sect_life 축과 함께 정할 일).
  personal:
    - id: eungeo
      name: "D-1. 은거(隱居)"
      scope: personal
      when: { 조건: 미정 }
      outcome: "강호를 떠난다. 이름을 버리고 산으로 든다 — 세상은 그를 잊는다"
      결: |
        ★**밖으로 간다.** 이기지도 지지도 않고 판에서 내린다.
        ★마교 마존 「떠난다」와 같은 축이다 — 다만 저 혼자 간다는 점이 다르다.
    - id: hyeolhwa
      name: "D-2. 혈화(血花)"
      scope: personal
      when: { 조건: 미정 }
      outcome: "피로 꽃핀다. 힘을 얻은 대가로 사람의 자리에서 내려온다"
      결: |
        ★**아래로 간다.** 강해지려 선을 넘은 자의 끝이다.
        ★사파의 정의(「적정선이 있다」)의 **반대편**이고, 혈교의 결(「인간을 인간으로 안 본다」)에 닿는다.
      # ★★★2026-07-28 — **무엇으로 그렇게 되는지가 채워졌다** (그전엔 비어 있었다)
      어떻게: |
        ★★**혈(血) 무공서를 줍는 것이다.** 플레이어도 주울 수 있고, **그리고 매료된다.**
        (혈교는 조직이 아니라 세상에 뿌려진 책이다 — factions.yml hyeolgyo.기원)
        ★★그래서 혈교가 **적이면서 동시에 유혹**이 된다. **조직으로는 못 만드는 관계다.**
        ★그리고 제6막의 「봉인 = 회수」와 맞물린다:
          플레이어가 주운 것도 **누군가는 거둬야 할 것** 중 하나다.
        ★미결: 이것이 **혈교로 가는 문**인가, 혼자 떨어지는 것인가.
    - id: seongyeong
      name: "D-3. 선경(仙境)"
      scope: personal
      when: { 조건: 미정 }
