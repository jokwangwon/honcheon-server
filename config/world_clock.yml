# 세계 시계 — 메인스토리 막(幕) 등록부 (기계 판독용)
# 기준 문서: docs/design/world_clock.md (B-110)
# 이야기 정본: docs/story_summary.md — 이 파일은 그 이야기를 옮겨 적을 뿐, 고치지 않는다.
#
# 원칙: 막의 결말은 정본이 정하고, 플레이어는 박자와 자기 몫을 정한다.
#       아무도 사건을 안 일으키면 세계가 스스로 이 시계로 진행한다 (모든 박에 자동 해소).
#       수치(막·유효일·박자보정)는 절대 노출 금지 — 소문·NPC·의뢰·지역 상태로만 드러난다.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ ★ 아직 아무도 이 파일을 읽지 않는다 (아래 unwired 절). 세계에 막(幕)은 없다.  ║
# ║   설계 초안이다 — WorldClockEngine 이 서면 이 등록부가 세계의 달력이 된다.    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ─── ★ 미배선 표식 (chapter_events.yml 의 관례를 따른다) ───
unwired:
  reason: >-
    WorldClockEngine 이 없다. 세계일(world_meta '현재일')·자정 정산(advanceWorld)·소문·명분·
    원장은 전부 배선돼 있으므로 기본 시계 경로(막 진입·박 발화·전조)는 순수 조립이지만,
    아직 아무 코드도 이 파일을 열지 않는다. 또한 tempo 입력 중 장(chapter_events) 결과에
    기대는 키는 장 엔진 미배선(그 파일의 unwired 절) 동안 발화하지 않는다.
  condition: >-
    ① advanceWorld() 에 WorldClockEngine 단계가 편입되어 막 진입·박 발화·전조가 자정에 돌고,
    ② world_meta 에 세계막·막진입일·박자보정 키가 살고, ③ human gate 승인 명령(/막개전)이
    서면 — 이 등록부가 산다. tempo 의 장 결과 키는 chapter_events 배선(P2)이 선행 축.
  doc: docs/design/world_clock.md

meta:
  canon: docs/story_summary.md                 # 이야기 정본 — 수정 금지, 옮겨 적기만
  day_source: "world_meta '현재일' — 현실 1일 = 세계 1일 (자정 Asia/Seoul, advanceWorld)"
  state_keys: [세계막, 막진입일, "박자보정:<막id>"]   # 전부 world_meta 키밸류 — 스키마 변경 없음
  event_types: [막전환, 막관문]                  # events 원장 append 타입 (되돌림 불가의 감사 흔적)
  visibility: "막·유효일·박자보정은 내부 상태 — 노출 금지 (world_reaction_system 총원칙)"
  registry: "factions.yml 등재 세력 id 만. 소문 태그·장 키·명분 태그는 기존 등록부의 것만 쓴다"

clock:
  effective_day: "유효일 E = 세계일 D + 박자보정 T(현재 막)"   # 진입·박 발화 판정은 전부 E 로
  tempo_clamp: 20            # 막당 박자보정 상한 ±20일 — 이야기를 이 이상 밀거나 당길 수 없다 (정본은 흐른다)
  tempo_decay: none          # 박자보정은 감쇠하지 않는다 — 이야기의 압력은 소문이 아니다. 앞당긴 사흘은 앞당겨진 채 남는다
  tempo_dedupe: "같은 입력 키는 막당 1회 (faction_reaction 중복 가산 금지 3원칙의 재사용)"
  herald_lead_days: 3        # 막 전환 예정 유효일 3일 전부터 전조 소문 — 세계가 먼저 수군거린다 (되돌림 불가의 대가)
  beat_law: "모든 박은 time.yml deadline_events 문법 — 타이머 소진 시 플레이어 없이 진행된다 (교착 불능의 근거)"

# ═══════════════════════════════════════════════════════════════════
# 막 등록부 — story_summary 「메인 스토리 흐름」 다섯 단계의 1:1 대응 (누락 없음)
#   entry.base_day 는 전부 ★실측 보정 대상 (경험 정본 §3 — 세션 길이는 지인 테스트 실측으로)
#   beats[].at 은 막 진입일 기준 상대 유효일. resolve 는 자동 해소(세계가 스스로 진행하는 결말)
# ═══════════════════════════════════════════════════════════════════
acts:

  # ── story_summary 「프롤로그」 — 정파 문파 입문, 소규모 퀘스트 ──
  prologue:
    name: "프롤로그 — 강호 입문"
    order: 0
    entry: { base_day: 1, gate: auto }         # 개벽과 함께 — 조건 없음
    # 세계 시계가 가장 조용한 막: 주인공은 청하현 튜토리얼(경험 정본 §8)과 개인 사슬(B-109)이다.
    beats:
      - key: byeonbang_goedam
        at: 12                                  # 후반부 — 제1장의 전조를 미리 흘린다 (막 사이가 이어져 보이게)
        do: { rumor: { 강도: 1, 태그: [괴사], 망: mingan_market, 문안키: 변방의_흉흉한_말 } }
        resolve: "소문 자연 감쇠 (3일 -1) — 남는 것은 불안뿐"
      - key: immun_ui_munteok                   # 종결박 — 청하현 1차 기립의 끝 = 입문의 문턱 (경험 정본 §8)
        at: 15
        do: { chapter_open: hwasan_examination }   # 기존 장 재사용 — 화산파 입문 시험
        resolve: "상시 개방 유지 — 개인의 입문은 각자의 때에 (세계 막은 기다리지 않고 넘어간다)"
    tempo: {}                                   # 프롤로그는 가감 없음 — 배울 시간은 밀리지도 당겨지지도 않는다
    heralds: []                                 # 첫 막 — 전조 없음 (전조는 '다음' 막의 것, beats 가 대신한다)
    personal_hooks: [첫_생계, 첫_소문, 문파의_문턱]   # B-109 생성기가 참조 가능한 갈래 (강제 아님)

  # ── story_summary 「제1장 — 마교의 암류(暗流)」 ──
  magyo_amryu:
    name: "제1장 — 마교의 암류"
    order: 1
    entry: { base_day: 20, gate: auto, requires_beat: prologue.immun_ui_munteok }
    beats:
      - key: buhwal_jojim                       # 쇠퇴했던 천마신교의 부활 조짐 포착 (정본)
        at: 0
        do: { rumor: { 강도: 2, 태그: [괴사, 정치], 망: inn_net, 문안키: 마교_부활_조짐 } }
        resolve: "소문 감쇠 — 그러나 다음 박이 사실로 만든다"
      - key: amyak_siljong                      # 마교 신도들의 암약, 실종사건 발생 (정본)
        at: 7
        do:
          chapter_open: vanishing_chain          # 기존 장 재사용 — 막 한정 상류: 매매선이 아니라 마교 세작
          region_delta: { region: cheongha_hyeon, 민심: -3 }
        resolve: "14일 미해결 시 방치 결말 (그 장의 outcomes.방치) — 세계는 기다려주지 않는다"
      - key: chimryak_yego                      # 침략이 임박했다 — 정파 연합의 명분이 선다
        at: 18
        do:
          myeongbun: { issue: "마교_침략:magyo", target: magyo, tags: [존망, 무림침해], gauge: 13 }
          rumor: { 강도: 3, 태그: [정치, 무인], 망: orthodox_net, 문안키: 침략_임박 }
        resolve: "명분은 감쇠 문법대로 산다 (존망 태그는 4에서 멈춘다 — faction_politics)"
      - key: ilcha_chimryak_gyeoktoe            # ★종결박 — 정파 연합이 1차 침략을 격퇴 (정본: 격퇴는 확정)
        at: 21
        do: { world_event: 방어전 }               # 마크 무대는 별도 청구서 (설계 문서 §8 ⑤) — 무대 없이도 결과는 원장에 선다
        resolve: "방어전 종료 = 격퇴 (정본). 플레이어 몫: 참전 공적·favor·별호 / 무참전: 지역 델타 -5 추가"
    tempo:                                      # 어둠을 돕거나 방치하면 빨리 오고, 꺾으면 늦어진다 (설계 문서 §5)
      accel:
        - { key: "chapter:blood_scent.방치", days: 2 }          # 마병 방치 — 어둠의 물류가 산다
        - { key: "chapter:vanishing_chain.방치", days: 2 }      # 실종 방치 — 세작이 활개친다
        - { key: "registry:마병_암시장_유통", days: 1 }          # 건당 — 단 막당 1회 dedupe
        - { key: "region:민심_35_미만_7일", days: 1 }            # 흉흉한 땅에 어둠이 빨리 스민다 (7일마다)
      decel:
        - { key: "chapter:blood_scent.정화", days: -2 }
        - { key: "chapter:vanishing_chain.구출", days: -2 }
        - { key: "registry:세작_검거", days: -1 }
    heralds:                                    # 전환 3일 전 (clock.herald_lead_days) — 세계가 먼저 수군거린다
      - { rumor: { 강도: 2, 태그: [괴사, 정치], 망: mingan_market, 문안키: 서쪽에서_온_상인의_말 } }
    personal_hooks: [실종자_수색, 세작_의심, 변방_괴담_확인]

  # ── story_summary 「제2장 — 혈교의 부상」 ──
  hyeolgyo_busang:
    name: "제2장 — 혈교의 부상"
    order: 2
    entry: { base_day: 50, gate: auto, requires_beat: magyo_amryu.ilcha_chimryak_gyeoktoe }
    beats:
      - key: hyeolma_buhwal                     # 혈마 부활, 금기 의식 진행 (정본)
        at: 0
        do: { rumor: { 강도: 3, 태그: [괴사, 금기], 망: haomun_net, 문안키: 혈마_부활_의식 } }
        resolve: "소문 감쇠 — 그러나 전향 사건들이 사실로 만든다 (npc_lifecycle 전향 파이프)"
      - key: sapa_heupsu                        # 사파 일부 흡수 (정본) — unorthodox 세력의 이탈
        at: 10
        do:
          myeongbun: { issue: "혈교_잠식:hyeolgyo", target: hyeolgyo, tags: [금기, 존망], gauge: 8 }
          rumor: { 강도: 2, 태그: [사파, 금기], 망: inn_net, 문안키: 수로채의_변절 }
        resolve: "이탈은 명분 게이지의 일 — 세력별 참여는 faction_politics 연합 계산이 정한다"
      - key: magyo_giseup                       # 혈교가 마교까지 기습 (정본) — 피해자 명단에 마교가 오른다
        at: 20
        do:
          myeongbun: { issue: "혈교_잠식:hyeolgyo", victims_add: [magyo] }   # 피해_당사자 — 정·마 연합의 화학식
          rumor: { 강도: 3, 태그: [폭력, 금기, 정치], 망: haomun_net, 문안키: 마교_본단_피습 }
        resolve: "피해 사실은 원장에 — 연합 참여 계산의 입력이 된다"
      - key: hyeolgyo_tobeol                    # ★종결박 — 정파+마교 연합군의 혈교 토벌 (정본: 토벌은 확정)
        at: 30
        do: { world_event: 토벌전 }               # 사상 초유의 연합 — 연합은 언제나 임시다 (다음 막의 화약)
        resolve: "토벌 종료 = 혈교 격퇴 (정본). 잔재는 에필로그의 씨앗으로 원장에 남는다"
    tempo:
      accel:
        - { key: "registry:전향_사건_발화", days: 3 }            # NPC 혈교화 (emergent 전향 파이프) — 가장 무거운 가속
        - { key: "chapter:vanishing_chain.방치", days: 2 }      # 인신공양의 재료가 된다
        - { key: "registry:금기물_거래", days: 1 }
      decel:
        - { key: "registry:전향_후보_구제", days: -2 }           # 침식 정화 — 사람을 어둠에서 건졌다
        - { key: "chapter:blood_scent.회수조_격퇴", days: -1 }
        - { key: "chapter:vanishing_chain.구출", days: -2 }
    heralds:
      - { rumor: { 강도: 2, 태그: [괴사, 금기], 망: mingan_market, 문안키: 피_냄새_괴담 } }
    personal_hooks: [금기_의식_흔적, 변절자_추적, 연합의_사자]

  # ── story_summary 「클라이맥스 — 삼파전 개전」 ──
  sampajeon:
    name: "클라이맥스 — 삼파전 개전"
    order: 3
    entry:
      base_day: 80                              # '최소' 유효일 — 이보다 빨리는 못 온다. 실제 진입은 승인이 정한다
      gate: human                               # ★ 자동 진입 금지 — 살상 PvP 개방과 맞물린다 (경험 정본 §2)
      requires_beat: hyeolgyo_busang.hyeolgyo_tobeol
      approval: { command: /막개전, permission: MANAGE_SERVER }   # settleDay 와 같은 권한 문법
      # 조건 성숙 시: world_meta 세계막='관문_대기' + events '막관문' append + 관리자 채널 공지.
      # 승인 전까지 세계는 '개전 전야'에 머문다 — 전조 소문 유지, 박 정지. 이것은 버그가 아니라 설계다:
      # 살상 개방은 운영 판단(최종장 죽음 처리 규칙 완성 포함 — 보류 중)이 선행해야 하고, 기계는 그 판단을 못 한다.
    rules_shift:
      lethal_pvp: open                          # 이 막에서만 — 이전 막은 전부 쓰러짐→의방 회수 (B-111)
    beats:
      - key: dongmaeng_bunggoe                  # 혈교 격퇴 이후 마교와의 일시 동맹 붕괴 (정본)
        at: 0
        do: { rumor: { 강도: 3, 태그: [정치, 무인], 망: orthodox_net, 문안키: 동맹_파기 } }
        resolve: "명분 소진 = 연합 해산 — faction_politics 가 이미 아는 자연 귀결"
      - key: gakji_chungdol                     # 정 vs 마 vs 사 각지 충돌 (정본)
        at: 5
        do: { region_delta: { region: cheongha_hyeon, 치안: -10, 경제: -5 } }
        resolve: "충돌은 지역 델타와 조우 사건으로 산다 — 임계 효과(치안<30 도적 문법)가 전장을 만든다"
      - key: cheonma_gyeoljeon                  # ★종결박 — 정파 연합 vs 천마교주 결전 (정본)
        at: 20
        do: { world_event: 결전 }
        resolve: "결전 해소 (정본: 정파 연합의 승리 구도) — 에필로그 관문이 열린다"
    tempo:
      accel:
        - { key: "registry:살상_사건", days: 1 }                 # 피가 피를 부른다 — 건당, 막당 1회 dedupe
      decel:
        - { key: "registry:정전_중재_성사", days: -3 }            # 명분 중재 — 가장 무거운 감속
    heralds:
      - { rumor: { 강도: 3, 태그: [정치], 망: orthodox_net, 문안키: 동맹_균열의_말 } }
      - { rumor: { 강도: 2, 태그: [무인, 정치], 망: inn_net, 문안키: 낭인들의_피신 } }
    personal_hooks: [진영_선택, 옛_은원_청산, 전장의_생계]

  # ── story_summary 「에필로그 — 시즌 확장 암시」 ──
  epilogue:
    name: "에필로그 — 혼돈의 재"
    order: 4
    entry:
      base_day: 0                               # 절대일 없음 — 결전 해소가 유일한 시계
      gate: human                               # 시즌 마감 = 운영 판단 (다음 시즌 준비·리셋 규칙은 미결)
      requires_beat: sampajeon.cheonma_gyeoljeon
      approval: { command: /막개전, permission: MANAGE_SERVER }
    beats:
      - key: janjae_amryak                      # 혈마 잔재·마교 권력 공백 → 새로운 암약 (정본 — 다음 시즌의 씨앗)
        at: 0
        do: { rumor: { 강도: 2, 태그: [괴사, 정치], 망: haomun_net, 문안키: 재_속의_불씨 } }
        resolve: "심고 멈춘다 — 다음 시즌(패왕·역천)은 이 등록부의 다음 판이다"
    tempo: {}                                   # 끝난 이야기는 밀리지 않는다
    heralds: []
    personal_hooks: [전후의_삶, 공백의_기회]
