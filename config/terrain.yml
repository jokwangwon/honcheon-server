# ═══════════════════════════════════════════════════════════════════════════
# 지형 계층 (TerrainForge) — 땅의 등록부
# ═══════════════════════════════════════════════════════════════════════════
#
# 사용자 판정:
#   "별개의 시스템이 필요하다 — 1. 지형 생성 에이전트  2. 건물·마을 생성 에이전트.
#    두 개로 역할 분담하고 **지도를 통해 관리**되게 진행"
#   "자연동굴 제거 및 필요하면 그때 동굴의 형태로 생성하기 (통제가 힘들기 때문)"
#
# 이 파일은 **땅의 주문서**다. 집의 주문서는 world_map.yml 이고, 여기는 그 땅 쪽 각주다.
#   · world_map.yml — 어디에 무엇이 서는가 (좌표·지형·세력·등급)
#   · terrain.yml   — 그 땅을 어떻게 빚는가 (계약 상수·동굴 등록부)
#
# 없어도 돈다. TerrainForge 는 이 파일이 없으면 **지도에서 원형을 읽어 낸다**
#   (마교 전초의 architecture 가 이미 "동굴과 석실"이라고 적혀 있다 — 등록부를 두 번 쓰지 않는다).
version: 1

# ───────────────────────────────────────────────────────────────────────────
# 1. 계약 (contract) — 지형 계층이 건축 계층에게 보장하는 것
# ───────────────────────────────────────────────────────────────────────────
#
# ★ 지금은 **문서다** (TerrainForge 의 상수가 원천이다). 여기 적는 이유는
#   환경 검수(TerrainAudit)의 문턱과 이 값이 **같은 이야기를 해야** 하기 때문이다.
contract:
  seal_depth: 6                 # ① 조성 지면 아래 6칸은 단단하다 (TerrainForge.SEAL_DEPTH)
  feather_width: 22             # ② 경계 전이대 — 부지 밖 22칸에 걸쳐 자연으로 수렴한다
  build_max_step: 3             # 건축 가능 최대 경사 — 이웃 칸과 3칸 넘게 벌어지면 집을 못 앉힌다
  water_rule: "물 위에는 건축 마스크를 주지 않는다. 공중의 물·고인 물은 치운다. 강은 메우지 않는다"
  # ★★ v3 — 사용자의 판정으로 **완만함을 버렸다**:
  #   "사람이 굳이 오를 정도로 완만하게 산을 안 만들어도 됨 — 올라갈 수 있는 특정 길을 만들어서
  #    그 길로 올라갈 수 있게 해도 됨. 산의 높이는 더 높여도 될 거 같음"
  #   구판(높이 36 · 물매 1:2.4 · 사방 램프)은 검수를 통과하고도 조감에서 **거대한 흙무더기**였다.
  #   ★ **검수가 통과한다고 좋은 산이 아니다.**
  lift_mountain: 72             # ④ 험산·설산 (구판 36 — 그건 언덕이지 험산이 아니었다)
  lift_hill: 44                 # 산
  lift_plateau: 24              # 고원 — 오르는 산이 아니라 **올라선 들**이다
  massif_slope: "1:0.9"         # ★ 반경 = 높이×0.9. **깎아지른다** (구판 1:2.4 → 흙무더기)
  summit_radius: 22             # 정상 평탄지 — 본전(15×13)+연무장이 앉는다. **그 밖은 벼랑이다**
  crag_wavelength: "11~23칸"    # ★ 바위의 결. 구판은 **파장 1칸**이라 '점이 찍힌 느낌'이 됐다
  trail_width: 3                # ★ 등반로 — 좁은 산길 하나. 나머지 사면은 벼랑이어도 좋다
  trail_max_step: 1             # ★ 한 칸에 한 칸 — **걸어 오른다** (도달성 검사가 이것을 잰다)
  ramp_width: 5                 # 산이 아닌 곳의 진입 램프 (들·사막은 여전히 사방에서 걸어 들어온다)
  approach_min: "산 1방위(등반로) · 들 4방위"

# ───────────────────────────────────────────────────────────────────────────
# 1-b. 조성기 스위치 (forge) — ★ 여기는 문서가 아니라 **코드가 읽는다** (TerrainForge.load)
# ───────────────────────────────────────────────────────────────────────────
forge:
  # ★★ 계약 ①-b — **올린 땅 밑은 채운다** (B-114 7차, 2026-07-14)
  #
  #   병: 조성기가 서 있던 나무 위로 땅을 올려 **나무를 산 채로 묻었다.**
  #     실측 단면 (-61,81~89,359): 옛 지면 y79 → 공기 81-82 → 잎 83-86 → 새 흙·잔디 87-89.
  #     sealBelow(6칸)는 공기·물만 채워 잎(솔리드)에 막혔고, 채움 고리들은 잎을 만나면 break 했다 —
  #     수관과 옛 지면 사이 공기가 환경검수 ⑥의 「지하 공동」 3.86%(1,513칸)의 정체다.
  #     묻힌 잎은 서서히 삭아 공동이 자라고, 밭을 파면 잎이 나온다 — 세계 품질 실결함.
  #
  #   계약: 새 표면이 옛 표면보다 높아지는 손(feather·benchTerrace·levelField·duneField·
  #     raiseMassif·carveRamp·carveTrail·terrace)은 새 표면 밑을 **옛 지면까지 빈틈없이** 채운다.
  #     공기·잎·통나무·버섯·초목 → 채움 재질(표면 밑 2칸 흙 · 그 아래 돌 — sealBelow 관례).
  #     돌·흙·광석·사람이 지은 것 → 남긴다. 난수 없음 — 채움 재질은 깊이의 순수 함수다.
  #
  #   ★ 이미 묻힌 것은 이 스위치가 못 걷는다 — 치유는 `/혼천 지하정리` (콘솔 가능 · 판 굴 상자 보존).
  #   거울: TerrainForge.fillBelowRaised / sweepFillable / sweepFill (하네스: tools/TerrainAuditSelfTest.java)
  fill_below_raised: true

# ★ 산 높이 — 장소마다 조절한다. **조감을 보고 코드가 아니라 여기를 고친다**
lift:
  hwasan:  72                   # 화산 — 험산
  jongnam: 72
  gonryun: 84                   # ★ 곤륜은 하늘을 받친다 (설선 위로 한참 솟아야 한다)
  mudang:  64
  sorimsa: 48                   # 숭산 — 소림은 험산이 아니다 (산)
  ami:     72
  jeomchang: 72
  cheongseong: 64

# ───────────────────────────────────────────────────────────────────────────
# 2. 조성 윤곽 (shaping) — **같은 "산"이라도 서는 집이 다르면 빚는 땅이 다르다**
# ───────────────────────────────────────────────────────────────────────────
#
# ★ 인게임이 가르쳐 준 것 (녹림 소채, 1차 조성):
#     [지형] 녹림 소채 · 정상 y144 · 경사 험(40칸) · **진입 없음(!)**
#     환경 검수: ❌ 경계 급단차 32.3% (최대 33칸) · ❌ 진입불가 (네 방위 전부)
#
#   원인: terrain: 산 을 보고 **봉우리(+36)** 를 세웠다. 그러나 **산채는 봉우리가 아니다.**
#   산채는 산 중턱의 완만한 단에 목책을 두른 집이고, 등록부도 그렇게 적고 있다:
#     architecture: "목책과 통나무 막사. 도적의 집은 언제든 버릴 수 있어야 한다" · tier: poor
#   봉우리를 세우니 사방이 33칸 벼랑이 되어 걸어 들어갈 수가 없었다.
#   **도적이 못 드나드는 산채는 산채가 아니다.**
#
# 윤곽 넷:
#   봉우리 — 문파의 산. +36 을 세우고 남쪽으로 비탈을 흘린다 (산문 → 천 계단 → 본전)
#   중턱단 — 산채·산마을. **산을 세우지 않는다.** 있는 산의 중턱을 필요한 만큼만 고른다
#   들     — 평지·분지·폐허. 발치를 메워 고른다
#   그대로 — 강·수향·섬·밀림. 물과 숲은 자연이 준 대로가 옳다
#
# 적지 않으면 TerrainForge 가 **세력·architecture 로 읽어 낸다**
#   (녹림 → 중턱단 · 구파/세가 → 봉우리 · "산문"·"본전"·"계단"이 적혀 있으면 봉우리).
#   모르면 **중턱단**이다 — 산을 세우지 않는 쪽이 안전하다.
shaping:

  # ── 녹림 — 산채는 산에 걸터앉는다. 봉우리 금지 ──
  nokrim_sochae:   중턱단
  nokrim_jungchae: 중턱단
  nokrim_chongchae: 중턱단
  nokrim_sangil:   중턱단      # 산길 — 길이지 봉우리가 아니다

  # ── 구파일방·오대세가 — 오르는 길이 시험이다 ──
  hwasan:      봉우리
  jongnam:     봉우리
  sorimsa:     봉우리
  mudang:      봉우리
  gonryun:     봉우리
  jeomchang:   봉우리
  cheongseong: 봉우리
  ami:         봉우리

  # ── 마·혈 — 굴이 본체다. 산을 세우지 않는다 (굴 입구가 비탈에 뚫리면 족하다) ──
  magyo_jinryeong: 중턱단
  hyeolgyo_eungeo: 중턱단

  # ── 사냥터 — 자연이 준 산이 사냥터다. 손대지 않는다 ──
  jinryeong_simsan: 그대로
  taebaeksan:       그대로


  # ── ★★ 폴백 여덟 곳 — **조용한 폴백이 이 병의 정체다** (윤곽의 눈이 잡았다) ──
  #   "모르면 중턱단"은 **안전한 답이지 옳은 답이 아니다.** 하나씩 판정한다:
  #
  # 고원의 도시·군진 — ★ 중턱단은 틀렸다. 고원은 오르는 산이 아니라 **올라선 들**이다
  #   (이 파일의 lift_plateau: 24 가 이미 그렇게 적고 있다). 도시가 산비탈에 앉을 수는 없다
  taewon:          들        # 태원 — 산서의 상인 도시. 장터가 비탈에 서지 않는다
  gunjin_daedong:  들        # 대동 군진 — 성벽과 연병장. 평평해야 병(兵)이 선다
  # 관문 — 봉우리도 들도 아니다. 관문은 **고갯길의 목**이다 (중턱단이 정확히 그 문법이다)
  gwanmun_songban: 중턱단    # 송반관 — 산이 양옆에 서고 길이 가운데로 난다
  bukjjok_sangil:  중턱단    # 북쪽 산길 — 길이지 봉우리가 아니다 (★ 이미 서 있다 — 재조성 대상)
  # 비경·산지 — **자연이 준 산이 낫다.** 영물·약초·광맥은 빚은 땅에 나지 않는다
  ami_simsan:         그대로
  gonryun_seolseon:   그대로
  yakcho_taebaek:     그대로
  cheolgwang_taehang: 그대로

  # ── ★ 서역·새외 (world_map.yml §15 terrain_requests W5 요청서 그대로) ──
  seolyeok_daesa:      봉우리    # ★ 절벽에 박힌 대사원 — 소림보다 크다
  baehwa_seonghwadan:  사막      # ★ 성화단 — 구판은 `들` 이었다 = **사막 한복판의 잔디밭 제단**.
                                #   윤곽의 눈이 잡았다. 사구(duneField)는 부지 한복판(0.45R)을 평평하게
                                #   두므로 제단은 그대로 선다 — **세우지 않으면서 사막일 수 있다**
  seoyeok_gochang:     사막      # ★ 고창 — 사구 위의 오아시스 도시
  donhwang:            사막      # ★ 돈황
  gunjin_gayokgwan:    사막      # ★★ 가욕관 — **이미 등록된 중원의 군진.** 지금 잔디밭이었다
  bukmak_hanjeong:     들        # ★ 천막이다. 세울 것이 없다
  odokgyo_odokchae:    그대로    # 밀림은 자연이 준 대로
  namman_milim:        그대로
  dongyeong_do:        그대로    # ★ 섬은 빚지 않는다 (W6 — 해남파의 선례)


# ───────────────────────────────────────────────────────────────────────────
# 2-b. ★ **빚지 않는 땅** — 침묵은 안 된다 (MapAudit 이 이것을 읽는다)
# ───────────────────────────────────────────────────────────────────────────
#
# 강에서 배운 것: `terrain: 강` 이 선언됐는데 조성기는 `Profile.그대로` 로 **조용히 지나쳤다.**
#   그리고 아무도 그것을 재지 않았다 — **짓지 않으면 위반이 없다.**
#
# 그 침묵을 여기서 끊는다. **빚지 않는 땅은 왜 안 빚는지 적는다.**
#   적지 않으면 MapAudit 이 「침묵 지형」으로 **위반을 낸다.**
#
#   natural: — 자연에 맡긴다. **그것이 옳다는 근거가 있다**
#   pending: — 자연에 맡기고 있으나 **보장이 없다.** 눈이 계속 짖는다 (잊히지 않도록)

natural:
  # ★ 밀림 (6곳: 남만 밀림·오독채·혈교 은거·독문·진남관·영남 유배지)
  #   자연이 진짜로 준다 — world_purity.yml 이 **일부러 남겼다**:
  #     "남만의 밀림(jungle·bamboo_jungle)은 더운 습한 쪽이라 **원래부터 손대지 않는다**"
  #   정글 바이옴이 살아 있으므로 나무·덩굴·대나무가 실제로 난다.
  #   ★ 우리가 나무를 심는 것보다 바닐라가 심는 것이 낫다 — **결과가 이미 옳으면 알고리즘을 넣지 않는다.**
  밀림: "정글 바이옴이 살아 있다 (world_purity 가 일부러 남겼다). 나무는 바닐라가 우리보다 잘 심는다"

  # ★ 사냥터 2곳 (진령 심산 · 태백산) — 지도 검수가 「침묵」으로 잡은 것.
  #   shaping: 에는 이미 `그대로` 라고 적혀 있었다 ("자연이 준 산이 사냥터다. 손대지 않는다").
  #   그러나 **그 이유는 사람만 읽을 수 있었다** — 눈은 못 읽었다. 그래서 침묵으로 셌다.
  #   ★ 사유는 주석이 아니라 **등록부에** 있어야 눈이 읽는다. 그것이 이 항목이다.
  jinryeong_simsan: "사냥터 — 자연이 준 산이 사냥터다. 봉우리를 세우면 짐승이 못 다닌다"
  taebaeksan:       "사냥터 — 자연이 준 산이 사냥터다. 봉우리를 세우면 짐승이 못 다닌다"

  # ★ 비경·산지 4곳 — 윤곽의 눈이 「침묵」으로 잡았다.
  #   shaping: 에 `그대로` 라고 적었으나 **사유는 주석에만** 있었다. 눈은 주석을 못 읽는다.
  #   (이 교훈을 이 파일에서 **두 번째로** 배운다 — 사냥터 2곳이 같은 병이었다.)
  ami_simsan:         "영물지 — 자연이 준 산에 영물이 산다. 빚은 땅에는 나지 않는다"
  gonryun_seolseon:   "영물지 — 설선은 자연의 것이다. 봉우리를 세우면 설선이 거짓이 된다"
  yakcho_taebaek:     "약초 산지 — 약초는 자연 산에 난다. 빚은 흙에는 나지 않는다"
  cheolgwang_taehang: "철광 — 광맥은 자연의 것이다. 굴이 필요하면 우리가 판다 (terrain.yml cave:)"

pending:
  # ★★ 섬 (2곳: 해남파 · 동영도) — **검수의 충돌은 풀렸다. 파는 손이 아직 없다.**
  #
  #   ─── 무엇이 풀렸나 (2026-07-13 사용자 결정) ───────────────────────────────
  #   구판은 이렇게 적혀 있었다:
  #     "새 눈이 필요하다: **'사방이 물인가 · 걸어서 들어올 수 없는가'** — 이는 기존
  #      TerrainAudit ④(연결성: '걸어 들어올 수 있어야 한다')와 **정면으로 충돌한다.**
  #      섬은 걸어 들어올 수 **없어야** 옳다. 그 충돌을 풀기 전에는 손대지 않는다."
  #
  #   ★★ 사용자가 그 충돌을 풀었다:
  #       *"섬은 검수 ④(연결성) **면제**. 대신 「**나루가 있는가**」를 재는 새 축을 그 자리에 세워라.
  #         섬은 빚되 **배가 닿는 자리를 반드시 가져야 한다.**"*
  #
  #   ★★★ 그리고 그 결정의 진짜 무게는 이 한 줄이다:
  #       *"(배는 아직 없다. **땅이 배를 기다리며 선다** — 땅은 한 번만 서니까)"*
  #     ⇒ 배(탈것)가 구현되기 **전에** 나루를 빚어 둔다. 땅은 한 번만 서므로,
  #       지금 나루를 안 남기면 **배가 생겨도 닿을 데가 없다.** 그때는 땅을 다시 못 빚는다
  #       (TerrainLedger · TerrainSeal — 이 프로젝트의 헌법).
  #
  #   ─── 무엇이 아직 안 됐나 ─────────────────────────────────────────────────
  #   ★ **바다를 파는 손이 없다.** TerrainForge 는 물을 만들지 않는다 (tidyWater 는 정리만).
  #     오아시스(못)는 팠으나 **바다는 아직이다** — world_map §15 W6 이 "섬은 빚지 않는다"고 적어 두었고,
  #     그 판단이 이 결정으로 **뒤집혔다** ("섬은 빚되").
  #   ★ 그러므로 이것은 **지형 담당에게 넘기는 빚**이다. 그때까지 섬은 바닐라 해안에 앉는다
  #     (해남파가 그렇게 서 있다) — 그리고 **그 사실을 숨기지 않는다.**
  섬: "★ 검수 충돌은 풀렸다 (④ 면제 + 나루 축 — audit.connectivity_exempt 참조).
    ★★ 그러나 **바다를 파는 손이 아직 없다** — 지금은 반도에 앉을 수 있다.
    ★ 그때까지도 **나루는 반드시 있어야 한다** (배가 닿을 자리가 없으면 섬이 섬이 아니다)"

  # ★ 명주 해관 (물가지만 **바다**다 — 절강 연안 해관)
  #   강을 파지 않는다 (rivers.yml 에 없다). 바다는 만들지 않는다 (terrain_layer.md 원칙).
  #   그러나 **바닷가라는 보장도 없다** — 섬과 같은 병이다.
  sibaksa_myeongju: "바다에 서야 하는 해관. 바다는 만들지 않으므로 바닐라 해안에 기댄다 (보장 없음)"

# ───────────────────────────────────────────────────────────────────────────
# 3. 표층 (surfacing) — ★★ **눈과 모래는 블록이지 바이옴이 아니다**
# ───────────────────────────────────────────────────────────────────────────
#
# ★ 순도 담당이 사막·설원 바이옴 12종을 껐다 (사용자: "사막 필드도 얼음 지역도 필요없음"). 옳다 —
#   **무작위로 흩뿌려지는 사막·빙원은 통제 불가능**하기 때문이다.
#   그런데 끄는 순간 **이 세계에서 모래와 눈의 유일한 출처가 사라졌다**:
#     · 곤륜(설산) → 회색 돌산이 됐다   ★ 이미 등록된 구파일방 본산이다
#     · 가욕관(사막) → 잔디밭이 됐다     ★ 이미 등록된 군진이다
#
# ★★ 원칙은 이미 정해져 있다 — **자연 동굴을 끄고 굴을 우리가 판 것과 정확히 같다**:
#       끈다   — 통제 불가능한 무작위 배치는.
#       만든다 — 등록 좌표의 의도된 지형은.
#     지금까지 앞의 절반만 했다. 이 절이 뒤의 절반이다.
#
# ★ 덧입힘은 **윤곽(shaping)이 아니다** — 어느 윤곽 위에도 얹힌다:
#     봉우리 + 설원 = 곤륜   ·   고원 + 설원 = 토번   ·   들/사막 + 사막 = 가욕관
#
# 적지 않으면 지형이 말한다 (terrain: 설산 → 설원 · terrain: 사막 → 사막).
# 여기 적는 것은 **지형만으로 못 읽는 것**뿐이다.
surfacing:

  # ── 설원 — 설선 위에만 눈이 얹힌다 ──
  gonryun:
    surface: 설원
    snowline: 120          # ★ 곤륜 — 등록부가 요청한 값 (§15 archetypes.설원)
    note: "★★ W1. 등록된 구파일방 본산인데 눈이 없었다. 가장 급하고 가장 싸다"
  gonryun_seolseon:
    surface: 설원
    snowline: 115
  seolyeok_daesa:
    surface: 설원
    snowline: 110          # ★ 토번 = 고원 + 눈 (W4 — W1 이 끝나면 거의 공짜다)
    note: "★ 고원(LIFT_PLATEAU) 위에 설원을 덧입힌다. 윤곽과 표층이 직교하므로 그냥 된다"

  # ── 사막 — 모래·사암·자갈의 결 ──
  gunjin_gayokgwan:   사막      # ★★ W2. terrain: 사막 이므로 사실 자동이지만 **명시한다** (깨졌던 자리다)
  seoyeok_gochang:    사막
  donhwang:           사막
  baehwa_seonghwadan: 사막

# ───────────────────────────────────────────────────────────────────────────
# 3-b. 오아시스 (oasis) — ★ 모래 한가운데 **진짜 물**
# ───────────────────────────────────────────────────────────────────────────
#
# "오아시스를 놓치면 죽는다"(routes.sangro_silk.survival)가 **지형에서 읽혀야** 한다.
#
# ★ 지금까지 TerrainForge 는 물을 **만들지 않았다** (tidyWater 는 정리만 한다).
#   오아시스가 그 첫 예외다 — 그리고 **바다는 여전히 만들지 않는다** (W6: 섬은 자연에 맡긴다).
#   **못 하나는 만들 수 있고 바다는 못 만든다** — 그 선을 여기서 긋는다.
#
# ★ 경계는 급격하다. 오아시스는 그라데이션이 아니다 —
#   **물이 닿는 데까지가 초록이고 그 밖은 모래다.** 그 대비가 오아시스다.
#
# ★ 수면은 조성 지면 **아래**(cy-1)에 둔다 → 환경 검수 ②가 "산 위의 웅덩이"(지면+3 초과)로 세지 않는다.
#   **오아시스는 웅덩이가 아니라 못이다.** (검수 규칙 개정 불필요 — 확인했다)
oasis:
  - seoyeok_gochang
  - donhwang

# ───────────────────────────────────────────────────────────────────────────
# 3. 동굴 등록부 (caves) — **우리가 판다**
# ───────────────────────────────────────────────────────────────────────────
#
# 자연 동굴은 데이터팩(worldgen/honcheon_no_caves)으로 껐다. 지하 공동 10.08% → ~0%.
# 그런데 등록부는 동굴을 요구한다. 그러면 **우리가 판다** — 우리가 정한 형태로, 우리가 정한 자리에.
#
# 원형 넷 (docs/design/cave_archetypes.md):
#   은신처 — 마교 전초. 입구가 좁고 통로가 길다(44칸). 안쪽에 석실 둘. 깊이 18
#   기연굴 — 폐사당 지하·옛 문파 터. 짧은 통로(24) + 방 하나. 깊이 11
#   산적굴 — 녹림. 입구가 넓다(짐을 들여야 한다). 짧고 굵다(18). 깊이 7
#   제단굴 — 혈교 폐사. 깊이 내려간다(22). 방이 넓고 천장이 높다
#
# 공통 규약: **광원이 없다** (어둠이 동굴의 값이다) · 입구는 비탈에 뚫린다 · 결정론(좌표 해시)
caves:

  # ── 마(魔) — "동굴과 석실. 사람이 사는 흔적을 지운다" (world_map.yml magyo_jinryeong) ──
  magyo_jinryeong:
    archetype: 은신처
    note: "★ 청하현에서 나흘. 가장 가까운 마(魔). 잠식이 진행돼야 존재를 안다 — 그래서 굴이다"

  hyeolgyo_jedan:
    archetype: 제단굴
    note: "혈교 옛 제단 (복우산 폐사). 폐사당 → 복우산 → 남만, 3단 사슬의 가운데 고리"

  hyeolgyo_eungeo:
    archetype: 은신처
    note: "남만 심산의 은거지 — 밀림이 굴을 덮는다"

  # ── 기연 — 폐허가 기연이 앉는 자리다 ──
  abandoned_shrine:
    archetype: 기연굴
    note: "★ 폐사당 지하. 취걸개 기연(fortune_encounters)의 무대 밑. 금기 사슬의 첫 고리"

  goguk_terra:
    archetype: 기연굴
    note: "고국 폐허 (진령 옛 문파 터) — 앞으로 들어올 기연·무공의 출처. 비워 둔 자리"

  # ── 녹림 — 도적은 굴에 짐을 쟁인다 ──
  nokrim_sochae:
    archetype: 산적굴
  nokrim_jungchae:
    archetype: 산적굴
  nokrim_chongchae:
    archetype: 산적굴
  # nokrim_sangil 은 굴이 없다 — 산길은 길이지 소굴이 아니다 (TerrainForge 가 명시적으로 뺀다)

# ───────────────────────────────────────────────────────────────────────────
# 4. 검수와의 약속 (audit)
# ───────────────────────────────────────────────────────────────────────────
audit:
  underground_void_max: 0.02      # 환경 검수 ⑥ — 지하 공동(★공기만) 2% 문턱 (TerrainAudit UNDERGROUND_VOID_MAX 거울)
  underground_dug_cave_max: 0.08  # 우리가 판 굴이 있는 지역의 여유 (TerrainAudit UNDERGROUND_DUG_MAX 거울)
  underground_surface_margin: 5   # ⑥ 기둥별 표본 상한 = min(중심y, 그 기둥의 지면) − margin (TerrainAudit UNDERGROUND_MARGIN 거울)
    # ★★ B-114 5차 (2026-07-14) — **하늘은 지하가 아니다.** 구판은 중심 y 기준 고정 대역
    #   [cy−45, cy−5] 를 훑어, 지면이 낮은 기둥(저지·수변 62~85 vs 청하현 cy≈90)의 **열린 하늘**을
    #   지하 공동으로 셌다. 산술 정합: 저지 ~80기둥 × ~19칸 ≈ 1,520 ≈ 실측 1,513 —
    #   물 0 · 봉인 무변동 · 판굴 없음 세 관측을 동시에 설명한다.
    #   지면 판정은 getHighestBlockYAt 이 아니라 하향 고체 탐색(TerrainAudit.surfaceY — 물·잎을
    #   지나친다)을 쓴다: getHighestBlockYAt 은 물을 땅으로, 옛 지붕을 지면으로 읽는다 (두 번 무너진 버그).

  # ═════════════════════════════════════════════════════════════════════════
  # ★★ ⑥ 액체 분리 계수 (underground_liquids) — **액체는 동굴이 아니다** (B-114)
  # ═════════════════════════════════════════════════════════════════════════
  underground_liquids:
    counted_as_void: false        # ★ 물·용암은 「공동」과 **분리 계수해 보고만** 한다 — 판정은 공기만
    why: |
      ★ 카버(동굴)가 파는 것은 **공기**다. 물·용암은 카버가 아니라 **노이즈 생성기의 구조층**이
        만든다 (대수층 · y<-54 용암 바다) — honcheon_no_caves 가 동굴을 다 죽여도 그대로 남는다.
      ★★ 증거 (2026-07-14, 같은 시드): cheese 봉인 **전** 3.81% → **후** 3.84% — 무변동.
        동굴이 진범이면 봉인 후 수치가 움직여야 했다. 그 3.8% 는 동굴이 아니라 구조층이었다 —
        **액체를 공동으로 세는 눈은 봉인의 성패를 영원히 못 읽는다.**
      ★ 구판의 지형별 예외(강가에서만 물을 뺌 — 수로채 "자연동굴 25%")는 이 일반화에 흡수됐다:
        물은 **어느 지형에서도** 공동이 아니다. (① 바닥 밑 공동은 원래부터 공기만 센다 — 불변)
    structural_layers:            # ★ 참고 — 판정은 y 경계를 쓰지 않는다 (분류로 푼다). 기록용 어휘다
      lava_sea_below_y: -54       # 1.21 노이즈 생성기의 고정 용암 바다 (카버 무관)
      aquifers: "지하 대수층 — 카버가 아니라 생성기가 만든다 (시드 원점 수역 포함)"
    mirror: "server-mvt TerrainAudit.classifyDeep (공기/물/용암/고체) — 하네스가 이 분류를 시험한다"

  # ═════════════════════════════════════════════════════════════════════════
  # ★★ ⑥ 판 굴 분리 계수 (underground_dug_caves) — **우리가 판 굴도 자연 동굴이 아니다** (B-114 후속)
  # ═════════════════════════════════════════════════════════════════════════
  underground_dug_caves:
    source: terrain_built.yml   # ★ 정본 — 지형 원장(TerrainLedger). **집행된 좌표**를 기억한다
    why: |
      ★★ 실측 증거 (2026-07-14, 검토자): 액체를 분리하고도 공동(공기) 3.84% · 물 0 · 용암 0 —
        남은 것은 **진짜 공기**다. 세 번의 월드 생성(옛 no_caves·새 no_caves·같은 시드)에서
        3.81~3.84% 로 사실상 불변 — 데이터팩과 무관하게 재현되는 고정 부피는 하나뿐이다:
        **TerrainForge 가 결정론으로 파는 우리의 굴** (같은 좌표 = 같은 굴 = 같은 수치).
      ★ 대조원은 왜 원장인가 (config caves: 가 아니라):
        · config caves: 는 **의도**다 — 원형(archetype)만 있고 **좌표가 없다** (입구는 팔 때
          비탈에서 찾는다). 의도만으론 어느 공기가 우리 것인지 못 가른다.
        · 원장은 **집행**이다 — 입구·방 좌표와 파낸 칸수를 적는다. 검수는 세계(집행된 것)를
          재므로 집행의 기록과 대조하는 것이 옳다. 안 판 굴은 뺄 공기도 없다.
    box: "CaveSpec.zone() 과 같은 상자 — 입구·방 ±14 · 방바닥-8 … 입구+6 (그리는 손과 재는 눈이 같은 식)"
    counted_as_void: false      # 상자 안의 공기는 「판 굴」로 분리 계수 — 보고만 하고 판정에 안 넣는다
    detection_kept: "★ 등록 **안 된** 공기는 여전히 짖는다 — 자연 동굴 검출력은 그대로다"
    fallback: "dug_cave_max 0.08 여유는 **원장이 굴을 모르는 세계**(원장 도입 전에 판 굴)의 2차 방어로 남는다"
    mirror: "server-mvt TerrainAudit.dugCaveBoxes / inCaveBox — 하네스가 상자 판정을 시험한다"

  note: |
    ★ 우리가 판 동굴은 이 문턱 **안**에 있어야 한다 (그래야 검수가 "자연 동굴이 살아 있다"고
      거짓말하지 않는다). 원형별 파낸 부피와 반경 40 부지의 표본 밀도로 계산한 몫:

      은신처 ~1,400칸 → 표본 기여 ~0.8%   |  산적굴 ~1,300칸 → ~0.7%
      기연굴 ~  700칸 → ~0.4%             |  제단굴 ~2,100칸 → ~1.2%

    전부 2% 아래다. 다만 **한 부지에 굴을 둘 이상 파면 넘을 수 있다** — 그때는
    검수 규칙을 고쳐야 한다 (우리가 판 굴의 좌표를 알고 있으니, 그것을 빼고 세면 된다).

  # ═════════════════════════════════════════════════════════════════════════
  # ★★★ 연결성 면제 (connectivity_exempt) — **면제는 은닉이 아니다. 등록제다**
  # ═════════════════════════════════════════════════════════════════════════
  #
  #   ★ 전례를 따른다 — 팩 담당의 `NON_ICON` · `CENTER_EXEMPT` (tools/texture_audit.py):
  #       *"축이 시끄럽다고 파일을 숨기면 축은 조용해지고 세계가 깨진다."*
  #       *"**면제는 '재지 않는다'가 아니라 '다른 자로 잰다'는 뜻이다.**"*
  #
  #   ★★ 그러므로 여기 적는다. 검수는 이 항목을 **소리내어 읽고 면제를 선언한 뒤**,
  #      **그 자리에 다른 축을 세운다.** 조용히 넘어가는 자리를 만들지 않는다.
  connectivity_exempt:
    섬:
      axis: "④ 연결성 — 바깥에서 **걸어** 들어올 수 있는가"
      why: |
        ★★ **섬은 걸어 들어올 수 없어야 옳다.** 그것이 섬의 정의다.
          등록부 원문(§4 regions.해남): "섬 — **바다가 가른다**"
                    (§4 regions.동영):  "섬 — 바다가 가른다. **관문이 없다**"
        ★ 그런데 ④ 는 "네 방위에서 걸어 들어오라"고 요구한다 —
          **걸어서 갈 수 있는 해남파는 해남파가 아니다.**
        ★★★ 그러므로 ④ 를 섬에 들이대면 **눈이 틀린 것이지 땅이 틀린 것이 아니다.**
      decided_by: "★ 사용자 결정 (2026-07-13): '섬은 검수 ④(연결성) **면제**'"
      replaced_by: 나루            # ★★ 면제는 **구멍이 아니다** — 아래 축이 그 자리에 선다
      never_silent: "★ 검수는 면제를 **출력한다** (⊖ 로 표시). 조용히 건너뛰지 않는다"

  # ═════════════════════════════════════════════════════════════════════════
  # ★★★ 나루 축 (dock_axis) — **④ 의 자리에 서는 새 자**
  # ═════════════════════════════════════════════════════════════════════════
  #
  #   ★ 사용자 결정 (2026-07-13):
  #       *"「나루가 있는가」를 재는 새 축을 그 자리에 세워라.
  #         **섬은 빚되 배가 닿는 자리를 반드시 가져야 한다.**
  #         (배는 아직 없다. **땅이 배를 기다리며 선다** — 땅은 한 번만 서니까)"*
  #
  #   ★★ 두 축은 **거울이다**:
  #        ④ 연결성 — "**뭍에서 걸어** 들어올 수 있는가"   ← 섬에는 틀린 질문
  #        나루     — "**물에서 배로** 닿을 수 있는가"     ← 섬에는 옳은 질문
  #
  #   ★★★ 그리고 나루는 **면제의 대가다.** 섬이 ④ 를 면제받는 값이 이 축이다 —
  #      면제만 받고 아무것도 안 내면 그것은 **구멍**이지 면제가 아니다.
  dock_axis:
    applies_to: [섬]              # ★ terrain: 섬 인 곳 (world_map.yml 이 그렇게 선언한 곳)
    stands_for: 연결성            # ★ ④ 의 자리를 대신한다

    # ─── 무엇을 재는가 — **전부 객관 수치다** (TerrainAudit ④-나루가 인게임에서 잰다) ───
    measures: |
      ★ **배가 닿아 사람이 내려 걸어 들어갈 수 있는 자리가 하나라도 있는가.**
        셋을 **동시에** 만족하는 점이 하나라도 있으면 나루가 있다:
          ① **물이 있다**       — 부지 둘레에 물이 닿는다 (바다·강)
          ② **배가 뜬다**       — 그 물의 수심이 min_depth 이상이고, 바깥으로 open_run 칸 이상 열려 있다
                                 (★ **웅덩이는 나루가 아니다** — 배가 들어올 수 없으므로)
          ③ **내려서 걷는다**   — 그 물가에서 조성 중심까지 **걸어갈 수 있다** (BFS — ④ 와 같은 손)
      ★★ ③ 이 핵심이다. 물만 닿고 절벽이면 그것은 나루가 아니라 **벼랑**이다 —
        배는 닿는데 사람이 못 내린다. **닿는 것과 내리는 것은 다르다.**
    min_depth: 2                  # 배가 뜨는 최소 수심 (칸)
    open_run: 12                  # 물이 바깥으로 이어져야 하는 최소 거리 (칸) — 웅덩이 배제
    min_docks: 1                  # ★ **하나면 된다.** 섬에 사방의 나루를 요구하지 않는다
    violation: "나루없음 — ★ **배가 닿을 자리가 없다.** 섬이되 아무도 못 오는 땅이다"

    # ─── ★ 등록 — 나루를 가져야 하는 곳 (linter 가 이 목록과 world_map 의 `terrain: 섬` 을 대조한다) ───
    #   ★★ 여기 빠진 섬이 있으면 **린트가 짖는다** — 면제만 받고 축을 안 세운 섬은 **구멍**이다
    places:
      haenam:
        why: "★ 해남파 — '바닷가 검문(劍門)'. 등록부: '중원 남쪽 끝. **바다를 건너야 한다** —
          수로채·상단의 배가 **유일한 길**'. ★ 배가 유일한 길이면 **나루는 선택이 아니라 필수다**"
        expect: "★ 검문(劍門)이 바다를 향해 선다 — 배에서 내려 산문까지 걸어 오를 수 있어야 한다"
      dongyeong_do:
        why: "★ 동영도 — '섬. 바다가 가른다. **관문이 없다**'.
          ★★ 그리고 이 섬의 나루는 **양방향이다**: 우리가 가는 배(밀선)와 **그들이 오는 배(왜구)**.
            등록부 원문: '★ 그래서 왜구가 온다. **바다에는 문이 없다**'
          ⇒ **왜구가 뜨는 자리가 곧 이 나루다.** 나루가 없으면 왜구도 없다"
        expect: "★ 배가 뜨는 물 — 해적선이 나가는 자리"

    # ─── ★★ 아직 못 하는 것 — **숨기지 않는다** ───
    not_yet: |
      ★ **배가 없다.** (사용자: "배는 아직 없다.") 그래서 이 축은 지금 **땅만 잰다** —
        "배가 닿을 수 있는 땅인가"를 재고, 실제로 배가 닿는지는 못 잰다.
      ★★ 그럼에도 **지금 재야 한다**: **땅은 한 번만 선다.**
        배가 생긴 뒤에 나루가 없는 것을 발견하면 **그때는 못 고친다** (TerrainSeal).
      ★ 그리고 **바다를 파는 손도 아직 없다** (pending.섬 참조) — 지금 두 섬은 바닐라 해안에 앉는다.
        그 해안에 나루가 서는지를 이 축이 **정직하게** 재고, 없으면 **위반으로 짖는다**
