# ═══════════════════════════════════════════════════════════════════════════
# 지형 계층 (TerrainForge) — 땅의 등록부
# ═══════════════════════════════════════════════════════════════════════════
#
# 사용자 판정:
#   "별개의 시스템이 필요하다 — 1. 지형 생성 에이전트  2. 건물·마을 생성 에이전트.
#    두 개로 역할 분담하고 **지도를 통해 관리**되게 진행"
#   "자연동굴 제거 및 필요하면 그때 동굴의 형태로 생성하기 (통제가 힘들기 때문)"
#
# 이 파일은 **땅의 주문서**다. 집의 주문서는 world_map.yml 이고, 여기는 그 땅 쪽 각주다.
#   · world_map.yml — 어디에 무엇이 서는가 (좌표·지형·세력·등급)
#   · terrain.yml   — 그 땅을 어떻게 빚는가 (계약 상수·동굴 등록부)
#
# 없어도 돈다. TerrainForge 는 이 파일이 없으면 **지도에서 원형을 읽어 낸다**
#   (마교 전초의 architecture 가 이미 "동굴과 석실"이라고 적혀 있다 — 등록부를 두 번 쓰지 않는다).
version: 1

# ───────────────────────────────────────────────────────────────────────────
# 1. 계약 (contract) — 지형 계층이 건축 계층에게 보장하는 것
# ───────────────────────────────────────────────────────────────────────────
#
# ★ 지금은 **문서다** (TerrainForge 의 상수가 원천이다). 여기 적는 이유는
#   환경 검수(TerrainAudit)의 문턱과 이 값이 **같은 이야기를 해야** 하기 때문이다.
contract:
  seal_depth: 6                 # ① 조성 지면 아래 6칸은 단단하다 (TerrainForge.SEAL_DEPTH)
  feather_width: 22             # ② 경계 전이대 — 부지 밖 22칸에 걸쳐 자연으로 수렴한다
  build_max_step: 3             # 건축 가능 최대 경사 — 이웃 칸과 3칸 넘게 벌어지면 집을 못 앉힌다
  water_rule: "물 위에는 건축 마스크를 주지 않는다. 공중의 물·고인 물은 치운다. 강은 메우지 않는다"
  lift_mountain: 36             # ④ 험산·산을 주문했는데 없으면 세우는 봉우리의 높이 (문전 → 본전)
  lift_plateau: 22              # 고원 — 오르는 산이 아니라 **올라선 들**이다

# ───────────────────────────────────────────────────────────────────────────
# 2. 동굴 등록부 (caves) — **우리가 판다**
# ───────────────────────────────────────────────────────────────────────────
#
# 자연 동굴은 데이터팩(worldgen/honcheon_no_caves)으로 껐다. 지하 공동 10.08% → ~0%.
# 그런데 등록부는 동굴을 요구한다. 그러면 **우리가 판다** — 우리가 정한 형태로, 우리가 정한 자리에.
#
# 원형 넷 (docs/design/cave_archetypes.md):
#   은신처 — 마교 전초. 입구가 좁고 통로가 길다(44칸). 안쪽에 석실 둘. 깊이 18
#   기연굴 — 폐사당 지하·옛 문파 터. 짧은 통로(24) + 방 하나. 깊이 11
#   산적굴 — 녹림. 입구가 넓다(짐을 들여야 한다). 짧고 굵다(18). 깊이 7
#   제단굴 — 혈교 폐사. 깊이 내려간다(22). 방이 넓고 천장이 높다
#
# 공통 규약: **광원이 없다** (어둠이 동굴의 값이다) · 입구는 비탈에 뚫린다 · 결정론(좌표 해시)
caves:

  # ── 마(魔) — "동굴과 석실. 사람이 사는 흔적을 지운다" (world_map.yml magyo_jinryeong) ──
  magyo_jinryeong:
    archetype: 은신처
    note: "★ 청하현에서 나흘. 가장 가까운 마(魔). 잠식이 진행돼야 존재를 안다 — 그래서 굴이다"

  hyeolgyo_jedan:
    archetype: 제단굴
    note: "혈교 옛 제단 (복우산 폐사). 폐사당 → 복우산 → 남만, 3단 사슬의 가운데 고리"

  hyeolgyo_eungeo:
    archetype: 은신처
    note: "남만 심산의 은거지 — 밀림이 굴을 덮는다"

  # ── 기연 — 폐허가 기연이 앉는 자리다 ──
  abandoned_shrine:
    archetype: 기연굴
    note: "★ 폐사당 지하. 취걸개 기연(fortune_encounters)의 무대 밑. 금기 사슬의 첫 고리"

  goguk_terra:
    archetype: 기연굴
    note: "고국 폐허 (진령 옛 문파 터) — 앞으로 들어올 기연·무공의 출처. 비워 둔 자리"

  # ── 녹림 — 도적은 굴에 짐을 쟁인다 ──
  nokrim_sochae:
    archetype: 산적굴
  nokrim_jungchae:
    archetype: 산적굴
  nokrim_chongchae:
    archetype: 산적굴
  # nokrim_sangil 은 굴이 없다 — 산길은 길이지 소굴이 아니다 (TerrainForge 가 명시적으로 뺀다)

# ───────────────────────────────────────────────────────────────────────────
# 3. 검수와의 약속 (audit)
# ───────────────────────────────────────────────────────────────────────────
audit:
  underground_void_max: 0.02    # 환경 검수 ⑥ — 지하 공동 2% 문턱
  note: |
    ★ 우리가 판 동굴은 이 문턱 **안**에 있어야 한다 (그래야 검수가 "자연 동굴이 살아 있다"고
      거짓말하지 않는다). 원형별 파낸 부피와 반경 40 부지의 표본 밀도로 계산한 몫:

      은신처 ~1,400칸 → 표본 기여 ~0.8%   |  산적굴 ~1,300칸 → ~0.7%
      기연굴 ~  700칸 → ~0.4%             |  제단굴 ~2,100칸 → ~1.2%

    전부 2% 아래다. 다만 **한 부지에 굴을 둘 이상 파면 넘을 수 있다** — 그때는
    검수 규칙을 고쳐야 한다 (우리가 판 굴의 좌표를 알고 있으니, 그것을 빼고 세면 된다).
