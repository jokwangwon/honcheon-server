# ═══════════════════════════════════════════════════════════════════════════
# 요청(要請) — 건축이 땅에게 말을 거는 **유일한 문**
# ═══════════════════════════════════════════════════════════════════════════
#
# 사용자 판정:
#   "땅에 맞게 건물이 올라가는 것이지 **건축에 맞게 지형 생기는 게 아니다**.
#    대신 건축에서 '이 부분은 **마을 내 소형 개울**이 있으면 좋겠다' 싶으면
#    **지형을 조금 수정하는 형태로** 건축이 되어야 합니다."
#   "**요청이 개울 이거 하나가 아닙니다** — 마을에 **특수한 무언가가 있으면 좋겠다** 등
#    **건축 디자인의 요청대로 변할 순 있어야** 합니다."
#
# ★ 그러므로 이것은 「개울 기능」이 아니라 **어휘(語彙)** 다.
#   요청을 하나씩 코딩하면 끝이 없다 (개울·온천·절벽·협곡·계단밭·바위턱·연못·우물…).
#   **원시(primitive)를 찾아야 한다.**
#
# ───────────────────────────────────────────────────────────────────────────
# 어휘 — **연산 5 × 모양 3 × 높이 앵커**. 이것으로 전부 적힌다
# ───────────────────────────────────────────────────────────────────────────
#
#   op(연산)    고르기 — 목표 높이로 평탄화한다 (깎고·채우고·봉인)   [연무장·마당·계단밭]
#               깎기   — 목표 높이 위를 걷어낸다 (채우지 않는다)      [절벽·협곡]
#               쌓기   — 목표 높이까지 돋운다 (깎지 않는다)           [기단·바위턱·둔덕]
#               물     — 파고·물을 채우고·봉인한다                    [개울·못·온천]
#               표층   — 표층 자재만 간다 (형상은 안 건드린다)        [밭·자갈마당·진창]
#
#   shape(모양) 원   — at + r
#               상자 — at + half: [w, d]
#               길   — path: [[x,z], …] + width      ← 개울·협곡·산책로
#
#   y(높이)     ground | peak | 정수   (± 오프셋:  peak-16 · ground-2 · 74+3)
#               ★ 부지 중심 기준 상대 좌표다. **부지가 옮겨 앉아도 요청이 따라간다**
#
# ★★ 새 요청을 더할 때 **자바를 고쳐야 한다면 그 문법이 잘못 설계된 것이다.**
#     아래 예시는 전부 **이 파일만 고쳐서** 만들어진다.
#
# ───────────────────────────────────────────────────────────────────────────
# 계약 (어휘가 넓을수록 문은 좁아야 한다)
# ───────────────────────────────────────────────────────────────────────────
#   1. 건축은 **직접 땅을 파지 않는다.** 여기 적고, **땅(LandRequest)이 집행한다**
#   2. 집행은 prepare() 다음, 건축 **앞**이다 → **지형 원장에 적힌다**
#      → 건물을 다시 지어도 **이미 거기 있으므로 아무것도 안 바뀐다** (TerrainSeal 이 잰다)
#   3. **경계를 넘으면 거절하고 말한다** (RiverForge 가 "부지가 이미 물이다"라고 거절한 그 전례)
#   4. **결정론** — 좌표는 등록부가 준다. 난수가 없다. 같은 마을 = 같은 개울·같은 절벽
version: 1

# ───────────────────────────────────────────────────────────────────────────
# 경계 — 넘으면 **거절한다**
# ───────────────────────────────────────────────────────────────────────────
limits:
  max_requests: 12     # 한 부지에 이만큼까지. 땅은 건축의 도화지가 아니다
  max_radius: 16       # 원·상자의 반경 상한
  max_width: 6         # 길의 폭 상한 (개울이지 강이 아니다)
  max_path: 120        # 길의 길이 상한 — **마을 안**이지 산을 가르는 것이 아니다
  max_depth: 12        # 물의 수심 상한. 더 깊은 물이 필요하면 그건 **강**이다 → rivers.yml
  max_lift: 10         # 쌓기의 돋움 상한. 더 높이려면 그건 **산**이다 → terrain.yml 의 lift:
  # ★ 그리고 코드가 강제하는 것 둘 (등록부가 못 넘는다):
  #   · 요청은 **부지 안**이다 (radius - 8 을 못 넘는다 — 전이대를 부수면 마을이 섬이 된다)
  #   · 물의 수면은 **조성 지면 +3** 을 못 넘는다 (환경 검수 ②가 '산 위의 웅덩이'로 센다)

# ───────────────────────────────────────────────────────────────────────────
# 요청 — ★ **등록된 것만 집행한다. 코드가 요청을 지어내지 않는다**
# ───────────────────────────────────────────────────────────────────────────
#
# ★ 지금은 **비어 있다.** 그것이 옳다 —
#   지금 서 있는 일곱 곳은 요청 없이 섰고, 요청을 넣으면 **그 땅이 바뀐다**(= 재조성이 필요하다).
#   문법과 문을 먼저 세우고, **무엇을 요청할지는 건축이 말할 때 적는다.**
#   아래는 **문법이 무엇을 표현할 수 있는가**를 보이는 예시다 (주석 — 집행되지 않는다).
#
# ┌─ 예시 1. "이 문파 본전 뒤엔 **절벽**이 있어야 한다"  (화산파)
# │   - name: "본전 뒤 절벽 — 오르는 길이 시험이다"
# │     op: 깎기          # 채우지 않는다. 벼랑은 벼랑이다
# │     shape: 상자
# │     at: [0, -30]      # 본전 뒤 (북쪽)
# │     half: [14, 5]
# │     y: peak-16        # 정상보다 16칸 아래까지 파낸다 → 본전 뒤가 수직으로 떨어진다
# │
# ├─ 예시 2. "**연무장** 자리는 평평해야 한다"  (화산파)
# │   - name: "연무장 — 발이 미끄러지면 초식이 죽는다"
# │     op: 고르기
# │     shape: 원
# │     at: [0, 14]
# │     r: 12
# │     y: peak
# │     material: 다진흙
# │
# ├─ 예시 3. "마을에 **소형 개울**이 흐르면 좋겠다"  (청하현 — 사용자가 명시한 그것)
# │   - name: "장터 뒤 개울 — 아낙이 빨래한다"
# │     op: 물
# │     shape: 길
# │     path: [[-38, 14], [-16, 22], [8, 20], [30, 28]]
# │     width: 3
# │     depth: 2
# │     y: ground-1       # 수면은 지면보다 낮다 (검수 ②가 '웅덩이'로 안 센다)
# │
# ├─ 예시 4. "**온천**이 솟는다"  (어느 산마을)
# │   - name: "온천 — 눈 속에서 김이 오른다"
# │     op: 물
# │     shape: 원
# │     at: [22, -8]
# │     r: 6
# │     depth: 3
# │     y: ground-1
# │
# ├─ 예시 5. "**산문 앞에 협곡**이 갈라진다"
# │   - name: "협곡 — 다리를 놓기 전에는 못 건넌다"
# │     op: 깎기
# │     shape: 길
# │     path: [[-40, 40], [0, 44], [40, 40]]
# │     width: 6
# │     y: ground-9
# │
# ├─ 예시 6. "이 객잔은 **바위 턱**에 걸터앉는다"
# │   - name: "바위 턱 — 객잔이 여기 앉는다"
# │     op: 쌓기
# │     shape: 상자
# │     at: [-24, 6]
# │     half: [7, 5]
# │     y: ground+4
# │     material: 돌
# │
# └─ 예시 7. "약초원은 **계단식 밭**이어야 한다"  (같은 원시를 y 만 달리해 세 번)
#     - { name: "약초원 상단", op: 고르기, shape: 상자, at: [30, -6], half: [8, 4], y: ground+4, material: 밭흙 }
#     - { name: "약초원 중단", op: 고르기, shape: 상자, at: [30,  4], half: [8, 4], y: ground+2, material: 밭흙 }
#     - { name: "약초원 하단", op: 고르기, shape: 상자, at: [30, 14], half: [8, 4], y: ground,   material: 밭흙 }
#
# ★ 일곱 예시 전부가 **다섯 원시 × 세 모양** 으로 적혔다. 자바는 한 줄도 안 바뀐다.
requests: {}
