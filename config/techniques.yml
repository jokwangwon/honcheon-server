# ══════════════════════════════════════════════════════════════════════════
# 기법 사전 — 동양 목조 건축의 <b>부재와 쌓임</b>을 그래프로 적는다
# ══════════════════════════════════════════════════════════════════════════
#   왜 있나: 지금까지 기둥 처방(`columns:`)을 <b>손으로</b> 적었다. 그래서
#     · 높이를 12 로 맞추려고 사람이 켜를 세어 더했고 (여러 번 틀렸다)
#     · 「창방은 모든 칸이 같은 높이」 같은 규칙이 <b>주석에만</b> 있었고
#     · 산문·강당에 같은 기법을 쓰려면 처방을 통째로 베껴야 했다
#
#   여기서는 <b>부재(노드)</b>와 <b>쌓임(간선)</b>만 적는다. 켜 수는 <b>풀린다</b> —
#   「기둥 높이 12」를 주면 몸통 켜가 스스로 정해진다.
#
#   ★재료 이름은 `$이름` 으로 <b>비워 둘 수 있다</b>. 요청이 채운다 (팔레트).
#   ★`fill` 인 부재는 <b>남는 켜를 먹는다</b> — 한 쌓임에 하나만 있어야 한다.

# ── 부재 (노드) ────────────────────────────────────────────────────────────
members:
  기단:   {material: smooth_stone,      courses: 1, layer: base,    note: 몸체 안 바닥}
  주초:   {material: polished_andesite, courses: 1, layer: base,    note: 기둥이 딛는 돌}
  몸통:   {material: $post,             fill: true, layer: shaft,   note: 기둥 몸통 — 남는 켜를 먹는다}
  주두:   {material: dark_oak_planks,   courses: 1, layer: capital, note: 기둥 머리}
  머름:   {material: mangrove_planks,   courses: 1, layer: sill,    note: 창 밑 인방}
  살창:   {material: lattice,           fill: true, layer: infill,  note: 창호 — 남는 켜를 먹는다}
  회벽:   {material: plaster,           courses: 1, layer: infill,  note: 흰 벽 — 창 위의 가는 띠}
  # ★같은 재료가 <b>두 노릇</b>을 한다: 창호 칸에서는 가는 띠(1켜), 회벽 칸에서는 면(채움).
  #   그래서 부재를 <b>둘로 나눠 적는다</b> — 그러지 않으면 한 쌓임에 채움이 없어 못 푼다.
  회벽면: {material: plaster,           fill: true, layer: infill,  note: 흰 벽 — 칸을 채운다}
  빈칸:   {material: air,               fill: true, layer: infill,  note: 개구 — 걸어 지난다}
  창방:   {material: mangrove_planks,   courses: 1, layer: beam,    note: 기둥을 잇는 수평재}
  도리:   {material: dark_oak_slab,     courses: 1, layer: purlin,  note: 서까래를 받는다 — 반블록}
  긴보:   {material: dark_oak_log,      courses: 1, layer: plate,   note: 맨 위 한 켜 — 지붕과 부재를 가른다}

# ── 쌓임 (간선) — 아래에서 위로 ────────────────────────────────────────────
#   ★`창방·도리·긴보` 는 <b>모든 쌓임의 끝 세 켜</b>다. 그래야 수평 부재가
#     한 높이에서 이어진다 — 이 규칙이 주석이 아니라 <b>구조</b>가 된다.
stacks:
  적주:    [기단, 기단, 주초, 몸통, 창방, 도리, 긴보]
  모서리:  [기단, 기단, 주초, 몸통, 주두, 창방, 도리, 긴보]
  입구옆:  [기단, 기단, 주초, 몸통, 머름, 창방, 도리, 긴보]
  문설주:  [기단, 기단, 기단, 몸통, 주두, 창방, 도리, 긴보]
  창호:    [기단, 기단, 기단, 살창, 회벽, 창방, 도리, 긴보]
  회벽칸:  [기단, 기단, 기단, 머름, 회벽면, 머름, 창방, 도리, 긴보]
  개구:    [기단, 기단, 기단, 빈칸, 창방, 도리, 긴보]

# ── 기법 (이름 붙은 규칙) ──────────────────────────────────────────────────
#   평면과 깊이를 만드는 법. 「어떤 기법을 쓸 것인가」로 요청한다.
techniques:
  툇간:
    설명: 적주가 앞으로 나오고 벽이 물러난다 — 사이에 실제 빈 칸이 생긴다
    depth: {적주: 1, 모서리: 1, 입구옆: 1, 문설주: 1, 창호: 0, 회벽칸: -1, 개구: -1}
  민면:
    설명: 모두 한 면 — 소박한 집
    depth: {적주: 0, 모서리: 0, 입구옆: 0, 문설주: 0, 창호: 0, 회벽칸: 0, 개구: 0}
  다포:
    설명: 포를 기둥 위뿐 아니라 기둥 <b>사이</b>에도 둔다
    intercolumnar: true
  주심포:
    설명: 포는 기둥 위에만
    intercolumnar: false
  겹처마:
    설명: 서까래 위에 부연 한 겹 — 처마 밑 그림자 선이 두 줄
    two_tier_eave: true

# ── 위계 (Codex 2026-08-11) ───────────────────────────────────────────────
#   격이 낮을수록 기법을 <b>덜어 쓴다</b>. 새 기법을 만들지 않는다.
ranks:
  본전:   [툇간, 다포, 겹처마]
  중위전각: [툇간, 다포]
  강당:   [툇간, 주심포]
  창고:   [민면, 주심포]
