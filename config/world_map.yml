      places: [seoyeok_gochang, donhwang]
      effort: 중간
    W4:
      what: "설원 덧입힘을 고원(LIFT_PLATEAU)에도 적용"
      why: "토번 = 고원 + 눈. ★ W1 이 끝나면 거의 공짜다"
      places: [seolyeok_daesa]
      effort: 낮음
    W5:
      what: "config/terrain.yml shaping: 에 새외 장소 등재 (Profile 강제 지정)"
      why: "★ TerrainForge.PEAK_FACTIONS 는 **하드코딩**이고 새외 세력이 거기 없다 —
        설역 대사(밀교 대사원)가 Profile.중턱단 으로 떨어진다.
        shaping: 이 그 우회로다 — **등록부가 코드보다 세다** (profile() 이 shapeRegistry 를 먼저 본다)"
      effort: 낮음
      proposed_patch: |
        # ★ config/terrain.yml 은 **소유자가 다르다** — 조각만 제안한다.
