# ═══════════════════════════════════════════════════════════════════════════
# 10. 청하현 무대 좌표 (cheongha_stage) — 마을 중심 기준. **CheonghaBuilder 실측값**
# ═══════════════════════════════════════════════════════════════════════════
#
# ★ 이 값들은 CheonghaBuilder 가 실제로 짓는 오프셋이다. **바꾸지 마라** — 코드가 원천이다.
#   여기 적는 이유는 봇·LLM 이 "폐사당이 마을 어느 쪽이냐"를 물을 때 답할 데가 있어야 하기 때문이다.
#
# 무대(stage)란: 조성된 반경 1,500블록의 1:1 공간. **여기 안은 걷는다.** 밖은 여정이다.

cheongha_stage:
  center: [0, 0]                    # 장터 = 마을 중심 = 세계 원점
  radius: 1500                      # map_spec outskirt_radius
  walkable: true                    # ★ 도보권 — 여정 명령을 쓰지 않는다
  anchors:                          # CheonghaBuilder anchors (village_tiers anchor_keys_immutable)
    장터:       { pos: [0, 0],      bearing: "중심" }
    청하객잔:    { pos: [-20, -12],  bearing: "서북" }
    의뢰소:      { pos: [11, -17],   bearing: "북동" }
    의방:        { pos: [-24, 8],    bearing: "서남" }
    전장:        { pos: [12, 8],     bearing: "동남" }
    표국:        { pos: [0, 0],      bearing: "마을 안 (PY 상수)" }
    북쪽_산길:   { pos: [0, -59],    bearing: "북 — 대로 끝 이정표" }
  outskirts:                        # 담장 밖 — 평탄화 없음
    폐사당:      { pos: [-82, -75],  bearing: "북서 외곽 숲", terrain: 폐허, search: SHRINE_SITES }
    사냥터:      { pos: [-10, -122], bearing: "북쪽 산길 너머", terrain: 산, ellipse: [32, 30] }
    흑수나루:    { pos: [118, 12],   bearing: "동 — 강가", terrain: 물가, search: FERRY_SITES }
  hidden:
    북쪽_골목_창고: { pos: [-20, -20], bearing: "객잔 뒷골목", note: "하오문 거점. 등록부 north_alley_warehouse (hidden: true)" }
  note: |
    ★ 무대 안의 거리는 세계 축척과 같다 (1블록 = 1m). 다만 **압축된 무대**다:
      실제 청하현 현역(縣域)은 반경 20 km 지만, 조성하는 것은 현성과 그 주변 1.5 km 뿐이다.
      나머지는 자연 지형이 그대로 현역을 대신한다 — 들과 산이 곧 현이다.
    성문에서 폐사당까지 약 110블록 = 도보 30초. **걸을 만하다.** 이것이 국지 스케일이다.

