        grants: [황성_임시_출입, 1회성]
        note: "★ 문 앞까지만 간다. 안으로는 못 들어간다 — 그것이 청부다"
      세력_밀사:
        name: "세력의 밀사"
        requires: { faction_any: [hwasan, sorimsa, mudang, dangga, namgung, paengga], favor_min: 13 }
        grants: [황성_알현_1회]
        note: "★ 문파가 보낸다. 당신이 가는 게 아니다 — 역모 혐의를 벗으러 가는 사절이 그렇다"
      영원히_못_간다:
        who: "사파·녹림·수로채·살막·마교·혈교 소속, 또는 수배 이력이 있는 자"
        note: "★ 이들에게 경사의 문은 없다. 있다면 그것은 침입이고, 침입은 곧 역모다"

