places_official:                     # 관의 장소 — places 와 같은 문법
  cheongha_gwana:
    name: "청하현 관아"
    archetype: 관아                  # ★ 신설 (사용자 결정) — officialdom.hierarchy.현: `architecture: 관아급`
    build_radius: 32                # ★ 현(縣)의 관아 — 포쾌 12인. 부(48)보다 작다
    scale: 200
    builder: "CheonghaBuilder — ★ 계약은 RemoteBuilder 의 관아, **손은 CheonghaBuilder** (아래 판단)"
    builder_why: |
      ★★ **경계 판단 (조율자가 물었다: 청하현 관아를 누가 짓는가)**
        답: **원형(계약)은 RemoteBuilder 의 것, 손은 CheonghaBuilder 의 것이다.**

        이유 — **RemoteBuilder 로 지으면 마을이 갈아엎어진다.**
          RemoteBuilder 의 진입은 언제나 지형 계층을 **먼저** 부른다 (TerrainForge.prepare — 땅을 빚고,
          봉인하고, 전이대를 놓는다). 그런데 청하현 관아의 좌표는 (20, 20) — **장터에서 28칸**이다.
          거기서 지형 계층을 돌리면 **이미 선 마을 한복판의 땅을 다시 빚는다.**
          ★ 그리고 그것은 이 프로젝트의 헌법 위반이다: **땅은 한 번만 선다** (TerrainLedger · TerrainSeal).

        ★ 그러므로 갈라라 — **"무엇을 짓는가"는 원형이 정하고(관아 계약: 정청·마당·방 붙이는 벽·옥),
          "누가 짓는가"는 무대가 정한다.** 무대 안이면 CheonghaBuilder, 무대 밖이면 RemoteBuilder.
        ★ 이 규칙은 이미 선례가 있다: 산길 도적(nokrim_sangil)도 무대 안이라 CheonghaBuilder 가 짓는다
    pos: [20, 20]                    # ★ 무대 좌표 (등록부 county_office — 아직 CheonghaBuilder 미조성)
    stage_local: true
    region: 섬서
    rank: 현
    terrain: 평지
    tier: rich                        # 관아급 — 마을에서 가장 단단한 집 (village_tiers parcel_override 문법)
