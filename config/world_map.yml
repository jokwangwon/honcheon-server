    npcs: [jomunwon, bakho]
    force: "포쾌 12인 (삼류) + 포두 박호 (이류)"
    access: 항상
    build: later                      # ★ CheonghaBuilder 가 아직 안 짓는다 — 등록부에만 있다 (다음 과업)
    registry: 등록됨                   # regions/cheongha_hyeon.yml county_office
    note: "★ 등록부에 있는데 조성이 없다. 청하현에서 유일하게 무대가 빈 등록 장소 — 다음 과업 후보"

