        requires: { realm_min: 절정, 명성: 높음, faction: gwan_gun, favor_min: 13 }
        grants: [황제_직속, 관무불가침_면제권, 무림_수사권]
        price: "★ 강호 전체의 적. 금의위는 무림이 가장 미워하는 이름이다"
        note: "★ 마교 잠식의 표적이기도 하다 (breach.마교_잠식) — 이 자리에 마교 첩자가 앉는다"
      호위_청부:
