    # ── ★★★ 녹림석채 — 녹림 총채. **예외이고, 예외는 이름을 가져야 전파되지 않는다** ──
    녹림석채:
      for: noklim
      archetype_name: "녹림 석채 (綠林石寨)"     # ★ 「석성」이 아니다 — 녹림에 한정된 이름이다
      only: [nokrim_chongchae]       # ★★★ **이 원형이 사는 곳의 전부다.** 다른 산채는 목책이다
      r: 48                          # ← 영향력 8. ★ 산채의 pinned 24 를 **타지 않는다** (예외이므로)
      architecture_family: mountain_bandit_stone_stronghold
      exception_rule: greenwood_headquarters
      fortification: stone
      계약: "★ **산악형 석축 총채.** 자연 암벽·능선·협곡을 방어선으로 삼고 **빈틈에만** 석벽과 문루를 세운다.
        평지 성곽처럼 사방을 완전한 성벽으로 **둘러싸지 않는다** — 접근 가능한 능선과 협곡만 봉쇄한다.
        ① **외채문** — 목책 아닌 **석벽과 철문**. 거대한 정문이 아니라 **좁고 깊은 살상 통로**. 길을 꺾는다
        ② **하채** — 외부인·행상·포로·하급. ★ **핵심부와 직접 연결되지 않도록 중간 관문**
        ③ ★★ **녹림 시장** — 등록부의 '약탈물 창고와 시장'의 핵심. 천막·가판대·개조 건물이 밀집해
             **끊임없이 형태가 변한다** (정식 도시 시장처럼 깨끗하고 계획적이지 **않다**)
        ④ ★★ **대창고군** — 곡물·병기·직물·귀중품·잠금 보물고. 화재와 내부 약탈을 막으려 **생활 구역과 분리**
        ⑤ **중채** — 두령과 정예. 관청·귀족 저택처럼 **정제되지 않는다**
        ⑥ **총표파자 / 취의당** — 권력의 중심. ★ **호화로운 왕좌나 궁전을 두지 않는다** —
             권위는 장식이 아니라 **넓은 회의 공간·무기·깃발·여러 산채의 표식**으로
        ⑦ **상채와 비상 퇴로** — 가장 높은 능선. ★ 비상 퇴로는 **총채 내부에서만** 확인 가능"
      재료: "★ **석축이라고 모든 건물을 돌로 짓지 않는다:**
        방어벽·핵심 창고 = **석축** / 생활 건물·시장 = **목조** / 임시 구역 = **천막·가설물** / 문·보강 = **철재**.
        빼앗은 석재·목재·기와가 **섞여** 재료가 통일되지 않는다.
        ⇒ 전체 인상은 '돌로 지은 도시'가 아니라 **「돌로 지킨 거대한 산적 공동체」**"
      금지: "★ 직선 축 · 대칭 배치 · 정규 도로망을 **쓰지 않는다.** 산세와 암반에 따라 **불규칙하게 누적**된다.
        ★★ **기존 산채 원형의 「통나무 200 · 짚 10」 계약을 적용하지 않는다**"
      검수: "① 일반 목책 산채와 **즉시 구별**되는가  ② 석축이 **자연 산세와 연결**되는가
        ③ 반경 48 을 **실제 기능 공간이 사용**하는가  ④ **시장과 대창고가 총채의 핵심**으로 드러나는가
        ⑤ **여러 산채의 연합 본부**로 보이는가  ⑥ 관부 성곽처럼 **정형화되지 않았는가**
        ⑦ 마교 흑성과 **다른 재료·배치·권력 구조**인가
        ⑧ ★★★ **녹림 총채 이외의 산채에 석축 예외가 전파되지 않는가** (린트가 이것을 짖는다)"
      근거: "docs/design/noklim_seokchae.md — ★ 사용자가 직접 설계했다 (2026-07-13)"

