        shaping:
          seolyeok_daesa:      봉우리    # ★ 절벽에 박힌 대사원 — 소림보다 크다
          baehwa_seonghwadan:  들        # 사막 제단 — 세우지 않는다
          seoyeok_gochang:     들
          donhwang:            들
          bukmak_hanjeong:     들        # ★ 천막이다. 세울 것이 없다
          odokgyo_odokchae:    그대로    # 밀림은 자연이 준 대로
          dongyeong_do:        그대로    # ★ 섬은 빚지 않는다
    W6:
      what: "★ **하지 않을 것** — 섬 원형"
      why: "물을 만드는 것은 현 계약(terrain_layer §5) 밖이다. 바다 바이옴은 **안 껐으므로** 자연에 맡긴다.
        ★ 해남파가 이미 그렇게 서 있다 (terrain: 섬 → Profile.그대로) — **선례를 따른다**"
      effort: 없음
    order: "★ W1 → W2 → (W5) → W3 → W4.  **W1·W2 는 새외가 아니라 중원을 위한 것이다** —
      곤륜과 가욕관은 이미 등록돼 있고 지금 깨져 있다. 새외 7 좌표는 전부 build: later 다"

  # ─── ★ 세계 순도 담당과의 교차 확인 — **이미 착지했다** (읽기만 했다. 안 건드렸다) ───
  cross_check_worldgen:
    ref: "config/world_purity.yml · worldgen/honcheon_purity · worldgen/honcheon_no_caves"
    착지_상태: |
      ★ 인게임 실측 통과 (2026-07):
        · 바닐라 구조물 20종 + placed_feature 4종 제거 — /locate 로 "찾을 수 없음" 확인
        · **바이옴 12종 재배치** — desert → savanna/beach · snowy_* → plains/taiga/grove ·
          frozen_peaks → jagged_peaks · ice_spikes → plains …
        · ★ **남긴 것**: grove(고산 침엽수림) · badlands(황토고원) · savanna · cherry_grove ·
          plains · jungle · ocean/beach
      ★ 방법이 영리하다: 바이옴을 **삭제하지 않고** 기후 구획의 **이름표만 바꿨다** —
        기후 공간에 구멍도 겹침도 안 생긴다. 레지스트리가 안 깨진다
    내가_한_것: "★ world_map.yml 의 `biomes:` **17줄을 remap 표 그대로 갱신했다** (§3-b biome_policy).
      순도 담당이 보고한 conflicts_with_world_map 4건(하북·산서·청해_서역·새외_북막) 전부 해소"
    확인_1_좌표는_안전하다: |
      ★★ **부지 판정은 바이옴을 안 본다.** terrain_types(§3)는 water_pct·relief·mean_y 로만 정의돼 있다.
        → 순도 작업이 등록 좌표를 **하나도 못 옮긴다.** 이것이 이 설계가 견디는 이유다
    확인_2_사막과_설산은_여전히_가능하다: |
      ★★ **눈과 모래는 블록이지 바이옴이 아니다.** 순도 담당도 같은 결론을 적었다
        (world_purity conflicts_with_world_map.청해_서역:
         "그래도 설산은 만들 수 있다 — TerrainForge 가 산을 세우고 그 위에 눈을 얹으면 된다").
      ★ 그래서 조율 판단이 성립한다: **끈다 — 무작위는. 만든다 — 등록 좌표는.**
    남은_것: |
      ★★ 그런데 **'만든다'가 아직 코드에 없다.** 그것이 §15 의 전부다:
        · TerrainForge.profile() switch 에 '사막'이 **없다** → default → Profile.그대로 (아무것도 안 함)
        · grassOrStone() 은 주변 SAND/SNOW 를 **읽어서 따라갈** 뿐, **만들지 못한다**
        · raiseMassif() 팔레트는 STONE/DEEPSLATE/ANDESITE **하드코딩** — 눈이 없다
      ★ 순도 담당이 사막·빙설 바이옴을 껐으므로 — **이제 읽을 모래도, 따라갈 눈도 없다.**
        → W1(설선 팔레트) · W2(사막 원형)가 **곤륜·가욕관을 위해 필요하다.** 새외보다 먼저다
    verdict: "★ 순도 담당의 판단에 이견 없다. 오히려 **그 판단이 이 요청서를 필요하게 만들었다** —
      그리고 그것이 옳은 순서다: **먼저 통제 불가능한 것을 끄고, 그다음 필요한 것을 만든다**"

# ═══════════════════════════════════════════════════════════════════════════
# 16. ★★ 건축 원형 (archetypes) + 청구서 — **집이 무엇인지 지도가 말한다**
# ═══════════════════════════════════════════════════════════════════════════
#
# ─────────────────────────────────────────────────────────────────────────────
# ★★★ 왜 이 절이 필요한가 — **원형이 다섯뿐이라 45곳에 집이 없다**
#
#   좌표를 가진 장소는 65곳이다. 그중 RemoteBuilder.archetype() 이 원형을 골라 주는 곳은 **20곳**이고,
#   나머지 **45곳은 archetype == null** → build() 가 **빈 목록을 돌려준다** → 땅만 서고 집이 없다.
#
#   ★ 그중 일부는 **집이 없는 것이 옳다** (사냥터 8 · 산지 2 · 폐허 2 · 망 3 — 산과 약초밭에 집은 없다).
#   ★ 그러나 나머지는 **집이 있어야 하는데 없다**:
#       · 세가 5 (당가·팽가·남궁·제갈·모용)   ← ★ region_archetypes.md 는 도관이 덮는다고 적었는데 코드엔 없다
#       · 관 13 (관아·역참·부아·황성·군진 3·관문 2·시박사·유배지·남경)
#       · 도시·상단 4 (태원·무한·소주·강남 상로)
#       · 새외 7 (한정·고창·성화단·설역 대사·오독채·동영도·돈황)
#       · 마교 2 (본교 흑성 · 낙양 잠복지) · 독문 1
#
#   ★★ **지도가 무엇을 요구하는지 여기서 확정한다. 그러면 건축 담당이 무엇을 지을지 안다.**
#      나는 지도를 적는 사람이지 집을 짓는 사람이 아니다 — **계약(무엇이 있어야 그 집이 그 집인가)만 청구한다.**
# ─────────────────────────────────────────────────────────────────────────────

archetypes:
  owner: "건축 계층 (RemoteBuilder) — ★ 이 절의 registered 는 **사실**이고, requested 는 **청구**다"
  contract_source: "docs/design/region_archetypes.md §4 — '원형이 다섯이면 계약도 다섯이다'"

  # ─── 있는 것 (registered) — RemoteBuilder.Archetype enum **그대로.** 발명하지 않았다 ───
  #
  # ★★ **이 목록은 「주장」이 아니라 「사실」이다** — 코드가 실제로 지을 줄 아는 원형이다.
  #    린트(map_lint.py census)가 **RemoteBuilder.Archetype enum 을 소스에서 읽어 이 목록과 대조한다.**
  #    갈라지면 **지도가 거짓말하는 것이다** — 그래서 눈이 짖는다.
  #
  # ★ 2026-07-13 갱신: 건축 담당이 원형 **열여섯**을 enum 에 올렸다 (5 → 21).
  #   지도가 그것을 따라잡는다. **코드가 사실이고 지도는 그 사실을 적을 뿐이다.**
  registered:
    산채:   { faction: noklim,           계약: "통나무 200 · 모닥불 1 · 짚 10 · 망루 불 2",
              places: [nokrim_sochae, nokrim_jungchae, nokrim_sangil],
              note: "★★ **nokrim_chongchae 가 이 목록에서 빠졌다** — 총채는 「녹림석채」다 (명시적 예외).
                ★ 그러나 **예외는 여기서 끝난다**: 소채·중채·산길은 여전히 **목책**이다 (§17 exceptions)" }
    도관:   { faction: hwasan,           계약: "검은 기와 40 · 회벽 40 · 돌바닥 400 · 매화 20 · 석등 4",
              places: [hwasan],
