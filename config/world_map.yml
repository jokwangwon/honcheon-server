    faction: dongyeong
    danger: 4
    travel: { factor: 1.10, days: 57 }   # ★ 해로 — 새 road_factor
    travel_note: |
      ★★ **57일 — 새외 중 가장 가깝다.** 그리고 진짜 숫자는 이것이다:
        **소주(강남)에서 26일.** 소주 자체가 청하현에서 25일이니 — **하루 차이**다.
      ★ 그래서 왜구가 강남을 친다. 그리고 그래서 남궁세가가 거기 있다
    access: 해로                     # ★ 관문이 없다 — **바다에는 문이 없다**
    access_detail: |
      ★ 시박사(명주, 28일)가 유일한 합법 창구다. 그런데 **해금(海禁)** 이 걸려 있다 —
        관은 바다를 닫았다. 그래서 합법으로 가는 배가 거의 없다.
      ★ 남은 길 둘: **상단의 감합선(勘合船)** (sangdan favor 13+ — 드물다) 또는
        **수로채의 밀선(密船)** (jangang_suroche — 왜구와 밀무역 중이다. relations +1).
        ★ 즉 동영에 가려면 **사파의 배를 타야 한다.** 그리고 그 배는 돌아올 때 왜구의 물건을 싣는다
    entry_route: dongyeong_entry
    build: later
    scale: 1000
    player_map: true
    on_route: haero_dongyeong
    note: "★ 새외 다섯 중 **유일하게 지금 오고 있다.** 나머지는 '언젠가'이고 동영은 '올해'다"

  # ── 새외 상로의 중간 거점 (오아시스) — ★ 사막에서는 물이 곧 길이다
  donhwang:
