# 7. 길 (routes) — 관도·상로·수로. **길이 곧 사건이다**
# ═══════════════════════════════════════════════════════════════════════════
#
# 지역을 잇는 길이 지도의 뼈대다. 표국이 표행을 가는 길이고, 녹림이 노리는 길이다.
# 어느 길로 가느냐가 여정을 정한다 (travel.road_factor).

routes:

  gwando_cheongha_jangan:
    name: "청하현 ↔ 장안 관도"
    kind: 관도
    factor: 1.15
    waypoints: [[0, 0], [12000, 3000], [26000, 5500], [37800, 6600]]
    danger: 1
    note: "관군 순찰이 돈다. 표행의 기본 노선 — 청하 표국(진철산)의 밥줄"

  gwando_jangan_nakyang:
    name: "장안 ↔ 낙양 관도 (중원 대로)"
    kind: 관도
    factor: 1.15
    waypoints: [[37800, 6600], [127400, 31000], [230000, -5000], [368200, -32100]]
    danger: 3                       # ★ 녹림 중채가 이 길을 낀다
    hazards: [nokrim_jungchae]
    note: "★ 중원의 대동맥. 화산으로 가는 길도 이 관도의 첫 구간을 탄다"

  sangil_cheongha_hwasan:
    name: "청하현 ↔ 화산 산길"
    kind: 산길
    factor: 1.50
    waypoints: [[0, 0], [37800, 6600], [95000, -2000], [145400, -16600]]
    danger: 2
    hazards: [nokrim_jungchae]
    note: |
      ★ 봇 `/혼천 출행 화산`의 실제 경로. 도로거리 220 km ÷ 40 km/일 = **5일**.
      faction_entry_routes: "도중 산길 도적·표행 동승 — 여정 자체가 소문과 인연을 만든다"
      → 그 도적이 nokrim_jungchae 다. **여정 조우가 지도에서 성립한다**

  sangro_cheongha_dangga:
    name: "청하현 ↔ 사천 상로 (촉도)"
    kind: 험산
    factor: 1.80
    waypoints: [[0, 0], [-23600, 69700], [-150000, 200000], [-300000, 330000], [-422900, 405800]]
    danger: 4
    hazards: [nokrim_sochae, magyo_jinryeong]
    note: "★ 촉도난(蜀道難) — 거리 자체가 게이트. 26일. 진령을 넘어야 한다"

  sulo_jangang:
    name: "장강 수로"
    kind: 수로
    factor: 0.85
    waypoints: [[-422900, 405800], [231300, 213400], [415400, 550700], [543800, 413500], [703300, 510900], [1096000, 451100]]
    danger: 3
    hazards: [jangang_suroche]
    note: |
      ★ 사천(성도)에서 강남(항주)까지 물로 이어진다. 중원의 대동맥.
      **장강수로채가 왜 세력인지가 여기서 읽힌다** — 이 물길의 통행세를 그들이 걷는다.
      배는 걷는 것보다 빠르다 (factor 0.85). 그래서 상단은 물을 쓰고, 그래서 수로채에게 뜯긴다.

  sulo_wisu:
    name: "위수 수운"
    kind: 수로
    factor: 0.90
    waypoints: [[0, 0], [12000, 9000], [33000, 8800], [120000, -5000]]
    danger: 1
    note: "★ 흑수나루가 이 물길의 한 점이다 — 청하현이 왜 나루를 갖는가의 답"

  gwando_bukbang:
    name: "북방 관도 (하북·요동)"
    kind: 관도
    factor: 1.15
    waypoints: [[368200, -32100], [543800, -52000], [652300, -502000], [1380200, -767400]]
    danger: 2
    note: "하북팽가 → 모용세가. 새외와의 완충선"

  # ─────────────────────────────────────────────────────────────────────
  # ★ 새외로 나가는 길 — **관문에서 끝나거나, 관문에서 시작한다**
  #
  #   ★ 중원의 길(위)과 새외의 길(아래)의 차이 한 줄:
  #     중원의 길은 **위험하다** (녹림이 있다). 새외의 길은 **없다** (길 자체가 없다).
  #     그래서 새외의 길에는 hazards 대신 **survival** 이 붙는다 — 적이 아니라 땅이 죽인다
  # ─────────────────────────────────────────────────────────────────────

  sangro_silk:
    name: "비단길 (西域商路)"
    kind: 상로
    factor: 1.80                     # 가욕관까지 상로(1.20) / 그 밖은 사막(2.00) — 가중
    waypoints: [[0, 0], [-108600, -21000], [-968600, -604800], [-1311300, -642400], [-1828600, -953100], [-2421500, -814900]]
    #            청하현      봉상부           ★가욕관             돈황                 고창                  성화단
    danger: 3
    gate: gunjin_gayokgwan           # ★ 관문 — 노인(路引) 검문
    survival: "★ 오아시스를 놓치면 죽는다. 돈황(62일) → 고창(93일) 사이 30일 구간에 물이 두 곳뿐 —
      상단 동행이 아니면 여정 판정에 **갈증** 이 붙는다 (여비가 아니라 **물**이 자원이 된다)"
    mounts: [상단_낙타]
    note: |
      ★★ **새외에서 유일하게 '길'이라 부를 수 있는 것.** 나머지 넷은 길이 아니라 방향이다.
      ★ 그리고 이 길이 중원의 부(富)를 만든다: 비단·차·철이 나가고 옥·말·향료·약이 들어온다.
        가욕관이 관세를 걷는다 → 그래서 관은 상맹과 우호(+1)다 (faction_politics relations).
      ★ 훅: **이 길이 끊기면 상단연합이 흔들린다** (myeongbun.inputs.상단로_장기_봉쇄 — 생계 태그).
        북막이 이 길을 끊는 것이 중원을 치는 가장 싼 방법이다. 대칸은 그것을 안다

  sangro_chama:
    name: "차마고도 (茶馬古道)"
    kind: 험산
    factor: 2.00
    waypoints: [[0, 0], [-23600, 69700], [-422900, 405800], [-467300, 185800], [-1645500, 517500]]
    #            청하현    진령 심산        ★사천당가          ★송반관             설역 대사
    danger: 4
    gate: gwanmun_songban            # ★ 관문 — 통관첩(通關牒). **승려·도사만 받는다**
    survival: "★ 고산병(高山病). 고원에 오르면 원기 회복이 절반이 된다 —
      **몸이 먼저 배운다**: 밀교의 호흡법이 왜 그렇게 발달했는지"
    note: |
      ★ 차(茶)와 말(馬)을 바꾸는 길. **그리고 그 길을 사천당가가 쥐고 있다**
        (faction_politics relations: seolyeok_milgyo ↔ dangga = +1).
      ★★ 귀결: **토번에 가려면 당가를 지나야 한다.** dangga_entry 의 '식객' 이 갑자기 값이 생긴다 —
        당가 favor 는 무공만 여는 것이 아니라 **길을 연다**

  sangro_namman:
    name: "남만 상로 (밀림길)"
    kind: 산길
    factor: 1.60
    waypoints: [[0, 0], [-300000, 330000], [-422900, 405800], [-174700, 1352300], [-665600, 1197500], [-731600, 1363400]]
    #            청하현    (촉도 경유)        사천당가           ★진남관              남만 밀림           오독채
    danger: 5
    gate: gwanmun_jinnam             # ★ 관문 — 노인(路引). 다만 그 너머는 길이 아니다
    survival: "★ 장기(瘴氣). 밀림에서는 **적보다 병이 먼저 죽인다** — 여정 판정에 질병 판정이 붙는다.
      ★ 그리고 길잡이 없이 들어가면 **좌표를 알아도 못 찾는다** (밀림은 지도가 소용없다)"
    note: "★ 향도(嚮導)를 사야 한다. 그리고 향도는 오독교가 보낸다 —
      **길을 사는 순간 이미 그들의 손 안에 있다**"

  haero_dongyeong:
    name: "동영 해로 (東瀛海路)"
    kind: 해로                       # ★ 새 road_factor (1.10)
    factor: 1.10
    waypoints: [[0, 0], [543800, 413500], [1096000, 451100], [1227300, 493200], [2072200, 147100]]
    #            청하현    무한(장강)        강남 상로           ★시박사(명주)        동영도
    danger: 4
    gate: sibaksa_myeongju           # ★ 관문 — 해금(海禁). **합법으로 가는 배가 거의 없다**
    survival: "★ 계절풍을 기다린다. 철이 아니면 배가 안 뜬다 —
      **여정 대기 일수**가 붙는 유일한 길이다 (최대 +30일). 그리고 태풍이면 침몰한다"
    note: |
      ★★ **이 길은 양방향이 아니다.** 우리가 가기는 어렵고(해금), 그들이 오기는 쉽다(관문이 없다).
      ★ 그래서 실질 경로는 수로채의 밀선(密船)이다 — jangang_suroche ↔ dongyeong = +1 (밀무역).
        ★ 즉 **동영에 가려면 사파의 배를 타야 한다.** suroche_entry 가 갑자기 새외의 문이 된다
      ★ 그리고 그 배는 돌아올 때 왜구의 물건을 싣는다 —
        그것을 목격하면 myeongbun.inputs.새외와_결탁_증거(+9)를 쥔 것이다

  chimgongro_bukmak:
    name: "★ 북막 남하로 (침공로)"
    kind: 새외
    factor: 2.00                     # ★ 우리 기준. **그들 기준은 0.50** (mounts.초원마)
    waypoints: [[-542800, -1423100], [448400, -636900], [741100, -615900]]
    #            한정                  ★대동 군진           경사(황성)
    danger: 5
    direction: 남하                   # ★ 유일하게 **밖에서 안으로** 그려진 길이다
    hazards: [gunjin_daedong]        # ★ 위험이 우리에게 있는 게 아니라 **그들에게** 있다 (변군 30,000)
    note: |
      ★★ 이 길만 방향이 반대다. 다른 모든 route 는 '청하현에서 어디로'인데, 이것은 '어디서 청하현으로'다.
      ★ 우리 계수로 대동까지 63일. **그들의 초원마로 16일.**
        → 소문이 청하현에 닿기도 전에 그들은 관내(關內)에 있다 (rumor speed_days).
        ★ 이것이 faction_politics deterrence.frontier 가 존재하는 이유이고,
          "무림이 언제나 늦는" 구조적 이유다 — **소식을 듣고 출발하면 산문은 이미 탔다**
      ★ 마교 본교(x -1.94M)는 이 길의 **서쪽 곁**에 있다. 기존 note("마교 본교 → 대동 → 경사가
        최단 침공로")는 여전히 참이다 — 다만 그 길이 **북막의 땅을 지난다.**
        ★ 그래서 마교는 통행을 사야 하고, 그래서 대칸을 부추긴다
          (faction_politics rupture_scenarios.saeoe_invasion.magyo_seat)

  # ─── 새외 route 의 여정일 교차 검산 (실경로 합산 vs 직선×factor) ───
  cross_check_saeoe:
    고창:     "가욕관 46 + 돈황 17 + 고창 30 = 93일  vs  직선 2,062km × 1.80 ÷ 40 = 93일  ✔"
    돈황:     "가욕관 46 + 17 = 63일               vs  직선 1,460km × 1.70 ÷ 40 = 62일  ✔"
    설역대사: "당가 26 + 설역 61 = 87일            vs  직선 1,725km × 2.00 ÷ 40 = 86일  ✔"
    한정:     "직선 1,523km × 2.00 ÷ 40 = 76일 (대동 25 + 63 = 88 — ★ 관도를 안 타므로 직선이 옳다)"
    동영:     "직선 2,077km × 1.10 ÷ 40 = 57일  (소주 25 + 26 = 51 — 연안 우회 차이. 57 채택)"
    오독채:   "직선 1,547km × 1.90 ÷ 40 = 74일  (진남관 55 + 19 = 74  ✔)"
    verdict: "★ 전부 ±1일 안에서 일치한다. **좌표가 곧 거리이고, 거리가 곧 시간이다** (§2 원문)"

