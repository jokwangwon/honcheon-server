  # ─────────────────────────────────────────────────────────────────────
  #
  # ★★ 2026-07 지도 확정 패스 — 이 절에서 **바꾼 것**과 **일부러 안 채운 것**
  #
  #   바꾼 것 ① **faction 을 연합 id 에서 문파 id 로.**
  #     여섯 곳이 `faction: gupailbang`(구파일방 — **연합**)이었다. 그런데 factions.yml 은
  #     종남·곤륜·점창·청성·해남·아미를 **1급 id 로 등재**해 두었다
  #     (`orthodox.members.jongnam` … — "sects 명단에 이미 있던 이름에 id 를 붙였을 뿐이다").
  #     → **등록된 id 가 있는데 연합 이름을 적는 것은 등록제의 낭비다.** 문파 id 로 못박는다.
  #     ★ 회귀 없음: TerrainForge.PEAK_FACTIONS · RemoteBuilder.SECTS 가 **여섯 id 를 전부 갖고 있다**.
  #
  #   바꾼 것 ② **archetype 신설** — 그러나 **채운 것은 화산 하나뿐이다.**
  #     ★ 근거가 있는 곳만 채웠다: config/npcs/regions/hwasan.yml 이 `archetype: 도관` 이라 **적어 두었다**.
  #     나머지 여덟은 `pending` 이다. **왜 못 채우는지가 pending_why 에 적혀 있다.**
  #
  #   ★★★ 안 채운 이유 — **원형 하나에 집이 아홉이 아니다**
  #     RemoteBuilder 는 지금 구파 아홉을 전부 **도관(道觀)** 으로 짓는다 (SECTS → Archetype.도관).
  #     도관의 계약은 이렇다: **검은 기와 · 회벽 · 돌바닥 · 매화(CHERRY_LEAVES) · 석등.**
  #     그런데 등록부가 말하는 집은 아홉이 다 다르다:
  #       · 소림사  = **불가 사찰**이다 (factions.yml: "불가 무학의 종가"). 도관에 **매화를 요구한다** —
  #                   사찰에 매화가 서면 그것은 소림이 아니다
  #       · 아미파  = **비구니 문파**다 (factions.yml: "사천의 여승 문파"). 도관이 아니다
  #       · 해남파  = architecture: "바닷가 검문 — **소금기에 삭은 목조**" · terrain: 섬.
  #                   **산문도 천 계단도 없다.** 도관 계약이 성립하지 않는다
  #       · 종남파  = "봉우리에 흩어진 **암자**" — 본전 하나가 아니라 흩어진 집이다
  #     ★ 그래서 **지어내지 않는다.** 이 넷(그리고 나머지)은 **사람이 정해야 한다** — 질문 목록에 올렸다.
  #     ★ 지금 코드가 도관으로 짓는다는 사실은 지우지 않는다. 다만 **지도가 그것을 확정하지는 않는다.**
  #
