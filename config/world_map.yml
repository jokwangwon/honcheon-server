      ★ 혈교 은거지가 이 북쪽 문턱(운남)에 있다 — **오독교의 땅이다.** 그들은 혈교를 쫓고 있다:
        "고독은 벌레를 먹이지 사람을 먹이지 않는다" (relations: odokgyo ↔ hyeolgyo = -2)

  dongyeong_do:
    name: "동영도 (東瀛島)"
