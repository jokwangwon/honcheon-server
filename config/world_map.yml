  # ─── ★ 새외 — 신규 등록. 여기가 이 패스에서 **유일하게 세력을 늘린 자리**다 ───
  #   등록제 원칙("새 지명 발명 최소화")을 지켰다: 아래 지명은 전부 **실제 지명**이거나
  #   무협의 공용 자산이다. 발명한 것은 **조직 이름 여섯**뿐이고, 그마저 전부 factions.yml 에 등재했다.
  새외_지명:
    실지명: [막북, 한정, 고창, 돈황, 천산, 준가르, 토번, 남만, 동영, 카레즈, 차마고도, 비단길, 오독채]
    note: "★ 전부 실지리 또는 무협 공용 명사. 좌표는 실제 위경도를 §1 projection 으로 투영한 값이다"
  새외_세력:                          # ★ factions.yml faction_groups.saeoe.members 에 전부 등재됨
    - { id: bukmak,            name: 북막_한국,  seat: bukmak_hanjeong,      why: "북방 초원의 기마 민족 — **무림이 아니라 나라**. 관의 정면" }
    - { id: seoyeok_sangmaeng, name: 서역_상맹,  seat: seoyeok_gochang,      why: "비단길의 주인 — ★ 새외에서 유일하게 적이 아니다" }
    - { id: baehwa_singyo,     name: 배화신교,   seat: baehwa_seonghwadan,   why: "서역의 이교 — 환술·산공독. ★ 중원이 마교와 혼동한다" }
