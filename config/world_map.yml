# 11. 조성 계획 (build_plan)
# ═══════════════════════════════════════════════════════════════════════════

build_plan:
  world: honcheon                   # ★ 전용 월드. 기존 world 는 건드리지 않는다
  now:                              # `/혼천 세계조성` 이 지금 짓는 것
    - cheongha_hyeon                # CheonghaBuilder.build(world, 0, groundY, 0, zones)
    # 폐사당·사냥터·흑수나루·산길 도적은 CheonghaBuilder 가 같이 짓는다 (v6 ②, v6.9 ①②)
  later:                            # 좌표는 있다. 조성기만 만들면 된다
    priority_1: [hwasan, nokrim_sochae, jinryeong_simsan]       # ★ 청하현에서 5일 안 — 다음 무대
    priority_2: [jangan, jongnam, magyo_jinryeong, yakcho_taebaek]
    priority_3: [dangga, sorimsa, nokrim_chongchae, jangang_suroche]
    priority_4: [나머지 전부]
  never: [gaebang, haomun, salmak]  # ★ 망(網)·무거점 — 조성할 것이 없다. 그것이 설계다

# 디스크 예산 — **큰 좌표는 공짜다**를 수치로
disk_budget:
  fact: "마인크래프트는 **방문한 청크만 생성**한다. 좌표 크기는 디스크에 영향이 없다"
  now:
    generated: "청하현 무대 반경 ~170블록 → 약 22×22 = 484 청크"
    size: "약 10~25 MB (region 파일 압축 기준)"
  full_build:                       # 등록된 30여 곳을 **전부** 지었을 때
    generated: "30곳 × 평균 반경 500블록 → 30 × 63×63 ≈ 119,000 청크"
    size: "약 2~5 GB"
    verdict: "★ 다 지어도 5 GB. 좌표가 ±194만이어도 그 사이의 빈 공간은 **1바이트도 안 든다**"
  world_border: "설정하지 않는다 — 여정이 텔레포트이므로 플레이어가 빈 공간을 걸어 건널 일이 없다"

# ═══════════════════════════════════════════════════════════════════════════
# 12. 확장 여지 (expansion_gaps) — ★ 지금 안 쓰는 자리도 비워 둔다
# ═══════════════════════════════════════════════════════════════════════════
#
# 나중에 지역 하나를 끼워 넣어도 지도를 다시 안 짜도 되게. 아래는 **의도적으로 비운 자리**다.

expansion_gaps:
  섬서_내부:
    where: "청하현 반경 100 km 안 — 현재 등록: 종남(2일)·녹림 소채(1일)·진령 심산(3일)·마교 전초(4일)"
    room: "★ 인접 현(1~2일) 자리가 통째로 비어 있다. player_creation '인접_현_여행' 이 갈 곳이 아직 없다"
    next: "청하현 이웃 현 2~3개 — 튜토리얼 이후의 첫 확장"
  오악_나머지:
    registered: [화산(서악), 숭산(중악)]
    empty: [태산(동악) 29일, 형산(남악) 34일, 항산(북악) 31일]
    note: "좌표는 계산해 뒀다 (docs/design/world_map.md 표). 문파를 앉히기만 하면 된다"
  구파_나머지:
    empty: [곤륜, 점창, 청성, 해남]     # 좌표는 잡았다. 본산 상세가 없다
    note: "factions.yml gupailbang.sects 8개 중 4개가 좌표만 있다 — 언제든 채운다"
  오대세가_나머지:
    empty: [모용세가]                 # 좌표만
  부촌:
    note: |
      ★ village_tiers.yml rich_unassigned: "등록된 부유 마을이 없다"
      → 이 지도가 그 공백을 채운다: 장안·낙양·개봉·소주·항주·강남 상로 = rich.
        조성기가 rich 등급을 받는 날 바로 쓸 수 있다.
  빈촌:
    registered: [heuksu_ferry(poor), nokrim_sochae(poor), 운남·해남·서역 전역]
    note: "★ 가난과 부가 지도에 있다 — 서쪽·남쪽 변경이 가난하고, 동쪽 강남이 부유하다"
  관의_여백:
    note: |
      ★ 관(官)의 층은 **위계만 세웠고 사건이 비어 있다.** 여백이 크다:
        · 청하현 관아(county_office)는 등록부에 있는데 조성이 없다 — **가장 가까운 다음 과업**
        · faction_entry_routes 에 관군 입문 루트가 없다 (8루트 중 관이 빠졌다)
        · 불가침 파열 사건 3종(부패 결탁 · 마교 잠식 · 역모 혐의)은 무대와 조건만 있고 단계가 없다
    ready: "★ 좌표·위계·규칙은 다 있다. 사건만 얹으면 된다"
  미개척:
    - { name: "감숙·하서주랑", where: "x -300k~-800k, z -200k~+100k", note: "곤륜으로 가는 길목. 통째로 비어 있다" }
    - { name: "강서·복건", where: "x +700k~+1000k, z +500k~+900k", note: "장강 남안. 통째로 비어 있다" }
    - { name: "산동", where: "x +700k~+900k, z -300k~-100k", note: "태산이 있다. 문파가 없다" }

# ═══════════════════════════════════════════════════════════════════════════
# 13. 등록 예약 명사 (reserved_nouns) — ★ 이 파일이 새로 만든 지명
# ═══════════════════════════════════════════════════════════════════════════
#
# 등록제 원칙: 새 지명 발명 최소화. 아래는 **중원의 실제 지명**이거나(무협 공용 자산),
# 등록된 세력의 본거지에 이름이 필요해 붙인 것이다. 다른 config 가 참조하기 전까지는 '예약' 상태다.

reserved_nouns:
  실지명_중원:                        # 실제 중국 지명 — 무협의 공용 자산. 발명이 아니다
    [장안, 낙양, 개봉, 태원, 무한, 구강, 소주, 항주,
     화산, 종남산, 숭산, 무당산, 태산, 형산, 항산, 태백산, 진령, 태행산, 복우산, 아미산, 청성산,
     위수, 장강, 곤륜산, 동정호]
  지역권:                            # regions/cheongha_hyeon.yml 의 'parent_region: 섬서 지역권' 을 확장한 것
    [섬서, 하남, 하북, 산서, 호북, 안휘, 강남, 사천, 운남, 해남, 청해_서역, 새외_북막,
     막북_초원, 서역, 토번_고원, 남만, 동영]        # ★ 새외 5 (신규)
  관_지명:                            # 관(官)의 층 — 실지명 + 실제 행정 명칭. 새 조직은 최소한으로
    실지명: [경사, 북경, 남경, 봉상부, 서안부, 대동, 산해관, 가욕관, 영남, 송반관, 진남관, 명주]
    조직: [지부, 순무, 총독, 절도사, 금군, 금의위, 육부, 무과, 변군, 부병, 성군, 시박사, 예부, 승록사]
    문서: [노인, 감합, 통관첩]        # ★ 통행증 — §9 passports
