      architecture_family: nomad_tent_camp
      fortification: none
      계약: "★★ **게르 군집 + 말 떼. 담도 성벽도 없다.**
        ★ 등록부 원문: '★ **성이 없다.** 대칸의 천막(게르)과 말 떼. 계절마다 옮긴다 —
          **칠 표적이 없다는 것이 이들의 성벽이다**'
        ★★ 그러므로 이 원형의 **정의는 부재(不在)다**: 담이 없고, 성벽이 없고, 축(軸)이 없다.
          벽을 세우는 순간 한정이 아니다 — 그것이 §9 frontier 의 '정벌은 언제나 실패한다'의 지형적 근거다"
      radius_basis: "★★ **무림 사다리(80/64/48/40)를 타지 않는다** — 북막 martial 20 을 그 사다리에 넣으면
        한정이 **소림의 두 배로 선다** (§17 caution 위반). 새외의 자(§17-c)는 **여전히 없다.**
        ★ 그러나 **자가 없어도 이 집의 크기는 알 수 있었다** — 사용자 결정 (2026-07-13):
          *'**게르 몇 채 + 말 떼**가 곧 한정의 크기다. 원형이 반경을 못 박는다.'*
        ⇒ 옛 Q-신규-1 해소. **새외의 사다리를 지어내지 않고 해소했다** (원형의 기하를 쟀을 뿐이다)"

    # ── 유배지 — 영남 변방. ★ **담이 없다** ──
    유배지:
      for: gwan_gun
      only: [yubaeji_ryeongnam]
      r: 24                          # ★★ **원형의 기하가 못 박았다** — §17 pinned_by_archetype.유배지
                                     #   (밭·초소·초가의 최대 도달 20 → 8칸 격자 24. OutlandBuilder.exile 실측)
      architecture_family: penal_settlement
      fortification: none            # ★★ **담이 없다**
      계약: "★ **초가 몇 채 + 감시 초소. 담이 없다.**
        ★ 관아도 관문도 **아니다**: 관아는 정청·마당·옥(獄)을 갖고, 관문은 성벽이 길을 가로지른다.
          유배지는 **막지도 거르지도 않는다** — 등록부 원문: '**감옥이 아니라 유배다**'.
        ★★ 가둘 필요가 없기 때문이다. **밀림과 거리가 곧 담이다** (청하현에서 45일)"
      radius_basis: "★ 관의 크기는 force 가 정하는데(§17 pinned_by_archetype) 유배지에는 **force 가 없다** —
        지키는 자가 몇인지 아무도 안 적었다. **그 사실은 그대로다.**
        ★★ 그러나 사용자가 다른 자를 주었다 (2026-07-13):
          *'**초가 몇 채 + 감시 초소**가 곧 유배지의 크기다. 원형이 반경을 못 박는다.'*
        ⇒ 옛 Q-신규-2 해소. **force 를 지어내지 않고 해소했다** (조성기의 기하를 쟀을 뿐이다)"

  # ─── ★★ 없는 것 (requested) — **청구서.** ★ 원칙: **세력 하나 = 원형 하나** (사용자 결정) ───
  #
  #   ★★★ 사용자가 셋을 잇달아 결정했고, 셋이 **하나의 원칙**으로 모인다:
  #       Q2 "소림은 사찰 — **자재 변주가 아니라 신설**"
  #       Q3 "오대세가는 **다섯을 각각 따로**"
  #       Q8 "**도관들도 같은 형태가 아닌 각 세력당 다 다른 크기 다른 형태**"
  #     → **아홉 문파가 같은 집으로 서는 일은 없다.**
  #
  #   ★ 그러므로 **「도관」은 이름을 잃지 않되 화산 하나의 것이 된다.** 판단의 이유:
  #     `config/npcs/regions/hwasan.yml` 이 이미 `archetype: 도관` 이라 적어 두었고,
  #     `RemoteBuilder.Archetype.도관` 이 이미 그 이름으로 서 있다.
  #     ★ 이름을 바꾸면 **등록부 셋이 갈라진다** (지도·인구·코드). **이름은 지키고 범위를 좁힌다.**
  #
  #   ★ 계약은 **등록부 산문에서 뽑았다.** 자재·수량은 **비워 두었다** — 짓는 자가 정한다.
  #   ★ 크기(build_radius)는 **§17 영향력**이 정한다 — 지어내지 않았다.
  requested:

    # ══ 문파 — 여덟 (화산의 도관은 이미 있다) ══
    jeomchang: { for: jeomchang, r: 40, 계약: pending,
                 pending_why: "★ **등록부가 집을 말하지 않는다** (Q-A).
                   ★★ 사용자가 '지도 담당의 **기존 권고안대로**' 라 결정했으나 **그 권고안이 저장소에 없다** —
                     찾지 못했다. **지어내지 않는다** (원문을 받아야 한다)" }
    cheongseong: { for: cheongseong, r: 48, 계약: pending,
                 pending_why: "★ **등록부가 집을 말하지 않는다** (Q-A).
                   ★★ 점창과 같다 — '기존 권고안'을 **찾지 못했다.** 지어내지 않는다" }

    # ══ ★★ 운해 비구니원 — 아미파 (2026-07-13 사용자 설계: docs/design/ami_architecture.md) ══
    기관저택:  { for: jegal,    r: 48, 계약: pending,
                 근거: "등록부: '기관(機關)과 진법(陣法)의 집 — 저택 자체가 미로다. 마당의 돌이 자리를 바꾼다'",
                 pending_why: "★ **이름은 있는데 계약이 없다** — *무엇이 있어야 제갈이 제갈인가?*
                   '미로'·'움직이는 돌'은 그림이지 계약이 아니다 (Q-B)" }
    상단:      { places: [taewon, muhan, soju, gangnam_sangro, seoyeok_gochang, donhwang],
                 pending_why: "★ region_archetypes.md §5 가 이미 고발했다: '상단의 원형이 아직 없다'.
                   성문(문 앞 한 구획)으로 족한가, 상단의 집이 따로 있는가 (Q-D)",
                 note: "★★ **크기는 이제 안다** — §17-b 상업 척도가 섰다 (사용자 결정 2026-07-13).
                   ★ 그러나 **① 등급→반경 사다리(Q-L)와 ② 원형(Q-D)이 여전히 없다.**
                   ★★★ **크기와 형태는 다른 문제다** (사용자 원문):
                     `도시 크기 = 상업 등급(commercial_class)` · `도시 형태 = 건축 원형(archetype)`" }
    새외:      { places: [baehwa_seonghwadan, seolyeok_daesa, odokgyo_odokchae, dongyeong_do],
                 pending_why: "★ 넷 다 **중원 건축이 아니다** (현무암 제단·대사원·고상 가옥·천수각).
                   전부 build: later — **급하지 않다.** 그러나 원형이 없다는 사실은 적어 둔다 (Q-F)",
                 note: "★ 한정(천막)은 **여기서 빠졌다** — 원형이 정해졌다 (위 「천막」 참조).
                   ★ 설역 대사는 **반경만 정해졌다** (64 — 영향력 9). 원형은 여전히 없다" }
    해관:      { places: [sibaksa_myeongju],
                 pending_why: "★ 시박사는 '성이 아니라 **배**다' — 관문 원형이 성립하는가? (Q-D)
                   ★ 그리고 terrain.yml pending.sibaksa_myeongju: '바다에 서야 하는 해관 — **땅부터 미결이다**'",
                 note: "★ 유배지는 **여기서 빠졌다** — 원형이 정해졌다 (위 「유배지」 참조)" }

    없음_의도적:                    # ★ 집이 없는 것이 **옳은** 곳 — 이것도 적는다 (침묵 금지)
      사냥터: "산과 숲이다. 집이 없다 (terrain.yml natural:)"
      산지:   "약초밭·광맥. 집이 없다 (natural:)"
      폐허:   "★ 굴은 있다 (terrain.yml caves: 기연굴). **집은 폐허다**"
      망:     "개방·하오문·살막 — 좌표조차 없다. **그것이 설계다**"
      전용:   "청하현·산길 도적 — CheonghaBuilder 가 짓는다 (`builder:` 필드가 면제한다)"

  # ─── ★ 배선 청구 (wiring) — **자바를 고쳐야 하는 것.** 나는 코드를 안 건드린다 ───
  wiring:
    W-A:
      status: "★★ **완료** (2026-07-13) — 두 계층 다 지도를 읽는다"
      what: "★ 집의 반경은 `build_radius:` 가 · 땅의 반경은 `§1-b land.forge_radius:` 가 말한다"
      code_was: "siteRadius = noklim ? 24 : 64  ·  forgeRadius = noklim ? 24 : 110"
      code_now: "RemoteBuilder.siteRadius → place.buildRadius()  ·  MvtCommand.forgeRadius → map.forgeRadius()"
      why: "★★ **마을 크기와 땅의 크기를 코드가 정하고 있었다.**
        ★★★ 그리고 **땅이 세력을 알고 있었다** (`noklim ? 24 : 110`) — 그것이 마지막 하드코딩이었다.
          사용자 원문: *'**땅은 세력을 모른다.** 산은 문파가 흥하든 망하든 그 자리에 그만큼 있다.'*
          ⇒ 도적 24 의 예외를 **폐지**하고 **어디나 110** 으로 못박았다 (§1-b land)"
      guarded_by: "★ 린트 BANNED — 하드코딩이 돌아오면 짖는다. **지운 것은 다시 돌아오기 때문이다**"
    W-B:
      what: "★ **archetype: 을 읽어라.** RemoteBuilder.archetype(place) 이 faction+section 으로 **추측한다**"
      why: "세력 하나에 집이 여럿이면 안 갈린다 (gwan_gun = 성시·역참·군진·황성).
        ★ 지도가 이 패스에서 archetype 을 신설했다 — **읽기만 하면 추측이 사라진다**"
      contract: "지도가 archetype 을 주면 그대로 짓는다. `pending` 이면 **짓지 않고 그렇게 말한다**
        (unbuildableReasons — 지금도 그렇게 하고 있다. 이유만 정확해진다)"
    W-C:
      what: "★ **코드에 박힌 문파 목록 두 벌을 지워라** — TerrainForge.PEAK_FACTIONS(:651) · RemoteBuilder.SECTS(:379)"
      why: "★★ **등록제 위반이다.** 그리고 두 벌이라 이미 갈라졌다 —
        SECTS 에는 **오대세가가 없어서** 세가 다섯의 집이 안 선다 (§5.4).
        factions.yml faction_groups.orthodox.members 의 `parent: gupailbang|odaesega` 가 정본이다"
      caution: "★ **아미(ami)는 parent 가 없다** (factions.yml — '추후 확장' 존중이 의도다).
        factions.yml 을 그대로 읽으면 **아미가 봉우리를 못 받는다.**
        지금은 terrain.yml `shaping: ami: 봉우리` 가 그것을 막고 있다 — **등록부가 코드보다 세다**"
    W-D:
      what: "★ architecture **산문에서 낱말을 찾는 것을 그만두라** (TerrainForge.caveKind: '동굴'·'석실' 문자열 검색)"
      why: "★ 산문을 고치면 굴이 사라진다. **글이 기계를 움직이면 그것은 등록부가 아니다.**
        이미 우회로가 있다 — config/terrain.yml `caves:` 가 먼저 읽힌다 (8곳 등재됨). 산문 검색은 폴백으로만"

# ═══════════════════════════════════════════════════════════════════════════
# 17-a. ★★★ 크기의 자(尺) — **장소의 성격마다 다른 자로 잰다**
# ═══════════════════════════════════════════════════════════════════════════
#
# ─────────────────────────────────────────────────────────────────────────────
# ★★★ §17 의 오독을 바로잡는다 (2026-07-13 사용자 결정 — docs/design/scale_systems.md)
#
#   *"크기는 영향력의 함수다"* 에서 말하는 **영향력은 모든 장소에 동일한 수치를 강제하는 것이 아니라,
#     **장소의 성격에 맞는 영향력**을 뜻하는 것으로 해석한다.*
#
#   ★★ **하나의 자를 온 세계에 들이대지 않는다.**
#      **상인의 도시를 무력으로 재면 성곽 도시가 오두막이 된다.**
#
#   ★ 그리고 그 오독은 하마터면 등록제를 깰 뻔했다: 상단연합(sangdan)을 §17 사다리에 올리려면
#     **martial 과 mandate_weight 를 지어내야** 했다. 상단연합은 **무림 문파도 정치 세력도 아니다** —
#     faction_politics.roster 에 **없는 것이 옳다.** 없는 눈금을 만들어 재는 것이 곧 지어내기다.
# ─────────────────────────────────────────────────────────────────────────────

scale_systems:
  source: "docs/design/scale_systems.md — ★ 사용자가 직접 결정했다 (2026-07-13). 추측이 아니다"
  the_rule: "★★ **크기와 형태를 분리한다:** `크기 = 척도(scale_system)` · `형태 = 건축 원형(archetype)`.
    최종 반경은 **척도**가 결정하고, **건축 원형은 그 반경 안의 내부 구성**을 결정한다"

  martial:
    what: "무림 문파 — **무력 · 문파 영향력**"
    yardstick: "§17 influence — `martial + mandate_weight` (faction_politics.yml roster)"
    ladder: "§17 ladder — 80 / 64 / 48 / 40"
    places: "구파 · 오대세가 · 녹림 · 수로채 · 독문 · 마교 · 혈교 · ★ 설역 대사(사용자가 무림의 자로 재라 결정)"

  administrative:
    what: "관(官) — **행정 위계와 방어 기능**"
    yardstick: "★ 영향력이 아니라 **rank 와 force** 가 정한다 (§17 pinned_by_archetype)"
    ladder: "관아 32(현) · 48(부)  ·  관문 64(군진) · 48(관문)  ·  성문 64"
    places: "성시 3 · 관아 4 · 군진 3 · 관문 2 · 시박사 · 유배지"

  commercial:
    what: "상업 거점 — **상업 영향력** (§17-b)"
    yardstick: "★ `commercial_class` — wealth_tier · route_centrality · settlement_role 로 **판정**한다"
    ladder: "★ §17-b commercial_scale.radius_ladder — outpost 40 · market_town 48 · trade_city 64 · hub 80
      (★ 사용자 결정 2026-07-13 — Q-L 해소). ★★ **무림 사다리와 숫자가 겹쳐도 독립된 계약이다** —
      한쪽이 바뀌어도 다른 쪽은 **자동으로 안 바뀐다** (린트 규칙 5 가 참조 공유를 막는다)"
    places: "태원 · 무한 · 소주 · 강남 상로 · 고창 · 돈황"
    forbidden: "★★★ **`martial` 과 `mandate_weight` 를 부여하지 않는다.**
      ★ 그리고 **`sangdan` 을 faction_politics.roster 에 추가하지 않는다** — 상단연합은 무림 세력이 아니다.
        기존 세력 관계표(relations)에도 포함하지 않는다. **린트가 이 셋을 지킨다**"

  새외:
    what: "새외 도시 — **도시 기능과 교역·군사적 위상**"
    yardstick: "★★ **아직 없다.** 사용자가 '따로'라고 했을 뿐 자(尺)가 정의되지 않았다"
    ladder: "★★ **없다** (Q-신규-1) — 그래서 한정·성화단·오독채·동영도의 반경이 전부 pending 이다"
    why_not_martial: |
      ★ 무림의 사다리를 쓸 수 **없다.** §17 caution 이 이미 그 이유를 적어 두었다:
        *"북막의 martial(20)은 소림(10)의 두 배가 아니라 **다른 종류**다 — 그것은 군대다."*
      ★★ 그 20 을 사다리에 넣으면 **한정(천막!)이 소림의 두 배로 선다.** 세계가 거짓말을 한다.
      ★ 그래서 새외는 **따로 잰다.** 다만 그 자가 아직 없으므로 — **지어내지 않고 비워 둔다**
    places: "한정 · 성화단 · 오독채 · 동영도  (★ 고창·돈황은 **상업**이다 — 땅이 아니라 성격이 자를 정한다)"

  # ─── ★ 척도가 없는 것은 무엇인가 — **침묵 금지** ───
  not_scaled:
    사냥터·산지·폐허: "★ 집이 없다. 크기를 잴 것이 없다 (§16 없음_의도적)"
    망(網): "★ 개방·하오문·살막 — 좌표조차 없다. **그것이 설계다**"
    전용_조성기: "★ 청하현·산길 도적·청하현 관아 — 무대가 크기를 정한다 (CheonghaBuilder)"

# ═══════════════════════════════════════════════════════════════════════════
# 17-b. ★★★ 상업 영향력 척도 (commercial) — **상인의 도시를 무력으로 재지 않는다**
# ═══════════════════════════════════════════════════════════════════════════
#
#   ★ `tier` 하나로 정하지 않는다 — **네 곳이 모두 rich 라 변별력이 없다.**
#
# ★★★ 그리고 이 절의 **가장 중요한 조항**:
#
#     *"아직 각 도시의 교역로와 역할에 관한 **근거가 없는 경우에는 세부 숫자를 지어내지 않는다.**
#       지도나 등록부에 **명시된 기능만으로** 상업 등급을 판정하고,
#       **근거가 부족한 장소는 `commercial_class: unresolved` 로 남긴다."*   (사용자, 2026-07-13)
#
#   ★★ 지금까지 린트는 미결을 **채우라고 짖기만** 했고, 채우려면 **지어내야** 했다.
#      이제 **"모른다"고 적을 수 있는 칸**이 있다. **`unresolved` 는 실패가 아니라 정직이다.**

commercial_scale:
  source: "docs/design/scale_systems.md — ★ 사용자가 직접 결정했다 (2026-07-13)"

  # ─── 크기를 정하는 세 요소 ───
  factors:
    wealth_tier:      "지역에 축적된 부와 시장 규모"
    route_centrality: "교역로가 몇 갈래로 연결되는지. 중원↔서역, 항구↔내륙을 잇는 정도.
      ★ **도출값이다** — §7 routes 중 그 좌표를 waypoint 로 갖는 길의 수를 **세었다** (지어낸 수가 아니다)"
    settlement_role:  "객잔·역참 수준인가 / 정기 시장인가 / 지역 상업도시인가 / 대륙 규모 교역 중심지인가"

  # ─── 상업 등급 (commercial_class) — ★ 도시마다 새 숫자를 지어내지 않는다. 위 셋으로 **판정**한다 ───
  classes:
    commercial_outpost: "소규모 교역소·대상 숙영지. 건물 수는 적지만 **창고와 마구간 비중이 높다**"
    market_town:        "지역 정기시장과 상단 지점이 형성된 시장도시. 상점가와 주거지가 함께"
    trade_city:         "여러 교역로가 만나는 상업도시. **객잔·창고·환전소·표국·상단 회관**이 구역을 이룬다"
    grand_trade_hub:    "중원 또는 서역 전체에 영향을 주는 대형 교역 중심지.
      **복수 시장·대상 집결지·대형 창고지구·외지인 거류지**"
    unresolved:         "★★ **모른다. 그리고 모른다고 적는다.** 위반이 아니다 — 정직이다.
      ★ 린트는 이것을 **채우라고 짖지 않는다.** 다만 **몇 곳인지는 매번 소리내어 센다**"

  # ═════════════════════════════════════════════════════════════════════════
  # ★★★ 등급 → 반경 사다리 (radius_ladder) — **사용자가 직접 쓴 계약. 글자 그대로다**
  # ═════════════════════════════════════════════════════════════════════════
  #
  #   ★ 사용자 원문 (2026-07-13) — Q-L 이 여기서 해소된다:
  #
  #       commercial_outpost: 40
  #       market_town:        48
  #       trade_city:         64
  #       grand_trade_hub:    80
  #
  # ★★★ 그리고 이 절의 **가장 중요한 조항** (사용자 원문):
  #
  #     *"무림 사다리에 같은 숫자가 존재하더라도 상업 사다리는 **독립된 계약**이다.
  #       향후 무림 반경이 변경되어도 상업 반경은 자동으로 변하지 않으며, 반대의 경우도 같다."*
  #
  #   ★★ 그러므로 **금지된 구현이 있다**:
  #       ✗ `commercial_radius = martial_radius_table[commercial_level]`   ← **하지 않는다**
  #       ✗ YAML 앵커/별칭(`&martial_bands` / `*martial_bands`)으로 두 표를 **잇는 것**  ← **하지 않는다**
  #     **각 체계에 별도의 명시적 매핑을 둔다.** 숫자가 우연히 같을 뿐 **두 표는 남남이다.**
  #     ★ 린트 규칙 5 가 이것을 지킨다 — 두 표가 **같은 객체를 가리키면 짖는다** (객체 동일성까지 잰다)
  #
  # ★ 해석 (사용자 원문 — 등록부에 적어 둔다):
  #     *"같은 반경이 같은 장소를 뜻하지 않는다. 무당 본산과 대교역 중심지가 모두 80일 수 있으나
  #       **내부의 기하와 밀도가 전혀 다르다.**
  #       ★★ **도시의 규모는 상업 등급이 정하고, 내부의 생김새와 밀도는 건축 원형이 정한다.**"*
  radius_ladder:                       # ★★ 이 표는 **상업 전용이다.** 무림 표(§17 ladder.bands)와 아무 관계가 없다
    commercial_outpost: 40
    market_town:        48
    trade_city:         64
    grand_trade_hub:    80
  radius_ladder_independence: |
    ★★★ **두 사다리는 숫자가 같아도 별개의 계약이다** (사용자 원문 그대로):
      "무림 사다리에 같은 숫자가 존재하더라도 상업 사다리는 **독립된 계약**이다.
       향후 무림 반경이 변경되어도 상업 반경은 자동으로 변하지 않으며, 반대의 경우도 같다."
    ★ 금지: `commercial_radius = martial_radius_table[commercial_level]`
    ★ 금지: 두 표가 같은 객체·참조(YAML 앵커)를 공유하는 것 — **린트 규칙 5**
  radius_ladder_unresolved: |
    ★★★ **`unresolved` 를 40 으로 자동 대체하지 않는다** (사용자 원문):
      "`commercial_class` 가 없으면 outpost / 잘못되면 radius 40 — **이 구현을 금지한다.**
       **모르는 장소를 작은 장소로 간주하는 것도 하나의 창작이기 때문이다.**"
    ★ 그러므로 `commercial_class: unresolved` 이면 `build_radius: unresolved` 다.
      **집이 안 선다. 그리고 왜 안 서는지 말한다** (RemoteBuilder.unbuildableReasons).
    ★★ 이것이 **린트 규칙 3** 이다 — 그리고 그 반대 방향(규칙 3-b)도 짖는다:
      등급이 **확정됐는데** 반경이 미결로 남아 있으면 그것도 위반이다 (사다리가 이미 답을 갖고 있으므로).

  # ─── 지금의 판정 (근거를 그대로 적는다) ───
  verdict:
    muhan:           { class: trade_city,      basis: "등록부 원문 '장강 중류 **최대 나루**' + 두 교역로 합류(route_centrality 2)" }
    seoyeok_gochang: { class: grand_trade_hub, basis: "등록부 원문 '**시장이 도시보다 크다**' · '서역 유일 rich — 길이 부유하다' ·
                        '새외로 드는 **가장 넓은 문** — 나머지 넷은 여기를 지나서 간다' · 서역 상맹의 seat" }
    taewon:          { class: unresolved,      basis: "★ '산서 상인의 도시'는 **성격이지 등급이 아니다.** 등록된 길이 하나도 안 지난다" }
    soju:            { class: unresolved,      basis: "★★ **등록부가 상업 기능을 한 줄도 안 적었다** (tier·terrain·faction 뿐)" }
    gangnam_sangro:  { class: unresolved,      basis: "★ 등록부가 스스로 '**상세 미설계**'라 적었다.
                        ★ 두 길이 지나는 것은 사실이나 **길이 지난다고 등급이 정해지지 않는다**" }
    donhwang:        { class: unresolved,      basis: "★ 등록된 기능은 **물** 하나다 ('가욕관 밖 첫 물').
                        시장·상단 지점·창고지구가 **한 줄도 없다**" }
    count: "★ **판정 2곳 · 미결(unresolved) 4곳.** ★★ 린트가 이 수를 매번 소리내어 말한다"

# ═══════════════════════════════════════════════════════════════════════════
# 17. ★★★ 영향력 (influence) — **무림의 자.** 크기는 취향이 아니다
# ═══════════════════════════════════════════════════════════════════════════
#
#   사용자의 말: *"그 세력의 영향력에 따라 크기도 변화됩니다"*
#
#   ★★ **다만 이 절은 이제 「무림의 자」다** (§17-a). 관·상업·새외는 다른 자로 잰다 —
#      그것이 2026-07-13 의 정정이다. **하나의 자를 온 세계에 들이대지 않는다.**
#
#   ★ 그리고 **인과의 방향이 반대다**:
#     소림이 큰 것은 "대찰이니까"가 아니라 **영향력이 커서**이고, 그 결과가 대찰로 나타난다.
#     종남이 작은 것은 "암자니까"가 아니라 **영향력이 작아서**이고, 그 결과가 흩어진 암자다.
#
#   ★★ **그래서 크기를 지어낼 필요가 없었다 — 눈금이 이미 등록돼 있었다.**
#      `config/faction_politics.yml` 의 `roster` 가 세력마다 **martial** 과 **mandate_weight** 를 재고 있다.
#      ★ 그리고 그 눈금이 **사용자의 직관과 정확히 맞는다**:
#          소림 13 · 무당 12 · 화산 10 · 남궁 10 · 팽가 8 · 당가 8 ·
#          곤륜 7 · 종남 7 · 청성 7 · 아미 7 · 제갈 7 · 모용 7 · 점창 6 · 해남 6
#      **아무것도 발명하지 않았다. 읽었을 뿐이다.**
# ─────────────────────────────────────────────────────────────────────────────

influence:
  source: "config/faction_politics.yml roster — ★ **정본이다.** 봇(Politics.java)이 이미 이것으로 세력을 잰다"
  formula: "영향력 = martial + mandate_weight"
  why_this_formula: |
    ★ 후보가 여럿이었다. 어느 것이 정본인가를 **판단하고 이유를 댄다**:
      · martial 단독      — 무력만이다. 개방(6)이 팽가(7)보다 작아진다. **개방은 무력이 아니라 망(網)이다**
      · 사람 수(npcs/**)  — 지금 5곳뿐이다 (화산16·소채14·장안13·수로채10·마교3). **60곳이 비어 있다** → 눈금이 못 된다
      · 계보의 깊이(sect_lineage) — 무공 수는 **설계 진척도**이지 세력의 무게가 아니다 (모용은 입문 불가라 0이다)
      · tier(부유함)      — 부유함은 영향력이 아니다 (곤륜은 poor 인데 구파다)
    ★ **martial + mandate_weight 를 택한다.** 무력(칼)과 명분(말)이 세력이 세상에 미치는 두 힘이고,
      등록부가 **그 둘만 세력마다 매겨 두었다.** 개방(6+3=9)이 팽가(7+1=8)보다 커지는 것이 그 증거다 —
      **거지들의 방파가 큰 것은 칼이 아니라 입 때문이다.**
  caution: |
    ★★ **단위가 다른 것을 섞지 마라** (등록부의 경고 그대로):
      "북막의 martial(20)은 소림(10)의 두 배가 아니라 **다른 종류**다 — 그것은 군대다."
      → 이 눈금은 **무림 세력끼리만** 비교한다. 관(官)·새외는 이 사다리를 타지 않는다
        (관은 원형의 기하가 크기를 정한다 — 아래 pinned_by_archetype)

  # ─── 사다리 (ladder) — 영향력 → 부지 반경 ───
  #   ★ 앵커: **화산이다.** 영향력 10 이고 **이미 반경 64 로 서 있다** (RemoteBuilder.siteRadius).
  #     땅은 한 번만 선다 (TerrainLedger·TerrainSeal) — **그러므로 앵커를 옮길 수 없다.**
  #     사다리는 그 못에서 뻗어 나온다: build_radius ≈ round8(6.4 × 영향력)
  ladder:
    anchor: "hwasan — 영향력 10 = 반경 64 (★ **이미 서 있는 값이다.** 이것이 사다리를 못박는다)"
    bands:
      "12~13": 80        # 소림 13 · 무당 12
      "9~11":  64        # 화산 10 · 남궁 10  ← 앵커
      "7~8":   48        # 팽가·당가·곤륜·종남·청성·아미·제갈·모용
      "≤6":    40        # 점창 6 · 해남 6
    pinned_by_archetype:  # ★ 원형의 기하가 크기를 정하는 곳 — 영향력이 아니다
      산채: "24 — 목책 R=22 (RemoteBuilder). **도적의 집은 영향력이 커도 목책이다**"
      성문: "64 — 성벽 l = ±62 (region_archetypes.md §2.2)"
      관아: "32(현) · 48(부) — force 가 정한다 (포쾌 12 vs 부병 500)"
      관문: "64(군진) · 48(관문) — force 가 정한다 (변군 30,000 vs 수졸 300)"

      # ── ★★★ 한정 · 유배지 — 2026-07-13 사용자 결정: **원형의 기하가 반경을 못 박는다** ──
      #
      #   ★ 사용자 원문: *"무림 사다리 밖이다. **게르 몇 채 + 말 떼**가 곧 한정의 크기이고,
      #     **초가 몇 채 + 감시 초소**가 곧 유배지의 크기다. 관(官)의 `pinned_by_archetype` 와 같은 문법을 쓰라 —
      #     **원형이 반경을 못 박는다.** (조성기가 이미 지었다: OutlandBuilder)"*
      #
      #   ★★ 그러므로 **수를 지어내지 않았다 — 조성기의 기하를 자로 쟀다.**
      #      성문의 "성벽 l=±62 → 64" 와 산채의 "목책 R=22 → 24" 와 **같은 문법**이다.
      #      (옛 Q-신규-1 · Q-신규-2 가 여기서 해소된다. 새외의 자(§17-c)를 **만들지 않고** 해소했다 —
      #       한정은 새외의 사다리를 타는 것이 아니라 **제 원형의 기하**로 선다)
      천막: "48 — ★ **OutlandBuilder.gerCamp 의 실측 기하다** (지어낸 수가 아니다):
        · 부족 게르의 중심 거리 d = 18 + (0..21) → **최대 39**
        · 게르 자체의 반경 r = 4 + (i mod 3) → **최대 6**   ⇒ 게르가 닿는 끝 = 39 + 6 = **45**
        · 말 떼 줄 = 중심에서 ±27  ·  모닥불 = 13  (둘 다 45 안이다)
        ⇒ 원형이 실제로 차지하는 반경 **45** → 8칸 격자가 감싸는 최소값 **48**.
        ★★ 이 48 은 §17 사다리의 48 과 **아무 관계가 없다** — 북막 martial 20 은 이 표에 들어오지 않는다.
          **게르 몇 채와 말 떼가 곧 한정의 크기다** (사용자 원문)"
      유배지: "24 — ★ **OutlandBuilder.exile 의 실측 기하다**:
        · 밭 = 전방 8~18 · 좌우 ±8 → 대각 끝 √(18²+8²) = **19.7**
        · 감시 초소 = 전방 14 + 발판 2 = 16  ·  초가 넷 = 전방 ±6 · 좌우 ±10 (+터 4) = **14**
        ⇒ 원형이 실제로 차지하는 반경 **20** → 8칸 격자가 감싸는 최소값 **24**.
        ★★ force 로 재려 했으나 **유배지에는 force 가 없다** (지키는 자를 아무도 안 적었다).
          그래서 **원형이 잰다**: 초가 몇 채와 감시 초소가 곧 유배지의 크기다.
        ★ 산채와 같은 24 이지만 **같은 집이 아니다** — 목책이 있고 없고가 그 차이다 (담이 없다)"

    # ─── ★★★ 명시적 예외 (exceptions) — **일반 규칙은 명시적인 예외를 지우기 위해 존재하지 않는다** ───
    #
    #   ★ 위 `산채: 24` 의 문장(*"도적의 집은 영향력이 커도 목책이다"*)은 **폐기되지 않았다.**
    #     일반 산채(소채·중채)에 그대로 산다. 아래는 **등록부가 직접 지정한 단 하나의 예외**다.
    #
    #   ★★ 그리고 예외가 전파되지 않는 이유는 **이름 때문이다**:
    #      예외를 여는 열쇠는 martial 이 아니라 **`exception_rule` 이라는 이름**이다.
    #      영향력이 큰 산채가 새로 생겨도 그 산채는 **여전히 목책이다** — 이름을 받지 못했으므로.
    exceptions:
      greenwood_headquarters:
        archetype: 녹림석채            # ★ **기계 키**로 적는다 (공백 없는 형태 — RemoteBuilder.Archetype 과 같은 이름).
                                      #   ★★ 여기에 사람의 이름(「녹림 석채」)을 적으면 **눈이 아무것도 못 잡는다** —
                                      #     장소의 archetype 은 기계 키이므로 영영 안 맞는다.
                                      #     ★ 실제로 그렇게 적혀 있었고, **눈 시험이 그것을 잡았다** (2026-07-13)
        only: [nokrim_chongchae]      # ★★★ **여기가 전부다.** 린트가 이 목록 밖의 전파를 짖는다
        radius: 48                    # ★ 산채의 24 를 타지 않는다 (영향력 8 의 띠 그대로)
        fortification: stone
        source_basis: explicit_registry
        why: "★ 등록부가 직접 '**목책 아닌 석성**'이라 적었다 (architecture 원문).
          ★★ '도적의 영향력이 커져서 **자동으로** 석성이 된 것'이 **아니다** —
            여러 산채의 물자·인력·약탈품과 권력이 한곳에 축적된 **명시적 총본산이기 때문에** 생긴 예외다"
        not_inherited_by: "★★★ **다른 도적 거점은 녹림 석채의 석축 형식을 자동 상속하지 않는다.**
          nokrim_sochae · nokrim_jungchae · nokrim_sangil 은 **목책이다** (archetype: 산채 · r 24).
