    climate: "온대. 겨울에 마르고 춥다"
    tier_bias: middle               # village_tiers — 중촌이 기본. 청하현이 그 표준이다
    factions: [hwasan, jongnam, gwan_gun, noklim, haomun]
    note: "★ 청하현의 집. 화산 세력권 안이다 — 그래서 화산 입문 루트가 첫 문이다"

  하남:
    center: [430000, -30000]
    extent: [400000, 300000]
    terrain: "중원의 심장 — 대평야. 숭산이 가운데 솟는다"
    biomes: [plains, sunflower_plains, forest, windswept_hills]
    climate: "온대. 사계가 뚜렷하다"
    tier_bias: middle
    tier_note: "낙양·개봉은 rich — 등록된 첫 부촌 후보 (village_tiers rich_unassigned 를 여는 자리)"
    factions: [sorimsa, gwan_gun, haomun, jeongbosang]

  하북:
    center: [650000, -500000]
    extent: [500000, 400000]
    terrain: "대평야 — 숨을 데가 없다. 도(刀)와 말의 땅"
    biomes: [plains, meadow, taiga]
    climate: "한랭. 겨울이 길다 — 북쪽 설원 접경"
    tier_bias: middle
    factions: [paengga, gwan_gun]

  산서:
    center: [380000, -390000]
    extent: [350000, 350000]
    terrain: "황토 고원 — 마르고 높다. 태행산이 동쪽 벽"
