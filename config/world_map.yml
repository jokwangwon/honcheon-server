# ═══════════════════════════════════════════════════════════════════════════
# 9. 관(官) — 무림과 다른 층위. 현 → 부 → 성 → 경사, 그리고 변경의 군진
# ═══════════════════════════════════════════════════════════════════════════
#
# factions.yml 에 gwan_gun(관군)·hyeollyeong(현령/관청)이 등록돼 있는데 **지도엔 관아 하나 없었다.**
# 관은 무림과 다른 사다리를 탄다. 그 사다리를 여기 세운다.
#
# ★ 핵심 설계: **관은 무림보다 강하다. 다만 그 힘을 쓰지 않기로 되어 있다.**
#   황실이 대군을 내면 어떤 문파도 지워진다 — 그런데 내지 않는다. 왜 안 내는가가
#   관무불가침(官武不可侵)이고, **언제 내는가**가 이 세계에서 가장 큰 사건이다.

officialdom:

  # ─── 위계 트리 ───
  hierarchy:
    현:
      rank: 1
      officials: [현령, 포두, 포쾌]
      npcs: [jomunwon, bakho]        # cheongha_npcs — 조문원(현령) · 박호(포두, 이류)
      force: "포쾌 10~30인. 무력 삼류~이류. ★ 무림 이류 하나를 못 이긴다"
      architecture: 관아급             # village_tiers rich 팔레트 — 백벽·청기와·돌 기단
      scope: "치안·수배·검시·세금. **플레이어가 일상적으로 마주치는 관**"
      places: [cheongha_gwana]
    부:
      rank: 2
      officials: [지부]
      force: "부병(府兵) 300~800. 무력 이류~일류 소수. ★ 문파 하나를 못 이긴다"
      architecture: 관아급
      scope: "현 여럿을 관할. 현이 못 다루는 사건이 올라간다 (살인·역모·대규모 도적)"
      places: [jangan_bugwana, bongsangbu]
    성:
      rank: 3
      officials: [순무, 총독, 절도사]
      force: "성군(省軍) 5,000~20,000 + 위소(衛所). ★ 구파 하나와 정면으로 붙을 수 있다"
      architecture: 관아급_대
      scope: "성 전체. 군을 움직인다 — **여기서부터 무림이 긴장한다**"
      places: [jangan]
    경사:
      rank: 4
      officials: [황제, 육부, 금의위, 금군]
      force: "금군 100,000+ · 금의위(무력 절정~화경 소수). ★ 천하의 어떤 문파도 못 이긴다"
      architecture: 황성급
      scope: "천하. **대군을 내면 문파는 지워진다**"
      places: [gyeongsa]
    군진:
      rank: 3                        # 성과 동급이되 계통이 다르다 (병부 직할)
      officials: [총병, 변장]
      force: "변군(邊軍) 10,000~50,000. 실전 군대 — 성군보다 강하다"
      scope: "새외를 막는다. ★ 마교·이민족과 맞닿는 최전선"
      places: [gunjin_daedong, gunjin_sanhaegwan, gunjin_gayokgwan]

  # ─── 관무불가침 (官武不可侵) — 세계의 규칙 ───
  gwanmu_bulgachim:
    rule_a: "★ 관은 무림에 간섭하지 않는다 — 비무·문파 다툼·강호의 원한을 관이 다루지 않는다"
    rule_b: "★ 무림은 관을 건드리지 않는다 — 관리를 죽이거나 관아를 치면 강호 전체가 적이 된다"
    why_it_holds:
      관의_계산: |
        관은 무림을 **못 이기는 게 아니라 안 이긴다.**
        현·부의 무력으로는 문파 하나를 못 잡는다. 성군·금군을 내면 잡는다 — 그러나 그 값이 크다:
        세금이 걷히지 않고, 상로가 끊기고, 다른 문파가 결집한다. **강호를 치는 것은 나라를 흔드는 일이다.**
        그래서 관은 무림을 '외면'하는 쪽을 택했다. 강호가 강호 안에서 죽고 죽이는 한, 관은 눈을 감는다.
      무림의_계산: |
        무림은 관을 **이겨도 얻을 게 없다.**
        현령을 죽이면 지부가 오고, 지부를 죽이면 성군이 오고, 성군을 이기면 금군이 온다.
        그 끝은 멸문(滅門)이다. 이겨도 진다. 그래서 강호는 관에 손을 대지 않는다.
        ★ 그리고 **강호가 스스로 단속한다** — 관을 건드린 자를 정파가 먼저 친다. 불가침을 지키는 것은
          관이 아니라 무림이다. 그것이 이 규칙이 살아 있는 진짜 이유다.
      one_line: "★ 관은 이길 수 있으나 값이 비싸고, 무림은 이겨도 얻을 게 없다. 그래서 서로 안 건드린다"
    faction_reaction_wiring:          # faction_reaction.yml 반응 단계(0~6)와의 접합
      관리_살해:      { faction: gwan_gun, stage: 6, note: "토벌 — 즉시 최고 단계. 협상 없음" }
      관아_습격:      { faction: gwan_gun, stage: 6 }
      관물_강탈:      { faction: gwan_gun, stage: 5, note: "직접 개입 — 표국이 관물을 잃어도 여기에 걸린다" }
      포쾌_폭행:      { faction: gwan_gun, stage: 4 }
      수배자_은닉:    { faction: gwan_gun, stage: 3 }
      정파의_2차반응: { faction: orthodox, stage: "+2", note: "★ 관을 건드리면 정파가 먼저 온다 — 강호의 자기단속" }
    exceptions:                       # 불가침이 원래부터 적용되지 않는 것
      - "도적·마교·혈교는 불가침의 보호를 받지 않는다 (강호의 일원이 아니다) — 관군 토벌 대상"
      - "관이 무림인을 **개인 자격으로** 고용하는 것은 불가침 위반이 아니다 (포두 박호가 그렇다)"
      - "표국의 관물 호송 — 관과 무림이 합법적으로 만나는 유일한 접점 (pyoguk)"
      - "★ **새외는 불가침의 밖이다.** 강호의 일원이 아닌 정도가 아니라 — **나라의 적**이다.
        무림인이 왜구를 베는 것은 협(俠)이 아니라 **공(功)** 이고, 관이 그것을 포상한다.
        ★ 새외에 관해서만 관과 무림이 서로를 경계하지 않는다 (faction_politics deterrence.frontier)"

  # ─── ★★ 변경(邊境) — **관무불가침이 서 있는 진짜 땅** ───
  #
  #   §9 서두는 이렇게 시작한다: "관은 무림보다 강하다. 다만 그 힘을 쓰지 않기로 되어 있다."
  #   ★ 그런데 **왜** 안 쓰는가에 대한 답이 지금까지 '값이 비싸서'였다. 그것은 절반이다.
  #
  #   ★★★ 나머지 절반: **손이 묶여 있다.**
  #        faction_politics deterrence.authority_power.defense_burden = 0.75 —
  #        황실 정규군의 **75%가 국경에 못 박혀 있다.** 그 못이 아래 다섯이다.
  #        · 대동(30,000)   ← 북막
  #        · 산해관(20,000) ← 북막·요동
  #        · 가욕관(15,000) ← 서역 (★ 여기는 싸우는 곳이 아니라 **세금 걷는 곳**이다)
  #        · 해방(15,000)   ← 동영 (★ 성이 아니라 **배**다. 그래서 뚫린다)
  #        · 토번·남만(0)   ← ★ **병력이 없다. 설산과 밀림이 대신 지킨다** — 지형이 곧 변군이다
  #
  #   ★★★★ 그리고 그 귀결이 이 세계 전체를 다시 읽게 만든다:
  #
  #            **새외가 무림을 살리고 있다.**
  #
  #     새외가 없으면 burden 0 → 황실 원정력 30 → 무림 대연합도 결국 갈려 나간다.
  #     관무불가침은 성립하지 않는다. **관이 무림을 외면한 것이 아니라, 손이 없었던 것이다.**
  #   ★ 무림은 이것을 모른다. 관은 안다. **그리고 아무도 말하지 않는다.**
  frontier:
    ref: "faction_politics.yml deterrence.frontier — 수치·동적 변동·징집은 그쪽이 정본"
    gates: [gunjin_daedong, gunjin_sanhaegwan, gunjin_gayokgwan, gwanmun_songban, gwanmun_jinnam, sibaksa_myeongju]
    the_inversion: |
      ★★ **국경이 조용해지는 것이, 국경이 무너지는 것보다 무림에게 위험하다.**
        화친(和親)·조공(朝貢)이 성사되면 burden 0.75 → 0.60 → 관 원정력 7.5 → 12.0.
        ★ 무림은 화친을 축하한다. 그리고 그것이 자기 목을 조이는 줄 모른다.
        ★ 이 세계에서 가장 조용한 재앙이다
    who_knows:
      제갈세가: "★ 안다 (관에 줄이 있다 — relations: jegal ↔ hyeollyeong +1). **그리고 말하지 않는다**"
      개방:     "★ 눈치챈다 (변경의 거지들이 장정 징발을 본다) — 그러나 산수를 못 한다"
      마교:     "★ 정확히 안다. 그래서 대칸을 부추긴다 — **국경을 시끄럽게 하는 것이 마교에게 이익이다**"
      무림:     "★ 모른다"

  # ─── ★ 통행증 (passports) — **아무나 못 간다**를 등록부로 못박는다 ───
  #
  #   ★ 새외 게이트는 '비밀'이 아니다 (그것은 마교의 문법이다). 새외는 **행정**이다:
  #     관문이 있고, 문서가 있고, **무림인은 원칙적으로 그 문서를 못 받는다.**
  #   ★ 그리고 그것이 관무불가침의 조용한 귀결이다 —
  #     관은 무림을 치지 않는다. 다만 **나가지 못하게 한다.** 그것으로 충분하다
  passports:
    노인(路引):
      issuer: 관 (현·부)
      grants: "상로 통행 — 가욕관·진남관. **서역·남만 방면**"
      who_gets_it:
        상단: "★ 자동 (sangdan) — 관세를 내는 자에게 관은 문을 연다"
        표국: "★ 자동 (pyoguk) — 관물 호송의 연장"
        관인: "★ 자동 (gwan_gun favor 4+)"
        무림인: "★ **보증인이 필요하다.** 현령(조문원)·객잔주(한백)·이장(소연)이 서 줄 수 있다.
          → 판정: 화술+매력 vs 보통(10). ★ 실패해도 문은 닫히지 않는다 — 다시 데려오면 된다"
        수배자: "★ 즉시 거절. **관은 기록한다** (gwangun_entry.direct_approach.branches.수배_이력 그대로)"
      note: "★ 가장 흔한 문서. 그래서 **새외로 드는 가장 넓은 문이 서역**이다"
    감합(勘合):
      issuer: 경사 (예부)
      grants: "사절(使節) 왕래 — **북막·동영 방면.** 국경과 바다를 넘는 유일한 합법 문서"
      who_gets_it: "★ 사절단뿐이다. 무림인은 **수행원**으로만 낄 수 있다
        (world_map officialdom.imperial_access.세력_밀사 문법 재사용 — 문파가 보낸다)"
      forgery: "★ 위조가 곧 사건이다 — 발각 시 authority_mandate +12 (관군_부대_습격에 준함).
        ★ 하오문이 판다. 그리고 하오문이 파는 감합은 **반쯤 진짜다** (진짜 관인, 가짜 이름)"
      note: "★ 이 문서 하나가 '왜 아무도 북막에 못 가는가'의 답이다"
    통관첩(通關牒):
      issuer: "관 (승록사) — 그리고 **사찰·도관의 소개장**이 실제 열쇠다"
      grants: "승려·도사의 유행(遊行) — **토번 방면.** 송반관을 지난다"
      who_gets_it: "★ bulga·도가 계보만 (혜각·소림·무당·화산의 소개).
        ★ 세계에서 **가장 좁고 가장 정직한 문**이다 — 신분이 아니라 **계보**를 본다"
      note: "★ 그래서 밀교 유학은 '배신'이 아니라 **유학**이다. 관이 허락한 길이므로"
    없음_밀출국(密出國):
      act: "관문을 넘지 않고 나간다 — 산으로, 사막으로, 배로"
      cost: { authority_mandate: +6, note: "★ 법명분. 그리고 **돌아올 때 걸린다** (관은 기록한다)" }
      effect: "★ 수배 이력 생성 → gwangun_entry 영구 차단 · 노인 영구 거절.
        ★ 즉 **한 번 밀출국하면 다시는 합법으로 못 나간다**"
      note: "★ 가능하다. 세계는 막지 않는다. 다만 **값을 청구한다** (제1원칙: 레일 금지)"
    # ★ 이미 등록된 네 번째 문 — 발명하지 않았다
    군진_입대:
      ref: "faction_entry_routes.yml gwangun_entry.gates.군진_입대"
      truth: |
        ★★ **관군 루트의 군진 입대가 곧 새외의 문이다.** 이미 배선돼 있었다:
          "★ 유일하게 **수배자를 받아 주는 관의 문**이다 — 변군은 묻지 않는다.
           대신 돌아올 수 없다 (속죄의 길이자 유배의 다른 이름)"
        → 대동(25일) · 산해관(37일) · 가욕관(46일). ★ **통행증이 필요 없다. 군적이 곧 통행증이다**
      price: "★ 그리고 그 대가는 이미 적혀 있다: '강호의 소문망에서 이름이 지워진다 — 죽은 것과 다르지 않다'"
      note: "★ 새외를 위해 새 문을 만들지 않았다. **있던 문이 새외를 향하고 있었을 뿐이다**"

  # ─── ★ 불가침이 깨지는 순간 — 이 세계에서 가장 큰 사건 ───
  breach:
    principle: "불가침은 법이 아니라 **균형**이다. 균형은 한쪽이 이익을 다시 계산하면 깨진다"

    관이_먼저_깬다:
      부패_결탁:
        trigger: "지부·현령이 녹림과 결탁 — 상로 통행세를 나눠 먹는다"
        stage: nokrim_jungchae        # ★ 관도를 낀 산채. 관이 눈감아 주니 산채가 큰다
        surface: "북로 도적이 늘었는데 관군이 출동하지 않는다"
        truth: "출동하지 않는 것이 아니라 출동할 수 없다 — 지부가 몫을 받는다"
        player_paths: [증거_확보_상급_고발, 지부_협박_거래, 정파_보고, 녹림_합류, 침묵_대가_수령]
        world_effect: { region_state: { security: "--", public_mood: "-" } }
        note: "★ 가장 흔한 파열. 관이 썩는 것은 조용하다"
      마교_잠식:
        trigger: "금의위·성군 지휘부에 마교 첩자 — 관의 칼을 마교가 쥔다"
        stage: [magyo_nakyang, jangan]
        surface: "관군이 엉뚱한 문파를 친다. 수배 명단이 이상하다"
        truth: "★ 마교는 관을 이기려 하지 않는다. **관이 무림을 치게 만든다**"
        reveal_gate: "마교 잠식도 3단계 이상 — 초기엔 절대 노출하지 않는다 (locked_routes)"
        world_effect: "정파 결집 또는 분열 — 강호가 '누가 첩자인가'를 서로 의심한다"
        note: "★ 이것이 마교 루트의 종착점이다. 마교는 대군을 이끌고 오지 않는다 — 대군을 빌린다"
      역모_혐의:
        trigger: "황실이 특정 문파를 역모로 지목 — 봉문(封門) 또는 멸문(滅門) 칙령"
        stage: [gyeongsa, jangan, 대상_문파]
        force: "성군 + 금군. ★ 문파는 이길 수 없다"
        player_paths:
          - "칙령 집행에 가담 (관군 루트 — 공적·관직)"
          - "문파와 함께 싸운다 (멸문 — 생존 시 수배자)"
          - "문파를 피신시킨다 (지하 문파 — 이후 강호 전체가 은신처가 된다)"
          - "증거를 뒤집는다 (★ 가장 어렵다 — 경사에 닿아야 한다. 황실 접근 경로 참조)"
        world_effect: "강호가 **연합**하는가 **분열**하는가 — 이 갈림이 다음 시대를 정한다"
        note: "★ 세계 최대 사건. 발동 조건은 서사 단계이지 플레이어 행동이 아니다 (GM/챕터 이벤트)"

    무림이_먼저_깬다:
      관리_살해:
        trigger: "플레이어 또는 문파가 관리를 죽였다"
        immediate: "현상수배 — 전 현에 방(榜)이 붙는다. 무공 특징·인상착의가 정확하다 (관은 기록한다)"
        escalation:
          1: "현 포쾌 추격 (이류 박호) — 도망칠 수 있다"
          2: "부병 + 무림 현상금 사냥꾼 — ★ 정파 협객이 온다 (강호의 자기단속)"
          3: "성군 개입 — 소속 문파에 '내놓으라'는 공문. **문파가 당신을 버린다**"
          4: "봉문 — 문파가 문을 닫는다. 당신 때문에"
        player_paths: [도주_새외, 사파_합류, 신분_세탁_하오문, 자수_유배, 관에_공을_세워_사면]
        note: "★ 진짜 대가는 관이 아니라 강호다 — 정파가 먼저 등을 돌린다 (faction_reaction 정파 +2)"
      관아_습격:
        trigger: "문파·산채가 관아를 쳤다"
        result: "★ 불가침의 완전 파기. 성군 출동 → 토벌. 강호는 돕지 않는다"
        note: "녹림 총채가 이 선을 넘으면 관군 대토벌이 시작된다 — 녹림 루트의 종착 사건"
      관물_상실:
        trigger: "표국이 관물(官物) 호송에 실패했다"
        stage: [gwando_jangan_nakyang, nokrim_jungchae]
        result: "표국주 문책 — 신용 붕괴. 관은 표국을 벌하지 파주를 벌하지 않는다"
        player_hook: "★ 진철산(청하 표국)의 파멸 시나리오. 등록 NPC 의 생애 사건으로 쓸 수 있다"
        note: "★ 불가침이 깨지는 가장 작은 파열 — 그래서 가장 먼저 쓸 수 있다"

    aftermath:                        # 깨진 뒤의 세계
      강호_연합: "문파들이 뭉친다 — 관이 하나를 치면 다음은 우리다. ★ 무림맹의 탄생 조건"
      강호_분열: "문파들이 관에 붙는다 — 남의 멸문은 나의 공적이다. ★ 정파가 정파를 친다"
      결정_요인: "지목된 문파의 명성 + 관의 명분(증거) + 플레이어의 개입. **정해져 있지 않다**"
      region_state: "치안·민심 전 지역 급락. 소문망 최대 강도 (rumor.yml)"

  # ─── 황실 접근 경로 — ★ 있되 닿을 수 없다 ───
  imperial_access:
    principle: "★ 대부분의 플레이어는 평생 못 간다. 그래야 황실이 황실이다"
    gate_base: "경사까지 28일 여정 + 경사 성문에서 **신분 검문** (무기 소지 무림인은 입성 불가가 원칙)"
