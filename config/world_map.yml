  청해_서역:
    center: [-1380000, -180000]
    extent: [700000, 500000]
    terrain: "설산과 사막 — 곤륜이 하늘을 받친다"
    biomes: [grove, jagged_peaks, savanna, badlands]
    forge: [설산, 사막]             # ★ 곤륜(설산)·가욕관(사막) — 둘 다 바닐라 바이옴에 의존 중이다. §15 참조
    climate: "고산 한랭 + 사막"
    tier_bias: poor
    factions: [gonryun]
    note: "★ **중원의 마지막 땅**이다. 여기까지가 관(官)이고, 가욕관 밖이 서역이다.
      곤륜파는 '서역으로 나가는 마지막 문'(등록부 원문) — 문 안에 있다. 그래서 구파일방이다"

  새외_북막:
    center: [-1940000, -1070000]
    extent: [900000, 600000]
    terrain: "초원과 사막 — 지평선. 중원이 아니다"
    biomes: [plains, taiga, savanna, windswept_savanna]
    forge: [초원, 사막]             # ★ 지형 요청 — §15 terrain_requests 참조 (바닐라 바이옴에 기대지 않는다)
    climate: "극한 대륙성 — 여름은 타고 겨울은 얼어붙는다"
    tier_bias: poor
    hidden: true                    # ★ 마교 본교가 여기 있으므로 hidden 이다 (지역이 숨은 게 아니라 흑성이 숨었다)
    factions: [magyo, bukmak]
    note: |
      ★ 실지리로 읽으면 여기는 **준가르(신강 북부)** 다 — 몽골 초원이 아니라 그 서쪽 끝.
        (역투영: x -1.94M → lon 88.0°, z -1.07M → lat 44.0°)
      ★ 그래서 이렇게 읽는다: **북막 한국의 서쪽 변두리 — 대칸의 손이 가장 느슨한 곳.**
        마교의 흑성이 하필 여기 선 이유다. 대칸이 땅을 빌려주었고, 마교는 조공한다
        (faction_politics relations: bukmak ↔ magyo = +1 거래).
      ★ 귀결: **마교가 남하하려면 북막의 땅을 지나야 한다.** 통행을 사야 한다.
        기존 note("마교 본교 → 대동 → 경사가 최단 침공로")는 여전히 참이다 —
        그 길이 **북막을 지날 뿐**이다. 그리고 그것이 마교가 대칸을 부추기는 이유다

  # ─────────────────────────────────────────────────────────────────────
  # ★ 새외(塞外) — 중원 밖. 아래 다섯은 **관문 너머**다
  #
  #   ★ 원칙: 새외는 hidden 이 아니다. **알려져 있다. 다만 멀다.**
  #     (마교는 hidden = 모른다 / 새외는 안다 = 못 갈 뿐이다. 이 대비가 두 축의 정의다)
  #   ★ 그래서 게이트는 '비밀'이 아니라 **거리·관문·통행증**이다 (§9 passports).
  # ─────────────────────────────────────────────────────────────────────

  막북_초원:
    center: [-500000, -1400000]
    extent: [2000000, 700000]       # x -1.5M~+0.5M, z -1.75M~-1.05M
    terrain: "초원 — 지평선. 나무가 없다. **숨을 데도 없고 막을 것도 없다**"
    biomes: [plains, meadow, windswept_savanna]
    forge: [초원]
    climate: "극한 대륙성 — 겨울에 가축이 얼어 죽는다. ★ 그 겨울이 곧 남하의 이유다"
    tier_bias: poor                 # ★ 가난하다. 그런데 강하다 — 그 둘의 조합이 유목 제국이다
    factions: [bukmak]
    note: |
      ★ 대동 군진(gunjin_daedong)이 마주 보는 것이 여기다.
        "★ 마교 남하의 정면"이라고 적혀 있었는데 — **정확히는 북막의 정면**이고, 마교는 그 뒤에 얹혀 있다.
      ★ 여기에는 성(城)이 없다. 한정(汗庭)조차 천막이다 — **칠 표적이 없다.**
        그래서 정벌(征伐)은 언제나 실패한다: 군대를 몰고 가면 그들은 흩어지고, 돌아오면 다시 온다.
        ★ 이것이 황실이 조공·화친을 택하는 진짜 이유다 (faction_politics deterrence.frontier.policies)

  서역:
    center: [-1900000, -800000]
    extent: [1500000, 900000]       # x -2.65M~-1.15M, z -1.25M~-0.35M
    terrain: "사막과 오아시스 — 길은 점(點)으로 이어진다. **오아시스를 놓치면 죽는다**"
    biomes: [savanna, badlands, eroded_badlands, windswept_savanna]
    forge: [사막, 오아시스]
    climate: "극건조. 낮에 타고 밤에 언다"
    tier_bias: poor                 # ★ 땅은 가난하다. 그러나 **길이 부유하다** — 비단길이 지난다
    tier_note: "오아시스 도시(고창·돈황)는 rich — 상로의 목이다. 그 사이 사막은 tier none"
    factions: [seoyeok_sangmaeng, baehwa_singyo]
    note: |
      ★ 가욕관(gunjin_gayokgwan)은 이 지역권 **밖**이다 (x -968,600 — 청해_서역).
        즉 가욕관은 서역의 문이 아니라 **중원의 마지막 문**이다. 그 밖이 여기다.
      ★ 곤륜파(x -1,373,600 · z -184,700)도 밖이다 — 곤륜은 "서역으로 나가는 마지막 **도관**"이지
        서역이 아니다. 등록부가 이미 그렇게 적어 두었다

  토번_고원:
    center: [-1500000, 400000]
    extent: [1000000, 700000]       # x -2.0M~-1.0M, z +0.05M~+0.75M
    terrain: "고원과 설산 — 하늘에 가깝다. **공기가 얇다**"
    biomes: [grove, plains, jagged_peaks, windswept_hills]
    forge: [고원, 설원, 설산]
    climate: "고산 한랭. 여름에도 밤에는 언다"
    tier_bias: poor
    factions: [seolyeok_milgyo]
    note: |
      ★ 여기로 드는 길은 **사천을 지난다** (차마고도 — routes.sangro_chama).
        차(茶)와 말(馬)을 바꾸는 길이고, **그 길을 사천당가가 쥐고 있다**
        (faction_politics relations: seolyeok_milgyo ↔ dangga = +1).
      ★ 병력이 없다 (frontier.garrisons.토번_남만 troops: 0) — **설산이 곧 변군이다.**
        그래서 이쪽은 침공로가 아니라 **상로**다. 밀교는 오지 않는다. 우리가 갈 뿐이다

  남만:
    center: [-780000, 1380000]
    extent: [640000, 440000]        # x -1.1M~-0.46M, z +1.16M~+1.6M
    terrain: "밀림 — 길이 아니라 짐승길. **지도가 소용없다**"
    biomes: [jungle, bamboo_jungle, sparse_jungle, mangrove_swamp, swamp]
    forge: [밀림]
    climate: "열대 습윤. 장기(瘴氣) — 사람이 병들어 죽는다"
    tier_bias: poor
    factions: [odokgyo]
    note: |
      ★ 운남(중원 변경)과 남만(중원 밖)은 다르다 — 점창파가 그 경계에 서 있다
        ("밀림 위 고산 — 남만과 중원의 경계에 선 문파").
      ★ 혈교 은거지(hyeolgyo_eungeo, z 1,120,100)는 **운남**이다 — 이 지역권 바로 북쪽.
        즉 혈교는 오독교의 문턱에 숨어 있다. 그리고 오독교는 그것을 알고 쫓고 있다
        (relations: odokgyo ↔ hyeolgyo = -2). ★ 혈교 루트 플레이어가 남만으로 도망치면
        **거기가 세상에서 가장 나쁜 곳이다**

  동영:
    center: [2100000, 250000]
    extent: [600000, 800000]        # x +1.8M~+2.4M, z -0.15M~+0.65M
    terrain: "섬 — 바다가 가른다. **관문이 없다**"
    biomes: [forest, cherry_grove, jagged_peaks, beach, ocean]
    forge: [섬]
    climate: "온난 습윤. 태풍"
    tier_bias: middle
    factions: [dongyeong]
    note: |
      ★★ **지도에서 가장 먼 것이 실제로 가장 가깝다.**
        청하현에서 57일. 그러나 **소주(강남)에서 26일**이다 — 소주가 25일이니 **하루 차이**다.
      ★ 그리고 그것이 왜구(倭寇)의 전부다: 그들은 관문을 지나지 않는다. **바다에는 문이 없다.**
        산해관도 가욕관도 대동도 무의미하다. 해방(海防)은 성이 아니라 배이고, 배는 뚫린다
        (faction_politics deterrence.frontier.garrisons.해방).
      ★ 그래서 남궁세가(안휘)와 해남파가 각각 첫 방벽이다 —
        팽가가 북쪽 방벽이듯 (relations: dongyeong ↔ namgung/haenam = -2).
        **오대세가와 구파가 왜 그 자리에 있는지가 지도에서 읽힌다**

# ═══════════════════════════════════════════════════════════════════════════
# 5. 장소 등록부 (places) — 좌표·지형·성격·접근 조건
# ═══════════════════════════════════════════════════════════════════════════
#
# 필드:
#   pos          : [x, z] — 청하현 원점 기준 오프셋 = 월드 좌표 (origin_world 가 [0,0] 이므로 같다)
#   region       : 소속 지역권
#   terrain      : 요구 지형 (terrain_types)
#   biomes       : 선호 바이옴 (시드 점수에 가산)
#   tier         : village_tiers.yml 등급 (rich / middle / poor / none)
#   faction      : factions.yml id (등록제 — 새 세력 발명 없음)
#   travel       : { factor, days } — 청하현에서. days = travel.formula 결과
#   access       : 접근 조건 — 언제 열리는가
#   build        : now(지금 조성) / later(좌표만) / never(조성 안 함 — 서사 장소)
#   scale        : 조성 시 무대 반경 (블록)
#   hidden       : true = 플레이어 지도에 표시하지 않는다

places:

  # ─────────────────────────────────────────────────────────────────────
  # 5.1 청하현 — 세계의 원점. **지금 조성하는 유일한 곳**
  # ─────────────────────────────────────────────────────────────────────
  cheongha_hyeon:
    name: "청하현"
    pos: [0, 0]
    region: 섬서
    terrain: 평지
    biomes: [plains, meadow, forest]
    tier: middle
    faction: hyeollyeong
    travel: { factor: 1.00, days: 0 }
    access: 항상
    build: now
    scale: 1500                     # map_spec outskirt_radius 그대로 — 조성 무대 반경
    builder: "CheonghaBuilder.build(world, cx, cy, cz, zones)"
    region_file: config/regions/cheongha_hyeon.yml
    map_spec: config/map_spec/cheongha_hyeon_map.yml
    note: "섬서 관중 평야 서부. 북쪽에 산(북산), 남서쪽에 강(위수) — map_spec terrain.base 와 일치"

  # ─────────────────────────────────────────────────────────────────────
  # 5.2 현성·도시 — 관아가 있고 치안이 있는 곳
  # ─────────────────────────────────────────────────────────────────────
  jangan:
    name: "장안"
    build_radius: 64                # ← region_archetypes.md §2.2: 성벽 **l = ±62** — 64 가 그것을 감싼다
    pos: [37800, 6600]
    region: 섬서
    scale_system: administrative
    terrain: 평지
    archetype: 성문                  # ← config/npcs/regions/jangan.yml `archetype: 성문` (등록부가 적어 두었다)
    population: config/npcs/regions/jangan.yml   # 13인 — ★ 전부 **성벽 바깥**에 산다 (성 안은 짓지 않는다)
    biomes: [plains, sunflower_plains]
    tier: rich
    faction: gwan_gun
    travel: { factor: 1.15, days: 1 }   # 관도
    access: 항상
    build: later
    scale: 3000
    note: "섬서 성도(省都). 관군 절도사·전장 본점·하오문 대거점. 청하현에서 관도로 하루"
    registry: 등록_예약               # ★ 신규 지명 — 문서 끝 reserved_nouns 참조

  nakyang:
    name: "낙양"
    build_radius: 64                # ← 성문 원형 (성벽 l = ±62)
    pos: [368200, -32100]
    region: 하남
    scale_system: administrative
    terrain: 평지
    archetype: 성문                  # ← region_archetypes.md §2 제목: "성문(城門) — 성시의 관문 (장안 · **낙양** · 개봉)"
    tier: rich
    faction: gwan_gun
    travel: { factor: 1.15, days: 11 }
    access: 항상
    build: later
    scale: 3000
    registry: 등록_예약

  gaebong:
    name: "개봉"
    build_radius: 64                # ← 성문 원형 (성벽 l = ±62)
    pos: [543800, -52000]
    region: 하남
    scale_system: administrative
    terrain: 평지
    archetype: 성문                  # ← region_archetypes.md §2 제목: "성문(城門) — 성시의 관문 (장안 · 낙양 · **개봉**)"
    tier: rich
    faction: gwan_gun
    travel: { factor: 1.15, days: 16 }
    access: 항상
    build: later
    scale: 3000
    registry: 등록_예약

  taewon:
    name: "태원"
    archetype: pending
    pending_why: "★ **상단(商團)의 원형이 없다** (§16 requested.상단 — Q-D). **형태**가 미결이다"
    build_radius: unresolved        # ★★★ **등급을 모르므로 크기도 모른다** (사다리는 이제 있다 — 등급이 없다)
    build_radius_why: "★★★ **`unresolved` 를 40 으로 자동 대체하지 않는다** (사용자 원문):
      *'`commercial_class` 가 없으면 outpost / 잘못되면 radius 40 — **이 구현을 금지한다.**
        **모르는 장소를 작은 장소로 간주하는 것도 하나의 창작이기 때문이다.**'*
      ⇒ commercial_class 가 unresolved 이면 build_radius 도 unresolved 다.
        **집이 안 선다. 그리고 왜 안 서는지 말한다** (린트 규칙 3)"
    pos: [377600, -391400]
    region: 산서
    scale_system: commercial
    # ★ 상업 3요소 — §17-b. ★★ martial · mandate_weight 를 **부여하지 않는다** (상단은 무림 문파가 아니다)
    commercial_class: unresolved
    wealth_tier: unresolved
    route_centrality: 0             # ★ 도출값 — §7 routes 중 이 좌표를 waypoint 로 갖는 길: **없다**
    settlement_role: unresolved
    unresolved_why: "★ **근거가 부족하다 — 지어내지 않는다.** 등록부가 태원에 대해 말하는 것은
      '산서 상인의 도시'(성격) · tier rich · 하오문 창구(상단_객잔) 뿐이다.
      ★ 그것은 **성격이지 등급이 아니다** — 정기시장인지 지역 상업도시인지 **아무도 안 적었다**.
      ★ 그리고 등록된 길이 **하나도 안 지난다** (route_centrality 0) — 교역로 합류의 근거가 없다"
    terrain: 고원
    tier: rich
    faction: sangdan
    travel: { factor: 1.35, days: 18 }
    access: 항상
    build: later
    note: "산서 상인의 도시 — faction_entry_routes 에 '산서' 가 하오문 정보망으로 등장한다"
    registry: 등록_예약

  muhan:
    name: "무한"
    archetype: pending
    pending_why: "★ **상단(商團)의 원형이 없다** (§16 requested.상단 — Q-D).
      ★★ **크기는 이제 안다(64). 형태를 모른다** — 사용자 원문:
        *'도시의 규모는 상업 등급이 정하고, **내부의 생김새와 밀도는 건축 원형이 정한다**'*"
    build_radius: 64                # ★★★ trade_city → 64 (§17-b commercial_scale.radius_ladder — 상업 전용 표)
    build_radius_why: "★ **상업 사다리에서 읽었다** — trade_city: 64.
      ★★★ 남궁·화산의 64 와 **같은 수이지만 다른 계약이다** (사용자 원문):
        *'같은 반경이 같은 장소를 뜻하지 않는다. **내부의 기하와 밀도가 전혀 다르다**'*
      ★ 무림 반경이 바뀌어도 이 값은 **자동으로 안 바뀐다** — 두 표는 남남이다 (린트 규칙 5)"
    pos: [543800, 413500]
    region: 호북
    scale_system: commercial
    # ★ 상업 3요소 — §17-b. ★★ martial · mandate_weight 를 **부여하지 않는다**
    commercial_class: trade_city
    class_basis: "★ **등록부가 명시한 기능으로 판정했다 — 지어내지 않았다:**
      ① 등록부 원문: '장강 중류 **최대 나루**. 수로채와 상단이 **같은 물**을 쓴다'
      ② ★ **두 교역로가 여기서 만난다** — sulo_jangang(장강 수로) · haero_dongyeong(동영 해로)이
         둘 다 이 좌표를 waypoint 로 갖는다 (route_centrality 2).
      ⇒ trade_city = '여러 교역로가 만나는 상업도시'. **정의가 그대로 성립한다**"
    wealth_tier: unresolved
    route_centrality: 2             # ★ 도출값 — sulo_jangang · haero_dongyeong (§7 waypoints 실측)
    settlement_role: 지역_상업도시
    terrain: 강
    tier: rich
    faction: sangdan
    travel: { factor: 0.85, days: 15 }   # 수로 — 배로 간다
    access: 항상
    build: later
    note: "장강 중류 최대 나루. 수로채와 상단이 같은 물을 쓴다"
    registry: 등록_예약

  soju:
