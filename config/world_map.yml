    # ── 천막 — 북막 한정. ★ 이 원형의 **정의는 부재(不在)다** ──
    천막:
      for: bukmak
      only: [bukmak_hanjeong]
      r: 48                          # ★★ **원형의 기하가 못 박았다** — §17 pinned_by_archetype.천막
