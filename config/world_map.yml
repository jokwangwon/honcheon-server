# ═══════════════════════════════════════════════════════════════════════════
# 15. ★★ 지형 요청서 (terrain_requests) — **지형 담당(TerrainForge)에게 넘기는 주문서**
# ═══════════════════════════════════════════════════════════════════════════
#
# ─────────────────────────────────────────────────────────────────────────────
# ★★★ 왜 이 절이 필요한가 — 사막·빙설 조율의 결론
#
#   사용자가 "사막 필드도 다 필요없음. 얼음 지역도 필요없음" 이라고 했다. 옳다.
#   그런데 **끄는 것만으로는 새외가 성립하지 않는다.** 그 이유를 코드에서 확인했다:
#
#   ▸ TerrainForge.profile() (server-mvt/.../TerrainForge.java:592-621) 의 switch:
#         case "평지","평야","분지","초원","폐허" → Profile.들
#         mountainous(산·험산·설산·고원)          → Profile.봉우리 / 중턱단
#         default                                  → Profile.그대로   ← ★ **아무것도 안 한다**
#     → **사막·섬·밀림·강·수향은 전부 `그대로`** 다. 지형 계층은 그것들을 **빚지 않는다.**
#
#   ▸ 더 결정적인 것: TerrainForge.grassOrStone() (:493) 은
#     주변 자연 표층이 SAND/SNOW_BLOCK 이면 **그것을 따라간다**.
#     즉 지형 계층은 사막·설원을 **읽어서 흉내낼** 뿐, **만들 줄 모른다.**
#
#   ★★ 귀결: **바닐라 사막·빙설 바이옴을 끄면, 이 세계에서 모래와 눈의 유일한 출처가 사라진다.**
#      · 곤륜파(설산) → 회색 돌산이 된다 (설산인데 눈이 없다)
#      · 가욕관(사막) → 잔디밭이 된다
#      · 서역·토번·막북 전체 → 지형이 없다
#
#   ★★★ 그래서 조율의 결론은 사용자의 제안 그대로이되, **한 줄이 더 붙는다**:
#
#        **끈다 — 통제 불가능한 무작위 배치는.**
#        **만든다 — 등록 좌표의 의도된 지형은.**
#        **★ 그리고 '만든다'는 아직 존재하지 않는다. 그것을 이 절이 주문한다.**
#
#     (자연 동굴을 끄고 우리가 굴을 판 것과 **정확히 같은 원칙**이다 —
#      worldgen/honcheon_no_caves 가 동굴을 끄고, TerrainForge.digCave() 가 판다.
#      ★ 다만 동굴은 파는 코드가 **있었고**, 사막은 **없다.** 그것이 이 요청서의 전부다)
#
#   ★ 시급하지 않다: 새외 7 좌표는 전부 build: later 다. **좌표가 먼저고 조성은 나중이다** (§1 원칙).
#     다만 **곤륜·가욕관은 이미 등록된 중원의 장소**다 — 바이옴을 끄는 순간 저 둘이 먼저 깨진다.
#     ★ 그래서 우선순위 0 이 곤륜·가욕관이다. 새외보다 먼저다.
# ─────────────────────────────────────────────────────────────────────────────

terrain_requests:
  owner: "지형 계층 (TerrainForge) — ★ 이 절은 **요청**이다. 구현은 지형 담당이 한다"
  contract: "docs/design/terrain_layer.md §5 — '지도가 주문하고 TerrainForge 가 빚는다'. 그 문법 그대로"
  new_field: "places.*.forge — ★ 이 패스에서 신설. `biomes:`(선호, 시드 점수 가산)와 다르다:
    **biomes 는 바라는 것이고, forge 는 요구하는 것이다.** 바닐라를 끄면 biomes 는 죽고 forge 만 남는다"

  # ─── 우선순위 0 — ★ 바이옴을 끄면 **지금 당장** 깨지는 것 (새외보다 먼저다) ───
  priority_0_regression:
    - place: gonryun
      terrain: 설산
      forge: [설산, 설원]
      breaks_how: "★ 이미 등록된 구파일방 본산이다. 지금은 바닐라 snowy_slopes 에 의존한다.
        바이옴을 끄면 **눈 없는 설산** — Profile.봉우리가 회색 돌산을 세운다 (팔레트 STONE/DEEPSLATE 하드코딩)"
      need: "봉우리 위에 **설선(雪線)** — 일정 y 이상 표층을 SNOW_BLOCK/POWDER_SNOW 로. 팔레트 분기 하나면 된다"
    - place: gunjin_gayokgwan
      terrain: 사막
      forge: [사막]
      breaks_how: "★ terrain '사막'은 profile() switch 에 **없다** → default → Profile.그대로 →
        바닐라가 준 땅을 그대로 쓴다. 바닐라 사막을 끄면 **잔디밭 위의 서북 관문**이 된다"
      need: "사막 원형 — 아래 archetypes.사막"
    - place: taebaeksan
      terrain: 험산
      forge: []
      breaks_how: "biomes 에 snowy_slopes 가 있으나 **요구가 아니라 선호**다 — 눈이 없어도 험산은 성립한다. ✔ 안전"
      need: 없음
    - note: "★ 하북(taiga·snowy_plains)·산서(badlands)는 **지역권 biomes** 일 뿐 장소 요구가 아니다.
      다만 worldgen 담당이 **전역으로** 끄면 하북의 '겨울이 길다'가 그림에서 사라진다 —
      ★ **중원의 눈까지 끄지는 말 것.** 끌 것은 '무작위 배치'이지 '눈' 자체가 아니다"

  # ─── 지형 원형 (archetypes) — ★ 지형 담당이 만들 것. Profile enum 확장 또는 shape() 분기 ───
  #   현재 Profile: [봉우리, 중턱단, 들, 그대로] — 넷뿐이다.
  #   아래 다섯이 더 필요하다. **셋은 표층 문제이고, 둘은 진짜 지형 문제다** (난이도가 다르다)
  archetypes:

    사막:
      difficulty: 낮음               # ★ 표층 문제다 — 기복은 '들'과 거의 같다
      terrain_type: { water_pct: [0, 3], relief: [0, 40] }   # §3 이미 등록돼 있다
      base_profile: 들               # ★ levelField() 를 그대로 쓴다 — 발치를 메워 고른다
      needs:
        표층: "GRASS_BLOCK → SAND / RED_SAND. 그 아래 4~6칸 SANDSTONE. ★ grassOrStone() 에 팔레트 분기 하나"
        기복: "사구(砂丘) — 저주파 사인파 2~3중첩으로 완만한 물결 (진폭 8~16, 파장 60~120).
          ★ 봉우리처럼 세우지 않는다. **사막은 평평한 게 아니라 물결친다**"
        식생: "없음. ★ TerrainForge 는 지금 식생을 **지우기만** 한다 (foliage()) — 그것이 여기서는 정답이다"
        선택: "선인장·죽은 덤불은 있으면 좋고 없어도 된다 (분위기)"
      places: [gunjin_gayokgwan, seoyeok_gochang, donhwang, baehwa_seonghwadan]
      note: "★ 가장 쉽고 가장 급하다 (가욕관이 이미 등록돼 있으므로)"

    오아시스:
      difficulty: 중간               # ★ 물을 **만들어야** 한다 — 지금 TerrainForge 는 물을 안 만든다 (tidyWater 는 정리만)
      terrain_type: "★ §3 에 없다 — 신규 제안: { water_pct: [5, 20], relief: [0, 25], surrounded_by: 사막 }"
      base_profile: 들
      needs:
        물: "★ 중심에 얕은 못 (반경 20~40, 깊이 3~6). **사막 원형의 예외 패치**로 판다"
        녹지: "못 주변 반경 +30 만 GRASS_BLOCK + 나무 (대추야자 대용: JUNGLE/ACACIA)"
        경계: "★ 급격해야 한다. 오아시스는 그라데이션이 아니다 — **물이 있는 데까지가 초록이고 그 밖은 모래다**"
      places: [seoyeok_gochang, donhwang]
      note: |
        ★ 이것이 서역 설계의 심장이다: **오아시스를 놓치면 죽는다** (routes.sangro_silk.survival).
          그 서사가 지형에서 읽히려면 **모래 한가운데 진짜 물이 있어야** 한다.
