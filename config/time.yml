# 시간 시스템 규칙 (기계 판독용)
# 기준 문서: docs/design/world_reaction_system.md 2장
# 설계 검토 공백 G4 해결
#
# 개인 시간은 '하루 5구간제'로 굴린다.
# 데드라인 사건("내일 해 질 무렵 습격")은 남은 구간 수로 카운트다운한다.

day_segments: [새벽, 아침, 낮, 해질녘, 밤]
segments_per_day: 5

# 행동 비용 등급
cost_classes:
  minor: "구간 소모 없음 — 같은 구간에 최대 3회"
  segment: "1구간 소모"
  half_day: "2~3구간 소모"
  full_day: "1일 소모"
  multi_day: "며칠 소모 (여행, 장기 수련)"

# 행동별 시간 비용
action_costs:
  짧은_대화: minor
  설득_협상: minor              # 단, 재시도는 상대가 자리를 뜨면 불가
  소문_수집: segment
  현장_조사: segment
  현_내_이동: segment
  잠복: segment                  # 연장 시 구간당 재판정 없음, 피로 누적
  야간_잠복: segment             # '밤' 구간 전체
  미행: "대상 이동 시간에 종속"
  엿듣기: minor                  # 잠복/미행에 붙는 부속 행동
  치료_경상: segment
  치료_중상: full_day
  수련_기초: full_day            # 성장 효과는 성장 규칙 참조
  인접_현_여행: "1~2일 (multi_day)"
  지역권_이동: "3~7일 (multi_day)"

# 피로 규칙 — 시간 압박과 무리한 강행의 대가
fatigue:
  no_rest_night: "밤 구간에 휴식하지 않으면 다음 날 '피로' 상태 (판정 -1)"
  consecutive_limit: "피로 상태로 2일 연속 활동 시 판정 -2로 가중"

# 데드라인 사건 규칙
deadline_events:
  representation: "사건 타이머 = 남은 구간 수 (내부). 플레이어에게는 서사로만 ('해가 기울기 시작했다')"
  example: "'내일 해 질 무렵 습격' — 밤 구간에 인지했다면 잔여 8구간 (밤→새벽→아침→낮→해질녘)"
  expiry: "타이머 소진 시 사건은 플레이어 없이 진행된다 — 세계는 기다려주지 않는다"

# 세 층위 시간의 접합 (기획서 2장)
time_layers:
  개인_시간: "위 구간제로 소모. 플레이어마다 따로 흐른다"
  지역_누적_시간: "사건 결과가 region_state.yml 수치에 쌓인다. 일 단위로 소문 전파/감쇠 처리"
  세계_공통_시간: "계절, 대형 세력전 등. 별도 캘린더 (추후 설계)"
