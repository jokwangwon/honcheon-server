# ═══════════════════════════════════════════════════════════════════════
# 지형의 결(結) — 덩어리 등록부
# ═══════════════════════════════════════════════════════════════════════
#
# 사용자 판정:
#   "지형을 빚을 때 점처럼 찍어버려서 깔끔한 필드가 아닌 한 칸 한 칸 다른 필드가 되어 버리는 경우가 있어요"
#
# ★ 병의 뿌리는 **결정론 그 자체가 아니라 파장이었다.** 조성기에 난수는 없다(규약) — 흔들림은 전부
#   좌표 해시(Math.floorMod)였다. 그런데 좌표 해시는 **파장이 한 칸**이다: 이웃 칸과 아무 상관이 없다.
#   그래서 칸마다 따로 뽑힌 값이 **점묘(點描)**가 됐다 — 잔디 옆에 흙, 그 옆에 자갈.
#
# ★ 고침: 좌표 해시를 **격자에 깔고 보간한다**(값 잡음, value noise). 격자점에만 해시를 뽑고
#   그 사이는 부드럽게 이어 붙이면, 값은 **이웃과 상관이 생긴다** = 덩어리가 된다.
#   난수는 다시 들이지 않았다 — 여전히 **좌표의 순수 함수**다 (같은 좌표 = 같은 땅).
#
#   cell = 덩어리 한 변(칸). 크게 잡으면 넓은 들, 작게 잡으면 잔결.
#
# ★ 이 파일은 지형 담당(TerrainForge)의 것이다. `terrain.yml`(지도 담당)과 섞지 않는다.
# ★ 눈: tools/TerrainGrainSelfTest.java — 표본 구획에서 **이웃과 다른 칸의 비율**을 센다.

# 지면의 요철 — 전이대(feather)·중턱단(benchTerrace)이 지면 높이를 흔드는 폭
undulation:
  cell: 9          # 덩어리 한 변 (칸) — 요철 하나가 대략 이만큼 이어진다
  amplitude: 1     # ±칸 (구판과 같은 진폭. 달라진 것은 **파장**이다)

# 들의 가장자리 — 자연으로 풀어 주는 내림 (levelField)
field_edge:
  cell: 7
  drop: 2          # 0 … 이 값만큼 내려간다

# 사막의 표층 자재 — 모래밭에 자갈밭과 붉은 모래가 **덩어리로** 눕는다
desert:
  cell: 13
  gravel: 0.55     # 결의 값이 이보다 크면 자갈 (문턱을 낮추면 자갈밭이 넓어진다)
  red_sand: 0.40   # 결의 값이 -이 값보다 작으면 붉은 모래

# 설원 — 설선의 들쭉날쭉과 만년빙
snow:
  cell: 11
  wobble: 3        # 설선을 ±이만큼 흔든다 (자로 그은 설선은 설선이 아니다)
  glacier_cell: 8
  glacier: 0.35    # 결의 값이 이보다 크면 만년빙 (설선 +30 위, 표층 아래에서만)

# 동굴 바닥 — 돌 사이에 자갈이 **깔린다** (뿌려지지 않는다)
cave_floor:
  cell: 5
  gravel: 0.25

# ★★ 눈의 문턱 — 점묘 판정
#   이웃한 두 칸이 서로 다른 비율(인접쌍 불일치율)이 이보다 크면 **점묘로 본다**.
#   깔끔한 필드는 덩어리 안쪽이 전부 같으므로 경계에서만 달라진다 → 낮다.
#   칸 단위 독립 선택은 거의 매 쌍이 다르다 → 높다 (구판 실측 0.6~0.9).
eye:
  speckle_max: 0.30      # 인접쌍 불일치율 상한
  isolated_max: 0.03     # 이웃 넷과 **모두** 다른 칸(외톨이)의 비율 상한
