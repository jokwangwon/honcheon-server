# 문파 계보 무공 — 하급 · 중급 · 상급 (skills.yml tier/lineage 와 짝)
# ══════════════════════════════════════════════════════════════════════════════
# 설계: docs/design/sect_lineage.md
#
# ★ 이름만 다르면 그건 하나의 무공이다. 계보는 **수치로** 갈린다:
#   최속 점창 [2,1,3] ↔ 최중 종남 [13,4,16]  ·  최장 남궁 선 7.5 ↔ 최단 소림 호 2.4
#   최다단 점창 5히트 ↔ 단발 팽가 파격       ·  최장 이동 곤륜 10 ↔ 무당 원 2.8

# ─── 【본래 위력】 미대성 강등 규약 (degraded) ────────────────────────────────
# 노션 원칙: "상급은 하급·중급 숙련 6 이상이어야 본래 위력을 낸다 — 배울 순 있으나 제 힘이 안 난다"
#
# ★ 위력을 깎지 않는다. **격이 안 실리고 특수 속성이 안 핀다.**
#   근거 ①: combat.yml technique_power — 무공 위력은 **등급**이 정한다 (절정급 2). 등급은 그대로다
#   근거 ②: mastery_ladder 대성(6~7) = "특수 속성 완전 발현" — 이 사다리가 이미 그렇게 적혀 있었다
#   근거 ③: combat.yml qi_power_note — "지불이 끊기면 그 합의 피해는 외공기 값으로 떨어진다(다운캐스트)"
#           → 다운캐스트는 이미 있는 문법이다. 새 축을 만들지 않고 그 문법을 **숙련에 연결**했을 뿐이다
#
# 기각한 안:
#   · 위력 감쇠(× 0.5)  — "위력은 등급이 정한다"와 "절기는 위력을 사지 않는다"를 동시에 깬다
#   · 실패율(시전 실패) — 2d6 판정에 이미 실패가 있다. 이중 실패 = "안 나가는 검" = 조작감 파괴
#   · 내력 추가 소모(cost 3→4) — cost 4 는 강기 밴드(2~6)로 새어 들어가 combat_audit 의
#     격 역추정을 깨뜨린다 (요구 경지 절정인데 개방 경지가 화경으로 잡힌다 = dead_gate)
