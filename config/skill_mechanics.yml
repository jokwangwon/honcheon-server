    qi_rider: { step: 1, 격: 검기, cost: 3, gate: 절정, power: 2, vfx: "빛이 갈라진다 — 별이 쏟아진다" }
    mastery_gate: { 하급: 6, 중급: 6 }

# ─── 점창파 — jeomchang_geom (쾌검 — 전 계보 최속) ───
  bungwang_geom:                  # 분광검법 (하급) — 빛이 갈라지듯
    combo:
      - { type: 선, width: 0.5, length: 2.6, frames: [2, 1, 3], stagger: 약, cost: 0 }
      - { type: 선, width: 0.5, length: 2.6, frames: [2, 1, 3], stagger: 약, cost: 0 }
      - { type: 선, width: 0.5, length: 2.6, frames: [2, 1, 3], stagger: 약, cost: 0 }
      - { type: 선, width: 0.6, length: 3.0, frames: [3, 1, 5], stagger: 중, cost: 0 }
    combo_input_window: 6         # ★ 전 무공 **최단** 입력창 — 쾌검은 끊기면 처음부터다
    cooldown_ticks: 50            # 최단 쿨다운
    qi_rider: { step: 4, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "빛 한 줄 — 이미 지나갔다" }
    # 정체성: 프레임 [2,1,3] — 전 무공 **최속**. 대신 사거리 2.6(짧다) · 경직 약 · 폭 0.5(가장 좁다)

  hoepung_muryu_geom:             # 회풍무류검법 (중급) — 바람이 돌고 버들이 춤춘다
    combo:
      - { type: 선, width: 0.6, length: 2.8, frames: [2, 1, 3], stagger: 약, cost: 0 }
      - { type: 호, angle: 80, range: 2.8, frames: [3, 1, 4], stagger: 약, cost: 0 }
      - { type: 선, width: 0.6, length: 3.0, frames: [2, 1, 3], stagger: 약, cost: 0 }
      - { type: 호, angle: 90, range: 3.0, frames: [4, 2, 7], stagger: 중, cost: 0 }
    combo_input_window: 6
    feint: "2타를 취소해 3타로 잇는 변초 — 상대 패링 유예 -2 (음풍검과 같은 값. 사파의 변초와 정파의 쾌검이 같은 수를 쓴다)"
    cooldown_ticks: 60
    qi_rider: { step: 4, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "버들이 흔들린다 — 궤가 둘로 보인다" }

  bungwang_sippalsu:              # 분광십팔수 (상급) — 열여덟 갈래. 다단의 극
    type: 선
    width: 0.5
    length: 3.4
    range: 3.4
    angle: 0.5
    frames: [3, 1, 6]             # ★ 10틱 — 전 **절정 무공 최속** (매화점점 14틱보다 빠르다)
    stagger: 약                   # 한 방이 가장 가볍다
    hit_count: 5                  # ★ 전 무공 **최다단** (매화점점·비홍침 3 · 당문비접표 4)
    cost: 3
    cooldown_ticks: 150
    qi_rider: { step: 1, 격: 검기, cost: 3, gate: 절정, power: 2, vfx: "다섯 점의 빛 — 세는 사이에 끝난다" }
    mastery_gate: { 하급: 6, 중급: 6 }
    # 정체성: 최속 + 최다단 + 최약경직. 굳히지 못한다 — 대신 아무도 이만큼 자주 꽂지 못한다

# ─── 청성파 — cheongseong_geom (바람 — 이동과 검이 붙어 있다) ───
  cheongpung_geom:                # 청풍검법 (하급) — 맑은 바람
    combo:
      - { type: 호, angle: 100, range: 3.0, frames: [3, 2, 4], stagger: 약, cost: 0 }
      - { type: 호, angle: 100, range: 3.0, frames: [4, 2, 5], stagger: 약, cost: 0 }
      - { type: 선, width: 0.9, length: 3.6, frames: [6, 2, 9], stagger: 중, cost: 0 }
    combo_input_window: 10
    cooldown_ticks: 80
    qi_rider: { step: 3, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "바람 한 줄기 — 잎이 날린다" }

  neungpung_geom:                 # 능풍검법 (중급) — 바람을 타고 넘는다
    combo:
      - { type: 돌, distance: 4, range: 2.4, angle: 90, frames: [4, 2, 5], stagger: 약, cost: 0 }  # ★ 검 계보 유일 — 돌진으로 연다
      - { type: 호, angle: 110, range: 3.2, frames: [4, 2, 5], stagger: 중, cost: 0 }
      - { type: 선, width: 1.0, length: 4.0, frames: [7, 2, 10], stagger: 강, cost: 0 }
    combo_input_window: 11
    cooldown_ticks: 110
    qi_rider: { step: 3, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "바람을 밟고 오른다 — 발끝에 잔상" }
    # 정체성: 간격을 **스스로 만든다** (돌진 4로 붙는다). 남궁(간격 3.0 미만 불가)의 정확한 반대편

  songpung_geom:                  # 송풍검법 (상급) — 솔바람은 소리로 벤다
    type: 원
    radius: 3.8
    range: 3.8
    frames: [9, 3, 12]
    stagger: 중
    cost: 3
    cooldown_ticks: 220
    glance_bonus: "흘리기 유예 +3틱 (defense_states 흘리기 6 → 9) — 전 무공 최대. 받아넘기며 벤다"
    qi_rider: { step: 1, 격: 검기, cost: 3, gate: 절정, power: 2, vfx: "솔잎이 인다 — 소리가 먼저 온다" }
    mastery_gate: { 하급: 6, 중급: 6 }

# ─── 해남파 — haenam_geom (쾌검·좌수·역수 — 카운터의 문파) ───
  haepung_geom:                   # 해풍검법 (하급) — 바닷바람
    combo:
      - { type: 호, angle: 85, range: 2.8, frames: [3, 1, 4], stagger: 약, cost: 0 }
      - { type: 호, angle: 85, range: 2.8, frames: [3, 1, 4], stagger: 약, cost: 0 }
      - { type: 선, width: 0.7, length: 3.2, frames: [4, 2, 7], stagger: 중, cost: 0 }
    combo_input_window: 8
    cooldown_ticks: 70
    qi_rider: { step: 3, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "짠 바람 — 획이 짧고 날카롭다" }

  yeoksu_geom:                    # 역수검법 (중급) — 칼을 거꾸로 쥔다. 궤가 거꾸로 온다
    combo:
      - { type: 선, width: 0.6, length: 2.8, frames: [2, 1, 4], stagger: 약, cost: 0 }
      - { type: 호, angle: 75, range: 2.6, frames: [3, 1, 4], stagger: 약, cost: 0 }
      - { type: 선, width: 0.8, length: 3.4, frames: [5, 2, 8], stagger: 중, cost: 0 }
    combo_input_window: 8
    feint: "역수(逆手) — 궤가 반대로 온다. 상대 패링 유예 -2 (음풍검·회풍무류검과 같은 값, 세 번째 이유)"
    counter_hit_bonus: 0.4        # 후딜 중인 자를 노린다 (기본 0.25 · 흑살 0.5 사이)
    cooldown_ticks: 90
    qi_rider: { step: 3, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "칼등이 먼저 보인다 — 날은 뒤에 온다" }

  jwasu_khwaegeom:                # 좌수쾌검 (상급) — 왼손이 먼저 간다
    type: 선
    width: 0.6
    length: 3.2
    range: 3.2
    angle: 0.6
    frames: [3, 1, 5]
    stagger: 중
    hit_count: 2                  # 좌수·우수 — 두 손이 연이어
    cost: 3
    cooldown_ticks: 160
    counter_hit_bonus: 0.5        # 흑살단수와 같은 값 — 해남은 살초 없이 카운터로 같은 자리에 선다
    offhand: "반대 손 시전 — 상대의 가드 각(120°) 바깥에서 들어간다: 가드 감쇄 0.7 → 0.85 적용"
    qi_rider: { step: 1, 격: 검기, cost: 3, gate: 절정, power: 2, vfx: "왼쪽에서 빛 — 보던 손이 아니다" }
    mastery_gate: { 하급: 6, 중급: 6 }
    # 정체성: 9틱(절정 최속 타이) + 카운터 0.5 + 가드 반감. 파격 없이 가드를 무의미하게 만든다


mastery_degradation:
  trigger: "skills.yml <무공>.mastery_gate 의 하위 무공 숙련이 하나라도 6 미만"
  effects:
    격_다운캐스트: "qi_rider 의 격이 한 단 내려앉는다 (검기 → 발경 · power 2 → 1 · cost 3 → 1).
                    검기를 품고 태어난 초식인데 기가 안 실린다 — 검은 나가지만 빛이 없다"
    특수_속성_미발현: "파격·다단히트(hit_count)·슈퍼아머·armor_pierce 가 붙지 않는다
                       (mastery_ladder 대성 = '특수 속성 완전 발현' 의 대우(對偶))"
    후딜_1.5배: "frames[2] × 1.5 (올림) — 손에 안 익은 검은 거두는 데 오래 걸린다.
                 counter_hit_bonus(0.25)의 밥이 된다 = 미대성 상급은 **쓸수록 얻어맞는다**"
    절기_봉쇄: "cast_gate 承이 열리지 않는다 — 그 무공에서 절기가 피지 않는다"
  restore: "하급·중급 숙련이 6(대성)에 닿는 순간 즉시 해제 — 되돌릴 수 있다. 다시 배울 필요는 없다"
  design_note: "★ 감각: 배웠는데 '제 힘이 안 난다'. 위력표를 보면 똑같은데 몸이 다르다.
    그리고 그 이유가 정직하다 — 기가 안 실리고, 속성이 안 피고, 검이 늦게 돌아온다.
    수치를 숨기지 않는다: 미대성 상급(발경 1)은 대성 중급(발경 1)과 **피해가 같다.**
    상급을 먼저 사는 것은 이득이 아니라 낭비다 — 그것이 '하위를 밟아라'의 수치적 정직이다"
