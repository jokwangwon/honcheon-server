    counter_hit_bonus: 0.5        # 후딜 중인 자를 특히 노린다 (흑살도법과 같은 결)
    cooldown_ticks: 200
    qi_rider: { step: 1, 격: 검기, cost: 3, gate: 절정, power: 2, vfx: "검은 획 — 소리가 나지 않는다" }
    # 정체성: 파격 + 다운 + 20틱. 금강복마권(파격·28틱·무조건)과 대비 — 이쪽은 빠르지만 허를 요구한다

  # ── NPC 전용 표본 ──
  galho_sando:                    # 갈호의 산도 — NPC 돌진 강공 표본
