    cooldown_ticks: 170
    qi_rider: { step: 1, 격: 검기, cost: 3, gate: 절정, power: 2, vfx: "세 점이 연이어 핀다 — 점점(點點)" }
    # 정체성: 14틱(가장 빠른 절정 절기) · 다단 3히트. 대가는 조건 — 상대가 굳어 있지 않으면 손이 나가지 않는다

  # ── 무당파 ──
  saryang_balcheongeun:           # 사량발천근 — 넉 냥으로 천 근을 물리친다 (반격 전용)
