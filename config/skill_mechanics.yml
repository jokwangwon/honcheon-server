  # ══════════════════════════════════════════════════════════════════════════════
  # 절기(絶技) — 이름 붙은 초식의 기계 데이터
  # ══════════════════════════════════════════════════════════════════════════════
  # 카탈로그(습득·소문·문파)는 skills.yml. 설계 근거는 docs/design/skill_catalog.md.
  #
  # 【시전 체계 — 삼문(三門)】 cast_gate 가 정본이다. 절기는 '쿨다운이 돌면 누르는 버튼'이 아니다:
  #   承(승) after/step/window_ticks — 어미 무공의 지정 타 직후 창(窓) 안에서만 핀다 (파생이지 버튼이 아니다)
  #   間(간) min/max               — 간격. 너무 붙어도, 너무 멀어도 안 나간다
  #   虛(허) 없음|경직|패링|회피|배후 — 상대의 허. '없음'인 절기는 대신 承이 좁다 (하나는 반드시 좁다)
  #   airborne                     — 門2의 확장. 공중에서만 피는 수 (매화낙수)
  # 쿨다운·내력은 **과금**이지 발동의 주역이 아니다. 이 셋이 안 맞으면 쿨다운이 돌아도 안 나간다.
  #
  # 【코스트 규약 준수】 일류 절기 = cost 0 + qi_rider(발경 1, gate 일류) — 어미 초식과 같은 규칙.
  #   절정 절기 = cost 3 (검기 밴드 — 절정 내력 풀 9 → 3회). 그 사이는 없다.
  # 【위력 규약 준수】 무공 위력은 등급이 정한다 (combat.yml technique_power: 일류급 1 · 절정급 2).
  #   절기는 어미보다 아프지 않다 — 다른 것은 모양·간격·프레임·경직·조건이다.
  #
  # 【엔진 판독 칸】 SkillEngine.planCombo 는 combo[0] 의 range/angle 을 읽는다:
  #   선(線) → range = 길이, angle = 폭(width)   ·   호(弧) → range = 사거리, angle = 각도(°)
  #   원(圓) → range = 반경                        ·   돌·시 → range/angle = 착지 판정, distance/사거리는 SkillCast
  #   width/length/radius 는 사람이 읽는 칸이다 — range/angle 과 같은 값을 적는다.

  # ── 화산파 ──
  maehwa_cham:                    # 매화참 — 뻗는 한 획 (간격을 벌린 자를 벤다)
    art: true
    weapon_class: 검
    cast_gate:
      승: { after: maehwa_geombeop, step: 2, window_ticks: 10 }
      간: { min: 2.5, max: 5.5 }
      허: 없음                    # 스스로 허를 연다 — 대신 承이 좁다 (2타 직후 10틱)
    combo:
      - { type: 선, width: 1.0, length: 5.0, range: 5.0, angle: 1.0, frames: [5, 2, 9], stagger: 중, cost: 0 }
    cooldown_ticks: 100
    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "검끝에서 한 점이 터진다 — 매화 한 송이" }
    # 정체성: 사거리 5.0 (어미 매화검법 호 3.2 보다 +1.8). 16틱 — 빠르다. 도망가는 자를 벤다

  maehwa_naksu:                   # 매화낙수 — 위에서 아래로, 여럿을 덮는다
