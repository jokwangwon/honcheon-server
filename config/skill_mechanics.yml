    combo:
      - { type: 호, angle: 120, range: 3.0, frames: [4, 2, 7], stagger: 중, cost: 0 }
    cooldown_ticks: 120
    irregular: "취보의 결 계승 — 상대 예측 판정 -2, 자기 명중 판정 -1 (취팔선보와 같은 값과 대가)"
    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "휘청이는 몸에서 나온 주먹 — 궤가 읽히지 않는다" }
    # 정체성: 호 120°(전 절기 최광각 — 포위당한 자의 답) · 13틱. 회피 반격이라 다운이 아니라 중경직

  # ── 녹림 ──
  heuksal_dansu:                  # 흑살단수 — 살초 (절정 비전 · 파격)
