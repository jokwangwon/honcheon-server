    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "원을 그리며 되돌린다 — 힘이 주인에게 돌아간다" }
    redirect: "되돌림 — 상대가 그 합에 실었던 격 위력만큼 추가 피해 (제 힘에 제가 넘어진다)"
    # 정체성: 10틱(전 절기 최속) · 다운(20틱). 조건이 가장 좁다(패링 성공) — 그래서 보상이 가장 크다

