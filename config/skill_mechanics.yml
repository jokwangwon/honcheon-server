    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "어깨로 밀고 들어간다 — 흙먼지" }
    # 정체성: 돌진 5.0 + 슈퍼아머 + 다운 · 24틱(느리다). 철산고(돌 4·강경직·쿨 120)의 윗층

