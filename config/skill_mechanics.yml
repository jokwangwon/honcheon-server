    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "세 줄기 무지개 — 비홍(飛虹)" }
    # 정체성: 사거리 20(전 절기 최장) · 3히트 · 약독 · 13틱. 대가는 암기 위력 2 (검 4 의 절반)

  # ── 개방 ──
  chwiho_bunggyeok:               # 취호붕격 — 비틀거리다 친다 (회피 반격)
