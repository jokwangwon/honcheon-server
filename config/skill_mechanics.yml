      - { type: 선, width: 0.8, length: 7.0, range: 7.0, angle: 0.8, frames: [7, 2, 11], stagger: 중, cost: 0 }
    cooldown_ticks: 120
    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "푸른 획 하나 — 하늘이 갈린다" }
    # 정체성: 사거리 7.0 (매화참 5.0 보다 +2.0 — 근접 최장). 대신 폭 0.8(가장 좁다) · 간격 3.0 미만 불가

