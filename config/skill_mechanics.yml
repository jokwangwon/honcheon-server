    cooldown_ticks: 150
    qi_rider: { step: 1, 격: 발경, cost: 1, gate: 일류, power: 1, vfx: "떨어지며 흩어지는 꽃잎 — 원을 그린다" }
    # 정체성: 원 3.0 광역 · 24틱(느리다) · 강경직. 매화참(선/5.0/16틱/중/단일)과 모든 칸이 다르다

  maehwa_jeomjeom:                # 매화점점 — 허를 점으로 찍는다 (절정 비전)
