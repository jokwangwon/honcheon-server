# ═══════════════════════════════════════════════════════════════════════
#  뿌리내림 과정 — 본토 튜토리얼 등록부 (B-178 · 설계 정본 docs/design/tutorial_rooting.md)
# ═══════════════════════════════════════════════════════════════════════
# 개인 사슬 ①마디 「뿌리내림 — 생계와 지리」의 구체화다 (personal_story.yml 의 아랫층).
# 안내 층이지 판정 층이 아니다: 문을 잠그지 않고, 보상을 주지 않고, 사슬에 쓰지 않는다.
# 안내인 대사는 npcs/cheongha_npcs.yml (greeting_lines)이 정본 — 여기는 과제·트래커의 등록부다.
#
# 【코드가 읽는 자리】 TutorialGuide (판독·상태·트래커 줄) · 훅 6곳 (설계서 §5#3)
# 【문장 전부 제안】 실측(체감) 뒤 빨간펜 대상 — 2026-07-24 초안
tutorial:
  enabled: true
  header: "뿌리내림"
  # 트래커 한 줄 (사이드바 — 한월 A7 문법 · 기초 과정만 카운터: personal_story §6.4 부분 개정)
  format: "§6{header} §f{n}. {tracker} §e{cur}/{max}"
  format_single: "§6{header} §f{n}. {tracker}"          # 계수 1짜리는 자를 안 보인다
  done_format: "§6과제 » §f{name} §7— 끝"                # 정거장 완료 (채팅)
  finish_lines:                                          # 과정 전체 완료 (채팅 · ②마디로 인계)
    - "§6뿌리내림 » §f청하현에 뿌리가 내렸다."
    - "§7이제부터는 자네 심중(心中)이 이끄는 대로 — 시트의 심중 한 줄이 다음을 안다."

  # 정거장 — 순서는 안내의 편의일 뿐 레일이 아니다 (뒤를 먼저 채우면 그 정거장이 그때 닫힌다.
  # 트래커는 첫 미완 정거장을 가리킨다). id 는 코드 훅과의 약속 — 바꾸면 훅도 같이 바꾼다.
  stations:
    - id: 마중
      name: "부두의 마중"
      count: 1
      tracker: "부두의 섭구에게 인사 (우클릭)"
    - id: 채비
      name: "몸의 채비"
      count: 1
      tracker: "장쇠의 좌판에서 무기 장만"
    - id: 첫_사냥
      name: "첫 사냥"
      count: 3
      tracker: "북쪽 산길에서 사냥"
    - id: 첫_레벨
      name: "첫 레벨"
      count: 1
      tracker: "경험을 모아 레벨업"
    - id: 배분
      name: "배분의 손"
      count: 1
      tracker: "디스코드 시트 [포인트 배분]"
    - id: 수련
      name: "수련 배분"
      count: 1
      tracker: "/혼천 수련 으로 배분을 정한다"
    - id: 운기
      name: "숨 고르기"
      count: 1
      tracker: "/혼천 운기 로 숨을 골라 본다"   # 개화 전이면 몸이 대답한다 ("단전이 비어 있다") — 그 거절이 예고다
    - id: 다음_벽
      name: "다음 벽"
      count: 1
      tracker: "산길의 곽진에게 승급을 묻는다 (우클릭)"
