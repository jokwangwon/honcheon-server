# 경지 체계: 삼류 → 이류 → 일류 → 절정 → 초절정 → 화경 → 현경 → 생사경
# 기준 문서: docs/design/text_rpg_design.md 6장 (성장 시스템)
# 경지 상승은 경험치 누적만으로 처리하지 않는다.
# 능력치, 내공, 무공 숙련도, 실전 경험, 깨달음, 사건 기여, 명성/악명이 함께 충족되어야 한다.

cultivation_stages:
  - name: "삼류"
    id: THIRD_CLASS
    description: "강호에 갓 발을 들인 초보 무인. 낭인 지망생 수준."
    requirements:
      level: 1
      external_mastery: 0
      internal_mastery: 0
      reputation: 0
    max_skill_tier: "입문"
    technique_by_internal: []
    bonus_by_stat_path: {}

  - name: "이류"
    id: SECOND_CLASS
    description: "무림 입문자 단계. 기본적인 무공 형식만 익힌 상태."
    requirements:
      level: 5
      external_mastery: 20
      internal_mastery: 10
      reputation: 100
    max_skill_tier: "중급"
    technique_by_internal: []
    bonus_by_stat_path: {}

  - name: "일류"
    id: FIRST_CLASS
    description: "정식 무인으로 인정받는 경지. 내공 사용 가능."
    requirements:
      level: 15
      external_mastery: 40
      internal_mastery: 30
      reputation: 300
    max_skill_tier: "고급"
    technique_by_internal:
      태극기공: "경공 + 내공 회복 강화"
      자하신공: "피격 시 일정 확률 회피 + 속도 증가"
      칠살음독경: "중독 면역 + 지속 피해 증폭"
    bonus_by_stat_path:
      힘: "무기 데미지 10% 증가"
      민첩: "회피율 +15%"
      지혜: "내공 회복 속도 +25%"

  - name: "절정"
    id: PINNACLE
    description: "소문파 장문급 고수의 경지. 검기에 내력을 실을 수 있음."
    requirements:
      level: 25
      external_mastery: 80
      internal_mastery: 70
      reputation: 600
    max_skill_tier: "최상급"
    technique_by_internal:
      태극기공: "방어 시 일정 확률 반격"
      자하신공: "이동 중 피격 시 자동 반격"
      칠살음독경: "근접시 적 방어력 약화 오라"
    bonus_by_stat_path:
      힘: "치명타 피해량 +20%"
      민첩: "경공시 무적 프레임 +1초"
      지혜: "내력 사용 스킬 쿨타임 -10%"

  - name: "초절정"
    id: TRANSCENDENT
    description: "초인의 영역. 오의를 느끼기 시작하는 단계."
    requirements:
      level: 35
      external_mastery: 120
      internal_mastery: 100
      reputation: 1200
    max_skill_tier: "최상급+"
    technique_by_internal:
      태극기공: "피격 후 자동 기력 회복"
      자하신공: "일정 체력 이하에서 공격력 증가"
      칠살음독경: "적중 시 독 퍼짐 확률 증가"
    bonus_by_stat_path:
      힘: "스턴 무효화 확률 +15%"
      민첩: "경공 거리 증가 +20%"
      지혜: "오의 충전 속도 +30%"

  - name: "화경"
    id: TRANSFORMATION
    description: "강호 10대 고수 수준. 경지를 넘은 자들."
    requirements:
      level: 45
      external_mastery: 170
      internal_mastery: 150
      reputation: 2000
    max_skill_tier: "오의(예외)"
    technique_by_internal:
      태극기공: "기력 소비 절감 + 진기폭발 확률"
      자하신공: "경공 시 무형참 발생 확률"
      칠살음독경: "주변 적 중독 저항 무시"
    bonus_by_stat_path:
      힘: "기력 회복 불가 상태 저항"
      민첩: "경공 중 타겟팅 불가"
      지혜: "오의 예비 발동 가능"

  - name: "현경"
    id: PROFUNDITY
    description: "오의를 완전히 사용하는 절대고수의 경지."
    requirements:
      level: 55
      external_mastery: 250
      internal_mastery: 230
      reputation: 3500
    max_skill_tier: "오의"
    technique_by_internal:
      태극기공: "무형 반격 발동 확률 +15%"
      자하신공: "한 번 죽어도 자동 생존 1회"
      칠살음독경: "광역 출혈 오라 생성"
    bonus_by_stat_path:
      힘: "모든 데미지 +15%"
      민첩: "모든 상태이상 저항 +20%"
      지혜: "쿨다운 2배 빠르게 회복"

  - name: "생사경"
    id: LIFE_AND_DEATH
    description: "무림을 넘어선 신선의 경지. 창작 오의 가능."
    requirements:
      level: 70
      external_mastery: 350
      internal_mastery: 300
      reputation: 6000
    max_skill_tier: "오의 + 창작 오의"
    technique_by_internal:
      태극기공: "시간 느리게 하기 효과 가능"
      자하신공: "공격 무효화 + 반격 일격"
      칠살음독경: "사망 시 즉사 폭발 오의 자동 발동"
    bonus_by_stat_path:
      힘: "치명타 확률 50% 고정"
      민첩: "회피 후 반격 자동 발동"
      지혜: "모든 스킬 강화 + 창작 오의 해금"
