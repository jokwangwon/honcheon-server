# 경지 체계 v2 (기계 판독용) — 레벨은 없다, 경지가 레벨이다
# 기준 문서: docs/design/stats_and_progression.md
# 구판 폐기: level/경험치·평판 수치 요건, % 보너스, technique_by_internal(→ simbeop.yml 결(結)로 이관)
# 승급 = 요건(수치) + 계기(사건). 요건은 문턱이고 계기가 문이다.

principles:
  - "경험치·레벨 없음 — 모든 성장은 화후(실수 적립) 원장 하나로 쌓인다"
  - "하위 3단(삼류~일류)은 자동 승급 — 성실하면 오른다. 절정부터는 벽(壁) — 깨달음 사건이 문"
  - "명성은 세계의 반응이지 성장 재료가 아니다 (구판 평판 요건 폐기)"

# ─── 실전 마크 — 승급 요건의 '사건' 축 (엔진 자동 기록, 조작 불가) ───
battle_marks:
  실전_마크: "생사가 걸리지 않은 실전의 해소 — 비무 승리, 제압, 실전 도주 성공"
  사선_마크: "생사가 걸린 전투 생존 — 빈사 경험, 격상 상대 생존, 죽음의 문턱"
  rumor_link: "마크가 될 사건은 대개 소문도 된다 — 성장과 명성은 같은 사건의 두 얼굴"

# ─── 실전의 경험치화 v2.1 — 마크 로직의 연속식 내재화 (사냥·소탕·대련 전부 적립) ───
# 원칙: 실전도 수련의 한 방식이다 — 단, 배움의 양은 상대가 정한다 (그라인딩은 감쇠가 막는다)
combat_hwahu:
  unit: 유효_전투_1회
  base_grant: "사용 무공·기술 숙련 화후 +2일치 수련 상당"
  multipliers:
    상대_격차: { 상수: 2.0, 동수: 1.0, 하수: 0.25, 압도적_하수: 0 }   # 자동 판정권(기대마진 +8) = 적립 0
    목숨_무게: { 생사: 2.0, 실전_사냥: 1.0, 비무_대련: 0.5 }
  repetition_decay: "같은 상대 유형 연속 — 회당 -25% (training diminishing 동형), 새 유형·새 지역서 리셋"
  daily_cap: "+16일치/일 — 실전은 수련을 대체하지 않고 압축한다"
  beast_ranks:                   # 짐승에게도 격이 있다 — 사냥 = 실전
    들짐승: { examples: [늑대, 멧돼지], rank: 삼류_상당 }
    맹수: { examples: [호랑이, 곰], rank: 일류_상당 }
    영물: { rank: 절정_이상, policy: "등록제 — 소문·기연 연동 (양산 금지)" }
  hunting_yield: "부산물(가죽·육포·담낭) = 생계 수입 (생활_노동 대체), 영물 재료 = 영약 연계 — 경제 시스템 훅"
  mc_feedback: "적립 알림은 전투 종료 시 액션바 한 줄로 묶는다 (틱당 스팸 금지)"
  단발_보정:                     # 연속식과 별도 유지
    사선_경험: { grants: "관련 능력치 화후 +30일치", cap: "장당 1회" }
    대성공_또는_치명_실패: { grants: "해당 기술 화후 +1일치", cap: "기술당 1일 1회" }
  marks_note: "실전·사선 마크는 별도 축 그대로 — 승급 요건은 경험 총량이 아니라 사건 (battle_marks)"

# ─── 경지 9단계 — 이름·순서는 전 파일의 참조 축 (lint 검증 대상) ───
cultivation_stages:
  - name: "범인"
    id: COMMONER
    description: "무공을 익히지 않은 보통 사람. 강호 인구의 절대다수. 무공 백지 = 기연 자격."
    promotion: null

  - name: "삼류"
    id: THIRD_CLASS
    description: "강호에 갓 발을 들인 무인 — 낭인 지망생 수준."
    promotion:
      requirements: ["아무 무공 입문 (숙련 0)", "기초 단련 3개월"]
      trigger: 자동

  - name: "이류"
    id: SECOND_CLASS
    description: "기본기가 손에 붙은 무인."
    promotion:
      requirements: ["주력 무공 숙련 2", "실전 마크 1"]
      trigger: 자동

  - name: "일류"
    id: FIRST_CLASS
    description: "정식 무인으로 인정받는 경지 — 개화한 몸."
    promotion:
      requirements: ["주력 무공 숙련 3", "개화 — 단전 개방 + 심법 축기 시작 (dantian_and_simbeop)", "실전 마크 3"]
      trigger: "자동 — 개화가 사실상의 관문"

  - name: "절정"
    id: PINNACLE
    description: "소문파 장문급 고수. 검기의 경지."
    promotion:
      requirements: ["주력 무공 숙련 5", "내공 3", "실전 마크 5", "사선 마크 1"]
      trigger: "첫 벽(壁) — 깨달음: 실전 깨달음 / 스승의 인도 / 파벽(수명 5년, internal_energy)"

  - name: "초절정"
    id: TRANSCENDENT
    description: "초인의 영역. 오의를 느끼기 시작한다."
    promotion:
      requirements: ["주력 무공 숙련 6 — 수련만으로 불가 (training beyond 규칙)", "내공 5", "사선 마크 3"]
      trigger: "벽 — 깨달음 (오의 개안과 흔히 동시에 온다)"

  - name: "화경"
    id: TRANSFORMATION
    description: "강호 10대 고수 수준. 강기와 완성된 오의."
    promotion:
      requirements: ["전승 오의 개안 상태 (ultimate_arts)", "내공 7", "사선 마크 5"]
      trigger: "대각(大覺) — 생사의 문턱에서의 깨달음 (등록 사건)"

  - name: "현경"
    id: PROFUNDITY
    description: "절대고수. 어검의 경지 — 한 시대 한 손."
    promotion:
      requirements: ["수치 요건 없음 — 내공 9+ 관행"]
      trigger: "서사 등록제 — 세계 유일급 사건"

  - name: "생사경"
    id: LIFE_AND_DEATH
    description: "무림을 넘어선 경지. 심검과 창작 오의. 시대에 한둘."
    promotion:
      requirements: []
      trigger: "서사 등록제 — 도달 자체가 세계 이벤트 (서버 공지 + 강도 3 소문)"

# ─── 승급 효과 — 전부 원천 파일 참조 (본 파일은 관문만 갖는다) ───
promotion_effects:
  능력치_캡: "player_creation.yml attribute_cap_by_realm"
  기_운용_게이트: "internal_energy.yml realm_gates (발경~심검)"
  노화_저항: "internal_energy.yml vitality.aging_and_realm"
  오의_단계: "ultimate_arts.yml realm_ladder (개안→완성→자재→창작)"
  판정: "경지 격차 ±2/단계 (judgment.yml realm_gap_per_stage)"
  세계: "승급 목격·소문 = 세력 반응 입력, 별호 후보 발생"

# ─── 강등 없음 — 대신 봉인 ───
demotion:
  rule: 없음
  sealed_state: "내상·심마로 경지 '봉인'(발휘 불가) 상태 존재 — 회복 서사의 재료 (경지 자체는 불멸)"
