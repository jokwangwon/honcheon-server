# 경지 체계 v2 (기계 판독용) — 레벨은 없다, 경지가 레벨이다
# 기준 문서: docs/design/stats_and_progression.md
# 구판 폐기: level/경험치·평판 수치 요건, % 보너스, technique_by_internal(→ simbeop.yml 결(結)로 이관)
# 승급 = 요건(수치) + 계기(사건). 요건은 문턱이고 계기가 문이다.

principles:
  - "경험치·레벨 없음 — 모든 성장은 화후(실수 적립) 원장 하나로 쌓인다"
  - "하위 3단(삼류~일류)은 자동 승급 — 성실하면 오른다. 절정부터는 벽(壁) — 깨달음 사건이 문"
  - "명성은 세계의 반응이지 성장 재료가 아니다 (구판 평판 요건 폐기)"

# ─── 실전 마크 — 승급 요건의 '사건' 축 (엔진 자동 기록, 조작 불가) ───
battle_marks:
  실전_마크: "생사가 걸리지 않은 실전의 해소 — 비무 승리, 제압, 실전 도주 성공"
  사선_마크: "생사가 걸린 전투 생존 — 빈사 경험, 격상 상대 생존, 죽음의 문턱"
  rumor_link: "마크가 될 사건은 대개 소문도 된다 — 성장과 명성은 같은 사건의 두 얼굴"
  mark_vs_bonus: "마크(누적 카운트 — 승급 요건)와 사선 '보정 +30일치'(장당 1회 — combat_hwahu 단발_보정)는 별개"   # F18 — PT-006

# ─── 실전의 경험치화 v2.1 — 마크 로직의 연속식 내재화 (사냥·소탕·대련 전부 적립) ───
# 원칙: 실전도 수련의 한 방식이다 — 단, 배움의 양은 상대가 정한다 (그라인딩은 감쇠가 막는다)
# 2026-07 정합 패스 — 성장 곡선 재조정 (일류 73일 → 308일)
#   병: 표준 플레이(수련 1 + 사냥 2 + 의뢰 1 /일)의 적립이 하루 10일치였다. 실전이 수련을 압축하는 게
#       아니라 대체해 버렸고, 무협의 시간 감각(일류 = 개화한 몸)이 3개월 만에 무너졌다.
#   약: ① 한 판의 값 base_grant 2일치 → 0.3일치   ② 반복 감쇠 -25% → -50%   ③ 일일 상한 16 → 3일치
#       배율(상대_격차·목숨_무게)과 숙련 환산표(training.yml)는 건드리지 않았다 — 그것들은 '무엇이
#       가르치는가'를 말하는 정본이고, 틀린 것은 '한 판이 얼마냐'였다.
#   철학 보존: 하위 3단 자동 승급('성실하면 오른다')과 단발_보정(사선 +30일치)은 그대로.
#       → 늑대를 백 마리 잡아도 안 오른다. 한 번의 사선이 한 달을 앞당긴다. 그라인딩이 아니라 사선이 키운다.
#   결과(game_audit 시뮬): 삼류 41일 · 이류 144일 · 개화 30일 · 일류 308일 (≈0.86년)
combat_hwahu:
  unit: 유효_전투_1회
  base_grant: "사용 무공·기술 숙련 화후 +0.3일치 수련 상당"
  base_grant_days: 0.3             # 엔진 판독용 수치 (ProgressionEngine)
  multipliers:
    상대_격차: { 상수: 2.0, 동수: 1.0, 하수: 0.25, 압도적_하수: 0 }   # 자동 판정권(기대마진 +8) = 적립 0
    목숨_무게: { 생사: 2.0, 실전_사냥: 1.0, 비무_대련: 0.5 }
    목숨_무게_기준: "결과가 아니라 상황 — 상대의 살상 의도 + 자력 이탈 불가 = 생사 (덫이 정상 작동한 사냥은 실전_사냥)"   # F18 — PT-006
  repetition_decay: "같은 상대 유형 연속 — 회당 -50% (반토막. 새 유형·새 지역서 리셋)"
  repetition_decay_rate: 0.5      # 엔진 판독용 수치
  daily_cap: "+3일치/일 — 실전은 수련(1일치/일)을 대체하지 않고 압축한다. 몸이 하루에 받아들이는 한계"
  daily_cap_days: 3               # 엔진 판독용 수치 — 연속식 적립에만 적용 (단발_보정은 별도 상한)
  beast_ranks:                   # 짐승에게도 격이 있다 — 사냥 = 실전
    들짐승: { examples: [늑대, 멧돼지], rank: 삼류_상당 }
    맹수: { examples: [호랑이, 곰], rank: 일류_상당 }
    영물: { rank: 절정_이상, policy: "등록제 — 소문·기연 연동 (양산 금지)" }
  hunting_yield: "부산물(가죽·육포·담낭) = 생계 수입 (생활_노동 대체), 영물 재료 = 영약 연계 — 가격 = economy.yml price_table.사냥_부산물"
  mc_perception:                 # 인지 설계 — 경험치의 문법을 빌리고, 의미는 빌리지 않는다
    격차_표시: "명패 기세 색 4단(팀 색) + 기세 아이콘 글리프 prefix(리소스팩 — 색맹 대응 겸): 회(압도적 하수·적립 0)/백(하수)/황(동수)/적(상수)"
    적립_표시:                   # 처치·격돌 확정 즉시 — 같은 틱
      즉시: "시체 위 '+2일' 플로팅(텍스트 디스플레이 수명 20틱 — VFX 풀 계상) + 액션바 '육합검이 손에 익는다 (+2일)' + 적립음"
      스팸_방지: "1초 내 재적립 = 액션바 합산 갱신 (덮어쓰는 채널), 사운드 쿨다운 10틱"
    상한_표시: "일일 상한 도달 시 회색 표기 '오늘은 몸이 벅차다' — 왜 안 느는지 화면이 설명한다"
    원장_조회: "경락도 GUI(핫바 9) — 인벤토리 제목 글리프 배경 텍스처(리소스팩) + 무공·능력치별 화후 진행 바"
    돌파_연출: "정수부 상승 시 커스텀 사운드+파티클+타이틀 — 레벨업의 도파민 대체"
    리소스팩_층: "커스텀 폰트 글리프(진행 바·아이콘, 음수 공백 위치 조정)·커스텀 사운드 — 5채널(액션바/보스바/타이틀/사이드바/명패) 내 렌더, 클라 부담 = 서버 예산 0, resourcepack_gate 적용"
    지연_예산: "처치→적립 연산(O(1) ≤0.1ms)→패킷 3개 — 같은 틱. 체감 30~90ms (바닐라 XP 구슬과 동일 경로) — LLM 미개입, DB는 비동기 큐"
    불가침: "XP 바 = 내력 유지, 단일 XP 풀 금지 — 삼중 사다리(능력치/숙련/내공)와 '수치는 문턱, 사건이 문' 승급 철학 보존"
  단발_보정:                     # 연속식과 별도 유지
    사선_경험:
      grants: "관련 능력치 화후 +30일치"
      grants_days: 30              # 엔진 판독용
      # 【기계 정의】 '관련 능력치' = **현재 수련 배분의 주 과목**이 쌓는 원장 (training.yml curriculum).
      #   구간이 가장 많은 과목. 동률이면 능력치 표기 순서(judgment.yml attributes).
      #   ★ 근거: 사선에서 몸이 배우는 것은 그 사람이 그 몸에 새기고 있던 것이다 —
      #     발로 살아온 자는 발이 늘고, 버텨 온 자는 몸이 는다. 아무 데나 흩뿌리면 그건 사선이 아니라 로또다.
      goes_to: 현재_배분_주_과목
      cap: "장당 1회"
    대성공_또는_치명_실패: { grants: "해당 기술 화후 +1일치", cap: "기술당 1일 1회" }
  # ★ 연속식 적립(base_grant)의 귀속: **초식 원장 하나뿐이다** (사용 무공·기술 숙련).
  #   training.yml curriculum.combat_accrual 이 정본 — 늑대를 백 마리 잡아도 몸은 안 만들어진다.
  #   몸·발·눈·단전(외공·신법·심안·내공)은 앉아서 만든다. 사냥터가 빌드를 대신 정해주지 않는다.
  accrual_target: "training.yml curriculum.combat_accrual"
  marks_note: "실전·사선 마크는 별도 축 그대로 — 승급 요건은 경험 총량이 아니라 사건 (battle_marks)"

# ─── 경지 9단계 — 이름·순서는 전 파일의 참조 축 (lint 검증 대상) ───
cultivation_stages:
  - name: "범인"
    id: COMMONER
    description: "무공을 익히지 않은 보통 사람. 강호 인구의 절대다수. 무공 백지 = 기연 자격."
    promotion: null

  - name: "삼류"
    id: THIRD_CLASS
    description: "강호에 갓 발을 들인 무인 — 낭인 지망생 수준."
    promotion:
      requirements: ["아무 무공 입문 (숙련 0)", "기초 단련 3개월"]
      trigger: 자동

  - name: "이류"
    id: SECOND_CLASS
    description: "기본기가 손에 붙은 무인."
    promotion:
      requirements: ["주력 무공 숙련 2", "실전 마크 1"]
      trigger: 자동

  - name: "일류"
    id: FIRST_CLASS
    description: "정식 무인으로 인정받는 경지 — 개화한 몸. 내력을 처음 쓰는 몸이기도 하다 (발경 개방)."
    promotion:
      requirements: ["주력 무공 숙련 3", "개화 — 단전 개방 + 심법 축기 시작 (dantian_and_simbeop)", "실전 마크 10"]
      # 관문은 둘이다: 화후(숙련 3 = 630일치)와 개화(심법 원천 = 등록 기연·문파 전수).
      # 둘 중 늦은 쪽이 문을 연다. 표준 플레이에서는 화후가 늦다 (개화 ~30일 / 숙련 3 ~308일).
      trigger: "자동 — 숙련(화후)과 개화(심법)를 둘 다 채운 날"

  - name: "절정"
    id: PINNACLE
    description: "소문파 장문급 고수. 검기의 경지."
    promotion:
      requirements: ["주력 무공 숙련 5", "내공 3", "실전 마크 5", "사선 마크 1"]
      trigger: "첫 벽(壁) — 깨달음: 실전 깨달음 / 스승의 인도 / 파벽(수명 5년, internal_energy)"

  - name: "초절정"
    id: TRANSCENDENT
    description: "초인의 영역. 오의를 느끼기 시작한다."
    promotion:
      requirements: ["주력 무공 숙련 6 — 수련만으로 불가 (training beyond 규칙)", "내공 5", "사선 마크 3"]
      trigger: "벽 — 깨달음 (오의 개안과 흔히 동시에 온다)"

  - name: "화경"
    id: TRANSFORMATION
    description: "강호 10대 고수 수준. 강기와 완성된 오의."
    promotion:
      requirements: ["전승 오의 개안 상태 (ultimate_arts)", "내공 7", "사선 마크 5"]
      trigger: "대각(大覺) — 생사의 문턱에서의 깨달음 (등록 사건)"

  - name: "현경"
    id: PROFUNDITY
    description: "절대고수. 어검의 경지 — 한 시대 한 손."
    promotion:
      requirements: ["수치 요건 없음 — 내공 9+ 관행"]
      trigger: "서사 등록제 — 세계 유일급 사건"

  - name: "생사경"
    id: LIFE_AND_DEATH
    description: "무림을 넘어선 경지. 심검과 창작 오의. 시대에 한둘."
    promotion:
      requirements: []
      trigger: "서사 등록제 — 도달 자체가 세계 이벤트 (서버 공지 + 강도 3 소문)"

# ─── 승급 효과 — 전부 원천 파일 참조 (본 파일은 관문만 갖는다) ───
promotion_effects:
  # ★ 승급이 주는 첫째 것은 '힘'이 아니라 **자리**다 (docs/design/growth_axes.md):
  #   캡이 열려야 수련이 들어갈 자리가 생긴다. 경지는 성장의 결과가 아니라 성장의 **허가**다.
  능력치_캡: "player_creation.yml attribute_cap_by_realm — ★ 성장 축(수련 배분)의 천장. 이것이 지배 전략을 막는다"
  성장_축: "training.yml curriculum — 하루 5구간을 외공·내공·초식·신법·심안에 나눈다 (빌드의 선택지)"
  내구: "combat.yml durability.realm_bonus (개화[일류]부터 +2/단계 — 단전이 열린 몸만 기혈이 두터워진다)"
  기_운용_게이트: "internal_energy.yml realm_gates (발경~심검)"
  노화_저항: "internal_energy.yml vitality.aging_and_realm"
  오의_단계: "ultimate_arts.yml realm_ladder (개안→완성→자재→창작)"
  판정: "경지 격차 ±2/단계 (judgment.yml realm_gap_per_stage)"
  세계: "승급 목격·소문 = 세력 반응 입력, 별호 후보 발생"
  # ★ 마도(魔道) 계열의 벽 — 요건은 가장 빨리 채우고, 문 앞에서 가장 오래 선다
  마도_계열: |
    simbeop.yml magong.walls 가 정본. 요약:
      · 요건(숙련·내공)은 마공이 가장 빨리 채운다 — 흡성은 남의 세월을 빼앗고, 연수는 제 수명을 태운다
      · 그러나 절정 이상의 trigger 는 '깨달음 사건'이지 수치가 아니다. 그리고 마도는 그 문이 막힌다:
          실전 깨달음 → 심마 흔적이 관(觀)을 흐린다 (흔적 3당 판정 -2, 누적)
          스승의 인도 → 마도에는 스승이 없다
          파벽(수명 5년/회, internal_energy) → ★ 남는 것은 이것뿐이다
      · 도가·불가의 mental_guard(+2)가 마도에는 없다 — 벽 앞에서 가장 자주 미치는 것이 마공을 익힌 자다
    ★ 결론: 마공은 '빠른 길'이 아니라 '앞당겨 쓰는 길'이다. 흡성이든 연수든 끝에서 만나는 값은 같다 — 수명.

# ─── 강등 없음 — 대신 봉인 ───
demotion:
  rule: 없음
  sealed_state: "내상·심마로 경지 '봉인'(발휘 불가) 상태 존재 — 회복 서사의 재료 (경지 자체는 불멸)"
  sealed_by_redemption: "★ 개심(改心)의 산공도 이 봉인을 쓴다 — simbeop.yml magong.redemption.②_산공.
    경지는 불멸이므로 '되돌아온 자'는 강등되지 않는다. 다만 **발휘하지 못하는 몸**으로 남는다.
    재축기하면 다시 열린다 — 그것이 이 세계가 개심에 주는 유일한 자비다"
