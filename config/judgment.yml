# 판정 수치 계산 규칙 (기계 판독용)
# 기준 문서: docs/design/judgment_system.md

scales:
  attribute: { min: 1, max: 10 }        # 기본 능력치
  skill: { min: 0, max: 10 }            # 기술 / 무공 숙련
  alertness: { min: 0, max: 5 }         # NPC 경계도
  suspicion: { min: 0, max: 5 }         # NPC 의심도 (대상 특정)

attributes: [근력, 민첩, 체력, 내공, 감각, 화술, 지혜]

skills:
  general: [은신, 추적, 조사, 정보수집, 교섭, 잠입, 도주, 의술, 독술, 호위, 상술]
  martial: "config/skills.yml 카탈로그의 숙련도와 연동"

# 대립 판정: 실행력 = 능력치 + 기술 + 상황보정(캡 ±5) + 2d6
#            저항값 = NPC능력치 + NPC기술 + 경계도 + 의심도 + NPC상태보정 + 7
#            마진   = 실행력 - 저항값
formula:
  player_roll: "2d6"
  npc_fixed_bonus: 7            # NPC는 주사위 대신 고정값
  situation_modifier_cap: 5     # 상황 보정 합계 절대값 상한

situation_modifiers:
  preparation: { range: [0, 2] }            # 준비도: 계획, 도구, 변장
  information: { per_key_clue: 1, max: 2 }  # 정보량: 핵심 단서당 +1
  environment: { range: [-3, 3] }           # 환경: 행동에 따라 부호가 바뀜
  condition:                                # 신체 상태
    경상: -1
    중상: -2
    빈사: -3
    피로: -1
    내공_고갈: -2
  realm_gap_per_stage: 2                    # 경지 격차 (무공 개입 판정에만)

npc_modifiers:
  focus_on_other_task: { range: [-2, 0] }   # 목적 집중
  psychology: { range: [-2, 2] }            # 심리 상태 (공포는 저항 +, 다급함은 -)

# 비대립 판정 난이도 기준치
static_difficulty:
  쉬움: 10
  보통: 12
  어려움: 14
  매우_어려움: 16
  극한: 18

# ─── 결과 등급 (마진 기준) ───
# 재설계 (2026-07 정합 패스): 문턱을 **실제 마진 분포**에 맞췄다.
#
# 대등 판정(실행력 5 vs 저항 13)의 마진 = 2d6 − 8 → 범위 −6 ~ +4. 36가지가 전부다.
#   마진   -6  -5  -4  -3  -2  -1   0  +1  +2  +3  +4
#   가짓수  1   2   3   4   5   6   5   4   3   2   1
# 구판 문턱(대성공 +6 / 치명 −8)은 이 범위 밖에 있었다 — 6단 등급표 중 2단이
# 주사위로는 영원히 뜨지 않고, optional_extreme_dice 라는 '선택 규칙'에만 매달려 있었다.
#
# 신판 문턱과 대등 판정 발생 확률 (해석적 — 몬테카를로 불요):
#   대성공        마진 ≥ +4   →  1/36 =  2.8%   (쌍륙 그 자체)
#   성공          마진 +2~+3  →  5/36 = 13.9%
#   아슬아슬한 성공  마진  0~+1  →  9/36 = 25.0%
#   부분 성공      마진 −3~−1  → 15/36 = 41.7%
#   실패          마진 −5~−4  →  5/36 = 13.9%
#   치명적 실패     마진 ≤ −6   →  1/36 =  2.8%   (뱀눈 그 자체)
#                                        실패권(실패+치명) = 16.7%
# → 대등한 상대 앞에서 대성공·치명적 실패는 '드물지만 일어난다'. 6단이 전부 굴러간다.
#   준비·정보 보정(+2)이 붙으면 대성공 2.8% → 16.7% — 준비가 값한다.
#   optional_extreme_dice 는 이제 등급표의 목발이 아니라, 격차 있는 판정의 뒤집기 규칙이다.
result_tiers:
  - { id: critical_success, name: "대성공", min_margin: 4 }
  - { id: success, name: "성공", min_margin: 2 }
  - { id: narrow_success, name: "아슬아슬한 성공", min_margin: 0, side_risk: true }
  - { id: partial_success, name: "부분 성공", min_margin: -3 }
  - { id: failure, name: "실패", min_margin: -5 }
  - { id: critical_failure, name: "치명적 실패", min_margin: null }   # -6 이하

# 아슬아슬한 성공의 부수 리스크 (GM이 상황에 맞게 1개 선택, 서사로만 표현)
side_risks:
  - "대상 NPC 의심도 +1"
  - "제3자 목격 → 소문 후보 생성"
  - "물리적 흔적 발생"
  - "시간 추가 소모"
  - "자원 소모 (내공, 도구)"

# 선택 규칙: 극단 주사위 (대립 판정에만)
# F24(봇 알파 검증): 엔진·봇 어디에도 미배선 — 알파는 고정 난이도 판정뿐이라 위반은 아니나,
#                    대립 판정(pvp direct_opposed)이 결선되는 봇 베타에서 반드시 함께 배선할 것.
# 2026-07: 등급 문턱 재설계 후로는 이 규칙을 꺼도 6단이 전부 뜬다 (더는 필수 목발이 아니다).
#          대등 판정에서는 무해(쌍륙 = 이미 대성공, 뱀눈 = 이미 치명) — 격차 판정에서만 물린다.
optional_extreme_dice:
  enabled: true
  snake_eyes_2: "등급 1단계 하락"
  boxcars_12: "등급 1단계 상승"

# 판정 생략 (기대 마진 = 실행력(주사위 7 가정) - 저항값)
auto_resolution:
  auto_success_expected_margin: 8       # 이상이면 판정 생략, 자동 성공
  auto_fail_expected_margin: -8         # 이하이면 자동 실패 (강행 전 서사로 무모함 암시)
  no_judgment_actions:                  # 계산 자체를 하지 않는 행동
    - "단순 이동"
    - "상점 이용"
    - "안전한 대화"
    - "이미 확보한 정보 확인"

# 플레이어 간 판정 — 사람과 사람은 대등하게 흔들린다 (F22·F23 — PT-008)
pvp:
  direct_opposed: "양측 모두 2d6 (NPC 고정 +7 미적용) — 마진 = 양측 실행력 차, 동점 = 상쇄(무승부 서사)"
  race: "비접촉 경쟁(추적 경주 등) = 각자 대상 난이도로 굴려 마진 비교 — 둘 다 실패면 둘 다 실패, 동점 = 동시 도달(장면 병합)"

# 재시도 규칙
retry:
  same_approach_penalty: 2              # 같은 대상 + 같은 접근 → 저항값 +2
  new_information_resets: true          # 새 정보/새 접근이면 페널티 없음

# 행동-판정 대응표
action_pairs:
  은신_잠복: { player: [감각, 은신], npc: [감각], npc_state: [경계도] }
  미행: { player: [감각, 추적], npc: [감각, 미행_감지] }
  설득: { player: [화술, 교섭], npc: [화술_또는_위험_회피], npc_state: [심리] }
  정보_캐기: { player: [화술, 정보수집], npc: [감각, 고객_파악] }
  잠입: { player: [민첩, 잠입], npc: [감각, 경비] }
  엿듣기: { player: [감각, 은신], npc: [감각], npc_state: [경계도] }
  조사: { player: [감각, 조사], npc: null, difficulty: static }
  기습: { player: [민첩, 은신], npc: [감각, 위협_감지], realm_gap: true }
  추적: { player: [감각, 추적], npc: [민첩, 도주] }
  도주: { player: [민첩, 도주], npc: [감각, 추적] }
  치료: { player: [지혜, 의술], npc: null, difficulty: static }
  증거_제시_설득: { player: [화술, 교섭], npc: [위협_감지], information_bonus: true }

# 전투 개요 (상세는 combat_system.md 예정)
combat:
  damage: "무공 기본 위력 + floor(마진 / 2)"
  wound_stages: { 경상: -1, 중상: -2, 빈사: -3 }
  note: "전투도 등급 결과를 사용한다. 아슬아슬한 승리는 부상을 남긴다."
