# 문파 생활 규칙 (기계 판독용) — G2 해소
# 기준 문서: docs/design/sect_life.md
# 원칙: 문파는 거래다 — 무공과 보호를 주고, 시간과 자유를 가져간다

rank_ladder:                       # 승격 = 경지 관문 문법 (요건 + 계기)
  player_ranks:
    # 속가_외문 = 문파 밖 조직(하오문·녹림·수로채·살막·세가 식객)의 최말단 — 사문(師門)이 아니라 소속이다.
    # 비급각 접근 없음·사사 없음. faction_entry_routes 의 모든 신입 계급이 여기로 맵된다.
    - { rank: 속가_외문, requires: [조직_수용], benefits_gate: 없음, note: "무공은 스스로 구해야 한다 — 조직은 밥과 자리만 준다" }
    - { rank: 외문_제자, requires: [입문_시험_통과] }
    - { rank: 내문_제자, requires: [공적_20, 삼류_이상, 연차_1년], trigger: 사부_추천 }
    - { rank: 진전_제자, requires: [공적_60, 일류_이상, 기여_사건_1], trigger: [비무_입상, 장문_재가] }
    # ★ 천장을 연다 — 여기까지가 '손님'이었다. 그 위는 npc_ranks 로만 있어서 플레이어는
    #   문파의 손님으로 늙어 죽게 되어 있었다. 계보의 끝(일인전승 심법·오의)에 닿으려면 이 두 칸이 필요하다.
    #   상세(계기 · 자리가 비는 법 · 세계 효과)는 succession_ladder. 여기는 **계급 등록부**다.
    - { rank: 장로, requires: [공적_200, 절정_이상, 상급_무공_대성_6, 기여_사건_3],
        trigger: [장문_지명, 장로회_과반],
        note: "★ 남을 가르칠 수 있다 — 전수의 방향이 뒤집힌다 (받는 자에서 주는 자로)" }
    - { rank: 장문, requires: [장로_연차_3년, 초절정_이상, 계보_오의_보유, 문파_대공_1],
        trigger: [전대_장문의_지명, 장문_비무_승리, 장로회_인준],
        note: "★ 자리가 비어야 오른다 — 일인전승 심법·오의가 여기서 넘어온다" }
  npc_ranks: [집사, 당주, 장로, 장문]   # 생애 사다리 '무인의 길' 문파 트랙
  # ★ 장로·장문은 이제 player_ranks 와 npc_ranks 에 **둘 다** 선다 — 같은 자리다 (npc_symmetry).
  #   NPC 사제가 먼저 장로가 되면 그 자리는 **찬 것이다.** 플레이어는 자리가 빌 때까지 기다리거나, 도전한다

merit:                             # 공적 — 문파 내부 통화 (명성·favor와 별개의 '안' 축)
  earn: { 문파_임무: [5, 15], 기여_사건: [10, 30], 비무_입상: 10 }
  spend:
    비급각_열람: { 1층: 0, 2층: 10, 3층: 30 }
    영약_재료_불하: [10, 50]
    폐관실_신청: 20
    사사_우선권: 15

benefits:
  비급각:
    1층: { grade: 입문_삼류급, access: 외문 }
    2층: { grade: 이류급, access: 내문_공적 }
    3층: { grade: 절정급_심법, access: 진전_장로허가 }
    최심부: { grade: 비전_오의, access: "전승 자격 (ultimate_arts 정합)" }
  사사: "내문부터 사부 배정 — training.yml 효율 그대로"
  봉록_월: { 외문: 1000, 내문: 2000, 진전: 5000 }   # 문 단위 — 생계 해방
  보호: "소속원 피습 = 문파 세력 반응 자동 개입"
  장소: "정규 수련 1.2 / 폐관 1.5 / 안전 지역 (training location_safety 최상급)"

obligations:
  월_임무: { count: 1, source: "quest_generation ④ 세력 발생원", refuse: 문규_적립 }
  문규:                            # 3진 체계
    steps: [경고, 면벽_시간몰수, 파문]
    violations: [임무_거부_누적, 무단_전수, 타파_심법_겸수, 강호_물의]
  겸수_제한: "심법은 사문 계보만 (simbeop.yml dual_approved 집행)"
  연대_책임: "소속원 물의 = 문파 favor·명성 반영 — 문파가 청구서를 받는다 (파문 동기)"

expulsion:                         # 파문 — 문파판 죽음
  causes: [문규_3진, 살문, 마공_겸수, 비급_유출]
  effects:
    - 공적_몰수
    - "비급 반납 요구 — 몸에 새긴 무공은 못 뺏는다 (그래서 문파는 추격한다)"
    - "'파문제자' 낙인: 강도 3 소문 + 문파 적대 + 정파권 NPC 저항 +2 (배의 문법)"
  reinstatement: "대공 1건 + 장문 재가 (등록 사건)"

brotherhood:                       # 사형제
  order: 입문_순
  betrayal: "배의 + 문규 (동행 결의의 문파판)"
  events: [진전_경쟁, 사사_우선권_알력, 비무_서열전]
  revenge_hook: "사형제 사망 → 문파 발생원에서 복수 의뢰 (death_and_legacy 접합)"

npc_symmetry: "NPC 제자도 같은 공적·승격 관문 — 플레이어가 게으르면 NPC 사제가 먼저 진전이 된다"

# ═══════════════════════════════════════════════════════════════════════════
# 문파 상태 (sect_state) — ★ 문파에게도 '사정'이 있다 (13차 신설)
# ═══════════════════════════════════════════════════════════════════════════
#
# 이 파일은 여태 **플레이어가 문파 안에서 어떻게 사는가**만 적었다 (계급·공적·문규).
# 그런데 문파는 문파대로 산다 — 장문이 바뀌고, 곳간이 비고, 제자가 죽고, 이미 딴 데서 싸운다.
#
# ★ 그 사정이 **강호의 정치를 좌우한다.** 제 코가 석 자인 문파는 남의 싸움에 못 낀다.
#   faction_politics.yml coalition.threshold_modifiers.자파_내부_사정(+0~+6) 이 이 축을 읽는다.
#   이 축이 없었기 때문에 연합이 너무 쉽게 뭉쳤다 — 브레이크가 통째로 빠져 있었다.
#
# 새 통화 없음: 0~6 의 단일 축. 세력별로 하나. 문파(sect)뿐 아니라 세가·사파 조직에도 적용된다
# (조직은 다 사정이 있다 — 산채도 곳간이 빈다).

sect_state:
  internal_burden:
    scale: [0, 6]
    meaning: "남의 싸움에 낼 여력이 얼마나 없는가. 0 = 언제든 나선다 / 6 = 제 앞가림도 못 한다"
    baseline: { ref: "faction_politics.yml roster.<세력>.internal_burden — 세력별 상시 부담" }

    sources:                        # 사건이 얹는다 (합산 후 0~6 clamp)
      장문_교체기:  { burden: 3, ref: "npc_lifecycle life_simulation.death_and_succession — 핵심 NPC 사망 = 후계 이벤트",
                      note: "★ 장문이 없는 문파는 전쟁을 결정하지 못한다. 결정할 사람이 없다" }
      내분_알력:    { burden: 2, ref: "brotherhood.events (진전 경쟁·사사 우선권 알력·비무 서열전)" }
      사상자_누적:  { burden: 2, note: "제자를 잃은 문파는 제자를 아낀다 — 최근 세력전·토벌의 사망자" }
      재정_궁핍:    { burden: 1, ref: "economy.yml — 봉록(외문 1000 / 내문 2000 / 진전 5000)을 못 준다" }
      폐관_은둔:    { burden: 2, note: "장문·장로가 폐관 중 (benefits.장소 폐관 1.5) — 문을 닫아걸었다" }
      다른_전쟁_중: { burden: 4, ref: "faction_politics coalition — 이미 다른 사안의 연합에 참여 중",
                      note: "★ 가장 무거운 사정이자 이 축의 심장.
                        **무림은 동시에 두 전쟁을 하지 못한다.** 하나에 붙으면 다음 명분에는 못 붙는다.
                        관이 두 사안을 동시에 흘려도 무림은 하나만 든다 — 억지의 숨은 절반이다" }

    determinism: "★ 세계일 기준. 저장값(sect_state 표) + 오늘의 세계 상태(다른 전쟁 중)로
      **읽는 순간** 계산한다 — 배치 잡 없음, 주사위 없음. 같은 날이면 같은 사정이다"

    decay:                          # 사정은 풀린다 — 문파는 회복한다
      every_days: 30
      amount: -1
      floor: { ref: "roster.<세력>.internal_burden — 상시 부담 아래로는 안 내려간다" }
      note: "장문이 서면 교체기가 끝나고, 곳간이 차면 궁핍이 풀린다. 다만 느리다 (favor 감쇠와 같은 30일)"

    observable: "★ 수치로 보이지 않는다. 이렇게 보인다 —
      '화산은 지금 산문을 닫았다더군' · '무당은 장문 자리가 비었다는데' ·
      '남궁은 이미 장강에 사람을 다 보냈네' — 그리고 그 문파는 무림첩에 답신하지 않는다"

  player_hook:                      # ★ 플레이어가 만질 수 있어야 축이다
    낮춘다: "문파의 사정을 해결한다 — 후계 분쟁 중재 · 곳간을 채운다(기부) · 실종 제자를 찾아온다
      → 그 문파가 연합에 붙을 수 있게 된다. ★ 한 사람이 전쟁의 규모를 바꾼다"
    높인다: "문파의 사정을 만든다 — 내분을 부추기고, 장로를 죽이고, 다른 전쟁에 밀어 넣는다
      → 그 문파는 다음 명분에 못 붙는다. ★ 마교가 하는 일이 정확히 이것이다 (magyo_deception 의 사전 작업)"
    design_intent: "연합의 크기는 명분만으로 정해지지 않는다 — **누가 지금 여력이 있는가**로도 정해진다.
      그리고 그것은 플레이어가 몇 달에 걸쳐 손댈 수 있는 것이다"

# ═══════════════════════════════════════════════════════════════════════════
# 무공 계보의 전수 — 무엇을 공짜로 주고, 무엇을 팔 것인가 (설계: docs/design/sect_lineage.md)
# ═══════════════════════════════════════════════════════════════════════════
# 노션 원칙: "경지 상승 시 1개는 무상 전수, 나머지는 사거나 퀘스트로"
#   → 문파는 거래다 (이 파일의 대원칙). 무공도 거래다. 다만 **첫 한 자루는 문파가 쥐여 준다** —
#     그러지 않으면 가난한 제자는 영원히 이류에 머문다 (그리고 그것은 이 게임을 재미없게 만든다).

lineage_transmission:
  free_grant:                      # 무상 전수 — 경지 승급마다 **1종**
    trigger: "해당 경지로 승급한 날 (이류·일류·절정 — cultivation.yml 승급 시점)"
    count: 1
    tier_by_realm: { 이류: 하급, 일류: 중급, 절정: 상급 }
    chosen_by: 사부                # 플레이어가 고르지 않는다 — **사부가 준다** (그것이 사문이다)
    default: "문파 계보의 정통 칸 (skills.yml lineage 의 그 tier 첫 무공)"
    note: "★ 공짜로 받는 것은 '한 자루'다. 계보에 상급이 셋이면 나머지 둘은 값을 치른다"

  purchase:                        # 나머지 — 공적(merit)으로 산다
    ref: "benefits.비급각 — tier 가 곧 층수다"
    tier_to_floor: { 하급: 1층, 중급: 2층, 상급: 3층, 오의: 최심부 }
    cost: { 하급: 0, 중급: 10, 상급: 30 }      # merit.spend.비급각_열람 그대로 — 새 통화 없음
    gate: "층수 접근 권한(access)이 먼저다 — 공적이 있어도 외문은 2층에 못 올라간다"

  quest:                           # 또는 퀘스트로
    ref: "quest_generation ④ 세력 발생원 · obligations.월_임무"
    rule: "문파 임무 완수로 사사_우선권(공적 15) 을 사거나, 장로가 직접 '한 수'를 내준다"
    note: "★ 절기(絶技)는 **이 길로만** 온다 — skills.yml 절기 acquisition: '비급 없음. 사람이 준다'"

  # ★ 본래 위력의 경제학 — 왜 상급을 먼저 사면 손해인가
  why_not_skip:
    fact: "상급을 공적 30 에 사서 미대성으로 쓰면 (skill_mechanics mastery_degradation):
      격이 안 실리고(발경 1) · 특수 속성이 안 피고 · 후딜이 1.5배가 된다"
    math: "미대성 상급(발경 1) 의 피해 = 대성 중급(발경 1) 의 피해 — **같다.**
      그런데 후딜은 1.5배다. 즉 상급을 먼저 사면 **더 느린 중급**을 30 공적에 사는 것이다"
    truth: "★ 사다리를 건너뛸 수는 있다. 다만 건너뛴 자리는 **비어 있다** — 그리고 그 사실이 몸으로 온다"

# ═══════════════════════════════════════════════════════════════════════════
# 올라가는 사다리 — 제자에서 장문까지 (일인전승의 끝)
# ═══════════════════════════════════════════════════════════════════════════
# rank_ladder 의 player_ranks 는 **진전_제자에서 끝난다.** 그 위(장로·장문)는 npc_ranks 로만 있었다 —
# 즉 플레이어는 문파의 손님으로 늙어 죽게 되어 있었다. 이 절이 그 천장을 연다.
#
# ★ 그리고 그 끝에는 **하나뿐인 것**이 있다: 장문인 심법과 장문인 오의.
#   simbeop.yml sole_transmission · ultimate_arts.yml sole_transmission 이 그 자물쇠다.

succession_ladder:
  # 계급 정본은 rank_ladder.player_ranks (장로·장문이 거기 등재됐다). 여기는 그 두 칸의 **운영 규칙**이다.
  ranks_ref: [장로, 장문]
  elder_benefits: [비급각_최심부_접근, 문파_임무_발주권, 제자_배정]

  vacancy:                         # 자리는 어떻게 비는가 — 이것이 없으면 사다리는 그림이다
    causes:
      전대_사망: { ref: "npc_lifecycle life_simulation.death_and_succession", weight: "가장 흔하다" }
      전대_은퇴: { trigger: "폐관 은둔 선언 — sect_state.sources.폐관_은둔(부담 2)" }
      장문_비무: { rule: "★ 도전할 수 있다. 지면 파문(expulsion.causes 에 준한다) — 이기면 그 자리다",
                   note: "정파 문파는 이 도전을 문규로 금하지 않는다. 다만 **한 번뿐이다**" }
      파문_폐위: { trigger: "장문의 문규 3진·마공 겸수 — 장로회 탄핵" }
    world_effect: "★ 장문 자리가 비면 그 문파는 **전쟁을 결정하지 못한다**
      (sect_state.sources.장문_교체기 부담 3 — 이미 등재된 축이다).
      즉 플레이어가 장문이 되는 길은 그 자체로 강호의 정치를 흔든다"

  sole_transmission:               # 일인전승 — 한 세계에 한 사람
    rule: "★ 장문인 심법·오의는 **동시에 두 사람이 보유할 수 없다.**
      계승 시 전대 장문의 것이 소멸하는 것이 아니다 — 전대가 죽거나 산공해야 다음이 배운다"
    holders:                       # 자물쇠가 걸린 것들 (정본은 각 파일의 sole_transmission: true)
      심법: [jaha_singong, cheonroe_jewang_singong, manryu_gwiwon, honwon_byeokryeok_singong,
             daebanya_geumgang, yangui_mugeuk_singong, eunha_cheongang]
      무공: [tagu_bongbeop]
      오의: [jaha_nanhwa, honwon_byeokryeok_do, cheongwol_geom]
    theft: "★ 도둑 배움이 불가능하다 — 비급이 없다. 구결(口訣)로만 전한다.
      비급을 훔쳐도 나오는 것이 없다 (그래서 이것들만은 유출 사건이 없다)"
    npc_holder: "플레이어가 장문이 아니면 그 자리에는 **NPC 장문이 있다** —
      즉 이 무공들은 강호에 실재한다. 다만 그 한 사람의 것이다 (npc_symmetry)"

  # ─── 개방 구결(口訣) — 자루가 아니라 매듭으로 센다 ───
  # ★ 노션 원천을 그대로 받는다. 이것이 좋은 축인 이유: 개방은 **계급이 몸에 보인다** (자루의 매듭 수).
  #   다른 문파의 계급은 아는 사람만 알지만, 거지의 결(結)은 지나가는 아이도 센다.
  gaebang_gyeol:
    axis: "결(結) — 자루에 묶은 매듭의 수. 1~9결"
    ladder:
      - { gyeol: 수습, rank: 백의개, note: "★ 흰옷 — 아직 자루가 없다. 거지가 되기로 한 날의 옷" }
      - { gyeol: [1, 2], rank: 개목, maps_to: 외문_제자, skill: chwikwon }
      - { gyeol: 3, rank: 분타주, maps_to: 내문_제자, simbeop: okhyeon_gwijin,
          note: "★ 심법이 여기서 온다 — 개방은 글을 안 쓴다. 구결로 준다" }
      - { gyeol: 4, rank: 호법, maps_to: 내문_제자 }
      - { gyeol: 5, rank: 당주, maps_to: 진전_제자, skill: gaebang_bongbeop }
      - { gyeol: 6, rank: 법개, maps_to: 진전_제자, note: "법(法) — 방규를 집행한다" }
      - { gyeol: 7, rank: 장로, maps_to: 장로 }
      - { gyeol: 8, rank: 후개, maps_to: 장로,
          note: "★ 후개(後丐) — 다음 방주로 지명된 자. 이 자리가 곧 계승 예약이다" }
      - { gyeol: 9, rank: 용두방주, maps_to: 장문, skill: tagu_bongbeop, ultimate: hangryong_sippalchang,
          note: "★ 타구봉법과 항룡십팔장이 여기 있다 — 9결은 한 사람뿐이다" }
    visible: "★ 매듭은 숨길 수 없다 — 개방도의 계급은 **공개 정보**다.
      (다른 문파는 계급을 숨길 수 있다. 개방은 못 한다. 그것이 거지의 정직함이자 약점이다)"
    promotion: "공적(merit) 이 아니라 **정보**로 오른다 —
      개방의 공적 획득원은 rumor.yml 소문 제보·정보 거래다 (개방이 파는 것은 무공이 아니라 귀다)"

