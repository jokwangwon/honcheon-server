# 경제 규칙 (기계 판독용) — 화폐·물가·전장·시세·비매품
# 기준 문서: docs/design/economy_system.md
# 기준 물가 = 청하현. 지역 경제 지표 배율(region_multipliers)이 얹힌다.
# 원칙: 강함은 돈으로 못 산다 — 돈이 사는 것은 시간·정보·안전

currency:
  units:
    문: { kind: 동전, base: 1 }
    냥: { kind: 은자, base: 1000 }
    금: { kind: 금자, base: 10000 }
    전표: { kind: 어음, denomination: "은 10냥 단위", rule: "지참인 지불 — 도난 = 소유 이전 (고액 이동의 긴장)" }
  anchors:
    서민_일당: [30, 50]
    서민_1인_월_생활: 1000

# ─── 전낭과 전장 — 돈을 어디에 두는가가 리스크다 ───
# 2026-07 정합 패스 — 예치가 공짜였다.
#   병: 인출 수수료 1%. 사망 시 전낭 전액 드랍이라는 유일한 돈의 긴장을, 전액 예치가 무료로 무력화했다.
#       "전장에 넣어두면 그만"이면 전낭은 규칙이 아니라 장식이다.
#   약: 예치에 **기회비용**을 붙인다 — 수수료(5%)·인출 지연(당일 불가)·상속 절차(사망 시 봉인).
#       돈을 안전하게 두는 값 = 돈을 즉시 못 쓴다. 무인은 그래서 전낭을 차고 다닌다.
wallet_and_bank:
  전낭:
    risk: "사망 시 전액 드랍 (아이템 엔티티 1개 — 줍는 자의 것), 제압 시 갈취 협상 대상"
    benefit: "즉시성 — 지금 여기서 쓸 수 있는 유일한 돈 (기연 경매·급전 흥정·뇌물은 전낭만 받는다)"
  전장:
    deposit_fee: 0
    withdraw_fee: 0.05           # 5% — 안전의 값. 예치·인출을 반복하면 돈이 녹는다
    remote_withdraw_fee: 0.10    # 타지 환거래
    withdraw_delay: "당일 불가 — 청구 다음 날 구간부터 수령 (급전은 전장에서 나오지 않는다)"
    deposit_cap_free: 5000       # 이하 소액은 수수료 면제 (서민 생계 보호 — 긴장은 목돈에만 건다)
    branches: "현급 이상 도시"
    services: [예치, 인출, 전표_발행]
    death_seal: "예치금은 사망 시 봉인 — 상속 절차를 밟아야 풀린다 (npc_death.yml 예치_봉인 정합).
                 유산 상속은 death_and_legacy.yml 규칙 — 절차·시간·증인이 든다. 돈은 남지만 즉시 오지 않는다"
  symmetry: "NPC도 동일 — 도적의 생계·상단의 표행 수요가 여기서 나온다"

# ─── 물가 기준표 (청하현, 문 단위) ───
price_table:
  생활:
    만두_한_끼: 8
    국밥: 10
    술_한_병: 20
    봉놋방_1박: 20
    독방_1박: 100
    상방_1박: 500
    목욕: 15
  이동:
    뱃삯_구간: 50
    마차_1일: 200
    나귀: 8000
    말: 30000
  장비:
    단검_범철: 1000
    검_범철: 3000
    창_범철: 2000
    활_화살통: 2500
    피갑: 5000
    수리_범철: 200
    수리_정련: 2000
    검_정련: { range: [80000, 150000], note: "명공 주문 — 반년 대기 관례" }
    보병: 비매    # 경매(등록 이벤트)·기연·서사 교환만
    신병: 비매
    내갑_금사갑: 비매
  의원:
    민간요법: { price: 50, note: "회복 지연·효과 절반 — 서민의 선택지 (F19 — PT-006. 의원 문턱 자체는 의도)" }
    진료: 50
    경상_치료: 500
    중상_치료: [2000, 5000]
    요양_1일: 300
    해독_중급: { price: 20000, note: "+ 조건 (독 3층 규칙 — 돈만으로 불가)" }
  정보:                          # 정보상은 돈보다 정보를 좋아한다 — 등가 교환 우대
    뜬소문: 100
    검증_소문: 1000
    핵심_단서: { min: 10000, barter: "등가 정보 교환 우대" }
  무공:
    사사_예물_관례: 10000
    필사본_삼류급_암시장: 20000
    필사본_이류급: 200000
    진본_비급: 비매
  # 2026-07 정합 패스 — 수지 4.9배 흑자를 1.9배로.
  #   병: 늑대 가죽 한 장의 매입가(50문)가 서민 일당(40문)을 넘었다. 표준 플레이어는 서민의 4.4배를
  #       벌었고 범철 검이 22일치 저축이었다 — 돈에 긴장이 없고, 무기가 이야기가 아니라 소모품이었다.
  #   약: 사냥 부산물 전 품목 ×0.6 · 잔심부름 [50,100] → [15,25] · 매입가 50% → 40%.
  #       생활비(36문/일)는 그대로 뒀다 — 정본(서민_1인_월_생활 1000문 ÷ 30 = 33.3문/일)이 옳다.
  #   결과: 수입 68문/일 · 순수지 32문/일 (1.9배). 범철 검 = 94일치 저축. 검 한 자루가 계절이 된다.
  사냥_부산물:                   # cultivation.yml hunting_yield의 가격표 (×0.6 하향)
    늑대_가죽: 60
    여우_가죽: 180
    웅담: 3000
    호골: 5000
    호랑이_가죽: 9000
    영물_재료: 경매
  의뢰_보수:
    잔심부름: [15, 25]           # 범인의 심부름 — 서민 반나절 품삯. 무인의 일이 아니다
    조사: 300
    단거리_호위: 1200
    표행_동행: 6000
    도적_소탕_현상: 12000
    고수_현상금: 50000           # 그대로 — 사람 목숨값은 물가를 따르지 않는다

starting_money:                  # 시작 자금 (문) × 집안 배율
  유년: [10, 30]
  소년: [30, 80]
  family_multiplier: { 상가의_자식: 3.0, 무가의_자식: 2.5, 객잔집_자식: 2.0, 농가의_자식: 0.5 }
  무가의_자식_월례: "전장 전표 [20, 40]문/월 — 지원은 상태다 (player_creation support 단계 이행 시 중단)"
  몰락_무가의_자식: "돈 대신 가보 1점 — 파는 순간 서사 대가 (흔적 '이름'과 연동)"

# ─── 매매 규칙 ───
trading:
  npc_buy_rate: 0.4              # 상점 매입가 = 시세 40% (상인의 몫 — 사냥꾼은 늘 후려쳐진다)
  merchant_check_cap: 0.7        # 상술 판정 성공 시 상향 상한
  daily_buy_limit: "품목별 일일 매입 한도 (예: 늑대 가죽 20장/일) — 초과분 시세 하락 (인플레 방어)"
  black_market: { rate: 0.3, risk: "장물 거래 = 소문 후보 + 하오문 경유 (public_use_rumor와 동형)" }

# ─── 지역 연동 — region_state 경제 지표(0~100)의 수치화 ───
region_multipliers:                # economy_min = 엔진 판독용 하한 (내림차순 첫 일치 — EconomyEngine)
  - { economy_min: 70, when: "경제 >= 70", 물가: 0.9, 의뢰_보수: 1.1 }
  - { economy_min: 30, when: "경제 30~69", 물가: 1.0, 의뢰_보수: 1.0 }
  - { economy_min: 15, when: "경제 15~29", 물가: 1.3, 의뢰_보수: 0.7 }   # threshold_effects 경제_저하의 수치화
  - { economy_min: 0, when: "경제 < 15", 물가: 1.6, 의뢰_보수: 0.5, note: "기근 문법 — 곡물 별도 폭등" }

# ─── 품목 시세 이벤트 (등록제) — 사건이 시세를 흔들고, 시세가 소문이 된다 ───
price_events:
  상단_습격_성공: { items: 피해_품목, delta: +0.2, decay: "4주 선형" }
  열병_발생: { items: 약재, delta: +0.5, decay: "사건 해소 시" }
  대량_사냥: { items: 해당_가죽, delta: -0.3, decay: "2주 선형" }
  rumor_link: "시세 변동 = 소문 생성 (정확도 규칙 그대로) — 틀린 시세 소문에 돈을 걸 수도 있다"

# ─── 비매품 원칙 — 살 수 없는 것들 ───
unpurchasable:
  items: [보병, 신병, 진본_비급, 오의, 대기연_영약, 경지, 관의_사면]
  channel: "경매(등록 이벤트) · 기연 · 서사 교환 — 낙찰자는 소문의 주인공이 된다"
  money_ceiling: "부자는 편하고 안전하고 빠르다 — 그러나 절정은 못 산다 (돈 = 시간 효율 구매)"

# ─── 세금·통행 ───
tolls:
  성문세: 2
  시장_자릿세_1일: 10
  뇌물: "판정 재료 (교섭 준비도 보정) — 가격표 없음, 상대와 죄질이 정한다"

# ─── MC 매핑 ───
mc:
  ledger_based: true             # 아이템 화폐 없음 — 복제·인플레 원천 차단 (단일 작성자)
  death_drop: "전낭 아이템 엔티티 1개 (소지금 전액)"
  shop: "대화 GUI — 재고·시세 반영"
  player_trade: "거래 GUI (사기 방지 — 직접 던지기 비권장)"
  display: "경락도 GUI 전낭 탭 + 거래 시 액션바 (상시 HUD 점유 없음)"
