# 서장 무대(序章舞臺) — ★몸으로 겪는 회랑 (사용자 확정 2026-07-25 새벽 · B-179 2차 개정)
#
# ─────────────────────────────────────────────────────────────────────────────
# 사용자: "지금 책을 읽는 시스템이 너무 루즈하다" → "글이 아닌 **몸으로 역사를 느끼는 형태**."
#
# 그래서 그릇을 바꿨다 — 항해 중의 서장은 이제 책이 아니다:
#   · 정거장에 닿으면 **기억의 무대**가 안개 속에서 재생된다 (다층 조형 애니메이션 +
#     파티클 + 사건음 — 전부 **본인에게만** 보인다)
#   · 글은 **한 줄 맥박**만 — 장면의 방향을 짚는 짧은 숨 (LLM 전문은 도착 때 필사본으로 —
#     개인 서사는 잃지 않는다)
#   · 선택은 **물 위 세 등불 우클릭** — 화면 클릭이 아니라 몸의 행위다
#   · 판정·이야기·진행은 여전히 전부 봇의 것 — 무대는 그릇일 뿐이다
#
# ★강등 계약: enabled: false 면 옛 책 그릇으로 되돌아간다 (무대가 없어도 서장은 흐른다).
# ★등록제: sets 의 title 은 seojang.yml scenes 의 title 과 **글자 그대로** 같아야 한다
#   (계열 판별이 이 대조로 돈다 — 감사가 잰다. {region} 류 자리채움은 앞부분만 대조).
# ★수치·조형·문장 전부 【제안】 — 파일럿(기본 계열 다층)을 눈으로 보고 빨간펜 대상.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

stage:
  enabled: true

  # 맥박 — 장면 도착 때 타이틀(장 제목) + 짧은 숨 줄들 (액션바 · 간격마다 하나씩)
  pulse:
    beat_interval_ticks: 60      # 3초에 한 숨 【제안】
    beat_read_ticks: 70          # 한 숨이 화면에 사는 시간
    choices_delay_ticks: 40      # 마지막 숨 뒤 등불이 떠오르기까지

  # 선택의 등불 — 물 위 세 개 (에필로그는 하나 — 출도의 등불)
  lanterns:
    ahead: 7                     # 정거장에서 동쪽으로 이 칸 앞 물 위에 뜬다
    spread: 4                    # z 간격 (셋이면 -4·0·+4)
    height: 1.6                  # 수면 위
    label_prefix: "§6◆ "
    hint: "§8등불을 §f우클릭§8 하면 그 길을 고른다 — 되돌릴 수 없다."
    pick_line: "§6등불이 사위어 든다 — 기억이 길을 정했다."
    debut_label: "강호로 나선다"   # 에필로그의 단 하나의 등불 (따뜻한 등롱)

  # 필사본 — 도착 때 품에 남는 전문 (읽기 전용 · 선택 없음)
  memoir:
    give: true
    line: "§7품 안에 §f서장 필사본§7 이 남았다 — 강을 건너며 겪은 기억의 전문이다."
    full_line: "§8품이 가득해 필사본을 못 받았다 — 자리를 비우고 다시 강을 건너면 사공이 내어 준다."   # 【제안】

  # 중립 무대 — 등록부에 없는 계열/장면의 폴백 (안개의 고동 — 침묵 금지: 무대가 없어도 숨은 쉰다)
  neutral:
    sound: { key: "minecraft:block.bell.resonate", volume: 0.5, pitch: 0.6 }
    particle: { type: CAMPFIRE_COSY_SMOKE, count: 10, spread: 2.5 }
    pulse:
      - "§7안개가 짙어진다 — 기억이 형체를 찾지 못한다"

  # ═══════════════════════════════════════════════════════════════════════
  # ★3차 — 발단별 첫 장 무대 (사용자 확정 2026-07-25: "모든 경우의 수로 다 만드는 건")
  #
  #   역병의 그날 밤과 화재의 그날 밤은 **다른 기억**이다 — 첫 장의 무대는 발단이 가른다.
  #   키 = player_creation.yml inciting_incidents (등록제 — 지어낸 발단은 감사가 잡는다).
  #   LLM 실시간 생성은 기각 (붓 지연 가중·품질 편차·빨간펜 불가) — 전부 사전 제작이라
  #   지연 0 · 결정론 · 눈으로 보고 고칠 수 있다. 뒷장(길 위·낯선 고을)은 계열 공유(sets).
  # ═══════════════════════════════════════════════════════════════════════
  incidents:

    가문의_몰락:               # 불타는 집 — 세간이 무너지는 밤
      pulse:
        - "§c불길이 담을 넘었다 §7— 매캐한 연기가 코끝을 찔렀다"
        - "§7식구들의 그림자가 뿔뿔이 흩어졌다"
      sound: { key: "minecraft:entity.blaze.ambient", volume: 0.55, pitch: 0.65 }
      particle: { type: FLAME, count: 6, spread: 2.5 }
      layers:
        - { at: [2, 0, -8],  block: DARK_OAK_LOG,    scale: [0.7, 3.4, 0.7], yaw: 14,  anim: 기운다 }
        - { at: [4, 0, -10], block: DARK_OAK_PLANKS, scale: [3.4, 2.4, 0.5], yaw: -6,  anim: 솟는다 }
        - { at: [3, 2, -9],  block: FIRE,            scale: [1.6, 1.6, 1.6], yaw: 0,   anim: 솟는다 }
        - { at: [1, 0, -7],  block: CAMPFIRE,        scale: [1.0, 1.0, 1.0], yaw: 30,  anim: 멎는다 }
        - { at: [5, 1, -11], block: FIRE,            scale: [1.0, 1.0, 1.0], yaw: 45,  anim: 솟는다 }

    습격:                      # 부서진 문과 담을 넘는 그림자들
      pulse:
        - "§c문이 부서졌다 §7— 발소리는 여럿이었다"
        - "§7숨을 죽였다. 심장 소리가 제일 컸다"
      sound: { key: "minecraft:block.wooden_door.close", volume: 0.7, pitch: 0.5 }
      particle: { type: SMOKE, count: 6, spread: 2.0 }
      layers:
        - { at: [3, 0, -8],  block: DARK_OAK_PLANKS, scale: [1.2, 2.4, 0.3], yaw: 35,  anim: 기운다 }   # 부서져 기운 문짝
        - { at: [2, 0, -10], block: STONE_BRICKS,    scale: [4.0, 1.8, 0.5], yaw: 0,   anim: 솟는다 }   # 담
        - { at: [3, 1, -10], block: BLACK_CONCRETE,  scale: [0.5, 1.7, 0.3], yaw: 15,  anim: 솟는다 }   # 담 위의 그림자
        - { at: [5, 1, -10], block: BLACK_CONCRETE,  scale: [0.5, 1.5, 0.3], yaw: -20, anim: 솟는다 }
        - { at: [1, 0, -7],  block: FIRE,            scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }   # 횃불의 잔광

    역병:                      # 흰 천과 향불 — 조용해진 마을
      pulse:
        - "§7집집마다 문에 §f흰 천§7 이 걸렸다"
        - "§7향불 연기만 골목을 지났다 — 마을이 조용해졌다"
      sound: { key: "minecraft:block.bell.resonate", volume: 0.4, pitch: 0.5 }
      particle: { type: CAMPFIRE_COSY_SMOKE, count: 8, spread: 2.0 }
      layers:
        - { at: [2, 0, -8],  block: SPRUCE_PLANKS,   scale: [2.6, 2.0, 0.5], yaw: 4,   anim: 솟는다 }   # 닫힌 집
        - { at: [2, 1, -7],  block: WHITE_WOOL,      scale: [0.8, 1.4, 0.1], yaw: 8,   anim: 기운다 }   # 문의 흰 천
        - { at: [4, 0, -7],  block: SOUL_CAMPFIRE,   scale: [0.9, 0.9, 0.9], yaw: 0,   anim: 멎는다 }   # 향불
        - { at: [5, 0, -9],  block: PALE_OAK_LOG,    scale: [0.5, 2.4, 0.5], yaw: -10, anim: 기운다 }   # 마른 나무

    목격:                      # 골목 — 봐서는 안 될 것을 보았다
      pulse:
        - "§7골목 어귀 — §c봐서는 안 될 것§7 을 보았다"
        - "§7그들도 나를 보았다"
      sound: { key: "minecraft:ambient.cave", volume: 0.5, pitch: 0.8 }
      particle: { type: SMOKE, count: 5, spread: 1.5 }
      layers:
        - { at: [2, 0, -9],  block: STONE_BRICKS,    scale: [0.6, 2.6, 3.0], yaw: 0,   anim: 솟는다 }   # 골목의 두 벽
        - { at: [5, 0, -9],  block: STONE_BRICKS,    scale: [0.6, 2.6, 3.0], yaw: 0,   anim: 솟는다 }
        - { at: [3, 0, -9],  block: RED_NETHER_BRICKS, scale: [1.2, 0.1, 0.8], yaw: 25, anim: 멎는다 }  # 바닥의 얼룩
        - { at: [4, 1, -11], block: BLACK_CONCRETE,  scale: [0.5, 1.7, 0.3], yaw: 10,  anim: 기운다 }   # 돌아본 그림자

    맡겨짐:                    # 산문 앞 강보 — 문이 열리기를 기다렸다
      pulse:
        - "§7산문 앞 — 강보에 싸인 채 §f문이 열리기§7 를 기다렸다"
        - "§7새벽 종소리가 첫 기억이다"
      sound: { key: "minecraft:block.bell.use", volume: 0.5, pitch: 0.7 }
      particle: { type: CLOUD, count: 4, spread: 1.5 }
      layers:
        - { at: [3, 0, -9],  block: SPRUCE_LOG,      scale: [0.6, 3.0, 0.6], yaw: 0,   anim: 솟는다 }   # 산문 기둥
        - { at: [5, 0, -9],  block: SPRUCE_LOG,      scale: [0.6, 3.0, 0.6], yaw: 0,   anim: 솟는다 }
        - { at: [4, 3, -9],  block: DARK_OAK_SLAB,   scale: [3.0, 0.5, 0.9], yaw: 0,   anim: 솟는다 }   # 현판 들보
        - { at: [4, 0, -8],  block: WHITE_WOOL,      scale: [0.7, 0.4, 0.5], yaw: 15,  anim: 멎는다 }   # 강보
        - { at: [3, 1, -8],  block: SOUL_LANTERN,    scale: [0.6, 0.6, 0.6], yaw: 0,   anim: 솟는다 }

    핏줄의_비밀:               # 타는 족보 — 이름이 재가 되는 밤
      pulse:
        - "§7서안 위의 족보가 §c불길§7 에 말려들었다"
        - "§7내 이름이 재가 되는 것을 보았다"
      sound: { key: "minecraft:item.firecharge.use", volume: 0.4, pitch: 0.8 }
      particle: { type: LAVA, count: 3, spread: 1.0 }
      layers:
        - { at: [3, 0, -8],  block: LECTERN,         scale: [1.1, 1.1, 1.1], yaw: 10,  anim: 솟는다 }   # 서안
        - { at: [3, 1, -8],  block: FIRE,            scale: [0.7, 0.7, 0.7], yaw: 0,   anim: 솟는다 }   # 타는 족보
        - { at: [5, 0, -9],  block: DARK_OAK_PLANKS, scale: [2.2, 2.4, 0.4], yaw: -5,  anim: 솟는다 }   # 서가
        - { at: [1, 0, -7],  block: BLACK_CONCRETE,  scale: [0.5, 1.6, 0.3], yaw: -15, anim: 기운다 }   # 등을 돌린 어른

    아이_거두기:               # 저잣거리 구석 — 낯선 손이 나를 일으켰다
      pulse:
        - "§7저잣거리 구석, 거적 한 장 — §f낯선 손§7 이 나를 일으켰다"
        - "§7그날 처음으로 더운 밥을 먹었다"
      sound: { key: "minecraft:block.barrel.open", volume: 0.5, pitch: 0.9 }
      particle: { type: CLOUD, count: 3, spread: 1.5 }
      layers:
        - { at: [3, 0, -8],  block: HAY_BLOCK,       scale: [1.4, 0.8, 1.2], yaw: 20,  anim: 멎는다 }   # 짚가리
        - { at: [3, 0, -7],  block: BROWN_WOOL,      scale: [1.2, 0.2, 0.9], yaw: 30,  anim: 기운다 }   # 거적
        - { at: [5, 0, -9],  block: SPRUCE_PLANKS,   scale: [2.0, 1.8, 0.4], yaw: 8,   anim: 솟는다 }   # 좌판
        - { at: [4, 1, -8],  block: LANTERN,         scale: [0.7, 0.7, 0.7], yaw: 0,   anim: 솟는다 }   # 따뜻한 등

    수행_파견:                 # 가문의 대문 — 명이 내려온 아침 (계열 무대와 같은 결)
      pulse:
        - "§7가문의 대문이 등 뒤에서 닫혔다 — 기대는 짐보다 무겁다"
      sound: { key: "minecraft:block.wooden_door.close", volume: 0.6, pitch: 0.8 }
      particle: { type: CLOUD, count: 4, spread: 2.0 }
      layers:
        - { at: [3, 0, -9],  block: DARK_OAK_PLANKS, scale: [0.6, 3.2, 0.6], yaw: 0,   anim: 솟는다 }
        - { at: [5, 0, -9],  block: DARK_OAK_PLANKS, scale: [0.6, 3.2, 0.6], yaw: 0,   anim: 솟는다 }
        - { at: [4, 3, -9],  block: DARK_OAK_SLAB,   scale: [3.0, 0.5, 0.8], yaw: 0,   anim: 솟는다 }

    # ─── ★세가 전용 발단 무대 (2026-07-25 · 세가의_자제 — 명령의 결) ───
    비무행:                    # 비무첩 한 묶음 — 겪고 오라는 명
      pulse:
        - "§6\"이기고 오라는 명이 아니다 — §f겪고 오라는§6 명이다.\""
        - "§7비무첩의 첫 장에는 모르는 이름이 적혀 있었다"
      sound: { key: "minecraft:item.armor.equip_iron", volume: 0.6, pitch: 0.9 }
      particle: { type: CLOUD, count: 4, spread: 2.0 }
      layers:
        - { at: [3, 0, -8],  block: LECTERN,         scale: [1.1, 1.1, 1.1], yaw: 8,   anim: 솟는다 }   # 비무첩이 놓인 서안
        - { at: [4, 0, -9],  block: DARK_OAK_PLANKS, scale: [2.2, 1.6, 0.4], yaw: -5,  anim: 솟는다 }   # 연무장 목검 걸이
        - { at: [4, 1, -9],  block: POLISHED_DEEPSLATE, scale: [0.15, 1.4, 0.3], yaw: 30, anim: 기운다 } # 걸린 검 한 자루
        - { at: [2, 0, -7],  block: SMOOTH_STONE,    scale: [2.0, 0.15, 2.0], yaw: 15,  anim: 멎는다 }   # 연무 자국의 바닥
    그림자_시험:               # 빈 몸 — 지켜보는 눈
      pulse:
        - "§7\"신분도 전표도 없이 석 달이다.\" — 가주의 눈은 웃지 않았다"
        - "§8등 뒤 어딘가, 시선 하나가 붙었다"
      sound: { key: "minecraft:ambient.cave", volume: 0.45, pitch: 0.7 }
      particle: { type: SMOKE, count: 5, spread: 2.0 }
      layers:
        - { at: [3, 0, -8],  block: BROWN_WOOL,      scale: [0.6, 0.4, 0.5], yaw: 20,  anim: 멎는다 }   # 빈 봇짐 하나
        - { at: [5, 1, -11], block: BLACK_CONCRETE,  scale: [0.5, 1.7, 0.3], yaw: -12, anim: 솟는다 }   # 멀리 붙은 그림자
        - { at: [2, 0, -9],  block: SOUL_LANTERN,    scale: [0.7, 0.7, 0.7], yaw: 0,   anim: 솟는다 }   # 꺼질 듯한 등
    밀서:                      # 봉인 한 통 — 열어 보지 말라
      pulse:
        - "§7\"전하고, 답을 기다리지 말고, §c열어 보지 말라§7.\""
        - "§7밀서는 가볍고, 봉인은 무거웠다"
      sound: { key: "minecraft:item.book.page_turn", volume: 0.6, pitch: 0.8 }
      particle: { type: END_ROD, count: 2, spread: 1.0 }
      layers:
        - { at: [3, 0, -8],  block: LECTERN,         scale: [1.1, 1.1, 1.1], yaw: 10,  anim: 솟는다 }   # 서안
        - { at: [3, 1, -8],  block: WHITE_WOOL,      scale: [0.5, 0.05, 0.7], yaw: 15,  anim: 멎는다 }   # 밀서 한 통
        - { at: [3, 1, -8],  block: RED_WOOL,        scale: [0.12, 0.08, 0.12], yaw: 0, anim: 멎는다 }   # 주사(朱砂) 봉인
        - { at: [1, 1, -7],  block: LANTERN,         scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }

    담을_넘다:                 # 그날 밤, 내가 담을 넘었다 (출분 — 택한 것)
      pulse:
        - "§6그날 밤 — §f내가§6 담을 넘었다"
        - "§7보퉁이 하나. 뒤는 돌아보지 않았다"
      sound: { key: "minecraft:block.grass.step", volume: 0.7, pitch: 0.7 }
      particle: { type: MYCELIUM, count: 6, spread: 2.0 }
      layers:
        - { at: [3, 0, -9],  block: STONE_BRICKS,    scale: [4.0, 2.2, 0.5], yaw: 0,   anim: 솟는다 }   # 가문의 담
        - { at: [4, 2, -9],  block: BLACK_CONCRETE,  scale: [0.5, 1.4, 0.3], yaw: 35,  anim: 기운다 }   # 담 위의 나
        - { at: [4, 1, -8],  block: BROWN_WOOL,      scale: [0.5, 0.4, 0.4], yaw: 20,  anim: 멎는다 }   # 보퉁이

    아버지의_검:               # 빈 검가 — 검 한 자루를 품고 나왔다 (출분)
      pulse:
        - "§7검가(劍架)의 §f빈 자리§7 — 그 검은 이제 내 등에 있다"
        - "§7아버지는 아침까지 모르실 것이다"
      sound: { key: "minecraft:item.armor.equip_iron", volume: 0.6, pitch: 0.8 }
      particle: { type: END_ROD, count: 2, spread: 1.0 }
      layers:
        - { at: [3, 0, -8],  block: DARK_OAK_PLANKS, scale: [2.4, 1.6, 0.4], yaw: 5,   anim: 솟는다 }   # 검가
        - { at: [3, 1, -8],  block: POLISHED_DEEPSLATE, scale: [0.15, 1.5, 0.3], yaw: 40, anim: 기운다 } # 남은 검 한 자루
        - { at: [5, 0, -9],  block: SPRUCE_PLANKS,   scale: [2.0, 2.2, 0.4], yaw: -6,  anim: 솟는다 }   # 무기고 벽

    파혼:                      # 찢긴 혼서 — 붉은 등이 꺼진 밤 (출분)
      pulse:
        - "§c혼서(婚書)가 §7둘로 찢겼다 — 붉은 등이 꺼졌다"
        - "§7그 집 담을 나서며, 처음으로 숨이 쉬어졌다"
      sound: { key: "minecraft:entity.item.break", volume: 0.5, pitch: 0.8 }
      particle: { type: CHERRY_LEAVES, count: 4, spread: 2.0 }
      layers:
        - { at: [3, 0, -8],  block: RED_WOOL,        scale: [2.6, 1.8, 0.2], yaw: 8,   anim: 기운다 }   # 혼례 휘장
        - { at: [2, 1, -7],  block: WHITE_WOOL,      scale: [0.6, 0.8, 0.05], yaw: 25, anim: 기운다 }   # 찢긴 혼서 반쪽
        - { at: [4, 1, -7],  block: WHITE_WOOL,      scale: [0.6, 0.8, 0.05], yaw: -30, anim: 기운다 }
        - { at: [5, 0, -9],  block: LANTERN,         scale: [0.7, 0.7, 0.7], yaw: 0,   anim: 멎는다 }   # 꺼져 가는 등

  # ═══════════════════════════════════════════════════════════════════════
  # 무대 등록부 — 계열(seojang.yml scenes 키) → 장면 순서대로
  #
  #   ★첫 장은 위 incidents(발단)가 이긴다 — 여기 sets 의 1장은 발단 무대가 없을 때의 폴백이다.
  #   layers 의 at = 정거장 중심 기준 [동x, 위y, 남z] · anim: 솟는다|기운다|멎는다
  #   (솟는다 = 물속에서 떠오른다 · 기운다 = 천천히 기울며 자리 잡는다 · 멎는다 = 정지)
  # ═══════════════════════════════════════════════════════════════════════
  sets:

    # ─── 재난이 닥친 아이 (★다층 파일럿 — 눈으로 보고 빨간펜) ───
    기본:
      - title: "그날 밤"
        pulse:
          - "§c불길이 담을 넘었다 §7— 매캐한 연기가 코끝을 찔렀다"
          - "§7식구들의 그림자가 뿔뿔이 흩어졌다"
        sound: { key: "minecraft:entity.blaze.ambient", volume: 0.55, pitch: 0.65 }
        particle: { type: FLAME, count: 6, spread: 2.5 }
        layers:
          - { at: [2, 0, -8],  block: DARK_OAK_LOG,    scale: [0.7, 3.4, 0.7], yaw: 14,  anim: 기운다 }   # 기울어진 기둥
          - { at: [4, 0, -10], block: DARK_OAK_PLANKS, scale: [3.4, 2.4, 0.5], yaw: -6,  anim: 솟는다 }   # 무너진 벽
          - { at: [3, 2, -9],  block: FIRE,            scale: [1.6, 1.6, 1.6], yaw: 0,   anim: 솟는다 }   # 지붕을 삼킨 불
          - { at: [1, 0, -7],  block: CAMPFIRE,        scale: [1.0, 1.0, 1.0], yaw: 30,  anim: 멎는다 }   # 잔불
          - { at: [5, 1, -11], block: FIRE,            scale: [1.0, 1.0, 1.0], yaw: 45,  anim: 솟는다 }
      - title: "길 위에서"
        pulse:
          - "§7밤길 — 뒤에서 붉은 놀이 하늘을 핥았다"
          - "§7맨발이 이슬에 젖었다. 멈추면 끝이다"
        sound: { key: "minecraft:ambient.cave", volume: 0.4, pitch: 1.3 }
        particle: { type: MYCELIUM, count: 8, spread: 3.0 }
        layers:
          - { at: [1, 0, -7],  block: DIRT_PATH,       scale: [4.0, 0.3, 1.2], yaw: -18, anim: 솟는다 }   # 어둠 속 흙길
          - { at: [3, 0, -9],  block: STRIPPED_DARK_OAK_LOG, scale: [0.4, 2.2, 0.4], yaw: 8, anim: 기운다 } # 이정목
          - { at: [5, 0, -8],  block: DARK_OAK_LEAVES, scale: [1.8, 1.4, 1.8], yaw: 0,   anim: 멎는다 }   # 밤 숲의 검은 덤불
          - { at: [4, 2, -12], block: MAGMA_BLOCK,     scale: [2.6, 0.8, 0.4], yaw: 0,   anim: 솟는다 }   # 지평선의 붉은 놀
      - title: "낯선 고을 {region}"
        pulse:
          - "§7낯선 저잣거리 — 아무도 이름을 묻지 않았다"
          - "§7빈 손, 빈 배 — 그래도 아침은 왔다"
        sound: { key: "minecraft:block.bell.use", volume: 0.45, pitch: 1.2 }
        particle: { type: END_ROD, count: 3, spread: 2.0 }
        layers:
          - { at: [2, 0, -8],  block: SPRUCE_PLANKS,   scale: [2.8, 2.0, 0.5], yaw: 5,   anim: 솟는다 }   # 객잔의 벽
          - { at: [2, 2, -8],  block: DARK_OAK_SLAB,   scale: [3.2, 0.4, 0.9], yaw: 5,   anim: 솟는다 }   # 처마
          - { at: [4, 0, -7],  block: HAY_BLOCK,       scale: [0.9, 0.9, 0.9], yaw: 20,  anim: 멎는다 }   # 장터의 짚단
          - { at: [1, 1, -7],  block: LANTERN,         scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }   # 처마의 등
      - title: "서장의 끝"        # 에필로그 — 기슭이 가까워진다 (등불 하나: 출도)
        pulse:
          - "§6동녘이 밝는다 — 강 건너에서 이승의 불빛이 손짓한다"
        sound: { key: "minecraft:block.bell.resonate", volume: 0.6, pitch: 0.9 }
        particle: { type: END_ROD, count: 5, spread: 3.0 }
        layers:
          - { at: [4, 0, -9],  block: LANTERN,         scale: [1.2, 1.2, 1.2], yaw: 0,   anim: 솟는다 }

    # ─── ★세가 — 오대세가의 자제 (2026-07-25 · 1장은 incidents 발단 무대가 이긴다) ───
    세가:
      - title: "세가의 새벽"          # 폴백 — 실제 1장은 incidents(비무행·그림자_시험·밀서)가 선다
        pulse:
          - "§6다섯 세가의 이름은 어디서나 크다 — §f그래서 오늘부터는 숨겨야 한다"
        sound: { key: "minecraft:block.wooden_door.close", volume: 0.6, pitch: 0.7 }
        particle: { type: CLOUD, count: 4, spread: 2.0 }
        layers:
          - { at: [3, 0, -9],  block: DARK_OAK_PLANKS, scale: [0.7, 3.6, 0.7], yaw: 0,   anim: 솟는다 }   # 세가의 대문
          - { at: [5, 0, -9],  block: DARK_OAK_PLANKS, scale: [0.7, 3.6, 0.7], yaw: 0,   anim: 솟는다 }
          - { at: [4, 3, -9],  block: DARK_OAK_SLAB,   scale: [3.4, 0.6, 0.9], yaw: 0,   anim: 솟는다 }
          - { at: [4, 1, -8],  block: LANTERN,         scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }
      - title: "이름이 앞서 걷던 길"
        pulse:
          - "§7길을 비키게 한 것은 내가 아니라 성(姓)이었다"
          - "§7이름을 접은 오늘, 처음으로 세상이 맨얼굴을 보인다"
        sound: { key: "minecraft:ambient.cave", volume: 0.35, pitch: 1.5 }
        particle: { type: MYCELIUM, count: 6, spread: 3.0 }
        layers:
          - { at: [1, 0, -7],  block: DIRT_PATH,       scale: [4.5, 0.3, 1.3], yaw: -12, anim: 솟는다 }   # 관도
          - { at: [3, 0, -9],  block: STONE_BRICKS,    scale: [0.7, 2.6, 0.7], yaw: 0,   anim: 솟는다 }   # 관문 돌기둥
          - { at: [5, 0, -9],  block: STONE_BRICKS,    scale: [0.7, 2.6, 0.7], yaw: 0,   anim: 솟는다 }
      - title: "{region} — 아무도 모르는 얼굴"
        pulse:
          - "§7여기서 그 성을 아는 이는 없다 — 명이 그러하니"
        sound: { key: "minecraft:block.bell.use", volume: 0.45, pitch: 1.1 }
        particle: { type: END_ROD, count: 3, spread: 2.0 }
        layers:
          - { at: [2, 0, -8],  block: SPRUCE_PLANKS,   scale: [2.8, 2.0, 0.5], yaw: 5,   anim: 솟는다 }   # 객잔의 벽
          - { at: [4, 0, -7],  block: HAY_BLOCK,       scale: [0.9, 0.9, 0.9], yaw: 20,  anim: 멎는다 }   # 저잣거리
          - { at: [1, 1, -7],  block: LANTERN,         scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }
      - title: "서장의 끝"
        pulse:
          - "§6동녘이 밝는다 — 이름 없이 서는 법을 배우는 시간이 시작된다"
        sound: { key: "minecraft:block.bell.resonate", volume: 0.6, pitch: 0.9 }
        particle: { type: END_ROD, count: 5, spread: 3.0 }
        layers:
          - { at: [4, 0, -9],  block: LANTERN,         scale: [1.2, 1.2, 1.2], yaw: 0,   anim: 솟는다 }

    # ─── ★출분(出奔) — 집을 나온 아이 (B-181 · 1장은 incidents 발단 무대가 이긴다) ───
    출분:
      - title: "담을 넘은 밤"        # 폴백 — 실제 1장은 incidents(담을_넘다·아버지의_검·파혼)가 선다
        pulse:
          - "§6그날 밤 — §f내가§6 택했다"
        sound: { key: "minecraft:block.grass.step", volume: 0.6, pitch: 0.7 }
        particle: { type: MYCELIUM, count: 5, spread: 2.0 }
        layers:
          - { at: [3, 0, -9],  block: STONE_BRICKS,    scale: [4.0, 2.2, 0.5], yaw: 0,   anim: 솟는다 }
          - { at: [4, 2, -9],  block: BLACK_CONCRETE,  scale: [0.5, 1.4, 0.3], yaw: 35,  anim: 기운다 }
      - title: "돌아보지 않는 길"
        pulse:
          - "§7등 뒤의 집은 아직 잠들어 있다 — 쫓는 것은 없는데 걸음이 빨라졌다"
          - "§7택한 길과 편한 길은 다른 말이었다"
        sound: { key: "minecraft:ambient.cave", volume: 0.35, pitch: 1.4 }
        particle: { type: MYCELIUM, count: 6, spread: 3.0 }
        layers:
          - { at: [1, 0, -7],  block: DIRT_PATH,       scale: [4.5, 0.3, 1.3], yaw: -14, anim: 솟는다 }   # 동트기 전의 관도
          - { at: [3, 0, -9],  block: STRIPPED_DARK_OAK_LOG, scale: [0.4, 2.1, 0.4], yaw: 6, anim: 기운다 } # 이정목
          - { at: [4, 2, -12], block: SMOOTH_QUARTZ,   scale: [2.8, 0.6, 0.4], yaw: 0,   anim: 솟는다 }   # 희끗한 새벽 미명
      - title: "{region} — 새 이름"
        pulse:
          - "§7여기서는 아무도 그 집의 이름을 모른다 — 그것이 바라던 것이다"
        sound: { key: "minecraft:block.bell.use", volume: 0.45, pitch: 1.15 }
        particle: { type: END_ROD, count: 3, spread: 2.0 }
        layers:
          - { at: [2, 0, -8],  block: SPRUCE_PLANKS,   scale: [2.8, 2.0, 0.5], yaw: 6,   anim: 솟는다 }   # 낯선 객잔의 벽
          - { at: [4, 0, -7],  block: HAY_BLOCK,       scale: [0.9, 0.9, 0.9], yaw: 15,  anim: 멎는다 }   # 품삯 일감
          - { at: [1, 1, -7],  block: LANTERN,         scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }
      - title: "서장의 끝"
        pulse:
          - "§6동녘이 밝는다 — 제 발로 고른 강호의 첫 아침이다"
        sound: { key: "minecraft:block.bell.resonate", volume: 0.6, pitch: 0.9 }
        particle: { type: END_ROD, count: 5, spread: 3.0 }
        layers:
          - { at: [4, 0, -9],  block: LANTERN,         scale: [1.2, 1.2, 1.2], yaw: 0,   anim: 솟는다 }

    # ─── 무가의 자식 — 수행 파견 (1차 기본판 【제안】 — 파일럿 빨간펜 뒤 다층 증축) ───
    수행_파견:
      - title: "출문(出門)"
        pulse:
          - "§7가문의 대문이 등 뒤에서 닫혔다 — 기대는 짐보다 무겁다"
        sound: { key: "minecraft:block.wooden_door.close", volume: 0.6, pitch: 0.8 }
        particle: { type: CLOUD, count: 4, spread: 2.0 }
        layers:
          - { at: [3, 0, -9],  block: DARK_OAK_PLANKS, scale: [0.6, 3.2, 0.6], yaw: 0,   anim: 솟는다 }   # 대문 기둥
          - { at: [5, 0, -9],  block: DARK_OAK_PLANKS, scale: [0.6, 3.2, 0.6], yaw: 0,   anim: 솟는다 }
          - { at: [4, 3, -9],  block: DARK_OAK_SLAB,   scale: [3.0, 0.5, 0.8], yaw: 0,   anim: 솟는다 }   # 현판 들보
      - title: "이름 없는 길"
        pulse:
          - "§7대로 — 아무도 가문의 이름을 몰랐다. 그게 홀가분했다"
        sound: { key: "minecraft:ambient.cave", volume: 0.35, pitch: 1.5 }
        particle: { type: MYCELIUM, count: 6, spread: 3.0 }
        layers:
          - { at: [2, 0, -8],  block: DIRT_PATH,       scale: [4.5, 0.3, 1.4], yaw: -10, anim: 솟는다 }
          - { at: [4, 0, -10], block: STRIPPED_SPRUCE_LOG, scale: [0.4, 2.0, 0.4], yaw: -5, anim: 기운다 }
      - title: "{region} — 전표와 이름"
        pulse:
          - "§7전장(錢莊)의 주판 소리 — 여기서부터는 제 이름으로 산다"
        sound: { key: "minecraft:block.bell.use", volume: 0.45, pitch: 1.1 }
        particle: { type: END_ROD, count: 3, spread: 2.0 }
        layers:
          - { at: [3, 0, -8],  block: SPRUCE_PLANKS,   scale: [3.0, 2.2, 0.5], yaw: 0,   anim: 솟는다 }
          - { at: [2, 1, -7],  block: LANTERN,         scale: [0.8, 0.8, 0.8], yaw: 0,   anim: 솟는다 }
      - title: "서장의 끝"
        pulse:
          - "§6동녘이 밝는다 — 이제 가문의 이름이 아니라 네 이름의 차례다"
        sound: { key: "minecraft:block.bell.resonate", volume: 0.6, pitch: 0.9 }
        particle: { type: END_ROD, count: 5, spread: 3.0 }
        layers:
          - { at: [4, 0, -9],  block: LANTERN,         scale: [1.2, 1.2, 1.2], yaw: 0,   anim: 솟는다 }
