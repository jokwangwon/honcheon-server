# ═══════════════════════════════════════════════════════════════════════════
# 강의 등록부 (RiverForge) — 물길의 주문서
# ═══════════════════════════════════════════════════════════════════════════
#
# 왜 이 파일이 있는가:
#   world_map.yml 은 일곱 곳에 물을 주문한다 (강 2 · 수향 3 · 물가 2).
#   그런데 지형 계층은 그 주문을 **받기만 하고 만들지 않았다** —
#   terrain.yml 의 윤곽 표가 이렇게 적고 있다:
#
#       그대로 — 강·수향·섬·밀림. 물과 숲은 자연이 준 대로가 옳다
#
#   그래서 `terrain: 강` 인 장강수로채 총채는 **바닐라가 그 근처에 물을 놓아 줬기를 바라며** 섰다.
#   부지 판정(world_map.yml terrain_types.강)은 `water_pct: [40,90] · max_depth_min: 6` 을 요구하는데,
#   그 조건은 **바다도 호수도 똑같이 만족한다.** 흐르지 않는 물은 강이 아니다.
#   물이 아예 없으면 RemoteBuilder.waterStockade 는 `List.of()` 를 돌려준다 — **아무것도 서지 않는다.**
#   그리고 아무것도 서지 않으면 지역 검수는 **볼 구역이 없어서 위반 0건**을 보고한다.
#   ★ 짓지 않으면 위반이 없다 — 그것이 이 눈의 열여덟 번째 거짓말이었다.
#
# 이 파일은 그 절반을 닫는다. 원칙은 굴·오아시스 때와 **정확히 같다**:
#
#       끈다   — 통제 불가능한 무작위 배치는.
#       만든다 — 등록 좌표의 의도된 지형은.
#
# ★ 무엇을 만들지 않는가 (경계를 여기 긋는다):
#   · **바다는 만들지 않는다** (terrain_layer.md §W6 — 섬은 자연에 맡긴다. 해남파의 선례).
#   · **대륙 수문(D8 유량 누적)은 하지 않는다.** 이 세계는 실지리 1:1 이다 —
#     장강수로채는 원점에서 69만 블록 떨어져 있다. 대륙의 유향(流向)을 풀려면
#     수십억 청크를 생성해야 한다. **그건 못 한다.**
#   · 그래서 여기 있는 것은 **국소 수문(局所水文)** 이다: 등록된 부지를 가로지르는 **한 굽이(reach)**.
#     그 한 굽이 안에서 강은 반드시 참이다 — 높은 데서 낮은 데로 흐르고, 끊기지 않고,
#     새지 않고, 배가 다닌다. 부지 밖의 장강은 **우리가 모른다.** 그렇다고 적는다.
#
# 없어도 돈다 — 이 파일이 없으면 RiverForge 는 아무 일도 하지 않는다 (지금까지와 같다).
version: 1

# ───────────────────────────────────────────────────────────────────────────
# 기본값 — 등록 항목이 적지 않으면 이것을 쓴다
# ───────────────────────────────────────────────────────────────────────────
defaults:
  width: 36               # 수면 폭(칸). 반폭 = width/2
  depth: 8                # 물길 한가운데 수심. terrain_types.강 이 max_depth_min: 6 을 요구한다 —
                          #   배가 다니려면 그만큼은 깊어야 한다 (수로채의 뗏목이 말뚝을 박는다)
  gradient: 70            # ★ 하상이 한 칸 내려가는 데 걸리는 물길 거리(칸). 1/70 물매.
                          #   실제 장강 중류는 1/10000 이다 — 게임에서는 보이지 않는다.
                          #   여기서는 **검수가 잴 수 있을 만큼만** 기울인다 (한 굽이에 서너 칸)
  axis_offset: 0.45       # ★ 물길 중심선이 부지 중심에서 옆으로 비켜난 거리 (반경의 배수).
                          #   0 이면 강이 부지 한복판을 지난다 — 그러면 마을이 설 땅이 없다.
                          #   0.45 면 한쪽은 뭍이고 한쪽이 물이다. **나루가 설 자리가 그래서 생긴다**
  surface_below_ground: 2 # 수면이 조성 지면보다 이만큼 아래. 강은 골짜기에 있지 둔덕에 있지 않다.
                          #   ★ 지면 위로 올리면 안 된다 — 환경 검수 ②가 '산 위의 웅덩이'로 센다
                          #     (오아시스가 cy-1 인 것과 같은 이유다)
  valley: 26              # 둔치 — 물가에서 이 폭에 걸쳐 **자연 지형으로 수렴한다**.
                          #   이게 없으면 강가가 수직 절벽이 된다 (그건 강이 아니라 수로다)
  margin: 20              # 물길이 부지 반경 밖으로 이만큼 더 뻗는다 (강은 부지에서 시작하지 않는다).
                          #   ★ MvtCommand 의 preload 반경(forgeRadius + 24)을 넘지 않아야 한다 —
                          #     넘으면 청크를 동기 생성하다가 조성이 멎는다
  meander_amp: 16         # 굽이의 진폭 — 강은 자로 그은 듯 곧지 않다
  meander_len: 170        # 굽이의 파장. ★ 저주파여야 한다 —
                          #   파장이 한 칸이면 그것은 결이 아니라 **노이즈**다 (산이 '점무늬'가 된 병)
  bank_material: 자갈     # 물가의 자재 (자갈/모래/진흙)
  wetland: 10             # ★ 범람원(氾濫原) — 물가에서 이 폭까지는 **들판이 아니다**.
                          #   강을 파 놓고 그 옆을 잔디로 두면 그건 **물길만 난 잔디밭**이다.
                          #   진창(MUD) → 젖은 흙 → 마른 들 로 결이 진다. 갈대가 물가에 선다.
                          #   0 이면 범람원이 없다 (협곡의 강은 둔치가 없다)

# ───────────────────────────────────────────────────────────────────────────
# 물길 — ★ 등록된 것만 판다. 코드가 강을 발명하지 않는다
# ───────────────────────────────────────────────────────────────────────────
#
# flow: [들어오는 쪽, 나가는 쪽] — 물은 뒤엣것을 향해 흐른다.
#   축은 world_map.yml 그대로다: x = 동(+)/서(-),  z = 남(+)/북(-)
#
# ★ 등록되지 않은 물가는 판이 아니다:
#   sibaksa_myeongju (시박사 — 명주 해관) 는 `terrain: 물가` 지만 **바다**다 (절강 연안 해관).
#   바다는 만들지 않는다. 그래서 여기 없다. **없는 것에도 이유가 있다.**
rivers:

  # ── 장강(長江) — 중원의 대동맥. 서에서 동으로 흐른다 ──
  #    world_map.yml routes.sulo_jangang: "이 물길의 통행세를 그들이 걷는다"
  #    ★ 통행세를 걷으려면 **배가 지나갈 물길**이 있어야 한다. 그것이 이 항목이다
  jangang_suroche:
    name: "장강 중류 — 수로채의 물목"
    flow: [서, 동]
    width: 44             # 총채가 뗏목을 엮는다 — 넓어야 한다
    depth: 9              # 뗏목의 말뚝이 강바닥에 닿는다
    axis_offset: 0.45     # 뭍에는 나루뿐 (architecture: "뭍에 집이 없다") — 그 나루가 설 뭍이 필요하다

  muhan:
    name: "장강 중류 — 무한 나루"
    flow: [서, 동]
    width: 48             # note: "장강 중류 최대 나루. 수로채와 상단이 같은 물을 쓴다"
    depth: 9

  # ── 강남 수향(水鄕) — "물길이 골목이다" (world_map.yml) ──
  #    골목이므로 좁고 얕다. 배가 다니되 큰 배는 아니다
  soju:
    name: "대운하 — 소주의 물골목"
    flow: [북, 남]        # 대운하는 남북으로 뚫렸다
    width: 22
    depth: 6
    axis_offset: 0.30     # 물길이 골목이면 마을이 물을 끼고 앉는다 — 더 가깝게

  gangnam_sangro:
    name: "강남 물길 — 상로의 젖줄"
    flow: [서, 동]
    width: 26
    depth: 6

  namgung:
    name: "장강 지류 — 남궁세가의 물"
    flow: [서, 동]        # architecture: "회랑이 연못을 끼고 돈다"
    width: 24
    depth: 6
    axis_offset: 0.55     # 세가의 정원이 앉을 뭍을 넉넉히 남긴다

  # ── 위수(渭水) — 관중 평야를 서에서 동으로 가른다 (황하로 든다) ──
  wisu_galdae:
    name: "위수 — 갈대밭의 물"
    flow: [서, 동]
    width: 30
    depth: 6
    bank_material: 진흙   # 갈대밭이다
    wetland: 18           # ★ 이름이 **갈대밭**이다 — 범람원이 넓어야 그 이름이 참이 된다
