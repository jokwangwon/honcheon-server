# LLM 런타임 규칙 (기계 판독용) — 모델 선택·캐싱·생성 원칙·폴백
# 기준 문서: docs/design/llm_runtime_policy.md
# 대원칙: LLM은 게임 로직에 관여하지 않는다 — 엔진이 사실을 계산하고 LLM은 서사만 렌더한다
# 가격·모델 ID는 2026-07 기준 (Claude API) — 세대 교체 시 이 파일만 갱신

# ─── 로컬 LLM (선택) — 크레딧 없이 턴 렌더러만 로컬로 (HONCHEON_LLM_URL 설정 시) ───
local_provider:
  scope: turn_renderer_only        # GM·세계급은 로컬 금지 — 세계 일관성은 품질이 좌우한다
  api: openai_compatible           # Ollama /v1/chat/completions (llama.cpp·vLLM 동일)
  env: { url: HONCHEON_LLM_URL, model: HONCHEON_LLM_MODEL }   # 예: http://localhost:11434/v1 + exaone3.5:7.8b
  recommended_models: [qwen3-30b-a3b, exaone3.5:7.8b]   # 7차 실측: qwen3 우세 (선택 선점 0·기준 서사 준수)
  benchmark_note: "2026-07-11 실측 — exaone3.5: 선택 선점 2회·기준 서사 대체·영문 지명 누출 / qwen3-30b: 위반 없음, 어색 조어만. 수치 유출은 양쪽 0건"
  priority: "로컬 URL 설정 시 로컬 우선 → 없으면 ANTHROPIC_API_KEY → 없으면 폴백 템플릿"
  guards: "7계·길이 예산·폴백 동일 적용 — 소형 모델의 위반은 가드가 거르고 폴백이 받친다"
  hardware_note: "GPU 8GB+ 권장 (첫 글자 1~3초). CPU 전용은 5~20초 — 체감 저하 감수"

# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 런타임 — 시간과 줄 (2026-07-13 실측으로 신설. 전에는 **코드에 박혀 있었다**)
#
# 【실측 (qwen3-30b · GB10 · 45.3GB 전부 VRAM)】
#   짧은 글(120토큰) 1건 ............  2.2초
#   짧은 글        4건 동시 ......... 20.1초   ← 순차(8.8초)보다 **더 느리다**
#   ★ 실제 서장(700토큰) 1건 ........ 22.4초
#   ★ 실제 서장        4건 동시 ..... 89.5초
#
# 【★ 이 숫자가 드러낸 두 가지 결함】
#
#  ① **타임아웃 25초가 정상 응답을 죽이고 있었다.** 코드에 `Duration.ofSeconds(25)` 라고 박혀 있었고,
#     혼자 써도 22.4초다 — **2.6초 차이로 아슬아슬하게 통과**하던 것이다. 조금만 길어지면 타임아웃,
#     그리고 **조용히 폴백**. 사람은 왜 글이 달라졌는지 알 방법이 없었다.
#
#  ② **병렬이 오히려 독이었다.** 봇은 CompletableFuture 로 **동시에 던졌다** (줄을 안 세웠다).
#     넷이 동시에 서장에 들면 각자 4배 느려져 **89.5초** — 전원이 25초 벽에 걸려 **아무도 못 받는다.**
#     순차로 세우면 적어도 **첫 사람은 22초에 받는다.** 병렬은 GPU 하나에서 이득이 아니라 **경합**이다.
#
# 【★ 그래서 배는 한 명씩 탄다】 (사용자 결정: "1로 진행. 배는 한명씩 타는걸로")
#   호출을 **직렬화**한다 (동시 1건 — Scribe.java 의 단일 차선). 그리고 그 줄을 **세계의 문법으로**
#   말한다 — 나루의 사공은 한 번에 한 사람만 태운다. 기다림이 UI 가 아니라 **이야기**가 된다.
#   ★ 침묵 금지: 앞에 몇 사람인지 **말해 준다** (seojang.yml ferry).
# ═══════════════════════════════════════════════════════════════════════════════
runtime:

  # ★ 직렬화 — GPU 는 하나다. 줄을 세우는 것이 모두에게 빠르다 (위 실측)
  serialize: true
  queue_warn_depth: 3              # 앞에 이만큼 쌓이면 사람에게 차례를 말해 준다 (침묵 금지)
  queue_max: 12                    # 이보다 길어지면 **줄을 세우지 않고 즉시 폴백** (무한정 기다리게 하지 않는다)

  # ★ 타임아웃 — **한 건**의 상한이다 (줄에서 기다린 시간은 포함하지 않는다. 대기와 생성은 다른 시계다)
  #   실측 22.4초 × 여유 ≈ 60초. 25초는 **측정값보다 짧았다** — 그것이 결함이었다.
  #   ★ 직렬화했으므로 한 건은 언제나 GPU 를 독점한다: 89.5초(4건 경합)를 볼 일이 없다.
  local_timeout_seconds: 60
  cloud_timeout_seconds: 20        # Claude(haiku)는 빠르다 — 옛 코드값 8초는 과했다 (529·재시도에 취약)
  connect_timeout_seconds: 4

  # ═══ ★ 길이 — **가위가 아니라 주문(注文)으로 짧게 쓰게 한다** (2026-07-13 사용자 확정) ═══
  #
  # 【★ max_tokens 는 목표가 아니라 **가위**다】 700 → 350 으로 줄이면 모델은 **하던 대로 길게 쓰다가
  #   문장 한가운데서 잘린다.** 시간은 줄지만 **글이 망가진다.** 잘린 글은 폴백보다 나쁘다.
  #
  # 【그래서 프롬프트로 시킨다】 LlmRenderer SYSTEM 4항:
  #     "길이는 **350자 안팎** (300~400자) … ★ **여백을 남겨라** — 다 말하지 말고 그친다."
  #   모델이 **스스로 짧게 끝내면** 토큰도 줄고(→ 빨라지고) 글도 온전하다. 둘 다 얻는다.
  #
  # 【max_tokens 는 안전핀으로만 남긴다】 폭주(모델이 안 멈추는 사고) 방지. 평소에는 닿지 않는 값이다 —
  #   350자짜리 글이 700토큰을 쓸 일이 없다. **닿는다면 그것이 곧 이상 신호다.**
  max_tokens: 700                  # ← 안전핀. 목표 길이가 아니다 (목표는 프롬프트에 있다)

  # ★ 폴백은 **숨기지 않는다** (오늘 우리가 가장 많이 잡은 병이 침묵이다)
  #   운영자 → 로그 WARN (LlmRenderer.fallbackWith · 1분 쿨다운) + 봇 장부 events '서사_폴백'
  #   사람   → 책의 마지막 장에 **간기(刊記) 한 줄** (seojang.yml book.fallback_mark).
  #            겁주지 않는다 — 세계의 말로 적는다 ("붓이 더디어 옛 필사본이 왔다").
  #            ★ 폴백 문장도 **진짜 서사**다 (Narration 은 못 쓴 글이 아니다) — 그러니 사과가 아니라 **표시**다.
  fallback_visible_to_player: true

  # ★ B-016·B-017 — 대화(/혼천 대화)도 **같은 배**를 탄다 (Scribe 단일 차선 — 위 serialize 가 대화에도 걸린다).
  #   전에는 대화가 줄을 건너뛰고 렌더러를 직접 불렀다 — 서장 lane 과 GPU 를 다퉜다 (위 실측: 동시면 각자 4배).
  #   줄이 queue_warn_depth 만큼 쌓이면 아래 문장으로 차례를 말해 준다 (침묵 금지 — 서장의 ferry 와 동형).
  chat_queue_notice: "…{npc}은(는) 다른 손님을 상대하고 있다 — 조금만. (앞에 {ahead}인)"
  #   폴백 표식 — 서장의 간기(seojang.yml book.fallback_mark)와 동형: 사과가 아니라 **표시**다.
  #   디스코드 embed 이므로 § 색 코드가 아니라 마크다운으로 적는다. fallback_visible_to_player 가 끄면 안 보인다.
  chat_fallback_mark: "*(붓이 더디어 몸짓만 돌아왔다)*"

roles:
  turn_renderer:
    model: claude-haiku-4-5
    price_per_mtok: { input: 1.00, output: 5.00 }
    traits: [고빈도, 저지연, 좁은_과제]
    note: "엔진이 사실을 전부 주므로 과제가 좁다 — 속도·비용 최우선"
  gm_narrative:
    model: claude-sonnet-5
    price_per_mtok: { input: 3.00, output: 15.00 }
    scope: [장_전환, 발단_사건_생성, 심층_NPC_대화, 귀환_리포트]
  world_batch:
    model: claude-sonnet-5
    api: batch                     # 50% 할인 — 계절 정산 서사화·다이제스트 (자정 배치와 동형)
    scope: [계절_정산_서사화, 세계_다이제스트]
  world_event_judge:
    model: claude-opus-4-8
    price_per_mtok: { input: 5.00, output: 25.00 }
    scope: [창작_오의_심사, 세계급_등록_이벤트, 신병_내력_생성]
  escalation: "렌더러 스키마 불일치 2회 → 해당 턴만 gm_narrative로 승격"

latency_budget:
  판정_체감: "0ms — 엔진 즉시 + 결과 한 줄은 엔진 템플릿 선표시"
  서사_첫_글자: "1.5s 이내 — 스트리밍 (타자기 출력)"
  서사_전문: "5s 이내"
  prefetch: "유력 선택지 다음 턴 사전 렌더 (PT-005 실측 ~90% 적중) — 적중 시 체감 0"

prompt_caching:
  prefix_order:                    # 캐시는 접두사 일치 — 안정된 것부터
    - { layer: 고정, content: "GM 마스터 프롬프트 v2 + 룰 다이제스트 + 은유 사전", cache_control: ephemeral }
    - { layer: 세션, content: "캐릭터 시트 + 지역 상태 스냅샷" }
    - { layer: 가변, content: "이번 턴 엔진 사실 JSON — 캐시 뒤, 매턴 교체" }
  forbidden: [시스템_프롬프트_내_시각·난수, 턴별_도구·모델_변경]
  min_cacheable_note: "Haiku 4.5 최소 4096토큰 — GM 프롬프트+다이제스트로 충족"
  monitor: "usage.cache_read_input_tokens — 0이면 침묵 무효화 추적"
  cost_estimate_per_turn: "$0.005 (캐시 읽기 8K + 신규 1K + 출력 0.6K) — 동접 60 기준 ~$1.8/시간"

# ─── 텍스트 생성 7계 ───
generation_principles:
  - id: 엔진_불가침
    rule: "수치·판정 결과·자원 변동의 발명/변경 금지 — LLM은 성공을 정하지 않는다, 들었을 뿐"
  - id: 스키마_강제
    rule: "출력 = JSON {narration, choices[], npc_lines[]} — output_config.format json_schema로 API 수준 보장"
  - id: 수치_은닉
    rule: "서사에 숫자 노출 금지 — 판정은 서사로 (마진 +2 = '아슬아슬하게'), 단전은 은유 사전 경유"
  - id: 정보_경계
    rule: "미해금 진실 누설 금지 — 소문은 엔진이 준 정확도만큼만, secrets는 해금 플래그 시에만"
  - id: 등록제_명사
    rule: "NPC·지명·무공명 신조 금지 — 새 이름 필요 시 등록 절차로 반환, 이번 턴은 무명 서술"
  - id: 길이_예산
    rule: "턴 서술 400~700자 / 선택지 3~5개 × 한 줄 / NPC 대사 2줄 — GM 서사만 상한 완화"
  - id: 문체
    rule: "한국어 무협 문법 (GM 마스터 프롬프트 v2 승계) — 사건의 무게는 수치가 정한다, 형용사가 아니라"

render_schema:                     # 턴 렌더 구조화 출력 스키마 (프로토타입 스펙)
  type: object
  properties:
    narration: { type: string }
    choices: { type: array, items: { type: object, properties: { id: {type: string}, text: {type: string} }, required: [id, text], additionalProperties: false } }
    npc_lines: { type: array, items: { type: object, properties: { npc: {type: string}, line: {type: string} }, required: [npc, line], additionalProperties: false } }
  required: [narration, choices]
  additionalProperties: false

failure_handling:
  schema_mismatch: [SDK_재시도_1회, 렌더러_승격, 폴백]
  api_outage: "폴백 = 엔진 원시 출력 (판정 결과 표 + 정적 선택지 템플릿) — 서사 없는 턴은 심심하지만 유효하다"
  overload_529: "지수 백오프 (SDK 기본) + 프리페치 재활용 (렌더된 분기 우선 소진)"
  logging: "(엔진 사실 해시, 응답, usage) 전 호출 기록 — 7계 위반 감사 재료"

readiness:                         # 실 테스트 준비도 (llm_runtime_policy.md 6장)
  mc_mvt: 준비됨                    # LLM 무관 — 엔진 단만 배선
  text_rpg_blockers: [2단_파이프라인_프로토타입, 프리페치_구현, 세션_영속화]
  note: "본 정책이 프로토타입의 스펙이다"
