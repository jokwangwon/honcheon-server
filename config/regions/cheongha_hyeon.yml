# 초기 시작 지역: 청하현
# 기준 문서: docs/design/text_rpg_design.md 12~15장, 21장
#
# 섬서 지역권 외곽의 중소 규모 현.
# 너무 평화롭지도, 너무 위험하지도 않은 튜토리얼 지역.
# 세계 계층: 장소 → 마을/거점 → 현/도시 → 지역권 → 천하

region:
  id: cheongha_hyeon
  name: "청하현"
  tier: "현"                    # 세계 계층상 현/도시 단위
  parent_region: "섬서 지역권"
  tutorial_region: true
  danger_level: "보통"

  # 지역 누적 시간의 대상이 되는 상태값 (0~100)
  state:
    security: 50     # 치안
    economy: 48      # 경제
    public_mood: 55  # 민심

  # 세력 영향력
  faction_influence:
    gwan_gun: 30          # 관군
    orthodox: 22          # 정파
    unorthodox: 28        # 사파/흑도
    sangdan: 18           # 상단
    magyo: 2              # 마교   — 내부 상태 / 플레이어 출력 비노출
    hyeolgyo: 0           # 혈교   — 내부 상태 / 플레이어 출력 비노출

  # 플레이어에게 초기 노출되는 세력 (마교/혈교는 초기 10턴 내 비노출)
  visible_factions:
    - gwan_gun
    - orthodox_heroes
    - haomun
    - sangdan
    - mingan

locations:
  cheongha_inn:
    name: "청하객잔"
    description: "소문과 사파 연락책 사건의 출발점"
    linked_incidents: [inn_unorthodox_contact]
    linked_npcs: [hanbaek, muksam]

  request_office:
    name: "의뢰소"
    description: "정파 연락망, 의뢰, 매화 문양 목패 같은 화산파 입문 단서와 연결"
    linked_incidents: [north_road_bandits]
    linked_npcs: [soyeon]

  medicine_shop:
    name: "약재상 / 의원"
    description: "열병 소문, 약재 가격 상승, 가짜 약, 민심 문제와 연결"
    linked_incidents: [cheongha_fever_rumor]
    linked_npcs: [yumun]

  north_road:
    name: "북쪽 산길"
    description: "도적 증가, 상단 호위, 녹림 매복, 하오문 정보 유출과 연결"
    linked_incidents: [north_road_bandits]
    linked_npcs: [gwakjin]

  heuksu_ferry:
    name: "흑수나루"
    description: "수로 물류 거점"
    linked_incidents: []
    linked_npcs: []

  north_alley_warehouse:
    name: "북쪽 골목 창고"
    description: "묵삼의 야간 접선 장소. 뒷문과 최근 물건을 옮긴 흔적이 있다. (턴 5~7 무대)"
    hidden: true                  # 잠복/미행으로만 발견되는 장소
    linked_incidents: [inn_unorthodox_contact, north_road_bandits]
    linked_npcs: [muksam, heukrang]

  abandoned_shrine:
    name: "폐사당"
    description: "초기에는 금기 루트를 열지 않는다. 불길한 소문 / 장기 떡밥으로만 유지."
    long_term_hook: true
    linked_incidents: []
    linked_npcs: []

# 청하현 초기 사건 3개
incidents:
  inn_unorthodox_contact:
    name: "객잔의 사파 연락책 묵삼"
    surface: "청하객잔 2층에 수상한 손님이 머문다."
    truth: "묵삼은 하오문과 연결된 사파 연락책이며, 상단 이동 정보를 외부로 흘리고 있다."
    stages:
      1: "숨겨진 접촉"
      2: "하오문 접선 확인"
    related_npcs: [muksam, hanbaek, soyeon]
    route_links:
      - "화산파 / 정파 입문 단서"
      - "하오문 / 사파 정보 루트"
      - "상단 호위 루트"
      - "북쪽 산길 도적 증가 사건"
      - "관군 신고 루트"
      - "소문 / 세력 반응 시스템"
    follow_ups:
      - "묵삼 추적"
      - "하오문 정보 거래"
      - "정파 보고"
      - "관군 신고"
      - "사파 역추적"

  north_road_bandits:
    name: "북쪽 산길 도적 증가"
    surface: "북쪽 산길에 도적이 늘었다."
    truth: "하오문을 통해 상단 이동 정보가 유출되고, 녹림/도적 세력이 그 정보로 상단을 노린다."
    stages:
      1: "도적 소문"
      2: "상단 습격 가능성 확인"
    related_npcs: [gwakjin, muksam]
    resolution_paths:
      - "전투"
      - "정찰"
      - "호위"
      - "매복 대응"
      - "관군 신고"
      - "정파 보고"
      - "사파 거래"
    follow_ups:
      - "상단 호위"
      - "매복 대응"
      - "녹림 / 하오문 연결 조사"
      - "정파 증거 확보"

  cheongha_fever_rumor:
    name: "청하현 열병 소문"
    type: "비전투형"
    surface: |
      열병 환자가 조금씩 늘고 있다.
      약재값이 오르고 있다.
      의원 유문이 과로하고 있다.
      북쪽 산길 물류 불안 때문에 약재가 부족해질 수 있다.
      장터에 가짜 약이 돌 수 있다.
      폐사당 근처에 찜찜한 소문이 있지만 확정할 수 없다.
    # 초기에는 혈교/마교를 직접 노출하지 않는다.
    # "혈교 후보 단서"라는 표현을 플레이어 출력에 쓰지 않는다.
    hidden_hook: true
    related_npcs: [yumun]
    resolution_paths:
      - "의원 지원"
      - "약재 거래 조사"
      - "가짜 약 추적"
      - "상단 약재 운송 문제 해결"
    follow_ups:
      - "원인 불명 환자 일부에 대한 장기 떡밥 기록"

# 초기 튜토리얼에서 열지 않는 루트 (장기 위협)
locked_routes:
  - "마교 루트"
  - "혈교 루트"
  - "금기 무공 루트"
  - "폐사당 금기 사건"
