    # 【15문파 오의의 형체 4장】 — 17종이 이 넷과 기존 넷(매화·태극·군림·혈해)을 나눠 쓴다.
    #   문파마다 형체를 하나씩 굽는 길도 있었으나, 그것은 **팩 21장**이다 (예산·유지비 모두 진다).
    #   대신 **히트박스가 형체를 정하게** 했다 — 원은 펴지고(고리·꽃·손바닥), 선은 앞에 선다(빗살).
    #   그것이 이 등록부의 규칙이기도 하다: 보이는 모양 = 맞는 모양 (불변식 ㄴ).
    #   문파는 그 안에서 **파티클·소리·응집 고리**가 가른다 (형체는 히트박스의 것이다).
    #
    # 【방향 계약 — 2026-07 개정: 이제 **회전이 있다**】
    #   좌표계: 형체는 시전자를 향해 선다. 그 몸을 기준으로 **+X 왼쪽 · +Y 위 · +Z 앞** 이다.
    #           **앞은 Z 다** (바닐라 규약: yaw 0 인 몸은 +Z 를 본다). 이 한 줄이 어디에도 없어서
    #           지난 판은 '앞으로 뻗는 축'을 모델에 새기지 못했다 (yaw 로만 서고 scale 로만 자랐다).
    #   이제 `motions[].orient: [pitch, yaw, roll]` (도) 이 형체를 돌려 세우고,
    #        `motions[].burst_scale: [x, y, z]` 가 **축마다 다르게** 자라게 한다.
    #        둘이 함께여야 창(槍)이 된다: 한 축만 사거리를 따라 뻗고, orient 가 그 축을 앞으로 눕힌다.
    #   그래서 선(線) 오의는 이제 **'앞에 선 빗살'이 아니라 '앞으로 뻗는 뇌격의 다발'** 이다 (뇌격_강림).
    #   ※ 스칼라 burst_scale 은 그대로 돈다 (세 축이 같이 자란다 — 원 오의의 문법은 변하지 않았다).
    검풍_고리:
      key: "honcheon:ult/sword_gale"
      base: PAPER
      fallback: AMETHYST_SHARD
      size: [2.0, 0.06, 2.0]      # XZ 평면에 눕는다 (몸을 중심으로 사방)
      form: "여덟 획이 사방으로 뻗은 검풍(劍風) — 원 오의의 얼굴. 꽃이 아니라 **검의 자리**다"

    뇌격_빗살:
      key: "honcheon:ult/bolt_comb"
      base: PAPER
      fallback: END_ROD
      size: [1.4, 2.2, 0.06]      # 폭(X) 1.4 · **길이(Y) 2.2** · 두께(Z) 0.06
      # 【주의 — 개화의 size 는 치수가 아니라 **종횡비**다】 참격선은 size 로 **나누고**(scale = 길이/size),
      #   개화는 size 를 **곱한다**(scale = size × 사거리 × burst_scale). 그래서 개화 모델의 실제 뻗은
      #   길이는 언제나 **1m(16단위)** 여야 한다 — 그보다 길게 구우면 그 배만큼 더 길어진다.
      # 【원점 계약 — 앞으로 뻗는 형체 · 팩 청구서】 참격선이 원점을 **머리**에 두듯, 뻗는 형체는 원점을
      #   **꽁무니**(시전자 쪽)에 둔다. 획들은 거기서 **+Y 로 16단위(1m)** 늘어난다 (elements y: 8 → 24).
      #   그래야 orient [90, 0, 0] 이 그 축을 **앞(+Z)** 으로 눕혔을 때 다발이 시전자의 가슴에서
      #   **표적을 향해** 뻗는다. 지금 구워진 것은 **원점 중심의 1m 정육면체(자리표)** 이므로,
      #   다시 굽기 전까지는 다발의 **뒤 절반이 시전자 뒤로 삐져나온다** (팩 미배포라 지금은 안 보인다).
      #   길이는 판정이 준다 (burst_scale.y × 사거리 — length 10~24m).
      form: "**앞으로 뻗는 뇌격의 다발** — 선 오의(섬전 13 · 오호 5 · 항룡 3 · 사일 9)의 얼굴.
             원점은 꽁무니, +Y 로 늘어난다. 가운데가 길고 양옆이 짧다 — 한 줄로 간다는 뜻이다"

    장심_인:
      key: "honcheon:ult/palm_bloom"
      base: PAPER
      fallback: AMETHYST_SHARD
      size: [1.6, 1.6, 0.06]
      form: "거대한 장심(掌心) — 다섯 손가락이 펴진 손바닥 하나 (소림의 원 오의). 앞을 향해 선다"

    독무_고리:
      key: "honcheon:ult/toxin_veil"
      base: PAPER
      fallback: AMETHYST_SHARD
      size: [1.0, 0.06, 1.0]
      form: "바닥을 기는 재(灰)의 겹고리 — **독은 터지지 않는다. 퍼진다.**
             다른 오의의 형체가 한 순간에 펴진다면 이것은 느리게 밀려 나간다"

  # ─── 모션 등록부 — 어떻게 움직이는가 (보간이 부드러움의 전부다) ───
  # kind: 참격(그렸다 지워진다) · 서림(병기에 겹쳐 지속) · 투사(날아간다) · 고리(궤도) · 개화(오의)
  #   draw          획이 그려지는 틱 (꼬리가 자란다) — 실제 값은 계열 공속이 정한다 (swings.span_ratio)
  #   fade          획이 지워지는 틱 (**꼬리부터**)
  #   interpolation 보간 틱 — 0 이면 형체가 튄다. 부드러움의 전부가 여기 있다
  motions:
    참격_호:  { kind: 참격, model: 검압_내려1, fade: 5, interpolation: 2, spread: 1.15 }  # ★녹색 검기 1단계 (되돌리기: model 을 참격_호 로)
    참격_선:  { kind: 참격, model: 참격_선, fade: 4, interpolation: 2, spread: 1.10 }
    참격_원:  { kind: 참격, model: 참격_원, fade: 6, interpolation: 3, spread: 1.20 }
              # spread — 지워질 때 획이 살짝 **퍼지며** 사라진다 (연기처럼). 1.0 이면 그대로 얇아진다

    날의_기:  { kind: 서림, model: 날의_기, interpolation: 4, lifetime: 60 }
              # 지속 — 수명이 아니라 **심장박동**으로 산다 (태세를 거두면 그 자리에서 사라진다)

    검기_투사: { kind: 투사, model: 검기_비,   lifetime: 14, speed: 1.6, spin: 0.30,
                birth: 1, fade: 3, interpolation: 2, impact_scale: 1.8, impact_ticks: 4, brightness: [15, 15] }
    강기_투사: { kind: 투사, model: 강기_포신, lifetime: 20, speed: 1.0, spin: 0.10,
                birth: 2, fade: 4, interpolation: 3, impact_scale: 2.2, impact_ticks: 6, brightness: [15, 15] }
    어검_비행: { kind: 투사, model: 어검_검,   lifetime: 26, speed: 1.2, spin: 0.55,
                birth: 1, fade: 3, interpolation: 2, impact_scale: 1.4, impact_ticks: 3, brightness: [0, 15] }
    암기_투척: { kind: 투사, model: 던진_암기, lifetime: 30, speed: 1.4, spin: 0.75,
                birth: 1, fade: 2, interpolation: 1, impact_scale: 1.0, impact_ticks: 1,
                stick_ticks: 20, brightness: [0, 15] }
                # 던진 물건은 **꽂힌다** — 빗나가면 땅에 20틱 남았다가 사라진다 (회수는 인벤토리의 몫이 아니다:
                # skill_mechanics ranged.암기 "회수 가능 (전투 후 절반)" 은 경제 층의 규칙이다)

    호신_고리: { kind: 고리, model: 호신_조각, count: 4, radius: 0.85, height: 1.0,
                orbit: 0.10, interpolation: 4, brightness: [15, 15] }

    매화_개화: { kind: 개화, model: 매화_꽃,   lifetime: 30, birth: 0, fade: 8,
                interpolation: 4, spin: 0.06, burst_scale: 1.0, billboard: FIXED, brightness: [15, 15] }
    태극_대기: { kind: 개화, model: 태극_원반, lifetime: 40, birth: 4, fade: 6,
                interpolation: 4, spin: 0.12, burst_scale: 0.5, billboard: FIXED, brightness: [15, 15] }
    군림_강림: { kind: 개화, model: 군림_획,   lifetime: 24, birth: 0, fade: 5,
                interpolation: 3, spin: 0.0, burst_scale: 0.8, billboard: FIXED, brightness: [15, 15] }
    혈해_범람: { kind: 개화, model: 혈해_파문, lifetime: 30, birth: 0, fade: 8,
                interpolation: 4, spin: 0.04, burst_scale: 1.0, billboard: FIXED, brightness: [15, 15] }

    # 15문파 오의 (17종이 이 넷을 나눠 쓴다 — 히트박스가 형체를 정한다)
    검풍_개화: { kind: 개화, model: 검풍_고리, lifetime: 30, birth: 0, fade: 8,
                interpolation: 4, spin: 0.10, burst_scale: 1.0, billboard: FIXED, brightness: [15, 15] }
                # 원 오의 — 사방으로 펴진다 (창궁무애·혼원벽력·운룡대팔식·천하36검·남해36검)
    뇌격_강림: { kind: 개화, model: 뇌격_빗살, lifetime: 22, birth: 0, fade: 4,
                interpolation: 2, spin: 0.0, orient: [90, 0, 0],
                burst_scale: [0.06, 0.45, 0.50], billboard: FIXED, brightness: [15, 15] }
                # 선 오의 — **앞으로 뻗는다**. 자전하지 않는다 (한 줄로 가는 것은 돌지 않는다)
                # orient [90,0,0] — 모델의 길이축(+Y)을 **앞(+Z)** 으로 눕힌다. 그래서 창이 된다
                # burst_scale 축이 갈린다 (final = size × 사거리 × 배율):
                #   y 0.45 = 길이 2.2 × range × 0.45 ≈ **사거리 그대로** (10m → 9.9m · 24m → 23.8m)
                #   x 0.06 = 폭   1.4 × range × 0.06 ≈ 0.8~2.0m — 히트박스 width(0.8~3)를 따라간다
                #   z 0.50 = 두께 0.06 × range × 0.50 ≈ 0.3~0.7m (누운 뒤엔 위아래 두께다)
                # 예전엔 세 축이 **같이** 자라서 길이를 사거리까지 늘리면 폭도 하늘을 덮었다 —
                # 그래서 0.15 로 통째로 줄여 '앞에 선 빗살'로 세울 수밖에 없었다. 그 청구서를 여기서 갚는다
    장심_개화: { kind: 개화, model: 장심_인,  lifetime: 26, birth: 2, fade: 6,
                interpolation: 4, spin: 0.02, burst_scale: 0.60, billboard: FIXED, brightness: [15, 15] }
                # 소림 — 손바닥이 천천히 펴진다 (여래신장). 거의 돌지 않는다
    독무_범람: { kind: 개화, model: 독무_고리, lifetime: 40, birth: 0, fade: 10,
                interpolation: 6, spin: 0.03, burst_scale: 1.0, billboard: FIXED, brightness: [4, 15] }
                # 당가 독 — 가장 오래 산다(40틱) · 가장 느리게 펴진다(보간 6) · **가장 어둡다**(밝기 4)
                # 다른 오의는 빛나고, 이것은 **빛나지 않는다** — 그것이 무형(無形)이다

  # ─── 참격선 배선 — 히트박스 모양 → 획 (【불변식 ㅂ】 모양은 판정이 정한다) ───
  slashes:
    호: 참격_호
    선: 참격_선
    돌: 참격_선                   # 보법의 잔영 — 지나온 자리에 남는 곧은 획 (뒤로 그린다)
    원: 참격_원
    진: 참격_원
    시: null                      # 투사체는 **제 몸이 궤적이다** (암기_투척·화살) — 획을 겹치면 거짓말
    태세: null                    # 몸에 머무는 것에는 획이 없다
    가드태세: null
    시전: null

  # ─── 격이 획에 스며든다 — 3D 사다리 (파티클 사다리와 같은 문법: 단조 증가) ───
  # 【외공기도 획을 그린다】 이것이 이번 정정의 핵심이다: 무공이 없어도, 격이 없어도,
  #   병기를 휘두르면 지나간 자리가 남는다. 격은 그 획을 **밝고 굵게** 만들 뿐이다.
  grade_ink:
    외공기: { thickness: 0.55, brightness: [0, 15],  hold: 0 }   # 빛나지 않는다 — 쇠가 지나간 자리
    발경:   { thickness: 0.75, brightness: [7, 15],  hold: 1 }   # 기가 몸 안에서 터진다 — 획이 살짝 밝다
    검기:   { thickness: 1.00, brightness: [15, 15], hold: 2 }   # 날에 서린 기가 그대로 그어진다
    강기:   { thickness: 1.35, brightness: [15, 15], hold: 3 }
    어검:   { thickness: 1.70, brightness: [15, 15], hold: 4 }
    심검:   { thickness: 2.10, brightness: [15, 15], hold: 5 }   # hold — 획이 공중에 머무는 틱 (무게)

  # ─── 날의 기 (지속) — 격을 두르면 병기에 서린다 ───
  # 【전의 규칙의 전제】 npc_combat 의 격_목격(검기 −2 · 강기 −5 · 어검 −8)은 "본다"를 전제한다.
  #   휘둘러야만 보이면 그 규칙은 거짓말이다. **검을 뽑아 기를 두르면 그 자리의 모두가 안다.**
  #   1인칭에서도 보인다 (손에 든 검 위에 겹쳐 뜨므로 제 눈에도 들어온다).
  sheaths:
    발경: { motion: 날의_기, scale: [0.45, 0.60, 0.60], brightness: [8, 15] }    # 손끝에 맺힌다 (날을 안 넘는다)
    검기: { motion: 날의_기, scale: [1.00, 1.00, 1.00], brightness: [15, 15] }   # 날에 서린 실선
    강기: { motion: 날의_기, scale: [1.35, 1.60, 1.60], brightness: [15, 15] }   # 날을 넘어 자란 빛
    어검: { motion: 날의_기, scale: [1.70, 2.00, 2.00], brightness: [15, 15] }
    심검: { motion: 날의_기, scale: [2.00, 2.40, 2.40], brightness: [15, 15] }
    호신강기: null                # 몸에 두른 것 — 그 자리는 고리다 (forms.호신강기)

  # ══════════════════════════════════════════════════════════════════
  #  계열의 손 — 획의 굵기·길이·시간 (【공속이 곧 리듬】)
  # ══════════════════════════════════════════════════════════════════
  # span_ratio  자세가 돌아오는 시간(프레임·계열 공속 중 긴 쪽)에 곱해 **획을 그리는 틱**을 낸다.
  #             단검(2.2/s = 9틱)의 획은 3틱에 끝나고, 부(0.9/s = 22틱)의 획은 18틱을 끈다.
  # reach       히트박스 사거리 대비 획의 길이 (**1.0 을 넘지 못한다** — 불변식 ㅂ)
  # thickness   속도가 곧 두께다 — 빠른 단검은 가늘고 날카롭게, 무거운 부는 굵고 느리게
  # tilt        획이 누운 각(도). 【MC 규약: pitch 양수 = 아래】 내려베는 것일수록 크다
  swings:
    검:     { span_ratio: 0.55, reach: 0.95, thickness: 1.00, tilt: 25 }   # 벤다 — 눕혀 긋는다
    도:     { span_ratio: 0.60, reach: 0.95, thickness: 1.25, tilt: 45 }   # 내려벤다 — 위에서 아래로
    창:     { span_ratio: 0.45, reach: 1.00, thickness: 0.70, tilt: 0 }    # 찌른다 — 가늘고 곧다
    봉:     { span_ratio: 0.65, reach: 0.90, thickness: 1.30, tilt: 10 }   # 후려친다 — 날이 없으니 굵다
    단검:   { span_ratio: 0.35, reach: 0.85, thickness: 0.55, tilt: 15 }   # 가늘고 날카롭다 (속검)
    암기:   { span_ratio: 0.30, reach: 0.50, thickness: 0.50, tilt: 0 }    # 손목의 획 — 짧다 (본체는 날아간다)
    활:     { span_ratio: 0.00, reach: 0.00, thickness: 0.00, tilt: 0 }    # 휘두르는 물건이 아니다
    권갑:   { span_ratio: 0.35, reach: 0.70, thickness: 0.80, tilt: 0 }    # 지른다 — 짧고 뭉툭하다
    맨손:   { span_ratio: 0.35, reach: 0.60, thickness: 0.70, tilt: 0 }    # 【맨손도 획을 그린다】 권풍
    겸:     { span_ratio: 0.55, reach: 0.95, thickness: 0.95, tilt: 20 }   # 걸어벤다 — 당기는 획
    월아산: { span_ratio: 0.80, reach: 1.00, thickness: 1.55, tilt: 55 }
    구:     { span_ratio: 0.60, reach: 0.95, thickness: 1.10, tilt: 50 }   # 찍는다
    중병기: { span_ratio: 0.90, reach: 0.95, thickness: 1.80, tilt: 60 }   # 짓뭉갠다 — 가장 굵다
    부:     { span_ratio: 0.85, reach: 1.00, thickness: 1.70, tilt: 70 }   # 찍어벤다 (0.9/s — 가장 느린 손)
    무관:   null                                                           # 보법·심법 — 벨 것이 없다
    짐승:   null                                                           # 발톱은 병기가 아니다

  # ══════════════════════════════════════════════════════════════════
  #  몸의 자세(體勢) — 되는 것만 한다. 그러나 **되는 것을 다 한다**
  # ══════════════════════════════════════════════════════════════════
  # 【조사 결과 — 안 되는 것】 바닐라 클라이언트에서 **플레이어의 팔다리 각도는 서버가 줄 수 없다.**
  #   애니메이션은 클라이언트가 돌리고, 리소스팩으로 플레이어 지오메트리를 바꿀 수 없다.
  #   "다리를 뒤로 보내고 허리를 쓰는" 골격 애니메이션은 **바닐라 프로토콜에 자리가 없다.**
  #   (플레이어를 감추고 커스텀 형체를 태우는 길은 자기 시점·손·판정이 전부 깨진다 — 하지 않는다.)
  #
  # 【되는 것 — 다섯】 그리고 이 다섯이면 체중이 실린다:
  #   ① 전진(lunge)   — setVelocity 로 몸을 민다. **창의 5m 는 몸이 나가야 5m 다** (음수 = 뺀다)
  #   ② 자세(pose)    — Entity.setPose(Pose, fixed) 로 몸통 각도를 바꾼다 (바닐라가 가진 자세만):
  #        SWIMMING    몸을 수평으로 눕힌다 → **찌르기·돌진**의 몸 (창·돌)
  #        SNEAKING    몸을 낮춘다 → 웅크려 들어올리고, 내려찍은 뒤 가라앉는다 (부·중병기·월아산·도)
  #        SPIN_ATTACK 몸을 회전시킨다 (트라이던트 급류) → **회전 베기** (원 궤적)
  #   ③ 몸의 회전(yaw·pitch) — **허리가 도는 축**. Player.setRotation 으로 몸을 틀고 젖힌다.
  #      여기가 "다리를 뒤로 보내고 몸을 쓴다"에 가장 가까운 축이다 (어깨가 뒤로 갔다 앞으로 나온다).
  #   ④ 팔의 휘두름(hand) — swingMainHand/swingOffHand. **서버가 줄 수 있는 유일한 사지 애니메이션**.
  #      권갑의 원-투(부→주)가 여기서 나온다. 암기의 사출도 이 손이 친다.
  #   ⑤ 정지(hitstop) — 프레임(선딜·후딜)이 이미 발을 묶는다 (SLOWNESS). 관성 뒤의 **멈춤**이 무게다.
  #
  # 【자세는 한 칸이 아니라 한 줄기다 — script】 예전엔 자세가 한 번 찍히고 끝났다 (그래서 몸이 뻣뻣했다).
  #   이제 획이 그려지는 동안 몸이 **beat 를 따라 흐른다**. at 은 스윙 시간(swingTicks)의 비율이다:
  #     at 0.0  사출/베기의 순간 (판정과 같은 틱 — 여기를 늦추면 "맞고 나서 검이 온다" = 거짓말)
  #     at 0.3~0.4  획이 끝을 향해 흐르는 중 (체중이 실린다)
  #     at 0.6~0.7  따라 나감(follow-through) · 또는 **다음 수를 벼르는 자세**
  #     at 1.0  **반드시 원점** (yaw 0 · pitch 0) — 몸이 돌아온다
  #   windup 은 **선딜이 있는 초식에만** 붙는다 (초식은 commit 에서 startup 틱을 기다린다).
  #   기본 타격(basic_strike)은 선딜을 기다리지 않고 즉발이므로 **windup 이 없다** —
  #   있는 척하면 "암기가 날아간 뒤에 몸이 뒤로 젖혀지는" 거짓말이 된다. 그래서 안 넣었다.
  #
  # 【회전의 규약】 · yaw + = 오른쪽으로 튼다 (어깨를 뒤로 빼는 쪽) · pitch + = 아래 (MC 규약)
  #   · **회전은 반드시 원점으로 돌아온다**(kick_recover). 매 beat 는 원점 기준의 목표각이고,
  #     엔진은 언제나 **차분(delta)만** 더한다 — 그 사이 플레이어가 마우스를 움직인 것은 보존된다.
  #     마지막 beat 가 (0,0) 이므로 **조준은 순증하지 않는다** (반동이지 조준 훼손이 아니다).
  #   · kick_max 를 넘는 각은 등록부가 적어도 엔진이 깎는다 (조작감이 등록부보다 높다).
  #   · yaw_kick_enabled: false 로 두면 **회전 축만 통째로 꺼진다** (전진·자세·팔은 그대로 돈다).
  #
  # 【안전 규칙 — 조작감을 해치는 것이 최악이다】
  #   · 공중·물속·기어가기 중에는 자세를 강제하지 않는다 (낙하·수영 자세와 싸우면 몸이 굳는다).
  #   · 전진은 지면에서만. 상한 max_lunge — 전투 중 미끄러지면 조준이 깨진다.
  #   · pose 강제는 max_pose_ticks 를 넘지 못한다. 길면 몸이 굳고, 굳으면 그것은 버그로 읽힌다.
  body:
    limits:
      max_lunge: 0.55             # 틱당 속도 상한 (블록) — 이 이상은 미끄러진다.
                                  # 돌진 초식(철산고 distance 4)의 몸이 이 상한을 정했다 —
                                  # 근접타(검 0.16)는 그 3분의 1도 안 쓴다. 상한은 돌진의 것이다
      max_pose_ticks: 8           # 자세 강제 상한 — 넘으면 몸이 굳는다
      require_ground: true        # 공중에서는 전진·자세 없음 (낙하와 싸우지 않는다)
      skip_when: [수영, 기어가기, 활강]   # 이 상태에서는 손대지 않는다 (바닐라 자세가 이긴다)
      # ★★ 【사용자 판정 · 2026-07-13】 **껐다.** "공격시 화면이 흔들려 **멀미가 발생**한다.
      #   화면 흔들림은 없애고 **앞뒤로 이동만 살려라**." — 이것이 때리는 쪽의 시야를 돌리던 손이다
      #   (맞는 쪽의 흔들림은 combat.yml impact.shake 이고, 그것도 껐다).
      #   아래 주석이 이미 예언하고 있었다: *"이 이상은 조준이 아니라 **멀미**다."* 12도도 멀미였다.
      #   ★ **전진(lunge)은 살아 있다** — 무게는 카메라가 아니라 **몸이 앞뒤로 가는 것**으로 말한다.
      #   되살리려면 enabled: true 하나면 된다 (수치는 그대로 남겨 둔다).
      yaw_kick_enabled: false     # 몸의 회전 축 — **껐다** (멀미). 조준은 반드시 원점으로 돌아온다(아래)
      kick_max: 12                # 원점에서 벗어날 수 있는 최대 각(도) — 이 이상은 조준이 아니라 멀미다
      kick_recover: true          # **불변식**: 마지막 beat 는 (0,0). 회전은 순증하지 않는다
    # by_class — 계열의 몸. lunge/pose/pose_ticks 는 script 가 없을 때의 대비책(fallback)이고,
    #            **script 가 있으면 script 가 몸이다.** beat: { at, lunge, pose, yaw, pitch, hand }
    #            hand: 주(main) · 부(off) — 팔이 실제로 휘둘러진다 (관중도 보고 제 손도 본다)
    #
    # ★★ 【2026-07-13 · 전진(lunge)을 반으로 깎았다 — 사용자 지시】
    #   사용자: *"앞으로 짧게 나가는 느낌"* 을 싫어한다. 그러나 *"앞뒤로 이동만 살림"* 이라고도 했다.
    #   그래서 **없애지 않고 절반으로 깎고, 되돌아오는 beat 를 붙였다.**
    #   근거(수치): lunge 는 틱당 속도(블록)다. 지면 마찰(≈0.6/틱)이 먹으면 총 이동 ≈ 2.5 × lunge.
    #     · 옛 검 0.16 ⇒ **0.40m** — 한 발 들어가는 거리다. 이것이 사람 눈에 **찌르기**로 읽혔다.
    #     · 새 검 0.07 ⇒ **0.18m** — 발이 아니라 **체중이 앞으로 실리는** 거리다.
    #   그리고 follow-through 에 **음수 lunge** 를 붙였다 ⇒ 순 변위 ≈ 0.
    #   몸이 **앞으로 갔다 뒤로 온다** — 그것이 사용자가 청구한 "앞뒤로 이동"이다.
    #   ★ 계열의 사다리는 그대로다 (단검 0.05 < 검 0.07 < … < 부 0.15 — 무거운 손이 여전히 더 나간다).
    #   ★ 창(0.42)·암기(0.18)는 **안 깎았다** — 그들은 원래 찌르고 던진다 (slash_eye 가 면제한다).
    by_class:
      # 검 — 벤다. 발은 거의 안 나가고 **획이 크게 돈다** (몸의 회전축은 꺼져 있다 — 멀미)
      검:
        lunge: 0.07
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.04, yaw: 9, pitch: -3 }
        script:
          - { at: 0.00, yaw: 6, pitch: -2 }                          # 어깨가 뒤에 있다
          - { at: 0.30, yaw: -7, pitch: 4, lunge: 0.07, hand: 주 }   # 체중이 실리며 벤다
          - { at: 0.65, yaw: -3, pitch: 1, lunge: -0.03 }            # **되돌아온다** (앞뒤로 흔들린다)
          - { at: 1.00 }                                             # 돌아온다
      # 도 — 내려벤다. **체중이 위에서 아래로** 떨어지고, 끝에 몸이 가라앉는다
      도:
        lunge: 0.09
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.05, yaw: 6, pitch: -8 }
        script:
          - { at: 0.00, yaw: 5, pitch: -6 }                          # 치켜든다
          - { at: 0.30, yaw: -3, pitch: 10, lunge: 0.09, hand: 주 }  # 내리친다
          - { at: 0.60, yaw: -1, pitch: 6, lunge: -0.03, pose: SNEAKING }   # 가라앉으며 **되돌아온다**
          - { at: 1.00 }
      # 창 — 찌른다. **몸이 나간다** (전진이 곧 사거리다). SWIMMING = 몸을 수평으로 던진 자세
      창:
        lunge: 0.42
        pose: SWIMMING
        pose_ticks: 5
        windup: { lunge: -0.06, pitch: -3, yaw: 3 }
        script:
          - { at: 0.00, pose: SWIMMING, lunge: 0.42, pitch: 2, hand: 주 }   # 몸을 던져 꿴다
          - { at: 0.45, pitch: -2 }                                   # 창을 거둔다 (상체가 선다)
          - { at: 1.00 }
      # 봉 — 후려친다. 날이 없으니 **크게 돈다** (가장 넓은 횡전 21도)
      봉:
        lunge: 0.08
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.04, yaw: 11, pitch: -2 }
        script:
          - { at: 0.00, yaw: 10, pitch: -3 }
          - { at: 0.35, yaw: -11, pitch: 4, lunge: 0.08, hand: 주 }   # 몸통째 후려친다
          - { at: 0.70, yaw: -6, pitch: 1, lunge: -0.03 }             # 되돌아온다
          - { at: 1.00 }
      # 단검 — 속검. 몸을 거의 안 쓴다(그것이 속검이다). 대신 **두 손이 두 번 번쩍인다**
      단검:
        lunge: 0.05
        pose: 없음
        pose_ticks: 0
        windup: { yaw: 4, pitch: -2 }
        script:
          - { at: 0.00, yaw: 4, pitch: 2, lunge: 0.05, hand: 주 }     # 긋는다 (속검 — 발이 거의 안 나간다)
          - { at: 0.30, yaw: -5, pitch: -2, hand: 부 }                # 되받아 긋는다 (왼손)
          - { at: 0.55, yaw: 2, pitch: 1, lunge: -0.02 }              # 되돌아온다
          - { at: 1.00 }
      # ★ 암기 — **던진다**. 여기가 사용자가 이름을 대어 청구한 자리다.
      #   손목이 아니라 **몸이 던진다**: 어깨가 앞으로 나가고(yaw −), 상체가 채찍처럼 꺾이고(pitch +11),
      #   체중이 앞으로 실린다(lunge 0.18 — 예전 0.05 의 세 배 반). 그리고 **따라 나간 뒤 다시 벼른다**:
      #   0.60 에서 몸이 뒤로 젖혀지며(pitch −7) 어깨가 뒤로 돌아간다(yaw +9) — 다음 암기를 뽑아 쥐는 자세다.
      #   연속으로 던지면 이 끝자세가 곧 다음 던짐의 **예비 동작**이 된다 (거짓말 없이 얻은 windup).
      암기:
        lunge: 0.18
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.08, yaw: 10, pitch: -11 }                 # 초식에서만: 몸을 빼고 팔을 뒤로 젖힌다
        script:
          - { at: 0.00, yaw: -6, pitch: 11, lunge: 0.18, hand: 주 }   # **사출** — 상체가 앞으로 꺾인다
          - { at: 0.30, yaw: -3, pitch: 5 }                           # 팔이 따라 나간다 (follow-through)
          - { at: 0.60, yaw: 9, pitch: -7, lunge: -0.05 }             # **다시 벼른다** — 뒤로 젖히며 뽑는다
          - { at: 1.00 }
      # 활 — 몸을 주지 않는다. 바닐라가 이미 시위를 당기는 자세를 그린다 (겹치면 그것이 거짓말이다)
      활:
        lunge: 0.00
        pose: 없음
        pose_ticks: 0
        script: null
      # 권갑 — 다리→허리→어깨의 사슬. **원-투**: 왼손 잽(부) 뒤에 오른손 크로스(주)가 허리를 끌고 나온다
      권갑:
        lunge: 0.10
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.03, yaw: 5, pitch: -1 }
        script:
          - { at: 0.00, yaw: 3, pitch: 1, lunge: 0.03, hand: 부 }     # 잽 — 앞손이 먼저 간다
          - { at: 0.35, yaw: -8, pitch: 2, lunge: 0.08, hand: 주 }    # 크로스 — 허리가 돌며 지른다
          - { at: 0.65, yaw: -3, lunge: -0.03 }                       # 되돌아온다 (가드로 돌아간다)
          - { at: 1.00 }
      # 맨손 — 권풍. 권갑과 같은 사슬이나 얕다 (실린 것이 없다)
      맨손:
        lunge: 0.10
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.03, yaw: 4 }
        script:
          - { at: 0.00, yaw: 3, hand: 부 }
          - { at: 0.35, yaw: -7, pitch: 2, lunge: 0.09, hand: 주 }
          - { at: 0.70, yaw: -2, lunge: -0.03 }                       # 되돌아온다
          - { at: 1.00 }
      # 겸 — **건다, 그리고 당긴다**. 예전엔 음수 전진 하나였다 (그래서 그냥 뒤로 미끄러졌다).
      #   이제 순서가 있다: 한 발 들어가 걸고(0.06) → **몸이 빠지며 끌어온다**(−0.10)
      겸:
        lunge: -0.10
        pose: 없음
        pose_ticks: 0
        windup: { lunge: 0.06, yaw: -6 }
        script:
          - { at: 0.00, yaw: -8, pitch: 3, lunge: 0.06, hand: 주 }    # 안으로 넣어 **건다**
          - { at: 0.35, yaw: 9, pitch: -2, lunge: -0.10 }             # **당긴다** — 몸이 뒤로 빠진다
          - { at: 0.70, yaw: 4 }
          - { at: 1.00 }
      # 월아산 — 크게 들었다 내린다. 웅크림(SNEAKING)이 **예비**고, 낙차(pitch 18도)가 **본편**이다
      월아산:
        lunge: 0.12
        pose: SNEAKING
        pose_ticks: 4
        windup: { lunge: -0.05, yaw: 8, pitch: -9, pose: SNEAKING }
        script:
          - { at: 0.00, yaw: 7, pitch: -7, pose: SNEAKING }           # 웅크려 **든다**
          - { at: 0.35, yaw: -6, pitch: 11, lunge: 0.12, pose: 없음, hand: 주 }   # 일어서며 **내린다**
          - { at: 0.70, yaw: -2, pitch: 5, lunge: -0.04 }             # 되돌아온다
          - { at: 1.00 }
      # 구 — 찍고 **끈다** (갈고리다). 찍은 뒤 몸이 뒤로 빠지며 건 것을 끌어온다
      구:
        lunge: 0.11
        pose: 없음
        pose_ticks: 0
        windup: { lunge: -0.04, yaw: 5, pitch: -8 }
        script:
          - { at: 0.00, yaw: 4, pitch: -6 }
          - { at: 0.35, yaw: -4, pitch: 10, lunge: 0.11, hand: 주 }   # 찍는다
          - { at: 0.65, yaw: -2, pitch: 4, lunge: -0.06 }             # **끈다** (걸린 것을 당긴다)
          - { at: 1.00 }
      # 중병기 — 짓뭉갠다. 웅크렸다(SNEAKING) 위에서 아래로 20도를 떨군 뒤 **다시 가라앉는다**
      중병기:
        lunge: 0.14
        pose: SNEAKING
        pose_ticks: 6
        windup: { lunge: -0.06, yaw: 9, pitch: -10, pose: SNEAKING }
        script:
          - { at: 0.00, yaw: 8, pitch: -8, pose: SNEAKING }
          - { at: 0.40, yaw: -7, pitch: 12, lunge: 0.14, pose: 없음, hand: 주 }
          - { at: 0.70, yaw: -3, pitch: 6, lunge: -0.05, pose: SNEAKING }   # 짓눌러 가라앉으며 되돌아온다
          - { at: 1.00 }
      # 부 — 가장 무거운 손 (0.9/s). 가장 크게 들고(pitch −10) **가장 크게 떨군다**(pitch +12, 22도)
      부:
        lunge: 0.15
        pose: SNEAKING
        pose_ticks: 6
        windup: { lunge: -0.07, yaw: 10, pitch: -12, pose: SNEAKING }
        script:
          - { at: 0.00, yaw: 9, pitch: -10, pose: SNEAKING }          # 머리 위로 든다
          - { at: 0.40, yaw: -8, pitch: 12, lunge: 0.15, pose: 없음, hand: 주 }   # 찍어벤다 (가장 무거운 손)
          - { at: 0.70, yaw: -3, pitch: 7, lunge: -0.05, pose: SNEAKING }   # 도끼를 뽑으며 되돌아온다
          - { at: 1.00 }
      무관:   null
      짐승:   null
    # by_trail — **몸을 통째로 던지는 궤적만** 계열을 이긴다 (돌진은 어떤 병기를 들었든 몸을 던지는 것이다).
    #   ★ '시'(던지고 쏨)는 **여기서 뺐다.** 예전엔 시가 계열을 이겨서 **암기의 몸이 영영 안 나왔다** —
    #     암기의 던짐도, 활의 정지도 전부 시의 밋밋한 한 줄(lunge 0.05)에 먹혔다.
    #     던지는 몸은 계열이 안다: **암기는 던지고 활은 선다.** 그래서 시는 계열에게 돌려줬다.
    by_trail:
      돌:                                                  # 돌진 — 몸을 앞으로 던진다 (철산고·보법)
        lunge: 0.55
        pose: SWIMMING
        pose_ticks: 6
        script:
          - { at: 0.00, pose: SWIMMING, lunge: 0.55, pitch: 3, hand: 주 }
          - { at: 0.50, pitch: -2 }                        # 부딪히고 상체가 선다
          - { at: 1.00 }
      원:                                                  # 회전 베기 — 몸이 **돈다** (매화만개·태극혜검)
        lunge: 0.10
        pose: SPIN_ATTACK
        pose_ticks: 5
        script:
          - { at: 0.00, pose: SPIN_ATTACK, yaw: -10, lunge: 0.10, hand: 주 }
          - { at: 0.35, yaw: 10, hand: 부 }                # 한 바퀴 — 좌우로 크게 쓸며 돈다
          - { at: 0.70, yaw: -4 }
          - { at: 1.00 }

  # ─── 암기 투척 — 던진 물건은 **실제로 날아간다** (복제가 아니다) ───
  throw:
    motion: 암기_투척
    classes: [암기]               # 이 계열의 '시' 궤적만 물건이 난다 (활은 바닐라 화살이 이미 3D 다)
    spin_axis: X                  # 비수는 제 길이축을 돌며 난다

  # ─── 두 층의 조율 — 참격선이 뜨면 파티클 궤적은 물러선다 (0 은 아니다) ───
  blend:
    trail_particle_ratio: 0.35    # 3D 획이 떴으면 궤적 파티클은 35% 만
    trail_particle_min: 1         # 그래도 0 은 아니다 — 획이 지나간 자리는 언제나 남는다
    keep_impact: true             # 타격 파티클은 깎지 않는다 (격의 사다리는 타격에서 읽힌다)

  # ─── 배선 (형태·오의) ───
  bind:
    forms:
      검기_두름: null             # 두름 = 손끝 잔광 + **날의 기**(sheaths) — 고리가 아니다
      검강_두름: null
      검기_참격: 검기_투사
      강기_포:   강기_투사
      호신강기:  호신_고리
      이기어검:  어검_비행
    ultimates:
      maehwa_mangae:  매화_개화
      taegeuk_hyegeom: 태극_대기
      jewang_gunrim:  군림_강림
      hyeolhae_malli: 혈해_범람
      # ── 15문파 전승 오의 17종 — 원은 펴지고, 선은 앞에 선다 ──
      isipsasu_maehwa:       매화_개화     # 화산의 오의는 매화다 (문파의 지문 — 형체를 나눠 쓴다)
      jaha_nanhwa:           매화_개화
      changgung_muae:        검풍_개화
      seomjeon_sipsam:       뇌격_강림
      manchon_nakhwa:        독무_범람     # 당가의 원 = 하늘을 덮는 재
      muhyeong_jidok:        독무_범람     # 응집은 없다. 형체는 **터진 뒤에만** 뜬다
      oho_danmun_do:         뇌격_강림
      honwon_byeokryeok_do:  검풍_개화
      baekbo_singwon:        뇌격_강림
      yeorae_sinjang:        장심_개화
      hangryong_sippalchang: 뇌격_강림
      unryong_daepalsik:     검풍_개화
      taeheo_doryong:        뇌격_강림
      cheonha_36geom:        검풍_개화
      sail_geom:             뇌격_강림
      cheongwol_geom:        뇌격_강림
      namhae_36geom:         검풍_개화

# ══════════════════════════════════════════════════════════════════════
#  기본 초식(基本) — 【무공이 없어도 병기는 궤적을 그린다】
# ══════════════════════════════════════════════════════════════════════
# 사용자 보고: "공격 모션은 아직 안 바뀐 거 같고" — 원인은 3D 층이 **무공 시전 경로 안에만** 있었던 것이다.
# 무공을 안 배운 채(또는 배운 무공의 계열이 아닌 병기로) 좌클릭하면 아무 일도 일어나지 않았다.
# 그것이 **가장 흔한 경로**다 (연무장에서 크리에이티브로 칼을 들고 치는 사람).
#
# 【정본】 무공은 궤적을 **바꾸는 것**이지, 무공이 없다고 궤적이 **없는** 것이 아니다.
#   그래서 여기에 '무공 없는 손'의 히트박스·프레임을 등록한다. 코드는 이것을 읽는다 (하드코딩 금지).
#   이 값은 지금 **연출 전용**이다 — 판정은 바닐라 피해가 그대로 낸다 (외공기).
#   훗날 이 값이 판정으로 승격되면 같은 등록부를 읽게 된다 (그때 이 주석을 지워라).
basic_strike:
  cooldown_ticks: 4               # 연출 최소 간격 — 바닐라 연타에 획이 겹쳐 쌓이지 않게
  by_class:
    검:     { trail: 호, range: 3.0, angle: 100, frames: [2, 2, 4] }
    도:     { trail: 호, range: 3.0, angle: 110, frames: [3, 2, 5] }
    창:     { trail: 선, range: 5.0, angle: 30,  frames: [4, 2, 6] }   # angle 칸 = 선의 폭
    봉:     { trail: 호, range: 4.0, angle: 120, frames: [3, 2, 5] }
    단검:   { trail: 호, range: 2.5, angle: 80,  frames: [1, 1, 3] }
    겸:     { trail: 호, range: 3.0, angle: 100, frames: [3, 2, 5] }
    부:     { trail: 호, range: 3.0, angle: 90,  frames: [6, 3, 10] }
    월아산: { trail: 호, range: 3.5, angle: 120, frames: [5, 3, 9] }
    구:     { trail: 호, range: 3.0, angle: 90,  frames: [4, 2, 7] }
    중병기: { trail: 호, range: 3.5, angle: 130, frames: [7, 3, 11] }
    권갑:   { trail: 호, range: 2.5, angle: 90,  frames: [1, 1, 3] }
    맨손:   { trail: 호, range: 2.5, angle: 90,  frames: [1, 1, 3] }
    암기:   { trail: 시, range: 16.0, angle: 1,  frames: [2, 1, 4] }   # 던진다 (ranged.암기 사거리 16)
    활:     null                  # 바닐라 활이 제 일을 한다 — 우리가 얹을 것이 없다
    무관:   null
    짐승:   null

# ══════════════════════════════════════════════════════════════════════
#  판정의 눈(判定の眼) — 【디버그】 보이는 것이 정말 맞는 것인가
# ══════════════════════════════════════════════════════════════════════
# 【왜 있는가】 이 프로젝트의 규칙은 **"보이는 것 = 맞는 것"** 이다. 그런데 그것을 **확인할 방법이
#   없었다.** 성능은 Metrics 가 재고, 등록부는 감사가 재는데, **판정만은 아무도 못 봤다** —
#   히트박스가 정말 그 각도인지, 2d6 이 무엇을 굴렸는지, 피해가 어느 층에서 깎였는지.
#   오늘 이 프로젝트에서 눈이 스무 번 넘게 거짓말했다. **눈을 시험할 눈이 필요하다.**
#
# 【정직의 못】 이 눈은 히트박스를 **다시 그리지 않는다.** 판정이 쓰는 그 함수(inArc·inLine·inCircle)에
#   점을 물어본다 — "이 자리는 맞는 자리인가?" **그리는 코드와 맞히는 코드가 하나여야** 그림이
#   판정에 대해 거짓말할 수 없다. (감사가 이 사실을 지킨다: 눈이 제 기하학을 따로 갖는 순간 위반이다.)
#
# 【켠 사람에게만 보인다】 파티클은 시전자 한 명에게만 간다 (관중의 화면을 더럽히지 않는다).
#   꺼져 있으면 **비용이 0 이다** (판정 경로에 if 한 줄).
eye:
  hitbox:
    particle: happy_villager     # 맞는 자리 — 판정 함수가 "그렇다"고 답한 점만 찍힌다
    step: 0.6                    # 표본 간격(m) — 촘촘할수록 정확하지만 비싸다
    height: 0.3                  # 발치에서 띄우는 높이 (지면에 묻히지 않게)
    max_points: 140              # 【예산】 한 번의 판정에 찍는 점의 상한 — 눈이 서버를 죽이면 안 된다
  targets:
    particle: crit               # 실제로 목록에 오른 몸 — 히트박스가 고른 자 (그 머리 위에 찍는다)
  log: true                      # 판정의 산수를 채팅으로 (2d6 · 실행력 내역 · 저항 · 피해가 깎인 층)
