# ══════════════════════════════════════════════════════════════════════
#  오의의 화려함(絢) — 【1차 MVP의 다른 한 끝】 사용자 지시 2026-07
# ══════════════════════════════════════════════════════════════════════
# 사용자의 문장 그대로: *"어검·필살기 = 다층 궤적 + 운무 + 청백색 폭발감."*
#   그리고 못: *"형광 네온·보라/핑크 위주의 서양 판타지 느낌 금지. 반드시 먹선+청록+옥색+백색 안에서만."*
#
# 【세 겹 — 각각이 사용자가 이름을 댄 것이다】
#   bloom   개시의 **청백색 폭발감** — 개시 틱에 burst 위로 겹친다.
#           예산: burst 40 + 강조 1 + bloom 7 = 48 = ultimate_per_tick_max (**정확히 상한**)
#   layers  **다층 궤적** — 개시 다음 틱부터 arcs 개의 호가 차례로 벌어진다 (반월형 궤적의 겹).
#           한 겹 = points 점 × per_point 개 ⇒ 8 × 1 = 8/틱
#   mist    **운무(雲霧)** — 구름·기류·물결. 개화가 사는 동안 몸 둘레에 낮게 깔린다. 4/틱
#   hit     맞은 몸에서 터지는 옥·청백 (오의의 타격 — 격의 burst 와 같은 문법, 더 크다)
#   ⇒ 개시 뒤 한 틱 최대 = layers 8 + mist 4 + (hit 은 대상 쪽) = 12 ≤ 48 ✓
#
# 【등록의 구조】 default 한 줄이 21종을 덮고, by_id 가 **정체를 가진 것만** 덮어쓴다.
#   문파마다 색을 나누는 것(문파별 색 분화)은 **2차**다 — 지금 나누면 21줄이 되고, 21줄은 유지되지 않는다.
ultimate_flourish:
  default:
    bloom:  { particle: dust, ink: 청백, count: 7, spread: 0.30, extra: 0.18 }
    layers: { particle: dust, ink: 옥, arcs: 3, points: 8, per_point: 1, spread: 0.10, extra: 0.02, radius_ratio: 0.55 }
    mist:   { particle: cloud, count: 4, spread: 0.70, extra: 0.01, ticks: 6, height: 0.4 }
    hit:    { particle: dust, ink: 청백, count: 6, spread: 0.35, extra: 0.14 }

  by_id:
    # 【채색 예외 — 예외가 곧 정보다】 혈교의 오의는 청백이 아니다. 붉다
    hyeolhae_malli:
      bloom:  { particle: dust, ink: 혈, count: 7, spread: 0.30, extra: 0.18 }
      layers: { particle: dust, ink: 혈, arcs: 3, points: 8, per_point: 1, spread: 0.10, extra: 0.02, radius_ratio: 0.55 }
      mist:   { particle: crimson_spore, count: 4, spread: 0.70, extra: 0.01, ticks: 6, height: 0.4 }
      hit:    { particle: dust, ink: 혈, count: 6, spread: 0.35, extra: 0.14 }

    # 【전 오의 유일 — 예고도 화려함도 없다】 무형지독은 **빛나지 않는다** (독무_범람의 밝기 4 와 같은 뜻).
    #   화려함을 0 으로 등록하는 것도 **등록**이다 — 코드가 "이건 빼자"고 결정하는 것이 아니다.
    muhyeong_jidok:
      bloom:  { particle: null, count: 0 }
      layers: { particle: null, arcs: 0, points: 0, per_point: 0 }
      mist:   { particle: ash, count: 4, spread: 0.90, extra: 0.01, ticks: 10, height: 0.2 }   # 재만 퍼진다
      hit:    { particle: ash, count: 6, spread: 0.35, extra: 0.04 }

    # 당가의 원 = 하늘을 덮는 재 — 폭발이 아니라 **퍼짐**이다 (청백 폭발은 여기 안 어울린다)
    manchon_nakhwa:
      bloom:  { particle: ash, count: 7, spread: 0.40, extra: 0.06 }
      layers: { particle: dust, ink: 옥, arcs: 2, points: 8, per_point: 1, spread: 0.10, extra: 0.02, radius_ratio: 0.70 }
      mist:   { particle: ash, count: 4, spread: 0.80, extra: 0.01, ticks: 8, height: 0.3 }
      hit:    { particle: ash, count: 6, spread: 0.35, extra: 0.06 }

# ══════════════════════════════════════════════════════════════════════
#  사건(事件) — 격 밖의 읽힘. 무기 파괴·격돌·패링·고갈
# ══════════════════════════════════════════════════════════════════════
# 이 다섯은 격이 아니지만 **판단의 재료**다. 상대가 보고 결정을 바꿀 수 있어야 한다:
#   "저 자의 검에 금이 갔다" → 한 합 더 밀어붙인다
#   "저 자의 기가 흩어졌다" → 지금 들어간다
events:
  헛손질:
    particle: cloud
    count: 3
    spread: 0.10
    extra: 0.01
    sounds: [{ key: "entity.player.attack.sweep", volume: 0.5, pitch: 1.3 }]

  다운캐스트:                     # 내력이 모자라 맨 기술로 떨어졌다 — 【빈약함이 곧 정보다】
    particle: smoke
    count: 4
    spread: 0.10
    extra: 0.01
    sounds: [{ key: "block.fire.extinguish", volume: 0.5, pitch: 1.6 }]

  격_소산:                        # 두름 유지비를 못 냈다 / 태세를 거뒀다
    particle: smoke
    count: 5
    spread: 0.12
    extra: 0.01
    sounds: [{ key: "block.fire.extinguish", volume: 0.5, pitch: 1.6 }]

  발출_불발:                      # 쏠 것이 없다 (발출엔 다운캐스트가 없다)
    particle: smoke
    count: 4
    spread: 0.10
    extra: 0.01
    sounds: [{ key: "entity.player.attack.nodamage", volume: 0.6, pitch: 0.7 }]

  호신강기_무효:                  # 하위·동격을 튕겨 냈다 (상쇄 소모는 냈다 — 공짜가 아니다)
    particle: end_rod
    count: 10
    spread: 0.35
    extra: 0.03
    sounds: [{ key: "block.conduit.deactivate", volume: 0.8, pitch: 1.6 }]

  호신강기_관통:                  # 상위 격이 강기를 갈랐다
    particle: end_rod
    count: 16
    spread: 0.35
    extra: 0.03
    sounds: [{ key: "block.anvil.land", volume: 0.8, pitch: 0.7 }]

  호신강기_붕괴:                  # 상쇄할 내력이 없다 — 다음 타격은 맨몸으로 받는다
    particle: smoke
    count: 8
    spread: 0.20
    extra: 0.02
    sounds: [{ key: "block.glass.break", volume: 0.7, pitch: 0.8 }]

  무기_균열:                      # 격돌 누적 (breaks_at 3합) — "날에 금이 간다"
    particle: crit
    count: 8
    spread: 0.20
    extra: 0.05
    sounds: [{ key: "block.anvil.land", volume: 0.5, pitch: 1.9 }]

  무기_파괴:                      # 3합째 — 그 뒤는 맨손이다
    particle: item                # 아이템 데이터 필요 (부러진 병기 그 자체가 파편이 된다)
    count: 20
    spread: 0.30
    extra: 0.08
    sounds: [{ key: "entity.item.break", volume: 1.0, pitch: 0.8 },
             { key: "block.anvil.destroy", volume: 0.6, pitch: 1.4 }]

  무기_절단:                      # 2격 초과 — 한 합에 잘린다 (범철 vs 검강)
    particle: item
    count: 24
    spread: 0.35
    extra: 0.10
    sounds: [{ key: "entity.item.break", volume: 1.0, pitch: 0.6 },
             { key: "block.anvil.destroy", volume: 0.8, pitch: 1.0 }]

  자기_손상:                      # 제 격을 못 견디는 쇠 — "검이 운다" (self_damage_every 3)
    particle: crit
    count: 6
    spread: 0.12
    extra: 0.02
    sounds: [{ key: "block.anvil.land", volume: 0.4, pitch: 1.9 }]

  패링_성공:                      # 태극권·정심검결의 창 (defense_states.패링)
    particle: sweep_attack
    count: 1
    spread: 0.0
    extra: 0.0
    sounds: [{ key: "item.shield.block", volume: 0.9, pitch: 1.4 },
             { key: "block.amethyst_block.chime", volume: 0.7, pitch: 1.8 }]

  반격_오의:                      # 태극혜검 — 받은 것을 그대로 돌려준다
    particle: end_rod
    count: 20
    spread: 0.40
    extra: 0.05
    sounds: [{ key: "item.trident.return", volume: 1.0, pitch: 1.2 }]

  대성공:                         # 급소 (judgment critical_success) — 격과 무관하게 타격 위에 겹쳐 붙는다
    particle: crit
    count: 4                      # 심검 타격(24) + 강조(1) + 이것(4) = 29 ≤ per_point_tick_max 30
    spread: 0.30
    extra: 0.20
    sounds: [{ key: "entity.player.attack.crit", volume: 0.9, pitch: 1.0 }]

  흐름_충전:                      # 발동권을 얻었다 — 오의가 열린다 (읽어낸 순간)
    particle: end_rod
    count: 12
    spread: 0.40
    extra: 0.02
    sounds: [{ key: "block.beacon.power_select", volume: 0.9, pitch: 1.6 }]

  운기조식:                       # /혼천 운기 — 앉아서 한 구간
    particle: end_rod
    count: 8
    spread: 0.30
    extra: 0.01
    sounds: [{ key: "block.beacon.ambient", volume: 0.6, pitch: 1.2 }]

  흡성:                           # 마공 — 남의 것을 빼앗는다 (혈수마공 on_hit · 혈해만리)
    particle: crimson_spore
    count: 12
    spread: 0.40
    extra: 0.02
    sounds: [{ key: "entity.generic.drink", volume: 0.7, pitch: 0.6 }]

# ══════════════════════════════════════════════════════════════════════
#  3D 모션 (디스플레이 엔티티) — 파티클 위에 얹는 층
# ══════════════════════════════════════════════════════════════════════
# 【세 층 + 몸】 사용자의 정정(2026-07)을 그대로 새긴다:
#
#   ① 손의 병기   — 팩이 구운 3D 모델. 바닐라가 그린다. **우리는 손대지 않는다** (복제 금지)
#   ② 날의 기     — 격을 두르면 **손에 든 병기에 겹쳐** 기가 서린다 (지속 — 태세만 잡아도 남이 안다)
#   ③ 참격선(斬擊線) — 휘두르면 **지나간 자리**가 남는다. 만화의 검격이다. **검을 그리지 않는다**
#   ④ 몸의 자세   — 전진·pose 로 체중을 싣는다 (팔다리 각도는 서버가 못 준다 — §body 참조)
#
# 【버린 설계 — 왜 버렸는지 남긴다】 병기 ItemStack 을 실은 디스플레이를 궤적에 태우는 방식은
#   팩 게이트가 저절로 충족되는 이점이 있었으나, 화면에서 **검이 하나 더 복제되어 허공을 나는 것**으로
#   보였다. 보이는 결과가 틀렸으면 이점은 의미가 없다. 참격선은 **획 모델**이 그린다.
#   (use_held 는 남겨 뒀다 — 던진 암기와 손을 떠난 어검, 즉 **정말로 날아가는 물건**의 몫이다.)
#
# ─── 불변식 (파티클 층의 4개에 둘이 붙는다) ───
#   ㅁ. 【디스플레이는 덧칠이다】 이 층이 통째로 실패해도(팩 없음·예산 초과·미등록) 파티클 층은
#      그대로 돈다. require-resource-pack=false 는 여기서도 불가침이다 — 3D 는 특권이 아니라 사치다.
#   ㅂ. 【획은 히트박스를 벗어나지 못한다】 range·angle 은 판정이 준다. 등록부는 reach(≤1.0)로
#      **줄일 수만** 있다. 히트박스 3.5m 에 6m 획을 그릴 방법이 이 구조엔 없다.
#
# ─── 팩 유무의 분기 ───
#   팩 수락 → base 아이템에 item_model(key)을 얹는다 → 팩이 구운 3D 형체
#   팩 거절 → fallback 바닐라 아이템. **fallback 이 null 이면 아무것도 띄우지 않는다**
#            (그 자리는 파티클 층이 지킨다 — 참격선·날의 기가 그렇다: 억지 폴백이 더 나쁘다)
#   use_held → 시전자의 아이템 그 자체 (팩 유무와 무관 · 던진 물건에만)
display:

  # ─── 예산 (performance.yml vfx_entities) ───
  # 【근거】 20인 군집(load_test.combat_cluster_size)이 쉬지 않고 치는 정상 상태:
  #   · 참격선 — 20인 × 1개 (수명 ≈ 10틱 / 스윙 간격 ≥ 9틱)          ⇒ 동시 ≈ 20
  #   · 날의 기 — 20인 × 1개 (지속 — 격을 두른 동안 계속)            ⇒ 동시 ≈ 20
  #   · 발출·투척 — 20인 × 1개 (수명 ≈ 14틱 / 쿨 40틱)               ⇒ 동시 ≈ 7
  #   · 오의 — 예약분 16
  #   합 63 ≤ 강등선 100 ≤ 전역 120.  호신강기 고리(4장/인)에 남는 여유 = 100 − 47 = 53 ⇒ 13인분
  #   ※ 한 사람은 **공격 태세(날의 기)이거나 방어 태세(고리)이지 둘 다일 수 없다** (armed 는 하나다)
  #     — 그래서 최악치가 겹치지 않는다. 20인 전원 호신강기(80장)면 고리가 먼저 강등된다.
  budget:
    global_cap: 120               # = performance.yml vfx_entities.global_cap (audit ⑧이 대조)
    max_lifetime_ticks: 60        # = performance.yml vfx_entities.max_lifetime_ticks
    degrade_at: 100               # 살아 있는 형체가 이 수를 넘으면 새 요청 거절 → 파티클로 강등
    reserve_for_ultimate: 16      # 오의 몫 — 잡졸의 참격이 오의의 자리를 먹지 못한다
    per_cast_max: 4
    per_player_max: 8             # 한 몸: 고리 4 + 참격선 1 + 날의 기 1 + 투척 1 + 여유 1
    view_range: 0.5               # 0.5 × 64m = 32m (파티클 cull_beyond 와 같은 눈금)
    heartbeat_ticks: 12           # 지속 형체(날의 기·고리)의 심장박동 — 갱신이 끊기면 스스로 사라진다
    slash_min_ticks: 3            # 참격선은 이보다 짧을 수 없다 (3틱 미만은 보간이 못 따라간다)
    slash_max_ticks: 18           # 이보다 길 수도 없다 (부·중병기의 무게도 여기서 끊긴다)

  # ══════════════════════════════════════════════════════════════════
  #  ★ 획이 서는 자리 (原點) — **팔이 지나가는 자리에 세운다**
  # ══════════════════════════════════════════════════════════════════
  # 【2026-07 — 획이 몸 안에서 나오던 병】 참격선의 원점은 **시전자의 눈**이었다
  #   (SkillDisplay: eyeLocation − 0.25 · 앞으로 미는 값이 **없었다**). 그래서:
  #     · 3인칭 — 획이 얼굴·가슴을 **관통**한다 (몸 안에서 나오는 느낌)
  #     · 1인칭 — 카메라가 획의 **안쪽**에 있다 ⇒ **제 검의 궤적을 제 눈이 못 본다**
  #   사용자가 인게임에서 본 것이 그것이다. 그래서 자리를 **등록부로 끌어올린다** — 코드가 지어내지 않는다.
  #
  # 【세 칸】 시전자의 발을 원점으로, 몸을 기준으로 잰다:
  #   forward  시선(수평)으로 **앞으로 미는 거리** (m) — 몸을 안 뚫고 나오게. 1인칭의 값이 여기 있다
  #   height   **발바닥에서 잰 절대 높이** (m) — 눈(1.62)이 아니라 **어깨/가슴**이 팔이 지나가는 자리다
  #   lateral  **오른쪽으로** 미는 거리 (m) — 바닐라 플레이어는 오른손잡이다 (음수 = 왼쪽)
  #   centered 참(true) 이면 **몸에 겹치는 것이 옳다**는 선언 (고리). 몸 안 검사에서 면제된다 —
  #            면제는 **등록부가 소리내어 청구**해야 한다 (코드가 예외를 지어내지 않는다)
  #
  # 【초기값의 근거 — 바닐라 플레이어 모델 실측】 (1px = 1.8m ÷ 32px = 0.05625m)
  #   · 키 1.8m · 눈 1.62m · 히트박스 폭 0.6m ⇒ **몸의 반지름 0.30m**
  #   · 몸통 상단(= 어깨) = 모델 y 24px × 0.05625 = **1.35m**  ← height 의 근거
  #   · 팔 길이 12px = **0.675m** · 오른어깨는 중심에서 6px = **0.34m** 오른쪽
  #   ⇒ 휘두르는 손은 몸 앞 0.5~0.9m · 높이 1.1~1.5m 를 지난다. 획의 중심을 그 안에 놓는다.
  #   · 1인칭 검산: FOV 70°(세로 반각 35°) — 앞 0.85m 에서 눈보다 0.60m 아래까지 화면에 든다.
  #     height 1.35 는 눈보다 **0.27m** 아래다 ⇒ **화면 안이다** (제 검의 궤적이 제 눈에 보인다)
  #   · lateral 0.15 는 **임의**다 (어깨는 0.34m 오른쪽이지만 획은 몸 앞을 **가로지르므로** 그 중심은
  #     어깨보다 안쪽이다 — 0.34 를 그대로 쓰면 획이 오른쪽으로 쏠린다). 눈으로 맞출 값이다.
  #
  # 【사거리와의 관계 — 너무 밀면 허공에 뜬 판자다】 forward 는 획의 길이에 매인다:
  #     실효 forward = clamp(forward, 몸반지름+여유, 획길이 × forward_max_ratio)
  #   맨손(길이 2.5×0.60 = 1.5m)의 획은 0.675m 까지만 나간다 — 주먹의 획이 창처럼 앞에 뜨지 않는다.
  #   검(3.0×0.95 = 2.85m)은 1.28m 까지 허용되므로 0.85 가 그대로 선다.
  #   **아래 한계(몸반지름+여유)가 위 한계보다 세다** — 어떤 값을 적어도 획은 몸 밖에 선다.
  #
  # 【인게임에서 맞춘다】 이 값들은 **눈으로 봐야 정해진다**. `/혼천 획위치` 가 실시간으로 밀고 당긴다:
  #     /혼천 획위치                     지금 값 + 몸 안 검사 + 여기 적을 줄
  #     /혼천 획위치 호 앞 1.2           밀고 → **즉시 획을 한 번 긋는다** (한 번 접속으로 맞춘다)
  #     /혼천 획위치 적기                맞춘 값을 이 블록에 그대로 붙일 수 있게 뽑는다
  stroke_origin:
    limits:
      body_radius: 0.30           # 【실측】 플레이어 히트박스 폭 0.6m ÷ 2 — 이 안은 **몸**이다
      clearance: 0.10             # 【임의】 몸 밖으로 더 밀어내는 여유 (모델의 팔·망토가 스치는 폭)
      max_height: 1.80            # 【실측】 플레이어의 키 — 발~키 사이가 '몸의 높이'다
      forward_max_ratio: 0.45     # 【임의】 앞으로 미는 거리 ≤ 획 길이 × 이 값 (허공의 판자 방지)

    # default — 등록되지 않은 참격 모션의 자리 (지금은 전부 등록되어 있다)
    default:  { forward: 0.85, height: 1.35, lateral: 0.15 }

    참격_호:  { forward: 0.85, height: 1.35, lateral: 0.15 }
              # 베는 호 — 어깨 높이(1.35). 바닐라 팔은 **오른쪽 위 → 왼쪽 아래**로 지나간다.
              # 획은 모델의 X축(= 몸의 **좌우**)으로 누워 있고 swings.tilt 가 그 축을 눕힌다(검 25°) —
              # 그 기울기가 팔의 호와 같은 방향이다. 원점만 팔이 지나는 자리로 옮기면 어긋나지 않는다
    참격_선:  { forward: 1.00, height: 1.40, lateral: 0.10 }
              # 찌름(선)·잔영(돌) — 몸이 앞으로 나간다. 호보다 앞에(1.00) · 조금 높게(1.40) · 덜 쏠리게
    참격_원:  { forward: 0.00, height: 1.00, lateral: 0.00, centered: true }
              # 【몸에 겹치는 것이 옳다】 사방을 훑은 고리는 **시전자를 중심으로** 돈다.
              # centered: true — 몸 안 검사 면제를 **등록부가 소리내어 청구한다**
    날의_기:  { forward: 0.55, height: 1.47, lateral: 0.00 }
              # 【B-027】 날의 기(sheath)가 서는 자리 — hand() 의 0.55·0.15 리터럴이 여기로 왔다
              #   (등록부로 옮긴 것이지 튜닝이 아니다 — 값은 그대로다).
              # ★ 획과 달리 **시선(피치 포함)을 따라** forward 만큼 민다 — 날의 기는 손에 든
              #   병기 위에 겹쳐 살므로, 고개를 숙이면 날도 내려간다 (1인칭에서도 제 검에 보인다).
              # height 는 수평 시선 기준 발에서 잰 높이: 눈(실측 1.62)에서 1.62−1.47 = 0.15 내려앉는다.
              # lateral 은 시선의 오른쪽으로 민다 (0 = 정면 — 지금 그대로)

  # ══════════════════════════════════════════════════════════════════
  #  ★★ 스윙 넷 (斬) — 【2026-07-13 · 사용자 지시】 찌르기가 아니라 **베기**
  # ══════════════════════════════════════════════════════════════════
  # 【왜 찌르기로 보였는가 — 진단 (짐작이 아니라 코드에서 읽은 사실)】
  #   ㄱ. **획이 돌지 않았다.** SkillDisplay.slash 는 참격선을 **한 번 세우고 각을 고정**한 뒤
  #      scale.x 만 0→1 로 키웠다. 즉 획은 **자라기만 하고 쓸지 않았다** — 각이동 0도.
  #      "지나간 자리"라 적어 놓고 실은 **제자리에서 길어지는 판자**였다.
  #   ㄴ. **기본 타격에는 궤적 파티클이 아예 없었다.** basicSwing → strike() 는 3D 획과 몸만
  #      부르고 trail() 을 부르지 않는다 (파티클 궤적은 **무공 시전 경로에만** 있었다).
  #      그런데 참격선 모델은 fallback: null — **팩을 못 받은 눈에는 3D 도 안 뜬다.**
  #      ⇒ 팩 없는 사람의 일반 공격에 서버가 얹은 것은 **전진(lunge)과 팔 휘두름뿐**이었다.
  #   ㄷ. **몸의 회전축이 꺼져 있다** (body.limits.yaw_kick_enabled: false — 멀미 때문에 껐고,
  #      되살리지 않는다). 그래서 script 의 yaw·pitch 는 파싱 단계에서 **0 으로 지워진다**.
  #      남는 것은 lunge(전진) 하나 — **앞으로 미는 힘이 모션의 전부**였다.
  #   ⇒ 각이동 0도 · 전진 0.16/틱. 이것을 사람은 **찌르기**라고 부른다. 사용자가 옳았다.
  #
  # 【고치는 손 — 카메라가 아니라 획을 돌린다】
  #   ItemDisplay 의 Transformation 은 **회전도 보간된다**(client slerp). 시작 각과 끝 각을 주면
  #   그리는 틱(draw) 동안 획이 **호를 그리며 쓸고 지나간다**. 엔티티는 하나 그대로다 (예산 0 증가).
  #   ★ 이것이 함정 ①의 정답이다: **도는 것은 검이지 카메라가 아니다.**
  #     (setRotation·yaw_kick 은 손대지 않았다. impact.shake 도 꺼진 채다.)
  #
  # 【함정 ② — 콤보가 아니다】 cycle 은 **그림의 리듬**이다. 입력 창(combo window)도 버퍼도 없고,
  #   우클릭·웅크림·달림의 뜻을 하나도 안 바꾼다. 연타하면 획의 **방향만** 번갈아 바뀐다.
  #   idle 이 reset_ticks 를 넘으면 1타로 돌아온다 — 그것이 전부다.
  #
  # 【칸의 뜻】
  #   yaw·pitch·roll  [시작, 끝] (도) — **획(ItemDisplay)이 도는 각**. 시전자 기준 좌표계
  #                   (+X 왼쪽 · +Y 위 · +Z 앞). roll = 정면(前面)에서 시계바늘처럼 도는 각 —
  #                   **참격의 인상은 대부분 여기서 나온다**. yaw = 좌우로 쓴다. pitch = 위아래로 쓴다.
  #                   ★ yaw 는 **히트박스 부채꼴(angle) 밖으로 못 나간다** (불변식 ㅂ) — 코드가 깎고
  #                     등록부가 밖을 청구했으면 **소리내어 짖는다**. pitch·roll 은 자유다:
  #                     호 히트박스는 **높이를 안 본다**(arcTargets — 수평각만). 그래서 위아래로 크게
  #                     휘둘러도 그림이 판정에 대해 거짓말하지 않는다.
  #   rise            [시작, 끝] (m) — 획이 **오르내리는 높이** (stroke_origin.height 에 더한다).
  #                   올려베기는 아래에서 위로(−0.55 → +0.60), 내려베기는 위에서 아래로.
  #   fan             파티클이 훑는 **부채꼴의 몫** (0~1). 1.0 = 히트박스 각 그대로. 1 을 넘지 못한다
  #   bow             파티클 궤적의 **활(弧)** (m) — 중간이 위로 부풀면 +, 아래로 처지면 −.
  #                   직선이 아니라 **호로 보이게** 하는 값이다 (사용자: "궤적이 호형으로")
  swing_arcs:
    limits:
      enabled: true
      max_arc_deg: 150            # 한 획이 쓸 수 있는 최대 각 — 이 이상은 팔이 아니라 프로펠러다
      reset_ticks: 24             # 이 틱 동안 안 치면 1타로 돌아온다 (그림의 리듬 · 입력 문법 아님)
      lunge_to_meters: 2.5        # 【도출】 lunge 는 틱당 속도(블록)다. 지면 마찰(≈0.6/틱)이 먹으면
                                  #   총 이동 ≈ v / (1 − 0.6) = 2.5v. 눈(slash_eye)이 이 환산을 쓴다
    # ★ 인게임에서 민다 (/혼천 스윙) — **이런 값은 눈으로 봐야 정해진다**
    tuning:
      arc_scale: 1.00             # 호 각도 배율 (yaw·pitch·roll 에 곱한다)
      rise_scale: 1.00            # 오르내림 배율
      bow_scale: 1.00             # 파티클 호의 부풂 배율
      lunge_scale: 1.00           # 전진 배율 — 0 으로 두면 전진이 통째로 죽는다 (시험용)
    # 연타의 그림 — 1타 좌→우 · 2타 우→좌 · 3타 아래→위 (사용자 청구 그대로)
    cycle: [횡_좌우, 횡_우좌, 올려베기]
    # ★ 내려베기 — 사용자가 '강공격'으로 청구했으나 **그 입력 수단이 이 서버에 없다**
    #   (좌클릭=평타 · 웅크림+좌클릭=기 발출 · 우클릭=태세 · 웅크림=흘리기 · 달림=회피 — 삼문이 꽉 찼다).
    #   지어내지 않는다 (함정 ②: 입력의 뜻을 바꾸지 않는다). 그래서 **내려베는 계열**(도·부·중병기·
    #   월아산·구)의 1타가 이 획을 쓴다 — 그 계열은 원래 위에서 아래로 찍는 손이다 (swings.tilt 45~70).
    heavy: 내려베기
    heavy_classes: [도, 부, 중병기, 월아산, 구]
    strokes:
      횡_좌우:  { yaw: [-48,  48], pitch: [ -6,   6], roll: [-38,  22],
                  rise: [-0.10,  0.10], fan: 1.00, bow:  0.35 }
      횡_우좌:  { yaw: [ 48, -48], pitch: [ -6,   6], roll: [ 38, -22],
                  rise: [ 0.10, -0.10], fan: 1.00, bow:  0.35 }
      올려베기: { yaw: [-30,  22], pitch: [ 40, -40], roll: [-72, -28],
                  rise: [-0.55,  0.60], fan: 0.60, bow:  0.20 }
      내려베기: { yaw: [ 34, -18], pitch: [-42,  42], roll: [ 74,  26],
                  rise: [ 0.70, -0.55], fan: 0.55, bow: -0.20 }

  # ─── 【눈】 이것은 참격인가 찌르기인가 ───
  # 【축】 획이 쓸고 지나간 **각(도)** 과 몸이 나간 **거리(m)** 의 비.
  #   찌르기 = 전진이 크고 각이 작다 · 참격 = 각이 크고 전진이 작다. 그래서 셋을 잰다:
  #     · 호각(arc_deg)  — 시작 각 ↔ 끝 각 사이의 **쿼터니언 각** (합이 아니라 실제 돌아간 각이다)
  #     · 전진(lunge_m)  — script 의 양수 lunge 합 × lunge_to_meters
  #     · 참격비          — 호각 ÷ 전진 (도/m). 전진이 0 이면 무한 = 순수 참격
  #   호(弧) 궤적을 청구한 계열만 잰다. **찌르는 것은 찌른다** — 창·암기는 면제고, 그 면제는
  #   등록부가 소리내어 청구한다 (exempt_trails). 코드가 예외를 지어내지 않는다.
  #   재는 자: tools/motion_audit.py 축 ⑬ (정적) + SkillEngine 기동 시 경고 (실물)
  #   ★ 【눈을 시험해서 고친 자리 — 2026-07-13】 처음엔 전진 상한을 **한 칸**(0.40m)으로 뒀다.
  #     그런데 그 값은 **옛 검의 전진과 정확히 같았다**(0.16 × 2.5 = 0.40). 눈의 시험(--selftest)에서
  #     "검의 전진을 옛 값으로 되돌린다"를 **못 잡았다** — 담장 위에 세운 못은 아무것도 못 막는다.
  #     그래서 등록부가 이미 가르고 있는 것을 따라 상한도 갈랐다: **가벼운 손과 무거운 손은 다르다.**
  #     내려베는 계열(부·중병기)은 몸을 실어야 그 무게가 산다 — 그것은 들이받기가 아니라 도끼다.
  slash_eye:
    min_arc_deg: 60               # 호를 청구한 계열은 최소 이만큼 쓸어야 '벤 것'이다
    max_lunge_m: 0.30             # 【가벼운 손】 발이 아니라 **체중만** 실린다 (옛 검 0.40 은 여기서 걸린다)
    max_lunge_m_heavy: 0.40       # 【무거운 손 — swing_arcs.heavy_classes】 도끼는 몸을 싣는다
    min_ratio: 150                # 호각 ÷ 전진 (도/m) — 이 아래는 찌르기 쪽에 가깝다
    exempt_trails: [선, 시]       # 찌르는 것은 찌른다 (창·암기) — 면제는 등록부가 청구한다

  # ─── 모델 등록부 【팩 담당에게 넘기는 목록】 ───
  # key      = item_model 컴포넌트 키. 팩은 두 장을 굽는다 (병기와 같은 문법):
  #            assets/honcheon/items/<경로>.json (아이템 정의) + assets/honcheon/models/item/<경로>.json
  # base     = 팩이 있을 때의 바탕 아이템 (모델이 덮으므로 형체는 무의미)
  # fallback = 팩이 없을 때의 바닐라 아이템. **null = 띄우지 않는다** (파티클 층이 그 자리를 지킨다)
  # size     = 기준 치수 [x, y, z] (m). 코드는 이 값으로 배율을 역산한다 (길이 3m 획 → scale.x = 사거리/3.0)
  #
  # 【참격선 모델 규약 — 만화의 검격】
  #   · 모델의 **기하 중심이 원점(8,8,8)** 이다. 획은 원점에서 ±X 로 **반씩** 뻗는다
  #     (머리 = +X 끝 · 꼬리 = −X 끝).
  #
  #     ★ 2026-07 — 예전엔 **머리를 원점에 두고 몸을 전부 −X 로** 늘어뜨렸다. 그 계약은
  #       "꼬리부터 지워진다"를 얻는 대신 **모델의 중심을 x −12 만큼 치우치게** 했다.
  #       ItemDisplay 는 모델을 엔티티 자리에 **중심을 두고** 그리고, 모델의 +X 는 (아래 좌표계)
  #       **앞이 아니라 좌우 축**이다 ⇒ 획이 시전자의 **정면이 아니라 옆구리**에 걸렸다
  #       (사용자 지적: "주먹 휘두를 때 모션이 정면이 아닌 왼쪽에서 나온다").
  #       ⇒ **모델은 중심에 서고, 위치·성장은 코드가 정한다.** 모델에 오프셋을 박으면
  #         그 편향을 모든 모션이 물려받는다. 머리 고정은 아래 `anchor: head` 가 청구하고
  #         SkillDisplay.transform 의 translation 이 이행한다 — 그림은 한 틱도 안 바뀐다.
  #
  #   · anchor: head — **성장·소멸의 고정점이 머리(+X 끝)** 라는 청구.
  #       translation.x = halfLen × (1 − scale.x)
  #       scale.x 1 → 획이 정면에 **좌우 대칭**으로 걸린다 · scale.x → 0 → **머리로 수축**한다
  #       ⇒ 그리면 머리에서 꼬리로 자라고, 지우면 **꼬리부터 지워진다** (옛 그림 그대로).
  #       (anchor 가 없으면 원점=중심에서 대칭으로 자란다 — 고리(참격_원)가 그것이다)
  #   · 시작(머리)이 굵고 끝(꼬리)이 가늘게 **테이퍼**를 굽는다. 꼬리 쪽 알파를 낮춰 굽는다 —
  #     사라지는 인상의 절반은 그 그라데이션이 만든다.
  #   · **무색·반투명**이 기본이다 (외공기의 획도 뜬다). 격은 코드가 밝기·굵기로 올린다 (수묵 규약).
  models:
    참격_호:
      key: "honcheon:qi/slash_arc"
      base: PAPER
      fallback: null              # 팩 없음 → 파티클 궤적 (검을 복제하느니 파티클이 낫다)
      # size[0] 은 **정규화 상수**다 (참격선의 scale = length / size[0]). 모델의 실제 치수와 같기만 하면
      # 값이 무엇이든 인게임 길이는 같다 — 길이는 **판정의 range** 가 정한다.
      # 3.0 은 구울 수 없었다: 원점=머리 계약 + MC 모델 좌표 한계([-16,32])라 −X 로 최대 1.5m 다.
      size: [1.5, 0.55, 0.04]
      anchor: head                # 성장·소멸의 고정점 = 머리(+X 끝) — 위 규약 참조
      form: "초승달 한 획 — 부채꼴을 훑고 지나간 자리. 머리가 굵고 꼬리로 가늘어진다"

    # ─── 녹색 검기(劍氣) — 호 평타 스윕의 연두 초승달 【2026-07 · 레퍼런스: 마크에이지】 ───
    #   참격_호(qi/slash_arc 무색)와 **같은 기하**이되 텍스처만 색(kigi/arc*)이다. qi/* 무색 판을
    #   물들이지 않으려고 별도 경로에 굽는다 (texture_audit 축 ⑱ QI_ACHROMATIC 이 qi/* 를 강제).
    #   motions.참격_호.model 이 1단계를 가리켜(아래) 호 궤적(검·도·부·겸·월아산 sweep) 평타가 녹색이 된다.
    #   되돌리기: motions.참격_호.model 을 참격_호 로 되돌리면 무색으로 복귀.
    #
    #   ★【스윙 동기화 · 2026-07-19】 셋으로 갈랐다. 옛 단일 모델(kigi/arc)은 3프레임 스트립 +
    #     .mcmeta 애니였는데, MC 텍스처 애니는 **전역 시계**로 돌아 소환 순간의 프레임이 매번
    #     제각각이었다 (사용자 실측: "검기 프레임이 전혀 반영이 안 된다"). 이제 단계가 곧 모델이고,
    #     kigi_slash.frame_models·frame_ticks 가 스윙 중 갈아끼울 순서·간격을 청구한다.
    #     세 모델은 기하·크기·앵커가 **완전히 같다** — 다른 것은 무는 텍스처(획이 자란 길이)뿐이다.
    검압_내려1:
      key: "honcheon:kigi/press_a1"
      base: PAPER
      fallback: null
      size: [1.5, 0.66, 0.04]
      anchor: head
      form: "검압 피크 — 압축된 절단파, 시작부터 완전체"

    검압_내려2:
      key: "honcheon:kigi/press_a2"
      base: PAPER
      fallback: null
      size: [1.5, 0.66, 0.04]
      anchor: head
      form: "절단 통과 — 후방 30% 비움 + 잔상 한 줄"

    검압_내려3:
      key: "honcheon:kigi/press_a3"
      base: PAPER
      fallback: null
      size: [1.5, 0.66, 0.04]
      anchor: head
      form: "붕괴 — 밀린 서슬 토막과 먹 잔재"

    검압_올려1:
      key: "honcheon:kigi/press_b1"
