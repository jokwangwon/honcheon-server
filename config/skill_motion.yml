      - { trail: 호, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.8 } }
      - { trail: 호, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.9 } }
