      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.2 } }
      - { trail: 호, count: 3, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.9 } }   # 3타 = 발경 라이더

  maehwa_bo:
    name: "매화보"
    style: 무관
    steps:
      - { trail: 돌, particle: cloud, count: 3, sound: { key: "entity.player.attack.sweep", volume: 0.4, pitch: 1.8 } }   # 잔상

  maehwa_geombeop:
    name: "매화검법"
