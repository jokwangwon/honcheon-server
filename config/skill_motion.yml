# ══════════════════════════════════════════════════════════════════════
#  사건(事件) — 격 밖의 읽힘. 무기 파괴·격돌·패링·고갈
# ══════════════════════════════════════════════════════════════════════
# 이 다섯은 격이 아니지만 **판단의 재료**다. 상대가 보고 결정을 바꿀 수 있어야 한다:
#   "저 자의 검에 금이 갔다" → 한 합 더 밀어붙인다
#   "저 자의 기가 흩어졌다" → 지금 들어간다
events:
  헛손질:
    particle: cloud
    count: 3
    spread: 0.10
    extra: 0.01
    sounds: [{ key: "entity.player.attack.sweep", volume: 0.5, pitch: 1.3 }]

  다운캐스트:                     # 내력이 모자라 맨 기술로 떨어졌다 — 【빈약함이 곧 정보다】
    particle: smoke
    count: 4
    spread: 0.10
    extra: 0.01
    sounds: [{ key: "block.fire.extinguish", volume: 0.5, pitch: 1.6 }]

  격_소산:                        # 두름 유지비를 못 냈다 / 태세를 거뒀다
    particle: smoke
    count: 5
    spread: 0.12
    extra: 0.01
    sounds: [{ key: "block.fire.extinguish", volume: 0.5, pitch: 1.6 }]

  발출_불발:                      # 쏠 것이 없다 (발출엔 다운캐스트가 없다)
    particle: smoke
    count: 4
    spread: 0.10
    extra: 0.01
    sounds: [{ key: "entity.player.attack.nodamage", volume: 0.6, pitch: 0.7 }]

  호신강기_무효:                  # 하위·동격을 튕겨 냈다 (상쇄 소모는 냈다 — 공짜가 아니다)
    particle: end_rod
    count: 10
    spread: 0.35
    extra: 0.03
    sounds: [{ key: "block.conduit.deactivate", volume: 0.8, pitch: 1.6 }]

  호신강기_관통:                  # 상위 격이 강기를 갈랐다
    particle: end_rod
    count: 16
    spread: 0.35
    extra: 0.03
    sounds: [{ key: "block.anvil.land", volume: 0.8, pitch: 0.7 }]

  호신강기_붕괴:                  # 상쇄할 내력이 없다 — 다음 타격은 맨몸으로 받는다
    particle: smoke
    count: 8
    spread: 0.20
    extra: 0.02
    sounds: [{ key: "block.glass.break", volume: 0.7, pitch: 0.8 }]

  무기_균열:                      # 격돌 누적 (breaks_at 3합) — "날에 금이 간다"
    particle: crit
    count: 8
    spread: 0.20
    extra: 0.05
    sounds: [{ key: "block.anvil.land", volume: 0.5, pitch: 1.9 }]

  무기_파괴:                      # 3합째 — 그 뒤는 맨손이다
    particle: item                # 아이템 데이터 필요 (부러진 병기 그 자체가 파편이 된다)
    count: 20
    spread: 0.30
    extra: 0.08
    sounds: [{ key: "entity.item.break", volume: 1.0, pitch: 0.8 },
             { key: "block.anvil.destroy", volume: 0.6, pitch: 1.4 }]

  무기_절단:                      # 2격 초과 — 한 합에 잘린다 (범철 vs 검강)
    particle: item
    count: 24
    spread: 0.35
    extra: 0.10
    sounds: [{ key: "entity.item.break", volume: 1.0, pitch: 0.6 },
             { key: "block.anvil.destroy", volume: 0.8, pitch: 1.0 }]

  자기_손상:                      # 제 격을 못 견디는 쇠 — "검이 운다" (self_damage_every 3)
    particle: crit
    count: 6
    spread: 0.12
    extra: 0.02
    sounds: [{ key: "block.anvil.land", volume: 0.4, pitch: 1.9 }]

  패링_성공:                      # 태극권·정심검결의 창 (defense_states.패링)
    particle: sweep_attack
    count: 1
    spread: 0.0
    extra: 0.0
    sounds: [{ key: "item.shield.block", volume: 0.9, pitch: 1.4 },
             { key: "block.amethyst_block.chime", volume: 0.7, pitch: 1.8 }]

  반격_오의:                      # 태극혜검 — 받은 것을 그대로 돌려준다
    particle: end_rod
    count: 20
    spread: 0.40
    extra: 0.05
    sounds: [{ key: "item.trident.return", volume: 1.0, pitch: 1.2 }]

  대성공:                         # 급소 (judgment critical_success) — 격과 무관하게 타격 위에 겹쳐 붙는다
    particle: crit
    count: 4                      # 심검 타격(24) + 강조(1) + 이것(4) = 29 ≤ per_point_tick_max 30
    spread: 0.30
    extra: 0.20
    sounds: [{ key: "entity.player.attack.crit", volume: 0.9, pitch: 1.0 }]

  흐름_충전:                      # 발동권을 얻었다 — 오의가 열린다 (읽어낸 순간)
    particle: end_rod
    count: 12
    spread: 0.40
    extra: 0.02
    sounds: [{ key: "block.beacon.power_select", volume: 0.9, pitch: 1.6 }]

  운기조식:                       # /혼천 운기 — 앉아서 한 구간
    particle: end_rod
    count: 8
    spread: 0.30
    extra: 0.01
    sounds: [{ key: "block.beacon.ambient", volume: 0.6, pitch: 1.2 }]

  흡성:                           # 마공 — 남의 것을 빼앗는다 (혈수마공 on_hit · 혈해만리)
    particle: crimson_spore
    count: 12
    spread: 0.40
    extra: 0.02
    sounds: [{ key: "entity.generic.drink", volume: 0.7, pitch: 0.6 }]

# ══════════════════════════════════════════════════════════════════════
#  3D 모션 (디스플레이 엔티티) — 파티클 위에 얹는 층
# ══════════════════════════════════════════════════════════════════════
# 【세 층 + 몸】 사용자의 정정(2026-07)을 그대로 새긴다:
#
#   ① 손의 병기   — 팩이 구운 3D 모델. 바닐라가 그린다. **우리는 손대지 않는다** (복제 금지)
#   ② 날의 기     — 격을 두르면 **손에 든 병기에 겹쳐** 기가 서린다 (지속 — 태세만 잡아도 남이 안다)
#   ③ 참격선(斬擊線) — 휘두르면 **지나간 자리**가 남는다. 만화의 검격이다. **검을 그리지 않는다**
#   ④ 몸의 자세   — 전진·pose 로 체중을 싣는다 (팔다리 각도는 서버가 못 준다 — §body 참조)
#
# 【버린 설계 — 왜 버렸는지 남긴다】 병기 ItemStack 을 실은 디스플레이를 궤적에 태우는 방식은
#   팩 게이트가 저절로 충족되는 이점이 있었으나, 화면에서 **검이 하나 더 복제되어 허공을 나는 것**으로
#   보였다. 보이는 결과가 틀렸으면 이점은 의미가 없다. 참격선은 **획 모델**이 그린다.
#   (use_held 는 남겨 뒀다 — 던진 암기와 손을 떠난 어검, 즉 **정말로 날아가는 물건**의 몫이다.)
#
# ─── 불변식 (파티클 층의 4개에 둘이 붙는다) ───
#   ㅁ. 【디스플레이는 덧칠이다】 이 층이 통째로 실패해도(팩 없음·예산 초과·미등록) 파티클 층은
#      그대로 돈다. require-resource-pack=false 는 여기서도 불가침이다 — 3D 는 특권이 아니라 사치다.
#   ㅂ. 【획은 히트박스를 벗어나지 못한다】 range·angle 은 판정이 준다. 등록부는 reach(≤1.0)로
#      **줄일 수만** 있다. 히트박스 3.5m 에 6m 획을 그릴 방법이 이 구조엔 없다.
#
# ─── 팩 유무의 분기 ───
#   팩 수락 → base 아이템에 item_model(key)을 얹는다 → 팩이 구운 3D 형체
#   팩 거절 → fallback 바닐라 아이템. **fallback 이 null 이면 아무것도 띄우지 않는다**
#            (그 자리는 파티클 층이 지킨다 — 참격선·날의 기가 그렇다: 억지 폴백이 더 나쁘다)
#   use_held → 시전자의 아이템 그 자체 (팩 유무와 무관 · 던진 물건에만)
display:

  # ─── 예산 (performance.yml vfx_entities) ───
  # 【근거】 20인 군집(load_test.combat_cluster_size)이 쉬지 않고 치는 정상 상태:
  #   · 참격선 — 20인 × 1개 (수명 ≈ 10틱 / 스윙 간격 ≥ 9틱)          ⇒ 동시 ≈ 20
  #   · 날의 기 — 20인 × 1개 (지속 — 격을 두른 동안 계속)            ⇒ 동시 ≈ 20
  #   · 발출·투척 — 20인 × 1개 (수명 ≈ 14틱 / 쿨 40틱)               ⇒ 동시 ≈ 7
  #   · 오의 — 예약분 16
  #   합 63 ≤ 강등선 100 ≤ 전역 120.  호신강기 고리(4장/인)에 남는 여유 = 100 − 47 = 53 ⇒ 13인분
  #   ※ 한 사람은 **공격 태세(날의 기)이거나 방어 태세(고리)이지 둘 다일 수 없다** (armed 는 하나다)
  #     — 그래서 최악치가 겹치지 않는다. 20인 전원 호신강기(80장)면 고리가 먼저 강등된다.
  budget:
    global_cap: 120               # = performance.yml vfx_entities.global_cap (audit ⑧이 대조)
    max_lifetime_ticks: 60        # = performance.yml vfx_entities.max_lifetime_ticks
    degrade_at: 100               # 살아 있는 형체가 이 수를 넘으면 새 요청 거절 → 파티클로 강등
    reserve_for_ultimate: 16      # 오의 몫 — 잡졸의 참격이 오의의 자리를 먹지 못한다
    per_cast_max: 4
    per_player_max: 8             # 한 몸: 고리 4 + 참격선 1 + 날의 기 1 + 투척 1 + 여유 1
    view_range: 0.5               # 0.5 × 64m = 32m (파티클 cull_beyond 와 같은 눈금)
    heartbeat_ticks: 12           # 지속 형체(날의 기·고리)의 심장박동 — 갱신이 끊기면 스스로 사라진다
    slash_min_ticks: 3            # 참격선은 이보다 짧을 수 없다 (3틱 미만은 보간이 못 따라간다)
    slash_max_ticks: 18           # 이보다 길 수도 없다 (부·중병기의 무게도 여기서 끊긴다)

  # ─── 모델 등록부 【팩 담당에게 넘기는 목록】 ───
  # key      = item_model 컴포넌트 키. 팩은 두 장을 굽는다 (병기와 같은 문법):
  #            assets/honcheon/items/<경로>.json (아이템 정의) + assets/honcheon/models/item/<경로>.json
  # base     = 팩이 있을 때의 바탕 아이템 (모델이 덮으므로 형체는 무의미)
  # fallback = 팩이 없을 때의 바닐라 아이템. **null = 띄우지 않는다** (파티클 층이 그 자리를 지킨다)
  # size     = 기준 치수 [x, y, z] (m). 코드는 이 값으로 배율을 역산한다 (길이 3m 획 → scale.x = 사거리/3.0)
  #
  # 【참격선 모델 규약 — 만화의 검격】
  #   · 원점은 **획의 머리(끝점)** 에 둔다. 획은 거기서 **−X 로 늘어진다**.
  #     그래야 scale.x 를 0→1 로 키우면 **칼끝 뒤로 꼬리가 자라고**, 1→0 으로 줄이면 **꼬리부터 지워진다**
  #     (머리가 먼저 지워지면 거꾸로 보인다 — 사용자 지적).
  #   · 시작(머리)이 굵고 끝(꼬리)이 가늘게 **테이퍼**를 굽는다. 꼬리 쪽 알파를 낮춰 굽는다 —
  #     사라지는 인상의 절반은 그 그라데이션이 만든다.
  #   · **무색·반투명**이 기본이다 (외공기의 획도 뜬다). 격은 코드가 밝기·굵기로 올린다 (수묵 규약).
  models:
    참격_호:
      key: "honcheon:qi/slash_arc"
      base: PAPER
      fallback: null              # 팩 없음 → 파티클 궤적 (검을 복제하느니 파티클이 낫다)
      size: [3.0, 0.55, 0.04]
      form: "초승달 한 획 — 부채꼴을 훑고 지나간 자리. 머리가 굵고 꼬리로 가늘어진다"

    참격_선:
      key: "honcheon:qi/slash_line"
      base: PAPER
      fallback: null
      size: [3.0, 0.35, 0.04]
      form: "곧은 한 획 — 찌름(선)·잔영(돌). 앞이 뾰족하고 뒤로 늘어진다"

    참격_원:
      key: "honcheon:qi/slash_ring"
      base: PAPER
      fallback: null
      size: [2.0, 0.35, 2.0]      # 지름 2m 기준 고리 (XZ 평면)
      form: "원형 한 획 — 사방을 훑은 자리 (매화만개·태극검·합격진). 납작한 고리"

    날의_기:
      key: "honcheon:qi/blade_sheath"
      base: PAPER
      fallback: null              # 팩 없음 → 손끝 잔광 파티클 (이미 돌고 있다)
      size: [1.2, 0.16, 0.16]     # 날의 축을 따라 늘어난 얇은 빛
      form: "병기의 날을 따라 흐르는 기 — **손에 든 검 위에 겹친다** (복제가 아니다).
             격이 오를수록 날을 넘어 자란다 (강기는 날 밖으로 삐져나온다)"

    검기_비:
      key: "honcheon:qi/bolt_edge"
      base: PAPER
      fallback: END_ROD           # 흰 막대가 날아간다 (검을 복제하지 않는다 — 기가 나는 것이다)
      size: [1.6, 0.30, 0.04]
      form: "날아가는 검기 — 앞이 뾰족하고 뒤로 꼬리가 늘어진 한 자루의 빛. 자전한다"

    강기_포신:
      key: "honcheon:qi/bolt_lance"
      base: PAPER
      fallback: AMETHYST_SHARD    # 빛 덩어리가 느리게 밀려온다 (검이 아니다: 뚫는 것이다)
      size: [2.2, 0.7, 0.7]
      form: "강기 포 — 검기보다 굵고 짧다. 창끝이 아니라 **말뚝**. 착탄에서 2.2배로 확장"

    호신_조각:
      key: "honcheon:qi/guard_shard"
      base: PAPER
      fallback: END_ROD
      size: [0.5, 1.1, 0.05]
      form: "몸을 두르는 판 조각 — 세로로 선 얇은 방패 한 장. 4장이 궤도를 돈다"

    # 【use_held】 실을 것이 시전자의 아이템 **그 자체**. 팩 유무와 무관하다 (분기 없음).
    #   복제가 아니다 — **정말로 손을 떠나 날아가는 물건**이기 때문이다. 팩 담당에게 요구할 것이 없다.
    던진_암기:
      use_held: true
      size: [1.0, 1.0, 1.0]
      form: "던져진 비수·침 그 자체 (회전하며 난다). 요구 없음 — 암기 아이템 모델이 이미 그 목록이다"

    어검_검:
      use_held: true
      size: [1.0, 1.0, 1.0]
      form: "손을 떠난 병기 그 자체 (부림 — 쇠가 난다). 요구 없음"

    매화_꽃:
      key: "honcheon:ult/plum_bloom"
      base: PAPER
      fallback: AMETHYST_SHARD
      size: [1.0, 1.0, 1.0]
      form: "다섯 잎 매화 — 위에서 본 꽃. 응집에서 오므리고 개시에서 활짝 편다"

    태극_원반:
      key: "honcheon:ult/taegeuk_disc"
      base: PAPER
      fallback: AMETHYST_SHARD
      size: [1.6, 1.6, 0.05]
      form: "태극 원반 — 몸 앞에 서서 천천히 자전한다 (기다림의 얼굴)"

    군림_획:
      key: "honcheon:ult/emperor_edge"
      base: PAPER
      fallback: AMETHYST_SHARD
      size: [1.2, 4.0, 0.10]
      form: "하늘에서 내려오는 세로 획 — 거대한 칼"

    혈해_파문:
      key: "honcheon:ult/blood_tide"
      base: PAPER
      fallback: REDSTONE          # 【채색 예외】 팩 없어도 붉다 — 예외가 곧 정보다
      size: [1.0, 0.08, 1.0]
      form: "붉은 파문 — 바닥에 깔린 고리가 사방으로 퍼진다"

  # ─── 모션 등록부 — 어떻게 움직이는가 (보간이 부드러움의 전부다) ───
  # kind: 참격(그렸다 지워진다) · 서림(병기에 겹쳐 지속) · 투사(날아간다) · 고리(궤도) · 개화(오의)
  #   draw          획이 그려지는 틱 (꼬리가 자란다) — 실제 값은 계열 공속이 정한다 (swings.span_ratio)
  #   fade          획이 지워지는 틱 (**꼬리부터**)
  #   interpolation 보간 틱 — 0 이면 형체가 튄다. 부드러움의 전부가 여기 있다
  motions:
    참격_호:  { kind: 참격, model: 참격_호, fade: 5, interpolation: 2, spread: 1.15 }
    참격_선:  { kind: 참격, model: 참격_선, fade: 4, interpolation: 2, spread: 1.10 }
    참격_원:  { kind: 참격, model: 참격_원, fade: 6, interpolation: 3, spread: 1.20 }
              # spread — 지워질 때 획이 살짝 **퍼지며** 사라진다 (연기처럼). 1.0 이면 그대로 얇아진다

    날의_기:  { kind: 서림, model: 날의_기, interpolation: 4, lifetime: 60 }
              # 지속 — 수명이 아니라 **심장박동**으로 산다 (태세를 거두면 그 자리에서 사라진다)

    검기_투사: { kind: 투사, model: 검기_비,   lifetime: 14, speed: 1.6, spin: 0.30,
                birth: 1, fade: 3, interpolation: 2, impact_scale: 1.8, impact_ticks: 4, brightness: [15, 15] }
    강기_투사: { kind: 투사, model: 강기_포신, lifetime: 20, speed: 1.0, spin: 0.10,
                birth: 2, fade: 4, interpolation: 3, impact_scale: 2.2, impact_ticks: 6, brightness: [15, 15] }
    어검_비행: { kind: 투사, model: 어검_검,   lifetime: 26, speed: 1.2, spin: 0.55,
                birth: 1, fade: 3, interpolation: 2, impact_scale: 1.4, impact_ticks: 3, brightness: [0, 15] }
    암기_투척: { kind: 투사, model: 던진_암기, lifetime: 30, speed: 1.4, spin: 0.75,
                birth: 1, fade: 2, interpolation: 1, impact_scale: 1.0, impact_ticks: 1,
                stick_ticks: 20, brightness: [0, 15] }
                # 던진 물건은 **꽂힌다** — 빗나가면 땅에 20틱 남았다가 사라진다 (회수는 인벤토리의 몫이 아니다:
                # skill_mechanics ranged.암기 "회수 가능 (전투 후 절반)" 은 경제 층의 규칙이다)

    호신_고리: { kind: 고리, model: 호신_조각, count: 4, radius: 0.85, height: 1.0,
                orbit: 0.10, interpolation: 4, brightness: [15, 15] }

    매화_개화: { kind: 개화, model: 매화_꽃,   lifetime: 30, birth: 0, fade: 8,
                interpolation: 4, spin: 0.06, burst_scale: 1.0, billboard: FIXED, brightness: [15, 15] }
    태극_대기: { kind: 개화, model: 태극_원반, lifetime: 40, birth: 4, fade: 6,
                interpolation: 4, spin: 0.12, burst_scale: 0.5, billboard: FIXED, brightness: [15, 15] }
    군림_강림: { kind: 개화, model: 군림_획,   lifetime: 24, birth: 0, fade: 5,
                interpolation: 3, spin: 0.0, burst_scale: 0.8, billboard: FIXED, brightness: [15, 15] }
    혈해_범람: { kind: 개화, model: 혈해_파문, lifetime: 30, birth: 0, fade: 8,
                interpolation: 4, spin: 0.04, burst_scale: 1.0, billboard: FIXED, brightness: [15, 15] }

  # ─── 참격선 배선 — 히트박스 모양 → 획 (【불변식 ㅂ】 모양은 판정이 정한다) ───
  slashes:
    호: 참격_호
    선: 참격_선
    돌: 참격_선                   # 보법의 잔영 — 지나온 자리에 남는 곧은 획 (뒤로 그린다)
    원: 참격_원
    진: 참격_원
    시: null                      # 투사체는 **제 몸이 궤적이다** (암기_투척·화살) — 획을 겹치면 거짓말
    태세: null                    # 몸에 머무는 것에는 획이 없다
    가드태세: null
    시전: null

  # ─── 격이 획에 스며든다 — 3D 사다리 (파티클 사다리와 같은 문법: 단조 증가) ───
  # 【외공기도 획을 그린다】 이것이 이번 정정의 핵심이다: 무공이 없어도, 격이 없어도,
  #   병기를 휘두르면 지나간 자리가 남는다. 격은 그 획을 **밝고 굵게** 만들 뿐이다.
  grade_ink:
    외공기: { thickness: 0.55, brightness: [0, 15],  hold: 0 }   # 빛나지 않는다 — 쇠가 지나간 자리
    발경:   { thickness: 0.75, brightness: [7, 15],  hold: 1 }   # 기가 몸 안에서 터진다 — 획이 살짝 밝다
    검기:   { thickness: 1.00, brightness: [15, 15], hold: 2 }   # 날에 서린 기가 그대로 그어진다
    강기:   { thickness: 1.35, brightness: [15, 15], hold: 3 }
    어검:   { thickness: 1.70, brightness: [15, 15], hold: 4 }
    심검:   { thickness: 2.10, brightness: [15, 15], hold: 5 }   # hold — 획이 공중에 머무는 틱 (무게)

  # ─── 날의 기 (지속) — 격을 두르면 병기에 서린다 ───
  # 【전의 규칙의 전제】 npc_combat 의 격_목격(검기 −2 · 강기 −5 · 어검 −8)은 "본다"를 전제한다.
  #   휘둘러야만 보이면 그 규칙은 거짓말이다. **검을 뽑아 기를 두르면 그 자리의 모두가 안다.**
  #   1인칭에서도 보인다 (손에 든 검 위에 겹쳐 뜨므로 제 눈에도 들어온다).
  sheaths:
    발경: { motion: 날의_기, scale: [0.45, 0.60, 0.60], brightness: [8, 15] }    # 손끝에 맺힌다 (날을 안 넘는다)
    검기: { motion: 날의_기, scale: [1.00, 1.00, 1.00], brightness: [15, 15] }   # 날에 서린 실선
    강기: { motion: 날의_기, scale: [1.35, 1.60, 1.60], brightness: [15, 15] }   # 날을 넘어 자란 빛
    어검: { motion: 날의_기, scale: [1.70, 2.00, 2.00], brightness: [15, 15] }
    심검: { motion: 날의_기, scale: [2.00, 2.40, 2.40], brightness: [15, 15] }
    호신강기: null                # 몸에 두른 것 — 그 자리는 고리다 (forms.호신강기)

  # ══════════════════════════════════════════════════════════════════
  #  계열의 손 — 획의 굵기·길이·시간 (【공속이 곧 리듬】)
  # ══════════════════════════════════════════════════════════════════
  # span_ratio  자세가 돌아오는 시간(프레임·계열 공속 중 긴 쪽)에 곱해 **획을 그리는 틱**을 낸다.
  #             단검(2.2/s = 9틱)의 획은 3틱에 끝나고, 부(0.9/s = 22틱)의 획은 18틱을 끈다.
  # reach       히트박스 사거리 대비 획의 길이 (**1.0 을 넘지 못한다** — 불변식 ㅂ)
  # thickness   속도가 곧 두께다 — 빠른 단검은 가늘고 날카롭게, 무거운 부는 굵고 느리게
  # tilt        획이 누운 각(도). 【MC 규약: pitch 양수 = 아래】 내려베는 것일수록 크다
  swings:
    검:     { span_ratio: 0.55, reach: 0.95, thickness: 1.00, tilt: 25 }   # 벤다 — 눕혀 긋는다
    도:     { span_ratio: 0.60, reach: 0.95, thickness: 1.25, tilt: 45 }   # 내려벤다 — 위에서 아래로
    창:     { span_ratio: 0.45, reach: 1.00, thickness: 0.70, tilt: 0 }    # 찌른다 — 가늘고 곧다
    봉:     { span_ratio: 0.65, reach: 0.90, thickness: 1.30, tilt: 10 }   # 후려친다 — 날이 없으니 굵다
    단검:   { span_ratio: 0.35, reach: 0.85, thickness: 0.55, tilt: 15 }   # 가늘고 날카롭다 (속검)
    암기:   { span_ratio: 0.30, reach: 0.50, thickness: 0.50, tilt: 0 }    # 손목의 획 — 짧다 (본체는 날아간다)
    활:     { span_ratio: 0.00, reach: 0.00, thickness: 0.00, tilt: 0 }    # 휘두르는 물건이 아니다
    권갑:   { span_ratio: 0.35, reach: 0.70, thickness: 0.80, tilt: 0 }    # 지른다 — 짧고 뭉툭하다
    맨손:   { span_ratio: 0.35, reach: 0.60, thickness: 0.70, tilt: 0 }    # 【맨손도 획을 그린다】 권풍
    겸:     { span_ratio: 0.55, reach: 0.95, thickness: 0.95, tilt: 20 }   # 걸어벤다 — 당기는 획
    월아산: { span_ratio: 0.80, reach: 1.00, thickness: 1.55, tilt: 55 }
    구:     { span_ratio: 0.60, reach: 0.95, thickness: 1.10, tilt: 50 }   # 찍는다
    중병기: { span_ratio: 0.90, reach: 0.95, thickness: 1.80, tilt: 60 }   # 짓뭉갠다 — 가장 굵다
    부:     { span_ratio: 0.85, reach: 1.00, thickness: 1.70, tilt: 70 }   # 찍어벤다 (0.9/s — 가장 느린 손)
    무관:   null                                                           # 보법·심법 — 벨 것이 없다
    짐승:   null                                                           # 발톱은 병기가 아니다

  # ══════════════════════════════════════════════════════════════════
  #  몸의 자세(體勢) — 되는 것만 한다
  # ══════════════════════════════════════════════════════════════════
  # 【조사 결과 — 안 되는 것】 바닐라 클라이언트에서 **플레이어의 팔다리 각도는 서버가 줄 수 없다.**
  #   애니메이션은 클라이언트가 돌리고, 리소스팩으로 플레이어 지오메트리를 바꿀 수 없다.
  #   "다리를 뒤로 보내고 허리를 쓰는" 골격 애니메이션은 **바닐라 프로토콜에 자리가 없다.**
  #   (플레이어를 감추고 커스텀 형체를 태우는 길은 자기 시점·손·판정이 전부 깨진다 — 하지 않는다.)
  #
  # 【되는 것 — 셋】 그리고 이 셋만으로도 체중은 실린다:
  #   ① 전진(lunge)   — setVelocity 로 몸을 앞으로 민다. **창의 5m 는 몸이 나가야 5m 다**
  #   ② 자세(pose)    — Entity.setPose(Pose, fixed) 로 몸통 각도를 바꾼다 (바닐라가 가진 자세만):
  #        SWIMMING    몸을 수평으로 눕힌다 → **찌르기·돌진**의 몸 (창·돌)
  #        SNEAKING    몸을 낮춘다 → **웅크렸다 올려치기**의 예비 동작 (부·중병기의 들어올림)
  #        SPIN_ATTACK 몸을 회전시킨다 (트라이던트 급류) → **회전 베기** (원 궤적)
  #      pose 는 **관중의 눈에 보이는 자세**다. 제 클라이언트는 제 자세를 스스로 그리므로
  #      1인칭 조작감을 해치지 않는다 (그것이 이 수단을 고른 이유다).
  #   ③ 정지(hitstop) — 프레임(선딜·후딜)이 이미 발을 묶는다 (SLOWNESS). 관성 뒤의 **멈춤**이 무게다.
  #
  # 【안전 규칙 — 조작감을 해치는 것이 최악이다】
  #   · 시야 회전(yaw/pitch kick)은 **조준을 직접 망가뜨린다**. 칸은 두되 **전부 0 이다** (켤 사람이 켠다).
  #   · 공중·물속·기어가기 중에는 자세를 강제하지 않는다 (낙하·수영 자세와 싸우면 몸이 굳는다).
  #   · 전진은 지면에서만. 상한 max_lunge — 전투 중 미끄러지면 조준이 깨진다.
  #   · pose 강제는 max_pose_ticks 를 넘지 못한다. 길면 몸이 굳고, 굳으면 그것은 버그로 읽힌다.
  body:
    limits:
      max_lunge: 0.55             # 틱당 속도 상한 (블록) — 이 이상은 미끄러진다.
                                  # 돌진 초식(철산고 distance 4)의 몸이 이 상한을 정했다 —
                                  # 근접타(검 0.16)는 그 3분의 1도 안 쓴다. 상한은 돌진의 것이다
      max_pose_ticks: 8           # 자세 강제 상한 — 넘으면 몸이 굳는다
      require_ground: true        # 공중에서는 전진·자세 없음 (낙하와 싸우지 않는다)
      skip_when: [수영, 기어가기, 활강]   # 이 상태에서는 손대지 않는다 (바닐라 자세가 이긴다)
      yaw_kick_enabled: false     # 【기본 꺼짐】 시야 회전은 조준을 해친다 — 켜려면 사용자가 켠다
    # by_class — lunge(전진 세기) · pose(자세) · pose_ticks · yaw_kick · pitch_kick
    by_class:
      검:     { lunge: 0.16, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }   # 허리로 벤다 — 발은 거의 안 나간다
      도:     { lunge: 0.20, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }   # 체중을 실어 내려친다
      창:     { lunge: 0.42, pose: SWIMMING,    pose_ticks: 5, yaw_kick: 0, pitch_kick: 0 }   # **몸이 나간다** — 전진이 곧 사거리다
      봉:     { lunge: 0.18, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }
      단검:   { lunge: 0.08, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }   # 몸을 거의 안 쓴다 — 그것이 속검이다
      암기:   { lunge: 0.05, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }   # 팔이 아니라 손목이다
      활:     { lunge: 0.00, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }
      권갑:   { lunge: 0.22, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }   # 다리→허리→어깨의 사슬
      맨손:   { lunge: 0.22, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }
      겸:     { lunge: -0.10, pose: 없음,       pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }   # **당긴다** — 뒤로 빠지며 건다 (음수 전진)
      월아산: { lunge: 0.26, pose: SNEAKING,    pose_ticks: 4, yaw_kick: 0, pitch_kick: 0 }   # 크게 들었다 내린다
      구:     { lunge: 0.24, pose: 없음,        pose_ticks: 0, yaw_kick: 0, pitch_kick: 0 }
      중병기: { lunge: 0.30, pose: SNEAKING,    pose_ticks: 6, yaw_kick: 0, pitch_kick: 0 }   # 웅크렸다 짓뭉갠다
      부:     { lunge: 0.34, pose: SNEAKING,    pose_ticks: 6, yaw_kick: 0, pitch_kick: 0 }   # 들어올렸다 내려찍는다 (가장 무겁다)
      무관:   null
      짐승:   null
    # by_trail — 궤적이 자세를 이긴다 (돌진은 어떤 병기를 들었든 몸을 던지는 것이다)
    by_trail:
      돌:  { lunge: 0.55, pose: SWIMMING,    pose_ticks: 6 }   # 돌진 — 몸을 앞으로 던진다 (철산고·보법)
      원:  { lunge: 0.10, pose: SPIN_ATTACK, pose_ticks: 5 }   # 회전 베기 — 몸이 돈다 (매화만개·태극검)
      시:  { lunge: 0.05, pose: 없음,        pose_ticks: 0 }   # 던지고 쏘는 것 — 발은 멈춘다

  # ─── 암기 투척 — 던진 물건은 **실제로 날아간다** (복제가 아니다) ───
  throw:
    motion: 암기_투척
    classes: [암기]               # 이 계열의 '시' 궤적만 물건이 난다 (활은 바닐라 화살이 이미 3D 다)
    spin_axis: X                  # 비수는 제 길이축을 돌며 난다

  # ─── 두 층의 조율 — 참격선이 뜨면 파티클 궤적은 물러선다 (0 은 아니다) ───
  blend:
    trail_particle_ratio: 0.35    # 3D 획이 떴으면 궤적 파티클은 35% 만
    trail_particle_min: 1         # 그래도 0 은 아니다 — 획이 지나간 자리는 언제나 남는다
    keep_impact: true             # 타격 파티클은 깎지 않는다 (격의 사다리는 타격에서 읽힌다)

  # ─── 배선 (형태·오의) ───
  bind:
    forms:
      검기_두름: null             # 두름 = 손끝 잔광 + **날의 기**(sheaths) — 고리가 아니다
      검강_두름: null
      검기_참격: 검기_투사
      강기_포:   강기_투사
      호신강기:  호신_고리
      이기어검:  어검_비행
    ultimates:
      maehwa_mangae:  매화_개화
      taegeuk_hyegeom: 태극_대기
      jewang_gunrim:  군림_강림
      hyeolhae_malli: 혈해_범람

# ══════════════════════════════════════════════════════════════════════
#  기본 초식(基本) — 【무공이 없어도 병기는 궤적을 그린다】
# ══════════════════════════════════════════════════════════════════════
# 사용자 보고: "공격 모션은 아직 안 바뀐 거 같고" — 원인은 3D 층이 **무공 시전 경로 안에만** 있었던 것이다.
# 무공을 안 배운 채(또는 배운 무공의 계열이 아닌 병기로) 좌클릭하면 아무 일도 일어나지 않았다.
# 그것이 **가장 흔한 경로**다 (연무장에서 크리에이티브로 칼을 들고 치는 사람).
#
# 【정본】 무공은 궤적을 **바꾸는 것**이지, 무공이 없다고 궤적이 **없는** 것이 아니다.
#   그래서 여기에 '무공 없는 손'의 히트박스·프레임을 등록한다. 코드는 이것을 읽는다 (하드코딩 금지).
#   이 값은 지금 **연출 전용**이다 — 판정은 바닐라 피해가 그대로 낸다 (외공기).
#   훗날 이 값이 판정으로 승격되면 같은 등록부를 읽게 된다 (그때 이 주석을 지워라).
basic_strike:
  cooldown_ticks: 4               # 연출 최소 간격 — 바닐라 연타에 획이 겹쳐 쌓이지 않게
  by_class:
    검:     { trail: 호, range: 3.0, angle: 100, frames: [2, 2, 4] }
    도:     { trail: 호, range: 3.0, angle: 110, frames: [3, 2, 5] }
    창:     { trail: 선, range: 5.0, angle: 30,  frames: [4, 2, 6] }   # angle 칸 = 선의 폭
    봉:     { trail: 호, range: 4.0, angle: 120, frames: [3, 2, 5] }
    단검:   { trail: 호, range: 2.5, angle: 80,  frames: [1, 1, 3] }
    겸:     { trail: 호, range: 3.0, angle: 100, frames: [3, 2, 5] }
    부:     { trail: 호, range: 3.0, angle: 90,  frames: [6, 3, 10] }
    월아산: { trail: 호, range: 3.5, angle: 120, frames: [5, 3, 9] }
    구:     { trail: 호, range: 3.0, angle: 90,  frames: [4, 2, 7] }
    중병기: { trail: 호, range: 3.5, angle: 130, frames: [7, 3, 11] }
    권갑:   { trail: 호, range: 2.5, angle: 90,  frames: [1, 1, 3] }
    맨손:   { trail: 호, range: 2.5, angle: 90,  frames: [1, 1, 3] }
    암기:   { trail: 시, range: 16.0, angle: 1,  frames: [2, 1, 4] }   # 던진다 (ranged.암기 사거리 16)
    활:     null                  # 바닐라 활이 제 일을 한다 — 우리가 얹을 것이 없다
    무관:   null
    짐승:   null
