      - { trail: 호, count: 2, sound: { key: "entity.player.attack.weak", volume: 0.8, pitch: 0.9 } }
      - { trail: 선, count: 3, finisher: true, sound: { key: "entity.player.attack.knockback", volume: 1.0, pitch: 0.7 } }

