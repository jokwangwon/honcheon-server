      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 0.8 } }
      - { trail: 선, count: 3, finisher: true, sound: { key: "entity.player.attack.knockback", volume: 1.0, pitch: 0.6 } }

  # ── 관군 ──
