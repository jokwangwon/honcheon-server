# 무공 모션 등록부 (기계 판독용) — 「팩이 없어도 읽힌다」
# 기준 문서: docs/design/skill_motion.md · resourcepack_design.yml (수묵 규약)
# 엔진: SkillEngine (판독) · SkillListener (발행) · SkillHud (예산 게이트)
#
# ─── 두 층의 모션 ───
#   ① 팩이 있으면 — 여기 적힌 바닐라 파티클의 **텍스처**가 수묵 획으로 다시 그려진다 (팩 담당의 몫)
#   ② 팩이 없어도 — 여기 적힌 **개수·퍼짐·소리·궤적**만으로 무엇이 일어났는지 읽힌다 (이 파일의 몫)
#   불가침: require-resource-pack=false — 팩을 거절해도 플레이는 된다. 그러므로 ②가 본체다.
#
# ─── 불변식 4개 ───
#   ㄱ. 코드에 파티클·소리를 하드코딩하지 않는다 (등록제 규약). 이 파일이 정본이다.
#   ㄴ. 보이는 것과 맞는 것이 같아야 한다 — trail 은 skill_mechanics.yml 의 히트박스 type 과 **같은 모양**이다.
#      (호를 그렸는데 선으로 맞으면 그건 거짓말이다. motion_audit 이 그 거짓말을 잡는다.)
#   ㄷ. 격의 사다리는 시각적으로 **단조 증가**한다 — rank 가 오르면 count·brightness·aura 가 반드시 커진다.
#      (강해진 것이 눈에 덜 띄면 격은 장식이다.)
#   ㄹ. 【2026-07 개정 — 사용자 지시】 색은 **격의 사다리를 따라서만** 오른다 (수묵 → 청록 → 옥 → 청백).
#      옛 규약은 "채색 금지 · 격은 밝기로만 갈린다" 였다. 사용자가 방향을 다시 세웠다:
#        *"묵청 무협/청록산수/수묵 저채도는 유지하되, 공격 궤적과 파티클은 경지와 기술 등급이
#          올라갈수록 RPG 스타일로 더 화려해지는 구조로 설계할 것."*
#      그래서 색은 **금지**가 아니라 **등록**된다 (아래 inks). 금지되는 것은 색 자체가 아니라
#      **형광 핑크·네온 보라·과도한 노랑·SF 발광**이다 (inks.forbidden — motion_audit 축 ⑦이 잰다).
#      마공의 혈점(crimson_spore)은 여전히 예외다: 그 예외 자체가 정보다 — "저것은 사람의 기가 아니다".

# ══════════════════════════════════════════════════════════════════════
#  파티클 예산 (performance.yml F-P1 을 무공 층으로 좁힌 값)
# ══════════════════════════════════════════════════════════════════════
# 【한 지점·한 틱 30개】가 이 설계의 못이다. 근거:
#   · 시야당 예산 600/틱 (performance.yml particles.per_player_view_per_tick)
#   · load_test.combat_cluster_size = 20 — 한 시야에 20인이 동시에 친다고 가정한다
#   · 600 ÷ 20 = 30 ⇒ per_point_tick_max 30. 스무 명이 같은 틱에 때려도 시야 예산에 **정확히** 들어온다.
#
# 【2026-07 — 타격점 예산의 재도출】 사용자가 "타격 순간 작은 폭발형 입자"를 청구했다.
#   그런데 옛 타격점은 **이미 꽉 차 있었다**: 심검 타격 24 + 강조 1 + 대성공 4 = 29 ≤ 30 (여유 1).
#   여유 1 에 폭발을 끼워 넣는 것은 폭발이 아니라 알리바이다. 그렇다고 30 을 올리면 600÷20 의
#   도출이 무너진다 (그것은 예산이 아니라 소원이 된다).
#   ⇒ **더하지 않고 나눈다.** 격의 타격은 이제 두 몫이다 — 먹점(impact)과 **폭발(burst)**:
#         impact + accent + burst + 대성공(4) ≤ per_point_tick_max
#     사다리는 **셋 다** 단조 증가한다 (motion_audit 축 ⑧ 이 실제 발행량으로 잰다):
#         격      impact  accent  burst   보이는 합   +대성공
#         외공기     4       0       2        6         10
#         발경       8       1       4       13         17
#         검기      10       5       5       20         24
#         강기      12       1       8       21         25
#         어검      13       1      10       24         28
#         심검      14       1      11       26         30  ← 상한에 **정확히** 닿는다
#     옛 심검(먹점 24)보다 보이는 총량이 늘었고(25→26), 그중 11 개가 **청백의 폭발**이다.
#     예산은 한 톨도 안 늘었다.
#
#   · 그 위의 세 예산(응집·궤적·타격)은 **풀**이다 — 프레임이 길다고 파티클이 비례해 늘면 안 된다:
#       응집 풀 32 — 선딜 20틱짜리 오의급 초식도 응집에 32개까지만 쓴다 (2틱마다 발행, 풀이 마르면 멈춘다)
#       궤적 풀 36 — 궤적 24 + **잔상·먹번짐 12** (심검 echo 8 + haze 4 — 사다리의 꼭대기).
#                    사거리 12m 선을 그려도 36개 (점당 개수 × 표본점이 이 값을 넘으면 점을 솎는다)
#                    ★ 24 → 36 으로 올린 값이다. 잔상을 궤적 예산 **밖에서** 뽑으면 그것은 예산이 아니다
#       타격 풀 48 — 다중 대상은 **나눠 쓴다** (광역 8인 = 6개씩). 아무리 나눠도 대상당 3개는 남긴다
#                    (performance over_budget: "핵심 타격 표시만 유지" — 타격이 안 보이면 판정이 거짓말이 된다)
#   · 한 수의 총합 = 32 + 36 + 1 + 30 = 99 ≤ per_cast_max 160 (여유는 무기 격돌·자기 손상 같은 겹침 몫)
#   · 오의는 우선권(ultimate_arts world_weight.particle_priority) — 생략되지 않고 **깎인다**.
#     전투당 1회(화경 이하)라 동시성이 낮다: 한 틱 48 × 동시 12인 = 576 < 600.
#     개시 틱 = burst 40 + 강조 1 + **개화 폭발(bloom) 7** = 48 — 상한에 정확히 닿는다 (ultimate_flourish).
budget:
  per_point_tick_max: 30          # 한 지점·한 틱 상한 (응집·궤적·타격 각각) — 600 ÷ 군집 20인
  per_cast_max: 160               # 한 시전(단일 대상)이 전 프레임에 걸쳐 쓰는 총량
  telegraph_pool: 32              # 응집 총 예산 — 선딜이 길어도 여기서 끊는다
  trail_pool: 36                  # 궤적 총 예산 (궤적 24 + 잔상·먹번짐 12) — 사거리가 길어도 여기서 끊는다
  crit_reserve: 4                 # 대성공(급소)이 타격점 위에 겹칠 자리 — **미리 비워 둔다** (= events.대성공.count)
  impact_pool: 48                 # 타격 총 예산 — 대상 수로 나눈다 (다중 히트가 예산을 터뜨리지 못한다)
  min_impact_per_target: 3        # 나눠도 이만큼은 남긴다 — 맞았다는 사실은 언제나 보여야 한다
  ultimate_per_tick_max: 48       # 오의 — 우선권. 전투당 1회이므로 동시성이 낮다
  ultimate_per_cast_max: 320
  telegraph_step_ticks: 2         # 응집은 2틱마다 한 번 (선딜이 6틱이면 3회 = 상대가 셀 수 있다)
  trail_max_points: 12            # 궤적 표본점 상한 — 점당 파티클은 아래 trajectories 가 정한다
  ultimate_ring_points: 8         # 오의 응집 고리의 표본점

# ══════════════════════════════════════════════════════════════════════
#  HUD — 액션바 한 줄의 주인 (B-116)
# ══════════════════════════════════════════════════════════════════════
# 실사용 발견 (2026-07-14): 격 두름·경공의 문구가 다른 글과 겹쳐 읽혔다. 기전 — 액션바는
# 한 줄뿐인데 손이 여럿이었다: 순간 문구를 4틱(0.2초)마다 도는 statusBar 가 곧바로 덮었다.
# 주인 규칙 (HudLine.java — 순수 로직 · tools/HudLineSelfTest.java 가 시험한다):
#   · 순간 사건(판정 flash · 격 태세 전환 · 경공 도약·낙법)은 아래 시간 동안 줄을 갖는다.
#     새 사건이 오면 그 사건이 이긴다 (마지막 사건이 가장 지금이다).
#   · 그 밖에는 statusBar(지속 상태 합성 — 생명 │ 태세 │ 격 │ 내력 │ 경공 │ 발출 │ 오의)가 주인이다.
hud:
  flash_read_ticks: 15            # 0.75초 — 사람이 한 문구를 읽는 최소 시간 (옛 STANCE_READ_TICKS. 이제 여기가 정본)

  # ── 내공/내력 보스바 — XP바에서 이사 (★사용자 확정 2026-07-15) ──
  # 바닐라 XP바는 v3 경험/레벨의 자리다 (cultivation_v3_levels.md §4-b). XP바에 세 들어 살던
  # 내공(레벨 숫자)·내력(게이지)이 이 보스바로 온다. 문구·색·구간 전부 여기가 정본 —
  # 코드(EnergyBossBar.java)는 이름을 옮길 뿐이다. 틀린 이름이면 채널을 안 열고 소리낸다.
  energy_bossbar:
    # 자리끼움 셋: {내력} {내력최대} {내공} — 어휘는 기존 화면에서 옮김:
    #   내력 n/n = 액션바 energySeg (SkillHud.statusBar) · /혼천 운기 "내력 n → n/n"
    #   내공 n   = /혼천 경지 "내공 n / 내력 n" (내공 숫자는 정수 화후 단계만 — 옛 XP바 레벨과 같은 자)
    # 【어휘 후보 — 사용자 다듬기 대상】 (보스바 제 문구는 전례가 없어 최소 구성으로 세웠다)
    title: "내력 {내력}/{내력최대} · 내공 {내공}"
    color: BLUE                   # 평시 — ★사용자 확정: 파랑 (BLUE·GREEN·PINK·PURPLE·RED·WHITE·YELLOW)
    depleted_color: RED           # 고갈(SkillEngine.isDepleted) — ★사용자 확정: 빨강
    overlay: PROGRESS             # 구간 없는 연속 게이지 (PROGRESS·NOTCHED_6·NOTCHED_10·NOTCHED_12·NOTCHED_20)
    depleted_suffix: " (고갈 −2)"  # 액션바의 고갈 꼬리를 그대로 옮김 (internal_energy.yml depleted.state "내공 고갈 (판정 -2)")

# ══════════════════════════════════════════════════════════════════════
#  파티클 팔레트 — 【팩 담당에게 넘기는 목록】
# ══════════════════════════════════════════════════════════════════════
# 우리가 쓰기로 한 바닐라 파티클은 이 13종뿐이다. 팩은 이 13장의 텍스처만 수묵으로 다시 그리면 된다.
# (여기 없는 파티클을 코드가 쓰면 motion_audit 이 위반으로 잡는다 — 팩이 못 따라간 획은 없어야 한다)
palette:
  smoke:          { ink: 담묵, 뜻: "먹의 번짐 — 외공·기 소산·다운캐스트. '저 자의 내력이 다했다'" }
  crit:           { ink: 농묵, 뜻: "먹점 — 타격의 착지. 발경의 알갱이" }
  sweep_attack:   { ink: 획,   뜻: "한 획 — 검·도의 벤 자리 (호 궤적의 마침표)" }
  cloud:          { ink: 비백, 뜻: "마른 붓 자국 — 헛손질·보법 잔상·돌진의 꼬리" }
  electric_spark: { ink: 세필, 뜻: "날에 서린 서슬 — 검기" }
  end_rod:        { ink: 백호, 뜻: "흰 획 — 강기·호신강기·어검·심검·오의. 격의 상단" }
  enchanted_hit:  { ink: 점획, 뜻: "찌름의 점 — 창·봉·암기·화살의 직선" }
  explosion:      { ink: 파묵, 뜻: "터진 먹 — 강기의 관통·오의의 파열 (개당 1개만)" }
  flash:          { ink: 여백, 뜻: "빈 자리 — 오의 개시의 한 순간 (개당 1개만)" }
  item:           { ink: 파편, 뜻: "부러진 병기의 조각 (아이템 데이터 필요)" }
  crimson_spore:  { ink: 혈점, 뜻: "【채색 예외】 마공의 붉은 점 — 흡성·약탈. 예외가 곧 정보다" }
  soul:           { ink: 그림자, 뜻: "은신·암살 — 귀식술·무영비수. 기가 아니라 없음" }
  ash:            { ink: 재,   뜻: "독·취기 — 칠보독장·취팔선보" }
  happy_villager: { ink: 자,   뜻: "【디버그 예외 — 세계의 먹이 아니다】 판정의 눈이 히트박스를 재는 자(尺). 켠 사람에게만 보인다" }
  # 【2026-07 신설】 색을 가진 티끌 — 색은 코드가 아니라 아래 inks 등록부가 준다 (바닐라 DUST 는 RGB 를 받는다).
  # 이 한 장으로 회백 잔상·청회 검기·청록 강기·옥빛 어검·청백 폭발을 전부 그린다 — 팩이 구울 텍스처는 여전히 한 장이다.
  dust:           { ink: 채색, 뜻: "색을 가진 티끌 — inks 등록부가 색을 준다 (팔레트는 안 늘고 색만 는다)" }

# ══════════════════════════════════════════════════════════════════════
#  먹빛(墨色) — 색의 등록부 【사용자 지시 2026-07】
# ══════════════════════════════════════════════════════════════════════
# 사용자가 정한 색상 원칙을 **그대로** 옮긴다 (코드가 색을 지어내지 않는다):
#   기본       = 먹색 · 회백색
#   중급 포인트 = 청회색 · 푸른 잿빛
#   상급 포인트 = 청록색 · 옥색 · 백색
#   금지       = 형광 핑크 · 네온 보라 · 과도한 노랑 · SF 같은 발광
#
# rgb  — DUST 파티클의 색 (0~255).  size — 티끌의 크기 (바닐라 기본 1.0)
# 【검수】 motion_audit 축 ⑦ 이 여기 등록된 모든 색을 forbidden 규칙으로 잰다.
#   등록되지 않은 색을 코드가 쓰면 축 ⑥(하드코딩 금지)이 잡고, 등록했는데 금지색이면 축 ⑦ 이 잡는다.
inks:
  먹:   { rgb: [46, 49, 54],    size: 1.00, 뜻: "농묵 — 쇠가 지나간 자리. 빛나지 않는다 (외공기)" }
  회백: { rgb: [178, 181, 178], size: 0.90, 뜻: "회백색 잔상 — 발경까지의 잔상은 색이 아니라 **재**다" }
  청회: { rgb: [124, 143, 152], size: 1.00, 뜻: "청회색·푸른 잿빛 — 중급(검기)의 포인트. 먹빛 획 위의 얇은 테두리" }
  청록: { rgb: [82, 158, 146],  size: 1.10, 뜻: "청록색 — 상급(강기)의 포인트. 청록산수의 그 청록이다" }
  옥:   { rgb: [166, 214, 199], size: 1.00, 뜻: "옥색 — 어검. 청록보다 맑고 옅다 (기가 쇠를 떠났다)" }
  청백: { rgb: [226, 240, 238], size: 0.90, 뜻: "청백색 — 심검·오의의 폭발. 흰빛에 푸른 기가 남는다" }
  혈:   { rgb: [138, 38, 42],   size: 1.00, 뜻: "【채색 예외】 마공의 혈점 — 예외가 곧 정보다 (crimson_spore 와 같은 뜻)" }

# 【금지색】 색 자체를 금하지 않는다. **서양 판타지의 발광**을 금한다 (사용자: "형광 네온·보라/핑크 금지").
#   hue  — HSV 색상환의 각(도). from~to 안에 들면 위반
#   chroma_max — max(R,G,B) − min(R,G,B). 이 값을 넘으면 '형광'이다 (원색에 가깝다)
#   exempt — 소리내어 청구한 면제. **은닉이 아니다** (혈점은 규약이 인정한 유일한 채색 예외다)
inks_forbidden:
  hues:
    - { from: 265, to: 345, name: "네온 보라 · 형광 핑크 — 서양 판타지의 발광" }
    - { from: 38,  to: 68,  name: "과도한 노랑 — 금빛 이펙트는 이 세계의 것이 아니다" }
  chroma_max: 130                 # 혈(138−38 = 100) 이 이 아래다. 원색(255,0,0 = 255)은 여기서 걸린다
  exempt: [혈]                    # 마공의 붉은 점 — hue 358° · chroma 100 (규칙 안이지만 **명시**해 둔다)

# ══════════════════════════════════════════════════════════════════════
#  격(格)의 사다리 — 팩 없이 읽히는 첫 번째 축
# ══════════════════════════════════════════════════════════════════════
# 【불변식 ㄷ】 rank 가 오르면 brightness · charge.count · impact.count · aura.count 가 **전부** 커진다.
# 상대가 알아야 하는 것은 하나다: "지금 저것이 나보다 위인가 아래인가."
#   숫자를 못 세어도 밝기와 밀도로 안다 — 외공(먹점 4개)과 강기(흰 획 18개)는 착각할 수 없다.
#
# ─── 【2026-07 — 사용자 지시로 새로 붙은 세 칸】 ───
#   echo   회백 잔상 — 획이 지나간 자리에 남는 **잔상**. 격이 오를수록 잦고 색이 오른다
#          (외공기 회백 → 검기 청회 → 강기 청록 → 어검 옥 → 심검 청백)
#   haze   먼지 · 바람결 · **먹번짐** — 초급의 "발광 거의 없음"을 지키는 자.
#          외공·발경은 smoke(담묵)로 번지고, 검기 위로는 cloud(비백·기류)가 된다
#   burst  **타격 순간의 작은 폭발형 입자** — 사용자가 이름을 대어 청구한 것.
#          타격점 예산은 안 늘었다: 먹점(impact)에서 갈라 왔다 (budget 절의 표 참조)
#
#   ★ 이번 바퀴(1차 MVP)는 **양 끝**이다: 외공기·발경의 수묵 강화 + 오의의 화려함.
#     가운데 넷(검기~심검)의 echo/haze/burst 는 **사다리가 거짓말하지 않도록 얕게** 세웠다 —
#     반월형 검기 궤적·문파별 색 분화는 2차의 몫이다 (이 주석을 지우는 날이 그때다).
grades:
  외공기:
    rank: 0
    brightness: 0                 # 검산용 — 시각 등급 (단조 증가해야 한다)
    color: GRAY                   # 액션바 색 (ChatColor 이름 — 무채색 계열이 원칙)
    charge:  { particle: smoke, count: 0, spread: 0.00, extra: 0.00 }   # 응집이 없다 (예고할 격이 없다)
    aura:    { particle: smoke, count: 0, spread: 0.00, extra: 0.00 }   # 두름이 없다
    impact:  { particle: crit,  count: 4, spread: 0.15, extra: 0.05 }
    accent:  { particle: null,  count: 0 }
    trail:   { particle: cloud, per_point: 1 }
    echo:    { particle: dust, ink: 회백, count: 3, spread: 0.18, extra: 0.00 }   # 회백 잔상 — 먹빛 획의 뒤끝
    haze:    { particle: smoke, count: 2, spread: 0.12, extra: 0.01 }             # 약한 먼지 · 먹번짐
    burst:   { particle: dust, ink: 먹, count: 2, spread: 0.14, extra: 0.06 }     # 먹점이 튄다 — **발광 없음**
    sounds:
      charge: []
      arm:    []
      impact: [{ key: "entity.player.attack.strong", volume: 0.8, pitch: 1.0 }]

  발경:
    rank: 1
    brightness: 1
    color: WHITE
    charge:  { particle: crit, count: 3, spread: 0.10, extra: 0.01 }
    aura:    { particle: crit, count: 1, spread: 0.08, extra: 0.00 }    # 태세 잔광 — 켜져 있다는 사실이 정보다
    impact:  { particle: crit, count: 8, spread: 0.25, extra: 0.15 }
    accent:  { particle: sweep_attack, count: 1 }                        # 짧은 충격파 — 기가 몸 안에서 터진다
    trail:   { particle: crit, per_point: 1 }
    echo:    { particle: dust, ink: 회백, count: 4, spread: 0.20, extra: 0.01 }   # 잔상이 둘~셋 겹친다
    haze:    { particle: smoke, count: 2, spread: 0.14, extra: 0.01 }
    burst:   { particle: dust, ink: 회백, count: 4, spread: 0.18, extra: 0.08 }   # 기가 몸 안에서 터진 자리
    sounds:
      charge: [{ key: "block.amethyst_block.chime", volume: 0.6, pitch: 1.4 }]
      arm:    [{ key: "item.trident.riptide_1", volume: 0.8, pitch: 1.5 }]
      impact: [{ key: "entity.player.attack.knockback", volume: 0.9, pitch: 0.9 },
               { key: "block.anvil.land", volume: 0.35, pitch: 1.8 }]

  검기:
    rank: 2
    brightness: 2
    color: GRAY                   # 액션바는 무채 그대로 — 색이 오르는 것은 **획과 파티클**이다
    charge:  { particle: electric_spark, count: 4, spread: 0.12, extra: 0.01 }
    aura:    { particle: electric_spark, count: 3, spread: 0.10, extra: 0.00 }
    impact:  { particle: electric_spark, count: 10, spread: 0.30, extra: 0.05 }
    accent:  { particle: end_rod, count: 5 }                             # 날에 서린 기운이 살을 가른다
    trail:   { particle: electric_spark, per_point: 2 }
    echo:    { particle: dust, ink: 청회, count: 5, spread: 0.22, extra: 0.01 }   # ★ 여기서부터 색이 든다 (청회·푸른 잿빛)
    haze:    { particle: cloud, count: 3, spread: 0.20, extra: 0.01 }             # 먼지가 아니라 **기류**가 된다
    burst:   { particle: dust, ink: 청회, count: 5, spread: 0.22, extra: 0.10 }
    sounds:
      charge: [{ key: "block.amethyst_block.chime", volume: 0.7, pitch: 1.4 }]
      arm:    [{ key: "item.trident.riptide_1", volume: 0.8, pitch: 1.2 }]
      impact: [{ key: "item.trident.throw", volume: 0.8, pitch: 1.5 }]

  강기:
    rank: 3
    brightness: 3
    color: WHITE
    charge:  { particle: end_rod, count: 5, spread: 0.14, extra: 0.02 }
    aura:    { particle: end_rod, count: 5, spread: 0.12, extra: 0.00 }
    impact:  { particle: end_rod, count: 12, spread: 0.35, extra: 0.06 }
    accent:  { particle: explosion, count: 1 }                           # 터지는 것이 아니라 뚫는다
    trail:   { particle: end_rod, per_point: 2 }
    echo:    { particle: dust, ink: 청록, count: 6, spread: 0.26, extra: 0.01 }   # 청록 — 청록산수의 그 색
    haze:    { particle: cloud, count: 3, spread: 0.24, extra: 0.01 }
    burst:   { particle: dust, ink: 청록, count: 8, spread: 0.26, extra: 0.12 }
    sounds:
      charge: [{ key: "block.beacon.power_select", volume: 0.7, pitch: 0.6 }]
      arm:    [{ key: "block.conduit.activate", volume: 0.8, pitch: 0.7 }]
      impact: [{ key: "block.conduit.activate", volume: 0.9, pitch: 1.2 }]

  어검:
    rank: 4
    brightness: 4
    color: WHITE
    charge:  { particle: end_rod, count: 6, spread: 0.16, extra: 0.02 }
    aura:    { particle: end_rod, count: 7, spread: 0.14, extra: 0.01 }
    impact:  { particle: end_rod, count: 13, spread: 0.40, extra: 0.08 }
    accent:  { particle: explosion, count: 1 }
    trail:   { particle: end_rod, per_point: 2 }
    echo:    { particle: dust, ink: 옥, count: 7, spread: 0.30, extra: 0.01 }     # 옥빛 — 기가 쇠를 떠났다
    haze:    { particle: cloud, count: 4, spread: 0.28, extra: 0.01 }
    burst:   { particle: dust, ink: 옥, count: 10, spread: 0.30, extra: 0.14 }
    sounds:
      charge: [{ key: "block.beacon.power_select", volume: 0.8, pitch: 0.5 }]
      arm:    [{ key: "block.conduit.activate", volume: 0.9, pitch: 0.6 }]
      impact: [{ key: "block.beacon.activate", volume: 0.9, pitch: 1.4 }]

  심검:
    rank: 5
    brightness: 5
    color: WHITE
    charge:  { particle: end_rod, count: 7, spread: 0.18, extra: 0.02 }
    aura:    { particle: end_rod, count: 9, spread: 0.16, extra: 0.01 }
    impact:  { particle: end_rod, count: 14, spread: 0.45, extra: 0.08 }
    accent:  { particle: flash, count: 1 }                               # 형(形)이 사라진다 — 빈 자리만 남는다
    trail:   { particle: end_rod, per_point: 2 }
    echo:    { particle: dust, ink: 청백, count: 8, spread: 0.34, extra: 0.02 }   # 사다리의 꼭대기 — 청백의 다중 잔상
    haze:    { particle: cloud, count: 4, spread: 0.32, extra: 0.01 }             # 운무가 몸을 두른다
    burst:   { particle: dust, ink: 청백, count: 11, spread: 0.34, extra: 0.16 }  # 타격점 총합 = 14+1+11+4 = 30 (상한)
    sounds:
      charge: [{ key: "block.beacon.power_select", volume: 0.9, pitch: 0.5 }]
      arm:    [{ key: "block.conduit.activate", volume: 1.0, pitch: 0.5 }]
      impact: [{ key: "block.beacon.activate", volume: 1.0, pitch: 1.7 }]

# ══════════════════════════════════════════════════════════════════════
#  무기 오라 — 손에 든 병기 둘레를 도는 기운 (마크에이지 "간지 마검" 참조)
# ══════════════════════════════════════════════════════════════════════
# 격(두름)과 다르다: 격은 내력을 실은 태세다(grades[].aura — 발출·발경으로 켠다). 무기 오라는
# **병기 자체의 격**이 손에 쥐어져 있는 것만으로 상시 서리는 연출이다 — 순수 VFX(판정 불변).
#   ① 결정 조각(shard) = 계열 악센트색의 dust — 검 둘레를 **소용돌이**로 돈다
#      (팩이 이 dust 를 청록 결정 텍스처로 다시 그린다 — 레퍼런스의 청록 결정 조각)
#   ② 흰 반짝이(spark) = end_rod — 검 둘레를 **떠도는 흰 별** (레퍼런스의 4각 반짝이)
# 등급 사다리(불변식 ㄷ — 단조 증가): 범철=없음 → 정련 희미 → 보병 → 신병 또렷 → 마병 검붉은 격렬.
# 계열/명병 색: 검=옥(청록) · 도=혈(진홍) · 명병=문파색(2차 — myeong 에 등록되면 계열색을 덮는다).
# 규율: 코드에 파티클·색 하드코딩 금지 — 이 절이 정본. 발행은 SkillHud 예산 게이트를 그대로 탄다
#       (per-view 600/틱 · 전역 4000/틱 · LOD 16m/32m · cull 32m). 밀도는 성기게 (레퍼런스도 성기다).
weapon_aura:
  enabled: true                 # 전역 스위치 — false 면 한 발도 안 뿌린다 (설정으로 on/off · 판정 불변)
  interval_ticks: 3             # 몇 틱마다 한 바퀴 (throttle) — 4틱 HUD 루프와 어긋나게 3으로 둔다
  orbit_speed: 0.22             # 위상 증가/틱 — 소용돌이 회전 속도 (rad)
  radius: 0.30                  # 궤도 반경 (병기 둘레, m) — held·작은 아이템 기준. 큰 전시는 aura_scale 배
  helix: 0.15                   # ★세로 나선 폭 — held·작은 대상 기준(낮게). **큰 대상은 aura_scale 에 비례**해
                                #   커진다(코드가 helix × aura_scale). 0.9 는 held 에 너무 높이 솟았다 → 낮춘다.
                                #   큰 전시 기둥을 더 높이려면 weapon_stand/dropped_display.aura_scale 를 올려라
  # ── ★영상 정합 우선: 떨어진/세워진 아이템 엔티티 오라 (검을 땅에 두면 그 둘레를 돈다) ──
  dropped: true                 # 월드의 dropped Item(그리고 ItemDisplay) 순회 on/off
  dropped_rise: 0.25            # 아이템 위치에서 궤도 중심을 올리는 값 (아이템은 지면에 낮게 뜬다)
  include_displays: true        # ItemDisplay 도 순회한다 (우리 VFX 엔티티 honcheon:vfx 는 제외)
  # ── 부차: held(든 무기) 곁 — 실제 렌더되는 우하단 손 자리. 1인칭 정면을 안 가린다 ──
  held: true                    # 든 무기 오라 on/off
  held_interval_ticks: 1        # ★든 무기는 매 틱 발행 — 걸을 때 파티클이 검에서 벗어났다 붙는 끊김을 없앤다
                                #   (파티클은 월드 정지라 뒤처진다. 촘촘히 뿌려 항상 손 곁에 있게. 주기 촘촘 →
                                #    발행당 수는 held_interval/interval 비율로 줄여 총량을 맞춘다 — 예산 균형)
  held_forward: 0.45            # 눈에서 앞으로 (손이 화면에 나오는 깊이)
  held_right: 0.32              # 시선의 오른쪽으로 (오른손 자리)
  held_down: 0.30               # 눈에서 아래로 (우하단 손 높이)
  # ── 파티클 종류·크기 ──
  # 【판단 — 레퍼런스 청록 결정에 무엇이 가까운가】 dust vs electric_spark:
  #   레퍼런스 조각은 **계열색(검=청록 · 도=진홍)** 을 띤다 — 계열색은 이 병기 체계의 핵심 축이다.
  #   electric_spark(1.21 청백 전격)는 **색을 못 입힌다**(고정 청백) → 도(진홍)·마병(검붉음)을 못 그린다.
  #   그래서 기본은 **dust**(계열색 그대로 · 크기를 줄여 뭉치를 없앤다). 결정의 **각진 모양**은 팩이
  #   이 dust 를 결정 텍스처로 다시 그리는 몫이다. electric_spark 는 선택지로 열어 둔다(색 포기 · 전격 느낌).
  shard_particle: dust          # 결정 조각 — dust(계열색) 기본 · 대안: electric_spark(색 없음·전격)
  spark_particle: end_rod       # 흰 반짝이 — 떠도는 별 (palette.end_rod — 색 데이터 없음)
  shard_size: 0.7               # ★결정 크기 (dust size) — 1.0 은 뭉치로 크다. 0.7 로 작게 (실측 다듬기)
  spark_size: 0.6               # 반짝이 크기 — dust 계열 spark 에만 걸린다(end_rod 는 고정 크기라 무시)
  shard_spread: 0.02
  spark_spread: 0.03
  spark_radius_mul: 1.3         # 반짝이는 결정보다 조금 바깥을 떠돈다
  # ── 계열 악센트색 (결정 조각의 먹빛 — inks 의 등록된 이름만) ──
  series:
    검: { ink: 옥 }              # 옥(166,214,199) — 청록산수의 그 옥빛 (레퍼런스의 청록 결정)
    도: { ink: 혈 }              # 혈(138,38,42) — 도의 살기 (채색 예외색이되 여기선 병기색이다)
  # ── 명병 문파색 (계열보다 우선 · 2차) — 등록된 문파만 계열색을 덮어쓴다. 지금은 비어 있다 ──
  myeong: {}
  # ── 등급 사다리 (shards·sparks 는 rank 를 따라 단조 증가) ──
  grades:
    범철:  { shards: 0, sparks: 0, spark_every: 0 }                 # 오라 없음 — 첫 병기엔 기운이 서리지 않는다
    정련:  { shards: 2, sparks: 0, spark_every: 0 }                 # 희미 — 날 둘레에 옅게만
    보병:  { shards: 6, sparks: 1, spark_every: 4 }                 # 또렷해지기 시작 (반짝이 드물게)
    신병:  { shards: 10, sparks: 2, spark_every: 2 }                 # 또렷 — ★파일럿 기준
    마병:  { shards: 13, sparks: 3, spark_every: 2, ink: 혈 }        # 검붉은 격렬 — 계열색을 혈로 덮는다

# ══════════════════════════════════════════════════════════════════════
#  전용 검기(劍氣) 평타 — 크고 선명한 초록 초승달 검기 V1 【레퍼런스: 마크에이지】
# ══════════════════════════════════════════════════════════════════════
# 【문제】 기존 무협 참격(display.slash → 참격_호_검기)은 획을 몸 앞 0.85m 에 **작게·짧게** 그린다.
#   레퍼런스는 다르다: 크고 선명한 **초록 초승달**이 스윙 궤적을 따라 **몸을 감싸며 크게 휩쓸고**,
#   흰 별(4점) 반짝이가 성기게 터진다. 그래서 호 계열 평타의 획을 **이 검기로 대체**한다.
#
# 【코드가 읽는 자리】 SkillEngine.kigiSlash(등록부 판독) · SkillListener.spawnKigiSlash(발행) ·
#   SkillDisplay.kigiSlash(ItemDisplay 소환·slerp). 모든 시각 파라미터는 **여기서 읽는다** —
#   조율자가 재빌드 없이 값만 바꿔 인게임 스크린샷으로 scale/sweep/tilt 를 반복 조율한다 (하드코딩 금지).
#
# 【가역】 enabled: false 로 두면 한 획도 안 그리고 기존 무협 참격이 그대로 돌아온다.
#   기존 자산(honcheon:kigi/arc1|2|3 텍스처·참격_호_검기1/2/3 모델)을 **재사용**한다.
#
# ★【스윙 동기화 · 2026-07-19】 검기의 3단계는 **텍스처 애니가 아니라 모델 교체**다.
#   MC 의 .mcmeta 텍스처 애니는 **전역 시계**로 돈다 — 모든 인스턴스가 월드 틱에 맞춰 동시에 같은
#   프레임을 본다. 그래서 소환 순간의 프레임이 스윙마다 제각각이었고 1→2→3 이 스윙과 전혀
#   동기화되지 않았다 (사용자 실측: "검기 프레임이 전혀 반영이 안 된다").
#   ⇒ 이제 단계마다 **제 텍스처를 문 모델**이 있고(kigi/arc1|2|3 · 정사각 단일 프레임 · mcmeta 없음),
#     SkillDisplay 의 중앙 티커가 frame_ticks 마다 그 ItemDisplay 의 아이템을 다음 단계로 갈아끼운다.
#     공전 보간(translation/rotation)·크기·파티클·수축은 **한 글자도 안 건드린다** — 모델만 바뀐다.
kigi_slash:
  enabled: true
  # ★ 매체 축 (재설계 v2 · 2026-07-21 사용자 확정): 일반 무기 = particle.
  #   plate | model3d 는 보스몹·특수 무기가 그 효과만 갈아탈 교체 지점 — 코드·자산 유지.
  medium: particle
  # ── 파티클 띠 (docs/design/kigi_particle_v2.md · 야마토 실측 대역) ──
  band_width: 0.6       # 띠 폭(m) — 날에서 안쪽으로
  band_rows: 5          # 몸 줄 수 (청백 날·먹 안감은 자동으로 얹힌다)
  band_jitter: 0.10     # 두께 지터(m) — 그레인 입체감
  band_sweep_ticks: 4   # 스윕 틱 (~200ms 급상승 — 잔류·소멸은 파티클 수명이 맡는다)
  accent_count: 12      # 흰 별(end_rod) — 머리 구간에만
  model: "honcheon:kigi/press_a1"  # 소환 시 1단계 = frame_models[0] 의 key (계약: 코드가 목록을 우선한다)
  # ★단계 모델 — 이 순서대로 갈아끼운다. 이름은 display.models 의 **등록 이름**이다 (key 가 아니다).
  #   비우거나 1개만 적으면 교체가 꺼지고 model 하나로 고정된다 (가역).
  # ★ 원형(archetype) 축 — trail(호) 축과 분리 (검토 P0). 호를 쓰는 부(도끼)·월아산은 못 받는다.
  apply_to_classes: [검, 도]
  frame_models: [검압_내려1, 검압_내려2, 검압_내려3]      # A: 피크 → 절단 통과 → 붕괴
  frame_models_b: [검압_올려1, 검압_올려2, 검압_올려3]    # B: 올려베기 — alternate 가 스윙마다 A/B 교대
  frame_ticks: 2  # 버스트 문법 시험 — 즉시 최대(3단계)로 시작 → 잔상 → 스러짐
  apply_to_trails: [호]            # 이 basic trail 무기에만 (호=검·도·부·겸·월아산 sweep)
  replace_stroke: true             # 이 무기의 기존 무협 display.slash 아크를 억제(안 그림) + 궤적 파티클도 억제
  plate: true  # 판(ItemDisplay)을 그린다 — 5프레임의 몸 (테스트 조율값 동기화)
  # ★ 공전(公轉) — 초승달의 **자리 자체가 몸 주위를 돈다** (레퍼런스: 오른쪽 아래 → 몸을 감으며 → 왼쪽).
  #   예전엔 정면 한 자리에 붙박여 자전만 했다("정면에서 본 반원") — 그것이 유일한 결함이었다.
  scale: 6.5  # 초승달 크기(대략 m) — 크게, 3인칭에서 잘 보이게
  center_height: 1.1  # 발바닥에서 **공전 중심** 높이(m) — 몸의 중심
  orbit_radius: 1.8  # 띠 반경(m) — 야마토 실측 고리 지름 ~4m 대역  # ★공전 반경(m) — 몸 중심에서 초승달까지. 크면 크게 돈다
  # ★ 몸 둘레를 도는 호 (EffectLib 기하) — 비우면 안 그린다 (판만으로 간다).
  #   판이 못 푸는 **등 뒤**를 점으로 메운다 (실측 47px → 3,936px).
  #   색은 등록부의 격 사다리를 따른다 — 검기는 청회다 (연두 아니다).
  # ★ 3D 리본 (BetterModel · D) — 이름이 있으면 판·점보다 먼저 선다. 없으면 판·점 (가역).
  model3d: ""          # ★2026-07-21 사용자 확정: 2D 5프레임으로 간다 — 리본은 쉼 (kigi_arc 로 되살림 가능)
  model3d_anim: grow
  model3d_up: 0.5      # ★리본 자리를 가슴에서 올림(m) — 재적재로 쓴다
  model3d_yaw: 0.0     # ★방향 회전(도)
  model3d_pitch: 0.0   # ★기울기 회전(도)
  geom_particle: dust   # 띠의 입자 (재설계 v2 — 띠가 주인공이 됐다)
  geom_ink: 청회
  geom_step_deg: 1.2   # ★점 간격(도) — 작을수록 촘촘. 6도는 「티끌」로 읽혔다
  geom_sweep_deg: 130   # ★호가 무는 각 — 판의 sweep_deg 와 다른 값이다

  forward: 0.0  # 공전 중심을 앞으로 미는 값(m). 0 이면 몸 한복판이 중심
  sweep_deg: 0  # ★공전 호각 — 몸 주위를 도는 총 각(시작→끝, 클라이언트가 보간). 레퍼런스는 크게 돈다
  tilt_deg: 50  # ★공전면의 기울기 — 수평 궤도를 앞축 둘레로 눕힌다(대각 내려베기). 0 이면 순수 수평 공전
  roll_deg: 180  # 초승달을 제 평면 안에서 돌리는 정적 롤 오프셋(배가 위/아래)
  # ★ 날의 눕힘 — 접선축 기준(2026-07-20 · 사용자 실측: \"아치가 위아래를 보고 있다\").
  #   90 = 판이 누워 **볼록한 바깥이 정면**을 보고 오목한 안쪽이 플레이어를 감싼다 (횡베기).
  #    0 = 판이 세로로 서서 ∩ 의 배가 하늘을 본다 (그 버그의 자세).
  blade_pitch_deg: -45
  draw_ticks: 6  # 휩쓰는(도는) 시간 — 이 틱 동안 공전 시작→끝을 보간 (= 5단계 × frame_ticks 2)
  fade_ticks: 2  # 사라지는 시간(꼬리부터 수축)
  billboard: FIXED                 # 세운 채 고정 (획에는 방향이 있다)
  alternate: true                  # 스윙마다 좌↔우 방향 번갈아(레퍼런스 "한 세트 더")
  brightness: 15                   # 발광(full-bright · block_light = sky_light = 이 값)
  spark:
    particle: firework  # 흰 별/반짝(깔끔한 흰색). 대안: firework
    count: 0  # 아크를 따라 뿌리는 흰 별 개수 — 5프레임 평가 동안 쉼 (표본점당 1개)
    spread: 1.3  
    speed: 0.02
    along_arc: true                # 아크 궤적을 따라 뿌림(그리는 시간에 갈라 뿌린다)
  calm_held_aura: true             # 이 무기를 들었을 때 weapon_aura 의 held 방출을 억제 — 장면을 깨끗하게 (가역)

# ══════════════════════════════════════════════════════════════════════
#  병기 전시대 — 든 병기를 땅에 크게 세운다 (★영상 정합: 땅에 박힌 큰 검 + 오라)
# ══════════════════════════════════════════════════════════════════════
# `/혼천 병기전시` — 든 혼천 병기를 앞 지면에 **크게 세운 ItemDisplay** 로 박는다 (스케일 ≈3.5배).
#   빈손으로 다시 부르면 가까운 제 전시대를 **회수**한다 (병기가 인벤토리로 돌아온다).
# 전시대는 우리 VFX(honcheon:vfx)가 아니라 실물 병기의 ItemDisplay라, weapon_aura.dropped 순회가
#   자동으로 그 둘레에 오라를 두른다 (큰 검이라 aura_scale 로 반경을 키운다). 판정 불변 · 순수 전시.
# 【실측 다듬기】 회전(rot_*)은 검 모델을 곧추 세우는 값이라 **인게임에서 눈으로 맞춘다** (재컴파일 없이 config).
# ── 떨어뜨린 병기 자동 확대 (드롭 → 큰 디스플레이) ──
# 바닐라 dropped Item 은 렌더 크기가 고정이라 작다. 혼천 병기를 땅에 버리면 그 작은 아이템을 **치우고**
#   같은 자리에 **큰 ItemDisplay** 를 세워 크게 보이게 + 오라가 둘레를 돈다 (전시대와 코드 공유).
#   병기는 절대 안 잃는다: 디스플레이가 실물 병기를 품고(setPersistent) 재기동에도 살아남으며, 다가가면
#   인벤토리로 돌아온다(줍기 복원). 수명은 바닐라 드롭 despawn(5분)과 정합 — 그때 디스플레이도 정리한다.
dropped_display:
  enabled: true                 # 드롭 자동 확대 on/off (끄면 작은 바닐라 아이템에 오라만 두른다 — 옛 동작)
  scale: 1.2                    # 일반 무기 크기 (땅에 눕힘 — 바닐라 드롭보다 크지만 전시대처럼 거대하진 않게)
  rot_x: 0                      # 세우는 회전 — 전시대와 동일(자루 위·칼끝 아래). ★인게임 다듬기 대상
  rot_y: 0
  rot_z: 0                      # 눕힘(수평) — 땅에 꽂지 않는다 (사용자: 일반 무기 크기로 바닥에)
  rise: 0.18                    # 지면 바로 위 (눕힌 무기)
  pickup_radius: 1.6            # 이 반경에 플레이어가 들면 병기가 인벤토리로 돌아오고 디스플레이 제거
  lifetime_seconds: 300         # 바닐라 드롭 despawn 5분 정합 — 이 시간 뒤 디스플레이 정리(병기 사라짐). 0 = 안 사라짐
  aura_scale: 1.1               # 작은 눕힌 무기에 비례
  aura_center_rise: 0.3         # 눕힌 무기 높이

weapon_stand:
  enabled: true                 # 전역 스위치
  scale: 3.5                    # 병기 크기 배율 (영상의 큰 검)
  rot_x: 0                      # 세우는 회전 (오일러 도) — 검 모델의 대각을 수직으로. ★인게임 다듬기 대상
  rot_y: 0
  rot_z: 90
  rise: 1.4                     # 지면에서 띄우는 중심 높이 (스케일 큰 모델이 땅에 박혀 보이게)
  retrieve_radius: 4.0          # 빈손 호출 시 이 반경 안의 제 전시대를 회수
  aura_scale: 2.8               # 전시대 오라 반경·나선 배율 (큰 검을 감싸도록 — dropped 일반 아이템은 1.0)
  aura_center_rise: 1.5         # 오라 기둥의 중심 높이 (검 몸통을 감는다)

# ══════════════════════════════════════════════════════════════════════
#  형태(形) — qi_manifestation.yml forms 의 6개 잎 전수 (두름 · 쏨 · 두름_몸 · 부림)
# ══════════════════════════════════════════════════════════════════════
# 팩 없이 읽히는 두 번째 축: **응집(선딜) vs 발출(쏨) vs 두름(근접타)** 이 서로 달라야 한다.
#   응집 — 기가 손끝으로 **모인다** (제자리, 2틱마다, 소리 있음) → 보고 물러설 수 있다
#   두름 — 잔광이 **머문다** (라운드마다, 손끝, 소리 없음) → 켜져 있다는 사실만 알린다
#   발출 — 기가 **날아간다** (직선 궤적 8m, 큰 소리) → 몸을 빼는 것 말고는 답이 없다
forms:
  검기_두름:
    kind: 두름
    grade: 검기
    aura_from_grade: true         # 잔광 = grades.검기.aura (한 곳에서만 정의한다)
    on_sustain_sound: []          # 두름은 소리로 알리지 않는다 — 잔광만이 정보다 (소리는 응집의 몫)

  검강_두름:
    kind: 두름
    grade: 강기
    aura_from_grade: true
    on_sustain_sound: []

  검기_참격:
    kind: 쏨
    grade: 검기
    trail: 선                     # skill_mechanics hitbox 와 같은 모양 (qi_manifestation forms.쏨.hitbox: 선)
    length: 8.0
    width: 1.5
    frames: [8, 2, 12]            # 코드 폴백(DEFAULT_SHOT_FRAMES)을 등록부로 끌어올린다
    cooldown_ticks: 40
    charge:  { particle: electric_spark, count: 5, spread: 0.14, extra: 0.02 }
    beam:    { particle: electric_spark, per_point: 2 }
    burst:   { particle: end_rod, count: 8, spread: 0.25, extra: 0.05 }
    sounds:
      charge: [{ key: "block.amethyst_block.chime", volume: 0.8, pitch: 1.6 }]
      release: [{ key: "item.trident.throw", volume: 1.0, pitch: 0.8 }]

  강기_포:
    kind: 쏨
    grade: 강기
    trail: 선
    length: 8.0
    width: 1.5
    frames: [8, 2, 12]
    cooldown_ticks: 40
    charge:  { particle: end_rod, count: 6, spread: 0.16, extra: 0.02 }
    beam:    { particle: end_rod, per_point: 2 }
    burst:   { particle: explosion, count: 1, spread: 0.0, extra: 0.0 }
    sounds:
      charge: [{ key: "block.beacon.power_select", volume: 0.9, pitch: 0.5 }]
      release: [{ key: "block.conduit.activate", volume: 1.0, pitch: 0.7 },
                { key: "item.trident.throw", volume: 0.8, pitch: 0.6 }]

  호신강기:
    kind: 두름_몸
    grade: 강기
    # 【읽힘 요건】 "호신강기가 켜져 있다"를 상대가 보고 판단할 수 있어야 한다.
    #   손끝 잔광(두름)과 달리 **몸을 두르는 고리**다 — 실루엣이 다르다. 그것이 형태의 차이다.
    ring: { particle: end_rod, points: 6, radius: 0.9, per_point: 1, height: 1.0 }
    aura: { particle: end_rod, count: 6, spread: 0.45, extra: 0.00 }
    sounds:
      deploy: [{ key: "block.conduit.activate", volume: 0.9, pitch: 0.6 }]

  이기어검:
    kind: 부림
    grade: 어검
    # MVT 미배선 (P5 — 디스플레이 엔티티). 모션만 먼저 등록한다: 등록되지 않은 것은 배선될 수 없다.
    trail: 시
    length: 16.0
    charge:  { particle: end_rod, count: 6, spread: 0.20, extra: 0.02 }
    beam:    { particle: end_rod, per_point: 1 }
    burst:   { particle: end_rod, count: 12, spread: 0.30, extra: 0.05 }
    sounds:
      charge: [{ key: "block.beacon.power_select", volume: 0.9, pitch: 0.4 }]
      release: [{ key: "item.trident.return", volume: 1.0, pitch: 0.8 }]
    mc: "VFX 엔티티 풀 120 · 수명 60틱 (performance.yml vfx_entities) — 파티클 궤적은 폴백"

# ══════════════════════════════════════════════════════════════════════
#  궤적(軌跡) — skill_mechanics.yml 의 히트박스 type 과 1:1
# ══════════════════════════════════════════════════════════════════════
# 【불변식 ㄴ】 여기 키 = hitbox_types [호, 선, 원, 시, 돌, 진] + 비타격형 [태세, 가드태세, 시전]
#   보이는 모양이 맞는 모양이다. 호는 부채꼴로 그리고 부채꼴로 맞는다.
#   points = 표본점 수 (budget.trail_max_points 이하) · phase = 어느 프레임에 그리는가
trajectories:
  호:
    shape: arc                    # 정면 부채꼴 — angle 을 points 로 나눠 훑는다
    points: 7
    phase: active                 # 판정 프레임 — 벤 자리가 남는다
    radius_ratio: 0.8             # 사거리의 80% 반경에 획을 놓는다 (닿는 자리)
    accent_at: mid                # sweep_attack 은 호의 중앙 1개
  선:
    shape: line                   # 시선 방향 직선 — 찌르기·참격·발출
    points: 8
    phase: active
    step: 1.0                     # 1m 간격 표본
    accent_at: end
  원:
    shape: circle                 # 사방 — 매화검법 4타·태극검·매화만개
    points: 12
    phase: active
    radius_ratio: 1.0
    accent_at: center
  시:
    shape: shot                   # 투사체 — 화살·비수. 궤적은 발사점 → 표적선
    points: 10
    phase: active
    step: 2.0                     # 사거리가 길다 (활 40m) — 2m 간격으로 성기게
    accent_at: end
  돌:
    shape: dash                   # 돌진·보법 — 지나온 자리에 잔상이 남는다 (뒤로 그린다)
    points: 6
    phase: active
    step: 0.8
    accent_at: start
  진:
    shape: ring                   # 합격진 — 진주를 중심으로 한 고리 (radius = 진의 반경)
    points: 12
    phase: startup                # 진 전개는 선딜에 보인다 (20틱 — 성원이 자리를 잡을 시간)
    radius_ratio: 1.0
    accent_at: center
  태세:
    shape: aura                   # 몸에 머문다 — 금강부동·귀식술
    points: 4
    phase: active
    radius_ratio: 0.5
    accent_at: center
  가드태세:
    shape: aura                   # 태극권·정심검결 — 패링 창이 열린 동안 몸 앞에 머문다
    points: 4
    phase: active
    radius_ratio: 0.6
    accent_at: center
  시전:
    shape: aura                   # 활인침법 — 비전투 시전 (표적에 머문다)
    points: 4
    phase: startup
    radius_ratio: 0.4
    accent_at: center

# ══════════════════════════════════════════════════════════════════════
#  무기 계열별 모션 — 검은 벤다, 창은 찌른다
# ══════════════════════════════════════════════════════════════════════
# 같은 '호'라도 검의 호와 봉의 호는 다르다: 검은 날이 지나간 자리(sweep_attack)를 남기고,
# 봉은 바람을 밀어낸다(cloud). 같은 '선'이라도 창은 점으로 찌르고(enchanted_hit) 검은 획으로 벤다.
# 키 = skills.yml weapon_classes.registry + 무관 + 짐승(NPC)
weapon_styles:
  검:      { verb: 벤다,   arc: sweep_attack, thrust: sweep_attack,   trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.1 } }
  도:      { verb: 내려벤다, arc: sweep_attack, thrust: sweep_attack, trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 0.9 } }
  창:      { verb: 찌른다, arc: cloud,        thrust: enchanted_hit, trail: enchanted_hit, swing: { key: "item.trident.throw", volume: 0.6, pitch: 1.3 } }
  봉:      { verb: 후려친다, arc: cloud,      thrust: cloud,         trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 0.8 } }
  단검:    { verb: 찌른다, arc: crit,         thrust: crit,          trail: cloud, swing: { key: "entity.player.attack.weak", volume: 0.6, pitch: 1.6 } }
  암기:    { verb: 던진다, arc: enchanted_hit, thrust: enchanted_hit, trail: enchanted_hit, swing: { key: "entity.arrow.shoot", volume: 0.6, pitch: 1.5 } }
  활:      { verb: 쏜다,   arc: enchanted_hit, thrust: enchanted_hit, trail: enchanted_hit, swing: { key: "entity.arrow.shoot", volume: 0.8, pitch: 1.0 } }
  맨손:    { verb: 지른다, arc: crit,         thrust: crit,          trail: cloud, swing: { key: "entity.player.attack.knockback", volume: 0.6, pitch: 1.2 } }
  권갑:    { verb: 지른다, arc: crit,         thrust: crit,          trail: cloud, swing: { key: "entity.player.attack.knockback", volume: 0.7, pitch: 1.0 } }
  겸:      { verb: 걸어벤다, arc: sweep_attack, thrust: crit,        trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.2 } }
  월아산:  { verb: 휘두른다, arc: sweep_attack, thrust: enchanted_hit, trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.7 } }
  구:      { verb: 찍는다, arc: cloud,        thrust: enchanted_hit, trail: cloud, swing: { key: "entity.player.attack.crit", volume: 0.7, pitch: 0.9 } }
  중병기:  { verb: 짓뭉갠다, arc: cloud,      thrust: cloud,         trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 1.0, pitch: 0.6 } }
  부:      { verb: 찍어벤다, arc: sweep_attack, thrust: crit,        trail: cloud, swing: { key: "entity.player.attack.crit", volume: 0.9, pitch: 0.8 } }
  무관:    { verb: 움직인다, arc: cloud,      thrust: cloud,         trail: cloud, swing: { key: "entity.player.attack.sweep", volume: 0.5, pitch: 1.4 } }
  짐승:    { verb: 덮친다, arc: crit,         thrust: crit,          trail: cloud, swing: { key: "entity.wolf.growl", volume: 0.8, pitch: 0.9 } }

# ══════════════════════════════════════════════════════════════════════
#  무공·초식별 모션 — skill_mechanics.yml skills 33종 전수
# ══════════════════════════════════════════════════════════════════════
# 【커버리지】 skill_mechanics.yml 의 모든 무공, 그 모든 초식(콤보 칸)이 여기 한 줄씩 있어야 한다.
#   steps[i].trail 은 skill_mechanics combo[i].type (또는 단발형의 type) 과 **같아야 한다** (불변식 ㄴ).
# 초식이 서로 달라 보이는 수단 3개 (파티클 종류를 바꾸는 것은 마지막 수단이다 — 팔레트가 13장뿐이므로):
#   ① 궤적의 모양 (호/선/원/돌/시) — 히트박스가 이미 다르다. 그것을 그대로 그린다.
#   ② 소리의 음높이(pitch) — 같은 검이라도 쾌검(음풍검 1.6)과 중검(제왕검형 0.5)은 귀로 갈린다.
#   ③ 강조(accent) — 마무리 타(finisher)에만 붙는 한 개의 획. "이번 것이 무겁다"는 신호.
