      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.2 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.3 } }
      - { trail: 선, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.0 } }
      - { trail: 원, count: 3, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 1.0, pitch: 0.8 } }   # 광역 마무리 — 매화만개의 선행

  maehwa_geomjin:
