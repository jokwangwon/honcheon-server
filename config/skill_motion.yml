  # ══════════════════════════════════════════════════════════════════
  #  15문파 계보 (docs/design/sect_lineage.md) — 문파가 궤적으로 갈린다
  # ══════════════════════════════════════════════════════════════════
  # 【문파의 지문 — 무엇으로 가르는가】 파티클 종류는 마지막 수단이다 (팔레트 13장). 앞의 셋으로 가른다:
  #   ① 궤적의 짜임 — 히트박스가 이미 다르다. 그것을 그대로 그린다.
  #        화산 호→원 (꽃이 벌어진다) · 남궁 선 (가장 길다) · 무당 원으로 닫는다 ·
  #        점창 선·선·선·선 (네 번 다 찌른다) · 청성 돌로 연다 (검 계보 유일) ·
  #        해남 짧은 호와 역수의 선 · 팽가 호에서 내려베는 선 · 개방 150° 의 호
  #   ② 음높이 — 점창 1.85~1.95 (전 무공 최고) ↔ 종남 0.45~0.85 (전 무공 최저). 눈을 감아도 문파가 갈린다.
  #        같은 검이라도 쾌검과 중검은 **귀로** 먼저 갈린다.
  #   ③ 텔레그래프 — 종남 +3 (가장 크게 예고한다) · 점창 0 (예고하지 않는다) ·
  #        곤륜 무성무색 **−9 (응집이 아예 없다 — 전 무공 유일. 소리도 안 난다)**
  #
  # ── 화산파 (계보) — 호로 열고 **원으로 진다**: 꽃이 벌어지는 짜임 ──
  nagyeong_geom:
    name: "낙영검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.6, pitch: 1.35 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.6, pitch: 1.25 } }
      - { trail: 선, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.05 } }   # 떨어지는 꽃잎 하나 (발경 라이더)

  maehwa_nanman_geom:
    name: "매화난만검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.30 } }
      - { trail: 선, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.10 } }
      - { trail: 원, count: 3, finisher: true, telegraph_boost: 2,
          sound: { key: "entity.player.attack.sweep", volume: 1.0, pitch: 0.85 } }   # 난만(爛漫) — 선딜 11틱에 검기가 원을 연다

  # ── 남궁세가 (계보) — **선이 가장 길다** (7.5m). 낮은 음 · 큰 예고 ──
  daeyeon_geom:
    name: "대연검법"
    style: 검
    steps:
      - { trail: 선, count: 3, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.00 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 0.90 } }
      - { trail: 선, count: 3, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.95, pitch: 0.75 } }

  changgung_daeyeon_geom:
    name: "창궁대연검법"
    style: 검
    steps:
      - { trail: 선, count: 4, finisher: true, telegraph_boost: 2,
          sound: { key: "entity.player.attack.sweep", volume: 1.0, pitch: 0.55 } }   # 검로가 12틱 서 있다 — 보고도 못 피한다

  # ── 사천당가 (계보) — 손을 떠나는 것 (시). 가장 높고 가장 잦다 ──
  dangmun_bijeop:
    name: "당문비접표"
    style: 암기
    steps:
      - { trail: 시, count: 2, finisher: true,
          sound: { key: "entity.arrow.shoot", volume: 0.7, pitch: 1.75 } }   # 네 마리 나비 — 궤가 넷으로 갈린다 (hit_count 4)

  # ── 하북팽가 (계보) — 호에서 **내려베는 선**으로. 도의 무게 (음이 낮다) ──
  gaesan_do:
    name: "개산도법"
    style: 도
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 0.95 } }
      - { trail: 선, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.crit", volume: 1.0, pitch: 0.75 } }   # 산을 연다 — 흙이 튄다

  honwon_do:
    name: "혼원도법"
    style: 도
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 0.90 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.85, pitch: 0.80 } }
      - { trail: 선, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.crit", volume: 1.0, pitch: 0.60 } }   # 도신이 운다 — 벼락의 예고

  byeokryeok_do:
    name: "벽력도법"
    style: 도
    steps:
      - { trail: 선, count: 4, finisher: true, telegraph_boost: 2,
          sound: { key: "entity.player.attack.crit", volume: 1.0, pitch: 0.50 } }   # 파격 — 11틱 보인다. 그래도 막을 수 없다

  # ── 소림사 (계보) — 리치 2.4 (최단). 대신 **네 번** 친다 ──
  sorim_kwonbeop:
    name: "소림권법"
    style: 맨손
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.weak", volume: 0.7, pitch: 1.10 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.weak", volume: 0.7, pitch: 1.05 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.weak", volume: 0.8, pitch: 0.95 } }
      - { trail: 선, count: 3, finisher: true,
          sound: { key: "entity.player.attack.knockback", volume: 1.0, pitch: 0.70 } }   # 108수의 끝 — 4타에 발경

  banya_jang:
    name: "반야장"
    style: 맨손
    steps:
      - { trail: 호, count: 3, finisher: true, telegraph_boost: 2,
          sound: { key: "entity.player.attack.knockback", volume: 1.0, pitch: 0.60 } }   # 장심(掌心) — 여래신장의 아래층

  # ── 무당파 (계보) — **원으로 닫는다**. 마무리가 사방이다 (반격의 결) ──
  yuun_geom:
    name: "유운검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.15 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.05 } }
      - { trail: 원, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.95 } }   # 구름이 감긴다 — 원을 그린다

  jinmu_geom:
    name: "진무검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.10 } }
      - { trail: 선, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.00 } }
      - { trail: 원, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.85 } }   # 검이 원을 닫는다

  # ── 개방 (계보) — 취기가 흩날린다(ash) · 봉은 **150° 를 훑는다** (최광각) ──
  chwikwon:
    name: "취권"
    style: 맨손
    steps:
      - { trail: 호, particle: ash, count: 2, sound: { key: "entity.generic.drink", volume: 0.6, pitch: 1.20 } }
      - { trail: 호, particle: ash, count: 2, sound: { key: "entity.generic.drink", volume: 0.6, pitch: 1.10 } }
      - { trail: 선, count: 3, finisher: true,
          sound: { key: "entity.player.attack.knockback", volume: 0.9, pitch: 0.85 } }   # 휘청이다 갑자기 곧게 온다

  gaebang_bongbeop:
    name: "개방봉법"
    style: 봉
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.75, pitch: 0.95 } }   # 150° — 포위를 푸는 획
      - { trail: 선, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 0.90 } }
      - { trail: 호, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.knockback", volume: 1.0, pitch: 0.70 } }   # 먼지가 인다

  # ── 곤륜파 (계보) — 경공의 문파. **무성무색은 응집도 소리도 없다 (전 무공 유일)** ──
  yangui_geom:
    name: "양의검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.30 } }
      - { trail: 선, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.10 } }   # 두 획이 엇갈린다 — 음양

  museong_musaek:
    name: "무성무색"
    style: 검
    # 【전 무공 유일 — 텔레그래프가 없다】 telegraph_boost −9 는 응집 파티클을 0 으로 만들고
    #   (SkillListener.telegraph: n ≤ 0 이면 발행하지 않는다) **응집음까지 함께 죽인다**
    #   (scheduleTelegraph 는 per ≤ 0 에서 되돌아가므로 charge 사운드도 안 난다).
    #   그래서 이 검은 **오는 것이 보이지도 들리지도 않는다** — 그것이 곤륜 중급의 값이다.
    #
    # 【2026-07 — 무음이 완결됐다】 지난 판은 **스윙음만** −60% 로 내릴 수 있었다. 타격음은 격의 것
    #   (grades[].sounds.impact)이라 초식이 손댈 칸이 없었고, 그래서 조용히 다가온 검이 **닿는 순간
    #   여느 검과 똑같이 울었다**. 이제 `sound_scale` 이 그 칸이다 — 이 초식이 내는 **모든** 소리
    #   (스윙음·응집음·**타격음**)가 함께 0.4 배로 내려간다. 등록부만으로 무음이 완결된다.
    #   그래서 스윙음의 volume 은 **검의 정상값(0.7/0.7/0.8)으로 되돌렸다** — 두 번 깎이면 안 된다.
    #   다만 **타격 파티클은 그대로다** — 맞았다는 사실까지 지우면 화면이 판정에 대해 거짓말하는 것이다.
    steps:
      - { trail: 선, count: 1, telegraph_boost: -9, sound_scale: 0.4,
          sound: { key: "entity.player.attack.weak", volume: 0.70, pitch: 1.45 } }
      - { trail: 선, count: 1, telegraph_boost: -9, sound_scale: 0.4,
          sound: { key: "entity.player.attack.weak", volume: 0.70, pitch: 1.40 } }
      - { trail: 호, count: 2, finisher: true, telegraph_boost: -9, sound_scale: 0.4,
          sound: { key: "entity.player.attack.weak", volume: 0.80, pitch: 1.25 } }

  taeheo_geom:
    name: "태허검법"
    style: 검
    steps:
      - { trail: 원, count: 3, finisher: true, telegraph_boost: 2,
          sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.90 } }   # 원이 비어 있다 — 그 안이 전부 검이다

  dabun_jong:
    name: "답운종"
    style: 무관
    steps:
      - { trail: 돌, particle: cloud, count: 4, sound: { key: "entity.phantom.flap", volume: 0.6, pitch: 1.40 } }   # 거리 10 — 제운종(8)보다 멀리 간다. 잔상이 더 길다

  # ── 종남파 (계보) — **가장 느리고 가장 낮다**. 예고가 가장 크다 (숨지 않는다) ──
  gusang_geom:
    name: "구상검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.85, pitch: 0.85 } }
      - { trail: 선, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.crit", volume: 1.0, pitch: 0.65 } }   # 공기가 밀린다

  cheongang_geom:
    name: "천강검법"
    style: 검
    steps:
      - { trail: 호, count: 2, telegraph_boost: 1, sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.80 } }
      - { trail: 선, count: 3, finisher: true, telegraph_boost: 2,
          sound: { key: "entity.player.attack.crit", volume: 1.0, pitch: 0.60 } }   # 은하가 흐른다 — 검신에 별빛

  taeeul_bungwang_geom:
    name: "태을분광검"
    style: 검
    steps:
      - { trail: 선, count: 4, finisher: true, telegraph_boost: 3,
          sound: { key: "entity.player.attack.sweep", volume: 1.0, pitch: 0.45 } }   # 13틱 — 전 무공 최장 선딜 · 최저 음. 종남의 검은 숨지 않는다

  # ── 점창파 (계보) — **가장 빠르고 가장 높다**. 네 번 다 찌른다 · 예고가 없다 ──
  bungwang_geom:
    name: "분광검법"
    style: 검
    steps:
      - { trail: 선, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.85 } }
      - { trail: 선, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.90 } }
      - { trail: 선, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.95 } }
      - { trail: 선, count: 2, finisher: true, sound: { key: "entity.player.attack.crit", volume: 0.7, pitch: 1.70 } }   # 빛 한 줄 — 이미 지나갔다

  hoepung_muryu_geom:
    name: "회풍무류검법"
    style: 검
    steps:
      - { trail: 선, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.80 } }
      - { trail: 호, count: 1, sound: { key: "entity.player.attack.sweep", volume: 0.6, pitch: 1.75 } }   # 궤가 둘로 보인다 — 찌르다 벤다
      - { trail: 선, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.5, pitch: 1.85 } }
      - { trail: 호, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.60 } }

  bungwang_sippalsu:
    name: "분광십팔수"
    style: 검
    steps:
      - { trail: 선, count: 2, finisher: true,
          sound: { key: "entity.player.attack.crit", volume: 0.8, pitch: 1.90 } }   # 다섯 점의 빛 — 선딜 3틱. 세는 사이에 끝난다 (예고 없음)

  # ── 청성파 (계보) — **검 계보 유일: 돌(突)로 연다**. 바람의 음 (높다) ──
  cheongpung_geom:
    name: "청풍검법"
    style: 검
    steps:
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.6, pitch: 1.40 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.65, pitch: 1.30 } }
      - { trail: 선, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.10 } }

  neungpung_geom:
    name: "능풍검법"
    style: 검
    steps:
      - { trail: 돌, particle: cloud, count: 2, sound: { key: "entity.phantom.flap", volume: 0.5, pitch: 1.35 } }   # 바람을 밟고 들어간다 — 검 계보 유일의 돌진 개시
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.sweep", volume: 0.7, pitch: 1.25 } }
      - { trail: 선, count: 3, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 1.05 } }

  songpung_geom:
    name: "송풍검법"
    style: 검
    steps:
      - { trail: 원, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 1.00 } }   # 솔잎이 인다 — 받아넘기며 벤다 (흘리기 +3틱)

  # ── 해남파 (계보) — 짧고 날카롭다. **역수·좌수** — 어느 손에서 나올지 모른다 ──
  haepung_geom:
    name: "해풍검법"
    style: 검
    steps:
      - { trail: 호, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.55, pitch: 1.50 } }
      - { trail: 호, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.55, pitch: 1.55 } }
      - { trail: 선, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.35 } }   # 짠 바람 — 획이 짧다

  yeoksu_geom:
    name: "역수검법"
    style: 검
    steps:
      - { trail: 선, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.55, pitch: 1.60 } }   # 칼등이 먼저 온다
      - { trail: 호, count: 1, sound: { key: "entity.player.attack.weak", volume: 0.6, pitch: 1.50 } }
      - { trail: 선, count: 2, finisher: true, sound: { key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.30 } }

  jwasu_khwaegeom:
    name: "좌수쾌검"
    style: 검
    steps:
      - { trail: 선, count: 2, finisher: true,
          sound: { key: "entity.player.attack.crit", volume: 0.8, pitch: 1.70 } }   # 왼쪽에서 빛 — 보던 손이 아니다 (가드 각 바깥)

  # ── NPC 전용 표본 (대칭 원칙 — NPC 도 같은 등록부를 탄다) ──
  galho_sando:
    name: "갈호의 산도"
    style: 도
    steps:
      - { trail: 돌, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.player.attack.sweep", volume: 0.9, pitch: 0.8 } }   # 자세 낮춤 + 경로 표시 10틱

  beast_pounce:
    name: "덮치기"
    style: 짐승
    steps:
      - { trail: 돌, count: 3, finisher: true, telegraph_boost: 1,
          sound: { key: "entity.wolf.growl", volume: 1.0, pitch: 0.8 } }   # 짐승도 예고한다 — 몸을 낮추는 8틱

# ══════════════════════════════════════════════════════════════════════
#  오의(奧義) — ultimate_arts.yml legacy_arts 전수. 한 번 보면 잊지 못할 것
# ══════════════════════════════════════════════════════════════════════
# 【읽힘 요건】 오의는 격 사다리의 어느 칸과도 헷갈리면 안 된다. 구분 수단 3개:
#   ① 응집 고리 — 사방에서 몸으로 **빨려드는** 고리 (다른 어떤 모션도 고리를 쓰지 않는다)
#   ② 개시 섬광 — flash 1개 + 뇌격음 (팔레트에서 flash 를 쓰는 것은 오의와 심검뿐이다)
#   ③ 이름 — 32m 안의 모든 눈에 오의명 타이틀 (world_weight: 시전 목격 = 강도 3 소문)
# 예산: emitPriority — 생략되지 않고 깎인다. ultimate_per_tick_max 48.
ultimates:
  maehwa_mangae:
    name: "매화만개"
    trail: 원                     # ultimate_arts type.hitbox 와 같아야 한다
    charge: { particle: end_rod, ring_points: 8, per_point: 2, core: end_rod, core_count: 6 }
    burst:  { particle: end_rod, count: 40, spread_ratio: 0.33, extra: 0.08 }
    accent: { particle: flash, count: 1 }
    sounds:
      charge: [{ key: "block.beacon.power_select", volume: 1.0, pitch: 0.5 }]
      release: [{ key: "entity.lightning_bolt.impact", volume: 1.0, pitch: 1.3 }]
      hit: [{ key: "entity.player.attack.sweep", volume: 0.8, pitch: 1.6 }]

  taegeuk_hyegeom:
