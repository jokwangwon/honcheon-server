      - { trail: 선, count: 3, finisher: true, sound: { key: "entity.player.attack.crit", volume: 1.0, pitch: 0.7 } }   # 내려베기 — 갑주를 가른다

  # ── 녹림·사파 ──
  sando_sippallo:
