      - { trail: 호, count: 2, sound: { key: "entity.player.attack.weak", volume: 0.6, pitch: 1.3 } }
      - { trail: 호, count: 2, sound: { key: "entity.player.attack.weak", volume: 0.6, pitch: 1.4 } }
      - { trail: 선, count: 3, finisher: true, sound: { key: "entity.player.attack.knockback", volume: 0.9, pitch: 0.9 } }   # 붕권 — 3타는 무겁다

  cheolsan_go:
    name: "철산고"
