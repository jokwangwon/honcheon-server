# 서사 폴백 등록부 — **사냥과 비무**의 결과 산문이 사는 곳. 정본은 이 파일이다.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 이 파일이 생긴 이유 (2026-07-14, BACKLOG B-074)
#
# 이 문장들은 Narration.java 안에 자바 문자열로 박혀 있었다 — **코드가 이야기를 지고 있었다.**
# 서장(序章)의 글이 config/seojang.yml 로 나간 것(2026-07-13)과 같은 병, 같은 처방이다:
# 글은 등록부로, 코드에는 **읽는 손**만 남긴다. 읽는 손은 Narration.java 다.
#
# 【언제 쓰이는가】 LLM 이 없거나 실패했을 때의 폴백 산문이다 (llm.yml failure_handling —
#   LLM 없이도 게임은 돈다). 7계 준수: 수치 은닉(마진·굴림값 언급 금지 — 판정 embed 가
#   따로 공개한다), 등록제 명사, 길이 예산.
#
# 【이관 원칙】 자바에 있던 문장을 **한 글자도 바꾸지 않고** 옮겼다. 문자열 이어붙기
#   (`+ beast +` 등) 자리만 아래 치환 자리로 바뀌었다 — 출력은 이관 전과 동일하다.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 치환 자리 규약 — 코드(Narration.java)가 채우는 자리는 이것이 전부다.
#   여기 없는 중괄호는 치환되지 않고 **글자 그대로** 화면에 나간다.
#
#   hunt.* :  {짐승}  — 사냥감의 이름 (hunting_grounds.yml 의 등록 명사, 예: 「멧돼지」)
#   duel.* :  {승자}  — 이긴 쪽의 이름 / {패자} — 진 쪽의 이름 (무승부 문장에는 자리가 없다)
#
# ★ 조사(은/는·이/가)는 문장이 「은(는)」 꼴로 직접 진다 — 코드는 조사를 고르지 않는다.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 등급 키 — judgment.yml result_tiers 의 이름을 Seojang.grade 가 5분류로 환산한다
#   (대성공·성공·중간·실패·대실패). **환산점은 Seojang.grade 하나다** — 여기서 두 번 정하지 않는다.
#   성공·중간은 가죽의 유무가 문장을 가른다 (가죽_있음 / 가죽_없음).
#
# 【이 파일이 없거나 깨지면】 봇은 죽지 않는다 — 산문 없는 생존 한 줄로 버티되,
#   severe 로그로 소리낸다 (조용한 실패 금지). 생존 문장은 Narration.java 에 있다.

version: 1

# ─── 사냥 결과 폴백 — 등급 5분류로 온도를 정한다 (수치는 embed 몫) ───
hunt:
  대성공: "몸이 먼저 움직였다 — 스스로도 놀랄 만큼 깨끗한 일수. {짐승}은(는) 소리도 없이 무너졌다. 오늘의 감각은 오래 기억날 것이다."
  성공:
    가죽_있음: "한 호흡에 끝났다. {짐승}은(는) 미처 방향을 틀기도 전에 무너졌고, 가죽은 흠집 하나 없이 벗겨졌다."
    가죽_없음: "한 호흡에 끝났다. {짐승}은(는) 미처 방향을 틀기도 전에 무너졌다."
  중간:
    가죽_있음: "엎치락뒤치락 끝에 겨우 숨통을 끊었다. 몸 여기저기 생채기가 남았고, 가죽도 성한 곳이 많지 않다."
    가죽_없음: "엎치락뒤치락 끝에 겨우 숨통을 끊었다. 몸 여기저기 생채기가 남았고, 가죽은 못 쓰게 됐다 — 그래도 손에 익은 것이 남았다."
  실패: "{짐승}이(가) 더 빨랐다. 덤불 사이로 놓치고 나서야 옆구리가 쓰라린 것을 알았다 — 오늘은 여기까지다."
  대실패: "발을 헛디딘 순간 {짐승}의 이빨이 코앞까지 왔다. 구른 끝에 간신히 빠져나왔다 — 찢긴 옷자락이 산비탈에 남았다. 산이 오늘은 나를 거부한다."

# ─── 비무 결과 폴백 — 승/무/패는 엔진이 정했고, 여기는 예의만 ───
duel:
  무승부: "수십 합이 오갔지만 승부는 갈리지 않았다. 두 사람은 동시에 물러나 포권했다 — 오늘의 합은 여기까지."
  승패: "합이 갈렸다. {승자}의 마지막 일수가 반 박자 빨랐고, {패자}은(는) 깨끗이 패배를 인정하며 포권했다. 구경꾼들 사이에서 낮은 탄성이 새어 나왔다."
