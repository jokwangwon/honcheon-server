# NPC 대화 상호작용 규칙 (기계 판독용)
# 기준 문서: docs/design/npc_dialogue_interaction.md
# 3층 구조: 잡담(판정 없음) / 판정(말이 무기) / 세계(대화도 기록이다)

layers:
  잡담: { judgment: 없음, time: minor, llm: "지식 경계 안에서 자유 (7계 ④)" }
  판정: { flow: "자유 입력 → 의도 분류 → action_pairs 매핑 → 엔진 판정 → 렌더" }
  세계: { records: [단서_획득_이벤트로그, 실언_의심도_소문후보, 대화_요지_NPC_기억] }

# ─── 의도 분류 — LLM 허용 범위의 경계선 ───
intent_classification:
  classifier: LLM                  # '어떤 행동인가'만 — 수치·성패는 전부 엔진 (7계 ① 불가침)
  intents: [잡담, 정보_캐기, 설득, 위협, 흥정, 거짓말]
  mapping: "judgment.yml action_pairs (정보_캐기→정보수집, 설득→교섭, 흥정→상술 …)"
  low_confidence: "플레이어 확인 버튼 — '[정보 캐기로 판정] [그냥 잡담]'"
  fallback: "분류 실패 = 잡담 처리 (판정을 억지로 만들지 않는다)"

discord:
  start: ["장면 서술 속 NPC → [말 걸기] 버튼", "/대화 <이름>"]
  precondition: "schedule 조회 선행 — 일과가 위치를 정한다 (밤의 한백은 카운터에 없다)"
  window: 장면_스레드
  npc_voice: { method: 웹훅_페르소나, display: "NPC 이름 + 초상 아바타 발화 — 몰입 장치" }
  input: { free_text: 상시_우선, buttons: { count: [3, 5], source: "LLM choices — 프리페치" } }
  judgment_display: "embed 공개 (기존 원칙)"
  end: [자리를_뜬다_버튼, 침묵_10분_자동_이탈, NPC_선종료_일과·태세_변화]
  private: "밀담 = 개인 스레드 분기 — 엿듣기 판정의 표적"

mc:
  start: { action: NPC_우클릭, radius_blocks: 5, exit: "반경 이탈 = 자연 종료" }
  window: 채팅창
  npc_line_format: "[이름] 대사 — 이름 색 = 태세 (백 중립/녹 우호/적 적대)"
  choices: { method: tellraw_클릭_텍스트, count: [1, 4], hover: 부가_설명 }
  free_text: "대화 중 채팅 = NPC에게 자동 라우팅"
  judgment_display: "액션바 한 줄 + 채팅 상세 (즉시성 문법)"
  in_combat: "npc_combat.yml combat_dialogue 그대로 — 외치기 쿨다운 시전, 발화 중 가드 불가"

# ─── 동시 대화 중재 — NPC의 입은 하나다 (G8 문법 첫 적용례) ───
concurrency:
  lock: "대화 = scenes 장면 잠금"
  waiting: "후발자는 곁에서 대기 (대화 내용은 안 보인다 — 밀담 제외)"
  interrupt:
    flow: "개입 선언 → 기존 참가자 통지 → 3자 장면 병합"
    price: "NPC 심증 보정 -1 (무례함의 대가)"
  crowd_exception: "상인 접객(거래·짧은 문답)은 잠금 없이 병렬 — 점소이는 바쁘다"

npc_side:
  knowledge_boundary: "아는 것만 말한다 — secrets는 해금 플래그 없인 LLM도 못 꺼낸다"
  memory: "대화 요지 누적 (npcs.state_json) — 거짓말 들통: 과거 발언 어긋남 = 의심도 +1"
  stance: "태세가 답을 바꾼다 (활동 컨텍스트 보정 기존)"
  time_cost: { 잡담: minor, 본격_문답_설득: 구간_소모 }
  npc_initiated: "NPC가 먼저 온다 — 의뢰 지명·세력 접촉·회수 이벤트는 NPC발 대화"

# ═══════════════════════════════════════════════════════════════════════════
# 무명(無名)의 말 — 인구층(tier 0) 대화 등록부
# 읽는 코드: server-mvt/src/main/java/com/honcheon/mvt/Populace.java (MC 우클릭)
# 등록 인원: config/npcs/populace.yml people (28인)
#
# 위 3층(잡담/판정/세계) 중 **잡담층만** 쓴다 — 무명에게는 판정을 걸지 않는다.
#   · 판정층(정보_캐기·설득·위협)은 계약 NPC 의 몫이다 (LLM 의도 분류 + judgment.yml).
#   · 무명은 묻지 않아도 말한다. 짧고, 겁이 많고, 소문을 옮긴다 (rumor.yml mingan_market — 가장 빠르고 가장 부정확).
#   · 그러나 죽은 채로 서 있는 장식은 아니다: 이름을 대고, 생업을 말하고, 오늘의 세계를 말한다.
#
# 말투 층위(voice) — populace.yml voice_by_routine 이 사람 → 말투를 잇는다.
#   농민 품팔이 장사치 장인 서생 아이 노인 거지 관졸 아낙  (10층)
#
# 고르는 순서 (mood > segment):
#   ① 애도  — 이 사람의 혈육·동료가 죽었다 (populace.yml relations)
#   ② 공포  — 미해결 살인이 있다 (npc_death.populace_layer.stages 흔적 이상)
#   ③ 소문  — 켜진 사건 반응 태그가 있다 (populace.yml reactions — 그쪽 lines 가 우선)
#   ④ 구간  — 아침 / 낮 / 밤 (segment_map)
populace:
  cooldown_ms: 1000                 # 우클릭 연타 방지
  name_format: "[{name} · {job}]"   # 무명도 이름이 있다 — 다가가 물으면 댄다
  intro_chance: 0.25                # 첫 마디 대신 자기소개를 할 확률 (등록부 나이·거처를 말한다)
  intro_format: "{name}이라 하오. 나이 {age}에 {job} 노릇을 하오. {home} 쪽에 삽니다."
  segment_map: { 새벽: 아침, 아침: 아침, 낮: 낮, 해질녘: 낮, 밤: 밤 }

  voices:
    농민:
      아침: ["비가 와야 할 텐데 하늘이 저러오.", "밭에 나가오. 무인 나리는 무인 나리 일을 보시오."]
      낮: ["멧돼지가 또 이랑을 헤집었소.", "올해 소출은 작년만 못하겠소."]
      밤: ["이 시각에 밖에 계시오? 들에는 나가지 마시오.", "등불 아껴야 하오. 기름값이 올랐소."]
      소문: ["들은 얘기요. 나는 모르오.", "장터에서 그러더이다 — 나는 아무것도 못 봤소."]
      공포: ["사람이 죽었다지 않소. 나는 해 지면 문을 잠그오.", "누구요, 당신은. …그냥 가시오."]
      애도: ["묻었소. 더 할 말이 없소.", "밭에 나가도 손이 안 잡히오."]
    품팔이:
      아침: ["오늘도 스무 지게요. 물독은 밑이 없소.", "짐 좀 옮겨 드릴까. 삯은 잔돈이면 되오."]
      낮: ["표국 수레 미는 날이 급료가 제일 좋소.", "어깨가 무너질 것 같소. 그래도 먹고는 살아야지."]
      밤: ["밤엔 삯이 없소. 잠이나 자오.", "골목은 어둡소. 등불 있소?"]
      소문: ["수레에 뭐가 실렸는지는 나도 아오. 술 한 잔이면.", "북로 얘기는 마부에게 물으시오."]
      공포: ["밤일은 그만뒀소. 목숨값보다 삯이 싸오.", "골목에서 뭘 봤다는 사람이 있소. 나는 아니오."]
      애도: ["같이 짐을 지던 사람이오. …이제 혼자 지오."]
    장사치:
      아침: ["떨이요, 떨이. 무인 나리도 아침은 자셔야지.", "옆 현은 이 값의 두 배요. 여기가 싸오."]
      낮: ["나물보다 말이 먼저 팔리오. 뭘 듣고 싶소?", "장쇠 그 사람 셈이 야박하오. 나한테 사시오."]
      밤: ["좌판은 걷었소. 내일 오시오.", "밤장사는 도둑이나 하오."]
      소문: ["그 얘기 값은 얼마요? …농이오, 농.", "옆 현에서도 그 소리가 돌더이다."]
      공포: ["좌판을 일찍 걷소. 사람 죽은 장터에 누가 오겠소.", "손님보다 포졸이 많소, 요즘은."]
      애도: ["장사는 하오. 안 하면 굶으니까. …그뿐이오."]
    장인:
      아침: ["풀무질만 삼 년이오. 아직 쇠는 못 만지오.", "야철수 어른 오시기 전에 불을 살려야 하오."]
      낮: ["손등 보이오? 이게 삼 년 값이오.", "쇠는 정직하오. 두드린 만큼만 나오오."]
      밤: ["불을 죽였소. 내일 새벽에 다시 살리오.", "쇳내가 안 빠지오. 밤에도 손에서 나오."]
      소문: ["쇠붙이 얘기 아니면 나는 모르오.", "그런 건 저자에서 물으시오. 나는 여기 서 있소."]
      공포: ["칼 든 사람이 지나가면 이제 눈을 안 마주치오.", "밤에 문을 잠그오. 철방이라고 안 잠글 줄 아오?"]
      애도: ["불 앞에 앉아 있으면 좀 낫소. …좀."]
    서생:
      아침: ["글은 밥이 되지 않소. 그래도 읽소.", "백석 어른께 책을 빌리러 가오."]
      낮: ["무인은 힘으로 세상을 재고, 글은 세상을 적소. …어느 쪽이 오래 남겠소?", "장부의 숫자는 거짓을 못 하오. 사람이 할 뿐이오."]
      밤: ["등잔 기름이 아깝소. 그래도 오늘 몫은 읽어야 하오.", "야심하오. 무인 나리도 주무시오."]
      소문: ["소문은 사실의 그림자요. 그림자만 보고 사람을 재지 마시오.", "누가 그러더이까? 그 사람이 본 거요, 들은 거요?"]
      공포: ["살인이오. …관에 고해야 하는데 다들 입을 다무오.", "적어 두었소. 언젠가 누가 물을 테니."]
      애도: ["제문을 썼소. 글이 무슨 소용이오만."]
    아이:
      아침: ["나리! 그 검 한 번만 만져 보면 안 돼요?", "엄마가 무인 나리 근처 가지 말래요. 근데 왔어요."]
      낮: ["우물가에서 물 튀기다 혼났어요.", "나리는 사람 죽여 봤어요? …농담이에요!"]
      밤: ["이 시간에 나와 있으면 혼나요. 나리도요.", "무서워요. 손 잡아 줄래요?"]
      소문: ["어른들이 쉬쉬해요. 근데 나는 다 들었어요.", "그거 진짜예요? 어른들은 거짓말 잘하잖아요."]
      공포: ["…아저씨가 무서워요.", "엄마가 밖에 나가지 말랬어요. 사람이 죽었대요."]
      애도: ["…", "안 울었어요. 진짜예요."]
    노인:
      아침: ["이 현의 삼십 년을 보았소. 좋은 날은 열흘도 안 되오.", "젊은이, 그 걸음으로 어딜 그리 급히 가오."]
      낮: ["바둑이나 두시오. 검보다 오래 사오.", "예전엔 여기 담장도 없었소. 도적은 그때가 더 적었지."]
      밤: ["늙으면 잠이 없소. 그래서 밤을 다 보오. …별걸 다 보오.", "밤에 다니는 사람은 셋이오 — 도적, 관졸, 그리고 갈 데 없는 자."]
      소문: ["소문이란 건 말이오, 열에 아홉은 헛것이오. 근데 그 하나가 사람을 죽이오.", "삼십 년 전에도 똑같은 소리가 돌았소."]
      공포: ["또 시작이오. 삼십 년 전에도 그랬소 — 그때는 아무도 안 잡혔지.", "젊은이, 그 손 좀 보여 주겠소? …아니오, 됐소."]
      애도: ["나보다 젊은 사람을 묻는 건 세 번째요.", "오래 살면 이런 걸 보오. 그게 벌이오."]
    거지:
      아침: ["한 푼만. 어제부터 못 먹었소.", "나리, 복 받으실 거요. 진짜요."]
      낮: ["의방 앞이 제일 낫소. 아픈 사람은 인심이 후하오.", "취걸개 어른요? 그분은… 그분은 신선이오. 나 같은 건 근처도 못 가오."]
      밤: ["다리 밑이 내 집이오. 들어오시겠소? …농이오.", "밤에는 거지도 안 나오오. 뺏길 게 없어도 맞기는 하오."]
      소문: ["거지는 다 듣소. 아무도 거지 앞에선 입을 안 가리니까.", "한 푼 주면 더 말해 주오."]
      공포: ["나는 봤소. …아니오, 못 봤소. 아무것도 못 봤소.", "거지는 죽어도 아무도 안 찾소. 그래서 무섭소."]
      애도: ["같이 빌어먹던 사람이오. 몫이 늘었는데 하나도 안 기쁘오."]
    관졸:
      아침: ["관아 앞이오. 볼일 없으면 지나가시오.", "포두 나리 나오시기 전이오. 조용히 가시오."]
      낮: ["순라 도는 중이오. 무기는 감추고 다니시오.", "낭인이오? …사건은 늘 당신들이 지나간 뒤에 나오."]
      밤: ["야밤에 무슨 볼일이오. 이름과 거처를 대시오.", "통행이 늦었소. 잡아넣지는 않겠소만, 눈에 띄지 마시오."]
      소문: ["관은 소문으로 움직이지 않소. 증거를 가져오시오.", "고할 게 있으면 관아로 오시오. 여기서 떠들지 말고."]
      공포: ["살인이오. 포두 나리께서 직접 나오셨소.", "당신 어젯밤 어디 있었소. …그냥 묻는 거요."]
      애도: ["동료였소. 관은 사람이 죽어도 자리를 안 비우오. …그게 더 서럽소."]
    아낙:
      아침: ["개울에 나가오. 빨래는 해 뜨기 전이 좋소.", "애들 밥은 먹였소. 이제 내 일을 하오."]
      낮: ["핏물 밴 옷을 몇 번 빨아 봤소. …그래서 말을 안 하오.", "약재 손질이 끝이 없소. 의원 나리 손이 열이라도 모자라오."]
      밤: ["애가 아직 안 들어왔소. …곧 오겠지요.", "문을 잠그오. 밤에는 아무도 안 들이오."]
      소문: ["여인들 사이에 도는 말이 있소. 사내들은 모르오.", "우물가에서 다 듣소. 물 긷는 데가 곧 저자요."]
      공포: ["애를 안 내보내오. 절대로.", "어젯밤 골목에서 소리가 났소. 나는 문을 안 열었소. …안 열었소."]
      애도: ["옷을 못 빨겠소. 그 아이 옷이 아직 있소.", "묻고 왔소. 손이 아직 떨리오."]
