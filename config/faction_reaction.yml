# 세력 반응 전이 규칙 (기계 판독용)
# 기준 문서: docs/design/world_reaction_system.md 4장
# 설계 검토 공백 G2 해결
#
# 세력 반응은 '대상별 반응 점수'의 누적으로 굴린다.
# 점수는 내부 상태 — 플레이어에게는 소문과 사건(서사)으로만 보여준다.

score:
  range: [0, 30]

# 반응 단계 임계값 (기획서 11장의 0~6단계에 대응)
stage_thresholds:
  - { stage: 0, name: "무관심", min_score: 0 }
  - { stage: 1, name: "소문 인지", min_score: 1 }
  - { stage: 2, name: "정보 수집", min_score: 4 }
  - { stage: 3, name: "접촉 또는 경고", min_score: 8 }
  - { stage: 4, name: "의뢰 / 회유 / 협박", min_score: 13 }
  - { stage: 5, name: "직접 개입", min_score: 19 }
  - { stage: 6, name: "토벌 / 전쟁 / 숙청", min_score: 26 }

# 입력 이벤트별 점수 (해당 세력 기준)
inputs:
  소문_도달_관심일치: 1            # 정확도 70 미만
  소문_도달_고정확도: 2            # 정확도 70 이상
  조직원_경상: 2
  조직원_사망_또는_중상_확인: 4
  연락책_연락두절: 3               # 사망 확인 시 차액(+1)만 추가 (중복 가산 금지)
  거점_또는_연락망_노출: 3
  금전_손실_소규모: 2
  금전_손실_대규모: 5
  관할_치안_중대사건: 3            # 관군 전용 (살인, 습격)
  세력_체면_손상_공개적: 3
  이익_제공_또는_협조: -2
  큰_공적_또는_구명: -4

# 중복 가산 금지 규칙
no_double_count:
  - "직접 겪은 사건의 소문 도달은 가산하지 않는다 (당사자는 이미 알고 있다)"
  - "연락두절(+3) 후 사망/중상 확인 시 차액(+1)만 추가"
  - "같은 소문이 여러 망으로 도달해도 세력당 1회만 가산"

# 시간 감쇠 — 세계는 잊는다 (단, 기억 태그는 남는다)
decay:
  every_days: 7
  amount: -1
  floor_after_stage_3: 4          # 3단계(접촉)까지 갔던 대상은 2단계 아래로 잊히지 않음

# 대상 추적 규칙 — "누구에 대한 반응인가"
target_tracking:
  rule: |
    점수는 세력별 × 대상별로 관리한다. 대상은 특정 인물(플레이어, NPC),
    미상의 인물("낯선 낭인"), 타 세력일 수 있다.
    정체를 모르면 가상 대상("미상의 무인")에 누적하고,
    정체가 확인되는 순간 실제 대상으로 병합한다.
  merge_rule: "병합 시 점수 합산 (상한 30). 병합 자체가 '정보 수집 성공' 사건이다."

# ─── 우호 축 (F3 해결) — 주목(위협) 축과 별개로 관리되는 두 번째 축 ───
# 세력 관계 = 주목(위 score: "얼마나 신경 쓰는가") × 우호(favor: "어느 편으로 보는가")
# 두 축은 독립 — 주목 높고 우호 높음 = "유능하고 위험한 자" → 회유·영입 대상
favor:
  range: [0, 30]
  inputs:
    공적_대: 4              # 습격 저지, 조직원 구명, 세력 위기 해결
    공적_소: 2              # 의뢰 완수, 유용한 정보 제공
    협조: 1                 # 소소한 도움, 거래 성사
    배신_적대: -4           # 동시에 주목 축에도 가산된다
  thresholds:
    - { level: 0, name: "낯섦", benefits: [] }
    - { level: 4, name: "안면", benefits: ["하급 의뢰 접근", "이름을 기억해줌"] }
    - { level: 8, name: "신용", benefits: ["신원 보증", "중급 의뢰", "정보 제공"] }
    - { level: 13, name: "공신", benefits: ["추천장", "상급 의뢰", "세력 비호 1회 (관군이 눈감아줌 등)"] }
    - { level: 19, name: "은인", benefits: ["세력 자원 동원 요청 가능", "문파 입문 심사 대폭 가점"] }
  decay:
    every_days: 30          # 은혜는 위협보다 천천히 잊힌다
    amount: -1
    floor_after_공신: 8     # 공신(13) 도달 이력은 장부에 남는다 — 신용 밑으로 잊히지 않음
  target_tracking: "주목 축과 동일 — '미상의 낭인'에도 적립, 정체 확인 시 병합"
  interplay:
    - "주목 3단계(접촉) 이상의 세력 행동은 우호가 톤을 정한다: 우호 높음 → 회유·영입 제안 / 낮음 → 경고·협박"
    - "우호 '공신' 이상은 주목 감쇠를 가속한다 (매 감쇠 -2) — 믿는 자는 덜 감시한다"
  npc_trust_note: "NPC 개인 신뢰와 별개 축 — 곽진이 고마워하는 것(개인)과 상단이 기억하는 것(조직)은 다르다. 개인 신뢰는 보고를 통해 우호 입력이 될 수 있다"

# ─── 정치층 훅 (config/faction_politics.yml) ───
# 이 파일(주목·우호)은 **세력 대 개인**이다. 명분·연합은 **세력 대 세력**이다.
# 두 층은 곱해진다 — 아래가 그 접합면이다. 새 통화 없음 (명분도 0~30, 같은 감쇠 문법).
politics_hook:
  coalition_wartime:
    rule: "연합 참여 세력은 해당 사안 대상의 주목 score 를 +2/라운드(7일) 가산 (전시 = 온 조직이 찾는다)"
  coalition_contribution:
    rule: "연합에 기여하면 참여 세력 **전체**에 favor 공적_소(+2) — 연합이 곧 인맥이다"
  disavowal:
    trigger: "faction_politics.authority_mandate >= 10 AND 무림 명분(myeongbun) < 8"
    override: "favor.decay.floor_after_공신(8) 무효 — 이 규칙의 유일한 예외 (공신 이력조차 무너진다)"
    effect: "정파 score +6 / 정파 favor -8 / 사파 favor -4 / '세력 비호 1회'(공신 13 혜택) 사용 불가"
    note: "무림이 그를 버리는 것은 냉혹함이 아니라 생존이다 — 한 사람 때문에 관무전쟁을 할 수는 없다"

# 단계별 세력 행동 지침 (GM 출력용 — 반드시 서사로 표현)
stage_actions:
  1: "내부 대화에 화제로 등장. 플레이어는 소문으로만 감지 가능"
  2: "탐문, 수배 의뢰, 미행 시도. 세계에 조사 흔적이 보이기 시작"
  3: "사자 파견, 경고장, 우연을 가장한 접촉"
  4: "구체적 제안 — 의뢰, 회유, 협박. 거절 시 점수 +2"
  5: "무력 행사, 습격, 납치, 공개 대립"
  6: "조직 전체의 전쟁 상태. 지역권 단위 사건으로 승격"
