# 세력 반응 전이 규칙 (기계 판독용)
# 기준 문서: docs/design/world_reaction_system.md 4장
# 설계 검토 공백 G2 해결
#
# 세력 반응은 '대상별 반응 점수'의 누적으로 굴린다.
# 점수는 내부 상태 — 플레이어에게는 소문과 사건(서사)으로만 보여준다.

score:
  range: [0, 30]

# 반응 단계 임계값 (기획서 11장의 0~6단계에 대응)
stage_thresholds:
  - { stage: 0, name: "무관심", min_score: 0 }
  - { stage: 1, name: "소문 인지", min_score: 1 }
  - { stage: 2, name: "정보 수집", min_score: 4 }
  - { stage: 3, name: "접촉 또는 경고", min_score: 8 }
  - { stage: 4, name: "의뢰 / 회유 / 협박", min_score: 13 }
  - { stage: 5, name: "직접 개입", min_score: 19 }
  - { stage: 6, name: "토벌 / 전쟁 / 숙청", min_score: 26 }

# 입력 이벤트별 점수 (해당 세력 기준)
inputs:
  소문_도달_관심일치: 1            # 정확도 70 미만
  소문_도달_고정확도: 2            # 정확도 70 이상
  조직원_경상: 2
  조직원_사망_또는_중상_확인: 4
  연락책_연락두절: 3               # 사망 확인 시 차액(+1)만 추가 (중복 가산 금지)
  거점_또는_연락망_노출: 3
  금전_손실_소규모: 2
  금전_손실_대규모: 5
  관할_치안_중대사건: 3            # 관군 전용 (살인, 습격)
  세력_체면_손상_공개적: 3
  이익_제공_또는_협조: -2
  큰_공적_또는_구명: -4

# 중복 가산 금지 규칙
no_double_count:
  - "직접 겪은 사건의 소문 도달은 가산하지 않는다 (당사자는 이미 알고 있다)"
  - "연락두절(+3) 후 사망/중상 확인 시 차액(+1)만 추가"
  - "같은 소문이 여러 망으로 도달해도 세력당 1회만 가산"

# 시간 감쇠 — 세계는 잊는다 (단, 기억 태그는 남는다)
decay:
  every_days: 7
  amount: -1
  floor_after_stage_3: 4          # 3단계(접촉)까지 갔던 대상은 2단계 아래로 잊히지 않음

# 대상 추적 규칙 — "누구에 대한 반응인가"
target_tracking:
  rule: |
    점수는 세력별 × 대상별로 관리한다. 대상은 특정 인물(플레이어, NPC),
    미상의 인물("낯선 낭인"), 타 세력일 수 있다.
    정체를 모르면 가상 대상("미상의 무인")에 누적하고,
    정체가 확인되는 순간 실제 대상으로 병합한다.
  merge_rule: "병합 시 점수 합산 (상한 30). 병합 자체가 '정보 수집 성공' 사건이다."

# ─── 우호 축 (F3 해결) — 주목(위협) 축과 별개로 관리되는 두 번째 축 ───
# 세력 관계 = 주목(위 score: "얼마나 신경 쓰는가") × 우호(favor: "어느 편으로 보는가")
# 두 축은 독립 — 주목 높고 우호 높음 = "유능하고 위험한 자" → 회유·영입 대상
favor:
  range: [0, 30]
  inputs:
    공적_대: 4              # 습격 저지, 조직원 구명, 세력 위기 해결
    공적_소: 2              # 의뢰 완수, 유용한 정보 제공
    협조: 1                 # 소소한 도움, 거래 성사
    배신_적대: -4           # 동시에 주목 축에도 가산된다
  thresholds:
    - { level: 0, name: "낯섦", benefits: [] }
    - { level: 4, name: "안면", benefits: ["하급 의뢰 접근", "이름을 기억해줌"] }
    - { level: 8, name: "신용", benefits: ["신원 보증", "중급 의뢰", "정보 제공"] }
    - { level: 13, name: "공신", benefits: ["추천장", "상급 의뢰", "세력 비호 1회 (관군이 눈감아줌 등)"] }
    - { level: 19, name: "은인", benefits: ["세력 자원 동원 요청 가능", "문파 입문 심사 대폭 가점"] }
  decay:
    every_days: 30          # 은혜는 위협보다 천천히 잊힌다
    amount: -1
    floor_after_공신: 8     # 공신(13) 도달 이력은 장부에 남는다 — 신용 밑으로 잊히지 않음
  target_tracking: "주목 축과 동일 — '미상의 낭인'에도 적립, 정체 확인 시 병합"
  interplay:
    - "주목 3단계(접촉) 이상의 세력 행동은 우호가 톤을 정한다: 우호 높음 → 회유·영입 제안 / 낮음 → 경고·협박"
    - "우호 '공신' 이상은 주목 감쇠를 가속한다 (매 감쇠 -2) — 믿는 자는 덜 감시한다"
  npc_trust_note: "NPC 개인 신뢰와 별개 축 — 곽진이 고마워하는 것(개인)과 상단이 기억하는 것(조직)은 다르다. 개인 신뢰는 보고를 통해 우호 입력이 될 수 있다"

# ═══════════════════════════════════════════════════════════════════════════
# ─── 혈채(血債) — 세 번째 축 (기준 문서: docs/design/blood_debt.md) ───
# ═══════════════════════════════════════════════════════════════════════════
# 주목(score) = "얼마나 신경 쓰는가" · 우호(favor) = "어느 편으로 보는가"
# 혈채(blood_debt) = ★ **"무엇을 갚아야 하는가"**
#
# ★ 왜 세 번째 축이 필요한가: 살인 1건과 10건은 달라야 한다.
#   주목은 감쇠하고(7일 -1), 우호도 감쇠한다(30일 -1). **세계는 잊는다.**
#   그러나 죽은 사람은 돌아오지 않는다 — 잊히지 않는 축이 하나는 있어야 한다.
#   혈채가 그것이다. 이 세계에서 **감쇠하지 않는 유일한 값**이다.
#
# ★ 그리고 혈채는 '악행 포인트'가 아니다. **무고(無辜)의 장부**다:
#   강호의 싸움은 혈채가 아니다. 도적을 베어도, 자객을 죽여도, 비무에서 죽여도 0이다.
#   서로 죽일 각오로 만난 자들 사이에는 빚이 없다. 빚은 **갚을 수 없는 자를 죽였을 때**만 생긴다.
#   → 그래서 이 축은 myeongbun.tags.무고 와 정확히 같은 것을 재고, 정파 연합의 명분이 된다.
blood_debt:
  name: 혈채(血債)
  scale: [0, 30]                    # score·favor·명분·법명분과 같은 스케일 — 신규 통화 없음
  visibility: 내부                  # 플레이어에게 숫자로 보이지 않는다 (world_reaction_system 원칙)

  # ── 두 개의 장부 — 이 축의 전부다 ──────────────────────────────────────
  ledgers:
    암혈채:                         # hidden — 진실
      what: "실제로 죽인 값. 세계는 모른다. **몸과 엔진만 안다**"
      decay: 없음                   # ★ 이 세계에서 감쇠하지 않는 유일한 값
      readers:
        - "simbeop.yml magong — 흡성 갈증·심마 누적"
        - "faction_entry_routes.yml hyeolgyo_contamination — 오염 문턱"
        - "faction_entry_routes.yml magyo_encroachment — 마교가 먼저 손을 내미는 조건"
        - "equipment.yml demonic_weapons.world_response — 혈교 잔당 회수조"
      truth: "★ 완전 범죄는 소문을 지우지 세월을 지우지 못한다. 몸이 장부다"
    현혈채:                         # known — 세계가 아는 몫
      what: "Σ(건별 값 × 노출 배수 × 정확도 배수). **관·소문·명분이 읽는 것은 이쪽뿐이다**"
      decay: { every_days: 30, amount: -1, floor: "공개(witness 2) 건수 × 2" }
      floor_note: "★ 백주에 죽인 것은 잊히지 않는다 — favor.floor_after_공신 과 같은 문법"

  # ── 건당 값 — npc_death.yml npc_types.*.death_weight 그대로 (신규 표 없음) ──
  inputs:
    무고_배경:   1                  # tier1 배경 (소칠·곰보·촌민·행인) — death_weight 1
    무고_기능:   2                  # 기능 NPC (유문·한백·장쇠·백석…) — death_weight 2
    무고_서사:   3                  # 루트·서사 NPC (진운·묵삼·소연…) — death_weight 3
    무장_상대:   0                  # ★ 무인·도적·자객·산적 — **서로 죽일 각오로 만난 자는 빚이 아니다**
    관인:        0                  # ★ 중복 금지 — 포두·현령은 법명분(authority_mandate)으로 간다
    비무_사고:   0                  # 규약 안의 죽음 — 규약 파기는 myeongbun.규약 태그의 몫
  multipliers:
    의식_살인:   2.0                # ★ 흡성 축기·인신공양 목적 — **죽이러 만난 것이 아니라 먹으러 만났다**
    무력한_자:   1.5                # 노인·아이·환자·묶인 포로 (판정 없이 죽는 자)
    항복자_살해: 1.5
    note: "배수는 곱해진다 (상한 없음). 묶인 촌로를 흡성으로 먹으면 1 × 2.0 × 1.5 = 3"

  # ── 노출 — 현혈채 배수. npc_death.yml killer_response.stages 그대로 ────────
  exposure:
    은밀: 0.0                       # witness 0 + body 은닉 + evidence 없음 → ★ 암혈채만 자란다
    흔적: 0.5                       # evidence 정황, 범인 미상 → '미상의 살인마'에 적립
    지목: 1.0                       # witness 1+ 또는 evidence 확정
    공개: 1.5                       # witness 2 (백주·장터·객잔 주청)
    accuracy_link: "rumor.yml accuracy_bands — 괴담(<30) ×0.5 · 오해(30~49) ×0.5 + target_swap ·
      과장(50~79) ×0.7 · 사실적(80+) ×1.0. ★ myeongbun.accuracy_gate 와 **같은 문법**"
    circulation_tell: "★ 혈기심공은 운기 색 은폐 불가 (simbeop stealth_option: false) —
      운기조식 목격 = witness 1 강제 → 노출 배수 하한 1.0. **혈교는 숨을 수 없다**"

  target_tracking:
    rule: "주목·우호와 동일 — 정체를 모르면 '미상의 살인마'에 적립, 확인 시 병합 (merge_rule)"
    merge: "★ 병합의 순간이 이 축의 절정이다 — 흩어져 있던 열 건이 **한 사람의 이름으로 합산된다**.
      그 전까지 세계는 열 개의 사고를 보았고, 그 후로 세계는 한 마리의 짐승을 본다"

  # ── ★ 세계 반응 사다리 — 살인 1건과 10건은 다르다 ────────────────────────
  # 읽는 값 = 현혈채(known). 각 칸은 **기존 표만 호출한다** (신규 반응 발명 없음).
  ladder:
    - stage: 0
      min: 0
      name: 없음

    - stage: 1
      min: 1
      name: 흉흉함
      관: 수사_개시                 # npc_death killer_response.stages.흔적
      rumor: { intensity: 1, band: 괴담 }
      region: { 민심: -1 }
      정파: 없음
      note: "★ 아직 아무도 '한 사람'을 보지 않는다. 그냥 나쁜 일이 있었다"

    - stage: 2
      min: 3
      name: 연쇄
      관: 수배_현상금               # npc_death official_response.수배 — economy 고수_현상금(50000)
      rumor: { intensity: 2 }
      faction_input: { orthodox: 소문_도달_관심일치, gwan_gun: 관할_치안_중대사건 }
      magyo: 호기심_문턱_가산       # faction_entry_routes magyo_encroachment.thresholds.호기심
      note: "★ 관이 처음으로 **한 사람**을 본다 — 아직 이름은 없다 ('미상의 살인마')"

    - stage: 3
      min: 6
      name: 살인마
      관: 포두_추격조_검문          # region_state 치안 임계 효과 그대로
      rumor: { intensity: 3, band: 사실적 }
      faction: { orthodox: { score: +4, favor: -4 } }
      myeongbun: { input: 사파의_민간_학살, value: 5, tags: [무고] }
      hyeolgyo: 회수조_발화         # ★ equipment demonic_weapons.world_response '혈교 잔당 회수조' 재사용
      magyo: 접촉_발화              # ★ '이해해주는 사람'이 온다 (magyo_encroachment.thresholds.의존.contact)
      note: |
        ★★ 이 칸이 이 축의 심장이다.
          세계가 그를 버리는 바로 그 지점에서, 어둠이 그를 줍는다.
          정파의 문이 닫히는 값(favor -4)과 마교가 손을 내미는 값이 **같은 칸에 있다** — 우연이 아니다.
          혈교는 손을 내밀지 않는다. **수확하러 온다** (숙주를 확인하러)

    - stage: 4
      min: 10
      name: 마두(魔頭)
      관: "상급관청 동원 (faction_politics deterrence.authority_power.지역권_상급관청_동원 = 20)"
      rumor: { intensity: 4 }
      myeongbun: { input: 무고한_학살_장터_촌락, value: 8, tags: [무고], target: 플레이어 }
      정파: "주목 5단계(직접 개입) — 토벌대 후보"
      coalition_math: |
        ★ 명분 8 · 무고 태그(-3):
            개방 8-3=5 ≤ 8 → 붙는다 (참여 1 = 규탄)
            화산 16-3-4(인접)=9 > 8 → ★ **아직 안 붙는다**
          → **소연합이 아니다.** 그리고 그것이 옳다 — victims 가 [mingan] 이므로
            피해_당사자(즉시)·동맹_피해(-6)가 전부 0 이다. **남의 일이기 때문이다**
        ★ 이 한 칸이 혈교 루트가 초반에 살아남는 이유이자, 이 세계의 정치가 정직하다는 증거다:
          마을 사람 열 명이 죽어도 무림은 뭉치지 않는다. 무림은 무림의 일에만 뭉친다

    - stage: 5
      min: 15
      name: 혈사(血邪)
      myeongbun: { input: 금기_마공_사용_확인, value: 5, tags: [금기], stacking: true }
      정파: |
        ★ **금기 태그(-4)가 켜지는 순간 판이 바뀐다** — 소림·무당·화산·아미·곤륜이 감응한다
          누적 명분 13(=8+5) 기준: 개방(8-3-4=1) · 화산(16-3-4-4=5) · 팽가(14-3=11) · 소림(17-3-4=10)
          → 참여 3~5 = **소연합 = 토벌대 파견 (5단계)**
        ★ 무고만으로는 안 뭉친 무림이, **금기**에는 뭉친다. 그것이 무림이다
      관: { authority_mandate: { input: 사교_준동_확증, value: 16 } }
      convergence: |
        ★ 여기서 관과 무림이 **처음으로 같은 표적을 본다.**
          법명분 16 → effects '15~24': 관이 그를 쳐도 **무림이 연합하지 않는다**
          → 관무불가침이 그를 보호하지 않는다. 그는 두 층위 모두에서 벌거벗는다

    - stage: 6
      min: 20
      name: 혈겁(血劫)
      myeongbun: { input: 인신공양_의식_발각, value: 9, tags: [금기, 무고] }
      정파: "참여 6+ = 대연합 = 6단계 (지역권 전쟁 상태)"
      coalition_math: "누적 명분 22 · 두 태그 동시 감응(무고 -3 + 금기 -4) →
        소림 17-3-4=10 · 무당 19-3-4=12 · 남궁 21-3=18 · 팽가 14-3=11 → 참여 6~8"
      note: "★ 세력 반응 6단계(토벌)에 **정식으로** 도달한다 — faction_reaction stage_thresholds 그대로"

    - stage: 7
      min: 26
      name: 발호(跋扈)
      관: { authority_mandate: { input: 사교_대발호, value: 30 },
            effect: "★ 즉시 칙명 — defense_burden 해제 (황실 정규군 21)" }
      정파: "무림공적 선포 (참여 10+ · 소문 강도 5 · coalition.size_effect.참여_10_이상)"
      truth: |
        ★★ 관무불가침이 **무의미해지는 유일한 사건.**
          관이 무림을 치는 것도, 무림이 관을 치는 것도 아니다 — **둘이 같은 것을 본다.**
          황실 정규군(21)과 무림 연합(martial 70+ × 지형 × 병질)이 같은 표적으로 온다.
        ★ 이 판은 이길 수 없다. 그리고 이길 수 없어야 한다 —
          **혈교라는 바닥이 있어야 마교가 '그래도 사람으로 남을 수 있는 어둠'이 된다**

  # ── 속죄 — 갚을 수 있는가 ────────────────────────────────────────────────
  atonement:
    principle: "★ 혈채는 **삭제되지 않는다.** 성격이 바뀔 뿐이다"
    inputs:                         # 전부 기존 표 — 신규 대응 발명 없음
      자수:   { ref: "npc_death.yml responses.자수 — 법명분 -10", 현혈채: "감쇠 개시 (-1/30일 floor 무시)" }
      배상:   { ref: "npc_death.yml responses.배상 — 법명분 -6", 현혈채: "건당 -1 (유족이 받아들인 건만)" }
      대공:   { ref: "favor.inputs.큰_공적_또는_구명 (-4)", 현혈채: "-1 / 건당 1회" }
      화해:   { ref: "faction_politics.yml myeongbun.drains.피해_당사자_화해 (-8)",
                note: "★ 민간(mingan)에는 '당사자'가 없다 — 그래서 이 drain 을 쓸 수 없다.
                  무고한 자를 죽인 죄가 가장 안 꺼지는 구조적 이유다" }
    암혈채: "★ 갚을 수 없다. 감쇠도 없고 속죄도 없다 — **몸이 기억한다.**
      개심(simbeop magong.redemption)해도 갈증의 흔적과 심마 태그는 남는다"
    tag: 속죄
    truth: "★ 개심은 힘을 버리는 일이지, 빚을 갚는 일이 아니다"

  # ══ 기계 배선 (engine) — 위의 ladder·inputs 를 코드가 읽는 형태로 옮긴 것 ══════════
  #
  # ★ 새 수치를 발명하지 않는다. min 은 ladder 의 min 과 **글자 그대로 같다** —
  #   ladder 는 사람이 읽는 정본이고, 여기는 그 표를 기계가 집는 손잡이다.
  #   (배선: server-bot BloodDebt.java · Bridge.java · GameListener.java — docs/design/blood_debt.md §6)
  engine:

    # ── B2. 사망 훅의 대상 분류 — "누구를 죽였는가" (inputs 의 여섯 칸으로 떨어뜨린다)
    classification:
      by_faction:                   # 등록 NPC 의 소속 (npcs/cheongha_npcs.yml faction)
        gwan_gun: 관인              # ★ 포두·현령 — 혈채 0. 법명분(authority_mandate)으로 간다 (중복 금지)
      by_tier:                      # 등록 NPC 의 tier (= npc_death.yml death_weight 의 눈금)
        1: 무고_배경
        2: 무고_기능
        3: 무고_서사
      populace_default: 무고_배경    # 무명(populace) — 소칠·곰보·촌민·행인 (death_weight 1 칸)
      by_cause:                     # 사인 (npc_death.yml npc_types.cause_modifier)
        노환_병사: 없음              # ★ 내가 죽인 것이 아니다
        사고: 없음
        비무_사고: 비무_사고         # 규약 안의 죽음 — 0
      armed_roles: [무인, 도적, 산적, 자객, 낭인, 표사, 호위]   # role/job 에 이 낱말이 있으면 무장_상대 (0)
      zero_kinds: [bandit_slain, beast_slain, sparring]        # ★ 다리의 이 kind 들은 애초에 혈채가 아니다

    # ── B1. 두 원장의 산수 — exposure(노출) × accuracy(정확도) = 현혈채 배수. 암혈채는 배수 없음
    exposure_rules:                 # npc_death.yml killer_response.variables (witness · body) 그대로
      은밀:  { witness_max: 0, body: [은닉] }              # → 0.0 (암혈채만 자란다)
      흔적:  { witness_max: 0 }                            # → 0.5 (범인 미상 — '미상의 살인마'에 적립)
      지목:  { witness_min: 1 }                            # → 1.0
      공개:  { witness_min: 2 }                            # → 1.5 (백주·장터)
    accuracy_multipliers:           # rumor.yml accuracy_bands 의 밴드 이름 그대로 (§2.2)
      사실적: 1.0
      과장:   0.7
      오해:   0.5
      괴담:   0.5

    # ── 사다리의 각 칸이 실제로 부르는 것 (min = ladder.min)
    bounty_min: 3                   # stage 2 — 수배·현상금
    bounty_ref: 고수_현상금          # economy.yml price_table.의뢰_보수.고수_현상금 (50000) — 금액은 저기가 정본
    board_block_min: 15             # ★ B7. stage 5 — 게시판이 닫힌다 (§11 — 객잔이 문을 잠근다)

    faction:                        # stage 3 — 세계가 그를 버리는 칸
      - { min: 6, faction: orthodox, score: 4, favor: -4 }

    myeongbun:                      # 명분 발화 (faction_politics.yml myeongbun.inputs — 값·태그는 저기가 정본)
      - { min: 6,  input: 사파의_민간_학살,      victims: [mingan] }
      - { min: 10, input: 무고한_학살_장터_촌락, victims: [mingan] }
      - { min: 20, input: 인신공양_의식_발각,    victims: [mingan] }

    mandate:                        # 법명분 — ★ 가산이 아니라 **개방**이다 (게이지를 이 값까지 올린다)
      - { min: 15, input: 사교_준동_확증, value: 16 }
      - { min: 26, input: 사교_대발호,   value: 30 }

    # ── B6. 운기조식 목격 — ★ 혈교는 숨을 수 없다 (simbeop.yml stealth_option: false)
    magong_witness:
      trigger: "심법의 stealth_option == false 인 자가 운기조식을 했다 (사람이 보는 곳에서)"
      myeongbun: 금기_마공_사용_확인   # ignition ① — 무고로는 안 뭉친 무림이 금기에는 뭉친다
      exposure_floor: 1.0            # ★ 그 뒤로 이 몸에 '은밀'은 없다 — 노출 배수 하한 (§2.2 circulation_tell)
      rumor: { tags: [금기, 마공, 무인], intensity: 3, accuracy_kind: 직접_목격 }

  # ── 다른 축과의 관계 ────────────────────────────────────────────────────
  interplay:
    vs_주목: "혈채는 주목의 **입력**이지 주목 그 자체가 아니다 —
      혈채 사다리의 각 칸이 inputs(관할_치안_중대사건 등)를 호출한다. 이중 계상 금지"
    vs_우호: "혈채 6+ 부터 정파 favor 에 직접 감산(-4). ★ 그러나 **사파 favor 는 오른다**
      (haomun_entry.direct_approach.branches.악명_보유 = 환대) — 문은 하나가 아니다"
    vs_법명분: "관인 살해는 혈채 0 · 법명분으로 간다 (중복 금지).
      단 혈채 15+ 는 법명분 신규 입력(사교_준동_확증 16)을 **연다** — 그때 두 축이 만난다"
    vs_명분: "혈채는 myeongbun.inputs 를 **발화**시킨다. 명분 자체를 만들지 않는다 —
      명분은 언제나 사건이 만든다 (faction_politics 제2원칙)"

# ═══════════════════════════════════════════════════════════════════════════
# ─── 새외(塞外) — ★ 반응 사다리가 **거의 굴러가지 않는다.** 그리고 그것이 옳다 ───
# ═══════════════════════════════════════════════════════════════════════════
#
# ★ 이 파일의 전제는 '조직 채널 도달'이다 (faction_politics formation.channel_gate:
#   "그 세력의 조직 채널에 사건이 도달해야 평가한다" — 정파망 3일, 개방/하오문 1일).
#
# ★★ 그런데 **새외에는 채널이 없다.** 소문망이 중원에서 끝난다 —
#    개방의 거지도 가욕관 밖으로는 안 나간다. 하오문의 망도 관문에서 멎는다.
#
# ★ 귀결: **당신이 중원에서 무엇을 하든 새외는 모른다.**
#   화산의 장문인을 죽여도 대칸은 모른다. 그것이 이 세계의 정직한 지리다.
saeoe_reaction:
  channel: 없음
  rule: "★ 새외 세력의 주목(score)·우호(favor)는 **직접 겪은 사건으로만** 오른다.
    소문_도달 입력(+1/+2)이 **아예 발화하지 않는다** — 소문이 거기까지 안 간다"

  # ── 그런데 딱 세 개의 채널이 있다. 그리고 셋 다 **상로(商路)** 다
  the_three_channels:
    상로:
      carrier: seoyeok_sangmaeng
      ref: "world_map routes.sangro_silk"
      speed_days: 93                # ★ 소문이 아니라 **상단의 걸음**이다. 고창까지 93일
      note: "★★ **상인이 유일한 소문망이다.** 그리고 상인은 **팔릴 이야기만** 나른다 —
        정확도가 아니라 **재미**로 고른다 (rumor accuracy_bands 과장 밴드 ×0.7 고정).
        ★ 그래서 새외가 아는 중원은 언제나 **과장된 중원**이다"
    밀선:
      carrier: jangang_suroche
      ref: "world_map routes.haero_dongyeong · relations jangang_suroche ↔ dongyeong +1"
      speed_days: 57
      note: "★ 동영만 이 채널을 갖는다 — **그래서 동영만 중원을 안다.** 그리고 그래서 온다"
    귀환자:
      carrier: "★ 플레이어 (saeoe_common.귀환의_값)"
      note: "★★ **새외 루트 플레이어가 곧 채널이다.** 당신이 걸어서 나른다.
        ★ 그리고 그것이 '새외에 다녀온 자'를 세계가 첩자로 의심하는 이유다 — **틀린 의심이 아니다**"

  # ── 감쇠 — ★ 이 파일에서 두 번째로 감쇠하지 않는 값
  decay:
    score:  { every_days: 30, amount: -1, note: "★ 중원(7일 -1)보다 **네 배 느리다**" }
    favor:  { every_days: 90, amount: -1, note: "★ 중원(30일 -1)보다 세 배 느리다" }
    rationale: |
      ★ 유목민은 잊지 않는다. 문자가 없어서 **노래로 기억한다** —
        그리고 노래는 세대를 넘는다 (blood_debt.암혈채: '감쇠하지 않는 유일한 값' 과 같은 축).
      ★ 밀교는 기록한다 (경전). 오독교는 몸에 새긴다 (고蠱).
      ★★ **중원만이 잊는다.** 그리고 그것이 중원이 매번 놀라는 이유다
    floor: "★ 없다 — 다만 **한 번 3단계(접촉)에 닿으면 2단계 아래로 안 내려간다** (기존 floor_after_stage_3 그대로)"

  # ── 반응 단계 — ★ 표는 그대로다. **속도만 다르다**
  stage_note: |
    ★ stage_thresholds(0~6)를 그대로 쓴다 — 신규 사다리 없음.
    ★ 다만 새외의 6단계(토벌/전쟁)는 중원의 6단계와 **규모가 다르다**:
      · 문파의 6단계 = 토벌대 (수십 명)
      · 관의 6단계   = 성군 (수천 명)
      · ★ **북막의 6단계 = 남하(南下)** — 만 명이 온다 (faction_politics rupture_scenarios.saeoe_invasion)
    ★ 그래서 새외의 주목을 6단계까지 올리는 것은 **개인이 할 수 있는 일이 아니다.**
      대칸은 한 사람 때문에 군대를 내지 않는다 — **명분이 아니라 이익으로 움직이므로** (기근·상로·조공)

  # ── ★ 예외 하나 — 동영만 다르다
  dongyeong_exception:
    why: "★ 밀선 채널(57일)이 있고, 강남에서 26일이다 — **유일하게 중원을 실시간으로 안다**"
    effect: "★ 동영의 주목 축은 **중원 세력과 같은 속도로 굴러간다** (7일 -1).
      왜구를 벤 자를 그들은 기억하고, **다음 배에 그 이름이 실린다**"
    hook: "★ dongyeong_entry.direct_approach.branches.왜구_격퇴_이력 = '저쪽이_먼저_안다' —
      **죽인 자의 동료가 당신을 찾아온다.** 그리고 그것이 초대다"

# ─── 정치층 훅 (config/faction_politics.yml) ───
# 이 파일(주목·우호)은 **세력 대 개인**이다. 명분·연합은 **세력 대 세력**이다.
# 두 층은 곱해진다 — 아래가 그 접합면이다. 새 통화 없음 (명분도 0~30, 같은 감쇠 문법).
politics_hook:
  coalition_wartime:
    rule: "연합 참여 세력은 해당 사안 대상의 주목 score 를 +2/라운드(7일) 가산 (전시 = 온 조직이 찾는다)"
  coalition_contribution:
    rule: "연합에 기여하면 참여 세력 **전체**에 favor 공적_소(+2) — 연합이 곧 인맥이다"
  disavowal:
    trigger: "faction_politics.authority_mandate >= 10 AND 무림 명분(myeongbun) < 8"
    override: "favor.decay.floor_after_공신(8) 무효 — 이 규칙의 유일한 예외 (공신 이력조차 무너진다)"
    effect: "정파 score +6 / 정파 favor -8 / 사파 favor -4 / '세력 비호 1회'(공신 13 혜택) 사용 불가"
    note: "무림이 그를 버리는 것은 냉혹함이 아니라 생존이다 — 한 사람 때문에 관무전쟁을 할 수는 없다"

# 단계별 세력 행동 지침 (GM 출력용 — 반드시 서사로 표현)
stage_actions:
  1: "내부 대화에 화제로 등장. 플레이어는 소문으로만 감지 가능"
  2: "탐문, 수배 의뢰, 미행 시도. 세계에 조사 흔적이 보이기 시작"
  3: "사자 파견, 경고장, 우연을 가장한 접촉"
  4: "구체적 제안 — 의뢰, 회유, 협박. 거절 시 점수 +2"
  5: "무력 행사, 습격, 납치, 공개 대립"
  6: "조직 전체의 전쟁 상태. 지역권 단위 사건으로 승격"
