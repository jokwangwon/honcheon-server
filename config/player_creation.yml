    # ★★ 출분(出奔) — **집을 나온 아이의 발단** (2026-07-14 사용자 지시로 신설. B-071)
    #
    # 【왜 생겼나】 `가출한_무가의_자식` 이 **재난형 발단 풀을 빌려 쓰고 있었다** — 집은 멀쩡히
    #   살아 있는데 발단이 *"가문의 몰락"* 이라고 하니 **결이 어긋났다.**
    #
    # 【★ 재난형과 무엇이 다른가 — 그 차이가 문장에 드러나야 한다】
    #     재난형 (당한 것) : 그날 밤 **모든 것이 달라졌다.** 아이는 **휩쓸린다**
    #     출분형 (택한 것) : 그날 밤 **내가 담을 넘었다.** 아이는 **저지른다**
    #   → 그래서 `movement` 가 "쫓겨남/이산" 이 아니라 **"제 발로"** 다. 그리고
