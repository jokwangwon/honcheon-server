      trace: [세가의 이름 (숨긴), 몸에 밴 예법 (숨겨도 태가 난다), 넉넉한 노자]
      long_hook: "아무 일도 일어나지 않는 강호란 없다 — 이 평범한 출행은 언제까지 평범할 것인가"
