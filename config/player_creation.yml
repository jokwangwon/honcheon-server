    #
    # 【문법은 그대로 따랐다】 `family_only` · `cause` · `movement` · `trace` · `long_hook` ·
    #   `goal_candidates` — 기존 발단(수행_파견 등)과 **같은 칸**이다. 새 문법을 발명하지 않았다.
    #
    # 【★ 능력치·기술을 주지 않는다】 헌법 그대로 (families grants 원칙: 집안은 능력치를 안 준다).
    #   출분은 **흔적(trace)** 만 남긴다 — 흔적은 물건과 소양이지 힘이 아니다.
    # ═══════════════════════════════════════════════════════════════════════════════

    담을_넘다:
