initial_goal:
  required: true
  examples: ["화산파 입문 단서 찾기", "청하현에서 자리 잡기", "가문의 원수 조사"]

# ═══════════════ 마크 첫 접속 (MVT) — 아무도 말을 걸지 않았다 ═══════════════
#
# 【2026-07 시트 접합 패스】 이 절은 **유령 절이었다**: `initial_goal` 은 config 에 있는데
# 아무도 읽지 않았고, MVT 의 PlayerJoinEvent 처리기는 팩(PackPusher)과 형체(MobDisplay) 둘뿐이었다.
# 아무것도 모르는 사람이 들어와서 **아무 말도 듣지 못하고** 빈 세계에 섰다.
#
# 그리고 더 나쁜 것: `/혼천 수련` 을 치지 않으면 `curriculum` 이 비고, 빈 curriculum 은
# `Growth.train` 에서 즉시 `return 0` 이다 — **아무것도 자라지 않는다.** 그것을 말해 주는 것이 없었다.
#
# 여기 적힌 것이 첫 접속이 말하는 전부다 (코드는 문장을 지어내지 않는다).
# §-코드는 마인크래프트 색 코드다 (PUA 문자 금지 — 여기에도 저기에도).
mvt_onboarding:

  # ─── 접합되지 않은 몸 — 강호에 이름이 없다 ───
  # 시트가 없으므로 화후도 쌓이지 않는다. 조용히 반쪽 세계에서 놀게 두는 것이 가장 나쁘다.
  unlinked:
    title: "너는 아직 강호에 없다"
    subtitle: "/혼천 접속"
    lines:
      - "§7이 몸에는 장부가 없다. 베어도 익혀도 §f어디에도 적히지 않는다§7."
      - "§7디스코드에서 §f/혼천 시작§7 으로 사람이 되고, 여기서 §f/혼천 접속§7 으로 몸을 잇는다."
    nag_seconds: 180          # 다시 말해 주는 주기 — 잔소리가 되지 않을 만큼만

  # ─── 접합된 몸 — 손에 잡히는 첫 목표를 준다 ───
  linked:
    goal_prefix: "§6첫 걸음"
    goal_source: initial_goal.examples   # ★ 위 initial_goal 절이 정본 — 여기서 지어내지 않는다
    lines:
      - "§7하루는 5구간이다. §f/혼천 수련 <과목> <구간>§7 — 어디에 쓸 것인가가 곧 네 빌드다."
      - "§7수련 배분이 비면 §c아무것도 자라지 않는다§7. 아래가 지금 깔린 기본 배분이다."

  # ─── 첫 배분 — 명령을 모르는 자의 몸도 자라야 한다 ───
  # 과목 이름은 training.yml curriculum.subjects 의 키다 (없는 과목이면 조용히 무시된다).
  # 합은 time.yml segments_per_day 를 넘지 않는다. 기본값은 '몸과 손' — 심법이 없으면 내공은 새므로.
  default_curriculum:
    외공: 2
    초식: 3
