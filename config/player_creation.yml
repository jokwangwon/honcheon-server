        상한: 3
        결과: "총합 11 → 19 = 소년으로 시작한 아이와 동일 (7종 프리셋 전부 일치 검증됨)"
      소년_to_약관:
        배분: +1                      # 총합 19 → 20 — 옛 성인 기준 총합 20의 출처가 여기다
        상한: "경지 규칙으로 이관 (attribute_cap_by_realm — 범인 3)"
        해제: 아이_취급_보정

