# ─── 시작 나이와 인생 진행 v2 (기준: age_and_lifepath.md v2) ───
# 전원 유년/소년 시작. 성인 시작 폐지 (성인은 NPC의 영역).
# 생성 절차: 성향 → 집안 → 시작 나이 → 발단 사건 → 배분 → 초기 목표
# 나이는 달력이 아니라 사건(장 종결 시 시간 도약)이 먹인다.
age_and_lifepath:
  version: 2
  starting_realm: 범인          # 전원 무공 백지 — 사승 기연 자격이 전원에게 열림

  age_brackets:
    유년:
      age_range: [8, 12]
      base_value: 1             # 아이는 성인 평균(2)보다 약하다 (F5 패치 — PT-002)
      free_points: 4
      creation_max: 2           # 아이의 몸
    소년:
      age_range: [13, 15]
      base_value: 2
      free_points: 5
      creation_max: 3

  # 아이 취급 보정 — 약관(16세) 도달 시 전부 해제
  child_modifiers:
    은밀_엿듣기_정보수집: +1     # 아무도 아이를 경계하지 않는다
    설득_협상_위협: -1           # 아무도 아이의 말을 무겁게 듣지 않는다
    전투_성인상대: { 유년: -2, 소년: -1 }   # 체격 차 — 경지 격차와 별도
    expires: "약관(16세) 도달"

  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 결(結)과 무늬 — **심리 테스트가 집안을 낳고, 주사위가 그 집의 사정을 정한다**
  #
  # 사용자 (2026-07-14, 재정리): *"**성향 → 집안으로 이어질 수밖에 없습니다.**
  #                                왜냐하면 **심리 테스트를 통해 집안이 결정 나기 때문입니다.**"*
  #
  # 【★★ 화살표는 **한 방향**이다 — 이것을 거꾸로 읽지 마라】
  #
  #        성향 ──→ 집안     ✅ **이것이 설계다.** 유년의 기억이 집안을 낳는다
  #        집안 ──→ 성향     ❌ **이것은 아니다.** 사용자가 거부했다:
  #                             *"집안에 따라 **성격이 정해지는** 건 아니잖아요?"*
  #
  #   ★ 담당자가 2026-07-14 에 이 둘을 **뒤섞어 읽고** 대응표를 폐기했다가 되살렸다.
  #     같은 실수를 반복하지 마라 — **거부된 것은 반대 방향이다.**
  #     "무가에서 태어났으니 협의롭다" 는 틀렸고, "협의로운 아이의 유년은 무가에서 자랐다" 는 맞다.
  #     **생성은 뒤에서 앞으로 읽는다**: 아이가 먼저 있고, 그 아이가 자랐을 법한 집을 세계가 고른다.
  #
  # 【옛 병】 `birth()` 가 집안을 **전체에서 통째로 주사위**로 뽑았다:
  #     `familyKeys.get(dice.nextInt(familyKeys.size()))`
  #   그래서 **유년의 기억 아홉 문항이 집안에 아무 자국도 남기지 않았다.** 장터에서 뛰어들어
  #   막아선 아이와 문틈에 귀를 댄 아이가 **같은 확률로 같은 집에서** 태어났다.
  #   사용자: *"세가는 **태어났을 때부터 달라야** 합니다."*
  #
  # 【★ 그러나 주사위를 없애지도 않는다】 사용자: *"같은 선택지에선 **주사위로 특색을 부과**한다."*
  #
  #     심리 테스트  →  「결」   어느 갈래인가        (결정론 — 내 선택이 세계에 자국을 남긴다)
  #     주사위       →  「무늬」 그 갈래 안에서 누구인가 (우연 — 같은 답이 같은 사람이 되지 않는다)
  #
  #   ★ 왜 두 층이 다 필요한가:
  #     · 테스트만이면 → **같은 답 = 같은 캐릭터.** 최적해가 발견되는 순간 **모두가 같아진다.**
  #     · 주사위만이면 → (옛 방식) **내 선택이 세계에 아무 자국도 안 남긴다.**
  #
  # 【★ 무엇이 결이고 무엇이 무늬인가 — 이 표가 그 경계다】
  #     결 (테스트가 정한다) : **집안의 종류** — 어떤 집에서 자랐는가
  #     무늬 (주사위가 정한다): 그 집의 **구체적 사정** — 발단(inciting_incidents) · 연령대 · 나이 · 시작 자금
  #   즉 "무가의 자식"인 것은 네 답이 정했고, "그 무가에 무슨 일이 있었는가"는 운명이 정한다.
  #
  # 【결정론】 주사위는 **탄생에 한 번** 구르고 시트에 **박힌다** (재굴림 없음).
  #   그래서 씨앗을 심을 필요가 없다 — 같은 캐릭터를 다시 열면 시트에 적힌 그대로다.
  #
  # 【★★ 근거 — 각 줄이 어디서 왔는가. 「판단」이라 적힌 줄은 **담당자가 정한 것**이다】
  #   ★ 사용자가 이 표를 **보고 승인하거나 고친다.** 근거 약한 줄을 담당자가 혼자 확정하지 않는다.
  #   등록부에서 읽어낸 줄은 근거 파일·절을 적었다. 아래 `why` 를 보라.
  family_affinity:

    협의형:                                  # 몸으로 나선다 — 버티고, 치고, 말한다
      candidates: [무가의_자식, 농가의_자식]
      why: "무가 — 【등록부】 families.무가의_자식.grants { 기술: {검법: 1}, 소양: 예법 }
            (의를 몸으로 배운 집).
            농가 — 【판단】 world_link '땅과 계절, **도적의 첫 표적**' 에서 '지킬 것이 있는 아이' 로 읽었다"

    생존형:                                  # 먼저 보고 먼저 뛴다 — 오래 사는 법을 안다
      candidates: [농가의_자식, 객잔집_자식]
      why: "농가 — 【판단】 world_link '땅과 계절, 도적의 첫 표적' (사는 법을 몸으로 안다).
            객잔 — 【판단】 grants 고객_파악 (눈치가 곧 생존이다)"

    야망형:                                  # 올라간다 — 힘과 혀와 머리로
      candidates: [몰락_무가의_자식, 무가의_자식]
      why: "몰락무가 — 【등록부·강함】 disposition_presets.야망형.recommended_identities:
            [**몰락_세가_자제**] — 등록부가 **이미 이 둘을 짝지어 두었다**.
            grants 흔적 '이름' = 되찾을 것이 있는 아이.
            무가 — 【판단】 support.비용 '이름의 무게' (오를 사다리가 이미 있는 아이)"

    자유형:                                  # 길 위의 아이 — 발과 눈과 넉살
      candidates: [표국집_자식, 농가의_자식]
      why: "표국 — 【등록부·강함】 disposition_presets.자유형.recommended_identities: [**떠돌이_표사**] ·
            routes [낭인, **표국**, 유람] · families.표국집_자식.world_link
            '아버지의 동료들, **길 위의 삶**' — 세 곳이 같은 곳을 가리킨다.
            농가 — 【판단】 들에서 자란 아이의 발"

    탐구형:                                  # 몸이 아니라 이치 — 그릇·눈·말·머리
      candidates: [의원집_자식, 상가의_자식]
      why: "의원 — 【등록부·강함】 disposition_presets.탐구형.recommended_identities: [**의원_제자**] ·
            routes [제갈세가, 무당파, **의원**, 약재상_제자, 정보상, **약왕곡**] ·
            families.의원집_자식.grants { 기술: {의술: 1} } — 세 곳이 일치한다.
            상가 — 【등록부】 families.상가의_자식.grants.소양 '**글눈**' (이치를 글로 배우는 아이)"

    은밀형:                                  # 아무도 아이를 경계하지 않는다 — 그 틈으로 산다
      candidates: [객잔집_자식, 몰락_무가의_자식]
      why: "객잔 — 【등록부】 families.객잔집_자식.world_link '**소문의 한가운데**' +
            starting_identities.하오문_말단.start_location 이 **cheongha_inn** 이다
            (등록부가 은밀의 자리를 객잔에 두었다).
            몰락무가 — 【★ 사용자 확정 · 서사 (2026-07-14)】 원문:
            *'**몰락 무가에서 복수를 위해 이를 갈고 은밀해졌다** 이런 느낌'*.
            ★ 즉 **은밀함은 타고난 것이 아니라 만들어진 것이다** — 집이 무너진 아이가
            소리 없이 움직이는 법을 **배웠다**. 화살표와 정확히 맞는다:
            '은밀한 아이의 유년은 몰락한 무가에서 자랐다'.
            (담당자가 어제 '근거 없음'으로 올렸던 줄 — B-070 으로 물었고, 사용자가 근거를 주었다)"

    이익형:                                  # 값을 매기고 흥정한다 — 셈과 눈치와 발품
      candidates: [상가의_자식, 객잔집_자식]
      why: "상가 — 【등록부·강함】 families.상가의_자식.grants { 기술: {흥정: 1} } +
            disposition_presets.이익형.recommended_identities: [**상단_견습**] ·
            routes [**상단**, 정보상, 중개인] — 세 곳이 일치한다.
            객잔 — 【판단】 셈과 손님 (grants 고객_파악)"

    # ★ 동점(아직 정해지지 않은 아이)일 때 — 동점 성향들의 후보를 **합쳐서** 주사위를 굴린다.
    #   좁히지 않는다 (disposition_test.yml scoring.wide_tie 의 정신 그대로).
    on_tie: 후보_합집합

    # ★ 가출한_무가의_자식 은 여기 **없다** — 태어나는 집이 아니다 (거절로만 닿는다. refuse_house)
    # ★ 세가의_자제 도 여기 **없다** — 성향이 직접 낳는 집이 아니라 **승격**으로만 닿는다 (아래)

  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 세가 승격 — 무가가 걸린 아이 중, 드물게, 오대세가의 자제다 (사용자 확정 2026-07-25)
  #
  #   결(테스트)은 지켜진다 — 협의·야망의 아이가 무가를 낳는 것은 그대로다. 무늬(주사위)가
  #   격을 올린다: 「무가 중에서도 **그 무가**였다」. 드묾이 대사건의 무게다 — 옛 등록부의
  #   「오대세가급 직계 배제」는 이 승격 문으로 **개정**된다 (백지의 평등은 grants 가 지킨다:
  #   세가도 능력치는 없다 — 더 큰 입장권과 더 큰 빚뿐이다).
  sega_promotion:
    from: 무가의_자식
    to: 세가의_자제
    # ★사용자 확정 (2026-07-25): "플레이어 20명 중 2~3명 정도는 세가가 되었으면" —
    #   산수: P(무가 당첨) ≈ 1/7 (협의·야망 두 성향 × 후보 절반) 이므로
    #   전체 세가율 = 1/7 × chance ≈ 목표 10~15% → chance 80 (≈ 20명 중 2.3명).
    #   트레이드오프: 향반 무가로 남는 아이는 무가 당첨의 20% (≈ 20명 중 0.6명)로 희소해진다 —
    #   실측 분포가 어긋나면 이 숫자 하나만 고친다 (코드 불변).
    chance_pct: 80

  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 적서(嫡庶) — **같은 집에 태어났는데 세상이 아는 무게가 다르다** (2026-07-14 사용자 확정)
  #
  # 사용자 원문: *"세가는 좀 더 크게. 「**어느 세가의 둘째아들이 태어났다**」는 **다른 세가나
  #   문파에서도 알 만한 대사건**입니다. (대신 **적자냐 외자식/서자냐는 주사위로 결정**되고,
  #   **적자인 경우에만 5**, **외자식/서자인 경우는 3**으로)"*
  #
  # 【★ 이것이 「결 → 무늬」 구조의 가장 깨끗한 사례다】
  #     결 (심리 테스트) : 성향이 **무가**를 낳는다        — 내 선택이 남긴 자국
  #     무늬 (주사위)    : 그 집 안에서 **적자인가 서자인가** — 운명이 정하는 사정
  #   → **같은 집에 태어났는데 세상이 아는 무게가 다르다.** 그 자체가 이야기의 씨앗이다.
  #
  # 【★ 어느 집에 적서가 있는가 — 등록부에 「세가 표」가 **없었다**】
  #   factions.yml 은 **오대세가**(남궁·모용·제갈·당가·팽가)를 알지만 그것은 **NPC 세력**이고,
  #   플레이어의 집안 중 「이름이 있는 살아 있는 집」은 **무가의_자식 하나뿐**이다
  #   (families.무가의_자식.scale: "현·부 단위 향반 무가").
  #   · 몰락무가 — 집이 **이미 무너졌다.** 그 집에 아이가 나는 것은 **대사건이 아니다**
  #   · 가출한무가 — **태어나는 집이 아니다** (거절로만 닿는다)
  #   → 그래서 `houses` 는 **무가의_자식 하나**다. ★ 표가 아니라 **판단**이므로 아래에 근거를 적었다.
  #     ★★ 【사용자 확인 요망】 **몰락무가의 아이에게도 적서를 적을 것인가?**
  #        (상속·복수의 명분에서는 의미가 있다 — 그러나 **소문의 대사건은 아니다**)
  birth_rank:
    enabled: true
    sheet_key: 적서                  # characters.sheet_json 의 칸 (스키마 변경 없음 — 시트는 자유 서식)
    # ★2026-07-25 개정 — 세가의_자제(승격 신설 · 탄생이 대사건인 집) + 몰락_무가의_자식
    #   (【사용자 확인 요망】이었던 미결 — **적는다**로 확정: 상속·복수의 명분에서 의미가 있다.
    #    다만 무너진 집의 탄생은 소문의 대사건이 아니다 — 소문 강도 0, 시트에만 적힌다)
    houses: [무가의_자식, 세가의_자제, 몰락_무가의_자식]

    # ─── 주사위 — ★★ 비율에 **등록부 근거가 없다** (적자·서자·적서: 전 저장소 검색 0건) ───
    #
    # 【담당자가 지어내지 않았다 — 후보를 내고 묻는다】 아래는 **제안값**이다:
    #     (가) 50 : 50  ← ★ 담당자의 제안 (아래 값)
    #         근거: 정보가 없을 때의 정직한 사전확률이고, **주사위가 진짜 갈림길**이 된다
    #         (사용자가 원한 「무늬」의 뜻 그대로 — 같은 답을 낸 둘이 다른 사람이 된다)
    #     (나) 30 : 70  — 적자를 희소하게 (강도 5 = '천하' 는 사다리의 꼭대기다. 흔하면 안 된다는 관점)
    #     (다) 70 : 30  — 적자가 정상, 서자가 예외 (한 집에 정실은 하나라는 관점)
    # ★ 사용자가 고르면 이 표만 고치면 된다 (코드는 안 건드린다).
    weights:
      적자: 50
      서자: 50

    options:                         # ★ 등록제: 여기 없는 적서는 세계에 존재하지 않는다
      적자:
        label: "적자(嫡子)"
        # ★ 사용자가 강도를 **직접 말했다** ("적자인 경우에만 5") — 지어낸 값이 아니다
        rumor_intensity: 5           # rumor.yml reach_by_intensity 5 = "천하"
        note: "정실의 자식 — 가문의 이름을 이을 아이. 태어난 것 자체가 강호의 소식이다"
      서자:
        label: "서자(庶子) · 외자식"
        rumor_intensity: 3           # rumor.yml reach_by_intensity 3 = "현 전체 + 인접 현"
        note: "이름은 같은 집인데 무게가 다르다 — 담장 안에서부터 그것을 안다"

    # ★★ 적서가 **소문 말고 무엇을 더 가르는가** (상속·대우·NPC 반응·가출 동기)는
    #   **이번 바퀴에 잇지 않았다** (청구서 B-076). 다만 **시트에 남으므로** 나중에 쓸 수 있다.
    #   ★ 능력치는 **주지 않는다** — 집안이 능력치를 주지 않는 것과 같은 헌법이다 (grants 원칙).
    grants_attributes: false

  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 혈연의 묶음 — **어느 집끼리 남매인가** (2026-07-14 사용자 확정)
  #
  # 사용자: 가출한 아이는 **원래 집(무가)의 남매로 잡는다**.
  #   *"절연은 관계를 끊는 것이 아니라 **관계를 무겁게** 만든다. 호적에서 지워도 **형은 형이다.**"*
  #   → 담당자의 설계와 정확히 맞는다: *"집은 살아 있고 **돌아갈 문이 있다** — 유혹이자 굴레."*
  #
  # 【몰락무가는? — ★ 등록부에 근거가 있다. 지어내지 않았다】
  #   · 가출한_무가의_자식 에는 **`from: 무가의_자식`** 이 있다 (어느 집을 버렸는지 등록부가 안다)
  #   · 몰락_무가의_자식 에는 **`from` 이 없고**, `start_region_examples: [각지]` 다 —
  #     즉 **어디에나 있는, 무너진 남의 집**이다. 무가의_자식과 **같은 집이 아니다.**
  #   → 그래서 몰락무가는 **제 묶음**이다. 무가의 남매로 잡지 않는다.
  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 가문(家門) — **집안이 「유형」에서 「한 채의 집」이 된다** (2026-07-14 사용자 확정, B-077)
  #
  # 사용자: 「청하현 남쪽의 이(李)씨 무가」 — **그 집이 있다.** 아버지가 있고, 형이 있고, 흥하거나 망한다.
  #
  # 【★ 지금 무엇이 거짓인가 — 담당자가 만든 병이다】
  #   어제 담당자가 형제 축을 짜면서 **같은 집안 유형의 산 자를 전부 남매로 묶었다.**
  #   그래서 지금 이 순간 **농가의 아이 둘이 남매다.** 서로 다른 농가인데.
  #   → **이번 바퀴에 그 거짓을 껐다** (아래 `enabled: false` — 가문이 서기 전까지 형제는 **비어 있다**).
  #     거짓 형제보다 **없는 형제**가 낫다. 다행히 아직 아무도 형제를 쓰지 않는다 (B-072).
  #
  # 【★★ 이번 바퀴에 한 것 / 안 한 것 — 반쯤 지어 놓고 멈추지 않는다】
  #   했다   : ① 거짓 형제를 껐다  ② 그릇을 만들었다 (db/migrations/008_가문.sql — **아직 안 돌렸다**)
  #            ③ 눈을 세웠다  ④ 결정할 것을 **전부 적어 놓았다** (아래 open_questions)
  #   안 했다: **사람을 집에 앉히지 않았다.** 왜냐하면 **누가 어느 집에 태어나는가**(①)가
  #            세계관 결정이고, 그것 없이는 표를 채울 수가 없기 때문이다.
  #            ★ 배정 규칙을 지어내면 **형제의 존재 조건 자체를 담당자가 발명하는 것**이다.
  #
  # 【★ 미리 쓰기(prerender)와의 충돌 — 미리 검사했다】
  #   서장의 지문은 `캐릭터id : 장면 : 직전등급` 이다 (seojang.yml prerender.fingerprint).
  #   가문은 **탄생에 정해지고 바뀌지 않으므로** 지문에 넣지 않아도 낡지 않는다.
  #   ★★ 그러나 **가문이 나중에 흥망하면**(⑤) 서장의 글이 거짓말이 된다 —
  #      그때는 **지문에 가문의 상태를 넣어야 한다.** 흥망을 열 때 이 줄을 먼저 읽어라.
  house_system:
    enabled: true                  # ★★ 가문이 섰다 (2026-07-14 — 배정·성씨·상태가 정해졌다)
    table: houses                  # db/migrations/008_가문.sql (적용됨 — 스키마 8)
    character_column: house_id     # NULL = 가문이 아직 없다 (마이그레이션 전에 태어난 사람)

    # ★ 헌법 — 가문이 실체가 되어도 **그대로다**
    grants_attributes: false       # 가문은 능력치를 주지 않는다 (집안 grants 원칙과 동일)

    # ═══════════════════════════════════════════════════════════════════════════
    # ★★ ① 배정 — **주사위가 「기존 집에 태어나는가 / 새 집이 서는가」를 가른다**
    #                                          (2026-07-14 사용자 확정: "1. 다" = 주사위)
    #
    # 【★ 이것이 형제의 존재 조건이다】 아무도 기존 가문에 안 들어가면 **형제는 영원히 안 생긴다.**
    #   그래서 이 표의 수는 **형제가 실제로 생기는지**로 검산해야 한다 —
    #   눈(tools/house_audit.py)이 **몬테카를로로 실측**한다. 수를 고치면 **다시 돌려라.**
    #
    # 【★ 대가족을 무엇이 막는가 — 「자식 수 상한」을 **주사위의 가중치로** 넣었다】
    #   담당자가 끌렸던 (라)안을 (다)안 **안에** 녹였다. 사용자가 (다)를 골랐으므로 그것이 뼈대다:
    #
    #       빈자리 = 상한 − 지금 그 집의 아이 수
    #       · 빈자리가 0 인 집은 **후보에서 빠진다** (스무 명이 한 집에 몰리지 않는다)
    #       · 남은 집들 중에서는 **빈자리가 많은 집일수록** 뽑힐 확률이 높다 (가중 추첨)
    #       · 후보가 하나도 없으면 **새 집이 선다** (상한이 곧 새 집의 방아쇠다)
    #
    #   ★ 그래서 상한은 **두 가지를 동시에** 한다: 대가족을 막고, 새 집을 낳는다.
    #     별도의 '새 집 확률'을 발명하지 않아도 된다 — 하나의 수가 두 일을 한다.
    #
    # 【★★ 수에는 등록부 근거가 없다 — 지어내지 않고 제안한다】
    #   전 저장소 검색: 형제 수·자식 수·가문 규모에 관한 수치 **0건**.
    #   아래는 **제안값**이다. 실측(house_audit)을 함께 적었으니 **보고 고르면 된다.**
    assignment:
      mode: 주사위                 # ★ 사용자 확정 (다)

      # ═══ ★★ 기존 집에 태어날 확률 (%) — **2026-07-14 사용자 확정: 60 → 10** ═══
      #
      # 사용자 원문: *"가문의 수는 **확률을 좀 더 줄였으면** 좋겠어.
      #   **간혹가다 한 명 두 명씩 있는 거지**, 너무 다들 형제가 있는 것처럼 느껴져서 별로야."*
      #
      # 【실측 (tools/house_audit.py — **이 코드의 배정 로직 그대로**)】 형제가 있는 사람의 비율:
      #     확률   5명    10명   20명   50명
      #      60%   30.1   49.9   65.5   79.1   ← 옛값. **다들 형제였다** (사용자가 거부)
      #      30%   15.7   26.6   38.0   47.7
      #      20%   10.3   17.6   25.8   33.1
      #    ★ 10%    5.0    8.5   13.1   17.4   ← **확정.** 20명이면 2~3명 (「간혹가다 한 명 두 명」)
      #       5%    2.6    4.4    6.6    9.0
      #     ★ 50명이 되어도 8~9명뿐 — **형제를 만나는 것이 여전히 사건이다.**
      join_existing: 10

      # ★ 한 집의 자식 수 상한 — **그대로 둔다 (4)**
      #   【왜 상한으로 조절하지 않는가】 상한을 줄이면 **새 집이 더 자주 서서 형제가 오히려 더 준다** —
      #   같은 방향으로 움직이는 손잡이가 둘이면 조절이 불가능해진다. **손잡이는 확률 하나로 족하다.**
      #   4 인 이유: 무협의 형제는 보통 서넛이고, 4 면 '형·누나·나·아우' 가 나온다.
      children_cap: 4

      # ═══ ★ 눈의 문턱 — **얼마나 드물어야 「드묾」이고, 얼마부터 「없음」인가** ═══
      #
      # 【★ 이 절이 없었을 때의 병】 눈이 `형제 20% 미만이면 위반` 이라고 **코드에 박아** 두고 있었다.
      #   그런데 사용자가 고른 정본(10%)이 **13.1%** 다 — **눈이 정본을 위반이라고 짖었을 것이다.**
      #   문턱을 등록부로 뺀다. **정본이 바뀌면 문턱도 여기서 바뀐다.**
      sibling_check:
        reference_people: 20     # 이 인원에서 잰다 — 사용자가 "20명이면 두어 명" 이라고 말한 그 눈금
        # ★ 하한 5% — **근거**: 20명 × 5% = **딱 한 사람.** 이보다 낮으면 20명이 모여도
        #   **형제가 한 명도 안 생긴다** — 그러면 (다) 주사위를 고른 뜻이 죽는다 (형제 축이 죽은 코드가 된다).
        #   즉 이 하한은 취향이 아니라 **「형제가 존재하기는 하는가」의 최소선**이다.
        min_pct: 5
        # ★ 상한 40% — **담당자의 제안**. 사용자가 거부한 값(60%)이 20명에서 **65.5%** 였다.
        #   확정값(10%)은 13.1% 다. 그 사이 어딘가가 「다들 형제」로 넘어가는 선이다 —
        #   40 은 **되돌아가는 것을 막는 못**이지 정밀한 값이 아니다 (사용자가 고쳐도 좋다).
        max_pct: 40

      weighted_by_room: true       # 빈자리가 많은 집일수록 잘 뽑힌다 (한 집만 꽉 차는 것을 막는다)
      note: "죽은 자는 자리를 비우지 않는다 — 형이 죽어도 그는 형이었다 (houseMembers 는 산 자만 세지만
             상한은 **태어난 수**로 센다. 그래야 '죽은 형'이 있는 집이 성립한다)"

    # ═══════════════════════════════════════════════════════════════════════════
    # ★★ ② 성씨(姓氏) — **이 세계에서 성은 「가문이 있다」는 표시 그 자체다**
    #                                       (2026-07-14 사용자 확정: "성씨 목록을 신설")
    #
    # 【★ 담당자가 조사해서 찾은 사실 — 이것이 이 절의 근거다】
    #   · 등록 NPC **32명 전원 성이 없다** (한백·묵삼·곽진·유문·소연·갈호 — 전부 두 자 이름)
    #   · 그런데 **세가는 성으로 불린다**: 남궁세가·팽가·당가·제갈세가·모용세가 (factions.yml)
    #   → **성을 가진다는 것이 곧 가문을 가진다는 뜻이다.** 평민은 이름만 있고, 무가는 성이 있다.
    #
    # 【★ 그래서 성씨는 **무가 계열에만** 붙는다】 (lineage: 무가)
    #   농가·객잔집·의원집·상가·표국집에도 **집(houses 행)은 있다** — 형제가 생겨야 하므로.
    #   그러나 **성은 없다.** 그 집은 「청하현 북쪽 농가」 지 「이(李)씨 농가」가 아니다.
    #   ★ 눈이 이것을 지킨다: 무가 아닌 집에 성이 붙으면 위반.
    surnames:
      # ★★ 오대세가의 성은 **쓰면 안 된다** — 그건 그들의 집이다 (눈이 지킨다)
      forbidden: [남궁, 팽, 당, 제갈, 모용]
      forbidden_why: "factions.yml 오대세가 — 플레이어의 향반 무가가 그 성을 쓰면 세계가 깨진다
                      (그리고 families.무가의_자식.scale 이 '오대세가급 직계 시작은 계속 배제' 라 못 박았다)"

      # 향반 무가의 성 — **담당자가 골랐다** (무협의 통상 성씨. 사용자가 고쳐도 된다)
      #   ★ 코드는 이 목록에서만 뽑는다. 여기 없는 성은 세계에 존재하지 않는다 (등록제)
      pool: [이, 최, 정, 조, 윤, 장, 임, 오, 한, 신, 서, 권, 황, 안, 송, 진, 문, 백, 하, 심]

      # 집의 이름 짓는 법 — {surname} 과 {region} 을 코드가 채운다
      #   사용자의 예시가 이 모양이었다: 「청하현 남쪽의 이(李)씨 무가」
      format_martial: "{region} {surname}가(家)"     # 무가 계열 — 성이 있다
      format_common: "{region} {family}"             # 그 밖 — 성이 없다 (「청하현 농가의 자식」의 집)

    # ═══════════════════════════════════════════════════════════════════════════
    # ★★ ④ 가문의 형태 — **탄생에 정해지고, 바뀌지 않는다**
    #                    (2026-07-14 사용자 확정: "플레이어가 생성되는 시점에 이미 가문의 형태가 정해져야")
    #
    # 【★ 이 답이 담당자의 걱정을 통째로 지웠다】
    #   담당자는 흥망을 안 열었다. 이유: *"미리 쓴 서장이 '건재한 가문'을 말했는데 그 사이 집이 망하면
    #   서장이 거짓말이 된다 — 그때는 미리 쓰기 지문(prerender.fingerprint)에 가문 상태를 넣어야 한다."*
    #   → 사용자가 **다른 문을 열었다**: 상태가 **탄생에 고정**되면 **변할 일이 없고**,
    #     변하지 않으면 **지문에 넣을 필요도 없다.** 미리 쓰기는 그대로 안전하다.
    #   ★ 플레이 중의 흥망(집이 망한다·일어선다)은 **여전히 청구서다** (B-081).
    #     그것을 열 때는 **반드시 지문에 상태를 넣어라.** 이 문단이 그 경고다.
    #
    # 【★★ 「몰락무가」와 겹치는가 — 사실로 답한다: **겹친다.** 그래서 파생시킨다】
    #   등록부를 읽었다:
    #     · 무가의_자식      world_link: "**살아 있는 가문** = 뒷배이자 굴레"
    #     · 몰락_무가의_자식 world_link: "벽에 걸린 낡은 검 — **가문의 과거**"   ← **이미 멸한 집이다**
    #     · 가출한_무가의_자식 world_link: "**살아 있는 가문**을 등지고 나온 아이"
    #   → **집안 유형이 이미 가문의 상태를 말하고 있다.** 여기에 state 를 **또** 굴리면
    #     **같은 것을 두 번 말하는 것**이고, 둘이 어긋나면 (몰락무가인데 state=흥) **세계가 모순된다.**
    #
    #   ★ 그래서 state 는 **굴리지 않고 집안에서 파생한다** (by_family 표).
    #     주사위는 **집안이 말하지 않은 것에만** 든다 — 즉 「살아 있는 집」이 **흥한가 기우는가**.
    state:
      applies_to: lineage:무가       # ★ 무가 계열에만 (농가의 '흥망'은 이 세계의 어휘가 아니다)

      # ★ 집안이 이미 말한 것은 **그대로 받는다** (지어내지 않는다 — 위 world_link 가 근거다)
      by_family:
        몰락_무가의_자식: 멸         # "벽에 걸린 낡은 검 — 가문의 과거" (이미 무너진 집)
        # 무가의_자식 · 가출한_무가의_자식 → **살아 있다.** 흥한가 기우는가는 아래 주사위가 정한다

      # 살아 있는 집의 형편 — ★ 근거 없음. **제안값이다** (사용자가 고친다)
      #   흥: 이름이 오르는 집 (뒷배가 두텁다 — 그만큼 기대도 무겁다)
      #   쇠: 기우는 집 (아직 안 무너졌다. 그래서 더 애가 탄다)
      living_weights:
        흥: 50
        쇠: 50

      options:
        흥: { label: "흥(興)", note: "이름이 오르는 집 — 뒷배가 두텁고, 기대는 무겁다" }
        쇠: { label: "쇠(衰)", note: "기우는 집 — 아직 무너지지는 않았다. 그래서 더 애가 탄다" }
        멸: { label: "멸(滅)", note: "이미 무너진 집 — 남은 것은 이름과 벽에 걸린 낡은 검뿐" }

    # ═══ ★★ 결정의 장부 — 무엇이 정해졌고 무엇이 남았는가 ═══
    #
    # ★ 값은 **한 줄**로 적는다 (여러 줄 따옴표 스칼라는 game_audit 의 파서가 못 읽는다 —
    #   담당자가 그것으로 config 를 통째로 못 읽게 만들었다가 눈에 잡혔다).
    open_questions:

      - id: ①
        q: "새 캐릭터가 기존 가문에 들어가는가, 새 가문을 만드는가?"
        answer: "★ (다) 주사위 (2026-07-14 사용자 확정). 배선: assignment 절. 자식 수 상한을 주사위의 가중치로 녹였다 — 빈자리 0 인 집은 후보에서 빠지고, 후보가 없으면 새 집이 선다. ★ 수(join_existing 60 · children_cap 4)는 제안값이다 (근거 없음) — tools/house_audit.py 가 형제율을 실측한 표를 찍는다. B-085"

      - id: ②
        q: "가문의 이름(성씨)은 어디서 오는가?"
        answer: "★ 목록을 신설했다 (2026-07-14 사용자 확정). 배선: surnames 절 (20개). 오대세가의 성(남궁·팽·당·제갈·모용)은 금지 — 눈이 지킨다. ★ 근거: 등록 NPC 32명 전원 성이 없고 세가만 성으로 불린다 → 성 = 「가문이 있다」는 표시 그 자체. 그래서 성은 무가 계열에만 붙는다"

      - id: ③
        q: "오대세가(남궁·팽·당·제갈·모용)에 태어날 수 있는가?"
        answer: "아니다. ★ 물을 필요가 없었다 — 등록부가 이미 답했다: families.무가의_자식.scale 이 '오대세가급 직계 시작은 계속 배제' 라고 못 박았다. 플레이어의 가문은 향반 무가뿐이고 오대세가는 NPC 세력으로 남는다"

      - id: ④
        q: "가문의 흥망(興亡)을 이번에 둘 것인가?"
        answer: "★ 탄생에 정해지고 바뀌지 않는다 (2026-07-14 사용자 확정). → 미리 쓴 서장이 거짓말이 될 일이 없다 (변하지 않으므로 지문에 넣을 필요도 없다). 배선: state 절. ★ 몰락무가와 겹치는 문제는 파생으로 풀었다 — 집안이 이미 상태를 말하므로(몰락무가 = 멸) 굴리지 않고 받는다. ★ 플레이 중의 흥망은 청구서 B-089 — 열 때는 반드시 prerender.fingerprint 에 가문 상태를 넣어라"

      - id: ⑤
        q: "가문은 어디에 있는가 — 그리고 사람은 어디에서 시작하는가?"
        answer: "★★ 가문이 사는 고을에서 시작한다 (2026-07-14 사용자 확정: '각 지역 분지마다 시작 위치가 정해져 실제 여러 세상에서 시작하는 것처럼 느껴져야'). 배선: mvt_start.by_region (지역 × 집안). ★★ 그러나 지역이 실제로 서야 한다 — 블록도 앵커도 없는 고을에 집을 두면 갈 수 없는 집이 되고 사람은 허공에 떨어진다. 그래서 가문의 지역은 mvt_start.playable 안에서만 뽑는다 (지금 청하현 하나. 강남_상로가 서면 등록부 한 줄). ★ 남은 어색함(무가의 전표)은 B-090"

  # ═══════════════════════════════════════════════════════════════════════════════
  # ☠ kin_group — **죽었다** (2026-07-14). 여기 있던 표는 형제를 **집안 유형**으로 묶던 시절의 것이다.
  #
  # 이제 형제는 **house_id** 로만 잡힌다 (한 채의 집). 유형으로 묶으면 농가의 아이 둘이 남매가 된다.
  #
  # 【★ 그러나 그 결정은 사라지지 않았다 — 옮겨갔다】
  #   사용자 확정: *"절연은 관계를 끊는 것이 아니라 **관계를 무겁게** 만든다.
  #                 호적에서 지워도 **형은 형이다.**"*
  #   → 집을 나온 아이는 **자기가 태어난 집(무가)에 앉는다.** 그러면 **같은 house_id** 가 되고,
  #     형제는 저절로 성립한다. 표가 필요 없다.
  #   → 어느 집에서 태어났는지는 **families.가출한_무가의_자식.from** 이 말한다 (Rules.birthFamilyOf).
  #
  # ★ 눈(tools/house_audit.py)이 그것을 지킨다: 가출한 아이가 **무가의 집에 안 앉으면 짖는다.**

  # ═══ ★ 세가(世家)를 거절한다 — "그 집의 자식으로 살지 않겠다" (2026-07-13 사용자 지시) ═══
  #
  # 사용자: *"**세가가 걸렸을 경우 세가의 자식으로 가는 걸 거절할 수도 있다.**"*
  #
  # 【무엇을 잃고 무엇을 얻는가 — 헌법의 대칭】
  #   등록부의 헌법: *"집안이 주는 것은 힘이 아니라 **입장권과 빚**이다."*
  #   → **거절은 그 둘을 다 버리는 것**이다:
  #       잃는다: 검법1 · 예법 · 가문 검(정련급 대여) · **월례 전표** · 가문의 뒷배
  #       벗는다: 이름의 무게 · 표적 가치(납치 몸값) · **기대라는 이름의 목표**(가주가 정한 발단)
  #     ★ 능력치는 애초에 오간 적이 없다 (grants 원칙: 집안은 능력치를 주지 않는다) — 대칭이 깨끗하다.
  #
  # 【거절하면 무엇이 되는가 — ★ 2026-07-14 사용자 확정: **따로 센다**】
  #
  #   담당자는 어제 거절을 **몰락_무가의_자식**으로 보냈다 (근거: `무가의_자식.support.단계` 의
  #   "절연 = 사실상 몰락_무가 루트 합류"). 기계적으로는 맞다 — 둘 다 이름만 남는다.
  #   그러나 물었고, 사용자가 답했다: **"네 따로 세죠."**
  #
  #   ★ **집이 무너진 것과 내가 집을 버린 것은 다른 이야기다.**
  #     · 몰락무가의 아이 — **당한 아이**다. 원한이 밖을 향한다 (누가 우리 집을 무너뜨렸는가)
  #     · 가출한 무가의 아이 — **택한 아이**다. 집은 **멀쩡히 살아 있고**, 그를 기다리거나 지운다
  #       → 돌아갈 문이 **있다** (그것이 이 길의 유혹이자 굴레다)
  #   그래서 **`가출한_무가의_자식`** 을 새 키로 세웠다 (families 아래).
  refuse_house:
    enabled: true
    applies_to: [무가의_자식, 세가의_자제]   # 건재한 집만. 몰락무가는 버릴 집이 없다 (★세가도 나올 수 있다 — 2026-07-25)
    becomes: 가출한_무가의_자식      # ★ 2026-07-14 사용자 확정 — 몰락무가와 **따로 센다**
    # ★ 【실사용 2026-07-14】 "이건 세가인가 아닌가 잘 모르겠다" — 선택이 **무엇을 가르는지**
    #   (어느 집안으로 시작하는지)를 문구가 말하지 않았다. 결과를 문장에 싣는다.
    prompt: "그대는 무가(武家)의 자식이다. 가문이 부른다 — 검을 쥐여 주고, 이름을 지우지 말라 한다. 남을 것인가, 나올 것인가."
    accept_label: "가문의 아이로 남는다"
    accept_note: "「무가의 자식」으로 시작한다 — 검법과 예법, 월례 전표, 그리고 그 이름의 무게를 함께 진다."
    refuse_label: "집을 나온다 (가출)"
    refuse_note: "「가출한 무가의 자식」으로 시작한다 — 검도 전표도 없다. 남는 것은 이름 하나, 그리고 언젠가 돌아갈 수도 있는 문."
    # ★세가판 (사용자 확정 2026-07-25 — 무가 문안 공용을 걷는다) · {house}=지목된 세가 · 문장 【제안】
    prompt_세가: "그대는 {house}의 핏줄이다. 가문이 부른다 — 천하가 아는 이름을 쥐여 주고, 그 무게를 지라 한다. 남을 것인가, 나올 것인가."
    accept_note_세가: "「세가의 자제」로 시작한다 — 천하가 아는 성씨, 더 큰 입장권과 더 큰 빚. 태어남부터 소문이 돈다."
    refuse_note_세가: "「가출한 무가의 자식」으로 시작한다 — 성도 전표도 버렸다. 천하가 아는 이름에서 나온 자를, 세상은 오래 기억한다."
    # ★성씨 안내 (사용자 확정 2026-07-25 「안내만」) — 강요 없음 · {surname}=아래 등록부의 성
    name_hint_세가: "성씨를 이어받으려면 — 「남는다」를 누르기 전에 디스코드 표시 이름을 {surname}○○ 꼴로 바꿔 두어도 좋다. 강요는 아니다 — 성을 쓰지 않는 핏줄도 있다."

  # 집안 — 시작 신분은 직업이 아니라 태어난 집. 시작 지역도 집이 정한다
  #
  # [v3 grants 원칙] 집안은 **능력치를 주지 않는다.** grants 에 올 수 있는 것은 기술·소양·흔적·물건뿐.
  #   이유 둘: (1) 백지의 평등 — 좋은 집에서 태어난 아이가 더 '센' 몸을 갖고 시작하면 안 된다.
  #            집안이 주는 것은 힘이 아니라 **입장권과 빚**이다 (무가의 검법 1, 무가의 청구서).
  #   (2) 상한 안전 — 능력치는 오직 '연령대 총합 + 성향 모양'만이 정하므로, 어떤 집안을 골라도
  #       브래킷 상한(유년 2 / 소년 3)과 경지 상한(범인 3)을 넘길 경로가 구조적으로 없다.
  #   수련 가점류는 능력치 +N 이 아니라 **수련 효율 보정**으로 표현한다 (training.yml 쪽 배선).
  families:
    상가의_자식:
      start_region_examples: [사천_당가세력권, 강남_상로]
      grants: { 기술: { 흥정: 1 }, 소양: "글눈" }
      world_link: "가문이 지역 지배 세력에 상납하는 관계 (예: 사천당가)"
    농가의_자식:
      start_region_examples: [청하현_외곽]
      # F17 — PT-006 / F40 — '체력 수련 가점'은 능력치 +1이 아니라 수련 효율 보정이다 (grants 원칙: 능력치 불가)
      grants: { 소양: "들일로 굳은 몸 — 체력 수련 효율 보정 (능력치 가산 아님)", 생활_기술_선택_1종: { options: [덫_사냥, 농사, 목축], level: 2 } }
      world_link: "땅과 계절, 도적의 첫 표적"
    객잔집_자식:
      start_region_examples: [청하현]
      grants: { 기술: { 고객_파악: 1 } }
      world_link: "소문의 한가운데"
    의원집_자식:
      start_region_examples: [청하현]
      grants: { 기술: { 의술: 1 } }
      world_link: "병자와 죽음을 일찍 본다"
    표국집_자식:
      start_region_examples: [지역권_각지]
      grants: { 기술: { 산길_지리: 1 } }
      world_link: "아버지의 동료들, 길 위의 삶"
    무가의_자식:                     # 건재한 지방 무가 — 지원은 소유가 아니라 상태다
      # ★ 계열 표식 — **이름이 이미 말하는 것을 기계에게도 말해 준다** (지어낸 분류가 아니다).
      #   등록부에는 「세가 표」가 없었다 (factions.yml 의 오대세가는 NPC 세력이다). 그래서
      #   적서(birth_rank)가 **어느 집에 붙어도 되는지**를 눈이 검사할 수 없었다 —
      #   객잔집 아이에게 '적자'를 매겨도 눈이 조용했다. 이 한 칸이 그 구멍을 막는다.
      lineage: 무가
      start_region_examples: [청하현, 지역권_각지]
      scale: "현·부 단위 향반 무가 — 오대세가급 직계 시작은 계속 배제 (시작 지역 미구현 + 백지의 평등)"
      grants: { 기술: { 검법: 1 }, 소양: "예법" }   # 가전 기초형이 몸에 뱄다 — 내공은 백지 (기연 자격 유지)
      world_link: "살아 있는 가문 = 뒷배이자 굴레 — 세계가 청구할 주소가 있다"
      armory:                         # 무기고 — 좋은 케이스의 핵심 특권 (equipment.yml creation 예외)
        시작_대여: "정련급 가문 검 1점 (judgment_bonus 0 — 백지 평등 유지, 가치는 생존·서사: 검기를 버틴다)"
        소유권: "가문 소유 — 대여다. 팔거나 잃으면 support 단계 즉시 입력 (몰락의 가보와 대구: 파는 순간 대가)"
        재방문: "귀성·소환 시 교체 가능. 보병급 열람은 가주 허락 판정 — 향반 무가의 신물은 있어야 한 점"
      support:                        # 지원의 3원칙 — 상태이지 소유가 아니다
        월례_지원_문: [20, 40]         # 전장 전표 수령 (시간 진행 배선 후 실효 — 봇 베타는 초기 자금만)
        조건: "가문의 기대 안에 있을 것 — 사파 접촉 소문·가문 명예 훼손·명령 불복 시 단계 이행"
        단계: [경고_서신, 지원_중단, 소환, 절연]   # 절연 = 사실상 몰락_무가 루트 합류 (흔적 '이름'만 남는다)
      비용:                           # 세계가 청구한다 — 부잣집 자제의 판돈
        이름의_무게: "행동이 가문 평판에 기장 — faction_reaction 대상. 잘한 일도 '가문의 뜻'으로 읽힌다"
        표적_가치: "납치·인질 몸값이 있는 아이 — 습격 조우 시 살해보다 납치 선호 (죽음 대신 다른 위기)"
        기대라는_이름의_목표: "초기 목표를 가문이 정한다 — 성향과 어긋날수록 드라마 (수행_파견 goal 참조)"
      incident_pool: [수행_파견, 목격, 아이_거두기]   # 건재한 집 = 재난형 발단(몰락·습격·역병·맡겨짐) 배제
    # ★세가의_자제 — 오대세가 실명 자제 (2026-07-25 사용자 확정 · sega_promotion 승격으로만 닿는다)
    #   「어느 세가의 아이가 태어났다」는 다른 세가·문파도 아는 대사건이다 (탄생 소문의 세계반응은
    #   소문 시스템(B-176) 회차에 잇는다). ★백지의 평등: grants 는 무가와 같다 — 세가가 주는 것은
    #   능력치가 아니라 **더 큰 입장권과 더 큰 빚**이다 (헌법 2.8).
    세가의_자제:
      lineage: 무가
      scale: "오대세가 직계 — 천하가 아는 이름 (남궁·모용·제갈·하북팽·사천당 — factions.yml 정본)"
      # 어느 세가인가 — 무늬 주사위 (탄생에 한 번 · 시트 「세가」 칸에 박힌다)
      great_houses: [남궁세가, 모용세가, 제갈세가, 하북팽가, 사천당가]
      # 성씨 등록부 (이름 짓기 안내용 — 사용자 확정 2026-07-25 「안내만」. 코드가 세가명에서
      # 성을 지어내지 않는다: 하북팽가의 성은 팽, 사천당가의 성은 당 — 등록부가 안다)
      great_house_surnames: { 남궁세가: 남궁, 모용세가: 모용, 제갈세가: 제갈, 하북팽가: 팽, 사천당가: 당 }
      # ★가전 무공 입장권 (C안 · 사용자 확정 2026-07-25 「선행」 — 헌법 2.8 「입장권과 빚」):
      #   지목된 세가의 **계보 첫 무공(하급)** 을 배울 자격이 몸에 기장된다 (시트 「가전_무공」).
      #   힘이 아니다 — 입문·숙련은 여전히 스승·수련의 것 (skill_lifecycle). 곽진(동네 사사)이
      #   "네 집의 것을 갈고닦아라" 하고 거절할 때, 그 「집의 것」의 실명이 이것이다.
      #   ★모용·제갈은 가전 무공이 카탈로그(skills.yml)에 미등재 — 등재 전까지 입장권 없음
      #   (지어내지 않는다 · B-187 장원 회차에서 사용자와 등재)
      # 하북팽가는 기초급(복호도식 · 삼류부터)이 생겨 입장권이 그리로 내려왔다 (2026-07-26) —
      # 남궁·당가의 기초급은 각 가문 회차에서 (그때 입장권도 내린다)
      great_house_arts: { 남궁세가: changgung_geom, 하북팽가: bokho_dosik, 사천당가: dangmun_bisu }
      grants:
        기술: { 검법: 1 }
        소양: 예법
      world_link: "천하가 아는 이름 = 어디서나 문이 열리고, 어디서나 눈이 따라온다"
      armory:
        시작_대여: "정련급 가문 검 1점 (judgment_bonus 0 — 백지 평등. 향반 무가와 같은 쇠, 다른 각인)"
        소유권: "가문 소유 — 대여다. 잃으면 문책의 무게도 세가답다"
      support:
        월례_지원_문: [40, 80]      # 【제안】 — 향반 무가(20~40)의 두 배. 대신 조건도 무겁다
        조건: "세가의 이름 안에 있을 것 — 사파 접촉·명예 훼손·명령 불복의 소문은 향반보다 빨리, 멀리 닿는다"
        단계: [경고_서신, 지원_중단, 소환, 절연]
      비용:
        이름의_무게: "오대세가의 이름은 숨겨도 태가 난다 — 행동 하나가 세가 간 균형에 기장된다"
        표적_가치: "천하급 몸값 — 습격·납치 조우에서 최우선 표적"
        기대라는_이름의_목표: "가주의 명(발단)이 곧 초기 목표다 — 어긋날수록 드라마"
      incident_pool: [비무행, 그림자_시험, 밀서, 견문]   # 견문 = 평범한 관례 출행 (사용자 확정 2026-07-25)

    몰락_무가의_자식:
      lineage: 무가                  # 무너졌어도 무가다 (그래서 '벽에 걸린 낡은 검'이 있다)
      start_region_examples: [각지]
      grants: { 기술: { 검법: 0 }, 흔적: "이름" }
      world_link: "벽에 걸린 낡은 검 — 가문의 과거"

    # ═══ ★★ 가출한 무가의 자식 — **집을 버린 아이** (2026-07-14 사용자 확정: "네 따로 세죠") ═══
    #
    # 【★ 태어나는 집이 아니다】 심리 테스트는 이 집을 **낳지 않는다** — 아무도 '가출한 무가'에서
    #   태어나지 않는다. 이 집은 **무가의_자식이 세가를 거절할 때만** 생긴다 (refuse_house.becomes).
    #   그래서 `family_affinity` 의 어느 성향에도 이 키가 **없는 것이 옳다.**
    #   ★ `birth: false` 가 그 사실을 기계에게 말해 준다 — 눈(disposition_audit)은 이 집을
    #     "어떤 성향으로도 닿지 않는다"고 짖지 않고 "거절로만 닿는다"고 적는다.
    #
    # 【몰락무가와 무엇이 다른가 — 기계는 닮았고 이야기는 다르다】
    #   몰락무가 : 집이 **무너졌다**. 당한 아이다. 원한이 밖을 향한다 (누가 우리를 무너뜨렸나)
    #   가출      : 집이 **멀쩡히 살아 있다**. 택한 아이다. **돌아갈 문이 있다** — 그것이 유혹이자 굴레
    #
    # 【집안이 주는 것 — ★ 절연이므로 **입장권도 빚도 없다**】 (헌법의 대칭 그대로)
    #   잃는다: 검법1 · 예법 · 가문 검(정련급 대여) · 월례 전표 · 가문의 뒷배
    #   벗는다: 이름의 무게 · 표적 가치(납치 몸값) · 기대라는 이름의 목표(가주가 정한 발단)
    #   ★ 능력치는 애초에 오간 적이 없다 (grants 원칙) — 대칭이 깨끗하다
    가출한_무가의_자식:
      lineage: 무가                  # 등졌어도 핏줄은 무가다 (kin_group 이 그것을 지킨다)
      birth: false                    # ★ 태어나는 집이 아니다 — 거절로만 닿는다 (엔진·눈 판독용)
      from: 무가의_자식               # 어느 집을 버렸는가 (그 집은 살아 있다)
      start_region_examples: [청하현]
      # 검법도 예법도 없다 — 배우기 전에 나왔다. 남은 것은 **이름 하나**, 그리고 그것도 숨긴다
      grants: { 흔적: "숨긴 이름" }
      world_link: "살아 있는 가문을 등지고 나온 아이 — 그 집은 그를 기다리거나, 지운다"
      # ★ 세계가 청구할 주소가 **아직 있다** (몰락무가와 결정적으로 다른 점)
      hooks:
        돌아갈_문: "가문은 건재하다 — 무릎 꿇으면 문은 열린다 (지원·검·이름이 돌아온다)"
        추적: "가주가 사람을 보낼 수 있다 (소환 → 절연 단계는 support.단계 그대로)"
        수치: "가문 입장에서 이것은 **불명예**다 — 무가의 이름값이 흔들린다"
      # ★★ 발단 풀 — **출분(出奔) 전용** (2026-07-14 신설. B-071 닫힘)
      #   어제는 재난형 풀([목격, 아이_거두기, 핏줄의_비밀])을 **빌려 쓰고 있었다** — 결이 어긋났다.
      #   집은 멀쩡히 살아 있는데 "가문의 몰락"이 발단일 수는 없다.
      #   ★ 재난형(당한 것)이 하나도 없다: 이 아이는 **휩쓸린 것이 아니라 저질렀다.**
      incident_pool: [담을_넘다, 아버지의_검, 파혼]

  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 마크의 첫 자리 — **집안마다 다른 곳에 선다** (2026-07-13 신설)
  #
  # 사용자: *"**모든 사람이 똑같은 위치에서 똑같이 소환되는 것도 아니고**",
  #          "**마인크래프트에서도 신분이 적용**되어야 합니다."*
  #
  # 【★ 왜 이 절이 새로 필요했나 — start_location 은 **죽은 등록부였다**】
  #   `starting_identities.*.start_location` 이 11군데 적혀 있는데 **읽는 코드가 0줄이었다**
  #   (grep: server-mvt 0건 · server-bot 0건). 그리고 그 값들(market · cheongha_inn …)은
  #   **영문 id** 인데, 마크에서 좌표를 아는 이름은 **한글 앵커**뿐이다
  #   (HoncheonMvt.anchor("장터") ← CheonghaBuilder 가 심고 anchors.yml 에 남긴다).
  #   **영문 id → 좌표를 아는 함수가 세상에 없었다.** 그래서 다리를 여기 놓는다.
  #
  # 【★ 지금 마크에서 벌어지는 일 (사실)】 접합을 마치면 Antechamber.depart() 가 사람을
  #   `destinations: [흑수나루, 장터]` 의 **첫 번째 유효한 앵커**로 보낸다 — 즉 **전원이 같은 자리**다.
  #   이 표가 그것을 집안별로 가른다.
  #
  # 【★ 못 한 것 — 정직하게】 집안의 `start_region_examples`(사천 당가세력권 · 강남 상로 · 하북 평야)는
  #   **아직 지어지지 않았다** (start_regions status: 스텁 — "블록도 앵커도 없다").
  #   그래서 **모두 청하현 안에서** 자리를 가른다. 등록부의 funnel_rule 이 이미 그 길을 열어 뒀다:
  #   *"스텁 지역 출신은 발단 사건의 '이동'으로 구현 지역에 합류할 수 있다 (피난 온 아이)."*
  #   → 지금은 **같은 고을의 다른 자리**다. 지역까지 가르려면 그 지역을 먼저 지어야 한다.
  mvt_start:

    # ═══ ★★ 사람이 실제로 설 수 있는 고을 — **여기 없는 고을에는 가문이 살지 않는다** ═══
    #
    # 사용자 (2026-07-14): *"시작 위치가 꼭 모두가 청하현에서 시작하는 것이 아님. 조건마다 뭉치고,
    #   **각 지역 분지마다 시작 위치가 정해져 실제 여러 세상에서 시작하는 것처럼** 느껴져야 합니다"*
    #
    # 【★ 그러나 지역이 **실제로 서야** 한다】 블록도 앵커도 없는 고을에 가문을 두면
    #   **갈 수 없는 집**이 된다 (그리고 사람은 허공에 떨어진다).
    #   그래서 가문의 지역은 **이 목록 안에서만** 뽑는다. 눈이 그것을 지킨다.
    #
    # 【★ 고을이 늘면 **여기만 고친다**】 코드는 고을 이름을 지어내지 않는다.
    #   강남_상로가 서면 (별도 담당이 짓는 중) `playable` 에 한 줄 더하고 `by_region` 에 앵커를 적으면 된다.
    playable: [cheongha_hyeon]     # ★ 지금 설 수 있는 고을은 하나뿐이다. 곧 강남_상로가 선다
    default_region: cheongha_hyeon # 가문에 지역이 없는 옛 캐릭터 → 여기 (마이그레이션 전에 태어난 사람)

    # ═══ 고을 × 집안 → 설 자리 ═══
    # ★ 시작 위치는 이제 **지역 × 집안**의 함수다 (사용자 확정).
    #   무가는 **그 고을의** 전장, 객잔집은 **그 고을의** 객잔 — 같은 문법이 고을마다 되풀이된다.
    by_region:

      cheongha_hyeon:
        name: 청하현
        # 영문 id → 마크의 앵커 (한글). ★ 앵커가 **좌표의 정본**이다 (CheonghaBuilder 가 심는다)
        anchor_map:
          cheongha_hyeon: 장터
          market: 장터
          request_office: 의뢰소
          north_road: 북쪽_산길
          medicine_shop: 의방
          cheongha_inn: 청하객잔
          pyoguk: 표국
          jeonjang: 전장
        # ★ 집안 → 첫 자리. **근거는 그 집안의 world_link·grants 다** (지어내지 않았다)
        by_family:
          상가의_자식: market        # grants 흥정 — 셈이 도는 곳
          농가의_자식: north_road    # world_link "땅과 계절, **도적의 첫 표적**" — 고을 **외곽**
          객잔집_자식: cheongha_inn  # world_link "**소문의 한가운데**"
          의원집_자식: medicine_shop # world_link "병자와 죽음을 일찍 본다" · grants 의술
          표국집_자식: pyoguk        # world_link "**아버지의 동료들**, 길 위의 삶" — 그 마당이다
          무가의_자식: jeonjang      # 발단 수행_파견: "가문의 연고가 닿는 **전장에 월례 전표가 와 있다**"
          몰락_무가의_자식: market   # 기댈 곳이 없는 아이 — 저잣거리에 선다
          가출한_무가의_자식: north_road   # 집을 등지고 **길 위로** 나왔다
        default_family: cheongha_hyeon   # 표에 없는 집안 → 장터

      # ★★ 강남_상로 — **별도 담당이 짓는 중이다.** 다 서면 여기에 앵커를 적고
      #   위 `playable` 에 `강남_상로` 를 더하면 **그 순간부터 사람이 거기서 태어난다.**
      #   ★ 코드는 한 줄도 안 고친다 — 그것이 이 구조의 뜻이다.

    # ★ 앵커 그 자체로 순간이동하지 마라 — **장터 앵커는 우물 한가운데다.**
    #   Standing.landing(anchor) 로 **디딜 자리를 재고 내린다** (Antechamber.destination 이 그렇게 한다).
    landing: standing_required

  # ═══════════════════════════════════════════════════════════════════════════════
  # ★★ 탄생은 세계의 사건이다 — **누가 났는지 마을이 안다** (2026-07-14)
  #
  # 사용자: *"**세가를 제외하곤 지역까지만 퍼짐 (해당 마을)**"*
  #
  # 【★ 범위의 어휘를 지어내지 않았다】 rumor.yml propagation.reach_by_intensity 가 이미 갖고 있었다:
  #     1 = 발생 장소의 망 하나 · **2 = 현 내 (= 해당 마을)** · 3 = 현+인접 현 · 4 = 지역권 · 5 = 천하
  #
  # ★★ 【이 절은 한 번 통째로 증발했었다 (2026-07-14)】 담당자가 mvt_start 를 갈아 끼우면서
  #   **잘라내기의 끝 지점을 잘못 잡아 이 절을 지웠다.** 코드는 계속 읽고 있었으므로
  #   `enabled` 가 없어져 **탄생 소문이 조용히 안 났다.** 눈조차 "꺼져 있다"고만 하고 넘어갔다 —
  #   **없는 것과 꺼진 것을 구별하지 못했다.** 이제 눈이 그 둘을 가른다 (disposition_audit ⑥).
  birth_rumor:
    enabled: true
    tags: [생활]                 # rumor.yml networks.interests 에 실재하는 태그 (장터가 듣는다)
    accuracy_kind: 직접_목격     # 마을이 제 눈으로 본다 (아이가 났다는 것은 왜곡될 것이 없다)
    default_intensity: 2         # 보통의 집 → 「현 내」 (= 해당 마을. 사용자 확정)

    # ★ 세가는 적서가 무게를 가른다 (강도는 birth_rank.options 가 정본 — 여기서 두 번 적지 않는다)
    #   적자 → 5 (천하) · 서자 → 3 (현+인접 현)
    by_birth_rank: birth_rank.options

    # ═══════════════════════════════════════════════════════════════════════════
    # ★★ 시간의 비대칭 — **형은 동생이 태어나는 것을 「겪는다」** (2026-07-14 사용자가 짚었다)
    #
    # 사용자 원문: *"그럼 시스템상 **형이 먼저 태어남 (동생이 있는지는 모름)**,
    #                **동생이 태어남 (형이 있는 줄 앎)**"*
    #
    # 【★ 이것은 결함이 아니라 이야기다】
    #     형이 태어난다   → 서장: 형제 없음   (그때는 **정말로** 없었다)
    #     동생이 태어난다 → 서장: "네게는 형이 있다"
    #     ★ 그리고 **형에게 소식이 간다** — "네 아우가 났다"
    #   즉 **처음부터 형제였던 것이 아니라, 어느 날 형이 된다.**
    #
    # 【★★ 형의 서장은 고쳐 쓰지 않는다 — 그것이 이 설계의 못이다】
    #   미리 쓴 글은 **그때의 진실**이다. *"나는 혼자였다"* 는 **거짓말이 아니다.**
    #   소급해서 글을 바꾸면 「탄생 시점에 고정」이라는 사용자 결정을 깨는 것이다.
    #   → 배선: 탄생 순간의 형제를 **시트에 박제한다** (`서장_형제`). 서장의 모든 장면이 그것을 읽는다.
    #     그래서 2장·3장이 **나중에** 그려져도 **없던 동생이 튀어나오지 않는다.**
    #   ★ 서장의 지문(seojang.yml prerender.fingerprint)에 형제를 **넣지 않는다** —
    #     넣으면 아우가 날 때마다 형의 글이 **다시 쓰인다** (바로 그것을 막으려는 것이다).
    #
    # 【★ 소문의 범위와 충돌하지 않는다 — 형은 「예외」다】
    #   세상은 소문의 강도만큼만 안다. 그러나 **형은 언제나 안다** — 소문의 문제가 아니라 **제 집의 일**이다.
    kin_always_know: true

    sibling_news:
      enabled: true
      ledger: 형제_탄생          # events.type — 언제나 장부에 남는다 (누가 누구의 형이 되었는가)

      # ★★ 어디로 가는가 — **디스코드 DM** (담당자의 판단. 근거를 댄다)
      #   · 사용자의 축: *"디스코드를 **인증 서비스와 소셜**로."* 아우가 났다는 것은 **소식(소셜)**이지
      #     **이야기의 진행**이 아니다 — 고르고 판정하는 것이 아니라 **그냥 알게 되는 것**이다.
      #   · 그리고 형은 **접속해 있지 않을 수 있다.** DM 은 **언제 봐도 거기 있다** —
      #     게임 안 채팅은 그 순간 없으면 사라진다.
      #   ★★ 【사용자 확인 요망】 **게임 안에서도 알려 줄 것인가?** 지금 다리에는
      #     「그 몸에게 한 마디 건네는」 **일반 통로가 없다** (서장의 ferry 는 서장 전용이다).
      #     새 다리 표면이라 **이번에 짓지 않았다** — 청구서 B-097.
      channel: 디스코드_DM
      title: "네 아우가 났다"
      # {name} = 태어난 아이 · {title} = 그 아이를 부르는 말 (아우/누이) · {house} = 집의 이름
      body: "**{house}**에 아이가 하나 더 났다. 이름은 **{name}** — 네 **{title}**다. 너는 이제 혼자가 아니다."
      # ★ 형의 서장은 그대로다 — 그 사실을 **말해 준다** (거짓말이 아니라 그때의 진실이었다)
      footer: "네 서장은 그때의 것이다 — 그때는 정말 혼자였다."

  # 시작 지역 — 청하현만 완전 구현. 스텁은 발단 사건으로 구현 지역에 합류 가능
  start_regions:
    cheongha_hyeon: { status: 완비, region_file: "config/regions/cheongha_hyeon.yml" }
    사천_당가세력권: { status: 스텁, ruling_faction: 사천당가, note: "성도 상계. 상세 미설계" }
    강남_상로: { status: 스텁, ruling_faction: 상단연합, note: "물의 고장. 상세 미설계" }
    하북_평야: { status: 스텁, ruling_faction: 하북팽가, note: "상세 미설계" }
    funnel_rule: "스텁 지역 출신은 발단 사건의 '이동'으로 구현 지역에 합류할 수 있다 (피난 온 아이)"

  # 발단 사건 — "왜 이 아이에게 이런 일이 닥쳤는가". 선택 또는 운명(무작위 1d7)
  #
  # ★★ 【kind — 발단의 결】 (2026-07-14 신설. 눈이 이것을 본다)
  #   재난 : **당한 것.** 아이는 휩쓸린다 ("그날 밤, 모든 것이 달라졌다")
  #   명령 : **명받은 것.** 가주의 뜻이 발단이다 (수행_파견 — 무가의 자식 전용)
  #   출분 : **택한 것.** 아이가 저지른다 ("그날 밤, 내가 담을 넘었다") — 가출한 무가의 자식 전용
  #
  #   ★ 왜 이 칸이 필요했나: 눈이 **"택한 아이에게 당한 자의 발단"** 을 잡지 못했다.
  #     `가출한_무가의_자식` 에게 `가문의_몰락` 을 줘도 조용했다 — 집은 멀쩡히 살아 있는데!
  #     `family_only` 만으로는 못 잡는다 (재난형 발단은 전용이 아니라 **공용**이므로).
  inciting_incidents:
    가문의_몰락:
      kind: 재난
      cause: "지배 세력과의 상납·장부 분쟁 (진상은 더 깊을 수 있다)"
      movement: "야반도주 → 타지 친척집 (스텁→구현 지역 합류의 전형)"
      trace: ["몰락의 이름", "장부 눈썰미"]
      long_hook: "가문을 무너뜨린 세력 내부의 진범"
      goal_candidates: ["가족과 살아남기", "가문의 누명 벗기기"]
    습격:
      kind: 재난
      cause: "도적/사파의 마을·상행 습격"
      movement: "가족 사망·이산, 홀로 남음"
      trace: ["생존자", "그날 밤의 기억"]
      long_hook: "범인의 단서 하나 (문양, 흉터, 말버릇)"
      goal_candidates: ["살아남기", "그 문양의 주인 찾기"]
    역병:
      kind: 재난
      cause: "마을에 병이 돌았다"
      movement: "살길 찾아 유랑 → 정착"
      trace: ["약냄새", "죽음을 아는 아이"]
      long_hook: "병의 진상 (금기 세력 장기 떡밥 연결 가능)"
      goal_candidates: ["정착하기", "병의 근원 알아내기"]
    목격:
      kind: 재난
      cause: "봐서는 안 될 것을 봄 — 무림인의 살인, 밀거래"
      movement: "쫓기거나, 입막음 대신 거둬짐"
      trace: ["무거운 비밀"]
      long_hook: "그 무인의 정체"
      goal_candidates: ["잊고 살아남기", "그 사람의 정체 알기"]
    맡겨짐:
      kind: 재난
      cause: "빚·기근으로 상단/객잔에 맡겨짐"
      movement: "새 주인의 집"
      trace: ["팔린 아이", "빠른 눈치"]
      long_hook: "가족 채무의 배후, 돌아갈 집"
      goal_candidates: ["몸값 갚기", "가족 찾기"]
    핏줄의_비밀:
      kind: 재난
