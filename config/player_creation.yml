# 캐릭터 생성 규칙 (기계 판독용)
# 기준 문서: docs/design/character_creation.md

# ═══ 성별 — 생성의 첫 물음 (2026-07-13 신설) ═══
#
# 【왜 생겼나】 사용자가 게임에서 겪었다: **"성별 선택이 없어 강제로 루트가 제한됨."**
#   생성 문답(유년의 기억 5문항)에는 성별이 없었고, 그래서 캐릭터는 성별 없이 태어났다.
#
# 【★★ 아직 정해지지 않은 것 — 지어내지 마라】
#   성별이 **세계에서 무엇을 가르는지는 아직 등록부에 없다.** 이 파일은 지금
#   **성별을 묻고 · 기록하는 것까지만** 한다. 그것이 무엇을 여닫는지는 **사용자가 정한다.**
#
#   확실한 것은 하나뿐이다 — **아미파는 여승(비구니) 문파다** (factions.yml: "사천의 여승 문파",
#   docs/design/ami_architecture.md: "여성 중심 문파 · 비구니와 여협이 중심").
#   즉 **성별이 입문 가능한 문파를 가른다**는 것은 거의 확실하다. 그러나 그 배선(gates 아래)은
#   **사용자가 채우기 전까지 비워 둔다.** 빈 칸 = "아무것도 가르지 않는다" 이고, 코드는 그대로 따른다.
#
# 【기록되는 곳】 characters.sheet_json 의 「성별」 (DB 스키마는 건드리지 않았다 —
#   시트는 원래 자유 서식이다. 마이그레이션도, 봇 정지도 필요 없었다).
gender:
  ask: true                       # false 로 두면 묻지 않는다 (성별 없는 캐릭터로 돌아간다)
  required: true                  # 답하기 전에는 유년의 기억으로 넘어가지 않는다
  sheet_key: 성별                 # sheet_json 의 칸 이름
  prompt: "너는 사내아이로 태어났는가, 여자아이로 태어났는가."
  footer: "성별은 바꿀 수 없다 — 이 몸으로 강호에 선다."
  # ★★ 성별은 **고르는 것이다** (2026-07-13 사용자 확정: "성별은 선택할 수 있게 합니다")
  #   · 무작위 금지 · 다른 문항(전생·집안·유년의 기억·성향)에서 **추론 금지**
  #   · 성별이 **생성의 다른 선택지를 줄이면 안 된다.** 사용자의 최초 불만이
  #     "성별 선택이 없어 **강제로 루트가 제한**됨" 이었다 — 성별을 넣고서 그 성별 때문에
  #     못 고르는 문항이 생기면 **같은 병을 반대편으로 옮긴 것**이다.
  #   · 문파 입문 제한(아미 등)은 **세계관**이다 — 그것은 **문파에 들어갈 때** 막는 것이지
  #     **캐릭터를 만들 때** 막는 것이 아니다. 만들 때는 무엇이든 고를 수 있다.
  creation_neutrality:
    chosen_never_inferred: true   # 코드가 성별을 추론하면 위반이다 (눈: GenderGateTest)
    restricts_creation: false     # 성별은 생성의 어떤 문항·선택지도 줄이지 않는다 (눈이 지킨다)

  options:                        # ★ 등록제: 여기 없는 성별은 세계에 존재하지 않는다
    남:
      label: "사내아이"
    여:
      label: "여자아이"

  # ═══ 성별이 무엇을 가르는가 (2026-07-13 사용자 지시로 채움) ═══
  #
  # 사용자 원문: "성별의 경우 **히든**이나 자체 **근력과 이속** 등 성별을 통해 조금 더 차별화될 수
  #   있게 합시다. (**문파도 차이점을 가질 수 있음**, 그리고 예를 들어 **사매, 사제 부르는 호칭도
  #   정리 가능**)"
  #
  # 【히든의 뜻】 숨기는 것은 **플레이어에게**지 **개발자에게**가 아니다.
  #   · 이 표는 등록부에 **명시**된다 (코드가 몰래 지어내지 않는다 — 등록제)
  #   · 그러나 **시트(`/혼천 정보`)에는 수치가 뜨지 않는다.** 보이면 최적해가 생기고
  #     사람들이 '유리한 성별'을 고른다. 안 보이면 **역할로 고른다.**
  #   · 근거: gm_modifiers.yml 원칙 — "보정 내역은 내부 로그에 기록, **플레이어 출력에 수치 노출 금지**"
  #     성별 보정은 그 원칙의 한 사례일 뿐이다 (새 원칙이 아니다)
  gates:

    # ─── ① 능력치 — 판정에만 든다. 시트에는 없다 ───
    #
    # 【★★ 2026-07-14 — 사용자가 **승인했다**】 원문: *"성별 능력치는 허락합니다."*
    #   그전까지 이 표는 "담당자가 지어낸 제안값" 이었다. 이제 **정본이다.**
    #   남 근력 +1 / 여 민첩 +1 · 히든 · 총합 동일 · 시트에 안 뜬다.
    #
    # 【왜 시트에 안 싣나】 시트의 `능력치` 맵은 `/혼천 정보` 가 통째로 훑어 출력한다
    #   (GameListener 능력치 필드). 거기에 더하면 그 순간 **히든이 아니다.**
    #   그래서 보정은 **저장되지 않는다** — 판정이 능력치를 읽는 순간에만 얹힌다.
    #
    # 【왜 ±1 인가】 judgment.yml 의 대등 판정 마진은 2d6 기반이라 범위가 −6~+4 다.
    #   ±1 은 등급을 한 칸 밀 확률이 대략 1/6~1/4 — **느껴지되 결정하지 않는다.**
    #   ±2 이상이면 성별이 강약을 정해 버린다 (사용자: "무협은 여협이 사내를 벤다").
    #
    # 【왜 합이 같은가】 남 +1 / 여 +1 — **총합이 같다.** 성별은 **강약이 아니라 결**이다.
    #   유리한 성별이 없어야 사람이 역할로 고른다.
    #
    # 【이속】 이속은 **등록된 능력치가 아니다** (judgment.yml attributes 7종에 없다).
    #   gyeonggong.yml 이 **민첩의 실수치**로 이속을 산다 (`attribute: 민첩`, `speed_bonus`).
    #   즉 **민첩이 곧 이속의 손잡이다** — 여기서 민첩을 올리면 사용자가 말한 '이속'에 닿는다.
    #   ★ 다만 실제 이속 가산은 **경공 담당의 파일**(Gyeonggong*.java)이 읽는 값이라 이번에
    #     배선하지 않았다 (남의 몫). 판정의 민첩만 움직인다 — 보고서에 적었다.
    attributes:
      남: { 근력: 1 }              # 사내의 결 — 힘으로 민다
      여: { 민첩: 1 }              # 계집의 결 — 빠르고 예리하다 (아미: "부드럽되 빠르고 예리한 검술")
      hidden: true                # ★ 시트에 노출 금지. 눈(GenderGateTest)이 이것을 지킨다
      applies_to: judgment        # 저장하지 않는다 — 판정이 읽을 때만 얹는다
      cap: 1                      # 한 축당 절대값 상한 (성별이 강약을 정하지 못하게 하는 못)

    # ─── ② 문파 입문 — ★ 생성이 아니라 **입문**에서 막는다 ───
    #
    # 【등록부에 근거가 있는 것은 아미 하나뿐이다】
    #   · factions.yml ami: "사천의 **여승** 문파"
    #   · docs/design/ami_architecture.md: "**여성 중심 문파** — 비구니와 여협이 중심"
    #   이 둘이 아미를 여성 문파라고 **명시**한다. 그래서 아미만 적었다.
    #
    # 【★ 나머지는 지어내지 않았다】 소림·불가가 남성 전용인지 등록부는 **말하지 않는다.**
    #   factions.yml 은 소림을 "불가 무학의 종가", 불가를 "사찰·승려 계열" 이라고만 적는다 —
    #   **성별을 말한 적이 없다.** 그래서 **비워 뒤 사용자에게 묻는다** (open_questions ②).
    #   빈 칸 = 아무나 입문 가능. 코드는 그대로 따른다.
    faction_entry:
      ami: [여]                   # 근거: factions.yml "여승 문파" + ami_architecture.md "여성 중심"
      # sorimsa: ?                # ★ 근거 없음 — 묻는다. 지어내지 않는다
      # bulga:   ?                # ★ 근거 없음 — 묻는다
      enforced_at: faction_entry  # ★★ 생성이 아니다. 캐릭터는 무엇이든 만들 수 있다
      refusal: "이곳은 비구니의 문이다 — 사내는 산문 앞에서 돌아선다."

    # ─── ③ 호칭 — 성별 × 관계 ───
    #
    # 【등록부에 있던 근거】
    #   · sect_life.yml `brotherhood.order: 입문_순` — 사형제 서열의 축은 **입문 순서**다
    #     (나이가 아니다). 즉 관계는 **선배/후배**로 갈린다
    #   · sect_life.yml 은 "사형제"·"사제" 를 이미 쓴다 (rank_ladder 주석 · npc_symmetry)
    #   · faction_entry_routes.yml: "동기 NPC 소년 — **사형제** 예고"
    #   즉 **문파 안의 호칭이 성별×입문순으로 갈린다는 것은 등록부가 이미 전제하고 있었다.**
    #   ★ 그러나 **표는 없었다.** 아래 표는 담당자가 세웠다 (무협 관용에 따름)
    #
    # 【잠정값이었던 것】 옛 options.호칭 의 소협/여협 은 지난 담당이 "잠정" 이라 적어 뒀고,
    #   **봇 어디에서도 쓰이지 않았다** (코드 전체 grep — 사용처 0). 여기로 옮겨 정본으로 세운다.
    honorifics:

      # 문파 안 — 성별 × 입문순 (sect_life brotherhood.order: 입문_순)
      sect:
        선배: { 남: 사형, 여: 사저 }    # 나보다 **먼저** 입문한 자를 내가 이렇게 부른다
        후배: { 남: 사제, 여: 사매 }    # 나보다 **나중에** 입문한 자
        스승: { 남: 사부, 여: 사부 }    # 성별로 갈리지 않는다
        문파장: { 남: 장문인, 여: 장문인 }
        # ★ 방향 주의: 호칭은 **부르는 자의 성별이 아니라 불리는 자의 성별**로 정해진다.
        #   (내가 사내든 계집이든, 먼저 든 사내는 '사형' 이다)
        resolve_by: 대상의_성별      # 코드가 이 축을 헷갈리지 못하게 못을 박는다

      # ═══ ★★ 혈연(血緣) — **같은 집에 태어난 아이들** (2026-07-13 사용자 지시로 신설) ═══
      #
      # 사용자: *"만약 **같은 세가에 같이 태어나게 되었다면 순서대로 형, 누나가 되어야** 함."*
      #
      # 【★ 문파의 호칭과 **다르다** — 섞지 마라】
      #   문파(위 sect): 사형·사저·사제·사매 — 축은 **입문 순**이다 (sect_life.yml brotherhood.order)
      #   혈연(여기)   : 형·누나·동생·아우  — 축은 **태어난 순**이다
      #   같은 문법(선배/후배 × 성별)이되 **어휘가 다르다.** 세가의 형을 '사형'이라 부르지 않는다.
      #
      # 【순서는 무엇이 정하는가】 **태어난 순서** = characters.id 의 오름차순 (생성 시각).
      #   ★ 표를 따로 만들지 않는다 — 같은 집안(sheet.집안)에 태어난 산 자를 id 순으로 세우면
      #     그것이 곧 서열이다. **파생값이므로 낡을 수가 없다** (마이그레이션도 필요 없었다).
      #
      # 【★ 방향 주의】 sect 와 같다 — 호칭은 **부르는 자가 아니라 불리는 자의 성별**로 정해진다.
      #   (내가 사내든 계집이든, 먼저 난 사내는 '형'이다)
      #
      # 【★ 아직 안 한 것 — 청구서】 관계를 **세우는 것**까지가 이번 몫이다.
      #   그것을 **쓰는 곳**(형이 죽으면 동생이 안다 · NPC 가 "자네 형이…" 라고 말한다 ·
      #   혈채/유산이 형제에게 흐른다 — death_and_legacy.yml)은 **배선하지 않았다.**
      kin:
        손위: { 남: 형, 여: 누나 }      # 나보다 **먼저** 태어난 자를 내가 이렇게 부른다
        # ★ 2026-07-14 사용자 확정 ("네 가릅시다") — 어제는 둘 다 '동생'이었다
        손아래: { 남: 아우, 여: 누이 }
        resolve_by: 대상의_성별         # 코드가 이 축을 헷갈리지 못하게 못을 박는다
        order_by: 태어난_순             # characters.id 오름차순 (생성 시각)
        scope: 같은_집안                # sheet.집안 이 같은 산 자들끼리
        # ★ 몰락무가·집을 나온 아이도 **같은 집안 키**를 지므로 형제가 된다.
        #   그것이 옳은가? (집이 무너진 아이와 집을 나온 아이가 남매인가) — **사용자 확인 요망**

      # 문파 밖 (강호) — 낯선 무인이 나를 부르는 말
      jianghu:
        남: 소협                    # 젊은 사내 무인
        여: 여협                    # 여자 무인
        # (대협·노협 등 연치·명성에 따른 호칭은 **아직 없다** — 명성 축과 접합할 때 연다)

      # 불문 (아미·소림) — 속가의 호칭과 다르다
      buddhist:
        여: 사태                    # 비구니에 대한 존칭 (아미)
        남: 대사                    # 승려에 대한 존칭 (소림·불가)
        # ★ 근거: 등록부는 아미를 "여승", 불가를 "승려 계열" 이라고만 적는다.
        #   '사태/대사' 라는 **말 자체**는 담당자가 골랐다 (무협 관용)

      unknown: 무인                 # 성별을 모르는 옛 캐릭터 — 코드가 추측하지 않는다

  # ★★ 아직도 사용자에게 물어야 할 것 (담당자가 답을 지어내지 말 것)
  open_questions:
    - "② 입문 가능 문파 — **소림·불가는 남성 전용인가?** 등록부는 '승려 문파'라고만 적을 뿐
       성별을 말한 적이 없다. 아미(여)만 근거가 있어 적었다.
       ★ 남성 전용 문파를 둘 것인가, 아니면 아미만 성별 문파로 둘 것인가?"
    - "③ 무공 계열 — 성별이 배울 수 있는 무공을 가르는가? (지금은 **가르지 않는다**)"
    - "④ NPC 반응 — 성별에 따라 대사·태도·혼담이 달라지는가? (지금은 **호칭만** 달라진다)"
    - "⑥ 이속 — 민첩이 이속의 손잡이다(gyeonggong). 여성의 민첩 보정을 **실제 이속에도**
       태울 것인가? 그러려면 경공 담당의 파일을 건드려야 한다 (이번에 안 했다)"

attribute_allocation:
  # 화후 규칙: 모든 능력치는 내부 실수로 적립 (수련 진행도). 판정 가산은 정수부,
  # 파생치(내력/내구/회피 회복 등)는 실수치 사용 — balance_audit_cliffs.md
  #
  # [v3] 여기 적힌 값은 '유년(8~12)' 기준의 정본이다. 성인 기준(기본 2·배분 6·상한 4)은 폐기 —
  # v2 이후 전원 유년/소년 시작이므로 생성 배분의 주인은 age_and_lifepath.age_brackets 다.
  # 소년(13~15)으로 시작하면 아래 세 값을 age_brackets.소년 이 덮어쓴다 (브래킷 우선).
  base_value: 1                 # 모든 능력치 기본치 — 아이는 성인 평균(2)보다 약하다
  free_points: 4                # 자유 배분
  creation_max: 2               # 생성 시 상한 (아이의 몸. 소년은 3 — 브래킷이 덮어쓴다)
  creation_min: 1               # 하한
  reduce_for_points_limit: 2    # 기본치 > 하한인 구간(소년)에서만 실효 — 유년은 기본치=하한이라 회수 불가

  # 총합은 성향이 아니라 나이가 정한다 — '백지의 평등'의 기계적 보증
  total_by_bracket: "base_value × 7 + free_points (유년 11 / 소년 19) — 모든 성향이 같은 총합"

  # 프리셋 전개 규칙 (엔진·봇 공통) — 프리셋은 절대값 표가 아니라 '모양'이다
  preset_expansion:
    - "모든 능력치를 브래킷 base_value 로 채운다"
    - "disposition_presets.stats 내림차순으로 자유 포인트를 1씩 배분 (브래킷 creation_max 상한). 다 쓸 때까지 반복"
    - "동률이면 능력치 표기 순서(judgment.yml attributes: 근력·민첩·체력·내공·감각·화술·지혜)"
    - "결과: 유년은 프리셋 원본 그대로 / 소년은 상위 5축이 3, 나머지 2축이 2 — 총합은 언제나 브래킷 총합"

# 경지별 능력치 상한 (성장 시)
#
# ★ 【2026-07 성장 축 패스】 이 표는 생성 규칙이 아니라 **성장의 천장**이고,
#   그래서 이 게임의 빌드 시스템에서 가장 무거운 표다 (docs/design/growth_axes.md · training.yml curriculum).
#   근거: 전투 능력치 5축(근력·민첩·체력·내공·감각)을 일류 캡(6)까지 채우려면 15~20년이 든다.
#         일류 도달은 1년이 채 안 된다 (stats_and_progression: 308일). **그 시간은 없다.**
#   → 무엇을 천장까지 올릴지가 곧 빌드다. 지배 전략을 막는 것은 밸런스 수치가 아니라 **천장과 시간**이다.
#   → 그리고 천장을 여는 것은 경지뿐이다 — 영약도 못 넘는다 (fortune_encounters.yml elixirs.realm_cap).
attribute_cap_by_realm:
  범인: 3
  삼류: 4
  이류: 5
  일류: 6
  절정: 7
  초절정: 8
  화경: 9
  현경: 10
  생사경: 10

# 성향별 추천 프리셋 — 추천일 뿐 강제 배정하지 않는다
# 배열 순서: [근력, 민첩, 체력, 내공, 감각, 화술, 지혜]
#
# [v3 재작성] 프리셋은 '유년의 기억 5문항'이 남긴 **기울기(모양)**이지 절대 수치표가 아니다.
#   - stats = 유년(8~12) 정본 벡터. 총합 11 고정 · 값은 1 또는 2 뿐 · 2가 정확히 4개.
#     → 어느 성향을 고르든 **기운 축이 넷, 안 기운 축이 셋**. 강자도 약자도 없다 (백지의 평등).
#   - 소년(13~15)은 이 표를 다시 쓰지 않는다. attribute_allocation.preset_expansion 으로 전개 →
#     총합 19 · 상위 5축 3 / 나머지 2축 2. 총합은 나이가 정하고, 프리셋은 어디가 높은지만 정한다.
#   - 성인 기준(총합 20 · 최고 5)의 옛 표는 폐기 — 아이의 몸이 감당 못하는 수치였다.
#   - 이건 답이 아니라 추천이다. 플레이어는 무시하고 직접 배분할 수 있다 —
#     "답은 성향 추천일 뿐, 그 어긋남 자체가 캐릭터다."
disposition_presets:
  협의형:                            # 몸으로 나선다 — 버티고, 치고, 말한다
    stats: [2, 1, 2, 2, 1, 2, 1]    # 근력·체력·내공·화술
    recommended_identities: [낭인_지망생, 문파_지원자]
    routes: [정파, 협객, 화산파, 소림사, 아미파, 관군_협력]
  생존형:                            # 먼저 보고 먼저 뛴다 — 오래 사는 법을 안다
    stats: [1, 2, 2, 1, 2, 1, 2]    # 민첩·체력·감각·지혜
    recommended_identities: [고아_출신_부랑객, 낭인_지망생]
    routes: [낭인, 개방, 사파_접촉, 정보상, 은거_전승]
  야망형:                            # 올라간다 — 힘과 혀와 머리로
    stats: [2, 1, 1, 2, 1, 2, 2]    # 근력·내공·화술·지혜
    recommended_identities: [몰락_세가_자제, 낭인_지망생]
    routes: [세가_재건, 문파_권력, 사파_두각]
  자유형:                            # 길 위의 아이 — 발과 눈과 넉살
    stats: [1, 2, 2, 1, 2, 2, 1]    # 민첩·체력·감각·화술
    recommended_identities: [떠돌이_표사]
    routes: [낭인, 표국, 유람]
  탐구형:                            # 몸이 아니라 이치 — 그릇·눈·말·머리
    stats: [1, 1, 1, 2, 2, 2, 2]    # 내공·감각·화술·지혜
    recommended_identities: [의원_제자]
    routes: [제갈세가, 무당파, 의원, 약재상_제자, 정보상, 약왕곡]
  은밀형:                            # 아무도 아이를 경계하지 않는다 — 그 틈으로 산다
    stats: [1, 2, 1, 1, 2, 2, 2]    # 민첩·감각·화술·지혜
    recommended_identities: [하오문_말단, 고아_출신_부랑객]
    routes: [하오문, 살막, 사천당가, 사파, 마교_히든_루트, 무영각]
  이익형:                            # 값을 매기고 흥정한다 — 셈과 눈치와 발품
    stats: [1, 1, 2, 1, 2, 2, 2]    # 체력·감각·화술·지혜
    recommended_identities: [상단_견습]
    routes: [상단, 정보상, 중개인]

