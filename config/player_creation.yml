# 캐릭터 생성 규칙 (기계 판독용)
# 기준 문서: docs/design/character_creation.md

attribute_allocation:
  # 화후 규칙: 모든 능력치는 내부 실수로 적립 (수련 진행도). 판정 가산은 정수부,
  # 파생치(내력/내구/회피 회복 등)는 실수치 사용 — balance_audit_cliffs.md
  base_value: 2                 # 모든 능력치 기본치
  free_points: 6                # 자유 배분
  creation_max: 4               # 생성 시 상한 (삼류의 한계)
  creation_min: 1               # 하한 (1 감소로 포인트 회수, 최대 2회)
  reduce_for_points_limit: 2

# 경지별 능력치 상한 (성장 시)
attribute_cap_by_realm:
  범인: 3
  삼류: 4
  이류: 5
  일류: 6
  절정: 7
  초절정: 8
  화경: 9
  현경: 10
  생사경: 10

# 성향별 추천 프리셋 — 추천일 뿐 강제 배정하지 않는다
# 배열 순서: [근력, 민첩, 체력, 내공, 감각, 화술, 지혜]
disposition_presets:
  협의형:
    stats: [3, 3, 3, 3, 3, 3, 2]
    recommended_identities: [낭인_지망생, 문파_지원자]
    routes: [정파, 협객, 화산파, 소림사, 아미파, 관군_협력]
  생존형:
    stats: [2, 3, 4, 2, 4, 2, 3]
    recommended_identities: [고아_출신_부랑객, 낭인_지망생]
    routes: [낭인, 개방, 사파_접촉, 정보상, 은거_전승]
  야망형:
    stats: [4, 3, 3, 3, 2, 3, 2]
    recommended_identities: [몰락_세가_자제, 낭인_지망생]
    routes: [세가_재건, 문파_권력, 사파_두각]
  자유형:
    stats: [3, 4, 3, 2, 3, 3, 2]
    recommended_identities: [떠돌이_표사]
    routes: [낭인, 표국, 유람]
  탐구형:
    stats: [2, 2, 3, 3, 3, 2, 5]    # 하한 규칙 사용 예 (근력/민첩에서 회수)
    recommended_identities: [의원_제자]
    routes: [제갈세가, 무당파, 의원, 약재상_제자, 정보상, 약왕곡]
  은밀형:
    stats: [2, 4, 2, 2, 4, 3, 3]
    recommended_identities: [하오문_말단, 고아_출신_부랑객]
    routes: [하오문, 살막, 사천당가, 사파, 마교_히든_루트, 무영각]
  이익형:
    stats: [2, 3, 3, 2, 3, 4, 3]
    recommended_identities: [상단_견습]
    routes: [상단, 정보상, 중개인]

# [v2 강등] 아래 성인 신분들은 더 이상 '생성 시 선택지'가 아니다.
# 전원 유년/소년 집안 시작 (age_and_lifepath v2) — 이 신분들은 플레이로 '자라서 되는'
# 도달 신분 템플릿이자 NPC 생성 재료로 유지한다. (예: 낭인 지망생 = 소년이 자란 한 형태)
starting_identities:
  낭인_지망생:
    skills: { 조사: 2, 은신: 1, 추적: 1 }
    start_location: cheongha_hyeon
    initial_relations: {}
    notes: "무소속. 무엇이든 될 수 있는 백지. 첫 10턴 테스트 기준 신분."
  문파_지원자:
    skills: { 교섭: 2, 조사: 1, 호위: 1 }
    start_location: request_office
    initial_relations: { soyeon: "안면" }
    notes: "문파 직행 루트 열림"
  고아_출신_부랑객:
    skills: { 은신: 2, 정보수집: 1, 도주: 1 }
    start_location: cheongha_hyeon
    initial_relations: {}
    notes: "민간 하층 소문망 접근"
  몰락_세가_자제:
    skills: { 교섭: 2, 검법: 1, 조사: 1 }
    start_location: cheongha_hyeon
    initial_relations: {}
    notes: "가문의 이름값 — 명성이자 표적"
  떠돌이_표사:
    skills: { 호위: 2, 추적: 1, 도주: 1 }
    start_location: north_road
    initial_relations: { gwakjin: "구면 (신뢰 0)" }
  의원_제자:
    skills: { 의술: 2, 조사: 1, 교섭: 1 }
    start_location: medicine_shop
    initial_relations: { yumun: "사제 관계" }
    notes: "열병 사건 최근접 신분"
  하오문_말단:
    skills: { 정보수집: 2, 은신: 1, 교섭: 1 }
    start_location: cheongha_inn
    initial_relations: { muksam: "존재를 이미 안다 (양날)" }
  상단_견습:
    skills: { 상술: 2, 교섭: 1, 조사: 1 }
    start_location: cheongha_hyeon
    initial_relations: { gwakjin: "동료" }
    notes: "상단 내부 정보 접근"

# [v2 강등] 일반인(범인) 성인 신분 — 생성 선택지 아님 (전원 유년/소년 시작).
# 도달 신분 템플릿 + NPC 재료로 유지. '무공 백지 = 기연 자격' 원리는 이제 전원에게 적용됨.
commoner_identities:
  객잔_점소이:
    realm: 범인
    skills: { 고객_파악: 2, 정보수집: 1, 흥정: 1 }
    start_location: cheongha_inn
    initial_relations: { hanbaek: "고용 관계" }
    notes: "소문의 한가운데서 산다"
  약초꾼:
    realm: 범인
    skills: { 산길_지리: 2, 조사: 1, 의술: 1 }
    start_location: north_road
    initial_relations: { yumun: "거래 관계" }
    notes: "산에서 벌어지는 일을 본다"
  장터_잡부:
    realm: 범인
    skills: { 흥정: 2, 손재주: 1, 정보수집: 1 }
    start_location: market
    initial_relations: {}
    notes: "민간 소문망의 말단"

# ─── 시작 나이와 인생 진행 v2 (기준: age_and_lifepath.md v2) ───
# 전원 유년/소년 시작. 성인 시작 폐지 (성인은 NPC의 영역).
# 생성 절차: 성향 → 집안 → 시작 나이 → 발단 사건 → 배분 → 초기 목표
# 나이는 달력이 아니라 사건(장 종결 시 시간 도약)이 먹인다.
age_and_lifepath:
  version: 2
  starting_realm: 범인          # 전원 무공 백지 — 사승 기연 자격이 전원에게 열림

  age_brackets:
    유년:
      age_range: [8, 12]
      base_value: 1             # 아이는 성인 평균(2)보다 약하다 (F5 패치 — PT-002)
      free_points: 4
      creation_max: 2           # 아이의 몸
    소년:
      age_range: [13, 15]
      base_value: 2
      free_points: 5
      creation_max: 3

  # 아이 취급 보정 — 약관(16세) 도달 시 전부 해제
  child_modifiers:
    은밀_엿듣기_정보수집: +1     # 아무도 아이를 경계하지 않는다
    설득_협상_위협: -1           # 아무도 아이의 말을 무겁게 듣지 않는다
    전투_성인상대: { 유년: -2, 소년: -1 }   # 체격 차 — 경지 격차와 별도
    expires: "약관(16세) 도달"

  # 집안 — 시작 신분은 직업이 아니라 태어난 집. 시작 지역도 집이 정한다
  families:
    상가의_자식:
      start_region_examples: [사천_당가세력권, 강남_상로]
      grants: { 기술: { 흥정: 1 }, 소양: "글눈" }
      world_link: "가문이 지역 지배 세력에 상납하는 관계 (예: 사천당가)"
    농가의_자식:
      start_region_examples: [청하현_외곽]
      grants: { 소양: "체력 수련 가점", 생활_기술_선택_1종: { options: [덫_사냥, 농사, 목축], level: 2 } }   # F17 — PT-006
      world_link: "땅과 계절, 도적의 첫 표적"
    객잔집_자식:
      start_region_examples: [청하현]
      grants: { 기술: { 고객_파악: 1 } }
      world_link: "소문의 한가운데"
    의원집_자식:
      start_region_examples: [청하현]
      grants: { 기술: { 의술: 1 } }
      world_link: "병자와 죽음을 일찍 본다"
    표국집_자식:
      start_region_examples: [지역권_각지]
      grants: { 기술: { 산길_지리: 1 } }
      world_link: "아버지의 동료들, 길 위의 삶"
    무가의_자식:                     # 건재한 지방 무가 — 지원은 소유가 아니라 상태다
      start_region_examples: [청하현, 지역권_각지]
      scale: "현·부 단위 향반 무가 — 오대세가급 직계 시작은 계속 배제 (시작 지역 미구현 + 백지의 평등)"
      grants: { 기술: { 검법: 1 }, 소양: "예법" }   # 가전 기초형이 몸에 뱄다 — 내공은 백지 (기연 자격 유지)
      world_link: "살아 있는 가문 = 뒷배이자 굴레 — 세계가 청구할 주소가 있다"
      support:                        # 지원의 3원칙 — 상태이지 소유가 아니다
        월례_지원_문: [20, 40]         # 전장 전표 수령 (시간 진행 배선 후 실효 — 봇 베타는 초기 자금만)
        조건: "가문의 기대 안에 있을 것 — 사파 접촉 소문·가문 명예 훼손·명령 불복 시 단계 이행"
        단계: [경고_서신, 지원_중단, 소환, 절연]   # 절연 = 사실상 몰락_무가 루트 합류 (흔적 '이름'만 남는다)
      비용:                           # 세계가 청구한다 — 부잣집 자제의 판돈
        이름의_무게: "행동이 가문 평판에 기장 — faction_reaction 대상. 잘한 일도 '가문의 뜻'으로 읽힌다"
        표적_가치: "납치·인질 몸값이 있는 아이 — 습격 조우 시 살해보다 납치 선호 (죽음 대신 다른 위기)"
        기대라는_이름의_목표: "초기 목표를 가문이 정한다 — 성향과 어긋날수록 드라마 (수행_파견 goal 참조)"
      incident_pool: [수행_파견, 목격, 아이_거두기]   # 건재한 집 = 재난형 발단(몰락·습격·역병·맡겨짐) 배제
    몰락_무가의_자식:
      start_region_examples: [각지]
      grants: { 기술: { 검법: 0 }, 흔적: "이름" }
      world_link: "벽에 걸린 낡은 검 — 가문의 과거"

  # 시작 지역 — 청하현만 완전 구현. 스텁은 발단 사건으로 구현 지역에 합류 가능
  start_regions:
    cheongha_hyeon: { status: 완비, region_file: "config/regions/cheongha_hyeon.yml" }
    사천_당가세력권: { status: 스텁, ruling_faction: 사천당가, note: "성도 상계. 상세 미설계" }
    강남_상로: { status: 스텁, ruling_faction: 상단연합, note: "물의 고장. 상세 미설계" }
    하북_평야: { status: 스텁, ruling_faction: 하북팽가, note: "상세 미설계" }
    funnel_rule: "스텁 지역 출신은 발단 사건의 '이동'으로 구현 지역에 합류할 수 있다 (피난 온 아이)"

  # 발단 사건 — "왜 이 아이에게 이런 일이 닥쳤는가". 선택 또는 운명(무작위 1d7)
  inciting_incidents:
    가문의_몰락:
      cause: "지배 세력과의 상납·장부 분쟁 (진상은 더 깊을 수 있다)"
      movement: "야반도주 → 타지 친척집 (스텁→구현 지역 합류의 전형)"
      trace: ["몰락의 이름", "장부 눈썰미"]
      long_hook: "가문을 무너뜨린 세력 내부의 진범"
      goal_candidates: ["가족과 살아남기", "가문의 누명 벗기기"]
    습격:
      cause: "도적/사파의 마을·상행 습격"
      movement: "가족 사망·이산, 홀로 남음"
      trace: ["생존자", "그날 밤의 기억"]
      long_hook: "범인의 단서 하나 (문양, 흉터, 말버릇)"
      goal_candidates: ["살아남기", "그 문양의 주인 찾기"]
    역병:
      cause: "마을에 병이 돌았다"
      movement: "살길 찾아 유랑 → 정착"
      trace: ["약냄새", "죽음을 아는 아이"]
      long_hook: "병의 진상 (금기 세력 장기 떡밥 연결 가능)"
      goal_candidates: ["정착하기", "병의 근원 알아내기"]
    목격:
      cause: "봐서는 안 될 것을 봄 — 무림인의 살인, 밀거래"
      movement: "쫓기거나, 입막음 대신 거둬짐"
      trace: ["무거운 비밀"]
      long_hook: "그 무인의 정체"
      goal_candidates: ["잊고 살아남기", "그 사람의 정체 알기"]
    맡겨짐:
      cause: "빚·기근으로 상단/객잔에 맡겨짐"
      movement: "새 주인의 집"
      trace: ["팔린 아이", "빠른 눈치"]
      long_hook: "가족 채무의 배후, 돌아갈 집"
      goal_candidates: ["몸값 갚기", "가족 찾기"]
    핏줄의_비밀:
      cause: "부모가 은퇴 무인·파문 제자였음이 드러남"
      movement: "부모의 과거가 찾아옴"
      trace: ["물려받은 것 (검, 반지, 구결 반쪽)"]
      long_hook: "부모의 원수 또는 옛 사문"
      goal_candidates: ["부모의 과거 알기", "물려받은 것의 의미 찾기"]
    수행_파견:                       # 무가의_자식 전용 성격 — 재난이 아니라 명령이 발단이다
      cause: "가주(아버지)의 명 — '강호를 눈으로 보고 오라.' 수행원 없이, 신분을 밝히지 말 것"
      movement: "가문의 연고가 닿는 고을(예: 청하현)로 홀로 보내짐 — 전장에 월례 전표가 와 있다"
      trace: ["가문의 이름 (숨긴)", "몸에 밴 예법"]
      long_hook: "가주가 하필 지금, 하필 이 고을로 보낸 진짜 이유"
      goal_candidates: ["가문이 정한 과제 해내기", "이름 없이 내 힘으로 서기"]
    아이_거두기:
      cause: "문파/사파의 자질 시험에 눈에 띄었으나 어긋남"
      movement: "제자리 — 그러나 표식이 남았다"
      trace: ["재목이라는 말"]
      long_hook: "그때 데려가려던 자들"
      goal_candidates: ["그들을 다시 만나기", "스스로 길 찾기"]

  # 사건 기반 나이 진행 — 장(章) 시스템
  chapter_progression:
    unit: "장(章) = 하나의 중심 사건 묶음. 종결 시 시간 도약 제안"
    time_skip_options: [없음, 수개월, 1~3년]
    skip_resolution:
      player: "도약 기간의 삶 선언 → 압축 성장 (기간 × 수련 효율, 경지 상한 유지)"
      world: "지역 회복·세력 감쇠·소문 소멸·NPC 삶 진행·세계 공통 이벤트 일괄 처리"
    bracket_up:
      유년_to_소년: { 배분: +1, 상한: 3 }
      소년_to_약관: { 배분: +1, 상한: "경지 규칙으로 이관", 해제: 아이_취급_보정 }

  # 서장·출도 — 시간축 합류 모델 (runtime_architecture.md 3.2)
  seojang_and_chuldo:
    서장: "생성~출도 전 = 개인 시간축 샌드박스. 장 도약 자유, 공유 세계 기입 없음, 공유 기연 접근 불가"
