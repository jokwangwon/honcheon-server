# ═══════════════════════════════════════════════════════════════════════
# 지형의 관문 — 땅은 건축의 허락을 받고 서지 않는다
# ═══════════════════════════════════════════════════════════════════════
#
# 정본: docs/design/gate_and_watertown.md (사용자가 직접 쓴 계약)
#
#   > 건축의 미결은 건축만 막을 수 있다. 건축의 미결이 땅을 막아서는 안 된다.
#
# 순서:  ① 지형 게이트 → ② 지형 조성 → ③ 영수증 → ④ 건축 게이트 → ⑤ 건축 / ⑥ 땅만 남기고 사유 출력
#
# ★ 지형 게이트가 검사하는 것은 **땅의 일**뿐이다 (좌표·프로파일·구현·승인·이미 선 땅인가).
#   건축 원형·규모 체계·build_radius 는 **여기서 묻지 않는다** — 그것은 ④의 몫이다.

# ── TerrainForge 의 판(版) ─────────────────────────────────────────────
#
# ★★ 이 두 줄이 「승인」이다.  version != approved  이면 **월드에 쓰지 않는다** (preview).
#
#   4 = 점묘 수정판 (2026-07-14) — 좌표 해시(파장 1칸)를 격자 잡음+보간으로 바꿨다.
#       지면 요철 · 들 가장자리 · 사막 표층 · 설선 · 굴 바닥이 **덩어리**로 난다.
#       눈: tools/TerrainGrainSelfTest.java (인접쌍 불일치 4.6~15.5% · 외톨이 0.0~0.2%)
#   3 = 점묘판 (구판) — 칸마다 독립으로 뽑던 좌표 해시. **한 칸 한 칸 다른 필드**가 됐다.
#
# ★ 승인은 **사람의 일이다.** 조감(/혼천 조감)으로 새 땅을 눈으로 보고, 좋으면 아래를 4 로 올려라.
#   ★★ 땅은 한 번만 선다 — 점묘가 살아 있는 채로 빚으면 그 땅은 **영원히 그 상태다.**
forge_version: 4
approved_forge_version: 4   # ★ 사용자 승인 (2026-07-14) — 점묘를 고친 v4 를 정본으로 삼는다.
                            #   같은 결정으로 **옛 땅을 전부 갈아엎었다** (점묘판은 남기지 않는다).
                            #   땅은 한 번만 서므로, 사람이 늘기 전인 지금이 마지막 기회였다.

# 승인 전에는 무엇을 하는가 — preview: 검사 결과와 예정 변형만 출력하고 **월드에 안 쓴다**
mode_when_unapproved: preview

# ── 구현된 지형 프로파일 ───────────────────────────────────────────────
#
# TerrainForge.Profile 에 실제로 **살이 붙은** 것만 적는다.
# 지도(terrain.yml shaping:)가 여기 없는 프로파일을 요구하면 그 땅은 pending 이다
#   → pending_reason: terrain_profile_unresolved
#
# ★ 「수향」이 없는 것이 지금 강남이 서지 못하는 진짜 이유다 (계약 ③ — 아직 안 지었다).
profiles_implemented: [봉우리, 중턱단, 들, 사막, 그대로]

# ── 장소별 보류 ────────────────────────────────────────────────────────
#
# 사람이 "이 땅은 아직 빚지 마라"고 못 박는 자리. 게이트가 여기서 멈춘다.
pending:
  # 사용자 (2026-07-14): "강남의 실제 지형 조성은 점묘 문제가 수정되고
  #                       새 TerrainForge 버전이 승인될 때까지 실행하지 않는다."
  gangnam_sangro: pointillism_fix_in_progress

# 영수증 — 조성이 실제로 커밋되면 여기 적힌 이름의 파일에 남는다 (플러그인 데이터 폴더)
#   ★ 이미 committed 인 곳은 일반 명령으로 다시 조성하지 않는다 (땅은 한 번만 선다)
receipts: terrain_receipts.yml
