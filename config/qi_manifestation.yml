# 기 발현(氣發現) 규칙 (기계 판독용) — 형태(形) × 격(格)
# 기준 문서: docs/design/qi_manifestation.md
# 상성 한 줄: "격은 막기를 부수고, 회피는 격을 속인다"
# internal_energy.yml cost_bands(검기 2~3, 강기 4~6)를 형태별로 세분한다

# ─── 격(格) 사다리 — 응집 등급과 경지 게이트 ───
grades:
  발경: { rank: 1, gate: 삼류, desc: "타격에 기를 싣는다 — 근접 유일" }
  검기: { rank: 2, gate: 절정, desc: "기가 날에 서린다/날아간다 — 일반 병기를 상하게 한다" }
  강기: { rank: 3, gate: 화경, desc: "응집 — 검에 두르면 검강, 몸에 두르면 호신강기" }
  어검: { rank: 4, gate: 현경, desc: "이기어검 — 검이 손을 떠난다 (방향 상실의 전투)" }
  심검: { rank: 5, gate: 생사경, desc: "무형검 — 창작 오의 연계 (ultimate_arts)" }

# ─── 형태(形) 4종 — 사용 방식과 코스트 ───
forms:
  두름:                            # 인챈트형 — 지속 유지비
    검기_두름: { sustain_per_round: 1, effect: "근접 위력 +무공 보정, 범철 무기 절상" }
    검강_두름: { sustain_per_round: 2, effect: "위력 ++, 하위 격 기 방어 절단" }
  쏨:                              # 발출형 — 1회 대량 소모, 빗나가면 소멸
    검기_참격: { cost: 3, hitbox: "선(참격) 또는 시(투사체)" }
    강기_포: { cost: 6, hitbox: "시(관통 투사체)" }
    note: "내력 관리의 도박 — 절정의 전투는 '언제 쏘나'"
  두름_몸:                         # 전개형 — 호신강기 (반응 방어)
    호신강기:
      deploy: 2
      sustain_per_round: 2
      on_hit: "하위 격 공격 자동 무효(외공기·발경·검기 근접), 동격은 소모 상쇄전 (피해 대신 내력 소모)"
  부림:                            # 어검형 — 채널링
    이기어검:
      cast: 4
      sustain_per_round: 2
      sword_unit: "검이 독립 유닛으로 비행 — 본체는 맨손/타 병기 동시 전투"
      blindside: "사각 공격 — 가드 방향 무의미. 유효 대응: 회피 / 호신강기 / 격추"
      shootdown: { check: 대립_판정, result: "낙검 — 회수 2라운드 (어검의 유일한 빈틈)" }
      caster_penalty: { 회피: -2, note: "마음이 검에 가 있다 — 어검사는 검이 아니라 사람을 쳐라" }
      mc: "디스플레이 엔티티 비행 (VFX 풀·performance.yml 예산), 시점 지정 유도 + 자동 선회"

# ─── 격 상성 3원칙 ───
counters:
  원칙_1_관통: "한 격 위의 기운은 아래 격의 '기 방어'를 관통·파괴한다 (검강은 검기를 벤다)"
  원칙_2_회피: "격은 막기(가드·기 방어)를 부수지만 회피를 부수지 않는다 — 몸을 빼는 것에는 격이 없다"
  원칙_3_무기: "무기가 격을 견뎌야 한다 (weapon_grades — 보검이 비싼 이유)"

# ─── 무기 내구 등급 ───
weapon_grades:
  범철: { withstands: 발경, desc: "맨 무기 — 검기에 상한다" }
  정련: { withstands: 검기, desc: "명공의 병기 — 검기를 받아낸다" }
  보병: { withstands: 강기, desc: "보검·보도 — 검강을 감당한다" }
  신병: { withstands: 심검, desc: "신검 — 어검·심검의 그릇" }

# ─── 무기 파괴 — 검이 맞닿는 순간 ───
weapon_break:
  trigger: "무기 접촉 격돌만 — 가드/패링/합. 회피는 접촉이 없다 (무기가 안전한 유일한 대응)"
  rule:
    감당_이상: 손상_없음
    1격_초과: { effect: "손상 누적 — 격돌 3회째 파괴", telegraph: "1회째부터 '금이 간다' 예고" }
    2격_초과: { effect: "즉시 절단 — 한 합", example: "범철 vs 검강" }
  발경_exception: "발경은 기가 몸·무기 안에 머문다 — 상대 무기를 상하게 하지 않는다"
  self_damage: "자기 무기가 자기 발현 격을 못 견디면 시전 3회마다 손상 1 (범철에 검기 두름)"
  after_break: "맨손 — 무기 요구 무공 다운캐스트('맨 기술', internal_energy.yml), 재무장 = 행동 1개"
  mc: "바닐라 내구도 재활용 — 등급별 내구 배정, 절단 = 파괴음 + 파편 파티클"

# ─── 기존 체계 접합 ───
integration:
  cost_bands: "internal_energy.yml 검기(2~3)·강기(4~6)의 형태별 구체화 — 본 파일이 우선"
  realm_gates: "internal_energy.yml realm_gates — 현경 '어검', 생사경 '심검' 추가 반영"
  qi_profile: "simbeop.yml 기운 프로파일 연비(-1 등)는 형태 불문 유지비·발출비에 적용"
  ultimate_arts: "오의 ≠ 격 — 두 사다리는 독립 (검기 오의도, 검강 오의도 존재)"
  npc: "npc_combat.yml 대칭 원칙 — NPC 격 발현 동일 규칙 + 텔레그래프 (응집은 빛으로 보인다)"
  morale: "격 차이 목격(검강 응집)은 하위 NPC 전의 즉시 저하 — npc_combat.yml morale 위세 입력"
