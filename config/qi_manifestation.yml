# 기 발현(氣發現) 규칙 (기계 판독용) — 형태(形) × 격(格)
# 기준 문서: docs/design/qi_manifestation.md
# 상성 한 줄: "격은 막기를 부수고, 회피는 격을 속인다"
# internal_energy.yml cost_bands(검기 1~3, 강기 2~6)를 형태별로 세분한다
#
# 2026-07 정합 패스 — 격이 장식이었다:
#   병: 피해 공식에 격 항이 없고 forms 의 effect 가 전부 서술문('위력 ++')이라, 내력을 태워도 피해가 같았다.
#       보병 한 자루(판정 +1 = 피해 +28%)가 강기보다 강했다. 발경은 코스트만 있는 죽은 선택지였다.
#   약: ① grades 에 power(격 위력) 수치 등록 — combat.yml damage.qi_power 와 동일 정본.
#       ② forms 에 power 등록 (발출형은 더 아프다 — 검기_참격 3, 강기_포 5).
#       ③ 호신강기의 '하위 격 자동 무효'에 상쇄 소모량을 수치로 붙였다. 절대 방어는 없다.
#       ④ 무기 등급의 판정 보정을 0으로 내렸다 (equipment.yml) — 등급의 값은 생존이지 보정이 아니다.

# ─── 격(格) 사다리 — 응집 등급과 경지 게이트 ───
# power = 피해 공식의 '격 위력' 항 (combat.yml damage.qi_power 와 동일 — 여기가 서사 정본, combat.yml 이 엔진 정본)
grades:
  # 발경 gate = 일류 — internal_energy.yml realm_gates 와 동일 (개화 이전에는 내력이 0이라 시전 자체가 불가능하다)
  발경: { rank: 1, gate: 일류, power: 1, desc: "타격에 기를 싣는다 — 근접 유일. 개화한 몸의 첫 권능" }
  검기: { rank: 2, gate: 절정, power: 2, desc: "기가 날에 서린다/날아간다 — 일반 병기를 상하게 한다" }
  강기: { rank: 3, gate: 화경, power: 3, desc: "응집 — 검에 두르면 검강, 몸에 두르면 호신강기" }
  어검: { rank: 4, gate: 현경, power: 4, desc: "이기어검 — 검이 손을 떠난다 (방향 상실의 전투)" }
  심검: { rank: 5, gate: 생사경, power: 5, desc: "무형검 — 창작 오의 연계 (ultimate_arts)" }

# ─── 형태(形) 4종 — 사용 방식과 코스트 ───
# power 가 있는 형태는 그 값이 격 기본값보다 우선한다 (발출형은 1회에 몰아 쓰므로 더 아프다)
forms:
  두름:                            # 인챈트형 — 지속 유지비
    검기_두름: { sustain_per_round: 1, power: 2, effect: "근접 위력 +2, 범철 무기 절상 (weapon_break)" }
    검강_두름: { sustain_per_round: 2, power: 3, effect: "근접 위력 +3, 하위 격 기 방어 절단 (호신강기 관통)" }
  쏨:                              # 발출형 — 1회 대량 소모, 빗나가면 소멸
    검기_참격: { cost: 3, power: 3, hitbox: "선(참격) 또는 시(투사체)" }
    강기_포: { cost: 6, power: 5, hitbox: "시(관통 투사체)" }
    note: "내력 관리의 도박 — 절정의 전투는 '언제 쏘나'. 빗나가면 코스트만 날아간다 (피해 0)"
  두름_몸:                         # 전개형 — 호신강기 (반응 방어)
    호신강기:
      deploy: 4
      # ★ 유지비 3 (검강 두름은 2) — **몸을 통째로 감싸는 것은 날 하나에 서리게 하는 것보다 비싸다.**
      #   2026-07 내력 수지 패스에서 2 → 3. 풀이 84로 커진 화경의 호신강기가 유지 2 로는
      #   절정 1인의 소모전(유지 2 + 상쇄 1 = 3/합)을 **26합** 버텼다 — 전투 상한(25합)보다 길다.
      #   즉 '무한 방어'였다 (한 전투 안에서는 절대 안 마른다). counterplay 가 이론에만 있었다.
      #   3 으로 올리면 20합 — 하위 격의 소모전이 **한 전투 안에서 실제로 끝난다.**
      sustain_per_round: 3
      power: 3                     # 방어 격 = 강기 (rank 3)
      # 【정본】 절대 방어는 없다 — 하위 격을 무효화하는 것은 공짜가 아니다 (2026-07 정합)
      on_hit:
        하위_격: { 피해: 0, 상쇄_소모: 1, note: "무효화 1회당 유지 내력 -1. 두들기면 깎인다" }
        동격: { 피해: 0, 상쇄_소모: 2, note: "강기 대 강기 — 소모 상쇄전. 먼저 마르는 쪽이 진다" }
        상위_격: { 관통: true, 피해: "격 위력 차만큼 관통 (원칙 1)", 상쇄_소모: 2 }
      collapse: "상쇄 소모를 지불할 내력이 없으면 그 즉시 소멸 — 다음 타격은 맨몸으로 받는다"
      # 수치 검산 (화경 내력 풀 84 — internal_energy.yml pool_curve, 2026-07 내력 수지 패스):
      #   ★★ 【무한 방어의 못】 호신강기를 두른 자는 **조식이 멎는다**
      #      (internal_energy.yml recovery.in_combat.조식.blocked_by_guard).
      #      검강을 두른 자는 숨을 쉰다(순수지 +5/합 — 하루 종일). 호신강기를 두른 자는 숨을 못 쉰다.
      #      몸을 통째로 기로 감쌌기 때문이다. **격을 두르는 것과 격으로 막는 것은 다른 일이다.**
      #      → 넘치는 내력이 곧 무적이 되지 않는다. 방어 삼문(회피·막기·흘리기)이 산다.
      #   무피격: 전개 4 + 유지 3/합 → 26합 (80초) — 그동안 단전은 한 점도 차지 않는다
      #   절정 1인이 매 합 검기로 때림: 4 + (3+1)/합 → 20합 ★ 전투 상한(25합) 안 — 소모전이 실제로 끝난다
      #   절정 3인 협공(포위 슬롯 3): 4 + (3+3)/합 → 13합 — 하위 격도 머릿수로 강기를 말릴 수 있다
      #   그리고 그 13합 동안 그는 **검강을 못 두른다** (armed 는 하나다) — 방어는 위력을 판다
      counterplay: "하위 격의 답 = ① 두들겨 말린다(상쇄 소모) ② 회피로 시간을 벌고 유지비를 태운다 ③ 격을 안 쓰는 지구전"
  부림:                            # 어검형 — 채널링
    이기어검:
      cast: 4
      sustain_per_round: 2
      power: 4
      sword_unit: "검이 독립 유닛으로 비행 — 본체는 맨손/타 병기 동시 전투"
      blindside: "사각 공격 — 가드 방향 무의미. 유효 대응: 회피 / 호신강기 / 격추"
      shootdown: { check: 대립_판정, result: "낙검 — 회수 2라운드 (어검의 유일한 빈틈)" }
      caster_penalty: { 회피: -2, note: "마음이 검에 가 있다 — 어검사는 검이 아니라 사람을 쳐라" }
      mc: "디스플레이 엔티티 비행 (VFX 풀·performance.yml 예산), 시점 지정 유도 + 자동 선회"

# ─── 격 상성 3원칙 ───
counters:
  원칙_1_관통: "한 격 위의 기운은 아래 격의 '기 방어'를 관통·파괴한다 (검강은 검기를 벤다) — 관통 피해 = 격 위력 차"
  원칙_2_회피: "격은 막기(가드·기 방어)를 부수지만 회피를 부수지 않는다 — 몸을 빼는 것에는 격이 없다"
  원칙_3_무기: "무기가 격을 견뎌야 한다 (weapon_grades — 보검이 비싼 이유)"
  원칙_4_상쇄: "기 방어는 소모품이다 — 하위 격이라도 때린 만큼 상대의 내력을 깎는다 (호신강기 on_hit 상쇄_소모)"

# ─── 무기 내구 등급 ───
weapon_grades:
  범철: { withstands: 발경, desc: "맨 무기 — 검기에 상한다" }
  정련: { withstands: 검기, desc: "명공의 병기 — 검기를 받아낸다" }
  보병: { withstands: 강기, desc: "보검·보도 — 검강을 감당한다" }
  신병: { withstands: 심검, desc: "신검 — 어검·심검의 그릇" }

# ─── 무기 파괴 — 검이 맞닿는 순간 ───
weapon_break:
  trigger: "무기 접촉 격돌만 — 가드/패링/합. 회피·흘리기는 접촉이 없다 (combat.yml defender_choice)"
  # 2026-07 정합: '막기'가 죽은 선택지였다 (정련 미만 무기로 검기를 막으면 검만 부러지고 이득이 0).
  #   → combat.yml 에서 막기에 피해 -3 을 주고, 여기서 '격돌 손상 = 격을 무기가 대신 먹은 값'으로 다시 읽는다.
  #     범철로 검기를 막으면 3합째 검이 부러진다. 그러나 그 3합 동안 피해는 합당 3씩 줄었다 (총 9).
  #     검을 태워 목숨을 사는 것 — 그것이 막기의 값이다. 그리고 '흘리기'(판정 -2, 무기 무손상)가 세 번째 길이다.
  rule:
    감당_이상: 손상_없음
    1격_초과: { effect: "손상 누적 — 격돌 3회째 파괴", telegraph: "1회째부터 '금이 간다' 예고", breaks_at: 3 }   # breaks_at = 엔진 판독용
    2격_초과: { effect: "즉시 절단 — 한 합", example: "범철 vs 검강" }
  발경_exception: "발경은 기가 몸·무기 안에 머문다 — 상대 무기를 상하게 하지 않는다"
  self_damage: "자기 무기가 자기 발현 격을 못 견디면 시전 3회마다 손상 1 (범철에 검기 두름)"
  self_damage_every: 3               # 엔진 판독용 수치 키
  after_break: "맨손 — 무기 요구 무공 다운캐스트('맨 기술', internal_energy.yml), 재무장 = 행동 1개"
  mc: "바닐라 내구도 재활용 — 등급별 내구 배정, 절단 = 파괴음 + 파편 파티클"

# ─── 기존 체계 접합 ───
integration:
  cost_bands: "internal_energy.yml 검기(1~3)·강기(2~6)의 형태별 구체화 — 본 파일이 우선 (유지비는 밴드 하단, 발출비는 상단)"
  realm_gates: "internal_energy.yml realm_gates — 현경 '어검', 생사경 '심검' 추가 반영"
  damage: "격 위력 = combat.yml damage.qi_power (엔진 정본). grades[].power / forms[].power 와 동일 값 — 형태값이 격 기본값보다 우선"
  skill_cost: "무공 초식은 내력을 쓰지 않는다 (cost 0). 내력을 먹는 것은 격이다 — combat.yml internal_energy.skill_cost_rule"
  qi_profile: "simbeop.yml 기운 프로파일 연비(-1 등)는 형태 불문 유지비·발출비에 적용"
  ultimate_arts: "오의 ≠ 격 — 두 사다리는 독립 (검기 오의도, 검강 오의도 존재)"
  npc: "npc_combat.yml 대칭 원칙 — NPC 격 발현 동일 규칙 + 텔레그래프 (응집은 빛으로 보인다)"
  morale: "격 차이 목격(검강 응집)은 하위 NPC 전의 즉시 저하 — npc_combat.yml morale.inputs '격_목격' (수치: 위세 표 참조)"
