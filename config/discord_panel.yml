# ═══════════════════════════════════════════════════════════════════════════════
# 안내판(案內板) — 디스코드에서 **명령을 치지 않게** 하는 판
# ═══════════════════════════════════════════════════════════════════════════════
#
# 【왜 있는가】 사용자의 말: *"디스코드에서 사용성 편리함 강화. 디스코드 명령을 치는 게 이상하다 생각함."*
#   그리고 이 프로젝트의 축: *"디스코드를 인증 서비스와 소셜로 두고, 다른 로직을 백엔드로 처리."*
#
#   **명령을 외워 치는 것은 로직의 문법이지 소셜의 문법이 아니다.** 디스코드에서는 **누르면 되어야** 한다.
#   선례는 이미 서 있다 — `/접합문`: 관리자가 한 번 치면 채널에 상시 버튼이 박히고, 그 뒤로 아무도
#   명령을 치지 않는다. 이 판은 **그 문법을 넓힌 것**이다.
#
# 【★ 길은 하나다】 처음 온 사람이 볼 것은 **버튼 하나**다 (「내 자리」). 누르면 그 사람의 **상태**에 맞는
#   버튼만 뜬다. 캐릭터가 없으면 [강호에 들다] 하나뿐이다 — 고를 것이 없으면 헤맬 것도 없다.
#
# 【★★ 침묵 금지】 지금 못 누르는 것은 **왜 못 누르는지 말한다** (locks). 버튼을 그냥 없애고 침묵하면
#   사람은 "왜 나한테는 안 보이지"를 혼자 추측한다 — 그것이 이 저장소가 반복해서 데인 병이다.
#
# 【등록제】 **코드는 문장을 지어내지 않는다.** 판의 글·버튼의 이름·못 누르는 이유는 전부 여기 있다.
#   눈: `python3 tools/panel_audit.py` (죽은 버튼·미등록 문장·상태 누락을 짖는다)

panel:
  # world_meta 키 — 안내판이 선 채널 (관리자가 /안내판 을 친 그 채널)
  channel_meta: 안내판:채널

  # ═══ 상시 판 — 채널에 **박혀 있는** 메시지. 아무도 이것을 다시 세우지 않는다 ═══
  board:
    title: "혼천 — 강호로 가는 길"
    body: |
      **명령을 칠 일이 없다.**

      ▸ **처음이라면 — [강호에 들다]** 를 눌러라. **그 한 번이면 된다.**
      ▸ 이미 이름이 있다면 — **[내 자리]** 에 지금 할 수 있는 것만 뜬다 (다른 사람에게는 안 보인다).
      ▸ 이름은 섰는데 마크의 몸이 안 붙었다면 — **[마크와 잇기]** 를 눌러 닉네임 한 칸을 적어라.
      ▸ 못 누르는 것이 있으면 **왜 못 누르는지 말해 준다.**

      *강호의 일(사냥·수련·의뢰·대화…)은 **마크 안에서** 벌어진다. 디스코드는 그대의 **이름과 자리**를 지킨다.*
    # ★★ 판에 **버튼이 셋** 박힌다. 첫 버튼이 곧 첫 걸음이다 — **처음 온 사람은 한 번만 누른다.**
    #   (사용자: *"캐릭터가 없을 시 **버튼으로 시작 버튼**을 만들기 (**명령어 치는 거 제거**)"*)
    #   옛 판은 [내 자리] 하나였고, 그것을 눌러야 그 **안에서** [강호에 들다] 가 보였다 — **두 번**이었다.
    start_label: "강호에 들다 — 처음이라면 여기"
    button_label: "내 자리 — 지금 무엇을 할 수 있나"
    # ★ B-117 (2026-07-14 실측): "접속이 명령어 타이핑이다." 잇기도 판의 버튼이다 (np:link) —
    #   누르면 닉네임 한 칸짜리 창이 뜨고, `/혼천 접속` 과 **같은 파이프**(askLink)로 흐른다.
    #   캐릭터가 없으면 그 파이프가 등록부의 말(locks.캐릭터_없음)로 그 자리에서 거절한다.
    link_label: "마크와 잇기 — 닉네임 한 칸"
    # ★ 판은 **공용 메시지**라 사람마다 다르게 못 보인다. 그래서 [강호에 들다] 는 **누구에게나 보인다** —
    #   이미 태어난 사람이 누르면 **그렇다고 말해 준다** (침묵 금지). 이 대답은 그 사람에게만 간다.
    already: |
      **{name}** — 그대는 이미 태어났다. 강호에 이름이 하나 있고, **계정당 하나다.**

      **[내 자리]** 를 눌러라 — 지금 무엇을 할 수 있는지 거기 있다.
      *다시 태어나려면 [내 자리] → [처음부터 다시].*
    posted: "이 채널에 **안내판**이 섰다 — 이제 사람들은 명령을 칠 일이 없다."
    # ★ 안내판을 두 번 세우면 판이 둘이 된다 (하나가 낡는다). 그래서 옛 자리를 말해 준다.
    moved: "안내판을 **여기로 옮겼다**. 옛 판은 {old} 에 남아 있다 — **지워라** (판이 둘이면 하나가 낡는다)."

  # ═══ 내 자리 — 누른 사람에게만 보이는 판 (ephemeral) ═══
  me:
    title: "내 자리"
    # 상태별 첫 문장 — 코드는 상태를 고를 뿐, 말은 여기서 가져간다
    states:
      없음:
        say: |
          **아직 강호에 이름이 없다.**
          유년의 기억 다섯 문항을 지나면 그대의 이름이 선다. 그 다음에 몸을 잇는다.
        buttons: [start]
      서장_미접합:
        say: |
          **{name}** — 아직 **서장(序章)** 중이다.
          서장은 **강호의 책**에서 이어진다. 마크에 접속해 **몸을 이으면** 품에 책이 온다.
        buttons: [link, sheet, reset]
      서장_접합:
        say: |
          **{name}** — 몸은 이어졌다 (`{body}`). 아직 **서장** 중이다.
          **마크에서 품에 온 책을 펴라.** 글자를 누르면 이야기가 넘어간다.
        buttons: [sheet, unlink, reset]
      강호_미접합:
        say: |
          **{name}** — 출도했다. 그러나 **몸이 없다.**
          마크의 몸을 이 이름에 이어야 강호에서 손발이 움직인다.
        buttons: [link, sheet, reset]
      강호_접합:
        say: |
          **{name}** — 출도했고, 몸도 이어져 있다 (`{body}`).
          **강호의 일은 마크 안에서 하라.** 여기는 그대의 이름과 자리를 지키는 곳이다.
        buttons: [sheet, unlink, reset]

    # ★ 옛 길 — 아직 디스코드에 남아 있다. **숨기지 않는다.** 다만 **결이 둘이다** (섞으면 거짓말이 된다):
    #
    #   ① **몸의 일** (11종) — 강호로 **옮겨진다.** 마크에서 손발이 움직인다
    #   ② **★ 소문 · 전장** (2종) — 옮겨지는 것이 아니라 **「명령」이라는 형태가 없어진다.**
    #      (2026-07-14 사용자: *"소문과 전장은 이제 **백엔드로 가서 내부적으로 처리**가 되고,
    #       **NPC를 통해 표현**이 되어야 합니다"*)
    #      소문망도 전장도 **뒤에서 계속 돈다** — 다만 사람이 그것을 **조회하지 않는다.**
    #      저잣거리에서 **누가 말해 주고**, 돈은 **창구에서 사람에게** 맡긴다.
    #      → 그러므로 이 둘에 "곧 강호로 옮겨진다"고 적으면 **거짓말이다.** (docs/BACKLOG.md B-083)
    legacy_note: |
      *옛 길 — 아직 디스코드에서도 된다. **곧 강호(마크)로 옮겨진다**:*
      `/혼천 사냥` `/혼천 수련` `/혼천 운기` `/혼천 비무` `/혼천 사사` `/혼천 의뢰` `/혼천 대화`
      `/혼천 탐방` `/혼천 출행` `/혼천 의방` `/혼천 구조`

      *★ 이 둘은 **옮겨지는 것이 아니라 없어진다** — **이제 사람에게 물어야 한다**:*
      `/혼천 소문` → 소문은 **메뉴가 아니다.** 저잣거리에서 **누가 말해 준다** (아직은 이 명령도 된다)
      `/혼천 전장` → 돈은 **창구에서 사람에게** 맡긴다 — 금서방을 찾아가라 (아직은 이 명령도 된다)

    # ★★ 옛 길의 **결** — 눈이 이것을 잰다 (`tools/panel_audit.py` ⑥절).
    #   legacy_note 는 사람이 읽는 글이라 **문단이 섞이기 쉽다.** 누가 `소문` 을 "옮겨진다" 문단으로
    #   도로 옮겨 놓으면 판이 조용히 거짓말한다 — 그래서 **어느 결인지 여기 못을 박고**, 눈이 대조한다.
    legacy_kinds:
      # 몸의 일 — 마크로 **옮겨진다** (명령이 마크의 명령이 된다)
      이관: [사냥, 비무, 수련, 사사, 의뢰, 대화, 탐방, 운기, 출행, 의방, 구조]
      # ★ 형태의 소멸 — 백엔드에 남고 **NPC 의 입과 손으로만** 만난다. 「명령」이 없어진다
      NPC전환: [소문, 전장]

  # ═══ 버튼 — 이름과 결(style). **코드는 이름을 짓지 않는다** ═══
  #   style: primary(파랑) · secondary(회색) · danger(빨강)
  buttons:
    start:
      label: "강호에 들다"
      style: primary
    sheet:
      label: "내 시트"
      style: secondary
    link:
      label: "몸을 잇는다"
      style: primary
    unlink:
      label: "몸을 끊는다"
      style: secondary
    reset:
      label: "처음부터 다시"
      style: danger

  # ═══ ★★ 못 누르는 이유 — **침묵 금지.** 버튼을 없앴으면 왜 없앴는지 말한다 ═══
  locks:
    캐릭터_없음: "캐릭터가 없다 — 먼저 **[강호에 들다]**."
    이미_있다: "이미 강호에 이름이 있다 (**{name}**) — 계정당 하나다. 지우려면 **[처음부터 다시]**."
    이미_이어짐: "이미 몸이 이어져 있다 (`{body}`) — 끊고 다시 이어라."
    몸이_없다: "이어진 몸이 없다 — 끊을 것이 없다."
    마크_꺼짐: "**마크 서버가 지금 꺼져 있다.** 물음을 보낼 화면이 없다 — 마크에 접속한 뒤 다시 눌러라."
    초기화_잠김: "초기화가 잠겨 있다 — 등록부(`config/reset.yml`)를 못 읽었다. 관리자에게 말하라."
    header: "**지금 못 누르는 것**"

  # ═══ 되돌리기 — 버튼으로도 갈 수 있다 (범위·문장은 config/reset.yml 이 정한다) ═══
  reset:
    title: "처음부터 다시 — 어디까지 되돌리나"
    body: |
      **되돌릴 수 없다.** 고른 다음 한 번 더 묻는다.
      *백업은 항상 뜬다. 백업이 실패하면 아무것도 안 지운다.*
    cancel_label: "그만둔다"

  # ═══ 관리자 — 이것들은 **버튼으로 안 만든다** (한 번 치고 마는 것이고, 그 손은 관리자다) ═══
  admin_note: |
    *관리자:* `/안내판` (이 판) · `/접합문` (접속의 문) · `/혼천 지역등록` · `/혼천 정산`
    *검증용:* `/혼천 사망` · `/혼천 사선` · `/혼천 명분` · `/혼천 사정` · `/초기화`
