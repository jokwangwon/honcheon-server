# 장비 체계 규칙 (기계 판독용) — 등급·방어구·기물·애병·마병
# 기준 문서: docs/design/equipment_system.md
# 대원칙: 장비는 격차가 아니라 속성과 서사를 만든다

caps:
  equipment_judgment_bonus_total: 2   # 장비 유래 판정 보정 총합 상한 (상황보정 캡 ±5 내부 계상)
  trinket_slots: 2                    # 기물(장신구) 슬롯
  inner_armor_slots: 1                # 내갑

# ─── 무기 등급 — qi_manifestation.yml weapon_grades(감당 격)의 구체화 ───
weapon_grades:
  범철:
    withstands: 발경
    judgment_bonus: 0
    acquisition: "아무 대장간"
    quantity: 무제한
    price_band: 서민_수개월치
  정련:
    withstands: 검기
    judgment_bonus: 0
    property_slots: 1                 # 명공 각인 가능
    acquisition: [명공, 표국, 문파_병기고]
    quantity: 흔치_않음
    price_band: 서민_수년치
    note: "가치는 보정이 아니라 생존 — 절정 고수와 3합을 버틴다 (weapon_break)"
  보병:
    withstands: 강기
    judgment_bonus: 1
    property_slots: 1                 # 내재
    acquisition: [문파_신물, 경매, 기연]
    quantity: 세력_보물급
    rumor: "소지 자체가 소문 — 강도 2, 목격 시"
  신병:
    withstands: 심검
    judgment_bonus: 1
    property_slots: 2                 # 내재 + 내력(來歷) 보유
    acquisition: [기연, 강탈, 계승]
    quantity: "세계 등록제 — 서버당 한 자릿수 (창작 오의와 동일 유일성 정책)"
    rumor: "소유 이동 = 강호의 사건 — 강도 3 소문 + 세력 반응 입력"

# ─── 방어구 — "갑옷은 회피를 판다" (격 상성 원칙 2의 뒷면) ───
armor:
  무복: { mitigation: 0, dodge_penalty: 0, note: "무림인 표준 — 경공·보법 온전" }
  피갑: { mitigation: 1, dodge_penalty: -1, wearers: [표사, 관군] }
  철갑: { mitigation: 2, dodge_penalty: -2, restrictions: [경공_불가], wearers: [관군_중장보] }
  내갑:
    mitigation: 1
    dodge_penalty: 0
    special: [암기_무효, "검기 1회/일 방어"]
    grade: 보물급
    examples: [금사갑]
  mitigation_rule: "부상 등급 1단 완화 (중상→경상). 격 상성은 못 이긴다 — 검강 앞 피갑은 종이"

# ─── 기물 카탈로그 (등록제 — 슬롯 2칸, 보정형은 캡 계상) ───
trinkets:
  피독주: { effect: "독 저항 판정 +2" }
  야명주: { effect: "야간 시야 페널티 무효" }
  청낭: { effect: "의술 판정 +1, 지혈 도구 상시" }
  호신부: { effect: "치명적 실패 1회/장 → 실패로 완화", consumed_on_use: true }
  천잠사_요대: { effect: "금나수·포박 탈출 +2" }

# ─── 특수 속성 카탈로그 (등록제 — "센 것"이 아니라 "어느 상황의 것") ───
special_properties:
  파사: { effect: "마공·사술 상대 위력 +2" }
  한철: { effect: "빙공 연계 시 경직 +1단" }
  경명: { effect: "발도 무음 — 기습 판정 +1" }
  명공각인: { effect: "내구 1등급 상향 취급 (감당 격은 그대로 — weapon_break 계산에만)" }
  음양쌍인: { effect: "이도류 무공 요구 해제" }
  탈혼: { effect: "발검 목격 하위 NPC 전의 -1 (npc_combat.yml morale 위세 입력)" }

# ─── 애병(愛兵) — 성장 무기: 검과 사람이 서로 길든다 ───
beloved_weapon:
  principle: "모든 보정은 주인의 손에서만 — 강탈한 남의 애병은 등급값 (약탈 메타 차단)"
  history_inputs: [동행_년수, 생사_격돌_생존, 생사_고비_공유, 오의_동반_시전]
  stages:
    손에_익다:
      requires: "동행 1년+ 또는 격돌 30회"
      grants: { judgment_bonus_owner_only: 1 }   # 캡 계상
    명병:
      requires: "생사 고비 3회 + 명성 사건 1회"
      grants:
        naming: "세계 유일 명명 (ultimate_arts naming과 동일 등록제)"
        rumor_subject: "검이 소문의 주체가 된다"
        break_grace: "파괴 판정 1회/전투 유예 — 금이 가도 부러지지 않는다"
    통령:
      requires: "동행 10년+ 그리고 주인 화경 이상"
      grants:
        withstand_rank_up: 1                     # 감당 격 +1 취급 (정련→보병급)
        eogeom_synergy: { sustain_discount: 1, recovery_rounds: 1 }   # 이기어검 궁합
  on_owner_death: "유품 — 새 주인은 0단부터. 이름·이력은 검에 남아 소문망 유지 (유산 서사 훅)"
  note: "범철도 애병이 된다 — 소년기의 낡은 도가 명병이 되는 것이 존재 이유"

# ─── 마병(魔兵) — 혈교 잔재: 사술의 응결 (등록제 — 양산 금지) ───
demonic_weapons:
  origin: "혈교 인신공양 의식의 잔재 — 응결된 원기가 스스로 갈증을 갖는다"
  classification: "사용 = 마공 분류 ① 타인 원기 약탈 (internal_energy demonic_classification)"
  power:
    withstand_rank_up: 1
    damage_bonus: 2
    drain: { target_vitality: -2, self_internal_energy: +2, on: 적중 }
  price:
    침식: "전투마다 심마 흔적 +1 (internal_energy qi_deviation simma 연동 — 히든 루트 재료)"
    갈증: "열흘 이상 흡혈 없으면 주인 원기 -5/열흘"
    놓기: "침식 3+부터 손에서 놓으려면 지혜 판정 — 검이 사람을 쓴다"
  identification:
    default: "감정 전엔 정체 불명 — 기연의 탈을 쓴 저주 훅"
    detectors: [도가_심법, 불가_심법, 신의]
    signal: 혈향
  world_response:
    exposure: "강도 3 소문 + 정파·관군 적대 입력 + 혈교 잔당 회수조 이벤트 — 세계가 청구"
  counters:
    정화: "도가 순도 판정 — 기물 정화 기준치 16 (simbeop.yml purification 확장)"
    파괴: 신병으로만
  registry:
    혈음도: { type: 도, effects: 기본형 }
    백골염주: { type: 기물, disguise: 승려_염주, effects: { 미혹_사술: "화술 +2" }, price: "매 사용 원기 -1 + 침식" }

# ─── 접합 ───
integration:
  weapon_break: "감당 격 원천 = qi_manifestation.yml weapon_break — 본 파일은 살"
  economy: "price_band는 임시 — 경제 시스템 설계 시 economy.yml로 이관"
  mc: "등급·속성 = lore/커스텀모델데이터, 애병 이력 = PDC, 내구 = 바닐라 재활용"
  rumor: "보병+ 소지 / 신병 이동 / 명병 명명 / 마병 발각 — 소문·세력 반응 표준 입력"
  creation: "시작 장비 범철 고정 (player_creation 유년·소년 정합 — 좋은 검은 서사로 번다)"
