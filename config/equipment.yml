# 장비 체계 규칙 (기계 판독용) — 등급·방어구·기물·애병·마병
# 기준 문서: docs/design/equipment_system.md
# 대원칙: 장비는 격차가 아니라 속성과 서사를 만든다

caps:
  equipment_judgment_bonus_total: 2   # 장비 유래 판정 보정 총합 상한 (상황보정 캡 ±5 내부 계상)
  trinket_slots: 2                    # 기물(장신구) 슬롯
  inner_armor_slots: 1                # 내갑

# ─── 무기 등급 — qi_manifestation.yml weapon_grades(감당 격)의 구체화 ───
# 2026-07 전투 정합 패스: 보병·신병의 judgment_bonus 1 → 0.
#   병: 2d6 판정에서 +1 은 명중 58.3% → 72.2% + 마진 상승의 이중 효과 = 피해 +28%.
#       격의 위력이 0이던 규칙에서는 **보병 한 자루가 강기보다 강했다**. 대원칙과 정면으로 어긋난다.
#   약: 등급 보정을 전부 0으로 내린다. 등급의 값은 오직 '감당 격'(= 부러지지 않는 것)이다.
#       무기에서 나오는 유일한 판정 보정은 애병(손에_익다 +1) — 검의 값은 등급이 아니라 함께한 세월이다.
#   검산: 파검(범철 → 맨손 + 다운캐스트) 시 피해 -76%. 등급의 값은 '보정 0, 생존 전부'로 여전히 크다.
weapon_grades:
  범철:
    withstands: 발경
    judgment_bonus: 0
    acquisition: "아무 대장간"
    quantity: 무제한
    price_band: 서민_수개월치
    note: "검기를 막으면 3합째 부러진다 (weapon_break 1격 초과). 그 3합 동안 피해는 합당 -3 — 검을 태워 목숨을 산다"
  정련:
    withstands: 검기
    judgment_bonus: 0
    property_slots: 1                 # 명공 각인 가능
    acquisition: [명공, 표국, 문파_병기고]
    quantity: 흔치_않음
    price_band: 서민_수년치
    note: "가치는 보정이 아니라 생존 — 절정 고수의 검기를 몇 합이든 받아낸다 (감당 이상 = 손상 0). 부러지는 것은 검강 앞에서다"
  보병:
    withstands: 강기
    judgment_bonus: 0                 # 1 → 0 (등급은 판정을 흔들지 않는다)
    property_slots: 1                 # 내재
    acquisition: [문파_신물, 경매, 기연]
    quantity: 세력_보물급
    rumor: "소지 자체가 소문 — 강도 2, 목격 시"
    note: "검강을 감당한다 — 화경 고수의 검강 두름(피해 +3)을 막고도 금이 가지 않는 유일한 급 아래층"
  신병:
    withstands: 심검
    judgment_bonus: 0                 # 1 → 0
    property_slots: 2                 # 내재 + 내력(來歷) 보유
    acquisition: [기연, 강탈, 계승]
    quantity: "세계 등록제 — 서버당 한 자릿수 (창작 오의와 동일 유일성 정책)"
    rumor: "소유 이동 = 강호의 사건 — 강도 3 소문 + 세력 반응 입력"
    note: "어검·심검의 그릇 — 마병을 부술 수 있는 유일한 것"

# ─── 방어구 — "갑옷은 회피를 판다" (격 상성 원칙 2의 뒷면) ───
# 【2026-07 생명 축 판단】 방어구는 **내구를 올리지 않는다. 경감한다.**
#   근거: 무협에 판금 갑옷은 없다. 몸을 지키는 것은 호신강기이고 철판이 아니다 —
#         철갑을 두른 관군 중장보가 절정 고수의 밥인 것이 이 장르의 결이다.
#         그리고 규칙으로도 옳다: 갑옷이 내구를 올리면 '갑옷을 껴입는 무림인'이 최적해가 되고,
#         경공·보법(회피)을 파는 dodge_penalty 축이 죽는다. 외갑의 값은 경감에 남긴다.
#   예외는 **몸에 닿는 것**뿐이다 — 살에 감기는 내갑. 그것만 vitality 를 갖는다 (아래 vitality 등록부).
armor:
  무복: { mitigation: 0, dodge_penalty: 0, vitality: 0, note: "무림인 표준 — 경공·보법 온전" }
  피갑: { mitigation: 1, dodge_penalty: -1, vitality: 0, wearers: [표사, 관군] }
  철갑: { mitigation: 2, dodge_penalty: -2, vitality: 0, restrictions: [경공_불가], wearers: [관군_중장보] }
  내갑:
    mitigation: 1
    dodge_penalty: 0
    vitality: 2                       # 살에 감기는 유일한 갑 — 몸의 일부가 된다 (천잠사는 몸을 상하게 두지 않는다)
    special: [암기_무효, "검기 1회/일 방어"]
    grade: 보물급
    examples: [금사갑]
  mitigation_rule: "부상 등급 1단 완화 (중상→경상). 격 상성은 못 이긴다 — 검강 앞 피갑은 종이"
  vitality_rule: "외갑(무복·피갑·철갑) vitality 0 — 철판은 몸을 키우지 않는다. 내구를 올리는 것은 내갑·기물·영약뿐"

  # ─── 【신설·기계 정의】 '격 상성은 못 이긴다' 의 수치 — 프로즈가 이미 답을 갖고 있었다 ───
  # mitigation_rule 이 스스로 선을 그어 뒀다: **"검강 앞 피갑은 종이"**.
  #   → 이 격(강기 = 검강, qi_manifestation grades rank 3) 이상 앞에서 갑옷의 경감은 **0** 이 된다.
  #   그전까지 이 문장은 프로즈였고, 엔진은 경감을 아예 안 주고 있었다 (갑옷은 회피만 팔았다 = 순손해).
  #
  # ★ 이것이 갑옷의 거래를 완성한다 — 그리고 **지배 전략을 스스로 막는다**:
  #   갑옷은 졸개(외공기·발경)에게 강하고, 고수(강기+)에게 **무력하다**. 그런데 회피는 언제나 판다.
  #   → 철갑 몰빵은 산적 다섯을 이기고 절정 고수 앞에서 벌거벗는다. 그것이 무협에 판금 기사가 없는 이유다.
  mitigation_pierced_from: 강기      # 이 격 이상은 갑옷을 그냥 지난다 (검강 앞 피갑은 종이)
  mitigation_applies_to: 피해        # 경감은 피해에서 뺀다 — combat.yml defender_choice.damage_reduction 과 같은 눈금
  dodge_penalty_applies_to: 회피     # 파는 것은 회피뿐이다 (막기·흘리기는 갑옷을 신경 쓰지 않는다)
  engine_ref: "combat.yml attack.defender_stance_mc.armor — 배선 지점 (수치의 정본은 여기다)"

# ─── 내구 가산 등록부 — 【정본 상한】 combat.yml durability.equipment_cap = 4 ───
# 이 등록부 밖의 어떤 장비도 내구를 올리지 못한다 (코드가 config 보다 앞서지 않는다).
# 총합이 캡을 넘으면 캡에서 잘린다 — 장비는 격차가 아니라 속성과 서사를 만든다 (대원칙).
vitality:
  cap: 4                              # combat.yml durability.equipment_cap 과 동일 (lint 대조 대상)
  sources:
    내갑: { grants: 2, slot: 내갑, note: "armor.내갑.vitality 와 동일 값 — 여기가 원장, 저기가 살" }
    호심경: { grants: 2, slot: 기물, note: "護心鏡 — 심장을 덮는 청동 거울. 무협의 정통 기물 (trinkets 등록)" }
  full_set: "내갑 + 호심경 = +4 (캡 도달). 그 이상은 없다 — 더 두르고 싶으면 몸을 바꿔라(영약)"
  elixir_note: |
    영약(대환단·소환단)은 **여기에 없다**. 장비가 아니기 때문이다 —
    먹으면 체력 '실수치'가 오르고, 그것은 벗을 수 없다 (combat.yml durability.elixir · 기연 등록제).
    장비는 +4 에서 멈추고, 몸은 멈추지 않는다. 그것이 이 세계가 내공을 갑옷보다 높이 두는 방식이다.

# ─── 기물 카탈로그 (등록제 — 슬롯 2칸, 보정형은 캡 계상) ───
trinkets:
  호심경: { effect: "내구 +2 (vitality 등록부)", vitality: 2, note: "護心鏡 — 심장 위에 덮는 청동 거울. 판정 보정 0 (캡 무관) — 값은 오직 살아남는 것에 있다" }
  피독주: { effect: "독 저항 판정 +2" }
  야명주: { effect: "야간 시야 페널티 무효" }
  청낭: { effect: "의술 판정 +1, 지혈 도구 상시" }
  호신부: { effect: "치명적 실패 1회/장 → 실패로 완화", consumed_on_use: true }
  천잠사_요대: { effect: "금나수·포박 탈출 +2" }

# ─── 특수 속성 카탈로그 (등록제 — "센 것"이 아니라 "어느 상황의 것") ───
special_properties:
  파사: { effect: "마공·사술 상대 위력 +2" }
  한철: { effect: "빙공 연계 시 경직 +1단" }
  경명: { effect: "발도 무음 — 기습 판정 +1" }
  명공각인: { effect: "내구 1등급 상향 취급 (감당 격은 그대로 — weapon_break 계산에만)" }
  음양쌍인: { effect: "이도류 무공 요구 해제" }
  탈혼: { effect: "발검 목격 하위 NPC 전의 -1 (npc_combat.yml morale 위세 입력)" }

# ─── 애병(愛兵) — 성장 무기: 검과 사람이 서로 길든다 ───
beloved_weapon:
  principle: "모든 보정은 주인의 손에서만 — 강탈한 남의 애병은 등급값 (약탈 메타 차단)"
  history_inputs: [동행_년수, 생사_격돌_생존, 생사_고비_공유, 오의_동반_시전]
  stages:
    손에_익다:
      requires: "동행 1년+ 또는 격돌 30회"
      grants: { judgment_bonus_owner_only: 1 }   # 캡 계상
    명병:
      requires: "생사 고비 3회 + 명성 사건 1회"
      grants:
        naming: "세계 유일 명명 (ultimate_arts naming과 동일 등록제)"
        rumor_subject: "검이 소문의 주체가 된다"
        break_grace: "파괴 판정 1회/전투 유예 — 금이 가도 부러지지 않는다"
    통령:
      requires: "동행 10년+ 그리고 주인 화경 이상"
      grants:
        withstand_rank_up: 1                     # 감당 격 +1 취급 (정련→보병급)
        eogeom_synergy: { sustain_discount: 1, recovery_rounds: 1 }   # 이기어검 궁합
  on_owner_death: "유품 — 새 주인은 0단부터. 이름·이력은 검에 남아 소문망 유지 (유산 서사 훅)"
  note: "범철도 애병이 된다 — 소년기의 낡은 도가 명병이 되는 것이 존재 이유"

# ─── 마병(魔兵) — 혈교 잔재: 사술의 응결 (등록제 — 양산 금지) ───
demonic_weapons:
  origin: "혈교 인신공양 의식의 잔재 — 응결된 원기가 스스로 갈증을 갖는다"
  classification: "사용 = 마공 분류 ① 타인 원기 약탈 (internal_energy demonic_classification)"
  power:
    withstand_rank_up: 1
    damage_bonus: 2
    drain: { target_vitality: -2, self_internal_energy: +2, "on": 적중 }   # 따옴표 필수 — YAML 1.1이 on 을 불리언으로 바꾼다
  price:
    침식: "전투마다 심마 흔적 +1 (internal_energy qi_deviation simma 연동 — 히든 루트 재료)"
    갈증: "열흘 이상 흡혈 없으면 주인 원기 -5/열흘"
    놓기: "침식 3+부터 손에서 놓으려면 지혜 판정 — 검이 사람을 쓴다"
  identification:
    default: "감정 전엔 정체 불명 — 기연의 탈을 쓴 저주 훅"
    detectors: [도가_심법, 불가_심법, 신의]
    signal: 혈향
  world_response:
    exposure: "강도 3 소문 + 정파·관군 적대 입력 + 혈교 잔당 회수조 이벤트 — 세계가 청구"
  counters:
    정화: "도가 순도 판정 — 기물 정화 기준치 16 (simbeop.yml purification 확장)"
    파괴: 신병으로만
  registry:
    혈음도: { type: 도, effects: 기본형 }
    백골염주: { type: 기물, disguise: 승려_염주, effects: { 미혹_사술: "화술 +2" }, price: "매 사용 원기 -1 + 침식" }

# ─── 접합 ───
integration:
  weapon_break: "감당 격 원천 = qi_manifestation.yml weapon_break — 본 파일은 살"
  economy: "가격 원천 = economy.yml price_table.장비 (이관 완료 — price_band는 서사 표기로 유지)"
  mc: "등급·속성 = lore/커스텀모델데이터, 애병 이력 = PDC, 내구 = 바닐라 재활용"
  rumor: "보병+ 소지 / 신병 이동 / 명병 명명 / 마병 발각 — 소문·세력 반응 표준 입력"
  creation: "시작 장비 범철 고정 (player_creation 유년·소년 정합 — 좋은 검은 서사로 번다)"
  creation_exception: "무가의_자식 = 정련급 가문 검 1점 대여 (판정 보정 0이라 백지 평등 무손상 — 소유권·문책은 player_creation armory)"
