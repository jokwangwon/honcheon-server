# ★★★ 화산파 02 외원 — 행각(行閣) 설계도 (2026-08-07 · E-08)
#   선례: config/blueprints/hwasan_gate.yml (산문) · hwasan_honjeon.yml (본전) — 같은 문법.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# ── 왜 도면이 넷을 낳는가 (사용자 확정 2026-08-06) ──────────────────────
#   「하나의 ㄷ자 지붕으로 만들기보다, 북측 2토막 + 동·서측 각 1토막, 총 4개 행각 모듈로
#     구성하는 편이 안전하다. 모두 같은 문법을 쓰되 길이와 방향만 인스턴스가 정한다.」
#   마인크래프트에서 낮은 맞배를 90° 로 꺾어 하나로 이으면 접합부가 쓸데없이 복잡해지고,
#   한 도면이 너무 많은 역할을 진다.
#   → `instances` 넷. 모듈 하나를 그리고 **자리와 방향만** 달리 준다.
#
# ── 위계 (사용자 확정) ───────────────────────────────────────────────────
#   산문이 정문급이면 행각은 **부속급**이다. 산문을 축소 복사하지 않는다.
#     공유 : 붉은 적주 · 회벽 · 짙은 격자창 · 어두운 지붕 · 석재 기단 · 적주 모듈
#     낮춤 : 단층 · 낮은 맞배 · 얕은 처마 · 기단 1단 · 공포 최소 · 현판 없음
#
# ── 안팎 (사용자 확정) ───────────────────────────────────────────────────
#   마당 쪽 : 붉은 기둥 사이로 **열린다** (회랑의 개방감 — 다 막으면 잃는다)
#   외곽 쪽 : 회벽 + 격자창으로 **닫힌다**
#   반복 단위 : 적주 | 회벽 | 격자창 | 회벽 |  (주기 4)
#   → 긴 벽이 한 덩어리로 보이지 않고, 산문의 문법을 공유하면서 복사본으로 읽히지 않는다.
#
# ── 자리 (패드 로컬 · 외원 32×32) — 실측이 정한 값 ──────────────────────
#   ★측면 계단 어귀가 **로컬 z16 · 반폭 1** 로 들어온다 (서 world(-18,148) · 동 world(14,148)).
#     처음 측면 모듈을 10 으로 뻗었더니 그 어귀를 막아 검수가 짖었다 → 어귀 위쪽 6칸.
#   ★의례축(outer_court_axis)은 로컬 11~21 이다 — 북측 둘이 그 밖에서 갈린다.
#   ★남측은 **닫지 않는다** — 산문에서 들어서자마자 둘러싸이면 깊이가 잘린다.
#     남서·남동 모서리는 정자의 자리이고, 행각과 2칸 이상 떨어진다.
#
#              ↑ 종문
#      [북서 2~7]        [북동 24~29]      z1~5
#           ─ 전이칸 z7 ─
#      [서 1~5]           [동 26~30]       z8~13
#           ─ 어귀 z16 ─  ─ 이격 ─
#        (정자)             (정자)          z20~28
#              ↓ 산문 · 열림

design_intent:
  role: "외원 마당의 경계를 잇고, 중앙 의례축과 별개의 측면 동선을 준다"
  rank: auxiliary
  style_module: hwasan_common
  roof_type: low_gable
  courtyard_side: open
  outer_side: plaster_lattice
  decisions:
    - "네 모듈로 나눈다 — ㄷ자 한 채로 합치면 낮은 맞배의 접합부가 복잡해진다."
    - "모서리에 열린 전이칸을 둔다 — 지붕 충돌 방지 · 산세를 보는 틈 · 등롱 자리 · 방향 전환."
    - "남측은 열어 둔다 — 정자가 남서·남동 모서리를 맡고 행각은 거기 닿지 않는다."
  non_goals:
    - "산문의 축소 복사를 만들지 않는다 (현판·공포·중층은 정문급의 것이다)."
    - "마당 쪽을 회벽으로 막지 않는다 — 회랑의 개방감을 잃는다."

meta:
  name: 화산파 외원 행각
  origin_pad: 2            # 외원 광장 (32×32)
  size: [6, 5]             # 한 모듈 — 길이 6 (bay 1.5) × 폭 5 (기둥 2 + 보행 3)
  axis_col: 3
  rank: auxiliary          # ★부속급 — 문이 아니다 (계약이 갈린다)
  south_row: 4             # 마당 쪽 (열린 면)

# ── 자리 넷 — 길이·문법은 같고 방향만 다르다 ────────────────────────────
#   rotate 0   : 길이가 동서로 (북측 둘)  · 마당 쪽 = 남
#   rotate 180 : 같은 폭을 뒤집어 마당 쪽이 북을 보게 (쓰지 않는다 — 기록만)
#   rotate 90  : 길이가 남북으로 · 마당 쪽이 동을 본다 (서측 모듈)
#   rotate 270 : 길이가 남북으로 · 마당 쪽이 서를 본다 (동측 모듈)
instances:
  - id: north_west
    at: [2, 1]
    rotate: 0
  - id: north_east
    at: [24, 1]
    rotate: 0
  - id: west
    at: [1, 8]
    rotate: 90
  - id: east
    at: [26, 8]
    rotate: 270

# ── 기둥 처방 (아래→위 · y0 = 패드 포장면 위 한 칸 = 기단 위) ────────────
#   ★기단은 캠퍼스가 포장면에 깐다 (지면 일). 도면은 그 위에 선다 —
#     BlueprintBuilder 는 포장면 **위**만 비우므로 기단이 살아남는다.
columns:
  ".": []                                                    # 보행 — 비운다
  "P": ["stripped_mangrove_log*4", "dark_oak_planks"]        # 적주 (안팎 공통) + 도리 한 켜
  "W": ["plaster*4", "dark_oak_planks"]                      # 외곽 회벽
  "L": ["dark_oak_planks", "dark_oak_trapdoor*2",
        "dark_oak_planks", "dark_oak_planks"]                # 외곽 격자창 — 위아래를 인방으로 끊는다
  "o": ["air*4", "dark_oak_planks"]                          # 마당 쪽 — 기둥 사이는 열린다

# ── 평면 (위=북 · 왼쪽=서 · 6칸 × 5줄) ──────────────────────────────────
#   row 0 : 외곽 면 (회벽·격자창으로 닫힌다)
#   row 1~3 : 보행 (비운다)
#   row 4 : 마당 면 (적주만 — 사이는 열린다)
#   col 0·4 : 적주 (주기 4)  ·  col 1·3 : 회벽  ·  col 2 : 격자창
plan: |
    PWLWPW
    ......
    ......
    ......
    PooooP

# ── 지붕 — 낮은 맞배 (부속급). 도면은 자리를, 코드가 결을 안다 ───────────
#   box = [col0, row0, col1, row1] · base_y = 벽 위 (기둥 4 + 도리 1)
roof:
  낮은맞배:
    type: low_gable
    box: [0, 0, 5, 4]
    base_y: 5
    eave: 1                # ★얕은 처마 — 정문급(2)보다 낮춘다
