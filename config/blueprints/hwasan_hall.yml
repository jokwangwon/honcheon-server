# ★★★ 화산파 04 강당·무기고 — 모임 유형(集會) 설계도 (2026-08-07)
#   선례: hwasan_gate.yml(정문급) · hwasan_outer_corridor.yml / hwasan_pavilion.yml(부속급)
#   계약: docs/design/hwasan/contract.md — 「새 구역을 세울 때의 순서」를 따랐다.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# ── 왜 새 유형인가 ──────────────────────────────────────────────────────
#   전수 조사(plasterhall_census.md)가 드러낸 것: `plasterHall` 하나가 **세 쓰임**을
#   다 맡고 있었다 — 모임(강당·장로회) · 거처(생활·암자) · 저장(창고).
#   다른 것은 **창 유무뿐**이라 위계도 표정도 없었다. 그래서 첫 일은 옛 코드 교체가 아니라
#   <b>유형을 가르는 것</b>이다. 이 도면이 그 첫 유형 — <b>모임</b>이다.
#
# ── 위계 ────────────────────────────────────────────────────────────────
#   모임 유형은 <b>지나 들어가는 집</b>이다. 그래서 `rank: principal` 의 계약을 지킨다 —
#   축선에 통행 개구가 있어야 한다 (문은 지나는 것이다). 행각·정자(auxiliary)와 다르고,
#   산문·본전과 같은 자를 쓰되 <b>단층</b>이라 위계는 크기와 지붕 규모가 낸다.
#
#     지붕 : sweep (귀솟음 팔작) — 핵심 전각 계열. 단층 · 처마 2
#     벽   : 붉은 적주 주기 4 + 회벽 + 격자창 (산문·행각과 같은 모듈)
#     정면 : 중앙 3칸 개구 — 사람이 걸어 들어간다
#
# ── 자리 (패드 실측) ────────────────────────────────────────────────────
#   강당 패드 40×30 은 <b>거의 전부 비어 있다</b> (동쪽 끝 x39·z13~17 만 계단 봉투).
#   몸체 17×11 + 처마 2 → 발자국 21×15 가 가운데 [11, 9] 에 여유 있게 든다.
#   ★그래서 <b>몸체를 줄이지 않았다</b> — 계약대로 축소는 마지막 선택이다.
#
#   ※장로회(12)도 같은 모임 유형이지만 <b>이 도면을 못 쓴다</b>: 패드 44×24 를 중앙 계단이
#     세로로 관통해 자유 띠가 z12~22(11칸)뿐이라, 깊이 15 짜리 발자국이 안 들어간다.
#     그 구역 회차에서 <b>얕은 변형</b>을 정한다 (실측은 census 에 남겼다).

design_intent:
  role: "무예와 학문을 함께 익히는 큰 집 — 문을 지나 들어간다"
  rank: principal
  usage: assembly
  style_module: hwasan_common
  roof_type: sweep
  decisions:
    - "중앙에 통행 개구를 둔다 — 모임 유형은 지나 들어가는 집이다."
    - "단층으로 둔다 — 중층은 본전의 것이다. 위계는 크기와 지붕이 낸다."
  non_goals:
    - "본전의 중층 누각을 흉내내지 않는다."
    - "회벽을 통짜로 두지 않는다 — 적주·격자창이 리듬을 끊는다."

meta:
  name: 화산파 강당
  origin_pad: 4
  size: [17, 11]
  axis_col: 8
  rank: principal
  usage: assembly
  south_row: 10
  foundation: 2            # ★D2 ⑤ 기단 2단 (principal) — 아래가 한 칸 넓다
  # ★D2 ④ 창호 — <b>모양(family)</b>과 <b>개수(density)</b>를 가른다
  window:
    family: W2             #   세로 + 가로 분할 (강당·행각의 결)
    density: medium
  bracket: medium          # ★D2 ⑥ 공포 — 적주 머리 위 2단 · 밖으로 1 · 좌우 1 (작게 시작)

instances:
  - id: gangdang
    at: [11, 9]
    rotate: 0

# ── 기둥 처방 (아래→위 · y0 = 패드 포장면 위 한 칸) ──────────────────────
columns:
  ".": []                                                    # 내부 — 비운다
  # ★D2 ② 기둥은 막대기가 아니라 <b>구조체</b>다 — 주초 · 기둥 · 창방 · 도리
  "P": ["smooth_stone", "stripped_mangrove_log*4",
        "dark_oak_planks", "dark_oak_planks"]                # 주초 + 적주 + 창방 + 도리
  "W": ["plaster*5", "dark_oak_planks"]                      # 회벽
  "L": ["dark_oak_planks", "lattice*3",
        "dark_oak_planks", "dark_oak_planks"]                # 격자창 — 결은 family 가 정한다
  "O": ["air*5", "dark_oak_planks"]                          # 중앙 통행 개구

# ── ★D2 ① 입면 깊이 — 한 면에 다 붙이지 않는다 (바깥이 +) ──────────────
#   적주가 나오고 격자창이 들어가야 입면에 <b>그림자</b>가 생긴다.
#   방향은 도면이 안 적는다 — 자리가 정한다 (한 처방이 네 벽에 다 쓰이므로).
depth:
  "P": 1
  "W": 0
  "L": -1
  "O": 0

# ── 평면 (17×11 · 위=북 · 아래(row 10)=남 정면) ─────────────────────────
#   변마다 적주│회벽│격자창│회벽 (주기 4) — 긴 벽이 한 덩어리로 안 보이게
#   row 10 가운데 셋이 문이다 (축선 col 8)
plan: |
    PWLWPWLWPWLWPWLWP
    L...............L
    W...............W
    P...............P
    L...............L
    W...............W
    P...............P
    L...............L
    W...............W
    P...............P
    PWLWPWLOOOLWPWLWP

# ── 지붕 — 귀솟음 팔작 (단층). 도면은 자리를, 코드가 결을 안다 ───────────
roof:
  팔작:
    box: [0, 0, 16, 10]
    base_y: 6
    eave: 2
    rafters: true          # ★D2 ③ 처마 밑 서까래 — 올려다보면 보인다 (근경 LOD)
