# ── 지붕 — 압출로 못 만드는 것. 코드가 몸체 상자를 읽어 얹는다 ──────────
#   ★문루 몸체를 15~45 로 한 호 넓혔다 (중앙 대문 모듈 확장 · 사용자 확정).
#     곁채 안쪽 끝은 14/46 으로 한 칸 물러 겹치지 않게 했다 — <b>바깥 끝(6·54)은 불변</b>.
roof:
  문루:
    box: [15, 12, 45, 18]              # col0,row0,col1,row1 — 몸체 발자국 (폭 31 x 깊이 7)
    base_y: 8                          # 처마가 시작하는 y (하층 벽 6 + 도리·공포 2)
    eave: 3                            # 내밈 (실측)
    upper: { wall: 5, eave: 3 }        # 상층 누각 — 벽 5, 그 위 큰 지붕
  곁채_서:
    box: [6, 13, 14, 17]
    base_y: 10                         # 성벽 5 + 곁채 벽 4 + 도리·단청 1
    eave: 2
  곁채_동:
    box: [46, 13, 54, 17]
    base_y: 10
    eave: 2

# ── 자리 — 판정·촬영·배선이 부르는 이름 [col, row] ─────────────────────
spots:
  문_앞: [30, 20]        # 계단을 다 올라 문루 앞에 선 자리 (1호의 시점)
  문_안: [30, 15]        # 통로 한가운데
  마당_중앙: [30, 6]     # 문 너머 첫 마당
