# ★★★ 화산파 산문 구역 — 설계도
#
# ★★이 도면이 좌표의 정본이다. 코드는 이것을 읽어 짓는다 — 코드의 수치가 도면과 다르면
#   **도면이 이긴다.** (선례: config/stages/geunal_bam.stage.yml — B-194 무대의 같은 계율)
#
# 목표: 화산파/ChatGPT Image 2026년 8월 2일 오후 07_09_24 (1).png (1호 · 산문 접근로)
#   ※그 그림은 <b>마인크래프트 스크린샷이 아니다</b> (되풀이 타일 0건 · 고유색 272,001).
#     그러므로 「레퍼런스가 쓴 블록」은 없다. 여기 재료는 <b>그림의 색·비율에 가장 가까운
#     바닐라 블록</b>이다. 자세히는 docs/design/hwasan/README.md §4.
#
# ── 도면 5종 뽑기 (손으로 그리지 않는다 — 정본에서 뽑는다) ──────────────
#   python3 tools/blueprint_draw.py hwasan_gate docs/design/hwasan/01_산문
#
# ── 문법 ────────────────────────────────────────────────────────────────
#   plan     : 평면 한 장 (1문자 = 1칸 · 위=북 · 왼쪽=서)   ← 무엇이 어디 있는가
#   columns  : 문자 -> 그 칸의 y 단면 (아래->위)             ← 그것이 위로 어떻게 서는가
#   roof     : 압출로 못 만드는 것 (지붕 물매·귀솟음·겹처마) ← 코드의 문법을 부른다
#   ★1문자 = 1칸이므로 **평면은 ASCII 만 쓴다** (한글은 폭이 둘로 보여 정렬이 깨진다).

design_intent:
  role: "화산파의 첫 위계를 드러내는 대문"
  axis: "남북 중앙축"
  decisions:
    - "중앙 통로는 내부 문보다 한 호 큰 7블록으로 한다 (5는 대문이 아니라 내부 출입문으로 읽힌다)."
    - "중앙 문루 적주 간격은 5블록, 측면 부속부는 기존 3블록을 유지한다 — 정문은 웅장하게, 부속부는 밀도 유지."
    - "전면 계단은 9블록이나 산문 후면에서 기존 7블록 축으로 수렴한다."
    - "연속 회벽을 피하고 적주·고창·가로보로 입면을 분절한다."
    - "★문짝 칸의 뒷줄은 어두운 판이다 — 회벽을 뒤에 두면 얇은 문살 사이로 흰 벽이 비쳐 «칸이 통째로 회벽»으로 읽힌다."
  non_goals:
    - "캠퍼스 전체 표고를 콘셉트 이미지 수치에 맞춰 확대하지 않는다 (Y46→Y148 · 102칸 유지)."
    - "산문 외곽 전체를 비례 확대하지 않는다 — 중앙 대문 모듈만 한 호 키운다."
    - "산문 패드 중심 좌표·좌우 부속 전각 외곽·석축 전체 폭을 건드리지 않는다."

# ── 실측 (1호 확대 · 2026-08-05) ────────────────────────────────────────
#   ★하층은 「벽에 창을 뚫은 것」이 아니라 「기둥 + 격자 문짝」의 반복이다.
#   · 적주 간격 3 (기둥1 + 문짝2) — ★중앙 문루만 5 로 올렸다 (사용자 확정 2026-08-06)
#   · 중앙 통행 개구 : 폭 5 → ★7 (사용자 확정) · 높이 6 (높이는 안 키운다 — 성문처럼 보인다)
#   · 하층 벽 높이 6 · 처마 내밈 3 · 단청 띠 2켜
#   · 성벽 : 높이 5 + 여장 1 · 두께 3 【D-30 낮고 두껍다】
#   · 곁채 : 성벽 **위에 올라탄다** — 성벽이 기단 노릇 【D-29】
#   ※ 【추정】 = 사진에 안 보여 대칭·건축 논리로 채운 값.
#
# ── ★★D-39 의 진범 (2026-08-06 · 실측으로 확정) ─────────────────────────
#   도면상 정면의 목재는 22.6% 인데 사진에서는 5.6% 로 읽혔다. 세 회차를 「문짝이 적다」로
#   오진했는데, 도면은 처음부터 문짝이 6켜 전부 서 있었다. 진범은 <b>두께</b>다:
#     trapdoor 3/16 · fence 2/16 → 도면 22.6% × 평균 두께 ≈ <b>화면 5.1%</b> (실측 5.6%)
#   그리고 그 얇은 살 사이로 비치는 것이 <b>뒷줄의 흰 회벽</b>이었다 — 그래서 「칸이 통째로
#   회벽」으로 읽혔다. 처방: 문짝 뒷줄(row 17)을 <b>어두운 판("N")</b>으로 바꾼다.
#   ★계율: <b>도면의 칸수는 화면의 면적이 아니다.</b> 얇은 블록은 칸을 차지하고도 안 보인다.
#
# ── ★회벽 = bone_block (3차 · 최종) ─────────────────────────────────────
#   1차 white_terracotta → 팩을 끄니 살구색 (팩 텍스처를 흰 벽으로 착각했다)
#   2차 smooth_quartz    → 살구는 없앴는데 온기까지 없앴다 (S4% vs 목표 S15%)
#   2.5 석영:사암 혼합   → 실기동에서 바둑판 (픽셀은 섞이지만 블록은 안 섞인다)
#   3차 bone_block 단일  → 바닐라 전량을 색상·채도로 훑어 고른 최근접 (H50 S9.4)
#   ★축(axis)은 기본 y — 눕히면 두 면에 마구리(물방울)가 드러난다.

meta:
  name: 화산파 산문 구역
  origin_pad: 1            # 이 도면이 앉는 패드 (TerraceForge 구역 번호 — 산문단)
  size: [60, 22]           # 폭(x) x 깊이(z) — 산문 패드와 같은 크기 (★불변)
  axis_col: 30             # 축선 열 (중앙 통로의 중심 · 월드 x = 패드 중심)
  south_row: 21            # 바깥(계단이 닿는) 가장자리 — 정면은 남(+z)

# ── 입면 lint — 「대형 백면이 다시 생기는가」를 탐지한다 ─────────────────
#   ★건축 정답이 아니다. 되돌아가는 것을 잡는 자다 (사용자 확정 2026-08-06).
#   ★★비율은 <b>도면 칸이 아니라 화면에 덮이는 면적</b>으로 잰다 — 위 「진범」 참조.
lint:
  facade:
    box: [15, 45]                      # 재는 구간 (문루 몸체 col 범위)
    max_contiguous_plaster_width: 5    # 가로로 이어진 회벽 칸수 상한
    max_contiguous_plaster_height: 3   # 세로로 이어진 회벽 켜수 상한
    min_opening_ratio: 0.08            # 개구(통로·창)가 이 아래면 벽덩어리다
    min_timber_facade_ratio: 0.18      # ★화면 면적 기준 — 얇은 블록은 두께로 깎인다

# ── 기둥 처방 — 1문자 = 그 칸의 y 단면 (아래->위 · y0 = 패드 포장면 위 한 칸) ──
#   "재료*n" = n켜 반복 · air 도 한 켜로 센다 (개구를 비우는 데 쓴다)
#
#   ★3단 위계 (사용자 확정): 하단 문짝 4켜 → 가로보 1켜 → 고창 1켜 → 도리 → 공포 띠
#     정면에서 「석축 → 대계단 → 적주 → 대문 → 가로보 → 고창 → 깊은 처마 → 지붕」으로 읽힌다.
columns:
  ".": []                                                    # 빈 칸 (패드 포장이 곧 바닥)
  "T": ["smooth_stone"]                                      # 앞 기단 — 계단이 닿는 자리
  "B": ["smooth_stone"]                                      # 문루 발치 기단
  "P": ["smooth_stone", "stripped_mangrove_log*6",
        "stripped_mangrove_log", "cut_sandstone"]             # 적주 — 기단부터 처마까지 이어진다
  "D": ["smooth_stone", "dark_oak_trapdoor*4",
        "stripped_mangrove_log",                              # ★적색 가로보 (중단의 시작)
        "dark_oak_trapdoor",                                  # ★격자 고창
        "stripped_mangrove_log", "cut_sandstone"]             # 도리 · 공포 띠
  "I": ["smooth_stone", "dark_oak_fence*4",
        "stripped_mangrove_log",                              # ★가로보 — 문살도 여기서 끊긴다
        "dark_oak_fence",                                     # ★고창의 세로 살
        "stripped_mangrove_log", "cut_sandstone"]
  "N": ["smooth_stone", "dark_oak_planks*6",
        "stripped_mangrove_log", "cut_sandstone"]             # ★★문짝 뒷줄 — 어두운 판 (D-39 처방)
  "W": ["smooth_stone", "plaster*6",
        "stripped_mangrove_log", "cut_sandstone"]             # 기둥 사이 좁은 회벽 띠
  "O": ["smooth_stone", "air*6",
        "stripped_mangrove_log", "cut_sandstone"]             # ★중앙 통행 개구 (걸어 지난다)
  "S": ["stone_bricks*5", "stone_brick_wall"]                 # 성벽 + 여장
  "s": ["stone_bricks*5", "stone_bricks"]                     # 성벽 속 (걷는 면 · 여장 없음)
  "K": ["stone_bricks*5", "plaster*4",
        "stripped_mangrove_log", "cut_sandstone"]             # ★곁채 벽 — 성벽 위에 올라탄다
  "k": ["stone_bricks*5", "stripped_mangrove_log*4",
        "stripped_mangrove_log", "cut_sandstone"]             # 곁채 적주

# ── 평면 (위=북 · 왼쪽=서 · 60칸 x 22줄) ────────────────────────────────
#   row 0~11 : 문 너머 첫 마당    row 12 : 문루 북면    row 13~16 : 문루 내부
#   row 17   : ★문짝 뒷줄 (어두운 판)    row 18 : ★문루 정면    row 19~21 : 앞 기단
#   col 30 : 축선 · 적주 15/18/21/26 · 개구 27~33 · 34/39/42/45 (간격 3·3·5·7·5·3·3)
