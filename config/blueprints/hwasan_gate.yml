# ★★★ 화산파 산문 구역 — 설계도 (사용자 확정 2026-08-05)
#   「레퍼런스를 토대로 **설계도를 그리고 그걸 바탕으로 건축**하는 형태를 취해봅시다」
#
# ★★이 도면이 좌표의 정본이다. 코드는 이것을 읽어 짓는다 — 코드의 수치가 도면과 다르면
#   **도면이 이긴다.** (선례: config/stages/geunal_bam.stage.yml — B-194 무대의 같은 계율)
#
# 목표: 화산파/ChatGPT Image 2026년 8월 2일 오후 07_09_24 (1).png (1호 · 산문 접근로)
#   그 한 장이 담은 범위 = 계단 상단 + 산문 문루 + 좌우 성벽·곁채 + 문 너머 첫 마당.
#
# ── 왜 stage.yml 을 그대로 안 쓰고 확장했는가 ───────────────────────────
#   stage.yml 은 **층별 ASCII**다 (y0/y1/… 각각 한 장). 30x22x10층이면 훌륭하다.
#   그런데 산문 구역은 60x22x20층이라 그대로 쓰면 **1,300줄을 손으로 정렬**해야 하고
#   오타가 반드시 난다. 한편 건축은 대개 **압출**이다 — 기둥은 위로 서고 벽은 위로 쌓인다.
#   그래서 둘로 갈랐다:
#     plan     : 평면 한 장 (1문자 = 1칸 · 위=북 · 왼쪽=서)   ← 무엇이 어디 있는가
#     columns  : 문자 -> 그 칸의 y 단면 (아래->위)             ← 그것이 위로 어떻게 서는가
#     roof     : 압출로 못 만드는 것 (지붕 물매·귀솟음·겹처마) ← 코드의 문법을 부른다
#   압출이 구조의 대부분을 덮고, 지붕만 코드에 맡긴다.
#   ★1문자 = 1칸이므로 **평면은 ASCII 만 쓴다** (한글은 폭이 둘로 보여 정렬이 깨진다).
#
# ── 실측 (1호 확대 · 2026-08-05) ────────────────────────────────────────
#   ★가장 큰 발견: **하층은 「벽에 창을 뚫은 것」이 아니라 「기둥 + 격자 문짝」의 반복**이다.
#     붉은 문틀에 격자 문짝이 칸마다 들어서고, 흰 회벽은 기둥 사이의 **좁은 띠**로만 남는다.
#     지금 코드는 반대로 짓고 있다 — 넓은 백벽에 창 구멍. **도면이 이긴다.**
#   · 중앙 통행 개구 : 폭 5 · 높이 6        · 적주 간격 3 (기둥 1 + 문짝 2)
#   · 하층 벽 높이   : 6                    · 처마 내밈 3 · 단청 띠 2켜
#   · 성벽 : 높이 5 + 여장 1 · 두께 3 【D-30 낮고 두껍다】
#   · 곁채 : 성벽 **위에 올라탄다** — 성벽이 기단 노릇 【D-29】
#   ※ 【추정】 = 사진에 안 보여 대칭·건축 논리로 채운 값 (몸체 깊이·북면).

meta:
  name: 화산파 산문 구역
  origin_pad: 1            # 이 도면이 앉는 패드 (TerraceForge 구역 번호 — 산문단)
  size: [60, 22]           # 폭(x) x 깊이(z) — 산문 패드와 같은 크기
  axis_col: 30             # 축선 열 (중앙 통로의 중심 · 월드 x = 패드 중심)
  south_row: 21            # 바깥(계단이 닿는) 가장자리 — 정면은 남(+z)

# ── 기둥 처방 — 1문자 = 그 칸의 y 단면 (아래->위 · y0 = 패드 포장면 위 한 칸) ──
#   "재료*n" = n켜 반복 · air 도 한 켜로 센다 (개구를 비우는 데 쓴다)
columns:
  ".": []                                                    # 빈 칸 (패드 포장이 곧 바닥)
  "T": ["smooth_stone"]                                      # 앞 기단 — 계단이 닿는 자리
  "B": ["smooth_stone"]                                       # 문루 발치 기단
  "P": ["smooth_stone", "stripped_mangrove_log*6",
        "stripped_mangrove_log", "cut_sandstone"]             # 적주 + 도리 + 단청 패널
  "D": ["smooth_stone", "dark_oak_trapdoor*2", "white_terracotta*2",
        "dark_oak_trapdoor*2", "stripped_mangrove_log", "cut_sandstone"]   # ★격자 문짝 칸
  "W": ["smooth_stone", "white_terracotta*6",
        "stripped_mangrove_log", "cut_sandstone"]             # 기둥 사이 좁은 회벽 띠
  "O": ["smooth_stone", "air*6",
        "stripped_mangrove_log", "cut_sandstone"]             # ★중앙 통행 개구 (걸어 지난다)
  "S": ["stone_bricks*5", "stone_brick_wall"]                 # 성벽 + 여장
  "s": ["stone_bricks*5", "stone_bricks"]                     # 성벽 속 (걷는 면 · 여장 없음)
  "K": ["stone_bricks*5", "white_terracotta*4",
        "stripped_mangrove_log", "cut_sandstone"]             # ★곁채 벽 — 성벽 위에 올라탄다
  "k": ["stone_bricks*5", "stripped_mangrove_log*4",
        "stripped_mangrove_log", "cut_sandstone"]             # 곁채 적주

# ── 평면 (위=북 · 왼쪽=서 · 60칸 x 22줄) ────────────────────────────────
#   row 0~11 : 문 너머 첫 마당      row 12~18 : 성벽·곁채·문루
#   row 19~21: 문루 앞 기단 (계단이 닿는다)      col 30 : 축선
plan: |
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    ............................................................
    SSSSSSSSSSSSSSSSPWWWWWWWWWWPOOOOOPWWWWWWWWWWPSSSSSSSSSSSSSSS
    sssssskKKKKKKKKkPWWWWWWWWWWPOOOOOPWWWWWWWWWWPkKKKKKKKKksssss
    sssssskKKKKKKKKkPWWWWWWWWWWPOOOOOPWWWWWWWWWWPkKKKKKKKKksssss
    sssssskKKKKKKKKkPWWWWWWWWWWPOOOOOPWWWWWWWWWWPkKKKKKKKKksssss
    sssssskKKKKKKKKkPWWWWWWWWWWPOOOOOPWWWWWWWWWWPkKKKKKKKKksssss
    sssssskKKKKKKKKkPWWWWWWWWWWPOOOOOPWWWWWWWWWWPkKKKKKKKKksssss
    SSSSSSSSSSSSSSSSPDDPDDPDDPWPOOOOOPWPDDPDDPDDPSSSSSSSSSSSSSSS
    ................BBBBBBBBBBBBBBBBBBBBBBBBBBBBB...............
    ..............TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT.............
    ..............TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT.............

# ── 지붕 — 압출로 못 만드는 것. 코드가 몸체 상자를 읽어 얹는다 ──────────
#   (귀솟음·겹처마·단청 띠는 이미 코드 문법이 있다 — 도면은 「어디에·몇 층」만 정한다)
roof:
  문루:
    box: [16, 12, 44, 18]              # col0,row0,col1,row1 — 몸체 발자국
    base_y: 8                          # 처마가 시작하는 y (하층 벽 6 + 도리·단청 2)
    eave: 3                            # 내밈 (실측)
    upper: { wall: 5, eave: 3 }        # 상층 누각 — 벽 5, 그 위 큰 지붕
  곁채_서:
    box: [6, 13, 15, 17]
    base_y: 10                         # 성벽 5 + 곁채 벽 4 + 도리·단청 1
    eave: 2
  곁채_동:
    box: [45, 13, 54, 17]
    base_y: 10
    eave: 2

# ── 자리 — 판정·촬영·배선이 부르는 이름 [col, row] ─────────────────────
spots:
  문_앞: [30, 20]        # 계단을 다 올라 문루 앞에 선 자리 (1호의 시점)
  문_안: [30, 15]        # 통로 한가운데
  마당_중앙: [30, 6]     # 문 너머 첫 마당
