# ★★★ 화산파 17 물자 창고 — 저장 유형(貯藏) 설계도 (2026-08-08)
#   계약: docs/design/hwasan/contract.md — 「새 구역을 세울 때의 순서」를 따랐다.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# ── 생활관과 지붕은 나누되 평면은 나누지 않는다 (사용자 확정 2026-08-08) ──
#   피해야 할 함정: 「생활용 low_gable 하나 만듦 → 창고도 비슷하니 그대로 사용
#   → 다시 하나가 여러 쓰임을 먹기 시작」.
#   그래서 두 계약을 <b>서로 어긋나게</b> 세운다:
#
#       생활 : 작은 문 여럿(연속 ≤2) · 창 많음 · 같은 칸 3연속 금지
#       저장 : <b>큰 문</b>(연속 ≥3)  · 창 적음(≤20%) · 벽 면적 큼(≥50%)
#
#   ★한 도면이 둘 다 통과하면 그건 계약이 아니라 <b>같은 말을 두 번 적은 것</b>이다.
#   지붕(`low_gable`)과 재료(적주·회벽·격자·조약 심층암)는 <b>공유한다</b> — 같은 문파다.
#
# ── 자리 (패드 실측) ────────────────────────────────────────────────────
#   창고 패드 34×22 는 거의 비었고 <b>서쪽 어귀만</b> 막혔다 (x0~2 · z9~13).
#   몸체 15×11 + 처마 1 = 발자국 17×13 이 [10, 5] 에 든다 (어귀에서 여섯 칸 물러난다).
#   ★몸체는 <b>옛 값 그대로</b>다 — 여백이 남는다고 키우지 않았고 줄이지도 않았다.

design_intent:
  role: "물자가 드나드는 집 — 큰 문 하나로 싣고 내린다"
  rank: auxiliary
  usage: storage
  style_module: hwasan_common
  roof_type: low_gable
  decisions:
    - "정면 가운데를 다섯 칸 크게 연다 — 물자 반출입이 이 집의 동선이다."
    - "창을 아낀다 — 저장은 벽이 많고 창이 적다."
  non_goals:
    - "생활관의 평면을 재사용하지 않는다 (지붕과 재료만 공유한다)."
    - "벽이 많다고 통짜 백면으로 두지 않는다 — 적주가 끊는다."

meta:
  name: 화산파 물자 창고
  origin_pad: 17
  size: [15, 11]
  axis_col: 7
  rank: auxiliary
  usage: storage
  south_row: 10

instances:
  - id: storehouse
    at: [10, 5]
    rotate: 0

# ── 기둥 처방 — 벽 5 + 도리 1 ───────────────────────────────────────────
columns:
  ".": []
  "P": ["stripped_mangrove_log*5", "dark_oak_planks"]        # 적주 (주기 7)
  "W": ["plaster*5", "dark_oak_planks"]                      # 회벽 — 이 집의 지배 재료
  "L": ["dark_oak_planks", "dark_oak_trapdoor*3",
        "dark_oak_planks", "dark_oak_planks"]                # 격자창 — 아껴 둔다
  "O": ["air*5", "dark_oak_planks"]                          # 큰 문

# ── 평면 (15×11 · row 10 = 남 정면) ─────────────────────────────────────
#   뒷면 : 적주 셋(col 0·7·14) 사이를 회벽이 채우고 격자창이 둘 (창 2/15 ≈ 13%)
#   정면 : 가운데 다섯 칸이 <b>큰 문</b> — 여기가 저장을 저장이게 한다
plan: |
    PWWLWWWPWWWLWWP
    W.............W
    W.............W
    L.............L
    W.............W
    W.............W
    W.............W
    L.............L
    W.............W
    W.............W
    PWWLWOOOOOWLWWP

# ── 지붕 — 낮은 맞배 (생활관과 공유하는 결) ─────────────────────────────
roof:
  낮은맞배:
    type: low_gable
    box: [0, 0, 14, 10]
    base_y: 6
    eave: 1
