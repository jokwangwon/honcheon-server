# ★★★ 화산파 본전 구역 — 설계도 (2026-08-05)
#   선례: config/blueprints/hwasan_gate.yml (산문 구역) — 같은 문법·같은 계율.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# 목표: 화산파/…07_09_26 (7).png (7호 · 캠퍼스 전경 — 본전이 화면 중앙)
#       보조: …07_09_25 (4).png (4호 · 본전+부속 근경)
#
# ── 자 (scale) ─────────────────────────────────────────────────────────
#   7호에서 **중앙 대계단의 도보 폭이 105px** 이다. 사용자 확정 실측이 **도보 7칸**이므로
#   **1블록 = 15px** 이고, 석전 벽의 블록 이음선 주기(≈14px)와도 맞는다 → **14~15px/블록**.
#   ★이 자를 먼저 못 박은 까닭: 슬라이스 8 에서 자 하나가 틀려 전 캠퍼스가 2.2배로 부푼 적이
#   있다. 자를 사용자 확정값(계단 7)으로 검산하고 시작한다.
#
# ── 실측 (7호 · 1블록 = 14px) ──────────────────────────────────────────
#   · 하층 몸체 폭   : x448~975 = **37.6 → 38블록**
#   · 상층 몸체 폭   : x564~920 = **25.4 → 25블록**  (하층의 0.66배)
#   · 하층 벽 높이   : y447~501 = **3.9 → 4블록**  ※도면은 5 — 아래 【절충】
#   · 하층 지붕 두께 : y375~416 = **3블록**
#   · 상층 벽 높이   : y313~370 = **4블록**
#   · 지붕 물매·귀솟음·단청 띠 : 산문과 같은 코드 문법 (sweepRoof)
#
# ── ★★정정 (2026-08-05 · D-34 재실측) — 앞 회차 결론이 틀렸다 ───────────
#   앞 회차는 「산문과 본전은 벽의 문법이 **반대**다 (본전 하층은 넓은 회벽이 지배)」로 적고
#   기둥을 **4칸 주기**(col 4·8·12·16)로, 칸을 `W D W`(회벽 2 : 문 1)로 박았다. **둘 다 틀렸다.**
#   7호를 다시 재서 나온 것:
#     · **기둥 주기 = 3칸** (기둥 1 + 칸 2). 붉은 기둥 x509-518·552-562·599-608·646-653,
#       틈 33/36/37px, 주기 ≈45px = 3블록 (1블록 14px). **산문과 같다.**
#     · **회벽 비율** : 하층 화소 분류로 붉은색 46.8% / 회벽 9.4% / 나무 15.5% / 어둠 23.2%.
#       회벽은 소수다 — 앞 회차의 「회벽이 2, 문이 1」과 정반대다.
#     · **★빈 회벽 면이 없다** : 목표의 모든 칸은 회벽 판 **안에 격자창이 박혀 있다.**
#       그래서 D-34(「회벽이 넓다」)의 진범은 회벽의 **양**보다 그 **통짜 5켜 빈 판**이었다.
#       처방 = 주기를 3으로 죄고 칸을 `W D`(회벽 한 켜열 + 격자 한 켜열)로 짝지어
#       **회벽 두 켜열이 결코 붙지 않게** 한다 (붙으면 빈 판으로 읽힌다).
#     · **상층** : 기둥 사이가 전부 격자창이고 회벽이 없다 (실측 붉은 33.8% / 회벽 8.1%).
#       이것만은 앞 회차가 맞았다 — roof.upper 의 `infill: lattice` 를 그대로 둔다.
#   ★교훈: 「두 건물의 문법이 반대」는 눈대중이었다. **실측이 정본이다.**
#
# ── ★★★정정 둘 (2026-08-05 · B-196) — 앞의 판정 전부가 **오염된 화면**이었다 ────
#   위 「회벽 9.4%」·「상층 회벽 8.1%」 는 목표 사진 쪽 수치라 살아 있다. 그러나 **우리 쪽을
#   재던 화면**은 도면이 아니었다. 실측으로 잡은 진범 둘:
#     ① **자리에 딴 건물이 남아 있었다.** 캠퍼스시험이 같은 패드(구역 9)에 통짜 본전을 세우고,
#        도면시험은 평면이 이름 부른 칸만 찍었다 — 빈 칸(`.`)은 아무것도 안 썼다. 그래서
#        도면 껍데기 **안에** 앞 건물이 그대로 서 있었다 (실측: x-12,y58,z52~46 = spruce_planks,
#        상층 뒤 = cobbled_deepslate — 도면에 없는 재료). 자리를 비우게 하자 **9,326켜**가 나왔다.
#     ② **격자창이 창이 아니라 구멍이었다.** 트랩도어를 setType 으로 놓으면 바닥에 눕는다
#        (half=bottom·open=false 확인). 칸이 뚫려 그 너머 앞 건물·바깥 포장이 비쳤고,
#        그 밝은 면이 「회벽이 넓다」로 읽혔다. 이제 세워서(open=true) 살창이 된다.
#   ★즉 D-34/D-36 을 세 회차 동안 **벽의 문법 문제로 오진**했다. 벽은 문제의 자리가 아니었다.
#
# ── 【실측 비율】 둘을 고친 뒤 같은 자로 다시 잰 것 (벽 재료만 100%) ─────
#   구분        붉은    회벽    나무        (목표 = 7호 · 벽 켜만 딴 정밀 상자)
#   목표 하층   64.0    22.8    13.1
#   우리 하층   52.5    41.4     6.1   → 회벽이 목표의 1.8배. **D-34 는 여기서 비로소 참이다.**
#   목표 상층   61.7    25.9    12.5   ※이 25.9 는 회벽 판이 아니라 **맨 위 공포(화반) 띠**다
#                                       (정밀 크롭 육안 확인 — 붉은 기둥 + 어두운 살창이 끝까지).
#   우리 상층   53.3     1.4    45.2   → 구조가 목표와 같다. **D-38 은 닫힌다** (infill: lattice 가 옳다).
#   ★처방: 한 주기(3칸 × 벽 5켜 = 15칸)가 붉은 5 : 회벽 5 : 나무 5 로 **똑같이 셋**이었다.
#     칸의 위·아래를 붉은 **인방**으로 끊어 회벽 5켜 → 3켜, 격자 5켜 → 3켜로 줄인다.
#     ※주기 3 은 건드리지 않는다 (7호 실측으로 확정된 값 · 위 정정 참조).
#   ★★그런데 **이 비율을 눈의 문턱으로 삼지는 못한다.** 문턱을 「붉은 ≥50% · 회벽 ≤35%」로
#     두고 변이시험을 돌리니 **고치기 전 상태가 붉은 60%·회벽 24% 로 통과했다.**
#     칸을 세는 자와 화소를 재는 자가 다르기 때문이다 — 밝은 회벽은 실제보다 넓게,
#     좁은 붉은 기둥은 좁게 읽힌다. 문턱을 조여 통과시키면 그건 **오늘의 처방을 지키는 눈**이지
#     실측을 지키는 눈이 아니다. 그래서 눈은 비율이 아니라 **「칸마다 위·아래가 인방으로
#     끊긴다」** 는 구조 규칙만 지킨다 (통짜 5켜였던 옛 상태에 실제로 짖는 것을 확인).
#     비율 자체는 **실물 사진으로** 판정한다 — 그것이 실측의 자다.
#
# ── 【절충】 하층 벽 4 → 5 ─────────────────────────────────────────────
#   실측은 3.9(≈4)인데 도면은 5로 적었다. 까닭: 중앙 문이 **걸어서 지나는 개구**여야 하고
#   (Blueprint.validate 의 「문은 지나는 것이다」 계약 = 빈 켜 ≥5), 4켜로는 그 계약을 못 넘는다.
#   목표 사진의 중앙 칸도 좌우보다 **높은 대문**이라 5가 그 결과 어긋나지 않는다.
#   ※한 칸 늘린 것이므로 지붕 base_y 도 그만큼 올라간다 (5+2=7).
#
# ── 【추정】 (사진에 안 보여 대칭·건축 논리로 채운 것) ───────────────────
#   · 몸체 깊이 14 — 정면만 보이므로 폭:깊이 ≈ 31:14 (2.2:1) 로 잡았다. 한옥 전각의 통상 비.
#   · 북면(뒷벽) — 정면과 같은 리듬이되 중앙 개구 없이 회벽 (뒤로 나가는 문이 안 보인다).
#   · 몸체 폭 31 — ★목표는 38 인데 **본전 패드가 38×32 라 그대로 넣으면 여백이 0** 이다.
#     비(하층:상층 = 1:0.66)를 지키며 31:20 으로 줄였다. 패드를 넓히는 것은 통단 재설계라
#     이번 회차 밖 — **차이 목록에 남긴다** (본전 폭 38 vs 우리 31).

meta:
  name: 화산파 본전 구역
  origin_pad: 9              # 본전단 (TerraceForge 구역 9 — 38×32)
  size: [38, 32]
  axis_col: 19               # 축선 (중앙 대문의 중심)
  south_row: 31              # 바깥(앞마당) 가장자리 — 정면은 남(+z)

# ── 기둥 처방 — 1문자 = 그 칸의 y 단면 (아래→위 · y0 = 패드 포장면 위 한 칸) ──
columns:
  ".": []                                                    # 빈 칸 (패드 포장이 곧 바닥)
  "M": ["smooth_stone"]                                      # 월대 — 본전을 받치는 기단면
  "P": ["smooth_stone", "stripped_mangrove_log*5",
        "stripped_mangrove_log", "cut_sandstone"]            # 적주 + 도리 + 단청 패널
  # ★★인방(引枋) — 칸의 위·아래를 붉은 켜로 끊는다 (2026-08-05 · B-196 셋째 교정).
  #   까닭은 아래 【실측 비율】 절. 회벽·격자 둘 다 5켜 통짜였고, 그래서 한 주기(3칸)의
  #   재료가 붉은 5 : 회벽 5 : 나무 5 로 **똑같이 셋**이었다. 목표는 붉은색이 3분의 2다.
  "W": ["smooth_stone", "stripped_mangrove_log", "plaster*3", "stripped_mangrove_log",
        "stripped_mangrove_log", "cut_sandstone"]            # 회벽 — 인방 사이 3켜만
  "D": ["smooth_stone", "stripped_mangrove_log", "dark_oak_trapdoor*3",
        "stripped_mangrove_log",
        "stripped_mangrove_log", "cut_sandstone"]            # 격자창 — 인방이 문틀을 이룬다
  "O": ["smooth_stone", "air*5",
        "stripped_mangrove_log", "cut_sandstone"]            # ★중앙 대문 (걸어 지난다)

# ── 평면 (위=북 · 왼쪽=서 · 38칸 × 32줄) ───────────────────────────────
#   row  0~ 5 : 뒤 마당            row  6~19 : 본전 몸체 (깊이 14)
#   row 20~24 : 월대 (앞으로 5칸)  row 25~31 : 앞 마당
#   col  4~34 : 몸체 (폭 31)       col 19    : 축선
#   ★적주(P)는 **3칸 주기** — col 4·7·10·13·16 | 대문 17~21 | 22·25·28·31·34 (D-34 실측).
#     칸(기둥 사이 2켜열)은 언제나 `W D` 한 짝이고 축선 기준으로 뒤집힌다(좌 WD · 우 DW) —
#     그래서 **회벽 두 켜열이 이웃하는 자리가 한 곳도 없다.** 이것이 빈 회벽 판을 없앤다.
#     뒷벽(row 6)은 대문이 없으므로 축선에 기둥을 세워 주기 3을 잇는다 (16·19·22).
