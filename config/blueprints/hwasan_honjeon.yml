# ── 지붕 — 압출로 못 만드는 것. 코드가 몸체 상자를 읽어 얹는다 ──────────
roof:
  본전:
    box: [4, 6, 34, 19]              # 몸체 발자국 (폭 31 · 깊이 14)
    # ★★D-36 진범 — 오프바이원. 앞 회차는 「하층 벽 5 + 도리·단청 2 = 7」로 셈했는데
    #   기둥 처방의 맨 아래 **기단 켜(smooth_stone)를 빼먹었다.** 실제 켜열은
    #   smooth_stone(y0) + 5(y1~5) + 도리(y6) + 단청(y7) = **8켜**다.
    #   base_y 7 이면 처마 첫 켜가 **단청 띠 y7 을 그대로 덮어** 앞에서 보면 벽이 사라진다.
    #   목표(7호)는 처마 밑으로 **붉은 기둥머리와 단청 띠가 한 줄 훤히 드러난다.** → 8.
    # ★★D2 전파로 두 켜가 늘었다 (2026-08-09): 기단 한 켜(⑤ 월대 위의 몸체단) +
    #   창방 한 켜(② 기둥이 구조체가 된다). 8 → <b>10</b>. 위 D-36 의 셈법은 그대로다 —
    #   「기둥 처방의 켜 수를 그대로 센다」. 벽 높이(5)는 건드리지 않았다.
    base_y: 11
    # ★내밈 — 7호 상층 실측(지붕 28.1칸 : 벽 25.1칸)으로 **한쪽 1.5칸**. 귀솟음이 한 켜를
    #   더 들어 올리므로 2 로 잡는다. 3 은 45° 시선에서 벽면을 통째로 가린다.
    #   ※이 값은 이번 회차 전까지 **읽히지 않는 죽은 값**이었다 (sweepRoof 가 over=3 을 박아 둠).
    eave: 2
    # ★★★REF-1 (사용자 확정 2026-08-09) — mainhall_ref.png 가 새 시각 정본.
    #   목표는 <b>가로로 넓고 장중한 실루엣</b>이라 좌우와 앞뒤의 내밈이 <b>다르다</b>.
    #     층간 지붕 = 몸체 31×14 + 좌우 3 · 앞뒤 2 = <b>37×18</b>
    #     대지붕    = 상층 25×10 + 좌우 4 · 앞뒤 2 = <b>33×14</b>
    #   ★이 profile 에서는 <b>말없는 축소가 없다</b>. 옛 sweep 은 패드에 안 들어가면 내밈을
    #     스스로 줄였다 — 정본에 4 라 적고 실물이 2 면 그것이 「신고표가 실물보다 넓다」이다.
    #     안 들어가면 조용히 작아지는 대신 <b>검수가 실현 상자를 재서 짖는다</b>.
    profile: main_hall_grand
    # ★★★REF-2A (2026-08-09) — 지붕 <b>외피</b> 재료 계열. 형태는 한 칸도 안 바뀐다.
    #   조약 심층암은 절벽·석축과 질감 언어가 같아 화면에서 <b>지붕이 산과 한 덩어리</b>로 뭉친다.
    #   기와 계열로 가면 재질의 역할이 갈린다: 절벽=자연석 · 석축=가공 석재 · 지붕=<b>기와</b>.
    #   ※속(카메라가 못 보는 채움)은 종전 재료 그대로다. 마루(석재 벽돌·안산암)도 그대로.
    material_family: deepslate_tiles
    eave_x: 3
    eave_z: 2
    rafters: true                    # ★D2 ③ 처마 밑 서까래 — 월대에 서면 올려다보인다
    upper:
      wall: 4                        # 상층 벽 (실측 4)
      eave: 2
      eave_x: 4                      # ★대지붕이 상층 몸체보다 좌우로 크게 뻗는다
      eave_z: 2
      # ★★★REF-1c-B 용마루 (사용자 확정 2026-08-09) — 대지붕 33 폭에 <b>17칸</b>.
      #   가운데 15칸은 평평한 마루선(stone_brick_slab), <b>양 끝 한 칸만</b> 한 단 솟는다.
      #   ★층간 지붕에는 <b>안 만든다</b> — 가운데를 상층 몸체가 차지해 중앙 용마루를 놓을
      #     구조가 아니다 (사용자). 층간은 귀솟음만 유지한다.
      ridge: 17
      infill: lattice                # ★상층은 창이 띠를 이룬다 — 회벽이 아니다 (실측)
      # ★★상층이 물러나는 칸 — 코드에 2 로 박혀 있던 값을 도면이 되찾았다.
      #   실측 하층:상층 = 38:25 = 0.66 인데 물러남 2 면 31→27 (0.87) 로 상층이 하층만큼
      #   넓어져 **다른 건물**이 선다. 5 면 31→21 (0.68) 로 실측 안에 든다.
      #   z 는 정면 사진으로 못 재 【추정】 — 폭의 비를 깊이에도 적용해 14→10 (0.71).
      # ★★REF-1 — 5 → <b>3</b>. 상층 폭 21 → <b>25</b> (25/31 = 0.806).
      #   ★7호 실측에서 못박았던 0.66 은 <b>superseded</b> 다 — 틀려서가 아니라
      #     <b>시각 정본이 7호 → mainhall_ref.png 로 바뀌었기</b> 때문이다.
      #       구 목표 0.66 (근거: 목표 7호 이미지)  →  신 목표 0.806 (근거: mainhall_ref.png)
      #     레퍼런스 원본 비는 37/45 = 0.822 이고, 패드 38 안에서 그 느낌을 가장 잘 보존하는
      #     정수가 25 다 (26 은 홀수 중심축·좌우 대칭이 깨진다 — 사용자).
      inset: [3, 2]

# ── 자리 — 판정·촬영·배선이 부르는 이름 [col, row] ─────────────────────
spots:
  대문_앞: [19, 21]        # 월대 위, 대문을 올려다보는 자리
  대문_안: [19, 15]        # 본전 안 한가운데
  월대_남단: [19, 24]      # 월대가 앞마당에 닿는 자리

# ── ★★★REF-1c-B 마감 조각 — 중앙 위계 (사용자 확정 2026-08-09) ─────────────
#   평면·기둥 처방으로는 못 그리는 <b>국소 장식</b>이다. 압출이 아니라 「한 자리에 몇 칸」이라
#   도면이 좌표를 직접 쥔다. y 는 oy 기준 (oy = 패드 포장면 + foundation).
#
#   ★<b>현판 자리</b>는 자리만 만든다 — 글자·아이템·현판 블록은 D3 다 (사용자).
#   ★<b>중앙 관(crown)</b>은 <b>독립 지붕이 아니다</b>. 중앙 처마선을 한 번 위로 튀게 하는
#     문두 장식이고, <b>중앙 칸 5 안에서만</b> 있어야 한다. 높이 2 를 안 넘는다.
#     ★용마루와 경쟁하면 안 된다 — REF 카메라에서 관이 용마루보다 먼저 보이면 과한 것이다.
