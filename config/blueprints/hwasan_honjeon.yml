# ── 지붕 — 압출로 못 만드는 것. 코드가 몸체 상자를 읽어 얹는다 ──────────
roof:
  본전:
    box: [4, 6, 34, 19]              # 몸체 발자국 (폭 31 · 깊이 14)
    base_y: 7                        # 하층 벽 5 + 도리·단청 2
    eave: 3                          # 내밈 (실측 3~5 중 패드가 허락하는 3)
    upper:
      wall: 4                        # 상층 벽 (실측 4)
      eave: 3
      infill: lattice                # ★상층은 창이 띠를 이룬다 — 회벽이 아니다 (실측)
      # ★★상층이 물러나는 칸 — 코드에 2 로 박혀 있던 값을 도면이 되찾았다.
      #   실측 하층:상층 = 38:25 = 0.66 인데 물러남 2 면 31→27 (0.87) 로 상층이 하층만큼
      #   넓어져 **다른 건물**이 선다. 5 면 31→21 (0.68) 로 실측 안에 든다.
      #   z 는 정면 사진으로 못 재 【추정】 — 폭의 비를 깊이에도 적용해 14→10 (0.71).
      inset: [5, 2]

# ── 자리 — 판정·촬영·배선이 부르는 이름 [col, row] ─────────────────────
spots:
  대문_앞: [19, 21]        # 월대 위, 대문을 올려다보는 자리
  대문_안: [19, 15]        # 본전 안 한가운데
  월대_남단: [19, 24]      # 월대가 앞마당에 닿는 자리
