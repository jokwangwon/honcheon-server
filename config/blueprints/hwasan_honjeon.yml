# ★★★ 화산파 본전 구역 — 설계도 (2026-08-05)
#   선례: config/blueprints/hwasan_gate.yml (산문 구역) — 같은 문법·같은 계율.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# 목표: 화산파/…07_09_26 (7).png (7호 · 캠퍼스 전경 — 본전이 화면 중앙)
#       보조: …07_09_25 (4).png (4호 · 본전+부속 근경)
#
# ── 자 (scale) ─────────────────────────────────────────────────────────
#   7호에서 **중앙 대계단의 도보 폭이 105px** 이다. 사용자 확정 실측이 **도보 7칸**이므로
#   **1블록 = 15px** 이고, 석전 벽의 블록 이음선 주기(≈14px)와도 맞는다 → **14~15px/블록**.
#   ★이 자를 먼저 못 박은 까닭: 슬라이스 8 에서 자 하나가 틀려 전 캠퍼스가 2.2배로 부푼 적이
#   있다. 자를 사용자 확정값(계단 7)으로 검산하고 시작한다.
#
# ── 실측 (7호 · 1블록 = 14px) ──────────────────────────────────────────
#   · 하층 몸체 폭   : x448~975 = **37.6 → 38블록**
#   · 상층 몸체 폭   : x564~920 = **25.4 → 25블록**  (하층의 0.66배)
#   · 하층 벽 높이   : y447~501 = **3.9 → 4블록**  ※도면은 5 — 아래 【절충】
#   · 하층 지붕 두께 : y375~416 = **3블록**
#   · 상층 벽 높이   : y313~370 = **4블록**
#   · 지붕 물매·귀솟음·단청 띠 : 산문과 같은 코드 문법 (sweepRoof)
#
# ── ★★정정 (2026-08-05 · D-34 재실측) — 앞 회차 결론이 틀렸다 ───────────
#   앞 회차는 「산문과 본전은 벽의 문법이 **반대**다 (본전 하층은 넓은 회벽이 지배)」로 적고
#   기둥을 **4칸 주기**(col 4·8·12·16)로, 칸을 `W D W`(회벽 2 : 문 1)로 박았다. **둘 다 틀렸다.**
#   7호를 다시 재서 나온 것:
#     · **기둥 주기 = 3칸** (기둥 1 + 칸 2). 붉은 기둥 x509-518·552-562·599-608·646-653,
#       틈 33/36/37px, 주기 ≈45px = 3블록 (1블록 14px). **산문과 같다.**
#     · **회벽 비율** : 하층 화소 분류로 붉은색 46.8% / 회벽 9.4% / 나무 15.5% / 어둠 23.2%.
#       회벽은 소수다 — 앞 회차의 「회벽이 2, 문이 1」과 정반대다.
#     · **★빈 회벽 면이 없다** : 목표의 모든 칸은 회벽 판 **안에 격자창이 박혀 있다.**
#       그래서 D-34(「회벽이 넓다」)의 진범은 회벽의 **양**보다 그 **통짜 5켜 빈 판**이었다.
#       처방 = 주기를 3으로 죄고 칸을 `W D`(회벽 한 켜열 + 격자 한 켜열)로 짝지어
#       **회벽 두 켜열이 결코 붙지 않게** 한다 (붙으면 빈 판으로 읽힌다).
#     · **상층** : 기둥 사이가 전부 격자창이고 회벽이 없다 (실측 붉은 33.8% / 회벽 8.1%).
#       이것만은 앞 회차가 맞았다 — roof.upper 의 `infill: lattice` 를 그대로 둔다.
#   ★교훈: 「두 건물의 문법이 반대」는 눈대중이었다. **실측이 정본이다.**
#
# ── ★★★정정 둘 (2026-08-05 · B-196) — 앞의 판정 전부가 **오염된 화면**이었다 ────
#   위 「회벽 9.4%」·「상층 회벽 8.1%」 는 목표 사진 쪽 수치라 살아 있다. 그러나 **우리 쪽을
#   재던 화면**은 도면이 아니었다. 실측으로 잡은 진범 둘:
#     ① **자리에 딴 건물이 남아 있었다.** 캠퍼스시험이 같은 패드(구역 9)에 통짜 본전을 세우고,
#        도면시험은 평면이 이름 부른 칸만 찍었다 — 빈 칸(`.`)은 아무것도 안 썼다. 그래서
#        도면 껍데기 **안에** 앞 건물이 그대로 서 있었다 (실측: x-12,y58,z52~46 = spruce_planks,
#        상층 뒤 = cobbled_deepslate — 도면에 없는 재료). 자리를 비우게 하자 **9,326켜**가 나왔다.
#     ② **격자창이 창이 아니라 구멍이었다.** 트랩도어를 setType 으로 놓으면 바닥에 눕는다
#        (half=bottom·open=false 확인). 칸이 뚫려 그 너머 앞 건물·바깥 포장이 비쳤고,
#        그 밝은 면이 「회벽이 넓다」로 읽혔다. 이제 세워서(open=true) 살창이 된다.
#   ★즉 D-34/D-36 을 세 회차 동안 **벽의 문법 문제로 오진**했다. 벽은 문제의 자리가 아니었다.
#
# ── 【실측 비율】 둘을 고친 뒤 같은 자로 다시 잰 것 (벽 재료만 100%) ─────
#   구분        붉은    회벽    나무        (목표 = 7호 · 벽 켜만 딴 정밀 상자)
#   목표 하층   64.0    22.8    13.1
#   우리 하층   52.5    41.4     6.1   → 회벽이 목표의 1.8배. **D-34 는 여기서 비로소 참이다.**
#   목표 상층   61.7    25.9    12.5   ※이 25.9 는 회벽 판이 아니라 **맨 위 공포(화반) 띠**다
#                                       (정밀 크롭 육안 확인 — 붉은 기둥 + 어두운 살창이 끝까지).
#   우리 상층   53.3     1.4    45.2   → 구조가 목표와 같다. **D-38 은 닫힌다** (infill: lattice 가 옳다).
#   ★처방: 한 주기(3칸 × 벽 5켜 = 15칸)가 붉은 5 : 회벽 5 : 나무 5 로 **똑같이 셋**이었다.
#     칸의 위·아래를 붉은 **인방**으로 끊어 회벽 5켜 → 3켜, 격자 5켜 → 3켜로 줄인다.
#     ※주기 3 은 건드리지 않는다 (7호 실측으로 확정된 값 · 위 정정 참조).
#   ★★그런데 **이 비율을 눈의 문턱으로 삼지는 못한다.** 문턱을 「붉은 ≥50% · 회벽 ≤35%」로
#     두고 변이시험을 돌리니 **고치기 전 상태가 붉은 60%·회벽 24% 로 통과했다.**
#     칸을 세는 자와 화소를 재는 자가 다르기 때문이다 — 밝은 회벽은 실제보다 넓게,
#     좁은 붉은 기둥은 좁게 읽힌다. 문턱을 조여 통과시키면 그건 **오늘의 처방을 지키는 눈**이지
#     실측을 지키는 눈이 아니다. 그래서 눈은 비율이 아니라 **「칸마다 위·아래가 인방으로
#     끊긴다」** 는 구조 규칙만 지킨다 (통짜 5켜였던 옛 상태에 실제로 짖는 것을 확인).
#     비율 자체는 **실물 사진으로** 판정한다 — 그것이 실측의 자다.
#
# ── 【절충】 하층 벽 4 → 5 ─────────────────────────────────────────────
#   실측은 3.9(≈4)인데 도면은 5로 적었다. 까닭: 중앙 문이 **걸어서 지나는 개구**여야 하고
#   (Blueprint.validate 의 「문은 지나는 것이다」 계약 = 빈 켜 ≥5), 4켜로는 그 계약을 못 넘는다.
#   목표 사진의 중앙 칸도 좌우보다 **높은 대문**이라 5가 그 결과 어긋나지 않는다.
#   ※한 칸 늘린 것이므로 지붕 base_y 도 그만큼 올라간다 (5+2=7).
#
# ── 【추정】 (사진에 안 보여 대칭·건축 논리로 채운 것) ───────────────────
#   · 몸체 깊이 14 — 정면만 보이므로 폭:깊이 ≈ 31:14 (2.2:1) 로 잡았다. 한옥 전각의 통상 비.
#   · 북면(뒷벽) — 정면과 같은 리듬이되 중앙 개구 없이 회벽 (뒤로 나가는 문이 안 보인다).
#   · 몸체 폭 31 — ★목표는 38 인데 **본전 패드가 38×32 라 그대로 넣으면 여백이 0** 이다.
#     비(하층:상층 = 1:0.66)를 지키며 31:20 으로 줄였다. 패드를 넓히는 것은 통단 재설계라
#     이번 회차 밖 — **차이 목록에 남긴다** (본전 폭 38 vs 우리 31).

meta:
  name: 화산파 본전 구역
  origin_pad: 9              # 본전단 (TerraceForge 구역 9 — 38×32)
  size: [38, 32]
  axis_col: 19               # 축선 (중앙 대문의 중심)
  south_row: 31              # 바깥(앞마당) 가장자리 — 정면은 남(+z)
  rank: principal
  usage: main_hall
  # ★★D2 전파 (2026-08-09) — 사용자 동결 시 못박은 것: 「<b>D2 값을 복사하는 게 아니라
  #   D2 규칙을 적용</b>」. 강당(17×11 · assembly)의 숫자를 그대로 옮기면 본전이 큰 강당이 된다.
  #   본전은 <b>ceremonial 최상위 · 중층 · 월대</b>이므로 같은 여섯 항목이 <b>다른 값</b>으로 나온다.
  #     ① 깊이 profile full  (강당과 같다 — 이건 문법이라 위계로 안 갈린다)
  #     ② 기둥   주초·적주·<b>창방</b>·도리·단청  (강당은 단청 띠가 없다)
  #     ⑤ 기단   <b>3단 가시 기단</b> (REF-1) — 강당의 「2단」보다 한 단 위. ceremonial 계약이다.
  #             meta.foundation 을 올리는 게 아니라 <b>도면 안에서</b> M(1켜)·N(2켜)·몸체(3켜)로
  #             진다. foundation 을 올리면 월대까지 통째로 떠서 앞마당에서 올라설 단이 사라진다.
  #     ④ 창호   W3 · high  (강당 W2 · medium 보다 한 단 위 — 중앙 강조 한 켜가 들어간다)
  #     ⑥ 공포   elaborate  (강당 medium 보다 한 단 위 — 단 수만 오른다. 내밈은 처마가 막는다)
  foundation: 1              # ★올리지 않는다 — 기단 위계는 월대·몸체 두 단으로 도면 안에서 진다
  facade_depth_profile: full # ★D2 ① 적주 +1 · 회벽 0 · 격자 −1
  window:
    family: W3               # ★D2 ④ 세로+가로 + <b>중앙 강조 한 켜</b> (예식급)
    density: high
  bracket: elaborate         # ★D2 ⑥ 3단 — 강당 2단보다 <b>높다</b>. 더 나오지는 않는다

# ── 기둥 처방 — 1문자 = 그 칸의 y 단면 (아래→위 · y0 = 패드 포장면 위 한 칸) ──
columns:
  ".": []                                                    # 빈 칸 (패드 포장이 곧 바닥)
  # ── ★D2 ⑤ · REF-1 <b>3단 가시 기단</b> — 아래로 갈수록 넓다 ────────────────
  #      마당(0) → M 1켜 → N 2켜 → 몸체 3켜.  <b>한 칸씩 세 번 오른다</b>.
  #   ★★사용자 지시: 「가능하면 본체 Y를 올리지 말고 <b>하단을 바깥/아래로 확장</b>」.
  #     그래서 3단을 만들려고 몸체를 두 칸 올리지 않았다 — 바깥으로 두 겹(M·N)을 둘러
  #     <b>몸체는 한 칸만</b> 올라간다. 대문 문지방까지 계단 없이 걸어 오를 수 있다
  #     (한 칸 단 셋 — 두 칸이면 못 넘는다).
  #   ★앞쪽 월대는 여전히 5칸 나간다: N 2줄(20~21) + M 3줄(22~24).
  # ★REF-2.5 S5 — 기단이 <b>full block 케이크 3단</b>으로 보이지 않게 맨 밖에
  #   <b>반블록 몰딩</b> 한 바퀴를 두른다. 단 높이·문지방은 건드리지 않는다.
  "s": ["stone_brick_slab"]                                  # 기단 몰딩 (맨 바깥 치마)
  "M": ["smooth_stone"]                                      # 기단 1단 (맨 아래·가장 넓다)
  "N": ["smooth_stone*2"]                                    # 기단 2단 (가운데)
  "F": ["smooth_stone*3"]                                    # 몸체 안 바닥 = 기단 3단 (맨 위)
  # ★D2 ② 기둥은 막대기가 아니라 구조체다 — 기단·주초 / 적주 / <b>창방</b> / 도리 / 단청
  #   창방(昌枋)은 강당에도 들어간 켜다. 본전은 그 위에 <b>단청 띠</b>가 한 켜 더 얹힌다.
  # ★★★REF-1c-A (사용자 확정 2026-08-09) — <b>밝은 가로띠를 폐기한다.</b>
  #   정면 사진에서 시선을 제일 먼저 잡는 것이 건물 구조가 아니라 <b>밝은 갈색 3단 띠</b>였다.
  #   레퍼런스의 그 자리는 밝은 판 하나가 아니라 <b>어두운 처마 밑에서 붉은 목구조와 공포가
  #   되풀이되는 영역</b>이다. 그래서 재료를 위계로 다시 갈랐다:
  #       상단 긴 보 = dark_oak 계열   (전 폭을 지나가도 어두워서 안 튄다)
  #       아래 가로보 = mangrove 계열  (붉은 창방·도리)
  #       밝은 사암   = <b>적주 머리에만</b> — 띠가 아니라 <b>점</b>이다 (10 자리)
  # ★★★REF-2B 목구조 재료 (사용자 확정 2026-08-10) — <b>더 붉게가 아니라 역할을 가른다.</b>
  #   REF-2A 로 지붕이 기와가 된 뒤에도 목재가 한 갈색 덩어리로 뭉쳤다. 세 역할을 색으로 뗀다:
  #       주요 적주·프레임   → <b>붉은색</b>            stripped_mangrove_log
  #       창방·보조 보·인방  → <b>어두운 적갈색</b>     mangrove_planks
  #       도리·서까래·창호   → <b>매우 어두운 갈색</b>  dark_oak 계열
  #   ★밝은 사암은 여전히 <b>적주 머리 한 점</b>뿐이다 (띠가 아니라 점 — REF-1c-A).
  #   ★지붕(B판)은 완전히 동결한 채 목재만 간다 — 무엇이 색 때문인지 갈리게 (사용자).
  # ★★★REF-2.5 S1 — 기둥은 <b>한 줄의 통나무가 아니라 작은 모델</b>이다 (사용자 2026-08-10).
  #   주초(가는 담장 블록) → 몸통(통나무) → 주두(밝은 점). 담장은 통나무보다 <b>가늘어서</b>
  #   기둥 발치가 잘록해진다 — <b>흑백으로 봐도</b> 기둥에 단이 생긴다.
  "P": ["smooth_stone*2", "stone_brick_wall",
        "stripped_mangrove_log*5",
        "cut_sandstone",
        "dark_oak_planks", "dark_oak_log"]                   # 주초 + 적주 + 주두 + 도리 + 긴 보
  # ★★인방(引枋) — 칸의 위·아래를 붉은 켜로 끊는다 (2026-08-05 · B-196 셋째 교정).
  #   까닭은 아래 【실측 비율】 절. 회벽·격자 둘 다 5켜 통짜였고, 그래서 한 주기(3칸)의
  #   재료가 붉은 5 : 회벽 5 : 나무 5 로 **똑같이 셋**이었다. 목표는 붉은색이 3분의 2다.
  # ★★REF-1b — <b>단청 띠를 끊는다</b> (사용자 2026-08-09). 전에는 W·D·P 가 모두 맨 위에
  #   cut_sandstone 을 얹어, 정면 전체를 <b>밝은 갈색 판 한 줄</b>이 가로질렀다. 레퍼런스의
  #   그 자리는 한 덩어리가 아니라 <b>어두운 가로보 + 적주 머리마다 되풀이되는 장식</b>이다.
  #   → 밝은 사암은 <b>적주(P) 머리에만</b> 남기고, 회벽·격자 위는 어두운 도리로 잇는다.
  #     그러면 위쪽에도 기둥의 세로 리듬이 이어진다 (공포가 그 위에 또 한 벌 얹힌다).
  # ★REF-2.5 S3 — 도리를 <b>반블록</b>으로. 통짜 판 세 켜는 흑백에서 그냥 띠다.
  #   반블록이면 그 아래 반 칸이 비어 <b>기하가 만든 그림자 골</b>이 정면을 가로지른다.
  "W": ["smooth_stone*3", "mangrove_planks", "plaster*3", "mangrove_planks",
        "mangrove_planks",
        "dark_oak_slab", "dark_oak_log"]                     # 회벽 — 인방 사이 3켜만
  # ★D2 ④ — 「lattice」는 <b>재료가 아니라 처방</b>이다. 모양은 meta.window.family 가 정한다.
  #   전에는 dark_oak_trapdoor 를 도면이 직접 박았다 → 그러면 family 를 바꿔도 안 바뀐다.
  # ★REF-2.5 S2 — 창은 <b>네모 구멍</b>이 아니다: 창턱(반블록) → 살창 → 상인방.
  #   창턱이 반블록이라 창 아래에 <b>턱과 그늘</b>이 생긴다.
  "D": ["smooth_stone*3", "mangrove_slab", "lattice*3",
        "mangrove_planks",
        "mangrove_planks",
        "dark_oak_slab", "dark_oak_log"]                     # 격자창 — 창턱·인방이 문틀을 이룬다
  # ★★REF-1c-A 문설주 — 중앙 5칸을 <b>개구 3 + 좌우 문틀 1+1</b> 로 가른다.
  #   ★<b>적주(P)를 쓰지 않는다.</b> 처음엔 P 로 세웠더니 col16·17 과 21·22 가 붙어
  #     <b>7호 실측의 3칸 주기가 깨졌고</b> (기둥 12개 · 어긋난 틈 3) 눈이 잡았다.
  #     문틀은 <b>어두운 목재</b>다 — 앞으로 한 칸 나가므로 문이 그만큼 뒤에 앉아
  #     관통 터널이 아니라 <b>들어간 입구</b>가 된다.
  "J": ["smooth_stone*3", "dark_oak_log*5",
        "mangrove_planks",
        "dark_oak_slab", "dark_oak_log"]                     # 문설주 (어두운 문틀)
  "O": ["smooth_stone*3", "air*5",
        "mangrove_planks",
        "dark_oak_slab", "dark_oak_log"]                     # ★중앙 대문 (걸어 지난다)

# ── ★D2 ① 입면 깊이 (profile full · 바깥이 +) ───────────────────────────
#   적주가 나오고 격자창이 들어간다. 방향은 도면이 안 적는다 — <b>자리가 정한다</b>.
#   ★본전에서는 +1 이 <b>월대 위로</b> 나간다 (앞) / 두름 월대 위로 (옆·뒤).
#     그래서 적주가 월대를 밟고 서고, 그 뒤로 회벽이 물러난다 — 툇간처럼 읽힌다.
