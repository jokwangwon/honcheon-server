# ★★★ 화산파 05·08 제자 생활관 — 거처 유형(居處) 설계도 (2026-08-08)
#   계약: docs/design/hwasan/contract.md — 「새 구역을 세울 때의 순서」를 따랐다.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# ── 강당의 축소판이 아니다 (사용자 확정 2026-08-08) ─────────────────────
#   두 집은 <b>동선이 다르다</b>:
#       강당   : 밖 → 중앙 문 → 큰 내부 공간
#       생활관 : 밖 → 여러 작은 출입구 → 반복되는 생활 단위
#   그래서 「축선 통행 개구」(모임·정문급의 계약)를 <b>안 잰다</b>. 대신 재는 것은
#   출입구가 여럿인가 · 큰 문이 아닌가 · 긴 정면에 리듬이 있는가다.
#
#   ★지붕도 갈린다: 생활관까지 sweep 를 쓰면 <b>대부분이 핵심 전각처럼 보여 위계가 죽는다</b>.
#       sweep       산문 · 본전 · 강당
#       low_gable   행각 · <b>생활관</b> · 창고 후보
#       hip_pyramid 정자 · 망루
#
#   ★창고와 지붕·재료는 공유해도 <b>usage 계약은 공유하지 않는다</b> —
#     그러지 않으면 하나가 다시 여러 쓰임을 먹는다 (plasterHall 이 그랬다).
#
# ── 자리 (패드 실측) ────────────────────────────────────────────────────
#   생활 하(5) 36×32 · 생활 중(8) 32×28 — 둘 다 거의 비었고 <b>서쪽 어귀만</b> 막혔다
#   (5: x0~2 z14~18 · 8: x0~2 z12~16).
#   → 13×7 몸체 + 처마 1 = 발자국 15×9 가 <b>세 자리에 다 든다</b>:
#       생활 하 [4,16] · [20,16]  (축선 x18 기준 ±8 대칭)
#       생활 중 [10,14]           (축선 x16 가운데)
#   ★크기는 <b>쓰임</b>이 정했다 — 여백이 남는다고 키우지 않았고, 줄이지도 않았다.

design_intent:
  role: "제자들이 머무는 집 — 작은 문 여럿으로 드나들고 생활 단위가 반복된다"
  rank: auxiliary
  usage: residence
  style_module: hwasan_common
  roof_type: low_gable
  decisions:
    - "중앙 대문을 두지 않는다 — 그것은 모임 유형(강당)의 것이다."
    - "정면에 작은 문 셋을 고르게 둔다 (생활 단위의 반복)."
    - "벽 높이를 4 로 낮춘다 — 강당(5)보다 낮게, 위계가 실루엣에서 갈리게."
  non_goals:
    - "강당의 축소판을 만들지 않는다 (동선이 다르다)."
    - "창고와 평면 계약을 공유하지 않는다 (지붕·재료만 공유한다)."

meta:
  name: 화산파 제자 생활관
  origin_pad: 5
  size: [13, 7]
  axis_col: 6
  rank: auxiliary
  usage: residence
  south_row: 6

instances:
  # ── 05 생활 하 (36×32) — 두 채 · 축선 x18 기준 ±8 대칭 ──
  - id: lower_west
    at: [4, 16]
    rotate: 0
  - id: lower_east
    at: [20, 16]
    rotate: 0
  # ── 08 생활 중 (32×28) — 한 채 · 축선 x16 가운데 ──
  - id: middle
    pad: 8
    at: [10, 14]
    rotate: 0

# ── 기둥 처방 (아래→위) — 벽 4 + 도리 1 ─────────────────────────────────
columns:
  ".": []                                                    # 내부 — 비운다
  "P": ["stripped_mangrove_log*4", "dark_oak_planks"]        # 붉은 적주 + 도리
  "W": ["plaster*4", "dark_oak_planks"]                      # 회벽
  "L": ["dark_oak_planks", "dark_oak_trapdoor*2",
        "dark_oak_planks", "dark_oak_planks"]                # 격자창
  "O": ["air*4", "dark_oak_planks"]                          # 작은 출입구 (한 칸)

# ── 평면 (13×7 · row 6 = 남 정면) ───────────────────────────────────────
#   정면 : 적주 넷 사이에 <b>작은 문 셋</b> (col 2·6·10) — 생활 단위의 반복
#   뒷면 : 적주 + 회벽 + 격자창의 리듬 (같은 칸 3연속 금지)
plan: |
    PWLWPWLWPWLWP
    L...........L
    W...........W
    L...........L
    W...........W
    L...........L
    PWOWPWOWPWOWP

# ── 지붕 — 낮은 맞배 (부속급) ───────────────────────────────────────────
roof:
  낮은맞배:
    type: low_gable
    box: [0, 0, 12, 6]
    base_y: 5
    eave: 1
