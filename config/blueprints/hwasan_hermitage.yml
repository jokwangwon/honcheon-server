# ★★★ 화산파 13·20 암자 — 은거 유형(庵子) 설계도 (2026-08-08)
#   계약: docs/design/hwasan/contract.md — 분류표에서 마지막까지 「미정」이던 유형이다.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# ── 암자는 무엇으로 갈리는가 ────────────────────────────────────────────
#   같은 `low_gable` 지붕과 재료(적주·회벽·격자·조약 심층암)를 쓰는 집이 셋이다.
#   갈리는 것은 <b>문의 수와 폭</b>, 그리고 <b>크기</b>다:
#
#       생활관 : 작은 문 <b>여럿</b>  — 생활 단위가 반복된다 (여러 사람)
#       암자   : 문 <b>하나</b>       — 한 사람이 든다 · 작다 (≤ 9×7)
#       창고   : <b>큰 문</b> 하나    — 물자가 든다 (연속 ≥3)
#
#   ★그래서 <b>서로의 자로 재면 셋 다 떨어진다</b> — 눈이 그것을 되묻는다.
#     통과해 버리면 계약이 아니라 같은 말을 세 번 적은 것이다.
#
# ── 자리 (패드 실측) ────────────────────────────────────────────────────
#   정상 암자(13) 26×18 — 남쪽 계단 봉투 z17(x9~17)만 막혔다. 암자는 서편에, 정자는 동편에.
#   부속 암자(20) 18×14 — 비었다 (다리로 건너온다 — 어귀는 검수가 잰다).
#   몸체 9×7 + 처마 1 = 발자국 11×9. <b>옛 값 그대로</b> — 키우지도 줄이지도 않았다.

design_intent:
  role: "산정에 홀로 선 작은 집 — 문 하나로 들고 난다"
  rank: auxiliary
  usage: hermitage
  style_module: hwasan_common
  roof_type: low_gable
  decisions:
    - "문을 하나만 둔다 — 여럿은 생활관, 큰 문은 창고의 것이다."
    - "작게 둔다 (≤ 9×7) — 산정의 집은 크지 않다."
  non_goals:
    - "생활관·창고와 평면 계약을 공유하지 않는다 (지붕과 재료만 공유한다)."

meta:
  name: 화산파 암자
  origin_pad: 13
  size: [9, 7]
  axis_col: 4
  rank: auxiliary
  usage: hermitage
  south_row: 6

instances:
  - id: summit
    at: [3, 7]
    rotate: 0
  - id: annex
    pad: 20
    at: [5, 4]
    rotate: 0

columns:
  ".": []
  "P": ["stripped_mangrove_log*4", "dark_oak_planks"]
  "W": ["plaster*4", "dark_oak_planks"]
  "L": ["dark_oak_planks", "dark_oak_trapdoor*2",
        "dark_oak_planks", "dark_oak_planks"]
  "O": ["air*4", "dark_oak_planks"]

# ── 평면 (9×7 · row 6 = 남 정면 · 문 하나) ──────────────────────────────
plan: |
    PWLWPWLWP
    L.......L
    W.......W
    L.......L
    W.......W
    L.......L
    PWLWOWLWP

roof:
  낮은맞배:
    type: low_gable
    box: [0, 0, 8, 6]
    base_y: 5
    eave: 1
