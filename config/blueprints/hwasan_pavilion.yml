# ★★★ 화산파 02 외원 — 정자(亭子) 설계도 (2026-08-07 · E-07)
#   선례: hwasan_outer_corridor.yml (행각 · 같은 부속급) — instances·rank 문법을 그대로 쓴다.
#
# ★★이 도면이 좌표의 정본이다. 코드의 수치가 도면과 다르면 **도면이 이긴다.**
#
# ── 왜 사모지붕인가 (사용자 확정 2026-08-07) ────────────────────────────
#   「정자를 low_gable 에 억지로 맞추는 것보다 지금이 지붕 문법을 하나 늘릴 적절한 시점이다.」
#   맞배는 두 방향의 처마가 강하고 두 면에 **박공**이 생겨 <b>방향성</b>이 붙는다.
#   정자는 사방이 열린 독립 건물이고, 외원 남서·남동 모서리에서 마당과 산세를 여러 방향으로
#   바라보는 **체류 공간**이다. 그래서 사모가 자연스럽다.
#
#   ★외원의 역할이 이미 갈려 있다:  중앙 = 이동 · 행각 = 측면 이동 · 정자 = 머무름
#     정자까지 맞배로 만들면 행각과 실루엣이 가까워져 그 차이가 약해진다.
#
# ── 지붕 문법 셋 (이 회차로 완성) ───────────────────────────────────────
#   low_gable    → 행각 · 생활 부속건물
#   hip_pyramid  → 정자 · 망루            ← 이번에 신설
#   sweep        → 산문 · 본전 등 핵심 전각
#
# ── 같은 타입, 다른 비례 (사용자 확정) ──────────────────────────────────
#   「정자와 망루가 같은 hip_pyramid 를 쓰되, 같은 지붕을 복사해서 쓰지는 않는다.」
#     정자 : profile pavilion · rise 3 · eave 2   (낮고 넓다)
#     망루 : profile tower    · rise 5 · eave 1   (높고 급하다)
#   ★망루의 <b>실물 전환은 11 망루 회차</b>에 한다 — 문법만 이번에 공용으로 만든다.
#     한 커밋에서 정자와 망루를 동시에 바꾸면 회귀 범위가 넓어진다 (사용자).
#
# ── 사모 1호의 범위 ─────────────────────────────────────────────────────
#   정사각 평면 → 네 면이 중앙 상부로 수렴 → 처마 돌출 → 네 모서리 추녀 → 정상 캡.
#   ★자유형 다각형 지붕 엔진은 만들지 않는다. validate 가 정사각을 강제한다.
#
# ── 자리 (패드 로컬 · 외원 32×32) ───────────────────────────────────────
#   남서 [3,20] · 남동 [24,20] — 둘 다 의례축(11~21) 밖이고 행각과 2칸 이상 떨어진다.
#   ★★몸체가 5×5 인 것은 <b>실측이 정한 값</b>이다. 처음 9×9 로 그렸더니 처마(2)까지
#     13칸이 되어 <b>패드 밖으로 나갔고</b> (계율 #4 가 짖었다: 「건물 블록이 패드 밖」),
#     동쪽은 축(11~21)과 패드 끝(31) 사이가 10칸뿐이라 더 좁다.
#     몸체를 줄여 <b>넓은 처마를 지켰다</b> — 정자의 「낮고 넓은」은 처마가 만든다.
#     지붕 발자국은 5 + 2×2 = 9×9 로, 옛 코드 정자와 같다.

design_intent:
  role: "외원 남측 두 모서리에서 마당과 산세를 바라보며 머무는 자리"
  rank: auxiliary
  usage: pavilion
  style_module: hwasan_common
  roof_type: hip_pyramid
  decisions:
    - "사방을 연다 — 정자는 머무는 곳이지 방 안이 아니다."
    - "회벽 연속면·외곽 격자창 벽·긴 맞배는 쓰지 않는다 (그것은 행각의 것이다)."
  non_goals:
    - "행각의 실루엣에 가까워지지 않는다 — 역할이 갈렸으므로 형태도 갈린다."

meta:
  name: 화산파 외원 정자
  origin_pad: 2
  size: [5, 5]             # ★정사각 — 사모 1호의 계약 (지붕은 처마까지 9×9)
  axis_col: 2
  rank: auxiliary
  usage: pavilion
  south_row: 4

#   ★★E-07b (2026-08-07) — 중정(101)도 <b>같은 도면</b>을 쓴다. 복제본을 만들지 않는다.
#     사용자 원칙: 「<b>도면은 재사용하지만 배치는 공간이 결정한다</b>」 —
#     「외원에 둘이니 중정도 둘」이라는 역방향 설계를 하지 않는다.
#   ★중정 패드(30×28)를 통째로 훑어 자유 영역을 냈다 (계단 봉투는 검수와 같은 자로):
#       중앙 계단 봉투 x14~22 (z0~16) · 남측 계단 봉투 x11~19 (z27)
#       서측 계단 봉투 x0~2 (z12~16) · 북측 행각 x2~7 · x24~29 (z0~6)
#     → 남는 곳은 <b>남쪽 띠 z17~26</b> 뿐이고, 거기서 9×9(몸체 5 + 처마 2) 둘이
#       중앙 통로(x9~20)를 열어 둔 채 들어간다. <b>수가 아니라 자리가 정했다.</b>
instances:
  # ── 02 외원 (32×32) ──
  - id: southwest
    at: [3, 20]
    rotate: 0
  - id: southeast
    at: [24, 20]
    rotate: 0
  # ── 101 중정 (30×28) — 남쪽 띠. 중앙 통로와 계단 봉투를 비운다 ──
  - id: madang_southwest
    pad: 101
    at: [2, 19]
    rotate: 0
  - id: madang_southeast
    pad: 101
    at: [23, 19]
    rotate: 0
  # ── 13 정상 암자 (26×18) · 19 절벽 전망대 (14×12) — 옛 pavilion() 을 걷어낸다 ──
  #   ★같은 도면이 이제 <b>네 구역</b>에 앉는다. 전망대는 계약대로 <b>인스턴스 하나</b>로 끝났다.
  - id: summit_pavilion
    pad: 13
    at: [16, 7]
    rotate: 0
  - id: cliff_belvedere
    pad: 19
    at: [5, 4]
    rotate: 0
  # ── 10 장문인 정원 — <b>정자만</b> 도면으로. 연못·매화는 그대로 둔다 ──
  #   ★정원은 건물 유형이 아니라 <b>장면</b>이다 (사용자 2026-08-09). 조경 문법은 별도(S-01).
  - id: garden_pavilion
    pad: 10
    at: [20, 20]
    rotate: 0

# ── 기둥 처방 ───────────────────────────────────────────────────────────
#   산문과 공유: 붉은 적주 · 어두운 지붕 · 석재 기단 · 등롱 · 목재 팔레트
#   행각과 공유하지 않음: 회벽 연속면 · 외곽 격자창 벽
columns:
  ".": []                                                    # 사방 개방 — 비운다
  "P": ["stripped_mangrove_log*4", "dark_oak_planks"]        # 붉은 적주 + 도리
  "c": ["air*4", "dark_oak_planks"]                          # 기둥 사이 — 도리만 잇는다

# ── 평면 (5×5) ─────────────────────────────────────────────────────────
#   ★<b>모서리 적주 넷만</b> — 변 가운데에도 기둥을 두면 한 면의 열린 칸이 2/5 로 떨어져
#     「사방 개방」 계약(면의 절반 넘게)이 깨진다. 눈이 그것을 잡았다 (열린 면 0 < 3).
#     정자는 머무는 곳이지 방 안이 아니다 — 기둥은 최소로 둔다.
plan: |
    PcccP
    c...c
    c...c
    c...c
    PcccP

# ── 지붕 — 사모 (낮고 넓다) ─────────────────────────────────────────────
roof:
  사모:
    type: hip_pyramid
    profile: pavilion
    box: [0, 0, 4, 4]
    base_y: 5
    eave: 2                # ★넓은 처마 — 망루(1)보다 깊다
    rise: 3                # ★낮은 오름 — 망루(5)보다 완만하다
    ridge_cap: 1
