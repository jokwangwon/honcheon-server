# 성향 테스트 — 생성 절차 1단계의 실체 (기획서 5장, PT 인터랙티브 F13 해결)
# 문항은 '유년의 기억'이다 — 테스트 답이 곧 캐릭터의 어린 시절이 된다.
# 원칙: 추천이지 강제가 아니다. 결과는 추천 성향 + 어울리는 집안/루트 제시, 최종 선택은 플레이어.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ★★ 문항 5 → 9 (2026-07-13) — **다섯 번 물어 일곱을 가를 수는 없다**
#
# 【실측 (전수 1,024가지 — tools 로 돌렸다)】 옛 5문항의 병:
#     · **5방 동점이 6.54%** (열다섯 명 중 하나) · 3방 0.20% — 분포가 기묘했다
#     · 그 동점의 최고점은 **2점** — 즉 **어떤 성향도 두 번 안 골랐다.**
#       이것은 "다면적인 아이"가 아니라 **신호 없음**이다 (다섯 번 골랐는데 다섯이 다 달랐다)
#     · **기회가 불공평했다**: 야망형은 고를 수 있는 자리가 **2군데**뿐인데 탐구형은 4군데.
#       그래서 단독 1위 비율이 탐구형 20.70% : **야망형 3.12%** — 6.6배다.
#       야망형은 최대 4점밖에 못 받는데 탐구형은 8점까지 받는다. **구조가 성향을 정하고 있었다.**
#
# 【고침】 문항을 **9개**로 늘리고, **기회를 고르게** 폈다 (아래 opportunity 표).
#   ★ 성향이 일곱이면 **적어도 일곱 번은 물어야** 성향이 갈린다. 그것이 이 수의 근거다.
#
# 【★ 실측 결과 (9문항 · 전수 262,144가지) — tools/disposition_audit.py 가 잰 값이다】
#
#                          옛 5문항          새 9문항
#     5방 동점 ........... 6.54%     →     0.08%    ★ 사실상 사라졌다
#     3방 이상 동점 ...... 6.84%     →     8.25%    ← ★ **늘었다.** 아래를 읽어라
#     단독 1위 편차 ...... 6.6배     →     1.7배    ★ 구조의 편향이 걷혔다
#                          (탐구 20.70% : 야망 3.12%)   (협의 14.54% : 야망 8.60%)
#
# 【★★ 3방 동점이 늘어난 것은 **고쳐야 할 병이 아니다** — 성질이 바뀌었다】
#   **정직하게 적는다: 이 수는 줄지 않았다. 그러나 같은 수가 아니다.**
#     · 옛 동점의 최고점은 **2점**이었다 — 다섯 번 골랐는데 **다섯이 다 달랐다.**
#       어떤 성향도 두 번 안 골랐다는 뜻이다. 그것은 다면성이 아니라 **신호 없음**이었다.
#     · 새 동점의 최고점은 **4~7점**이다 (분포: 4점 18,383 · 5점 2,859 · 6점 371 · 7점 7).
#       즉 **정말로 세 성향을 거듭 골랐다** — 이것이 등록부가 말한 그 아이다:
#       *"3개 이상 동점(다면적 답변)이면 성향을 억지로 좁히지 않는다 — **아직 정해지지 않은 아이**"*
#   → **신호 없음(6.54%)은 죽었고, 진짜 다면성(8.25%)이 그 자리에 섰다.** 이것이 세분화다.
#
# ★ 눈: tools/disposition_audit.py — **문항을 고치면 반드시 다시 돌려라.**
# ═══════════════════════════════════════════════════════════════════════════════

scoring:
  rule: "선택지마다 주 성향 +2, 부 성향 +1. 최고점 성향을 추천 (동점 시 복수 제시)"
  note: "결과와 다른 성향을 골라도 됨 — 그 어긋남 자체가 캐릭터다"
  wide_tie: "3개 이상 동점(다면적 답변)이면 성향을 억지로 좁히지 않는다 —
    GM이 답변 패턴의 서사적 해석('아직 정해지지 않은 아이')을 제시하고
    동점 성향들을 나란히 추천한다. 다면성은 오류가 아니라 결과다 (F14)"

  # ★ 기회의 균형 — **이 표가 무너지면 구조가 성향을 정한다** (위 실측이 그 증거다)
  #   눈(tools/disposition_audit.py)이 이것을 센다. 문항을 더할 때 반드시 다시 재라.
  opportunity:
    principle: "성향마다 **주(primary)로 고를 수 있는 자리가 고르게** 있어야 한다 (5~6군데)"
    balanced_at: "9문항 — 협의5 생존5 야망5 자유5 탐구5 은밀6 이익5"

  # ★ '아직 정해지지 않은 아이' — 동점은 **오류가 아니라 이야기다** (wide_tie)
  #   그러나 지금까지 봇은 그 서사를 **보여 주지 않고 성향 이름 다섯 개를 나열만 했다.**
  #   이제 제대로 말해 준다 (GameListener.birthEmbed).
  undecided:
    title: "아직 정해지지 않은 아이"
    body: "너의 유년은 한 가지 색이 아니었다. 어떤 날은 나섰고, 어떤 날은 숨었고,
      어떤 날은 셈을 했다. 강호는 이런 아이를 **아직 읽지 못한다** —
      네가 무엇이 될지는 **네 손이 정할 것이다.**"
    resolve: "행동으로 굳는다 — 강호에서 무엇을 반복하는가가 곧 성향이 된다 (★ 미배선. 다음 바퀴 청구서)"

questions:
  - id: Q1
    scene: "장터에서 어른들이 한 아이를 붙들고 훔친 만두값을 물어내라며 윽박지른다. 너는—"
    choices:
      A: { text: "뛰어들어 막아선다", primary: 협의형 }
      B: { text: "어른들 틈을 살피다, 아이가 도망칠 틈을 만들어준다", primary: 은밀형 }
      C: { text: "'제가 심부름으로 갚을게요' — 만두 주인과 흥정한다", primary: 이익형, secondary: 협의형 }
      D: { text: "괜한 일에 엮이지 않게 조용히 자리를 뜬다", primary: 생존형 }

  - id: Q2
    scene: "밤, 아버지가 낯선 손님과 낮은 목소리로 다투는 소리가 문틈으로 샌다. 너는—"
    choices:
      A: { text: "문틈에 귀를 바짝 댄다", primary: 은밀형, secondary: 탐구형 }
      B: { text: "못 들은 척 이불을 뒤집어쓴다", primary: 생존형 }
      C: { text: "문을 열고 들어가 무슨 일이냐고 묻는다", primary: 협의형 }
      D: { text: "다음 날, 손님이 떠난 길을 따라가 본다", primary: 탐구형, secondary: 자유형 }

  - id: Q3
    scene: "서당 훈장이 묻는다. '커서 무엇이 되고 싶으냐.' 너는—"
    choices:
      A: { text: "천하제일이요", primary: 야망형 }
      B: { text: "돈 많이 버는 상인이요", primary: 이익형 }
      C: { text: "세상 구경 다 하는 사람이요", primary: 자유형 }
      D: { text: "모르는 게 없는 사람이요", primary: 탐구형 }

  - id: Q4
    scene: "냇가에서 반짝이는 것을 주웠다 — 누군가 떨어뜨린 은반지다. 너는—"
    choices:
      A: { text: "주인을 찾아 나선다", primary: 협의형 }
      B: { text: "조용히 챙긴다 — 언젠가 쓸모가 있겠지", primary: 이익형, secondary: 생존형 }
      C: { text: "무슨 물건인지 요모조모 뜯어본다 — 안쪽에 새겨진 글자는 뭘까", primary: 탐구형 }
      D: { text: "숨겨두고, 누가 찾으러 오는지 지켜본다", primary: 은밀형 }

  - id: Q5
    scene: "마을에 낯선 무인이 나타나 검무를 보였다. 구경이 끝나고 가장 마음에 남은 것은—"
    choices:
      A: { text: "저 강함이면 아무도 나를 함부로 못 하겠지", primary: 야망형 }
      B: { text: "저 사람은 어디서 와서, 내일은 어디로 갈까", primary: 자유형 }
      C: { text: "저 검이 그리는 궤적의 이치가 궁금하다", primary: 탐구형 }
      D: { text: "환호하는 사람들 틈에서, 소매치기의 손이 움직이는 게 보였다", primary: 은밀형, secondary: 생존형 }

  # ═══ ★ Q6~Q9 (2026-07-13 신설) — **굶주린 성향에 자리를 준다** ═══
  #   야망(주 2)·자유(주 2)·생존(주 2)이 굶고 있었고, 탐구·은밀(주 4)이 배불렀다.
  #   아래 넷은 그 불균형을 메우려고 지었다 (기회: 야망+3 자유+3 생존+3 협의+2 은밀+2 이익+2 탐구+1).

  - id: Q6
    scene: "겨울, 곳간이 비었다. 어머니가 마지막 곡식을 세는 것을 너는 문 뒤에서 보았다. 너는—"
    choices:
      A: { text: "아우의 몫부터 덜어 놓는다", primary: 협의형 }
      B: { text: "제 몫을 남몰래 따로 숨겨 둔다", primary: 생존형, secondary: 은밀형 }
      C: { text: "옆집 곳간의 자물쇠가 헐거운 것을 눈여겨본다", primary: 은밀형 }
      D: { text: "장터에 나가 품을 팔 자리부터 찾는다", primary: 이익형, secondary: 야망형 }

  - id: Q7
    scene: "골목의 아이들이 두 편으로 갈렸다. 어느 쪽도 너를 부르지 않았다. 너는—"
    choices:
      A: { text: "내가 대장을 하겠다고 나선다", primary: 야망형 }
      B: { text: "어느 편도 들지 않고 혼자 논다", primary: 자유형 }
      C: { text: "수가 적은 쪽에 붙는다", primary: 협의형 }
      D: { text: "두 편을 오가며 소식을 나른다", primary: 이익형, secondary: 은밀형 }

  - id: Q8
    scene: "상단의 수레가 마을을 지나간다. 너는 마을 밖으로 나가 본 적이 없다. 너는—"
    choices:
      A: { text: "수레를 따라 마을 어귀 너머까지 걸어 나간다", primary: 자유형 }
      B: { text: "언젠가 저 수레들의 주인이 되겠다고 생각한다", primary: 야망형, secondary: 이익형 }
      C: { text: "수레에 실린 것이 무엇이고 어디서 왔는지 묻는다", primary: 탐구형 }
      D: { text: "돌아올 길부터 눈에 익혀 둔다", primary: 생존형 }

  - id: Q9
    scene: "하지 않은 일로 매를 맞게 생겼다. 진짜 한 아이는 네 옆에서 고개를 숙이고 있다. 너는—"
    choices:
      A: { text: "매를 맞아 두고, 그 빚을 기억해 둔다", primary: 야망형, secondary: 이익형 }
      B: { text: "얼른 잘못했다 하고 매를 면한다", primary: 생존형 }
      C: { text: "그 길로 집을 나와 며칠 돌아오지 않는다", primary: 자유형 }
      D: { text: "누구였는지 알아내 어른들 앞에 세운다", primary: 협의형, secondary: 탐구형 }

output:
  recommend: "최고점 성향 + player_creation.yml disposition_presets의 어울리는 집안·루트"
  narrative_bonus: "선택한 답들은 캐릭터의 '유년의 기억'으로 기록된다 — GM은 훗날 서사에서 회수할 수 있다
    (예: Q4에서 반지를 챙겼다면, 그 반지가 언젠가 이야기가 된다)"
