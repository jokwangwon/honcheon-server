# 지역 상태 변화량 규칙 (기계 판독용)
# 기준 문서: docs/design/world_reaction_system.md 5장
# 설계 검토 공백 G3 해결
#
# 치안/경제/민심은 0~100, 기준값 50. 사건 결과가 아래 표만큼 즉시 반영된다.
# '지역 누적 시간'의 실체가 이 표다 — 여러 플레이어의 사건 결과가 같은 수치에 쌓인다.

scale: { min: 0, max: 100, baseline: 50 }

# 사건 결과별 변화량
event_deltas:
  # 상단 / 물류
  상단_습격_성공: { 치안: -5, 경제: -3, 민심: -2 }
  상단_습격_저지: { 치안: +3, 경제: +1, 민심: +2 }
  상단로_장기_불안정_주당: { 경제: -2 }

  # 폭력 / 치안
  길거리_살인_미해결: { 치안: -3, 민심: -3 }
  증거_있는_사파_처단: { 치안: +2, 민심: +1 }
  증거_없는_폭행: { 치안: -2, 민심: -1 }
  도적_두목_제거: { 치안: +5, 민심: +3 }
  # ★ 승계 — 산채가 새 두목을 내려보냈다. 치안이 **다시 내려간다.**
  #   근거(수치를 지어내지 않았다): 제거가 +5/+3 이다.
  #     · 승계를 **-5** 로 두면 순환 순증이 0 — **두목 사냥이 무의미해진다.**
  #     · **0** 으로 두면 순수 농장이다 (오르기만 한다).
  #     · **-3** 이면 순환당 순증 +2 인데, 그 30일간 회복이 -3 → **순증이 음수.**
  #   → 세계는 **포화되지 않고 맥박을 갖는다.** 당신이 한 일을 기억하되, 굳지는 않는다.
  도적_두목_승계: { 치안: -3, 민심: -1 }
  도적_부분_소탕: { 치안: +2 }
  관군_대규모_개입: { 치안: +3, 민심: -1 }    # 계엄 분위기

  # 정치 / 연합 전쟁 (faction_politics.yml — 명분·연합·관무불가침)
  연합_전쟁_지역_주당: { 치안: -5, 경제: -4, 민심: -3 }   # ★ recovery 정지 (아래 recovery.suspend_on)
  관의_계엄_장기_주당: { 민심: -2 }                        # 관군_대규모_개입이 길어지면 명분의 재료가 된다
  연합_해산_후: { 민심: -1 }                               # 이겼는데 아무것도 나아지지 않았다

  # 질병 / 민생
  열병_방치_주당: { 민심: -3, 경제: -2 }
  열병_완화: { 민심: +4, 경제: +1 }
  가짜_약_유통: { 민심: -2, 경제: -1 }
  가짜_약_적발: { 민심: +2 }
  의원_과로_이탈: { 민심: -4 }

  # ── 죽음과 법 (다리 world_bridge.yml 가 사건의 **이름**을 실어 온다) ──
  #
  # ★ 이 세 칸은 **승격된 값**이다 — 지어낸 수치가 아니다.
  #   전에는 world_bridge.yml 의 effects.<사건>.region 에 **인라인 숫자로** 적혀 있었고,
  #   그래서 지역 사건의 값이 두 군데 살았다 (그리고 도적 건에서 실제로 갈라져 있었다).
  #   이제 다리는 사실(사건의 이름)만 나르고, 값은 여기가 매긴다.
  #
  #   무명_사망 / 등록_npc_사망 은 **지금 코드가 둘을 구분하지 않아** 같은 값이다 (민심 -1).
  #   두 칸으로 나눠 둔 것은 **구분해야 할 때 여기서 나눌 수 있게** 하기 위해서다 —
  #   등록 NPC 의 죽음이 무명의 죽음과 같은 무게라는 것은 설계가 아니라 현재 상태다.
  무명_사망: { 민심: -1 }        # ← populace.yml death.region_delta (world_bridge npc_death.region 에서 승격)
  등록_npc_사망: { 민심: -1 }    # ← 같은 값. ★ 사인(노환·사고 포함)을 가리지 않는다 — 아래 주석을 보라
  자수: { 민심: 2 }              # ← npc_death.yml responses.자수.effect.민심 (world_bridge surrender.region 에서 승격)

  # ★ 사인(cause)을 가리지 않는다는 뜻: 노환_병사·사고로 죽어도 민심이 -1 내려간다.
  #   이것은 **승격 이전부터 그러했다** (봇이 npc_death 를 사인 구분 없이 처리해 왔다).
  #   고치려면 다리가 사인별로 다른 이름을 실어야 한다 — 그것은 값이 아니라 배선의 문제다.

# 자연 회복 — 사건이 없으면 기준값(50)을 향해 되돌아간다
recovery:
  every_days: 10
  toward: 50
  amount: 1
  suspend_on: [연합_전쟁_지역]   # 전쟁 중인 지역은 회복하지 않는다 (faction_politics 연합 전쟁 상태)

# 임계 효과 — 지역 상태가 플레이 규칙에 되먹임되는 지점
threshold_effects:
  치안_저하:
    when: "치안 < 30"
    effects:
      - "도적/절도 사건 자동 발생률 증가 (3일마다 발생 판정)"
      - "상단 통행 축소 → 경제 주당 -1 연쇄"
      - "야간 이동에 위험 조우 판정 추가"
  치안_과잉:
    when: "치안 > 70"
    effects:
      - "관군 순찰 증가 — 은밀 행동 환경 보정 -1"
      - "무기 휴대 검문 이벤트"
  경제_저하:
    when: "경제 < 30"
    effects:
      - "물가 상승, 의뢰 보수 하락"
      - "약재 부족 가속 (열병 사건 악화 트리거)"
  민심_저하:
    when: "민심 < 30"
    effects:
      - "소문 왜곡 가중: 모든 소문 정확도 추가 -20"
      - "민간 협조 판정 저항 +2"
      - "유언비어/희생양 찾기 사건 발생 가능"
