<div id="bg"></div><div id="scrim"></div><div id="drag"></div>
<div id="winbtns"><div class="wb" onclick="hc.minimize()">&#8212;</div><div class="wb x" onclick="hc.close()">&#10005;</div></div>
<div id="title"><h1>&#28224; &#22825;</h1><div class="sub">&#47924;&#54801; &#44277;&#50976;&#49464;&#44228;</div></div>
<div id="seal"></div>
<div id="panel">
  <div id="status">&#49884;&#51089;&#54616;&#47140;&#47732; &#12300;&#51077;&#47928;&#12301;&#51012; &#45580;&#47476;&#49464;&#50836;.</div>
  <div id="track"><div id="fill"></div></div>
  <div id="row">
    <div id="play" onclick="onPlay()">&#51077; &#47928;</div>
    <div id="pct"></div>
    <div id="folder" onclick="hc.openFolder()">설치 폴더 열기</div>
  </div>
</div>
<script>
let state='idle';
const $=(id)=>document.getElementById(id);
hc.onProgress((d)=>{
  $('status').textContent=d.text;
  const pct=Math.round((d.pct||0)*100);
  $('fill').style.width=pct+'%';
  $('pct').textContent=(d.phase==='done'||d.phase==='error')?'':pct+'%';
  if(d.phase==='done') becomeReady();
  if(d.phase==='error'){ $('play').textContent='다시 시도'; $('play').classList.remove('busy'); state='idle'; }
});
function becomeReady(){
  state='ready'; $('seal').classList.add('show');
  $('play').textContent='시 작'; $('play').classList.remove('busy');
}
async function onPlay(){
  if(state==='installing'||state==='running') return;
  if(state==='idle'){
    state='installing'; $('play').classList.add('busy'); $('play').textContent='설치 중';
    $('seal').classList.remove('show'); await hc.install();
  } else if(state==='ready'){
    state='running'; $('status').textContent='공식 런처를 엽니다 — 「혼천」 설치를 골라 Play 하세요. (이미 열려 있었다면 완전히 껐다 다시 켜야 목록에 뜹니다)';
    const r=await hc.launch();
    if(r&&r.ok){ setTimeout(()=>hc.close(),3500); }
    else { $('status').textContent='런처를 자동으로 못 열었습니다 — 마인크래프트 자바 런처를 직접 열어 「혼천」을 선택하세요.'; state='ready'; }
  }
}
</script></body></html>
