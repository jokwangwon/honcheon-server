plugins {
    id 'java'
}

group = 'com.honcheon'
version = '1.0.0'

// MVT(최소 검증판) — 관리자 1인 로컬 테스트 서버용 Paper 플러그인.
// 주의: 원격 개발 환경에서는 repo.papermc.io 가 프록시 정책상 403이라 빌드 불가 —
// 이 모듈은 로컬(사용자 PC)에서 scripts/run_mvt_server.sh 로 빌드·기동한다.
repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    implementation project(':core')          // 룰 엔진 — 단일 진실 원천 config/*.yml 을 읽는다
    implementation 'org.yaml:snakeyaml:2.2'
    // ★ EffectLib — **검증된 기하 원시형 49종** (Circle·Arc·Cone·Helix·…).
    //   왜 남의 것을 쓰나: 우리 연출 어휘에 **궤적 생성기가 0개**였다. 검기 하나를 위해
    //   부분 호를 손으로 짜려 했는데, 그건 이미 10년 굴러간 라이브러리의 49종 중 하나를
    //   다시 만드는 일이었다 (사용자 지적, 2026-07-20).
    //   ★ MagicSpells 를 통째로 들이지 **않는** 까닭: 그쪽은 우리 감사(motion_audit·lint_config)가
    //     못 읽는 자리에 스펠을 두어 「커버리지 100%」라고 거짓 보고하게 만든다. EffectLib 은
    //     리스너 없는 **렌더 라이브러리**라 그 문제가 없다 (MagicSpells 도 이걸 셰이딩해 쓴다).
    implementation 'com.elmakers.mine.bukkit:EffectLib:10.10'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21   // Paper 1.21.11 = Java 21 (마지막 Java 21 버전 — 26.x 부터 Java 25)
    targetCompatibility = JavaVersion.VERSION_21
}

// 셰이드 플러그인 없이 core+snakeyaml 을 플러그인 jar 에 포함 (MVT 규모에선 이걸로 충분)
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// ── 눈(selftest) 배선 — tools/*SelfTest.java 를 조성 코드와 같은 컴파일 단위로 돌린다.
//   ★없으면 눈이 손으로만 돌아가고, 손이 빠지면 눈이 조용히 안 돌게 된다.
tasks.register('eyeClasspath') {
    doLast {
        file("$buildDir/eye-cp.txt").text =
            ((sourceSets.main.runtimeClasspath.files + sourceSets.main.compileClasspath.files)
                .collect { it.absolutePath }).unique().join(':')
    }
}
